<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Игровые мобы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            touch-action: none;
        }
        body {
            overflow: hidden;
            background: #000;
            height: 100vh;
            position: relative;
            font-family: monospace;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        let currentMob = 0;
        const mobs = [
            { id: 1, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 2, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 3, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 4, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 5, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 6, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 7, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 8, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 9, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 10, health: 1, maxHealth: 1, scaleFactor: 2.0 }
        ];

        let damageEffects = [];
        let mobPosition = { x: 0, y: 0 };
        let mobScale = 1;
        let mobRotation = 0;
        let isMobAlive = true;
        let attackAnimation = 0;
        let deathAnimation = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            mobPosition.x = canvas.width / 2;
            mobPosition.y = canvas.height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        class DamageEffect {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.life = 1.0;
                this.size = type === 'hit' ? 20 : 50;
                this.particles = [];

                if(type === 'hit') {
                    for(let i = 0; i < 8; i++) {
                        this.particles.push({
                            x: 0,
                            y: 0,
                            vx: (Math.random() - 0.5) * 10,
                            vy: (Math.random() - 0.5) * 10 - 5,
                            life: 1.0
                        });
                    }
                } else {
                    for(let i = 0; i < 20; i++) {
                        this.particles.push({
                            x: 0,
                            y: 0,
                            vx: (Math.random() - 0.5) * 15,
                            vy: (Math.random() - 0.5) * 15 - 8,
                            life: 1.0,
                            color: `hsl(${Math.random() * 60}, 100%, 60%)`
                        });
                    }
                }
            }

            update() {
                this.life -= 0.03;
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.3;
                    p.life -= 0.02;
                });
                return this.life > 0;
            }

            draw() {
                if(this.type === 'hit') {
                    ctx.save();
                    ctx.translate(this.x, this.y);

                    ctx.fillStyle = `rgba(255, 50, 50, ${this.life * 0.7})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * this.life, 0, Math.PI * 2);
                    ctx.fill();

                    this.particles.forEach(p => {
                        if(p.life > 0) {
                            ctx.fillStyle = `rgba(255, 100, 100, ${p.life})`;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    });

                    ctx.restore();
                } else {
                    ctx.save();
                    ctx.translate(this.x, this.y);

                    ctx.fillStyle = `rgba(255, 200, 50, ${this.life * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * (1 - this.life), 0, Math.PI * 2);
                    ctx.fill();

                    this.particles.forEach(p => {
                        if(p.life > 0) {
                            ctx.fillStyle = p.color.replace(')', `, ${p.life})`).replace('hsl', 'hsla');
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, 4 * p.life, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    });

                    ctx.restore();
                }
            }
        }

        function drawMob1() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.0015) * 0.2 + 1;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 30) * 5;
                ctx.translate(shake, 0);
            }

            const intensity = Math.sin(time * 0.002) * 0.3 + 0.7;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 45);
            gradient.addColorStop(0, `rgba(0, 255, 200, ${intensity * 0.9})`);
            gradient.addColorStop(0.7, `rgba(0, 180, 150, ${intensity * 0.4})`);
            gradient.addColorStop(1, `rgba(0, 120, 100, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 45, 0, Math.PI * 2);
            ctx.fill();

            const rings = 3;
            for(let i = 0; i < rings; i++) {
                const ringRadius = 30 + i * 25;
                const ringPulse = Math.sin(time * 0.001 + i * 0.5) * 0.3 + 0.7;

                ctx.strokeStyle = `rgba(0, 230, 180, ${0.3 + ringPulse * 0.3})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, ringRadius, 0, Math.PI * 2);
                ctx.stroke();

                const dots = 8 + i * 4;
                for(let j = 0; j < dots; j++) {
                    const angle = (Math.PI * 2 / dots) * j + time * 0.0005 * (i + 1);
                    const dotX = Math.cos(angle) * ringRadius;
                    const dotY = Math.sin(angle) * ringRadius;
                    const dotSize = 3 + Math.sin(time * 0.01 + j) * 2;

                    ctx.fillStyle = `rgba(0, 255, 220, ${0.8 + Math.sin(time * 0.005 + j) * 0.2})`;
                    ctx.beginPath();
                    ctx.arc(dotX, dotY, dotSize, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            const tendrils = 5;
            for(let i = 0; i < tendrils; i++) {
                const baseAngle = (Math.PI * 2 / tendrils) * i;
                const wave = Math.sin(time * 0.001 + i) * 0.5;
                const tendrilLength = 70 + wave * 20;

                ctx.strokeStyle = `rgba(0, 220, 170, ${0.6 + wave * 0.3})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, 0);

                for(let j = 1; j <= 10; j++) {
                    const progress = j / 10;
                    const offset = Math.sin(progress * Math.PI * 2 + time * 0.002) * 15;
                    const pointAngle = baseAngle + offset * 0.05;
                    const pointRadius = progress * tendrilLength;

                    ctx.lineTo(
                        Math.cos(pointAngle) * pointRadius,
                        Math.sin(pointAngle) * pointRadius
                    );
                }
                ctx.stroke();
            }

            ctx.fillStyle = `rgba(255, 255, 255, ${intensity})`;
            ctx.shadowColor = 'rgba(0, 255, 200, 0.9)';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(0, 0, 12 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(0, 255, 200, ${attackAnimation})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 110 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob2() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const rotation = time * 0.0004;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 40) * 6;
                ctx.translate(shake, 0);
            }

            const glow = Math.sin(time * 0.0018) * 0.4 + 0.6;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 55);
            gradient.addColorStop(0, `rgba(255, 80, 0, ${glow * 0.9})`);
            gradient.addColorStop(0.6, `rgba(200, 40, 0, ${glow * 0.5})`);
            gradient.addColorStop(1, `rgba(150, 20, 0, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 55, 0, Math.PI * 2);
            ctx.fill();

            const layers = 4;
            for(let l = 0; l < layers; l++) {
                const layerRadius = 20 + l * 18;
                const layerSpeed = (l + 1) * 0.0003;
                const layerPoints = 6 + l * 2;

                for(let i = 0; i < layerPoints; i++) {
                    const angle = (Math.PI * 2 / layerPoints) * i + rotation * (l % 2 === 0 ? 1 : -1);
                    const pulse = Math.sin(time * 0.002 + l + i) * 0.5 + 0.5;
                    const x = Math.cos(angle) * layerRadius;
                    const y = Math.sin(angle) * layerRadius;

                    ctx.fillStyle = `rgba(255, ${100 + l * 40}, ${50 + l * 20}, ${0.7 + pulse * 0.3})`;
                    ctx.beginPath();
                    ctx.arc(x, y, 5 + pulse * 3, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = `rgba(255, 120, 60, ${0.4})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                }
            }

            const spikes = 8;
            for(let i = 0; i < spikes; i++) {
                const angle = (Math.PI * 2 / spikes) * i;
                const spikeLength = 80 + Math.sin(time * 0.001 + i * 2) * 20;

                ctx.strokeStyle = `rgba(255, 100, 50, ${0.8})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(angle) * spikeLength, Math.sin(angle) * spikeLength);
                ctx.stroke();

                ctx.fillStyle = `rgba(255, 150, 80, ${0.9})`;
                ctx.beginPath();
                ctx.arc(Math.cos(angle) * spikeLength, Math.sin(angle) * spikeLength, 8, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = `rgba(255, 255, 200, ${glow})`;
            ctx.shadowColor = 'rgba(255, 100, 0, 0.9)';
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.arc(0, 0, 16, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(255, 80, 0, ${attackAnimation})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, 130 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob3() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.0012) * 0.3 + 0.7;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 35) * 4;
                ctx.translate(0, shake);
            }

            const glow = Math.sin(time * 0.0022) * 0.3 + 0.7;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 48);
            gradient.addColorStop(0, `rgba(150, 0, 255, ${glow * 0.8})`);
            gradient.addColorStop(0.5, `rgba(120, 0, 200, ${glow * 0.4})`);
            gradient.addColorStop(1, `rgba(90, 0, 150, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 48, 0, Math.PI * 2);
            ctx.fill();

            const hexagons = 3;
            for(let h = 0; h < hexagons; h++) {
                const radius = 25 + h * 22;
                const rotation = time * 0.0002 * (h + 1);

                ctx.strokeStyle = `rgba(180, 80, 255, ${0.5 + Math.sin(time * 0.001 + h) * 0.3})`;
                ctx.lineWidth = 2;
                ctx.beginPath();

                for(let i = 0; i < 6; i++) {
                    const angle = (Math.PI / 3) * i + rotation;
                    const x = Math.cos(angle) * radius;
                    const y = Math.sin(angle) * radius;

                    if(i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.stroke();

                for(let i = 0; i < 6; i++) {
                    const angle = (Math.PI / 3) * i + rotation;
                    const x = Math.cos(angle) * radius;
                    const y = Math.sin(angle) * radius;

                    ctx.fillStyle = `rgba(200, 100, 255, ${0.8})`;
                    ctx.beginPath();
                    ctx.arc(x, y, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            const filaments = 7;
            for(let i = 0; i < filaments; i++) {
                const baseAngle = (Math.PI * 2 / filaments) * i;
                const filamentLength = 65 + Math.sin(time * 0.001 + i) * 15;

                ctx.strokeStyle = `rgba(170, 60, 220, ${0.6})`;
                ctx.lineWidth = 3;
                ctx.beginPath();

                for(let j = 0; j <= 8; j++) {
                    const progress = j / 8;
                    const wave = Math.sin(progress * Math.PI * 3 + time * 0.003) * 10;
                    const angle = baseAngle + wave * 0.05;
                    const length = progress * filamentLength;

                    const x = Math.cos(angle) * length;
                    const y = Math.sin(angle) * length;

                    if(j === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            ctx.fillStyle = `rgba(255, 220, 255, ${glow})`;
            ctx.shadowColor = 'rgba(180, 80, 255, 0.8)';
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.arc(0, 0, 14 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(150, 0, 255, ${attackAnimation})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 105 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob4() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const rotation = time * 0.0003;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 45) * 7;
                ctx.translate(shake, -shake * 0.3);
            }

            const glow = Math.sin(time * 0.0016) * 0.4 + 0.6;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 52);
            gradient.addColorStop(0, `rgba(0, 200, 255, ${glow * 0.9})`);
            gradient.addColorStop(0.7, `rgba(0, 150, 200, ${glow * 0.5})`);
            gradient.addColorStop(1, `rgba(0, 100, 150, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 52, 0, Math.PI * 2);
            ctx.fill();

            const orbits = 4;
            for(let o = 0; o < orbits; o++) {
                const orbitRadius = 15 + o * 20;
                const orbitSpeed = rotation * (o % 2 === 0 ? 0.8 : -0.6);
                const satellites = 4 + o * 2;

                for(let s = 0; s < satellites; s++) {
                    const angle = (Math.PI * 2 / satellites) * s + orbitSpeed;
                    const pulse = Math.sin(time * 0.002 + o + s) * 0.5 + 0.5;
                    const x = Math.cos(angle) * orbitRadius;
                    const y = Math.sin(angle) * orbitRadius;

                    ctx.fillStyle = `rgba(0, 220, 255, ${0.6 + pulse * 0.4})`;
                    ctx.beginPath();
                    ctx.arc(x, y, 3 + pulse * 4, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = `rgba(0, 180, 230, ${0.3})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(0, 0, orbitRadius, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            const beams = 5;
            for(let i = 0; i < beams; i++) {
                const beamAngle = (Math.PI * 2 / beams) * i + rotation * 0.5;
                const beamLength = 75 + Math.sin(time * 0.001 + i) * 25;

                ctx.strokeStyle = `rgba(0, 180, 220, ${0.7})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, 0);

                for(let j = 1; j <= 5; j++) {
                    const progress = j / 5;
                    const width = Math.sin(progress * Math.PI) * 10;
                    const offset = Math.cos(time * 0.005 + j) * width;
                    const pointAngle = beamAngle + offset * 0.02;
                    const pointRadius = progress * beamLength;

                    ctx.lineTo(
                        Math.cos(pointAngle) * pointRadius,
                        Math.sin(pointAngle) * pointRadius
                    );
                }
                ctx.stroke();
            }

            ctx.fillStyle = `rgba(255, 255, 255, ${glow})`;
            ctx.shadowColor = 'rgba(0, 200, 255, 0.9)';
            ctx.shadowBlur = 22;
            ctx.beginPath();
            ctx.arc(0, 0, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(0, 200, 255, ${attackAnimation})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 120 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob5() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.0014) * 0.25 + 0.75;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 50) * 8;
                ctx.translate(0, shake);
            }

            const intensity = Math.sin(time * 0.0024) * 0.3 + 0.7;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 50);
            gradient.addColorStop(0, `rgba(255, 100, 200, ${intensity * 0.8})`);
            gradient.addColorStop(0.6, `rgba(220, 60, 160, ${intensity * 0.4})`);
            gradient.addColorStop(1, `rgba(180, 30, 120, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 50, 0, Math.PI * 2);
            ctx.fill();

            const spirals = 2;
            for(let s = 0; s < spirals; s++) {
                const spiralDirection = s % 2 === 0 ? 1 : -1;
                const spiralRadius = 60;

                ctx.strokeStyle = `rgba(255, 120, 180, ${0.6})`;
                ctx.lineWidth = 3;
                ctx.beginPath();

                for(let i = 0; i <= 30; i++) {
                    const progress = i / 30;
                    const angle = progress * Math.PI * 4 * spiralDirection + time * 0.0002;
                    const radius = progress * spiralRadius;

                    const x = Math.cos(angle) * radius;
                    const y = Math.sin(angle) * radius;

                    if(i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            const crystals = 9;
            for(let i = 0; i < crystals; i++) {
                const angle = (Math.PI * 2 / crystals) * i;
                const distance = 40 + Math.sin(time * 0.001 + i) * 15;
                const crystalSize = 6 + Math.sin(time * 0.01 + i * 2) * 3;

                ctx.save();
                ctx.translate(Math.cos(angle) * distance, Math.sin(angle) * distance);
                ctx.rotate(angle);

                ctx.fillStyle = `rgba(255, 150, 220, ${0.8})`;
                ctx.beginPath();
                ctx.moveTo(0, -crystalSize);
                ctx.lineTo(crystalSize * 0.7, crystalSize * 0.5);
                ctx.lineTo(-crystalSize * 0.7, crystalSize * 0.5);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = `rgba(255, 180, 240, 0.9)`;
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.restore();
            }

            const rings = 2;
            for(let r = 0; r < rings; r++) {
                const ringRadius = 20 + r * 15;
                const ringPulse = Math.sin(time * 0.0015 + r) * 0.5 + 0.5;

                ctx.strokeStyle = `rgba(255, 100, 200, ${0.3 + ringPulse * 0.4})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, ringRadius, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.fillStyle = `rgba(255, 255, 255, ${intensity})`;
            ctx.shadowColor = 'rgba(255, 100, 200, 0.9)';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(0, 0, 16 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(255, 100, 200, ${attackAnimation})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, 115 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob6() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const rotation = time * 0.00035;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 38) * 5;
                ctx.translate(shake, -shake * 0.5);
            }

            const glow = Math.sin(time * 0.0021) * 0.4 + 0.6;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 47);
            gradient.addColorStop(0, `rgba(100, 255, 100, ${glow * 0.9})`);
            gradient.addColorStop(0.7, `rgba(60, 200, 60, ${glow * 0.5})`);
            gradient.addColorStop(1, `rgba(30, 150, 30, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 47, 0, Math.PI * 2);
            ctx.fill();

            const leaves = 8;
            for(let i = 0; i < leaves; i++) {
                const angle = (Math.PI * 2 / leaves) * i + rotation * 0.7;

            const isHit = distance < 100 * mobs[currentMob].scaleFactor;

            if(isHit) {
                damageMob();
            }
        });

        function gameLoop() {
            drawScene();
            requestAnimationFrame(gameLoop);
        }

        resize();

        class DamageEffect {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.life = 1.0;
                this.size = type === 'hit' ? 20 : 50;
                this.particles = [];

                if(type === 'hit') {
                    for(let i = 0; i < 8; i++) {
                        this.particles.push({
                            x: 0,
                            y: 0,
                            vx: (Math.random() - 0.5) * 10,
                            vy: (Math.random() - 0.5) * 10 - 5,
                            life: 1.0
                        });

                } else {
                    for(let i = 0; i < 20; i++) {
                        this.particles.push({
                            x: 0,
                            y: 0,
                            vx: (Math.random() - 0.5) * 15,
                            vy: (Math.random() - 0.5) * 15 - 8,
                            life: 1.0,

                this.life -= 0.03;
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.3;
                    p.life -= 0.02;

                if(this.type === 'hit') {
                    ctx.save();
                    ctx.translate(this.x, this.y);

                            ctx.fillStyle = `rgba(255, 100, 100, ${p.life})`;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
                            ctx.fill();

                    ctx.restore();

                    ctx.save();
                    ctx.translate(this.x, this.y);

                    ctx.fillStyle = `rgba(255, 200, 50, ${this.life * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * (1 - this.life), 0, Math.PI * 2);
                    ctx.fill();

                    this.particles.forEach(p => {
                        if(p.life > 0) {
                            ctx.fillStyle = p.color.replace(')', `, ${p.life})`).replace('hsl', 'hsla');

            gradient.addColorStop(0, `rgba(150, 100, 255, ${chronoGlow * 0.9})`);
            gradient.addColorStop(0.5, `rgba(120, 70, 220, ${chronoGlow * 0.5})`);
            gradient.addColorStop(1, `rgba(90, 40, 180, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 70 * pulse, 0, Math.PI * 2);
            ctx.fill();

            const timeSpirals = 3;
            for(let s = 0; s < timeSpirals; s++) {
                const spiralRotation = time * 0.0002 * (s + 1);
                const spiralRadius = 45 + s * 20;
                const spiralTurns = 1.5;

                ctx.save();
                ctx.rotate(spiralRotation);

                for(let i = 0; i <= 24; i++) {
                    const progress = i / 24;
                    const angle = progress * Math.PI * 2 * spiralTurns;
                    const radius = spiralRadius * progress;
                    const pointX = Math.cos(angle) * radius;
                    const pointY = Math.sin(angle) * radius;

                    if(i === 0) {
                        ctx.beginPath();
                        ctx.moveTo(pointX, pointY);
                    } else {
                        ctx.lineTo(pointX, pointY);
                    }

                    if(i % 4 === 0) {
                        ctx.fillStyle = `rgba(170, 130, 255, ${0.8 - s * 0.2})`;
                        ctx.beginPath();
                        ctx.arc(pointX, pointY, 8 - s * 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                ctx.strokeStyle = `rgba(160, 110, 240, ${0.6 - s * 0.1})`;
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.restore();
            }

            const hourglassForms = 4;
            for(let i = 0; i < hourglassForms; i++) {
                const formAngle = (Math.PI * 2 / hourglassForms) * i + time * 0.00018;
                const formLength = 85;

                ctx.save();
                ctx.rotate(formAngle);

                ctx.strokeStyle = `rgba(180, 140, 255, ${0.7})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(30, -50, 60, -40, formLength, 0);
                ctx.bezierCurveTo(60, 40, 30, 50, 0, 0);
                ctx.stroke();

                ctx.fillStyle = `rgba(200, 160, 255, ${0.9})`;
                ctx.beginPath();
                ctx.arc(formLength, 0, 16, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            const temporalMarkers = 8;
            for(let i = 0; i < temporalMarkers; i++) {
                const markerAngle = (Math.PI * 2 / temporalMarkers) * i + time * 0.00012;
                const markerRadius = 35;
                const markerX = Math.cos(markerAngle) * markerRadius;
                const markerY = Math.sin(markerAngle) * markerRadius;

                ctx.save();
                ctx.translate(markerX, markerY);
                ctx.rotate(markerAngle);

                ctx.fillStyle = `rgba(190, 150, 255, ${0.8})`;
                ctx.beginPath();
                ctx.moveTo(0, -10);
                ctx.lineTo(15, -5);
                ctx.lineTo(15, 5);
                ctx.lineTo(0, 10);
                ctx.lineTo(-15, 5);
                ctx.lineTo(-15, -5);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = `rgba(210, 170, 255, ${0.9})`;
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();
            }

            const paradoxLines = 6;
            for(let i = 0; i < paradoxLines; i++) {
                const lineAngle = (Math.PI * 2 / paradoxLines) * i;
                const lineLength = 55 + Math.sin(time * 0.001 + i) * 20;

                ctx.setLineDash([8, 4]);
                ctx.strokeStyle = `rgba(170, 120, 240, ${0.5 + Math.sin(time * 0.002 + i) * 0.2})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(lineAngle) * lineLength, Math.sin(lineAngle) * lineLength);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            ctx.fillStyle = `rgba(255, 255, 255, ${chronoGlow})`;
            ctx.shadowColor = 'rgba(150, 100, 255, 0.9)';
            ctx.shadowBlur = 35;
            ctx.beginPath();
            ctx.arc(0, 0, 26 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(160, 110, 255, ${attackAnimation})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, 160 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        const mobDrawers = [
            drawMob1,
            drawMob2,
            drawMob3,
            drawMob4,
            drawMob5,
            drawMob6,
            drawMob7,
            drawMob8,
            drawMob9,
            drawMob10
        ];

        function updateMob() {
            mobScale = 1;
            mobRotation = 0;
            isMobAlive = true;
            deathAnimation = 0;

            mobPosition.x = canvas.width / 2;
            mobPosition.y = canvas.height / 2;
        }

        function damageMob() {
            if(!isMobAlive) return;

            mobs[currentMob].health--;

            damageEffects.push(new DamageEffect(mobPosition.x, mobPosition.y, 'hit'));
            attackAnimation = 1.0;

            mobScale = 0.9;

            if(mobs[currentMob].health <= 0) {
                isMobAlive = false;
                deathAnimation = 1.0;
                damageEffects.push(new DamageEffect(mobPosition.x, mobPosition.y, 'death'));

                setTimeout(() => {
                    currentMob = (currentMob + 1) % mobs.length;
                    mobs[currentMob].health = mobs[currentMob].maxHealth;
                    updateMob();
                }, 0);
            }
        }

        function drawScene() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if(attackAnimation > 0) {
                attackAnimation -= 0.05;
                mobScale = Math.min(mobScale + 0.02, 1);
            }

            if(deathAnimation > 0) {
                deathAnimation -= 0.02;
                mobScale *= 0.98;
                mobRotation += 0.1;
            }

            if(isMobAlive || deathAnimation > 0) {
                mobDrawers[currentMob]();
            }

            damageEffects = damageEffects.filter(effect => effect.update());
            damageEffects.forEach(effect => effect.draw());
        }

        canvas.addEventListener('click', (e) => {
            if(!isMobAlive) return;

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            const distance = Math.sqrt(
                Math.pow(clickX - mobPosition.x, 2) +
                Math.pow(clickY - mobPosition.y, 2)
            );
            const isHit = distance < 100 * mobs[currentMob].scaleFactor;

            if(isHit) {
                damageMob();
            }
        });

        updateMob();

        function gameLoop() {
            drawScene();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
