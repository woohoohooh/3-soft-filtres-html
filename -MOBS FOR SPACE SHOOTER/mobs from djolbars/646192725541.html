<html lang="ru">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<body>
    <canvas id="game"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        let currentMob = 0;
        const mobs = [
            { id: 1, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 2, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 3, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 4, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 5, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 6, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 7, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 8, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 9, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 10, health: 1, maxHealth: 1, scaleFactor: 2.0 }
        ];

        let damageEffects = [];
        let mobPosition = { x: 0, y: 0 };
        let mobScale = 1;
        let mobRotation = 0;
        let isMobAlive = true;
        let attackAnimation = 0;
        let deathAnimation = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            mobPosition.x = canvas.width / 2;
            mobPosition.y = canvas.height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        class DamageEffect {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.life = 1.0;
                this.size = type === 'hit' ? 20 : 50;
                this.particles = [];

                if(type === 'hit') {
                    for(let i = 0; i < 8; i++) {
                        this.particles.push({
                            x: 0,
                            y: 0,
                            vx: (Math.random() - 0.5) * 10,
                            vy: (Math.random() - 0.5) * 10 - 5,
                            life: 1.0
                        });
                    }
                } else {
                    for(let i = 0; i < 20; i++) {
                        this.particles.push({
                            x: 0,
                            y: 0,
                            vx: (Math.random() - 0.5) * 15,
                            vy: (Math.random() - 0.5) * 15 - 8,
                            life: 1.0,
                            color: `hsl(${Math.random() * 60}, 100%, 60%)`
                        });
                    }
                }
            }

            update() {
                this.life -= 0.03;
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.3;
                    p.life -= 0.02;
                });
                return this.life > 0;
            }

            draw() {
                if(this.type === 'hit') {
                    ctx.save();
                    ctx.translate(this.x, this.y);

                    ctx.fillStyle = `rgba(255, 50, 50, ${this.life * 0.7})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * this.life, 0, Math.PI * 2);
                    ctx.fill();

                    this.particles.forEach(p => {
                        if(p.life > 0) {
                            ctx.fillStyle = `rgba(255, 100, 100, ${p.life})`;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    });

                    ctx.restore();
                } else {
                    ctx.save();
                    ctx.translate(this.x, this.y);

                    ctx.fillStyle = `rgba(255, 200, 50, ${this.life * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * (1 - this.life), 0, Math.PI * 2);
                    ctx.fill();

                    this.particles.forEach(p => {
                        if(p.life > 0) {
                            ctx.fillStyle = p.color.replace(')', `, ${p.life})`).replace('hsl', 'hsla');
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, 4 * p.life, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    });

                    ctx.restore();
                }
            }
        }

        function drawMob1() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.0015) * 0.2 + 1;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 30) * 5;
                ctx.translate(shake, 0);
            }

            const coreGlow = Math.sin(time * 0.002) * 0.3 + 0.7;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 60);
            gradient.addColorStop(0, `rgba(0, 255, 200, ${coreGlow * 0.9})`);
            gradient.addColorStop(0.5, `rgba(0, 180, 150, ${coreGlow * 0.4})`);
            gradient.addColorStop(1, `rgba(0, 100, 80, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 60 * pulse, 0, Math.PI * 2);
            ctx.fill();

            const rings = 3;
            for(let i = 0; i < rings; i++) {
                const ringRadius = 40 + i * 25;
                const ringPulse = Math.sin(time * 0.001 + i * 0.5) * 0.3 + 0.7;
                const rotation = time * 0.0003 * (i + 1);

                ctx.save();
                ctx.rotate(rotation);

                ctx.strokeStyle = `rgba(0, 220, 180, ${0.3 + Math.sin(time * 0.003 + i) * 0.2})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, ringRadius * ringPulse, 0, Math.PI * 2);
                ctx.stroke();

                const spikes = 8 + i * 2;
                for(let j = 0; j < spikes; j++) {
                    const angle = (Math.PI * 2 / spikes) * j;
                    const spikeLength = 15 + Math.sin(time * 0.002 + j) * 5;

                    ctx.save();
                    ctx.rotate(angle);
                    ctx.translate(ringRadius * ringPulse, 0);

                    ctx.fillStyle = `rgba(0, 255, 220, ${0.7 + Math.sin(time * 0.004 + j) * 0.2})`;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(spikeLength, -spikeLength * 0.5);
                    ctx.lineTo(spikeLength, spikeLength * 0.5);
                    ctx.closePath();
                    ctx.fill();

                    ctx.restore();
                }

                ctx.restore();
            }

            const orbs = 5;
            for(let i = 0; i < orbs; i++) {
                const angle = (Math.PI * 2 / orbs) * i + time * 0.0004;
                const orbitRadius = 85;
                const orbX = Math.cos(angle) * orbitRadius;
                const orbY = Math.sin(angle) * orbitRadius;
                const orbSize = 12 + Math.sin(time * 0.005 + i) * 4;

                ctx.fillStyle = `rgba(0, 230, 190, ${0.8 + Math.sin(time * 0.003 + i) * 0.1})`;
                ctx.beginPath();
                ctx.arc(orbX, orbY, orbSize, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = `rgba(0, 200, 160, ${0.5})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(orbX, orbY);
                ctx.stroke();
            }

            ctx.fillStyle = `rgba(255, 255, 255, ${coreGlow})`;
            ctx.shadowColor = 'rgba(0, 255, 200, 0.9)';
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.arc(0, 0, 20 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(0, 255, 200, ${attackAnimation})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, 130 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob2() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.0018) * 0.25 + 1;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 30) * 5;
                ctx.translate(shake, 0);
            }

            const energyGlow = Math.sin(time * 0.0025) * 0.4 + 0.6;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 55);
            gradient.addColorStop(0, `rgba(255, 80, 0, ${energyGlow * 0.95})`);
            gradient.addColorStop(0.6, `rgba(200, 40, 0, ${energyGlow * 0.5})`);
            gradient.addColorStop(1, `rgba(150, 20, 0, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 55 * pulse, 0, Math.PI * 2);
            ctx.fill();

            const layers = 4;
            for(let l = 0; l < layers; l++) {
                const layerRadius = 30 + l * 20;
                const layerSpeed = time * 0.0002 * (l + 1);
                const layerPoints = 6 + l * 2;

                for(let i = 0; i < layerPoints; i++) {
                    const baseAngle = (Math.PI * 2 / layerPoints) * i + layerSpeed;
                    const angleVar = Math.sin(time * 0.001 + l * 0.7 + i) * 0.5;
                    const angle = baseAngle + angleVar;
                    const radiusVar = Math.sin(time * 0.0015 + l * 0.5 + i) * 15;
                    const currentRadius = layerRadius + radiusVar;

                    const pointX = Math.cos(angle) * currentRadius;
                    const pointY = Math.sin(angle) * currentRadius;

                    ctx.fillStyle = `rgba(255, 100 + l * 20, 30, ${0.8 - l * 0.1})`;
                    ctx.beginPath();
                    ctx.arc(pointX, pointY, 8 - l * 1.5, 0, Math.PI * 2);
                    ctx.fill();

                    if(l < layers - 1) {
                        const nextI = (i + 1) % layerPoints;
                        const nextAngle = (Math.PI * 2 / layerPoints) * nextI + layerSpeed;
                        const nextAngleVar = Math.sin(time * 0.001 + l * 0.7 + nextI) * 0.5;
                        const nextAngleFinal = nextAngle + nextAngleVar;
                        const nextRadiusVar = Math.sin(time * 0.0015 + l * 0.5 + nextI) * 15;
                        const nextRadius = layerRadius + nextRadiusVar;

                        const nextX = Math.cos(nextAngleFinal) * nextRadius;
                        const nextY = Math.sin(nextAngleFinal) * nextRadius;

                        ctx.strokeStyle = `rgba(255, 80, 20, ${0.3 - l * 0.05})`;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(pointX, pointY);
                        ctx.lineTo(nextX, nextY);
                        ctx.stroke();
                    }
                }
            }

            const tendrils = 4;
            for(let i = 0; i < tendrils; i++) {
                const tendrilAngle = (Math.PI * 2 / tendrils) * i + time * 0.0003;
                const segments = 7;

                ctx.strokeStyle = `rgba(255, 120, 40, ${0.6})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, 0);

                for(let s = 1; s <= segments; s++) {
                    const progress = s / segments;
                    const segmentLength = 70 * progress;
                    const wave = Math.sin(time * 0.003 + i * 2 + s) * 20 * progress;
                    const angleOffset = Math.sin(time * 0.002 + s) * 0.3;

                    const segX = Math.cos(tendrilAngle + angleOffset) * segmentLength + Math.cos(tendrilAngle + Math.PI/2) * wave;
                    const segY = Math.sin(tendrilAngle + angleOffset) * segmentLength + Math.sin(tendrilAngle + Math.PI/2) * wave;

                    ctx.lineTo(segX, segY);
                }
                ctx.stroke();

                const endX = Math.cos(tendrilAngle) * 70;
                const endY = Math.sin(tendrilAngle) * 70;
                ctx.fillStyle = `rgba(255, 150, 60, ${0.9})`;
                ctx.beginPath();
                ctx.arc(endX, endY, 12, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = `rgba(255, 255, 200, ${energyGlow})`;
            ctx.shadowColor = 'rgba(255, 100, 0, 0.9)';
            ctx.shadowBlur = 30;
            ctx.beginPath();
            ctx.arc(0, 0, 18 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(255, 80, 0, ${attackAnimation})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, 140 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob3() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.002) * 0.3 + 1;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 30) * 5;
                ctx.translate(shake, 0);
            }

            const voidGlow = Math.sin(time * 0.0018) * 0.35 + 0.65;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 65);
            gradient.addColorStop(0, `rgba(100, 0, 200, ${voidGlow * 0.9})`);
            gradient.addColorStop(0.4, `rgba(70, 0, 150, ${voidGlow * 0.5})`);
            gradient.addColorStop(1, `rgba(40, 0, 100, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 65 * pulse, 0, Math.PI * 2);
            ctx.fill();

            const fractureCount = 8;
            for(let i = 0; i < fractureCount; i++) {
                const angle = (Math.PI * 2 / fractureCount) * i + time * 0.0001;
                const fractureLength = 80 + Math.sin(time * 0.001 + i * 0.7) * 25;
                const fractureWidth = 5 + Math.sin(time * 0.002 + i) * 3;

                ctx.save();
                ctx.rotate(angle);

                ctx.fillStyle = `rgba(140, 50, 255, ${0.7 + Math.sin(time * 0.003 + i) * 0.2})`;
                ctx.beginPath();
                ctx.moveTo(0, -fractureWidth);
                ctx.lineTo(fractureLength, -fractureWidth * 0.3);
                ctx.lineTo(fractureLength, fractureWidth * 0.3);
                ctx.lineTo(0, fractureWidth);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = `rgba(180, 100, 255, ${0.9})`;
                ctx.beginPath();
                ctx.arc(fractureLength, 0, 10 + Math.sin(time * 0.005 + i) * 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            const innerRings = 2;
            for(let r = 0; r < innerRings; r++) {
                const ringRadius = 20 + r * 15;
                const ringRotation = time * 0.0002 * (r + 1);
                const ringPoints = 12 - r * 3;

                ctx.save();
                ctx.rotate(ringRotation);

                for(let i = 0; i < ringPoints; i++) {
                    const angle = (Math.PI * 2 / ringPoints) * i;
                    const pointX = Math.cos(angle) * ringRadius;
                    const pointY = Math.sin(angle) * ringRadius;
                    const pointSize = 6 - r * 2;

                    ctx.fillStyle = `rgba(160, 80, 255, ${0.8 - r * 0.2})`;
                    ctx.beginPath();
                    ctx.arc(pointX, pointY, pointSize, 0, Math.PI * 2);
                    ctx.fill();

                    if(i > 0) {
                        const prevAngle = (Math.PI * 2 / ringPoints) * (i - 1);
                        const prevX = Math.cos(prevAngle) * ringRadius;
                        const prevY = Math.sin(prevAngle) * ringRadius;

                        ctx.strokeStyle = `rgba(140, 60, 230, ${0.4 - r * 0.1})`;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(prevX, prevY);
                        ctx.lineTo(pointX, pointY);
                        ctx.stroke();
                    }
                }

                ctx.restore();
            }

            const corePulse = Math.sin(time * 0.004) * 0.5 + 1;
            ctx.fillStyle = `rgba(255, 220, 255, ${voidGlow})`;
            ctx.shadowColor = 'rgba(160, 80, 255, 0.9)';
            ctx.shadowBlur = 35;
            ctx.beginPath();
            ctx.arc(0, 0, 25 * corePulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            const dustParticles = 15;
            for(let i = 0; i < dustParticles; i++) {
                const dustAngle = Math.random() * Math.PI * 2;
                const dustDistance = 100 + Math.random() * 50;
                const dustSize = 2 + Math.random() * 4;
                const dustX = Math.cos(dustAngle) * dustDistance;
                const dustY = Math.sin(dustAngle) * dustDistance;
                const dustAlpha = 0.3 + Math.sin(time * 0.001 + i) * 0.2;

                ctx.fillStyle = `rgba(120, 40, 220, ${dustAlpha})`;
                ctx.beginPath();
                ctx.arc(dustX, dustY, dustSize, 0, Math.PI * 2);
                ctx.fill();
            }

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(140, 60, 255, ${attackAnimation})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, 150 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob4() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.0017) * 0.25 + 1;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 30) * 5;
                ctx.translate(shake, 0);
            }

            const plasmaGlow = Math.sin(time * 0.0022) * 0.4 + 0.6;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 50);
            gradient.addColorStop(0, `rgba(0, 255, 100, ${plasmaGlow * 0.95})`);
            gradient.addColorStop(0.7, `rgba(0, 180, 70, ${plasmaGlow * 0.4})`);
            gradient.addColorStop(1, `rgba(0, 120, 40, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 50 * pulse, 0, Math.PI * 2);
            ctx.fill();

            const helixCount = 3;
            for(let h = 0; h < helixCount; h++) {
                const helixRotation = time * 0.0003 * (h + 1);
                const helixRadius = 40 + h * 10;
                const turns = 2;

                ctx.save();
                ctx.rotate(helixRotation);

                for(let i = 0; i <= 20; i++) {
                    const progress = i / 20;
                    const angle = progress * Math.PI * 2 * turns;
                    const currentRadius = helixRadius + Math.sin(progress * Math.PI * 4) * 10;
                    const pointX = Math.cos(angle) * currentRadius;
                    const pointY = Math.sin(angle) * currentRadius;

                    if(i === 0) {
                        ctx.beginPath();
                        ctx.moveTo(pointX, pointY);
                    } else {
                        ctx.lineTo(pointX, pointY);
                    }

                    if(i % 5 === 0) {
                        ctx.fillStyle = `rgba(0, 220 + h * 20, 90, ${0.8 - h * 0.1})`;
                        ctx.beginPath();
                        ctx.arc(pointX, pointY, 6 - h * 1.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                ctx.strokeStyle = `rgba(0, 200, 80, ${0.5 - h * 0.1})`;
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.restore();
            }

            const energyNodes = 6;
            for(let i = 0; i < energyNodes; i++) {
                const nodeAngle = (Math.PI * 2 / energyNodes) * i + time * 0.0002;
                const nodeRadius = 75;
                const nodeX = Math.cos(nodeAngle) * nodeRadius;
                const nodeY = Math.sin(nodeAngle) * nodeRadius;
                const nodePulse = Math.sin(time * 0.003 + i) * 0.5 + 1;

                ctx.fillStyle = `rgba(0, 240, 100, ${0.9})`;
                ctx.beginPath();
                ctx.arc(nodeX, nodeY, 14 * nodePulse, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = `rgba(0, 200, 80, ${0.6})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(nodeX, nodeY);
                ctx.stroke();
            }

            const spikes = 8;
            for(let i = 0; i < spikes; i++) {
                const spikeAngle = (Math.PI * 2 / spikes) * i + time * 0.0001;
                const spikeLength = 60 + Math.sin(time * 0.002 + i * 0.8) * 20;
                const spikeWidth = 15;

                ctx.save();
                ctx.rotate(spikeAngle);

                ctx.fillStyle = `rgba(0, 220, 90, ${0.7})`;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(spikeLength, -spikeWidth);
                ctx.lineTo(spikeLength + 20, 0);
                ctx.lineTo(spikeLength, spikeWidth);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }

            ctx.fillStyle = `rgba(255, 255, 220, ${plasmaGlow})`;
            ctx.shadowColor = 'rgba(0, 255, 100, 0.9)';
            ctx.shadowBlur = 30;
            ctx.beginPath();
            ctx.arc(0, 0, 22 * pulse, 0, Math.PI * 2);

            if(attackAnimation > 0) {

                ctx.beginPath();
                ctx.arc(0, 0, 130 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.0019) * 0.3 + 1;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 30) * 5;
                ctx.translate(shake, 0);
            }

            const crystalGlow = Math.sin(time * 0.0023) * 0.35 + 0.65;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 70);
            gradient.addColorStop(0, `rgba(200, 100, 255, ${crystalGlow * 0.9})`);
            gradient.addColorStop(0.5, `rgba(170, 70, 230, ${crystalGlow * 0.5})`);
            gradient.addColorStop(1, `rgba(140, 40, 200, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 70 * pulse, 0, Math.PI * 2);
            ctx.fill();

            const crystalFaces = 7;
            for(let i = 0; i < crystalFaces; i++) {
                const faceAngle = (Math.PI * 2 / crystalFaces) * i;
                const faceRotation = time * 0.0001;
                const faceLength = 90 + Math.sin(time * 0.001 + i) * 25;

                ctx.save();
                ctx.rotate(faceAngle + faceRotation);

                ctx.fillStyle = `rgba(180, 90, 240, ${0.6})`;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(faceLength, -30);
                ctx.lineTo(faceLength + 40, 0);
                ctx.lineTo(faceLength, 30);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = `rgba(210, 120, 255, ${0.8})`;
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.fillStyle = `rgba(230, 150, 255, ${0.9})`;
                ctx.beginPath();
                ctx.arc(faceLength + 40, 0, 15, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

                    const progress = i / 24;
                    const angle = progress * Math.PI * 2 * spiralTurns;
                    const radius = spiralRadius * progress;
                    const pointX = Math.cos(angle) * radius;
                    const pointY = Math.sin(angle) * radius;

                    if(i === 0) {
                        ctx.beginPath();
                        ctx.moveTo(pointX, pointY);
                    } else {
                        ctx.lineTo(pointX, pointY);
                    }

                    if(i % 4 === 0) {
                        ctx.fillStyle = `rgba(170, 130, 255, ${0.8 - s * 0.2})`;
                        ctx.beginPath();
                        ctx.arc(pointX, pointY, 8 - s * 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                ctx.strokeStyle = `rgba(160, 110, 240, ${0.6 - s * 0.1})`;
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.restore();
            }

            const hourglassForms = 4;
            for(let i = 0; i < hourglassForms; i++) {
                const formAngle = (Math.PI * 2 / hourglassForms) * i + time * 0.00018;
                const formLength = 85;

                ctx.save();
                ctx.rotate(formAngle);

                ctx.strokeStyle = `rgba(180, 140, 255, ${0.7})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(30, -50, 60, -40, formLength, 0);
                ctx.bezierCurveTo(60, 40, 30, 50, 0, 0);
                ctx.stroke();

                ctx.fillStyle = `rgba(200, 160, 255, ${0.9})`;
                ctx.beginPath();
                ctx.arc(formLength, 0, 16, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            const temporalMarkers = 8;
            for(let i = 0; i < temporalMarkers; i++) {
                const markerAngle = (Math.PI * 2 / temporalMarkers) * i + time * 0.00012;
                const markerRadius = 35;
                const markerX = Math.cos(markerAngle) * markerRadius;
                const markerY = Math.sin(markerAngle) * markerRadius;

                ctx.save();
                ctx.translate(markerX, markerY);
                ctx.rotate(markerAngle);

                ctx.fillStyle = `rgba(190, 150, 255, ${0.8})`;
                ctx.beginPath();
                ctx.moveTo(0, -10);
                ctx.lineTo(15, -5);
                ctx.lineTo(15, 5);
                ctx.lineTo(0, 10);
                ctx.lineTo(-15, 5);
                ctx.lineTo(-15, -5);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = `rgba(210, 170, 255, ${0.9})`;
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();
            }

            const paradoxLines = 6;
            for(let i = 0; i < paradoxLines; i++) {
                const lineAngle = (Math.PI * 2 / paradoxLines) * i;
                const lineLength = 55 + Math.sin(time * 0.001 + i) * 20;

                ctx.setLineDash([8, 4]);
                ctx.strokeStyle = `rgba(170, 120, 240, ${0.5 + Math.sin(time * 0.002 + i) * 0.2})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(lineAngle) * lineLength, Math.sin(lineAngle) * lineLength);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            ctx.fillStyle = `rgba(255, 255, 255, ${chronoGlow})`;
            ctx.shadowColor = 'rgba(150, 100, 255, 0.9)';
            ctx.shadowBlur = 35;
            ctx.beginPath();
            ctx.arc(0, 0, 26 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(160, 110, 255, ${attackAnimation})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, 160 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        const mobDrawers = [
            drawMob1,
            drawMob2,
            drawMob3,
            drawMob4,
            drawMob5,
            drawMob6,
            drawMob7,
            drawMob8,
            drawMob9,
            drawMob10
        ];

        function updateMob() {
            mobScale = 1;
            mobRotation = 0;
            isMobAlive = true;
            deathAnimation = 0;

            mobPosition.x = canvas.width / 2;
            mobPosition.y = canvas.height / 2;
        }

        function damageMob() {
            if(!isMobAlive) return;

            mobs[currentMob].health--;

            damageEffects.push(new DamageEffect(mobPosition.x, mobPosition.y, 'hit'));
            attackAnimation = 1.0;

            mobScale = 0.9;

            if(mobs[currentMob].health <= 0) {
                isMobAlive = false;
                deathAnimation = 1.0;
                damageEffects.push(new DamageEffect(mobPosition.x, mobPosition.y, 'death'));

                setTimeout(() => {
                    currentMob = (currentMob + 1) % mobs.length;
                    mobs[currentMob].health = mobs[currentMob].maxHealth;
                    updateMob();
                }, 0);
            }
        }

        function drawScene() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if(attackAnimation > 0) {
                attackAnimation -= 0.05;
                mobScale = Math.min(mobScale + 0.02, 1);
            }

            if(deathAnimation > 0) {
                deathAnimation -= 0.02;
                mobScale *= 0.98;
                mobRotation += 0.1;
            }

            if(isMobAlive || deathAnimation > 0) {
                mobDrawers[currentMob]();
            }

            damageEffects = damageEffects.filter(effect => effect.update());
            damageEffects.forEach(effect => effect.draw());
        }

        canvas.addEventListener('click', (e) => {
            if(!isMobAlive) return;

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            const distance = Math.sqrt(
                Math.pow(clickX - mobPosition.x, 2) +
                Math.pow(clickY - mobPosition.y, 2)
            );
            const isHit = distance < 100 * mobs[currentMob].scaleFactor;

            if(isHit) {
                damageMob();
            }
        });

        updateMob();

        function gameLoop() {
            drawScene();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
