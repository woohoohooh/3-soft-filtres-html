<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Игровые мобы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            touch-action: none;
        }
        body {
            overflow: hidden;
            background: #000;
            height: 100vh;
            position: relative;
            font-family: monospace;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        let currentMob = 0;
        const mobs = [
            { id: 1, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 2, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 3, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 4, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 5, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 6, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 7, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 8, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 9, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 10, health: 1, maxHealth: 1, scaleFactor: 2.0 }
        ];

        let damageEffects = [];
        let mobPosition = { x: 0, y: 0 };
        let mobScale = 1;
        let mobRotation = 0;
        let isMobAlive = true;
        let attackAnimation = 0;
        let deathAnimation = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            mobPosition.x = canvas.width / 2;
            mobPosition.y = canvas.height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        class DamageEffect {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.life = 1.0;
                this.size = type === 'hit' ? 20 : 50;
                this.particles = [];

                if(type === 'hit') {
                    for(let i = 0; i < 8; i++) {
                        this.particles.push({
                            x: 0,
                            y: 0,
                            vx: (Math.random() - 0.5) * 10,
                            vy: (Math.random() - 0.5) * 10 - 5,
                            life: 1.0
                        });
                    }
                } else {
                    for(let i = 0; i < 20; i++) {
                        this.particles.push({
                            x: 0,
                            y: 0,
                            vx: (Math.random() - 0.5) * 15,
                            vy: (Math.random() - 0.5) * 15 - 8,
                            life: 1.0,
                            color: `hsl(${Math.random() * 60}, 100%, 60%)`
                        });
                    }
                }
            }

            update() {
                this.life -= 0.03;
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.3;
                    p.life -= 0.02;
                });
                return this.life > 0;
            }

            draw() {
                if(this.type === 'hit') {
                    ctx.save();
                    ctx.translate(this.x, this.y);

                    ctx.fillStyle = `rgba(255, 50, 50, ${this.life * 0.7})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * this.life, 0, Math.PI * 2);
                    ctx.fill();

                    this.particles.forEach(p => {
                        if(p.life > 0) {
                            ctx.fillStyle = `rgba(255, 100, 100, ${p.life})`;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    });

                    ctx.restore();
                } else {
                    ctx.save();
                    ctx.translate(this.x, this.y);

                    ctx.fillStyle = `rgba(255, 200, 50, ${this.life * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * (1 - this.life), 0, Math.PI * 2);
                    ctx.fill();

                    this.particles.forEach(p => {
                        if(p.life > 0) {
                            ctx.fillStyle = p.color.replace(')', `, ${p.life})`).replace('hsl', 'hsla');
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, 4 * p.life, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    });

                    ctx.restore();
                }
            }
        }

        function drawMob1() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.0015) * 0.2 + 1;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 30) * 5;
                ctx.translate(shake, 0);
            }

            const glow = Math.sin(time * 0.002) * 0.3 + 0.7;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 40);
            gradient.addColorStop(0, `rgba(180, 100, 230, ${glow * 0.9})`);
            gradient.addColorStop(1, `rgba(130, 50, 200, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 40 * pulse, 0, Math.PI * 2);
            ctx.fill();

            const symbols = ['☉', '☾', '♆', '⚷', '♇', '⚸'];
            const symbolCount = symbols.length;

            for(let i = 0; i < symbolCount; i++) {
                const angle = (Math.PI * 2 / symbolCount) * i + time * 0.0003;
                const radius = 60 + Math.sin(time * 0.001 + i) * 10;
                const symbolGlow = Math.sin(time * 0.002 + i) * 0.4 + 0.6;

                ctx.save();
                ctx.translate(Math.cos(angle) * radius, Math.sin(angle) * radius);
                ctx.rotate(angle + Math.PI/2);

                ctx.fillStyle = `rgba(200, 150, 250, ${symbolGlow})`;
                ctx.font = '20px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(symbols[i], 0, 0);

                ctx.strokeStyle = `rgba(180, 130, 230, ${symbolGlow * 0.5})`;
                ctx.strokeText(symbols[i], 0, 0);

                ctx.restore();
            }

            const lines = 8;
            for(let i = 0; i < lines; i++) {
                const lineAngle = (Math.PI * 2 / lines) * i + time * 0.0002;
                const lineLength = 80 + Math.sin(time * 0.001 + i) * 20;

                ctx.strokeStyle = `rgba(150, 100, 220, ${0.4 + Math.sin(time * 0.003 + i) * 0.3})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(lineAngle) * lineLength, Math.sin(lineAngle) * lineLength);
                ctx.stroke();

                ctx.fillStyle = `rgba(180, 130, 240, ${0.6 + Math.sin(time * 0.002 + i) * 0.3})`;
                ctx.beginPath();
                ctx.arc(Math.cos(lineAngle) * lineLength, Math.sin(lineAngle) * lineLength, 6, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = `rgba(255, 255, 200, ${glow})`;
            ctx.shadowColor = 'rgba(200, 150, 255, 0.8)';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(-15, -15, 8 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(15, -15, 8 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(200, 150, 255, ${attackAnimation})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 100 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob2() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const rotation = time * 0.0005;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 30) * 5;
                ctx.translate(shake, 0);
            }

            const vortexGlow = Math.sin(time * 0.002) * 0.4 + 0.6;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 50);
            gradient.addColorStop(0, `rgba(80, 150, 255, ${vortexGlow * 0.9})`);
            gradient.addColorStop(0.7, `rgba(50, 120, 255, ${vortexGlow * 0.4})`);
            gradient.addColorStop(1, `rgba(30, 100, 255, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 50, 0, Math.PI * 2);
            ctx.fill();

            const arms = 3;
            for(let i = 0; i < arms; i++) {
                const armAngle = (Math.PI * 2 / arms) * i + rotation;

                ctx.strokeStyle = `rgba(100, 180, 255, ${0.7})`;
                ctx.lineWidth = 4;
                ctx.beginPath();

                for(let j = 0; j <= 10; j++) {
                    const progress = j / 10;
                    const spiralRadius = 60 * progress;
                    const spiralAngle = armAngle + progress * Math.PI * 2;

                    const pointX = Math.cos(spiralAngle) * spiralRadius;
                    const pointY = Math.sin(spiralAngle) * spiralRadius;

                    if(j === 0) ctx.moveTo(pointX, pointY);
                    else ctx.lineTo(pointX, pointY);
                }
                ctx.stroke();
            }

            const particles = 12;
            for(let i = 0; i < particles; i++) {
                const particleAngle = (Math.PI * 2 / particles) * i + rotation * 2;
                const particleRadius = 40;
                const particleX = Math.cos(particleAngle) * particleRadius;
                const particleY = Math.sin(particleAngle) * particleRadius;
                const particleSize = 4 + Math.sin(time * 0.01 + i) * 3;

                ctx.fillStyle = `rgba(100, 200, 255, ${0.8 + Math.sin(time * 0.005 + i) * 0.1})`;
                ctx.beginPath();
                ctx.arc(particleX, particleY, particleSize, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = `rgba(255, 255, 255, ${vortexGlow})`;
            ctx.shadowColor = 'rgba(100, 180, 255, 0.8)';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(0, 0, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            const rays = 6;
            for(let i = 0; i < rays; i++) {
                const rayAngle = (Math.PI * 2 / rays) * i + rotation;
                const rayLength = 90;

                ctx.strokeStyle = `rgba(80, 160, 255, ${0.5 + Math.sin(time * 0.003 + i) * 0.2})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(rayAngle) * rayLength, Math.sin(rayAngle) * rayLength);
                ctx.stroke();
            }

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(100, 180, 255, ${attackAnimation})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 120 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob3() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.001) * 0.2 + 1;
            const rotation = time * 0.0004;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 40) * 3;
                ctx.translate(0, shake);
            }

            const innerGlow = Math.sin(time * 0.0017) * 0.4 + 0.6;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 60);
            gradient.addColorStop(0, `rgba(255, 80, 100, ${innerGlow * 0.8})`);
            gradient.addColorStop(0.5, `rgba(200, 40, 80, ${innerGlow * 0.4})`);
            gradient.addColorStop(1, `rgba(150, 20, 60, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 60 * pulse, 0, Math.PI * 2);
            ctx.fill();

            const rings = 4;
            for(let r = 0; r < rings; r++) {
                const ringRadius = 25 + r * 30;
                const ringGlow = Math.sin(time * 0.001 + r) * 0.3 + 0.5;
                ctx.strokeStyle = `rgba(255, 100, 120, ${ringGlow})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, ringRadius + Math.sin(time * 0.002 + r * 2) * 5, 0, Math.PI * 2);
                ctx.stroke();
            }

            const spikes = 7;
            for(let i = 0; i < spikes; i++) {
                const spikeAngle = (Math.PI * 2 / spikes) * i + rotation;
                const spikeLength = 80 + Math.sin(time * 0.001 + i) * 15;
                const spikeWidth = 10;

                ctx.fillStyle = `rgba(255, 60, 90, ${0.7})`;
                ctx.save();
                ctx.translate(Math.cos(spikeAngle) * 30, Math.sin(spikeAngle) * 30);
                ctx.rotate(spikeAngle);
                ctx.beginPath();
                ctx.moveTo(0, -spikeWidth);
                ctx.lineTo(spikeLength, 0);
                ctx.lineTo(0, spikeWidth);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }

            const coreGlow = Math.sin(time * 0.003) * 0.4 + 0.6;
            ctx.fillStyle = `rgba(255, 220, 100, ${coreGlow})`;
            ctx.shadowColor = 'rgba(255, 100, 80, 0.9)';
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.arc(0, 0, 12 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(255, 80, 100, ${attackAnimation})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, 130 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob4() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.002) * 0.3 + 1;
            const rotation = time * 0.0003;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 35) * 4;
                ctx.translate(shake, -shake);
            }

            const nebulaGlow = Math.sin(time * 0.0015) * 0.5 + 0.5;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 70);
            gradient.addColorStop(0, `rgba(100, 255, 200, ${nebulaGlow * 0.7})`);
            gradient.addColorStop(0.3, `rgba(80, 220, 180, ${nebulaGlow * 0.5})`);
            gradient.addColorStop(0.7, `rgba(60, 180, 150, ${nebulaGlow * 0.3})`);
            gradient.addColorStop(1, `rgba(40, 140, 120, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            for(let a = 0; a < Math.PI * 2; a += 0.1) {
                const radius = 70 + Math.sin(a * 5 + time * 0.001) * 15;
                const x = Math.cos(a) * radius;
                const y = Math.sin(a) * radius;
                if(a === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();

            const orbs = 5;
            for(let i = 0; i < orbs; i++) {
                const orbAngle = (Math.PI * 2 / orbs) * i + rotation;
                const orbDistance = 50 + Math.sin(time * 0.001 + i) * 20;
                const orbSize = 8 + Math.sin(time * 0.002 + i) * 4;

                ctx.fillStyle = `rgba(150, 255, 220, ${0.8})`;
                ctx.beginPath();
                ctx.arc(Math.cos(orbAngle) * orbDistance, Math.sin(orbAngle) * orbDistance, orbSize, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = `rgba(100, 230, 200, ${0.6})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(orbAngle) * orbDistance, Math.sin(orbAngle) * orbDistance);
                ctx.stroke();
            }

            const filaments = 9;
            for(let i = 0; i < filaments; i++) {
                const filamentAngle = (Math.PI * 2 / filaments) * i;
                const filamentLength = 90 + Math.sin(time * 0.001 + i * 2) * 20;

                ctx.strokeStyle = `rgba(80, 255, 200, ${0.4 + Math.sin(time * 0.002 + i) * 0.2})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                for(let j = 1; j <= 10; j++) {
                    const progress = j / 10;
                    const offset = Math.sin(progress * Math.PI * 3 + time * 0.003) * 10;
                    const x = Math.cos(filamentAngle) * filamentLength * progress + Math.cos(filamentAngle + Math.PI/2) * offset;
                    const y = Math.sin(filamentAngle) * filamentLength * progress + Math.sin(filamentAngle + Math.PI/2) * offset;
                    ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            const heartGlow = Math.sin(time * 0.002) * 0.3 + 0.7;
            ctx.fillStyle = `rgba(200, 255, 240, ${heartGlow})`;
            ctx.shadowColor = 'rgba(100, 255, 200, 0.8)';
            ctx.shadowBlur = 30;
            ctx.beginPath();
            ctx.arc(0, 0, 18 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(100, 255, 200, ${attackAnimation})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 150 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob5() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.0012) * 0.25 + 1;
            const rotation = time * 0.0006;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 50) * 6;
                ctx.translate(shake * 0.7, shake * 0.3);
            }

            const plasmaGlow = Math.sin(time * 0.0018) * 0.6 + 0.4;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 55);
            gradient.addColorStop(0, `rgba(255, 150, 50, ${plasmaGlow * 0.9})`);
            gradient.addColorStop(0.5, `rgba(255, 100, 30, ${plasmaGlow * 0.6})`);
            gradient.addColorStop(1, `rgba(200, 70, 20, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 55 * pulse, 0, Math.PI * 2);
            ctx.fill();

            const gears = 6;
            for(let g = 0; g < gears; g++) {
                const gearAngle = (Math.PI * 2 / gears) * g + rotation;
                const gearRadius = 75;
                const teeth = 8;

                ctx.save();
                ctx.translate(Math.cos(gearAngle) * gearRadius, Math.sin(gearAngle) * gearRadius);
                ctx.rotate(-gearAngle);

                ctx.strokeStyle = `rgba(255, 180, 80, ${0.8})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                for(let t = 0; t < teeth; t++) {
                    const toothAngle = (Math.PI * 2 / teeth) * t;
                    const innerRadius = 12;
                    const outerRadius = 20;
                    
                    const x1 = Math.cos(toothAngle) * innerRadius;
                    const y1 = Math.sin(toothAngle) * innerRadius;
                    const x2 = Math.cos(toothAngle + Math.PI/teeth) * outerRadius;
                    const y2 = Math.sin(toothAngle + Math.PI/teeth) * outerRadius;
                    const x3 = Math.cos(toothAngle + Math.PI*2/teeth - Math.PI/teeth) * outerRadius;
                    const y3 = Math.sin(toothAngle + Math.PI*2/teeth - Math.PI/teeth) * outerRadius;
                    const x4 = Math.cos(toothAngle + Math.PI*2/teeth) * innerRadius;
                    const y4 = Math.sin(toothAngle + Math.PI*2/teeth) * innerRadius;

                    if(t === 0) ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.lineTo(x3, y3);
                    ctx.lineTo(x4, y4);
                }
                ctx.closePath();
                ctx.stroke();
                ctx.restore();

                ctx.strokeStyle = `rgba(255, 140, 60, ${0.5})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(gearAngle) * gearRadius, Math.sin(gearAngle) * gearRadius);
                ctx.stroke();
            }

            const sparks = 15;
            for(let i = 0; i < sparks; i++) {
                const sparkAngle = (Math.PI * 2 / sparks) * i + rotation * 2;
                const sparkRadius = 40 + Math.sin(time * 0.001 + i) * 10;
                const sparkSize = 3 + Math.sin(time * 0.003 + i) * 2;

                ctx.fillStyle = `rgba(255, 200, 100, ${0.9})`;
                ctx.beginPath();
                ctx.arc(Math.cos(sparkAngle) * sparkRadius, Math.sin(sparkAngle) * sparkRadius, sparkSize, 0, Math.PI * 2);
                ctx.fill();
            }

            const furnaceGlow = Math.sin(time * 0.0025) * 0.4 + 0.6;
            ctx.fillStyle = `rgba(255, 240, 180, ${furnaceGlow})`;
            ctx.shadowColor = 'rgba(255, 150, 50, 0.9)';
            ctx.shadowBlur = 35;
            ctx.beginPath();
            ctx.arc(0, 0, 16 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(255, 150, 50, ${attackAnimation})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, 140 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob6() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.0016) * 0.35 + 1;
            const rotation = time * 0.00035;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 45) * 4;
                ctx.translate(0, shake);
            }

            const crystalGlow = Math.sin(time * 0.0013) * 0.5 + 0.5;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 65);
            gradient.addColorStop(0, `rgba(180, 100, 255, ${crystalGlow * 0.8})`);
            gradient.addColorStop(0.6, `rgba(150, 80, 230, ${crystalGlow * 0.5})`);
            gradient.addColorStop(1, `rgba(120, 60, 200, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 65 * pulse, 0, Math.PI * 2);
            ctx.fill();

            const shards = 8;
            for(let s = 0; s < shards; s++) {
                const shardAngle = (Math.PI * 2 / shards) * s + rotation;
                const shardLength = 85 + Math.sin(time * 0.001 + s) * 15;

                ctx.save();
                ctx.rotate(shardAngle);
                
                ctx.fillStyle = `rgba(200, 120, 255, ${0.7})`;
                ctx.beginPath();
                ctx.moveTo(20, 0);
                ctx.lineTo(shardLength, -12);
                ctx.lineTo(shardLength, 12);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = `rgba(180, 100, 240, ${0.9})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(20, 0);
                ctx.lineTo(shardLength, -12);
                ctx.moveTo(20, 0);
                ctx.lineTo(shardLength, 12);
                ctx.stroke();
                ctx.restore();
            }

            const facets = 12;
            for(let f = 0; f < facets; f++) {
                const facetAngle = (Math.PI * 2 / facets) * f;
                const facetRadius = 35 + Math.sin(time * 0.001 + f * 3) * 5;

                ctx.strokeStyle = `rgba(220, 140, 255, ${0.4})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                for(let v = 0; v < 3; v++) {
                    const vertexAngle = facetAngle + (Math.PI * 2 / 3) * v;
                    const x = Math.cos(vertexAngle) * facetRadius;
                    const y = Math.sin(vertexAngle) * facetRadius;
                    if(v === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.stroke();
            }

            const prismGlow = Math.sin(time * 0.0022) * 0.3 + 0.7;
            ctx.fillStyle = `rgba(255, 220, 255, ${prismGlow})`;
            ctx.shadowColor = 'rgba(180, 100, 255, 0.9)';
            ctx.shadowBlur = 40;
            ctx.beginPath();
            ctx.arc(0, 0, 14 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            const innerShine = Math.sin(time * 0.003) * 0.4 + 0.6;
            ctx.strokeStyle = `rgba(255, 200, 255, ${innerShine})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            for(let i = 0; i < 6; i++) {
                const rayAngle = (Math.PI * 2 / 6) * i + rotation;
                const rayLength = 45;
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(rayAngle) * rayLength, Math.sin(rayAngle) * rayLength);
            }
            ctx.stroke();

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(180, 100, 255, ${attackAnimation})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 160 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob7() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.0011) * 0.2 + 1;
            const rotation = time * 0.00025;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 55) * 5;
                ctx.translate(shake, shake * 0.5);
            }

            const voidGlow = Math.sin(time * 0.0014) * 0.4 + 0.6;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 75);
            gradient.addColorStop(0, `rgba(50, 50, 150, ${voidGlow * 0.7})`);
            gradient.addColorStop(0.4, `rgba(30, 30, 120, ${voidGlow * 0.4})`);
            gradient.addColorStop(1, `rgba(10, 10, 80, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 75 * pulse, 0, Math.PI * 2);
            ctx.fill();

            const eventHorizon = 45;
            ctx.strokeStyle = `rgba(100, 100, 255, ${0.6})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, eventHorizon + Math.sin(time * 0.001) * 5, 0, Math.PI * 2);
            ctx.stroke();

            const accretionArms = 4;
            for(let a = 0; a < accretionArms; a++) {
                const armAngle = (Math.PI * 2 / accretionArms) * a + rotation;
                const armTurns = 2;
                
                ctx.strokeStyle = `rgba(80, 80, 220, ${0.5})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                for(let p = 0; p <= 100; p++) {
                    const progress = p / 100;
                    const spiralRadius = eventHorizon + progress * 60;
                    const spiralAngle = armAngle + progress * Math.PI * 2 * armTurns;
                    
                    const x = Math.cos(spiralAngle) * spiralRadius;
                    const y = Math.sin(spiralAngle) * spiralRadius;
                    
                    if(p === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            const singularities = 3;
            for(let s = 0; s < singularities; s++) {
                const singularityAngle = (Math.PI * 2 / singularities) * s + rotation * 0.5;
                const singularityDistance = 100;
                
                ctx.fillStyle = `rgba(120, 120, 255, ${0.8})`;
                ctx.beginPath();
                ctx.arc(
                    Math.cos(singularityAngle) * singularityDistance,
                    Math.sin(singularityAngle) * singularityDistance,
                    12 + Math.sin(time * 0.002 + s) * 3,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            }

            const abyssCore = Math.sin(time * 0.0018) * 0.4 + 0.6;
            ctx.fillStyle = `rgba(200, 200, 255, ${abyssCore})`;
            ctx.shadowColor = 'rgba(50, 50, 150, 0.8)';
            ctx.shadowBlur = 50;
            ctx.beginPath();
            ctx.arc(0, 0, 20 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            const gravitationalLines = 8;
            for(let l = 0; l < gravitationalLines; l++) {
                const lineAngle = (Math.PI * 2 / gravitationalLines) * l;
                const lineLength = 120;
                
                ctx.strokeStyle = `rgba(70, 70, 200, ${0.3 + Math.sin(time * 0.001 + l) * 0.2})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(lineAngle) * lineLength, Math.sin(lineAngle) * lineLength);
                ctx.stroke();
            }

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(50, 50, 150, ${attackAnimation})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, 180 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob8() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.0013) * 0.3 + 1;
            const rotation = time * 0.00045;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 60) * 7;
                ctx.translate(shake * 0.3, shake);
            }

            const solarFlare = Math.sin(time * 0.0016) * 0.5 + 0.5;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 80);
            gradient.addColorStop(0, `rgba(255, 255, 100, ${solarFlare * 0.9})`);
            gradient.addColorStop(0.3, `rgba(255, 200, 50, ${solarFlare * 0.7})`);
            gradient.addColorStop(0.7, `rgba(255, 150, 30, ${solarFlare * 0.4})`);
            gradient.addColorStop(1, `rgba(255, 100, 20, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            for(let a = 0; a < Math.PI * 2; a += 0.05) {
                const radius = 80 + Math.sin(a * 8 + time * 0.002) * 20;
                const x = Math.cos(a) * radius;
                const y = Math.sin(a) * radius;
                if(a === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();

            const prominenceCount = 12;
            for(let p = 0; p < prominenceCount; p++) {
                const prominenceAngle = (Math.PI * 2 / prominenceCount) * p + rotation;
                const prominenceLength = 110 + Math.sin(time * 0.001 + p) * 25;
                
                ctx.strokeStyle = `rgba(255, 180, 60, ${0.7})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                for(let s = 1; s <= 8; s++) {
                    const segment = s / 8;
                    const turbulence = Math.sin(segment * Math.PI * 4 + time * 0.003 + p) * 15;
                    const x = Math.cos(prominenceAngle) * prominenceLength * segment + Math.cos(prominenceAngle + Math.PI/2) * turbulence;
                    const y = Math.sin(prominenceAngle) * prominenceLength * segment + Math.sin(prominenceAngle + Math.PI/2) * turbulence;
                    ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            const coronaRings = 5;
            for(let r = 0; r < coronaRings; r++) {
                const ringRadius = 50 + r * 15;
                const ringPulse = Math.sin(time * 0.001 + r * 0.5) * 0.3 + 0.7;
                
                ctx.strokeStyle = `rgba(255, 220, 100, ${ringPulse * 0.6})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, ringRadius, 0, Math.PI * 2);
                ctx.stroke();
            }

            const sunspots = 6;
            for(let s = 0; s < sunspots; s++) {
                const spotAngle = (Math.PI * 2 / sunspots) * s + rotation * 0.8;
                const spotDistance = 40;
                const spotSize = 10 + Math.sin(time * 0.002 + s) * 3;
                
                ctx.fillStyle = `rgba(200, 100, 30, ${0.9})`;
                ctx.beginPath();
                ctx.arc(
                    Math.cos(spotAngle) * spotDistance,
                    Math.sin(spotAngle) * spotDistance,
                    spotSize,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            }

            const solarCore = Math.sin(time * 0.002) * 0.4 + 0.6;
            ctx.fillStyle = `rgba(255, 255, 200, ${solarCore})`;
            ctx.shadowColor = 'rgba(255, 255, 100, 0.9)';
            ctx.shadowBlur = 60;
            ctx.beginPath();
            ctx.arc(0, 0, 25 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(255, 200, 50, ${attackAnimation})`;
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.arc(0, 0, 200 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob9() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.0017) * 0.25 + 1;
            const rotation = time * 0.00055;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 38) * 6;
                ctx.translate(shake, shake * 0.7);
            }

            const quantumGlow = Math.sin(time * 0.0012) * 0.6 + 0.4;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 70);
            gradient.addColorStop(0, `rgba(100, 255, 255, ${quantumGlow * 0.8})`);
            gradient.addColorStop(0.4, `rgba(80, 220, 220, ${quantumGlow * 0.5})`);
            gradient.addColorStop(0.8, `rgba(60, 180, 180, ${quantumGlow * 0.3})`);
            gradient.addColorStop(1, `rgba(40, 140, 140, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            const points = 7;
            for(let p = 0; p <= points; p++) {
                const angle = (Math.PI * 2 / points) * p;
                const radius = 70 + Math.sin(angle * 3 + time * 0.001) * 10;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                if(p === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();

            const probabilityWaves = 9;
            for(let w = 0; w < probabilityWaves; w++) {
                const waveAngle = (Math.PI * 2 / probabilityWaves) * w + rotation;
                const waveAmplitude = 20;
                const waveFrequency = 3;
                
                ctx.strokeStyle = `rgba(150, 255, 255, ${0.6})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                for(let p = 0; p <= 50; p++) {
                    const progress = p / 50;
                    const distance = 30 + progress * 80;
                    const waveOffset = Math.sin(progress * Math.PI * waveFrequency + time * 0.002 + w) * waveAmplitude;
                    
                    const x = Math.cos(waveAngle) * distance + Math.cos(waveAngle + Math.PI/2) * waveOffset;
                    const y = Math.sin(waveAngle) * distance + Math.sin(waveAngle + Math.PI/2) * waveOffset;
                    
                    if(p === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            const superpositionStates = 5;
            for(let s = 0; s < superpositionStates; s++) {
                const stateAngle = (Math.PI * 2 / superpositionStates) * s + rotation * 1.5;
                const stateDistance = 55;
                const stateSize = 15 + Math.sin(time * 0.0015 + s) * 5;
                
                ctx.save();
                ctx.translate(Math.cos(stateAngle) * stateDistance, Math.sin(stateAngle) * stateDistance);
                
                ctx.strokeStyle = `rgba(100, 240, 240, ${0.8})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, stateSize, 0, Math.PI * 2);
                ctx.stroke();
                
                const innerPoints = 4;
                for(let ip = 0; ip < innerPoints; ip++) {
                    const pointAngle = (Math.PI * 2 / innerPoints) * ip;
                    const pointDistance = stateSize * 0.6;
                    
                    ctx.fillStyle = `rgba(150, 255, 255, ${0.9})`;
                    ctx.beginPath();
                    ctx.arc(
                        Math.cos(pointAngle) * pointDistance,
                        Math.sin(pointAngle) * pointDistance,
                        4,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                }
                ctx.restore();
            }

            const uncertaintyRing = 35;
            ctx.strokeStyle = `rgba(120, 255, 255, ${0.7})`;
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.arc(0, 0, uncertaintyRing + Math.sin(time * 0.001) * 5, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);

            const quantumCore = Math.sin(time * 0.0019) * 0.5 + 0.5;
            ctx.fillStyle = `rgba(220, 255, 255, ${quantumCore})`;
            ctx.shadowColor = 'rgba(100, 255, 255, 0.8)';
            ctx.shadowBlur = 45;
            ctx.beginPath();
            ctx.arc(0, 0, 22 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(100, 255, 255, ${attackAnimation})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, 170 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob10() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.0014) * 0.35 + 1;
            const rotation = time * 0.0004;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 42) * 8;
                ctx.translate(shake * 0.5, -shake);
            }

            const cosmicBloom = Math.sin(time * 0.0015) * 0.5 + 0.5;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 90);
            gradient.addColorStop(0, `rgba(255, 100, 255, ${cosmicBloom * 0.8})`);
            gradient.addColorStop(0.3, `rgba(230, 80, 230, ${cosmicBloom * 0.6})`);
            gradient.addColorStop(0.7, `rgba(200, 60, 200, ${cosmicBloom * 0.4})`);
            gradient.addColorStop(1, `rgba(170, 40, 170, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            const petals = 6;
            for(let p = 0; p <= petals; p++) {
                const angle = (Math.PI * 2 / petals) * p;
                const radius = 90 + Math.sin(angle * 4 + time * 0.001) * 25;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                if(p === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();

            const stamenFilaments = 8;
            for(let f = 0; f < stamenFilaments; f++) {
                const filamentAngle = (Math.PI * 2 / stamenFilaments) * f + rotation;
                const filamentLength = 130;
                const filamentWave = Math.sin(time * 0.002 + f) * 20;
                
                ctx.strokeStyle = `rgba(255, 150, 255, ${0.7})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                for(let s = 1; s <= 10; s++) {
                    const segment = s / 10;
                    const x = Math.cos(filamentAngle) * filamentLength * segment;
                    const y = Math.sin(filamentAngle) * filamentLength * segment + Math.sin(segment * Math.PI * 3) * filamentWave;
                    ctx.lineTo(x, y);
                }
                ctx.stroke();
                
                const antherSize = 12 + Math.sin(time * 0.0015 + f) * 4;
                ctx.fillStyle = `rgba(255, 200, 255, ${0.9})`;
                ctx.beginPath();
                ctx.arc(
                    Math.cos(filamentAngle) * filamentLength,
                    Math.sin(filamentAngle) * filamentLength,
                    antherSize,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            }

            const nectarDrops = 12;
            for(let d = 0; d < nectarDrops; d++) {
                const dropAngle = (Math.PI * 2 / nectarDrops) * d + rotation * 0.7;
                const dropDistance = 60 + Math.sin(time * 0.001 + d * 2) * 15;
                const dropSize = 8 + Math.sin(time * 0.002 + d) * 3;
                
                ctx.fillStyle = `rgba(255, 180, 255, ${0.8})`;
                ctx.beginPath();
                ctx.arc(
                    Math.cos(dropAngle) * dropDistance,
                    Math.sin(dropAngle) * dropDistance,
                    dropSize,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
                
                ctx.strokeStyle = `rgba(255, 120, 255, ${0.6})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(
                    Math.cos(dropAngle) * dropDistance,
                    Math.sin(dropAngle) * dropDistance
                );
                ctx.stroke();
            }

            const pollenClouds = 4;
            for(let c = 0; c < pollenClouds; c++) {
                const cloudAngle = (Math.PI * 2 / pollenClouds) * c + rotation * 0.5;
                const cloudDistance = 40;
                
                ctx.fillStyle = `rgba(255, 220, 255, ${0.6})`;
                ctx.beginPath();
                for(let p = 0; p < 5; p++) {
                    const particleAngle = (Math.PI * 2 / 5) * p;
                    const particleDistance = 15 + Math.sin(time * 0.001 + c * 3 + p) * 5;
                    const x = Math.cos(cloudAngle) * cloudDistance + Math.cos(particleAngle) * particleDistance;
                    const y = Math.sin(cloudAngle) * cloudDistance + Math.sin(particleAngle) * particleDistance;
                    if(p === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();
            }

            const blossomCore = Math.sin(time * 0.0021) * 0.4 + 0.6;
            ctx.fillStyle = `rgba(255, 240, 255, ${blossomCore})`;
            ctx.shadowColor = 'rgba(255, 100, 255, 0.9)';
            ctx.shadowBlur = 55;
            ctx.beginPath();
            ctx.arc(0, 0, 30 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            const innerPattern = 10;
            for(let i = 0; i < innerPattern; i++) {
                const patternAngle = (Math.PI * 2 / innerPattern) * i + rotation;
                const patternLength = 45;
                
                ctx.strokeStyle = `rgba(255, 180, 255, ${0.5})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(patternAngle) * patternLength, Math.sin(patternAngle) * patternLength);
                ctx.stroke();
            }

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(255, 100, 255, ${attackAnimation})`;
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.arc(0, 0, 190 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        const mobDrawers = [
            drawMob1,
            drawMob2,
            drawMob3,
            drawMob4,
            drawMob5,
            drawMob6,
            drawMob7,
            drawMob8,
            drawMob9,
            drawMob10
        ];

        function updateMob() {
            mobScale = 1;
            mobRotation = 0;
            isMobAlive = true;
            deathAnimation = 0;

            mobPosition.x = canvas.width / 2;
            mobPosition.y = canvas.height / 2;
        }

        function damageMob() {
            if(!isMobAlive) return;

            mobs[currentMob].health--;

            damageEffects.push(new DamageEffect(mobPosition.x, mobPosition.y, 'hit'));
            attackAnimation = 1.0;

            mobScale = 0.9;

            if(mobs[currentMob].health <= 0) {
                isMobAlive = false;
                deathAnimation = 1.0;
                damageEffects.push(new DamageEffect(mobPosition.x, mobPosition.y, 'death'));

                setTimeout(() => {
                    currentMob = (currentMob + 1) % mobs.length;
                    mobs[currentMob].health = mobs[currentMob].maxHealth;
                    updateMob();
                }, 0);
            }
        }

        function drawScene() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if(attackAnimation > 0) {
                attackAnimation -= 0.05;
                mobScale = Math.min(mobScale + 0.02, 1);
            }

            if(deathAnimation > 0) {
                deathAnimation -= 0.02;
                mobScale *= 0.98;
                mobRotation += 0.1;
            }

            if(isMobAlive || deathAnimation > 0) {
                mobDrawers[currentMob]();
            }

            damageEffects = damageEffects.filter(effect => effect.update());
            damageEffects.forEach(effect => effect.draw());
        }

        canvas.addEventListener('click', (e) => {
            if(!isMobAlive) return;

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            let isHit = false;

            if(currentMob === 2) {
                const groundLevel = canvas.height * 0.7;
                const distanceX = Math.abs(clickX - mobPosition.x);
                const distanceY = Math.abs(clickY - groundLevel);

                if(distanceX < 100 * mobs[currentMob].scaleFactor &&
                   clickY < groundLevel && clickY > groundLevel - 350) {
                    isHit = true;
                }
            } else {
                const distance = Math.sqrt(
                    Math.pow(clickX - mobPosition.x, 2) +
                    Math.pow(clickY - mobPosition.y, 2)
                );
                isHit = distance < 100 * mobs[currentMob].scaleFactor;
            }

            if(isHit) {
                damageMob();
            }
        });

        updateMob();

        function gameLoop() {
            drawScene();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
