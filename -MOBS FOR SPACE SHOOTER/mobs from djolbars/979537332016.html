<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Игровые мобы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            touch-action: none;
        }
        body {
            overflow: hidden;
            background: #000;
            height: 100vh;
            position: relative;
            font-family: monospace;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        let currentMob = 0;
        const mobs = [
            { id: 1, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 2, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 3, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 4, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 5, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 6, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 7, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 8, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 9, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 10, health: 1, maxHealth: 1, scaleFactor: 2.0 }
        ];

        let damageEffects = [];
        let mobPosition = { x: 0, y: 0 };
        let mobScale = 1;
        let mobRotation = 0;
        let isMobAlive = true;
        let attackAnimation = 0;
        let deathAnimation = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            mobPosition.x = canvas.width / 2;
            mobPosition.y = canvas.height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        class DamageEffect {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.life = 1.0;
                this.size = type === 'hit' ? 20 : 50;
                this.particles = [];

                if(type === 'hit') {
                    for(let i = 0; i < 8; i++) {
                        this.particles.push({
                            x: 0,
                            y: 0,
                            vx: (Math.random() - 0.5) * 10,
                            vy: (Math.random() - 0.5) * 10 - 5,
                            life: 1.0
                        });
                    }
                } else {
                    for(let i = 0; i < 20; i++) {
                        this.particles.push({
                            x: 0,
                            y: 0,
                            vx: (Math.random() - 0.5) * 15,
                            vy: (Math.random() - 0.5) * 15 - 8,
                            life: 1.0,
                            color: `hsl(${Math.random() * 60}, 100%, 60%)`
                        });
                    }
                }
            }

            update() {
                this.life -= 0.03;
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.3;
                    p.life -= 0.02;
                });
                return this.life > 0;
            }

            draw() {
                if(this.type === 'hit') {
                    ctx.save();
                    ctx.translate(this.x, this.y);

                    ctx.fillStyle = `rgba(255, 50, 50, ${this.life * 0.7})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * this.life, 0, Math.PI * 2);
                    ctx.fill();

                    this.particles.forEach(p => {
                        if(p.life > 0) {
                            ctx.fillStyle = `rgba(255, 100, 100, ${p.life})`;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    });

                    ctx.restore();
                } else {
                    ctx.save();
                    ctx.translate(this.x, this.y);

                    ctx.fillStyle = `rgba(255, 200, 50, ${this.life * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * (1 - this.life), 0, Math.PI * 2);
                    ctx.fill();

                    this.particles.forEach(p => {
                        if(p.life > 0) {
                            ctx.fillStyle = p.color.replace(')', `, ${p.life})`).replace('hsl', 'hsla');
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, 4 * p.life, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    });

                    ctx.restore();
                }
            }
        }

        function drawMob1() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.0015) * 0.2 + 1;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 30) * 5;
                ctx.translate(shake, 0);
            }

            const glow = Math.sin(time * 0.002) * 0.3 + 0.7;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 40);
            gradient.addColorStop(0, `rgba(180, 100, 230, ${glow * 0.9})`);
            gradient.addColorStop(1, `rgba(130, 50, 200, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 40 * pulse, 0, Math.PI * 2);
            ctx.fill();

            const symbols = ['☉', '☾', '♆', '⚷', '♇', '⚸'];
            const symbolCount = symbols.length;

            for(let i = 0; i < symbolCount; i++) {
                const angle = (Math.PI * 2 / symbolCount) * i + time * 0.0003;
                const radius = 60 + Math.sin(time * 0.001 + i) * 10;
                const symbolGlow = Math.sin(time * 0.002 + i) * 0.4 + 0.6;

                ctx.save();
                ctx.translate(Math.cos(angle) * radius, Math.sin(angle) * radius);
                ctx.rotate(angle + Math.PI/2);

                ctx.fillStyle = `rgba(200, 150, 250, ${symbolGlow})`;
                ctx.font = '20px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(symbols[i], 0, 0);

                ctx.strokeStyle = `rgba(180, 130, 230, ${symbolGlow * 0.5})`;
                ctx.strokeText(symbols[i], 0, 0);

                ctx.restore();
            }

            const lines = 8;
            for(let i = 0; i < lines; i++) {
                const lineAngle = (Math.PI * 2 / lines) * i + time * 0.0002;
                const lineLength = 80 + Math.sin(time * 0.001 + i) * 20;

                ctx.strokeStyle = `rgba(150, 100, 220, ${0.4 + Math.sin(time * 0.003 + i) * 0.3})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(lineAngle) * lineLength, Math.sin(lineAngle) * lineLength);
                ctx.stroke();

                ctx.fillStyle = `rgba(180, 130, 240, ${0.6 + Math.sin(time * 0.002 + i) * 0.3})`;
                ctx.beginPath();
                ctx.arc(Math.cos(lineAngle) * lineLength, Math.sin(lineAngle) * lineLength, 6, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = `rgba(255, 255, 200, ${glow})`;
            ctx.shadowColor = 'rgba(200, 150, 255, 0.8)';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(-15, -15, 8 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(15, -15, 8 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(200, 150, 255, ${attackAnimation})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 100 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob2() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.002) * 0.3 + 0.8;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 30) * 5;
                ctx.translate(shake, 0);
            }

            const coreGlow = Math.sin(time * 0.001) * 0.5 + 0.5;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 60);
            gradient.addColorStop(0, `rgba(255, 100, 80, ${coreGlow})`);
            gradient.addColorStop(0.7, `rgba(200, 60, 40, ${coreGlow * 0.6})`);
            gradient.addColorStop(1, `rgba(150, 30, 20, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 60 * pulse, 0, Math.PI * 2);
            ctx.fill();

            const rings = 5;
            for(let r = 0; r < rings; r++) {
                const ringRadius = 40 + r * 25;
                const ringWidth = 3;
                const ringAlpha = 0.6 - r * 0.12;

                ctx.strokeStyle = `rgba(255, 140, 100, ${ringAlpha})`;
                ctx.lineWidth = ringWidth;
                ctx.beginPath();
                ctx.arc(0, 0, ringRadius + Math.sin(time * 0.003 + r) * 5, 0, Math.PI * 2);
                ctx.stroke();

                const spikes = 8 + r * 2;
                for(let s = 0; s < spikes; s++) {
                    const spikeAngle = (Math.PI * 2 / spikes) * s + time * 0.0005 * r;
                    const spikeLength = 15 + Math.sin(time * 0.002 + s) * 5;

                    ctx.save();
                    ctx.rotate(spikeAngle);
                    ctx.translate(ringRadius, 0);

                    ctx.fillStyle = `rgba(255, 160, 120, ${0.7 - r * 0.1})`;
                    ctx.beginPath();
                    ctx.moveTo(0, -3);
                    ctx.lineTo(spikeLength, 0);
                    ctx.lineTo(0, 3);
                    ctx.closePath();
                    ctx.fill();

                    ctx.restore();
                }
            }

            const orbs = 4;
            for(let o = 0; o < orbs; o++) {
                const orbAngle = (Math.PI * 2 / orbs) * o + time * 0.0007;
                const orbRadius = 90;
                const orbX = Math.cos(orbAngle) * orbRadius;
                const orbY = Math.sin(orbAngle) * orbRadius;
                const orbSize = 12 + Math.sin(time * 0.005 + o) * 4;

                ctx.fillStyle = `rgba(255, 180, 140, ${0.9})`;
                ctx.beginPath();
                ctx.arc(orbX, orbY, orbSize, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = `rgba(255, 120, 80, 0.6)`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(orbX, orbY);
                ctx.stroke();
            }

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(255, 100, 80, ${attackAnimation})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, 130 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob3() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const wave = Math.sin(time * 0.001) * 0.4 + 0.6;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 30) * 5;
                ctx.translate(shake, 0);
            }

            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 50);
            gradient.addColorStop(0, `rgba(80, 255, 180, ${wave * 0.8})`);
            gradient.addColorStop(1, `rgba(40, 200, 140, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 50, 0, Math.PI * 2);
            ctx.fill();

            const hexagons = 3;
            for(let h = 0; h < hexagons; h++) {
                const hexAngle = (Math.PI * 2 / hexagons) * h + time * 0.0004;
                const hexRadius = 70 + Math.sin(time * 0.002 + h) * 15;
                const hexSize = 20;

                ctx.save();
                ctx.translate(Math.cos(hexAngle) * hexRadius, Math.sin(hexAngle) * hexRadius);
                ctx.rotate(hexAngle);

                ctx.strokeStyle = `rgba(100, 255, 200, ${0.7})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                for(let s = 0; s < 6; s++) {
                    const angle = (Math.PI * 2 / 6) * s;
                    const x = Math.cos(angle) * hexSize;
                    const y = Math.sin(angle) * hexSize;
                    if(s === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.stroke();

                ctx.fillStyle = `rgba(120, 255, 220, ${0.5})`;
                ctx.beginPath();
                ctx.arc(0, 0, 8, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            const particles = 16;
            for(let i = 0; i < particles; i++) {
                const partAngle = (Math.PI * 2 / particles) * i + time * 0.0008;
                const partRadius = 35 + Math.sin(time * 0.003 + i * 0.5) * 10;
                const partX = Math.cos(partAngle) * partRadius;
                const partY = Math.sin(partAngle) * partRadius;

                ctx.fillStyle = `rgba(150, 255, 230, ${0.8})`;
                ctx.beginPath();
                ctx.arc(partX, partY, 5, 0, Math.PI * 2);
                ctx.fill();
            }

            const lines = 12;
            for(let i = 0; i < lines; i++) {
                const lineAngle = (Math.PI * 2 / lines) * i;
                const lineLength = 95;

                ctx.strokeStyle = `rgba(80, 240, 190, ${0.4})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(lineAngle) * lineLength, Math.sin(lineAngle) * lineLength);
                ctx.stroke();
            }

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(80, 255, 180, ${attackAnimation})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 110 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob4() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const throb = Math.sin(time * 0.0012) * 0.3 + 0.7;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 30) * 5;
                ctx.translate(shake, 0);
            }

            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 45);
            gradient.addColorStop(0, `rgba(255, 220, 100, ${throb * 0.9})`);
            gradient.addColorStop(1, `rgba(230, 180, 60, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 45 * throb, 0, Math.PI * 2);
            ctx.fill();

            const crystals = 5;
            for(let c = 0; c < crystals; c++) {
                const crystalAngle = (Math.PI * 2 / crystals) * c + time * 0.0006;
                const crystalDist = 75 + Math.sin(time * 0.001 + c) * 20;

                ctx.save();
                ctx.translate(Math.cos(crystalAngle) * crystalDist, Math.sin(crystalAngle) * crystalDist);
                ctx.rotate(crystalAngle);

                ctx.fillStyle = `rgba(255, 240, 150, ${0.8})`;
                ctx.beginPath();
                ctx.moveTo(0, -12);
                ctx.lineTo(10, 0);
                ctx.lineTo(0, 12);
                ctx.lineTo(-10, 0);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = `rgba(255, 200, 80, 0.9)`;
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();
            }

            const innerRing = 30;
            const points = 8;
            for(let p = 0; p < points; p++) {
                const pointAngle = (Math.PI * 2 / points) * p + time * 0.0005;
                const pointX = Math.cos(pointAngle) * innerRing;
                const pointY = Math.sin(pointAngle) * innerRing;

                ctx.fillStyle = `rgba(255, 255, 200, ${0.9})`;
                ctx.beginPath();
                ctx.arc(pointX, pointY, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = `rgba(255, 230, 100, 0.7)`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(pointX, pointY);
                ctx.stroke();
            }

            const arcs = 3;
            for(let a = 0; a < arcs; a++) {
                const arcStart = (Math.PI * 2 / arcs) * a + time * 0.0003;
                const arcEnd = arcStart + Math.PI * 0.6;

                ctx.strokeStyle = `rgba(255, 210, 70, ${0.6})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, 55, arcStart, arcEnd);
                ctx.stroke();
            }

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(255, 220, 100, ${attackAnimation})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 105 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob5() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.001) * 0.2 + 0.8;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 30) * 5;
                ctx.translate(shake, 0);
            }

            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 55);
            gradient.addColorStop(0, `rgba(160, 100, 255, ${pulse * 0.8})`);
            gradient.addColorStop(1, `rgba(120, 60, 220, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 55, 0, Math.PI * 2);
            ctx.fill();

            const orbits = 4;
            for(let o = 0; o < orbits; o++) {
                const orbitRadius = 40 + o * 20;
                const orbitSpeed = time * (0.0002 + o * 0.0001);

                ctx.strokeStyle = `rgba(180, 130, 255, ${0.5 - o * 0.1})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, orbitRadius, 0, Math.PI * 2);
                ctx.stroke();

                const satellites = 3 + o * 2;
                for(let s = 0; s < satellites; s++) {
                    const satAngle = (Math.PI * 2 / satellites) * s + orbitSpeed;
                    const satX = Math.cos(satAngle) * orbitRadius;
                    const satY = Math.sin(satAngle) * orbitRadius;

                    ctx.fillStyle = `rgba(200, 150, 255, ${0.9})`;
                    ctx.beginPath();
                    ctx.arc(satX, satY, 5 + o * 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            const spikes = 7;
            for(let s = 0; s < spikes; s++) {
                const spikeAngle = (Math.PI * 2 / spikes) * s;
                const spikeLength = 90 + Math.sin(time * 0.002 + s) * 15;

                ctx.strokeStyle = `rgba(170, 120, 240, ${0.7})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(spikeAngle) * spikeLength, Math.sin(spikeAngle) * spikeLength);
                ctx.stroke();

                ctx.fillStyle = `rgba(190, 140, 255, 0.9)`;
                ctx.beginPath();
                ctx.arc(Math.cos(spikeAngle) * spikeLength, Math.sin(spikeAngle) * spikeLength, 10, 0, Math.PI * 2);
                ctx.fill();
            }

            const coreSize = 20 + Math.sin(time * 0.003) * 5;
            ctx.fillStyle = `rgba(255, 255, 220, ${pulse})`;
            ctx.beginPath();
            ctx.arc(0, 0, coreSize, 0, Math.PI * 2);
            ctx.fill();

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(160, 100, 255, ${attackAnimation})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 120 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob6() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const breath = Math.sin(time * 0.001) * 0.25 + 0.75;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 30) * 5;
                ctx.translate(shake, 0);
            }

            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 50);
            gradient.addColorStop(0, `rgba(100, 200, 255, ${breath * 0.9})`);
            gradient.addColorStop(1, `rgba(60, 150, 230, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 50 * breath, 0, Math.PI * 2);
            ctx.fill();

            const waves = 3;
            for(let w = 0; w < waves; w++) {
                const waveRadius = 65 + w * 25;
                const waveAlpha = 0.6 - w * 0.15;

                ctx.strokeStyle = `rgba(120, 180, 255, ${waveAlpha})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                for(let a = 0; a <= Math.PI * 2; a += 0.1) {
                    const ripple = Math.sin(a * 5 + time * 0.001) * 8;
                    const x = Math.cos(a) * (waveRadius + ripple);
                    const y = Math.sin(a) * (waveRadius + ripple);
                    if(a === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.stroke();
            }

            const nodes = 6;
            for(let n = 0; n < nodes; n++) {
                const nodeAngle = (Math.PI * 2 / nodes) * n + time * 0.0004;
                const nodeRadius = 85;
                const nodeX = Math.cos(nodeAngle) * nodeRadius;
                const nodeY = Math.sin(nodeAngle) * nodeRadius;
                const nodeSize = 8 + Math.sin(time * 0.005 + n) * 4;

                ctx.fillStyle = `rgba(140, 190, 255, 0.9)`;
                ctx.beginPath();
                ctx.arc(nodeX, nodeY, nodeSize, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = `rgba(100, 170, 255, 0.7)`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                const nextNode = (n + 1) % nodes;
                const nextX = Math.cos((Math.PI * 2 / nodes) * nextNode + time * 0.0004) * nodeRadius;
                const nextY = Math.sin((Math.PI * 2 / nodes) * nextNode + time * 0.0004) * nodeRadius;
                ctx.moveTo(nodeX, nodeY);
                ctx.lineTo(nextX, nextY);
                ctx.stroke();
            }

            const innerParticles = 12;
            for(let i = 0; i < innerParticles; i++) {
                const partAngle = (Math.PI * 2 / innerParticles) * i + time * 0.0006;
                const partRadius = 30 + Math.sin(time * 0.003 + i) * 10;
                const partX = Math.cos(partAngle) * partRadius;
                const partY = Math.sin(partAngle) * partRadius;

                ctx.fillStyle = `rgba(160, 200, 255, 0.8)`;
                ctx.beginPath();
                ctx.arc(partX, partY, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(100, 200, 255, ${attackAnimation})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 115 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob7() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const throb = Math.sin(time * 0.0015) * 0.3 + 0.7;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 30) * 5;
                ctx.translate(shake, 0);
            }

            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 60);
            gradient.addColorStop(0, `rgba(255, 100, 150, ${throb * 0.9})`);
            gradient.addColorStop(1, `rgba(200, 60, 100, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 60 * throb, 0, Math.PI * 2);
            ctx.fill();

            const blades = 4;
            for(let b = 0; b < blades; b++) {
                const bladeAngle = (Math.PI * 2 / blades) * b + time * 0.0005;
                const bladeLength = 95;

                ctx.save();
                ctx.rotate(bladeAngle);

                ctx.fillStyle = `rgba(255, 120, 160, 0.8)`;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(bladeLength, -15);
                ctx.lineTo(bladeLength, 15);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = `rgba(255, 80, 120, 0.9)`;
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();
            }

            const rings = 2;
            for(let r = 0; r < rings; r++) {
                const ringRadius = 40 + r * 20;
                const ringSpin = time * 0.0003 * (r + 1);

                ctx.strokeStyle = `rgba(255, 140, 180, ${0.7 - r * 0.2})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, ringRadius, 0, Math.PI * 2);
                ctx.stroke();

                const dots = 8 + r * 4;
                for(let d = 0; d < dots; d++) {
                    const dotAngle = (Math.PI * 2 / dots) * d + ringSpin;
                    const dotX = Math.cos(dotAngle) * ringRadius;
                    const dotY = Math.sin(dotAngle) * ringRadius;

                    ctx.fillStyle = `rgba(255, 160, 200, 0.9)`;
                    ctx.beginPath();
                    ctx.arc(dotX, dotY, 5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            const corePulse = Math.sin(time * 0.004) * 0.5 + 0.5;
            ctx.fillStyle = `rgba(255, 255, 220, ${corePulse})`;
            ctx.beginPath();
            ctx.arc(0, 0, 18, 0, Math.PI * 2);
            ctx.fill();

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(255, 100, 150, ${attackAnimation})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, 125 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob8() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.001) * 0.2 + 0.8;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 30) * 5;
                ctx.translate(shake, 0);
            }

            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 55);
            gradient.addColorStop(0, `rgba(80, 255, 220, ${pulse * 0.8})`);
            gradient.addColorStop(1, `rgba(40, 200, 180, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 55, 0, Math.PI * 2);
            ctx.fill();

            const geometry = 6;
            for(let g = 0; g < geometry; g++) {
                const geoAngle = (Math.PI * 2 / geometry) * g;
                const geoRadius = 80;

                ctx.save();
                ctx.translate(Math.cos(geoAngle) * geoRadius, Math.sin(geoAngle) * geoRadius);
                ctx.rotate(geoAngle);

                ctx.fillStyle = `rgba(100, 255, 240, 0.7)`;
                ctx.beginPath();
                ctx.rect(-12, -12, 24, 24);
                ctx.fill();

                ctx.strokeStyle = `rgba(60, 230, 210, 0.9)`;
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();

                ctx.strokeStyle = `rgba(80, 240, 220, 0.6)`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(geoAngle) * geoRadius, Math.sin(geoAngle) * geoRadius);
                ctx.stroke();
            }

            const innerCircle = 25;
            const points = 10;
            for(let p = 0; p < points; p++) {
                const pointAngle = (Math.PI * 2 / points) * p + time * 0.0004;
                const pointX = Math.cos(pointAngle) * innerCircle;
                const pointY = Math.sin(pointAngle) * innerCircle;

                ctx.fillStyle = `rgba(120, 255, 255, 0.9)`;
                ctx.beginPath();
                ctx.arc(pointX, pointY, 5, 0, Math.PI * 2);
                ctx.fill();
            }

            const arcs = 4;
            for(let a = 0; a < arcs; a++) {
                const arcStart = (Math.PI * 2 / arcs) * a + time * 0.0002;
                const arcEnd = arcStart + Math.PI * 0.8;

                ctx.strokeStyle = `rgba(70, 250, 230, 0.5)`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 45, arcStart, arcEnd);
                ctx.stroke();
            }

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(80, 255, 220, ${attackAnimation})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 110 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob9() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const breath = Math.sin(time * 0.0012) * 0.25 + 0.75;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 30) * 5;
                ctx.translate(shake, 0);
            }

            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 65);
            gradient.addColorStop(0, `rgba(220, 180, 80, ${breath * 0.9})`);
            gradient.addColorStop(1, `rgba(180, 140, 40, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 65 * breath, 0, Math.PI * 2);
            ctx.fill();

            const sunbeams = 8;
            for(let b = 0; b < sunbeams; b++) {
                const beamAngle = (Math.PI * 2 / sunbeams) * b + time * 0.0003;
                const beamLength = 100 + Math.sin(time * 0.002 + b) * 20;

                ctx.strokeStyle = `rgba(240, 200, 100, ${0.7})`;
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(beamAngle) * beamLength, Math.sin(beamAngle) * beamLength);
                ctx.stroke();

                ctx.fillStyle = `rgba(255, 220, 120, 0.9)`;
                ctx.beginPath();
                ctx.arc(Math.cos(beamAngle) * beamLength, Math.sin(beamAngle) * beamLength, 12, 0, Math.PI * 2);
                ctx.fill();
            }

            const innerRing = 40;
            const orbs = 6;
            for(let o = 0; o < orbs; o++) {
                const orbAngle = (Math.PI * 2 / orbs) * o + time * 0.0005;
                const orbX = Math.cos(orbAngle) * innerRing;
                const orbY = Math.sin(orbAngle) * innerRing;
                const orbSize = 10 + Math.sin(time * 0.004 + o) * 4;

                ctx.fillStyle = `rgba(255, 240, 160, 0.9)`;
                ctx.beginPath();
                ctx.arc(orbX, orbY, orbSize, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = `rgba(230, 190, 90, 0.8)`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(orbX, orbY, orbSize, 0, Math.PI * 2);
                ctx.stroke();
            }

            const corePulse = Math.sin(time * 0.005) * 0.3 + 0.7;
            ctx.fillStyle = `rgba(255, 255, 200, ${corePulse})`;
            ctx.beginPath();
            ctx.arc(0, 0, 25, 0, Math.PI * 2);
            ctx.fill();

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(220, 180, 80, ${attackAnimation})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, 135 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob10() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.001) * 0.2 + 0.8;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 30) * 5;
                ctx.translate(shake, 0);
            }

            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 70);
            gradient.addColorStop(0, `rgba(180, 80, 220, ${pulse * 0.9})`);
            gradient.addColorStop(1, `rgba(140, 40, 180, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 70, 0, Math.PI * 2);
            ctx.fill();

            const tendrils = 5;
            for(let t = 0; t < tendrils; t++) {
                const tendrilAngle = (Math.PI * 2 / tendrils) * t;
                const segments = 8;

                ctx.save();
                ctx.rotate(tendrilAngle);

                ctx.strokeStyle = `rgba(200, 100, 240, 0.8)`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, 0);

                for(let s = 1; s <= segments; s++) {
                    const segLength = s * 15;
                    const sway = Math.sin(time * 0.001 + t + s * 0.5) * 10;
                    ctx.lineTo(segLength, sway);
                }
                ctx.stroke();

                ctx.fillStyle = `rgba(220, 120, 255, 0.9)`;
                ctx.beginPath();
                const lastSeg = segments * 15;
                const lastSway = Math.sin(time * 0.001 + t + segments * 0.5) * 10;
                ctx.arc(lastSeg, lastSway, 12, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            const vortexPoints = 12;
            for(let v = 0; v < vortexPoints; v++) {
                const pointAngle = (Math.PI * 2 / vortexPoints) * v + time * 0.0006;
                const pointRadius = 45 + Math.sin(time * 0.003 + v) * 15;
                const pointX = Math.cos(pointAngle) * pointRadius;
                const pointY = Math.sin(pointAngle) * pointRadius;

                ctx.fillStyle = `rgba(190, 110, 250, 0.9)`;
                ctx.beginPath();
                ctx.arc(pointX, pointY, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = `rgba(160, 80, 230, 0.7)`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(pointX, pointY);
                ctx.stroke();
            }

            const innerCore = 20;
            ctx.fillStyle = `rgba(255, 220, 255, ${pulse})`;
            ctx.beginPath();
            ctx.arc(0, 0, innerCore, 0, Math.PI * 2);
            ctx.fill();

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(180, 80, 220, ${attackAnimation})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 140 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        const mobDrawers = [
            drawMob1,
            drawMob2,
            drawMob3,
            drawMob4,
            drawMob5,
            drawMob6,
            drawMob7,
            drawMob8,
            drawMob9,
            drawMob10
        ];

        function updateMob() {
            mobScale = 1;
            mobRotation = 0;
            isMobAlive = true;
            deathAnimation = 0;

            mobPosition.x = canvas.width / 2;
            mobPosition.y = canvas.height / 2;
        }

        function damageMob() {
            if(!isMobAlive) return;

            mobs[currentMob].health--;

            damageEffects.push(new DamageEffect(mobPosition.x, mobPosition.y, 'hit'));
            attackAnimation = 1.0;

            mobScale = 0.9;

            if(mobs[currentMob].health <= 0) {
                isMobAlive = false;
                deathAnimation = 1.0;
                damageEffects.push(new DamageEffect(mobPosition.x, mobPosition.y, 'death'));

                setTimeout(() => {
                    currentMob = (currentMob + 1) % mobs.length;
                    mobs[currentMob].health = mobs[currentMob].maxHealth;
                    updateMob();
                }, 0);
            }
        }

        function drawScene() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if(attackAnimation > 0) {
                attackAnimation -= 0.05;
                mobScale = Math.min(mobScale + 0.02, 1);
            }

            if(deathAnimation > 0) {
                deathAnimation -= 0.02;
                mobScale *= 0.98;
                mobRotation += 0.1;
            }

            if(isMobAlive || deathAnimation > 0) {
                mobDrawers[currentMob]();
            }

            damageEffects = damageEffects.filter(effect => effect.update());
            damageEffects.forEach(effect => effect.draw());
        }

        canvas.addEventListener('click', (e) => {
            if(!isMobAlive) return;

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            let isHit = false;

            const distance = Math.sqrt(
                Math.pow(clickX - mobPosition.x, 2) +
                Math.pow(clickY - mobPosition.y, 2)
            );
            isHit = distance < 100 * mobs[currentMob].scaleFactor;

            if(isHit) {
                damageMob();
            }
        });

        updateMob();

        function gameLoop() {
            drawScene();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
