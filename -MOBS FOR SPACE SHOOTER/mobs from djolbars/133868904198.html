<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<body>
    <canvas id="game"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        let currentMob = 0;
        const mobs = [
            { id: 1, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 2, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 3, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 4, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 5, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 6, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 7, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 8, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 9, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 10, health: 1, maxHealth: 1, scaleFactor: 2.0 }
        ];

        let damageEffects = [];
        let mobPosition = { x: 0, y: 0 };
        let mobScale = 1;
        let mobRotation = 0;
        let isMobAlive = true;
        let attackAnimation = 0;
        let deathAnimation = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            mobPosition.x = canvas.width / 2;
            mobPosition.y = canvas.height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        class DamageEffect {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.life = 1.0;
                this.size = type === 'hit' ? 20 : 50;
                this.particles = [];

                if(type === 'hit') {
                    for(let i = 0; i < 8; i++) {
                        this.particles.push({
                            x: 0,
                            y: 0,
                            vx: (Math.random() - 0.5) * 10,
                            vy: (Math.random() - 0.5) * 10 - 5,
                            life: 1.0
                        });
                    }
                } else {
                    for(let i = 0; i < 20; i++) {
                        this.particles.push({
                            x: 0,
                            y: 0,
                            vx: (Math.random() - 0.5) * 15,
                            vy: (Math.random() - 0.5) * 15 - 8,
                            life: 1.0,
                            color: `hsl(${Math.random() * 60}, 100%, 60%)`
                        });
                    }
                }
            }

            update() {
                this.life -= 0.03;
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.3;
                    p.life -= 0.02;
                });
                return this.life > 0;
            }

            draw() {
                if(this.type === 'hit') {
                    ctx.save();
                    ctx.translate(this.x, this.y);

                    ctx.fillStyle = `rgba(255, 50, 50, ${this.life * 0.7})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * this.life, 0, Math.PI * 2);
                    ctx.fill();

                    this.particles.forEach(p => {
                        if(p.life > 0) {
                            ctx.fillStyle = `rgba(255, 100, 100, ${p.life})`;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    });

                    ctx.restore();
                } else {
                    ctx.save();
                    ctx.translate(this.x, this.y);

                    ctx.fillStyle = `rgba(255, 200, 50, ${this.life * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * (1 - this.life), 0, Math.PI * 2);
                    ctx.fill();

                    this.particles.forEach(p => {
                        if(p.life > 0) {
                            ctx.fillStyle = p.color.replace(')', `, ${p.life})`).replace('hsl', 'hsla');
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, 4 * p.life, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    });

                    ctx.restore();
                }
            }
        }

        function drawMob1() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.001) * 0.15 + 0.9;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 30) * 3;
                ctx.translate(shake, 0);
            }

            const coreGlow = Math.sin(time * 0.003) * 0.4 + 0.6;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 45);
            gradient.addColorStop(0, `rgba(255, 100, 50, ${coreGlow})`);
            gradient.addColorStop(0.7, `rgba(200, 60, 30, ${coreGlow * 0.6})`);
            gradient.addColorStop(1, `rgba(150, 40, 20, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 45, 0, Math.PI * 2);
            ctx.fill();

            const tendrils = 5;
            for(let i = 0; i < tendrils; i++) {
                const angle = (Math.PI * 2 / tendrils) * i + time * 0.0004;
                const segments = 8;

                ctx.strokeStyle = `rgba(255, 80, 40, ${0.5})`;
                ctx.lineWidth = 3;
                ctx.beginPath();

                for(let j = 0; j <= segments; j++) {
                    const progress = j / segments;
                    const radius = 70 * progress;
                    const wave = Math.sin(time * 0.002 + i * 2 + progress * 5) * 15;
                    const x = Math.cos(angle) * (radius + wave);
                    const y = Math.sin(angle) * (radius + wave);

                    if(j === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();

                const endX = Math.cos(angle) * 70;
                const endY = Math.sin(angle) * 70;
                ctx.fillStyle = `rgba(255, 120, 70, ${0.8})`;
                ctx.beginPath();
                ctx.arc(endX, endY, 6, 0, Math.PI * 2);
                ctx.fill();
            }

            const rings = 3;
            for(let r = 0; r < rings; r++) {
                const ringRadius = 25 + r * 20;
                const ringSpeed = 0.0005 + r * 0.0001;
                const particles = 8 + r * 4;

                for(let i = 0; i < particles; i++) {
                    const particleAngle = (Math.PI * 2 / particles) * i + time * ringSpeed;
                    const x = Math.cos(particleAngle) * ringRadius;
                    const y = Math.sin(particleAngle) * ringRadius;
                    const size = 3 + Math.sin(time * 0.005 + i + r) * 2;

                    ctx.fillStyle = `rgba(255, 150, 100, ${0.7})`;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            ctx.fillStyle = `rgba(255, 220, 180, ${coreGlow})`;
            ctx.shadowColor = 'rgba(255, 100, 50, 0.9)';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(0, 0, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(255, 100, 50, ${attackAnimation})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 90 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob2() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.0012) * 0.2 + 0.9;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 25) * 4;
                ctx.translate(0, shake);
            }

            const hue = (time * 0.05) % 360;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 60);
            gradient.addColorStop(0, `hsla(${hue}, 100%, 60%, 0.9)`);
            gradient.addColorStop(1, `hsla(${(hue + 60) % 360}, 100%, 40%, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 60 * pulse, 0, Math.PI * 2);
            ctx.fill();

            const spikes = 12;
            for(let i = 0; i < spikes; i++) {
                const angle = (Math.PI * 2 / spikes) * i + time * 0.0003;
                const spikeLength = 50 + Math.sin(time * 0.002 + i) * 15;
                const spikeWidth = 6 + Math.sin(time * 0.003 + i) * 3;

                ctx.save();
                ctx.translate(Math.cos(angle) * 30, Math.sin(angle) * 30);
                ctx.rotate(angle);

                ctx.fillStyle = `hsla(${(hue + i * 30) % 360}, 80%, 70%, 0.8)`;
                ctx.beginPath();
                ctx.moveTo(0, -spikeWidth);
                ctx.lineTo(spikeLength, 0);
                ctx.lineTo(0, spikeWidth);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }

            const innerRingParticles = 16;
            for(let i = 0; i < innerRingParticles; i++) {
                const angle = (Math.PI * 2 / innerRingParticles) * i + time * 0.0006;
                const radius = 20 + Math.sin(time * 0.004 + i) * 5;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;

                ctx.fillStyle = `hsla(${(hue + 180) % 360}, 100%, 80%, 0.9)`;
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = `hsla(${hue}, 100%, 90%, 0.95)`;
            ctx.shadowColor = `hsla(${hue}, 100%, 60%, 0.8)`;
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.arc(0, 0, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            if(attackAnimation > 0) {
                ctx.strokeStyle = `hsla(${hue}, 100%, 70%, ${attackAnimation})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, 100 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob3() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.001) * 0.15 + 0.9;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 35) * 2;
                ctx.translate(shake, -shake);
            }

            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 55);
            gradient.addColorStop(0, 'rgba(50, 200, 150, 0.9)');
            gradient.addColorStop(0.7, 'rgba(30, 180, 130, 0.5)');
            gradient.addColorStop(1, 'rgba(20, 160, 110, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 55 * pulse, 0, Math.PI * 2);
            ctx.fill();

            const layers = 4;
            for(let l = 0; l < layers; l++) {
                const layerRadius = 20 + l * 25;
                const layerParticles = 6 + l * 3;
                const layerSpeed = 0.0002 + l * 0.0001;

                for(let i = 0; i < layerParticles; i++) {
                    const angle = (Math.PI * 2 / layerParticles) * i + time * layerSpeed + l * 0.5;
                    const x = Math.cos(angle) * layerRadius;
                    const y = Math.sin(angle) * layerRadius;
                    const size = 5 + Math.sin(time * 0.006 + i + l) * 3;

                    ctx.fillStyle = `rgba(80, 220, 170, ${0.7 - l * 0.1})`;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = `rgba(100, 240, 190, ${0.3})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                }
            }

            const arcs = 3;
            for(let i = 0; i < arcs; i++) {
                const startAngle = (Math.PI * 2 / arcs) * i + time * 0.0004;
                const arcLength = Math.PI * 0.8;

                ctx.strokeStyle = `rgba(100, 240, 200, ${0.6})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, 70, startAngle, startAngle + arcLength);
                ctx.stroke();
            }

            ctx.fillStyle = 'rgba(200, 255, 230, 0.95)';
            ctx.shadowColor = 'rgba(50, 200, 150, 0.8)';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(50, 200, 150, ${attackAnimation})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 85 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob4() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            if(attackAnimation > 0) {

            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 65);

            gradient.addColorStop(1, 'rgba(120, 40, 180, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 65 * pulse, 0, Math.PI * 2);
            ctx.fill();

            const crystals = 8;
            for(let i = 0; i < crystals; i++) {
                const angle = (Math.PI * 2 / crystals) * i + time * 0.0002;
                const crystalLength = 45 + Math.sin(time * 0.003 + i) * 10;

                ctx.save();
                ctx.translate(Math.cos(angle) * 40, Math.sin(angle) * 40);
                ctx.rotate(angle);

                ctx.fillStyle = `rgba(200, 100, 240, ${0.8})`;
                ctx.beginPath();
                ctx.moveTo(0, -6);
                ctx.lineTo(crystalLength, -10);
                ctx.lineTo(crystalLength, 10);
                ctx.lineTo(0, 6);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }

            const innerOrbits = 2;
            for(let o = 0; o < innerOrbits; o++) {
                const orbitRadius = 15 + o * 12;
                const orbitSpeed = 0.0008 + o * 0.0002;
                const orbitParticles = 5 + o * 2;

                for(let i = 0; i < orbitParticles; i++) {
                    const angle = (Math.PI * 2 / orbitParticles) * i + time * orbitSpeed;
                    const x = Math.cos(angle) * orbitRadius;
                    const y = Math.sin(angle) * orbitRadius;

                    ctx.fillStyle = `rgba(220, 140, 255, ${0.9})`;
                    ctx.beginPath();
                    ctx.arc(x, y, 5 - o * 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            const lines = 4;
            for(let i = 0; i < lines; i++) {
                const angle = (Math.PI * 2 / lines) * i + time * 0.0005;
                const lineLength = 80;

                ctx.strokeStyle = `rgba(180, 100, 230, ${0.4})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(angle) * lineLength, Math.sin(angle) * lineLength);
                ctx.stroke();
            }

            ctx.fillStyle = 'rgba(240, 180, 255, 0.95)';
            ctx.shadowColor = 'rgba(180, 80, 220, 0.9)';
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.arc(0, 0, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(180, 80, 220, ${attackAnimation})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 95 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob5() {
            ctx.save();

            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

                const shake = Math.sin(attackAnimation * 30) * 2;
                ctx.translate(0, shake);
            }

            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 70);

            gradient.addColorStop(1, 'rgba(200, 160, 30, 0)');

            ctx.fillStyle = gradient;

            ctx.arc(0, 0, 70 * pulse, 0, Math.PI * 2);
            ctx.fill();

            const sunbeams = 16;
            for(let i = 0; i < sunbeams; i++) {
                const angle = (Math.PI * 2 / sunbeams) * i + time * 0.0001;

                ctx.save();
                ctx.rotate(angle);

                ctx.fillStyle = `rgba(255, 220, 80, ${0.7})`;
                ctx.beginPath();
                ctx.moveTo(0, -beamWidth);
                ctx.lineTo(beamLength, -beamWidth * 0.3);
                ctx.lineTo(beamLength, beamWidth * 0.3);
                ctx.lineTo(0, beamWidth);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }

            const rings = 3;
            for(let r = 0; r < rings; r++) {
                const ringRadius = 25 + r * 20;
                const ringSpeed = 0.0003 + r * 0.0001;
                const ringParticles = 10 + r * 5;

                for(let i = 0; i < ringParticles; i++) {

                    const x = Math.cos(angle) * ringRadius;
                    const y = Math.sin(angle) * ringRadius;
                    const size = 4 + Math.sin(time * 0.004 + i + r) * 2;

                    ctx.fillStyle = `rgba(255, 240, 120, ${0.8})`;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            const spiralArms = 2;
            for(let a = 0; a < spiralArms; a++) {
                const startAngle = (Math.PI * 2 / spiralArms) * a + time * 0.0004;
                const segments = 12;

                ctx.strokeStyle = `rgba(255, 200, 100, ${0.5})`;
                ctx.lineWidth = 3;
                ctx.beginPath();

                for(let s = 0; s <= segments; s++) {
                    const progress = s / segments;
                    const radius = 40 * progress;
                    const angle = startAngle + progress * Math.PI * 2;
                    const x = Math.cos(angle) * radius;
                    const y = Math.sin(angle) * radius;

                    if(s === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            ctx.fillStyle = 'rgba(255, 255, 200, 0.98)';
            ctx.shadowColor = 'rgba(255, 200, 50, 0.9)';
            ctx.shadowBlur = 30;
            ctx.beginPath();
            ctx.arc(0, 0, 18, 0, Math.PI * 2);

            ctx.shadowBlur = 0;

                ctx.stroke();

            ctx.rotate(mobRotation);

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 25) * 3;

            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 50);
            gradient.addColorStop(0, 'rgba(70, 150, 255, 0.9)');
            gradient.addColorStop(0.7, 'rgba(50, 130, 230, 0.4)');
            gradient.addColorStop(1, 'rgba(30, 110, 210, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 50 * pulse, 0, Math.PI * 2);
            ctx.fill();

            const hexagons = 6;
            for(let i = 0; i < hexagons; i++) {
                const angle = (Math.PI * 2 / hexagons) * i + time * 0.0002;
                const distance = 35 + Math.sin(time * 0.003 + i) * 10;
                const size = 8 + Math.sin(time * 0.004 + i) * 3;

                ctx.save();
                ctx.translate(Math.cos(angle) * distance, Math.sin(angle) * distance);
                ctx.rotate(angle);

                ctx.fillStyle = `rgba(100, 180, 255, ${0.8})`;
                ctx.beginPath();
                for(let s = 0; s < 6; s++) {
                    const hexAngle = (Math.PI * 2 / 6) * s;
                    const x = Math.cos(hexAngle) * size;
                    const y = Math.sin(hexAngle) * size;
                    if(s === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }

            const connections = 12;
            for(let i = 0; i < connections; i++) {
                const angle1 = (Math.PI * 2 / connections) * i;
                const angle2 = (Math.PI * 2 / connections) * ((i + 5) % connections);
                const distance = 35;

                ctx.strokeStyle = `rgba(80, 170, 240, ${0.3})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(Math.cos(angle1) * distance, Math.sin(angle1) * distance);
                ctx.lineTo(Math.cos(angle2) * distance, Math.sin(angle2) * distance);
                ctx.stroke();
            }

            const innerParticles = 9;
            for(let i = 0; i < innerParticles; i++) {
                const angle = (Math.PI * 2 / innerParticles) * i + time * 0.0006;
                const radius = 12 + Math.sin(time * 0.005 + i) * 4;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;

                ctx.fillStyle = `rgba(120, 200, 255, ${0.9})`;
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = 'rgba(200, 230, 255, 0.95)';
            ctx.shadowColor = 'rgba(70, 150, 255, 0.8)';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(70, 150, 255, ${attackAnimation})`;
