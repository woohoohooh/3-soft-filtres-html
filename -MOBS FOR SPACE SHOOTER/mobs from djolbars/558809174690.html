<body>
    <canvas id="game"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        let currentMob = 0;
        const mobs = [

            { id: 9, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 10, health: 1, maxHealth: 1, scaleFactor: 2.0 }
        ];

        let damageEffects = [];

        let mobScale = 1;
        let mobRotation = 0;
        let isMobAlive = true;

        function resize() {
            canvas.width = window.innerWidth;

        window.addEventListener('resize', resize);
        resize();

        class DamageEffect {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.life = 1.0;
                this.size = type === 'hit' ? 20 : 50;
                this.particles = [];

                if(type === 'hit') {
                    for(let i = 0; i < 8; i++) {
                        this.particles.push({
                            x: 0,
                            y: 0,
                            vx: (Math.random() - 0.5) * 10,
                            vy: (Math.random() - 0.5) * 10 - 5,
                            life: 1.0
                        });
                    }
                } else {
                    for(let i = 0; i < 20; i++) {
                        this.particles.push({
                            x: 0,
                            y: 0,
                            vx: (Math.random() - 0.5) * 15,
                            vy: (Math.random() - 0.5) * 15 - 8,
                            life: 1.0,
                            color: `hsl(${Math.random() * 60}, 100%, 60%)`
                        });
                    }
                }
            }

            update() {
                this.life -= 0.03;
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.3;
                    p.life -= 0.02;
                });
                return this.life > 0;
            }

            draw() {
                if(this.type === 'hit') {
                    ctx.save();
                    ctx.translate(this.x, this.y);

                    ctx.fillStyle = `rgba(255, 50, 50, ${this.life * 0.7})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * this.life, 0, Math.PI * 2);
                    ctx.fill();

                    this.particles.forEach(p => {
                        if(p.life > 0) {
                            ctx.fillStyle = `rgba(255, 100, 100, ${p.life})`;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    });

                    ctx.restore();
                } else {
                    ctx.save();
                    ctx.translate(this.x, this.y);

                    ctx.fillStyle = `rgba(255, 200, 50, ${this.life * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * (1 - this.life), 0, Math.PI * 2);
                    ctx.fill();

                    this.particles.forEach(p => {
                        if(p.life > 0) {
                            ctx.fillStyle = p.color.replace(')', `, ${p.life})`).replace('hsl', 'hsla');
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, 4 * p.life, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    });

                    ctx.restore();
                }
            }
        }

        function drawMob1() {

                ctx.moveTo(0, 0);
                ctx.lineTo(15, 8);
                ctx.lineTo(0, 25);
                ctx.lineTo(-15, 8);
                ctx.closePath();

                ctx.strokeStyle = `rgba(255, 80, 80, ${0.5 + Math.sin(time * 0.003 + i) * 0.2})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(angle) * length, Math.sin(angle) * length);
                ctx.stroke();

                ctx.fillStyle = `rgba(255, 120, 120, ${0.7 + Math.sin(time * 0.002 + i) * 0.2})`;
                ctx.beginPath();
                ctx.arc(Math.cos(angle) * length, Math.sin(angle) * length, 8, 0, Math.PI * 2);
                ctx.fill();

            ctx.restore();

                    const angle = baseAngle + wave * 0.02;

                    const x = Math.cos(angle) * (radius + wave);
                    const y = Math.sin(angle) * (radius + wave);

                    if(j === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);

                    prevX = x;
                    prevY = y;
                }
                ctx.stroke();

                ctx.fillStyle = `rgba(200, 255, 150, ${0.8})`;

                ctx.arc(prevX, prevY, 10, 0, Math.PI * 2);

                ctx.arc(orbX, orbY, 12 * orbPulse, 0, Math.PI * 2);

            ctx.fillStyle = `rgba(255, 255, 220, ${glow})`;
            ctx.shadowColor = 'rgba(150, 255, 100, 0.9)';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.ellipse(-20, -10, 12 * pulse, 8 * pulse, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(20, -10, 12 * pulse, 8 * pulse, 0, 0, Math.PI * 2);

                ctx.arc(0, 0, 100 * (1 - attackAnimation), 0, Math.PI * 2);

            for(let i = 0; i < connectors; i++) {

        function drawMob6() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const rotation = time * 0.00055;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 30) * 5;
                ctx.translate(shake, 0);
            }

            const coreGlow = Math.sin(time * 0.0032) * 0.4 + 0.6;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 48);
            gradient.addColorStop(0, `rgba(40, 255, 200, ${coreGlow * 0.9})`);
            gradient.addColorStop(0.7, `rgba(20, 220, 180, ${coreGlow * 0.5})`);
            gradient.addColorStop(1, `rgba(10, 200, 160, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 48, 0, Math.PI * 2);
            ctx.fill();

            const spirals = 3;
            for(let s = 0; s < spirals; s++) {
                const spiralOffset = (Math.PI * 2 / spirals) * s;
                const spiralTurns = 2;
                const points = 20;

                ctx.strokeStyle = `rgba(60, 255, 220, ${0.7 - s * 0.1})`;
                ctx.lineWidth = 3;
                ctx.beginPath();

                for(let i = 0; i <= points; i++) {
                    const progress = i / points;
                    const radius = 80 * progress;
                    const angle = spiralOffset + progress * Math.PI * 2 * spiralTurns + rotation;

                    const x = Math.cos(angle) * radius;
                    const y = Math.sin(angle) * radius;

                    if(i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            const nodes = 15;
