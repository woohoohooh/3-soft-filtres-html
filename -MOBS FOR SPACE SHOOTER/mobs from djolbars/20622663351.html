<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Игровые мобы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            touch-action: none;
        }
        body {
            overflow: hidden;
            background: #000;
            height: 100vh;
            position: relative;
            font-family: monospace;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        let currentMob = 0;
        const mobs = [
            { id: 1, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 2, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 3, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 4, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 5, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 6, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 7, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 8, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 9, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 10, health: 1, maxHealth: 1, scaleFactor: 2.0 }
        ];

        let damageEffects = [];
        let mobPosition = { x: 0, y: 0 };
        let mobScale = 1;
        let mobRotation = 0;
        let isMobAlive = true;
        let attackAnimation = 0;
        let deathAnimation = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            mobPosition.x = canvas.width / 2;
            mobPosition.y = canvas.height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        class DamageEffect {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.life = 1.0;
                this.size = type === 'hit' ? 20 : 50;
                this.particles = [];

                if(type === 'hit') {
                    for(let i = 0; i < 8; i++) {
                        this.particles.push({
                            x: 0,
                            y: 0,
                            vx: (Math.random() - 0.5) * 10,
                            vy: (Math.random() - 0.5) * 10 - 5,
                            life: 1.0
                        });
                    }
                } else {
                    for(let i = 0; i < 20; i++) {
                        this.particles.push({
                            x: 0,
                            y: 0,
                            vx: (Math.random() - 0.5) * 15,
                            vy: (Math.random() - 0.5) * 15 - 8,
                            life: 1.0,
                            color: `hsl(${Math.random() * 60}, 100%, 60%)`
                        });
                    }
                }
            }

            update() {
                this.life -= 0.03;
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.3;
                    p.life -= 0.02;
                });
                return this.life > 0;
            }

            draw() {
                if(this.type === 'hit') {
                    ctx.save();
                    ctx.translate(this.x, this.y);

                    ctx.fillStyle = `rgba(255, 50, 50, ${this.life * 0.7})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * this.life, 0, Math.PI * 2);
                    ctx.fill();

                    this.particles.forEach(p => {
                        if(p.life > 0) {
                            ctx.fillStyle = `rgba(255, 100, 100, ${p.life})`;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    });

                    ctx.restore();
                } else {
                    ctx.save();
                    ctx.translate(this.x, this.y);

                    ctx.fillStyle = `rgba(255, 200, 50, ${this.life * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * (1 - this.life), 0, Math.PI * 2);
                    ctx.fill();

                    this.particles.forEach(p => {
                        if(p.life > 0) {
                            ctx.fillStyle = p.color.replace(')', `, ${p.life})`).replace('hsl', 'hsla');
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, 4 * p.life, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    });

                    ctx.restore();
                }
            }
        }

        function drawMob1() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.0015) * 0.2 + 1;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 30) * 5;
                ctx.translate(shake, 0);
            }

            const glow = Math.sin(time * 0.002) * 0.3 + 0.7;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 40);
            gradient.addColorStop(0, `rgba(180, 100, 230, ${glow * 0.9})`);
            gradient.addColorStop(1, `rgba(130, 50, 200, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 40 * pulse, 0, Math.PI * 2);
            ctx.fill();

            const symbols = ['☉', '☾', '♆', '⚷', '♇', '⚸'];
            const symbolCount = symbols.length;

            for(let i = 0; i < symbolCount; i++) {
                const angle = (Math.PI * 2 / symbolCount) * i + time * 0.0003;
                const radius = 60 + Math.sin(time * 0.001 + i) * 10;
                const symbolGlow = Math.sin(time * 0.002 + i) * 0.4 + 0.6;

                ctx.save();
                ctx.translate(Math.cos(angle) * radius, Math.sin(angle) * radius);
                ctx.rotate(angle + Math.PI/2);

                ctx.fillStyle = `rgba(200, 150, 250, ${symbolGlow})`;
                ctx.font = '20px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(symbols[i], 0, 0);

                ctx.strokeStyle = `rgba(180, 130, 230, ${symbolGlow * 0.5})`;
                ctx.strokeText(symbols[i], 0, 0);

                ctx.restore();
            }

            const lines = 8;
            for(let i = 0; i < lines; i++) {
                const lineAngle = (Math.PI * 2 / lines) * i + time * 0.0002;
                const lineLength = 80 + Math.sin(time * 0.001 + i) * 20;

                ctx.strokeStyle = `rgba(150, 100, 220, ${0.4 + Math.sin(time * 0.003 + i) * 0.3})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(lineAngle) * lineLength, Math.sin(lineAngle) * lineLength);
                ctx.stroke();

                ctx.fillStyle = `rgba(180, 130, 240, ${0.6 + Math.sin(time * 0.002 + i) * 0.3})`;
                ctx.beginPath();
                ctx.arc(Math.cos(lineAngle) * lineLength, Math.sin(lineAngle) * lineLength, 6, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = `rgba(255, 255, 200, ${glow})`;
            ctx.shadowColor = 'rgba(200, 150, 255, 0.8)';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(-15, -15, 8 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(15, -15, 8 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(200, 150, 255, ${attackAnimation})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 100 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob2() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const rotation = time * 0.0005;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 30) * 5;
                ctx.translate(shake, 0);
            }

            const vortexGlow = Math.sin(time * 0.002) * 0.4 + 0.6;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 50);
            gradient.addColorStop(0, `rgba(80, 150, 255, ${vortexGlow * 0.9})`);
            gradient.addColorStop(0.7, `rgba(50, 120, 255, ${vortexGlow * 0.4})`);
            gradient.addColorStop(1, `rgba(30, 100, 255, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 50, 0, Math.PI * 2);
            ctx.fill();

            const arms = 3;
            for(let i = 0; i < arms; i++) {
                const armAngle = (Math.PI * 2 / arms) * i + rotation;

                ctx.strokeStyle = `rgba(100, 180, 255, ${0.7})`;
                ctx.lineWidth = 4;
                ctx.beginPath();

                for(let j = 0; j <= 10; j++) {
                    const progress = j / 10;
                    const spiralRadius = 60 * progress;
                    const spiralAngle = armAngle + progress * Math.PI * 2;

                    const pointX = Math.cos(spiralAngle) * spiralRadius;
                    const pointY = Math.sin(spiralAngle) * spiralRadius;

                    if(j === 0) ctx.moveTo(pointX, pointY);
                    else ctx.lineTo(pointX, pointY);
                }
                ctx.stroke();
            }

            const particles = 12;
            for(let i = 0; i < particles; i++) {
                const particleAngle = (Math.PI * 2 / particles) * i + rotation * 2;
                const particleRadius = 40;
                const particleX = Math.cos(particleAngle) * particleRadius;
                const particleY = Math.sin(particleAngle) * particleRadius;
                const particleSize = 4 + Math.sin(time * 0.01 + i) * 3;

                ctx.fillStyle = `rgba(100, 200, 255, ${0.8 + Math.sin(time * 0.005 + i) * 0.1})`;
                ctx.beginPath();
                ctx.arc(particleX, particleY, particleSize, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = `rgba(255, 255, 255, ${vortexGlow})`;
            ctx.shadowColor = 'rgba(100, 180, 255, 0.8)';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(0, 0, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            const rays = 6;
            for(let i = 0; i < rays; i++) {
                const rayAngle = (Math.PI * 2 / rays) * i + rotation;
                const rayLength = 90;

                ctx.strokeStyle = `rgba(80, 160, 255, ${0.5 + Math.sin(time * 0.003 + i) * 0.2})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(rayAngle) * rayLength, Math.sin(rayAngle) * rayLength);
                ctx.stroke();
            }

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(100, 180, 255, ${attackAnimation})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 120 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob3() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.001) * 0.3 + 1;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 25) * 4;
                ctx.translate(0, shake);
            }

            const coreGlow = Math.sin(time * 0.003) * 0.5 + 0.5;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 45);
            gradient.addColorStop(0, `rgba(255, 100, 80, ${coreGlow})`);
            gradient.addColorStop(0.6, `rgba(200, 60, 40, ${coreGlow * 0.6})`);
            gradient.addColorStop(1, `rgba(150, 30, 20, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 45 * pulse, 0, Math.PI * 2);
            ctx.fill();

            const rings = 4;
            for(let r = 0; r < rings; r++) {
                const ringRadius = 30 + r * 25;
                const ringPulse = Math.sin(time * 0.001 + r * 0.5) * 0.5 + 0.5;
                const ringRotation = time * 0.0002 * (r + 1);

                ctx.strokeStyle = `rgba(255, 120, 90, ${0.3 + ringPulse * 0.4})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, ringRadius, 0, Math.PI * 2);
                ctx.stroke();

                const spikes = 8 + r * 2;
                for(let s = 0; s < spikes; s++) {
                    const spikeAngle = (Math.PI * 2 / spikes) * s + ringRotation;
                    const spikeLength = 15 + Math.sin(time * 0.002 + s) * 5;

                    ctx.save();
                    ctx.rotate(spikeAngle);
                    ctx.translate(ringRadius, 0);

                    ctx.fillStyle = `rgba(255, 150, 100, ${0.7 + Math.sin(time * 0.005 + s) * 0.2})`;
                    ctx.beginPath();
                    ctx.moveTo(0, -4);
                    ctx.lineTo(spikeLength, 0);
                    ctx.lineTo(0, 4);
                    ctx.closePath();
                    ctx.fill();

                    ctx.restore();
                }
            }

            const energyOrbs = 5;
            for(let i = 0; i < energyOrbs; i++) {
                const orbAngle = (Math.PI * 2 / energyOrbs) * i + time * 0.0004;
                const orbRadius = 70 + Math.sin(time * 0.001 + i) * 15;
                const orbX = Math.cos(orbAngle) * orbRadius;
                const orbY = Math.sin(orbAngle) * orbRadius;
                const orbSize = 8 + Math.sin(time * 0.008 + i * 2) * 4;

                ctx.fillStyle = `rgba(255, 180, 120, ${0.8 + Math.sin(time * 0.004 + i) * 0.2})`;
                ctx.beginPath();
                ctx.arc(orbX, orbY, orbSize, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = `rgba(255, 140, 80, 0.4)`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(orbX, orbY);
                ctx.stroke();
            }

            ctx.fillStyle = `rgba(255, 220, 180, ${coreGlow})`;
            ctx.shadowColor = 'rgba(255, 100, 80, 0.9)';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(0, 0, 12 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(255, 100, 80, ${attackAnimation})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 110 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob4() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.002) * 0.2 + 1;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 35) * 6;
                ctx.translate(shake, shake * 0.5);
            }

            const glow = Math.sin(time * 0.0015) * 0.4 + 0.6;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 55);
            gradient.addColorStop(0, `rgba(100, 230, 150, ${glow * 0.8})`);
            gradient.addColorStop(0.5, `rgba(60, 200, 120, ${glow * 0.5})`);
            gradient.addColorStop(1, `rgba(30, 170, 90, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 55 * pulse, 0, Math.PI * 2);
            ctx.fill();

            const hexagonSize = 40;
            const hexRotation = time * 0.0003;

            ctx.strokeStyle = `rgba(80, 220, 140, ${0.6})`;
            ctx.lineWidth = 4;
            ctx.beginPath();
            for(let i = 0; i < 6; i++) {
                const angle = (Math.PI * 2 / 6) * i + hexRotation;
                const x = Math.cos(angle) * hexagonSize;
                const y = Math.sin(angle) * hexagonSize;
                if(i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.stroke();

            const innerHexagons = 3;
            for(let h = 0; h < innerHexagons; h++) {
                const innerSize = hexagonSize * (0.3 + h * 0.2);
                const innerRotation = hexRotation * (h + 1) * -0.5;

                ctx.strokeStyle = `rgba(120, 240, 160, ${0.3 + h * 0.15})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                for(let i = 0; i < 6; i++) {
                    const angle = (Math.PI * 2 / 6) * i + innerRotation;
                    const x = Math.cos(angle) * innerSize;
                    const y = Math.sin(angle) * innerSize;
                    if(i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.stroke();
            }

            const nodes = 12;
            for(let i = 0; i < nodes; i++) {
                const nodeAngle = (Math.PI * 2 / nodes) * i + hexRotation * 0.7;
                const nodeRadius = 75 + Math.cos(time * 0.001 + i) * 10;
                const nodeX = Math.cos(nodeAngle) * nodeRadius;
                const nodeY = Math.sin(nodeAngle) * nodeRadius;
                const nodePulse = Math.sin(time * 0.003 + i * 0.5) * 0.3 + 0.7;

                ctx.fillStyle = `rgba(100, 240, 150, ${nodePulse})`;
                ctx.beginPath();
                ctx.arc(nodeX, nodeY, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = `rgba(80, 220, 140, 0.3)`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(nodeX, nodeY);
                ctx.stroke();
            }

            const energyLines = 4;
            for(let i = 0; i < energyLines; i++) {
                const lineAngle = (Math.PI * 2 / energyLines) * i + hexRotation * 2;
                const points = 8;
                ctx.strokeStyle = `rgba(120, 250, 170, ${0.4 + Math.sin(time * 0.002 + i) * 0.2})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                for(let p = 0; p <= points; p++) {
                    const progress = p / points;
                    const radius = 90 * progress;
                    const wave = Math.sin(time * 0.005 + progress * Math.PI + i) * 15;
                    const x = Math.cos(lineAngle) * (radius + wave);
                    const y = Math.sin(lineAngle) * (radius + wave);
                    if(p === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            ctx.fillStyle = `rgba(200, 255, 220, ${glow})`;
            ctx.shadowColor = 'rgba(100, 230, 150, 0.8)';
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.arc(0, 0, 10 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(100, 230, 150, ${attackAnimation})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 130 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMob5() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const pulse = Math.sin(time * 0.0012) * 0.25 + 1;

            if(attackAnimation > 0) {
                const shake = Math.sin(attackAnimation * 40) * 3;
                ctx.translate(shake, -shake);
            }

            const depth = Math.sin(time * 0.0008) * 0.3 + 0.7;
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 60);
            gradient.addColorStop(0, `rgba(200, 100, 255, ${depth * 0.9})`);
            gradient.addColorStop(0.4, `rgba(160, 60, 220, ${depth * 0.6})`);
            gradient.addColorStop(0.8, `rgba(120, 30, 180, ${depth * 0.3})`);
            gradient.addColorStop(1, `rgba(80, 10, 140, 0)`);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 60 * pulse, 0, Math.PI * 2);
            ctx.fill();

            const layers = 5;
            for(let l = 0; l < layers; l++) {
                const layerRadius = 20 + l * 15;
                const layerRotation = time * 0.0001 * (l + 1);
                const layerPoints = 5 + l * 2;

                ctx.save();
                ctx.rotate(layerRotation);

                for(let p = 0; p < layerPoints; p++) {
                    const pointAngle = (Math.PI * 2 / layerPoints) * p;
                    const pointX = Math.cos(pointAngle) * layerRadius;
                    const pointY = Math.sin(pointAngle) * layerRadius;
                    const pointGlow = Math.sin(time * 0.002 + p * 0.3 + l) * 0.4 + 0.6;

                    ctx.fillStyle = `rgba(180, 100, 240, ${pointGlow})`;
                    ctx.beginPath();
                    ctx.arc(pointX, pointY, 8 - l, 0, Math.PI * 2);
                    ctx.fill();

                    if(l > 0) {
                        const prevPointAngle = (Math.PI * 2 / layerPoints) * ((p - 1 + layerPoints) % layerPoints);
                        const prevX = Math.cos(prevPointAngle) * layerRadius;
                        const prevY = Math.sin(prevPointAngle) * layerRadius;

                        ctx.strokeStyle = `rgba(160, 80, 230, ${0.2 + pointGlow * 0.3})`;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(prevX, prevY);
                        ctx.lineTo(pointX, pointY);
                        ctx.stroke();
                    }
                }

                ctx.restore();
            }

            const orbitingShards = 7;
            for(let i = 0; i < orbitingShards; i++) {
                const shardAngle = (Math.PI * 2 / orbitingShards) * i + time * 0.0002;
                const shardDistance = 85 + Math.sin(time * 0.001 + i) * 20;
                const shardX = Math.cos(shardAngle) * shardDistance;
                const shardY = Math.sin(shardAngle) * shardDistance;
                const shardSize = 12 + Math.sin(time * 0.005 + i * 1.5) * 4;

                ctx.save();
                ctx.translate(shardX, shardY);
                ctx.rotate(shardAngle + time * 0.0001);

                ctx.fillStyle = `rgba(220, 140, 255, ${0.8 + Math.sin(time * 0.003 + i) * 0.2})`;
                ctx.beginPath();
                ctx.moveTo(-shardSize/2, -shardSize);
                ctx.lineTo(shardSize/2, -shardSize);
                ctx.lineTo(shardSize, 0);
                ctx.lineTo(shardSize/2, shardSize);
                ctx.lineTo(-shardSize/2, shardSize);

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            const distance = Math.sqrt(
                Math.pow(clickX - mobPosition.x, 2) +
                Math.pow(clickY - mobPosition.y, 2)
            );
            const isHit = distance < 100 * mobs[currentMob].scaleFactor;

            if(isHit) {
                damageMob();
            }
        });

        updateMob();

        function gameLoop() {
            drawScene();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();

            );
            const isHit = distance < 100 * mobs[currentMob].scaleFactor;

            if(isHit) {
                damageMob();
            }
        });

        function gameLoop() {
            drawScene();
            requestAnimationFrame(gameLoop);
        }

        class DamageEffect {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.life = 1.0;
                this.size = type === 'hit' ? 20 : 50;
                this.particles = [];

                if(type === 'hit') {
                    for(let i = 0; i < 8; i++) {
                        this.particles.push({
                            x: 0,
                            y: 0,
                            vx: (Math.random() - 0.5) * 10,
                            vy: (Math.random() - 0.5) * 10 - 5,
                            life: 1.0
                        });
                    }
                } else {
                    for(let i = 0; i < 20; i++) {
                        this.particles.push({
                            x: 0,
                            y: 0,
                            vx: (Math.random() - 0.5) * 15,
                            vy: (Math.random() - 0.5) * 15 - 8,
                            life: 1.0,
                            color: `hsl(${Math.random() * 60}, 100%, 60%)`
                        });
                    }
                }
            }

            update() {
                this.life -= 0.03;
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.3;
                    p.life -= 0.02;
                });
                return this.life > 0;
            }

            draw() {
                if(this.type === 'hit') {
                    ctx.save();
                    ctx.translate(this.x, this.y);

                    ctx.fillStyle = `rgba(255, 50, 50, ${this.life * 0.7})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * this.life, 0, Math.PI * 2);
                    ctx.fill();

                    this.particles.forEach(p => {
                        if(p.life > 0) {
                            ctx.fillStyle = `rgba(255, 100, 100, ${p.life})`;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    });

                    ctx.restore();
                } else {
                    ctx.save();
                    ctx.translate(this.x, this.y);

                    ctx.fillStyle = `rgba(255, 200, 50, ${this.life * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * (1 - this.life), 0, Math.PI * 2);
                    ctx.fill();

                    this.particles.forEach(p => {
                        if(p.life > 0) {
                            ctx.fillStyle = p.color.replace(')', `, ${p.life})`).replace('hsl', 'hsla');
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, 4 * p.life, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    });

                    ctx.restore();
                }
            }
        }

        function drawMob8() {
            ctx.save();
            ctx.translate(mobPosition.x, mobPosition.y);
            ctx.scale(mobScale * mobs[currentMob].scaleFactor, mobScale * mobs[currentMob].scaleFactor);
            ctx.rotate(mobRotation);

            const time = Date.now();
            const rotation = time * 0.00045;

            gradient.addColorStop(0.5, `rgba(70, 120, 220, ${glow * 0.4})`);
            gradient.addColorStop(1, `rgba(50, 100, 200, 0)`);

            ctx.fillStyle = gradient;

            ctx.fill();

            const geometricShapes = 6;
            for(let i = 0; i < geometricShapes; i++) {
                const shapeAngle = (Math.PI * 2 / geometricShapes) * i + rotation;

                ctx.save();
                ctx.translate(Math.cos(shapeAngle) * 50, Math.sin(shapeAngle) * 50);
                ctx.rotate(shapeAngle);

                ctx.fillStyle = `rgba(120, 170, 255, ${0.8 + Math.sin(time * 0.005 + i) * 0.2})`;

        function drawMob9() {

            ctx.rotate(mobRotation);

                ctx.arc(dotX, dotY, dotSize, 0, Math.PI * 2);

                ctx.arc(0, 0, 125 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();

        function drawMob10() {

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 55, 0, Math.PI * 2);
            ctx.fill();

            for(let i = 0; i < iceCrystals; i++) {
                const crystalAngle = (Math.PI * 2 / iceCrystals) * i + rotation;

                ctx.save();
                ctx.rotate(crystalAngle);

                ctx.fillStyle = `rgba(200, 255, 255, ${0.8 + Math.sin(time * 0.004 + i) * 0.2})`;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(45, -15);
                ctx.lineTo(60, 0);
                ctx.lineTo(45, 15);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = `rgba(170, 240, 240, ${0.9})`;
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();
            }

            const floatingDiamonds = 11;
            for(let i = 0; i < floatingDiamonds; i++) {
                const diamondAngle = (Math.PI * 2 / floatingDiamonds) * i + rotation * 1.3;
                const diamondRadius = 32 + Math.sin(time * 0.002 + i) * 18;
                const diamondX = Math.cos(diamondAngle) * diamondRadius;
                const diamondY = Math.sin(diamondAngle) * diamondRadius;
                const diamondSize = 6 + Math.sin(time * 0.019 + i) * 3;

                ctx.save();
                ctx.translate(diamondX, diamondY);
                ctx.rotate(diamondAngle);

                ctx.fillStyle = `rgba(220, 255, 255, ${0.9 + Math.sin(time * 0.014 + i) * 0.1})`;
                ctx.beginPath();
                ctx.moveTo(0, -diamondSize);
                ctx.lineTo(diamondSize, 0);
                ctx.lineTo(0, diamondSize);
                ctx.lineTo(-diamondSize, 0);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }

            ctx.fillStyle = `rgba(255, 255, 255, ${glow})`;
            ctx.shadowColor = 'rgba(180, 255, 255, 0.9)';
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.arc(0, 0, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            const frostPatterns = 9;
            for(let i = 0; i < frostPatterns; i++) {
                const patternAngle = (Math.PI * 2 / frostPatterns) * i + rotation * 0.7;
                const patternLength = 70 + Math.sin(time * 0.003 + i) * 25;

                ctx.strokeStyle = `rgba(160, 255, 255, ${0.5 + Math.sin(time * 0.006 + i) * 0.3})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);

                for(let j = 1; j <= 6; j++) {
                    const progress = j / 6;
                    const branchAngle = patternAngle + (j % 2 === 0 ? Math.PI/8 : -Math.PI/8);
                    const x = Math.cos(branchAngle) * patternLength * progress;
                    const y = Math.sin(branchAngle) * patternLength * progress;
                    ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            if(attackAnimation > 0) {
                ctx.strokeStyle = `rgba(180, 255, 255, ${attackAnimation})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 115 * (1 - attackAnimation), 0, Math.PI * 2);
                ctx.stroke();

            ctx.restore();
        }

        const mobDrawers = [
            drawMob1,
            drawMob2,
            drawMob3,
            drawMob4,
            drawMob5,
            drawMob6,
            drawMob7,
            drawMob8,
            drawMob9,
            drawMob10
        ];

        function updateMob() {
            mobScale = 1;
            mobRotation = 0;
            isMobAlive = true;
            deathAnimation = 0;

            mobPosition.x = canvas.width / 2;
            mobPosition.y = canvas.height / 2;
        }

        function damageMob() {
            if(!isMobAlive) return;

            mobs[currentMob].health--;

            damageEffects.push(new DamageEffect(mobPosition.x, mobPosition.y, 'hit'));
            attackAnimation = 1.0;

            mobScale = 0.9;

            if(mobs[currentMob].health <= 0) {
                isMobAlive = false;
                deathAnimation = 1.0;
                damageEffects.push(new DamageEffect(mobPosition.x, mobPosition.y, 'death'));

                setTimeout(() => {
                    currentMob = (currentMob + 1) % mobs.length;
                    mobs[currentMob].health = mobs[currentMob].maxHealth;
                    updateMob();
                }, 0);
            }
        }

        function drawScene() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if(attackAnimation > 0) {
                attackAnimation -= 0.05;
                mobScale = Math.min(mobScale + 0.02, 1);
            }

            if(deathAnimation > 0) {
                deathAnimation -= 0.02;
                mobScale *= 0.98;
                mobRotation += 0.1;
            }

            if(isMobAlive || deathAnimation > 0) {
                mobDrawers[currentMob]();
            }

            damageEffects = damageEffects.filter(effect => effect.update());
            damageEffects.forEach(effect => effect.draw());
        }

        canvas.addEventListener('click', (e) => {
            if(!isMobAlive) return;

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            const distance = Math.sqrt(
                Math.pow(clickX - mobPosition.x, 2) +
                Math.pow(clickY - mobPosition.y, 2)
            );
            const isHit = distance < 100 * mobs[currentMob].scaleFactor;

            if(isHit) {
                damageMob();
            }
        });

        updateMob();

        function gameLoop() {
            drawScene();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>

<body>
    <canvas id="game"></canvas>
    <script>
        const canvas = document.getElementById('game');

            { id: 4, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 5, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 6, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 7, health: 1, maxHealth: 1, scaleFactor: 2.0 },
            { id: 8, health: 1, maxHealth: 1, scaleFactor: 2.0 },

            { id: 10, health: 1, maxHealth: 1, scaleFactor: 2.0 }

        window.addEventListener('resize', resize);
        resize();

        class DamageEffect {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.life = 1.0;
                this.size = type === 'hit' ? 20 : 50;
                this.particles = [];

                if(type === 'hit') {
                    for(let i = 0; i < 8; i++) {
                        this.particles.push({
                            x: 0,
                            y: 0,
                            vx: (Math.random() - 0.5) * 10,
                            vy: (Math.random() - 0.5) * 10 - 5,
                            life: 1.0
                        });
                    }
                } else {
                    for(let i = 0; i < 20; i++) {
                        this.particles.push({
                            x: 0,
                            y: 0,
                            vx: (Math.random() - 0.5) * 15,
                            vy: (Math.random() - 0.5) * 15 - 8,
                            life: 1.0,
                            color: `hsl(${Math.random() * 60}, 100%, 60%)`
                        });
                    }
                }
            }

            update() {
                this.life -= 0.03;
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.3;
                    p.life -= 0.02;
                });
                return this.life > 0;
            }

            draw() {
                if(this.type === 'hit') {
                    ctx.save();
                    ctx.translate(this.x, this.y);

                    ctx.fillStyle = `rgba(255, 50, 50, ${this.life * 0.7})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * this.life, 0, Math.PI * 2);
                    ctx.fill();

                    this.particles.forEach(p => {
                        if(p.life > 0) {
                            ctx.fillStyle = `rgba(255, 100, 100, ${p.life})`;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    });

                    ctx.restore();
                } else {
                    ctx.save();
                    ctx.translate(this.x, this.y);

                    ctx.fillStyle = `rgba(255, 200, 50, ${this.life * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * (1 - this.life), 0, Math.PI * 2);
                    ctx.fill();

                    this.particles.forEach(p => {
                        if(p.life > 0) {
                            ctx.fillStyle = p.color.replace(')', `, ${p.life})`).replace('hsl', 'hsla');

        function drawMob1() {

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 45 * pulse, 0, Math.PI * 2);
            ctx.fill();
