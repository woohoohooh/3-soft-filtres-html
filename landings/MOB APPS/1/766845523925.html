```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LingoSpark · vocabulary 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #121826;
      padding: 12px;
    }
    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background: var(--bg-primary);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 30px 60px -10px rgba(0,0,0,0.5), 0 0 0 8px #2d3440;
      position: relative;
      transition: background 0.2s;
    }
    .screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
    }
    /* header */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px 8px 20px;
    }
    .app-header h2 {
      font-size: 22px;
      font-weight: 620;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .profile-icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 12px;
      transition: background 0.15s;
    }
    .profile-icon:hover {
      background: var(--card-bg);
    }
    .profile-icon svg {
      width: 26px;
      height: 26px;
      stroke: var(--text-primary);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    /* main content */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 4px 16px 8px 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--primary-light) var(--card-bg);
    }
    .content::-webkit-scrollbar {
      width: 4px;
    }
    .content::-webkit-scrollbar-thumb {
      background: var(--primary-light);
      border-radius: 20px;
    }
    /* bottom navigation */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 12px 12px;
      background: var(--card-bg);
      border-top: 1px solid var(--border-subtle);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 8px 12px 4px;
      border-radius: 20px;
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      color: var(--text-muted);
      fill: none;
    }
    .nav-item.active {
      background: rgba(37, 99, 235, 0.08);
      transform: scale(1.02);
    }
    .nav-item.active svg {
      stroke: var(--primary) !important;
      stroke-width: 2.5px;
      transform: scale(1.1);
    }
    .nav-item.active span {
      color: var(--primary);
      font-weight: 520;
    }
    .nav-item svg {
      width: 26px;
      height: 26px;
      stroke: var(--icon-inactive);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: all 0.15s;
    }
    .nav-item span {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
    }
    /* icons: all inline later */
    /* variables */
    :root {
      --primary: #2563EB;
      --secondary: #1E40AF;
      --accent: #38BDF8;
      --bg-primary: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-primary: #0F172A;
      --text-muted: #64748B;
      --border-subtle: #E2E8F0;
      --icon-inactive: #94A3B8;
      --progress-bg: #E2E8F0;
    }
    body.dark {
      --bg-primary: #0F172A;
      --card-bg: #1E293B;
      --text-primary: #E2E8F0;
      --text-muted: #94A3B8;
      --border-subtle: #334155;
      --icon-inactive: #64748B;
      --progress-bg: #334155;
    }
    /* cards */
    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 20px 18px;
      margin-bottom: 18px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.02);
      border: 1px solid var(--border-subtle);
    }
    .flex-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      background: var(--accent);
      color: #0F172A;
      padding: 6px 12px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 600;
    }
    .progress-bar {
      height: 8px;
      background: var(--progress-bg);
      border-radius: 20px;
      margin: 12px 0;
      width: 100%;
    }
    .progress-fill {
      height: 8px;
      background: var(--primary);
      border-radius: 20px;
      width: 0%;
      transition: width 0.4s ease;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 16px;
      width: 100%;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn-primary:active { background: var(--secondary); }
    .link-row {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin: 16px 0 8px;
    }
    .link-row button {
      background: none;
      border: none;
      color: var(--text-muted);
      text-decoration: underline;
      font-size: 14px;
      cursor: pointer;
    }
    .modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal.hidden { display: none; }
    .modal-content {
      background: var(--card-bg);
      width: 280px;
      padding: 28px;
      border-radius: 36px;
      text-align: center;
      color: var(--text-primary);
    }
    .modal-content button {
      margin-top: 20px;
      background: var(--primary);
      border: none;
      color: white;
      padding: 10px 28px;
      border-radius: 40px;
    }
    /* chart mock */
    .chart-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      height: 80px;
      margin: 18px 0;
    }
    .chart-bar {
      width: 22px;
      background: var(--primary);
      border-radius: 10px 10px 4px 4px;
      transition: height 0.3s;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat {
      background: var(--bg-primary);
      border-radius: 22px;
      padding: 18px 12px;
      text-align: center;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
    }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <div class="screen" id="appScreen">
    <!-- DYNAMIC HEADER (js) -->
    <div class="app-header" id="mainHeader">
      <h2 id="screenTitle">Onboarding</h2>
      <div class="profile-icon" id="profileBtn">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
    </div>

    <!-- main content (pages injected) -->
    <div class="content" id="pageContent"></div>

    <!-- bottom nav (static but JS toggles) -->
    <div class="bottom-nav" id="bottomNav">
      <button class="nav-item" data-tab="home"><svg viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></button>
      <button class="nav-item" data-tab="learn"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span>Learn</span></button>
      <button class="nav-item" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg><span>Progress</span></button>
      <button class="nav-item" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/><path d="M16.5 6.5 19 9"/><path d="M7.5 6.5 5 9"/></svg><span>Settings</span></button>
    </div>
  </div>
</div>

<!-- modals (hidden) -->
<div id="privacyModal" class="modal hidden"><div class="modal-content"><h3>Privacy</h3><p>Your data stays local. No tracking.</p><button id="closePrivacy">OK</button></div></div>
<div id="termsModal" class="modal hidden"><div class="modal-content"><h3>Terms</h3><p>Educational use only. 2026 LingoSpark.</p><button id="closeTerms">Got it</button></div></div>

<script>
  (function() {
    // ------ APP STATE ------
    let currentScreen = 'onboarding'; // 'home','learn','progress','settings','onboarding'
    let darkMode = false;
    const phone = document.getElementById('phoneContainer');
    const pageContent = document.getElementById('pageContent');
    const screenTitle = document.getElementById('screenTitle');
    const bottomNav = document.getElementById('bottomNav');
    const navItems = document.querySelectorAll('.nav-item');
    const profileBtn = document.getElementById('profileBtn');

    // ------ THEME TOGGLE ------
    function applyTheme() {
      if(darkMode) document.body.classList.add('dark');
      else document.body.classList.remove('dark');
    }

    // ------ ICONS (reusable svg strings) ------
    function iconPlay() {
      return '<svg viewBox="0 0 24 24"><path d="M5 3l14 9-14 9V3z"/></svg>';
    }
    function iconFlashcards() {
      return '<svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><path d="M8 7h8"/><path d="M8 12h6"/><path d="M8 17h4"/></svg>';
    }
    function iconChart() {
      return '<svg viewBox="0 0 24 24"><path d="M21 16v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2"/><path d="M7 10l3-3 3 3 4-4"/><path d="M17 10V4h-6"/></svg>';
    }
    function iconLesson() {
      return '<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';
    }
    function iconCheck() {
      return '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>';
    }

    // ------ RENDER PAGE ------
    function renderScreen(screen) {
      if (screen === 'onboarding') {
        screenTitle.innerText = '✨ LingoSpark';
        pageContent.innerHTML = `
          <div class="card" style="text-align:center; margin-top:40px;">
            <div style="font-size:56px; margin-bottom:10px;">🧠</div>
            <h2 style="font-size:32px; color:var(--primary);">LingoSpark</h2>
            <p style="font-size:18px; margin:12px 0 8px;">English vocabulary builder</p>
            <p style="color:var(--text-muted); margin-bottom:28px;">Master 5000+ words with smart daily challenges and science‑backed repetition.</p>
            <button class="btn-primary" id="getStartedBtn">Get Started →</button>
            <div class="link-row">
              <button id="privacyLink">Privacy</button>
              <button id="termsLink">Terms</button>
            </div>
          </div>
        `;
        document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
          currentScreen = 'home';
          renderScreen('home');
          setActiveTab('home');
        });
        document.getElementById('privacyLink')?.addEventListener('click', ()=> modalShow('privacy'));
        document.getElementById('termsLink')?.addEventListener('click', ()=> modalShow('terms'));
        return;
      }

      // home dashboard
      if (screen === 'home') {
        screenTitle.innerText = 'Home';
        pageContent.innerHTML = `
          <div class="card">
            <div class="flex-row"><span class="badge">🔥 12 day streak</span><span>⭐ 340 XP</span></div>
            <h3 style="margin:12px 0 6px;">Continue where you left</h3>
            <div style="display:flex; gap:14px; align-items:center; margin-bottom:10px;">
              ${iconFlashcards()} <span><strong>Phrasal verbs</strong> · 3/8</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width:37%"></div></div>
            <button class="btn-primary" id="resumeLesson" style="padding:12px;">continue practice</button>
          </div>
          <div class="card">
            <div class="flex-row"><h4>Daily goal</h4><span>80%</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width:80%"></div></div>
            <div class="grid-2">
              <div class="stat"><span class="stat-value">24</span><br>new words</div>
              <div class="stat"><span class="stat-value">5</span><br>lessons left</div>
            </div>
          </div>
          <div class="card">
            <div class="flex-row"><h4>Recommended</h4><span>→</span></div>
            <div style="display:flex; gap:20px; margin-top:10px;">
              <div style="flex:1; background:var(--bg-primary); padding:12px; border-radius:20px;">${iconLesson()} Business</div>
              <div style="flex:1; background:var(--bg-primary); padding:12px; border-radius:20px;">${iconFlashcards()} Idioms</div>
            </div>
          </div>
        `;
        document.getElementById('resumeLesson')?.addEventListener('click', ()=>{
          currentScreen = 'learn';
          renderScreen('learn');
          setActiveTab('learn');
        });
        return;
      }

      // learn / practice
      if (screen === 'learn') {
        screenTitle.innerText = 'Practice';
        pageContent.innerHTML = `
          <div class="card">
            <h3>Today’s drills</h3>
            <div style="display:flex; gap:16px; margin:20px 0;">${iconPlay()} <span>Listen & choose</span> <span style="margin-left:auto;">🔄</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div>
            <div style="display:flex; gap:16px; margin:20px 0;">${iconFlashcards()} <span>Flashcards: 12 due</span> <span>▶️</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width:55%"></div></div>
            <button class="btn-primary" id="startPracticeBtn" style="margin-top:10px;">start practice</button>
          </div>
          <div class="card">
            <h4>Upcoming</h4>
            <p>• collocations (5m)  ⭐40xp</p>
            <p>• synonyms quiz  ⭐60xp</p>
          </div>
        `;
        document.getElementById('startPracticeBtn')?.addEventListener('click', ()=> alert('practice started! (demo)'));
        return;
      }

      // progress
      if (screen === 'progress') {
        screenTitle.innerText = 'Progress';
        pageContent.innerHTML = `
          <div class="card">
            <div class="flex-row"><h3>Weekly activity</h3>${iconChart()}</div>
            <div class="chart-row">
              <div class="chart-bar" style="height:30px"></div><div class="chart-bar" style="height:52px"></div><div class="chart-bar" style="height:20px"></div><div class="chart-bar" style="height:70px"></div><div class="chart-bar" style="height:44px"></div><div class="chart-bar" style="height:60px"></div><div class="chart-bar" style="height:38px"></div>
            </div>
            <p>+245 words this week</p>
          </div>
          <div class="card grid-2">
            <div><span class="stat-value">84%</span><br>mastery</div>
            <div><span class="stat-value">16</span><br>streak</div>
            <div><span class="stat-value">32</span><br>achievements</div>
            <div><span class="stat-value">7</span><br>badges</div>
          </div>
          <div class="card">${iconCheck()}  Next badge: 'word expert' (42/50)</div>
        `;
        return;
      }

      // settings / profile
      if (screen === 'settings') {
        screenTitle.innerText = 'Settings';
        pageContent.innerHTML = `
          <div class="card">
            <div style="display:flex; gap:20px; align-items:center; margin-bottom:28px;">
              <svg width="48" height="48" viewBox="0 0 24 24" stroke="var(--primary)"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <div><h3>Alex Rivera</h3><p>alex@lingospark.io</p></div>
            </div>
            <div style="display:flex; justify-content:space-between; margin:18px 0;">
              <span>🌙 Dark theme</span>
              <label><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}></label>
            </div>
            <p>🔔 Notifications</p>
            <p>🗣️ Speaking practice</p>
            <p style="margin-top:24px;">📲 version 2026.3</p>
          </div>
        `;
        document.getElementById('darkToggle')?.addEventListener('change', (e)=>{
          darkMode = e.target.checked;
          applyTheme();
          renderScreen(currentScreen); // keep settings
        });
        return;
      }
    }

    function setActiveTab(tabId) {
      navItems.forEach(item => {
        const tab = item.getAttribute('data-tab');
        if(tab === tabId) item.classList.add('active');
        else item.classList.remove('active');
      });
    }

    // modal logic
    function modalShow(type) {
      const modal = document.getElementById(type === 'privacy' ? 'privacyModal' : 'termsModal');
      modal.classList.remove('hidden');
    }
    document.getElementById('closePrivacy').addEventListener('click', ()=>document.getElementById('privacyModal').classList.add('hidden'));
    document.getElementById('closeTerms').addEventListener('click', ()=>document.getElementById('termsModal').classList.add('hidden'));

    // navigation from bottom
    navItems.forEach(item => {
      item.addEventListener('click', (e) => {
        const tab = item.getAttribute('data-tab');
        if (tab === 'home' || tab === 'learn' || tab === 'progress' || tab === 'settings') {
          currentScreen = tab;
          renderScreen(tab);
          setActiveTab(tab);
        }
      });
    });

    // profile icon -> settings
    profileBtn.addEventListener('click', ()=>{
      currentScreen = 'settings';
      renderScreen('settings');
      setActiveTab('settings');
    });

    // init: onboarding + light mode
    renderScreen('onboarding');
    setActiveTab(null); // no bottom highlight

    // screenshot hotkey shift+W
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const container = document.getElementById('phoneContainer');
        import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
          html2canvas(container, { scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            const darkSuffix = darkMode ? '6' : (currentScreen === 'onboarding' ? '1' : currentScreen === 'home' ? '2' : currentScreen === 'learn' ? '3' : currentScreen === 'progress' ? '4' : '5');
            const fileName = darkMode ? '6.png' : (darkSuffix === '1' ? '1.png' : darkSuffix === '2' ? '2.png' : darkSuffix === '3' ? '3.png' : darkSuffix === '4' ? '4.png' : '5.png');
            link.download = fileName;
            link.href = canvas.toDataURL('image/png');
            link.click();
          });
        }).catch(() => alert('html2canvas not loaded, but shift+W works.'));
      }
    });

    // force dark var
    applyTheme();
  })();
</script>
<!-- no frameworks, vanilla -->
</body>
</html>
All done!
