```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashLearn · 2026 prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #475569;
            --border: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive-icon: #94A3B8;
            --shadow: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,20,50,0.05);
            --header-shadow: 0 2px 8px rgba(0,0,0,0.02);
            --bottom-nav-bg: rgba(255,255,255,0.85);
            --backdrop-blur: blur(12px);
            --progress-bg: #E2E8F0;
        }

        .dark-mode {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #A0AEC0;
            --border: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive-icon: #64748B;
            --shadow: 0 8px 20px rgba(0,0,0,0.6);
            --header-shadow: 0 2px 8px rgba(0,0,0,0.4);
            --bottom-nav-bg: rgba(30,41,59,0.85);
            --progress-bg: #334155;
        }

        body {
            background: #1a202c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 44px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.3), 0 0 0 8px #2d3748;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            color: var(--text);
        }

        /* app header */
        .app-header {
            padding: 20px 20px 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            box-shadow: var(--header-shadow);
            backdrop-filter: var(--backdrop-blur);
            z-index: 5;
        }

        .app-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            transition: transform 0.1s;
        }
        .profile-btn:active { transform: scale(0.96); }

        /* main content */
        .screen-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px 12px 16px;
            scroll-behavior: smooth;
            background: var(--bg);
        }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 12px 12px;
            background: var(--bottom-nav-bg);
            backdrop-filter: var(--backdrop-blur);
            border-top: 1px solid var(--border);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 30px;
            transition: all 0.2s cubic-bezier(0.2,0.9,0.3,1.2);
            color: var(--inactive-icon);
            fill: var(--inactive-icon);
            font-size: 0.7rem;
            font-weight: 500;
            gap: 2px;
        }

        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            background: rgba(37, 99, 235, 0.1);
            transform: scale(1.05);
        }

        .nav-item.active svg {
            stroke: var(--primary);
        }

        .nav-item svg {
            width: 26px;
            height: 26px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.15s;
        }

        /* cards */
        .card {
            background: var(--card);
            border-radius: 28px;
            padding: 18px 16px;
            margin-bottom: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .flex-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
        }

        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 40px;
            margin: 12px 0 6px;
        }
        .progress-fill {
            height: 8px;
            background: var(--primary);
            width: 60%;
            border-radius: 40px;
        }

        .icon-grid {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* modal overlay */
        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: var(--card);
            padding: 24px;
            border-radius: 32px;
            width: 280px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .modal-btn {
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            margin-top: 20px;
            cursor: pointer;
        }

        /* hidden */
        .hidden { display: none !important; }

        button { cursor: pointer; background: none; border: none; }
        h3 { font-size: 1.2rem; margin-bottom: 12px; }
        p { color: var(--text-light); line-height: 1.4; }

        /* onboarding */
        .logo-big {
            background: var(--primary);
            width: 64px; height: 64px;
            border-radius: 24px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- header (dynamic) -->
    <div class="app-header" id="appHeader">
        <h2 id="headerTitle">FlashLearn</h2>
        <button class="profile-btn" id="profileBtn">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
            </svg>
        </button>
    </div>

    <!-- screen container (dynamic views) -->
    <div id="screenContainer" class="screen-container"></div>

    <!-- bottom navigation (4 items) -->
    <div class="bottom-nav" id="bottomNav">
        <button class="nav-item" data-screen="home" id="navHome">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
        </button>
        <button class="nav-item" data-screen="learn" id="navLearn">
            <svg viewBox="0 0 24 24"><path d="M12 2v20"/><path d="M2 12h20"/><circle cx="12" cy="12" r="2"/></svg>
            <span>Learn</span>
        </button>
        <button class="nav-item" data-screen="progress" id="navProgress">
            <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            <span>Progress</span>
        </button>
        <button class="nav-item" data-screen="settings" id="navSettings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.05A10 10 0 0 0 12 17.66a10 10 0 0 0 6.26-2.22z"/></svg>
            <span>Settings</span>
        </button>
    </div>

    <!-- hidden modal for legal -->
    <div id="legalModal" class="modal hidden">
        <div class="modal-content" id="modalContent">
            <h3 id="modalTitle">Privacy</h3>
            <p id="modalBody">We respect your data. This is a demo prototype.</p>
            <button class="modal-btn" id="closeModal">Got it</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- app state ----------
        let currentScreen = 'onboarding';    // special: not in bottom nav
        let darkMode = false;
        let screenshotCounter = 0;

        // ---------- theme ----------
        const root = document.documentElement;
        function toggleTheme() {
            darkMode = !darkMode;
            if (darkMode) root.classList.add('dark-mode');
            else root.classList.remove('dark-mode');
            renderSettingsScreen(); // update toggle inside settings
        }

        // ---------- reusable icons ----------
        function iconPlay() {
            return '<svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
        }
        function iconCheck() {
            return '<svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><polyline points="20 6 9 17 4 12"/></svg>';
        }
        function iconFlashcard() {
            return '<svg width="22" height="22" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>';
        }
        function iconChart() {
            return '<svg width="22" height="22" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 21H4V4"/><path d="M7 15v4"/><path d="M11 11v8"/><path d="M15 8v11"/><path d="M19 5v14"/></svg>';
        }
        function iconLesson() {
            return '<svg width="22" height="22" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';
        }

        // ---------- navigation ----------
        function showScreen(screenId) {
            currentScreen = screenId;
            const container = document.getElementById('screenContainer');
            const headerTitle = document.getElementById('headerTitle');

            // update header title
            const titles = {
                onboarding: 'FlashLearn',
                home: 'Home',
                learn: 'Flashcards',
                progress: 'Insights',
                settings: 'Settings',
                profile: 'Profile'
            };
            headerTitle.innerText = titles[screenId] || 'FlashLearn';

            // render view
            if (screenId === 'onboarding') container.innerHTML = renderOnboarding();
            else if (screenId === 'home') container.innerHTML = renderHome();
            else if (screenId === 'learn') container.innerHTML = renderLearn();
            else if (screenId === 'progress') container.innerHTML = renderProgress();
            else if (screenId === 'settings') container.innerHTML = renderSettings();
            else if (screenId === 'profile') container.innerHTML = renderProfile();

            // update bottom nav active state (except onboarding)
            document.querySelectorAll('.nav-item').forEach(item => {
                const data = item.dataset.screen;
                if (data === screenId) item.classList.add('active');
                else item.classList.remove('active');
            });

            // hide bottom nav on onboarding
            const bottomNav = document.getElementById('bottomNav');
            if (screenId === 'onboarding' || screenId === 'profile') {
                bottomNav.style.display = 'none';
            } else {
                bottomNav.style.display = 'flex';
            }

            // special: if we are in onboarding, make sure bottom nav hidden, header title
            if (screenId === 'onboarding') {
                headerTitle.innerText = 'FlashLearn';
            }
        }

        // ---------- onboarding ----------
        function renderOnboarding() {
            return `
                <div style="display: flex; flex-direction: column; justify-content: space-between; min-height: 100%;">
                    <div style="margin-top: 30px;">
                        <div class="logo-big">
                            <svg width="36" height="36" viewBox="0 0 24 24" stroke="white" stroke-width="2" fill="none"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                        </div>
                        <h1 style="font-size: 2.2rem; font-weight: 700; line-height: 1;">FlashLearn</h1>
                        <p style="font-size: 1.1rem; color: var(--primary); font-weight: 500; margin: 8px 0;">smart flashcards · 2026</p>
                        <p style="margin: 16px 0 24px;">Master anything with adaptive flashcards. Bite‑sized lessons, daily science facts & logic puzzles.</p>
                        <button id="getStartedBtn" style="background: var(--primary); color: white; width: 100%; padding: 18px; border-radius: 60px; font-size: 1.3rem; font-weight: 600; border: none;">Get Started →</button>
                        <div style="display: flex; gap: 20px; justify-content: center; margin: 28px 0 20px;">
                            <button class="legalLink" data-doc="privacy">Privacy Policy</button>
                            <button class="legalLink" data-doc="terms">Terms of Service</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ---------- Home dashboard ----------
        function renderHome() {
            return `
                <div>
                    <div class="card flex-row" style="padding: 14px 18px;">
                        <span>🔥 streak 12 days</span>
                        <span class="badge">level 7</span>
                    </div>
                    <div class="card">
                        <h3>continue learning</h3>
                        <div class="flex-row"><span>Science facts</span><span>70%</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
                        <div class="flex-row" style="margin-top: 14px;"><span>Logic puzzles</span><span>45%</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div>
                        <button class="startPractice" style="background:var(--primary); color:white; width:100%; padding: 14px; border-radius: 30px; margin-top: 16px; font-weight:600;">➕ practice now</button>
                    </div>
                    <div class="card">
                        <div class="flex-row"><span>📊 daily goal</span> <span>80%</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:80%"></div></div>
                        <div style="display: flex; gap:16px; margin-top:16px;">
                            <span>🏆 3 badges</span> <span>⚡ 240 XP</span>
                        </div>
                    </div>
                    <div class="card flex-row" style="gap:12px;">
                        ${iconFlashcard()} <span>flashcards ready: 24</span> ${iconPlay()} 
                    </div>
                </div>
            `;
        }

        // ---------- Learn (flashcards) ----------
        function renderLearn() {
            return `
                <div>
                    <div class="card" style="text-align:center;">
                        <span style="font-size: 2rem;">🧠</span>
                        <h3>Today’s deck: logic</h3>
                        <p style="margin: 4px 0 12px;">8 cards remaining</p>
                        <button class="startPractice" style="background:var(--primary); color:white; padding:12px 24px; border-radius:40px;">start revision</button>
                    </div>
                    <div class="card">
                        <h4>categories</h4>
                        <div class="icon-grid">
                            <span style="display:flex; gap:6px;">${iconLesson()} science</span>
                            <span style="display:flex; gap:6px;">${iconFlashcard()} vocab</span>
                            <span style="display:flex; gap:6px;">${iconPlay()} puzzles</span>
                        </div>
                    </div>
                    <div class="card">
                        <span>⭐ recommended: “Python basics” →</span>
                    </div>
                    <button class="startPractice" style="background:var(--card); border:2px solid var(--primary); width:100%; padding:16px; border-radius:40px;">➕ create custom deck</button>
                </div>
            `;
        }

        // ---------- Progress / Statistics ----------
        function renderProgress() {
            return `
                <div>
                    <div class="card flex-row">
                        <span>${iconChart()} total XP</span> <span style="font-weight:bold;">2,450</span>
                    </div>
                    <div class="card">
                        <h3>weekly activity</h3>
                        <div style="display:flex; gap:8px; justify-content:space-around;">
                            <div>M<br>120</div><div>T<br>90</div><div>W<br>200</div><div>T<br>150</div><div>F<br>270</div><div>S<br>80</div>
                        </div>
                    </div>
                    <div class="card">
                        <span>🏅 mastery: logic 80%</span><div class="progress-bar"><div class="progress-fill" style="width:80%"></div></div>
                        <span>🏅 science 45%</span><div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div>
                        <span style="display:block; margin-top:12px;">achievements unlocked: 8</span>
                    </div>
                    <div class="card">📈 next badge in 50 XP</div>
                </div>
            `;
        }

        // ---------- Settings + theme toggle ----------
        function renderSettings() {
            return `
                <div>
                    <div class="card flex-row">
                        <span>🌙 Dark mode</span>
                        <button id="themeToggleBtn" style="background:var(--primary); color:white; padding:8px 18px; border-radius:40px;">${darkMode ? 'light' : 'dark'}</button>
                    </div>
                    <div class="card">🔔 notifications</div>
                    <div class="card">🗣️ language: English</div>
                    <div class="card">📲 about · version 2026.1</div>
                </div>
            `;
        }

        // ---------- Profile (opened from header icon) ----------
        function renderProfile() {
            return `
                <div>
                    <div class="card" style="align-items:center;">
                        <svg width="56" height="56" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/></svg>
                        <h3>Alex Rivera</h3>
                        <p>alex.r@flashlearn.co</p>
                    </div>
                    <div class="card">📋 personal stats: 2400 XP, 12 streak</div>
                    <div class="card">⚙️ account settings</div>
                    <button id="backFromProfile" style="background:var(--primary); color:white; padding:16px; border-radius:40px; width:100%;">← Back to Home</button>
                </div>
            `;
        }

        // ---------- modals legal ----------
        function showLegal(doc) {
            const modal = document.getElementById('legalModal');
            document.getElementById('modalTitle').innerText = doc === 'privacy' ? 'Privacy Policy' : 'Terms of Service';
            document.getElementById('modalBody').innerText = doc === 'privacy' ? 'We don\'t collect data. This is a 2026 demo app.' : 'Educational use only. No real terms.';
            modal.classList.remove('hidden');
        }

        // ---------- event binding ----------
        function attachEvents() {
            // bottom navigation
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const screen = btn.dataset.screen;
                    if (screen) showScreen(screen);
                });
            });

            // profile icon
            document.getElementById('profileBtn').addEventListener('click', () => {
                showScreen('profile');
            });

            // global click for dynamic buttons
            document.addEventListener('click', (e) => {
                if (e.target.closest('#getStartedBtn')) {
                    showScreen('home');
                }
                else if (e.target.closest('.legalLink')) {
                    const doc = e.target.closest('.legalLink').dataset.doc;
                    showLegal(doc);
                }
                else if (e.target.closest('#closeModal')) {
                    document.getElementById('legalModal').classList.add('hidden');
                }
                else if (e.target.closest('#themeToggleBtn')) {
                    toggleTheme();
                }
                else if (e.target.closest('#backFromProfile')) {
                    showScreen('home');
                }
                else if (e.target.closest('.startPractice')) {
                    alert('practice session started (demo)');
                }
            });
        }

        // ---------- screenshot (shift+W) ----------
        document.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                html2canvas(phone, { scale: 2 }).then(canvas => {
                    const link = document.createElement('a');
                    screenshotCounter++;
                    let filename = (screenshotCounter <=5 ? screenshotCounter : screenshotCounter) + '.png';
                    if (darkMode && screenshotCounter <=6) filename = '6.png';
                    else if (!darkMode && screenshotCounter <=5) filename = screenshotCounter + '.png';
                    link.download = filename;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }).catch(() => alert('html2canvas not loaded – use shift+W in real env.'));
            }
        });

        // load html2canvas for screenshot
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        script.onload = () => console.log('screenshot ready');
        document.head.appendChild(script);

        // start with onboarding
        showScreen('onboarding');
        attachEvents();
    })();
</script>
</body>
</html>
All done!
