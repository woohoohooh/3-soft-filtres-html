```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Playground · 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* CSS variables – light mode default */
        :root {
            --bg-page: #e2e8f0;
            --bg-phone: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --text-muted: #64748B;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive-icon: #94A3B8;
            --border-light: #E2E8F0;
            --shadow: 0 20px 35px -8px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.02);
            --progress-bg: #E2E8F0;
            --tab-highlight: rgba(37, 99, 235, 0.08);
        }

        body.dark {
            --bg-page: #0a0f1a;
            --bg-phone: #0F172A;
            --card-bg: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --text-muted: #94A3B8;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive-icon: #64748B;
            --border-light: #334155;
            --shadow: 0 20px 35px -8px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
            --progress-bg: #334155;
            --tab-highlight: rgba(59, 130, 246, 0.15);
        }

        body {
            background: var(--bg-page);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg-phone);
            border-radius: 44px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background-color 0.2s;
        }

        /* screen container */
        .screen {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 8px 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--border-light);
            display: flex;
            flex-direction: column;
        }
        .screen::-webkit-scrollbar { width: 4px; }
        .screen::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 20px; }

        /* header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0 12px 0;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 16px;
        }
        .header h2 {
            font-size: 22px;
            font-weight: 650;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }
        .profile-btn svg {
            width: 28px;
            height: 28px;
            stroke: var(--text-primary);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            height: 70px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-light);
            padding: 6px 8px 10px 8px;
            justify-content: space-around;
            align-items: center;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: transparent;
            border: none;
            border-radius: 16px;
            padding: 6px 0 4px 0;
            cursor: pointer;
            transition: all 0.15s ease;
            color: var(--inactive-icon);
            fill: none;
            stroke: var(--inactive-icon);
        }
        .nav-item.active {
            background: var(--tab-highlight);
            stroke: var(--primary);
            color: var(--primary);
        }
        .nav-item.active svg {
            stroke: var(--primary);
            transform: scale(1.1);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.12s;
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            color: currentColor;
        }

        /* cards & elements */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02), 0 1px 2px rgba(0,0,0,0.03);
            border: 1px solid var(--border-light);
        }
        .flex-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-primary {
            background: var(--primary);
            border: none;
            padding: 16px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 18px;
            color: white;
            width: 100%;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 8px 20px -8px var(--primary);
        }
        .btn-primary:active { transform: scale(0.97); background: var(--primary-dark); }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 24px 0 8px;
            font-size: 14px;
        }
        .link-row button {
            background: none;
            border: none;
            color: var(--primary);
            text-decoration: underline;
            text-underline-offset: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: var(--card-bg);
            padding: 28px;
            border-radius: 32px;
            width: 280px;
            text-align: center;
            color: var(--text-primary);
            border: 1px solid var(--border-light);
        }
        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 20px;
            margin: 8px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 60%;
            border-radius: 20px;
        }
        .badge {
            display: inline-flex;
            background: var(--accent);
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            color: #0F172A;
        }
        .lesson-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px dashed var(--border-light);
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0;
        }
        .chart-simple {
            display: flex;
            gap: 6px;
            align-items: flex-end;
            height: 100px;
            margin-top: 16px;
        }
        .chart-bar {
            flex: 1;
            background: var(--primary);
            height: calc(100% - 20px);
            border-radius: 12px 12px 4px 4px;
            transition: height 0.3s ease;
        }
        /* hidden class for screens */
        .hidden { display: none; }
        .footer-meta { margin-top: auto; }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic header (injected per screen) -->
    <div id="appHeader" class="header"></div>

    <!-- screen views -->
    <div id="screensContainer" class="screen">
        <!-- all screens injected via JS -->
    </div>

    <!-- bottom navigation -->
    <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<script>
    (function() {
        // ---- THEME ----
        let currentTheme = 'light';
        const themeToggle = () => {
            document.body.classList.toggle('dark');
            currentTheme = document.body.classList.contains('dark') ? 'dark' : 'light';
        };

        // ---- SVG ICONS (inline, same style) ----
        const icons = {
            home: `<svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" stroke="currentColor" fill="none"/></svg>`,
            learn: `<svg viewBox="0 0 24 24"><path d="M4 20L12 16L20 20L12 12L4 20Z" stroke="currentColor" fill="none"/><path d="M4 12L12 8L20 12" stroke="currentColor" fill="none"/></svg>`,
            progress: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><path d="M12 7V12L15 15" stroke="currentColor" fill="none"/></svg>`,
            settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5" stroke="currentColor" fill="none"/><path d="M19.4 15L20.6 9L16.7 6.5L12 3L7.3 6.5L3.4 9L4.6 15L7.3 18.5L12 22L16.7 18.5L19.4 15Z" stroke="currentColor" fill="none"/></svg>`,
            profile: `<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" stroke="currentColor" fill="none"/><path d="M5 20V19C5 15.1 8.1 12 12 12C15.9 12 19 15.1 19 19V20" stroke="currentColor" fill="none"/></svg>`,
            lesson: `<svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2" stroke="currentColor" fill="none"/><path d="M8 10H16M8 14H12" stroke="currentColor"/></svg>`,
            chart: `<svg viewBox="0 0 24 24"><path d="M21 21H3V3M7 17V12M12 17V7M17 17V10" stroke="currentColor" fill="none"/></svg>`,
            flashcards: `<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" fill="none"/><path d="M9 7H15M9 11H15M9 15H13" stroke="currentColor"/></svg>`,
            play: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><polygon points="10,8 16,12 10,16" stroke="currentColor" fill="none"/></svg>`,
            check: `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" stroke="currentColor" fill="none"/></svg>`
        };

        // ---- screens data ----
        let activeScreen = 'onboarding'; // onboarding, home, learn, progress, settings

        // ---- build screens HTML (pure) ----
        function getScreenHTML(screen) {
            switch(screen) {
                case 'onboarding': return `
                    <div class="card" style="text-align: center; padding: 32px 20px;">
                        <div style="margin: 20px auto 16px;">${icons.learn.replace('currentColor', 'var(--primary)')}</div>
                        <h1 style="font-size: 44px; font-weight:700; letter-spacing:-1px;">Python</h1>
                        <p style="font-size: 20px; font-weight: 500; color: var(--primary);">code daily</p>
                        <p style="margin: 16px 0 28px; color: var(--text-secondary);">Master Python through bite-sized exercises and real‑time feedback. No setup needed.</p>
                        <button class="btn-primary" id="getStartedBtn">Get Started</button>
                        <div class="link-row">
                            <button id="privacyModalBtn">Privacy</button>
                            <button id="termsModalBtn">Terms</button>
                        </div>
                    </div>
                `;
                case 'home': return `
                    <div class="card">
                        <span class="badge">🔥 7 day streak</span>
                        <h3 style="margin: 12px 0 4px;">Continue learning</h3>
                        <div class="flex-row"><span>Functions & Loops</span> <span>75%</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div>
                        <button class="btn-primary" style="margin-top:16px; padding:12px;" id="quickPractice">Practice now</button>
                    </div>
                    <div class="card">
                        <div class="flex-row">${icons.flashcards} <span style="font-weight:600;">Daily picks</span></div>
                        <div class="lesson-item"><span>Recursion basics</span>${icons.play}</div>
                        <div class="lesson-item"><span>List comprehensions</span>${icons.play}</div>
                    </div>
                `;
                case 'learn': return `
                    <div class="card">
                        <h3>Python fundamentals</h3>
                        <div class="lesson-item"><span>Variables</span> <span class="badge">NEW</span></div>
                        <div class="progress-bar" style="margin:6px 0"><div class="progress-fill" style="width:100%"></div></div>
                        <div class="lesson-item"><span>Conditionals</span> ${icons.check}</div>
                        <div class="lesson-item"><span>Loops</span> ${icons.play}</div>
                        <div class="lesson-item"><span>Functions</span> ${icons.play}</div>
                    </div>
                    <div class="card">
                        <div class="flex-row">${icons.lesson}<span>Intermediate</span></div>
                        <div class="lesson-item">Data structures</div><div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div>
                    </div>
                `;
                case 'progress': return `
                    <div class="card">
                        <div class="flex-row">${icons.chart} <span>Weekly activity</span></div>
                        <div class="chart-simple">
                            <div class="chart-bar" style="height:40px;"></div><div class="chart-bar" style="height:70px;"></div><div class="chart-bar" style="height:55px;"></div><div class="chart-bar" style="height:90px;"></div><div class="chart-bar" style="height:30px;"></div>
                        </div>
                    </div>
                    <div class="stat-grid">
                        <div class="card" style="margin:0;">🔥 124<small>XP</small></div>
                        <div class="card" style="margin:0;">⏱️ 5.2h</div>
                        <div class="card" style="margin:0;">🏆 8 badges</div>
                        <div class="card" style="margin:0;">📚 42 lessons</div>
                    </div>
                `;
                case 'settings': return `
                    <div class="card">
                        <div class="flex-row">${icons.profile} <span>Profile</span></div>
                        <p>pythonista@example.com</p>
                    </div>
                    <div class="card">
                        <div class="flex-row" style="justify-content: space-between;">
                            <span>Dark mode</span>
                            <button id="themeToggleBtn" style="background:var(--primary); color:white; border:none; padding:8px 20px; border-radius:40px; cursor:pointer;">Toggle</button>
                        </div>
                    </div>
                    <div class="card">
                        <div class="flex-row">${icons.settings} <span>App version 2.6.0</span></div>
                    </div>
                `;
                default: return '';
            }
        }

        // ---- header title mapping ----
        const headerTitle = {
            onboarding: 'Welcome',
            home: 'Home',
            learn: 'Learn',
            progress: 'Progress',
            settings: 'Settings'
        };

        // ---- render UI ----
        function renderApp() {
            const headerDiv = document.getElementById('appHeader');
            const container = document.getElementById('screensContainer');
            const nav = document.getElementById('bottomNav');

            // header
            headerDiv.innerHTML = `
                <h2>${headerTitle[activeScreen]}</h2>
                <button class="profile-btn" id="profileHeaderBtn">${icons.profile}</button>
            `;

            // screen content
            container.innerHTML = getScreenHTML(activeScreen);

            // bottom navigation (only if not onboarding)
            if (activeScreen === 'onboarding') {
                nav.innerHTML = ''; // hide nav
            } else {
                const navItems = [
                    { id: 'home', label: 'Home', icon: icons.home },
                    { id: 'learn', label: 'Learn', icon: icons.learn },
                    { id: 'progress', label: 'Progress', icon: icons.progress },
                    { id: 'settings', label: 'Settings', icon: icons.settings }
                ];
                nav.innerHTML = navItems.map(item => `
                    <button class="nav-item ${activeScreen === item.id ? 'active' : ''}" data-nav="${item.id}">
                        ${item.icon}
                        <span class="nav-label">${item.label}</span>
                    </button>
                `).join('');
            }

            // attach listeners
            attachListeners();
        }

        // ---- event binding ----
        function attachListeners() {
            // profile header -> settings screen
            const profileBtn = document.getElementById('profileHeaderBtn');
            if (profileBtn) profileBtn.addEventListener('click', (e) => { e.stopPropagation(); activeScreen = 'settings'; renderApp(); });

            // bottom nav
            document.querySelectorAll('.nav-item[data-nav]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const navId = e.currentTarget.dataset.nav;
                    activeScreen = navId;
                    renderApp();
                });
            });

            // get started from onboarding
            const getStarted = document.getElementById('getStartedBtn');
            if (getStarted) getStarted.addEventListener('click', () => { activeScreen = 'home'; renderApp(); });

            // modal privacy/terms
            const privacyBtn = document.getElementById('privacyModalBtn');
            const termsBtn = document.getElementById('termsModalBtn');
            if (privacyBtn) privacyBtn.addEventListener('click', () => showModal('Privacy Policy', 'We keep your data safe, obviously.'));
            if (termsBtn) termsBtn.addEventListener('click', () => showModal('Terms of Service', 'Keep learning, be nice.'));

            // practice button on home
            const practice = document.getElementById('quickPractice');
            if (practice) practice.addEventListener('click', () => { activeScreen = 'learn'; renderApp(); });

            // theme toggle inside settings
            const themeBtn = document.getElementById('themeToggleBtn');
            if (themeBtn) themeBtn.addEventListener('click', themeToggle);
        }

        // ---- modal system ----
        function showModal(title, text) {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `<div class="modal"><h3>${title}</h3><p style="margin:16px 0;">${text}</p><button class="btn-primary" style="padding:10px;" id="closeModalBtn">Close</button></div>`;
            document.body.appendChild(overlay);
            document.getElementById('closeModalBtn').addEventListener('click', () => overlay.remove());
            overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
        }

        // --- screenshot counter (shift+W) ---
        let screenshotCounter = 1;
        document.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                // simplistic capture trigger (requires html2canvas? not available. fallback to simulated)
                // we just log increment + simulate screenshot naming
                const isDark = document.body.classList.contains('dark');
                let filename = isDark ? '6.png' : (screenshotCounter + '.png');
                if (!isDark && screenshotCounter < 6) {
                    screenshotCounter = screenshotCounter === 5 ? 5 : screenshotCounter + 1;
                }
                alert(`📸 Screenshot saved as ${filename} (simulated – in real prototype html2canvas would capture)`);
                if (!isDark && screenshotCounter === 6) screenshotCounter = 1; // reset for light
            }
        });

        // ---- initial render ----
        renderApp();

        // ---- prefill dark mode class removal ----
        document.body.classList.remove('dark');
    })();
</script>
<!-- no additional frameworks -->
</body>
</html>
All done!
