    <script>
        (function(){
            // ---------- THEME ----------
            let darkMode = false; // light default
            const root = document.documentElement;

            // ---------- ICON SYSTEM ----------

            };

            // ---------- SCREENS DATA ----------
            let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings

                modalContent.innerHTML = `<h3 style="margin-bottom:12px;">${title}</h3><p style="font-size:14px;">${bodyText}</p><button class="btn-primary" id="closeModalBtn">Close</button>`;

                });

            // ---------- Render functions per screen ----------
            function renderOnboarding() {
                headerTitle.innerText = 'Welcome';

                        <h2 style="font-size:36px; margin:12px 0 4px;">Math Brain</h2>
                        <p style="font-size:18px; color:var(--primary);">train your logic</p>
                        <p style="margin:20px 0 12px; color:var(--text-secondary);">Daily mental workouts. Sharpen your arithmetic & puzzles in 5 minutes.</p>
                        <button class="btn-primary" id="startGetStarted" style="margin:12px 0 18px;">Get Started →</button>
                        <div>
                            <span class="link-small" id="privacyLink">Privacy Policy</span> · 
                            <span class="link-small" id="termsLink">Terms of Service</span>

                    </div>
                `;
                mainView.innerHTML = html;
                document.getElementById('startGetStarted')?.addEventListener('click', ()=>{
                    currentScreen = 'home';
                    setActiveTab('home');
                    renderHome();
                });
                document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy', 'We respect your data. No sharing, period.'));
                document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms', 'Use Math Brain for good. Be nice.'));
            }

            function renderHome() {
                headerTitle.innerText = 'Home';

                    <div class="card flex-row"><span>🔥 Daily streak: 12 days</span> <span class="badge">+45 XP</span></div>

                        <button class="btn-primary" style="padding:12px;" id="quickPractice">Solve & earn</button>
                    </div>
                    <div class="card">
                        <div style="font-weight:600;">Recommended for you</div>
                        <div style="display:flex; gap:12px; margin:16px 0;">

                        <div class="progress-bar"><div class="progress-fill" style="width:47%;"></div></div>
                    </div>
                `;
                mainView.innerHTML = html;
                document.getElementById('quickPractice')?.addEventListener('click', ()=>{
                    currentScreen = 'learn';
                    setActiveTab('learn');
                    renderLearn();

            }

            function renderLearn() {
                headerTitle.innerText = 'Practice';
                let html = `
                    <div class="card flex-row"><span>🎯 Mental Gym</span><span>4/8 done</span></div>

                        <div style="flex:1"><b>Logic puzzles</b><div class="progress-bar"><div class="progress-fill" style="width:30%;"></div></div></div>
                    </div>

                mainView.innerHTML = html;
                document.getElementById('startLesson')?.addEventListener('click', ()=> { alert('Practice started! (simulated)'); });
            }

            function renderProgress() {
                headerTitle.innerText = 'Stats';
                let html = `
                    <div class="stat-grid">

                    <div class="card"><b>Time this week</b> 2h 18min</div>

            function renderSettings() {
                headerTitle.innerText = 'Settings';
                let html = `

                    <div class="card"><span class="link-small" id="privacySetting">Privacy</span> · <span class="link-small" id="termsSetting">Terms</span></div>

                mainView.innerHTML = html;
                const toggle = document.getElementById('darkToggle');
                if(toggle) toggle.addEventListener('change', (e)=>{
                    darkMode = e.target.checked;

                    // re-render current screen to update icon colors etc.
                    if(currentScreen === 'onboarding') renderOnboarding();
                    else if(currentScreen === 'home') renderHome();
                    else if(currentScreen === 'learn') renderLearn();
                    else if(currentScreen === 'progress') renderProgress();
                    else if(currentScreen === 'settings') renderSettings();

                document.getElementById('privacySetting')?.addEventListener('click', ()=> showModal('Privacy', 'Short and sweet.'));
                document.getElementById('termsSetting')?.addEventListener('click', ()=> showModal('Terms', 'Keep learning, be kind.'));
            }

            // ----- navigation -----
            function setActiveTab(tabId) {
                bottomNavItems.forEach(item => {
                    const tab = item.getAttribute('data-tab');
                    if(tab === tabId) item.classList.add('active');
                    else item.classList.remove('active');
                });
            }

            function navigateToScreen(screen) {
                currentScreen = screen;
                if(screen === 'home') { renderHome(); setActiveTab('home'); }
                else if(screen === 'learn') { renderLearn(); setActiveTab('learn'); }
                else if(screen === 'progress') { renderProgress(); setActiveTab('progress'); }
                else if(screen === 'settings') { renderSettings(); setActiveTab('settings'); }
                else if(screen === 'onboarding') { renderOnboarding(); bottomNavItems.forEach(i=> i.classList.remove('active')); }
            }

            // bottom nav click listeners
            bottomNavItems.forEach(item => {
                item.addEventListener('click', (e)=>{
                    const tab = item.getAttribute('data-tab');

                    else if(tab === 'progress') navigateToScreen('progress');

            // ---------- SHIFT + W screenshot capture ----------

                        link.download = filename;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    }).catch(() => alert('html2canvas not loaded — use fallback (but we have no external lib, so this is a simulated requirement.)'));
                }
            });

            // inject dummy html2canvas mock if not present (just to avoid error) - but we simulate
            if(typeof html2canvas === 'undefined') {
                window.html2canvas = (el) => { return new Promise((res)=> { console.log('screenshot mock'); res(document.createElement('canvas')); }); };
            }

            // predefine JSON output at bottom but not render.
        })();
