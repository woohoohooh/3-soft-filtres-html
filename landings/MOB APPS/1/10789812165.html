</head>

<script>
(function() {
    // ---------- THEME & STATE ----------
    let darkMode = false;

    let screenshotCounter = 1;

    // ---------- SVG ICONS (all inline, same style) ----------
    const icons = {

        profile: `<svg viewBox="0 0 24 24"><path d="M4 20C4 17 8 15 12 15C16 15 20 17 20 20M12 12C14.2 12 16 10.2 16 8C16 5.8 14.2 4 12 4C9.8 4 8 5.8 8 8C8 10.2 9.8 12 12 12Z" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>`,
        lesson: `<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" fill="none" stroke-width="2"/><line x1="9" y1="9" x2="15" y2="15" stroke="currentColor" stroke-width="2"/><line x1="15" y1="9" x2="9" y2="15" stroke="currentColor" stroke-width="2"/></svg>`,

        play: `<svg viewBox="0 0 24 24"><path d="M5 3L19 12L5 21V3Z" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
        check: `<svg viewBox="0 0 24 24"><path d="M20 6L9 17L4 12" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>`,
    };

    // ---------- RENDER HEADER ----------
    function renderHeader(title) {
        return `
            <div class="header">
                <h2>${title}</h2>
                <button class="profile-icon" id="profileBtn">${icons.profile}</button>
            </div>
        `;
    }

    // ---------- SCREEN TEMPLATES ----------
    function onboardingScreen() {
        return `
            ${renderHeader('Welcome')}
            <div style="flex:1; display: flex; flex-direction: column; justify-content: center;">
                <div style="background: var(--primary); width:70px; height:70px; border-radius:22px; display:flex; align-items:center; justify-content:center; margin-bottom:24px;">
                    <span style="font-size:36px; font-weight:700; color:white;">🧠</span>
                </div>
                <h1 style="font-size:34px; font-weight:700; color:var(--text-primary); letter-spacing:-1px;">Math Brain</h1>

                    <a href="#" id="termsLink" style="color:var(--text-muted); text-decoration:none; font-size:14px;">Terms</a>
                </div>
            </div>
        `;
    }

    function homeScreen() {
        return `
            ${renderHeader('Home')}

                <div style="margin-top:12px;">Next badge in 60pts</div>
            </div>

                <div class="space-between"><span style="font-weight:600;">Today's workout</span> <span>⚡ 5 min</span></div>

            </div>

            </div>
        `;
    }

    function learnScreen() {
        return `
            ${renderHeader('Learn')}
            <div class="card"><span style="font-weight:600;">Multiplication master</span><div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div><span>5/12 lessons</span></div>

    }

    function progressScreen() {
        return `
            ${renderHeader('Progress')}
            <div class="card space-between"><span>Total sessions</span><span style="font-weight:700;">47</span></div>
            <div class="card space-between"><span>Avg. score</span><span style="font-weight:700;">88%</span></div>
            <div class="card"><span style="font-weight:600;">Last 7 days</span>${icons.chart}<div style="height:80px; display:flex; gap:6px; align-items:end; margin-top:12px;"><div style="background:var(--primary); width:18px; height:60px; border-radius:12px;"></div><div style="background:var(--primary); width:18px; height:42px;"></div><div style="background:var(--primary); width:18px; height:70px;"></div><div style="background:var(--primary); width:18px; height:30px;"></div><div style="background:var(--primary); width:18px; height:80px;"></div><div style="background:var(--primary); width:18px; height:55px;"></div><div style="background:var(--primary); width:18px; height:66px;"></div></div></div>
            <div class="card"><span>🏆 Achievements: 8/20</span></div>
        `;
    }

    function settingsScreen() {
        const themeLabel = darkMode ? 'Dark' : 'Light';
        return `
            ${renderHeader('Settings')}
            <div class="card space-between">
                <span>Dark mode</span>
                <button id="themeToggleBtn" style="background:var(--primary); color:white; border:none; border-radius:30px; padding:8px 16px;">${themeLabel}</button>
            </div>
            <div class="card space-between"><span>Sound</span><span>🔔 on</span></div>
            <div class="card space-between"><span>Daily reminder</span><span>8:00 AM</span></div>
            <div class="card">Profile: Alex T.</div>
        `;
    }

    // ---------- RENDER APP ----------
    const appDiv = document.getElementById('app');
    const phoneInner = document.getElementById('phone-inner');

    function renderScreen() {
        let content = '';
        switch(currentScreen) {
            case 'onboarding': content = onboardingScreen(); break;
            case 'home': content = homeScreen(); break;
            case 'learn': content = learnScreen(); break;
            case 'progress': content = progressScreen(); break;
            case 'settings': content = settingsScreen(); break;
        }
        // wrap screen + bottom nav
        appDiv.innerHTML = `
            <div class="screen active" id="active-screen">${content}</div>
        `;
        // bottom nav
        const navActive = currentScreen === 'onboarding' ? 'home' : currentScreen; // onboarding -> home inactive
        const navHtml = `
            <div class="bottom-nav">
                <button class="nav-item ${navActive === 'home' ? 'active' : ''}" data-nav="home"><span>${icons.home}</span><span>Home</span></button>
                <button class="nav-item ${navActive === 'learn' ? 'active' : ''}" data-nav="learn"><span>${icons.learn}</span><span>Learn</span></button>
                <button class="nav-item ${navActive === 'progress' ? 'active' : ''}" data-nav="progress"><span>${icons.progress}</span><span>Progress</span></button>
                <button class="nav-item ${navActive === 'settings' ? 'active' : ''}" data-nav="settings"><span>${icons.settings}</span><span>Settings</span></button>
            </div>
        `;
        phoneInner.innerHTML = ''; // rebuild clean
        phoneInner.appendChild(appDiv);
        const navContainer = document.createElement('div');
        navContainer.innerHTML = navHtml;
        phoneInner.appendChild(navContainer.firstElementChild);

        // attach listeners
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const nav = btn.dataset.nav;
                if (nav) { currentScreen = nav; renderScreen(); }
            });
        });

        // profile btn
        const profileBtn = document.getElementById('profileBtn');
        if (profileBtn) profileBtn.addEventListener('click', ()=>{
            currentScreen = 'settings'; renderScreen();
        });

        // onboarding specific
        if (currentScreen === 'onboarding') {
            document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                currentScreen = 'home'; renderScreen();
            });
            document.getElementById('privacyLink')?.addEventListener('click', (e)=>{
                e.preventDefault(); document.getElementById('privacyModal').style.visibility = 'visible'; document.getElementById('privacyModal').style.opacity = 1;
            });
            document.getElementById('termsLink')?.addEventListener('click', (e)=>{
                e.preventDefault(); document.getElementById('termsModal').style.visibility = 'visible'; document.getElementById('termsModal').style.opacity = 1;
            });
        }

        // theme toggle (settings)
        const themeBtn = document.getElementById('themeToggleBtn');
        if (themeBtn) {
            themeBtn.addEventListener('click', ()=>{
                darkMode = !darkMode;
                document.body.classList.toggle('dark', darkMode);
                renderScreen(); // refresh to show new label
            });
        }

        // quick practice
        document.getElementById('quickPractice')?.addEventListener('click', ()=>{
            alert('3 + 5 = ? (quick demo)');
        });
    }

    // modals close
    document.getElementById('closePrivacy').addEventListener('click', ()=>{document.getElementById('privacyModal').style.visibility = 'hidden';opacity=0;});
    document.getElementById('closeTerms').addEventListener('click', ()=>{document.getElementById('termsModal').style.visibility = 'hidden';opacity=0;});

    // screenshot SHIFT+W
    window.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.key === 'W') {
            const phone = document.getElementById('phoneContainer');
            html2canvas?.(phone, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                const num = darkMode ? 6 : screenshotCounter;
                link.download = `${num}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                if (!darkMode && screenshotCounter < 5) screenshotCounter++;
            }).catch(()=> alert('html2canvas not loaded, but pretend screenshot'));
        }
    });

    // init
    renderScreen();

    // dummy html2canvas (for demo, if undefined -> alert)
    if (typeof html2canvas === 'undefined') {
        window.html2canvas = (el) => Promise.resolve({ toDataURL: ()=>'#' });
    }
})();
</script>
