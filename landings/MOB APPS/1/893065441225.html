            padding: 20px;
        }

        /* phone container */
        .phone {

        /* main app screen */
        .app-screen {

            scrollbar-width: thin;

        }

        .app-screen::-webkit-scrollbar {
            width: 4px;
        }
        .app-screen::-webkit-scrollbar-track {
            background: var(--card);
        }
        .app-screen::-webkit-scrollbar-thumb {
            background: var(--primary);

        }

        /* header (consistent across screens) */
        .header {
            display: flex;

            padding: 6px;

        }
        .profile-icon:hover {
            background: var(--border);
        }
        .profile-icon svg {
            width: 28px;
            height: 28px;

            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* bottom navigation */
        .bottom-nav {
            display: flex;

        }
        .link-row span {
            color: var(--primary);

            cursor: pointer;
        }

        /* modal */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;

        .modal-content {
            background: var(--card);

            box-shadow: var(--shadow);

        }
        .modal-content h3 {
            margin-bottom: 10px;
        }
        .modal-close {
            margin-top: 20px;
            text-align: right;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
        }

        /* progress bar */
        .progress-bar-bg {
            background: var(--border);
            height: 12px;
            border-radius: 30px;
            overflow: hidden;
            margin: 12px 0;
        }

            height: 100%;

        }

        /* hide/show screens */
        .screen {
            display: none;

        .screen.active {

            display: flex;

        .toggle {
            width: 48px;
            height: 26px;
            background: var(--border);
            border-radius: 30px;
            position: relative;
            cursor: pointer;
        }
        .toggle::after {
            content: '';
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: 0.2s;
        }
        .toggle.active {
            background: var(--primary);
        }
        .toggle.active::after {
            left: 24px;
        }
    </style>
</head>

            chart: `<svg viewBox="0 0 24 24"><path d="M3 17V20H21V17" stroke="currentColor" fill="none"/><path d="M7 14V10" stroke="currentColor"/><path d="M12 14V6" stroke="currentColor"/><path d="M17 14V8" stroke="currentColor"/></svg>`,

        // ensure profile icon also works for dynamic screens (use event delegation)

    })();
