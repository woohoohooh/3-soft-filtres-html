<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic puzzles · brain training (prototype)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a2634;
            padding: 16px;
        }
        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 42px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2d3a47;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
        }
        /* screen wrapper */
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--icon-inactive) transparent;
            padding: 16px 16px 8px 16px;
        }
        .screen::-webkit-scrollbar {
            width: 4px;
        }
        .screen::-webkit-scrollbar-thumb {
            background: var(--icon-inactive);
            border-radius: 20px;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 16px 0;
        }
        .header h2 {
            font-size: 22px;
            font-weight: 650;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-icon {
            cursor: pointer;
            padding: 6px 4px 2px 4px;
            border-radius: 30px;
            transition: background 0.1s;
        }
        .profile-icon:hover {
            background: var(--card-bg);
        }

        /* bottom nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--card-bg);
            padding: 8px 4px 10px 4px;
            border-top: 1px solid var(--border-light);
            backdrop-filter: blur(2px);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            flex: 1;
            padding: 6px 0 4px 0;
            border-radius: 20px;
            transition: background 0.15s, transform 0.1s;
            color: var(--icon-inactive);
            fill: var(--icon-inactive);
        }
        .nav-item.active {
            color: var(--accent-blue);
            fill: var(--accent-blue);
            background: rgba(37, 99, 235, 0.08);
            transform: scale(1.02);
        }
        .nav-item.active svg {
            transform: scale(1.12);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            transition: transform 0.15s;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
        }

        /* global vars / themes */
        :root {
            --bg-primary: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --icon-inactive: #94A3B8;
            --accent-blue: #2563EB;
            --accent-dark: #1E40AF;
            --accent-soft: #38BDF8;
            --border-light: #E2E8F0;
            --progress-bg: #E2E8F0;
        }
        .dark-mode {
            --bg-primary: #0F172A;
            --card-bg: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --icon-inactive: #94A3B8;
            --accent-blue: #3B82F6;
            --accent-dark: #2563EB;
            --accent-soft: #38BDF8;
            --border-light: #334155;
            --progress-bg: #334155;
        }

        /* common elements */
        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 24px 0 16px 0;
        }
        .app-logo svg {
            width: 56px;
            height: 56px;
            stroke: var(--accent-blue);
            fill: var(--accent-blue);
        }
        .app-name {
            font-size: 34px;
            font-weight: 700;
            color: var(--accent-blue);
            letter-spacing: -1px;
            margin: 8px 0 4px;
        }
        .tagline {
            font-size: 18px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .desc-text {
            text-align: center;
            color: var(--text-secondary);
            margin: 16px 0 24px;
            line-height: 1.5;
            font-size: 15px;
        }
        .btn-large {
            background: var(--accent-blue);
            color: white;
            border: none;
            width: 100%;
            padding: 18px 0;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin: 16px 0 24px;
            box-shadow: 0 10px 20px -5px var(--accent-blue);
            transition: 0.15s;
        }
        .btn-large:active {
            transform: scale(0.97);
            background: var(--accent-dark);
        }
        .legal-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            font-size: 13px;
        }
        .legal-links span {
            color: var(--accent-blue);
            text-decoration: underline;
            cursor: pointer;
        }
        /* card & dashboard */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 18px 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            border: 1px solid var(--border-light);
        }
        .row-space {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .badge {
            background: var(--accent-soft);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 13px;
        }
        .progress-bar {
            background: var(--progress-bg);
            height: 8px;
            border-radius: 30px;
            margin: 10px 0;
        }
        .progress-fill {
            background: var(--accent-blue);
            width: 65%;
            height: 8px;
            border-radius: 30px;
        }
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .lesson-item:last-child {
            border-bottom: none;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-cell {
            background: var(--bg-primary);
            padding: 14px;
            border-radius: 20px;
            text-align: center;
        }
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg);
            width: 280px;
            padding: 24px;
            border-radius: 36px;
            text-align: center;
            color: var(--text-primary);
        }
        .modal-content button {
            margin-top: 20px;
            padding: 8px 24px;
            background: var(--accent-blue);
            border: none;
            border-radius: 40px;
            color: white;
            font-weight: 600;
        }
        .hidden {
            display: none !important;
        }
        /* micro charts */
        .chart {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 70px;
            margin-top: 8px;
        }
        .chart-bar {
            width: 22px;
            background: var(--accent-blue);
            border-radius: 12px 12px 4px 4px;
            height: calc(100% * var(--h));
            transition: height 0.3s;
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">

        <div class="nav-item" data-tab="learn"><svg viewBox="0 0 24 24"><path d="M2 3H8C10.2091 3 12 4.79086 12 7V21C12 19.8954 11.1046 19 10 19H2V3Z" stroke="currentColor" fill="none"/><path d="M22 3H16C13.7909 3 12 4.79086 12 7V21C12 19.8954 12.8954 19 14 19H22V3Z" stroke="currentColor" fill="none"/></svg><span class="nav-label">Learn</span></div>
        <div class="nav-item" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3" stroke="currentColor" fill="none"/><path d="M12 7V12L15 15" stroke="currentColor" fill="none"/><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/></svg><span class="nav-label">Progress</span></div>
        <div class="nav-item" data-tab="settings"><svg viewBox="0 0 24 24"><path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke="currentColor" fill="none"/><path d="M19.4 15C19.2062 15.3839 19.0692 15.7956 19 16.22L20.5 18.29L18 20.79L15.88 19.29C15.06 19.68 14.16 19.93 13.22 20L12 23H10L8.78 20C7.84 19.93 6.94 19.68 6.12 19.29L4 20.79L1.5 18.29L3 16.22C2.93 15.8 2.8 15.39 2.6 15C2.4 14.61 2.25 14.2 2.15 13.78L0 12L2.15 10.22C2.25 9.8 2.4 9.39 2.6 9C2.8 8.61 2.93 8.2 3 7.78L1.5 5.71L4 3.21L6.12 4.71C6.94 4.32 7.84 4.07 8.78 4L10 1H12L13.22 4C14.16 4.07 15.06 4.32 15.88 4.71L18 3.21L20.5 5.71L19 7.78C19.07 8.2 19.2 8.61 19.4 9C19.6 9.39 19.75 9.8 19.85 10.22L22 12L19.85 13.78C19.75 14.2 19.6 14.61 19.4 15Z" stroke="currentColor" fill="none"/></svg><span class="nav-label">Settings</span></div>

</div>

<!-- modal template -->
<div id="modalOverlay" class="modal hidden">
    <div class="modal-content">
        <p id="modalText">Privacy Policy · dummy text</p>
        <button id="closeModal">Close</button>
    </div>

<script>
    (function() {
        // ---------- icon system ----------
        const icons = {
            profile: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21V19C20 16.7909 18.2091 15 16 15H8C5.79086 15 4 16.7909 4 19V21"/><circle cx="12" cy="7" r="4"/></svg>',
            lesson: '<svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 19.5C4 18.837 4.26339 18.2011 4.73223 17.7322C5.20107 17.2634 5.83696 17 6.5 17H20"/><path d="M6.5 2H20V22H6.5C5.83696 22 5.20107 21.7366 4.73223 21.2678C4.26339 20.7989 4 20.163 4 19.5V4.5C4 3.83696 4.26339 3.20107 4.73223 2.73223C5.20107 2.26339 5.83696 2 6.5 2Z"/></svg>',
            chart: '<svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20V14"/></svg>',
            flashcards: '<svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M8 8h8M8 12h6M8 16h4"/></svg>',
            play: '<svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16" fill="currentColor"/></svg>',
            check: '<svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>',
        };

        // app state
        let currentScreen = 'onboarding';
        let darkMode = false;
        let screenshotCounter = 0;

        // screens definition
        const screens = {
            onboarding: `
                <div class="header">
                    <h2>Welcome</h2>
                    <div class="profile-icon" data-nav="settings">${icons.profile}</div>
                </div>
                <div class="logo-area">
                    <div class="app-logo">${icons.flashcards.replace('width="20"','width="56"').replace('height="20"','height="56"')}</div>
                    <div class="app-name">Puzzl•Logic</div>
                    <div class="tagline">train your brain</div>
                </div>
                <div class="desc-text">Daily logic puzzles & brain teasers. Short sessions, big results. Start your 7‑day streak!</div>
                <button class="btn-large" id="getStartedBtn">Get Started</button>
                <div class="legal-links">
                    <span id="privacyLink">Privacy Policy</span>
                    <span id="termsLink">Terms of Service</span>
                </div>
            `,
            home: `
                <div class="header">
                    <h2>Home</h2>
                    <div class="profile-icon" data-nav="settings">${icons.profile}</div>
                </div>
                <div class="card">
                    <div class="row-space"><span class="badge">🔥 7 day streak</span><span>⭐ 340 pts</span></div>
                    <div style="font-weight:600;margin:8px 0 4px;">Today's puzzle</div>
                    <div style="background:var(--accent-soft);padding:14px;border-radius:18px;color:#0F172A;font-weight:500;">“Which number is missing? 3, 6, 11, 18, ?”</div>
                    <button class="btn-large" style="margin:16px 0 0;padding:12px;" id="solvePuzzleBtn">Solve →</button>
                </div>
                <div class="card">
                    <div class="row-space"><span>🚀 Daily warm-up</span> <span>${icons.play} start</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:40%"></div></div>
                    <div class="lesson-item">${icons.lesson} 5 logic grids · intermediate</div>
                    <div class="lesson-item">${icons.flashcards} 10 pattern flashcards</div>
                </div>
            `,
            learn: `
                <div class="header">
                    <h2>Learn</h2>
                    <div class="profile-icon" data-nav="settings">${icons.profile}</div>
                </div>
                <div class="card">
                    <div style="font-weight:600;margin-bottom:8px;">Categories</div>
                    <div class="lesson-item">🧩 Deduction puzzles <span style="margin-left:auto;">12 min</span></div>
                    <div class="lesson-item">🔢 Number sequences <span style="margin-left:auto;">8 min</span></div>
                    <div class="lesson-item">📐 Spatial reasoning <span style="margin-left:auto;">10 min</span></div>
                    <div class="lesson-item">⚖️ Lateral thinking <span style="margin-left:auto;">15 min</span></div>
                </div>
                <div class="card">
                    <div class="row-space"><span>⭐ recommended</span><span>${icons.flashcards} advanced</span></div>
                    <div style="background:var(--bg-primary);padding:12px;border-radius:18px;">"Einstein's riddle" — start</div>
                </div>
            `,
            progress: `
                <div class="header">
                    <h2>Progress</h2>
                    <div class="profile-icon" data-nav="settings">${icons.profile}</div>
                </div>
                <div class="card">
                    <div class="row-space"><span>🏆 puzzles solved</span><span>82</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
                    <div class="stat-grid">
                        <div class="stat-cell">accuracy<br><b>89%</b></div>
                        <div class="stat-cell">streak<br><b>7</b></div>
                    </div>
                </div>
                <div class="card">
                    <span>weekly activity</span>
                    <div class="chart">
                        <div class="chart-bar" style="--h:0.6"></div><div class="chart-bar" style="--h:0.8"></div><div class="chart-bar" style="--h:0.5"></div><div class="chart-bar" style="--h:0.9"></div><div class="chart-bar" style="--h:0.7"></div>
                    </div>
                </div>
                <div class="card">${icons.chart} 82 puzzles · 45h total</div>
            `,
            settings: `
                <div class="header">
                    <h2>Settings</h2>
                    <div class="profile-icon" data-nav="settings">${icons.profile}</div>
                </div>
                <div class="card">
                    <div class="row-space"><span>🌙 Dark mode</span><label><input type="checkbox" id="darkModeToggle"></label></div>
                    <div class="row-space"><span>🔔 Notifications</span><span>on</span></div>
                </div>
                <div class="card">
                    <div>Profile · logic_fan</div>
                    <div style="font-size:13px;color:var(--text-secondary);">member since 2025</div>
                </div>
                <div class="card" style="text-align:center;">version 1.0 · brain training</div>
            `,
        };

        const screenContent = document.getElementById('screenContent');
        const phone = document.getElementById('phoneContainer');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalText = document.getElementById('modalText');
        const closeModal = document.getElementById('closeModal');

        // render screen
        function renderScreen(name) {
            if (screens[name]) {
                screenContent.innerHTML = screens[name];
                currentScreen = name;
                attachScreenEvents();
            }
            updateNavActive(name);
        }

        function attachScreenEvents() {
            // profile icon click opens settings
            document.querySelectorAll('.profile-icon').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    renderScreen('settings');
                });
            });
            // get started
            const startBtn = document.getElementById('getStartedBtn');
            if(startBtn) startBtn.addEventListener('click', ()=> renderScreen('home'));
            // legal modals
            const privacy = document.getElementById('privacyLink');
            const terms = document.getElementById('termsLink');
            if(privacy) privacy.addEventListener('click', ()=> showModal('Privacy policy · we respect your data. (demo)'));
            if(terms) terms.addEventListener('click', ()=> showModal('Terms of service · logic puzzles only. (demo)'));
            // dark mode toggle
            const toggle = document.getElementById('darkModeToggle');
            if(toggle) {
                toggle.checked = darkMode;
                toggle.addEventListener('change', (e) => {
                    darkMode = e.target.checked;
                    if(darkMode) phone.classList.add('dark-mode');
                    else phone.classList.remove('dark-mode');
                });
            }
            // puzzle solve demo (any button)
            const puzzleBtn = document.getElementById('solvePuzzleBtn');
            if(puzzleBtn) puzzleBtn.addEventListener('click', ()=> { if(confirm('answer: 27 (demo)')) {} });
        }

        function showModal(text) {
            modalText.innerText = text;
            modalOverlay.classList.remove('hidden');
        }
        closeModal.addEventListener('click', ()=> modalOverlay.classList.add('hidden'));

        // bottom nav
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', (e) => {
                const tab = item.dataset.tab; // home, learn, progress, settings
                if(tab === 'home') renderScreen('home');
                else if(tab === 'learn') renderScreen('learn');
                else if(tab === 'progress') renderScreen('progress');
                else if(tab === 'settings') renderScreen('settings');
            });
        });

        function updateNavActive(screenName) {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
                if((screenName === 'home' && item.dataset.tab==='home') ||
                   (screenName === 'learn' && item.dataset.tab==='learn') ||
                   (screenName === 'progress' && item.dataset.tab==='progress') ||
                   (screenName === 'settings' && item.dataset.tab==='settings')) {
                    item.classList.add('active');
                }
            });
        }

        // ---------- screenshot (shift+W) ----------
        window.addEventListener('keydown', (e) => {
            if(e.shiftKey && e.key === 'W') {
                screenshotCounter++;
                let filename = darkMode ? '6.png' : (screenshotCounter + '.png');
                // forced sequential for light: 1..5
                if(!darkMode && screenshotCounter<=5) filename = screenshotCounter + '.png';
                if(darkMode) filename = '6.png'; // always 6.png if dark

                // html2canvas would be ideal but no libs; we'll simulate capture via console
                alert(`📸 screenshot captured: ${filename} (simulated — would save phone container)`);
                // you'd use html2canvas here, but no external. just for spec.
            }
        });

        // start with onboarding
        renderScreen('onboarding');

        // additional: show modal click outside close
        modalOverlay.addEventListener('click', (e) => {
            if(e.target === modalOverlay) modalOverlay.classList.add('hidden');
        });
    })();
</script>
