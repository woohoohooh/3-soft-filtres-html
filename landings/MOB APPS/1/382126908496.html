```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeFlash · Learn Python</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }
    body {
      min-height: 100vh;
      background: #0B1120;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .phone-frame {
      width: 360px;
      height: 780px;
      background: var(--bg-primary);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 8px #1E293B;
      position: relative;
      transition: background 0.2s;
    }
    :root {
      --bg-primary: #F8FAFC;
      --bg-card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --border-light: #E2E8F0;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --inactive: #94A3B8;
      --shadow: 0 8px 20px rgba(0,0,0,0.03);
    }
    .dark-mode {
      --bg-primary: #0F172A;
      --bg-card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --border-light: #334155;
      --primary: #3B82F6;
      --accent: #38BDF8;
    }
    .app-screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
      transition: background 0.2s;
    }
    .header {
      padding: 18px 16px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-light);
      box-shadow: var(--shadow);
    }
    .header h1 {
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -0.3px;
      color: var(--text-primary);
    }
    .profile-icon {
      cursor: pointer;
      padding: 6px;
      border-radius: 12px;
      transition: background 0.1s;
    }
    .profile-icon:hover { background: var(--border-light); }
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      scrollbar-width: thin;
    }
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 12px;
      background: var(--bg-card);
      border-top: 1px solid var(--border-light);
      box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px 0 4px;
      border-radius: 16px;
      transition: all 0.15s;
      min-width: 64px;
    }
    .nav-item span {
      font-size: 12px;
      font-weight: 500;
      color: var(--inactive);
      transition: 0.1s;
    }
    .nav-item.active {
      background: rgba(37, 99, 235, 0.08);
    }
    .nav-item.active svg path {
      stroke: var(--primary) !important;
      stroke-width: 2.2;
    }
    .nav-item.active span {
      color: var(--primary);
      font-weight: 600;
    }
    .nav-item svg {
      width: 24px;
      height: 24px;
      transition: transform 0.12s;
    }
    .nav-item.active svg { transform: scale(1.15); }
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .modal-card {
      background: var(--bg-card);
      width: 280px;
      padding: 28px 20px;
      border-radius: 28px;
      color: var(--text-primary);
      text-align: center;
      box-shadow: 0 20px 30px #00000055;
    }
    .modal-card h3 { margin-bottom: 12px; }
    .modal-card button {
      margin-top: 20px;
      background: var(--primary);
      border: none;
      color: white;
      padding: 10px 24px;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
    }
    .hidden { display: none; }
    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px 0;
      border-radius: 40px;
      font-size: 18px;
      font-weight: 700;
      width: 100%;
      margin: 20px 0 14px;
      cursor: pointer;
      transition: 0.1s;
      box-shadow: 0 6px 14px #2563eb50;
    }
    .small-link { font-size: 14px; color: var(--primary); cursor: pointer; margin: 0 8px; }
    .footer-links { display: flex; justify-content: center; margin-top: 8px; }
    .card {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-light);
    }
    .row-between { display: flex; justify-content: space-between; align-items: center; }
    .progress-bar-bg {
      height: 8px;
      background: var(--border-light);
      border-radius: 20px;
      margin: 8px 0;
    }
    .progress-fill {
      height: 8px;
      background: var(--primary);
      border-radius: 20px;
      width: 0%;
      transition: width 0.3s;
    }
    .badge-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }
    .badge {
      background: var(--bg-primary);
      padding: 12px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stat-row {
      display: flex;
      gap: 16px;
      margin: 12px 0;
    }
    .stat-item { flex: 1; background: var(--bg-primary); padding: 16px; border-radius: 20px; text-align: center; }
    .toggle-switch {
      width: 46px; height: 24px; background: var(--border-light); border-radius: 40px;
      position: relative; display: inline-block; cursor: pointer;
    }
    .toggle-slider {
      width: 20px; height: 20px; background: white; border-radius: 50%;
      position: absolute; top: 2px; left: 2px; transition: 0.15s;
    }
    .dark-mode .toggle-slider { left: 24px; background: var(--primary); }
  </style>
</head>
<body>
<div class="phone-frame" id="phoneFrame">
  <div class="app-screen" id="appScreen">
    <!-- header will be injected per screen -->
    <div id="dynamicHeader"></div>
    <!-- main content -->
    <div id="mainContent" class="main-content"></div>
    <!-- bottom nav -->
    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-item" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Home</span></button>
      <button class="nav-item" data-nav="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 4V20M20 12H4" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke-width="2"/></svg><span>Learn</span></button>
      <button class="nav-item" data-nav="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3" stroke-width="2"/><circle cx="12" cy="12" r="9" stroke-width="2"/><path d="M12 8V12L15 15" stroke-width="2"/></svg><span>Progress</span></button>
      <button class="nav-item" data-nav="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke-width="2"/><path d="M19.4 15C18.9 16 18.1 16.7 17.2 17.2L19 20.6L16 21L15.2 17.8C14.3 18.1 13.3 18.2 12.3 18.2C11.3 18.2 10.3 18.1 9.4 17.8L8.6 21L5.6 20.6L7.4 17.2C6.5 16.7 5.7 16 5.2 15L2 14L3 11L5.8 10.5C5.7 9.8 5.7 9.2 5.8 8.5L3 8L4 5L7.2 5.8C7.8 4.8 8.7 4 9.7 3.5L10 1H14L14.3 3.5C15.3 4 16.2 4.8 16.8 5.8L20 5L21 8L18.2 8.5C18.3 9.2 18.3 9.8 18.2 10.5L21 11L20 14L17 14.5Z" stroke-width="2"/></svg><span>Settings</span></button>
    </nav>
  </div>
  <!-- modal container -->
  <div id="modalContainer" class="modal-overlay hidden"></div>
</div>
<script>
(function() {
  // ----- THEME & UTILS -----
  let currentTheme = 'light'; // 'light' or 'dark'
  let currentScreen = 'onboarding'; // screens: onboarding, home, learn, progress, settings
  let screenshotCounter = 1;
  const phone = document.getElementById('phoneFrame');
  const headerDiv = document.getElementById('dynamicHeader');
  const mainDiv = document.getElementById('mainContent');
  const modal = document.getElementById('modalContainer');
  const navButtons = document.querySelectorAll('.nav-item');

  function toggleTheme() {
    phone.classList.toggle('dark-mode');
    currentTheme = phone.classList.contains('dark-mode') ? 'dark' : 'light';
    renderScreen(currentScreen); // re-render current screen to reflect theme
  }

  // ----- SVG ICON SYSTEM (reusable inline) -----
  const icons = {
    profile: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20C6 16 10 16 12 16C14 16 18 16 20 20"/><circle cx="12" cy="8" r="5"/></svg>',
    lesson: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3H8C10 3 12 5 12 7C12 5 14 3 16 3H22V19H16C14 19 12 21 12 21C12 21 10 19 8 19H2V3Z"/></svg>',
    chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17V12M9 17V7M15 17V10M21 17V3"/></svg>',
    flashcards: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 7H16M8 12H14M8 17H12"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16" fill="currentColor"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12,2 15,9 22,9 16,14 19,22 12,17 5,22 8,14 2,9 9,9 12,2"/></svg>'
  };

  // ----- MODAL -----
  function showModal(title, content) {
    modal.innerHTML = `
      <div class="modal-card">
        <h3>${title}</h3>
        <p style="color:var(--text-secondary)">${content}</p>
        <button id="closeModalBtn">Got it</button>
      </div>
    `;
    modal.classList.remove('hidden');
    document.getElementById('closeModalBtn').addEventListener('click', () => modal.classList.add('hidden'));
  }

  // ----- SCREENSHOT (SHIFT+W) -----
  document.addEventListener('keydown', (e) => {
    if (e.shiftKey && e.key === 'W') {
      const isDark = phone.classList.contains('dark-mode');
      const filename = isDark ? '6.png' : (screenshotCounter + '.png');
      if (!isDark && screenshotCounter < 6) screenshotCounter = (screenshotCounter % 5) + 1;

      html2canvas?.(phone, { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = filename;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(err => alert('Screenshot failed (html2canvas not loaded?)'));
    }
  });

  // Include html2canvas via CDN (silent)
  const script = document.createElement('script');
  script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  document.head.appendChild(script);

  // ----- RENDER SCREEN -----
  function renderScreen(screen) {
    currentScreen = screen;
    // header always with title + profile icon
    let title = '';
    if (screen === 'onboarding') title = 'CodeFlash';
    else if (screen === 'home') title = 'Dashboard';
    else if (screen === 'learn') title = 'Python Drills';
    else if (screen === 'progress') title = 'Your Stats';
    else if (screen === 'settings') title = 'Settings';

    headerDiv.innerHTML = `
      <div class="header">
        <h1>${title}</h1>
        <div class="profile-icon" id="profileBtn">${icons.profile}</div>
      </div>
    `;
    document.getElementById('profileBtn')?.addEventListener('click', () => { renderScreen('settings'); });

    // render main content based on screen
    if (screen === 'onboarding') mainDiv.innerHTML = renderOnboarding();
    else if (screen === 'home') mainDiv.innerHTML = renderHome();
    else if (screen === 'learn') mainDiv.innerHTML = renderLearn();
    else if (screen === 'progress') mainDiv.innerHTML = renderProgress();
    else if (screen === 'settings') mainDiv.innerHTML = renderSettings();

    // highlight bottom nav
    const navMap = { home:0, learn:1, progress:2, settings:3 };
    navButtons.forEach((btn, idx) => {
      btn.classList.remove('active');
      if (screen !== 'onboarding' && idx === navMap[screen]) btn.classList.add('active');
    });
  }

  // ----- SCREEN CONTENT -----
  function renderOnboarding() {
    return `
      <div style="padding:24px 0; text-align:center;">
        <div style="background: var(--primary); width:80px; height:80px; border-radius:26px; margin:0 auto 20px; display:flex; align-items:center; justify-content:center;">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 2L2 7L12 12L22 7L12 2Z"/><path d="M2 17L12 22L22 17"/><path d="M2 12L12 17L22 12"/></svg>
        </div>
        <h2 style="font-size:32px; font-weight:700; color:var(--text-primary)">CodeFlash</h2>
        <p style="color:var(--accent); font-weight:600; margin:4px 0 12px;">learn Python · 3 min a day</p>
        <p style="color:var(--text-secondary); max-width:260px; margin:0 auto;">Bite-sized coding exercises, flashcards, and real‑time feedback. Master Python basics.</p>
        <button class="btn-primary" id="getStartedBtn">Get Started</button>
        <div class="footer-links">
          <span class="small-link" id="privacyLink">Privacy Policy</span>
          <span class="small-link" id="termsLink">Terms of Service</span>
        </div>
      </div>
    `;
  }

  function renderHome() {
    return `
      <div class="card">
        <div class="row-between"><span style="font-weight:600; color:var(--text-primary)">Today's goal</span> <span style="color:var(--primary)">3/5</span></div>
        <div class="progress-bar-bg"><div class="progress-fill" style="width:60%"></div></div>
        <p style="margin-top:8px; color:var(--text-secondary)">🔥 2 day streak</p>
      </div>
      <div class="card">
        <div style="display:flex; gap:8px; align-items:center; margin-bottom:8px">${icons.flashcards}<span style="font-weight:600; color:var(--text-primary)">Continue lesson</span></div>
        <p><strong>Variables & Types</strong> · 80% complete</p>
        <div class="progress-bar-bg"><div class="progress-fill" style="width:80%"></div></div>
        <button class="btn-primary" style="margin:16px 0 0; padding:12px;" id="quickPractice">▶  Practice now</button>
      </div>
      <div class="badge-grid">
        <div class="badge">${icons.star} Beginner</div>
        <div class="badge">${icons.chart} 120 XP</div>
      </div>
    `;
  }

  function renderLearn() {
    return `
      <div class="card row-between"><span>📘 Lists & loops</span> <span style="color:var(--primary)">75%</span></div>
      <div class="card row-between"><span>📘 Functions</span> <span style="color:var(--primary)">30%</span></div>
      <div class="card row-between"><span>📘 Dictionaries</span> <span style="color:var(--primary)">10%</span></div>
      <div class="card" style="background:var(--accent)20; border:1px solid var(--accent);">
        <div class="row-between"><span>🔥 Daily flashcards</span>${icons.flashcards}</div>
        <p style="margin:8px 0">6 terms to review</p>
        <button class="btn-primary" style="margin:0; padding:10px;" id="startFlashcards">Start</button>
      </div>
    `;
  }

  function renderProgress() {
    return `
      <div class="stat-row">
        <div class="stat-item"><span style="font-size:20px;font-weight:700;color:var(--primary)">42</span><br>lessons</div>
        <div class="stat-item"><span style="font-size:20px;font-weight:700;color:var(--primary)">8</span><br>hours</div>
      </div>
      <div class="card"><span>🏆 XP this week</span>${icons.chart}<div class="progress-bar-bg" style="margin:12px 0"><div class="progress-fill" style="width:70%"></div></div></div>
      <div class="badge-grid">
        <div class="badge">🔥 7 day streak</div>
        <div class="badge">⭐ 340 XP</div>
      </div>
    `;
  }

  function renderSettings() {
    const isDark = phone.classList.contains('dark-mode');
    return `
      <div class="card row-between"><span>🌙 Dark mode</span><div class="toggle-switch" id="themeToggle"><div class="toggle-slider"></div></div></div>
      <div class="card"><span>👤 Profile</span><br><span style="color:var(--text-secondary)">pythonista@example.com</span></div>
      <div class="card"><span>🔔 Notifications</span> <span style="color:var(--primary)">On</span></div>
      <div class="card"><span>📲 App version 2.6.0</span></div>
    `;
  }

  // ----- NAVIGATION & EVENT DELEGATION -----
  navButtons.forEach(btn => {
    btn.addEventListener('click', (e) => {
      const nav = e.currentTarget.dataset.nav;
      if (nav === 'home') renderScreen('home');
      if (nav === 'learn') renderScreen('learn');
      if (nav === 'progress') renderScreen('progress');
      if (nav === 'settings') renderScreen('settings');
    });
  });

  // global click handler for dynamic elements
  document.addEventListener('click', (e) => {
    if (e.target.id === 'getStartedBtn') renderScreen('home');
    if (e.target.id === 'privacyLink') showModal('Privacy Policy', 'Your data stays on device. No tracking.');
    if (e.target.id === 'termsLink') showModal('Terms of Service', 'Use CodeFlash for learning. Be nice.');
    if (e.target.id === 'quickPractice' || e.target.id === 'startFlashcards') {
      showModal('Practice', 'Quick exercise: print("hello world") — (simulated)');
    }
    if (e.target.closest('#themeToggle')) toggleTheme();
  });

  // initial onboarding
  renderScreen('onboarding');
})();
</script>
</body>
</html>
All done!
