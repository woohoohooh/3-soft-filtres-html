```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic puzzles · brain training</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --border: #E2E8F0;
            --icon-inactive: #94A3B8;
            --shadow: 0 4px 12px rgba(0,0,0,0.03);
            --nav-bg: #FFFFFF;
            --chart-grid: #E2E8F0;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --border: #334155;
            --icon-inactive: #64748B;
            --nav-bg: #1E293B;
            --chart-grid: #334155;
        }

        body {
            background: #1a1f2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 25px 60px -15px rgba(0,20,40,0.5);
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
            transition: background-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        /* main app area (flex column) */
        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            background-color: var(--bg);
        }

        /* header */
        .header {
            padding: 16px 18px 8px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: transparent;
        }
        .header h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }

        /* main content (flex-grow) */
        .screen-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 18px 4px 18px;
            scrollbar-width: thin;
            scrollbar-color: var(--icon-inactive) transparent;
        }
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: var(--icon-inactive);
            border-radius: 10px;
        }

        /* bottom nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 8px 12px;
            background-color: var(--nav-bg);
            border-top: 1px solid var(--border);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            color: var(--icon-inactive);
            transition: all 0.15s ease;
            gap: 4px;
            padding: 6px 0 4px;
        }
        .nav-item.active {
            color: var(--primary);
            transform: scale(1.02);
        }
        .nav-item.active svg {
            stroke: var(--primary);
            transform: scale(1.15);
            filter: drop-shadow(0 2px 4px rgba(37,99,235,0.2));
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: transform 0.15s;
        }
        .nav-item span {
            transition: color 0.15s;
        }

        /* cards / UI elements */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            background: var(--accent);
            color: #0F172A;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 40px;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 8px 18px -6px var(--primary);
            transition: 0.1s;
        }
        .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }

        .progress-bar {
            height: 8px;
            background: var(--border);
            border-radius: 40px;
            overflow: hidden;
            margin: 12px 0;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-number {
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
        }

        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: var(--card);
            width: 280px;
            border-radius: 32px;
            padding: 24px;
            color: var(--text);
        }

        .theme-toggle {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .theme-btn {
            flex: 1;
            padding: 12px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            cursor: pointer;
        }

        /* mini chart */
        .chart {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 100px;
            margin: 20px 0;
        }
        .bar {
            flex: 1;
            background: var(--primary);
            height: calc(100% * var(--h));
            border-radius: 12px 12px 4px 4px;
            transition: height 0.3s;
        }

        /* onboarding link */
        .legal-link {
            background: none;
            border: none;
            color: var(--text-light);
            text-decoration: underline;
            font-size: 13px;
            margin: 0 6px;
            cursor: pointer;
        }

        .hidden { display: none; }
    </style>
</head>
<body class="">
    <div class="phone" id="phoneContainer">
        <div class="app" id="app">
            <!-- header will be rewritten per screen, but we put dynamic area -->
            <div id="headerArea" class="header">
                <h2 id="screenTitle">Loading</h2>
                <button class="profile-btn" id="profileBtn">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke-linecap="round"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </button>
            </div>

            <!-- dynamic screens injected here -->
            <div id="screenContent" class="screen-container">
                <!-- initial content: onboarding (js will replace) -->
            </div>

            <!-- bottom navigation (always visible) -->
            <nav class="bottom-nav" id="bottomNav">
                <button class="nav-item" data-tab="home">
                    <svg viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                    <span>Home</span>
                </button>
                <button class="nav-item" data-tab="learn">
                    <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                    <span>Learn</span>
                </button>
                <button class="nav-item" data-tab="progress">
                    <svg viewBox="0 0 24 24"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/></svg>
                    <span>Progress</span>
                </button>
                <button class="nav-item" data-tab="settings">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    <span>Settings</span>
                </button>
            </nav>
        </div>
    </div>

    <script>
        (function() {
            // ---------- THEME ----------
            let darkMode = false;
            const root = document.documentElement;
            const body = document.body;
            function setTheme(isDark) {
                if (isDark) body.classList.add('dark');
                else body.classList.remove('dark');
                darkMode = isDark;
            }

            // ---------- SCREENS DATA ----------
            const screens = {
                onboarding: { name: 'Welcome' },
                home: { name: 'Home' },
                learn: { name: 'Logic training' },
                progress: { name: 'Statistics' },
                settings: { name: 'Settings' }
            };
            let currentScreen = 'onboarding';

            // ---------- icon system ----------
            function iconProfile() { return `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`; }

            // ---------- navigation ----------
            const contentDiv = document.getElementById('screenContent');
            const headerTitle = document.getElementById('screenTitle');
            const profileBtn = document.getElementById('profileBtn');

            function showScreen(screenId) {
                if (screenId === 'profile') screenId = 'settings';
                currentScreen = screenId;
                headerTitle.innerText = screens[screenId]?.name || 'App';
                renderScreenContent(screenId);
                updateActiveNav(screenId);
            }

            function updateActiveNav(active) {
                document.querySelectorAll('.nav-item').forEach(item => {
                    const tab = item.dataset.tab;
                    if (tab === active) item.classList.add('active');
                    else item.classList.remove('active');
                });
            }

            // modals for legal
            function showModal(text) {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.innerHTML = `<div class="modal"><h3 style="margin-bottom:12px">${text}</h3><p style="margin-bottom:20px">Sample legal text for ${text}. This is a demo.</p><button class="btn-primary" style="padding:10px" id="closeModal">Close</button></div>`;
                document.getElementById('app').appendChild(overlay);
                document.getElementById('closeModal').addEventListener('click', ()=>overlay.remove());
                overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
            }

            // ---------- render logic ----------
            function renderScreenContent(screen) {
                let html = '';
                if (screen === 'onboarding') {
                    html = `
                        <div class="card" style="text-align:center; padding:32px 20px;">
                            <div style="background:var(--primary); width:72px; height:72px; border-radius:24px; margin:0 auto 16px; display:flex; align-items:center; justify-content:center;">
                                <svg width="48" height="48" viewBox="0 0 24 24" stroke="white" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                            </div>
                            <h1 style="font-size:32px; font-weight:700; color:var(--text);">Puzzler</h1>
                            <p style="font-size:18px; color:var(--primary); margin:4px 0 8px;">logic · every day</p>
                            <p style="color:var(--text-light); margin:16px 0">Train your brain with daily logic puzzles, riddles and thinking games.</p>
                            <button class="btn-primary" id="getStartedBtn">Get Started</button>
                            <div style="margin-top:24px;">
                                <button class="legal-link" id="privacyLink">Privacy Policy</button> · 
                                <button class="legal-link" id="termsLink">Terms of Service</button>
                            </div>
                        </div>
                    `;
                } else if (screen === 'home') {
                    html = `
                        <div class="card">
                            <div class="row"><span style="font-weight:600">Daily streak</span> <span class="badge">🔥 7 days</span></div>
                            <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
                            <div class="row"><span>Today's puzzles</span> <span>3/5 done</span></div>
                        </div>
                        <div class="card">
                            <h3 style="margin-bottom:12px">Recommended</h3>
                            <div style="display:flex; gap:12px; margin-bottom:8px">
                                <span class="badge" style="background:#E2E8F0; color:var(--text)">⚡ 5 min</span>
                                <span class="badge" style="background:#E2E8F0; color:var(--text)">hard</span>
                            </div>
                            <p style="font-size:18px; font-weight:600">Einstein's riddle</p>
                            <button class="btn-primary" style="padding:12px; margin-top:12px" id="startPracticeHome">start practice</button>
                        </div>
                        <div class="card">
                            <span style="font-weight:600">Categories</span>
                            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px">
                                <div style="background:var(--bg); border-radius:20px; padding:16px; text-align:center;">🔲 patterns</div>
                                <div style="background:var(--bg); border-radius:20px; padding:16px; text-align:center;">⬜ deduction</div>
                            </div>
                        </div>
                    `;
                } else if (screen === 'learn') {
                    html = `
                        <div class="card">
                            <h3>Today's brain warm-up</h3>
                            <div style="display:flex; gap:10px; margin:16px 0;">
                                <span class="badge">logic grid</span>
                                <span class="badge">intermediate</span>
                            </div>
                            <p style="margin:8px 0">Five friends, five favorite drinks ...</p>
                            <button class="btn-primary" style="padding:10px" id="startLessonBtn">Start puzzle</button>
                        </div>
                        <div class="card">
                            <div class="row"><span>📘 deduction 101</span> <span>75%</span></div>
                            <div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div>
                            <div class="row"><span>🧩 spatial</span> <span>30%</span></div>
                            <div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div>
                        </div>
                        <div class="card">
                            <span>Next mastery:</span> <strong>Knight/Knave</strong>
                            <div style="display:flex; gap:6px; margin-top:16px"> <span class="badge">🎯 +50xp</span> </div>
                        </div>
                    `;
                } else if (screen === 'progress') {
                    html = `
                        <div class="card">
                            <span class="stat-number">1,280</span> <span>total puzzles</span>
                            <div style="margin:12px 0">accuracy <strong>84%</strong></div>
                            <div class="chart">
                                <div class="bar" style="--h:0.9"></div><div class="bar" style="--h:0.7"></div><div class="bar" style="--h:1"></div><div class="bar" style="--h:0.8"></div>
                            </div>
                            <div class="row"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span></div>
                        </div>
                        <div class="card">
                            <span>🏆 4 achievements</span><br>
                            <span>🔥 7 day streak</span>
                        </div>
                    `;
                } else if (screen === 'settings') {
                    html = `
                        <div class="card">
                            <div style="display:flex; gap:20px; align-items:center; margin-bottom:20px">
                                ${iconProfile()}
                                <div><strong>Alex Rivera</strong><br>alex@email.com</div>
                            </div>
                            <div>App theme</div>
                            <div class="theme-toggle">
                                <button class="theme-btn" id="lightThemeBtn">Light</button>
                                <button class="theme-btn" id="darkThemeBtn">Dark</button>
                            </div>
                            <div style="margin:20px 0">
                                <button class="legal-link" id="privacyLinkSettings">Privacy</button> 
                                <button class="legal-link" id="termsLinkSettings">Terms</button>
                            </div>
                        </div>
                    `;
                }
                contentDiv.innerHTML = html;

                // attach event listeners per screen
                if (screen === 'onboarding') {
                    document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{ showScreen('home'); });
                    document.getElementById('privacyLink')?.addEventListener('click', ()=>showModal('Privacy Policy'));
                    document.getElementById('termsLink')?.addEventListener('click', ()=>showModal('Terms of Service'));
                }
                if (screen === 'home') {
                    document.getElementById('startPracticeHome')?.addEventListener('click', ()=>showScreen('learn'));
                }
                if (screen === 'learn') {
                    document.getElementById('startLessonBtn')?.addEventListener('click', ()=>{ alert('Puzzle started! (demo)'); });
                }
                if (screen === 'settings') {
                    document.getElementById('lightThemeBtn')?.addEventListener('click', ()=>setTheme(false));
                    document.getElementById('darkThemeBtn')?.addEventListener('click', ()=>setTheme(true));
                    document.getElementById('privacyLinkSettings')?.addEventListener('click', ()=>showModal('Privacy Policy'));
                    document.getElementById('termsLinkSettings')?.addEventListener('click', ()=>showModal('Terms of Service'));
                }
            }

            // bottom nav listeners
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const tab = btn.dataset.tab;
                    showScreen(tab);
                });
            });

            // profile icon -> settings
            profileBtn.addEventListener('click', ()=> showScreen('settings'));

            // start with onboarding
            showScreen('onboarding');

            // ---------- screenshot feature (SHIFT+W) ----------
            let screenshotCounter = 1;
            window.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    // Capture phone container
                    const phone = document.getElementById('phoneContainer');
                    // In real prototype, we would use html2canvas, but not included. Instead output sequential name and simulate.
                    const isDark = body.classList.contains('dark');
                    let filename = isDark ? '6.png' : (screenshotCounter + '.png');
                    if (!isDark && screenshotCounter < 6) {
                        screenshotCounter = (screenshotCounter % 5) + 1;
                    } else if (isDark) {
                        filename = '6.png';
                    }
                    alert(`📸 Screenshot saved as ${filename} (simulated)`);
                }
            });

            // JSON titles (will output at the end)
            window.__titles = {
                "1.png": "Start Learning",
                "2.png": "Daily Lessons",
                "3.png": "Practice Skills",
                "4.png": "Track Progress",
                "5.png": "Smart Settings",
                "6.png": "Dark Theme"
            };
        })();
    </script>
</body>
</html>
