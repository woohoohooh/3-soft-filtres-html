```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Brain Trainer • prototype</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --border-light: #E2E8F0;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --inactive: #94A3B8;
      --shadow: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,0,0,0.05);
      --header-icon: #1E293B;
    }

    body.dark {
      --bg: #0F172A;
      --card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --border-light: #334155;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --inactive: #64748B;
      --shadow: 0 8px 20px rgba(0,0,0,0.5);
      --header-icon: #F1F5F9;
    }

    body {
      background: #1a1e2b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background-color: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.3), 0 0 0 8px #2d3340;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: background-color 0.2s;
    }

    /* screen wrapper */
    .screen {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
      scrollbar-width: thin;
      scrollbar-color: var(--inactive) transparent;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .screen::-webkit-scrollbar {
      width: 4px;
    }
    .screen::-webkit-scrollbar-thumb {
      background: var(--inactive);
      border-radius: 20px;
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0 8px 0;
    }
    .header h2 {
      font-size: 22px;
      font-weight: 650;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--header-icon);
    }

    /* bottom navigation */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: var(--card);
      border-top: 1px solid var(--border-light);
      padding: 8px 6px 10px;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
      border: none;
      cursor: pointer;
      gap: 4px;
      transition: all 0.15s ease;
      color: var(--inactive);
      fill: var(--inactive);
    }
    .nav-item.active {
      color: var(--primary);
      fill: var(--primary);
      transform: scale(1.05);
    }
    .nav-item.active .nav-icon {
      filter: drop-shadow(0 2px 6px rgba(37,99,235,0.3));
    }
    .nav-icon {
      width: 24px;
      height: 24px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nav-label {
      font-size: 11px;
      font-weight: 500;
    }

    /* cards & elements */
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 18px 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-light);
    }
    .flex-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .gap-4 { gap: 4px; }
    .mt-4 { margin-top: 16px; }
    .mb-2 { margin-bottom: 8px; }
    .text-secondary { color: var(--text-secondary); font-size: 14px; }

    .btn-primary {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      padding: 16px 24px;
      border-radius: 40px;
      font-size: 18px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 10px 20px -8px var(--primary);
      transition: 0.1s;
    }
    .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }

    .pill-link {
      color: var(--text-secondary);
      text-decoration: underline;
      font-size: 13px;
      cursor: pointer;
    }

    /* modal */
    .modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-content {
      background: var(--card);
      padding: 28px 22px;
      border-radius: 32px;
      width: 280px;
      text-align: center;
      color: var(--text-primary);
      border: 1px solid var(--border-light);
    }
    .modal-content button {
      margin-top: 20px;
      background: var(--primary);
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
    }

    /* progress bar */
    .progress-bar {
      height: 8px;
      background: var(--border-light);
      border-radius: 20px;
      overflow: hidden;
      width: 100%;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.2s;
    }

    .badge {
      background: var(--accent);
      color: #0F172A;
      padding: 6px 12px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 13px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-item {
      background: var(--bg);
      padding: 12px;
      border-radius: 18px;
      text-align: center;
    }

    /* chart dummy */
    .chart-line {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 70px;
      margin: 10px 0;
    }
    .bar {
      width: 22px;
      background: var(--primary);
      border-radius: 8px 8px 4px 4px;
      transition: height 0.3s;
    }

    /* icons inline reused */
    .icon-defs {
      display: none;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <!-- inline SVG definitions (invisible) -->
  <svg style="display:none;" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <symbol id="icon-home" viewBox="0 0 24 24"><path d="M5 12H3L12 3L21 12H19" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M5 12V20H9V16H15V20H19V12" stroke="currentColor" stroke-width="2" fill="none"/></symbol>
      <symbol id="icon-learn" viewBox="0 0 24 24"><path d="M2 3H8C10.2 3 12 4.8 12 7V21C12 19.9 11.1 19 10 19H2V3Z" stroke="currentColor" stroke-width="2" fill="none"/><path d="M22 3H16C13.8 3 12 4.8 12 7V21C12 19.9 12.9 19 14 19H22V3Z" stroke="currentColor" stroke-width="2" fill="none"/></symbol>
      <symbol id="icon-progress" viewBox="0 0 24 24"><path d="M21 12C21 16.97 16.97 21 12 21C7.03 21 3 16.97 3 12C3 7.03 7.03 3 12 3" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="12" r="2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 6V12L15 15" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M19.4 15C18.9 16 18 16.6 17 16.9L16 19.2C15.7 20 15 20.5 14.1 20.5H9.9C9 20.5 8.3 20 8 19.2L7 16.9C6 16.6 5.1 16 4.6 15L2.5 14C1.8 13.5 1.5 12.8 1.5 12C1.5 11.2 1.8 10.5 2.5 10L4.6 9C5.1 8 6 7.4 7 7.1L8 4.8C8.3 4 9 3.5 9.9 3.5H14.1C15 3.5 15.7 4 16 4.8L17 7.1C18 7.4 18.9 8 19.4 9L21.5 10C22.2 10.5 22.5 11.2 22.5 12C22.5 12.8 22.2 13.5 21.5 14L19.4 15Z" stroke="currentColor" stroke-width="2" fill="none"/></symbol>
      <symbol id="icon-profile" viewBox="0 0 24 24"><path d="M20 21V19C20 16.8 18.2 15 16 15H8C5.8 15 4 16.8 4 19V21" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2" fill="none"/></symbol>
      <symbol id="icon-lesson" viewBox="0 0 24 24"><path d="M4 19.5C4 18.1 5.1 17 6.5 17H20" stroke="currentColor" stroke-width="2" fill="none"/><path d="M6.5 2H20V22H6.5C5.1 22 4 20.9 4 19.5V4.5C4 3.1 5.1 2 6.5 2Z" stroke="currentColor" stroke-width="2" fill="none"/></symbol>
      <symbol id="icon-chart" viewBox="0 0 24 24"><path d="M21 20H3" stroke="currentColor" stroke-width="2"/><path d="M7 16V12" stroke="currentColor" stroke-width="2"/><path d="M12 16V8" stroke="currentColor" stroke-width="2"/><path d="M17 16V4" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="icon-flashcards" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M9 8H15" stroke="currentColor" stroke-width="2"/><path d="M9 12H15" stroke="currentColor" stroke-width="2"/><path d="M9 16H13" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="icon-play" viewBox="0 0 24 24"><path d="M5 3L19 12L5 21V3Z" stroke="currentColor" stroke-width="2" fill="none"/></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2" fill="none"/></symbol>
    </defs>
  </svg>

  <div class="phone" id="phoneContainer">
    <!-- screens will be injected via JS -->
    <div id="app"></div>
    <!-- bottom nav (static, but controlled by js) -->
    <div class="bottom-nav" id="bottomNav">
      <button class="nav-item" data-screen="home"><svg class="nav-icon"><use href="#icon-home"></use></svg><span class="nav-label">Home</span></button>
      <button class="nav-item" data-screen="learn"><svg class="nav-icon"><use href="#icon-learn"></use></svg><span class="nav-label">Learn</span></button>
      <button class="nav-item" data-screen="progress"><svg class="nav-icon"><use href="#icon-progress"></use></svg><span class="nav-label">Progress</span></button>
      <button class="nav-item" data-screen="settings"><svg class="nav-icon"><use href="#icon-settings"></use></svg><span class="nav-label">Settings</span></button>
    </div>
  </div>

  <script>
    (function() {
      // ----- theme & state -----
      let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
      let darkMode = false;
      let screenshotCounter = 0; // for shift+w naming

      const screens = {
        onboarding: null,
        home: null,
        learn: null,
        progress: null,
        settings: null,
      };

      // root element
      const app = document.getElementById('app');
      const bottomNav = document.getElementById('bottomNav');
      const phone = document.getElementById('phoneContainer');

      // helper: render icon from sprite
      function useIcon(name, className = '') {
        return `<svg class="nav-icon ${className}"><use href="#icon-${name}"></use></svg>`;
      }

      // modal control
      let modalDiv = null;
      function showModal(title, text) {
        if (modalDiv) modalDiv.remove();
        modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
          <div class="modal-content">
            <h3 style="margin-bottom: 12px;">${title}</h3>
            <p style="margin-bottom: 16px;">${text}</p>
            <button id="closeModalBtn">Got it</button>
          </div>
        `;
        phone.appendChild(modalDiv);
        document.getElementById('closeModalBtn').addEventListener('click', ()=>{
          modalDiv.remove(); modalDiv = null;
        });
      }

      // update active nav
      function setActiveNav(screenId) {
        const navs = bottomNav.querySelectorAll('.nav-item');
        navs.forEach(btn => {
          const scr = btn.dataset.screen;
          if (scr === screenId) btn.classList.add('active');
          else btn.classList.remove('active');
        });
      }

      // profile click opens settings
      function attachProfile() {
        document.querySelectorAll('.profile-btn').forEach(btn => {
          btn.removeEventListener('click', profileHandler);
          btn.addEventListener('click', profileHandler);
        });
      }
      function profileHandler() {
        navigateTo('settings');
      }

      // navigation
      function navigateTo(screenId) {
        if (screenId === 'onboarding') screenId = 'home'; // skip after start
        currentScreen = screenId;
        renderScreen(screenId);
        setActiveNav(screenId);
      }

      // render based on screen id
      function renderScreen(id) {
        if (id === 'onboarding') app.innerHTML = renderOnboarding();
        else if (id === 'home') app.innerHTML = renderHome();
        else if (id === 'learn') app.innerHTML = renderLearn();
        else if (id === 'progress') app.innerHTML = renderProgress();
        else if (id === 'settings') app.innerHTML = renderSettings();
        attachProfile();

        // after render, attach any extra listeners (like get started)
        if (id === 'onboarding') {
          document.getElementById('getStartedBtn')?.addEventListener('click', ()=> navigateTo('home'));
          document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy Policy','We respect your data. No sharing.'));
          document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms of Service','Use Math Brain Trainer responsibly.'));
        }
        if (id === 'learn') {
          document.querySelector('.btn-primary')?.addEventListener('click', ()=>{
            alert('Quick practice started! (simulated)');
          });
        }
        if (id === 'settings') {
          const toggle = document.getElementById('themeToggle');
          if (toggle) {
            toggle.checked = darkMode;
            toggle.addEventListener('change', (e) => {
              darkMode = e.target.checked;
              if (darkMode) document.body.classList.add('dark');
              else document.body.classList.remove('dark');
              renderScreen(currentScreen); // re-render with new theme
            });
          }
        }
      }

      // ----- onboarding -----
      function renderOnboarding() {
        return `
          <div class="screen">
            <div class="card" style="text-align: center; margin-top: 40px;">
              ${useIcon('flashcards','')} <span style="font-size: 48px;">🧠</span>
              <h1 style="font-size: 38px; font-weight:700; margin: 10px 0 4px;">Math Brain</h1>
              <p style="font-size: 20px; font-weight: 500; color: var(--primary);">trainer</p>
              <p style="margin: 24px 0 12px; font-size:16px;">Quick mental math & logic workouts. Daily 5-min exercises sharpen your mind.</p>
              <button class="btn-primary" id="getStartedBtn">Get Started</button>
              <div style="display:flex; gap:24px; justify-content:center; margin: 20px 0 10px;">
                <span class="pill-link" id="privacyLink">Privacy Policy</span>
                <span class="pill-link" id="termsLink">Terms of Service</span>
              </div>
            </div>
          </div>
        `;
      }

      // home dashboard
      function renderHome() {
        return `
          <div class="screen">
            <div class="header">
              <h2>Dashboard</h2>
              <button class="profile-btn">${useIcon('profile')}</button>
            </div>
            <div class="card">
              <div class="flex-row" style="justify-content:space-between;"><span>Daily streak</span> <span class="badge">15 days</span></div>
              <div class="progress-bar mt-4"><div class="progress-fill" style="width:75%"></div></div>
              <div class="flex-row mt-4" style="justify-content:space-around;">
                <div>🔥 1240 XP</div><div>⚡ level 7</div>
              </div>
            </div>
            <div class="card">
              <h3 style="margin-bottom:12px;">Today's workout</h3>
              <div class="flex-row gap-4"><span>🧮 quick calc</span><span>▶️ 5 min</span></div>
              <div class="flex-row gap-4"><span>📐 logic puzzle</span><span>▶️ 3 min</span></div>
              <button class="btn-primary" style="margin-top:16px; padding:12px;">Start practice</button>
            </div>
            <div class="card">
              <div style="display:flex; justify-content:space-between;"><span>🏆 achievements</span><span>view all</span></div>
              <div class="flex-row">${useIcon('check','')} first blood  •  ${useIcon('flashcards','')} 20 cards</div>
            </div>
          </div>
        `;
      }

      // learn screen
      function renderLearn() {
        return `
          <div class="screen">
            <div class="header"><h2>Learn</h2><button class="profile-btn">${useIcon('profile')}</button></div>
            <div class="card">
              <div class="flex-row"><span>📘 algebra basics</span><span>70%</span></div><div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
            </div>
            <div class="card">
              <div class="flex-row"><span>🧩 logic puzzles</span><span>30%</span></div><div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div>
            </div>
            <div class="card">
              <div class="flex-row"><span>📊 daily challenge</span> ${useIcon('play','')}</div>
              <button class="btn-primary" style="padding:12px; margin-top:10px;">Start lesson</button>
            </div>
          </div>
        `;
      }

      // progress screen
      function renderProgress() {
        const barHeights = [42, 58, 32, 47, 60];
        return `
          <div class="screen">
            <div class="header"><h2>Progress</h2><button class="profile-btn">${useIcon('profile')}</button></div>
            <div class="card stat-grid">
              <div class="stat-item"><span>total sessions</span><br><strong>48</strong></div>
              <div class="stat-item"><span>accuracy</span><br><strong>92%</strong></div>
            </div>
            <div class="card">
              <div style="display:flex; justify-content:space-between;">weekly activity ${useIcon('chart','')}</div>
              <div class="chart-line">
                ${barHeights.map(h => `<div class="bar" style="height:${h}px;"></div>`).join('')}
              </div>
            </div>
            <div class="card">🏅 master of multiplication – earned 2 days ago</div>
          </div>
        `;
      }

      // settings/profile
      function renderSettings() {
        return `
          <div class="screen">
            <div class="header"><h2>Settings</h2><button class="profile-btn">${useIcon('profile')}</button></div>
            <div class="card">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span>Dark theme</span>
                <label><input type="checkbox" id="themeToggle" ${darkMode ? 'checked' : ''}></label>
              </div>
            </div>
            <div class="card">
              <p>Profile: <strong>Alex M.</strong></p>
              <p>Member since 2026</p>
            </div>
            <div class="card">⚙️ notification preferences</div>
          </div>
        `;
      }

      // initial render
      renderScreen('onboarding');
      setActiveNav('home'); // but onboarding first, so no active

      // bottom navigation listeners
      bottomNav.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const screen = e.currentTarget.dataset.screen;
          navigateTo(screen);
        });
      });

      // ----- SHIFT+W screenshot simulation (sequential naming) -----
      window.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.key === 'W') {
          e.preventDefault();
          screenshotCounter++;
          let filename = screenshotCounter + '.png';
          if (darkMode && screenshotCounter <=5) {
            // dark mode active: override to 6.png if first shot (simple rule)
            if (screenshotCounter === 1) filename = '6.png';
            else if (screenshotCounter === 2) filename = '6.png'; // but keep simple: always use 6.png if dark any
          }
          if (darkMode) filename = '6.png'; 
          // simulate alert with name
          alert(`📸 Screenshot captured: ${filename} (phone container mock)`);
        }
      });

      // attach modals to links
      setTimeout(attachProfile, 50);
    })();
  </script>
  <!-- final JSON required -->
  <script>
    (function() { window.titles = {
      "1.png": "Start Learning",
      "2.png": "Daily Lessons",
      "3.png": "Practice Skills",
      "4.png": "Track Progress",
      "5.png": "Smart Settings",
      "6.png": "Dark Theme"
    };})();
  </script>
</body>
</html>
All done!
