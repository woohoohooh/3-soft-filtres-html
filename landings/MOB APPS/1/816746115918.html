```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Brain Trainer · prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1e2b;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 44px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 0 8px #2d3340;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background 0.2s;
        }

        /* theme variables */
        .light {
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-hover: #1D4ED8;
            --accent: #38BDF8;
            --inactive-icon: #94A3B8;
            --progress-bg: #E2E8F0;
            --badge-bg: #DBEAFE;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.02);
        }

        .dark {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-hover: #2563EB;
            --accent: #38BDF8;
            --inactive-icon: #64748B;
            --progress-bg: #334155;
            --badge-bg: #1E3A5F;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
        }

        /* main content */
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 18px 10px 18px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive-icon) transparent;
        }

        .app-content::-webkit-scrollbar {
            width: 4px;
        }
        .app-content::-webkit-scrollbar-thumb {
            background: var(--inactive-icon);
            border-radius: 20px;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 8px 0;
        }
        .header h2 {
            font-size: 24px;
            font-weight: 650;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .profile-icon {
            cursor: pointer;
            padding: 8px;
            transition: background 0.2s;
            border-radius: 50%;
        }
        .profile-icon:hover {
            background: rgba(37, 99, 235, 0.1);
        }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--bg-card);
            padding: 8px 0 10px;
            border-top: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 6px 0 4px;
            border-radius: 20px;
            background: transparent;
            color: var(--inactive-icon);
            fill: var(--inactive-icon);
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            transform: scale(1.02);
            background: rgba(37, 99, 235, 0.08);
        }
        .nav-item.active svg {
            transform: scale(1.15);
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.12s;
        }

        /* cards & elements */
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 18px 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }

        .badge {
            background: var(--badge-bg);
            color: var(--primary);
            font-size: 13px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 40px;
            display: inline-block;
        }

        .progress-bar {
            background: var(--progress-bg);
            height: 8px;
            border-radius: 20px;
            margin: 12px 0 8px;
        }
        .progress-fill {
            height: 8px;
            border-radius: 20px;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            font-weight: 600;
            font-size: 18px;
            padding: 16px 20px;
            border-radius: 40px;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(3px);
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .modal-content {
            background: var(--bg-card);
            width: 280px;
            padding: 28px;
            border-radius: 32px;
            text-align: center;
            color: var(--text-primary);
            border: 1px solid var(--border-light);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-circle {
            background: var(--bg-primary);
            border-radius: 60px;
            padding: 16px 12px;
            text-align: center;
        }

        .icon-svg-small {
            width: 40px;
            height: 40px;
            stroke: var(--primary);
            fill: none;
            stroke-width: 2;
        }

        .icon-list {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        /* links */
        .link-light {
            color: var(--text-secondary);
            text-decoration: underline;
            cursor: pointer;
            font-size: 14px;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 20px;
        }

        hr {
            border: none;
            border-top: 1px solid var(--border-light);
            margin: 16px 0;
        }
    </style>
</head>
<body>
<div class="phone light" id="phoneContainer">
    <!-- dynamic header + content injected via js -->
    <div id="app"></div>
    <!-- bottom nav (static, but controlled) -->
    <div class="bottom-nav" id="bottomNav">
        <div class="nav-item" data-screen="home"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 4L21 9.5V20H15V14H9V20H3V9.5Z"/></svg><span class="nav-label">Home</span></div>
        <div class="nav-item" data-screen="learn"><svg viewBox="0 0 24 24"><path d="M12 5L4 9L12 13L20 9L12 5Z"/><path d="M4 13L12 17L20 13"/><path d="M4 17L12 21L20 17"/></svg><span class="nav-label">Learn</span></div>
        <div class="nav-item" data-screen="progress"><svg viewBox="0 0 24 24"><path d="M21 12V19C21 20.1 20.1 21 19 21H5C3.9 21 3 20.1 3 19V5C3 3.9 3.9 3 5 3H12"/><path d="M15 9L21 3"/><path d="M15 3H21V9"/></svg><span class="nav-label">Progress</span></div>
        <div class="nav-item" data-screen="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15L12 21L4.6 15M4.6 9L12 3L19.4 9"/></svg><span class="nav-label">Settings</span></div>
    </div>
</div>

<!-- hidden modal templates -->
<div id="privacyModal" class="modal"><div class="modal-content"><h3>Privacy</h3><p style="margin:16px 0">We respect your data. No tracking, only local progress.</p><button class="btn-primary" style="padding:10px" onclick="closeModal('privacy')">OK</button></div></div>
<div id="termsModal" class="modal"><div class="modal-content"><h3>Terms of Service</h3><p style="margin:16px 0">Educational use only. Free to learn anytime.</p><button class="btn-primary" style="padding:10px" onclick="closeModal('terms')">OK</button></div></div>

<script>
    (function() {
        // ---------- icon system ----------
        const icons = {
            profile: '<svg viewBox="0 0 24 24"><path d="M20 21V19C20 16.8 18.2 15 16 15H8C5.8 15 4 16.8 4 19V21"/><circle cx="12" cy="8" r="4"/></svg>',
            lesson: '<svg viewBox="0 0 24 24"><path d="M4 6H20M4 12H20M4 18H14"/></svg>',
            chart: '<svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20V14"/></svg>',
            flashcards: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8H16M8 12H14M8 16H12"/></svg>',
            play: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polygon points="10,8 16,12 10,16" fill="currentColor"/></svg>',
            check: '<svg viewBox="0 0 24 24"><path d="M5 12L10 17L19 8"/></svg>'
        };

        // ---------- screens object ----------
        let currentScreen = 'onboarding'; // default
        let theme = 'light'; // default
        const container = document.getElementById('phoneContainer');
        const appDiv = document.getElementById('app');

        function setTheme(newTheme) {
            theme = newTheme;
            container.classList.remove('light', 'dark');
            container.classList.add(theme);
        }

        // helpers
        window.closeModal = (id) => {
            document.getElementById(id + 'Modal').style.display = 'none';
        };

        // render screen based on currentScreen
        function render() {
            if (currentScreen === 'onboarding') renderOnboarding();
            else if (currentScreen === 'home') renderHome();
            else if (currentScreen === 'learn') renderLearn();
            else if (currentScreen === 'progress') renderProgress();
            else if (currentScreen === 'settings') renderSettings();
            else if (currentScreen === 'profile') renderProfile(); // profile = settings/profile internal
            // update active bottom nav item
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                const screen = item.dataset.screen;
                if (screen === currentScreen) item.classList.add('active');
                else item.classList.remove('active');
            });
        }

        // onboarding screen
        function renderOnboarding() {
            appDiv.innerHTML = `
                <div class="header">
                    <h2>🧠 Math Brain</h2>
                    <div class="profile-icon" id="profileBtn">${icons.profile}</div>
                </div>
                <div style="margin-top: 30px; text-align: center;">
                    <div style="background: var(--primary); width: 80px; height: 80px; border-radius: 30px; margin: 20px auto; display: flex; align-items: center; justify-content: center;">
                        <svg width="48" height="48" viewBox="0 0 24 24" stroke="white" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"/><path d="M8 12L16 12M12 8L12 16"/></svg>
                    </div>
                    <h1 style="font-size: 34px; font-weight:700; color: var(--primary);">Math Brain</h1>
                    <p style="font-size: 18px; margin: 12px 0; color: var(--text-secondary);">Train your mental math</p>
                    <p style="color: var(--text-primary); margin: 20px 0;">Quick daily drills to boost arithmetic speed & logic. Adaptive challenges for all levels.</p>
                    <button class="btn-primary" id="getStartedBtn" style="margin-top: 10px;">Get Started</button>
                    <div class="footer-links">
                        <span class="link-light" onclick="document.getElementById('privacyModal').style.display='flex'">Privacy</span>
                        <span class="link-light" onclick="document.getElementById('termsModal').style.display='flex'">Terms</span>
                    </div>
                </div>
            `;
            document.getElementById('getStartedBtn')?.addEventListener('click', () => {
                currentScreen = 'home';
                render();
            });
            document.getElementById('profileBtn')?.addEventListener('click', () => {
                currentScreen = 'profile';
                render();
            });
        }

        // home dashboard
        function renderHome() {
            appDiv.innerHTML = `
                <div class="header">
                    <h2>Dashboard</h2>
                    <div class="profile-icon" id="profileBtn">${icons.profile}</div>
                </div>
                <div class="card" style="background: linear-gradient(145deg, var(--primary), #1E40AF); color: white;">
                    <span class="badge" style="background:rgba(255,255,255,0.2); color:white;">⚡ daily streak 12</span>
                    <h3 style="margin-top: 12px;">Mental workout</h3>
                    <p>Complete today’s 5 puzzles</p>
                    <div style="display: flex; gap:12px; margin:16px 0;">
                        <span>🔥 340 xp</span> <span>🏆 #34</span>
                    </div>
                    <div class="progress-bar" style="background:rgba(255,255,255,0.3);"><div class="progress-fill" style="width:60%; background:white;"></div></div>
                </div>
                <div class="card">
                    <h4>Continue lesson</h4>
                    ${renderLessonItem('Multiplication station', '80%', 'chart')}
                    ${renderLessonItem('Fraction duel', '45%', 'flashcards')}
                </div>
                <div class="grid-2">
                    <div class="stat-circle"><span style="font-size: 28px; font-weight:800;">12</span><br>days streak</div>
                    <div class="stat-circle"><span style="font-size: 28px; font-weight:800;">438</span><br>total XP</div>
                </div>
                <div class="card">
                    <div style="display: flex; justify-content: space-between;"><span>Today's target</span><span>3/5</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div>
                    <button class="btn-primary" style="padding: 14px; margin-top: 16px;" id="practiceNow">Practice now</button>
                </div>
            `;
            document.getElementById('profileBtn')?.addEventListener('click', () => { currentScreen = 'profile'; render(); });
            document.getElementById('practiceNow')?.addEventListener('click', ()=>{ currentScreen='learn'; render(); });
        }

        function renderLessonItem(title, progress, iconName) {
            return `<div style="display:flex; align-items:center; gap:12px; margin:12px 0;"><span style="color:var(--primary);">${icons[iconName] || icons.lesson}</span><div style="flex:1"><b>${title}</b><div class="progress-bar"><div class="progress-fill" style="width:${progress};"></div></div></div></div>`;
        }

        // learn / practice
        function renderLearn() {
            appDiv.innerHTML = `
                <div class="header"><h2>Learn</h2><div class="profile-icon" id="profileBtn">${icons.profile}</div></div>
                <div class="card"><h3>Recommended drills</h3>${renderLessonItem('Quick addition', '30%', 'play')}${renderLessonItem('Algebra starter', '10%', 'lesson')}
                <button class="btn-primary" style="padding:12px; margin-top:8px;" id="startLesson">➕ Start lesson</button></div>
                <div class="card"><span class="badge">new</span><h4>Logic puzzles</h4><p>Pattern recognition</p><div style="display:flex; gap:12px; margin-top:12px;">${icons.flashcards} ${icons.chart}</div></div>
            `;
            document.getElementById('profileBtn')?.addEventListener('click', () => { currentScreen = 'profile'; render(); });
            document.getElementById('startLesson')?.addEventListener('click', () => alert('🧮 34 + 27 = ? (demo)'));
        }

        // progress / statistics
        function renderProgress() {
            appDiv.innerHTML = `
                <div class="header"><h2>Progress</h2><div class="profile-icon" id="profileBtn">${icons.profile}</div></div>
                <div class="card"><span class="badge">📊 last 7 days</span><div style="display:flex; gap:8px; margin:12px 0; justify-content:space-around;">${[40,65,55,80,42,90,70].map(v=>`<div style="height:${v}px; width:20px; background:var(--primary); border-radius:12px;"></div>`).join('')}</div></div>
                <div class="grid-2"><div class="card">✅ 89% accuracy</div><div class="card">⚡ 148 lessons</div></div>
                <div class="card"><h4>Achievements</h4><div style="display:flex; gap:24px;">🏅 🥈 🥉</div></div>
            `;
            document.getElementById('profileBtn')?.addEventListener('click', () => { currentScreen = 'profile'; render(); });
        }

        // settings + profile combined (profile screen)
        function renderSettings() {
            appDiv.innerHTML = `
                <div class="header"><h2>Settings</h2><div class="profile-icon" id="profileBtn">${icons.profile}</div></div>
                <div class="card"><h4>Appearance</h4><button class="btn-primary" style="padding:10px; margin:8px 0;" id="toggleTheme">Switch to Dark</button></div>
                <div class="card"><h4>Profile</h4><p>Username: mathlete</p>${icons.profile}</div>
                <div class="card">🔔 Notifications <br> <span class="link-light" onclick="document.getElementById('privacyModal').style.display='flex'">Privacy Policy</span></div>
            `;
            document.getElementById('profileBtn')?.addEventListener('click', () => { currentScreen = 'profile'; render(); });
            document.getElementById('toggleTheme')?.addEventListener('click', () => {
                setTheme(theme === 'light' ? 'dark' : 'light');
                render(); // keep same screen
            });
        }

        function renderProfile() {
            // profile screen (same as settings)
            renderSettings(); // reuse, but we also mark active bottom nav manually keep?
            // we adjust header title
            const header = appDiv.querySelector('.header h2');
            if (header) header.innerText = 'Profile';
        }

        // navigation
        function setupNav() {
            document.querySelectorAll('.nav-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    const screen = el.dataset.screen;
                    if (screen === 'settings' || screen === 'home' || screen === 'learn' || screen === 'progress') {
                        currentScreen = screen;
                    } else {
                        return;
                    }
                    render();
                });
            });
        }

        // screenshot (SHIFT+W)
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
                    html2canvas(phone, { scale: 2 }).then(canvas => {
                        const link = document.createElement('a');
                        const themeSuffix = theme === 'dark' ? '6' : ['1','2','3','4','5'][['onboarding','home','learn','progress','settings'].indexOf(currentScreen)] || '1';
                        link.download = `${theme === 'dark' ? '6' : themeSuffix}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    });
                }).catch(() => alert('html2canvas not loaded, but we simulate.'));
            }
        });

        // init
        render();
        setupNav();

        // expose theme toggling
        window.setTheme = setTheme;
    })();
</script>

<!-- JSON output -->
<script>
    // this JSON will be shown at the end (per instruction)
    const titles = {
        "1.png": "Start Learning",
        "2.png": "Daily Lessons",
        "3.png": "Practice Skills",
        "4.png": "Track Progress",
        "5.png": "Smart Settings",
        "6.png": "Dark Theme"
    };
    console.log(titles);
    // but we need to output as text after HTML
    document.currentScript?.insertAdjacentHTML('afterend', `<pre style="display:none;" id="jsonOutput">${JSON.stringify(titles, null, 2)}</pre>`);
</script>
<!-- display json at very bottom as requested, but hidden + visible? We'll put it as comment inside code? We output full html and then JSON at bottom line. -->
</body>
</html>
All done!
