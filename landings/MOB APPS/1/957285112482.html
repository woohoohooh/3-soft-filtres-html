            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --border: #334155;
            --inactive: #64748B;
            --shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            --card-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
            --bar-bg: #334155;
            --highlight-bg: rgba(59, 130, 246, 0.15);
        }

        body {
            background: #1e1e2f;
            min-height: 100vh;
            display: flex;
            justify-content: center;

        .phone {

            transition: background-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            background: var(--bg);
        }
        .app-screen::-webkit-scrollbar { display: none; }

        /* header */
        .header {
            padding: 16px 20px 8px;

            border-bottom: 1px solid var(--border);
        }

            font-weight: 650;
            letter-spacing: -0.3px;
            color: var(--text);
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            transition: 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-btn:hover { background: var(--highlight-bg); }
        .profile-btn svg { width: 28px; height: 28px; stroke: var(--text); stroke-width: 1.8; fill: none; }

        /* bottom nav */
        .bottom-nav {
            display: flex;

            transition: transform 0.15s ease, color 0.1s;

            fill: none;
            stroke: var(--inactive);

            color: var(--primary);
            stroke: var(--primary);

            flex-direction: column;
            gap: 24px;

            padding: 20px 18px;

        .flex-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

            background: var(--accent);

            font-size: 13px;
            padding: 4px 10px;

        }
        .btn-primary {
            background: var(--primary);
            border: none;
            padding: 16px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 18px;
            color: white;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--primary-dark);
            transition: 0.05s linear;
        }
        .btn-primary:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--primary-dark); }

        /* progress bar */
        .progress-bar-bg {
            height: 12px;
            background: var(--bar-bg);
            border-radius: 40px;
            margin: 16px 0 8px;
        }
        .progress-fill {
            width: 67%;
            height: 12px;
            background: var(--primary);
            border-radius: 40px;
            transition: width 0.3s;
        }

        /* icons consistently defined inline via JS */
        .icon-sample { display: none; }

        /* modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: var(--card);
            width: 280px;
            padding: 28px;
            border-radius: 32px;
            color: var(--text);

        }
        .modal-close {
            margin-top: 24px;

            color: white;
            padding: 12px;

            border-radius: 60px;

        }

            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 24px;

        }
        .link-row button {
            background: none;
            border: none;
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
        }

        /* statistics */
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;

        .stat-item {
            background: var(--bg);

        }

            display: flex;

            height: 60px;

            margin-top: 20px;
        }
        .bar {
            width: 22px;
            background: var(--primary);

            transition: height 0.2s;
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">

<script>
(function() {
    // ----- theme & state -----
    let darkMode = false;
    let currentScreen = 'onboarding'; // 'onboarding','home','learn','progress','settings'
    let screenshotCounter = 1;

    // ----- icon system (inline svg, outline, 2px) -----
    function icon(name, active = false) {
        const color = active ? '#2563EB' : 'currentColor';
        const strokeW = 2;
        const icons = {
            home: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10L12 3L21 10V20H3V10Z"/><path d="M9 20V14H15V20"/></svg>`,
            learn: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"><path d="M2 3H8C10.2 3 12 4.8 12 7V21C12 19.9 11.1 19 10 19H2V3Z"/><path d="M22 3H16C13.8 3 12 4.8 12 7V21C12 19.9 12.9 19 14 19H22V3Z"/></svg>`,
            progress: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"><path d="M21 12C21 16.97 16.97 21 12 21C7.03 21 3 16.97 3 12C3 7.03 7.03 3 12 3"/><circle cx="12" cy="12" r="9"/><path d="M12 7V12L15 15"/></svg>`,
            settings: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15c.2-.6.4-1.2.4-2 0-.8-.2-1.6-.4-2.4l2.6-2.2-2-3.5-3.3 1c-.8-.4-1.6-.8-2.4-1L14 2h-4l-.3 2.9c-.8.2-1.6.6-2.4 1L4 5.9l-2 3.5L4.6 11c-.2.8-.2 1.6-.2 2.4 0 .8.2 1.6.4 2.4L2 18.1l2 3.5 3.3-1c.8.4 1.6.8 2.4 1L10 22h4l.3-2.9c.8-.2 1.6-.6 2.4-1l3.3 1 2-3.5-2.6-2.2z"/></svg>`,
            profile: `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20c1.5-3 4-4 8-4s6.5 1 8 4"/><circle cx="12" cy="8" r="4"/></svg>`,
            lesson: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8h8M8 12h6M8 16h4"/></svg>`,
            chart: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 21H4V4"/><path d="M7 15L10 10L13 13L18 7"/></svg>`,
            flashcards: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4H19C20.1 4 21 4.9 21 6V18C21 19.1 20.1 20 19 20H5C3.9 20 3 19.1 3 18V6C3 4.9 3.9 4 5 4Z"/><path d="M8 2V6M16 2V6"/><path d="M8 12h8M8 16h5"/></svg>`,
            play: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M10 8L16 12L10 16V8Z"/></svg>`,
            check: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17L4 12"/></svg>`,
        };
        return icons[name] || icons.home;
    }

    // ----- bottom nav config -----
    const navItems = [
        { id: 'home', label: 'Home', icon: 'home' },
        { id: 'learn', label: 'Learn', icon: 'learn' },
        { id: 'progress', label: 'Progress', icon: 'progress' },
        { id: 'settings', label: 'Settings', icon: 'settings' }
    ];

    // ----- render screen content + header + bottom nav -----
    function renderApp() {
        const container = document.getElementById('appScreen');
        const headerHtml = (title) => `
            <div class="header">
                <h2>${title}</h2>
                <button class="profile-btn" id="profileBtn">${icon('profile')}</button>
            </div>
        `;

        let bodyHtml = '';
        let headerTitle = 'Math Brain';
        if (currentScreen === 'onboarding') headerTitle = 'Welcome';
        else if (currentScreen === 'home') headerTitle = 'Dashboard';
        else if (currentScreen === 'learn') headerTitle = 'Training';
        else if (currentScreen === 'progress') headerTitle = 'Insights';
        else if (currentScreen === 'settings') headerTitle = 'Settings';

        if (currentScreen === 'onboarding') {
            bodyHtml = `
                <div class="screen">
                    <div style="margin-top: 30px; display:flex; flex-direction:column; gap:16px; align-items:center;">
                        <div style="background:var(--primary); width:80px; height:80px; border-radius:28px; display:flex; align-items:center; justify-content:center;">
                            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M4 19.5L12 4L20 19.5"/><path d="M8 14h8"/></svg>
                        </div>
                        <h1 style="font-size:38px; font-weight:700; color:var(--primary);">Math Brain</h1>
                        <p style="font-size:20px; font-weight:500;">train your logic</p>
                        <p style="text-align:center; color:var(--text-light);">Quick mental math & puzzles. Daily 5‑min workouts sharpen your mind.</p>
                        <button class="btn-primary" id="getStartedBtn">Get Started</button>
                        <div class="link-row">
                            <button id="privacyBtn">Privacy Policy</button>
                            <button id="termsBtn">Terms of Service</button>
                        </div>
                    </div>
                </div>
            `;
        } else {
            // dynamic screens (each has rich UI)
            if (currentScreen === 'home') {
                bodyHtml = `
                    <div class="screen">
                        <div class="card" style="display:flex; align-items:center; gap:12px;">
                            <span>🔥 streak 12 days</span>
                            <span>⭐ 340 pts</span>
                        </div>
                        <div class="card">
                            <h3>Today's plan</h3>
                            <div class="flex-row"><span>⚡ quick math</span><span class="badge">5 min</span></div>
                            <div class="progress-bar-bg"><div class="progress-fill" style="width:40%"></div></div>
                            <button class="btn-primary" style="padding:12px;" id="startHomePractice">practice →</button>
                        </div>
                        <div class="card">
                            <div style="display:flex; gap:16px;">
                                <div>${icon('flashcards')} <span>Puzzles</span></div>
                                <div>${icon('play')} <span>Speed</span></div>
                                <div>${icon('lesson')} <span>Lessons</span></div>
                            </div>
                        </div>
                        <div class="card">
                            <h4>achievements</h4>
                            <div style="display:flex; gap:8px;">🏆 🥈 🥉 </div>
                        </div>
                    </div>
                `;
            } else if (currentScreen === 'learn') {
                bodyHtml = `
                    <div class="screen">
                        <div class="card">
                            <h3>mental math</h3>
                            <div class="flex-row">${icon('lesson')} addition · 3 levels</div>
                            <div class="progress-bar-bg"><div class="progress-fill" style="width:70%"></div></div>
                        </div>
                        <div class="card">
                            <h3>logic puzzles</h3>
                            <div class="flex-row">${icon('flashcards')} 8 new puzzles</div>
                            <button class="btn-primary" style="padding:12px; margin-top:10px;" id="startLearnPuzzle">start puzzles</button>
                        </div>
                        <div class="card">
                            <h3>memory digits</h3>
                            ${icon('play')} practice digit span
                        </div>
                    </div>
                `;
            } else if (currentScreen === 'progress') {
                bodyHtml = `
                    <div class="screen">
                        <div class="card stat-grid">
                            <div class="stat-item"><span style="font-size:24px;">87%</span><br>accuracy</div>
                            <div class="stat-item"><span style="font-size:24px;">43</span><br>lessons</div>
                        </div>
                        <div class="card">
                            <h4>weekly activity</h4>
                            <div class="chart-line">
                                <div class="bar" style="height:30px;"></div><div class="bar" style="height:52px;"></div><div class="bar" style="height:24px;"></div><div class="bar" style="height:48px;"></div><div class="bar" style="height:60px;"></div><div class="bar" style="height:36px;"></div><div class="bar" style="height:20px;"></div>
                            </div>
                        </div>
                        <div class="card">${icon('chart')}  speed: 2.4s per problem</div>
                    </div>
                `;
            } else if (currentScreen === 'settings') {
                bodyHtml = `
                    <div class="screen">
                        <div class="card flex-row" style="justify-content:space-between;">
                            <span>🌓 Dark mode</span>
                            <label><input type="checkbox" id="darkModeToggle" ${darkMode ? 'checked' : ''}></label>
                        </div>
                        <div class="card">🔔 Notifications</div>
                        <div class="card">🎧 Sound effects</div>
                        <div class="card">👤 Profile (you)</div>
                        <div style="margin-top:24px; color:var(--text-light);">version 2026.1</div>
                    </div>
                `;
            }
        }

        container.innerHTML = headerHtml(headerTitle) + bodyHtml;
        // bottom nav
        const navEl = document.getElementById('bottomNav');
        navEl.innerHTML = navItems.map(item => {
            const active = (currentScreen === item.id) ? 'active' : '';
            return `<button class="nav-item ${active}" data-screen="${item.id}">
                ${icon(item.icon, currentScreen === item.id)}
                <span>${item.label}</span>
            </button>`;
        }).join('');

        // attach listeners
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const screen = btn.dataset.screen;
                if (screen) { currentScreen = screen; renderApp(); }
            });
        });

        // profile button -> open settings
        const profileBtn = document.getElementById('profileBtn');
        if (profileBtn) profileBtn.addEventListener('click', () => {
            currentScreen = 'settings';
            renderApp();
        });

        // onboarding specific
        if (currentScreen === 'onboarding') {
            document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                currentScreen = 'home';
                renderApp();
            });
            document.getElementById('privacyBtn')?.addEventListener('click', ()=> showModal('Privacy Policy', 'We respect your data. No selling.'));
            document.getElementById('termsBtn')?.addEventListener('click', ()=> showModal('Terms of Service', 'Use Math Brain for personal learning only.'));
        }

        // practice buttons
        document.getElementById('startHomePractice')?.addEventListener('click', ()=>{
            currentScreen = 'learn';
            renderApp();
        });
        document.getElementById('startLearnPuzzle')?.addEventListener('click', ()=>{
            alert('puzzle started! (simulated)');
        });

        // dark mode toggle
        const toggle = document.getElementById('darkModeToggle');
        if (toggle) {
            toggle.checked = darkMode;
            toggle.addEventListener('change', (e) => {
                darkMode = e.target.checked;
                document.body.classList.toggle('dark', darkMode);
                renderApp(); // refresh colors
            });
        }
    }

    // modal helper
    function showModal(title, text) {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `
            <div class="modal-card">
                <h3 style="margin-bottom:12px;">${title}</h3>
                <p>${text}</p>
                <button class="modal-close" id="modalCloseBtn">Close</button>
            </div>
        `;
        document.body.appendChild(overlay);
        overlay.querySelector('#modalCloseBtn').addEventListener('click', ()=> overlay.remove());
        overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.remove(); });
    }

    // screenshot (shift+W)
    window.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.key === 'W') {
            e.preventDefault();
            const phone = document.getElementById('phoneContainer');
            html2canvas?.(phone, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                const darkSuffix = darkMode ? '6' : (screenshotCounter % 5 || 5);
                link.download = `${darkMode ? 6 : screenshotCounter}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                if (!darkMode) screenshotCounter = (screenshotCounter % 5) + 1;
            }).catch(() => alert('html2canvas not loaded — use fallback.'));
        }
    });

    // include html2canvas via script (silent)
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    script.onload = () => console.log('screenshot ready');
    document.head.appendChild(script);

    // initial render
    renderApp();
})();
</script>
