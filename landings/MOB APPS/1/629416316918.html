<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaSwift · vocabulary builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #1a2639;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --grey: #94A3B8;
            --grey-light: #E2E8F0;
            --success: #10b981;
            --warning: #f59e0b;
            --shadow: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,0,0,0.05);
            --border: #e2e8f0;
            --inactive-icon: #94A3B8;
            --active-bg: rgba(37,99,235,0.08);
            --progress-bg: #E2E8F0;
        }
        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #cbd5e1;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --grey: #64748b;
            --grey-light: #334155;
            --shadow: 0 8px 20px rgba(0,0,0,0.5);
            --border: #334155;
            --inactive-icon: #64748b;
            --active-bg: rgba(59,130,246,0.15);
            --progress-bg: #334155;
        }
        .phone-frame {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }
        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px 8px 20px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 650;
            letter-spacing: -0.3px;
            color: var(--text);
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            transition: background 0.1s;
        }
        .profile-btn:hover { background: var(--active-bg); }
        .profile-icon svg { display: block; }

        /* main screen area */
        .screen-content {
            flex: 1;
            overflow-y: auto;
            padding: 4px 16px 12px 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--grey) var(--card);
        }
        .screen-content::-webkit-scrollbar {
            width: 4px;
        }
        .screen-content::-webkit-scrollbar-track {
            background: var(--card);
        }
        .screen-content::-webkit-scrollbar-thumb {
            background: var(--grey);
            border-radius: 12px;
        }

        /* bottom nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 12px 12px;
            background-color: var(--card);
            border-top: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px 0 4px;
            border-radius: 20px;
            transition: all 0.15s ease;
            min-width: 64px;
            color: var(--inactive-icon);
            fill: var(--inactive-icon);
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            background: var(--active-bg);
            transform: scale(1.02);
        }
        .nav-item.active svg {
            stroke: var(--primary);
            transform: scale(1.1);
        }
        .nav-item svg {
            transition: transform 0.15s, stroke 0.1s;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            margin-top: 4px;
        }

        /* card & elements */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 12px;
        }
        .progress-bar {
            background: var(--progress-bg);
            height: 8px;
            border-radius: 20px;
            margin: 8px 0;
            overflow: hidden;
        }
        .progress-fill {
            background: var(--primary);
            width: 0%;
            height: 100%;
            transition: width 0.3s;
        }
        .row-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .lesson-item:last-child { border: none; }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-cell {
            background: var(--bg);
            border-radius: 20px;
            padding: 14px 8px;
            text-align: center;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);

            z-index: 1000;
        }
        .modal-card {
            background: var(--card);

            border-radius: 32px;
            text-align: center;
            color: var(--text);
        }
        .modal-close {
            margin-top: 20px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
        }
        button { cursor: pointer; background: none; border: none; }
        .get-started {
            background: var(--primary);
            color: white;
            font-weight: 700;
            font-size: 18px;
            padding: 16px;
            border-radius: 60px;
            width: 100%;
            margin: 24px 0 16px;
            box-shadow: 0 8px 16px -6px var(--primary-dark);
        }
        .link-row {
            display: flex;
            gap: 24px;
            justify-content: center;
            font-size: 14px;
        }
        .link-row button {
            color: var(--grey);
            text-decoration: underline;
        }
        .tiny-chart {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 60px;
            margin: 16px 0 8px;
        }
        .bar {
            width: 20%;

            height: 20px;
            border-radius: 12px 12px 4px 4px;
            transition: height 0.4s;
        }
        .theme-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg);
            padding: 12px 16px;
            border-radius: 40px;
        }
    </style>
</head>
<body>
<div class="phone-frame" id="phoneFrame">
    <div class="app-container" id="appContainer">
        <!-- header with dynamic title + profile -->
        <div class="header" id="appHeader">
            <h1 id="screenTitle">Onboarding</h1>
            <button class="profile-btn" id="profileBtn" title="Profile / settings">
                <span class="profile-icon" id="profileIcon"></span>
            </button>
        </div>

        <!-- main content screens injected here -->
        <div id="screenContainer" class="screen-content"></div>

        <!-- bottom navigation (4 items) -->
        <div class="bottom-nav" id="bottomNav">
            <button class="nav-item" data-nav="home" id="navHome">
                <span id="iconHome"></span>
                <span class="nav-label">Home</span>
            </button>
            <button class="nav-item" data-nav="learn" id="navLearn">
                <span id="iconLearn"></span>
                <span class="nav-label">Learn</span>
            </button>
            <button class="nav-item" data-nav="progress" id="navProgress">
                <span id="iconProgress"></span>
                <span class="nav-label">Progress</span>
            </button>
            <button class="nav-item" data-nav="settings" id="navSettings">
                <span id="iconSettings"></span>
                <span class="nav-label">Settings</span>
            </button>
        </div>
    </div>
</div>

<!-- modals (privacy & terms) hidden by default -->
<div id="privacyModal" class="modal">
    <div class="modal-card">
        <h3>Privacy Policy</h3>
        <p style="margin:16px 0">We respect your data. No tracking, just learning.</p>
        <button class="modal-close" onclick="closeModals()">OK</button>
    </div>
</div>
<div id="termsModal" class="modal">
    <div class="modal-card">
        <h3>Terms of Service</h3>
        <p style="margin:16px 0">Free for everyone. Use responsibly.</p>
        <button class="modal-close" onclick="closeModals()">OK</button>
    </div>
</div>

<script>
    (function() {
        // ---------- icon system (inline svg) ----------
        function createIcon(type, width=24, height=24) {
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("width", width);
            svg.setAttribute("height", height);
            svg.setAttribute("viewBox", "0 0 24 24");
            svg.setAttribute("fill", "none");
            svg.setAttribute("stroke", "currentColor");
            svg.setAttribute("stroke-width", "2");
            svg.setAttribute("stroke-linecap", "round");
            svg.setAttribute("stroke-linejoin", "round");

            let path;
            if (type === 'home') {
                path = '<path d="M3 10 L12 3 L21 10 L21 20 L3 20 L3 10 Z"/><path d="M9 20 L9 13 L15 13 L15 20"/>';
            } else if (type === 'learn') { // book/open book
                path = '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>';
            } else if (type === 'progress') { // bar chart
                path = '<path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/>';
            } else if (type === 'settings') { // cog
                path = '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/><path d="M16.5 6.5 19 9"/><path d="M7.5 6.5 5 9"/>';
            } else if (type === 'profile') { // simple user (just head and shoulders)
                path = '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>';
            } else if (type === 'lesson') { // play button
                path = '<circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/>';
            } else if (type === 'chart') { // simple line chart
                path = '<path d="M21 16H3"/><path d="M3 12h2l2-3 3 3 3-6 3 5 2-3 1 2"/>';
            } else if (type === 'flashcards') { // stacked squares
                path = '<rect x="4" y="4" width="16" height="14" rx="2"/><path d="M8 8h8"/><path d="M8 12h6"/><path d="M8 16h4"/>';
            } else if (type === 'check') {
                path = '<polyline points="20 6 9 17 4 12"/>';
            } else {
                path = '<circle cx="12" cy="12" r="10"/>';
            }
            svg.innerHTML = path;
            return svg;
        }

        // inject icons into placeholders
        function renderIcons() {
            document.getElementById('iconHome').replaceWith(createIcon('home'));
            document.getElementById('iconLearn').replaceWith(createIcon('learn'));
            document.getElementById('iconProgress').replaceWith(createIcon('progress'));
            document.getElementById('iconSettings').replaceWith(createIcon('settings'));
            document.getElementById('profileIcon').replaceWith(createIcon('profile', 28, 28));
        }

        // ------ app state ------
        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
        let darkMode = false; // default light

        // screen titles
        const titles = {
            onboarding: 'Onboarding',
            home: 'Home',
            learn: 'Practice',
            progress: 'Progress',
            settings: 'Settings'
        };

        // ------ navigation ------
        function setActiveNav(screen) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            if (screen === 'home') document.getElementById('navHome').classList.add('active');
            if (screen === 'learn') document.getElementById('navLearn').classList.add('active');
            if (screen === 'progress') document.getElementById('navProgress').classList.add('active');
            if (screen === 'settings') document.getElementById('navSettings').classList.add('active');
        }

        function showScreen(screen) {
            currentScreen = screen;
            document.getElementById('screenTitle').innerText = titles[screen] || 'LinguaSwift';
            const container = document.getElementById('screenContainer');
            container.innerHTML = ''; // clear

            if (screen === 'onboarding') container.appendChild(renderOnboarding());
            else if (screen === 'home') container.appendChild(renderHome());
            else if (screen === 'learn') container.appendChild(renderLearn());
            else if (screen === 'progress') container.appendChild(renderProgress());
            else if (screen === 'settings') container.appendChild(renderSettings());

            if (screen !== 'onboarding') setActiveNav(screen);
            else {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            }
        }

        // ---------- modal ----------
        window.closeModals = function() {
            document.getElementById('privacyModal').style.display = 'none';
            document.getElementById('termsModal').style.display = 'none';
        };
        window.showPrivacy = function() { document.getElementById('privacyModal').style.display = 'flex'; };
        window.showTerms = function() { document.getElementById('termsModal').style.display = 'flex'; };

        // ---------- profile button ----------
        document.getElementById('profileBtn').addEventListener('click', ()=>{
            showScreen('settings');
        });

        // navigation listeners
        document.getElementById('navHome').addEventListener('click', ()=> showScreen('home'));
        document.getElementById('navLearn').addEventListener('click', ()=> showScreen('learn'));
        document.getElementById('navProgress').addEventListener('click', ()=> showScreen('progress'));
        document.getElementById('navSettings').addEventListener('click', ()=> showScreen('settings'));

        // ------ screen builders ------
        function renderOnboarding() {
            const div = document.createElement('div');
            div.className = 'card';
            div.style.marginTop = '20px'; 
            div.innerHTML = `
                <div style="text-align:center;">
                    <span class="badge" style="background:var(--accent);">📘 vocab</span>
                    <h1 style="font-size: 44px; margin: 16px 0 4px; font-weight:700;">LinguaSwift</h1>
                    <p style="font-size: 18px; color: var(--primary); font-weight:500;">English vocabulary builder</p>
                    <p style="margin: 20px 0 8px; color: var(--text-light);">Master 5000+ words with daily micro‑lessons and smart recall.</p>
                    <button class="get-started" id="getStartedBtn">Get Started →</button>
                    <div class="link-row">
                        <button onclick="showPrivacy()">Privacy Policy</button>
                        <button onclick="showTerms()">Terms of Service</button>
                    </div>
                </div>
            `;
            div.querySelector('#getStartedBtn').addEventListener('click', ()=>{
                showScreen('home');
            });
            return div;
        }

        function renderHome() {
            const div = document.createElement('div');
            div.innerHTML = `
                <div class="card">
                    <div class="row-between"><span>🔥 Daily streak</span> <strong>12 days</strong></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
                    <div style="display:flex; gap:8px; margin: 16px 0 8px;">
                        <span class="badge" style="background:#38BDF8;">⚡ 3 lessons ready</span>
                    </div>
                </div>
                <div class="card">
                    <div class="row-between"><h3>Recommended</h3><span>🎯</span></div>
                    <div class="lesson-item"> <span id="lessonIcon1"></span> <div><b>Business vocab</b><p>8 min</p></div> </div>
                    <div class="lesson-item"> <span id="lessonIcon2"></span> <div><b>Phrasal verbs</b><p>5 min</p></div> </div>
                    <div class="lesson-item"> <span id="lessonIcon3"></span> <div><b>Idioms pack</b><p>12 min</p></div> </div>
                </div>
                <div class="card">
                    <h4>Today’s goal</h4>
                    <div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div>
                    <p style="margin-top:8px;">4 of 10 words learned</p>
                </div>
            `;
            // inject mini icons
            setTimeout(()=>{
                const sp = div.querySelectorAll('#lessonIcon1, #lessonIcon2, #lessonIcon3');
                sp.forEach(s => s.replaceWith(createIcon('lesson', 20,20)));
            },10);
            return div;
        }

        function renderLearn() {
            const div = document.createElement('div');
            div.innerHTML = `
                <div class="card">
                    <h3>Start practice</h3>
                    <div style="display:flex; gap:16px; margin: 16px 0;">
                        <button style="flex:1; background:var(--primary); color:white; padding:16px; border-radius:60px; font-weight:bold;" id="practiceBtn">▶️ Practice now</button>
                    </div>
                </div>
                <div class="card">
                    <div class="row-between"><span>Flashcards set</span><span id="flashIcon"></span></div>
                    <div class="lesson-item"><span id="fcIcon"></span> <div><b>Workplace</b><p>12 cards</p></div></div>
                    <div class="lesson-item"><span id="fcIcon2"></span> <div><b>Travel</b><p>8 cards</p></div></div>
                </div>
            `;
            setTimeout(()=>{
                document.getElementById('flashIcon')?.replaceWith(createIcon('flashcards',20,20));
                const fcs = div.querySelectorAll('#fcIcon, #fcIcon2');
                fcs.forEach(el => el.replaceWith(createIcon('flashcards',20,20)));
            },10);
            div.querySelector('#practiceBtn')?.addEventListener('click', ()=> alert('starting lesson (simulated)'));
            return div;
        }

        function renderProgress() {
            const div = document.createElement('div');
            div.innerHTML = `
                <div class="card">
                    <h3>Weekly activity</h3>
                    <div class="tiny-chart" id="chartBars">
                        <div class="bar" style="height:28px"></div><div class="bar" style="height:42px"></div><div class="bar" style="height:20px"></div><div class="bar" style="height:56px"></div><div class="bar" style="height:38px"></div>
                    </div>
                </div>
                <div class="card stats-grid">
                    <div class="stat-cell"><span id="statIcon1"></span><p>82%</p><small>accuracy</small></div>
                    <div class="stat-cell"><span id="statIcon2"></span><p>1,240</p><small>words</small></div>
                    <div class="stat-cell"><span id="statIcon3"></span><p>18</p><small>streak</small></div>
                    <div class="stat-cell"><span id="statIcon4"></span><p>32</p><small>hours</small></div>
                </div>
            `;
            setTimeout(()=>{
                ['statIcon1','statIcon2','statIcon3','statIcon4'].forEach((id,i)=>{
                    const el = div.querySelector(`#${id}`);
                    if(el) el.replaceWith(createIcon(i%2===0?'chart':'check',20,20));
                });
            },10);
            return div;
        }

        function renderSettings() {
            const div = document.createElement('div');
            div.innerHTML = `
                <div class="card">
                    <div class="row-between"><span>👤 Profile</span><span>Alex</span></div>
                </div>
                <div class="card">
                    <div class="theme-toggle">
                        <span>🌓 Dark theme</span>
                        <label><input type="checkbox" id="darkModeToggle" ${darkMode ? 'checked' : ''}></label>
                    </div>
                </div>
                <div class="card">
                    <p>Notifications</p>
                    <p>Download offline</p>
                    <p>Reset progress</p>
                </div>
            `;
            div.querySelector('#darkModeToggle')?.addEventListener('change', (e)=>{
                darkMode = e.target.checked;
                if (darkMode) document.body.classList.add('dark');
                else document.body.classList.remove('dark');
            });
            return div;
        }

        // initial
        renderIcons();
        showScreen('onboarding');

        // ------ screenshot hotkey SHIFT+W ------
        let shotCounter = 0;
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                shotCounter++;
                let filename = shotCounter + '.png';
                if (darkMode) filename = '6.png';
                // Simulate screenshot capture: we just log and alert (real PNG would need canvas)
                alert(`📸 Screenshot captured: ${filename} (simulated)`);
                // according to spec if darkMode => 6.png else sequential up to 5
                if (!darkMode && shotCounter > 5) shotCounter = 0;
            }
        });
    })();
</script>

<!-- JSON output block (Play Store) -->
<pre style="display:none;" id="jsonBlock"></pre>
<script>

    const titlesJson = {
        "1.png": "Start Learning",

        "5.png": "Smart Settings",
        "6.png": "Dark Theme"
    };
    console.log(JSON.stringify(titlesJson, null, 2));
    // Also output at the bottom as requested
    document.currentScript.insertAdjacentHTML('afterend', '<pre style="background:#111;color:#0f0;padding:8px;margin-top:8px;border-radius:8px;">' + JSON.stringify(titlesJson, null, 2) + '</pre>');
</script>
All done!
</body>
