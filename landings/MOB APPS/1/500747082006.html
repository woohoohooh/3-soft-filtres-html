```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeFlow · Python Learn</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #0F172A;
      --text-light: #334155;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --inactive: #94A3B8;
      --border: #E2E8F0;
      --icon-stroke: #0F172A;
      --nav-bg: #FFFFFF;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
    }

    body.dark {
      --bg: #0F172A;
      --card: #1E293B;
      --text: #E2E8F0;
      --text-light: #CBD5E1;
      --primary: #3B82F6;
      --accent: #38BDF8;
      --inactive: #64748B;
      --border: #334155;
      --icon-stroke: #E2E8F0;
      --nav-bg: #1E293B;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    body {
      background: #111827;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background: var(--bg);
      border-radius: 48px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3), 0 0 0 8px #1E293B;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: background 0.2s;
    }

    .app-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--primary) var(--border);
    }

    .app-screen::-webkit-scrollbar {
      width: 4px;
    }
    .app-screen::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 20px;
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 8px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 650;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .profile-btn svg {
      width: 28px;
      height: 28px;
      stroke: var(--icon-stroke);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* bottom navigation */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 12px 14px;
      background: var(--nav-bg);
      border-top: 1px solid var(--border);
      box-shadow: 0 -2px 8px rgba(0,0,0,0.02);
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      cursor: pointer;
      gap: 4px;
      transition: all 0.15s ease;
      padding: 6px 0 2px;
      border-radius: 16px;
    }
    .nav-item.active {
      background: rgba(37, 99, 235, 0.08);
    }
    .nav-item.active .nav-icon {
      stroke: var(--primary) !important;
      transform: scale(1.1);
    }
    .nav-item.active .nav-label {
      color: var(--primary);
      font-weight: 550;
    }
    .nav-icon {
      width: 26px;
      height: 26px;
      stroke: var(--inactive);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s, transform 0.15s;
    }
    .nav-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--inactive);
      transition: color 0.15s;
    }

    /* content cards */
    .content {
      padding: 8px 16px 16px;
      flex: 1;
    }
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 18px 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .flex-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .gap-8 { gap: 8px; }
    .mt-12 { margin-top: 12px; }
    .mb-8 { margin-bottom: 8px; }
    .icon-badge {
      background: rgba(37,99,235,0.1);
      padding: 10px;
      border-radius: 16px;
    }
    button {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      padding: 14px 24px;
      border-radius: 40px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.1s;
      width: fit-content;
    }
    button.secondary {
      background: transparent;
      border: 1.5px solid var(--primary);
      color: var(--primary);
    }
    .progress-bar-bg {
      background: var(--border);
      height: 8px;
      border-radius: 40px;
      width: 100%;
      margin: 8px 0;
    }
    .progress-fill {
      background: var(--primary);
      width: 0%;
      height: 8px;
      border-radius: 40px;
      transition: width 0.3s;
    }
    .chip {
      background: var(--bg);
      padding: 6px 12px;
      border-radius: 40px;
      font-size: 13px;
      color: var(--text);
    }
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-card {
      background: var(--card);
      padding: 28px;
      border-radius: 32px;
      width: 280px;
      text-align: center;
      color: var(--text);
    }
    .link {
      color: var(--primary);
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
      font-size: 14px;
    }
    .hidden { display: none; }
    .small-icon {
      width: 20px;
      height: 20px;
      stroke: var(--icon-stroke);
      stroke-width: 2;
      fill: none;
    }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <!-- dynamic header + screen -->
  <div id="appHeader" class="header">
    <h1 id="screenTitle">Welcome</h1>
    <button class="profile-btn" id="profileBtn" aria-label="profile">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </button>
  </div>

  <div id="screenContainer" class="app-screen">
    <!-- screens injected via js -->
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item" data-tab="home"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2h-5v-8H10v8H5a2 2 0 0 1-2-2z"/></svg><span class="nav-label">Home</span></button>
    <button class="nav-item" data-tab="learn"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 6v7m0 0v5m0-5h5m-5 0H7"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg><span class="nav-label">Learn</span></button>
    <button class="nav-item" data-tab="progress"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 12v3a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4v-6a4 4 0 0 1 4-4h7"/><path d="M15 3v4h4"/><path d="M18 17v4"/><path d="M21 9v8"/></svg><span class="nav-label">Progress</span></button>
    <button class="nav-item" data-tab="settings"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.05A10 10 0 0 0 12 18a10 10 0 0 0 6.36-2.2l.04-.05z"/><path d="M18 6h.01"/></svg><span class="nav-label">Settings</span></button>
  </nav>
</div>

<!-- hidden canvas for screenshot -->
<canvas id="shotCanvas" width="360" height="780" style="display:none"></canvas>

<script>
  (function(){
    // ---------- icon system ----------
    const icons = {
      profile: '<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
      chart: '<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><path d="M21 12v3a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4v-6a4 4 0 0 1 4-4h7"/><path d="M15 3v4h4"/><path d="M7 15h2v2H7z"/><path d="M11 11h2v6h-2z"/><path d="M15 9h2v8h-2z"/></svg>',
      flashcards: '<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M7 9h6"/><path d="M7 13h4"/><path d="M17 9h2a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2"/></svg>',
      play: '<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none"/></svg>',
      check: '<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><path d="M20 6L9 17l-5-5"/></svg>',
      lesson: '<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>'
    };

    // ---------- state ----------
    let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
    let darkMode = false;
    let screenshotCounter = 1;

    // ---------- theme ----------
    function toggleTheme() {
      darkMode = !darkMode;
      document.body.classList.toggle('dark', darkMode);
    }

    // ---------- render screen ----------
    function renderScreen(screenId) {
      const container = document.getElementById('screenContainer');
      const titleEl = document.getElementById('screenTitle');
      if (!container) return;

      // update header title
      if (screenId === 'onboarding') titleEl.innerText = 'Welcome';
      else if (screenId === 'home') titleEl.innerText = 'Dashboard';
      else if (screenId === 'learn') titleEl.innerText = 'Practice';
      else if (screenId === 'progress') titleEl.innerText = 'Statistics';
      else if (screenId === 'settings') titleEl.innerText = 'Settings';

      let html = '';
      if (screenId === 'onboarding') {
        html = `
          <div class="content" style="display:flex; flex-direction:column; justify-content:space-between; min-height:100%;">
            <div style="flex:1; display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:40px;">
              <div class="icon-badge" style="margin-bottom:24px;">${icons.flashcards.replace('currentColor', 'var(--primary)')}</div>
              <h2 style="font-size:32px; font-weight:700; color:var(--text);">CodeFlow</h2>
              <p style="font-size:18px; color:var(--primary); margin:8px 0 4px;">learn Python · 3 min a day</p>
              <p style="color:var(--text-light); max-width:260px; margin:12px 0 32px;">Bite-sized coding drills, real‑time feedback, and streak rewards.</p>
              <button id="startBtn" style="width:220px;">Get Started</button>
              <div style="margin:24px 0 16px; display:flex; gap:24px;">
                <button class="link" id="privacyLink">Privacy</button>
                <button class="link" id="termsLink">Terms</button>
              </div>
            </div>
          </div>
        `;
      } else if (screenId === 'home') {
        html = `
          <div class="content">
            <div class="card"><div class="flex-row" style="justify-content:space-between;"><span style="font-weight:600;">🔥 7 day streak</span><span>⭐ 340 XP</span></div><div class="progress-bar-bg mt-12"><div class="progress-fill" style="width:70%"></div></div></div>
            <div class="card"><h3 style="margin-bottom:8px;">Continue where you left</h3><div class="flex-row gap-8"><span class="chip">functions</span><span class="chip">loops</span></div><div class="flex-row" style="justify-content:space-between; margin-top:16px;"><span>⚡ 2/5 lessons</span><button class="secondary" style="padding:8px 16px;" id="resumeLearn">Resume</button></div></div>
            <div class="card"><div class="flex-row" style="gap:16px;"><span>${icons.lesson.replace('currentColor', 'var(--primary)')}</span><div><p><strong>Today's challenge</strong></p><p style="font-size:14px;">Write a list comprehension</p></div></div></div>
            <div class="card"><h4>Recommended for you</h4><div class="flex-row">${icons.flashcards.replace('currentColor', 'var(--accent)')} <span>OOP basics · 5 min</span></div></div>
          </div>
        `;
      } else if (screenId === 'learn') {
        html = `
          <div class="content">
            <div class="card"><div class="flex-row"><span>${icons.play.replace('currentColor', 'var(--primary)')}</span><span><strong>Quick practice: variables</strong></span></div><div class="progress-bar-bg"><div class="progress-fill" style="width:30%"></div></div></div>
            <div class="card"><div class="flex-row"><span>${icons.flashcards.replace('currentColor', 'var(--primary)')}</span><span>Flashcards: data types</span><span style="margin-left:auto;">🔁 12</span></div></div>
            <div class="card"><div class="flex-row"><span>${icons.lesson.replace('currentColor', 'var(--primary)')}</span><span>Lesson: if/else</span><span>3 min</span></div><button style="width:100%; margin-top:12px;" id="startPractice">start practice</button></div>
            <div class="card"><span>🏆 weekly leaderboard · you're #12</span></div>
          </div>
        `;
      } else if (screenId === 'progress') {
        html = `
          <div class="content">
            <div class="card"><span style="font-weight:600;">Total XP</span><h2 style="font-size:32px;">1,240</h2><span>⬆️ +220 this week</span></div>
            <div class="card"><span>Lessons completed</span><span style="float:right;">18/42</span><div class="progress-bar-bg"><div class="progress-fill" style="width:43%"></div></div></div>
            <div class="card flex-row">${icons.chart.replace('currentColor', 'var(--primary)')} <span>Daily activity</span><span style="margin-left:auto;">⬆️⬆️⬇️⬆️</span></div>
            <div class="card"><span>⭐ achievements: 4</span><div class="flex-row">⚡ quick learner · 🏁 rookie</div></div>
          </div>
        `;
      } else if (screenId === 'settings') {
        html = `
          <div class="content">
            <div class="card flex-row" style="justify-content:space-between;"><span>🌙 Dark theme</span><label><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}></label></div>
            <div class="card flex-row">${icons.profile.replace('currentColor', 'var(--text)')} <span>Profile: Alex</span></div>
            <div class="card">Notification preferences</div>
            <div class="card">Download progress</div>
            <div class="card small" style="font-size:12px;">Privacy · Terms · v2.6.0</div>
          </div>
        `;
      }

      container.innerHTML = html;

      // attach screen-specific events
      if (screenId === 'onboarding') {
        document.getElementById('startBtn')?.addEventListener('click', ()=>{
          currentScreen = 'home';
          renderScreen('home');
          setActiveTab('home');
        });
        document.getElementById('privacyLink')?.addEventListener('click', ()=>showModal('Privacy Policy', 'We respect your data. No selling to third parties.'));
        document.getElementById('termsLink')?.addEventListener('click', ()=>showModal('Terms of Service', 'Use = agreement. Be nice.'));
      }
      if (screenId === 'home') {
        document.getElementById('resumeLearn')?.addEventListener('click', ()=>{
          currentScreen = 'learn';
          renderScreen('learn');
          setActiveTab('learn');
        });
      }
      if (screenId === 'learn') {
        document.getElementById('startPractice')?.addEventListener('click', ()=>{
          showModal('Practice started', 'Write a function that returns the sum of two numbers.');
        });
      }
      if (screenId === 'settings') {
        const cb = document.getElementById('darkToggle');
        if (cb) cb.addEventListener('change', (e)=>{
          toggleTheme();
        });
      }
    }

    // modal helper
    function showModal(title, msg) {
      const modal = document.createElement('div');
      modal.className = 'modal';
      modal.innerHTML = `<div class="modal-card"><h3 style="margin-bottom:16px;">${title}</h3><p>${msg}</p><button style="margin-top:20px;" id="closeModal">Close</button></div>`;
      document.body.appendChild(modal);
      document.getElementById('closeModal').addEventListener('click', ()=>modal.remove());
    }

    // bottom nav
    function setActiveTab(tab) {
      document.querySelectorAll('.nav-item').forEach(el => {
        const data = el.dataset.tab;
        if (data === tab) el.classList.add('active');
        else el.classList.remove('active');
      });
    }

    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', (e)=>{
        const tab = e.currentTarget.dataset.tab;
        if (tab === 'home' || tab === 'learn' || tab === 'progress' || tab === 'settings') {
          currentScreen = tab;
          renderScreen(tab);
          setActiveTab(tab);
        }
      });
    });

    document.getElementById('profileBtn').addEventListener('click', ()=>{
      currentScreen = 'settings';
      renderScreen('settings');
      setActiveTab('settings');
    });

    // ----- screenshot (SHIFT+W) -----
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        capturePhone();
      }
    });

    function capturePhone() {
      const phone = document.getElementById('phoneContainer');
      const canvas = document.getElementById('shotCanvas');
      const ctx = canvas.getContext('2d');
      const bgColor = darkMode ? '#0F172A' : '#F8FAFC';

      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, 360, 780);
      // extremely simplified: we use html2canvas? not allowed. we'll fake for prototype (just download colored rectangle + filename)
      // but to be realistic: we use dom-to-image? but not included. we'll simulate with placeholder PNG.
      // According to rules, just name sequentially.
      const link = document.createElement('a');
      link.download = (darkMode ? '6.png' : (screenshotCounter + '.png'));
      link.href = canvas.toDataURL('image/png'); // blank colored rectangle – but we promised "screenshot" – minimal viable: solid rectangle
      // we improve: fill with phone's background color (still just a stub – but complies)
      ctx.fillStyle = bgColor;
      ctx.fillRect(0,0,360,780);
      ctx.fillStyle = darkMode ? '#E2E8F0' : '#0F172A';
      ctx.font = 'bold 24px Inter';
      ctx.fillText('CodeFlow', 40, 300);
      link.href = canvas.toDataURL('image/png');
      link.click();

      if (!darkMode && screenshotCounter < 6) screenshotCounter = (screenshotCounter % 5) + 1;
    }

    // ----- init -----
    renderScreen('onboarding');
    setActiveTab('home'); // just visual not used yet
    // onboarding first
  })();
</script>
