```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaFlow – vocabulary builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #1a2634;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px rgba(48, 58, 72, 0.8);
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
        }

        /* theme variables */
        .light {
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary-blue: #2563EB;
            --secondary-blue: #1E40AF;
            --accent-blue: #38BDF8;
            --inactive-icon: #94A3B8;
            --header-bg: #FFFFFF;
            --bottom-bg: #FFFFFF;
            --shadow: 0 4px 12px rgba(0,0,0,0.03);
        }

        .dark {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary-blue: #3B82F6;
            --secondary-blue: #1E3A8A;
            --accent-blue: #38BDF8;
            --inactive-icon: #64748B;
            --header-bg: #1E293B;
            --bottom-bg: #1E293B;
            --shadow: 0 4px 12px rgba(0,0,0,0.3);
        }

        /* main flex layout */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            background: var(--bg-primary);
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px 8px 20px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-light);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .profile-icon {
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .profile-icon:hover { background: var(--border-light); }

        /* main content (screen container) */
        .screen-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            scrollbar-width: thin;
            background: var(--bg-primary);
        }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--bottom-bg);
            padding: 8px 12px 14px;
            border-top: 1px solid var(--border-light);
            box-shadow: var(--shadow);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: transform 0.15s ease;
            flex: 1;
            border-radius: 16px;
            padding: 6px 0 4px;
        }

        .nav-item.active {
            transform: scale(1.05);
            background: rgba(37, 99, 235, 0.08);
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s;
        }

        .nav-item.active .nav-icon {
            stroke: var(--primary-blue);
            transform: scale(1.1);
        }

        .nav-item.inactive .nav-icon {
            stroke: var(--inactive-icon);
        }

        .nav-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .nav-item.active .nav-label {
            color: var(--primary-blue);
            font-weight: 600;
        }

        /* cards & ui */
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }

        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            background: var(--accent-blue);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
        }

        .btn-primary {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 6px 14px rgba(37,99,235,0.25);
        }
        .btn-primary:active { transform: scale(0.98); background: var(--secondary-blue); }

        .progress-bar {
            background: var(--border-light);
            height: 8px;
            border-radius: 40px;
            margin: 8px 0;
        }

        .progress-fill {
            background: var(--primary-blue);
            width: 60%;
            height: 8px;
            border-radius: 40px;
            transition: width 0.3s;
        }

        /* modal */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-card {
            background: var(--bg-card);
            width: 280px;
            padding: 28px 20px;
            border-radius: 32px;
            text-align: center;
            color: var(--text-primary);
            box-shadow: 0 30px 50px black;
        }
        .modal-card button {
            margin-top: 20px;
            background: var(--primary-blue);
            border: none;
            color: white;
            padding: 8px 30px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        /* icon system: reused */
        .icon-defs { display: none; }

        /* tiny chart */
        .chart {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 80px;
            margin: 10px 0;
        }
        .bar {
            width: 20%;
            background: var(--primary-blue);
            border-radius: 12px 12px 4px 4px;
            height: calc(100% * var(--h));
            transition: height 0.4s;
        }

        /* screenshot helper */
        .hidden-export { display: none; }
    </style>
</head>
<body class="light">
    <div class="phone" id="phoneContainer">
        <!-- inline SVG definitions (hidden) -->
        <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg">
            <symbol id="icon-home" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M5 12l-2 2v7h6v-6h6v6h6v-7l-2-2-8-8-8 8z" stroke-width="2" stroke-linecap="round"/>
            </symbol>
            <symbol id="icon-learn" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2V3zM22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7V3z" stroke-width="2"/>
            </symbol>
            <symbol id="icon-progress" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M21 12v5a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h5" stroke-width="2"/>

            </symbol>
            <symbol id="icon-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <circle cx="12" cy="12" r="3" stroke-width="2"/>
                <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" stroke-width="2"/>
            </symbol>
            <symbol id="icon-profile" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke-width="2"/><circle cx="12" cy="7" r="4" stroke-width="2"/>
            </symbol>
            <symbol id="icon-lesson" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <rect x="2" y="3" width="20" height="18" rx="2" stroke-width="2"/><path d="M8 7h8M8 11h6M8 15h4" stroke-width="2"/>
            </symbol>
            <symbol id="icon-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M21 21H4V4" stroke-width="2"/><path d="M7 15l2-4 3 3 4-6" stroke-width="2"/>
            </symbol>
            <symbol id="icon-flashcards" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <rect x="5" y="3" width="14" height="18" rx="2" stroke-width="2"/><path d="M9 7h6M9 11h4" stroke-width="2"/>
            </symbol>
            <symbol id="icon-play" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <circle cx="12" cy="12" r="10" stroke-width="2"/><path d="M10 8l6 4-6 4V8z" stroke-width="2"/>
            </symbol>
            <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M20 6L9 17l-5-5" stroke-width="2"/>
            </symbol>
        </svg>

        <div class="app-container" id="appContainer">
            <!-- dynamic header (title, profile) -->
            <div class="header" id="appHeader">
                <h1 id="headerTitle">Onboarding</h1>
                <div class="profile-icon" id="profileBtn">
                    <svg width="24" height="24" stroke="var(--primary-blue)" fill="none">
                        <use href="#icon-profile" />
                    </svg>
                </div>
            </div>

            <!-- screen container -->
            <div class="screen-content" id="screenContainer"></div>

            <!-- bottom nav (4 items) -->
            <div class="bottom-nav" id="bottomNav">
                <div class="nav-item inactive" data-tab="home">
                    <svg class="nav-icon" width="24" height="24"><use href="#icon-home"/></svg>
                    <span class="nav-label">Home</span>
                </div>
                <div class="nav-item inactive" data-tab="learn">
                    <svg class="nav-icon" width="24" height="24"><use href="#icon-learn"/></svg>
                    <span class="nav-label">Learn</span>
                </div>
                <div class="nav-item inactive" data-tab="progress">
                    <svg class="nav-icon" width="24" height="24"><use href="#icon-progress"/></svg>
                    <span class="nav-label">Progress</span>
                </div>
                <div class="nav-item inactive" data-tab="settings">
                    <svg class="nav-icon" width="24" height="24"><use href="#icon-settings"/></svg>
                    <span class="nav-label">Settings</span>
                </div>
            </div>
        </div>

        <!-- modals (privacy & terms) -->
        <div id="privacyModal" class="modal"><div class="modal-card"><h3>Privacy</h3><p>Your data stays on device. No tracking.</p><button onclick="closeModal('privacy')">OK</button></div></div>
        <div id="termsModal" class="modal"><div class="modal-card"><h3>Terms</h3><p>Educational use only. Be kind.</p><button onclick="closeModal('terms')">OK</button></div></div>
    </div>

    <script>
        (function(){
            // ---------- App state ----------
            const screens = ['onboarding', 'home', 'learn', 'progress', 'settings'];
            let currentScreen = 'onboarding';
            let theme = 'light'; // default
            let screenshotCounter = 1;

            // ---------- theme ----------
            function setTheme(newTheme) {
                document.body.className = newTheme;
                theme = newTheme;
            }

            // ---------- render functions (each screen html) ----------
            function renderOnboarding() {
                return `
                    <div class="card" style="text-align: center; margin-top: 30px;">
                        <svg width="70" height="70" stroke="var(--primary-blue)" fill="none" stroke-width="2"><use href="#icon-flashcards"/></svg>
                        <h2 style="font-size: 34px; margin: 10px 0 4px;">LinguaFlow</h2>
                        <p style="font-size: 18px; color: var(--accent-blue);">vocabulary builder</p>
                        <p style="margin: 20px 0 8px; color: var(--text-secondary);">Master 3000+ words with daily micro‑lessons. AI‑powered repetition.</p>
                        <button class="btn-primary" id="startOnboarding" style="margin: 12px 0 32px;">Get Started</button>
                        <div style="display: flex; gap: 28px; justify-content: center; font-size: 14px;">
                            <span style="color:var(--primary-blue); text-decoration:underline; cursor:pointer;" id="privacyLink">Privacy Policy</span>
                            <span style="color:var(--primary-blue); text-decoration:underline; cursor:pointer;" id="termsLink">Terms of Service</span>
                        </div>
                    </div>
                `;
            }

            function renderHome() {
                return `
                    <div class="card">
                        <div class="flex-row"><span class="badge">🔥 7 day streak</span><span>⭐ 340 XP</span></div>
                        <h3 style="margin: 16px 0 6px;">Continue lesson</h3>
                        <div style="background:var(--bg-primary); border-radius:20px; padding:12px;">
                            <div class="flex-row"><span>Phrasal verbs</span><span>3/8</span></div>
                            <div class="progress-bar"><div class="progress-fill" style="width:37%"></div></div>
                            <button class="btn-primary" style="padding:10px;" id="continueLearn">Continue</button>
                        </div>
                    </div>
                    <div class="card">
                        <div class="flex-row"><span><strong>Daily goal</strong></span><span>80%</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:80%"></div></div>
                        <div class="flex-row" style="margin-top:12px;">
                            <span><svg width="20" height="20" stroke="var(--primary-blue)"><use href="#icon-check"/></svg> 3 lessons</span>
                            <span><svg width="20" height="20" stroke="var(--primary-blue)"><use href="#icon-play"/></svg> practice</span>
                        </div>
                    </div>
                    <div class="card">
                        <h4>Recommended</h4>
                        <div style="display:flex; gap:12px; margin-top:8px;">
                            <div style="flex:1; background:var(--bg-primary); border-radius:18px; padding:12px;">🇫🇷 French basics</div>
                            <div style="flex:1; background:var(--bg-primary); border-radius:18px; padding:12px;">📖 idioms</div>
                        </div>
                    </div>
                `;
            }

            function renderLearn() {
                return `
                    <div class="card">
                        <div class="flex-row"><h3>Today's lessons</h3><span>🔊</span></div>
                        <div style="margin-top:16px;">
                            <div class="flex-row" style="margin-bottom:14px;"><svg width="24" height="24" stroke="var(--primary-blue)"><use href="#icon-lesson"/></svg> <span style="flex:1; margin-left:12px;">Workplace vocabulary</span> <span>12 min</span></div>
                            <div class="flex-row" style="margin-bottom:14px;"><svg width="24" height="24" stroke="var(--primary-blue)"><use href="#icon-flashcards"/></svg> <span style="flex:1; margin-left:12px;">Irregular verbs (flashcards)</span> <span>8 min</span></div>
                            <div class="flex-row"><svg width="24" height="24" stroke="var(--primary-blue)"><use href="#icon-play"/></svg> <span style="flex:1; margin-left:12px;">Listening comprehension</span> <span>15 min</span></div>
                        </div>
                        <button class="btn-primary" style="margin-top:20px;" id="startPractice">Start practice</button>
                    </div>
                `;
            }

            function renderProgress() {
                return `
                    <div class="card">
                        <h3>Last 7 days</h3>
                        <div class="chart">
                            <div class="bar" style="--h:0.6"></div><div class="bar" style="--h:0.8"></div><div class="bar" style="--h:0.45"></div><div class="bar" style="--h:1"></div><div class="bar" style="--h:0.7"></div><div class="bar" style="--h:0.9"></div><div class="bar" style="--h:0.5"></div>
                        </div>
                        <div class="flex-row"><span>words learned: 247</span><span>🔥 top streak 12</span></div>
                    </div>
                    <div class="card">
                        <div class="flex-row"><span>Grammar CEFR</span><span>B1 · 64%</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:64%"></div></div>
                        <div class="flex-row" style="margin-top:16px;"><span>🗂️ flashcards reviewed: 430</span></div>
                    </div>
                    <div class="card">
                        <div class="flex-row"><span>🏅 fluency badge</span><span>silver</span></div>
                    </div>
                `;
            }

            function renderSettings() {
                return `
                    <div class="card">
                        <h4>Appearance</h4>
                        <div style="display:flex; gap:20px; margin:16px 0;">
                            <label><input type="radio" name="theme" value="light" ${theme==='light'?'checked':''}> Light</label>
                            <label><input type="radio" name="theme" value="dark" ${theme==='dark'?'checked':''}> Dark</label>
                        </div>
                        <button class="btn-primary" id="applyTheme" style="padding:10px;">Apply theme</button>
                    </div>
                    <div class="card">
                        <h4>Profile</h4>
                        <p><svg width="20" height="20" stroke="var(--primary-blue)"><use href="#icon-profile"/></svg> Alex Chen</p>
                        <p>member since 2025</p>
                    </div>
                    <div class="card">
                        <h4>Notifications</h4>
                        <p>🔔 daily reminder: on</p>
                    </div>
                `;
            }

            function loadScreen(screenId) {
                const container = document.getElementById('screenContainer');
                let html = '';
                let title = '';

                if (screenId === 'onboarding') { html = renderOnboarding(); title = 'Welcome'; }
                else if (screenId === 'home') { html = renderHome(); title = 'Home'; }
                else if (screenId === 'learn') { html = renderLearn(); title = 'Learning'; }
                else if (screenId === 'progress') { html = renderProgress(); title = 'Progress'; }
                else if (screenId === 'settings') { html = renderSettings(); title = 'Settings'; }

                document.getElementById('headerTitle').innerText = title;
                container.innerHTML = html;
                currentScreen = screenId;

                // highlight bottom nav
                document.querySelectorAll('.nav-item').forEach(item => {
                    const tab = item.dataset.tab;
                    if (tab === screenId || (screenId==='onboarding' && tab==='home') ) {
                        item.classList.remove('inactive');
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                        item.classList.add('inactive');
                    }
                });

                // attach special listeners
                if (screenId === 'onboarding') {
                    document.getElementById('startOnboarding')?.addEventListener('click', ()=> navigateTo('home'));
                    document.getElementById('privacyLink')?.addEventListener('click', ()=> openModal('privacy'));
                    document.getElementById('termsLink')?.addEventListener('click', ()=> openModal('terms'));
                }
                if (screenId === 'home') {
                    document.getElementById('continueLearn')?.addEventListener('click', ()=> navigateTo('learn'));
                }
                if (screenId === 'learn') {
                    document.getElementById('startPractice')?.addEventListener('click', ()=> { alert('practice started! (demo)'); });
                }
                if (screenId === 'settings') {
                    document.querySelectorAll('input[name="theme"]').forEach(r => {
                        r.addEventListener('change', (e) => {
                            setTheme(e.target.value);
                        });
                    });
                    document.getElementById('applyTheme')?.addEventListener('click', ()=> {
                        // theme already applied via radio change, just save
                    });
                }
            }

            // navigation
            function navigateTo(screen) {
                loadScreen(screen);
            }

            // modals
            window.openModal = function(type) {
                document.getElementById(type+'Modal').style.display = 'flex';
            }
            window.closeModal = function(type) {
                document.getElementById(type+'Modal').style.display = 'none';
            }

            // bottom nav listeners
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    const tab = item.dataset.tab;
                    if (tab) navigateTo(tab);
                });
            });

            // profile button
            document.getElementById('profileBtn').addEventListener('click', ()=> navigateTo('settings'));

            // screenshot feature (shift + W)
            window.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    const phone = document.getElementById('phoneContainer');
                    html2canvas?.(phone, { scale: 2, backgroundColor: null }).then(canvas => {
                        const link = document.createElement('a');
                        const darkSuffix = theme === 'dark' ? '6' : (screenshotCounter++);
                        let filename = (theme==='dark' ? '6' : screenshotCounter) + '.png';
                        if (theme==='dark') filename = '6.png';
                        else { filename = screenshotCounter + '.png'; if(screenshotCounter>5) screenshotCounter=1; }
                        link.download = filename;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    }).catch(()=> alert('html2canvas not loaded – screenshot simulated.'));
                }
            });

            // load initial onboarding
            loadScreen('onboarding');

            // manually attach modal triggers after onboarding render
            // also profile icon already works
        })();
