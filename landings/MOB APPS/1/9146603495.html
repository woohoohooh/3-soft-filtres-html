```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Mentor · mobile prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            /* light theme (default) */
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --icon-stroke: #0F172A;
            --header-icon: #334155;
            --bottom-bg: #FFFFFF;
            --shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.05);
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --icon-stroke: #E2E8F0;
            --header-icon: #CBD5E1;
            --bottom-bg: #1E293B;
            --shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        body {
            background: #1a1f2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) transparent;
        }
        .app-screen::-webkit-scrollbar { width: 4px; }
        .app-screen::-webkit-scrollbar-thumb { background: var(--inactive); border-radius: 20px; }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px 8px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }
        .profile-btn {
            background: none;
            border: none;
            padding: 8px;
            cursor: pointer;
            color: var(--header-icon);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-btn svg {
            width: 28px;
            height: 28px;
            stroke: var(--header-icon);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* content area */
        .content {
            flex: 1;
            padding: 8px 16px 16px;
        }

        /* bottom nav */
        .bottom-nav {
            background: var(--bottom-bg);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-around;
            padding: 8px 12px 10px;
            box-shadow: var(--shadow);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 6px 0 4px;
            border-radius: 30px;
            color: var(--inactive);
            fill: none;
            stroke: var(--inactive);
        }
        .nav-item svg {
            width: 26px;
            height: 26px;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: all 0.15s;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            margin-top: 2px;
            color: currentColor;
        }
        .nav-item.active {
            color: var(--primary);
            stroke: var(--primary);
            background: rgba(37, 99, 235, 0.08);
        }
        .nav-item.active svg {
            stroke: var(--primary);
            transform: scale(1.1);
        }

        /* cards, elements */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 20px 18px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }

        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 18px;
            width: 100%;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 6px 0 var(--primary-dark);
        }
        .btn-primary:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--primary-dark); }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0;
        }

        .progress-bar {
            height: 8px;
            background: var(--border-light);
            border-radius: 20px;
            overflow: hidden;
            margin: 12px 0;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s;
        }

        /* modal overlay */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal.show {
            visibility: visible;
            opacity: 1;
        }
        .modal-content {
            background: var(--card);
            width: 280px;
            padding: 28px;
            border-radius: 32px;
            color: var(--text-primary);
            border: 1px solid var(--border-light);
            text-align: center;
        }

        /* icons inline */
        .icon-row { display: flex; gap: 16px; margin: 20px 0; flex-wrap: wrap; }

        .hidden { display: none; }

        /* micro chart */
        .mini-chart {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 100px;
            margin: 20px 0;
        }
        .bar {
            flex: 1;
            background: var(--primary);
            height: calc(100% - 40px);
            border-radius: 12px 12px 6px 6px;
            transition: height 0.3s;
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- header (dynamic) -->
    <div class="header" id="appHeader">
        <h1 id="headerTitle">Welcome</h1>
        <button class="profile-btn" id="profileBtn">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
    </div>

    <!-- main screen content (injected) -->
    <div class="app-screen" id="screenContent"></div>

    <!-- bottom navigation (static) -->
    <div class="bottom-nav" id="bottomNav">
        <button class="nav-item" data-screen="home"><svg viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 14 L9 14 L9 21 L3 21 Z"/></svg><span>Home</span></button>
        <button class="nav-item" data-screen="learn"><svg viewBox="0 0 24 24"><path d="M2 3 L6 3 L6 21 L2 21 Z M22 3 L18 3 L18 21 L22 21 Z M6 8 L12 4 L18 8 L18 16 L12 20 L6 16 Z"/></svg><span>Learn</span></button>
        <button class="nav-item" data-screen="progress"><svg viewBox="0 0 24 24"><path d="M21 12 A9 9 0 0 1 6 18 L12 12 L6 6 A9 9 0 0 1 21 12"/><circle cx="12" cy="12" r="9"/></svg><span>Progress</span></button>
        <button class="nav-item" data-screen="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82L12 22zM12 2v4"/></svg><span>Settings</span></button>
    </div>
</div>

<!-- modal templates -->
<div class="modal" id="privacyModal"><div class="modal-content"><h3>Privacy Policy</h3><p style="margin:16px 0">We respect your data. No tracking.</p><button class="btn-primary" style="padding:10px" onclick="closeModal('privacyModal')">OK</button></div></div>
<div class="modal" id="termsModal"><div class="modal-content"><h3>Terms of Service</h3><p style="margin:16px 0">Learn responsibly. Have fun!</p><button class="btn-primary" style="padding:10px" onclick="closeModal('termsModal')">OK</button></div></div>

<script>
    (function(){
        // ---------- icon system ----------
        const icons = {
            home: '<svg viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 14 L9 14 L9 21 L3 21 Z"/></svg>',
            learn: '<svg viewBox="0 0 24 24"><path d="M2 3 L6 3 L6 21 L2 21 Z M22 3 L18 3 L18 21 L22 21 Z M6 8 L12 4 L18 8 L18 16 L12 20 L6 16 Z"/></svg>',
            progress: '<svg viewBox="0 0 24 24"><path d="M21 12 A9 9 0 0 1 6 18 L12 12 L6 6 A9 9 0 0 1 21 12"/><circle cx="12" cy="12" r="9"/></svg>',
            settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82L12 22zM12 2v4"/></svg>',
            profile: '<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
            lesson: '<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="12" y2="17"/></svg>',
            chart: '<svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
            flashcards: '<svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="9" y1="6" x2="15" y2="6"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="13" y2="14"/></svg>',
            play: '<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
            check: '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
        };

        // ---------- screens (render functions) ----------
        const screens = {
            onboarding: function() {
                let html = `
                <div class="content" style="display:flex; flex-direction:column; justify-content:center; min-height:100%;">
                    <div class="card" style="text-align:center;">
                        ${icons.learn.replace('<svg','<svg width="64" height="64" style="stroke:var(--primary); margin-bottom:16px;"')}
                        <h1 style="font-size:36px; font-weight:800; letter-spacing:-1px;">Python<br>Mentor</h1>
                        <p style="font-size:18px; margin:12px 0 4px; font-weight:500;">from zero to hero</p>
                        <p style="color:var(--text-secondary); margin:16px 0;">Learn Python interactively with bite-sized exercises and real‑time feedback.</p>
                        <button class="btn-primary" id="startOnboarding" style="margin:24px 0 16px;">Get Started</button>
                        <div style="display:flex; gap:24px; justify-content:center;">
                            <button class="link-btn" style="background:none; border:none; color:var(--primary); text-decoration:underline; cursor:pointer;" onclick="showModal('privacyModal')">Privacy</button>
                            <button class="link-btn" style="background:none; border:none; color:var(--primary); text-decoration:underline; cursor:pointer;" onclick="showModal('termsModal')">Terms</button>
                        </div>
                    </div>
                </div>`;
                document.getElementById('screenContent').innerHTML = html;
                document.getElementById('headerTitle').innerText = 'Welcome';
                document.getElementById('startOnboarding')?.addEventListener('click', ()=>{
                    setActiveScreen('home');
                });
            },
            home: function() {
                let html = `
                <div class="content">
                    <div class="card">
                        <div class="row"><span class="badge">🔥 daily streak 7</span> <span>${icons.flashcards}</span></div>
                        <h2 style="margin:12px 0 4px;">Continue where you left</h2>
                        <p>Functions & loops · 80%</p>
                        <div class="progress-bar"><div class="progress-fill" style="width:80%"></div></div>
                        <button class="btn-primary" style="padding:12px;" id="continueLesson">Continue lesson</button>
                    </div>
                    <div class="card">
                        <div class="row"><h3>Today’s plan</h3> ${icons.play}</div>
                        <div class="row"><span>⚡ Variables</span> <span>12 min</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div>
                        <div class="row"><span>🐍 Lists</span> <span>8 min</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:10%"></div></div>
                        <button style="margin-top:16px; background:var(--card); border:2px solid var(--primary); border-radius:40px; padding:12px; width:100%; color:var(--primary); font-weight:bold;" id="practiceHome">Practice</button>
                    </div>
                </div>`;
                document.getElementById('screenContent').innerHTML = html;
                document.getElementById('headerTitle').innerText = 'Home';
                document.getElementById('continueLesson')?.addEventListener('click', ()=>{ setActiveScreen('learn'); });
                document.getElementById('practiceHome')?.addEventListener('click', ()=>{ setActiveScreen('learn'); });
            },
            learn: function() {
                let html = `
                <div class="content">
                    <div class="card">
                        <h3>Basics</h3>
                        <div class="row">Variables <span>${icons.play}</span></div><div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div>
                        <div class="row">Strings <span>${icons.play}</span></div><div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
                        <div class="row">Lists <span>${icons.play}</span></div><div class="progress-bar"><div class="progress-fill" style="width:20%"></div></div>
                        <button class="btn-primary" style="padding:12px; margin-top:16px;" id="startPractice">start practice →</button>
                    </div>
                    <div class="card">
                        <div class="row"><span>📘 flashcards</span> ${icons.flashcards}</div>
                        <p style="margin:8px 0">Review 15 python terms</p>
                    </div>
                </div>`;
                document.getElementById('screenContent').innerHTML = html;
                document.getElementById('headerTitle').innerText = 'Learn';
                document.getElementById('startPractice')?.addEventListener('click', ()=>{ alert('practice mode (simulated)'); });
            },
            progress: function() {
                let html = `
                <div class="content">
                    <div class="card">
                        <h3>Weekly activity</h3>
                        <div class="mini-chart" id="chartBars">
                            <div class="bar" style="height:40px"></div><div class="bar" style="height:72px"></div><div class="bar" style="height:56px"></div><div class="bar" style="height:88px"></div><div class="bar" style="height:30px"></div><div class="bar" style="height:94px"></div><div class="bar" style="height:68px"></div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="row"><span>⭐ completed lessons</span> <span>18</span></div>
                        <div class="row"><span>⚡ total points</span> <span>2340</span></div>
                        <div class="row"><span>🏅 current streak</span> <span>7 days</span></div>
                    </div>
                    <div class="card">
                        <div class="row"><span>achievements</span> ${icons.check}</div>
                        <p>🔥 7 day streak &nbsp; ⚡ 2k points</p>
                    </div>
                </div>`;
                document.getElementById('screenContent').innerHTML = html;
                document.getElementById('headerTitle').innerText = 'Progress';
                // small animation
                setTimeout(()=>{
                    document.querySelectorAll('.bar').forEach((b,i)=> { b.style.height = (40 + i*8) + 'px'; });
                },100);
            },
            settings: function() {
                let isDark = document.body.classList.contains('dark');
                html = `
                <div class="content">
                    <div class="card">
                        <h3 style="margin-bottom:20px;">Appearance</h3>
                        <div class="row">
                            <span>🌞 Light / 🌙 Dark</span>
                            <button id="themeToggleBtn" style="background:var(--primary); color:white; border:none; padding:10px 22px; border-radius:40px; font-weight:bold;">${isDark?'Switch to Light':'Switch to Dark'}</button>
                        </div>
                    </div>
                    <div class="card">
                        <h3>Profile</h3>
                        <div class="row"><span>Username</span><span>pythonista</span></div>
                        <div class="row"><span>member since</span><span>2026</span></div>
                        <div style="margin-top:16px;">${icons.profile}</div>
                    </div>
                    <div class="card">
                        <p>🔊 sound effects · on</p>
                        <p>🎯 daily goal · 30 min</p>
                    </div>
                </div>`;
                document.getElementById('screenContent').innerHTML = html;
                document.getElementById('headerTitle').innerText = 'Settings';
                document.getElementById('themeToggleBtn')?.addEventListener('click', toggleTheme);
            }
        };

        // ---- navigation ----
        function setActiveScreen(screenId) {
            // update header later inside each render
            if (screenId === 'onboarding') { screens.onboarding(); }
            else if (screenId === 'home') { screens.home(); }
            else if (screenId === 'learn') { screens.learn(); }
            else if (screenId === 'progress') { screens.progress(); }
            else if (screenId === 'settings') { screens.settings(); }

            // update active bottom nav
            document.querySelectorAll('.nav-item').forEach(item => {
                let data = item.getAttribute('data-screen');
                if (data === screenId) item.classList.add('active');
                else item.classList.remove('active');
            });
        }

        // ---- theme toggle ----
        function toggleTheme() {
            document.body.classList.toggle('dark');
            // refresh current screen to update btn text
            let active = document.querySelector('.nav-item.active')?.getAttribute('data-screen') || 'home';
            setActiveScreen(active);
        }

        // ---- modals ----
        window.showModal = (id) => document.getElementById(id).classList.add('show');
        window.closeModal = (id) => document.getElementById(id).classList.remove('show');

        // ---- profile shortcut ----
        document.getElementById('profileBtn').addEventListener('click', ()=> { setActiveScreen('settings'); });

        // ---- bottom nav listeners ----
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                let screen = e.currentTarget.getAttribute('data-screen');
                setActiveScreen(screen);
            });
        });

        // ---- screenshot (SHIFT+W) ----
        document.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                // no actual html2canvas, but we simulate sequential naming (for prototype)
                let seq = 1;
                if (document.body.classList.contains('dark')) seq = 6;
                else {
                    const active = document.querySelector('.nav-item.active')?.getAttribute('data-screen') || 'home';
                    const map = { onboarding:1, home:2, learn:3, progress:4, settings:5 };
                    seq = map[active] || 2; // fallback
                }
                alert(`📸 screenshot simulated: ${seq}.png saved (would capture phone).`);
            }
        });

        // ---- init (onboarding) ----
        setActiveScreen('onboarding');

        // ---- extra: mimic modal close by click outside? not needed ----
        window.onclick = (e) => {
            if (e.target.classList.contains('modal')) e.target.classList.remove('show');
        };

        // make theme toggle globally callable
        window.toggleTheme = toggleTheme;
    })();
</script>
</body>
</html>
All done!
