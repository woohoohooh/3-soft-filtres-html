```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabVault · English builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* CSS variables – light mode default */
        :root {
            --bg-page: #F1F5F9;
            --bg-phone: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --text-muted: #64748B;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --border-light: #E2E8F0;
            --icon-inactive: #94A3B8;
            --nav-bg: #FFFFFF;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            --progress-bg: #E2E8F0;
            --highlight-soft: #EFF6FF;
            --badge-bg: #DBEAFE;
        }

        body.dark {
            --bg-page: #0B1120;
            --bg-phone: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --text-muted: #94A3B8;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --border-light: #334155;
            --icon-inactive: #64748B;
            --nav-bg: #1E293B;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
            --progress-bg: #334155;
            --highlight-soft: #1E293B;
            --badge-bg: #1E3A8A;
        }

        body {
            background: var(--bg-page);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            transition: background 0.2s;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg-phone);
            border-radius: 48px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25), 0 0 0 8px #1E293B;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background 0.2s;
        }

        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 16px 16px 8px 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--border-light);
        }

        .screen::-webkit-scrollbar {
            width: 4px;
        }
        .screen::-webkit-scrollbar-track {
            background: var(--border-light);
        }
        .screen::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 8px;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 4px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            transition: background 0.1s;
        }
        .profile-btn:hover {
            background: var(--border-light);
        }

        /* bottom nav */
        .bottom-nav {
            background: var(--nav-bg);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-around;
            padding: 6px 8px 10px;
            border-radius: 24px 24px 0 0;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px 0 2px;
            border-radius: 20px;
            transition: all 0.2s ease;
            color: var(--icon-inactive);
            fill: var(--icon-inactive);
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            background: var(--highlight-soft);
            transform: scale(1.02);
        }
        .nav-item.active svg {
            transform: scale(1.1);
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            margin-top: 2px;
        }

        /* cards, common */
        .card {
            background: var(--card);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }

        .flex-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* onboarding specific */
        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 30px 0 20px;
        }
        .app-logo {
            background: linear-gradient(145deg, var(--primary), var(--accent));
            width: 80px;
            height: 80px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .tagline {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
            margin: 8px 0 4px;
        }
        .description {
            text-align: center;
            color: var(--text-secondary);
            margin: 8px 0 24px;
        }
        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            font-size: 18px;
            padding: 16px;
            border-radius: 40px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 8px 16px -4px rgba(37,99,235,0.3);
            transition: background 0.15s;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
        }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 20px 0 10px;
        }
        .link-row button {
            background: none;
            border: none;
            color: var(--text-muted);
            text-decoration: underline;
            font-size: 14px;
            cursor: pointer;
        }

        /* modal */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card);
            padding: 24px;
            border-radius: 32px;
            width: 280px;
            color: var(--text-primary);
            border: 1px solid var(--border-light);
        }
        .modal-content h3 { margin-bottom: 8px; }
        .modal-close {
            margin-top: 16px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        /* progress bar */
        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 40px;
            overflow: hidden;
            margin: 8px 0;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 40px;
            transition: width 0.3s ease;
        }

        /* badges */
        .badge {
            background: var(--badge-bg);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
        }

        /* hide/show screens */
        .screen-view {
            display: none;
            height: 100%;
            flex-direction: column;
        }
        .screen-view.active {
            display: flex;
        }

        /* icons inline */
        .icon-wrapper {
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* misc */
        .stat-number {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic screens will be injected, but we keep static container -->
    <div id="appContainer" style="display: contents;"></div>
</div>

<script>
    (function() {
        // ----- THEME & UTILS -----
        let currentTheme = 'light';
        const themeToggle = () => {
            document.body.classList.toggle('dark');
            currentTheme = document.body.classList.contains('dark') ? 'dark' : 'light';
        };

        // icon system (inline svg, outline, 2px stroke, rounded)
        const icons = {
            home: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10L12 3L21 10L21 20L15 20L15 14L9 14L9 20L3 20L3 10Z"/></svg>`,
            learn: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 3H8C10.209 3 12 4.791 12 7V21C12 19.791 11 19 8 19H2V3Z"/><path d="M22 3H16C13.791 3 12 4.791 12 7V21C12 19.791 13 19 16 19H22V3Z"/></svg>`,
            progress: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7V12L15 15"/><path d="M12 3V5"/></svg>`,
            settings: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/><path d="M16.5 6.5 18 4"/></svg>`,
            profile: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
            lesson: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 10h8"/><path d="M8 14h5"/></svg>`,
            chart: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 21H4V4"/><path d="M7 15L10 10L13 13L18 7"/></svg>`,
            flashcards: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6"/><path d="M9 12h6"/><path d="M9 16h4"/></svg>`,
            play: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none"/></svg>`,
            check: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>`,
        };

        // ----- APP STATE -----
        let activeTab = 'home';   // home, learn, progress, settings
        let activeScreen = 'onboarding'; // override for first screen

        // references
        const appContainer = document.getElementById('appContainer');
        let modalDiv = null;
        let darkModeActive = false;

        // screens definitions (HTML strings)
        function renderScreen() {
            const themeClass = currentTheme === 'dark' ? 'dark' : '';
            // header partial (title from screen)
            const header = (title) => `
                <div class="header">
                    <h1>${title}</h1>
                    <button class="profile-btn" id="profileHeaderBtn">${icons.profile}</button>
                </div>
            `;

            // bottom nav partial
            const bottomNav = (active) => {
                const tabs = [
                    { id: 'home', label: 'Home', icon: icons.home },
                    { id: 'learn', label: 'Learn', icon: icons.learn },
                    { id: 'progress', label: 'Progress', icon: icons.progress },
                    { id: 'settings', label: 'Settings', icon: icons.settings },
                ];
                return `
                    <nav class="bottom-nav">
                        ${tabs.map(t => `
                            <button class="nav-item ${active === t.id ? 'active' : ''}" data-nav="${t.id}">
                                <span class="icon-wrapper">${t.icon}</span>
                                <span class="nav-label">${t.label}</span>
                            </button>
                        `).join('')}
                    </nav>
                `;
            };

            // ---- Onboarding view ----
            const onboardingView = `
                <div class="screen-view active" id="screen-onboarding">
                    <div class="screen" style="justify-content: space-between;">
                        <div class="logo-area">
                            <div class="app-logo">${icons.flashcards.replace('width="24"','width="48"').replace('height="24"','height="48"').replace('currentColor','white')}</div>
                            <h1 style="font-size: 36px; font-weight: 700; color: var(--primary);">VocabVault</h1>
                            <div class="tagline">master English daily</div>
                            <div class="description">Short, smart vocabulary workouts. Learn 5 words a day and remember forever.</div>
                            <button class="btn-primary" id="getStartedBtn">Get Started →</button>
                            <div class="link-row">
                                <button id="privacyModalBtn">Privacy Policy</button>
                                <button id="termsModalBtn">Terms of Service</button>
                            </div>
                        </div>
                        ${bottomNav('home')}
                    </div>
                </div>
            `;

            // ---- Home dashboard ----
            const homeView = `
                <div class="screen-view" id="screen-home">
                    <div class="screen">
                        ${header('Home')}
                        <div class="card" style="background: linear-gradient(145deg, var(--primary), var(--accent)); color: white; border: none;">
                            <div class="flex-row" style="justify-content: space-between;">
                                <span>Daily goal</span>
                                <span class="badge" style="background:white; color:var(--primary);">3/5 words</span>
                            </div>
                            <div class="progress-bar" style="background: rgba(255,255,255,0.3);"><div class="progress-fill" style="width:60%; background:white;"></div></div>
                            <p style="margin-top: 8px;">Keep going! 🔥</p>
                        </div>
                        <div class="grid-2">
                            <div class="card" style="padding: 12px;"><span class="icon-wrapper">${icons.flashcards}</span><br><strong>Flashcards</strong><br><small>12 due</small></div>
                            <div class="card" style="padding: 12px;"><span class="icon-wrapper">${icons.play}</span><br><strong>Practice</strong><br><small>mix & match</small></div>
                        </div>
                        <div class="card">
                            <div class="flex-row" style="justify-content: space-between;"><span>Recent lessons</span><span class="badge">see all</span></div>
                            <div class="flex-row"><span class="icon-wrapper">${icons.lesson}</span> Idioms pack 1 <span style="margin-left:auto;">85%</span></div>
                            <div class="progress-bar"><div class="progress-fill" style="width:85%"></div></div>
                            <div class="flex-row"><span class="icon-wrapper">${icons.lesson}</span> Business words <span style="margin-left:auto;">40%</span></div>
                            <div class="progress-bar"><div class="progress-fill" style="width:40%"></div></div>
                        </div>
                         ${bottomNav('home')}
                    </div>
                </div>
            `;

            // ---- Learn ----
            const learnView = `
                <div class="screen-view" id="screen-learn">
                    <div class="screen">
                        ${header('Practice')}
                        <div class="card flex-row" style="justify-content: space-between;">
                            <span><span class="icon-wrapper">${icons.flashcards}</span> Vocabulary builder</span>
                            <button class="badge" id="startLessonBtn" style="background:var(--primary); color:white; border:none;">Start</button>
                        </div>
                        <div class="card flex-row"><span class="icon-wrapper">${icons.play}</span>  Phrasal verbs · 10min</div>
                        <div class="card flex-row"><span class="icon-wrapper">${icons.lesson}</span>  Advanced synonyms</div>
                        <div class="card">
                            <div><span class="icon-wrapper">${icons.chart}</span> Today's streak: 7 days</div>
                        </div>
                        ${bottomNav('learn')}
                    </div>
                </div>
            `;

            // ---- Progress ----
            const progressView = `
                <div class="screen-view" id="screen-progress">
                    <div class="screen">
                        ${header('Statistics')}
                        <div class="card">
                            <span class="stat-number">1,240</span> words learned
                            <div class="progress-bar"><div class="progress-fill" style="width:72%"></div></div>
                            <span>72% to weekly goal</span>
                        </div>
                        <div class="card flex-row"><span class="icon-wrapper">${icons.chart}</span> Monthly activity: 23h</div>
                        <div class="card"><span class="icon-wrapper">${icons.check}</span> Achievements: 12 badges</div>
                        ${bottomNav('progress')}
                    </div>
                </div>
            `;

            // ---- Settings & profile combined ----
            const settingsView = `
                <div class="screen-view" id="screen-settings">
                    <div class="screen">
                        ${header('Settings')}
                        <div class="card flex-row" style="justify-content: space-between;">
                            <span>Dark mode</span>
                            <button id="themeToggleBtn" style="background:var(--primary); border:none; color:white; padding:8px 16px; border-radius:40px;">toggle</button>
                        </div>
                        <div class="card">Notifications</div>
                        <div class="card">Sound</div>
                        <div class="card" style="margin-top:12px;">
                            <span class="icon-wrapper">${icons.profile}</span> Profile: Alex L.
                        </div>
                        ${bottomNav('settings')}
                    </div>
                </div>
            `;

            // assemble container HTML based on activeScreen
            let mainHtml = '';
            if (activeScreen === 'onboarding') {
                mainHtml = onboardingView;
            } else {
                // determine which screen to show
                const screenMap = {
                    home: homeView,
                    learn: learnView,
                    progress: progressView,
                    settings: settingsView,
                };
                // wrap only active screen, but we will toggle via js
                mainHtml = screenMap[activeTab] || homeView;
            }

            appContainer.innerHTML = mainHtml;

            // attach listeners
            if (activeScreen === 'onboarding') {
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                    activeScreen = 'main';
                    activeTab = 'home';
                    renderScreen();
                });
                document.getElementById('privacyModalBtn')?.addEventListener('click', ()=>showModal('Privacy Policy', 'Your data stays on device. We do not collect personal info.'));
                document.getElementById('termsModalBtn')?.addEventListener('click', ()=>showModal('Terms of Service', 'Use VocabVault for lawful purposes only. Free to learn.'));
            } else {
                // bottom nav listeners
                document.querySelectorAll('.nav-item[data-nav]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const tab = e.currentTarget.dataset.nav;
                        if (tab) {
                            activeTab = tab;
                            activeScreen = 'main';
                            renderScreen();
                        }
                    });
                });

                // profile header
                document.getElementById('profileHeaderBtn')?.addEventListener('click', ()=>{
                    activeScreen = 'main';
                    activeTab = 'settings';
                    renderScreen();
                });

                // theme toggle
                document.getElementById('themeToggleBtn')?.addEventListener('click', ()=>{
                    themeToggle();
                    renderScreen();  // re-render with new theme
                });

                // start lesson simulation
                document.getElementById('startLessonBtn')?.addEventListener('click', ()=>{
                    alert('Lesson started! (simulated)');
                });
            }

            // modal handling
            function showModal(title, text) {
                if (modalDiv) modalDiv.remove();
                modalDiv = document.createElement('div');
                modalDiv.className = 'modal-overlay';
                modalDiv.innerHTML = `
                    <div class="modal-content">
                        <h3>${title}</h3>
                        <p>${text}</p>
                        <button class="modal-close" id="closeModalBtn">OK</button>
                    </div>
                `;
                document.querySelector('.phone').appendChild(modalDiv);
                document.getElementById('closeModalBtn').addEventListener('click', ()=>{
                    modalDiv.remove();
                    modalDiv = null;
                });
            }
        }

        // initial render
        renderScreen();

        // ----- screenshot functionality (SHIFT + W) -----
        let screenshotCounter = 1;
        document.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                const phone = document.querySelector('.phone');
                if (!phone) return;
                
                // determine filename based on theme
                const isDark = document.body.classList.contains('dark');
                const fileName = isDark ? '6.png' : (screenshotCounter + '.png');
                if (!isDark) {
                    screenshotCounter = (screenshotCounter % 5) + 1; // 1..5 cycle
                }

                // simple download simulation (browser limitation: cannot save directly)
                alert(`📸 Screenshot ${fileName} captured (simulated).\nIn real app: download would start.`);
                // just for spec, we update counter
            }
        });

        // expose for console / fun
        window.screenshotCounter = screenshotCounter;
    })();
</script>

    "5.png": "Smart Settings",
    "6.png": "Dark Theme"
}
All done!
