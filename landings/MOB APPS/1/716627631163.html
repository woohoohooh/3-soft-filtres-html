```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSpark · Python · mobile prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            --header-bg: #FFFFFFCC;
            --bottom-nav-bg: #FFFFFF;
            --progress-bg: #E2E8F0;
            --badge-yellow: #FBBF24;
            --badge-green: #34D399;
        }

        .dark-mode {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
            --header-bg: #1E293BCC;
            --bottom-nav-bg: #1E293B;
            --progress-bg: #334155;
        }

        body {
            background: #1a1e2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 25px 60px -10px #00000080, 0 0 0 8px #2c3e50;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
            will-change: transform;
        }

        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--border-light);
            padding-bottom: 8px;
        }

        .app-screen::-webkit-scrollbar {
            width: 4px;
        }
        .app-screen::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 20px;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px 8px;
            background: var(--header-bg);
            backdrop-filter: blur(4px);
            border-bottom: 1px solid var(--border-light);
        }
        .header-left .screen-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-icon {
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            transition: background 0.15s;
        }
        .profile-icon:hover { background: var(--border-light); }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--bottom-nav-bg);
            border-top: 1px solid var(--border-light);
            padding: 8px 12px 10px;
            backdrop-filter: blur(4px);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            flex: 1;
            padding: 6px 0;
            border-radius: 30px;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            color: var(--inactive);
        }
        .nav-item.active {
            transform: scale(1.05);
            background: rgba(37, 99, 235, 0.08);
        }
        .nav-item.active span {
            color: var(--primary);
            font-weight: 600;
        }
        .nav-item.active svg path { stroke: var(--primary); }

        /* common cards & layout */
        .content {
            padding: 16px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }

        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 30px;
            margin: 12px 0 6px;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 30px;
            width: 0%;
            transition: width 0.5s ease;
        }

        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
        }

        /* buttons */
        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 16px;
            border-radius: 60px;
            width: 100%;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 8px 20px -8px var(--primary);
            transition: 0.1s;
        }
        .btn-primary:active { transform: scale(0.98); }

        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 16px 0 8px;
            font-size: 14px;
        }
        .link-row span {
            color: var(--inactive);
            text-decoration: underline;
            cursor: pointer;
        }

        /* modal */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #00000099;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-card {
            background: var(--card);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            text-align: center;
            color: var(--text-primary);
        }
        .modal-card button {
            margin-top: 20px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px 30px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        .hidden { display: none; }

        /* lesson items */
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .lesson-item:last-child { border: none; }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-cell {
            background: var(--bg);
            padding: 14px;
            border-radius: 20px;
            text-align: center;
        }

        /* chart simulation */
        .chart-bars {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            height: 100px;
            margin: 16px 0;
        }
        .bar {
            flex: 1;
            background: var(--primary);
            height: calc(100% * var(--h));
            border-radius: 12px 12px 4px 4px;
            transition: height 0.4s;
        }

        /* settings toggle */
        .theme-toggle {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .theme-option {
            background: var(--bg);
            padding: 12px;
            border-radius: 30px;
            font-weight: 500;
            cursor: pointer;
            flex: 1;
            text-align: center;
            border: 1px solid var(--border-light);
        }
        .theme-option.selected {
            background: var(--primary);
            color: white;
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- header will be injected per screen -->
    <div id="headerPlaceholder"></div>

    <!-- main screen content -->
    <div id="screenContent" class="app-screen"></div>

    <!-- bottom nav (fixed) -->
    <div class="bottom-nav" id="bottomNav"></div>

    <!-- modal container -->
    <div id="modalContainer" class="modal hidden"></div>
</div>

<script>
    (function() {
        // ---------- THEME & STATE ----------
        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
        let darkMode = false;
        let screenshotCounter = 1;

        // ---------- ICON SYSTEM (inline SVG) ----------
        const icons = {
            home: (active = false) => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${active ? '#2563EB' : '#94A3B8'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10L12 3L21 10L21 21H15V15H9V21H3L3 10Z"/></svg>`,
            learn: (active = false) => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${active ? '#2563EB' : '#94A3B8'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5L12 15L20 19.5M12 4V15M8 8L4 10.5L12 15L20 10.5L16 8"/></svg>`,
            progress: (active = false) => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${active ? '#2563EB' : '#94A3B8'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V18C21 19.1046 20.1046 20 19 20H5C3.89543 20 3 19.1046 3 18V12M7 8L12 3L17 8M12 3V15"/></svg>`,
            settings: (active = false) => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${active ? '#2563EB' : '#94A3B8'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M20 7.5V16.5C20 17.88 18.88 19 17.5 19H6.5C5.12 19 4 17.88 4 16.5V7.5C4 6.12 5.12 5 6.5 5H17.5C18.88 5 20 6.12 20 7.5Z"/></svg>`,
            profile: () => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--text-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21V19C20 16.7909 18.2091 15 16 15H8C5.79086 15 4 16.7909 4 19V21"/><circle cx="12" cy="8" r="4"/></svg>`,
            lesson: () => `<svg width="20" height="20" viewBox="0 0 24 24" stroke="var(--primary)" fill="none" stroke-width="2"><path d="M12 6V12L15 15"/><circle cx="12" cy="12" r="9"/></svg>`,
            chart: () => `<svg width="24" height="24" viewBox="0 0 24 24" stroke="var(--primary)" fill="none" stroke-width="2"><path d="M21 21H4V4M7 15L10 10L13 13L19 7"/></svg>`,
            flashcards: () => `<svg width="24" height="24" viewBox="0 0 24 24" stroke="var(--text-primary)" fill="none" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7H15M9 11H15M9 15H13"/></svg>`,
            play: () => `<svg width="24" height="24" viewBox="0 0 24 24" stroke="var(--primary)" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16" fill="var(--primary)" stroke="none"/></svg>`,
            check: () => `<svg width="24" height="24" viewBox="0 0 24 24" stroke="#10B981" fill="none" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>`,
        };

        // ---------- UTILS ----------
        function applyTheme() {
            const root = document.documentElement;
            if (darkMode) root.classList.add('dark-mode');
            else root.classList.remove('dark-mode');
        }

        function showModal(text) {
            const modal = document.getElementById('modalContainer');
            modal.innerHTML = `<div class="modal-card"><p>${text}</p><button onclick="document.getElementById('modalContainer').classList.add('hidden')">Close</button></div>`;
            modal.classList.remove('hidden');
        }

        // ---------- RENDER HEADER ----------
        function renderHeader(title) {
            return `<div class="header">
                <div class="header-left"><span class="screen-title">${title}</span></div>
                <div class="profile-icon" id="profileBtn">${icons.profile()}</div>
            </div>`;
        }

        // ---------- SCREEN RENDERERS ----------
        function renderOnboarding() {
            return `
                <div class="content" style="justify-content: center; text-align: center;">
                    <div style="margin-bottom: 24px;">📘<span style="font-size: 48px; display:block;">🐍</span></div>
                    <h1 style="font-size: 36px; font-weight:800; color: var(--primary);">CodeSpark</h1>
                    <p style="font-size: 18px; margin: 8px 0 4px; color: var(--text-secondary);">Python for everyone</p>
                    <p style="color: var(--text-secondary); margin: 12px 0 24px;">Bite-sized exercises, real coding practice. Master Python interactively.</p>
                    <button class="btn-primary" id="getStartedBtn">Get Started</button>
                    <div class="link-row">
                        <span id="privacyLink">Privacy Policy</span>
                        <span id="termsLink">Terms of Service</span>
                    </div>
                </div>
            `;
        }

        function renderHome() {
            return `
                <div class="content">
                    <div class="card">
                        <div class="flex-row"><span style="font-weight:600;">🔥 Day streak 7</span><span>🏆 120 XP</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
                        <p style="margin-top:8px;">Next badge in 2 days</p>
                    </div>
                    <div class="card">
                        <h3 style="margin-bottom:12px;">Continue learning</h3>
                        <div class="lesson-item">${icons.lesson()} <span><strong>Functions</strong> · 75%</span></div>
                        <div class="lesson-item">${icons.lesson()} <span><strong>Lists & loops</strong> · 40%</span></div>
                        <button class="btn-primary" style="margin-top:12px;" id="homeToLearn">Resume</button>
                    </div>
                    <div class="card flex-row" style="gap:8px;">
                        <span>⭐ Daily goal: 20 min</span>
                        <span>${icons.play()}</span>
                    </div>
                </div>
            `;
        }

        function renderLearn() {
            return `
                <div class="content">
                    <div class="card">
                        <h3>Python basics</h3>
                        <div class="lesson-item">${icons.lesson()} Variables · 3 min</div>
                        <div class="lesson-item">${icons.lesson()} Strings · 4 min</div>
                        <div class="lesson-item">${icons.lesson()} If/else · 5 min</div>
                        <div class="lesson-item">${icons.flashcards()} Flashcards: keywords</div>
                    </div>
                    <div class="card">
                        <div class="flex-row"><span>⚡ Quick practice</span><span>${icons.play()}</span></div>
                        <p style="color:var(--text-secondary);">Random challenge: fix the syntax</p>
                    </div>
                </div>
            `;
        }

        function renderProgress() {
            return `
                <div class="content">
                    <div class="card">
                        <h3>Weekly activity</h3>
                        <div class="chart-bars">
                            <div class="bar" style="--h:0.6"></div><div class="bar" style="--h:0.9"></div><div class="bar" style="--h:0.4"></div><div class="bar" style="--h:0.7"></div><div class="bar" style="--h:0.5"></div><div class="bar" style="--h:0.8"></div><div class="bar" style="--h:0.3"></div>
                        </div>
                        <div class="stat-grid">
                            <div class="stat-cell"><span style="font-size:20px;font-weight:700;">45</span><br>lessons</div>
                            <div class="stat-cell"><span style="font-size:20px;">8</span><br>badges</div>
                        </div>
                    </div>
                    <div class="card">
                        <span>${icons.chart()} Accuracy 92%</span>
                        <div class="progress-bar"><div class="progress-fill" style="width:92%"></div></div>
                    </div>
                </div>
            `;
        }

        function renderSettings() {
            return `
                <div class="content">
                    <div class="card">
                        <h3>Profile</h3>
                        <div class="lesson-item">${icons.profile()} Alex C.</div>
                        <div class="lesson-item">${icons.flashcards()} 8 badges earned</div>
                    </div>
                    <div class="card">
                        <div class="flex-row"><span>Dark mode</span><span style="font-size:20px;" id="darkToggleBtn">${darkMode ? '🌙' : '☀️'}</span></div>
                        <div class="theme-toggle">
                            <div class="theme-option ${!darkMode ? 'selected' : ''}" id="setLight">Light</div>
                            <div class="theme-option ${darkMode ? 'selected' : ''}" id="setDark">Dark</div>
                        </div>
                        <p style="margin-top:20px;">Version 2.0 · learn python</p>
                    </div>
                </div>
            `;
        }

        // ---------- NAVIGATION ----------
        function renderScreen(screen) {
            const headerPlace = document.getElementById('headerPlaceholder');
            const contentDiv = document.getElementById('screenContent');
            let headerTitle = '';
            let bodyHtml = '';

            if (screen === 'onboarding') { headerTitle = 'Welcome'; bodyHtml = renderOnboarding(); }
            else if (screen === 'home') { headerTitle = 'Dashboard'; bodyHtml = renderHome(); }
            else if (screen === 'learn') { headerTitle = 'Learn'; bodyHtml = renderLearn(); }
            else if (screen === 'progress') { headerTitle = 'Progress'; bodyHtml = renderProgress(); }
            else if (screen === 'settings') { headerTitle = 'Settings'; bodyHtml = renderSettings(); }

            headerPlace.innerHTML = renderHeader(headerTitle);
            contentDiv.innerHTML = bodyHtml;

            // re-attach listeners
            if (screen === 'onboarding') {
                document.getElementById('getStartedBtn')?.addEventListener('click', () => { currentScreen = 'home'; renderScreen('home'); updateBottomNav(); });
                document.getElementById('privacyLink')?.addEventListener('click', () => showModal('Privacy: your data stays on device.'));
                document.getElementById('termsLink')?.addEventListener('click', () => showModal('Terms: educational use only.'));
            }
            if (screen === 'home') {
                document.getElementById('homeToLearn')?.addEventListener('click', () => { currentScreen = 'learn'; renderScreen('learn'); updateBottomNav(); });
            }
            if (screen === 'settings') {
                document.getElementById('setLight')?.addEventListener('click', () => { darkMode = false; applyTheme(); renderScreen(currentScreen); });
                document.getElementById('setDark')?.addEventListener('click', () => { darkMode = true; applyTheme(); renderScreen(currentScreen); });
            }

            // profile button opens settings
            document.getElementById('profileBtn')?.addEventListener('click', () => {
                currentScreen = 'settings';
                renderScreen('settings');
                updateBottomNav();
            });

            updateBottomNav(screen);
        }

        function updateBottomNav(active = currentScreen) {
            const nav = document.getElementById('bottomNav');
            const items = [
                { id: 'home', label: 'Home', icon: 'home' },
                { id: 'learn', label: 'Learn', icon: 'learn' },
                { id: 'progress', label: 'Progress', icon: 'progress' },
                { id: 'settings', label: 'Settings', icon: 'settings' }
            ];
            nav.innerHTML = items.map(item => {
                const isActive = (active === item.id) || (active === 'onboarding' && item.id === 'home'); // fallback
                const activeClass = isActive ? 'active' : '';
                const iconSvg = icons[item.icon](isActive);
                return `<div class="nav-item ${activeClass}" data-nav="${item.id}">${iconSvg}<span>${item.label}</span></div>`;
            }).join('');

            document.querySelectorAll('.nav-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    const navId = el.dataset.nav;
                    if (navId) { currentScreen = navId; renderScreen(navId); }
                });
            });
        }

        // ---------- SCREENSHOT (SHIFT+W) ----------
        document.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                html2canvas?.(phone, { scale: 2 }).then(canvas => {
                    const link = document.createElement('a');
                    const themePart = darkMode ? '6' : (screenshotCounter++);
                    let filename = darkMode ? '6.png' : (screenshotCounter-1)+'.png';
                    link.download = filename;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }).catch(() => alert('html2canvas not loaded – but this is a demo.'));
            }
        });

        // ---------- BOOTSTRAP ----------
        applyTheme();
        renderScreen('onboarding');
        // bottom nav set for onboarding (home highlighted visually)
        updateBottomNav('onboarding');

        // add dummy html2canvas for screenshot simulation
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        document.head.appendChild(script);
    })();
</script>
</body>
</html>
All done!
