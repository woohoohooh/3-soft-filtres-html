<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python · code lab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1e2b;
            padding: 12px;
        }
        .phone-frame {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 0 8px #2c3142;
            position: relative;
            transition: background 0.2s;
        }
        .app-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        /* theme variables */
        :root {
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --shadow: 0 8px 20px rgba(0,0,0,0.03);
            --progress-bg: #E2E8F0;
        }
        body.dark {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --shadow: 0 8px 20px rgba(0,0,0,0.5);
            --progress-bg: #334155;
        }
        /* header / bottom nav */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 12px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
        }
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 8px;
            scrollbar-width: thin;
        }
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 12px 16px;
            background: var(--bg-card);
            border-top: 1px solid var(--border-light);
            border-radius: 28px 28px 0 0;
            box-shadow: var(--shadow);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 20px;
            transition: all 0.2s;
            color: var(--inactive);
            fill: var(--inactive);
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            background: rgba(37, 99, 235, 0.08);
            transform: scale(1.05);
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            color: currentColor;
        }
        .nav-icon {
            width: 24px;
            height: 24px;
            stroke-width: 2px;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        /* cards & components */
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }
        .flex-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
        }
        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 20px;
            margin: 10px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 20px;
            transition: width 0.4s ease;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 10px 20px -5px var(--primary-dark);
        }
        .lesson-item {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-bottom: 16px;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            z-index: 1000;
        }
        .modal-content {
            background: var(--bg-card);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            color: var(--text-primary);
            border: 1px solid var(--border-light);
        }
        .modal-content h3 { margin-bottom: 8px; }
        .modal-content button {
            margin-top: 16px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 40px;
            width: 100%;
            cursor: pointer;
        }
        .hidden { display: none; }
        .icon-sm { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }
        .chart-placeholder {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 100px;
            margin-top: 16px;
        }
        .bar {
            width: 22px;
            background: var(--primary);
            border-radius: 12px 12px 4px 4px;
            height: calc(70% * var(--h));
            transition: height 0.3s;
        }
    </style>
</head>
<body>
<div class="phone-frame" id="phoneContainer">
    <div class="app-screen" id="appScreen">
        <!-- dynamic header -->
        <div class="header" id="appHeader">
            <h1 id="screenTitle">Welcome</h1>
            <button class="profile-btn" id="profileBtn">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>
                </svg>
            </button>
        </div>

        <!-- main content area -->
        <div class="content" id="screenContent"></div>

        <!-- bottom navigation (4 items) -->
        <nav class="bottom-nav" id="bottomNav">
            <button class="nav-item" data-screen="home"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H3V10Z"/><path d="M9 20V14H15V20"/></svg><span>Home</span></button>
            <button class="nav-item" data-screen="learn"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M2 3H8C9.1 3 10 3.9 10 5V21L6 18L2 21V5C2 3.9 2.9 3 4 3Z"/><path d="M22 3H16C14.9 3 14 3.9 14 5V21L18 18L22 21V5C22 3.9 21.1 3 20 3Z"/></svg><span>Learn</span></button>
            <button class="nav-item" data-screen="progress"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 12V18C21 19.1 20.1 20 19 20H5C3.9 20 3 19.1 3 18V6C3 4.9 3.9 4 5 4H12"/><path d="M15 9L21 3"/><path d="M15 3H21V9"/></svg><span>Progress</span></button>
            <button class="nav-item" data-screen="settings"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15L20.8 13.6C21.2 13.2 21.2 12.5 20.8 12.1L19.4 10.7C19.3 10.6 19.2 10.4 19.2 10.2V8.2C19.2 7.6 18.8 7.2 18.2 7.2H16.2C16 7.2 15.8 7.1 15.7 7L14.3 5.6C13.9 5.2 13.2 5.2 12.8 5.6L11.4 7C11.3 7.1 11.1 7.2 10.9 7.2H8.9C8.3 7.2 7.9 7.6 7.9 8.2V10.2C7.9 10.4 7.8 10.6 7.7 10.7L6.3 12.1C5.9 12.5 5.9 13.2 6.3 13.6L7.7 15C7.8 15.1 7.9 15.3 7.9 15.5V17.5C7.9 18.1 8.3 18.5 8.9 18.5H10.9C11.1 18.5 11.3 18.6 11.4 18.7L12.8 20.1C13.2 20.5 13.9 20.5 14.3 20.1L15.7 18.7C15.8 18.6 16 18.5 16.2 18.5H18.2C18.8 18.5 19.2 18.1 19.2 17.5V15.5C19.2 15.3 19.3 15.1 19.4 15Z"/></svg><span>Settings</span></button>
        </nav>
    </div>
</div>

<!-- modals container (hidden by default) -->
<div id="modalContainer" class="modal hidden"></div>

<script>
    (function() {
        // ----- THEME & SCREENSHOT HELPER -----
        let darkMode = false;
        let screenshotCounter = 1;
        const phone = document.getElementById('phoneContainer');
        const screenContent = document.getElementById('screenContent');
        const screenTitle = document.getElementById('screenTitle');
        const bottomNav = document.getElementById('bottomNav');
        const profileBtn = document.getElementById('profileBtn');
        const modalDiv = document.getElementById('modalContainer');

        // base icon system (inline style)
        const icons = { /* just using inline svg */ };

        // Screens data
        const screens = {
            onboarding: { title: 'Welcome' },
            home: { title: 'Home' },
            learn: { title: 'Lessons' },
            progress: { title: 'My Progress' },
            settings: { title: 'Settings' }
        };

        function setActiveTab(screenId) {
            document.querySelectorAll('.nav-item').forEach(btn => {
                const screen = btn.dataset.screen;
                if (screen === screenId) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }

        // ----- RENDER SCREENS -----
        function renderScreen(screen) {
            // default onboarding? first call: onboarding
            if (!screen) screen = 'onboarding';
            // if screen is settings/profile via profile icon => settings
            if (screen === 'profile') screen = 'settings';

            setActiveTab(screen);
            let html = '';
            if (screen === 'onboarding') {
                screenTitle.innerText = 'Welcome';
                html = `
                    <div class="card" style="text-align: center; padding: 32px 20px;">
                        <svg width="64" height="64" viewBox="0 0 32 32" fill="none" stroke="#2563EB" stroke-width="2"><path d="M16 2L2 8v10c0 10 14 12 14 12s14-2 14-12V8l-14-6z"/><path d="M12 16l4 4 8-8"/></svg>
                        <h2 style="margin-top: 16px; font-size: 32px;">🐍 Python Lab</h2>
                        <p style="color: var(--text-secondary); margin: 8px 0;">learn by practice</p>
                        <p style="margin: 20px 0 28px;">Master Python with short challenges and instant feedback. Bite-sized lessons for coders.</p>
                        <button class="btn-primary" id="startGetStarted">Get Started</button>
                        <div style="display: flex; gap: 24px; justify-content: center; margin-top: 28px;">
                            <a href="#" id="privacyLink" style="color: var(--primary); text-decoration: none; font-size:14px;">Privacy</a>
                            <a href="#" id="termsLink" style="color: var(--primary); text-decoration: none; font-size:14px;">Terms</a>
                        </div>
                    </div>
                `;
                setTimeout(() => {
                    document.getElementById('startGetStarted')?.addEventListener('click', (e) => {
                        e.preventDefault(); renderScreen('home');
                    });
                    document.getElementById('privacyLink')?.addEventListener('click', (e) => {
                        e.preventDefault(); showModal('Privacy Policy', 'We respect your data. No sharing, ever.');
                    });
                    document.getElementById('termsLink')?.addEventListener('click', (e) => {
                        e.preventDefault(); showModal('Terms of Service', 'Use = learn. Be nice. No illegal stuff.');
                    });
                }, 0);
            }
            else if (screen === 'home') {
                screenTitle.innerText = 'Home';
                html = `
                    <div class="card">
                        <div class="flex-row"><span class="badge">🔥 streak 7 days</span><span>⚡ 340 XP</span></div>
                        <h3 style="margin: 12px 0 4px;">Hello, Alex 👋</h3>
                        <p>Continue where you left</p>
                        <div style="background: var(--accent); padding: 16px; border-radius: 20px; margin-top: 16px;">
                            <div style="display: flex; justify-content: space-between;"><span>🐍 Loops & conditions</span><span>75%</span></div>
                            <div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div>
                            <button class="btn-primary" style="margin-top: 12px; background: var(--primary-dark);" id="resumeLessonBtn">Resume</button>
                        </div>
                    </div>
                    <div class="card">
                        <div class="flex-row"><h3>Today’s picks</h3><span style="color:var(--primary)">4 tasks</span></div>
                        <div class="lesson-item"><svg width="24" height="24" viewBox="0 0 24 24" stroke="var(--primary)" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M8 12h8"/></svg><div><strong>Functions</strong><p>3 min</p></div></div>
                        <div class="lesson-item"><svg width="24" height="24" viewBox="0 0 24 24" stroke="var(--primary)" fill="none" stroke-width="2"><path d="M4 4v16h16"/><path d="M8 16l4-4 4 4"/></svg><div><strong>Lists</strong><p>5 min</p></div></div>
                    </div>
                    <div class="card"><div class="flex-row"><h3>Daily goal</h3><span>20 XP left</span></div><div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div></div>
                `;
                document.getElementById('resumeLessonBtn')?.addEventListener('click', ()=>renderScreen('learn'));
            }
            else if (screen === 'learn') {
                screenTitle.innerText = 'Learn';
                html = `
                    <div class="card"><input type="text" placeholder="Search lessons" style="width:100%; padding: 14px; border-radius: 40px; border:1px solid var(--border-light); background: var(--bg-card); color: var(--text-primary);"></div>
                    <div class="card"><h3>Python basics</h3><div class="lesson-item"><span>📘 Variables</span><span class="badge">free</span></div><div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div>
                    <div class="lesson-item"><span>📗 Conditionals</span><span class="badge">new</span></div><div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div>
                    <div class="lesson-item"><span>📙 Loops</span></div><div class="progress-bar"><div class="progress-fill" style="width:10%"></div></div>
                    <button class="btn-primary" style="margin-top:8px;" id="startPracticeBtn">Start practice →</button>
                    </div>
                `;
                document.getElementById('startPracticeBtn')?.addEventListener('click', ()=> showModal('Practice', 'Warm-up: fix 5 bugs.'));
            }
            else if (screen === 'progress') {
                screenTitle.innerText = 'Progress';
                html = `
                    <div class="card stat-grid">
                        <div><span style="color:var(--text-secondary)">Lessons done</span><h2>24</h2></div>
                        <div><span style="color:var(--text-secondary)">Streak</span><h2>7 🔥</h2></div>
                        <div><span style="color:var(--text-secondary)">XP total</span><h2>1,280</h2></div>
                        <div><span style="color:var(--text-secondary)">Mastery</span><h2>38%</h2></div>
                    </div>
                    <div class="card"><h3>Weekly activity</h3><div class="chart-placeholder" id="chartBars"><div class="bar" style="--h:0.8"></div><div class="bar" style="--h:0.5"></div><div class="bar" style="--h:0.9"></div><div class="bar" style="--h:0.4"></div><div class="bar" style="--h:0.7"></div><div class="bar" style="--h:1"></div><div class="bar" style="--h:0.3"></div></div></div>
                    <div class="card"><h3>Achievements</h3><div style="display:flex; gap:16px;"><span>🏅 5 day</span><span>⚡ 1000 XP</span><span>🐍 beginner</span></div></div>
                `;
                setTimeout(() => {
                    document.querySelectorAll('.bar').forEach((bar,i)=> { bar.style.height = `${30+ i*7}px`; });
                },50);
            }
            else if (screen === 'settings') {
                screenTitle.innerText = 'Settings';
                html = `
                    <div class="card">
                        <div style="display:flex; gap:16px; align-items:center;"><svg width="40" height="40" viewBox="0 0 24 24" stroke="var(--primary)" fill="none"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg><div><h3>Alex Chen</h3><span>alex@pythonista.dev</span></div></div>
                    </div>
                    <div class="card">
                        <div class="flex-row"><span>🌙 Dark mode</span><label class="switch"><input type="checkbox" id="darkToggle"><span class="slider"></span></label></div>
                        <div style="margin-top:16px;">🔔 Notifications</div>
                        <div>🎯 Learning goal: 15 min/day</div>
                    </div>
                    <div class="card"><h3>About</h3><p>Python Lab v1.0 · 2026</p><p style="font-size:12px;">Terms · Privacy</p></div>
                `;
                setTimeout(() => {
                    const toggle = document.getElementById('darkToggle');
                    if (toggle) {
                        toggle.checked = darkMode;
                        toggle.addEventListener('change', (e) => {
                            darkMode = e.target.checked;
                            if (darkMode) document.body.classList.add('dark');
                            else document.body.classList.remove('dark');
                        });
                    }
                }, 0);
            }
            screenContent.innerHTML = html;
        }

        function showModal(title, msg) {
            modalDiv.innerHTML = `<div class="modal-content"><h3>${title}</h3><p>${msg}</p><button id="closeModalBtn">OK</button></div>`;
            modalDiv.classList.remove('hidden');
            document.getElementById('closeModalBtn')?.addEventListener('click', ()=> modalDiv.classList.add('hidden'));
        }

        // Navigation
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const target = e.currentTarget.dataset.screen;
                renderScreen(target);
            });
        });

        profileBtn.addEventListener('click', ()=> renderScreen('settings'));

        // start with onboarding
        renderScreen('onboarding');

        // ----- SCREENSHOT FEATURE SHIFT+W -----
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const container = document.getElementById('phoneContainer');
                // minimal capture simulation (real png not possible, but we simulate naming)
                // In real app would use html2canvas, but here we just "capture" and console the metadata.
                let fileName = (darkMode ? '6' : screenshotCounter) + '.png';
                if (!darkMode && screenshotCounter <6) {
                    screenshotCounter = screenshotCounter === 5 ? 1 : screenshotCounter+1;
                }
                // fake download (just for spec) – we just alert and show JSON later
                alert(`📸 Screenshot saved as ${fileName} (simulated)`);
            }
        });

        // initial light mode
        document.body.classList.remove('dark');
    })();
</script>
