```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code daily · Python mentor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --border: #E2E8F0;
            --inactive: #94A3B8;
            --inactive-bg: #F1F5F9;
            --nav-bg: #FFFFFF;
            --shadow: 0 8px 30px rgba(0,0,0,0.03);
            --header-bg: #FFFFFF;
            --badge-bg: #EFF6FF;
            --progress-bg: #E2E8F0;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --border: #334155;
            --inactive: #64748B;
            --inactive-bg: #1E293B;
            --nav-bg: #1E293B;
            --shadow: 0 8px 30px rgba(0,0,0,0.6);
            --header-bg: #1E293B;
            --badge-bg: #1E3A5F;
            --progress-bg: #334155;
        }

        body {
            background: #11131f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 44px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.5), 0 0 0 8px #2c2f3b;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background 0.2s;
        }

        /* main app view */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* header */
        .header {
            padding: 12px 16px;
            background: var(--header-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }
        .header-title {
            font-weight: 700;
            font-size: 18px;
            color: var(--text);
            letter-spacing: -0.2px;
        }
        .profile-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
        }

        /* main content (scrollable) */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* bottom navigation */
        .bottom-nav {
            height: 70px;
            background: var(--nav-bg);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 6px 8px;
            transition: background 0.2s;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 0;
            border-radius: 20px;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.3);
            color: var(--inactive);
            fill: var(--inactive);
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            background: var(--badge-bg);
            transform: scale(1.05);
        }
        .nav-icon {
            width: 24px;
            height: 24px;
            margin-bottom: 2px;
            transition: transform 0.15s;
        }
        .nav-item.active .nav-icon {
            transform: scale(1.15);
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
        }

        /* cards / elements */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: var(--shadow);
            transition: background 0.2s;
            border: 1px solid var(--border);
        }
        .flex-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .space-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            background: var(--badge-bg);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--progress-bg);
            border-radius: 20px;
            margin: 10px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 20px;
            width: 0%;
            transition: width 0.4s ease;
        }

        button.primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 16px;
            border-radius: 60px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: 0.1s;
        }
        button.primary:active { background: var(--primary-dark); }

        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 16px 0 8px;
        }
        .link-row button {
            background: none;
            border: none;
            color: var(--inactive);
            font-size: 12px;
            text-decoration: underline;
            cursor: pointer;
        }

        /* modal */
        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            color: var(--text);
            box-shadow: 0 20px 40px black;
        }
        .modal-content button {
            margin-top: 20px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 40px;
            width: 100%;
            font-weight: 600;
            cursor: pointer;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .icon-svg {
            width: 20px;
            height: 20px;
            display: inline-block;
        }

        /* onboarding specific */
        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0 10px;
        }
        .app-logo {
            background: linear-gradient(145deg, var(--primary), var(--accent));
            width: 70px;
            height: 70px;
            border-radius: 23px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }
        .tagline { font-size: 20px; font-weight: 700; margin: 5px 0; color: var(--text); }
        .desc { font-size: 14px; color: var(--text-light); text-align: center; }

        /* lesson item */
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .lesson-item:last-child { border-bottom: none; }

        .stat-row {
            display: flex;
            justify-content: space-between;
            background: var(--bg);
            padding: 15px;
            border-radius: 22px;
        }

        /* hidden screenshot canvas */
        #screenshot-canvas { display: none; }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <div class="app-screen" id="appScreen">
        <!-- header will be injected per screen -->
        <div id="headerPlaceholder"></div>
        <!-- main content -->
        <div id="contentArea" class="content"></div>
        <!-- bottom nav -->
        <div class="bottom-nav" id="bottomNav"></div>
    </div>
</div>

<!-- hidden canvas for screenshot -->
<canvas id="screenshot-canvas" width="360" height="780"></canvas>

<script>
    (function(){
        // ---------- THEME ----------
        let darkMode = false;
        const htmlBody = document.body;

        // ---------- SVG icons (outline, 2px stroke, rounded) ----------
        const icons = {
            home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3L21 9.5V20H3V9.5Z"/><path d="M9 20V12H15V20"/></svg>`,
            learn: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3H8C10.2 3 12 4.8 12 7V21C12 19.9 11.1 19 10 19H2V3Z"/><path d="M22 3H16C13.8 3 12 4.8 12 7V21C12 19.9 12.9 19 14 19H22V3Z"/></svg>`,
            progress: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7V12L15 15"/><path d="M12 4V2"/><path d="M20 12L22 12"/><path d="M4 12L2 12"/></svg>`,
            settings: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 4.6C18.3 4 17 4.5 16.2 5.4L15 7L12 5.5L9 7L7.8 5.4C7 4.5 5.7 4 4.6 4.6C3.5 5.3 3 6.7 3.6 7.8L5 10L3.6 12.2C3 13.3 3.5 14.7 4.6 15.4C5.7 16 7 15.5 7.8 14.6L9 13L12 14.5L15 13L16.2 14.6C17 15.5 18.3 16 19.4 15.4C20.5 14.7 21 13.3 20.4 12.2L19 10L20.4 7.8C21 6.7 20.5 5.3 19.4 4.6Z"/></svg>`,
            profile: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21V19C20 16.8 18.2 15 16 15H8C5.8 15 4 16.8 4 19V21"/><circle cx="12" cy="7" r="4"/></svg>`,
            lesson: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>`,
            chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V20H3V4H7"/><path d="M7 16L11 12L14 15L20 8"/></svg>`,
            flashcards: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>`,
            play: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>`,
            check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`
        };

        // ---------- screens data ----------
        let currentScreen = 'onboarding';
        let modal = { show: false, content: '' };

        // ---------- helpers ----------
        function renderIcon(name, className = '') {
            return icons[name] ? `<span class="${className}" style="display:inline-block; width:24px; height:24px;">${icons[name]}</span>` : '';
        }

        // ---------- build header ----------
        function getHeader(title) {
            return `
                <div class="header">
                    <span class="header-title">${title}</span>
                    <button class="profile-btn" id="profileHeaderBtn">${icons.profile}</button>
                </div>
            `;
        }

        // ---------- bottom nav ----------
        function renderBottomNav(active) {
            const items = ['home', 'learn', 'progress', 'settings'];
            const labels = ['Home', 'Learn', 'Progress', 'Settings'];
            return items.map((item, idx) => {
                const isActive = (active === item);
                return `
                    <button class="nav-item ${isActive ? 'active' : ''}" data-nav="${item}">
                        <span class="nav-icon">${icons[item]}</span>
                        <span class="nav-label">${labels[idx]}</span>
                    </button>
                `;
            }).join('');
        }

        // ---------- SCREENS ----------
        function getOnboardingContent() {
            return `
                <div class="logo-area">
                    <div class="app-logo">${icons.learn}</div>
                    <div class="tagline">Code daily · Python</div>
                    <div class="desc">Bite‑sized Python exercises, flashcards & real coding challenges</div>
                </div>
                <div class="card" style="margin:12px 0;">
                    <p style="margin-bottom:16px;">Learn by doing. Master Python through interactive lessons and daily practice. Perfect for beginners.</p>
                    <button class="primary" id="getStartedBtn">Get Started</button>
                    <div class="link-row">
                        <button id="privacyModalBtn">Privacy Policy</button>
                        <button id="termsModalBtn">Terms of Service</button>
                    </div>
                </div>
            `;
        }

        function getHomeContent() {
            return `
                <div class="card space-between">
                    <span class="badge">🔥 12 day streak</span>
                    <span>⭐ 340 XP</span>
                </div>
                <div class="card">
                    <h3 style="margin-bottom:12px;">Continue learning</h3>
                    <div class="lesson-item">
                        ${icons.play} <span style="flex:1;">Functions & scope</span> <span>75%</span>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div>
                    <div class="lesson-item">
                        ${icons.flashcards} <span style="flex:1;">Lists review</span> <span>30%</span>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div>
                </div>
                <div class="grid-2">
                    <div class="card" style="text-align:center;">${icons.lesson} <br/> <strong>5 lessons</strong></div>
                    <div class="card" style="text-align:center;">${icons.flashcards} <br/> <strong>42 cards</strong></div>
                </div>
                <div class="card">
                    <span class="badge">Today's plan</span>
                    <p>⚡ Boolean logic · 10 min</p>
                    <button class="primary" style="padding:10px;" id="quickPractice">Start practice</button>
                </div>
            `;
        }

        function getLearnContent() {
            return `
                <div class="card">
                    <h3>Python basics</h3>
                    <div class="lesson-item">${icons.lesson} Variables (4 min)</div>
                    <div class="lesson-item">${icons.lesson} Strings (6 min) <span class="badge">new</span></div>
                    <div class="lesson-item">${icons.flashcards} Data types</div>
                </div>
                <div class="card">
                    <h3>Practice area</h3>
                    <div class="flex-row">${icons.play} Quick challenge · loops</div>
                    <button class="primary" style="margin-top:16px;" id="openLesson">Start lesson</button>
                </div>
            `;
        }

        function getProgressContent() {
            return `
                <div class="card stat-row">
                    <span>🔥 12 days</span>
                    <span>📊 68%</span>
                    <span>⭐ 340 XP</span>
                </div>
                <div class="card">
                    <h3>Weekly activity</h3>
                    ${icons.chart}
                    <div style="height:70px; display:flex; align-items:end; gap:4px; margin:10px 0;">
                        <div style="background:var(--primary); width:20%; height:30px; border-radius:8px;"></div>
                        <div style="background:var(--primary); width:20%; height:58px; border-radius:8px;"></div>
                        <div style="background:var(--primary); width:20%; height:40px; border-radius:8px;"></div>
                        <div style="background:var(--primary); width:20%; height:70px; border-radius:8px;"></div>
                        <div style="background:var(--primary); width:20%; height:25px; border-radius:8px;"></div>
                    </div>
                </div>
                <div class="card">
                    <h4>Achievements</h4>
                    <div class="flex-row">${icons.check} Early starter</div>
                    <div class="flex-row">${icons.check} 100 exercises</div>
                </div>
                <div class="card">Total learning hours: 8.5h</div>
            `;
        }

        function getSettingsContent() {
            return `
                <div class="card space-between">
                    <span>Dark mode</span>
                    <label class="switch"><input type="checkbox" id="darkModeToggle" ${darkMode ? 'checked' : ''}></label>
                </div>
                <div class="card">
                    <div class="lesson-item">Account</div>
                    <div class="lesson-item">Notifications</div>
                    <div class="lesson-item">Sound</div>
                    <div class="lesson-item">App version 2.4.1</div>
                </div>
                <style>.switch { width:40px; height:20px; background:grey; border-radius:20px; display:inline-block; position:relative; } .switch input { opacity:0; }</style>
            `;
        }

        // profile = same as settings but from header
        function getProfileContent() { return getSettingsContent(); }

        // ---------- render current screen ----------
        function render() {
            let content = '';
            let headerTitle = '';
            let bottomActive = '';

            switch(currentScreen) {
                case 'onboarding':
                    headerTitle = 'Welcome';
                    bottomActive = '';
                    content = getOnboardingContent();
                    break;
                case 'home':
                    headerTitle = 'Dashboard';
                    bottomActive = 'home';
                    content = getHomeContent();
                    break;
                case 'learn':
                    headerTitle = 'Learn';
                    bottomActive = 'learn';
                    content = getLearnContent();
                    break;
                case 'progress':
                    headerTitle = 'Progress';
                    bottomActive = 'progress';
                    content = getProgressContent();
                    break;
                case 'settings':
                    headerTitle = 'Settings';
                    bottomActive = 'settings';
                    content = getSettingsContent();
                    break;
                case 'profile':
                    headerTitle = 'Profile';
                    bottomActive = ''; // no bottom active
                    content = getProfileContent();
                    break;
                default: break;
            }

            document.getElementById('headerPlaceholder').innerHTML = getHeader(headerTitle);
            document.getElementById('contentArea').innerHTML = content;
            const bottomNavHtml = (currentScreen !== 'onboarding' && currentScreen !== 'profile') ? renderBottomNav(bottomActive) : '';
            document.getElementById('bottomNav').innerHTML = bottomNavHtml;

            // re-attach listeners
            attachListeners();
            if(darkMode) htmlBody.classList.add('dark'); else htmlBody.classList.remove('dark');
        }

        // ---------- event listeners + modal ----------
        function attachListeners() {
            // bottom navigation
            document.querySelectorAll('.nav-item[data-nav]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const nav = e.currentTarget.dataset.nav;
                    if (nav === 'home') currentScreen = 'home';
                    if (nav === 'learn') currentScreen = 'learn';
                    if (nav === 'progress') currentScreen = 'progress';
                    if (nav === 'settings') currentScreen = 'settings';
                    render();
                });
            });

            // profile header
            const profileBtn = document.getElementById('profileHeaderBtn');
            if(profileBtn) profileBtn.addEventListener('click', ()=>{
                currentScreen = 'profile';
                render();
            });

            // Get Started
            const startBtn = document.getElementById('getStartedBtn');
            if(startBtn) startBtn.addEventListener('click', ()=>{
                currentScreen = 'home';
                render();
            });

            // Privacy / Terms modals
            const privBtn = document.getElementById('privacyModalBtn');
            if(privBtn) privBtn.addEventListener('click', ()=> showModal('Privacy Policy', 'Your data is secure. We do not share personal info.'));
            const termsBtn = document.getElementById('termsModalBtn');
            if(termsBtn) termsBtn.addEventListener('click', ()=> showModal('Terms of Service', 'Use this app for learning. Accept cookies.'));

            // quick practice / lesson (any)
            const quick = document.getElementById('quickPractice');
            if(quick) quick.addEventListener('click', ()=>{
                const fill = document.querySelector('.progress-fill');
                if(fill) fill.style.width = Math.floor(Math.random()*40+30)+'%';
            });
            const openLesson = document.getElementById('openLesson');
            if(openLesson) openLesson.addEventListener('click', ()=>{
                currentScreen = 'learn';
                render();
            });

            // dark mode toggle
            const toggle = document.getElementById('darkModeToggle');
            if(toggle) {
                toggle.checked = darkMode;
                toggle.addEventListener('change', (e)=>{
                    darkMode = e.target.checked;
                    if(darkMode) htmlBody.classList.add('dark'); else htmlBody.classList.remove('dark');
                    render();
                });
            }
        }

        // modal system
        function showModal(title, text) {
            const modalDiv = document.createElement('div');
            modalDiv.className = 'modal';
            modalDiv.innerHTML = `
                <div class="modal-content">
                    <h3 style="margin-bottom:12px;">${title}</h3>
                    <p>${text}</p>
                    <button id="closeModalBtn">OK</button>
                </div>
            `;
            document.querySelector('.phone').appendChild(modalDiv);
            document.getElementById('closeModalBtn').addEventListener('click', ()=> modalDiv.remove());
        }

        // ---------- screenshot (SHIFT+W) ----------
        document.addEventListener('keydown', (e) => {
            if(e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                const canvas = document.getElementById('screenshot-canvas');
                const ctx = canvas.getContext('2d');
                import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm').then((mod) => {
                    mod.default(phone, { scale:2, backgroundColor:null }).then(canvasTemp => {
                        ctx.clearRect(0,0,360,780);
