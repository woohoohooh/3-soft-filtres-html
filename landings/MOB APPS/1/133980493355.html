```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Brain · vocabulary builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --grey-light: #94A3B8;
            --grey-mid: #64748B;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
        }

        [data-theme="dark"] {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --grey-light: #64748B;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }

        body {
            background: #1a1e2b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        /* phone mock */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 48px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.3), 0 0 0 8px #2d3344;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
        }

        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            padding: 16px 16px 8px 16px;
        }

        /* header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0 16px 0;
        }
        .header h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 12px;
            transition: background 0.2s;
        }
        .profile-icon:hover {
            background: var(--border-light);
        }

        /* bottom nav */
        .bottom-nav {
            background: var(--card);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-around;
            padding: 8px 4px;
            border-radius: 0 0 48px 48px;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px 0;
            border-radius: 16px;
            transition: all 0.2s ease;
            color: var(--grey-light);
        }
        .nav-item.active {
            color: var(--primary);
            background: rgba(37, 99, 235, 0.08);
            transform: scale(1.02);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.2s;
        }
        .nav-item.active svg {
            transform: scale(1.15);
            stroke: var(--primary);
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
        }

        /* cards */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
        }

        .progress-bar {
            height: 10px;
            background: var(--border-light);
            border-radius: 20px;
            margin: 12px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 60%;
            background: var(--primary);
            border-radius: 20px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 20px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(37,99,235,0.2);
            transition: 0.1s;
        }
        button:active { transform: scale(0.97); }

        .small-link {
            color: var(--grey-light);
            text-decoration: none;
            font-size: 13px;
            margin: 0 8px;
        }

        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card);
            padding: 24px;
            border-radius: 36px;
            width: 280px;
            text-align: center;
            color: var(--text-primary);
        }

        .lesson-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0;
        }

        .chart-svg {
            width: 100%;
            height: 90px;
            margin: 8px 0;
        }

        /* toggle */
        .theme-switch {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--border-light);
            padding: 6px;
            border-radius: 30px;
            width: 120px;
        }
        .theme-option {
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
        }
        .theme-option.active {
            background: var(--primary);
            color: white;
        }

        .hidden { display: none; }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer" data-theme="light">
    <!-- dynamic screen will be injected here -->
    <div id="app"></div>
</div>

<script>
    (function() {
        // ----- icon system (inline svg, outline 2px, rounded) -----
        function icon(name, className = '') {
            const icons = {
                home: `<svg viewBox="0 0 24 24" class="${className}"><path d="M3 10L12 3L21 10L21 20L3 20L3 10Z" stroke="currentColor" fill="none"/><rect x="9" y="14" width="6" height="6" stroke="currentColor" fill="none"/></svg>`,
                learn: `<svg viewBox="0 0 24 24" class="${className}"><path d="M2 3H8C9.06087 3 10.0783 3.42143 10.8284 4.17157C11.5786 4.92172 12 5.93913 12 7V20C12 18.9391 11.5786 17.9217 10.8284 17.1716C10.0783 16.4214 9.06087 16 8 16H2V3Z" stroke="currentColor" fill="none"/><path d="M22 3H16C14.9391 3 13.9217 3.42143 13.1716 4.17157C12.4214 4.92172 12 5.93913 12 7V20C12 18.9391 12.4214 17.9217 13.1716 17.1716C13.9217 16.4214 14.9391 16 16 16H22V3Z" stroke="currentColor" fill="none"/></svg>`,
                progress: `<svg viewBox="0 0 24 24" class="${className}"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><path d="M12 3V12L17 17" stroke="currentColor" fill="none"/></svg>`,
                settings: `<svg viewBox="0 0 24 24" class="${className}"><circle cx="12" cy="12" r="3" stroke="currentColor" fill="none"/><path d="M19.4 15C18.9 16 18.1 16.7 17.2 17.2L19 20.6L16.6 21L14.8 17.7C13.9 17.9 12.9 17.9 12 17.9C11.1 17.9 10.1 17.8 9.2 17.7L7.4 21L5 20.6L6.8 17.2C5.9 16.7 5.1 16 4.6 15L1 15V12.5L4.1 11.1C4 10.4 4 9.7 4.1 9L1 7.5V5L4.6 5C5.1 4 5.9 3.3 6.8 2.8L5 1.4L7.4 1L9.2 4.3C10.1 4.1 11.1 4 12 4C12.9 4 13.9 4.1 14.8 4.3L16.6 1L19 1.4L17.2 4.8C18.1 5.3 18.9 6 19.4 7L23 7.5V10L19.9 11.1C20 11.7 20 12.4 19.9 13L23 14.5V17L19.4 15Z" stroke="currentColor" fill="none"/></svg>`,
                profile: `<svg viewBox="0 0 24 24" class="${className}"><circle cx="12" cy="8" r="5" stroke="currentColor" fill="none"/><path d="M20 21C20 16.5817 16.4183 13 12 13C7.58172 13 4 16.5817 4 21" stroke="currentColor" fill="none"/></svg>`,
                lesson: `<svg viewBox="0 0 24 24" class="${className}"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" fill="none"/><path d="M8 8H16M8 12H14M8 16H12" stroke="currentColor"/></svg>`,
                chart: `<svg viewBox="0 0 24 24" class="${className}"><path d="M3 17V20H21V17M5 14L7 10L11 14L17 5L20 10" stroke="currentColor" fill="none"/></svg>`,
                flashcards: `<svg viewBox="0 0 24 24" class="${className}"><path d="M4 4H20V18H4V4Z" stroke="currentColor" fill="none"/><path d="M8 8H16M8 12H16M8 16H13" stroke="currentColor"/></svg>`,
                play: `<svg viewBox="0 0 24 24" class="${className}"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><polygon points="10,8 16,12 10,16" stroke="currentColor" fill="none"/></svg>`,
                check: `<svg viewBox="0 0 24 24" class="${className}"><path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2" fill="none"/></svg>`
            };
            return icons[name] || icons.home;
        }

        // ----- app state -----
        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
        let theme = 'light';
        let screenshotCounter = 1;

        const container = document.getElementById('app');

        function renderScreen() {
            if (currentScreen === 'onboarding') renderOnboarding();
            else if (currentScreen === 'home') renderHome();
            else if (currentScreen === 'learn') renderLearn();
            else if (currentScreen === 'progress') renderProgress();
            else if (currentScreen === 'settings') renderSettings();
        }

        // ---- navigation helper ----
        function navigateTo(screen) {
            currentScreen = screen;
            renderScreen();
        }

        // ---- theme toggle ----
        function setTheme(newTheme) {
            theme = newTheme;
            document.getElementById('phoneContainer').setAttribute('data-theme', theme);
            renderScreen(); 
        }

        // ---- modals (privacy/terms) ----
        function showModal(text) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `<div class="modal-content"><p>${text}</p><br><button id="closeModalBtn">Close</button></div>`;
            document.body.appendChild(modal);
            document.getElementById('closeModalBtn').addEventListener('click', () => modal.remove());
            modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
        }

        // ----- header generator -----
        function renderHeader(title) {
            return `
                <div class="header">
                    <h2>${title}</h2>
                    <div class="profile-icon" id="profileBtn">${icon('profile', 'profile-svg')}</div>
                </div>
            `;
        }

        // ----- bottom nav -----
        function renderBottomNav(active) {
            const items = ['home', 'learn', 'progress', 'settings'];
            return `
                <div class="bottom-nav">
                    ${items.map(item => `
                        <button class="nav-item ${active === item ? 'active' : ''}" data-nav="${item}">
                            ${icon(item, 'nav-icon')}
                            <span>${item.charAt(0).toUpperCase() + item.slice(1)}</span>
                        </button>
                    `).join('')}
                </div>
            `;
        }

        // ---------- SCREENS ----------
        function renderOnboarding() {
            let html = `
                <div class="screen">
                    ${renderHeader('Welcome')}
                    <div style="flex:1; display: flex; flex-direction: column; justify-content: center; text-align: center;">
                        <div style="font-size: 56px; margin-bottom: 8px;">📘</div>
                        <h1 style="font-size: 34px; font-weight:800; color: var(--primary);">LexiLearn</h1>
                        <p style="font-size: 18px; margin: 8px 0 4px; font-weight: 500;">expand your vocabulary</p>
                        <p style="color: var(--text-secondary); margin: 16px 0 32px;">Master 3000+ English words with daily micro‑lessons. Speak fluently, remember forever.</p>
                        <button id="getStartedBtn" style="width:100%;">Get Started</button>
                        <div style="margin-top: 24px;">
                            <a href="#" class="small-link" id="privacyLink">Privacy Policy</a> • 
                            <a href="#" class="small-link" id="termsLink">Terms of Service</a>
                        </div>
                    </div>
                </div>
                ${renderBottomNav('home')}
            `;
            container.innerHTML = html;
            document.getElementById('getStartedBtn').addEventListener('click', ()=> navigateTo('home'));
            document.getElementById('privacyLink').addEventListener('click', (e) => { e.preventDefault(); showModal('Privacy: Your data stays on device.'); });
            document.getElementById('termsLink').addEventListener('click', (e) => { e.preventDefault(); showModal('Terms: Use for learning only.'); });
            document.getElementById('profileBtn').addEventListener('click', ()=> navigateTo('settings'));
            attachNav();
        }

        function renderHome() {
            let html = `
                <div class="screen">
                    ${renderHeader('Home')}
                    <div class="card" style="background: linear-gradient(145deg, var(--primary), var(--primary-dark)); color:white;">
                        <div class="row"><span class="badge">🔥 7 day streak</span>${icon('flashcards', '')}</div>
                        <h3 style="margin:12px 0 4px;">Daily goal</h3>
                        <div class="progress-bar" style="background:#ffffff50;"><div class="progress-fill" style="width:45%; background:white;"></div></div>
                        <p>15 new words · 3 min left</p>
                    </div>
                    <div class="card">
                        <div class="row"><h3>Continue lesson</h3>${icon('play', '')}</div>
                        <div class="lesson-item"><div>${icon('lesson','')}</div><div><strong>Business English #7</strong><br>12 words remaining</div></div>
                        <div class="lesson-item"><div>${icon('flashcards','')}</div><div><strong>Phrasal verbs</strong><br>review 8 cards</div></div>
                    </div>
                    <div class="card row">
                        <div><span>🏆 Word streak</span><br><strong>1240 words</strong></div>
                        <div>${icon('chart','')}</div>
                    </div>
                </div>
                ${renderBottomNav('home')}
            `;
            container.innerHTML = html;
            document.getElementById('profileBtn').addEventListener('click', ()=> navigateTo('settings'));
            attachNav();
        }

        function renderLearn() {
            let html = `
                <div class="screen">
                    ${renderHeader('Learn')}
                    <div class="card"><input type="text" placeholder="Search lessons..." style="width:100%; padding:14px; border-radius:30px; border:1px solid var(--border-light); background:var(--bg); color:var(--text-primary);"></div>
                    <div class="card">
                        <h3>Recommended</h3>
                        <div class="lesson-item">${icon('lesson','')}   IELTS vocabulary · 4.8⭐</div>
                        <div class="lesson-item">${icon('flashcards','')}   Irregular verbs · 80 cards</div>
                        <div class="lesson-item">${icon('play','')}   Listening practice · B2</div>
                    </div>
                    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
                        <span class="badge">All</span><span class="badge">Beginner</span><span class="badge">Business</span><span class="badge">Idioms</span>
                    </div>
                    <button id="startPracticeBtn" style="width:100%;">Start quick practice →</button>
                </div>
                ${renderBottomNav('learn')}
            `;
            container.innerHTML = html;
            document.getElementById('profileBtn').addEventListener('click', ()=> navigateTo('settings'));
            document.getElementById('startPracticeBtn')?.addEventListener('click', ()=> { alert('Practice mode: 10 words'); });
            attachNav();
        }

        function renderProgress() {
            let html = `
                <div class="screen">
                    ${renderHeader('Progress')}
                    <div class="card">
                        <div class="row"><h3>Weekly activity</h3>${icon('chart','')}</div>
                        <div class="chart-svg">${icon('chart')}</div>
                    </div>
                    <div class="stats-grid">
                        <div class="card"><strong>678</strong> words<br>learned</div>
                        <div class="card"><strong>34</strong> days<br>streak</div>
                        <div class="card"><strong>12</strong> hours<br>focused</div>
                        <div class="card"><strong>89%</strong> avg<br>recall</div>
                    </div>
                    <div class="card">${icon('check','')}   Advanced 1 completed · 200xp</div>
                </div>
                ${renderBottomNav('progress')}
            `;
            container.innerHTML = html;
            document.getElementById('profileBtn').addEventListener('click', ()=> navigateTo('settings'));
            attachNav();
        }

        function renderSettings() {
            let html = `
                <div class="screen">
                    ${renderHeader('Settings')}
                    <div class="card">
                        <div class="row"><span>Dark theme</span> 
                            <div class="theme-switch" id="themeToggle">
                                <span class="theme-option ${theme==='light'?'active':''}" data-theme="light">Light</span>
                                <span class="theme-option ${theme==='dark'?'active':''}" data-theme="dark">Dark</span>
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="lesson-item">${icon('profile','')} Account</div>
                        <div class="lesson-item">🔔 Notifications</div>
                        <div class="lesson-item">📊 Download data</div>
                    </div>
                    <div class="card"><small>Version 2.6 · English Brain</small></div>
                </div>
                ${renderBottomNav('settings')}
            `;
            container.innerHTML = html;
            document.getElementById('profileBtn').addEventListener('click', ()=> navigateTo('settings'));
            document.querySelectorAll('[data-theme]').forEach(el => {
                el.addEventListener('click', (e) => {
                    const newTheme = e.target.getAttribute('data-theme');
                    setTheme(newTheme);
                });
            });
            attachNav();
        }

        function attachNav() {
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const nav = e.currentTarget.dataset.nav;
                    if (nav) navigateTo(nav);
                });
            });
        }

        // ----- screenshot (SHIFT + W) -----
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                const phone = document.getElementById('phoneContainer');
                import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
                    html2canvas(phone, { scale: 2 }).then(canvas => {
                        const link = document.createElement('a');
                        const themeSuffix = theme === 'dark' ? '6' : screenshotCounter.toString();
                        link.download = `${themeSuffix}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        screenshotCounter = screenshotCounter < 5 ? screenshotCounter + 1 : 1; 
                    });
                }).catch(() => alert('html2canvas load error'));
            }
        });

        // start
        renderScreen();
    })();
</script>
</body>
</html>
All done!
