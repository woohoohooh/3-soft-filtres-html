```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic Brain · 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --border: #E2E8F0;
            --inactive: #94A3B8;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            --header-height: 60px;
            --bottom-nav-height: 70px;
            --icon-stroke: 2px;
            --active-bg: rgba(37, 99, 235, 0.12);
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #94A3B8;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --border: #334155;
            --inactive: #64748B;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
            --active-bg: rgba(59, 130, 246, 0.2);
        }

        body {
            background: #1b1f26;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 44px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3), 0 0 0 8px #2c2f36;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
        }

        /* content wrapper */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* header */
        .header {
            height: var(--header-height);
            padding: 0 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--text);
        }
        .profile-btn {
            background: none;
            border: none;
            padding: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-btn svg {
            width: 26px;
            height: 26px;
            stroke: var(--text);
            stroke-width: var(--icon-stroke);
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* main content area (screen switching) */
        .screen-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 18px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) var(--card);
        }
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: var(--card);
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: var(--inactive);
            border-radius: 10px;
        }

        /* bottom navigation */
        .bottom-nav {
            height: var(--bottom-nav-height);
            background: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 6px 8px;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: 16px;
            padding: 8px 0 4px;
            cursor: pointer;
            transition: all 0.15s ease;
            color: var(--inactive);
            fill: none;
            stroke: var(--inactive);
        }
        .nav-item.active {
            color: var(--primary);
            stroke: var(--primary);
            background: var(--active-bg);
            transform: scale(1.02);
        }
        .nav-item svg {
            width: 26px;
            height: 26px;
            stroke-width: var(--icon-stroke);
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: transform 0.1s;
        }
        .nav-item.active svg {
            transform: scale(1.1);
            stroke: var(--primary);
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            margin-top: 2px;
            color: currentColor;
        }

        /* onboarding buttons */
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 24px;
            font-weight: 600;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--primary-dark);
            transition: 0.08s linear;
            margin: 24px 0 16px;
        }
        .btn-primary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--primary-dark);
        }
        .small-link {
            color: var(--inactive);
            text-decoration: underline;
            background: none;
            border: none;
            font-size: 13px;
            cursor: pointer;
            margin: 0 10px;
        }

        /* modal */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal.hidden {
            display: none;
        }
        .modal-content {
            background: var(--card);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            color: var(--text);
            box-shadow: var(--shadow);
            position: relative;
        }
        .modal-content h3 {
            margin-bottom: 8px;
        }
        .close-modal {
            margin-top: 20px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 30px;
            width: 100%;
            cursor: pointer;
        }

        /* cards, progress, stats */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }
        .row-space {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 4px 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
        }
        .progress-bar-bg {
            background: var(--border);
            height: 10px;
            border-radius: 20px;
            margin: 12px 0;
        }
        .progress-fill {
            height: 10px;
            background: var(--primary);
            border-radius: 20px;
            width: 0%;
            transition: width 0.4s ease;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-item {
            background: var(--bg);
            border-radius: 20px;
            padding: 14px;
        }
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .lesson-item:last-child {
            border-bottom: none;
        }
        .icon-small {
            width: 40px;
            height: 40px;
            background: var(--active-bg);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-small svg {
            width: 24px;
            height: 24px;
            stroke: var(--primary);
        }
        .chart-line {
            display: flex;
            align-items: flex-end;
            height: 60px;
            gap: 8px;
            margin: 12px 0;
        }
        .bar {
            width: 20px;
            background: var(--primary);
            border-radius: 12px 12px 4px 4px;
            height: calc(70% * var(--h));
            transition: height 0.3s;
        }

        /* toggles */
        .theme-switch {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0;
        }
        .toggle-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 10px 24px;
            border-radius: 40px;
            color: var(--text);
            font-weight: 500;
            cursor: pointer;
        }
        .toggle-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="phone" id="phoneContainer">
        <div class="app-screen" id="appScreen">
            <!-- dynamic header injected via js -->
            <div class="header" id="appHeader">
                <h1 id="headerTitle">Logic Puzzles</h1>
                <button class="profile-btn" id="profileBtn">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></svg>
                </button>
            </div>

            <!-- screen container (views) -->
            <div class="screen-container" id="screenContainer">
                <!-- will be replaced by JS -->
            </div>

            <!-- bottom navigation -->
            <div class="bottom-nav" id="bottomNav">
                <button class="nav-item" data-screen="home"><svg viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10L12 3L21 10V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10Z"/></svg><span>Home</span></button>
                <button class="nav-item" data-screen="learn"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2Z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7Z"/></svg><span>Learn</span></button>
                <button class="nav-item" data-screen="progress"><svg viewBox="0 0 24 24"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg><span>Progress</span></button>
                <button class="nav-item" data-screen="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62Z"/><path d="M16.5 6.5L17 7l-.5.5"/><path d="M7 7l.5-.5L7 6.5"/></svg><span>Settings</span></button>
            </div>
        </div>
    </div>

    <!-- modal template (hidden) -->
    <div class="modal hidden" id="policyModal">
        <div class="modal-content">
            <h3 id="modalTitle">Privacy Policy</h3>
            <p id="modalText">We respect your data. This is a demo app.</p>
            <button class="close-modal" id="closeModal">OK</button>
        </div>
    </div>

    <script>
        (function() {
            // ---------- Icon system ----------
            const icons = {
                profile: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></svg>',
                lesson: '<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2Z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7Z"/></svg>',
                chart: '<svg viewBox="0 0 24 24"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>',
                flashcards: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h10"/><path d="M7 13h6"/></svg>',
                play: '<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
                check: '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
                home: '<svg viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10L12 3L21 10V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10Z"/></svg>',
                learn: '<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2Z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7Z"/></svg>',
                progress: '<svg viewBox="0 0 24 24"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>',
                settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62Z"/><path d="M16.5 6.5L17 7l-.5.5"/><path d="M7 7l.5-.5L7 6.5"/></svg>'
            };

            // ---------- state ----------
            let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
            let darkMode = false;
            let screenshotCounter = 1;

            // ---------- DOM elements ----------
            const headerTitle = document.getElementById('headerTitle');
            const screenContainer = document.getElementById('screenContainer');
            const navItems = document.querySelectorAll('.nav-item');
            const profileBtn = document.getElementById('profileBtn');
            const phone = document.getElementById('phoneContainer');
            const modal = document.getElementById('policyModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalText = document.getElementById('modalText');
            const closeModal = document.getElementById('closeModal');

            // ---------- helper to render active screen ----------
            function setScreen(screenId, updateNav = true) {
                currentScreen = screenId;
                renderScreenContent(screenId);
                if (updateNav) {
                    updateActiveNav(screenId);
                }
                if (screenId === 'onboarding') {
                    document.querySelector('.bottom-nav').style.display = 'none';
                } else {
                    document.querySelector('.bottom-nav').style.display = 'flex';
                }
                // header title
                if (screenId === 'onboarding') headerTitle.innerText = 'Welcome';
                else if (screenId === 'home') headerTitle.innerText = 'Home';
                else if (screenId === 'learn') headerTitle.innerText = 'Logic puzzles';
                else if (screenId === 'progress') headerTitle.innerText = 'Your stats';
                else if (screenId === 'settings') headerTitle.innerText = 'Settings';
            }

            function renderScreenContent(screen) {
                if (screen === 'onboarding') screenContainer.innerHTML = renderOnboarding();
                else if (screen === 'home') screenContainer.innerHTML = renderHome();
                else if (screen === 'learn') screenContainer.innerHTML = renderLearn();
                else if (screen === 'progress') screenContainer.innerHTML = renderProgress();
                else if (screen === 'settings') screenContainer.innerHTML = renderSettings();
                attachScreenEvents();
            }

            // onboarding template
            function renderOnboarding() {
                return `
                    <div style="display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 24px;">
                        <svg width="80" height="80" viewBox="0 0 24 24" stroke="var(--primary)" stroke-width="2" fill="none" style="margin-bottom: 16px;">
                            <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
                        </svg>
                        <h2 style="font-size: 32px; font-weight: 700; color: var(--primary);">Logic Brain</h2>
                        <p style="font-size: 18px; margin: 8px 0 4px;">train your mind daily</p>
                        <p style="color: var(--text-light); max-width: 260px; margin: 16px 0;">Short puzzles & brain teasers to sharpen logic. 5 min a day.</p>
                        <button class="btn-primary" id="getStartedBtn">Get Started</button>
                        <div>
                            <button class="small-link" id="privacyBtn">Privacy Policy</button>
                            <button class="small-link" id="termsBtn">Terms of Service</button>
                        </div>
                    </div>
                `;
            }

            function renderHome() {
                return `
                    <div class="card">
                        <div class="row-space"><span>🔥 Daily streak</span><span class="badge">7 days</span></div>
                        <div class="progress-bar-bg"><div class="progress-fill" style="width:70%"></div></div>
                        <p style="margin-top:6px;">2/3 puzzles done today</p>
                    </div>
                    <div class="card">
                        <div class="row-space"><span>🧩 Recommended</span><span style="color:var(--primary)">View all</span></div>
                        <div class="lesson-item">
                            <div class="icon-small">${icons.flashcards}</div><div><b>Knight & Knaves</b><p style="font-size:13px;">logic grid</p></div>
                        </div>
                        <div class="lesson-item">
                            <div class="icon-small">${icons.lesson}</div><div><b>River crossing</b><p style="font-size:13px;">strategy</p></div>
                        </div>
                    </div>
                    <div class="card"><div class="row-space"><span>🏆 Achievements</span></div>
                        <div style="display:flex; gap:8px;"> <span style="background:var(--bg); padding:6px 16px; border-radius:40px;">⚡️ Quick solver</span> <span style="background:var(--bg); padding:6px 16px; border-radius:40px;">🔥 7 day streak</span> </div>
                    </div>
                `;
            }

            function renderLearn() {
                return `
                    <div class="card"><h3 style="margin-bottom:12px;">Today's puzzles</h3>
                        <div class="lesson-item"><div class="icon-small">${icons.play}</div><div><b>Truth tellers</b><p> · 5 min</p></div></div>
                        <div class="lesson-item"><div class="icon-small">${icons.play}</div><div><b>Mastermind</b><p> · 8 min</p></div></div>
                        <div class="lesson-item"><div class="icon-small">${icons.play}</div><div><b>Zebra puzzle</b><p> · 12 min</p></div></div>
                        <button class="btn-primary" style="margin:16px 0 0;" id="practiceBtn">Start practice</button>
                    </div>
                `;
            }

            function renderProgress() {
                return `
                    <div class="card stat-grid">
                        <div class="stat-item"><span>Solved</span><h3>43</h3></div>
                        <div class="stat-item"><span>Accuracy</span><h3>82%</h3></div>
                    </div>
                    <div class="card"><div class="row-space"><span>Weekly activity</span></div>
                        <div class="chart-line">
                            <div style="--h:0.6" class="bar"></div><div style="--h:0.9" class="bar"></div><div style="--h:0.4" class="bar"></div><div style="--h:0.7" class="bar"></div><div style="--h:1" class="bar"></div><div style="--h:0.5" class="bar"></div><div style="--h:0.3" class="bar"></div>
                        </div>
                    </div>
                    <div class="card"><span>🏅 Mastered topics: 4</span><div class="progress-bar-bg"><div class="progress-fill" style="width:40%"></div></div></div>
                `;
            }

            function renderSettings() {
                return `
                    <div class="card">
                        <div class="theme-switch"><span>🌓 Dark theme</span> 
                            <button class="toggle-btn" id="themeToggleBtn">${darkMode ? 'ON' : 'OFF'}</button>
                        </div>
                    </div>
                    <div class="card"><span>🔔 Notifications</span> <span style="float:right;">On</span></div>
                    <div class="card"><span>🔒 Privacy</span> <span style="float:right;"> › </span></div>
                    <div class="card"><span>📲 Version 2026.1</span></div>
                `;
            }

            // navigation active update
            function updateActiveNav(screen) {
                navItems.forEach(item => {
                    const data = item.dataset.screen;
                    if (data === screen) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                });
            }

            // attach dynamic events
            function attachScreenEvents() {
                if (currentScreen === 'onboarding') {
                    document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                        setScreen('home');
                    });
                    document.getElementById('privacyBtn')?.addEventListener('click', ()=> showModal('Privacy Policy', 'We do not collect any personal data.'));
                    document.getElementById('termsBtn')?.addEventListener('click', ()=> showModal('Terms of Service', 'Demo app. All rights reserved.'));
                }
                if (currentScreen === 'learn') {
                    document.getElementById('practiceBtn')?.addEventListener('click', ()=>{
                        alert('Starting a quick puzzle! (simulated)');
                    });
                }
                if (currentScreen === 'settings') {
                    const themeBtn = document.getElementById('themeToggleBtn');
                    if (themeBtn) {
                        themeBtn.innerText = darkMode ? 'ON' : 'OFF';
                        themeBtn.addEventListener('click', (e)=>{
                            darkMode = !darkMode;
                            document.body.classList.toggle('dark', darkMode);
                            themeBtn.innerText = darkMode ? 'ON' : 'OFF';
                            // re-render settings to show toggle state
                            if (currentScreen === 'settings') renderScreenContent('settings');
                        });
                    }
                }
                // all screens have possible modals / interactions
            }

            function showModal(title, text) {
                modalTitle.innerText = title;
                modalText.innerText = text;
                modal.classList.remove('hidden');
            }

            closeModal.addEventListener('click', ()=> modal.classList.add('hidden'));

            // bottom nav listeners
            navItems.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const screen = btn.dataset.screen;
                    setScreen(screen, true);
                });
            });

            // profile button -> settings
            profileBtn.addEventListener('click', ()=>{
                setScreen('settings');
            });

            // SHIFT + W screenshot
            window.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    captureScreenshot();
                }
            });

            function captureScreenshot() {
                // we simulate by generating a dummy png name + update counter
                const isDark = document.body.classList.contains('dark');
                const fileName = isDark ? '6.png' : `${screenshotCounter}.png`;
