```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn • Python — 2026 app</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive-icon: #94A3B8;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.03), 0 1px 2px rgba(0,0,0,0.05);
            --header-height: 64px;
            --bottom-nav-height: 72px;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive-icon: #64748B;
            --shadow-sm: 0 8px 20px rgba(0,0,0,0.5);
        }

        body {
            background: #1e1e2f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 42px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2d2d44;
            position: relative;
            transition: background-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        /* main app screen (flex column: header, content, bottom nav) */
        .app-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            background: var(--bg);
        }

        /* header */
        .header {
            height: var(--header-height);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-light);
            background: var(--card);
            flex-shrink: 0;
        }

        .header-title {
            font-weight: 650;
            font-size: 1.3rem;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .profile-icon {
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            transition: background 0.1s;
        }
        .profile-icon:hover { background: var(--border-light); }

        /* main content area – scrollable */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* bottom navigation */
        .bottom-nav {
            height: var(--bottom-nav-height);
            background: var(--card);
            border-top: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 8px;
            flex-shrink: 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            padding: 6px 0;
            border-radius: 20px;
            flex: 1;
            transition: all 0.15s ease;
            color: var(--inactive-icon);
            fill: var(--inactive-icon);
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            transform: scale(1.05);
            background: rgba(37, 99, 235, 0.08);
        }
        .nav-item.active svg {
            stroke: var(--primary);
        }
        .nav-label {
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* card styles */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: var(--shadow-sm);
        }

        .flex-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .gap-8 { gap: 8px; }
        .mt-12 { margin-top: 12px; }
        .mb-4 { margin-bottom: 4px; }
        .w-full { width: 100%; }

        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 24px;
            border-radius: 60px;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(37,99,235,0.25);
            transition: 0.1s;
            width: 100%;
        }
        .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }

        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            font-size: 0.8rem;
            color: var(--primary);
            margin: 16px 0 8px;
        }
        .link-row span { cursor: pointer; text-decoration: underline; }

        /* progress bar */
        .progress-bar-bg {
            background: var(--border-light);
            height: 8px;
            border-radius: 20px;
            overflow: hidden;
            width: 100%;
        }
        .progress-fill {
            background: var(--primary);
            width: 0%;
            height: 100%;
            transition: width 0.4s ease;
        }

        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 0.7rem;
        }

        /* modal overlay */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.15s;
        }
        .modal.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-content {
            background: var(--card);
            width: 280px;
            padding: 24px;
            border-radius: 36px;
            color: var(--text-primary);
            box-shadow: 0 30px 50px black;
        }
        .modal-close {
            float: right;
            font-weight: 700;
            font-size: 1.6rem;
            cursor: pointer;
            line-height: 1;
        }

        /* stats grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-cell {
            background: var(--bg);
            padding: 16px 8px;
            border-radius: 20px;
            text-align: center;
        }

        /* simple chart */
        .chart-row {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            height: 120px;
            margin: 20px 0 10px;
        }
        .bar {
            flex: 1;
            background: linear-gradient(to top, var(--primary), var(--accent));
            border-radius: 12px 12px 4px 4px;
            height: calc(70% * 0.7);
            transition: height 0.3s;
        }

        .icon-symbol {
            width: 42px;
            height: 42px;
            background: rgba(37,99,235,0.1);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* onboarding icon */
        .logo-big {
            width: 70px; height: 70px;
            background: var(--primary);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <div id="app" class="app-screen"></div>
</div>

<!-- hidden modal container for privacy/terms -->
<div id="genericModal" class="modal">
    <div class="modal-content">
        <span class="modal-close" id="closeModalBtn">&times;</span>
        <h3 id="modalTitle">Title</h3>
        <p id="modalBody">content</p>
    </div>
</div>

<script>
    (function() {
        // ---------- THEME TOGGLE ----------
        const setTheme = (isDark) => {
            if (isDark) document.body.classList.add('dark');
            else document.body.classList.remove('dark');
        };
        let darkMode = false;

        // ---------- ICON SYSTEM (inline SVG) ----------
        const icons = {
            home: `<svg viewBox="0 0 24 24"><path d="M5 12H3L12 3L21 12H19V20H13V14H11V20H5V12Z" stroke="currentColor" fill="none"/></svg>`,
            learn: `<svg viewBox="0 0 24 24"><path d="M12 4V20M20 12H4M4 6L20 18M4 18L20 6" stroke="currentColor" stroke-width="2"/></svg>`,
            progress: `<svg viewBox="0 0 24 24"><path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3" stroke="currentColor" fill="none"/><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><path d="M12 7V12L15 15" stroke="currentColor"/></svg>`,
            settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor" fill="none"/><path d="M19.4 15L20.8 12L19.4 9H16.7C16.3 8.1 15.7 7.2 15 6.5L16.4 3.8L13.8 2.4L11.5 4.1C10.8 3.9 10 3.8 9.2 3.8C8.4 3.8 7.6 3.9 6.9 4.1L4.6 2.4L2 3.8L3.4 6.5C2.7 7.2 2.1 8.1 1.8 9H0L0 12L1.8 12C2.1 12.9 2.7 13.8 3.4 14.5L2 17.2L4.6 18.6L6.9 16.9C7.6 17.1 8.4 17.2 9.2 17.2C10 17.2 10.8 17.1 11.5 16.9L13.8 18.6L16.4 17.2L15 14.5C15.7 13.8 16.3 12.9 16.6 12H19.4V15Z" stroke="currentColor" fill="none"/></svg>`,
            profile: `<svg viewBox="0 0 24 24"><path d="M5 20V19C5 15.6863 7.68629 13 11 13H13C16.3137 13 19 15.6863 19 19V20" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2" fill="none"/></svg>`,
            lesson: `<svg viewBox="0 0 24 24"><path d="M4 4H20V20H4V4Z" stroke="currentColor" fill="none"/><path d="M8 8H16V10H8V8Z M8 12H14V14H8V12Z" stroke="currentColor"/></svg>`,
            chart: `<svg viewBox="0 0 24 24"><path d="M21 16V20H3V4H7V16H11V8H15V16H18V4H21V16Z" stroke="currentColor" fill="none"/></svg>`,
            flashcards: `<svg viewBox="0 0 24 24"><path d="M4 6H18V20H4V6Z" stroke="currentColor" fill="none"/><path d="M8 4H20V18H8V4Z" stroke="currentColor" fill="none"/></svg>`,
            play: `<svg viewBox="0 0 24 24"><path d="M8 5V19L19 12L8 5Z" stroke="currentColor" fill="none"/></svg>`,
            check: `<svg viewBox="0 0 24 24"><path d="M5 12L10 17L19 8" stroke="currentColor" stroke-width="3" fill="none"/></svg>`,
        };

        // screens data
        let currentScreen = 'onboarding';

        // modal
        const modal = document.getElementById('genericModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const closeBtn = document.getElementById('closeModalBtn');
        closeBtn.onclick = () => modal.classList.remove('active');
        window.onclick = (e) => { if (e.target === modal) modal.classList.remove('active'); };

        function showModal(title, text) {
            modalTitle.innerText = title;
            modalBody.innerText = text;
            modal.classList.add('active');
        }

        // navigation
        function goToScreen(screenId) {
            currentScreen = screenId;
            renderApp();
        }

        // profile click opens settings (profile)
        function handleProfile() {
            goToScreen('settings');
        }

        // dark mode toggle inside settings
        function toggleDarkMode() {
            darkMode = !darkMode;
            setTheme(darkMode);
            renderApp(); // re-render settings reflects toggle
        }

        // small interactive updates
        function startPractice() {
            alert('Starting practice session (simulated)');
        }

        // render content based on screen
        function renderScreen() {
            const contentDiv = document.createElement('div');
            contentDiv.className = 'content';

            if (currentScreen === 'onboarding') {
                contentDiv.innerHTML = `
                    <div style="display: flex; flex-direction: column; align-items: center; text-align: center; padding: 30px 0;">
                        <div class="logo-big">${icons.lesson.replace('currentColor', 'white')}</div>
                        <h1 style="font-size: 2.2rem; font-weight:700; color: var(--primary);">Python</h1>
                        <p style="font-size: 1.2rem; font-weight: 500; margin: 4px 0; color: var(--text-primary);">learn by doing</p>
                        <p style="color: var(--text-secondary); margin: 16px 0 28px;">Interactive Python challenges, real‑time feedback, and daily coding streaks.</p>
                        <button class="btn-primary" onclick="goToScreen('home')">Get Started</button>
                        <div class="link-row">
                            <span onclick="showModal('Privacy Policy','We value your privacy. No data is shared with third parties.')">Privacy Policy</span>
                            <span onclick="showModal('Terms of Service','Educational use only. Content provided under free license.')">Terms of Service</span>
                        </div>
                    </div>
                `;
            } else {
                // header is outside, just content
                let inner = '';
                if (currentScreen === 'home') {
                    inner = `
                        <div class="card">
                            <div class="flex-row" style="justify-content: space-between;"><span style="font-weight:600;">Daily streak</span> <span class="badge">5 days 🔥</span></div>
                            <div class="progress-bar-bg mt-12"><div class="progress-fill" style="width:71%"></div></div>
                            <div style="display:flex; gap:8px; margin-top: 18px;">
                                <div class="icon-symbol">${icons.lesson}</div><div><strong>Next lesson:</strong> loops & lists</div>
                            </div>
                        </div>
                        <div class="card">
                            <h3 style="margin-bottom:12px;">continue learning</h3>
                            ${['Functions','Dictionaries','Classes'].map(t => `<div style="display:flex; align-items:center; justify-content:space-between; padding:8px 0;"><span>📘 ${t}</span> <span style="color:var(--primary);">75%</span></div>`).join('')}
                        </div>
                        <div class="card flex-row" style="justify-content:space-around;">
                            <div style="text-align:center;">${icons.flashcards}<br> <span>flashcards</span></div>
                            <div style="text-align:center;">${icons.play}<br> <span>practice</span></div>
                            <div style="text-align:center;">${icons.chart}<br> <span>stats</span></div>
                        </div>
                    `;
                } else if (currentScreen === 'learn') {
                    inner = `
                        <div class="card"><h3>Python fundamentals</h3>
                            <div class="flex-row"><span>1. Variables</span> ${icons.check}</div>
                            <div class="flex-row"><span>2. Conditionals</span> ${icons.check}</div>
                            <div class="flex-row"><span>3. Loops</span> <span class="badge">active</span></div>
                            <div class="flex-row"><span>4. Functions</span> <span style="color:var(--inactive-icon);">lock</span></div>
                        </div>
                        <div class="card"><span class="badge">new</span>  <strong>Quick lesson: list comprehensions</strong> <button class="btn-primary" style="margin-top:10px;" onclick="startPractice()">start</button> </div>
                    `;
                } else if (currentScreen === 'progress') {
                    inner = `
                        <div class="stats-grid">
                            <div class="stat-cell"><span style="font-size:1.8rem;">43</span><br>lessons done</div>
                            <div class="stat-cell"><span style="font-size:1.8rem;">7</span><br>streak</div>
                        </div>
                        <div class="card"><h4>weekly activity</h4><div class="chart-row"><div class="bar" style="height:50px;"></div><div class="bar" style="height:80px;"></div><div class="bar" style="height:65px;"></div><div class="bar" style="height:90px;"></div><div class="bar" style="height:40px;"></div></div></div>
                        <div class="card">🏅 achievements: 4 badges</div>
                    `;
                } else if (currentScreen === 'settings') {
                    inner = `
                        <div class="card">
                            <div style="display:flex; gap:16px; align-items:center;"><div class="icon-symbol">${icons.profile}</div> <span><strong>alex coder</strong><br>alex@example.com</span></div>
                        </div>
                        <div class="card">
                            <div class="flex-row" style="justify-content: space-between;"><span>🌙 Dark mode</span> <label><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''} onchange="toggleDarkMode()"></label></div>
                            <div class="flex-row" style="margin-top:16px;">🔔 Notifications</div>
                            <div class="flex-row">🌐 Language</div>
                        </div>
                        <div class="card" style="text-align:center;">
                            <span onclick="showModal('About','Python learning app · version 2026.1')">about</span> • <span onclick="showModal('Privacy','short privacy')">privacy</span>
                        </div>
                    `;
                    setTimeout(() => {
                        const cb = document.getElementById('darkToggle');
                        if(cb) cb.onchange = toggleDarkMode;
                    }, 50);
                }
                contentDiv.innerHTML = inner;
            }
            return contentDiv;
        }

        // main render
        function renderApp() {
            const container = document.getElementById('app');
            const headerTitleMap = {
                'onboarding': 'Welcome',
                'home': 'Home',
                'learn': 'Learn',
                'progress': 'Progress',
                'settings': 'Settings'
            };
            const header = document.createElement('div');
            header.className = 'header';
            header.innerHTML = `<span class="header-title">${headerTitleMap[currentScreen]}</span>
                <div class="profile-icon" onclick="handleProfile()">${icons.profile}</div>`;

            const bottomNav = document.createElement('div');
            bottomNav.className = 'bottom-nav';
            const tabs = [
                { id: 'home', icon: icons.home, label: 'Home' },
                { id: 'learn', icon: icons.learn, label: 'Learn' },
                { id: 'progress', icon: icons.progress, label: 'Progress' },
                { id: 'settings', icon: icons.settings, label: 'Settings' }
            ];
            tabs.forEach(tab => {
                const activeClass = currentScreen === tab.id ? 'active' : '';
                const item = document.createElement('div');
                item.className = `nav-item ${activeClass}`;
                item.setAttribute('data-screen', tab.id);
                item.innerHTML = `${tab.icon} <span class="nav-label">${tab.label}</span>`;
                item.onclick = (e) => { e.stopPropagation(); goToScreen(tab.id); };
                bottomNav.appendChild(item);
            });

            const screenContent = renderScreen();

            container.innerHTML = '';
            container.appendChild(header);
            container.appendChild(screenContent);
            container.appendChild(bottomNav);
        }

        // capture screenshot (shift + w)
        document.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
                    html2canvas(phone, { scale: 2, backgroundColor: null }).then(canvas => {
                        const link = document.createElement('a');
                        let filename = darkMode ? '6.png' : `${Math.min(5, Math.floor(Math.random()*5)+1)}.png`;
                        // sequential naming based on screen (just mock)
                        const map = { onboarding:1, home:2, learn:3, progress:4, settings:5 };
                        let idx = map[currentScreen] || 1;
                        if (darkMode) idx = 6;
                        link.download = idx + '.png';
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    });
                }).catch(() => alert('html2canvas not loaded, but shift+w works.'));
            }
        });

        window.goToScreen = goToScreen;
        window.handleProfile = handleProfile;
        window.toggleDarkMode = toggleDarkMode;
        window.showModal = showModal;
        window.startPractice = startPractice;

        // initial render
        setTheme(false);
        renderApp();
    })();
</script>

</body>
</html>
```
