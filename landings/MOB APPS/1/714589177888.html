<!DOCTYPE html>

  <style>

    body.dark {
      --bg-primary: #0F172A;

      --border-light: #334155;
      --primary: #3B82F6;

      --accent: #38BDF8;
      --inactive-icon: #64748B;

    }
    /* main flex column */
    .app {
      display: flex;
      flex-direction: column;

      position: relative;
    }
    /* header */
    .header {
      display: flex;
      justify-content: space-between;

    }
    .header h1 {

    .screen-content {
      flex: 1;

      fill: none;

    button {
      background: var(--primary);

    }

    .modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;

    }

    .hidden { display: none !important; }

    .chart-line {

    .lesson-item {

      transition: 0.1s;
    }
    .dark .toggle-knob { left: 22px; background: #1E293B; }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <div class="app" id="app">
    <!-- dynamic header -->
    <div class="header" id="appHeader">
      <h1 id="headerTitle">Onboarding</h1>
      <div class="profile-icon" id="profileBtn"> <!-- user icon -->
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
    </div>

    <!-- main screen container (views) -->
    <div id="screenContainer" class="screen-content"></div>

    <!-- bottom nav (hidden on onboarding) -->
    <div class="bottom-nav" id="bottomNav">
      <div class="nav-item" data-nav="home"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z"/></svg><span class="nav-label">Home</span></div>
      <div class="nav-item" data-nav="learn"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M2 3H8C10.2091 3 12 4.79086 12 7V21C12 19.8954 11.1046 19 10 19H2V3Z"/><path d="M22 3H16C13.7909 3 12 4.79086 12 7V21C12 19.8954 12.8954 19 14 19H22V3Z"/></svg><span class="nav-label">Learn</span></div>
      <div class="nav-item" data-nav="progress"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 12V18C21 19.1046 20.1046 20 19 20H5C3.89543 20 3 19.1046 3 18V6C3 4.89543 3.89543 4 5 4H12"/><path d="M15 9L21 3"/><path d="M15 3H21V9"/></svg><span class="nav-label">Progress</span></div>
      <div class="nav-item" data-nav="settings"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15C19 15.6 18.7 16.3 18.2 16.8L19.5 18.1L18.1 19.5L16.8 18.2C16.3 18.7 15.6 19 15 19.4V21.5H9V19.4C8.4 19 7.7 18.7 7.2 18.2L5.9 19.5L4.5 18.1L5.8 16.8C5.3 16.3 5 15.6 4.6 15H2.5V9H4.6C5 8.4 5.3 7.7 5.8 7.2L4.5 5.9L5.9 4.5L7.2 5.8C7.7 5.3 8.4 5 9 4.6V2.5H15V4.6C15.6 5 16.3 5.3 16.8 5.8L18.1 4.5L19.5 5.9L18.2 7.2C18.7 7.7 19 8.4 19.4 9H21.5V15H19.4Z"/></svg><span class="nav-label">Settings</span></div>
    </div>
  </div>
  <!-- modal placeholder -->
  <div id="modalLayer" class="modal hidden"></div>
</div>

<script>
  (function() {
    // ---- THEME & STATE ----
    const body = document.body;
    let darkMode = false;       // light default
    let currentScreen = 'onboarding'; // home | learn | progress | settings | profile (via header)
    const screenContainer = document.getElementById('screenContainer');
    const bottomNav = document.getElementById('bottomNav');
    const headerTitle = document.getElementById('headerTitle');
    const profileBtn = document.getElementById('profileBtn');
    const modalLayer = document.getElementById('modalLayer');
    let screenshotCounter = 0;

    // ---- icon set (inline reusable, but we use inline in html already) ----

    // ---- screen definitions ----
    function renderScreen() {
      if (currentScreen === 'onboarding') {
        bottomNav.classList.add('hidden');
        headerTitle.innerText = 'Brain Logic';
        screenContainer.innerHTML = onBoardingHTML();
      } else {
        bottomNav.classList.remove('hidden');
        // update header per screen
        if (currentScreen === 'home') headerTitle.innerText = 'Dashboard';
        else if (currentScreen === 'learn') headerTitle.innerText = 'Train';
        else if (currentScreen === 'progress') headerTitle.innerText = 'Statistics';
        else if (currentScreen === 'settings') headerTitle.innerText = 'Settings';
        else if (currentScreen === 'profile') headerTitle.innerText = 'Profile';

        if (currentScreen === 'home') screenContainer.innerHTML = homeHTML();
        else if (currentScreen === 'learn') screenContainer.innerHTML = learnHTML();
        else if (currentScreen === 'progress') screenContainer.innerHTML = progressHTML();
        else if (currentScreen === 'settings') screenContainer.innerHTML = settingsHTML();
        else if (currentScreen === 'profile') screenContainer.innerHTML = profileHTML();

        // set active tab
        document.querySelectorAll('.nav-item').forEach(el => {
          const nav = el.dataset.nav;
          if (nav === currentScreen) el.classList.add('active');
          else el.classList.remove('active');
        });
      }
    }

    // ---- onboarding ----
    function onBoardingHTML() {
      return `
        <div class="card" style="text-align: center; margin-top: 30px;">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" style="margin: 20px auto;"><path d="M12 2L2 7L12 12L22 7L12 2Z"/><path d="M2 17L12 22L22 17"/><path d="M2 12L12 17L22 12"/></svg>
          <h2 style="font-size: 34px; font-weight:700; color: var(--primary);">logic<span style="color:var(--text-primary)">.</span></h2>
          <p style="font-size: 18px; margin: 10px 0 8px;"><strong>train your brain</strong></p>
          <p style="color: var(--text-secondary); margin-bottom: 32px;">Solve puzzles, improve IQ. Daily logic workouts.</p>
          <button id="getStartedBtn">Get Started →</button>
          <div class="link-row">
            <span id="privacyLink">Privacy</span>
            <span id="termsLink">Terms</span>
          </div>
        </div>
      `;
    }

    // ---- Home ----
    function homeHTML() {
      return `
        <div class="card flex-row" style="justify-content: space-between;">
          <div><span class="badge">🔥 streak 12</span><p style="margin-top:8px;">keep going!</p></div>
          <svg class="icon-small" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 20v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/></svg>
        </div>
        <div class="card">
          <div class="flex-row" style="justify-content: space-between;"><h3>daily puzzle</h3><svg width="24" height="24" viewBox="0 0 24 24" stroke="var(--primary)"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="10"/></svg></div>
          <div style="background: var(--bg-primary); border-radius: 20px; padding:12px; margin-top:8px;"><p>✨ Tower of Hanoi · 3 discs</p><button style="padding:8px; margin-top:10px;" id="startPracticeBtn">start practice</button></div>
        </div>
        <div class="grid-2">
          <div class="stat-card"><span style="color:var(--text-secondary)">IQ points</span><h2>128</h2><span>↑12</span></div>
          <div class="stat-card"><span style="color:var(--text-secondary)">puzzles</span><h2>143</h2><span>solved</span></div>
        </div>
        <div class="card"><h4>recommended</h4><div class="lesson-item"><svg width="24" height="24" viewBox="0 0 24 24" stroke="var(--primary)"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg><div><p>Pattern recognition</p><span class="badge">5 min</span></div></div></div>
      `;
    }
    // ---- Learn ----
    function learnHTML() {
      return `
        <div class="card"><h3>Logic modules</h3>
          <div class="lesson-item"><svg width="28" height="28" viewBox="0 0 24 24" stroke="var(--primary)"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><div><p>Deduction 101</p><div class="progress-bar" style="width:120px;"><div class="progress-fill" style="width:45%"></div></div></div></div>
          <div class="lesson-item"><svg width="28" height="28" viewBox="0 0 24 24" stroke="var(--primary)"><path d="M2 12h20"/><path d="M12 2v20"/></svg><div><p>Lateral thinking</p><div class="progress-bar" style="width:120px;"><div class="progress-fill" style="width:70%"></div></div></div></div>
          <div class="lesson-item"><svg width="28" height="28" viewBox="0 0 24 24" stroke="var(--primary)"><polygon points="12 2 22 7 22 17 12 22 2 17 2 7 12 2"/></svg><div><p>Math riddles</p><div class="progress-bar" style="width:120px;"><div class="progress-fill" style="width:20%"></div></div></div></div>
        </div>
        <button id="startPracticeBtn2" style="margin-bottom:16px;">train a random puzzle</button>
      `;
    }
    // ---- Progress ----
    function progressHTML() {
      return `
        <div class="card"><h3>Weekly activity</h3><div class="chart-line"><div class="bar" style="height:28px;"></div><div class="bar" style="height:42px;"></div><div class="bar" style="height:36px;"></div><div class="bar" style="height:58px;"></div><div class="bar" style="height:44px;"></div></div></div>
        <div class="card"><h4>accuracy</h4><div class="flex-row"><span>84%</span><div class="progress-bar" style="flex:1"><div class="progress-fill" style="width:84%"></div></div></div></div>
        <div class="grid-2"><div class="stat-card"><span>🏆 gold</span><h2>8</h2></div><div class="stat-card"><span>⚡ streak</span><h2>12</h2></div></div>
      `;
    }
    // ---- Settings ----
    function settingsHTML() {
      let toggleKnobClass = darkMode ? 'toggle-knob dark' : 'toggle-knob';
      return `
        <div class="card">
          <div class="flex-row" style="justify-content: space-between;"><span>Dark mode</span><div class="toggle-switch" id="themeToggle"><div class="${toggleKnobClass}"></div></div></div>
        </div>
        <div class="card"><p>Sound effects · on</p><p>Notifications · on</p></div>
      `;
    }
    // ---- Profile ----
    function profileHTML() {
      return `<div class="card"><div style="text-align:center"><svg width="60" height="60" viewBox="0 0 24 24" stroke="var(--primary)" stroke-width="1.5"><circle cx="12" cy="8" r="5"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/></svg><h2>Alex Chen</h2><p>joined 3 months</p></div></div>
      <div class="card"><h4>achievements</h4><div class="flex-row">🧩 <span>30 puzzles</span></div></div>`;
    }

    // ---- navigation & modals ----
    function navigate(screen) {
      if (screen === 'profile') { currentScreen = 'profile'; renderScreen(); return; }
      currentScreen = screen;
      renderScreen();
    }

    function showModal(title, content) {
      modalLayer.innerHTML = `<div class="modal-card"><h3>${title}</h3><p>${content}</p><div class="close-modal" id="closeModalBtn">close</div></div>`;
      modalLayer.classList.remove('hidden');
      document.getElementById('closeModalBtn').addEventListener('click', ()=> modalLayer.classList.add('hidden'));
    }

    // ---- event listeners (global) ----
    document.addEventListener('click', (e) => {
      const target = e.target;
      // onboarding get started
      if (target.id === 'getStartedBtn') { navigate('home'); }
      // bottom nav
      if (target.closest('.nav-item')) {
        const nav = target.closest('.nav-item').dataset.nav;
        if (nav) navigate(nav);
      }
      // profile button
      if (target.closest('#profileBtn')) { navigate('profile'); }
      // privacy & terms
      if (target.id === 'privacyLink') showModal('Privacy', 'We protect your logic. No data sharing.');
      if (target.id === 'termsLink') showModal('Terms', 'Free to use. Play Store terms apply.');
      // practice buttons
      if (target.id === 'startPracticeBtn' || target.id === 'startPracticeBtn2') { alert('puzzle started! (simulated)'); }
      // theme toggle inside settings
      if (target.closest('#themeToggle')) {
        darkMode = !darkMode;
        if (darkMode) body.classList.add('dark'); else body.classList.remove('dark');
        if (currentScreen === 'settings') renderScreen(); else { /* keep but refresh later? optional */ }
      }
    });

    // ---- screenshot SHIFT+W ----
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const phone = document.getElementById('phoneContainer');
        // simplistic: increment name based on dark mode + order
        screenshotCounter++;
        let filename = darkMode ? '6.png' : (screenshotCounter <=5 ? screenshotCounter+'.png' : '6.png');
        // In real prototype we can't save, but we can simulate by console + JSON output will reflect.
        console.log(`📸 screenshot saved as ${filename} (simulated capture)`);
        alert(`Screenshot ${filename} captured (demo).`);
      }
    });

    // ---- manual init ----
    renderScreen();

    // ---- expose for sequential screenshot text, but we output json at the end of page. ----
  })();
</script>
</body>
</html>

}
