<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Brain Trainer • prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* CSS variables – light mode default */
        :root {
            --bg-page: #F1F5F9;
            --bg-phone: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --text-muted: #64748B;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --border-light: #E2E8F0;
            --icon-inactive: #94A3B8;
            --icon-active: #2563EB;
            --tab-highlight: rgba(37, 99, 235, 0.08);
            --progress-bg: #E2E8F0;
            --progress-fill: #2563EB;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
        }

        body.dark {
            --bg-page: #0A0F1C;
            --bg-phone: #0F172A;
            --card-bg: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --text-muted: #94A3B8;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --border-light: #334155;
            --icon-inactive: #64748B;
            --icon-active: #3B82F6;
            --tab-highlight: rgba(59, 130, 246, 0.15);
            --progress-bg: #334155;
            --progress-fill: #3B82F6;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
        }

        body {
            background: var(--bg-page);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg-phone);
            border-radius: 48px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-light);
        }

        /* app wrapper – scrollable content */
        .app-screen {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 8px 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--icon-inactive) transparent;
            display: flex;
            flex-direction: column;
        }
        .app-screen::-webkit-scrollbar { width: 4px; }
        .app-screen::-webkit-scrollbar-thumb { background: var(--icon-inactive); border-radius: 20px; }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 4px 0;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }
        .profile-icon {
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            transition: background 0.2s;
        }
        .profile-icon:hover { background: var(--tab-highlight); }

        /* screen content */
        .screen-content {
            flex: 1;
        }

        /* cards */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            border: 1px solid var(--border-light);
        }
        .lesson-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
        }
        .lesson-row:last-child { border-bottom: none; }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
        }
        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 40px;
            margin: 8px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--progress-fill);
            width: 0%;
            border-radius: 40px;
            transition: width 0.3s ease;
        }

        /* bottom nav */
        .bottom-nav {
            background: var(--card-bg);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 8px 10px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            flex: 1;
            padding: 6px 0;
            border-radius: 20px;
            transition: all 0.15s ease;
            color: var(--icon-inactive);
            fill: var(--icon-inactive);
        }
        .nav-item.active {
            color: var(--icon-active);
            fill: var(--icon-active);
            background: var(--tab-highlight);
            transform: scale(1.05);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2px;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* onboarding */
        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 30px 0 20px;
        }
        .app-logo {
            background: linear-gradient(145deg, var(--primary), var(--accent));
            width: 70px;
            height: 70px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .big-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 60px;
            margin: 24px 0 16px;
            cursor: pointer;
            box-shadow: 0 8px 14px -6px var(--primary-dark);
        }
        .legal-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 14px;
            color: var(--text-muted);
            text-decoration: underline;
            cursor: pointer;
        }

        /* modal */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: var(--card-bg);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            text-align: center;
            color: var(--text-primary);
        }

        /* hidden utility */
        .hidden { display: none !important; }
        button { background: none; border: none; }
        .mt-2 { margin-top: 8px; }
        .mt-4 { margin-top: 16px; }
        .flex { display: flex; gap: 12px; align-items: center; }
    </style>
</head>
