```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashLearn • vocabulary builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #1e2b3c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 16px;
        }
        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive-icon: #94A3B8;
            --tab-highlight: rgba(37, 99, 235, 0.08);
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
        }
        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --accent: #38BDF8;
            --inactive-icon: #64748B;
            --tab-highlight: rgba(59, 130, 246, 0.15);
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }
        .phone-mock {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.3), 0 0 0 10px #2d3e55;
            position: relative;
            transition: background 0.2s;
            display: flex;
            flex-direction: column;
        }
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            padding-bottom: 8px;
            background: var(--bg);
        }
        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px 8px;
            background: var(--bg);
        }
        .header h1 {
            font-size: 22px;
            font-weight: 650;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-profile {
            width: 28px;
            height: 28px;
            stroke: var(--text-primary);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        /* bottom nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 14px;
            background: var(--card);
            border-top: 1px solid var(--border-light);
            box-shadow: var(--shadow);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            gap: 4px;
            transition: transform 0.15s ease;
            padding: 6px 14px;
            border-radius: 30px;
        }
        .nav-item.active {
            background: var(--tab-highlight);
            transform: scale(1.02);
        }
        .nav-item.active .nav-icon {
            stroke: var(--primary);
            transform: scale(1.15);
        }
        .nav-item.active .nav-label {
            color: var(--primary);
            font-weight: 600;
        }
        .nav-icon {
            width: 24px;
            height: 24px;
            stroke: var(--inactive-icon);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.1s, transform 0.1s;
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--inactive-icon);
        }
        .content {
            flex: 1;
            padding: 8px 16px 0;
            overflow-y: auto;
        }
        /* cards & UI */
        .card {
            background: var(--card);
            border-radius: 22px;
            padding: 18px 16px;
            margin-bottom: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }
        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 40px;
            padding: 14px 24px;
            font-weight: 600;
            font-size: 18px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--primary-dark);
            transition: 0.05s linear;
            margin: 16px 0;
        }
        .btn-primary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--primary-dark);
        }
        .small-link {
            color: var(--text-secondary);
            text-decoration: underline;
            font-size: 13px;
            margin: 0 8px;
            cursor: pointer;
        }
        .progress-bar {
            height: 8px;
            background: var(--border-light);
            border-radius: 20px;
            margin: 12px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 20px;
            transition: width 0.3s;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-cell {
            background: var(--bg);
            border-radius: 18px;
            padding: 14px;
        }
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .icon-small {
            width: 36px;
            height: 36px;
            stroke: var(--primary);
            stroke-width: 2;
        }
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card);
            padding: 28px 24px;
            border-radius: 32px;
            width: 280px;
            color: var(--text-primary);
        }
        .close-modal {
            float: right;
            font-size: 24px;
            cursor: pointer;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="phone-mock" id="phoneContainer">
    <!-- header injected via js -->
    <div id="appContent" class="app-screen"></div>
    <!-- bottom nav -->
    <div class="bottom-nav" id="bottomNav">
        <button class="nav-item" data-tab="home"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 Z"/></svg><span class="nav-label">Home</span></button>
        <button class="nav-item" data-tab="learn"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M2 4 L12 2 L22 4 L22 18 L12 20 L2 18 Z"/><path d="M12 2 L12 20"/><path d="M8 6 L8 14"/><path d="M16 6 L16 14"/></svg><span class="nav-label">Learn</span></button>
        <button class="nav-item" data-tab="progress"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 12 L18 12 L18 20"/><path d="M15 8 L12 8 L12 20"/><path d="M9 4 L6 4 L6 20"/><path d="M3 20 L21 20"/></svg><span class="nav-label">Progress</span></button>
        <button class="nav-item" data-tab="settings"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15 L20.8 12 L19.4 9 L17 8 L17 5 L14 4 L12 5 L10 4 L7 5 L7 8 L4.6 9 L3.2 12 L4.6 15 L7 16 L7 19 L10 20 L12 19 L14 20 L17 19 L17 16 Z"/></svg><span class="nav-label">Settings</span></button>
    </div>
</div>

<!-- modal container -->
<div id="modalContainer" class="hidden"></div>

<script>
    (function() {
        // ----- theme & icons -----
        const theme = { dark: false };
        function toggleTheme() {
            document.body.classList.toggle('dark');
            theme.dark = document.body.classList.contains('dark');
            renderCurrentScreen();
        }

        // icon generator
        function getIcon(name, className = 'icon-small') {
            const icons = {
                profile: `<svg class="${className}" viewBox="0 0 24 24"><path d="M4 21 C4 17 8 15 12 15 C16 15 20 17 20 21" stroke="currentColor" fill="none"/><circle cx="12" cy="8" r="4" stroke="currentColor" fill="none"/></svg>`,
                lesson: `<svg class="${className}" viewBox="0 0 24 24"><path d="M4 6 L20 6 M4 12 L20 12 M4 18 L14 18" stroke="currentColor"/></svg>`,
                chart: `<svg class="${className}" viewBox="0 0 24 24"><path d="M3 17 L7 13 L11 17 L17 10 L21 14" stroke="currentColor" fill="none"/></svg>`,
                flashcards: `<svg class="${className}" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor"/><path d="M9 8 L15 8 M9 12 L15 12 M9 16 L13 16" stroke="currentColor"/></svg>`,
                play: `<svg class="${className}" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor"/><polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/></svg>`,
                check: `<svg class="${className}" viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6" stroke="currentColor"/></svg>`,
            };
            return icons[name] || `<svg class="${className}" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke="currentColor"/></svg>`;
        }

        // ----- state -----
        let currentScreen = 'onboarding'; // home | learn | progress | settings | onboarding
        const navItems = document.querySelectorAll('.nav-item');
        const contentDiv = document.getElementById('appContent');
        const modalDiv = document.getElementById('modalContainer');

        function setActiveTab(screen) {
            navItems.forEach(item => {
                const tab = item.dataset.tab;
                if (screen === tab) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        // header partial
        function renderHeader(title) {
            return `
                <div class="header">
                    <h1>${title}</h1>
                    <button class="profile-btn" id="profileBtn">${getIcon('profile', 'icon-profile')}</button>
                </div>
            `;
        }

        // onboarding screen
        function onBoardingScreen() {
            return `
                ${renderHeader('FlashLearn')}
                <div class="content">
                    <div style="text-align: center; margin: 30px 0 10px;">
                        <div style="background: var(--primary); width: 80px; height: 80px; border-radius: 30px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;">
                            <svg width="44" height="44" viewBox="0 0 24 24" stroke="white" stroke-width="2"><path d="M5 5 L12 2 L19 5 L19 15 L12 18 L5 15 Z"/><path d="M12 7 L12 12"/><path d="M8 9 L8 12"/><path d="M16 9 L16 12"/></svg>
                        </div>
                        <h2 style="color: var(--text-primary); font-size: 28px;">FlashLearn</h2>
                        <p style="color: var(--text-secondary); margin: 8px 0;">English vocabulary builder</p>
                        <p style="color: var(--text-secondary); font-size: 15px; margin-top: 16px;">Master words daily with smart flashcards. Bite-sized lessons, adaptive repetition.</p>
                    </div>
                    <button class="btn-primary" id="getStartedBtn">Get Started</button>
                    <div style="display: flex; justify-content: center; gap: 16px; margin: 16px 0 24px;">
                        <span class="small-link" id="privacyLink">Privacy Policy</span>
                        <span class="small-link" id="termsLink">Terms of Service</span>
                    </div>
                </div>
            `;
        }

        // home dashboard
        function homeScreen() {
            return `
                ${renderHeader('Home')}
                <div class="content">
                    <div class="card">
                        <div class="flex-row"><span style="font-weight:600;">🔥 7 day streak</span> <span class="badge">+120 XP</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
                        <p style="margin-top:8px;">Daily goal: 70%</p>
                    </div>
                    <div class="card">
                        <h3 style="margin-bottom:12px;">Continue lesson</h3>
                        <div class="lesson-item">
                            ${getIcon('flashcards')}
                            <div><strong>Phrasal verbs</strong><br>8 min left</div>
                        </div>
                        <button class="btn-primary" style="padding:10px;" id="continueLearn">Continue</button>
                    </div>
                    <div class="stat-grid">
                        <div class="stat-cell">${getIcon('chart')}<br><span style="font-size:24px;">350</span> words</div>
                        <div class="stat-cell">${getIcon('check')}<br><span style="font-size:24px;">12</span> sessions</div>
                    </div>
                </div>
            `;
        }

        // learning / practice
        function learnScreen() {
            return `
                ${renderHeader('Learn')}
                <div class="content">
                    <div class="card" style="background: var(--accent); color:#0F172A;">
                        <div style="display:flex; align-items:center;">${getIcon('play')} <span style="font-weight:600;margin-left:10px;">Daily practice: 20 cards</span></div>
                        <div class="progress-bar" style="background:#a0c4ff;"><div class="progress-fill" style="width:35%"></div></div>
                        <button class="btn-primary" style="background: #1E293B; box-shadow:0 4px 0 #0F172A; margin-top:12px;" id="practiceNow">Start practice</button>
                    </div>
                    <h3 style="margin:8px 0;">Lessons</h3>
                    <div class="lesson-item">${getIcon('flashcards')}<div><strong>Business English</strong><br>12 words</div></div>
                    <div class="lesson-item">${getIcon('flashcards')}<div><strong>Idioms in use</strong><br>8 words</div></div>
                    <div class="lesson-item">${getIcon('flashcards')}<div><strong>Academic word list</strong><br>15 words</div></div>
                </div>
            `;
        }

        // progress / statistics
        function progressScreen() {
            return `
                ${renderHeader('Progress')}
                <div class="content">
                    <div class="card"><div style="display:flex; justify-content:space-around;">${getIcon('chart')}<span>Mastered: 128</span><span>Left: 72</span></div></div>
                    <div class="card">
                        <div style="display:flex; gap:20px;"><span>🔥 Week</span> <span>📊 Month</span></div>
                        <div style="height:100px; display:flex; align-items:end; gap:6px; margin:20px 0;">
                            <div style="background:var(--primary); width:20px; height:40px; border-radius:10px;"></div>
                            <div style="background:var(--primary); width:20px; height:70px;"></div>
                            <div style="background:var(--primary); width:20px; height:50px;"></div>
                            <div style="background:var(--primary); width:20px; height:90px;"></div>
                            <div style="background:var(--primary); width:20px; height:60px;"></div>
                        </div>
                    </div>
                    <div class="badge" style="margin:8px;">🏅 5 day streak</div>
                </div>
            `;
        }

        // settings / profile
        function settingsScreen() {
            const isDark = document.body.classList.contains('dark');
            return `
                ${renderHeader('Settings')}
                <div class="content">
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span>Dark mode</span>
                            <button id="themeToggleBtn" style="background:var(--primary); color:white; border:none; padding:6px 20px; border-radius:30px;">${isDark ? 'Light' : 'Dark'}</button>
                        </div>
                    </div>
                    <div class="card">
                        <p>Profile: Alex</p>
                        <p>Member since 2026</p>
                    </div>
                </div>
            `;
        }

        function showModal(title, text) {
            modalDiv.innerHTML = `
                <div class="modal">
                    <div class="modal-content">
                        <span class="close-modal" id="closeModal">&times;</span>
                        <h3>${title}</h3>
                        <p>${text}</p>
                    </div>
                </div>
            `;
            modalDiv.classList.remove('hidden');
            document.getElementById('closeModal').addEventListener('click', ()=>{
                modalDiv.classList.add('hidden');
            });
        }

        function renderCurrentScreen() {
            let html = '';
            switch (currentScreen) {
                case 'onboarding': html = onBoardingScreen(); setActiveTab(''); break;
                case 'home': html = homeScreen(); setActiveTab('home'); break;
                case 'learn': html = learnScreen(); setActiveTab('learn'); break;
                case 'progress': html = progressScreen(); setActiveTab('progress'); break;
                case 'settings': html = settingsScreen(); setActiveTab('settings'); break;
                default: html = onBoardingScreen(); currentScreen='onboarding';
            }
            contentDiv.innerHTML = html;

            // event listeners
            if (currentScreen === 'onboarding') {
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                    currentScreen = 'home';
                    renderCurrentScreen();
                });
                document.getElementById('privacyLink')?.addEventListener('click', ()=>showModal('Privacy Policy','We value your privacy. No data shared.'));
                document.getElementById('termsLink')?.addEventListener('click', ()=>showModal('Terms of Service','Use FlashLearn for personal learning only.'));
            }
            if (currentScreen === 'home') {
                document.getElementById('continueLearn')?.addEventListener('click', ()=>{
                    currentScreen = 'learn';
                    renderCurrentScreen();
                });
            }
            if (currentScreen === 'learn') {
                document.getElementById('practiceNow')?.addEventListener('click', ()=>{
                    alert('practice session started (simulated)');
                });
            }
            if (currentScreen === 'settings') {
                document.getElementById('themeToggleBtn')?.addEventListener('click', (e)=>{
                    toggleTheme();
                    renderCurrentScreen(); // refresh to show correct button text
                });
            }

            // profile button always opens settings
            document.getElementById('profileBtn')?.addEventListener('click', ()=>{
                currentScreen = 'settings';
                renderCurrentScreen();
            });
        }

        // bottom navigation
        navItems.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const tab = e.currentTarget.dataset.tab;
                if (tab === 'home' || tab === 'learn' || tab === 'progress' || tab === 'settings') {
                    currentScreen = tab;
                    renderCurrentScreen();
                }
            });
        });

        // init onboarding
        renderCurrentScreen();

        // --- screenshot helper ---
        let screenshotCounter = 1;
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm').then((mod) => {
                    const html2canvas = mod.default;
                    const container = document.getElementById('phoneContainer');
                    html2canvas(container, { backgroundColor: null }).then(canvas => {
                        const link = document.createElement('a');
                        const isDark = document.body.classList.contains('dark');
                        let name = isDark ? '6.png' : (screenshotCounter + '.png');
                        if (!isDark && screenshotCounter < 6) { link.download = screenshotCounter + '.png'; screenshotCounter++; }
                        else if (isDark) { link.download = '6.png'; }
                        else { link.download = '5.png'; } // fallback
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    });
                }).catch(()=> alert('html2canvas failed'));
            }
        });

        // predefine icons in window (unused but available)
        window.getIcon = getIcon;
    })();
</script>
</body>
</html>
All done!
