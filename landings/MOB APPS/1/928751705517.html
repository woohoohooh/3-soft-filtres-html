      width: 4px;

    /* bottom navigation */
    .bottom-nav {

      fill: none;

    }

<script>
  (function() {
    // ---------- THEME ----------
    let darkMode = false;

    // ---------- ICONS (inline) ----------
    const icons = {
      home: `<svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 Z"/></svg>`,

      profile: `<svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,

    };

    // ---------- SCREENS (content) ----------
    const screens = {
      onboarding: `
        <div class="card" style="text-align: center; padding: 32px 20px;">
          <div style="background: #E6F0FF; width: 80px; height: 80px; border-radius: 30px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;">
            <svg width="48" height="48" viewBox="0 0 24 24" stroke="#2563EB" stroke-width="1.8" fill="none"><circle cx="12" cy="12" r="10"/><path d="M12 6 L12 12 L16 14"/></svg>
          </div>
          <h1 style="font-size: 32px; margin-bottom: 6px; color: var(--text-primary);">Math Brain</h1>

          <div class="flex-row gap-2"><span class="icon-sm">${icons.flashcards}</span><h3 style="color: var(--text-primary);">Today's goal</h3></div>

          <p style="color: var(--text-secondary);">3 of 8 lessons done</p>
        </div>
        <div class="card">
          <h3 style="margin-bottom: 12px;">Quick play</h3>
          <div class="flex-row gap-2" style="justify-content: space-between;">
            <span>➕ Addition</span> <span class="badge" style="background: var(--primary); color: white;">120 XP</span>
          </div>
          <div class="flex-row gap-2 mt-2">✖️ Multiplication <span class="badge">new</span></div>
          <button class="btn" style="margin-top: 20px;" id="quickLearnBtn">Start practice →</button>
        </div>
      `,
      learn: `
        <div class="card"><div class="flex-row gap-2"><span class="icon-sm">${icons.lesson}</span><h3>Daily workout</h3></div></div>
        <div class="card flex-row" style="justify-content: space-between;">
          <span>🧠 2ⁿ + 3ⁿ</span> <span class="badge">5 min</span>

          <span>📐 Geometry dash</span> <span class="badge">7 min</span>

      `,

      `,
      settings: `
        <div class="card">
          <div class="flex-row" style="justify-content: space-between;">
            <span>🌓 Dark theme</span>
            <label class="switch"><input type="checkbox" id="themeToggle"> <span class="slider"></span></label>
          </div>
        </div>
        <div class="card">
          <p style="margin-bottom: 8px;">🔊 Sound effects</p>
          <p>🔔 Notifications</p>
        </div>
        <div class="card" style="align-items: center;">⚙️ App version 2026.1</div>
      `,
      profileSettings: `
        <div class="card" style="text-align:center;">
          <svg width="60" height="60" viewBox="0 0 24 24" stroke="var(--primary)" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <h3>Alex Chen</h3>
          <p>math.intermediate</p>
        </div>
        <div class="card">📋 My profile</div>
        <div class="card">📊 Achievements (3)</div>
        <div class="card">🚪 Sign out</div>
      `,
    };

    // refs
    const container = document.getElementById('screenContainer');
    const titleEl = document.getElementById('screenTitle');
    const modalDiv = document.getElementById('modalContainer');
    const phoneDiv = document.getElementById('phoneContainer');
    let currentScreen = 'onboarding';
    let screenshotCounter = 1;

    // helper to render screen
    function showScreen(screenId) {
      if (screenId === 'profile') screenId = 'profileSettings';
      currentScreen = screenId;
      if (screenId === 'onboarding') titleEl.innerText = 'Welcome';
      else if (screenId === 'home') titleEl.innerText = 'Home';
      else if (screenId === 'learn') titleEl.innerText = 'Learn';
      else if (screenId === 'progress') titleEl.innerText = 'Progress';
      else if (screenId === 'settings') titleEl.innerText = 'Settings';
      else if (screenId === 'profileSettings') titleEl.innerText = 'Profile';

      container.innerHTML = screens[screenId] || screens.home;

      // re-attach listeners
      if (screenId === 'onboarding') {
        document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
          showScreen('home');
          setActiveNav('home');
        });
        document.getElementById('privacyLink')?.addEventListener('click', (e)=>{
          e.preventDefault(); showModal('Privacy Policy','We value your data. This is a demo prototype.');
        });
        document.getElementById('termsLink')?.addEventListener('click', (e)=>{
          e.preventDefault(); showModal('Terms of Service','Educational use only. No real data collected.');
        });
      }
      if (screenId === 'home') {
        document.getElementById('quickLearnBtn')?.addEventListener('click', ()=> showScreen('learn'));
      }
      if (screenId === 'learn') {
        document.getElementById('startLessonBtn')?.addEventListener('click', ()=> alert('Lesson started (simulation)'));
      }
      if (screenId === 'settings') {
        const toggle = document.getElementById('themeToggle');
        if (toggle) {
          toggle.checked = darkMode;
          toggle.addEventListener('change', (e) => {
            darkMode = e.target.checked;
            if (darkMode) phoneDiv.classList.add('dark-mode');
            else phoneDiv.classList.remove('dark-mode');
          });
        }
      }
    }

    function showModal(title, text) {
      modalDiv.innerHTML = `<div class="modal-content"><h3 style="margin-bottom:16px;">${title}</h3><p>${text}</p><button class="btn" style="margin-top:24px;" id="closeModalBtn">Close</button></div>`;
      modalDiv.classList.remove('hidden');
      document.getElementById('closeModalBtn').addEventListener('click', ()=> modalDiv.classList.add('hidden'));
    }

    // bottom navigation active
    function setActiveNav(screen) {
      document.querySelectorAll('.nav-item').forEach(el => {
        const data = el.getAttribute('data-screen');
        if (data === screen) {
          el.classList.add('active');
          el.classList.remove('inactive');
        } else {
          el.classList.remove('active');
          el.classList.add('inactive');
        }
      });
    }

    // attach nav listeners
    document.getElementById('navHome').addEventListener('click', ()=> { showScreen('home'); setActiveNav('home'); });
    document.getElementById('navLearn').addEventListener('click', ()=> { showScreen('learn'); setActiveNav('learn'); });
    document.getElementById('navProgress').addEventListener('click', ()=> { showScreen('progress'); setActiveNav('progress'); });
    document.getElementById('navSettings').addEventListener('click', ()=> { showScreen('settings'); setActiveNav('settings'); });
    document.getElementById('profileBtn').addEventListener('click', ()=> { showScreen('profileSettings'); setActiveNav(''); });

    // start
    showScreen('onboarding');

    // screenshot feature SHIFT + W
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const filename = darkMode ? '6.png' : (screenshotCounter + '.png');
        if (!darkMode) screenshotCounter = (screenshotCounter % 5) + 1;
        // simulate screenshot capture (just download a placeholder data url)
        const canvas = document.createElement('canvas');
        canvas.width = 360; canvas.height = 780;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = darkMode ? '#0F172A' : '#F8FAFC';
        ctx.fillRect(0,0,360,780);
        ctx.fillStyle = darkMode ? '#E2E8F0' : '#0F172A';
        ctx.font = 'bold 24px system-ui'; ctx.fillText('MATH', 80,360);
        const link = document.createElement('a');
        link.download = filename;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }
    });

  })();
</script>
