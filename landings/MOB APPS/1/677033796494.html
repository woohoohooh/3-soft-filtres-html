```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pythonika – learn Python</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1e2b;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 48px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 0 0 0 8px #2d3345;
            overflow: hidden;
            position: relative;
            transition: background 0.2s;
        }

        /* inner screen (no notch, just clean) */
        .screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        /* header */
        .header {
            padding: 18px 20px 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 22px;
        }
        .header-left {
            color: var(--text-primary);
        }
        .profile-icon {
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            border-radius: 12px;
        }
        .profile-icon:hover {
            background: var(--card-bg);
        }

        /* main content area (dynamic) */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--card-bg);
        }
        .content::-webkit-scrollbar {
            width: 4px;
        }
        .content::-webkit-scrollbar-track {
            background: var(--card-bg);
        }
        .content::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 8px;
        }

        /* bottom navigation */
        .bottom-nav {
            height: 72px;
            background: var(--card-bg);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 8px 12px;
            border-top: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 6px 12px;
            border-radius: 20px;
            flex: 1;
        }
        .nav-item.active {
            background: rgba(37, 99, 235, 0.1);
        }
        .nav-icon {
            width: 26px;
            height: 26px;
            transition: all 0.15s;
        }
        .nav-item.active .nav-icon {
            transform: scale(1.15);
            stroke: var(--primary) !important;
        }
        .nav-item:not(.active) .nav-icon {
            stroke: var(--inactive);
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .nav-item.active .nav-label {
            color: var(--primary);
            font-weight: 600;
        }

        /* cards & elements */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.02);
            transition: background 0.2s;
        }
        .progress-bar {
            height: 8px;
            background: var(--border-light);
            border-radius: 100px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }
        .badge {
            background: var(--accent-light);
            color: var(--primary-dark);
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
        }
        .row-space {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .icon-svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        button {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 24px;
            border-radius: 60px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:active {
            transform: scale(0.97);
        }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            font-size: 13px;
            color: var(--text-secondary);
            text-decoration: underline;
            cursor: pointer;
        }

        /* modals */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal.hidden {
            display: none;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 36px;
            width: 280px;
            text-align: center;
            box-shadow: 0 30px 50px black;
        }

        /* theme variables */
        :root {
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --bg-primary: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --inactive: #94A3B8;
            --border-light: #E2E8F0;
            --accent-light: #DBEAFE;
        }
        .dark {
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --bg-primary: #0F172A;
            --card-bg: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --inactive: #64748B;
            --border-light: #334155;
            --accent-light: #1E3A5F;
        }

        /* onboarding specific */
        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
            gap: 8px;
        }
        .app-logo {
            background: var(--primary);
            width: 70px;
            height: 70px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <div class="screen" id="appScreen">
        <!-- header: will be updated via js -->
        <div class="header" id="mainHeader">
            <div class="header-left" id="headerTitle">Onboarding</div>
            <div class="profile-icon" id="profileBtn">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--text-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
            </div>
        </div>

        <!-- main content (inject by js) -->
        <div class="content" id="screenContent"></div>

        <!-- bottom navigation (initially hidden on onboarding) -->
        <div class="bottom-nav" id="bottomNav"></div>
    </div>
</div>

<!-- modals (hidden) -->
<div id="privacyModal" class="modal hidden">
    <div class="modal-content">
        <h3 style="margin-bottom: 12px;">Privacy</h3>
        <p style="margin-bottom: 20px;">No data collected. Everything is local.</p>
        <button id="closePrivacy">OK</button>
    </div>
</div>
<div id="termsModal" class="modal hidden">
    <div class="modal-content">
        <h3 style="margin-bottom: 12px;">Terms of Service</h3>
        <p style="margin-bottom: 20px;">Learn Python terms: free for all.</p>
        <button id="closeTerms">OK</button>
    </div>
</div>

<script>
    (function() {
        // ---------- Icon system (inline svg) ----------
        const icons = {
            home: `<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v11h-7v-7h-4v7H3z"/></svg>`,
            learn: `<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
            progress: `<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`,
            settings: `<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`,
            profile: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>`,
            lesson: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="12" y2="17"/></svg>`,
            chart: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`,
            flashcards: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 8h6"/><path d="M9 12h6"/><path d="M9 16h4"/></svg>`,
            play: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
            check: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>`
        };

        // ---------- state ----------
        let currentScreen = 'onboarding'; // 'home','learn','progress','settings'
        let darkMode = false;

        // ---------- navigation ----------
        const headerTitleEl = document.getElementById('headerTitle');
        const screenContent = document.getElementById('screenContent');
        const bottomNav = document.getElementById('bottomNav');
        const profileBtn = document.getElementById('profileBtn');

        function renderScreen() {
            if (currentScreen === 'onboarding') {
                renderOnboarding();
                bottomNav.style.display = 'none';
            } else {
                bottomNav.style.display = 'flex';
                renderBottomNav(currentScreen);
                if (currentScreen === 'home') renderHome();
                else if (currentScreen === 'learn') renderLearn();
                else if (currentScreen === 'progress') renderProgress();
                else if (currentScreen === 'settings') renderSettings();
            }
            // update header title
            const titles = {
                onboarding: 'Welcome',
                home: 'Home',
                learn: 'Learn Python',
                progress: 'Your stats',
                settings: 'Settings'
            };
            headerTitleEl.innerText = titles[currentScreen] || 'App';
        }

        // onboarding
        function renderOnboarding() {
            bottomNav.style.display = 'none';
            screenContent.innerHTML = `
                <div class="logo-area">
                    <div class="app-logo">${icons.learn.replace('nav-icon','')}</div>
                    <h1 style="font-size:32px;">Pythonika</h1>
                    <p style="color: var(--primary); font-weight:500;">master code, step by step</p>
                    <p style="text-align:center; margin:12px 0;">Bite-sized Python lessons, quizzes, and real practice. From zero to hero.</p>
                    <button id="getStartedBtn" style="width:100%; margin-top:16px;">Get Started</button>
                    <div class="link-row" style="margin-top:24px;">
                        <span id="privacyLink">Privacy</span>
                        <span id="termsLink">Terms</span>
                    </div>
                </div>
            `;
            document.getElementById('getStartedBtn').addEventListener('click', ()=>{
                currentScreen = 'home';
                renderScreen();
            });
            document.getElementById('privacyLink').addEventListener('click', ()=>showModal('privacy'));
            document.getElementById('termsLink').addEventListener('click', ()=>showModal('terms'));
        }

        // Home
        function renderHome() {
            screenContent.innerHTML = `
                <div class="card" style="background: linear-gradient(145deg, var(--primary), var(--accent)); color:white;">
                    <div class="row-space"><span>🔥 Daily streak</span><span>7 days</span></div>
                    <div style="font-size:38px; font-weight:700;">5 lessons</div>
                    <div class="progress-bar" style="background:rgba(255,255,255,0.3);"><div class="progress-fill" style="width:42%; background:white;"></div></div>
                    <span>keep going</span>
                </div>
                <div class="card row-space"><span>📘 Next lesson: variables</span> <span>${icons.play}</span></div>
                <div class="card"><div style="display:flex; gap:12px;">${icons.flashcards} <span>Flashcards: 20 terms</span></div></div>
                <div class="card"><h4>Recommended</h4><div style="display:flex; gap:12px; margin-top:12px;"><span class="badge">lists</span><span class="badge">functions</span><span class="badge">loops</span></div></div>
            `;
        }

        // Learn
        function renderLearn() {
            screenContent.innerHTML = `
                <div class="card row-space"><span>🐍 Python basics</span> ${icons.play}</div>
                <div class="card row-space"><span>📋 Data types</span> ${icons.lesson}</div>
                <div class="card row-space"><span>🔁 Loops & conditions</span> ${icons.lesson}</div>
                <div class="card row-space"><span>🧩 Functions</span> ${icons.lesson}</div>
                <div class="card row-space"><span>📦 Modules</span> ${icons.play}</div>
                <div style="padding:6px; background:var(--card-bg); border-radius:30px; text-align:center;">start any lesson</div>
            `;
        }

        // Progress
        function renderProgress() {
            screenContent.innerHTML = `
                <div class="card"><h3>⚡ 1,240 XP</h3><div class="progress-bar"><div class="progress-fill" style="width:68%"></div></div></div>
                <div class="card row-space"><span>${icons.chart} lessons done</span><span>12/20</span></div>
                <div class="card"><span>🏆 achievements</span><div style="display:flex; gap:8px; margin-top:12px;"><span class="badge">🔥 7 day</span><span class="badge">⚡ 100xp</span><span class="badge">🐍 beginner</span></div></div>
                <div class="card"><span>📈 accuracy 84%</span><div class="progress-bar"><div class="progress-fill" style="width:84%"></div></div></div>
            `;
        }

        // Settings
        function renderSettings() {
            screenContent.innerHTML = `
                <div class="card row-space"><span>🌙 Dark mode</span><label><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}></label></div>
                <div class="card">🔔 Notifications</div>
                <div class="card">🎨 Theme: Blue</div>
                <div class="card">📲 Version 1.0.3</div>
                <div class="card row-space"><span>👤 profile (click header icon)</span></div>
            `;
            document.getElementById('darkToggle')?.addEventListener('change', (e) => {
                darkMode = e.target.checked;
                document.documentElement.classList.toggle('dark', darkMode);
                document.getElementById('phoneContainer').classList.toggle('dark', darkMode);
                renderScreen();
            });
        }

        function renderBottomNav(active) {
            const items = [
                {id:'home', label:'Home', icon:icons.home},
                {id:'learn', label:'Learn', icon:icons.learn},
                {id:'progress', label:'Progress', icon:icons.progress},
                {id:'settings', label:'Settings', icon:icons.settings}
            ];
            bottomNav.innerHTML = items.map(item => `
                <div class="nav-item ${active === item.id ? 'active' : ''}" data-nav="${item.id}">
                    ${item.icon}
                    <span class="nav-label">${item.label}</span>
                </div>
            `).join('');
            bottomNav.querySelectorAll('.nav-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    const navId = el.dataset.nav;
                    if (navId) { currentScreen = navId; renderScreen(); }
                });
            });
        }

        // profile opens settings
        profileBtn.addEventListener('click', ()=>{
            if (currentScreen === 'onboarding') return;
            currentScreen = 'settings';
            renderScreen();
        });

        // modals
        function showModal(type) {
            if (type === 'privacy') document.getElementById('privacyModal').classList.remove('hidden');
            else document.getElementById('termsModal').classList.remove('hidden');
        }
        document.getElementById('closePrivacy').addEventListener('click', ()=>document.getElementById('privacyModal').classList.add('hidden'));
        document.getElementById('closeTerms').addEventListener('click', ()=>document.getElementById('termsModal').classList.add('hidden'));

        // screenshot (SHIFT+W)
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const node = document.getElementById('phoneContainer');
                import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
                    html2canvas(node, { scale: 2, backgroundColor: null }).then(canvas => {
                        const link = document.createElement('a');
                        const themeSuffix = darkMode ? '6' : (currentScreen === 'onboarding'?'1':currentScreen==='home'?'2':currentScreen==='learn'?'3':currentScreen==='progress'?'4':'5');
                        link.download = themeSuffix + '.png';
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    });
                }).catch(()=>alert('html2canvas failed, but shift+w works'));
            }
        });

        // initial render
        renderScreen();

        // pre-set dark class
        if (darkMode) document.documentElement.classList.add('dark');
    })();
</script>

<!-- hidden modal anchors (already in html) -->
</body>
</html>
```
