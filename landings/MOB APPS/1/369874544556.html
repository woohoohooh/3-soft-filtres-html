```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Brain Trainer · mobile app</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #1a2634;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg-primary);
            border-radius: 44px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.4), 0 0 0 8px #2c3a47;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s;
        }

        /* light / dark variables */
        :root {
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive-icon: #94A3B8;
            --progress-bg: #E2E8F0;
            --header-border: #E2E8F0;
        }

        body.dark {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive-icon: #64748B;
            --progress-bg: #334155;
            --header-border: #334155;
        }

        /* app content */
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 8px 16px;
            scrollbar-width: thin;
            background: var(--bg-primary);
            transition: background 0.2s;
            display: flex;
            flex-direction: column;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--header-border);
            margin-bottom: 16px;
        }
        .header h2 {
            font-size: 22px;
            font-weight: 650;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* bottom navigation */
        .bottom-nav {
            height: 72px;
            background: var(--bg-card);
            border-top: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 8px;
            transition: background 0.2s;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            gap: 4px;
            cursor: pointer;
            padding: 6px 0;
            border-radius: 20px;
            transition: all 0.15s ease;
            color: var(--inactive-icon);
            fill: var(--inactive-icon);
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            transform: scale(1.05);
            background: rgba(37, 99, 235, 0.08);
        }
        .nav-item span {
            font-size: 12px;
            font-weight: 500;
        }
        .nav-icon {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-item.active .nav-icon {
            stroke: var(--primary);
        }

        /* screens container */
        .screen {
            display: none;
            flex-direction: column;
            flex: 1;
        }
        .screen.active-screen {
            display: flex;
        }

        /* common components */
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.02);
            margin-bottom: 16px;
            border: 1px solid var(--border-light);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .app-logo {
            background: linear-gradient(145deg, #2563EB, #38BDF8);
            width: 52px;
            height: 52px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tagline {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
            margin-top: 4px;
        }
        .btn-large {
            background: var(--primary);
            border: none;
            border-radius: 60px;
            padding: 18px 20px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            width: 100%;
            cursor: pointer;
            margin: 20px 0 16px;
            transition: 0.1s;
            box-shadow: 0 8px 16px -6px var(--primary-dark);
        }
        .btn-large:active { transform: scale(0.97); background: var(--primary-dark); }
        .link-row {
            display: flex;
            gap: 24px;
            justify-content: center;
            font-size: 14px;
        }
        .link-row button {
            background: none;
            border: none;
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
            font-size: 14px;
        }

        /* modal */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.15s;
        }
        .modal-overlay.show {
            visibility: visible;
            opacity: 1;
        }
        .modal-content {
            background: var(--bg-card);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            color: var(--text-primary);
            text-align: center;
        }
        .modal-content button {
            margin-top: 20px;
            background: var(--primary);
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
        }

        /* lesson row */
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .lesson-item:last-child { border: none; }
        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 10px;
            flex: 1;
        }
        .progress-fill {
            width: 60%;
            height: 8px;
            background: var(--primary);
            border-radius: 10px;
        }

        /* stats cards */
        .stats-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .stat-card {
            background: var(--bg-primary);
            padding: 14px;
            border-radius: 20px;
            flex: 1;
            border: 1px solid var(--border-light);
        }

        /* chart mini */
        .chart-container {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 90px;
            margin: 20px 0 10px;
        }
        .bar {
            width: 22px;
            background: var(--accent);
            border-radius: 12px 12px 4px 4px;
            height: calc(70% * 0.7);
            transition: height 0.3s;
        }
        .bar:nth-child(2) { height: 48px; background: var(--primary); }
        .bar:nth-child(3) { height: 62px; }
        .bar:nth-child(4) { height: 30px; }
        .bar:nth-child(5) { height: 80px; background: var(--primary); }

        /* setting row */
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
        }
        .toggle-switch {
            width: 48px;
            height: 26px;
            background: #94a3b8;
            border-radius: 26px;
            appearance: none;
            cursor: pointer;
            position: relative;
        }
        .toggle-switch:checked {
            background: var(--primary);
        }
        .toggle-switch::before {
            content: '';
            width: 22px; height: 22px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px; left: 2px;
            transition: 0.15s;
        }
        .toggle-switch:checked::before { left: 24px; }

        /* svg sprite hidden */
        .svg-sprite { display: none; }

        /* icon */
        .icon-xs {
            width: 24px; height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .badge {
            background: #dbeafe;
            color: #1e40af;
            border-radius: 30px;
            padding: 4px 14px;
            font-weight: 600;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="phone" id="phoneContainer">
        <!-- inline SVG definitions (custom icons) -->
        <svg class="svg-sprite">
            <symbol id="icon-home" viewBox="0 0 24 24"><path d="M5 12H3L12 3L21 12H19" stroke="currentColor" fill="none"/><path d="M5 12V19H19V12" stroke="currentColor"/></symbol>
            <symbol id="icon-learn" viewBox="0 0 24 24"><path d="M2 3H8C9.10457 3 10 3.89543 10 5V19C10 20.1046 9.10457 21 8 21H2V3Z" stroke="currentColor"/><path d="M22 3H16C14.8954 3 14 3.89543 14 5V19C14 20.1046 14.8954 21 16 21H22V3Z" stroke="currentColor"/><line x1="10" y1="8" x2="14" y2="8" stroke="currentColor"/><line x1="10" y1="12" x2="14" y2="12" stroke="currentColor"/><line x1="10" y1="16" x2="14" y2="16" stroke="currentColor"/></symbol>
            <symbol id="icon-progress" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><path d="M12 7V12L15 15" stroke="currentColor"/></symbol>
            <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor"/><path d="M19.4 15C19.0336 15.6841 18.5378 16.2935 17.94 16.79L17 19L14 19.26C13.0413 19.7983 11.9797 20.0871 10.895 20.1L9 20L7 17.5C6.5 17 6.1 16.38 5.84 15.68L5 13L6.2 10.2C6.4 9.5 6.8 8.9 7.3 8.4L8 6L11 5.68C11.9587 5.14168 13.0203 4.85293 14.105 4.84L16 5L18 7.5C18.5 8 18.9 8.62 19.16 9.32L20 12L19.4 15Z" stroke="currentColor"/></symbol>
            <symbol id="icon-profile" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" stroke="currentColor"/><path d="M5 20V19C5 15.6863 7.68629 13 11 13H13C16.3137 13 19 15.6863 19 19V20" stroke="currentColor"/></symbol>
            <symbol id="icon-lesson" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor"/><line x1="9" y1="8" x2="15" y2="8" stroke="currentColor"/><line x1="9" y1="12" x2="15" y2="12" stroke="currentColor"/><line x1="9" y1="16" x2="12" y2="16" stroke="currentColor"/></symbol>
            <symbol id="icon-chart" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10" stroke="currentColor"/><line x1="12" y1="20" x2="12" y2="4" stroke="currentColor"/><line x1="6" y1="20" x2="6" y2="14" stroke="currentColor"/></symbol>
            <symbol id="icon-flashcards" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor"/><line x1="9" y1="7" x2="15" y2="7" stroke="currentColor"/><line x1="9" y1="11" x2="15" y2="11" stroke="currentColor"/><line x1="9" y1="15" x2="12" y2="15" stroke="currentColor"/></symbol>
            <symbol id="icon-play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none"/></symbol>
            <symbol id="icon-check" viewBox="0 0 24 24"><path d="M20 6L9 17L4 12" stroke="currentColor"/></symbol>
        </svg>

        <!-- main content dynamic via JS -->
        <div id="appContent" class="app-content">
            <!-- screens injected via JS -->
        </div>

        <!-- bottom nav fixed -->
        <div class="bottom-nav" id="bottomNav">
            <button class="nav-item active" data-screen="home"><svg class="nav-icon"><use href="#icon-home"/></svg><span>Home</span></button>
            <button class="nav-item" data-screen="learn"><svg class="nav-icon"><use href="#icon-learn"/></svg><span>Learn</span></button>
            <button class="nav-item" data-screen="progress"><svg class="nav-icon"><use href="#icon-progress"/></svg><span>Progress</span></button>
            <button class="nav-item" data-screen="settings"><svg class="nav-icon"><use href="#icon-settings"/></svg><span>Settings</span></button>
        </div>

        <!-- modal overlay privacy/terms -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-content" id="modalBody">
                <h3 id="modalTitle"></h3>
                <p id="modalText"></p>
                <button id="closeModal">Got it</button>
            </div>
        </div>
    </div>

    <script>
        (function(){
            // ---------- SCREEN DEFINITIONS ----------
            const SCREENS = {
                onboarding: { name: 'onboarding', title: 'Welcome' },
                home: { name: 'home', title: 'Dashboard' },
                learn: { name: 'learn', title: 'Practice' },
                progress: { name: 'progress', title: 'Progress' },
                settings: { name: 'settings', title: 'Settings' }
            };

            let activeScreen = 'onboarding';  // start with onboarding
            let darkMode = false;

            // ---------- ICON UTILS ----------
            function icon(iconId, className = 'icon-xs') {
                return `<svg class="${className}"><use href="#${iconId}"/></svg>`;
            }

            // ---------- SCREEN HTML ----------
            function getScreenHTML(screen) {
                switch(screen) {
                    case 'onboarding': return `
                        <div class="header"><h2>👋 Welcome</h2><button class="profile-btn" id="profileHeaderBtn">${icon('icon-profile')}</button></div>
                        <div class="card" style="text-align:center;">
                            <div class="logo-area" style="justify-content:center;">
                                <div class="app-logo">${icon('icon-flashcards', 'nav-icon')}</div>
                                <span style="font-size:28px; font-weight:700;">MathBrain</span>
                            </div>
                            <div class="tagline">train your mental math</div>
                            <p style="margin:16px 0; color:var(--text-secondary);">Quick daily challenges to boost arithmetic skills. 5-min workouts.</p>
                            <button class="btn-large" id="getStartedBtn">Get Started</button>
                            <div class="link-row">
                                <button id="privacyBtn">Privacy</button><button id="termsBtn">Terms</button>
                            </div>
                        </div>
                        <div style="flex:1;"></div>
                    `;
                    case 'home': return `
                        <div class="header"><h2>Dashboard</h2><button class="profile-btn" id="profileHeaderBtn">${icon('icon-profile')}</button></div>
                        <div class="card">
                            <div style="display:flex; justify-content:space-between;"><span>🔥 Streak 12 days</span> <span>⚡ 340 pts</span></div>
                            <div style="margin:16px 0; font-size:20px;">Today's target</div>
                            <div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div>
                            <div style="display:flex; gap:12px; margin-top:16px;">${icon('icon-flashcards')} <span>2/5 lessons</span></div>
                        </div>
                        <div class="card">
                            <h3>Recommended</h3>
                            <div class="lesson-item">${icon('icon-lesson')} <span>Multiplication</span> <span class="badge">new</span></div>
                            <div class="lesson-item">${icon('icon-lesson')} <span>Division</span> <span class="badge">+10xp</span></div>
                            <div class="lesson-item">${icon('icon-play')} <span>Daily quiz</span></div>
                        </div>
                    `;
                    case 'learn': return `
                        <div class="header"><h2>Learn</h2><button class="profile-btn" id="profileHeaderBtn">${icon('icon-profile')}</button></div>
                        <div class="card">
                            <h3>Arithmetic workouts</h3>
                            <div class="lesson-item">${icon('icon-play')} <span>➕ Addition</span><div class="progress-bar"><div class="progress-fill" style="width:80%"></div></div></div>
                            <div class="lesson-item">${icon('icon-play')} <span>➖ Subtraction</span><div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div></div>
                            <div class="lesson-item">${icon('icon-play')} <span>✖️ Multiplication</span><div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div></div>
                            <div class="lesson-item">${icon('icon-play')} <span>➗ Division</span><div class="progress-bar"><div class="progress-fill" style="width:15%"></div></div></div>
                            <button style="background:var(--primary); border:none; border-radius:40px; color:white; padding:12px; width:100%; margin-top:12px;" id="practiceStart">Start practice ➔</button>
                        </div>
                    `;
                    case 'progress': return `
                        <div class="header"><h2>Statistics</h2><button class="profile-btn" id="profileHeaderBtn">${icon('icon-profile')}</button></div>
                        <div class="stats-row">
                            <div class="stat-card"><b>45</b> lessons</div>
                            <div class="stat-card"><b>1280</b> XP</div>
                            <div class="stat-card"><b>🔥7</b> streak</div>
                        </div>
                        <div class="card">
                            <h3>Weekly activity</h3>
                            <div class="chart-container" id="chartAnimation">
                                <div class="bar" style="height:34px"></div><div class="bar" style="height:58px"></div><div class="bar" style="height:42px"></div><div class="bar" style="height:70px"></div><div class="bar" style="height:28px"></div><div class="bar" style="height:80px; background:var(--primary);"></div><div class="bar" style="height:50px"></div>
                            </div>
                        </div>
                        <div class="card">${icon('icon-chart')}  Accuracy 86% ↑8%</div>
                    `;
                    case 'settings': return `
                        <div class="header"><h2>Settings</h2><button class="profile-btn" id="profileHeaderBtn">${icon('icon-profile')}</button></div>
                        <div class="card">
                            <div class="setting-row"><span>🌙 Dark mode</span> <input type="checkbox" class="toggle-switch" id="darkToggle"></div>
                            <div class="setting-row"><span>🔔 Notifications</span> <input type="checkbox" class="toggle-switch" checked></div>
                            <div class="setting-row"><span>🇺🇸 Language</span> <span>English</span></div>
                        </div>
                        <div class="card">
                            <h4>Profile</h4>
                            <div class="lesson-item">${icon('icon-profile')} Alex Chen</div>
                            <div class="lesson-item">${icon('icon-flashcards')} Member since 2025</div>
                        </div>
                    `;
                    default: return '';
                }
            }

            // ---------- RENDER ----------
            function renderApp() {
                const container = document.getElementById('appContent');
                container.innerHTML = getScreenHTML(activeScreen);
                // re-attach profile btn
                document.getElementById('profileHeaderBtn')?.addEventListener('click', ()=>{
                    setActiveScreen('settings');
                    updateBottomNav('settings');
                });
                if (activeScreen === 'onboarding') {
                    document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                        setActiveScreen('home');
                        updateBottomNav('home');
                    });
                    document.getElementById('privacyBtn')?.addEventListener('click', ()=> showModal('Privacy Policy', 'We respect your data. No sharing.'));
                    document.getElementById('termsBtn')?.addEventListener('click', ()=> showModal('Terms of Service', 'Use MathBrain for learning only.'));
                }
                if (activeScreen === 'learn') {
                    document.getElementById('practiceStart')?.addEventListener('click', ()=>{
                        alert('Practice session started! (simulated)');
                    });
                }
                if (activeScreen === 'settings') {
                    const toggle = document.getElementById('darkToggle');
                    if (toggle) {
                        toggle.checked = darkMode;
                        toggle.addEventListener('change', (e) => {
                            darkMode = e.target.checked;
                            document.body.classList.toggle('dark', darkMode);
                        });
                    }
                }
            }

            // show modal
            function showModal(title, text) {
                document.getElementById('modalTitle').innerText = title;
                document.getElementById('modalText').innerText = text;
                document.getElementById('modalOverlay').classList.add('show');
            }

            // bottom nav update + screen switch
            function setActiveScreen(screen) {
                activeScreen = screen;
                renderApp();
            }

            function updateBottomNav(active) {
                document.querySelectorAll('.nav-item').forEach(btn => {
                    const scr = btn.dataset.screen;
                    btn.classList.toggle('active', scr === active);
                });
            }

            // bottom nav listeners
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const scr = btn.dataset.screen;
                    setActiveScreen(scr);
                    updateBottomNav(scr);
                });
            });

            // close modal
            document.getElementById('closeModal').addEventListener('click', ()=>{
                document.getElementById('modalOverlay').classList.remove('show');
            });

            // init
            renderApp();
            updateBottomNav('home'); // but activeScreen = onboarding, but bottom nav shows home as default style, we need to show active related: onboarding not in bottom nav -> we keep all inactive
            // onboarding doesn't show bottom active
            document.querySelectorAll('.nav-item').forEach(b=> b.classList.remove('active'));

            // ---------- SHIFT+W screenshot ----------
            let screenshotCounter = 1;
            window.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    const phone = document.getElementById('phoneContainer');
                    // in real prototype we would use html2canvas, but we can't include libs.
                    // simulated: generate sequential naming.
