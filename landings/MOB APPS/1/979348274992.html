```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code mastery · mobile prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a2639;
            padding: 12px;
        }
        .phone-mock {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 10px #2d3a4f;
            position: relative;
            transition: background 0.2s;
            display: flex;
            flex-direction: column;
        }
        :root {
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --icon-inactive: #94A3B8;
            --nav-bg: #FFFFFF;
            --progress-bg: #E2E8F0;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
        }
        body.dark {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --icon-inactive: #64748B;
            --nav-bg: #1E293B;
            --progress-bg: #334155;
            --shadow: 0 4px 12px rgba(0,0,0,0.5);
        }
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--bg-card);
        }
        .app-container::-webkit-scrollbar {
            width: 4px;
        }
        .app-container::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 8px;
        }
        header {
            padding: 16px 20px 8px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-light);
        }
        .screen-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .profile-icon {
            cursor: pointer;
            padding: 6px;
            transition: transform 0.1s;
        }
        .profile-icon svg {
            width: 26px;
            height: 26px;
            stroke: var(--text-primary);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .profile-icon:active { transform: scale(0.94); }
        .screen-content {
            flex: 1;
            padding: 20px 16px 10px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        /* onboarding */
        .onboarding-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        .logo-svg svg {
            width: 70px;
            height: 70px;
            stroke: var(--primary);
            stroke-width: 2;
            fill: none;
        }
        .app-name {
            font-size: 38px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -1px;
            margin-top: 8px;
        }
        .tagline {
            font-size: 16px;
            color: var(--accent);
            font-weight: 600;
            margin-top: 4px;
        }
        .desc {
            text-align: center;
            color: var(--text-secondary);
            margin: 16px 0 24px;
            line-height: 1.5;
            padding: 0 12px;
        }
        .btn-primary {
            background: var(--primary);
            border: none;
            border-radius: 60px;
            padding: 16px 28px;
            font-size: 18px;
            font-weight: 700;
            color: white;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 10px 18px -8px var(--primary-dark);
            transition: transform 0.1s, background 0.1s;
        }
        .btn-primary:active { transform: scale(0.97); background: var(--primary-dark); }
        .legal-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 22px;
            font-size: 13px;
        }
        .legal-links span {
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
        }
        /* modal */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        .modal-card {
            background: var(--bg-card);
            width: 280px;
            padding: 24px;
            border-radius: 28px;
            box-shadow: 0 20px 30px #00000040;
            color: var(--text-primary);
        }
        .modal-card h3 { margin-bottom: 8px; }
        .modal-close {
            margin-top: 20px;
            text-align: right;
            font-weight: 600;
            color: var(--primary);
            cursor: pointer;
        }
        /* dashboard cards */
        .stats-row {
            display: flex;
            gap: 12px;
        }
        .stat-card {
            background: var(--bg-card);
            padding: 14px 12px;
            border-radius: 24px;
            flex: 1;
            box-shadow: var(--shadow);
        }
        .stat-title { font-size: 13px; color: var(--text-secondary); }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--primary); }
        .badge-row {
            display: flex;
            gap: 8px;
            margin: 4px 0;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 6px 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
        }
        .lesson-item {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: var(--shadow);
            cursor: pointer;
        }
        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 10px;
            margin: 12px 0 4px;
        }
        .progress-fill {
            height: 8px;
            background: var(--primary);
            border-radius: 10px;
            width: 60%;
        }
        .chart-sample {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 16px;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 130px;
        }
        .bar {
            width: 24px;
            background: var(--primary);
            border-radius: 12px 12px 4px 4px;
            transition: height 0.3s;
        }
        .bar-label { font-size: 11px; color: var(--text-secondary); text-align: center; margin-top: 4px; }
        /* bottom nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--nav-bg);
            padding: 8px 10px 6px;
            border-top: 1px solid var(--border-light);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            transition: all 0.15s;
            padding: 6px 12px 4px;
            border-radius: 30px;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.15s;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 600;
            transition: all 0.15s;
        }
        .nav-item.active {
            background: rgba(37, 99, 235, 0.12);
        }
        .nav-item.active svg {
            stroke: var(--primary);
            transform: scale(1.15);
        }
        .nav-item.active span {
            color: var(--primary);
        }
        .nav-item.inactive svg {
            stroke: var(--icon-inactive);
        }
        .nav-item.inactive span {
            color: var(--icon-inactive);
        }
        /* hide/show screens */
        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }
        .screen.active-screen {
            display: flex;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="phone-mock" id="phoneContainer">
    <div id="app" class="app-container"></div>
</div>
<script>
    (function() {
        // ---------- THEME & UTILS ----------
        let currentTheme = 'light';
        let currentScreen = 'onboarding';
        let modalVisible = false;
        let screenshotCounter = 1;

        const themeToggle = () => {
            document.body.classList.toggle('dark');
            currentTheme = document.body.classList.contains('dark') ? 'dark' : 'light';
        };

        // ---------- SVG ICONS ----------
        const icons = {
            home: '<svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" /></svg>',
            learn: '<svg viewBox="0 0 24 24"><path d="M12 5L4 9L12 13L20 9L12 5Z M4 13L12 17L20 13 M4 17L12 21L20 17"/></svg>',
            progress: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7V12L15 15"/></svg>',
            settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M19.4 15a1.65 1.65 0 0 1 .33 1.82 1.65 1.65 0 0 1-1.5 1H5.77a1.65 1.65 0 0 1-1.5-1 1.65 1.65 0 0 1 .33-1.82l.1-.1A7.94 7.94 0 0 1 12 4.5a7.94 7.94 0 0 1 6.3 10.4l.1.1Z"/></svg>',
            profile: '<svg viewBox="0 0 24 24"><path d="M4 20C4 17 8 15 12 15C16 15 20 17 20 20 M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12Z" /></svg>',
            lesson: '<svg viewBox="0 0 24 24"><path d="M2 3H8C9 3 10 4 10 5V19C10 20 9 21 8 21H2V3Z M22 3H16C15 3 14 4 14 5V19C14 20 15 21 16 21H22V3Z"/></svg>',
            chart: '<svg viewBox="0 0 24 24"><path d="M21 20H3V4 M7 16V12 M12 16V8 M17 16V10"/></svg>',
            flashcards: '<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8H15M9 12H13"/></svg>',
            play: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M10 8L16 12L10 16V8Z"/></svg>',
            check: '<svg viewBox="0 0 24 24"><path d="M5 13L9 17L19 7"/></svg>'
        };

        function renderIcon(name) { return icons[name] || ''; }

        // -------- screens structure --------
        const screens = {
            onboarding: { title: 'Welcome' },
            home: { title: 'Dashboard' },
            learn: { title: 'Python' },
            progress: { title: 'Insights' },
            settings: { title: 'Settings' }
        };

        function buildScreen() {
            const active = currentScreen;
            let html = '';
            // header (except onboarding we show no header? but onboarding has its own. We unify with header)
            if (active !== 'onboarding') {
                html += `<header><span class="screen-title">${screens[active].title}</span><div class="profile-icon" onclick="window.navToScreen('settings')">${renderIcon('profile')}</div></header>`;
            }
            html += `<div class="screen-content" id="screenContent">${renderScreenContent(active)}</div>`;
            if (active !== 'onboarding') {
                html += renderBottomNav(active);
            }
            return html;
        }

        function renderScreenContent(screenId) {
            switch(screenId) {
                case 'onboarding': return renderOnboarding();
                case 'home': return renderHome();
                case 'learn': return renderLearn();
                case 'progress': return renderProgress();
                case 'settings': return renderSettings();
                default: return '';
            }
        }

        function renderOnboarding() {
            return `
                <div class="onboarding-logo">
                    <div class="logo-svg">${renderIcon('lesson')}</div>
                    <div class="app-name">PyMaster</div>
                    <div class="tagline">code like a pro</div>
                    <div class="desc">Learn Python with bite-sized exercises and real‑time feedback. Perfect for beginners!</div>
                    <button class="btn-primary" onclick="window.navToScreen('home')">Get Started</button>
                    <div class="legal-links">
                        <span onclick="window.showModal('privacy')">Privacy Policy</span>
                        <span onclick="window.showModal('terms')">Terms of Service</span>
                    </div>
                </div>
                ${modalVisible ? renderModal() : ''}
            `;
        }

        function renderModal() {
            const content = modalVisible === 'privacy' ? 'Your data stays private. No tracking.' : 'Educational use only. Standard terms apply.';
            return `
                <div class="modal-overlay" onclick="window.closeModal()">
                    <div class="modal-card" onclick="event.stopPropagation()">
                        <h3>${modalVisible === 'privacy' ? 'Privacy' : 'Terms'}</h3>
                        <p style="margin:10px 0">${content}</p>
                        <div class="modal-close" onclick="window.closeModal()">OK</div>
                    </div>
                </div>
            `;
        }

        function renderHome() {
            return `
                <div class="stats-row">
                    <div class="stat-card"><span class="stat-title">Streak</span><div class="stat-value">7🔥</div></div>
                    <div class="stat-card"><span class="stat-title">Lessons</span><div class="stat-value">24</div></div>
                </div>
                <div class="badge-row"><span class="badge">variables</span><span class="badge">loops</span><span class="badge">functions</span></div>
                <div class="lesson-item" onclick="window.navToScreen('learn')">
                    ${renderIcon('play')} <div><strong>Continue: Loops</strong><div class="progress-bar" style="width:120px"><div class="progress-fill" style="width:70%"></div></div></div>
                </div>
                <div class="lesson-item" onclick="window.navToScreen('learn')">
                    ${renderIcon('flashcards')} <div><strong>Daily challenge</strong><span style="color:var(--text-secondary);font-size:14px"> 5 exercises</span></div>
                </div>
                <div style="background:var(--bg-card);border-radius:24px;padding:16px;">
                    <span style="font-weight:600;">This week</span>
                    <div class="chart-sample">
                        <div style="display:flex;flex-direction:column;align-items:center;"><div class="bar" style="height:60px"></div><span class="bar-label">M</span></div>
                        <div><div class="bar" style="height:42px"></div><span class="bar-label">T</span></div>
                        <div><div class="bar" style="height:75px"></div><span class="bar-label">W</span></div>
                        <div><div class="bar" style="height:30px"></div><span class="bar-label">T</span></div>
                        <div><div class="bar" style="height:55px"></div><span class="bar-label">F</span></div>
                    </div>
                </div>
            `;
        }

        function renderLearn() {
            return `
                <div class="lesson-item">${renderIcon('lesson')} <div><strong>Variables & Data</strong><span style="color:var(--text-secondary);"> 3/6 completed</span><div class="progress-bar"><div class="progress-fill" style="width:50%"></div></div></div></div>
                <div class="lesson-item">${renderIcon('lesson')} <div><strong>Conditionals</strong><span style="color:var(--text-secondary);"> 2/5</span><div class="progress-bar"><div class="progress-fill" style="width:40%"></div></div></div></div>
                <div class="lesson-item">${renderIcon('flashcards')} <div><strong>Flashcards: syntax</strong><span style="color:var(--text-secondary);"> 15 cards</span></div></div>
                <button class="btn-primary" style="margin-top:10px;" onclick="window.showPracticeToast?.(/* practice start simulated */)">start practice</button>
            `;
        }

        function renderProgress() {
            return `
                <div class="stats-row">
                    <div class="stat-card"><span class="stat-title">total XP</span><div class="stat-value">1250</div></div>
                    <div class="stat-card"><span class="stat-title">accuracy</span><div class="stat-value">84%</div></div>
                </div>
                <div style="background:var(--bg-card);border-radius:24px;padding:20px;">
                    ${renderIcon('chart')} <span style="font-weight:600;margin-left:6px;">Weekly activity</span>
                    <div style="height:80px; display:flex; align-items:flex-end; gap:10px; margin-top:14px;">
                        <div style="background:var(--primary); width:20px; height:50px; border-radius:10px;"></div>
                        <div style="background:var(--primary); width:20px; height:70px;"></div>
                        <div style="background:var(--primary); width:20px; height:40px;"></div>
                        <div style="background:var(--primary); width:20px; height:90px;"></div>
                    </div>
                </div>
                <div style="background:var(--bg-card);border-radius:24px;padding:16px;"><strong>achievements</strong> 🏅 python starter • 5 day streak</div>
            `;
        }

        function renderSettings() {
            return `
                <div style="background:var(--bg-card);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:18px;">
                    <div style="display:flex;justify-content:space-between;"><span>Dark mode</span><label class="switch"><input type="checkbox" id="themeCheckbox" onchange="window.themeToggle()" ${currentTheme==='dark'?'checked':''} style="width:20px;height:20px;"></label></div>
                    <div>Profile: <strong>Alex C.</strong></div>
                    <div>Notifications</div>
                    <div>Language: English</div>
                </div>
                <div style="margin-top:16px; background:var(--bg-card);border-radius:20px;padding:20px;">
                    <div>App version 2.6.0</div>
                    <div style="margin-top:10px;"><span onclick="window.showModal('privacy')" style="color:var(--primary);">Privacy</span> · <span onclick="window.showModal('terms')">Terms</span></div>
                </div>
            `;
        }

        function renderBottomNav(active) {
            const items = ['home', 'learn', 'progress', 'settings'];
            const labels = { home:'Home', learn:'Learn', progress:'Progress', settings:'Settings' };
            let navHtml = '<div class="bottom-nav">';
            items.forEach(id => {
                const cls = (active === id) ? 'active' : 'inactive';
                navHtml += `<div class="nav-item ${cls}" onclick="window.navToScreen('${id}')">${renderIcon(id)}<span>${labels[id]}</span></div>`;
            });
            navHtml += '</div>';
            return navHtml;
        }

        // navigation
        window.navToScreen = function(screenId) {
            if (screenId === 'settings' && currentScreen === 'settings') { /* already there */ }
            currentScreen = screenId;
            if (screenId !== 'onboarding') modalVisible = false; // close any modal
            renderApp();
        };

        window.showModal = function(type) { modalVisible = type; renderApp(); };
        window.closeModal = function() { modalVisible = false; renderApp(); };
        window.themeToggle = function() { themeToggle(); renderApp(); }; // preserve screen

        window.showPracticeToast = function() { alert('practice started!'); };

        function renderApp() {
            const container = document.getElementById('app');
            container.innerHTML = buildScreen();
            // sync checkbox after render (settings)
            const chk = document.getElementById('themeCheckbox');
            if (chk) chk.checked = document.body.classList.contains('dark');
        }

        // ----- screenshot shift+W -----
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                if (!phone) return;
                import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
                    html2canvas(phone, { scale: 2, backgroundColor: null }).then(canvas => {
                        const link = document.createElement('a');
                        let filename = (document.body.classList.contains('dark') ? '6.png' : (screenshotCounter + '.png'));
                        if (document.body.classList.contains('dark')) filename = '6.png';
                        else { if (screenshotCounter>5) screenshotCounter=1; filename = screenshotCounter+'.png'; screenshotCounter++; }
                        link.download = filename;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    });
                }).catch(() => alert('html2canvas failed, but Shift+W works'));
            }
        });

        // initial render
        renderApp();
    })();
</script>
</body>
</html>
All done!

titles = {
    "1.png": "Start Learning",
    "2.png": "Daily Lessons",
    "3.png": "Practice Skills",
    "4.png": "Track Progress",
    "5.png": "Smart Settings",
    "6.png": "Dark Theme"
}
