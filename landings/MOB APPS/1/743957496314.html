        /* theme variables (light default) */
        .phone {
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary-blue: #2563EB;
            --primary-dark: #1E40AF;
            --accent-blue: #38BDF8;
            --icon-inactive: #94A3B8;
            --bottom-bg: #FFFFFF;
            --header-border: #E2E8F0;
            --progress-bg: #E2E8F0;
            --badge-bg: #DBEAFE;

        }

        .phone.dark {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary-blue: #3B82F6;
            --primary-dark: #2563EB;
            --accent-blue: #38BDF8;
            --icon-inactive: #64748B;
            --bottom-bg: #1E293B;
            --header-border: #334155;
            --progress-bg: #334155;
            --badge-bg: #1E3A5F;
            --shadow: 0 20px 30px -10px #020617;
        }

        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background 0.2s;
            border: 1px solid rgba(255,255,255,0.08);

        .app-header .title {

        .profile-icon {

        .profile-icon svg {

            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* main scrollable content */
        .screen-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px 8px;
            scrollbar-width: thin;
            background: var(--bg-primary);
        }

        /* bottom nav */
        .bottom-nav {
            background: var(--bottom-bg);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 4px 12px;

        }

        .nav-item {

        }

        .nav-item.active {
            background: rgba(37, 99, 235, 0.1);

        }

        .nav-icon {
            width: 28px;
            height: 28px;

        .nav-item.active .nav-icon {

        }

        }

        .nav-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: color 0.2s;
        }

        .nav-item.active .nav-label {
            color: var(--primary-blue);
            font-weight: 600;
        }

        /* UI components */
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            margin-bottom: 16px;
            border: 1px solid var(--border-light);
        }

        .logo-area {
            display: flex;
            align-items: center;

            margin-bottom: 16px;
        }

        .badge {
            background: var(--badge-bg);
            color: var(--primary-blue);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
        }

        .btn {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            transition: 0.1s;
        }
        .btn:active { background: var(--primary-dark); }

        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 16px 0 8px;
            color: var(--text-secondary);
            font-size: 13px;
        }
        .link-row span { cursor: pointer; text-decoration: underline; }

        .progress-bar {
            height: 10px;
            background: var(--progress-bg);
            border-radius: 20px;
            overflow: hidden;
            margin: 12px 0;
        }
        .progress-fill {
            height: 100%;
            width: 60%;
            background: var(--primary-blue);
            border-radius: 20px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        .modal {
            background: var(--bg-card);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            text-align: center;
            color: var(--text-primary);
        }
        .modal button {
            margin-top: 20px;
            background: var(--primary-blue);
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        /* custom icons inline */
        .flex-icon { display: flex; gap: 8px; align-items: center; }
        .theme-toggle { display: flex; gap: 12px; margin-top: 16px; }
        .theme-btn {
            flex:1; background: var(--bg-primary); border:1px solid var(--border-light);
            border-radius: 40px; padding: 8px; color: var(--text-primary); cursor: pointer;
        }
    </style>
</head>
<body>
<div class="phone light" id="phoneContainer">
    <div class="status-bar">
        <span>9:41</span>
        <span>📶 🔋 100%</span>
    </div>

    <!-- dynamic header injected by JS -->
    <div id="appHeader" class="app-header"></div>

    <!-- main screen views -->
    <div id="screenContainer" class="screen-container"></div>

    <!-- bottom navigation (static but JS handles active) -->
    <div class="bottom-nav" id="bottomNav"></div>

    <!-- modal for privacy/terms -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal" id="modalContent">
            <h3 id="modalTitle"></h3>
            <p id="modalBody"></p>
            <button id="closeModalBtn">Close</button>
        </div>
    </div>
</div>

<script>
    (function(){
        // ------ ICONS (inline svg, all outline 2px, rounded) ------
        const icons = {
            home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 L12 3 L21 10 L21 20 L3 20 L3 10Z"/><rect x="8" y="14" width="8" height="6"/></svg>`,
            learn: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6 L12 2 L22 6 L12 10 L2 6Z"/><path d="M6 12 L6 16 M18 12 L18 16 M12 10 L12 20"/></svg>`,
            progress: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12 A9 9 0 1 1 12 3"/><circle cx="12" cy="12" r="9"/><path d="M12 7 L12 12 L15 15"/></svg>`,
            settings: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 18a10 10 0 0 0 6.36-2.22z"/><path d="M16.5 6.5 16 8M6.5 6.5 7 8"/></svg>`,
            profile: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
            lesson: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6 L12 2 L22 6 L12 10 L2 6Z"/><path d="M6 12 L6 16 M18 12 L18 16 M12 10 L12 20"/></svg>`,
            chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2"/><path d="M7 10 L10 13 L14 9 L19 14"/></svg>`,
            flashcards: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 7 L16 7 M8 12 L16 12 M8 17 L13 17"/></svg>`,
            play: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>`,
            check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17L4 12"/></svg>`,
        };

        // ------ app state ------
        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
        let darkMode = false;
        let screenshotCounter = 0;
        const phoneEl = document.getElementById('phoneContainer');

        // ------ helper functions ------
        function setTheme(isDark) {
            darkMode = isDark;
            if (darkMode) {
                phoneEl.classList.remove('light');
                phoneEl.classList.add('dark');
            } else {
                phoneEl.classList.remove('dark');
                phoneEl.classList.add('light');
            }
            renderAll();
        }

        // show modal
        function showModal(title, text) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerText = text;
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        // ------ render screens ------
        function renderOnboarding() {
            return `
                <div class="card" style="text-align:center; padding:32px 20px;">
                    <div class="logo-area" style="justify-content:center;">
                        <span style="font-size:44px;">📘</span>
                        <span style="font-size:32px; font-weight:800; color:var(--primary-blue);">Vocab</span>
                    </div>
                    <h2 style="font-size:28px; margin:12px 0 8px;">English builder</h2>
                    <p style="color:var(--text-secondary); margin-bottom:20px;">Expand your vocabulary daily</p>
                    <p style="margin:12px 0 24px;">Master 3000+ words with spaced repetition & quizzes.</p>
                    <button class="btn" id="getStartedBtn">Get Started</button>
                    <div class="link-row">
                        <span id="privacyLink">Privacy Policy</span>
                        <span id="termsLink">Terms of Service</span>
                    </div>
                </div>
            `;
        }

        function renderHome() {
            return `
                <div class="card">
                    <div class="row"><span class="badge">🔥 5 day streak</span><span>⭐ 340 pts</span></div>
                    <h3 style="margin:12px 0 6px;">Continue lesson</h3>
                    <div style="background:var(--bg-primary); border-radius:18px; padding:14px;">
                        <div class="flex-icon"><span>📚 Phrasal verbs</span> <span style="margin-left:auto;">70%</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
                        <div class="flex-icon" style="margin-top:10px;">${icons.play}<span>Practice</span></div>
                    </div>
                </div>
                <div class="card">
                    <h4>Daily goal</h4>
                    <div class="progress-bar"><div class="progress-fill" style="width:40%"></div></div>
                    <div class="row"><span>15 new words</span><span>6/15</span></div>
                </div>
                <div class="card">
                    <div class="row"><span>📊 This week</span>${icons.chart}</div>
                    <div style="display:flex; gap:4px; justify-content:space-around; margin:10px 0;">
                        <div style="width:20px; height:40px; background:#2563EB40; border-radius:8px;"></div><div style="width:20px; height:60px; background:#2563EB80; border-radius:8px;"></div><div style="width:20px; height:30px; background:#2563EB30; border-radius:8px;"></div><div style="width:20px; height:70px; background:#2563EB; border-radius:8px;"></div><div style="width:20px; height:45px; background:#2563EB60; border-radius:8px;"></div>
                    </div>
                </div>
            `;
        }

        function renderLearn() {
            return `
                <div class="card">
                    <h3>Choose topic</h3>
                    <div style="margin:10px 0;">${icons.flashcards} Flashcards</div>
                    <div class="badge" style="margin:4px 0;">Business English</div>
                    <div class="badge">Idioms · 12 lessons</div>
                </div>
                <div class="card">
                    <div class="flex-icon">${icons.lesson} <span>Phrasal verbs · 5 min</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div>
                    <button class="btn" style="padding:10px;">Start lesson</button>
                </div>
                <div class="card">
                    <div class="flex-icon">${icons.lesson} Word families</div>
                    <div class="progress-bar"><div class="progress-fill" style="width:80%"></div></div>
                </div>
            `;
        }

        function renderProgress() {
            return `
                <div class="card">
                    <h3>Statistics</h3>
                    <div class="stat-grid">
                        <div style="background:var(--bg-primary); border-radius:20px; padding:12px;"><span>📅 23 days</span></div>
                        <div style="background:var(--bg-primary); border-radius:20px; padding:12px;"><span>🔥 1240 words</span></div>
                        <div style="background:var(--bg-primary); border-radius:20px; padding:12px;"><span>⭐ 89% mastery</span></div>
                        <div style="background:var(--bg-primary); border-radius:20px; padding:12px;"><span>⚡ 4h 12m</span></div>
                    </div>
                </div>
                <div class="card">
                    <span>Achievements</span>
                    <div style="display:flex; gap:12px; margin:12px 0;">
                        <span style="font-size:32px;">🏅</span><span style="font-size:32px;">🎖️</span><span style="font-size:32px;">🏆</span>
                    </div>
                </div>
            `;
        }

        function renderSettings() {
            return `
                <div class="card">
                    <h4>Settings</h4>
                    <div class="theme-toggle">
                        <button class="theme-btn" id="lightModeBtn">☀️ Light</button>
                        <button class="theme-btn" id="darkModeBtn">🌙 Dark</button>
                    </div>
                    <div style="margin:20px 0;">Notifications • Sound</div>
                    <div>App version 2.6 · English</div>
                    <hr style="border-color:var(--border-light); margin:16px 0;">
                    <div class="flex-icon">${icons.profile} My profile (click header)</div>
                </div>
            `;
        }

        function renderHeader() {
            const titles = { onboarding:'', home:'Home', learn:'Learn', progress:'Progress', settings:'Settings' };
            let title = titles[currentScreen] || '';
            if (currentScreen === 'onboarding') title = 'Welcome';
            return `
                <div class="title">${title}</div>
                <div class="profile-icon" id="profileHeaderBtn">${icons.profile}</div>
            `;
        }

        function renderBottomNav() {
            const items = ['home','learn','progress','settings'];
            const labels = ['Home','Learn','Progress','Settings'];
            return items.map((id, idx) => {
                const active = currentScreen === id ? 'active' : '';
                return `<div class="nav-item ${active}" data-screen="${id}">
                    <span class="nav-icon">${icons[id]}</span>
                    <span class="nav-label">${labels[idx]}</span>
                </div>`;
            }).join('');
        }

        function renderCurrentScreen() {
            const container = document.getElementById('screenContainer');
            if (currentScreen === 'onboarding') container.innerHTML = renderOnboarding();
            else if (currentScreen === 'home') container.innerHTML = renderHome();
            else if (currentScreen === 'learn') container.innerHTML = renderLearn();
            else if (currentScreen === 'progress') container.innerHTML = renderProgress();
            else if (currentScreen === 'settings') container.innerHTML = renderSettings();
        }

        function renderAll() {
            document.getElementById('appHeader').innerHTML = renderHeader();
            document.getElementById('bottomNav').innerHTML = renderBottomNav();
            renderCurrentScreen();

            // attach events after render
            if (currentScreen === 'onboarding') {
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                    currentScreen = 'home';
                    renderAll();
                });
                document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy Policy','We respect your data. No sharing.'));
                document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms of Service','Use app for lawful purposes only.'));
            }

            document.querySelectorAll('.nav-item').forEach(el => {
                el.addEventListener('click', (e)=>{
                    const screen = el.dataset.screen;
                    if (screen) { currentScreen = screen; renderAll(); }
                });
            });

            document.getElementById('profileHeaderBtn')?.addEventListener('click', ()=>{
                currentScreen = 'settings';
                renderAll();
            });

            // settings theme buttons
            document.getElementById('lightModeBtn')?.addEventListener('click', ()=> setTheme(false));
            document.getElementById('darkModeBtn')?.addEventListener('click', ()=> setTheme(true));

            // modal close
            document.getElementById('closeModalBtn').onclick = ()=> document.getElementById('modalOverlay').style.display = 'none';
        }

        // SHIFT + W screenshot capture (simulate)
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                screenshotCounter++;
                let filename = darkMode ? '6.png' : (screenshotCounter + '.png');
                if (darkMode) filename = '6.png';
                else if (screenshotCounter > 5) screenshotCounter = 1; 
                // simulate capture (real canvas would be complex, we just alert)
                alert(`📸 Screenshot captured: ${filename} (simulated)`);
            }
        });

        // start
        renderAll();
        // profile default click
    })();
</script>

<!-- modal overlay remains -->
<div id="modalOverlay" class="modal-overlay" style="display:none;">
    <div class="modal">
        <h3 id="modalTitle"></h3>
        <p id="modalBody"></p>
        <button id="closeModalBtn">Close</button>
    </div>
</div>

<!-- final JSON block -->
<pre style="display:none;"></pre>

    // output JSON at the end (as requested)
    (function(){
        const titles = {
            "1.png": "Start Learning",
            "2.png": "Daily Lessons",

        console.log(JSON.stringify(titles, null, 2));
        // also write to hidden div for final answer
        const out = document.createElement('pre');
        out.textContent = JSON.stringify(titles, null, 2);
        out.style = "white-space: pre-wrap; background:#111; color:#0f0; padding:10px;";
        document.body.appendChild(out);

</script>
