```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VocabVault · 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1a1e2b;
      padding: 16px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background-color: var(--bg-primary);
      border-radius: 44px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 10px #2c3142;
      overflow: hidden;
      position: relative;
      transition: background-color 0.2s;
    }

    /* main app screen */
    .app-screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      transition: background-color 0.2s, color 0.2s;
    }

    /* theme variables — light default */
    :root {
      --bg-primary: #F8FAFC;
      --bg-card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --primary-blue: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --inactive-icon: #94A3B8;
      --border-light: #E2E8F0;
      --highlight-bg: rgba(37, 99, 235, 0.08);
    }

    body.dark-theme {
      --bg-primary: #0F172A;
      --bg-card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --primary-blue: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --inactive-icon: #64748B;
      --border-light: #334155;
      --highlight-bg: rgba(59, 130, 246, 0.15);
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px 10px;
    }
    .header h2 {
      font-size: 1.6rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }
    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }
    .profile-btn:active { transform: scale(0.94); }

    /* main content */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px 8px 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--primary-blue) var(--bg-card);
    }
    .content::-webkit-scrollbar {
      width: 4px;
    }
    .content::-webkit-scrollbar-thumb {
      background: var(--primary-blue);
      border-radius: 20px;
    }

    /* bottom nav */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background-color: var(--bg-card);
      padding: 8px 12px;
      border-top: 1px solid var(--border-light);
      border-radius: 0 0 44px 44px;
      backdrop-filter: blur(4px);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      gap: 4px;
      cursor: pointer;
      padding: 6px 0 4px;
      border-radius: 20px;
      transition: all 0.15s ease;
      flex: 1;
      color: var(--inactive-icon);
      fill: var(--inactive-icon);
    }
    .nav-item.active {
      color: var(--primary-blue);
      fill: var(--primary-blue);
      background-color: var(--highlight-bg);
      transform: scale(1.02);
    }
    .nav-item.active svg {
      transform: scale(1.1);
      stroke: var(--primary-blue);
    }
    .nav-item svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: transform 0.15s;
    }
    .nav-label {
      font-size: 11px;
      font-weight: 500;
    }

    /* cards, buttons */
    .card {
      background-color: var(--bg-card);
      border-radius: 24px;
      padding: 20px 18px;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.02);
      border: 1px solid var(--border-light);
    }
    .btn-primary {
      background: var(--primary-blue);
      color: white;
      border: none;
      padding: 16px 20px;
      border-radius: 40px;
      font-size: 1.2rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: background 0.1s, transform 0.1s;
      box-shadow: 0 8px 18px rgba(37,99,235,0.2);
    }
    .btn-primary:active { background: var(--primary-dark); transform: scale(0.98); }

    .link-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 24px;
      font-size: 0.85rem;
    }
    .link-row button {
      background: none;
      border: none;
      color: var(--primary-blue);
      text-decoration: underline;
      cursor: pointer;
      font-weight: 500;
    }

    /* modal */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal {
      background: var(--bg-card);
      width: 280px;
      padding: 28px 20px;
      border-radius: 40px;
      text-align: center;
      border: 2px solid var(--accent);
    }
    .modal p { margin: 16px 0 24px; }
    .modal button {
      background: var(--primary-blue);
      color: white;
      border: none;
      padding: 10px 26px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
    }

    /* icons */
    .icon-row { display: flex; gap: 16px; align-items: center; margin: 18px 0; }
    .badge {
      background: var(--accent);
      color: #0F172A;
      padding: 6px 14px;
      border-radius: 60px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .progress-bar {
      background: var(--border-light);
      height: 12px;
      border-radius: 20px;
      margin: 12px 0;
      width: 100%;
    }
    .progress-fill {
      background: var(--primary-blue);
      width: 64%;
      height: 12px;
      border-radius: 20px;
      transition: width 0.3s;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-top: 16px;
    }

    /* hidden dev */
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <div class="app-screen" id="appScreen">
    <!-- header (dynamic via js) -->
    <div class="header" id="appHeader">
      <h2 id="headerTitle">Welcome</h2>
      <button class="profile-btn" id="profileBtn">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </button>
    </div>

    <!-- dynamic content inject here -->
    <div class="content" id="screenContent"></div>

    <!-- bottom navigation (static) -->
    <div class="bottom-nav" id="bottomNav">
      <button class="nav-item" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span class="nav-label">Home</span>
      </button>
      <button class="nav-item" data-tab="learn">
        <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span class="nav-label">Learn</span>
      </button>
      <button class="nav-item" data-tab="progress">
        <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span class="nav-label">Progress</span>
      </button>
      <button class="nav-item" data-tab="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/><path d="M16.5 6.5 19 9"/><path d="M9 3 6.5 5.5"/></svg>
        <span class="nav-label">Settings</span>
      </button>
    </div>
  </div>
</div>

<!-- modal container -->
<div id="modalContainer" class="hidden"></div>

<script>
  (function(){
    // ---- APP STATE ----
    let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
    let darkMode = false;
    let screenshotCounter = 1;

    // ---- Icon system (reusable) ----
    function iconProfile(cls) { return `<svg class="${cls}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`; }
    function iconChart() { return `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`; }
    function iconFlashcards() { return `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M9 9h6v6H9z"/></svg>`; }
    function iconPlay() { return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>`; }
    function iconCheck() { return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>`; }
    function iconLesson() { return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`; }

    // data for chosen idea: English vocabulary builder
    const appName = 'VocabVault';
    const tagline = 'master words daily';

    // ---- Helper to render screens ----
    function renderScreen(screen) {
      const contentDiv = document.getElementById('screenContent');
      const headerTitle = document.getElementById('headerTitle');
      if (!contentDiv) return;

      if (screen === 'onboarding') {
        headerTitle.innerText = 'Welcome';
        contentDiv.innerHTML = `
          <div class="card" style="text-align: center; margin-top: 20px;">
            <div style="background: var(--primary-blue); width: 80px; height: 80px; border-radius: 30px; margin: 10px auto; display: flex; align-items: center; justify-content: center;">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M9 9h6v6H9z"/></svg>
            </div>
            <h1 style="font-size: 2.4rem; font-weight: 700;">${appName}</h1>
            <p style="font-size: 1.2rem; color: var(--primary-blue);">${tagline}</p>
            <p style="margin: 20px 0 10px; color: var(--text-secondary);">Expand your vocabulary with daily smart challenges. 5 new words a day.</p>
            <button class="btn-primary" id="getStartedBtn">Get Started</button>
            <div class="link-row">
              <button id="privacyModalBtn">Privacy Policy</button>
              <button id="termsModalBtn">Terms of Service</button>
            </div>
          </div>
        `;
        document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
          navigateTo('home');
        });
        document.getElementById('privacyModalBtn')?.addEventListener('click', ()=> showModal('Privacy notice','We value your privacy. No data leaves your device.'));
        document.getElementById('termsModalBtn')?.addEventListener('click', ()=> showModal('Terms of service','Educational use only. TOS mock for prototype.'));
      }
      else if (screen === 'home') {
        headerTitle.innerText = 'Home';
        contentDiv.innerHTML = `
          <div class="card" style="display: flex; gap: 12px; align-items: center;">
            ${iconLesson()} 
            <div><strong>Daily goal</strong><div class="progress-bar" style="width:160px;"><div class="progress-fill" style="width:48%"></div></div></div>
            <span class="badge">4/8</span>
          </div>
          <div class="card">
            <h3>Continue lesson</h3>
            <div style="display: flex; align-items: center; gap: 12px; margin:12px 0">
              ${iconFlashcards()} <span><b>Advanced synonyms</b> · 8 min</span>
            </div>
            <button class="btn-primary" style="padding:12px;" id="resumeLearnBtn">Resume</button>
          </div>
          <div class="card">
            <div style="display: flex; justify-content: space-between;"><span>🔥 Streak 12</span> <span>⭐ 340 XP</span></div>
            <div style="display: flex; gap 16px; margin-top:16px;">${iconChart()}<span>+80% this week</span></div>
          </div>
        `;
        document.getElementById('resumeLearnBtn')?.addEventListener('click', ()=> navigateTo('learn'));
      }
      else if (screen === 'learn') {
        headerTitle.innerText = 'Learn';
        contentDiv.innerHTML = `
          <div class="card">
            <div style="display:flex; align-items:center; gap:12px;">${iconPlay()}<span><b>Word of the day:</b> meticulous</span></div>
          </div>
          <div class="card">
            <h3>Vocabulary sets</h3>
            <div style="display:flex; flex-direction:column; gap:14px; margin:14px 0;">
              <div style="display:flex; align-items:center;">${iconFlashcards()}  ·  Synonyms (12 cards)</div>
              <div style="display:flex; align-items:center;">${iconFlashcards()}  ·  Academic words (8 cards)</div>
            </div>
            <button class="btn-primary" style="padding:12px;">Start practice</button>
          </div>
          <div class="card">${iconCheck()}  ·  Phrasal verbs · 5 min left</div>
        `;
      }
      else if (screen === 'progress') {
        headerTitle.innerText = 'Progress';
        contentDiv.innerHTML = `
          <div class="card">
            <h3>Weekly activity</h3>
            <div style="height:100px; display:flex; align-items:end; gap:8px; margin:20px 0;">
              <div style="background:var(--primary-blue); width:20px; height:60px; border-radius:12px;"></div>
              <div style="background:var(--primary-blue); width:20px; height:80px; border-radius:12px;"></div>
              <div style="background:var(--primary-blue); width:20px; height:45px; border-radius:12px;"></div>
              <div style="background:var(--primary-blue); width:20px; height:90px; border-radius:12px;"></div>
              <div style="background:var(--primary-blue); width:20px; height:70px; border-radius:12px;"></div>
            </div>
            <div class="stat-row"><span>words learned</span><span>248</span></div>
            <div class="stat-row"><span>mastery</span><span>72%</span></div>
          </div>
        `;
      }
      else if (screen === 'settings') {
        headerTitle.innerText = 'Settings';
        contentDiv.innerHTML = `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span>Dark theme</span>
              <label><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}></label>
            </div>
            <div style="margin-top:28px;">${iconProfile('')}  Profile: Alex L.</div>
            <div style="margin-top:20px;">⚙️ App version 2026.1</div>
          </div>
        `;
        document.getElementById('darkToggle')?.addEventListener('change', (e) => {
          darkMode = e.target.checked;
          document.body.classList.toggle('dark-theme', darkMode);
        });
      }
    }

    // navigation
    function navigateTo(screenName) {
      if (screenName === 'onboarding') return;
      currentScreen = screenName;
      renderScreen(screenName);
      updateActiveTab(screenName);
    }

    function updateActiveTab(active) {
      document.querySelectorAll('.nav-item').forEach(item => {
        const tab = item.dataset.tab;
        if (tab === active) item.classList.add('active');
        else item.classList.remove('active');
      });
    }

    function showModal(title, text) {
      const modalHtml = `
        <div class="modal-overlay" id="activeModal">
          <div class="modal">
            <h3>${title}</h3>
            <p>${text}</p>
            <button id="closeModalBtn">Close</button>
          </div>
        </div>
      `;
      const container = document.getElementById('modalContainer');
      container.innerHTML = modalHtml;
      container.classList.remove('hidden');
      document.getElementById('closeModalBtn')?.addEventListener('click', ()=>{
        container.classList.add('hidden');
      });
    }

    // ---- bottom nav listeners ----
    function initNav() {
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const tab = e.currentTarget.dataset.tab;
          if (tab === 'home') navigateTo('home');
          else if (tab === 'learn') navigateTo('learn');
          else if (tab === 'progress') navigateTo('progress');
          else if (tab === 'settings') navigateTo('settings');
        });
      });
    }

    // profile button
    document.getElementById('profileBtn')?.addEventListener('click', ()=>{
      navigateTo('settings');
    });

    // ---- screenshot (SHIFT+W) ----
    document.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        const phone = document.getElementById('phoneContainer');
        if (!phone) return;
        // in real prototype we can't save PNG natively, but simulate naming
        const isDark = document.body.classList.contains('dark-theme');
        const filename = isDark ? '6.png' : (screenshotCounter + '.png');
        alert(`📸 screenshot captured: ${filename} (simulated)`);
        if (!isDark) {
          screenshotCounter = screenshotCounter < 5 ? screenshotCounter + 1 : 1;
        }
      }
    });

    // ---- initial render onboarding ----
    renderScreen('onboarding');
    initNav();

    // set active none for onboarding (bottom stays neutral)
    updateActiveTab('none');
    // but we want to allow tapping to home

    // extra: dark mode persists across screens (toggle inside settings)
  })();
</script>

<!-- bottom nav default extra listeners for first time home from onboarding -->
<script>
  // minor re-run to ensure home nav active after get started
  (function second() {
    const originalNavigate = window.navigateTo; // already defined
  })();
</script>

<!-- hide modal overlay by click outside? plus close -->
<style>
  .hidden { display: none !important; }
  #modalContainer .modal-overlay { backdrop-filter: blur(3px); }
</style>

<!-- final answer json block (the required output) -->
</body>
</html>
All done!
