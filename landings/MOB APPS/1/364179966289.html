```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaFlow · vocabulary builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* CSS variables — light mode default */
        :root {
            --bg-page: #F1F5F9;
            --bg-phone: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --text-muted: #64748B;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --border-light: #E2E8F0;
            --icon-inactive: #94A3B8;
            --nav-highlight: rgba(37, 99, 235, 0.08);
            --progress-bg: #E2E8F0;
            --progress-fill: #2563EB;
            --badge-bg: #DBEAFE;
            --badge-text: #1E40AF;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
        }

        body.dark {
            --bg-page: #0A0F1C;
            --bg-phone: #0F172A;
            --card-bg: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --text-muted: #94A3B8;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --border-light: #334155;
            --icon-inactive: #64748B;
            --nav-highlight: rgba(59, 130, 246, 0.15);
            --progress-bg: #334155;
            --progress-fill: #3B82F6;
            --badge-bg: #1E3A5F;
            --badge-text: #90CAF9;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
        }

        body {
            background: var(--bg-page);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg-phone);
            border-radius: 48px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.25), 0 0 0 8px #1E293B;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
        }

        /* main screen wrapper */
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--icon-inactive) var(--bg-phone);
            padding-bottom: 4px;
        }

        .screen::-webkit-scrollbar {
            width: 4px;
        }
        .screen::-webkit-scrollbar-thumb {
            background: var(--icon-inactive);
            border-radius: 20px;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px 8px 20px;
        }
        .header h2 {
            font-size: 22px;
            font-weight: 650;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .profile-btn {
            background: none;
            border: none;
            padding: 8px 4px;
            cursor: pointer;
        }
        .profile-btn svg {
            stroke: var(--text-primary);
            width: 28px;
            height: 28px;
            transition: stroke 0.1s;
        }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 12px 14px 12px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-light);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px 12px 4px 12px;
            border-radius: 20px;
            transition: all 0.2s ease;
            gap: 4px;
        }
        .nav-item.active {
            background: var(--nav-highlight);
            transform: scale(1.05);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2px;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: all 0.15s;
        }
        .nav-item.active svg {
            stroke: var(--primary);
            transform: scale(1.15);
        }
        .nav-item.inactive svg {
            stroke: var(--icon-inactive);
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            transition: color 0.15s;
        }
        .nav-item.active .nav-label {
            color: var(--primary);
        }
        .nav-item.inactive .nav-label {
            color: var(--icon-inactive);
        }

        /* cards & UI elements */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 18px;
            margin: 12px 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }

        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .badge {
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
        }

        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 20px;
            margin: 10px 0;
        }
        .progress-fill {
            height: 8px;
            background: var(--progress-fill);
            border-radius: 20px;
            width: 60%;
            transition: width 0.3s ease;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }
        .stat-item {
            background: var(--bg-phone);
            padding: 14px;
            border-radius: 20px;
            text-align: center;
        }

        .lesson-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .lesson-item:last-child {
            border-bottom: none;
        }

        /* modal overlay */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-card {
            background: var(--card-bg);
            width: 280px;
            padding: 28px 24px;
            border-radius: 36px;
            text-align: center;
            color: var(--text-primary);
        }
        .modal-card button {
            margin-top: 20px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 18px;
            width: 100%;
            margin: 12px 0 8px 0;
            cursor: pointer;
        }

        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .link-row span {
            cursor: pointer;
            text-decoration: underline;
        }

        /* onboarding specific */
        .logo-big svg {
            width: 64px;
            height: 64px;
            stroke: var(--primary);
            stroke-width: 1.8;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic screens injected via JS -->
    <div id="app" class="screen"></div>
    <!-- bottom nav (static but controlled by js) -->
    <div class="bottom-nav" id="bottomNav">
        <button class="nav-item inactive" data-screen="home">
            <svg id="icon-home" viewBox="0 0 24 24"><path d="M3 10L12 3L21 10L21 20H15V14H9V20H3V10Z" /></svg>
            <span class="nav-label">Home</span>
        </button>
        <button class="nav-item inactive" data-screen="learn">
            <svg id="icon-learn" viewBox="0 0 24 24"><path d="M12 5L4 9L12 13L20 9L12 5Z M4 14L12 18L20 14 M4 11V17L12 21L20 17V11" /></svg>
            <span class="nav-label">Learn</span>
        </button>
        <button class="nav-item inactive" data-screen="progress">
            <svg id="icon-progress" viewBox="0 0 24 24"><path d="M21 12C21 13.2 20.5 14.2 19.7 15.1C18.9 15.9 17.8 16.5 16.5 16.8C15.2 17.1 13.8 17.1 12.1 16.9 M21 12C21 16.97 16.97 21 12 21M21 12H17M12 21C7.03 21 3 16.97 3 12C3 7.03 7.03 3 12 3M12 21V17M12 3C16.97 3 21 7.03 21 12M12 3V7M3 12H7M7.3 7.3L4.5 4.5M16.7 7.3L19.5 4.5" /></svg>
            <span class="nav-label">Progress</span>
        </button>
        <button class="nav-item inactive" data-screen="settings">
            <svg id="icon-settings" viewBox="0 0 24 24"><path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z M19.4 15.5L18.5 18.6L15.4 19.4L12 21L8.6 19.4L5.5 18.5L4.6 15.4L3 12L4.6 8.6L5.5 5.5L8.6 4.6L12 3L15.4 4.6L18.5 5.5L19.4 8.6L21 12L19.4 15.5Z" /></svg>
            <span class="nav-label">Settings</span>
        </button>
    </div>
    <!-- modals (privacy & terms) -->
    <div id="privacyModal" class="modal"><div class="modal-card"><h3>Privacy</h3><p>We respect your data. No tracking.</p><button id="closePrivacy">OK</button></div></div>
    <div id="termsModal" class="modal"><div class="modal-card"><h3>Terms of Service</h3><p>Use LinguaFlow for daily vocabulary.</p><button id="closeTerms">OK</button></div></div>
</div>

<script>
    (function() {
        // ---------- icon registry ----------
        const icons = {
            profile: '<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
            lesson: '<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
            chart: '<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><path d="M21 12v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/><path d="M15 9l6-6"/><circle cx="9" cy="15" r="1"/><path d="M15 3h6v6"/></svg>',
            flashcards: '<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><path d="M4 4h16v16H4z"/><path d="M9 8h6v2H9zM9 12h6v2H9zM9 16h4v2H9z"/></svg>',
            play: '<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16" fill="currentColor"/></svg>',
            check: '<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><path d="M20 6L9 17l-5-5"/></svg>',
        };

        // screen definitions (onboarding, home, learn, progress, settings)
        let currentScreen = 'onboarding'; // start with onboarding
        let darkMode = false;

        const themeToggle = () => {
            darkMode = !darkMode;
            document.body.classList.toggle('dark', darkMode);
        };

        // helper: render active screen
        function renderScreen(screenId) {
            const app = document.getElementById('app');
            if (screenId === 'onboarding') app.innerHTML = renderOnboarding();
            else if (screenId === 'home') app.innerHTML = renderHome();
            else if (screenId === 'learn') app.innerHTML = renderLearn();
            else if (screenId === 'progress') app.innerHTML = renderProgress();
            else if (screenId === 'settings') app.innerHTML = renderSettings();
            else if (screenId === 'profile') app.innerHTML = renderProfile(); // special case

            // update header title
            updateHeaderTitle(screenId);
            // update bottom nav active state
            updateNav(screenId);
        }

        function updateHeaderTitle(screenId) {
            // we re-bind header buttons after each render
            const profileBtn = document.querySelector('.profile-btn');
            if (profileBtn) profileBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                goToProfile();
            });
        }

        function goToProfile() {
            currentScreen = 'profile';
            renderScreen('profile');
        }

        function updateNav(active) {
            const navMap = { 'home':0, 'learn':1, 'progress':2, 'settings':3 };
            const idx = navMap[active];
            document.querySelectorAll('.nav-item').forEach((item, i) => {
                if (i === idx) {
                    item.classList.remove('inactive');
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                    item.classList.add('inactive');
                }
            });
        }

        // onboarding screen
        function renderOnboarding() {
            return `
                <div class="header">
                    <h2>Welcome</h2>
                    <button class="profile-btn" id="profileBtnHeader">${icons.profile}</button>
                </div>
                <div style="flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 20px;">
                    <div class="logo-big">${icons.flashcards.replace('stroke="currentColor"', 'stroke="var(--primary)"')}</div>
                    <h1 style="font-size:40px; font-weight:700; color:var(--primary);">LinguaFlow</h1>
                    <p style="font-size:18px; color:var(--text-secondary); margin:8px 0 4px;">Build your vocabulary</p>
                    <p style="color:var(--text-muted); margin:16px 0;">Master 5000+ English words daily. Quick, fun and smart.</p>
                    <button class="btn-primary" id="getStartedBtn">Get Started</button>
                    <div class="link-row">
                        <span id="privacyLink">Privacy</span>
                        <span id="termsLink">Terms</span>
                    </div>
                </div>
            `;
        }

        // home dashboard
        function renderHome() {
            return `
                <div class="header">
                    <h2>Home</h2>
                    <button class="profile-btn">${icons.profile}</button>
                </div>
                <div class="card" style="margin-top:4px;">
                    <div class="flex-row"><span class="badge">🔥 7 day streak</span><span>⭐ 340 XP</span></div>
                    <div style="font-size:20px; font-weight:600;">Hello, Alex 👋</div>
                    <div style="margin:16px 0 8px;">Daily goal: 20 words</div>
                    <div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div>
                    <div style="display:flex; gap:12px; margin-top:16px;">
                        <button class="nav-item" style="background:var(--nav-highlight);padding:10px 20px;" id="quickPractice">${icons.play} Practice</button>
                    </div>
                </div>
                <div class="card">
                    <div class="flex-row"><span>📘 Recommended</span><span>→</span></div>
                    <div class="lesson-item">${icons.lesson} Essential verbs · 8 min</div>
                    <div class="lesson-item">${icons.flashcards} Food & restaurant · 5 min</div>
                </div>
            `;
        }

        // learn screen
        function renderLearn() {
            return `
                <div class="header">
                    <h2>Learn</h2>
                    <button class="profile-btn">${icons.profile}</button>
                </div>
                <div class="card">
                    <h3 style="margin-bottom:12px;">Today’s lessons</h3>
                    <div class="lesson-item"><span>${icons.play} Business 1</span> <span>75%</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div>
                    <div class="lesson-item"><span>${icons.flashcards} Travel 2</span> <span>30%</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div>
                </div>
                <div class="card">
                    <span>🎧 Listening practice</span>
                    <div class="lesson-item">${icons.play} Office dialogue</div>
                </div>
            `;
        }

        // progress screen
        function renderProgress() {
            return `
                <div class="header">
                    <h2>Progress</h2>
                    <button class="profile-btn">${icons.profile}</button>
                </div>
                <div class="card">
                    <div class="flex-row"><span>📊 This week</span><span>+240 XP</span></div>
                    <div class="stat-grid">
                        <div class="stat-item">🔥 7 days</div>
                        <div class="stat-item">🏆 89%</div>
                    </div>
                </div>
                <div class="card">
                    <span>${icons.chart} Mastery level</span>
                    <div class="progress-bar" style="margin:16px 0;"><div class="progress-fill" style="width:64%"></div></div>
                    <div>words: 480 / 750</div>
                </div>
                <div class="card">
                    <span>🏅 Achievements (3)</span>
                </div>
            `;
        }

        // settings/profile screen
        function renderSettings() {
            return `
                <div class="header">
                    <h2>Settings</h2>
                    <button class="profile-btn">${icons.profile}</button>
                </div>
                <div class="card">
                    <div class="flex-row"><span>🌙 Dark mode</span><label><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}></label></div>
                    <div class="flex-row" style="margin-top:18px;">🔔 Notifications</div>
                    <div class="flex-row">🌐 Language</div>
                </div>
            `;
        }

        function renderProfile() {
            return `
                <div class="header">
                    <h2>Profile</h2>
                    <button class="profile-btn">${icons.profile}</button>
                </div>
                <div class="card" style="text-align:center;">
                    ${icons.profile.replace('width="24"', 'width="64" height="64"')}
                    <h3>Alex Chen</h3>
                    <p class="badge">INTERMEDIATE</p>
                </div>
                <div class="card"><span>📧 alex@example.com</span></div>
                <button class="btn-primary" id="backToHome" style="margin:20px;">← Back to Home</button>
            `;
        }

        // navigation listeners
        function attachNavListeners() {
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const screen = e.currentTarget.dataset.screen;
                    if (screen) {
                        currentScreen = screen;
                        renderScreen(screen);
                    }
                });
            });
            // get started
            const getStarted = document.getElementById('getStartedBtn');
            if (getStarted) getStarted.addEventListener('click', () => {
                currentScreen = 'home';
                renderScreen('home');
            });
            // privacy & terms
            document.getElementById('privacyLink')?.addEventListener('click', () => document.getElementById('privacyModal').style.display = 'flex');
            document.getElementById('termsLink')?.addEventListener('click', () => document.getElementById('termsModal').style.display = 'flex');
            document.getElementById('closePrivacy')?.addEventListener('click', () => document.getElementById('privacyModal').style.display = 'none');
            document.getElementById('closeTerms')?.addEventListener('click', () => document.getElementById('termsModal').style.display = 'none');
            // dark toggle
            const darkChk = document.getElementById('darkToggle');
            if (darkChk) darkChk.addEventListener('change', themeToggle);
            // back to home (profile)
            document.getElementById('backToHome')?.addEventListener('click', () => {
                currentScreen = 'home';
                renderScreen('home');
            });
            // quick practice
            document.getElementById('quickPractice')?.addEventListener('click', ()=>{
                currentScreen = 'learn';
                renderScreen('learn');
            });
        }

        // initial render
        renderScreen('onboarding');
        attachNavListeners();

        // screenshot hotkey SHIFT+W
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                // dummy capture simulation (real screenshot requires libraries, but we follow spec)
                let seq = darkMode ? 6 : (currentScreen === 'onboarding' ? 1 : currentScreen === 'home' ? 2 : currentScreen === 'learn' ? 3 : currentScreen === 'progress' ? 4 : 5);
                if (darkMode) seq = 6;
                alert(`📸 Screenshot saved as ${seq}.png (demo — real capture needs html2canvas)`);
            }
        });

        // final: modal background click
        window.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) e.target.style.display = 'none';
        });
    })();
</script>

<!-- bottom nav must stay functional -->
</body>
</html>
All done!
