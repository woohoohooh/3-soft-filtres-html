```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Playground • 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1e293b;
      padding: 12px;
    }
    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background-color: var(--bg-primary);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 0 8px #334155;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s;
    }
    /* theme variables */
    .light {
      --bg-primary: #F8FAFC;
      --bg-card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --border-light: #E2E8F0;
      --primary: #2563EB;
      --primary-hover: #1D4ED8;
      --accent: #38BDF8;
      --inactive-icon: #94A3B8;
      --header-bg: #FFFFFFCC;
      --bottom-bg: #FFFFFFF0;
      --shadow-sm: 0 4px 12px rgba(0,0,0,0.02);
      --progress-bg: #E2E8F0;
    }
    .dark {
      --bg-primary: #0F172A;
      --bg-card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #94A3B8;
      --border-light: #334155;
      --primary: #3B82F6;
      --primary-hover: #2563EB;
      --accent: #38BDF8;
      --inactive-icon: #64748B;
      --header-bg: #1E293BCC;
      --bottom-bg: #1E293BF0;
      --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
      --progress-bg: #334155;
    }
    /* main flex column */
    .phone > * {
      flex-shrink: 0;
    }
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 8px 20px;
      background: transparent;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      background-color: var(--header-bg);
      border-bottom: 1px solid var(--border-light);
      z-index: 5;
    }
    .app-header h1 {
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -0.3px;
      color: var(--text-primary);
    }
    .profile-btn {
      background: none;
      border: none;
      padding: 8px 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .profile-btn svg {
      width: 28px;
      height: 28px;
      stroke: var(--primary);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* main content scroll */
    .screen-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 8px 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--primary) var(--bg-card);
    }
    .screen-container::-webkit-scrollbar {
      width: 4px;
    }
    .screen-container::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 20px;
    }
    /* bottom navigation */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 12px 12px;
      background: transparent;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background-color: var(--bottom-bg);
      border-top: 1px solid var(--border-light);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 30px;
      transition: all 0.2s ease;
      color: var(--inactive-icon);
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nav-item.active {
      color: var(--primary);
      background-color: rgba(37, 99, 235, 0.12);
      transform: scale(1.05);
    }
    .nav-item svg {
      width: 26px;
      height: 26px;
      transition: transform 0.15s;
    }
    .nav-item.active svg {
      transform: scale(1.15);
      stroke-width: 2.4;
    }
    .nav-item span {
      font-size: 11px;
      font-weight: 500;
      color: currentColor;
    }
    /* cards & components */
    .card {
      background-color: var(--bg-card);
      border-radius: 24px;
      padding: 18px 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
    }
    .flex-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .lesson-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .lesson-item:last-child { border: none; }
    .progress-bar {
      height: 8px;
      background-color: var(--progress-bg);
      border-radius: 20px;
      overflow: hidden;
      width: 100%;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      width: 0%;
      border-radius: 20px;
      transition: width 0.3s ease;
    }
    .badge {
      background: rgba(37, 99, 235, 0.1);
      padding: 6px 14px;
      border-radius: 40px;
      color: var(--primary);
      font-weight: 600;
      font-size: 13px;
    }
    /* modal overlay */
    .modal {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .modal-content {
      background: var(--bg-card);
      padding: 32px 24px;
      border-radius: 36px;
      width: 280px;
      text-align: center;
      color: var(--text-primary);
      border: 1px solid var(--border-light);
    }
    .modal-content button {
      margin-top: 20px;
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 40px;
      cursor: pointer;
    }
    /* onboarding */
    .logo-big {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }
    .big-icon svg {
      width: 72px;
      height: 72px;
      stroke: var(--primary);
      stroke-width: 1.8;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      width: 100%;
      padding: 18px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 60px;
      margin: 24px 0 16px;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 8px 20px rgba(37,99,235,0.3);
    }
    .btn-primary:active { transform: scale(0.98); background: var(--primary-hover); }
    .link-row {
      display: flex;
      gap: 24px;
      justify-content: center;
    }
    .link-row button {
      background: none;
      border: none;
      color: var(--primary);
      text-decoration: underline;
      font-size: 14px;
      cursor: pointer;
    }
    /* chart mimic */
    .chart-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 100px;
      margin-top: 16px;
    }
    .chart-bar {
      flex: 1;
      background: var(--primary);
      height: calc(30% + 10px);
      border-radius: 12px 12px 4px 4px;
      opacity: 0.7;
      transition: height 0.3s;
    }
    /* dark/light toggle */
    .theme-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .theme-toggle button {
      flex:1;
      padding: 12px;
      border-radius: 40px;
      border: 1px solid var(--border-light);
      background: var(--bg-card);
      color: var(--text-primary);
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="phone light" id="phoneContainer">
  <!-- header (dynamic via js) -->
  <div class="app-header" id="appHeader">
    <h1 id="headerTitle">Onboarding</h1>
    <button class="profile-btn" id="profileBtn">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </button>
  </div>

  <!-- main content -->
  <div class="screen-container" id="screenContainer">
    <!-- injected via JS -->
  </div>

  <!-- bottom nav (hidden on onboarding) -->
  <div class="bottom-nav" id="bottomNav" style="display: none;">
    <button class="nav-item" data-screen="home"><svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2h-5v-8H10v8H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></button>
    <button class="nav-item" data-screen="learn"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span>Learn</span></button>
    <button class="nav-item" data-screen="progress"><svg viewBox="0 0 24 24"><path d="M21 12v2a9 9 0 0 1-9 9 9 9 0 0 1-9-9 9 9 0 0 1 9-9h2"/><path d="M15 9h6V3"/><path d="M21 9l-7 7-4-4-3 3"/></svg><span>Progress</span></button>
    <button class="nav-item" data-screen="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/><path d="M16.5 6.5 12 2 7.5 6.5"/></svg><span>Settings</span></button>
  </div>

  <!-- modal container for privacy/terms -->
  <div class="modal" id="modalOverlay">
    <div class="modal-content" id="modalContent">
      <h3 id="modalTitle">Title</h3>
      <p id="modalBody">dummy</p>
      <button id="modalClose">Close</button>
    </div>
  </div>
</div>

<script>
(function() {
  // ---------------------------- ICONS (inline SVG strings) ---------------------
  const icons = {
    profile: '<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
    home: '<svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2h-5v-8H10v8H5a2 2 0 0 1-2-2z"/></svg>',
    learn: '<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
    progress: '<svg viewBox="0 0 24 24"><path d="M21 12v2a9 9 0 0 1-9 9 9 9 0 0 1-9-9 9 9 0 0 1 9-9h2"/><path d="M15 9h6V3"/><path d="M21 9l-7 7-4-4-3 3"/></svg>',
    settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/><path d="M16.5 6.5 12 2 7.5 6.5"/></svg>',
    lesson: '<svg viewBox="0 0 24 24"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="10"/></svg>',
    chart: '<svg viewBox="0 0 24 24"><path d="M21 16v4H3v-4"/><path d="M7 12v4"/><path d="M11 8v8"/><path d="M15 4v12"/></svg>',
    flashcards: '<svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="15" y2="14"/></svg>',
    play: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>',
    check: '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>',
  };

  // ----- state
  let currentScreen = 'onboarding';
  let isDark = false;
  let screenshotCounter = 1;

  const container = document.getElementById('phoneContainer');
  const headerTitle = document.getElementById('headerTitle');
  const screenDiv = document.getElementById('screenContainer');
  const bottomNav = document.getElementById('bottomNav');
  const profileBtn = document.getElementById('profileBtn');
  const modal = document.getElementById('modalOverlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalBody = document.getElementById('modalBody');
  const modalClose = document.getElementById('modalClose');

  // ----- helper: apply theme class
  function setTheme(dark) {
    if (dark) {
      container.classList.remove('light');
      container.classList.add('dark');
    } else {
      container.classList.remove('dark');
      container.classList.add('light');
    }
    isDark = dark;
  }

  // ----- show modal
  function showModal(title, text) {
    modalTitle.innerText = title;
    modalBody.innerText = text;
    modal.style.display = 'flex';
  }

  modalClose.addEventListener('click', () => {
    modal.style.display = 'none';
  });

  // ----- navigation
  function navigate(screen) {
    if (screen === 'onboarding') {
      bottomNav.style.display = 'none';
    } else {
      bottomNav.style.display = 'flex';
    }
    currentScreen = screen;
    renderScreen(screen);

    // update bottom nav active
    document.querySelectorAll('.nav-item').forEach(btn => {
      const scr = btn.dataset.screen;
      if (scr === screen) btn.classList.add('active');
      else btn.classList.remove('active');
    });

    // header title
    if (screen === 'onboarding') headerTitle.innerText = 'Welcome';
    else if (screen === 'home') headerTitle.innerText = 'Dashboard';
    else if (screen === 'learn') headerTitle.innerText = 'Python Labs';
    else if (screen === 'progress') headerTitle.innerText = 'Your stats';
    else if (screen === 'settings') headerTitle.innerText = 'Settings & profile';
  }

  // ----- render screens
  function renderScreen(screen) {
    if (screen === 'onboarding') screenDiv.innerHTML = renderOnboarding();
    else if (screen === 'home') screenDiv.innerHTML = renderHome();
    else if (screen === 'learn') screenDiv.innerHTML = renderLearn();
    else if (screen === 'progress') screenDiv.innerHTML = renderProgress();
    else if (screen === 'settings') screenDiv.innerHTML = renderSettings();
  }

  // onboarding
  function renderOnboarding() {
    return `
      <div class="card" style="text-align:center; padding:32px 20px;">
        <div class="logo-big big-icon">${icons.lesson.replace('24 24','64 64')}</div>
        <h1 style="font-size:40px; font-weight:700; color: var(--primary);">PyRocket</h1>
        <p style="font-size:18px; margin:8px 0 4px; color: var(--text-primary);">learn Python · 3 min a day</p>
        <p style="color: var(--text-secondary); margin:8px 0 24px;">Bite-sized coding exercises, flashcards & smart practice. From zero to hero.</p>
        <button class="btn-primary" id="getStartedBtn">Get Started</button>
        <div class="link-row">
          <button id="privacyBtn">Privacy Policy</button>
          <button id="termsBtn">Terms of Service</button>
        </div>
      </div>
    `;
  }

  // home dashboard
  function renderHome() {
    return `
      <div class="card">
        <div class="flex-row"><span style="font-weight:600;">🔥 daily streak</span><span class="badge">12 days</span></div>
        <div class="progress-bar" style="margin:12px 0 6px;"><div class="progress-fill" style="width:70%"></div></div>
        <p style="color: var(--text-secondary);">2 lessons left today</p>
      </div>
      <div class="card">
        <div class="flex-row"><span style="font-weight:600;">📘 continue</span><span>${icons.play} practice</span></div>
        <div class="lesson-item"><span>💡 variables & data types</span> <span>80%</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:80%"></div></div>
        <div class="lesson-item"><span>🔁 loops (for/while)</span> <span>45%</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div>
        <button class="btn-primary" style="margin-top:20px; padding:14px;" id="resumeLearnBtn">resume learning</button>
      </div>
      <div class="card flex-row" style="gap:8px;">
        <span>🏆 achievements</span><span>⚡ 3/10</span>
      </div>
    `;
  }

  // learn / practice
  function renderLearn() {
    return `
      <div class="card">
        <h3 style="margin-bottom:12px;">🐍 Python basics</h3>
        <div class="lesson-item">${icons.lesson} <span>1. print & comments</span><span class="badge">free</span></div>
        <div class="lesson-item">${icons.lesson} <span>2. variables</span><span class="badge">80%</span></div>
        <div class="lesson-item">${icons.flashcards} <span>3. flashcards: types</span><span class="badge">new</span></div>
        <div class="lesson-item">${icons.play} <span>4. interactive quiz</span><span class="badge">⚡</span></div>
      </div>
      <div class="card">
        <div class="flex-row"><span>🧠 daily brain teaser</span>${icons.flashcards}</div>
        <p style="margin:8px 0;">What will be the output of: print(2 ** 3) ?</p>
        <button class="btn-primary" style="padding:12px;" id="showAnswer">show answer</button>
      </div>
    `;
  }

  // progress stats
  function renderProgress() {
    return `
      <div class="card">
        <div class="flex-row"><span>📊 total xp</span><span>2,450 XP</span></div>
        <div class="chart-row" id="chartBars">
          <div class="chart-bar" style="height:40px;"></div><div class="chart-bar" style="height:70px;"></div><div class="chart-bar" style="height:55px;"></div><div class="chart-bar" style="height:90px;"></div><div class="chart-bar" style="height:30px;"></div>
        </div>
      </div>
      <div class="card">
        <p>✅ completed: 18 lessons</p>
        <p>⏱️ time spent: 4.2 h</p>
        <p>🔥 streak: 12 days</p>
      </div>
    `;
  }

  // settings
  function renderSettings() {
    return `
      <div class="card">
        <div class="flex-row"><span>👤 display name</span><span>pythonista</span></div>
        <div class="flex-row" style="margin-top:16px;"><span>🌗 theme</span></div>
        <div class="theme-toggle">
          <button id="setLightBtn" ${!isDark ? 'style="background:var(--primary);color:white;"' : ''}>Light</button>
          <button id="setDarkBtn" ${isDark ? 'style="background:var(--primary);color:white;"' : ''}>Dark</button>
        </div>
        <div class="lesson-item">🔔 notifications</div>
        <div class="lesson-item">🔒 account</div>
        <div class="lesson-item">📞 support</div>
      </div>
    `;
  }

  // ----- event listeners after each render
  function attachScreenEvents() {
    if (currentScreen === 'onboarding') {
      document.getElementById('getStartedBtn')?.addEventListener('click', () => navigate('home'));
      document.getElementById('privacyBtn')?.addEventListener('click', () => showModal('Privacy Policy', 'We protect your data like our own code. No selling.'));
      document.getElementById('termsBtn')?.addEventListener('click', () => showModal('Terms of Service', 'Keep learning, be nice. Acceptable use only.'));
    }
    if (currentScreen === 'home') {
      document.getElementById('resumeLearnBtn')?.addEventListener('click', () => navigate('learn'));
    }
    if (currentScreen === 'learn') {
      document.getElementById('showAnswer')?.addEventListener('click', () => alert('Answer: 8 (2 ** 3 = 2³)'));
    }
    if (currentScreen === 'settings') {
      document.getElementById('setLightBtn')?.addEventListener('click', () => { setTheme(false); renderScreen('settings'); attachScreenEvents(); });
      document.getElementById('setDarkBtn')?.addEventListener('click', () => { setTheme(true); renderScreen('settings'); attachScreenEvents(); });
    }
    // profile click anywhere
    profileBtn.onclick = () => navigate('settings');
  }

  // bottom nav listeners
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const screen = btn.dataset.screen;
      if (screen) navigate(screen);
    });
  });

  // ----- screenshot (shift+W)
  window.addEventListener('keydown', (e) => {
    if (e.shiftKey && e.key === 'W') {
      e.preventDefault();
      // simulate capture (in real html2canvas not included, but we increment name)
      let name = isDark ? '6.png' : (screenshotCounter + '.png');
      if (isDark) name = '6.png';
      else {
        if (screenshotCounter > 5) screenshotCounter = 1;
        name = screenshotCounter + '.png';
        screenshotCounter++;
      }
      alert(`📸 screenshot saved as ${name} (simulated)`);
    }
  });

  // initial render
  setTheme(false); // light default
  navigate('onboarding');
  attachScreenEvents();

  // re-attach after each navigation
  const originalNavigate = navigate;
  window.navigate = function(screen) {
    originalNavigate(screen);
    attachScreenEvents();
  };
