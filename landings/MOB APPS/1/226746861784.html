```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeMentor · Python · mobile prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1e2b;
            padding: 12px;
        }
        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --border: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --grey: #94A3B8;
            --grey-light: #E2E8F0;
            --shadow: 0 20px 35px -8px rgba(0,0,0,0.1), 0 4px 8px rgba(0,0,0,0.05);
            --bottom-bar: #FFFFFF;
            --progress-bg: #E2E8F0;
            --active-tab-bg: rgba(37,99,235,0.08);
            --icon-inactive: #94A3B8;
        }
        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --border: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --grey: #64748B;
            --grey-light: #334155;
            --shadow: 0 20px 30px -8px rgba(0,0,0,0.8);
            --bottom-bar: #1E293B;
            --progress-bg: #334155;
            --active-tab-bg: rgba(59,130,246,0.15);
            --icon-inactive: #94A3B8;
        }
        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 44px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 10px #2c3e50;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background 0.2s;
        }
        .screen-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 18px 8px 18px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--grey-light);
        }
        .screen-area::-webkit-scrollbar {
            width: 4px;
        }
        .screen-area::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 20px;
        }
        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            padding: 0 2px;
        }
        .header h2 {
            font-size: 22px;
            font-weight: 620;
            letter-spacing: -0.3px;
            color: var(--text);
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 4px 2px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-btn svg {
            width: 28px;
            height: 28px;
            stroke: var(--text);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        /* bottom navigation */
        .bottom-nav {
            background: var(--bottom-bar);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 6px 10px;
            box-shadow: 0 -4px 8px rgba(0,0,0,0.02);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 0 4px;
            border-radius: 18px;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.1);
            color: var(--icon-inactive);
            fill: none;
            stroke: var(--icon-inactive);
        }
        .nav-item.active {
            background: var(--active-tab-bg);
            color: var(--primary);
            stroke: var(--primary);
            transform: scale(1.02);
        }
        .nav-item.active svg {
            stroke: var(--primary);
            transform: scale(1.15);
            transition: transform 0.15s;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-bottom: 3px;
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            color: currentColor;
        }
        /* cards / UI elements */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 16px 18px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .flex-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .icon-svg {
            width: 44px;
            height: 44px;
            stroke: var(--primary);
            stroke-width: 1.8;
            fill: none;
        }
        .btn-primary {
            background: var(--primary);
            border: none;
            border-radius: 60px;
            padding: 16px 28px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 8px 18px var(--primary-dark)40;
            transition: 0.1s;
        }
        .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-top: 16px;
            font-size: 13px;
        }
        .link-row button {
            background: none;
            border: none;
            color: var(--grey);
            text-decoration: underline;
            cursor: pointer;
            font-size: 13px;
        }
        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 40px;
            margin: 12px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 40px;
            transition: width 0.3s ease;
        }
        .badge {
            background: var(--accent)20;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            color: var(--primary);
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--card);
            width: 280px;
            padding: 28px 20px;
            border-radius: 36px;
            text-align: center;
            color: var(--text);
        }
        .hidden { display: none; }
        /* lesson row */
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 16px 0;
        }
        .lesson-item svg { stroke: var(--primary); }
        .pill {
            background: var(--grey-light);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
        }
        .chart-line {
            display: flex;
            align-items: flex-end;
            height: 70px;
            gap: 8px;
            margin: 16px 0 8px;
        }
        .chart-bar {
            flex: 1;
            background: linear-gradient(to top, var(--primary), var(--accent));
            border-radius: 12px 12px 6px 6px;
            transition: height 0.4s;
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- screens will be injected via js -->
    <div id="app" class="screen-area"></div>
    <!-- bottom nav fixed -->
    <div class="bottom-nav" id="bottomNav"></div>
</div>

<script>
    (function() {
        // ----- THEME & STATE -----
        let darkMode = false;
        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
        let screenIndex = 0; // for sequential screenshot naming

        // ---------- ICON SYSTEM (inline svg) ----------
        const icons = {
            home: `<svg viewBox="0 0 24 24"><path d="M5 12H3L12 3L21 12H19" /><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" /><rect x="9" y="15" width="6" height="4" rx="1" /></svg>`,
            learn: `<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" /><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /></svg>`,
            progress: `<svg viewBox="0 0 24 24"><path d="M21 12v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><rect x="3" y="4" width="18" height="12" rx="2" /><path d="M7 10v2" /><path d="M12 8v4" /><path d="M17 6v6" /></svg>`,
            settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>`,
            profile: `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>`,
            lesson: `<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" /><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /></svg>`,
            chart: `<svg viewBox="0 0 24 24"><path d="M21 12v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><rect x="3" y="4" width="18" height="12" rx="2" /><path d="M7 10v2" /><path d="M12 8v4" /><path d="M17 6v6" /></svg>`,
            flashcards: `<svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2" ry="2" /><path d="M8 7h8" /><path d="M8 11h6" /><path d="M8 15h4" /></svg>`,
            play: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><polygon points="10 8 16 12 10 16 10 8" fill="currentColor" /></svg>`,
            check: `<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" /></svg>`
        };

        // ----- helper render icon -----
        function renderIcon(name, className = '') {
            return icons[name] || icons.home;
        }

        // ----- theme toggle -----
        function toggleTheme() {
            darkMode = !darkMode;
            document.body.classList.toggle('dark', darkMode);
            renderScreen(currentScreen);
        }

        // ----- modal mock -----
        let activeModal = null;
        function showModal(text) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.id = 'genericModal';
            modal.innerHTML = `<div class="modal-content"><h3 style="margin-bottom:12px;">${text}</h3><button class="btn-primary" style="padding:10px; width:auto; margin-top:8px;" onclick="this.closest('.modal').remove()">OK</button></div>`;
            document.querySelector('.phone').appendChild(modal);
        }
        window.showModal = showModal;

        // ----- navigation -----
        function navigate(screen) {
            currentScreen = screen;
            renderScreen(screen);
        }

        // ----- bottom nav update + custom icons -----
        function renderBottomNav(active) {
            const navEl = document.getElementById('bottomNav');
            const items = [
                { id: 'home', label: 'Home', icon: 'home' },
                { id: 'learn', label: 'Learn', icon: 'learn' },
                { id: 'progress', label: 'Progress', icon: 'progress' },
                { id: 'settings', label: 'Settings', icon: 'settings' }
            ];
            navEl.innerHTML = items.map(item => {
                const isActive = (active === item.id);
                return `<button class="nav-item ${isActive ? 'active' : ''}" data-screen="${item.id}">
                    ${icons[item.icon]}
                    <span class="nav-label">${item.label}</span>
                </button>`;
            }).join('');
            navEl.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const screen = btn.dataset.screen;
                    navigate(screen);
                });
            });
        }

        // ----- header generator -----
        function renderHeader(title) {
            return `<div class="header"><h2>${title}</h2><button class="profile-btn" id="profileHeaderBtn">${icons.profile}</button></div>`;
        }

        // ========== SCREEN CONTENT ==========
        function getOnboardingHTML() {
            return `
                ${renderHeader('Welcome')}
                <div style="text-align: center; margin-top: 24px;">
                    <div style="background:var(--primary); width:80px; height:80px; border-radius:28px; margin:0 auto 16px; display:flex; align-items:center; justify-content:center;">
                        <svg width="48" height="48" viewBox="0 0 24 24" stroke="white" stroke-width="2" fill="none">${icons.learn.match('<path.*?>.*?</path>')}</svg>
                    </div>
                    <h1 style="font-size:32px; font-weight:700; color:var(--primary);">CodeMentor</h1>
                    <p style="font-size:18px; margin:8px 0 12px;">Python, simplified.</p>
                    <p style="color:var(--text-light); margin-bottom:36px;">Bite-sized coding & interactive exercises. Master Python from scratch.</p>
                    <button class="btn-primary" id="getStartedBtn">Get Started</button>
                    <div class="link-row">
                        <button onclick="showModal('Privacy: we protect your data')">Privacy</button>
                        <button onclick="showModal('Terms: use with care')">Terms</button>
                    </div>
                </div>
            `;
        }

        function getHomeHTML() {
            return `
                ${renderHeader('Dashboard')}
                <div class="card">
                    <div class="flex-row">
                        <svg width="44" height="44" stroke="var(--primary)" fill="none">${icons.flashcards}</svg>
                        <div><h3 style="font-size:18px;">Daily streak</h3><p style="color:var(--primary);">12 days 🔥</p></div>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
                    <span class="badge">+120 XP today</span>
                </div>
                <div class="card">
                    <h3>Continue learning</h3>
                    <div class="lesson-item">
                        <svg width="32" height="32">${icons.lesson}</svg>
                        <div><b>Functions & scope</b><p>lesson 4/7</p></div>
                        <span class="pill">78%</span>
                    </div>
                    <div class="lesson-item">
                        <svg width="32" height="32">${icons.play}</svg>
                        <div><b>Lists methods</b><p>practice</p></div>
                        <span class="pill">start</span>
                    </div>
                    <button class="btn-primary" style="padding:12px;" onclick="navigate('learn')">View all lessons</button>
                </div>
                <div class="card">
                    <div class="flex-row"><svg width="28">${icons.chart}</svg><span>recommended: Dictionaries</span></div>
                </div>
            `;
        }

        function getLearnHTML() {
            return `
                ${renderHeader('Learn Python')}
                <div class="card">
                    <h3>Basics</h3>
                    <div class="lesson-item"><span>1. Variables</span> <span class="badge">✅</span></div>
                    <div class="lesson-item"><span>2. Strings</span> <span class="badge">✅</span></div>
                    <div class="lesson-item"><span>3. Lists & loops</span> <span class="badge">progress</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:40%"></div></div>
                </div>
                <div class="card">
                    <h3>Intermediate</h3>
                    <div class="lesson-item"><span>⚡ Functions</span> <span class="pill">start</span></div>
                    <div class="lesson-item"><span>⚡ Dicts</span> <span class="pill">start</span></div>
                </div>
                <button class="btn-primary" style="margin-top:4px;" onclick="alert('quick practice')">Quick practice →</button>
            `;
        }

        function getProgressHTML() {
            return `
                ${renderHeader('Statistics')}
                <div class="card stat-grid">
                    <div><span style="font-size:28px; font-weight:700;">34</span><br>lessons done</div>
                    <div><span style="font-size:28px;">870</span><br>total XP</div>
                </div>
                <div class="card">
                    <p>Weekly activity</p>
                    <div class="chart-line">
                        <div class="chart-bar" style="height:30px;"></div><div class="chart-bar" style="height:48px;"></div><div class="chart-bar" style="height:22px;"></div><div class="chart-bar" style="height:60px;"></div><div class="chart-bar" style="height:40px;"></div>
                    </div>
                </div>
                <div class="card"><span class="badge">🏆 5 day streak</span><div class="progress-bar" style="margin-top:12px;"><div class="progress-fill" style="width:60%"></div></div></div>
            `;
        }

        function getSettingsHTML() {
            return `
                ${renderHeader('Settings')}
                <div class="card">
                    <div style="display:flex; justify-content:space-between;"><span>Dark mode</span><button id="themeToggleBtn" style="background:var(--primary); color:white; border:none; border-radius:30px; padding:6px 18px;">${darkMode ? 'light' : 'dark'}</button></div>
                </div>
                <div class="card"><div>Profile</div><div style="color:var(--grey);">mentor@example.com</div></div>
                <div class="card"><div>Notifications</div><div>🔔 on</div></div>
                <div class="card"><div>Sound</div><div>✅</div></div>
                <button class="btn-primary" style="margin-top:12px;" onclick="showModal('Profile saved')">Update profile</button>
            `;
        }

        function renderScreen(screen) {
            const app = document.getElementById('app');
            let content = '';
            if (screen === 'onboarding') content = getOnboardingHTML();
            else if (screen === 'home') content = getHomeHTML();
            else if (screen === 'learn') content = getLearnHTML();
            else if (screen === 'progress') content = getProgressHTML();
            else if (screen === 'settings') content = getSettingsHTML();

            app.innerHTML = content;
            renderBottomNav(screen === 'onboarding' ? 'home' : screen); // onboarding -> highlight home

            // attach profile btn
            const profileBtn = document.getElementById('profileHeaderBtn');
            if (profileBtn) profileBtn.addEventListener('click', () => navigate('settings'));

            if (screen === 'onboarding') {
                document.getElementById('getStartedBtn').addEventListener('click', () => navigate('home'));
            }
            if (screen === 'settings') {
                document.getElementById('themeToggleBtn').addEventListener('click', (e) => {
                    toggleTheme();
                    e.target.innerText = darkMode ? 'light' : 'dark';
                });
            }
        }

        // ----- screenshot capture (shift+W) -----
        document.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm').then((mod) => {
                    mod.default(phone, { scale: 2, backgroundColor: darkMode ? '#0F172A' : '#F8FAFC' }).then(canvas => {
                        const link = document.createElement('a');
                        screenIndex = (screenIndex % 5) + 1;
                        let name = darkMode ? '6.png' : (screenIndex + '.png');
                        link.download = name;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    });
                }).catch(() => alert('html2canvas load failed, but capture triggered.'));
            }
        });

        // ----- init -----
        renderScreen('onboarding');
    })();
</script>
</body>
</html>
All done!
