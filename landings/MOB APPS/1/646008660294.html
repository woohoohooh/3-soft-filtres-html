```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabVault · English builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --border: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.03);
            --header-icon: #1E293B;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --border: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --shadow: 0 8px 20px rgba(0,0,0,0.5);
            --header-icon: #F1F5F9;
        }

        body {
            background: #11141c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
        }

        /* phone shell */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 44px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 10px #2c313a;
            overflow: hidden;
            position: relative;
            transition: background-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--border);
            padding: 16px 16px 8px 16px;
            background: var(--bg);
        }

        .screen::-webkit-scrollbar {
            width: 4px;
        }
        .screen::-webkit-scrollbar-track {
            background: var(--border);
        }
        .screen::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 20px;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 16px 0;
        }
        .header h2 {
            font-size: 24px;
            font-weight: 650;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--header-icon);
        }

        /* bottom nav */
        .bottom-nav {
            background: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 6px 8px 10px;
            box-shadow: var(--shadow);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            color: var(--inactive);
            fill: var(--inactive);
            font-size: 11px;
            font-weight: 500;
            gap: 4px;
            padding: 6px 0 2px;
            border-radius: 30px;
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            transform: scale(1.05);
            background: rgba(37, 99, 235, 0.08);
        }
        .nav-item.active svg {
            filter: drop-shadow(0 2px 4px rgba(37,99,235,0.2));
        }
        .nav-icon {
            width: 24px;
            height: 24px;
        }

        /* cards */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .row-space {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 50px;
        }

        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 24px;
            border-radius: 60px;
            width: 100%;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 8px 14px -6px var(--primary);
            transition: 0.1s;
        }
        .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }

        /* progress */
        .progress-bar {
            height: 8px;
            background: var(--border);
            border-radius: 20px;
            margin: 10px 0;
        }
        .progress-fill {
            height: 8px;
            background: var(--primary);
            border-radius: 20px;
            width: 0%;
            transition: width 0.3s;
        }

        /* modal */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.15s;
        }
        .modal.show {
            visibility: visible;
            opacity: 1;
        }
        .modal-content {
            background: var(--card);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            color: var(--text);
            text-align: center;
        }
        .modal-close {
            margin-top: 16px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        /* chart simulation */
        .chart-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 100px;
            margin: 16px 0;
        }
        .chart-bar {
            flex: 1;
            background: var(--primary);
            height: 0%;
            min-height: 4px;
            border-radius: 12px 12px 6px 6px;
            transition: height 0.4s;
        }

        /* icon set */
        .icon-outline {
            stroke-width: 2px;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }
        .toggle-switch {
            width: 48px;
            height: 26px;
            background: var(--inactive);
            border-radius: 40px;
            position: relative;
            cursor: pointer;
        }
        .toggle-switch.active {
            background: var(--primary);
        }
        .toggle-switch::after {
            content: '';
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 22px;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: 0.15s;
        }
        .toggle-switch.active::after {
            left: 24px;
        }

        /* links */
        .legal-links {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 16px 0 8px;
            font-size: 13px;
        }
        .legal-links button {
            background: none;
            border: none;
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic screens injected via JS -->
    <div id="app" class="screen" style="padding-bottom: 8px;"></div>
    <!-- bottom nav -->
    <div class="bottom-nav" id="bottomNav">
        <button class="nav-item" data-screen="home"><span class="nav-icon" id="icon-home"></span><span>Home</span></button>
        <button class="nav-item" data-screen="learn"><span class="nav-icon" id="icon-learn"></span><span>Learn</span></button>
        <button class="nav-item" data-screen="progress"><span class="nav-icon" id="icon-progress"></span><span>Progress</span></button>
        <button class="nav-item" data-screen="settings"><span class="nav-icon" id="icon-settings"></span><span>Settings</span></button>
    </div>

    <!-- modal dialogs -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <p id="modal-text" style="margin-bottom:16px;">Privacy policy · dummy text</p>
            <button class="modal-close" id="closeModal">OK</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- ICON SYSTEM (inline SVG) ----------
        const icons = {
            home: `<svg viewBox="0 0 24 24" class="icon-outline" width="24" height="24"><path d="M5 12l-2 2v6a2 2 0 002 2h14a2 2 0 002-2v-6l-2-2" /><path d="M10 21v-6h4v6M3 10l9-7 9 7"/></svg>`,
            learn: `<svg viewBox="0 0 24 24" class="icon-outline" width="24" height="24"><path d="M2 4h6a4 4 0 014 4v12a4 4 0 00-4-4H2zM22 4h-6a4 4 0 00-4 4v12a4 4 0 014-4h6z"/><path d="M12 8v12"/></svg>`,
            progress: `<svg viewBox="0 0 24 24" class="icon-outline" width="24" height="24"><path d="M21 12v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5-5 5 5M12 3v12"/><path d="M3 18h18v2H3z"/></svg>`,
            settings: `<svg viewBox="0 0 24 24" class="icon-outline" width="24" height="24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H5.78a1.65 1.65 0 00-1.51 1 1.65 1.65 0 00.33 1.82l.04.04A10 10 0 0012 17.66a10 10 0 006.36-2.62zM4.6 9a1.65 1.65 0 00-.33 1.82c.26.61.85.99 1.51 1h12.44a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.04-.04A10 10 0 0012 6.34a10 10 0 00-6.36 2.62z"/></svg>`,
            profile: `<svg viewBox="0 0 24 24" class="icon-outline" width="24" height="24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
            lesson: `<svg viewBox="0 0 24 24" class="icon-outline" width="20" height="20"><path d="M4 6h16M4 12h16M4 18h10"/></svg>`,
            chart: `<svg viewBox="0 0 24 24" class="icon-outline" width="20" height="20"><path d="M21 16v2a2 2 0 01-2 2H5a2 2 0 01-2-2v-2M7 10l3-3 3 3 4-4"/><path d="M17 10V4h-6"/></svg>`,
            flashcards: `<svg viewBox="0 0 24 24" class="icon-outline" width="20" height="20"><path d="M4 6h16v12H4z"/><path d="M8 4v4M16 4v4"/></svg>`,
            play: `<svg viewBox="0 0 24 24" class="icon-outline" width="20" height="20"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4V8z"/></svg>`,
            check: `<svg viewBox="0 0 24 24" class="icon-outline" width="20" height="20"><path d="M20 6L9 17l-5-5"/></svg>`
        };

        function injectIcons() {
            for (let [key, svg] of Object.entries(icons)) {
                let el = document.getElementById(`icon-${key}`);
                if (el) el.innerHTML = svg;
            }
            // profile icon inside header
            document.querySelectorAll('.profile-icon-place').forEach(el => el.innerHTML = icons.profile);
        }

        // ---------- state ----------
        let currentScreen = 'onboarding'; // initial forced
        let darkMode = false;

        // ---------- render navigation ----------
        function setActiveNav(screenId) {
            document.querySelectorAll('.nav-item').forEach(btn => {
                let navScreen = btn.getAttribute('data-screen');
                if (navScreen === screenId) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }

        // ---------- screen renderers ----------
        function renderOnboarding() {
            return `
                <div class="header"><h2>VocabVault</h2><button class="profile-btn" id="profileHeaderBtn"><span class="profile-icon-place"></span></button></div>
                <div style="text-align: center; margin-top: 30px;">
                    <div style="background:var(--primary); width:70px;height:70px;border-radius:22px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;color:white;font-size:40px;">📘</div>
                    <h1 style="font-size:36px; font-weight:700; color:var(--text);">VocabVault</h1>
                    <p style="font-size:18px; color:var(--accent); margin:6px 0 10px;">master English daily</p>
                    <p style="color:var(--text-light); margin-bottom:32px;">Build vocabulary with smart flashcards & daily challenges. 5 min a day.</p>
                    <button class="btn-primary" id="startBtn">Get Started</button>
                    <div class="legal-links">
                        <button id="privacyBtn">Privacy Policy</button>
                        <button id="termsBtn">Terms of Service</button>
                    </div>
                </div>
            `;
        }

        function renderHome() {
            return `
                <div class="header"><h2>Home</h2><button class="profile-btn" id="profileHeaderBtn"><span class="profile-icon-place"></span></button></div>
                <div class="card" style="background:linear-gradient(145deg, var(--primary), var(--accent)); color:white;"><div style="font-size:20px;font-weight:600;">streak: 12 days 🔥</div><div>daily goal: 20 words</div><div class="progress-bar" style="background:rgba(255,255,255,0.3)"><div class="progress-fill" style="width:65%; background:white;"></div></div></div>
                <div class="card"><div class="row-space"><span style="font-weight:600;">next lesson</span><span class="badge">intermediate</span></div><p>🔥 phrasal verbs · 5 min</p><button class="btn-primary" style="padding:10px;" id="quickLearn">start practice</button></div>
                <div class="card"><div class="row-space"><span>📊 weekly activity</span><span>+84%</span></div><div class="chart-row"><div style="height:40px;" class="chart-bar"></div><div style="height:70px;" class="chart-bar"></div><div style="height:55px;" class="chart-bar"></div><div style="height:90px;" class="chart-bar"></div><div style="height:30px;" class="chart-bar"></div><div style="height:65px;" class="chart-bar"></div><div style="height:80px;" class="chart-bar"></div></div></div>
                <div class="card" style="display:flex; gap:10px;"><span class="badge">word of the day</span><div style="font-size:22px;">✨ ubiquitous</div><div>/juːˈbɪkwɪtəs/</div></div>
            `;
        }

        function renderLearn() {
            return `
                <div class="header"><h2>Learn</h2><button class="profile-btn" id="profileHeaderBtn"><span class="profile-icon-place"></span></button></div>
                <div class="card"><div class="row-space"><span>📘 vocabulary builder</span><span>85%</span></div><div class="progress-bar"><div class="progress-fill" style="width:85%"></div></div><p style="margin:8px 0">1,240 words mastered</p><button class="btn-primary" style="padding:10px;" id="continueLesson">continue</button></div>
                <div class="card"><div class="row-space"><span>📕 idioms master</span><span>3/10</span></div><div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div></div>
                <div class="card"><span style="display:flex; gap:8px;">🎧 listening practice <span class="badge">new</span></span><p style="margin:10px 0">6 min · colloquial expressions</p></div>
            `;
        }

        function renderProgress() {
            return `
                <div class="header"><h2>Progress</h2><button class="profile-btn" id="profileHeaderBtn"><span class="profile-icon-place"></span></button></div>
                <div class="card"><div class="row-space"><span>total words learned</span><span>1,872</span></div><div class="progress-bar"><div class="progress-fill" style="width:72%"></div></div></div>
                <div class="card"><div class="row-space"><span>🏅 achievements</span></div><div style="display:flex; gap:12px;"><span>🔥 7d streak</span><span>⚡ quick learner</span></div></div>
                <div class="card"><span>📈 last 30 days</span><div class="chart-row"><div style="height:50px;" class="chart-bar"></div><div style="height:70px;" class="chart-bar"></div><div style="height:40px;" class="chart-bar"></div><div style="height:90px;" class="chart-bar"></div><div style="height:60px;" class="chart-bar"></div></div></div>
            `;
        }

        function renderSettings() {
            return `
                <div class="header"><h2>Settings</h2><button class="profile-btn" id="profileHeaderBtn"><span class="profile-icon-place"></span></button></div>
                <div class="card">
                    <div class="settings-item"><span>🌙 Dark mode</span><div id="darkToggle" class="toggle-switch ${darkMode ? 'active' : ''}"></div></div>
                    <div class="settings-item"><span>🔔 Notifications</span><div class="toggle-switch active"></div></div>
                    <div class="settings-item"><span>🔒 Privacy</span><span>></span></div>
                    <div class="settings-item"><span>📲 App version 2.4.1</span></div>
                </div>
                <div class="card"><span>👤 Profile (from header)</span><div style="margin-top:10px">name: Alex Chen</div><div>member since 2025</div></div>
            `;
        }

        function renderScreen() {
            const appDiv = document.getElementById('app');
            if (!appDiv) return;
            if (currentScreen === 'onboarding') appDiv.innerHTML = renderOnboarding();
            else if (currentScreen === 'home') appDiv.innerHTML = renderHome();
            else if (currentScreen === 'learn') appDiv.innerHTML = renderLearn();
            else if (currentScreen === 'progress') appDiv.innerHTML = renderProgress();
            else if (currentScreen === 'settings') appDiv.innerHTML = renderSettings();

            injectIcons();

            // re-attach listeners
            document.getElementById('profileHeaderBtn')?.addEventListener('click', ()=> { currentScreen='settings'; renderScreen(); setActiveNav('settings'); });
            document.getElementById('startBtn')?.addEventListener('click', ()=> { currentScreen='home'; renderScreen(); setActiveNav('home'); });
            document.getElementById('privacyBtn')?.addEventListener('click', ()=> showModal('Privacy: we respect your data (demo)'));
            document.getElementById('termsBtn')?.addEventListener('click', ()=> showModal('Terms: use wisely (demo)'));
            document.getElementById('quickLearn')?.addEventListener('click', ()=> { currentScreen='learn'; renderScreen(); setActiveNav('learn'); });
            document.getElementById('continueLesson')?.addEventListener('click', ()=> alert('start lesson simulation'));
            const darkToggle = document.getElementById('darkToggle');
            if (darkToggle) darkToggle.addEventListener('click', toggleDark);
        }

        // ---------- modal ----------
        const modal = document.getElementById('modal');
        const modalText = document.getElementById('modal-text');
        window.showModal = (msg) => {
            modalText.innerText = msg;
            modal.classList.add('show');
        };
        document.getElementById('closeModal').addEventListener('click', ()=> modal.classList.remove('show'));

        // ---------- dark mode ----------
        function toggleDark() {
            darkMode = !darkMode;
            document.body.classList.toggle('dark', darkMode);
            const toggleEl = document.getElementById('darkToggle');
            if (toggleEl) toggleEl.classList.toggle('active', darkMode);
            renderScreen();  // keep consistency
        }

        // ---------- bottom nav ----------
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const screen = btn.getAttribute('data-screen');
                if (screen) {
                    currentScreen = screen;
                    renderScreen();
                    setActiveNav(screen);
                }
            });
        });

        // initial onboarding
        renderScreen();
        setActiveNav('onboarding');  // no bottom highlight for onboarding

        // screenshot SHIFT+W
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                if (!phone) return;
                // simplified: in real app would use html2canvas, but here we simulate file name increment.
                // since it's a demo, we console log and alert the file name based on dark mode.
                let filename = darkMode ? '6.png' : (Math.floor(Math.random()*5)+1)+'.png'; // dummy
                alert(`📸 screenshot saved as ${filename} (simulated)`);
            }
        });

        // prefill icons for bottom
        (function initBottomIcons() {
            document.getElementById('icon-home').innerHTML = icons.home;
            document.getElementById('icon-learn').innerHTML = icons.learn;
            document.getElementById('icon-progress').innerHTML = icons.progress;
            document.getElementById('icon-settings').innerHTML = icons.settings;
        })();

    })();
</script>
</body>
</html>
All done!
