```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pythonix – Learn Python • 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --border: #E2E8F0;
            --icon-inactive: #94A3B8;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            --header-bg: rgba(255,255,255,0.8);
            --bottom-bg: rgba(255,255,255,0.9);
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #94A3B8;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --border: #334155;
            --icon-inactive: #64748B;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
            --header-bg: rgba(30,41,59,0.8);
            --bottom-bg: rgba(30,41,59,0.9);
        }

        body {
            background: #1a1e2b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3), 0 0 0 8px #2c303a;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s;
        }

        /* content wrapper */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--border);
            padding-bottom: 8px;
        }

        .app-screen::-webkit-scrollbar {
            width: 4px;
        }
        .app-screen::-webkit-scrollbar-track { background: var(--border); }
        .app-screen::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 20px; }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px 8px 20px;
            background: var(--header-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header h2 {
            font-size: 1.3rem;
            font-weight: 650;
            color: var(--text);
            letter-spacing: -0.02em;
        }
        .profile-icon {
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            transition: background 0.1s;
        }
        .profile-icon:hover { background: var(--border); }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 10px;
            background: var(--bottom-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid var(--border);
            border-radius: 0 0 44px 44px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 30px;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            color: var(--icon-inactive);
            fill: var(--icon-inactive);
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            background: rgba(37, 99, 235, 0.08);
            transform: scale(1.02);
        }
        .nav-item.active svg {
            transform: scale(1.15);
            filter: drop-shadow(0 2px 4px rgba(37,99,235,0.2));
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.15s;
        }
        .nav-item span {
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* main content */
        .screen-content {
            padding: 16px 20px 20px 20px;
            flex: 1;
        }

        /* onboarding card */
        .onboard-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
            gap: 16px;
        }
        .logo-icon svg {
            width: 64px;
            height: 64px;
            stroke: var(--primary);
            stroke-width: 2;
            fill: none;
        }
        .app-name {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }
        .tagline {
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--text);
        }
        .description {
            color: var(--text-light);
            text-align: center;
            line-height: 1.5;
            margin: 8px 0 28px;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 60px;
            box-shadow: 0 10px 20px -5px rgba(37,99,235,0.3);
            transition: 0.1s;
            cursor: pointer;
        }
        .btn-primary:active { transform: scale(0.97); background: var(--primary-dark); }
        .legal-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 32px 0 20px;
            font-size: 0.85rem;
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
        }

        /* dashboard cards */
        .stats-row {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--card);
            padding: 14px;
            border-radius: 24px;
            flex: 1;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .stat-label {
            color: var(--text-light);
            font-size: 0.75rem;
        }
        .stat-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
        }
        .progress-bar {
            height: 8px;
            background: var(--border);
            border-radius: 20px;
            margin: 12px 0 6px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 60%;
            background: var(--primary);
            border-radius: 20px;
        }

        .lesson-item {
            background: var(--card);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 4px 10px;
            border-radius: 60px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* modal */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .modal-content {
            background: var(--card);
            padding: 28px 24px;
            border-radius: 32px;
            max-width: 280px;
            color: var(--text);
            border: 1px solid var(--border);
            box-shadow: 0 30px 40px #00000030;
        }

        /* hidden canvas for screenshot */
        #shot-canvas { display: none; }

        /* extras */
        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0;
            border-bottom: 1px solid var(--border);
        }
        .toggle-switch {
            width: 46px;
            height: 24px;
            background: var(--border);
            border-radius: 60px;
            position: relative;
            cursor: pointer;
        }
        .toggle-switch::after {
            content: '';
            width: 20px; height: 20px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px; left: 2px;
            transition: 0.2s;
        }
        .dark .toggle-switch::after { left: 24px; background: var(--primary); }

        .chart-placeholder {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 100px;
            margin-top: 16px;
        }
        .bar {
            flex: 1;
            background: var(--primary);
            border-radius: 12px 12px 4px 4px;
            transition: height 0.3s;
        }
    </style>
</head>
<body>
    <div class="phone" id="phoneContainer">
        <!-- dynamic header injected via js -->
        <div id="header-placeholder" class="header"></div>

        <!-- main screen content -->
        <div id="screen-root" class="app-screen"></div>

        <!-- bottom nav -->
        <div class="bottom-nav" id="bottomNav">
            <div class="nav-item" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 L3 10 Z"/></svg><span>Home</span></div>
            <div class="nav-item" data-tab="learn"><svg viewBox="0 0 24 24"><path d="M2 3 L12 3 L12 21 L2 21 L2 3 Z"/><path d="M12 7 L22 7 L22 21 L12 21 L12 7 Z"/></svg><span>Learn</span></div>
            <div class="nav-item" data-tab="progress"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7 L12 12 L15 15"/></svg><span>Progress</span></div>
            <div class="nav-item" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15 L20.6 18.5 L18.5 20.6 L15 19.4 L12 21 L9 19.4 L5.5 20.6 L3.4 18.5 L4.6 15 L3 12 L4.6 9 L3.4 5.5 L5.5 3.4 L9 4.6 L12 3 L15 4.6 L18.5 3.4 L20.6 5.5 L19.4 9 L21 12 L19.4 15Z"/></svg><span>Settings</span></div>
        </div>
    </div>

    <canvas id="shot-canvas" width="360" height="780"></canvas>

    <script>
        (function(){
            // ------ THEME & STATE ------
            let currentTheme = 'light';  // default
            let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings

            // icons pool (inline svg as strings, consistent style)
            const icons = {
                profile: '<svg viewBox="0 0 24 24" width="26" height="26"><circle cx="12" cy="8" r="4" stroke="currentColor" fill="none" stroke-width="2"/><path d="M5 20 L19 20 C19 16 15.5 14 12 14 C8.5 14 5 16 5 20Z" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>',
                check: '<svg viewBox="0 0 24 24"><path d="M5 12 L10 17 L19 8" stroke="currentColor" stroke-width="2" fill="none"/></svg>',
                lesson: '<svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="14" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M8 10 L16 10" stroke="currentColor" stroke-width="2"/><path d="M8 14 L14 14" stroke="currentColor" stroke-width="2"/></svg>',
                chart: '<svg viewBox="0 0 24 24"><path d="M3 17 L9 11 L13 15 L21 7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M3 21 L21 21" stroke="currentColor" stroke-width="2"/></svg>',
                flashcards: '<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M9 8 L15 8 M9 12 L15 12 M9 16 L13 16" stroke="currentColor" stroke-width="2"/></svg>',
                play: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/><polygon points="10,8 16,12 10,16" fill="currentColor"/></svg>'
            };

            // ----- helper: render header -----
            function renderHeader(title) {
                const headerDiv = document.getElementById('header-placeholder');
                headerDiv.innerHTML = `
                    <h2>${title}</h2>
                    <div class="profile-icon" id="profileBtn">${icons.profile}</div>
                `;
                document.getElementById('profileBtn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    navigateTo('settings');
                });
            }

            // ----- modal (privacy/terms) -----
            function showModal(content) {
                const modal = document.createElement('div');
                modal.className = 'modal';
                modal.id = 'activeModal';
                modal.innerHTML = `<div class="modal-content"><h3 style="margin-bottom:12px;">${content}</h3><p style="margin-bottom:24px;">Sample legal text for demo. Real app would contain full policy.</p><button class="btn-primary" style="padding:10px;" id="closeModal">Close</button></div>`;
                document.querySelector('.phone').appendChild(modal);
                document.getElementById('closeModal').addEventListener('click', ()=> modal.remove());
                modal.addEventListener('click', (e) => { if(e.target === modal) modal.remove(); });
            }

            // ----- navigation -----
            function navigateTo(screen) {
                currentScreen = screen;
                updateActiveNav(screen);
                renderScreen(screen);
            }

            function updateActiveNav(screen) {
                document.querySelectorAll('.nav-item').forEach(item => {
                    const tab = item.dataset.tab;
                    if (tab === screen) item.classList.add('active');
                    else item.classList.remove('active');
                });
            }

            // ----- main screen render -----
            function renderScreen(screen) {
                const root = document.getElementById('screen-root');
                if (screen === 'onboarding') {
                    renderHeader('Welcome');
                    root.innerHTML = `
                        <div class="screen-content">
                            <div class="onboard-logo">
                                <div class="logo-icon">${icons.flashcards.replace('currentColor', 'var(--primary)')}</div>
                                <div class="app-name">Pythonix</div>
                                <div class="tagline">code with python</div>
                                <div class="description">Bite-sized Python lessons. From zero to loops. Perfect for beginners.</div>
                                <button class="btn-primary" id="getStartedBtn">Get Started</button>
                                <div class="legal-links">
                                    <span id="privacyLink">Privacy Policy</span>
                                    <span id="termsLink">Terms of Service</span>
                                </div>
                            </div>
                        </div>
                    `;
                    document.getElementById('getStartedBtn').addEventListener('click', ()=> navigateTo('home'));
                    document.getElementById('privacyLink').addEventListener('click', ()=> showModal('Privacy Policy'));
                    document.getElementById('termsLink').addEventListener('click', ()=> showModal('Terms of Service'));
                }
                else if (screen === 'home') {
                    renderHeader('Dashboard');
                    root.innerHTML = `
                        <div class="screen-content">
                            <div class="stats-row">
                                <div class="stat-card"><div class="stat-label">Streak</div><div class="stat-number">7</div><div>days</div></div>
                                <div class="stat-card"><div class="stat-label">XP today</div><div class="stat-number">120</div>🔥</div>
                            </div>
                            <div style="background:var(--card); border-radius:24px; padding:18px; margin-bottom:20px;">
                                <div style="display:flex; justify-content:space-between;"><span>Python basics</span><span>60%</span></div>
                                <div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div>
                                <div style="margin-top:12px;">next: functions</div>
                            </div>
                            <h3 style="margin-bottom:12px;">daily pick</h3>
                            <div class="lesson-item"><span>${icons.play}</span><div><strong>variables</strong><br>5 min</div><span class="badge">beginner</span></div>
                            <div class="lesson-item"><span>${icons.flashcards}</span><div><strong>strings</strong><br>8 min</div><span class="badge">easy</span></div>
                        </div>
                    `;
                }
                else if (screen === 'learn') {
                    renderHeader('Learn');
                    root.innerHTML = `
                        <div class="screen-content">
                            <div style="display:flex; gap:10px; margin-bottom:20px;">
                                <span class="badge" style="background:var(--primary); color:white;">All</span>
                                <span class="badge">beginner</span>
                                <span class="badge">intermediate</span>
                            </div>
                            <div class="lesson-item"><span>${icons.lesson}</span><div><strong>Hello World</strong></div>${icons.check}</div>
                            <div class="lesson-item"><span>${icons.lesson}</span><div><strong>if/else</strong></div>${icons.play}</div>
                            <div class="lesson-item"><span>${icons.flashcards}</span><div><strong>lists</strong></div><span class="badge">new</span></div>
                            <div class="lesson-item"><span>${icons.play}</span><div><strong>loops</strong></div></div>
                        </div>
                    `;
                }
                else if (screen === 'progress') {
                    renderHeader('Progress');
                    root.innerHTML = `
                        <div class="screen-content">
                            <div class="stat-card" style="padding:20px;"><div>total lessons</div><div class="stat-number">18</div></div>
                            <div class="chart-placeholder" id="chart">
                                <div class="bar" style="height:30px;"></div><div class="bar" style="height:55px;"></div><div class="bar" style="height:70px;"></div><div class="bar" style="height:40px;"></div><div class="bar" style="height:90px;"></div>
                            </div>
                            <div style="display:flex; margin:20px 0;">${icons.chart} <span>weekly activity</span></div>
                            <div class="badge" style="display:inline-block;">🔥 7 day streak</div>
                        </div>
                    `;
                    setTimeout(()=>{ // tiny bar animation
                        document.querySelectorAll('.bar').forEach((b,i)=> b.style.height = [40,68,82,51,97][i]+'px');
                    },50);
                }
                else if (screen === 'settings') {
                    renderHeader('Settings');
                    root.innerHTML = `
                        <div class="screen-content">
                            <div class="settings-item"><span>🌓 Dark mode</span><div class="toggle-switch" id="themeToggle"></div></div>
                            <div class="settings-item">Notifications</div>
                            <div class="settings-item">Sound</div>
                            <div class="settings-item">Profile</div>
                            <div style="margin-top:30px;">— app version 2026.1 —</div>
                        </div>
                    `;
                    const toggle = document.getElementById('themeToggle');
                    if (toggle) toggle.addEventListener('click', (e) => {
                        document.body.classList.toggle('dark');
                        const isDark = document.body.classList.contains('dark');
                        localStorage.setItem('theme', isDark ? 'dark' : 'light');
                    });
                }
            }

            // bottom nav listeners
            document.querySelectorAll('.nav-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    const tab = e.currentTarget.dataset.tab;
                    navigateTo(tab);
                });
            });

            // restore theme
            if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');

            // initial onboarding
            renderScreen('onboarding');
            updateActiveNav('none'); // no bottom highlight

            // ----- screenshot capture (SHIFT+W) -----
            document.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    const phone = document.getElementById('phoneContainer');
                    const canvas = document.getElementById('shot-canvas');
                    const ctx = canvas.getContext('2d');
                    const isDark = document.body.classList.contains('dark');
                    import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm').then(module => {
                        const html2canvas = module.default;
                        html2canvas(phone, { scale: 2, backgroundColor: null }).then(canvasImg => {
                            ctx.clearRect(0,0,360,780);
                            ctx.drawImage(canvasImg, 0, 0, 360, 780);
                            const link = document.createElement('a');
                            let filename = '1.png';
                            if (currentScreen === 'home') filename = '2.png';
                            else if (currentScreen === 'learn') filename = '3.png';
                            else if (currentScreen === 'progress') filename = '4.png';
                            else if (currentScreen === 'settings') filename = '5.png';
                            if (isDark && currentScreen === 'settings') filename = '6.png'; // dark settings stands for dark theme
                            else if (isDark) filename = '6.png'; // if any dark -> 6.png (simplified)
                            link.download = filename;
                            link.href = canvas.toDataURL('image/png');
                            link.click();
                        });
                    }).catch(()=> alert('capture failed'));
                }
            });

            // profile icon already handled inside renderHeader, but ensure listeners after each render
            // add small listener to body to re-attach profile events (since header replaces)
            const observer = new MutationObserver(() => {
                const profileBtn = document.getElementById('profileBtn');
                if (profileBtn) profileBtn.addEventListener('click', (e) => { navigateTo('settings'); });
            });
            observer.observe(document.getElementById('header-placeholder'), { childList: true, subtree: true });
        })();
    </script>
</body>
</html>
All done!
