```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabVault • English builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            /* light mode (default) */
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --border: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --shadow: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,0,0,0.05);
            --header-icon: #0F172A;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --border: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --shadow: 0 8px 20px rgba(0,0,0,0.5);
            --header-icon: #F1F5F9;
        }

        body {
            background: #1a1f2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* phone frame */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0,0,0,0.4), 0 0 0 8px #2c3e50;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s;
        }

        /* screen container */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) transparent;
            background: var(--bg);
        }

        .app-screen::-webkit-scrollbar {
            width: 4px;
        }
        .app-screen::-webkit-scrollbar-thumb {
            background: var(--inactive);
            border-radius: 20px;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px 8px;
            background: transparent;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--header-icon);
        }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 8px 10px;
            background: var(--card);
            border-top: 1px solid var(--border);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            gap: 4px;
            transition: all 0.15s ease;
            color: var(--inactive);
            fill: var(--inactive);
            padding: 6px 0 4px;
            border-radius: 16px;
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            transform: scale(1.05);
            background: rgba(37, 99, 235, 0.08);
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.2px;
        }
        .nav-icon {
            width: 24px;
            height: 24px;
        }

        /* cards */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        /* buttons */
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--primary-dark);
            transition: 0.08s linear;
        }
        .btn-primary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--primary-dark);
        }

        .link-row {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin: 18px 0 10px;
            font-size: 13px;
        }
        .link-row button {
            background: none;
            border: none;
            color: var(--inactive);
            text-decoration: underline;
            cursor: pointer;
            font-size: 13px;
        }

        /* modal */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }
        .modal-content {
            background: var(--card);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            color: var(--text);
            box-shadow: 0 20px 30px black;
            position: relative;
        }
        .modal-content h3 {
            margin-bottom: 12px;
            color: var(--primary);
        }
        .modal-content p {
            font-size: 14px;
            margin-bottom: 24px;
        }
        .modal-content button {
            background: var(--primary);
            border: none;
            color: white;
            padding: 8px 22px;
            border-radius: 40px;
            float: right;
            font-weight: 600;
            cursor: pointer;
        }

        /* progress bar */
        .progress-bar-bg {
            background: var(--border);
            height: 8px;
            border-radius: 20px;
            overflow: hidden;
            margin: 12px 0;
        }
        .progress-fill {
            background: var(--primary);
            width: 0%;
            height: 100%;
            border-radius: 20px;
            transition: width 0.3s ease;
        }

        /* stats grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }
        .stat-item {
            background: var(--bg);
            padding: 16px 8px;
            border-radius: 20px;
            text-align: center;
        }

        .badge-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* chart mock */
        .chart-mock {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 120px;
            margin: 20px 0 10px;
        }
        .bar {
            width: 22px;
            background: var(--primary);
            border-radius: 12px 12px 4px 4px;
            transition: height 0.3s;
        }

        /* toggles */
        .theme-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
        }
        .switch {
            width: 48px;
            height: 24px;
            background: var(--border);
            border-radius: 40px;
            appearance: none;
            cursor: pointer;
            position: relative;
        }
        .switch:checked {
            background: var(--primary);
        }
        .switch::before {
            content: '';
            position: absolute;
            width: 20px; height: 20px;
            background: white;
            border-radius: 50%;
            top: 2px; left: 2px;
            transition: 0.2s;
        }
        .switch:checked::before {
            left: 26px;
        }

        /* icons inline */
        .icon-svg {
            width: 24px;
            height: 24px;
            display: inline-block;
        }

        .hidden { display: none; }
        .mt-4 { margin-top: 16px; }
        .mb-2 { margin-bottom: 8px; }
        .p-4 { padding: 20px; }
        .gap-2 { gap: 8px; }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic header & screen -->
    <div id="appHeader" class="header">
        <h1 id="screenTitle">Onboarding</h1>
        <button class="profile-btn" id="profileIconBtn" aria-label="Profile">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
            </svg>
        </button>
    </div>

    <!-- main screen container (views) -->
    <div id="screenContainer" class="app-screen p-4">
        <!-- injected via js -->
    </div>

    <!-- bottom navigation (4 items) -->
    <div class="bottom-nav" id="bottomNav">
        <button class="nav-item" data-nav="home">
            <span class="nav-icon" id="icon-home"></span>
            <span>Home</span>
        </button>
        <button class="nav-item" data-nav="learn">
            <span class="nav-icon" id="icon-learn"></span>
            <span>Learn</span>
        </button>
        <button class="nav-item" data-nav="progress">
            <span class="nav-icon" id="icon-progress"></span>
            <span>Progress</span>
        </button>
        <button class="nav-item" data-nav="settings">
            <span class="nav-icon" id="icon-settings"></span>
            <span>Settings</span>
        </button>
    </div>
</div>

<!-- modal container (hidden) -->
<div id="modalOverlay" class="modal hidden">
    <div class="modal-content" id="modalContent">
        <h3 id="modalTitle">Title</h3>
        <p id="modalBody">...</p>
        <button id="modalClose">OK</button>
    </div>
</div>

<script>
(function() {
    // ---------- THEME & CONST ----------
    const lightVars = { bg: '#F8FAFC', card: '#FFFFFF', text: '#0F172A', primary: '#2563EB' };
    let currentScreen = 'onboarding';
    let darkMode = false;
    let screenshotCounter = 1;  // for shift+w

    // ---------- SVG ICON FACTORY (outline 2px, rounded) ----------
    function renderIcon(name, active = false) {
        const color = active ? '#2563EB' : '#94A3B8';
        const strokeW = 2;
        const props = `stroke="${color}" stroke-width="${strokeW}" stroke-linecap="round" stroke-linejoin="round" fill="none"`;

        const icons = {
            home: `<svg width="24" height="24" viewBox="0 0 24 24" ${props}><path d="M3 10l9-7 9 7v11h-7v-7h-4v7H3z"/></svg>`,
            learn: `<svg width="24" height="24" viewBox="0 0 24 24" ${props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
            progress: `<svg width="24" height="24" viewBox="0 0 24 24" ${props}><path d="M21 12v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 5 17 10"/><line x1="12" y1="5" x2="12" y2="15"/></svg>`,
            settings: `<svg width="24" height="24" viewBox="0 0 24 24" ${props}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/><path d="M16.5 6.5 19 9"/><path d="M7.5 6.5 5 9"/></svg>`,
            profile: `<svg width="24" height="24" viewBox="0 0 24 24" ${props}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
            lesson: `<svg width="24" height="24" viewBox="0 0 24 24" ${props}><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
            chart: `<svg width="24" height="24" viewBox="0 0 24 24" ${props}><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`,
            flashcards: `<svg width="24" height="24" viewBox="0 0 24 24" ${props}><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 10h8"/><path d="M8 14h5"/></svg>`,
            play: `<svg width="24" height="24" viewBox="0 0 24 24" ${props}><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
            check: `<svg width="24" height="24" viewBox="0 0 24 24" ${props}><polyline points="20 6 9 17 4 12"/></svg>`
        };
        return icons[name] || icons.home;
    }

    // inject icons into nav placeholders
    function setNavIcons(activeId) {
        const navs = ['home', 'learn', 'progress', 'settings'];
        navs.forEach(id => {
            const container = document.getElementById(`icon-${id}`);
            if (container) {
                const active = (activeId === id);
                container.innerHTML = renderIcon(id, active);
            }
        });
    }

    // ---------- SCREEN RENDER FUNCTIONS ----------
    function renderOnboarding() {
        return `
            <div class="card" style="text-align: center; margin-top: 20px;">
                <span style="font-size: 58px; display:block; margin-bottom:8px;">📚</span>
                <h1 style="font-size: 38px; font-weight:800; color: var(--primary);">VocabVault</h1>
                <p style="font-size: 18px; margin:8px 0 4px;"><strong>master English daily</strong></p>
                <p style="color: var(--text-light); margin: 16px 0;">Build vocabulary with smart flashcards & daily challenges. 5 min a day.</p>
                <button class="btn-primary" id="startGetStarted">Get Started</button>
                <div class="link-row">
                    <button id="privacyBtn">Privacy Policy</button>
                    <button id="termsBtn">Terms of Service</button>
                </div>
            </div>
        `;
    }

    function renderHome() {
        return `
            <div class="card">
                <h3 style="display: flex; justify-content: space-between;">🔥 daily streak <span>12 days</span></h3>
                <div class="progress-bar-bg"><div class="progress-fill" style="width:70%"></div></div>
                <div class="badge-row">
                    <span class="badge">${renderIcon('flashcards', false)} 5 new</span>
                    <span class="badge">${renderIcon('play', false)} review</span>
                </div>
            </div>
            <div class="card">
                <h3>continue learning</h3>
                <div style="display: flex; align-items:center; gap:16px; margin:12px 0">
                    ${renderIcon('lesson', true)} <span><strong>Business English</strong> 70%</span>
                </div>
                <div class="progress-bar-bg"><div class="progress-fill" style="width:70%"></div></div>
                <button class="btn-primary" style="margin-top:16px;" id="homeToLearn">practice now</button>
            </div>
            <div class="card">
                <h3>today's picks</h3>
                <div style="display:flex; gap:8px;">${renderIcon('flashcards')} 10 idioms • ${renderIcon('play')} phrasal verbs</div>
            </div>
        `;
    }

    function renderLearn() {
        return `
            <div class="card">
                <h3>📘 vocabulary builder</h3>
                <div style="display:flex; justify-content:space-between; margin:12px 0"><span>IELTS words</span> <span>34%</span></div>
                <div class="progress-bar-bg"><div class="progress-fill" style="width:34%"></div></div>
                <button class="btn-primary" style="margin-top:8px;" id="startLesson">start lesson</button>
            </div>
            <div class="card">
                <h3>✨ flashcards: synonyms</h3>
                <div style="display: flex; gap: 12px;">${renderIcon('flashcards')} ${renderIcon('play')} ${renderIcon('check')}</div>
                <div style="margin-top:12px;">12 due · 5 mastered</div>
            </div>
        `;
    }

    function renderProgress() {
        return `
            <div class="card">
                <h3>📊 this week</h3>
                <div class="chart-mock">
                    <div class="bar" style="height:40px"></div><div class="bar" style="height:60px"></div><div class="bar" style="height:80px"></div><div class="bar" style="height:50px"></div><div class="bar" style="height:90px"></div><div class="bar" style="height:70px"></div><div class="bar" style="height:40px"></div>
                </div>
                <div class="stats-grid">
                    <div class="stat-item"><span style="font-size:24px;">158</span><br>words</div>
                    <div class="stat-item"><span style="font-size:24px;">12</span><br>streak</div>
                </div>
            </div>
            <div class="card">
                <h3>🏅 achievements</h3>
                <div class="badge-row">⭐ early bird · 🔥 hot streak</div>
            </div>
        `;
    }

    function renderSettings() {
        const checked = darkMode ? 'checked' : '';
        return `
            <div class="card">
                <h3>display</h3>
                <div class="theme-row">
                    <span>dark mode</span>
                    <input type="checkbox" class="switch" id="darkToggle" ${checked}>
                </div>
            </div>
            <div class="card">
                <h3>profile</h3>
                <p style="display:flex; gap:12px;">${renderIcon('profile')} John · john@example.com</p>
            </div>
            <div class="card">
                <h3>app version</h3>
                <p>VocabVault 2.6 · build 2026</p>
            </div>
        `;
    }

    function loadScreen(screen) {
        const container = document.getElementById('screenContainer');
        const headerTitle = document.getElementById('screenTitle');
        if (!container) return;

        if (screen === 'onboarding') {
            headerTitle.innerText = 'Welcome';
            container.innerHTML = renderOnboarding();
            document.getElementById('bottomNav').classList.add('hidden');
            setNavIcons(null);
        } else {
            document.getElementById('bottomNav').classList.remove('hidden');
            let content = '';
            if (screen === 'home') { content = renderHome(); headerTitle.innerText = 'Home'; setNavIcons('home'); }
            else if (screen === 'learn') { content = renderLearn(); headerTitle.innerText = 'Learn'; setNavIcons('learn'); }
            else if (screen === 'progress') { content = renderProgress(); headerTitle.innerText = 'Progress'; setNavIcons('progress'); }
            else if (screen === 'settings') { content = renderSettings(); headerTitle.innerText = 'Settings'; setNavIcons('settings'); }
            container.innerHTML = content;

            // dark toggle event
            const toggle = document.getElementById('darkToggle');
            if (toggle) {
                toggle.onchange = (e) => {
                    darkMode = e.target.checked;
                    document.body.classList.toggle('dark', darkMode);
                };
            }
        }

        // attach global listeners for modals, navigation
        attachScreenEvents(screen);
    }

    function attachScreenEvents(screen) {
        // onboarding buttons
        const getStarted = document.getElementById('startGetStarted');
        if (getStarted) getStarted.onclick = () => { currentScreen = 'home'; loadScreen('home'); };

        const privacyBtn = document.getElementById('privacyBtn');
        const termsBtn = document.getElementById('termsBtn');
        if (privacyBtn) privacyBtn.onclick = () => showModal('Privacy Policy', 'We respect your data. No sharing. (demo)');
        if (termsBtn) termsBtn.onclick = () => showModal('Terms of Service', 'Use app for learning. (demo terms)');

        // home -> learn
        const homeToLearn = document.getElementById('homeToLearn');
        if (homeToLearn) homeToLearn.onclick = () => { currentScreen = 'learn'; loadScreen('learn'); };

        const startLesson = document.getElementById('startLesson');
        if (startLesson) startLesson.onclick = () => alert('📘 lesson started (demo)');
    }

    // modal handling
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const modalClose = document.getElementById('modalClose');

    function showModal(title, text) {
        modalTitle.innerText = title;
        modalBody.innerText = text;
        modalOverlay.classList.remove('hidden');
    }

    modalClose.onclick = () => modalOverlay.classList.add('hidden');
    modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) modalOverlay.classList.add('hidden'); });

    // profile icon -> settings screen
    document.getElementById('profileIconBtn').onclick = () => {
        currentScreen = 'settings';
        loadScreen('settings');
    };

    // bottom nav listeners
    document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const nav = btn.dataset.nav;
            if (nav && currentScreen !== nav) {
                currentScreen = nav;
                loadScreen(nav);
            }
        });
    });

    // screenshot feature Shift+W
    window.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.key === 'W') {
            e.preventDefault();
            const phone = document.getElementById('phoneContainer');
            // in real world would use html2canvas but pure simulation: generate name based on counter & dark
            let name = darkMode ? '6.png' : (screenshotCounter + '.png');
            if (!darkMode && screenshotCounter <=5) name = screenshotCounter + '.png';
            if (darkMode) name = '6.png';
            else if (screenshotCounter>5) screenshotCounter = 1;
            if (!darkMode) screenshotCounter++;
            alert(`📸 Screenshot saved: ${name} (simulated)`);
        }
    });

    // start with onboarding
    loadScreen('onboarding');

    // expose dark variable for later
})();
</script>

<!-- final JSON block -->
<script>
    (function() {
        // output JSON as requested (pure object)
        console.log('titles =', {
