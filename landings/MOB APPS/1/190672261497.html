```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VocabVault · English builder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    /* CSS variables – light (default) & dark */
    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --text-muted: #64748B;
      --border-light: #E2E8F0;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --inactive: #94A3B8;
      --nav-bg: #FFFFFF;
      --shadow: 0 4px 12px rgba(0,0,0,0.03);
      --highlight-bg: rgba(37,99,235,0.08);
      --progress-bg: #E2E8F0;
    }

    body.dark {
      --bg: #0F172A;
      --card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
      --border-light: #334155;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --inactive: #64748B;
      --nav-bg: #1E293B;
      --shadow: 0 4px 12px rgba(0,0,0,0.3);
      --highlight-bg: rgba(59,130,246,0.15);
      --progress-bg: #334155;
    }

    body {
      background: #1a1e2b; /* outer bezel */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background-color: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 30px 50px rgba(0,0,0,0.4), 0 0 0 10px #2c303a;
      position: relative;
      transition: background-color 0.2s;
      display: flex;
      flex-direction: column;
    }

    /* app screen wrapper */
    .app-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px 16px 8px 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--primary) var(--border-light);
    }
    .app-screen::-webkit-scrollbar {
      width: 4px;
    }
    .app-screen::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 20px;
    }

    /* header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .header h2 {
      font-size: 22px;
      font-weight: 650;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .profile-icon {
      cursor: pointer;
      padding: 6px;
      border-radius: 12px;
      transition: background 0.1s;
    }
    .profile-icon:hover {
      background: var(--highlight-bg);
    }

    /* bottom navigation */
    .bottom-nav {
      background: var(--nav-bg);
      border-top: 1px solid var(--border-light);
      display: flex;
      justify-content: space-around;
      padding: 6px 8px 10px;
      border-radius: 0 0 44px 44px;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px 0 2px;
      border-radius: 20px;
      transition: all 0.15s ease;
      color: var(--inactive);
      fill: var(--inactive);
    }
    .nav-item.active {
      color: var(--primary);
      fill: var(--primary);
      background: var(--highlight-bg);
      transform: scale(1.02);
    }
    .nav-item svg {
      width: 26px;
      height: 26px;
      display: block;
      margin-bottom: 2px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nav-item span {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    /* onboarding cards etc */
    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
      margin-bottom: 20px;
    }
    .app-logo-svg {
      width: 52px;
      height: 52px;
      background: linear-gradient(145deg, #2563EB, #38BDF8);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app-name {
      font-size: 34px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .tagline {
      font-size: 18px;
      font-weight: 500;
      color: var(--primary);
      margin-bottom: 10px;
    }
    .desc {
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 16px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 18px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(37,99,235,0.3);
      transition: 0.1s;
    }
    .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }
    .small-links {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin: 22px 0 10px;
      color: var(--text-muted);
      font-size: 13px;
    }
    .small-links span {
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* cards */
    .stats-row {
      display: flex;
      gap: 12px;
      margin: 16px 0;
    }
    .stat-card {
      background: var(--card);
      padding: 14px;
      border-radius: 24px;
      flex: 1;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-light);
    }
    .badge {
      background: var(--accent);
      color: #0F172A;
      padding: 6px 14px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 14px;
    }
    .lesson-item {
      background: var(--card);
      border-radius: 24px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      border: 1px solid var(--border-light);
      cursor: pointer;
      transition: 0.1s;
    }
    .lesson-item:active { background: var(--highlight-bg); }
    .progress-bar {
      height: 8px;
      background: var(--progress-bg);
      border-radius: 20px;
      margin: 10px 0 0;
      width: 100%;
    }
    .progress-fill {
      height: 8px;
      background: var(--primary);
      border-radius: 20px;
      width: 0%;
      transition: width 0.25s;
    }
    .chart-simple {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 70px;
      margin: 20px 0;
    }
    .chart-bar {
      width: 22px;
      background: var(--primary);
      border-radius: 12px 12px 6px 6px;
      height: calc(70% * var(--h));
    }
    /* modals */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: var(--card);
      padding: 28px;
      border-radius: 32px;
      width: 280px;
      text-align: center;
      color: var(--text-primary);
    }
    .hidden { display: none !important; }

    /* icon sprite (reusable) */
    .icon-defs {
      position: absolute; width: 0; height: 0;
    }

    /* placeholder for extra spacing */
    .flex-fill { flex:1; }
  </style>
</head>
<body>
  <!-- hidden SVG definitions (inline icons) -->
  <svg style="display: none;" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- home -->
      <symbol id="icon-home" viewBox="0 0 24 24"><path d="M5 12H3L12 3L21 12H19V20H13V14H11V20H5V12Z" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <!-- learn (book open) -->
      <symbol id="icon-learn" viewBox="0 0 24 24"><path d="M2 3H8C9.1 3 10 3.9 10 5V16C10 14.9 9.1 14 8 14H2V3Z" stroke="currentColor" fill="none" stroke-width="2"/><path d="M22 3H16C14.9 3 14 3.9 14 5V16C14 14.9 14.9 14 16 14H22V3Z" stroke="currentColor" fill="none" stroke-width="2"/></symbol>
      <!-- progress (chart line) -->
      <symbol id="icon-progress" viewBox="0 0 24 24"><path d="M21 20H3V4" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/><path d="M7 16L10 11L13 14L18 8" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></symbol>
      <!-- settings (gear) -->
      <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor" fill="none" stroke-width="2"/><path d="M19.4 15L20.8 12L19.4 9H16.7L15.2 6.5L12.6 5.3L10 6.5L8.5 9H5.8L4.4 12L5.8 15H8.5L10 17.5L12.6 18.7L15.2 17.5L16.7 15H19.4Z" stroke="currentColor" fill="none" stroke-width="2"/></symbol>
      <!-- profile (simple user) -->
      <symbol id="icon-profile" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" stroke="currentColor" fill="none" stroke-width="2"/><path d="M5 20V18C5 14.7 7.7 12 11 12H13C16.3 12 19 14.7 19 18V20" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></symbol>
      <!-- lesson (play) -->
      <symbol id="icon-lesson" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none" stroke-width="2"/><path d="M10 8L16 12L10 16V8Z" stroke="currentColor" fill="white" stroke-width="2"/></symbol>
      <!-- chart (bar) -->
      <symbol id="icon-chart" viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20V14" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></symbol>
      <!-- flashcards -->
      <symbol id="icon-flashcards" viewBox="0 0 24 24"><path d="M4 5H18C19.1 5 20 5.9 20 7V17C20 18.1 19.1 19 18 19H8C6.9 19 6 18.1 6 17V7" stroke="currentColor" fill="none" stroke-width="2"/><path d="M8 3V7" stroke="currentColor" stroke-width="2"/><path d="M12 3V7" stroke="currentColor" stroke-width="2"/></symbol>
      <!-- check -->
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="M5 13L9 17L19 7" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <div class="phone" id="phoneContainer">
    <!-- dynamic screen panel -->
    <div id="screenContainer" class="app-screen"></div>
    <!-- bottom navigation -->
    <div class="bottom-nav" id="bottomNav">
      <button class="nav-item" data-tab="home"><svg><use href="#icon-home"/></svg><span>Home</span></button>
      <button class="nav-item" data-tab="learn"><svg><use href="#icon-learn"/></svg><span>Learn</span></button>
      <button class="nav-item" data-tab="progress"><svg><use href="#icon-progress"/></svg><span>Progress</span></button>
      <button class="nav-item" data-tab="settings"><svg><use href="#icon-settings"/></svg><span>Settings</span></button>
    </div>
  </div>

  <!-- modal container (hidden) -->
  <div id="modalOverlay" class="modal hidden" onclick="closeModal(event)">
    <div class="modal-content" id="modalContent"></div>
  </div>

  <script>
    (function(){
      // ---------- app state ----------
      let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
      let darkMode = false;
      let screenshotCounter = 1;
      const bottomNav = document.getElementById('bottomNav');
      const screenEl = document.getElementById('screenContainer');
      const modalOverlay = document.getElementById('modalOverlay');
      const modalContent = document.getElementById('modalContent');

      // helper: render active screen
      function renderScreen() {
        if (currentScreen === 'onboarding') renderOnboarding();
        else if (currentScreen === 'home') renderHome();
        else if (currentScreen === 'learn') renderLearn();
        else if (currentScreen === 'progress') renderProgress();
        else if (currentScreen === 'settings') renderSettings();

        // update bottom nav active class (hide nav on onboarding)
        if (currentScreen === 'onboarding') {
          bottomNav.style.display = 'none';
        } else {
          bottomNav.style.display = 'flex';
          const tabs = ['home','learn','progress','settings'];
          document.querySelectorAll('.nav-item').forEach(btn => {
            const tab = btn.dataset.tab;
            if (tab === currentScreen) btn.classList.add('active');
            else btn.classList.remove('active');
          });
        }
      }

      // ----- icons helper -----
      function icon(name, size=24, classes='') {
        return `<svg width="${size}" height="${size}" class="${classes}" style="stroke:currentColor; fill:none;"><use href="#icon-${name}"/></svg>`;
      }

      // ----- onboarding -----
      function renderOnboarding() {
        let html = `
          <div class="logo-area">
            <div class="app-logo-svg">${icon('flashcards', 34)}</div>
            <span class="app-name">VocabVault</span>
          </div>
          <div class="tagline">speak like a native</div>
          <div class="desc">Master 3000+ English words with daily micro‑lessons. Fun, fast & effective.</div>
          <button class="btn-primary" id="getStartedBtn">Get Started →</button>
          <div class="small-links">
            <span id="privacyLink">Privacy Policy</span>
            <span id="termsLink">Terms of Service</span>
          </div>
          <div style="margin-top: 30px; background: var(--card); border-radius: 32px; padding: 16px; border:1px solid var(--border-light);">
            <div style="display:flex; gap:16px;">
              ${icon('lesson', 28)} <span style="color:var(--text-primary);">3 min lessons · adaptive</span>
            </div>
          </div>
        `;
        screenEl.innerHTML = html;
        document.getElementById('getStartedBtn').addEventListener('click', ()=>{
          currentScreen = 'home';
          renderScreen();
        });
        document.getElementById('privacyLink').addEventListener('click', ()=>showModal('Privacy Policy', 'We respect your data. No tracking.'));
        document.getElementById('termsLink').addEventListener('click', ()=>showModal('Terms of Service', 'Free for personal use.'));
      }

      // ----- home dashboard -----
      function renderHome() {
        let html = `
          <div class="header">
            <h2>Home</h2>
            <div class="profile-icon" id="profileBtn">${icon('profile', 28)}</div>
          </div>
          <div class="stats-row">
            <div class="stat-card"><span style="color:var(--text-secondary);">streak</span> <span style="font-size:28px;font-weight:700;color:var(--primary);">7🔥</span></div>
            <div class="stat-card"><span style="color:var(--text-secondary);">points</span> <span style="font-size:28px;font-weight:700;color:var(--primary);">450</span></div>
          </div>
          <div style="display:flex; gap:10px; margin:10px 0;">
            <span class="badge">word of the day: gregarious</span>
          </div>
          <div style="background:var(--card);border-radius:28px;padding:16px;margin:12px 0;">
            <div style="display:flex; align-items:center; gap:8px;">${icon('chart', 22)} <span style="color:var(--text-primary); font-weight:600;">Daily goal</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div>
            <span style="color:var(--text-muted);">60% complete</span>
          </div>
          <h3 style="color:var(--text-primary); margin-top:12px;">Continue learning</h3>
          <div class="lesson-item" id="lesson1">
            ${icon('lesson', 26)} <div><div style="font-weight:600;color:var(--text-primary);">Phrasal verbs</div><span style="color:var(--text-muted);">lesson 3/5</span></div>
          </div>
          <div class="lesson-item" id="lesson2">
            ${icon('flashcards', 26)} <div><div style="font-weight:600;color:var(--text-primary);">Idioms: emotions</div><span style="color:var(--text-muted);">15 cards</span></div>
          </div>
        `;
        screenEl.innerHTML = html;
        document.getElementById('profileBtn').addEventListener('click', ()=>{ currentScreen='settings'; renderScreen(); });
        document.getElementById('lesson1').addEventListener('click', ()=>{ currentScreen='learn'; renderScreen(); });
        document.getElementById('lesson2').addEventListener('click', ()=>{ currentScreen='learn'; renderScreen(); });
      }

      // ----- learn / practice -----
      function renderLearn() {
        let html = `
          <div class="header">
            <h2>Learn</h2>
            <div class="profile-icon" id="profileBtn">${icon('profile', 28)}</div>
          </div>
          <div style="background:var(--card); border-radius:28px; padding:12px; display:flex; gap:16px; align-items:center; margin-bottom:20px;">
            ${icon('lesson', 32)} <span style="color:var(--text-primary);font-weight:600;">Today: 12 new words</span>
          </div>
          <div class="lesson-item" style="justify-content:space-between;"><span>🔤 "benevolent"</span> <span style="color:var(--primary);">kindness</span></div>
          <div class="lesson-item" style="justify-content:space-between;"><span>🔤 "ephemeral"</span> <span style="color:var(--primary);">short-lived</span></div>
          <div class="lesson-item" style="justify-content:space-between;"><span>🔤 "meticulous"</span> <span style="color:var(--primary);">careful</span></div>
          <button class="btn-primary" style="margin-top:24px;" id="practiceBtn">start practice →</button>
          <p style="text-align:center; margin-top:14px; color:var(--accent);" id="practicedTap">${icon('check', 18)} 3 correct</p>
        `;
        screenEl.innerHTML = html;
        document.getElementById('profileBtn').addEventListener('click', ()=>{ currentScreen='settings'; renderScreen(); });
        document.getElementById('practiceBtn').addEventListener('click', ()=> alert('practice mode! (simulated)'));
      }

      // ----- progress / statistics -----
      function renderProgress() {
        let html = `
          <div class="header">
            <h2>Progress</h2>
            <div class="profile-icon" id="profileBtn">${icon('profile', 28)}</div>
          </div>
          <div class="stats-row">
            <div class="stat-card"><span>words learned</span><span style="display:block;font-size:28px;">248</span></div>
            <div class="stat-card"><span>lessons done</span><span style="display:block;font-size:28px;">43</span></div>
          </div>
          <div class="chart-simple">
            <div style="--h:0.8; height:40px;" class="chart-bar"></div><div style="--h:0.5;" class="chart-bar"></div><div style="--h:1;" class="chart-bar"></div><div style="--h:0.7;" class="chart-bar"></div><div style="--h:0.3;" class="chart-bar"></div>
          </div>
          <div style="background:var(--card);border-radius:20px;padding:16px;">🏆 Mastery: 68% &nbsp; ${icon('flashcards', 18)}</div>
        `;
        screenEl.innerHTML = html;
        document.getElementById('profileBtn').addEventListener('click', ()=>{ currentScreen='settings'; renderScreen(); });
      }

      // ----- settings / profile -----
      function renderSettings() {
        let html = `
          <div class="header">
            <h2>Settings</h2>
            <div class="profile-icon" id="profileBtn">${icon('profile', 28)}</div>
          </div>
          <div style="background:var(--card);border-radius:28px;padding:18px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:16px;">
              <span>🌙 Dark mode</span>
              <label><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}></label>
            </div>
            <div style="display:flex; gap:20px; color:var(--text-muted);">${icon('profile', 22)} Profile · Notifications · Language</div>
          </div>
          <div style="margin-top:20px; color:var(--text-muted); font-size:13px; text-align:center;">version 2.6 · learn anytime</div>
        `;
        screenEl.innerHTML = html;
        document.getElementById('profileBtn').addEventListener('click', ()=>{ currentScreen='settings'; renderScreen(); });
        document.getElementById('darkToggle').addEventListener('change', (e)=>{
          darkMode = e.target.checked;
          if (darkMode) document.body.classList.add('dark');
          else document.body.classList.remove('dark');
          renderScreen(); // refresh to show card colours update
        });
      }

      // modal helpers
      function showModal(title, text) {
        modalContent.innerHTML = `<h3 style="margin-bottom:12px;">${title}</h3><p>${text}</p><button class="btn-primary" style="margin-top:16px;" onclick="closeModal()">close</button>`;
        modalOverlay.classList.remove('hidden');
      }
      window.closeModal = function(e) {
        if (!e || e.target === modalOverlay) modalOverlay.classList.add('hidden');
      }

      // bottom navigation listeners
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          const tab = btn.dataset.tab; // home,learn,progress,settings
          if (tab === 'home') currentScreen = 'home';
          else if (tab === 'learn') currentScreen = 'learn';
          else if (tab === 'progress') currentScreen = 'progress';
          else if (tab === 'settings') currentScreen = 'settings';
          renderScreen();
        });
      });

      // ---------- SCREENSHOT feature (Shift+W) ----------
      window.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.key === 'W') {
          e.preventDefault();
          const phone = document.getElementById('phoneContainer');
          // In a real prototype we can't create a real PNG, but we simulate filename sequence
          // we capture as data url (concept). For assignment we just simulate download and json.
          let filename = (darkMode ? '6' : screenshotCounter) + '.png';
          if (!darkMode && screenshotCounter < 6) {
            screenshotCounter = (screenshotCounter % 5) + 1;
          } else if (darkMode) filename = '6.png';
          alert(`📸 Screenshot saved as ${filename} (simulated)`);
        }
      });

      // initial render
      renderScreen();

      // expose for JSON later (will output after code)
