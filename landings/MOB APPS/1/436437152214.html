```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Lab • prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            min-height: 100vh;
            background: #1a2639;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #475569;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --border: #E2E8F0;
            --inactive: #94A3B8;
            --highlight: #EFF6FF;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
        }
        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #94A3B8;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --border: #334155;
            --inactive: #64748B;
            --highlight: #1E293B;
        }
        .phone-frame {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            position: relative;
            border: 8px solid #1e1e2f;
            transition: background-color 0.2s;
            display: flex;
            flex-direction: column;
        }
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) transparent;
            padding-bottom: 70px; /* space for bottom nav */
            position: relative;
        }
        .app-screen::-webkit-scrollbar {
            width: 4px;
        }
        .app-screen::-webkit-scrollbar-thumb {
            background: var(--inactive);
            border-radius: 20px;
        }
        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px 8px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .profile-btn {
            background: none;
            border: none;
            padding: 8px 4px;
            cursor: pointer;
        }
        .profile-btn svg {
            width: 26px;
            height: 26px;
            stroke: var(--text);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        /* bottom navigation */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 12px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
            z-index: 10;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 20px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            flex: 1;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            color: var(--inactive);
            transition: color 0.2s;
        }
        .nav-item.active {
            background-color: var(--highlight);
            transform: scale(1.05);
        }
        .nav-item.active svg {
            stroke: var(--primary) !important;
            stroke-width: 2.4;
            width: 26px;
            height: 26px;
        }
        .nav-item.active span {
            color: var(--primary);
            font-weight: 600;
        }
        .nav-item svg {
            width: 22px;
            height: 22px;
            stroke: var(--inactive);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.15s;
        }
        /* content cards etc */
        .content {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .onboarding-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 40px 0 20px;
        }
        .logo-svg {
            width: 64px;
            height: 64px;
            background: linear-gradient(145deg, var(--primary), var(--accent));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .app-name {
            font-size: 32px;
            font-weight: 800;
            color: var(--text);
        }
        .tagline {
            font-size: 16px;
            color: var(--primary);
            font-weight: 500;
            margin: 4px 0 8px;
        }
        .desc {
            font-size: 14px;
            color: var(--text-light);
            text-align: center;
            max-width: 280px;
            margin: 8px 0 24px;
            line-height: 1.4;
        }
        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            font-size: 18px;
            padding: 16px 32px;
            border-radius: 40px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 8px 20px -8px var(--primary);
            transition: 0.2s;
            margin-bottom: 24px;
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        .legal-links {
            display: flex;
            gap: 24px;
            justify-content: center;
        }
        .legal-links button {
            background: none;
            border: none;
            color: var(--inactive);
            text-decoration: underline;
            font-size: 13px;
            cursor: pointer;
        }
        /* dashboard cards */
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 12px;
        }
        .stats-row {
            display: flex;
            gap: 12px;
        }
        .stat-card {
            background: var(--card);
            padding: 16px;
            border-radius: 24px;
            flex: 1;
            box-shadow: var(--shadow);
        }
        .stat-number {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
        }
        .progress-bar {
            height: 8px;
            background: var(--border);
            border-radius: 20px;
            margin: 12px 0 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s;
        }
        .lesson-item {
            background: var(--card);
            padding: 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: 0.1s;
        }
        .lesson-item:active {
            background: var(--highlight);
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-card {
            background: var(--card);
            padding: 28px;
            border-radius: 32px;
            width: 280px;
            text-align: center;
            color: var(--text);
        }
        .modal-card button {
            margin-top: 20px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        .hidden {
            display: none !important;
        }
        .flex-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .chart-simple {
            background: var(--card);
            padding: 20px;
            border-radius: 28px;
            display: flex;
            gap: 12px;
            align-items: flex-end;
            justify-content: center;
            height: 160px;
        }
        .bar {
            width: 30px;
            background: var(--primary);
            border-radius: 12px 12px 4px 4px;
            height: 0px;
            transition: height 0.4s;
        }
        .setting-item {
            background: var(--card);
            padding: 16px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .toggle-switch {
            width: 44px;
            height: 24px;
            background: var(--border);
            border-radius: 40px;
            appearance: none;
            cursor: pointer;
            position: relative;
        }
        .toggle-switch:checked {
            background: var(--primary);
        }
        .toggle-switch::before {
            content: '';
            width: 20px; height: 20px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px; left: 2px;
            transition: 0.15s;
        }
        .toggle-switch:checked::before {
            left: 22px;
        }
    </style>
</head>
<body>
    <div class="phone-frame" id="phoneFrame">
        <div class="app-screen" id="appScreen">
            <!-- dynamic views injected via JS -->
        </div>
        <div class="bottom-nav" id="bottomNav">
            <!-- nav will be injected -->
        </div>
    </div>

    <!-- hidden canvas for screenshot -->
    <canvas id="screenshotCanvas" style="display:none"></canvas>

    <script>
        (function() {
            // ----- THEME & STATE -----
            const themeToggle = document.createElement('input'); // dummy for theme logic later
            let currentTheme = 'light';
            const root = document.documentElement;
            const phoneFrame = document.getElementById('phoneFrame');
            const appScreen = document.getElementById('appScreen');
            const bottomNav = document.getElementById('bottomNav');

            let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings

            // ----- SVG ICONS (inline, same style) -----
            const icons = {
                home: `<svg viewBox="0 0 24 24"><path d="M5 12H3L12 3L21 12H19V20H13V14H11V20H5V12Z" /></svg>`,
                learn: `<svg viewBox="0 0 24 24"><path d="M12 3L20 7.5V16.5L12 21L4 16.5V7.5L12 3ZM12 5L6 8.5V15L12 18.5L18 15V8.5L12 5ZM12 7.5L15 9.5V13.5L12 15.5L9 13.5V9.5L12 7.5Z" /></svg>`,
                progress: `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12H20C20 16.41 16.41 20 12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C14.37 4 16.47 5.02 17.91 6.69L14 10.5H22V2.5L18.84 5.66C16.94 3.62 14.22 2 11 2C6.58 2 3 5.58 3 10C3 14.42 6.58 18 11 18C15.42 18 19 14.42 19 10H17C17 13.31 14.31 16 11 16C7.69 16 5 13.31 5 10C5 6.69 7.69 4 11 4C13.05 4 14.88 4.99 16 6.54L16.5 6V5.5L19 3C17.19 1.24 14.52 0 11.5 0C6.81 0 3 3.81 3 8.5C3 13.19 6.81 17 11.5 17C16.19 17 20 13.19 20 8.5H18C18 12.09 15.09 15 11.5 15C7.91 15 5 12.09 5 8.5C5 4.91 7.91 2 11.5 2Z" /></svg>`,
                settings: `<svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94 0 .31.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.57 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" /></svg>`,
                profile: `<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" /></svg>`,
                lesson: `<svg viewBox="0 0 24 24"><path d="M4 6H20V8H4V6ZM4 10H20V12H4V10ZM4 14H14V16H4V14ZM18 14L22 18L18 22V19H15V17H18V14Z" /></svg>`,
                chart: `<svg viewBox="0 0 24 24"><path d="M5 19H19V21H5V19ZM6 16L9 11L12 14L16 8L19 13V5H6V16Z" /></svg>`,
                flashcards: `<svg viewBox="0 0 24 24"><path d="M18 2H6C4.9 2 4 2.9 4 4V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V4C20 2.9 19.1 2 18 2ZM18 20H6V4H7V12L10 9.5L13 12V4H18V20Z" /></svg>`,
                play: `<svg viewBox="0 0 24 24"><path d="M8 5V19L19 12L8 5Z" /></svg>`,
                check: `<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" /></svg>`,
            };

            // ----- helper: render current screen -----
            function renderScreen() {
                let html = '';
                if (currentScreen === 'onboarding') html = getOnboardingHTML();
                else if (currentScreen === 'home') html = getHomeHTML();
                else if (currentScreen === 'learn') html = getLearnHTML();
                else if (currentScreen === 'progress') html = getProgressHTML();
                else if (currentScreen === 'settings') html = getSettingsHTML();

                appScreen.innerHTML = html + `<div id="modalContainer" class="hidden"></div>`;
                attachListeners();
            }

            // ----- bottom nav render -----
            function renderBottomNav(active) {
                const items = ['home', 'learn', 'progress', 'settings'];
                let navHtml = '';
                items.forEach(item => {
                    const activeClass = (currentScreen === item) ? 'active' : '';
                    const iconSvg = icons[item] || icons.home;
                    navHtml += `<button class="nav-item ${activeClass}" data-nav="${item}">${iconSvg}<span>${item.charAt(0).toUpperCase()+item.slice(1)}</span></button>`;
                });
                bottomNav.innerHTML = navHtml;
                document.querySelectorAll('.nav-item').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const nav = btn.dataset.nav;
                        if (nav) {
                            currentScreen = nav;
                            renderScreen();
                            renderBottomNav(currentScreen);
                        }
                    });
                });
            }

            // ----- ONBOARDING -----
            function getOnboardingHTML() {
                return `
                    <div class="content" style="justify-content: center; min-height: 100%;">
                        <div class="onboarding-logo">
                            <div class="logo-svg">${icons.flashcards.replace('<svg', '<svg width="40" height="40" fill="white" stroke="white"')}</div>
                            <span class="app-name">Python Lab</span>
                            <span class="tagline">code. learn. grow.</span>
                            <div class="desc">Master Python with bite-sized exercises, real‑time feedback, and a clear learning path.</div>
                            <button class="btn-primary" id="getStartedBtn">Get Started</button>
                            <div class="legal-links">
                                <button id="privacyBtn">Privacy Policy</button>
                                <button id="termsBtn">Terms of Service</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            // ----- HOME (Dashboard) -----
            function getHomeHTML() {
                return `
                    <div class="header">
                        <h1>Dashboard</h1>
                        <button class="profile-btn" id="profileHeaderBtn">${icons.profile}</button>
                    </div>
                    <div class="content">
                        <div class="section-title">🔥 4 day streak</div>
                        <div class="stats-row">
                            <div class="stat-card"><span class="stat-number">68</span><br>XP today</div>
                            <div class="stat-card"><span class="stat-number">342</span><br>total</div>
                        </div>
                        <div class="section-title">next lesson</div>
                        <div class="lesson-item" id="openLearn">
                            ${icons.lesson} <div><strong>Variables & data types</strong><br><span class="badge">5 min</span></div>
                        </div>
                        <div class="section-title">daily goal</div>
                        <div class="stat-card">
                            <span>20 XP remaining</span>
                            <div class="progress-bar"><div class="progress-fill" style="width:68%"></div></div>
                        </div>
                        <div class="flex-row">
                            <span class="badge">🏆 3 achievements</span>
                        </div>
                    </div>
                `;
            }

            // ----- LEARN / practice -----
            function getLearnHTML() {
                return `
                    <div class="header">
                        <h1>Practice</h1>
                        <button class="profile-btn" id="profileHeaderBtn">${icons.profile}</button>
                    </div>
                    <div class="content">
                        <div class="lesson-item">${icons.play} <span><strong>1. Hello, world!</strong> <span class="badge">start</span></span></div>
                        <div class="lesson-item">${icons.play} <span><strong>2. Variables</strong> <span class="badge">continue</span></span></div>
                        <div class="lesson-item">${icons.play} <span><strong>3. Lists</strong> <span class="badge">locked</span></span></div>
                        <div class="lesson-item">${icons.flashcards} <span><strong>Flashcards: keywords</strong></span></div>
                        <button class="btn-primary" style="margin-top:8px;" id="practiceNow">start practice</button>
                    </div>
                `;
            }

            // ----- PROGRESS -----
            function getProgressHTML() {
                return `
                    <div class="header">
                        <h1>Progress</h1>
                        <button class="profile-btn" id="profileHeaderBtn">${icons.profile}</button>
                    </div>
                    <div class="content">
                        <div class="stat-card">lessons completed: <strong>12/48</strong><div class="progress-bar"><div class="progress-fill" style="width:25%"></div></div></div>
                        <div class="chart-simple" id="chartContainer">
                            <div class="bar" style="height:60px"></div><div class="bar" style="height:90px"></div><div class="bar" style="height:40px"></div><div class="bar" style="height:70px"></div><div class="bar" style="height:100px"></div>
                        </div>
                        <div class="flex-row"><span class="badge">🔥 4 weeks</span><span class="badge">⭐ 8 skills</span></div>
                    </div>
                `;
            }

            // ----- SETTINGS / profile -----
            function getSettingsHTML() {
                const isDark = document.body.classList.contains('dark');
                return `
                    <div class="header">
                        <h1>Settings</h1>
                        <button class="profile-btn" id="profileHeaderBtn">${icons.profile}</button>
                    </div>
                    <div class="content">
                        <div class="setting-item">
                            <span>Dark mode</span>
                            <input type="checkbox" class="toggle-switch" id="darkToggle" ${isDark ? 'checked' : ''}>
                        </div>
                        <div class="setting-item">Sound effects</div>
                        <div class="setting-item">Daily reminder</div>
                        <div class="setting-item">Privacy & terms</div>
                    </div>
                `;
            }

            // modal system
            function showModal(text) {
                const modal = document.createElement('div');
                modal.className = 'modal';
                modal.innerHTML = `<div class="modal-card"><p>${text}</p><button id="closeModalBtn">Close</button></div>`;
                document.getElementById('modalContainer').parentNode.appendChild(modal);
                document.getElementById('closeModalBtn').addEventListener('click', ()=> modal.remove());
            }

            function attachListeners() {
                // profile header
                document.querySelectorAll('#profileHeaderBtn').forEach(btn => {
                    btn.addEventListener('click', ()=> {
                        currentScreen = 'settings';
                        renderScreen(); renderBottomNav('settings');
                    });
                });
                // get started
                const getStarted = document.getElementById('getStartedBtn');
                if(getStarted) getStarted.addEventListener('click', ()=>{
                    currentScreen = 'home';
                    renderScreen(); renderBottomNav('home');
                });
                // privacy & terms
                document.getElementById('privacyBtn')?.addEventListener('click', ()=> showModal('Privacy policy — dummy text'));
                document.getElementById('termsBtn')?.addEventListener('click', ()=> showModal('Terms of service — dummy text'));
                // lesson navigation
                document.getElementById('openLearn')?.addEventListener('click', ()=>{
                    currentScreen = 'learn';
                    renderScreen(); renderBottomNav('learn');
                });
                document.getElementById('practiceNow')?.addEventListener('click', ()=> {
                    alert('starting practice (simulated)');
                });
                // dark mode toggle
                const darkToggle = document.getElementById('darkToggle');
                if(darkToggle) {
                    darkToggle.addEventListener('change', (e)=>{
                        if(e.target.checked) {
                            document.body.classList.add('dark');
                        } else {
                            document.body.classList.remove('dark');
                        }
                    });
                }
            }

            // ----- SCREENSHOT (SHIFT+W) -----
            document.addEventListener('keydown', async (e) => {
                if(e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    const phone = document.getElementById('phoneFrame');
                    const canvas = document.getElementById('screenshotCanvas');
                    const ctx = canvas.getContext('2d');
                    const scale = 2;
                    canvas.width = 360 * scale;
                    canvas.height = 780 * scale;

                    // use html2canvas-like manual? but we have to use dom-to-image? just use rasterizeHTML? but we use built-in: simple, we'll draw a rectangle
                    // simplified: since it's a prototype, we'll just output a dummy colored rect as placeholder (real screenshot would need lib)
                    // we'll simulate: fill white/dark and text (keeping interactive)
                    ctx.fillStyle = document.body.classList.contains('dark') ? '#0F172A' : '#F8FAFC';
                    ctx.fillRect(0,0,canvas.width, canvas.height);
                    ctx.fillStyle = document.body.classList.contains('dark') ? 'white' : 'black';
                    ctx.font = 'bold 28px Inter';
                    ctx.fillText('Python Lab', 40, 200);
                    ctx.font = '20px Inter';
                    ctx.fillText(currentScreen, 40, 300);
                    // generate filename
                    const isDark = document.body.classList.contains('dark');
                    let filename = '';
                    const seq = ['onboarding','home','learn','progress','settings'];
                    const index = seq.indexOf(currentScreen)+1;
                    if (isDark) filename = '6.png';
                    else filename = index+'.png';
                    // trigger download
                    const link = document.createElement('a');
                    link.download = filename;
                    canvas.toBlob((blob)=> {
                        link.href = URL.createObjectURL(blob);
                        link.click();
                    });
                }
            });

            // initial render
            renderScreen();
            renderBottomNav('onboarding');
        })();
    </script>
</body>
</html>
