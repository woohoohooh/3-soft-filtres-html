```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python · codeSpark • 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --text-muted: #64748B;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive-icon: #94A3B8;
            --nav-bg: #FFFFFF;
            --shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.03);
            --progress-bg: #E2E8F0;
            --badge-glow: #DBEAFE;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --text-muted: #94A3B8;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive-icon: #64748B;
            --nav-bg: #1E293B;
            --shadow: 0 8px 20px rgba(0,0,0,0.5);
            --progress-bg: #334155;
            --badge-glow: #1E3A5F;
        }

        body {
            background: #1a202c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.3), 0 0 0 8px #2d3748;
            position: relative;
            transition: background-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        /* inner screen */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: none;
            background: var(--bg);
            transition: background-color 0.2s;
        }
        .app-screen::-webkit-scrollbar { display: none; }

        /* header */
        .header {
            padding: 16px 20px 8px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: transparent;
        }
        .header h2 {
            font-size: 22px;
            font-weight: 650;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            transition: background 0.1s;
        }
        .profile-btn:hover { background: var(--border-light); }
        .profile-icon svg { stroke: var(--text-primary); width: 26px; height: 26px; }

        /* main content */
        .content {
            flex: 1;
            padding: 8px 20px 12px 20px;
        }

        /* bottom navigation */
        .bottom-nav {
            background: var(--nav-bg);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-around;
            padding: 6px 12px 14px;
            border-radius: 0 0 48px 48px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
            transition: background 0.2s;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px 0 4px;
            border-radius: 20px;
            transition: all 0.15s ease;
            color: var(--inactive-icon);
            fill: none;
            stroke: var(--inactive-icon);
        }
        .nav-item.active {
            stroke: var(--primary);
            color: var(--primary);
            background: rgba(37, 99, 235, 0.08);
            transform: scale(1.02);
        }
        .nav-item.active svg {
            stroke: var(--primary);
            transform: scale(1.1);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: all 0.15s;
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            margin-top: 3px;
            color: currentColor;
        }

        /* onboarding card, modals etc */
        .onboarding-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0 16px;
        }
        .big-logo svg { width: 72px; height: 72px; stroke: var(--primary); stroke-width:1.8; }
        .app-name {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
            margin-top: 8px;
        }
        .tagline {
            font-size: 18px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .desc {
            text-align: center;
            color: var(--text-muted);
            margin: 16px 0 28px;
            line-height: 1.5;
        }
        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            font-size: 18px;
            padding: 16px;
            width: 100%;
            border-radius: 22px;
            box-shadow: 0 6px 0 var(--primary-dark);
            transition: 0.1s ease;
            cursor: pointer;
            margin-bottom: 24px;
        }
        .btn-primary:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--primary-dark); }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
        }
        .link-row button {
            background: none;
            border: none;
            color: var(--text-muted);
            text-decoration: underline;
            font-size: 14px;
            cursor: pointer;
        }

        /* cards / lesson items */
        .dashboard-card {
            background: var(--card);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }
        .row-space {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .badge {
            background: var(--badge-glow);
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
        }
        .progress-bar {
            height: 10px;
            background: var(--progress-bg);
            border-radius: 20px;
            margin: 16px 0 6px;
        }
        .progress-fill {
            width: 64%;
            height: 10px;
            background: var(--primary);
            border-radius: 20px;
            transition: width 0.3s;
        }
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .lesson-item:last-child { border: none; }
        .icon-small svg { width: 32px; height: 32px; stroke: var(--primary); stroke-width:2; }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
        }
        .stat-card {
            background: var(--card);
            border-radius: 20px;
            padding: 18px 12px;
            border: 1px solid var(--border-light);
            text-align: center;
        }
        .stat-number { font-size: 28px; font-weight: 700; color: var(--primary); }
        /* chart placeholder */
        .mini-chart {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 80px;
            margin: 20px 0;
        }
        .bar {
            width: 20%;
            background: var(--accent);
            border-radius: 12px 12px 4px 4px;
            height: calc(100% * var(--h));
            transition: height 0.3s;
        }

        /* modal */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal.hidden { display: none; }
        .modal-content {
            background: var(--card);
            width: 280px;
            padding: 24px;
            border-radius: 36px;
            color: var(--text-primary);
            text-align: center;
            border: 2px solid var(--border-light);
        }
        .modal-content button {
            margin-top: 20px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        /* theme toggle inside settings */
        .theme-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 24px 0;
        }
        .toggle-switch {
            width: 52px;
            height: 28px;
            background: var(--border-light);
            border-radius: 40px;
            position: relative;
            cursor: pointer;
            border: 2px solid var(--text-muted);
        }
        .toggle-knob {
            width: 24px; height: 24px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px; left: 2px;
            transition: 0.2s;
        }
        body.dark .toggle-knob { left: 26px; background: var(--primary); }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <div class="app-screen" id="appScreen">
        <!-- header will be injected per screen -->
        <div id="headerPlaceholder"></div>
        <div class="content" id="contentArea"></div>
        <!-- bottom nav -->
        <div class="bottom-nav" id="bottomNav"></div>
    </div>
</div>

<!-- hidden canvas for screenshot -->
<canvas id="screenshotCanvas" style="display:none"></canvas>

<script>
    (function() {
        // ----- ICON SYSTEM (inline svg) -----
        function icon(name, cls = '') {
            const icons = {
                home: `<svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2h-5v-8h-4v8H5a2 2 0 0 1-2-2z"/></svg>`,
                learn: `<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
                progress: `<svg viewBox="0 0 24 24"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/></svg>`,
                settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`,
                profile: `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
                lesson: `<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>`,
                chart: `<svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`,
                flashcards: `<svg viewBox="0 0 24 24"><path d="M4 7h16v12H4z"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>`,
                play: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>`,
                check: `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`
            };
            return icons[name] || icons['home'];
        }

        // ----- APP STATE -----
        let currentScreen = 'onboarding'; // screens: onboarding, home, learn, progress, settings
        let darkMode = false;
        let screenshotCounter = 0;

        // DOM elements
        const appScreen = document.getElementById('appScreen');
        const headerPlaceholder = document.getElementById('headerPlaceholder');
        const contentArea = document.getElementById('contentArea');
        const bottomNav = document.getElementById('bottomNav');

        // Helper: render header
        function renderHeader(title) {
            return `
                <div class="header">
                    <h2>${title}</h2>
                    <button class="profile-btn" id="profileHeaderBtn">
                        <span class="profile-icon">${icon('profile')}</span>
                    </button>
                </div>
            `;
        }

        // bottom navigation render
        function renderBottomNav(active) {
            const items = [
                { id: 'home', label: 'Home', icon: 'home' },
                { id: 'learn', label: 'Learn', icon: 'learn' },
                { id: 'progress', label: 'Progress', icon: 'progress' },
                { id: 'settings', label: 'Settings', icon: 'settings' }
            ];
            return items.map(item => {
                const activeClass = item.id === active ? 'active' : '';
                return `<button class="nav-item ${activeClass}" data-nav="${item.id}">
                    ${icon(item.icon)}<span class="nav-label">${item.label}</span>
                </button>`;
            }).join('');
        }

        // ------ SCREEN CONTENT ------
        function getScreenContent(screen) {
            switch(screen) {
                case 'onboarding':
                    return `
                        <div class="onboarding-logo">
                            <div class="big-logo">${icon('flashcards')}</div>
                            <div class="app-name">PyLearn</div>
                            <div class="tagline">code in your pocket</div>
                        </div>
                        <div class="desc">Master Python through bite-sized exercises, real‑time feedback, and daily challenges. No laptop needed.</div>
                        <button class="btn-primary" id="getStartedBtn">Get Started</button>
                        <div class="link-row">
                            <button id="privacyModalBtn">Privacy Policy</button>
                            <button id="termsModalBtn">Terms of Service</button>
                        </div>
                    `;
                case 'home':
                    return `
                        <div class="dashboard-card">
                            <div class="row-space"><span class="badge">🔥 12 day streak</span><span>⭐ 340 XP</span></div>
                            <h3 style="color: var(--text-primary);">Continue where you left</h3>
                            <div class="lesson-item">
                                <span class="icon-small">${icon('play')}</span>
                                <div style="flex:1"><strong>Variables & Data Types</strong><div class="progress-bar" style="margin:6px 0 0;"><div class="progress-fill" style="width:80%"></div></div></div>
                            </div>
                            <div class="lesson-item">
                                <span class="icon-small">${icon('lesson')}</span>
                                <div style="flex:1"><strong>If/else conditions</strong><div class="progress-bar" style="margin:6px 0 0;"><div class="progress-fill" style="width:30%"></div></div></div>
                            </div>
                        </div>
                        <div class="dashboard-card">
                            <div class="row-space"><h4>Daily pick</h4><span>${icon('flashcards')}</span></div>
                            <p style="color: var(--text-secondary);">"List comprehension" – 5 min read</p>
                            <button class="btn-primary" style="padding:12px; font-size:16px; margin:10px 0 0;" id="startPracticeBtn">Start practice</button>
                        </div>
                    `;
                case 'learn':
                    return `
                        <div style="margin-bottom:16px"><input placeholder="Search lessons" style="width:100%; padding:14px; border-radius:30px; border:1px solid var(--border-light); background:var(--card); color:var(--text-primary);"></div>
                        <div class="lesson-item"><span class="icon-small">${icon('lesson')}</span><div><strong>Python Basics</strong><span style="color:var(--text-muted);"> 12 exercises</span></div></div>
                        <div class="lesson-item"><span class="icon-small">${icon('lesson')}</span><div><strong>Functions</strong><span style="color:var(--text-muted);"> 8 exercises</span></div></div>
                        <div class="lesson-item"><span class="icon-small">${icon('flashcards')}</span><div><strong>OOP flashcards</strong><span style="color:var(--text-muted);"> 20 cards</span></div></div>
                        <div class="lesson-item"><span class="icon-small">${icon('play')}</span><div><strong>Algorithms</strong><span style="color:var(--text-muted);"> 6 challenges</span></div></div>
                        <button class="btn-primary" style="margin-top:20px;" id="startPracticeBtn2">start quick lesson</button>
                    `;
                case 'progress':
                    return `
                        <div class="stat-grid">
                            <div class="stat-card"><div class="stat-number">47</div><span>lessons</span></div>
                            <div class="stat-card"><div class="stat-number">12</div><span>days</span></div>
                        </div>
                        <div class="dashboard-card">
                            <h4>Weekly activity</h4>
                            <div class="mini-chart">
                                <div class="bar" style="--h:0.6"></div><div class="bar" style="--h:0.8"></div><div class="bar" style="--h:0.4"></div><div class="bar" style="--h:1"></div><div class="bar" style="--h:0.7"></div>
                            </div>
                        </div>
                        <div class="dashboard-card">
                            <span class="badge">${icon('check')} achievements</span>
                            <p>🔥 7 day streak, 🐍 pythonista</p>
                        </div>
                    `;
                case 'settings':
                    return `
                        <div class="dashboard-card">
                            <div class="theme-row">
                                <span>Dark theme</span>
                                <div class="toggle-switch" id="themeToggle"><div class="toggle-knob"></div></div>
                            </div>
                            <div style="margin: 24px 0;">Profile: <strong>Alex C.</strong>  ${icon('profile')}</div>
                            <button style="background:none; border:1px solid var(--border-light); padding:12px; border-radius:40px;">Edit profile</button>
                        </div>
                        <div class="dashboard-card">
                            <p>Sound · Notifications · Download</p>
                        </div>
                    `;
                default: return '';
            }
        }

        function updateUI() {
            let title = currentScreen === 'onboarding' ? 'Welcome' :
                        currentScreen === 'home' ? 'Dashboard' :
                        currentScreen === 'learn' ? 'Lessons' :
                        currentScreen === 'progress' ? 'Statistics' : 'Settings';
            headerPlaceholder.innerHTML = renderHeader(title);
            contentArea.innerHTML = getScreenContent(currentScreen);
            let activeNav = (currentScreen === 'onboarding' || currentScreen === 'settings') ? currentScreen : 
                            (currentScreen === 'home' ? 'home' : currentScreen);
            if (currentScreen === 'onboarding') activeNav = 'home'; // just visual placeholder
            bottomNav.innerHTML = renderBottomNav(activeNav === 'onboarding' ? 'home' : activeNav);

            // Attach nav listeners
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const navId = btn.dataset.nav;
                    if (navId === 'home') currentScreen = 'home';
                    else if (navId === 'learn') currentScreen = 'learn';
                    else if (navId === 'progress') currentScreen = 'progress';
                    else if (navId === 'settings') currentScreen = 'settings';
                    updateUI();
                });
            });

            // profile button
            const profileBtn = document.getElementById('profileHeaderBtn');
            if (profileBtn) profileBtn.addEventListener('click', () => {
                currentScreen = 'settings';
                updateUI();
            });

            // onboarding specific
            if (currentScreen === 'onboarding') {
                document.getElementById('getStartedBtn')?.addEventListener('click', () => {
                    currentScreen = 'home';
                    updateUI();
                });
                document.getElementById('privacyModalBtn')?.addEventListener('click', () => showModal('Privacy Policy', 'We protect your data like our own.'));
                document.getElementById('termsModalBtn')?.addEventListener('click', () => showModal('Terms of Service', 'Keep learning, be nice.'));
            }

            // start practice (any)
            document.getElementById('startPracticeBtn')?.addEventListener('click', ()=>{
                alert('▶️ Starting Python exercise!');
            });
            document.getElementById('startPracticeBtn2')?.addEventListener('click', ()=>{
                alert('▶️ Launching quick lesson');
            });

            // theme toggle inside settings
            if (currentScreen === 'settings') {
                const toggle = document.getElementById('themeToggle');
                if (toggle) {
                    toggle.addEventListener('click', (e) => {
                        e.stopPropagation();
                        darkMode = !darkMode;
                        document.body.classList.toggle('dark', darkMode);
                        updateUI(); 
                    });
                }
            }
        }

        // modal
        function showModal(title, msg) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `<div class="modal-content"><h3>${title}</h3><p>${msg}</p><button id="closeModalBtn">OK</button></div>`;
            document.body.appendChild(modal);
            document.getElementById('closeModalBtn').addEventListener('click', ()=> modal.remove());
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
        }

        // SCREENSHOT feature (shift+W)

        // initial render
