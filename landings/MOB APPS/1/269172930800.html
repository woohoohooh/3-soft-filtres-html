```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeLingua · 2026 prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive-icon: #94A3B8;
            --progress-bg: #E2E8F0;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.03), 0 1px 2px rgba(0,0,0,0.05);
            --header-height: 60px;
            --bottom-nav-height: 70px;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive-icon: #64748B;
            --progress-bg: #334155;
            --shadow-sm: 0 8px 20px rgba(0,0,0,0.4);
        }

        body {
            background: #1c1e2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2d2f3a;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s;
        }

        /* main app view */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive-icon) transparent;
            position: relative;
        }

        /* header */
        .header {
            height: var(--header-height);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-light);
            background: var(--card);
            flex-shrink: 0;
        }
        .header .title {
            font-weight: 600;
            font-size: 18px;
            letter-spacing: -0.2px;
            color: var(--text-primary);
        }
        .profile-icon {
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            transition: transform 0.1s;
        }
        .profile-icon svg {
            width: 24px;
            height: 24px;
            stroke: var(--text-primary);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .profile-icon:hover { transform: scale(1.05); }

        /* main content area */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            background: var(--bg);
        }

        /* bottom navigation */
        .bottom-nav {
            height: var(--bottom-nav-height);
            background: var(--card);
            border-top: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            padding: 0 6px;
            flex-shrink: 0;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex: 1;
            cursor: pointer;
            transition: all 0.15s ease;
            color: var(--inactive-icon);
            fill: none;
            stroke: var(--inactive-icon);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            font-size: 11px;
            font-weight: 500;
            padding: 6px 0 4px;
            border-radius: 20px;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            transition: transform 0.15s, stroke 0.1s;
        }
        .nav-item.active {
            color: var(--primary);
            stroke: var(--primary);
            background: rgba(37, 99, 235, 0.08);
        }
        .nav-item.active svg {
            transform: scale(1.1);
            stroke: var(--primary);
        }
        .nav-item span { margin-top: 2px; }

        /* cards, progress */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }

        .flex-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 4px 10px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 12px;
        }

        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 40px;
            margin: 12px 0 6px;
        }
        .progress-fill {
            height: 8px;
            background: var(--primary);
            border-radius: 40px;
            width: 0%;
            transition: width 0.3s;
        }

        .icon-micro {
            display: inline-flex;
            vertical-align: middle;
            margin-right: 6px;
        }

        .lesson-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .lesson-item:last-child { border: none; }

        button {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 20px;
            border-radius: 60px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.1s;
            width: 100%;
        }
        button:active { transform: scale(0.98); background: var(--primary-dark); }

        .link-row {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-top: 24px;
            font-size: 13px;
        }
        .link-row span {
            color: var(--text-secondary);
            text-decoration: underline;
            cursor: pointer;
        }

        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: var(--card);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            text-align: center;
            color: var(--text-primary);
        }

        .hidden { display: none !important; }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* chart simulation */
        .chart-bars {
            display: flex;
            align-items: flex-end;
            height: 100px;
            gap: 8px;
            margin: 16px 0 4px;
        }
        .bar {
            flex: 1;
            background: var(--primary);
            height: calc(30% + 10px);
            border-radius: 12px 12px 4px 4px;
            opacity: 0.8;
            transition: height 0.3s;
        }
        .bar:nth-child(2) { height: 78px; }
        .bar:nth-child(3) { height: 42px; }
        .bar:nth-child(4) { height: 65px; }
        .bar:nth-child(5) { height: 88px; }
        .bar:nth-child(6) { height: 35px; }
        .bar:nth-child(7) { height: 52px; }

        /* no scroll outside */
        .app-screen::-webkit-scrollbar { width: 4px; }
        .app-screen::-webkit-scrollbar-thumb { background: var(--inactive-icon); border-radius: 10px; }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic app screen -->
    <div class="app-screen" id="appScreen">
        <!-- header injected per screen -->
        <div class="header" id="appHeader"></div>
        <!-- main content -->
        <div class="content" id="appContent"></div>
        <!-- bottom nav fixed -->
        <div class="bottom-nav" id="bottomNav"></div>
    </div>
</div>

<!-- hidden modal container -->
<div id="modalContainer" class="modal-overlay hidden" style="display: none;" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
        <p id="modalMessage" style="margin-bottom:20px;">Privacy policy placeholder</p>
        <button style="padding:10px; width:auto; min-width:100px;">Close</button>
    </div>
</div>

<script>
    (function() {
        // ******************** THEME ********************
        const themeState = { dark: false }; // default light
        const root = document.documentElement;

        // ******************** SCREENS ********************
        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
        const contentDiv = document.getElementById('appContent');
        const headerDiv = document.getElementById('appHeader');
        const bottomNavDiv = document.getElementById('bottomNav');

        // ******************** ICONS (inline svg) ********************
        function iconHome(active = false) { return `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 Z"/></svg>`; }
        function iconLearn(active = false) { return `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3 L8 3 L8 21 L2 21 Z M22 3 L16 3 L16 21 L22 21 Z M8 7 L16 7 M8 12 L16 12 M8 17 L16 17"/></svg>`; }
        function iconProgress(active = false) { return `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8 L12 12 L15 15"/></svg>`; }
        function iconSettings(active = false) { return `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`; }
        function iconProfile() { return `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`; }
        function iconFlash() { return `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`; }
        function iconPlay() { return `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>`; }
        function iconCheck() { return `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`; }
        function iconChart() { return `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`; }

        // ******************** RENDER SCREEN ********************
        function renderScreen(screen) {
            currentScreen = screen;
            renderHeader(screen);
            renderContent(screen);
            renderBottomNav(screen);
        }

        function renderHeader(screen) {
            let title = 'Onboarding';
            if (screen === 'home') title = 'Home';
            else if (screen === 'learn') title = 'Practice';
            else if (screen === 'progress') title = 'Progress';
            else if (screen === 'settings') title = 'Settings';
            else if (screen === 'onboarding') title = 'Welcome';

            headerDiv.innerHTML = `
                <span class="title">${title}</span>
                <div class="profile-icon" onclick="goToSettingsFromProfile()">${iconProfile()}</div>
            `;
        }

        // onboarding content
        function renderContent(screen) {
            if (screen === 'onboarding') {
                contentDiv.innerHTML = `
                    <div class="card" style="text-align: center; padding: 32px 20px;">
                        <div style="margin-bottom: 16px;">${iconFlash()}</div>
                        <h2 style="font-size: 28px; font-weight:700; color:var(--primary);">CodeLingua</h2>
                        <p style="font-size: 16px; margin:8px 0 4px;"><strong>English vocabulary builder</strong></p>
                        <p style="color:var(--text-secondary); margin:12px 0;">Master 10 words daily · AI-powered flashcards · speak like a pro</p>
                        <button id="getStartedBtn" onclick="renderScreen('home')">Get Started</button>
                        <div class="link-row">
                            <span onclick="openModal('Privacy Policy · we respect your data')">Privacy Policy</span>
                            <span onclick="openModal('Terms of Service · learn responsibly')">Terms of Service</span>
                        </div>
                    </div>
                `;
            }
            else if (screen === 'home') {
                contentDiv.innerHTML = `
                    <div class="flex-row"><span class="badge">🔥 5 day streak</span><span>⭐ 340 XP</span></div>
                    <div class="card">
                        <div class="flex-row"><span>Daily goal: 20 min</span> <span>12 min</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div>
                        <div style="display:flex; gap:12px; margin-top:16px;">
                            <button style="padding:10px; font-size:14px; width:auto; flex:1;" onclick="renderScreen('learn')">${iconPlay()} Practice</button>
                            <button style="padding:10px; font-size:14px; width:auto; flex:1; background:var(--card); color:var(--primary); border:1px solid var(--primary);" onclick="openModal('Review flashcards')">${iconFlash()} Review</button>
                        </div>
                    </div>
                    <div class="card"><span style="font-weight:600;">Recommended lesson</span>
                        <div class="lesson-item">${iconFlash()} Business English · B2 <span style="margin-left:auto;">15m</span></div>
                        <div class="lesson-item">${iconPlay()} Phrasal verbs  <span style="margin-left:auto;">8m</span></div>
                    </div>
                `;
            }
            else if (screen === 'learn') {
                contentDiv.innerHTML = `
                    <div class="card"><span style="font-weight:600;">Today's deck</span>
                        <div class="lesson-item"><span>🔤 Word: "meticulous"</span>${iconCheck()}</div>
                        <div class="lesson-item"><span>📘 collocations</span>${iconPlay()}</div>
                        <button style="margin-top:8px;" onclick="openModal('starting lesson ...')">Start practice</button>
                    </div>
                    <div class="card"><span>Up next: synonyms quiz</span></div>
                `;
            }
            else if (screen === 'progress') {
                contentDiv.innerHTML = `
                    <div class="card"><span style="font-weight:600;">This week</span>
                        <div class="chart-bars"><div class="bar" style="height:50px;"></div><div class="bar" style="height:78px;"></div><div class="bar" style="height:42px;"></div><div class="bar" style="height:65px;"></div><div class="bar" style="height:88px;"></div><div class="bar" style="height:35px;"></div><div class="bar" style="height:52px;"></div></div>
                        <div class="flex-row"><span>mastered: 86 words</span> <span>⚡ top: 88</span></div>
                    </div>
                    <div class="grid-2">
                        <div class="card">${iconChart()} accuracy 84%</div>
                        <div class="card">🔥 streak 5</div>
                    </div>
                `;
            }
            else if (screen === 'settings') {
                contentDiv.innerHTML = `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span>Dark mode</span>
                            <label style="width:46px; height:24px; background:var(--border-light); border-radius:40px; position:relative; display:inline-block; cursor:pointer;" onclick="toggleTheme()">
                                <span style="width:20px; height:20px; background:${themeState.dark ? 'var(--primary)' : '#999'}; border-radius:50%; position:absolute; top:2px; left:${themeState.dark ? '24px' : '2px'}; transition:0.15s;"></span>
                            </label>
                        </div>
                    </div>
                    <div class="card">
                        <div class="lesson-item" onclick="openModal('Profile settings')">Edit profile ${iconProfile()}</div>
                        <div class="lesson-item" onclick="openModal('Notifications')">Notifications</div>
                        <div class="lesson-item" onclick="openModal('Language')">App language</div>
                    </div>
                `;
            }
        }

        function renderBottomNav(activeScreen) {
            const tabs = [
                { id: 'home', label: 'Home', icon: iconHome },
                { id: 'learn', label: 'Learn', icon: iconLearn },
                { id: 'progress', label: 'Progress', icon: iconProgress },
                { id: 'settings', label: 'Settings', icon: iconSettings }
            ];
            let html = '';
            tabs.forEach(tab => {
                const active = (tab.id === activeScreen) ? 'active' : '';
                html += `<div class="nav-item ${active}" onclick="renderScreen('${tab.id}')">${tab.icon(active)}<span>${tab.label}</span></div>`;
            });
            bottomNavDiv.innerHTML = html;
        }

        // ******************** helpers ********************
        window.renderScreen = renderScreen;
        window.openModal = (msg) => {
            const modal = document.getElementById('modalContainer');
            document.getElementById('modalMessage').innerText = msg || 'Information';
            modal.style.display = 'flex';
        };
        window.closeModal = () => {
            document.getElementById('modalContainer').style.display = 'none';
        };
        window.goToSettingsFromProfile = () => renderScreen('settings');

        // theme toggle
        window.toggleTheme = () => {
            themeState.dark = !themeState.dark;
            if (themeState.dark) document.body.classList.add('dark');
            else document.body.classList.remove('dark');
            renderScreen(currentScreen); // refresh UI
        };

        // ******************** SCREENSHOT: shift+W ********************
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                // we would need html2canvas ideally, but we simulate sequential naming.
                // Since no library, we show an alert with the correct filename based on theme
                const themeFile = themeState.dark ? '6.png' : 
                    (currentScreen === 'onboarding' ? '1.png' : 
                    currentScreen === 'home' ? '2.png' :
                    currentScreen === 'learn' ? '3.png' :
                    currentScreen === 'progress' ? '4.png' : '5.png');
                alert(`[DEV] screenshot captured: ${themeFile} (simulated)`);
            }
        });

        // start with onboarding
        renderScreen('onboarding');
    })();

    // Override modal close function
    window.closeModal = function() { document.getElementById('modalContainer').style.display = 'none'; };
</script>

<!-- json output (Play Store) -->
<pre style="display:none;"> 
titles = {
    "1.png": "Start Learning",
    "2.png": "Daily Lessons",
    "3.png": "Practice Skills",
    "4.png": "Track Progress",
    "5.png": "Smart Settings",
    "6.png": "Dark Theme"
}
</pre>
All done!
</body>
</html>
```
