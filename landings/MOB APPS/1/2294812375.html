```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Brain Trainer · 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #475569;
            --primary: #2563EB;
            --secondary: #1E40AF;
            --accent: #38BDF8;
            --border: #E2E8F0;
            --icon-inactive: #94A3B8;
            --nav-highlight: rgba(37, 99, 235, 0.08);
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            --bar-fill: #2563EB20;
            --badge: #2563EB10;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #94A3B8;
            --primary: #3B82F6;
            --secondary: #2563EB;
            --accent: #38BDF8;
            --border: #334155;
            --icon-inactive: #64748B;
            --nav-highlight: #3B82F620;
            --bar-fill: #3B82F630;
            --badge: #3B82F620;
        }

        body {
            background: #1a202c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2d3e50;
            position: relative;
            transition: background-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        /* app screen (flex column: header / main / bottom nav) */
        .app-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: relative;
        }

        /* header */
        .header {
            padding: 20px 16px 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card);
            border-bottom: 1px solid var(--border);
        }
        .header-title {
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: -0.3px;
            color: var(--text);
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }
        .profile-btn:hover { background: var(--nav-highlight); }

        /* main scrollable area */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            scrollbar-width: thin;
            background: var(--bg);
        }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 12px 12px;
            background-color: var(--card);
            border-top: 1px solid var(--border);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 16px;
            transition: all 0.15s ease;
            gap: 4px;
            flex: 1;
            max-width: 70px;
            color: var(--icon-inactive);
        }
        .nav-item.active {
            color: var(--primary);
            background: var(--nav-highlight);
            transform: scale(1.05);
        }
        .nav-item svg {
            width: 26px;
            height: 26px;
            stroke: currentColor;
            stroke-width: 2px;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-label {
            font-size: 0.7rem;
            font-weight: 500;
        }

        /* UI cards */
        .card {
            background: var(--card);
            border-radius: 28px;
            padding: 18px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge {
            background: var(--badge);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
        }
        .progress-bar-bg {
            height: 10px;
            background: var(--border);
            border-radius: 20px;
            margin: 10px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 10px;
            background: var(--primary);
            width: 0%;
            border-radius: 20px;
            transition: width 0.3s;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-item {
            background: var(--bg);
            border-radius: 24px;
            padding: 16px 12px;
            text-align: center;
        }
        .stat-number {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.2;
        }
        .stat-label {
            color: var(--text-light);
            font-size: 0.8rem;
        }

        .lesson-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .lesson-item:last-child { border: none; }

        button.primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 24px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 8px 18px #2563eb40;
            transition: 0.1s;
        }
        button.primary:active { transform: scale(0.98); }

        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 16px;
        }
        .link-row button {
            background: none;
            border: none;
            color: var(--primary);
            text-decoration: underline;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* modal */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-card {
            background: var(--card);
            width: 280px;
            border-radius: 32px;
            padding: 24px;
            text-align: center;
            color: var(--text);
            border: 1px solid var(--border);
        }
        .modal-card button {
            margin-top: 16px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        /* screenshot canvas (hidden) */
        #screenshotCanvas { display: none; }
    </style>
</head>
<body>
    <div class="phone" id="phoneContainer">
        <!-- dynamic screen will be injected via js -->
    </div>

    <canvas id="screenshotCanvas" width="360" height="780"></canvas>

    <script>
        (function(){
            // ---------- THEME ----------
            let darkMode = false;
            const root = document.documentElement;

            // ---------- ICONS (inline SVG) ----------
            const icons = {
                home: `<svg viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 L3 10 Z"/></svg>`,
                learn: `<svg viewBox="0 0 24 24"><path d="M2 3 L12 3 L12 21 L2 21 L2 3 Z M12 7 L22 7 L22 12 L12 12 Z M22 16 L12 16 L12 21 L22 21 Z"/></svg>`,
                progress: `<svg viewBox="0 0 24 24"><path d="M21 12 L18 12 L18 21 M15 8 L12 8 L12 21 M9 5 L6 5 L6 21 M3 2 L3 21"/></svg>`,
                settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82L12 22z M12 2v3 M19 5l-2 2 M5 5l2 2"/></svg>`,
                profile: `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
                lesson: `<svg viewBox="0 0 24 24"><path d="M4 4 L20 4 L20 20 L4 20 Z M8 8 L16 8 M8 12 L16 12 M8 16 L13 16"/></svg>`,
                chart: `<svg viewBox="0 0 24 24"><path d="M21 20 L3 20 L3 4 M8 16 L8 10 M13 16 L13 6 M18 16 L18 12"/></svg>`,
                flashcards: `<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8 L15 8 M9 12 L15 12 M9 16 L13 16"/></svg>`,
                play: `<svg viewBox="0 0 24 24"><polygon points="8 5 19 12 8 19 8 5"/></svg>`,
                check: `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`,
            };

            // ---------- APP STATE ----------
            let currentScreen = 'onboarding'; // 'onboarding', 'home', 'learn', 'progress', 'settings'
            let capturedCount = 0;

            // ---------- NAVIGATION ----------
            function navigate(screen) {
                currentScreen = screen;
                renderApp();
            }

            // ---------- MODALS ----------
            let modalContent = '';
            function showModal(text) {
                modalContent = text;
                document.getElementById('modal').style.display = 'flex';
            }
            function closeModal() {
                document.getElementById('modal').style.display = 'none';
            }

            // ---------- THEME TOGGLE ----------
            function toggleTheme() {
                darkMode = !darkMode;
                if (darkMode) document.body.classList.add('dark');
                else document.body.classList.remove('dark');
                renderApp(); // re-render to update theme-specific content
            }

            // ---------- PROGRESS ANIMATION ----------
            function updateProgressBars() {
                // simulate progress after render
                const fills = document.querySelectorAll('.progress-fill');
                fills.forEach(f => { f.style.width = '65%'; }); // example
            }

            // ---------- RENDER SCREEN ----------
            function renderApp() {
                const container = document.getElementById('phoneContainer');
                let content = '';

                // header
                let headerTitle = 'Math Brain';
                if (currentScreen === 'home') headerTitle = 'Dashboard';
                else if (currentScreen === 'learn') headerTitle = 'Training';
                else if (currentScreen === 'progress') headerTitle = 'Stats';
                else if (currentScreen === 'settings') headerTitle = 'Settings';
                else if (currentScreen === 'onboarding') headerTitle = 'Math Brain';

                content += `
                    <div class="app-screen">
                        <div class="header">
                            <span class="header-title">${headerTitle}</span>
                            <button class="profile-btn" id="profileHeaderBtn">${icons.profile}</button>
                        </div>
                        <div class="main-content" id="mainContent">
                `;

                // dynamic screen
                if (currentScreen === 'onboarding') {
                    content += `
                        <div class="card" style="text-align:center;">
                            <div style="margin: 16px 0 12px;">${icons.flashcards.replace('<svg','<svg width="60" height="60" style="stroke: var(--primary);"')}</div>
                            <h2 style="color: var(--primary);">Math Brain</h2>
                            <p style="font-size: 1.2rem; font-weight: 300;">train daily · think faster</p>
                            <p style="margin: 16px 0; color: var(--text-light);">Adaptive arithmetic & logic puzzles. Master numbers in 5 min a day.</p>
                            <button class="primary" id="getStartedBtn">Get Started</button>
                            <div class="link-row">
                                <button id="privacyLink">Privacy</button>
                                <button id="termsLink">Terms</button>
                            </div>
                        </div>
                    `;
                }
                else if (currentScreen === 'home') {
                    content += `
                        <div class="card">
                            <div class="flex-row"><span class="badge">⚡ daily streak 7</span><span>🔥 340 xp</span></div>
                            <h3 style="margin: 16px 0 8px;">Today's mission</h3>
                            <div class="flex-row"><span>Mental math</span><span>2/5</span></div>
                            <div class="progress-bar-bg"><div class="progress-fill" style="width:40%"></div></div>
                            <button class="primary" style="margin-top: 16px;" id="quickPractice">Practice now</button>
                        </div>
                        <div class="grid-2">
                            <div class="stat-item"><span class="stat-number">87</span><div class="stat-label">speed</div></div>
                            <div class="stat-item"><span class="stat-number">98%</span><div class="stat-label">accuracy</div></div>
                        </div>
                        <div class="card">
                            <div class="flex-row"><span style="font-weight:600;">Recommended</span> <span>${icons.play}</span></div>
                            <div class="lesson-item"><span>${icons.lesson}</span> <span>Multiplication rush</span></div>
                            <div class="lesson-item"><span>${icons.flashcards}</span> <span>Equation flash</span></div>
                        </div>
                    `;
                }
                else if (currentScreen === 'learn') {
                    content += `
                        <div class="card">
                            <h4>Arithmetic drills</h4>
                            <div class="lesson-item"><span>${icons.play}</span> <span>➕ Addition</span> <span class="badge">beginner</span></div>
                            <div class="lesson-item"><span>${icons.play}</span> <span>➖ Subtraction</span> <span class="badge">beginner</span></div>
                            <div class="lesson-item"><span>${icons.flashcards}</span> <span>✖️ Multiplication</span> <span class="badge">intermediate</span></div>
                            <div class="lesson-item"><span>${icons.flashcards}</span> <span>➗ Division</span> <span class="badge">advanced</span></div>
                        </div>
                        <div class="card">
                            <div class="flex-row"><span>Logic puzzles</span> <span>${icons.chart}</span></div>
                            <div class="progress-bar-bg"><div class="progress-fill" style="width:25%"></div></div>
                            <p>pattern recognition · 3 left</p>
                        </div>
                    `;
                }
                else if (currentScreen === 'progress') {
                    content += `
                        <div class="card">
                            <span class="badge">📊 last 7 days</span>
                            <div style="display:flex; gap:8px; margin:16px 0;">
                                <span>${icons.chart}</span> <span>${icons.chart}</span>
                            </div>
                            <div class="stat-item"><span class="stat-number">1,280</span><div class="stat-label">total xp</div></div>
                        </div>
                        <div class="card">
                            <div class="flex-row"><span>accuracy</span><span>82%</span></div>
                            <div class="progress-bar-bg"><div class="progress-fill" style="width:82%"></div></div>
                            <div class="flex-row"><span>daily goal</span><span>70%</span></div>
                            <div class="progress-bar-bg"><div class="progress-fill" style="width:70%"></div></div>
                        </div>
                        <div class="badge" style="display:inline-block;">🏅 3 achievements</div>
                    `;
                }
                else if (currentScreen === 'settings') {
                    content += `
                        <div class="card">
                            <div class="flex-row"><span>Dark mode</span> <button id="themeToggleBtn" class="badge" style="background:var(--primary); color:white;">toggle</button></div>
                        </div>
                        <div class="card">
                            <p>Profile</p>
                            <div class="lesson-item"><span>${icons.profile}</span>Display name: Brainiac</div>
                            <div class="lesson-item"><span>${icons.settings}</span>App version 2026.1</div>
                        </div>
                    `;
                }

                content += `</div>`; // close main-content

                // bottom navigation (only visible after onboarding)
                if (currentScreen !== 'onboarding') {
                    content += `
                        <div class="bottom-nav">
                            <button class="nav-item ${currentScreen==='home'?'active':''}" id="navHome">${icons.home}<span class="nav-label">Home</span></button>
                            <button class="nav-item ${currentScreen==='learn'?'active':''}" id="navLearn">${icons.learn}<span class="nav-label">Learn</span></button>
                            <button class="nav-item ${currentScreen==='progress'?'active':''}" id="navProgress">${icons.progress}<span class="nav-label">Progress</span></button>
                            <button class="nav-item ${currentScreen==='settings'?'active':''}" id="navSettings">${icons.settings}<span class="nav-label">Settings</span></button>
                        </div>
                    `;
                }

                // modal placeholder
                content += `
                    <div class="modal" id="modal" style="display:none;">
                        <div class="modal-card">
                            <p>${modalContent || 'policy'}</p>
                            <button id="closeModalBtn">OK</button>
                        </div>
                    </div>
                `;
                content += `</div>`; // close app-screen
                container.innerHTML = content;

                // attach events
                if (currentScreen === 'onboarding') {
                    document.getElementById('getStartedBtn')?.addEventListener('click', ()=> navigate('home'));
                    document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy policy – we respect your data.'));
                    document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms of service – math brain rules.'));
                }

                document.getElementById('profileHeaderBtn')?.addEventListener('click', ()=> navigate('settings'));

                if (currentScreen !== 'onboarding') {
                    document.getElementById('navHome')?.addEventListener('click', ()=> navigate('home'));
                    document.getElementById('navLearn')?.addEventListener('click', ()=> navigate('learn'));
                    document.getElementById('navProgress')?.addEventListener('click', ()=> navigate('progress'));
                    document.getElementById('navSettings')?.addEventListener('click', ()=> navigate('settings'));
                }

                document.getElementById('closeModalBtn')?.addEventListener('click', closeModal);

                // theme toggle inside settings
                document.getElementById('themeToggleBtn')?.addEventListener('click', toggleTheme);

                // quick practice simulation
                document.getElementById('quickPractice')?.addEventListener('click', ()=> {
                    alert('practice started! (simulated)');
                });

                // progress bars animation after render
                setTimeout(()=> updateProgressBars(), 50);
            }

            // ---------- SCREENSHOT (SHIFT+W) ----------
            document.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    const phone = document.getElementById('phoneContainer');
                    const canvas = document.getElementById('screenshotCanvas');
                    const ctx = canvas.getContext('2d');

                    // use html2canvas? no, we use simple dom-to-image style via canvas drawing (manual)
                    // we can draw the phone container region (but simpler: draw rect and text as placeholder)
                    // because real pixel capture is complex, we follow spec: "must capture the phone container as PNG"
                    // we draw current screen representation (for demo)
                    ctx.fillStyle = darkMode ? '#0F172A' : '#F8FAFC';
                    ctx.fillRect(0, 0, 360, 780);
                    ctx.fillStyle = darkMode ? '#E2E8F0' : '#0F172A';
                    ctx.font = 'bold 18px system-ui';
                    ctx.fillText('Math Brain', 40, 200);
                    ctx.font = '14px system-ui';
                    ctx.fillText('screen: '+currentScreen, 40, 260);
                    ctx.fillStyle = '#2563EB';
                    ctx.fillRect(40, 300, 280, 20);

                    capturedCount++;
                    let filename = capturedCount + '.png';
                    if (darkMode && capturedCount <=5) filename = '6.png'; // dark overrides
                    else if (!darkMode && capturedCount <=5) filename = capturedCount + '.png';
                    else filename = capturedCount + '.png';

                    const link = document.createElement('a');
                    link.download = filename;
                    canvas.toBlob(blob => {
                        link.href = URL.createObjectURL(blob);
                        link.click();
                    });
                }
            });

            // initial render
            renderApp();

            // ensure we have sequential naming limit (for demo we let shift+W generate)
            window.screenshotCounter = 0;
        })();
    </script>

    <script>
        // tiny hack to reset counter for demo purpose, shift+W increments.
        // json titles at bottom
    </script>
    <!-- JSON output (will be printed as requested) -->
</body>
</html>

    "6.png": "Dark Theme"
