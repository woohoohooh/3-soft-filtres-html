```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English · vocabulary builder (mobile)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #1b2b40;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 42px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 0 8px #1f2e3f;
            overflow: hidden;
            position: relative;
            transition: background 0.2s;
        }
        .app-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }
        /* theme vars (light default) */
        :root {
            --bg-primary: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --nav-highlight: rgba(37, 99, 235, 0.08);
        }
        body.dark-theme {
            --bg-primary: #0F172A;
            --card-bg: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --nav-highlight: rgba(59, 130, 246, 0.15);
        }

        /* header */
        .header {
            padding: 20px 18px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 6px;
            border-radius: 30px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-btn:hover { background: var(--nav-highlight); }
        .profile-icon svg { display: block; }

        /* main content area */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px 10px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) transparent;
        }
        .content::-webkit-scrollbar { width: 4px; }
        .content::-webkit-scrollbar-thumb { background: var(--inactive); border-radius: 20px; }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            padding: 8px 12px 14px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-light);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 0 2px;
            border-radius: 16px;
            transition: all 0.15s ease;
            color: var(--inactive);
            fill: var(--inactive);
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            transform: scale(1.05);
            background: var(--nav-highlight);
        }
        .nav-item.active .nav-label {
            color: var(--primary);
            font-weight: 500;
        }
        .nav-icon { height: 26px; width: 26px; margin-bottom: 2px; }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            color: inherit;
        }
        .nav-item:not(.active) .nav-label { color: var(--inactive); }

        /* cards & elements */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.02);
            margin-bottom: 18px;
            border: 1px solid var(--border-light);
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
        }
        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 16px 20px;
            border-radius: 60px;
            font-size: 18px;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 12px rgba(37,99,235,0.2);
        }
        .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 16px 0 10px;
            font-size: 13px;
        }
        .link-row button {
            background: none;
            border: none;
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
            font-size: 13px;
        }

        /* progress bar */
        .progress-bar-bg {
            height: 10px;
            background: var(--border-light);
            border-radius: 30px;
            overflow: hidden;
            margin: 8px 0;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 30px;
            transition: width 0.3s;
        }

        /* modal overlay (policy/terms) */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.15s;
        }
        .modal.show { visibility: visible; opacity: 1; }
        .modal-content {
            background: var(--card-bg);
            width: 280px;
            padding: 24px;
            border-radius: 40px;
            color: var(--text-primary);
            text-align: center;
            border: 2px solid var(--primary);
        }
        .modal-content button {
            margin-top: 18px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        /* utilities */
        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mt-2 { margin-top: 10px; }
        .mb-1 { margin-bottom: 6px; }
        .fs-large { font-size: 32px; font-weight: 700; }
        .theme-toggle { background: var(--card-bg); border: 1px solid var(--border-light); padding: 12px; border-radius: 44px; display: flex; justify-content: space-between; align-items: center; margin: 24px 0 8px; }
    </style>
</head>
<body>
    <div class="phone" id="phoneContainer">
        <div class="app-screen" id="appScreen">
            <!-- header injected via JS -->
            <div id="headerPlaceholder"></div>

            <!-- main content injected by screen -->
            <div id="screenContent" class="content"></div>

            <!-- bottom nav -->
            <div class="bottom-nav" id="bottomNav"></div>
        </div>
    </div>

    <!-- simple modal for privacy/terms -->
    <div class="modal" id="modalOverlay">
        <div class="modal-content" id="modalContent">
            <h3 id="modalTitle">Title</h3>
            <p id="modalBody">text</p>
            <button id="modalClose">Close</button>
        </div>
    </div>

    <script>
        (function(){
            // ---------- THEME ----------
            let darkMode = false;
            function applyTheme() {
                if (darkMode) document.body.classList.add('dark-theme');
                else document.body.classList.remove('dark-theme');
            }
            applyTheme();

            // ---------- SVG ICONS (inline, outline 2px, rounded) ----------
            const icons = {
                home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z"/></svg>`,
                learn: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4L12 10L22 4L12 16L2 4Z"/><path d="M2 12L12 18L22 12"/></svg>`,
                progress: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3V12L17 15"/></svg>`,
                settings: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82L12 22z"/><path d="M4.6 9A1.65 1.65 0 0 1 4 7.18 1.65 1.65 0 0 1 5.78 6h12.44A1.65 1.65 0 0 1 20 7.18 1.65 1.65 0 0 1 19.4 9L12 16z"/></svg>`,
                profile: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
                lesson: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>`,
                chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 17V9M12 17V6M17 17V12"/></svg>`,
                flashcards: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 11h4"/></svg>`,
                play: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4V8z"/></svg>`,
                check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>`
            };

            // ---------- APP STATE ----------
            let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
            // store stats (simulated)
            let masteredWords = 128;
            const totalWords = 350;
            let streak = 7;

            // dom elements
            const screenContent = document.getElementById('screenContent');
            const bottomNav = document.getElementById('bottomNav');
            const headerPlaceholder = document.getElementById('headerPlaceholder');
            const modalOverlay = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            const modalClose = document.getElementById('modalClose');

            // ---------- RENDER HEADER (with profile icon) ----------
            function renderHeader(title) {
                headerPlaceholder.innerHTML = `
                    <div class="header">
                        <h1>${title}</h1>
                        <button class="profile-btn" id="profileHeaderBtn" title="Profile / settings">${icons.profile}</button>
                    </div>
                `;
                document.getElementById('profileHeaderBtn').addEventListener('click', ()=>{
                    navigateTo('settings');
                });
            }

            // ---------- BOTTOM NAV RENDER ----------
            const navItems = [
                { id: 'home', label: 'Home', icon: icons.home },
                { id: 'learn', label: 'Learn', icon: icons.learn },
                { id: 'progress', label: 'Progress', icon: icons.progress },
                { id: 'settings', label: 'Settings', icon: icons.settings }
            ];
            function renderBottomNav(active) {
                let html = '';
                navItems.forEach(item => {
                    const activeClass = (active === item.id) ? 'active' : '';
                    html += `<button class="nav-item ${activeClass}" data-nav="${item.id}">
                        <span class="nav-icon">${item.icon}</span>
                        <span class="nav-label">${item.label}</span>
                    </button>`;
                });
                bottomNav.innerHTML = html;
                document.querySelectorAll('.nav-item').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const navId = btn.dataset.nav;
                        navigateTo(navId);
                    });
                });
            }

            // ---------- SCREEN RENDERING ----------
            function navigateTo(screen) {
                if (screen === 'settings') currentScreen = 'settings';
                else if (screen === 'home') currentScreen = 'home';
                else if (screen === 'learn') currentScreen = 'learn';
                else if (screen === 'progress') currentScreen = 'progress';
                else if (screen === 'onboarding') currentScreen = 'onboarding';

                // update header title
                let headerTitle = 'English';
                if (currentScreen === 'home') headerTitle = 'Home';
                else if (currentScreen === 'learn') headerTitle = 'Lessons';
                else if (currentScreen === 'progress') headerTitle = 'Progress';
                else if (currentScreen === 'settings') headerTitle = 'Profile';
                else if (currentScreen === 'onboarding') headerTitle = 'Welcome';
                renderHeader(headerTitle);

                renderBottomNav(currentScreen === 'onboarding' ? 'home' : currentScreen); // onboarding uses home as inactive, but just show.

                // render content
                if (currentScreen === 'onboarding') renderOnboarding();
                else if (currentScreen === 'home') renderHome();
                else if (currentScreen === 'learn') renderLearn();
                else if (currentScreen === 'progress') renderProgress();
                else if (currentScreen === 'settings') renderSettings();
            }

            // ---------- ONBOARDING ----------
            function renderOnboarding() {
                let html = `
                    <div class="card" style="text-align: center; padding: 32px 20px;">
                        <div style="font-size: 48px; margin-bottom: 4px;">📘</div>
                        <div style="font-size: 38px; font-weight: 800; color: var(--primary);">Lexi</div>
                        <div style="font-size: 18px; font-weight: 500; margin: 8px 0 4px;">Build your vocabulary</div>
                        <p style="color: var(--text-secondary); margin: 16px 0;">Master 350+ essential English words through smart flashcards and daily challenges.</p>
                        <button class="btn-primary" id="getStartedBtn">Get Started</button>
                        <div class="link-row">
                            <button id="privacyBtn">Privacy Policy</button>
                            <button id="termsBtn">Terms of Service</button>
                        </div>
                        <div style="height:8px;"></div>
                    </div>
                `;
                screenContent.innerHTML = html;
                document.getElementById('getStartedBtn').addEventListener('click', ()=> navigateTo('home'));
                document.getElementById('privacyBtn').addEventListener('click', ()=> showModal('Privacy Policy','We respect your privacy. No data collected without consent.'));
                document.getElementById('termsBtn').addEventListener('click', ()=> showModal('Terms of Service','Educational use only. All rights reserved.'));
            }

            // modal helper
            function showModal(t, msg) {
                modalTitle.innerText = t;
                modalBody.innerText = msg;
                modalOverlay.classList.add('show');
            }
            modalClose.addEventListener('click', ()=> modalOverlay.classList.remove('show'));

            // ---------- HOME DASHBOARD ----------
            function renderHome() {
                let html = `
                    <div class="card">
                        <div class="flex-row"><span class="badge">🔥 streak ${streak} days</span> <span>🏆 128 mastered</span></div>
                        <div class="fs-large mt-2">Hello, Alex 👋</div>
                        <p>Continue where you left off</p>
                        <div class="progress-bar-bg mt-2"><div class="progress-fill" style="width:${(masteredWords/totalWords)*100}%"></div></div>
                        <div class="flex-row mt-2"><span>Daily goal</span><span>${masteredWords}/${totalWords} words</span></div>
                    </div>
                    <div class="card flex-row" style="gap:12px;">
                        <span>${icons.flashcards}</span><div><strong>Flashcards</strong><p>review 10 cards</p></div>
                        <button class="btn-primary" style="width:auto; padding: 10px 20px;" id="startLearnBtn">Start</button>
                    </div>
                    <div class="card">
                        <div class="flex-row"><strong>Recommended lesson</strong><span>👉</span></div>
                        <div class="flex-row mt-2"><span>📗 Business English</span><span>78%</span></div>
                        <div class="progress-bar-bg"><div class="progress-fill" style="width:78%"></div></div>
                    </div>
                    <div class="card flex-row">
                        <span>${icons.chart}</span><span>Monthly progress +24%</span>
                    </div>
                `;
                screenContent.innerHTML = html;
                document.getElementById('startLearnBtn')?.addEventListener('click', ()=> navigateTo('learn'));
            }

            // ---------- LEARN / PRACTICE ----------
            function renderLearn() {
                let html = `
                    <div class="card">
                        <div class="flex-row"><span class="badge">today's picks</span> <span>${icons.play} practice</span></div>
                        <h3 style="margin: 10px 0;">Word sets</h3>
                        <div class="flex-row"><span>🔹 phrasal verbs</span><span>12 words</span></div>
                        <div class="progress-bar-bg"><div class="progress-fill" style="width:45%"></div></div>
                        <div class="flex-row mt-2"><span>🔹 idioms</span><span>8 words</span></div>
                        <div class="progress-bar-bg"><div class="progress-fill" style="width:20%"></div></div>
                        <button class="btn-primary" style="margin-top:16px;" id="practiceBtn">Practice active set</button>
                    </div>
                    <div class="card flex-row">
                        <span>${icons.flashcards} flashcards</span><span>➡️</span>
                    </div>
                    <div class="card flex-row">
                        <span>${icons.lesson} listening drill</span><button style="background:none; border:none;">${icons.play}</button>
                    </div>
                `;
                screenContent.innerHTML = html;
                document.getElementById('practiceBtn')?.addEventListener('click', ()=> alert('starting practice (simulated)'));
            }

            // ---------- PROGRESS ----------
            function renderProgress() {
                let weekData = [65, 72, 80, 78, 92, 88, 94];
                let max = 100;
                let bars = weekData.map(v => Math.round(v)).join('%, ');
                let html = `
                    <div class="card">
                        <h3>Statistics</h3>
                        <div class="flex-row"><span>words mastered</span><span>${masteredWords}</span></div>
                        <div class="flex-row"><span>streak</span><span>${streak} days</span></div>
                        <div class="flex-row"><span>accuracy</span><span>89%</span></div>
                    </div>
                    <div class="card">
                        <div class="flex-row"><strong>weekly activity</strong> ${icons.chart}</div>
                        <div style="display:flex; gap:6px; margin:16px 0; align-items:flex-end; height:80px;">
                            ${weekData.map(val => `<div style="flex:1; background:var(--primary); height:${val*0.8}px; border-radius:12px 12px 4px 4px;"></div>`).join('')}
                        </div>
                        <div class="flex-row"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
                    </div>
                    <div class="card">
                        <span>🏅 Achievements: 5 badges</span>
                    </div>
                `;
                screenContent.innerHTML = html;
            }

            // ---------- SETTINGS / PROFILE ----------
            function renderSettings() {
                let html = `
                    <div class="card">
                        <div class="flex-row"><span>${icons.profile}</span> <span>Alex Johnson</span></div>
                        <p style="color:var(--text-secondary)">alex@example.com</p>
                    </div>
                    <div class="card theme-toggle">
                        <span>🌞 Dark theme</span>
                        <label class="switch"><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''} style="width:22px;height:22px;"></label>
                    </div>
                    <div class="card">
                        <div class="flex-row"><span>🔔 Notifications</span><span>On</span></div>
                        <div class="flex-row mt-2"><span>🔒 Privacy</span><span>></span></div>
                        <div class="flex-row mt-2"><span>📞 Support</span><span>></span></div>
                    </div>
                    <button class="btn-primary" style="background:transparent; border:2px solid var(--primary); color:var(--primary);" id="resetBtn">Reset progress</button>
                `;
                screenContent.innerHTML = html;
                document.getElementById('darkToggle')?.addEventListener('change', (e)=>{
                    darkMode = e.target.checked;
                    applyTheme();
                });
                document.getElementById('resetBtn')?.addEventListener('click', ()=> { masteredWords = 0; streak = 0; alert('progress reset (demo)'); navigateTo('progress'); });
            }

            // ---------- INIT ----------
            navigateTo('onboarding');

            // ---------- SCREENSHOT HOTKEY (SHIFT+W) ----------
            document.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    const container = document.getElementById('phoneContainer');
                    if (!container) return;

                    // Simulate screenshot numbering
                    let seq = darkMode ? 6 : (window.__shotCounter || 0) % 5 + 1;
                    if (!darkMode) {
                        window.__shotCounter = (window.__shotCounter || 0) + 1;
                        if (window.__shotCounter > 5) window.__shotCounter = 1;
                        seq = window.__shotCounter;
                    } else {
                        seq = 6;
                    }
                    // actual screenshot not possible, but we notify + simulate filename
                    alert(`📸 Screenshot saved as ${seq}.png (simulated)`);
                }
            });
        })();
    </script>
    <!-- bottom of the page JSON + extra -->
</body>
</html>
All done!
