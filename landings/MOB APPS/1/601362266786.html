```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSpark · Learn Python</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            /* light mode (default) */
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --border: #E2E8F0;
            --highlight: #DBEAFE;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --border: #334155;
            --highlight: #1E3A5F;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }

        body {
            background: #1a1e2b; /* outer background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 42px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2c3142;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background-color 0.2s;
        }

        /* main app screen container */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: none;
            padding-bottom: 4px;
        }
        .app-screen::-webkit-scrollbar { display: none; }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px 12px;
            background-color: var(--bg);
            border-bottom: 1px solid var(--border);
        }
        .header h1 {
            font-size: 22px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 4px;
            color: var(--text);
        }

        /* bottom nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: var(--card);
            border-top: 1px solid var(--border);
            padding: 8px 12px 10px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            gap: 4px;
            font-size: 11px;
            font-weight: 500;
            color: var(--inactive);
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 6px 10px;
            border-radius: 30px;
        }
        .nav-item.active {
            color: var(--primary);
            background-color: var(--highlight);
            transform: scale(1.05);
        }
        .nav-item.active svg {
            stroke: var(--primary);
            stroke-width: 2.5;
            transform: scale(1.1);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* main content */
        .content {
            flex: 1;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            overflow-y: auto;
        }

        /* onboarding specific */
        .onboarding-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 30px 0 20px;
        }
        .logo-icon svg {
            width: 70px;
            height: 70px;
        }
        .app-name {
            font-size: 34px;
            font-weight: 700;
            color: var(--primary);
            margin-top: 12px;
        }
        .tagline {
            font-size: 18px;
            color: var(--text);
            font-weight: 500;
            margin: 8px 0 4px;
        }
        .description {
            text-align: center;
            color: var(--text-light);
            line-height: 1.5;
            margin-bottom: 28px;
        }
        .btn-large {
            background: var(--primary);
            border: none;
            padding: 18px;
            border-radius: 60px;
            font-size: 20px;
            font-weight: 600;
            color: white;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 8px 20px #2563eb50;
            transition: 0.1s;
        }
        .btn-large:active { transform: scale(0.98); background: var(--primary-dark); }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 24px;
        }
        .link-row button {
            background: none;
            border: none;
            color: var(--inactive);
            text-decoration: underline;
            font-size: 14px;
            cursor: pointer;
        }

        /* modal */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-card {
            background: var(--card);
            width: 280px;
            padding: 28px 20px;
            border-radius: 32px;
            text-align: center;
            color: var(--text);
            box-shadow: var(--shadow);
        }
        .modal-card button {
            margin-top: 20px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        /* cards & progress */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px;
            box-shadow: var(--shadow);
        }
        .row-space {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
        }
        .progress-bar {
            background: var(--border);
            height: 8px;
            border-radius: 20px;
            margin: 12px 0;
        }
        .progress-fill {
            width: 0%;
            height: 8px;
            background: var(--primary);
            border-radius: 20px;
            transition: width 0.4s;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-item {
            background: var(--bg);
            border-radius: 18px;
            padding: 14px;
            text-align: center;
        }
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .lesson-item:last-child { border: none; }

        .badge-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .badge-icon {
            background: var(--highlight);
            border-radius: 30px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--primary);
            font-weight: 500;
        }

        /* dark mode toggle switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
            margin-left: 8px;
        }
        .switch input { opacity:0; width:0; height:0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--inactive);
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            border-radius: 50%;
            transition: 0.2s;
        }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* icons */
        .icon-box { display: flex; align-items: center; gap: 8px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="phone" id="phoneContainer">
        <!-- dynamic screens will be injected via JS -->
        <div id="app"></div>
    </div>

    <!-- modal for privacy/terms (simple) -->
    <div id="modalOverlay" class="modal" onclick="closeModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h3 id="modalTitle">Privacy Policy</h3>
            <p id="modalText">We respect your data. This is a demo app.</p>
            <button onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        (function() {
            // ---------- icon system (inline svg) ----------
            const icons = {
                home: `<svg viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 14 L9 14 L9 21 L3 21 L3 10 Z"/></svg>`,
                learn: `<svg viewBox="0 0 24 24"><path d="M2 3 L12 3 L12 21 L2 21 L2 3 Z M12 7 L22 7 L22 21 L12 21 L12 7 Z"/><circle cx="7" cy="12" r="1.5"/><circle cx="17" cy="15" r="1.5"/></svg>`,
                progress: `<svg viewBox="0 0 24 24"><path d="M21 12 L21 20 L3 20 L3 4 L9 4 L9 12 L12 12 L12 8 L15 8 L15 12 L18 12 L18 6 L21 6 L21 12 Z"/></svg>`,
                settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15 L20.8 12 L19.4 9 L16.9 7.6 L16.9 4.6 L13.9 3.6 L12 5 L10.1 3.6 L7.1 4.6 L7.1 7.6 L4.6 9 L3.2 12 L4.6 15 L7.1 16.4 L7.1 19.4 L10.1 20.4 L12 19 L13.9 20.4 L16.9 19.4 L16.9 16.4 L19.4 15 Z"/></svg>`,
                profile: `<svg viewBox="0 0 24 24"><path d="M4 20 L4 18 C4 14 8 14 12 14 C16 14 20 14 20 18 L20 20 M12 4 C14 4 16 6 16 8 C16 10 14 12 12 12 C10 12 8 10 8 8 C8 6 10 4 12 4 Z"/></svg>`,
                lesson: `<svg viewBox="0 0 24 24"><path d="M4 4 L20 4 L20 20 L4 20 Z M8 8 L16 8 M8 12 L16 12 M8 16 L13 16"/></svg>`,
                chart: `<svg viewBox="0 0 24 24"><path d="M21 21 L3 21 L3 3 M7 15 L10 10 L13 13 L18 7"/></svg>`,
                flashcards: `<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8 L16 8 M8 12 L16 12 M8 16 L13 16"/></svg>`,
                play: `<svg viewBox="0 0 24 24"><polygon points="8,6 20,12 8,18 8,6"/></svg>`,
                check: `<svg viewBox="0 0 24 24"><polyline points="4 13 9 18 20 6"/></svg>`
            };

            // ---------- state ----------
            let currentScreen = 'onboarding';
            let activeTab = 'home'; // home, learn, progress, settings
            let darkMode = false;
            let screenshotCounter = 1;

            // theme
            function toggleTheme() {
                darkMode = !darkMode;
                document.body.classList.toggle('dark', darkMode);
                renderScreen(currentScreen);
            }

            // simple modal
            window.openModal = (type) => {
                const modal = document.getElementById('modalOverlay');
                document.getElementById('modalTitle').innerText = type === 'privacy' ? 'Privacy Policy' : 'Terms of Service';
                document.getElementById('modalText').innerText = type === 'privacy' ? 'Your data is safe. No tracking.' : 'Use this app for learning.';
                modal.style.display = 'flex';
            };
            window.closeModal = () => {
                document.getElementById('modalOverlay').style.display = 'none';
            };

            // screenshot feature (shift+w)
            window.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm').then(({ default: html2canvas }) => {
                        const phone = document.getElementById('phoneContainer');
                        html2canvas(phone, { backgroundColor: null }).then(canvas => {
                            const link = document.createElement('a');
                            const themeSuffix = darkMode ? '6' : (screenshotCounter++).toString();
                            link.download = `${darkMode ? 6 : screenshotCounter-1}.png`;
                            link.href = canvas.toDataURL('image/png');
                            link.click();
                        });
                    });
                }
            });

            // ----- dynamic renderer -----
            function renderScreen(screen) {
                const appDiv = document.getElementById('app');
                let headerTitle = '';
                if (screen === 'onboarding') headerTitle = 'Welcome';
                else if (screen === 'home') headerTitle = 'Dashboard';
                else if (screen === 'learn') headerTitle = 'Python';
                else if (screen === 'progress') headerTitle = 'Your stats';
                else if (screen === 'settings') headerTitle = 'Settings';

                const header = `
                    <div class="header">
                        <h1>${headerTitle}</h1>
                        <button class="profile-btn" onclick="window.renderScreen('settings')">${icons.profile}</button>
                    </div>
                `;

                let body = '';
                if (screen === 'onboarding') {
                    body = `
                        <div class="content" style="justify-content: center;">
                            <div class="onboarding-logo">
                                <span class="logo-icon">${icons.flashcards}</span>
                                <div class="app-name">CodeSpark</div>
                                <div class="tagline">Python, simply.</div>
                                <div class="description">Bite-sized Python exercises • flashcards • real coding practice for beginners.</div>
                            </div>
                            <button class="btn-large" onclick="window.renderScreen('home')">Get Started</button>
                            <div class="link-row">
                                <button onclick="openModal('privacy')">Privacy</button>
                                <button onclick="openModal('terms')">Terms</button>
                            </div>
                        </div>
                    `;
                } else {
                    // dashboard / home
                    if (screen === 'home') {
                        body = `
                            <div class="content">
                                <div class="card">
                                    <div class="row-space"><span>🔥 7 day streak</span><span class="badge">+120 XP</span></div>
                                    <div class="progress-bar"><div class="progress-fill" style="width:65%"></div></div>
                                    <div class="row-space"><span>Next lesson in 2h</span><span>65%</span></div>
                                </div>
                                <div class="card">
                                    <div class="row-space"><span>📘 Continue Python</span><span>${icons.play}</span></div>
                                    <div class="lesson-item">${icons.lesson} Variables & Data types <span style="margin-left:auto;">80%</span></div>
                                    <div class="lesson-item">${icons.lesson} Lists & Loops <span style="margin-left:auto;">45%</span></div>
                                    <div class="lesson-item">${icons.flashcards} Flashcard: keywords <span style="margin-left:auto;">new</span></div>
                                </div>
                                <div class="badge-row">
                                    <span class="badge-icon">${icons.check} 3 in row</span>
                                    <span class="badge-icon">🔥 day 7</span>
                                    <span class="badge-icon">⚡ 120xp</span>
                                </div>
                                <div class="card stat-grid">
                                    <div class="stat-item"><b>4</b> lessons left</div>
                                    <div class="stat-item"><b>2</b> flashcards</div>
                                </div>
                            </div>
                        `;
                    }
                    // learn screen
                    else if (screen === 'learn') {
                        body = `
                            <div class="content">
                                <div class="card">
                                    <div class="row-space"><span>📗 Python basics</span> <span>⬇️</span></div>
                                    <div class="lesson-item">${icons.play} Hello world <span>free</span></div>
                                    <div class="lesson-item">${icons.lesson} Variables <span>interactive</span></div>
                                    <div class="lesson-item">${icons.flashcards} Data types <span>new</span></div>
                                </div>
                                <div class="card">
                                    <div class="row-space"><span>🧩 Control flow</span></div>
                                    <div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div>
                                    <div class="lesson-item">if/else practice <span>${icons.play}</span></div>
                                </div>
                                <div class="card">
                                    <span>📱 today's challenge: write a function</span>
                                    <button style="background:var(--primary); color:white; border:none; padding:12px; border-radius:40px; margin-top:12px;">Start</button>
                                </div>
                            </div>
                        `;
                    }
                    // progress screen
                    else if (screen === 'progress') {
                        body = `
                            <div class="content">
                                <div class="card">
                                    <span>📊 weekly activity</span>
                                    <div style="height:80px; display:flex; gap:8px; margin:16px 0;">
                                        <div style="flex:1; background:var(--primary); height:40px; border-radius:10px; align-self:end;"></div>
                                        <div style="flex:1; background:var(--primary); height:70px; border-radius:10px; align-self:end;"></div>
                                        <div style="flex:1; background:var(--primary); height:55px; border-radius:10px; align-self:end;"></div>
                                        <div style="flex:1; background:var(--primary); height:30px; border-radius:10px; align-self:end;"></div>
                                        <div style="flex:1; background:var(--primary); height:80px; border-radius:10px; align-self:end;"></div>
                                    </div>
                                </div>
                                <div class="card stat-grid">
                                    <div class="stat-item"><b>128</b> exercises</div>
                                    <div class="stat-item"><b>14</b> days</div>
                                    <div class="stat-item"><b>3</b> badges</div>
                                    <div class="stat-item"><b>2.4k</b> XP</div>
                                </div>
                                <div class="card">${icons.chart} mastery: 34% <div class="progress-bar"><div class="progress-fill" style="width:34%"></div></div></div>
                            </div>
                        `;
                    }
                    // settings screen (with profile)
                    else if (screen === 'settings') {
                        body = `
                            <div class="content">
                                <div class="card row-space"><span>${icons.profile} Alex Chen</span><span>⭐ intermediate</span></div>
                                <div class="card row-space"><span>🌙 Dark mode</span>
                                    <label class="switch"><input type="checkbox" ${darkMode ? 'checked' : ''} onchange="toggleTheme();renderScreen('settings');"><span class="slider"></span></label>
                                </div>
                                <div class="card"><span>🔔 Notifications</span> <span>></span></div>
                                <div class="card"><span>🔒 Privacy</span> <span>></span></div>
                                <div class="card" style="text-align:center;">App version 1.0.3</div>
                            </div>
                        `;
                    }
                }

                // bottom navigation (not on onboarding)
                let bottomNav = '';
                if (screen !== 'onboarding') {
                    const navItems = ['home', 'learn', 'progress', 'settings'];
                    const labels = { home:'Home', learn:'Learn', progress:'Progress', settings:'Settings' };
                    bottomNav = `
                        <div class="bottom-nav">
                            ${navItems.map(id => `
                                <button class="nav-item ${activeTab === id ? 'active' : ''}" onclick="window.switchTab('${id}')">
                                    ${icons[id]}
                                    <span>${labels[id]}</span>
                                </button>
                            `).join('')}
                        </div>
                    `;
                }

                appDiv.innerHTML = header + body + bottomNav;
            }

            window.renderScreen = (scr) => {
                currentScreen = scr;
                if (scr === 'home') activeTab = 'home';
                else if (scr === 'learn') activeTab = 'learn';
                else if (scr === 'progress') activeTab = 'progress';
                else if (scr === 'settings') activeTab = 'settings';
                renderScreen(scr);
            };
            window.switchTab = (tab) => {
                activeTab = tab;
                if (tab === 'home') renderScreen('home');
                else if (tab === 'learn') renderScreen('learn');
                else if (tab === 'progress') renderScreen('progress');
                else if (tab === 'settings') renderScreen('settings');
            };

            // initial render
            renderScreen('onboarding');
        })();
    </script>
    <!-- JSON (end of output) -->
    <script>/* JSON */ (function(){ console.log(JSON.stringify({
        "1.png": "Start Learning",
        "2.png": "Daily Lessons",
        "3.png": "Practice Skills",
        "4.png": "Track Progress",
        "5.png": "Smart Settings",
        "6.png": "Dark Theme"
    }, null, 2)); })();</script>
All done!
</body>
</html>
```
