<!-- modal container -->
<div id="modalContainer"></div>

<script>
(function() {
    // ---------- theme ----------
    let darkMode = false;
    const root = document.documentElement;

    function setTheme(isDark) {
        if (isDark) {
            root.classList.add('dark-mode');
        } else {
            root.classList.remove('dark-mode');
        }
        darkMode = isDark;
    }
    setTheme(false);

    // ---------- screens data ----------
    let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings

    // ---------- navigation ----------
    const headerTitleEl = document.getElementById('headerTitle');
    const screenContainer = document.getElementById('screenContainer');
    const bottomNav = document.getElementById('bottomNav');
    const navItems = document.querySelectorAll('.nav-item');
    const profileBtn = document.getElementById('profileBtn');

    function hideBottomNav(hide) {
        bottomNav.classList.toggle('hidden', hide);
    }

    function setActiveNav(screenId) {
        navItems.forEach(item => {
            const nav = item.dataset.nav;
            if (nav === screenId) {
                item.classList.add('active');
            } else {
                item.classList.remove('active');
            }
        });
    }

    // ----- render functions -----
    function renderOnboarding() {
        headerTitleEl.innerText = 'Welcome';
        hideBottomNav(true);
        let html = `
            <div class="logo-area">
                <svg width="42" height="42" viewBox="0 0 24 24" stroke="white" fill="none" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <h1 style="font-size:32px; font-weight:700; text-align:center; color:var(--text-primary);">Python Play</h1>
            <div class="tagline" style="text-align:center">code like a pro</div>
            <p style="text-align:center; color:var(--text-muted); margin: 12px 0 28px;">Learn Python with interactive micro‑lessons, quizzes, and real‑time practice. Perfect for beginners.</p>
            <button class="btn" style="width:100%;" id="startFromOnboard">Get Started</button>
            <div class="link-row" style="margin:24px 0 16px;">
                <button id="privacyModalBtn">Privacy Policy</button>
                <button id="termsModalBtn">Terms of Service</button>
            </div>
        `;
        screenContainer.innerHTML = html;
        document.getElementById('startFromOnboard')?.addEventListener('click', ()=>{
            currentScreen = 'home';
            renderHome();
            hideBottomNav(false);
            setActiveNav('home');
        });
        document.getElementById('privacyModalBtn')?.addEventListener('click', ()=> showModal('Privacy Policy', 'We value your privacy. No data is sold.'));
        document.getElementById('termsModalBtn')?.addEventListener('click', ()=> showModal('Terms of Service', 'Use this app for learning. Be kind.'));
    }

    function renderHome() {
        headerTitleEl.innerText = 'Home';
        setActiveNav('home');
        let html = `
            <div class="card">
                <div class="flex-row justify-between">
                    <h3 style="color:var(--text-primary);">👋 Welcome back!</h3>
                    <span class="badge">🔥 7 day streak</span>
                </div>
                <p style="color:var(--text-muted); margin: 8px 0;">continue where you left</p>
                <div class="flex-row gap-8" style="margin:12px 0;">
                    <span style="background:var(--primary); width:36px;height:36px; border-radius:12px; display:flex; align-items:center; justify-content:center;">
                        <svg width="20" height="20" viewBox="0 0 24 24" stroke="white" fill="none"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    </span>
                    <div style="flex:1"><div style="font-weight:600;">Variables & Data</div><div class="progress-bar" style="width:80%;"><div class="progress-fill" style="width:45%"></div></div></div>
                </div>
                <button class="btn-outline btn" style="width:100%; margin-top:8px;" id="resumeLearnBtn">Resume lesson</button>
            </div>
            <div class="card">
                <div class="flex-row justify-between"><span style="font-weight:600;">Daily pick</span><span style="color:var(--primary);">4 min</span></div>
                <div style="display:flex; gap:10px; margin:14px 0;">
                    <span style="background:#dbeafe; padding:8px; border-radius:18px;"><svg width="22" height="22" viewBox="0 0 24 24" stroke="#2563EB"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></span>
                    <div><div>Functions 101</div><div class="badge" style="margin-top:4px;">Beginner</div></div>
                </div>
                <button class="btn" style="width:100%;" id="startLessonHome">Start practice</button>
            </div>
            <div class="card flex-row justify-between">
                <span style="font-weight:600;">🏆 3 achievements unlocked</span>
                <span style="color:var(--primary);">view all →</span>
            </div>
        `;
        screenContainer.innerHTML = html;
        document.getElementById('resumeLearnBtn')?.addEventListener('click', ()=>{ currentScreen='learn'; renderLearn(); setActiveNav('learn'); });
        document.getElementById('startLessonHome')?.addEventListener('click', ()=>{ currentScreen='learn'; renderLearn(); setActiveNav('learn'); });
    }

    function renderLearn() {
        headerTitleEl.innerText = 'Lessons';
        setActiveNav('learn');
        let html = `
            <div style="display:flex; gap:10px; margin-bottom:18px;">
                <span class="badge" style="background:var(--primary); color:white;">All</span><span class="badge">Basics</span><span class="badge">Functions</span>
            </div>
            <div class="card flex-row gap-8">
                <span style="background:#2563EB20; padding:10px; border-radius:16px;"><svg width="26" height="26" viewBox="0 0 24 24" stroke="var(--primary)"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
                <div style="flex:1"><div style="font-weight:600;">Strings & printing</div><div class="progress-bar"><div class="progress-fill" style="width:90%"></div></div></div>
                <span style="color:var(--primary);">90%</span>
            </div>
            <div class="card flex-row gap-8">
                <span style="background:#2563EB20; padding:10px; border-radius:16px;"><svg width="26" height="26" viewBox="0 0 24 24" stroke="var(--primary)"><path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/><polyline points="16 2 22 8 16 8"/><line x1="10" y1="14" x2="21" y2="14"/><line x1="10" y1="18" x2="18" y2="18"/><polyline points="10 8 15 8 15 12"/></svg></span>
                <div style="flex:1"><div style="font-weight:600;">Lists & loops</div><div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div></div>
                <span>30%</span>
            </div>
            <div class="card">
                <div class="flex-row"><span class="badge" style="margin-right:auto;">⚡ new</span></div>
                <div style="font-size:18px; font-weight:600; margin:10px 0;">Dictionaries challenge</div>
                <button class="btn" style="width:100%;" id="practiceNow">Start lesson</button>
            </div>
        `;
        screenContainer.innerHTML = html;
        document.getElementById('practiceNow')?.addEventListener('click', ()=> showModal('Quick exercise', 'print(Hello World) — fill in the quotes'));
    }

    function renderProgress() {
        headerTitleEl.innerText = 'Progress';
        setActiveNav('progress');
        let html = `
            <div class="card" style="text-align:center;">
                <div style="font-size:38px; font-weight:700; color:var(--primary);">1,280</div>
                <div>XP total</div>
                <div style="display:flex; gap:8px; justify-content:center; margin:16px 0;"><span class="badge">🔥 week +24%</span><span class="badge">🏅 4 badges</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width:62%"></div></div>
                <div style="margin:8px 0;">62% to next level</div>
            </div>
            <div class="card">
                <div style="display:flex; justify-content:space-between;"><span>📊 lessons completed</span><span>18/30</span></div>
                <div class="progress-bar" style="margin:8px 0;"><div class="progress-fill" style="width:60%"></div></div>
                <div style="display:flex; gap:4px; margin-top:16px;">
                    <span style="flex:1; height:32px; background:var(--primary); border-radius:12px;"></span>
                    <span style="flex:2; height:32px; background:var(--primary); opacity:0.5; border-radius:12px;"></span>
                    <span style="flex:1; height:32px; background:var(--primary); border-radius:12px;"></span>
                </div>
            </div>
        `;
        screenContainer.innerHTML = html;
    }

    function renderSettings() {
        headerTitleEl.innerText = 'Settings';
        setActiveNav('settings');
        let html = `
            <div class="card">
                <div class="flex-row justify-between"><span>🌙 Dark mode</span><label class="switch"><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}><span class="slider"></span></label></div>
            </div>
            <div class="card">
                <div>Profile: pythonista</div>
                <div style="color:var(--text-muted);">member since 2026</div>
            </div>
            <div class="card">
                <div class="flex-row"><svg width="22" height="22" viewBox="0 0 24 24" stroke="var(--primary)"><circle cx="12" cy="12" r="2.5"/><path d="M12 2a10 10 0 0 0 0 20 10 10 0 0 0 0-20z"/></svg><span style="margin-left:12px;">App version 2.6.3</span></div>
            </div>
        `;
        screenContainer.innerHTML = html;
        document.getElementById('darkToggle')?.addEventListener('change', (e)=>{
            setTheme(e.target.checked);
        });
    }

    function showModal(title, text) {
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.innerHTML = `<div class="modal-card"><h3 style="margin-bottom:16px;">${title}</h3><p>${text}</p><button id="closeModalBtn">OK</button></div>`;
        document.getElementById('modalContainer').appendChild(modal);
        modal.querySelector('#closeModalBtn').addEventListener('click', ()=> modal.remove());
        modal.addEventListener('click', (e)=> { if(e.target === modal) modal.remove(); });
    }

    // ----- profile button -> settings
    profileBtn.addEventListener('click', ()=>{
        currentScreen = 'settings';
        renderSettings();
        hideBottomNav(false);
        setActiveNav('settings');
    });

    // bottom navigation listeners
    navItems.forEach(item => {
        item.addEventListener('click', (e) => {
            const nav = item.dataset.nav; // home, learn, progress, settings
            if (nav === 'home') { currentScreen = 'home'; renderHome(); }
            else if (nav === 'learn') { currentScreen = 'learn'; renderLearn(); }
            else if (nav === 'progress') { currentScreen = 'progress'; renderProgress(); }
            else if (nav === 'settings') { currentScreen = 'settings'; renderSettings(); }
            hideBottomNav(false);
        });
    });

    // initial render
    renderOnboarding();

    // ----- screenshot (shift+W) -----
    let screenshotCounter = 1;
    window.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.key === 'W') {
            const container = document.getElementById('phoneContainer');
            html2canvas?.(container, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                const isDark = root.classList.contains('dark-mode');
                const num = isDark ? 6 : screenshotCounter;
                link.download = `${num}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                if (!isDark) screenshotCounter = (screenshotCounter % 5) + 1;
            }).catch(() => alert('html2canvas not loaded — use fallback'));
        }
    });

    // include html2canvas via CDN (silent)
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    script.onload = ()=> console.log('screenshot ready');
    document.head.appendChild(script);

})();
</script>
