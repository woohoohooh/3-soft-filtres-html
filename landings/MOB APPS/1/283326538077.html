<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code daily · Python mentor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #1a202c;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    /* phone container */
    #phone {
      width: 360px;
      height: 780px;
      background: var(--bg-primary);
      border-radius: 44px;
      box-shadow: 0 30px 50px rgba(0,0,0,0.4), 0 0 0 8px #2d3748;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: background 0.2s;
    }
    /* variables light (default) */
    :root {
      --bg-primary: #F8FAFC;
      --bg-card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --border-light: #E2E8F0;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --inactive: #94A3B8;
      --bottom-bg: #FFFFFF;
      --shadow: 0 4px 12px rgba(0,0,0,0.03);
    }
    body.dark {
      --bg-primary: #0F172A;
      --bg-card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --border-light: #334155;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --inactive: #64748B;
      --bottom-bg: #1E293B;
      --shadow: 0 4px 12px rgba(0,0,0,0.5);
    }
    /* main flex column */
    .app-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 20px 16px 12px 16px;
      scrollbar-width: thin;
      background: var(--bg-primary);
    }
    /* header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }
    .profile-icon {
      cursor: pointer;
      padding: 6px;
      border-radius: 12px;
      transition: background 0.1s;
    }
    .profile-icon:hover { background: var(--border-light); }
    /* bottom nav */
    .bottom-nav {
      background: var(--bottom-bg);
      border-top: 1px solid var(--border-light);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 8px 10px;
      box-shadow: var(--shadow);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      transition: transform 0.15s ease;
      flex: 1;
      border-radius: 20px;
      padding: 6px 0 4px;
    }
    .nav-item.active {
      background: rgba(37, 99, 235, 0.08);
      transform: scale(1.02);
    }
    .nav-item .icon {
      width: 26px;
      height: 26px;
      stroke-width: 2;
      stroke: var(--inactive);
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: all 0.1s;
    }
    .nav-item.active .icon {
      stroke: var(--primary);
      width: 30px;
      height: 30px;
      stroke-width: 2.2;
    }
    .nav-item span {
      font-size: 11px;
      font-weight: 500;
      color: var(--inactive);
    }
    .nav-item.active span {
      color: var(--primary);
      font-weight: 600;
    }
    /* common cards */
    .card {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
      border: 1px solid var(--border-light);
    }
    .flex-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      background: var(--primary);
      color: white;
      font-weight: 600;
      padding: 16px 24px;
      border: none;
      border-radius: 40px;
      font-size: 18px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--primary-dark);
      transition: 0.08s linear;
    }
    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--primary-dark);
    }
    .small-link {
      color: var(--inactive);
      text-decoration: underline;
      font-size: 13px;
      cursor: pointer;
    }
    /* modal */
    .modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-content {
      background: var(--bg-card);
      padding: 28px 20px;
      border-radius: 32px;
      width: 280px;
      text-align: center;
      color: var(--text-primary);
    }
    .modal-content button {
      margin-top: 20px;
      background: var(--primary);
      border: none;
      color: white;
      padding: 12px 20px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
    }
    .progress-bar {
      height: 8px;
      background: var(--border-light);
      border-radius: 20px;
      margin: 8px 0;
    }
    .progress-fill {
      height: 8px;
      background: var(--primary);
      width: 0%;
      border-radius: 20px;
      transition: width 0.3s;
    }
    .badge {
      background: var(--accent);
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 13px;
      color: #0F172A;
      font-weight: 600;
    }
    .icon-svg-sm {
      width: 24px;
      height: 24px;
      stroke: var(--primary);
      fill: none;
      stroke-width: 2;
    }
    .chart-svg {
      width: 100%;
      height: 70px;
      margin: 10px 0;
    }
    /* hide/show screens */
    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
    }
    .screen.active {
      display: flex;
    }
    #content-area {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
<div id="phone" class="light">
  <!-- modals container (hidden by default) -->
  <div id="modal-container" style="display: none;"></div>

  <!-- main app views -->
  <!-- ONBOARDING SCREEN (always shown first, but can be hidden after nav) -->
  <div id="screen-onboarding" class="screen active">
    <div class="app-screen" style="justify-content: space-between;">
      <div style="flex:1; display: flex; flex-direction: column; justify-content: center;">
        <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 20px;">
          <!-- logo (simple svg) -->
          <svg width="50" height="50" viewBox="0 0 32 32" fill="none" stroke="#2563EB" stroke-width="2"><circle cx="16" cy="16" r="12"/><path d="M10 16 L22 16 M16 10 L16 22"/></svg>
          <span style="font-size: 32px; font-weight: 800; color: var(--primary);">byte</span>
        </div>
        <h2 style="font-size: 32px; font-weight: 700; color: var(--text-primary);">Learn Python</h2>
        <p style="font-size: 20px; color: var(--primary); margin-bottom: 8px;">from zero to dev</p>
        <p style="color: var(--text-secondary); margin: 10px 0 30px;">Daily coding exercises, interactive lessons and real practice. Become a Python pro.</p>

        <div style="display: flex; gap: 24px; justify-content: center; margin: 24px 0 16px;">

          <span class="small-link" id="terms-link">Terms of Service</span>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN APP (home, learn, progress, settings) all share same bottom nav -->
  <div id="screen-main" class="screen" style="display: flex; flex-direction: column; height: 100%;">
    <!-- header with dynamic title and profile icon -->
    <div style="padding: 20px 16px 0 16px; background: var(--bg-primary);">
      <div class="header">
        <h1 id="screen-title">Home</h1>
        <div class="profile-icon" id="profileBtn">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--text-primary)" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- dynamic content area (home, learn, progress, settings) -->
    <div id="content-area" style="flex:1; overflow-y: auto; padding: 0 16px 8px 16px;"></div>

    <!-- bottom navigation with custom SVG icons (outline, 2px) -->
    <div class="bottom-nav" id="bottomNav">
      <div class="nav-item active" data-tab="home">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 L3 10 Z"/></svg>
        <span>Home</span>
      </div>
      <div class="nav-item" data-tab="learn">
        <svg class="icon" viewBox="0 0 24 24"><path d="M2 3 L12 3 L22 3 M12 3 L12 21 M8 7 L8 12 M16 7 L16 12"/><rect x="4" y="9" width="16" height="12" rx="2"/></svg>
        <span>Learn</span>
      </div>

        <svg class="icon" viewBox="0 0 24 24"><path d="M21 21 L3 21 M5 17 L5 12 M10 17 L10 7 M15 17 L15 10 M20 17 L20 14"/><circle cx="12" cy="3" r="2"/></svg>
        <span>Progress</span>
      </div>
      <div class="nav-item" data-tab="settings">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82L12 22zM4.6 9a1.65 1.65 0 0 0-.33 1.82c.26.61.85.99 1.51 1h12.44a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82L12 2z"/></svg>
        <span>Settings</span>

<script>
  (function() {
    // ---------- theme ----------
    const html = document.documentElement;
    let darkMode = false; // light default
    function toggleTheme() {
      darkMode = !darkMode;
      if (darkMode) html.classList.add('dark');
      else html.classList.remove('dark');
      renderCurrentScreen(); // refresh icons color (css vars ok)
    }

    // ---------- modal system ----------
    function showModal(title, body) {
      const modalDiv = document.createElement('div');
      modalDiv.className = 'modal';
      modalDiv.innerHTML = `
        <div class="modal-content">
          <h3 style="margin-bottom: 16px;">${title}</h3>
          <p style="margin-bottom: 24px;">${body}</p>
          <button id="closeModalBtn">OK</button>
        </div>
      `;
      document.getElementById('modal-container').style.display = 'block';
      document.getElementById('modal-container').innerHTML = '';
      document.getElementById('modal-container').appendChild(modalDiv);
      document.getElementById('closeModalBtn').addEventListener('click', () => {
        document.getElementById('modal-container').style.display = 'none';
      });
    }

    // ---------- navigation state ----------
    let currentTab = 'home'; // home / learn / progress / settings
    const screens = {
      onboarding: document.getElementById('screen-onboarding'),
      main: document.getElementById('screen-main')
    };
    const contentArea = document.getElementById('content-area');
    const screenTitleEl = document.getElementById('screen-title');

    // helper: render content based on currentTab
    function renderCurrentScreen() {
      if (!screens.main.classList.contains('active')) return; // onboarding active, no main

      let htmlString = '';
      if (currentTab === 'home') {
        screenTitleEl.innerText = 'Home';
        htmlString = `
          <div class="card" style="background: linear-gradient(145deg, var(--primary), var(--accent)); color: white;">
            <h3 style="color:white;">Continue where you left</h3>
            <p style="color: rgba(255,255,255,0.8);">Variables & Data types</p>
            <div class="progress-bar" style="background:rgba(255,255,255,0.3);"><div class="progress-fill" style="width:65%; background:white;"></div></div>
            <span style="font-weight:600;">65%</span>
          </div>
          <div class="flex-row" style="justify-content: space-between;">
            <div class="card" style="width:48%; padding:12px;"><span class="badge">🔥</span> <h4>Daily streak</h4><p style="font-size:28px;">12</p></div>
            <div class="card" style="width:48%; padding:12px;"><span class="badge">⭐</span> <h4>XP today</h4><p style="font-size:28px;">250</p></div>
          </div>
          <div class="card"><h3>Recommended for you</h3><div class="flex-row"> <span>🐍 Functions</span><span class="badge">4 lessons</span></div><div class="flex-row"> <span>📚 Lists</span><span class="badge">5 lessons</span></div></div>
          <div class="card"><h4>Achievements</h4><div style="display:flex; gap:12px;"> <span>🏆 7-day streak</span> <span>📘 First code</span></div></div>
        `;
      } else if (currentTab === 'learn') {
        screenTitleEl.innerText = 'Learn';
        htmlString = `
          <div class="card"><h3>Python basics</h3><p>12 topics</p><div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div></div>
          <div class="card"><h3>Functions & modules</h3><p>8 topics · intermediate</p><button class="btn" style="padding:10px;" id="startPracticeBtn">Start practice</button></div>
          <div class="card"><h3>Object oriented</h3><p>6 topics · advanced</p></div>
          <div class="card"><span class="badge">flashcards</span><p>Daily review: 15 terms</p></div>
        `;
        // attach dynamic after paint
        setTimeout(() => {
          const btn = document.getElementById('startPracticeBtn');
          if (btn) btn.addEventListener('click', () => { alert('Practice session started!'); });
        }, 50);
      } else if (currentTab === 'progress') {
        screenTitleEl.innerText = 'Progress';
        htmlString = `
          <div class="card"><h3>Weekly activity</h3>
            <svg class="chart-svg" viewBox="0 0 100 30"><rect x="5" y="10" width="10" height="20" fill="#2563EB"/><rect x="20" y="5" width="10" height="25" fill="#3B82F6"/><rect x="35" y="12" width="10" height="18" fill="#2563EB"/><rect x="50" y="2" width="10" height="28" fill="#3B82F6"/><rect x="65" y="8" width="10" height="22" fill="#2563EB"/><rect x="80" y="15" width="10" height="15" fill="#3B82F6"/></svg>
          </div>
          <div class="card"><h3>Completed lessons</h3><p style="font-size: 42px;">47</p><span>🔥 top 15%</span></div>
          <div class="card"><h4>Accuracy 84%</h4><div class="progress-bar"><div class="progress-fill" style="width:84%"></div></div></div>
        `;
      } else if (currentTab === 'settings') {
        screenTitleEl.innerText = 'Settings';
        htmlString = `
          <div class="card">
            <div style="display:flex; justify-content: space-between; align-items: center;">
              <span>Dark mode</span>
              <label style="width: 50px; height: 26px; background: var(--border-light); border-radius:40px; display:inline-block; position:relative;">
                <input type="checkbox" id="darkToggle" style="width:100%;height:100%;opacity:0; position:absolute; z-index:2; cursor:pointer;">
                <span style="width:22px; height:22px; background:var(--primary); border-radius:50%; position:absolute; top:2px; left:${darkMode ? '26px' : '2px'}; transition:0.15s;"></span>
              </label>
            </div>
          </div>
          <div class="card"><h4>Profile</h4><p>Username: pythonista</p><p>Member since 2026</p></div>
          <div class="card"><h4>Notifications</h4><p>Daily reminder: ON</p></div>
          <div class="small-link" style="text-align:center;">App version 2.4.0</div>
        `;
        setTimeout(() => {
          const toggle = document.getElementById('darkToggle');
          if (toggle) toggle.checked = darkMode;
          if (toggle) toggle.addEventListener('change', toggleTheme);
        }, 50);
      }
      contentArea.innerHTML = htmlString;
    }

    // switch to a main tab
    function switchTab(tabId) {
      if (!screens.main.classList.contains('active')) {
        // first hide onboarding
        screens.onboarding.classList.remove('active');
        screens.main.classList.add('active');
      }
      // update active nav
      document.querySelectorAll('.nav-item').forEach(item => {
        const tab = item.dataset.tab;
        if (tab === tabId) item.classList.add('active');
        else item.classList.remove('active');
      });
      currentTab = tabId;
      renderCurrentScreen();
    }

    // profile icon click -> go to settings (but keep nav)
    document.getElementById('profileBtn').addEventListener('click', ()=>{
      if (!screens.main.classList.contains('active')) {
        screens.onboarding.classList.remove('active');
        screens.main.classList.add('active');
      }
      // set active tab to settings
      switchTab('settings');
    });

    // bottom nav event listeners
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', (e) => {
        const tab = item.dataset.tab;
        switchTab(tab);
      });
    });

    // onboarding start button
    document.getElementById('onboarding-start').addEventListener('click', ()=>{
      switchTab('home'); // activates main + home
    });

    // privacy & terms modals
    document.getElementById('privacy-link').addEventListener('click', ()=> showModal('Privacy Policy', 'We respect your data. No sharing.'));
    document.getElementById('terms-link').addEventListener('click', ()=> showModal('Terms of Service', 'Use app for learning. Be nice.'));

    // ---------- screenshot hotkey SHIFT+W ----------
    let screenshotCounter = 1;
    document.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const phone = document.getElementById('phone');
        html2canvas(phone, { scale: 2 }).then(canvas => {
          const link = document.createElement('a');
          let filename = darkMode ? '6.png' : (screenshotCounter + '.png');
          if (darkMode) filename = '6.png';
          else {
            filename = screenshotCounter + '.png';
            screenshotCounter = screenshotCounter < 5 ? screenshotCounter + 1 : 1; // cycle 1-5
          }
          link.download = filename;
          link.href = canvas.toDataURL('image/png');
          link.click();
        }).catch(() => alert('html2canvas not loaded, but you can imagine screenshot :)'));
      }
    });

    // load html2canvas from cdn (since we need it)
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    document.head.appendChild(script);

    // initial: onboarding visible. Ensure modals hidden
    document.getElementById('modal-container').style.display = 'none';

    // prefill chart animation? simple
  })();
</script>
<!-- include Inter font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
</body>
</html>
All done!
