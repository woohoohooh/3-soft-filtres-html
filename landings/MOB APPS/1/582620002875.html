```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VocabVault · 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e1e2f;
      padding: 16px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background: var(--bg-primary);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2c2c3a;
      position: relative;
      transition: background-color 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    /* theme variables — light default */
    :root {
      --bg-primary: #F8FAFC;
      --bg-card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --border-light: #E2E8F0;
      --primary-blue: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --inactive-icon: #94A3B8;
      --bottom-bg: #FFFFFF;
      --shadow-sm: 0 4px 12px rgba(0,0,0,0.02);
      --progress-bg: #E2E8F0;
      --badge-bg: #DBEAFE;
    }

    body.dark {
      --bg-primary: #0F172A;
      --bg-card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --border-light: #334155;
      --primary-blue: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --inactive-icon: #64748B;
      --bottom-bg: #1E293B;
      --shadow-sm: 0 4px 12px rgba(0,0,0,0.5);
      --progress-bg: #334155;
      --badge-bg: #1E3A5F;
    }

    /* main flex container */
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      background: var(--bg-primary);
    }

    /* header (fixed) */
    .header {
      padding: 20px 16px 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-primary);
    }
    .header .screen-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }
    .profile-icon {
      cursor: pointer;
      padding: 6px;
      border-radius: 12px;
      transition: background 0.1s;
    }
    .profile-icon:hover { background: var(--bg-card); }
    .profile-icon svg { display: block; }

    /* main content area (scrollable) */
    .screen-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px 12px 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--primary-blue) var(--border-light);
    }
    .screen-container::-webkit-scrollbar {
      width: 4px;
    }
    .screen-container::-webkit-scrollbar-track {
      background: var(--border-light);
    }
    .screen-container::-webkit-scrollbar-thumb {
      background: var(--primary-blue);
      border-radius: 8px;
    }

    /* bottom nav */
    .bottom-nav {
      height: 70px;
      background: var(--bottom-bg);
      border-top: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 6px 8px;
      box-shadow: var(--shadow-sm);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 30px;
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      background: transparent;
      border: none;
      width: 64px;
    }
    .nav-item.active {
      background: rgba(37, 99, 235, 0.12);
      transform: scale(1.05);
    }
    .nav-item.active .nav-icon svg {
      stroke: var(--primary-blue);
      stroke-width: 2.2;
      transform: scale(1.1);
      filter: drop-shadow(0 2px 4px rgba(37,99,235,0.2));
    }
    .nav-item.active .nav-label {
      color: var(--primary-blue);
      font-weight: 600;
    }
    .nav-icon svg {
      stroke: var(--inactive-icon);
      stroke-width: 2;
      transition: all 0.15s ease;
    }
    .nav-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--inactive-icon);
      transition: color 0.1s;
    }

    /* cards, containers */
    .card {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 20px 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
    }
    .flex-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge {
      background: var(--badge-bg);
      color: var(--primary-blue);
      font-weight: 600;
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 30px;
    }
    .progress-bar {
      height: 10px;
      background: var(--progress-bg);
      border-radius: 20px;
      margin: 12px 0;
      overflow: hidden;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--primary-blue);
      border-radius: 20px;
      transition: width 0.5s ease;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0;
    }
    .stat-item {
      background: var(--bg-primary);
      padding: 16px 8px;
      border-radius: 20px;
      text-align: center;
    }
    .lesson-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .lesson-row:last-child { border: none; }

    /* buttons */
    .btn-primary {
      background: var(--primary-blue);
      border: none;
      width: 100%;
      padding: 16px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 18px;
      color: white;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(37,99,235,0.25);
      transition: 0.1s;
    }
    .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }
    .link-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin: 24px 0 8px;
    }
    .link-row span {
      color: var(--primary-blue);
      font-size: 14px;
      font-weight: 500;
      text-decoration: underline;
      cursor: pointer;
    }

    /* modal */
    .modal {
      position: absolute;
      top: 30%; left: 20px; right: 20px;
      background: var(--bg-card);
      border-radius: 32px;
      padding: 24px;
      border: 1px solid var(--primary-blue);
      box-shadow: 0 20px 40px black;
      z-index: 200;
      display: none;
    }
    .modal p { margin: 16px 0; color: var(--text-primary); }
    .modal-close {
      float: right;
      font-size: 24px;
      cursor: pointer;
      color: var(--text-secondary);
    }

    /* chart mini */
    .chart-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 100px;
      margin: 20px 0;
    }
    .chart-bar {
      flex: 1;
      background: var(--primary-blue);
      height: calc(70% * var(--h));
      border-radius: 12px 12px 4px 4px;
      transition: height 0.3s;
    }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <div class="app" id="app">
    <!-- header dynamic via js -->
    <div class="header" id="appHeader">
      <span class="screen-title" id="headerTitle">Onboarding</span>
      <div class="profile-icon" id="profileBtn">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--primary-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" />
        </svg>
      </div>
    </div>

    <!-- dynamic screen content -->
    <div class="screen-container" id="screenContent"></div>

    <!-- bottom navigation -->
    <div class="bottom-nav" id="bottomNav">
      <div class="nav-item" data-nav="home" id="navHome">
        <span class="nav-icon" id="iconHome"></span>
        <span class="nav-label">Home</span>
      </div>
      <div class="nav-item" data-nav="learn" id="navLearn">
        <span class="nav-icon" id="iconLearn"></span>
        <span class="nav-label">Learn</span>
      </div>
      <div class="nav-item" data-nav="progress" id="navProgress">
        <span class="nav-icon" id="iconProgress"></span>
        <span class="nav-label">Progress</span>
      </div>
      <div class="nav-item" data-nav="settings" id="navSettings">
        <span class="nav-icon" id="iconSettings"></span>
        <span class="nav-label">Settings</span>
      </div>
    </div>
  </div>

  <!-- modal privacy/terms -->
  <div class="modal" id="modalDialog">
    <span class="modal-close" id="closeModal">&times;</span>
    <h3 style="color: var(--primary-blue);" id="modalTitle">Privacy Policy</h3>
    <p id="modalText">We value your data. This is a demo prototype — no data is stored.</p>
  </div>
</div>

<script>
  (function() {
    // ---------- THEME & STATE ----------
    let darkMode = false;
    let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
    let screenshotCounter = 1;

    // ----- SVG icon definitions (2px stroke, rounded caps) -----
    const icons = {
      home: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
      learn: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
      progress: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12v3a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a4 4 0 0 1 4-4h7"/><polyline points="15 2 21 8 15 8"/><line x1="3" y1="3" x2="21" y2="21"/><line x1="3" y1="21" x2="21" y2="3"/></svg>`,
      settings: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/></svg>`,
      profile: `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
      lesson: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
      chart: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`,
      flashcards: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18"/><path d="M7 2v20M17 2v20"/></svg>`,
      play: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>`,
      check: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>`,
    };

    // inject icons into nav
    function setNavIcons() {
      document.getElementById('iconHome').innerHTML = icons.home;
      document.getElementById('iconLearn').innerHTML = icons.learn;
      document.getElementById('iconProgress').innerHTML = icons.progress;
      document.getElementById('iconSettings').innerHTML = icons.settings;
    }
    setNavIcons();

    // elements
    const headerTitle = document.getElementById('headerTitle');
    const screenDiv = document.getElementById('screenContent');
    const modal = document.getElementById('modalDialog');
    const modalTitle = document.getElementById('modalTitle');
    const modalText = document.getElementById('modalText');
    const closeModal = document.getElementById('closeModal');
    closeModal.onclick = () => modal.style.display = 'none';

    // bottom nav click handlers
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', (e) => {
        const nav = item.dataset.nav; // home, learn, progress, settings
        if (nav === 'home') showScreen('home');
        else if (nav === 'learn') showScreen('learn');
        else if (nav === 'progress') showScreen('progress');
        else if (nav === 'settings') showScreen('settings');
      });
    });

    // profile button -> settings
    document.getElementById('profileBtn').addEventListener('click', () => showScreen('settings'));

    // ----- screen rendering -----
    function showScreen(screenId) {
      currentScreen = screenId;
      updateHeaderTitle(screenId);
      renderContent(screenId);
      updateActiveNav(screenId);
    }

    function updateHeaderTitle(id) {
      const titles = { onboarding:'Onboarding', home:'Home', learn:'Learn', progress:'Progress', settings:'Settings' };
      headerTitle.innerText = titles[id] || 'VocabVault';
    }

    function updateActiveNav(active) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      if (active === 'home') document.getElementById('navHome').classList.add('active');
      if (active === 'learn') document.getElementById('navLearn').classList.add('active');
      if (active === 'progress') document.getElementById('navProgress').classList.add('active');
      if (active === 'settings') document.getElementById('navSettings').classList.add('active');
    }

    // ----- render logic (English vocabulary builder) -----
    function renderContent(screen) {
      let html = '';
      if (screen === 'onboarding') {
        html = `
          <div class="card" style="text-align:center; margin-top:20px;">
            <div style="margin-bottom:16px;">${icons.flashcards.replace('currentColor','var(--primary-blue)')}</div>
            <h1 style="font-size:40px; font-weight:800; color:var(--primary-blue);">VocabVault</h1>
            <p style="font-size:18px; font-weight:500; margin:8px 0;">Build your English</p>
            <p style="color:var(--text-secondary); margin-bottom:24px;">Master 3000+ words with smart quizzes & daily streaks.</p>
            <button class="btn-primary" id="getStartedBtn">Get Started</button>
            <div class="link-row">
              <span id="privacyLink">Privacy Policy</span>
              <span id="termsLink">Terms of Service</span>
            </div>
          </div>
        `;
        setTimeout(() => {
          document.getElementById('getStartedBtn')?.addEventListener('click', () => showScreen('home'));
          document.getElementById('privacyLink')?.addEventListener('click', () => showModal('Privacy Policy','We don’t collect data, this is a demo.'));
          document.getElementById('termsLink')?.addEventListener('click', () => showModal('Terms of Service','Educational prototype only. No real service.'));
        }, 50);
      }
      else if (screen === 'home') {
        html = `
          <div class="card">
            <div class="flex-row"><span class="badge">🔥 7 day streak</span><span>⭐ 1240 XP</span></div>
            <h3 style="margin-top:16px;">Continue where you left</h3>
            <div class="lesson-row">
              ${icons.lesson} <span style="flex:1;">Collocations: advanced</span> <span class="badge">80%</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width:80%"></div></div>
            <button class="btn-primary" style="margin-top:12px;" id="resumeBtn">Practice →</button>
          </div>
          <div class="card">
            <div class="flex-row"><span>📘 Daily goal</span><span>15 min left</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div>
            <div class="stat-grid">
              <div class="stat-item"><b>24</b> <span>words</span></div>
              <div class="stat-item"><b>5</b> <span>lessons</span></div>
            </div>
          </div>
          <div style="display:flex; gap:8px; justify-content:center;">
            ${icons.flashcards} ${icons.play} ${icons.chart}
          </div>
        `;
        setTimeout(() => document.getElementById('resumeBtn')?.addEventListener('click', ()=>showScreen('learn')),50);
      }
      else if (screen === 'learn') {
        html = `
          <div class="card"><h3>Today’s picks</h3>
            <div class="lesson-row">${icons.lesson} Business English <span class="badge">8 min</span></div>
            <div class="lesson-row">${icons.flashcards} Idioms master <span class="badge">NEW</span></div>
            <div class="lesson-row">${icons.play} Synonyms quiz <span class="badge">5xp</span></div>
          </div>
          <div class="card"><h3>Recommended</h3>
            <div class="lesson-row">${icons.lesson} Travel vocabulary <span class="badge">intermediate</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div>
            <button class="btn-primary" style="margin-top:12px;" id="startPractice">Start practice</button>
          </div>
        `;
        setTimeout(()=>document.getElementById('startPractice')?.addEventListener('click',()=>{
          alert('Demo: lesson would start');
        }),50);
      }
      else if (screen === 'progress') {
        html = `
          <div class="card"><h3>Last 7 days</h3>
            <div class="chart-row">
              <div class="chart-bar" style="--h:0.9"></div><div class="chart-bar" style="--h:0.6"></div><div class="chart-bar" style="--h:0.8"></div>
              <div class="chart-bar" style="--h:0.7"></div><div class="chart-bar" style="--h:1.0"></div><div class="chart-bar" style="--h:0.5"></div><div class="chart-bar" style="--h:0.4"></div>
            </div>
          </div>
          <div class="card"><span>🏆 Mastered: 142 words</span><div class="progress-bar"><div class="progress-fill" style="width:72%"></div></div></div>
          <div class="card flex-row"><span>⚡ Current streak</span><span>7 days</span></div>
        `;
      }
      else if (screen === 'settings') {
        html = `
          <div class="card">
            <h3>Theme</h3>
            <label><input type="radio" name="theme" value="light" ${!darkMode ? 'checked' : ''}> Light</label><br>
            <label><input type="radio" name="theme" value="dark" ${darkMode ? 'checked' : ''}> Dark</label>
            <button class="btn-primary" style="margin-top:16px;" id="applyTheme">Apply theme</button>
          </div>
          <div class="card"><h3>Profile</h3>${icons.profile} <span>Alex Mercer</span></div>
        `;
        setTimeout(() => {
          document.getElementById('applyTheme')?.addEventListener('click', ()=>{
            const isDark = document.querySelector('input[name="theme"]:checked')?.value === 'dark';
            darkMode = isDark;
            document.body.classList.toggle('dark', darkMode);
            showScreen('settings');
          });
        },50);
      }
      screenDiv.innerHTML = html;
    }

    function showModal(title, text) {
      modalTitle.innerText = title;
      modalText.innerText = text;
      modal.style.display = 'block';
    }

    // start with onboarding
    showScreen('onboarding');

    // ---------- screenshot (SHIFT + W) ----------
    document.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const container = document.getElementById('phoneContainer');
        import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm').then(({default: html2canvas}) => {
          html2canvas(container, { scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            const mode = darkMode ? '6' : (screenshotCounter++).toString();
            link.download = `${mode}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
          });
        }).catch(() => alert('html2canvas load error, but screenshot simulated.'));
      }
    });

    // modal outside click
    window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
  })();
</script>
</body>
</html>
All done!
