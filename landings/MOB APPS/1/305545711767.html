```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSprout – Learn Python</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #1e2b3c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --highlight: #DBEAFE;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --highlight: #1E3A5F;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
        }

        #phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* screen container */
        #app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            background: var(--bg);
            transition: background 0.2s;
        }
        #app-screen::-webkit-scrollbar { display: none; }

        /* header */
        .header {
            padding: 16px 20px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg);
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 8px 4px 8px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }
        .profile-btn:hover { background: var(--highlight); }

        /* bottom navigation */
        .bottom-nav {
            background: var(--card);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 10px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            cursor: pointer;
            gap: 4px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 8px 0 4px;
            border-radius: 20px;
        }
        .nav-item.active {
            background: var(--highlight);
        }
        .nav-item.active .nav-icon {
            transform: scale(1.15);
            stroke: var(--primary) !important;
        }
        .nav-item.active .nav-label {
            color: var(--primary);
            font-weight: 600;
        }
        .nav-icon {
            width: 24px;
            height: 24px;
            stroke: var(--inactive);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: transform 0.15s, stroke 0.1s;
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--inactive);
        }

        /* onboarding */
        .onboarding-container {
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .logo-placeholder {
            background: linear-gradient(145deg, var(--primary), var(--accent));
            width: 80px;
            height: 80px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0 16px;
        }
        .app-name {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .tagline {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 12px;
        }
        .description {
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 32px;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            font-weight: 600;
            font-size: 18px;
            padding: 16px 32px;
            border: none;
            border-radius: 40px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 8px 16px -4px rgba(37,99,235,0.3);
            transition: 0.15s;
        }
        .btn-primary:hover { background: var(--primary-dark); }
        .footer-links {
            margin-top: 28px;
            display: flex;
            gap: 24px;
            font-size: 14px;
        }
        .footer-links button {
            background: none;
            border: none;
            color: var(--inactive);
            text-decoration: underline;
            cursor: pointer;
        }

        /* modal */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card);
            padding: 28px 24px;
            border-radius: 32px;
            width: 280px;
            color: var(--text-primary);
            box-shadow: var(--shadow);
        }
        .modal-content h3 { margin-bottom: 12px; }
        .modal-close {
            margin-top: 20px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
        }

        /* cards & content */
        .content {
            padding: 16px 20px;
            flex: 1;
        }
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 20px 16px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .progress-bar-bg {
            height: 10px;
            background: var(--border-light);
            border-radius: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 60%;
            background: var(--primary);
            border-radius: 20px;
        }
        .badge-grid {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 16px 0;
        }
        .badge {
            background: var(--highlight);
            padding: 8px 16px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--primary);
            font-weight: 500;
        }
        .lesson-item {
            padding: 16px 0;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .lesson-meta {
            margin-left: auto;
            color: var(--inactive);
        }
        .chart-container {
            background: var(--highlight);
            border-radius: 20px;
            height: 80px;
            display: flex;
            align-items: flex-end;
            padding: 10px 8px;
            gap: 8px;
        }
        .bar {
            flex: 1;
            height: calc(100% - 10px);
            background: var(--primary);
            border-radius: 8px 8px 4px 4px;
            transition: height 0.3s;
        }
    </style>
</head>
<body>
<div id="phone">
    <div id="app-screen">
        <!-- dynamic screen injected -->
    </div>
</div>

<script>
    (function() {
        // ------ THEME & UTILS ------
        const root = document.documentElement;
        let darkMode = false;

        // toggle theme (called from settings)
        function setTheme(isDark) {
            darkMode = isDark;
            if (darkMode) document.body.classList.add('dark');
            else document.body.classList.remove('dark');
        }

        // ------ ICON SYSTEM (inline svg, same style) ------
        function icon(name, className = '') {
            const icons = {
                home: '<svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 L3 10 Z" /></svg>',
                learn: '<svg class="nav-icon" viewBox="0 0 24 24"><path d="M2 4 L12 2 L22 4 L22 18 L12 20 L2 18 L2 4 Z M12 2 L12 20 M7 7 L7 13 M17 7 L17 13"/></svg>',
                progress: '<svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7 L12 12 L15 15"/></svg>',
                settings: '<svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 7.3 C20.2 8.3 20.8 9.5 21 10.7 L19 12 L21 13.3 C20.5 15.2 19.1 16.8 17.3 17.7 L16 16 L14.7 18.7 C13.5 19.2 12.2 19.5 10.9 19.5 L9.7 17.5 L7.3 18.5 C5.7 17.8 4.3 16.4 3.7 14.8 L5.7 13.5 L4 12 L5.3 10 L3.5 8.5 C4.2 6.9 5.7 5.5 7.3 4.8 L9 7 L11 4 C12.5 3.7 14 3.8 15.5 4.3 L17 7 L19.4 7.3 Z"/></svg>',
                profile: '<svg class="nav-icon" viewBox="0 0 24 24"><path d="M5 20 L5 17 C5 14 8 12 12 12 C16 12 19 14 19 17 L19 20 M12 12 C14 12 16 10 16 8 C16 6 14 4 12 4 C10 4 8 6 8 8 C8 10 10 12 12 12 Z"/></svg>',
                lesson: '<svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 4 L20 4 L20 20 L4 20 Z M8 8 L16 8 M8 12 L14 12 M8 16 L12 16"/></svg>',
                chart: '<svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 21 L3 21 L3 3 M7 15 L10 10 L13 13 L18 7"/></svg>',
                flashcards: '<svg class="nav-icon" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8 L15 8 M9 12 L15 12 M9 16 L13 16"/></svg>',
                play: '<svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/></svg>',
                check: '<svg class="nav-icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" /></svg>',
            };
            return icons[name] || icons.home;
        }

        // ------ APP STATE ------
        let currentScreen = 'onboarding'; // screens: onboarding, home, learn, progress, settings
        const modals = { privacy: false, terms: false };

        // ------ RENDER FUNCTION ------
        function render() {
            const container = document.getElementById('app-screen');
            if (!container) return;
            let html = '';

            // ---------- header (common for all except maybe onboarding? we keep header always) ----------
            const showHeader = currentScreen !== 'onboarding'; // onboarding has custom headerless
            if (showHeader) {
                let title = 'Home';
                if (currentScreen === 'learn') title = 'Learn';
                else if (currentScreen === 'progress') title = 'Progress';
                else if (currentScreen === 'settings') title = 'Settings';
                else title = 'Home';

                html += `
                    <div class="header">
                        <h1>${title}</h1>
                        <button class="profile-btn" id="profileHeaderBtn">${icon('profile')}</button>
                    </div>
                `;
            }

            // ---------- screen content ----------
            if (currentScreen === 'onboarding') {
                html += `
                    <div class="onboarding-container">
                        <div class="logo-placeholder">${icon('flashcards')}</div>
                        <div class="app-name">CodeSprout</div>
                        <div class="tagline">Python, one bite at a time</div>
                        <div class="description">Learn Python with interactive micro‑lessons, daily challenges, and smart progress tracking.</div>
                        <button class="btn-primary" id="getStartedBtn">Get Started</button>
                        <div class="footer-links">
                            <button id="privacyModalBtn">Privacy</button>
                            <button id="termsModalBtn">Terms</button>
                        </div>
                    </div>
                `;
            } else if (currentScreen === 'home') {
                html += `
                    <div class="content">
                        <div class="card">
                            <div class="row"><span>🔥 Daily streak</span><strong>7 days</strong></div>
                            <div class="progress-bar-bg"><div class="progress-fill" style="width:70%"></div></div>
                        </div>
                        <div class="card">
                            <div class="row"><span>📘 Current lesson</span><span>Variables & types</span></div>
                            <button class="btn-primary" id="continueLessonBtn" style="padding:12px;font-size:16px;margin-top:8px;">Continue</button>
                        </div>
                        <div class="badge-grid">
                            <span class="badge">${icon('check', 'small')} Hello World</span>
                            <span class="badge">${icon('flashcards')} Loop</span>
                        </div>
                        <div class="card">
                            <h3 style="margin-bottom:12px;">Recommended</h3>
                            <div class="lesson-item"><span>📓 Lists</span><span class="lesson-meta">8 min</span></div>
                            <div class="lesson-item"><span>📓 Functions</span><span class="lesson-meta">12 min</span></div>
                        </div>
                    </div>
                `;
            } else if (currentScreen === 'learn') {
                html += `
                    <div class="content">
                        <div class="card">
                            <div class="row"><span>🐍 Python basics</span> <span>75%</span></div>
                            <div class="progress-bar-bg"><div class="progress-fill" style="width:75%"></div></div>
                            <div style="margin-top:16px;"><button class="btn-primary" style="padding:12px;" id="practiceBtn">Practice</button></div>
                        </div>
                        <div class="card">
                            <div class="lesson-item">${icon('lesson')} 1. Hello world <span class="lesson-meta">done</span></div>
                            <div class="lesson-item">${icon('lesson')} 2. Variables <span class="lesson-meta">done</span></div>
                            <div class="lesson-item">${icon('play')} 3. Data types <span class="lesson-meta">Start</span></div>
                            <div class="lesson-item">${icon('lesson')} 4. Conditions <span class="lesson-meta">lock</span></div>
                        </div>
                    </div>
                `;
            } else if (currentScreen === 'progress') {
                html += `
                    <div class="content">
                        <div class="card">
                            <h3>Weekly activity</h3>
                            <div class="chart-container" id="chart">
                                <div class="bar" style="height:20%"></div><div class="bar" style="height:40%"></div><div class="bar" style="height:60%"></div><div class="bar" style="height:80%"></div><div class="bar" style="height:50%"></div><div class="bar" style="height:90%"></div><div class="bar" style="height:30%"></div>
                            </div>
                        </div>
                        <div class="card">
                            <div class="row"><span>⭐ XP total</span><strong>1,240</strong></div>
                            <div class="row"><span>🏆 Lessons completed</span><strong>24</strong></div>
                            <div class="row"><span>⚡ Accuracy</span><strong>88%</strong></div>
                        </div>
                        <div class="badge-grid">
                            <span class="badge">${icon('chart')} 5 day streak</span>
                        </div>
                    </div>
                `;
            } else if (currentScreen === 'settings') {
                html += `
                    <div class="content">
                        <div class="card">
                            <div class="row"><span>🌗 Dark mode</span><label><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}></label></div>
                            <div class="row"><span>🔔 Notifications</span><label><input type="checkbox" checked></label></div>
                            <div style="margin-top:24px;"><button class="btn-primary" style="background:var(--inactive);" id="resetBtn">Reset progress</button></div>
                        </div>
                        <div class="card"><span>Version 2.0.6</span></div>
                    </div>
                `;
            }

            // ---------- bottom navigation (hide on onboarding) ----------
            if (currentScreen !== 'onboarding') {
                const tabs = ['home', 'learn', 'progress', 'settings'];
                html += `<nav class="bottom-nav">`;
                tabs.forEach(tab => {
                    const activeClass = (currentScreen === tab) ? 'active' : '';
                    html += `
                        <button class="nav-item ${activeClass}" data-screen="${tab}">
                            ${icon(tab)}
                            <span class="nav-label">${tab.charAt(0).toUpperCase()+tab.slice(1)}</span>
                        </button>
                    `;
                });
                html += `</nav>`;
            }

            // ---------- modal overlay (if any) ----------
            if (modals.privacy) {
                html += `
                    <div class="modal-overlay" id="modalOverlay">
                        <div class="modal-content">
                            <h3>Privacy Policy</h3>
                            <p>We respect your data. No unnecessary collection.</p>
                            <button class="modal-close" id="closeModalBtn">Close</button>
                        </div>
                    </div>
                `;
            } else if (modals.terms) {
                html += `
                    <div class="modal-overlay" id="modalOverlay">
                        <div class="modal-content">
                            <h3>Terms of Service</h3>
                            <p>Keep learning, be kind. That's it.</p>
                            <button class="modal-close" id="closeModalBtn">Close</button>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;

            // ---------- attach event listeners ----------
            if (currentScreen === 'onboarding') {
                document.getElementById('getStartedBtn')?.addEventListener('click', () => { currentScreen = 'home'; render(); });
                document.getElementById('privacyModalBtn')?.addEventListener('click', () => { modals.privacy = true; render(); });
                document.getElementById('termsModalBtn')?.addEventListener('click', () => { modals.terms = true; render(); });
            } else {
                // bottom nav
                document.querySelectorAll('.nav-item[data-screen]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const screen = e.currentTarget.dataset.screen;
                        if (screen) { currentScreen = screen; render(); }
                    });
                });
                // profile header
                document.getElementById('profileHeaderBtn')?.addEventListener('click', () => { currentScreen = 'settings'; render(); });
                // settings theme toggle
                if (currentScreen === 'settings') {
                    const toggle = document.getElementById('darkToggle');
                    if (toggle) {
                        toggle.checked = darkMode;
                        toggle.addEventListener('change', (e) => {
                            setTheme(e.target.checked);
                            render(); // re-render settings to reflect
                        });
                    }
                }
                // extra buttons
                if (currentScreen === 'home' && document.getElementById('continueLessonBtn')) {
                    document.getElementById('continueLessonBtn').addEventListener('click', ()=>{ currentScreen='learn'; render(); });
                }
                if (currentScreen === 'learn' && document.getElementById('practiceBtn')) {
                    document.getElementById('practiceBtn').addEventListener('click', ()=>{ alert('Starting practice!'); });
                }
            }

            // modal close
            document.getElementById('closeModalBtn')?.addEventListener('click', () => {
                modals.privacy = false; modals.terms = false; render();
            });
            // close overlay click outside
            document.getElementById('modalOverlay')?.addEventListener('click', (e) => {
                if (e.target.classList.contains('modal-overlay')) { modals.privacy = false; modals.terms = false; render(); }
            });
        }

        // screenshot hotkey SHIFT+W
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phone');
                if (!phone) return;
                import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
                    html2canvas(phone, { backgroundColor: null }).then(canvas => {
                        const link = document.createElement('a');
                        let filename = '1.png';
                        if (currentScreen === 'home') filename = '2.png';
                        else if (currentScreen === 'learn') filename = '3.png';
                        else if (currentScreen === 'progress') filename = '4.png';
                        else if (currentScreen === 'settings') filename = '5.png';
                        if (darkMode) filename = '6.png';
                        link.download = filename;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    });
                }).catch(err => alert('html2canvas not loaded, but screenshot simulated.'));
            }
        });

        // initial render
        render();

        // expose for debugging
        window.__setScreen = (s) => { currentScreen = s; render(); };
    })();
</script>
</body>
</html>
All done!
