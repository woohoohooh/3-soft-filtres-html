```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic Puzzler · 2026 mobile prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            /* light mode (default) */
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive-icon: #94A3B8;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.02), 0 2px 6px rgba(0, 0, 0, 0.03);
            --progress-bg: #E2E8F0;
            --header-icon: #334155;
        }

        body.dark {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive-icon: #64748B;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            --progress-bg: #334155;
            --header-icon: #CBD5E1;
        }

        body {
            background: #1e1e2f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 44px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3), 0 0 0 8px #2d2d3a;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
        }

        .screen {
            flex: 1;
            overflow-y: auto;
            padding: 16px 18px 10px 18px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive-icon) transparent;
            display: flex;
            flex-direction: column;
        }

        .screen::-webkit-scrollbar {
            width: 4px;
        }
        .screen::-webkit-scrollbar-thumb {
            background: var(--inactive-icon);
            border-radius: 20px;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 12px 0;
        }
        .header h2 {
            font-size: 22px;
            font-weight: 650;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--header-icon);
            transition: background 0.2s;
        }
        .profile-btn:hover {
            background: var(--bg-card);
        }

        /* bottom nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--bg-card);
            border-top: 1px solid var(--border-light);
            padding: 6px 8px;
            border-radius: 0 0 44px 44px;
            box-shadow: var(--shadow);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px 0 8px;
            border-radius: 18px;
            transition: all 0.15s ease;
            color: var(--inactive-icon);
            fill: var(--inactive-icon);
            font-size: 11px;
            font-weight: 500;
            gap: 4px;
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            background: rgba(37, 99, 235, 0.08);
            transform: scale(1.02);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2px;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
        }

        /* cards */
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 18px 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }

        /* buttons */
        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 20px;
            border-radius: 30px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 6px 12px rgba(37, 99, 235, 0.25);
        }
        .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }

        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal {
            background: var(--bg-card);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            text-align: center;
            color: var(--text-primary);
        }
        .close-modal {
            margin-top: 20px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 16px 0 8px;
        }
        .progress-bar {
            background: var(--progress-bg);
            height: 8px;
            border-radius: 20px;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 8px;
            background: var(--primary);
            border-radius: 20px;
            transition: width 0.3s;
        }

        .badge-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .badge {
            background: var(--bg-primary);
            border-radius: 40px;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 12px 0 6px;
            font-size: 13px;
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
        }

        .theme-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0;
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic views will be injected -->
    <div id="app"></div>
</div>

<script>
    (function() {
        // ---------- SVG ICONS (inline, outline 2px, rounded) ----------
        const icons = {
            home: `<svg viewBox="0 0 24 24"><path d="M5 12H3L12 3L21 12H19" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/><path d="M5 12V19H19V12" stroke="currentColor" fill="none" stroke-width="2"/><rect x="9" y="15" width="6" height="4" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            learn: `<svg viewBox="0 0 24 24"><path d="M2 3H8C10.2091 3 12 4.79086 12 7V20C12 18.8954 11.1046 18 10 18H2V3Z" stroke="currentColor" fill="none" stroke-width="2" stroke-linejoin="round"/><path d="M22 3H16C13.7909 3 12 4.79086 12 7V20C12 18.8954 12.8954 18 14 18H22V3Z" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            progress: `<svg viewBox="0 0 24 24"><path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3" stroke="currentColor" fill="none" stroke-width="2"/><circle cx="12" cy="12" r="2.5" stroke="currentColor" fill="none" stroke-width="2"/><path d="M12 5V3" stroke="currentColor" stroke-width="2"/><path d="M19 12H21" stroke="currentColor" stroke-width="2"/></svg>`,
            settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5" stroke="currentColor" fill="none" stroke-width="2"/><path d="M19.4 15L20.6 17.5L17.6 20.5L15 19.4" stroke="currentColor" fill="none" stroke-width="2"/><path d="M4.6 15L3.4 17.5L6.4 20.5L9 19.4" stroke="currentColor" fill="none" stroke-width="2"/><path d="M12 5V2" stroke="currentColor" stroke-width="2"/><path d="M5 12H2" stroke="currentColor" stroke-width="2"/><path d="M22 12H19" stroke="currentColor" stroke-width="2"/><path d="M12 22V19" stroke="currentColor" stroke-width="2"/></svg>`,
            profile: `<svg viewBox="0 0 24 24"><path d="M20 21V19C20 16.7909 18.2091 15 16 15H8C5.79086 15 4 16.7909 4 19V21" stroke="currentColor" fill="none" stroke-width="2"/><circle cx="12" cy="8" r="5" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            lesson: `<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2" stroke="currentColor" fill="none" stroke-width="2"/><path d="M8 7H16" stroke="currentColor" stroke-width="2"/><path d="M8 12H14" stroke="currentColor" stroke-width="2"/><path d="M8 17H12" stroke="currentColor" stroke-width="2"/></svg>`,
            chart: `<svg viewBox="0 0 24 24"><path d="M21 20H3V4" stroke="currentColor" fill="none" stroke-width="2"/><path d="M7 16L10 10L13 13L18 7" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            flashcards: `<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" fill="none" stroke-width="2"/><path d="M9 7H15" stroke="currentColor" stroke-width="2"/><path d="M9 11H15" stroke="currentColor" stroke-width="2"/><path d="M9 15H13" stroke="currentColor" stroke-width="2"/></svg>`,
            play: `<svg viewBox="0 0 24 24"><path d="M5 3L19 12L5 21V3Z" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            check: `<svg viewBox="0 0 24 24"><path d="M20 6L9 17L4 12" stroke="currentColor" fill="none" stroke-width="2"/></svg>`
        };

        // ---------- state ----------
        let currentScreen = 'onboarding';
        let darkMode = false;
        let screenshotCounter = 0;

        // ---------- helpers ----------
        const appDiv = document.getElementById('app');
        const body = document.body;

        function setTheme(mode) {
            if (mode === 'dark') {
                body.classList.add('dark');
            } else {
                body.classList.remove('dark');
            }
            darkMode = mode === 'dark';
        }

        function showModal(text) {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.style.visibility = 'visible';
            modal.style.opacity = '1';
            modal.innerHTML = `<div class="modal"><p>${text}</p><button class="close-modal">OK</button></div>`;
            document.querySelector('.phone').appendChild(modal);
            modal.querySelector('.close-modal').onclick = () => modal.remove();
        }

        // render header + bottom nav
        function renderFrame(title, contentFn) {
            return `
                <div class="screen" id="mainScreen">
                    <div class="header">
                        <h2>${title}</h2>
                        <button class="profile-btn" id="profileHeaderBtn">${icons.profile}</button>
                    </div>
                    <div id="screenContent">${contentFn()}</div>
                </div>
                <nav class="bottom-nav">
                    <button class="nav-item" data-nav="home">${icons.home}<span>Home</span></button>
                    <button class="nav-item" data-nav="learn">${icons.learn}<span>Learn</span></button>
                    <button class="nav-item" data-nav="progress">${icons.progress}<span>Progress</span></button>
                    <button class="nav-item" data-nav="settings">${icons.settings}<span>Settings</span></button>
                </nav>
            `;
        }

        // onboarding content (no bottom nav)
        function renderOnboarding() {
            return `
                <div class="screen" style="justify-content: space-between;">
                    <div></div>
                    <div style="text-align: center;">
                        <div style="font-size: 56px; margin-bottom: 8px;">🧠</div>
                        <h1 style="font-size: 38px; font-weight:700; color: var(--primary);">LogicPuzz</h1>
                        <p style="font-size: 18px; color: var(--accent); margin: 8px 0;">train your brain daily</p>
                        <p style="color: var(--text-secondary); margin: 24px 0;">Solve puzzles, build logic. Short mental workouts for sharp minds.</p>
                        <button class="btn-primary" id="getStartedBtn">Get Started</button>
                        <div class="link-row">
                            <span id="privacyLink">Privacy Policy</span>
                            <span id="termsLink">Terms of Service</span>
                        </div>
                    </div>
                    <div style="height:40px;"></div>
                </div>
            `;
        }

        // Screens content
        function homeContent() {
            return `
                <div class="card">
                    <div style="display:flex; justify-content: space-between;"><span>Daily streak</span><span>7 days 🔥</span></div>
                    <div class="progress-bar" style="margin: 12px 0;"><div class="progress-fill" style="width:70%"></div></div>
                    <div class="badge-group">
                        <span class="badge">${icons.flashcards} 3 puzzles left</span>
                        <span class="badge">${icons.play} practice</span>
                    </div>
                </div>
                <div class="card">
                    <h3 style="margin-bottom:12px;">Recommended</h3>
                    <div class="grid-2">
                        <div style="background: var(--bg-primary); border-radius:20px; padding:16px;">🤔<br>Riddles</div>
                        <div style="background: var(--bg-primary); border-radius:20px; padding:16px;">📐<br>Patterns</div>
                    </div>
                </div>
                <div class="card" style="display:flex; gap:12px;">
                    ${icons.lesson} <span><strong>Today's brain teaser</strong><br>Which number is missing?</span>
                </div>
            `;
        }

        function learnContent() {
            return `
                <div class="card">${icons.flashcards} <strong>Beginner logic</strong> <span style="float:right;">5 min</span><div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div></div>
                <div class="card">${icons.flashcards} <strong>Truth tellers</strong> <span style="float:right;">8 min</span><div class="progress-bar"><div class="progress-fill" style="width:0%"></div></div></div>
                <div class="card">${icons.play} <strong>Interactive puzzle</strong> <button class="btn-primary" style="margin-top:12px;" id="startPracticeBtn">Start practice</button></div>
            `;
        }

        function progressContent() {
            return `
                <div class="card">
                    <div style="display:flex; gap:16px; align-items:center;">${icons.chart} <span style="font-weight:600;">Weekly activity</span></div>
                    <div style="height:80px; display:flex; gap:4px; margin:12px 0;">
                        <div style="width:12%; background:var(--primary); height:40px; border-radius:8px;"></div><div style="width:12%; background:var(--primary); height:70px;"></div><div style="width:12%; background:var(--primary); height:20px;"></div><div style="width:12%; background:var(--primary); height:90px;"></div><div style="width:12%; background:var(--primary); height:60px;"></div>
                    </div>
                    <div class="stat-row"><span>Solved: 42</span><span>Accuracy 84%</span></div>
                </div>
                <div class="card"><strong>Achievements</strong><div class="badge-group"><span class="badge">${icons.check} quick thinker</span><span class="badge">🏆 streak</span></div></div>
            `;
        }

        function settingsContent() {
            return `
                <div class="card">
                    <div class="theme-toggle">
                        <span>Dark theme</span>
                        <label><input type="checkbox" id="darkModeCheck" ${darkMode ? 'checked' : ''}></label>
                    </div>
                    <button class="btn-primary" id="resetProgressBtn" style="margin-top:8px;">Reset progress</button>
                </div>
                <div class="card">Profile info (demo)</div>
            `;
        }

        function profileScreen() {
            return `
                <div class="screen" style="justify-content:flex-start;">
                    <div class="header"><h2>Profile</h2><button class="profile-btn" id="backFromProfile">✕</button></div>
                    <div class="card" style="text-align:center;">
                        ${icons.profile} <h3>Alex Rivera</h3><p>Joined 2026 · level 7</p>
                    </div>
                    <div class="card">Settings mirror</div>
                </div>
            `;
        }

        // update UI
        function navigate(screen) {
            if (screen === 'profile') {
                appDiv.innerHTML = profileScreen();
                document.getElementById('backFromProfile').onclick = () => navigate('home');
                return;
            }

            let title = screen.charAt(0).toUpperCase() + screen.slice(1);
            if (screen === 'onboarding') title = 'Welcome';
            if (screen === 'learn') title = 'Learn';
            if (screen === 'progress') title = 'Progress';
            if (screen === 'settings') title = 'Settings';

            let contentFn = () => '';
            if (screen === 'onboarding') { appDiv.innerHTML = renderOnboarding(); attachOnboardingEvents(); return; }
            else if (screen === 'home') contentFn = homeContent;
            else if (screen === 'learn') contentFn = learnContent;
            else if (screen === 'progress') contentFn = progressContent;
            else if (screen === 'settings') contentFn = settingsContent;

            appDiv.innerHTML = renderFrame(title, contentFn);
            document.querySelectorAll('.nav-item').forEach(btn => {
                const nav = btn.dataset.nav;
                if (nav === screen) btn.classList.add('active');
                btn.onclick = () => navigate(nav);
            });
            document.getElementById('profileHeaderBtn').onclick = () => navigate('profile');

            if (screen === 'learn') {
                const startBtn = document.getElementById('startPracticeBtn');
                if(startBtn) startBtn.onclick = () => alert('▶️ Practice started! (demo)');
            }
            if (screen === 'settings') {
                document.getElementById('darkModeCheck').onchange = (e) => { setTheme(e.target.checked ? 'dark' : 'light'); };
                document.getElementById('resetProgressBtn').onclick = () => alert('progress reset (demo)');
            }
        }

        function attachOnboardingEvents() {
            document.getElementById('getStartedBtn').onclick = () => navigate('home');
            document.getElementById('privacyLink').onclick = () => showModal('Privacy policy — we respect your data.');
            document.getElementById('termsLink').onclick = () => showModal('Terms: demo app only.');
        }

        // screenshot (shift + W)
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                screenshotCounter++;
                let filename = darkMode ? '6.png' : (screenshotCounter + '.png');
                alert(`📸 screenshot saved as ${filename} (simulated)`);
            }
        });

        // start
        setTheme('light');
        navigate('onboarding');
    })();
</script>

<!-- JSON block at the end (as requested) -->
<pre style="display:none;">
All done!
</pre>
<script>
    // print JSON object at the very end (visible if you inspect, but we output it as text)
    (function() {
        const titles = {
            "1.png": "Start Learning",
            "2.png": "Daily Lessons",
            "3.png": "Practice Skills",
            "4.png": "Track Progress",
            "5.png": "Smart Settings",
            "6.png": "Dark Theme"
        };
        console.log('Play Store screenshot titles:', titles);
        // also write to hidden div for output requirement
        const jsonOut = document.createElement('pre');
        jsonOut.textContent = 'titles = ' + JSON.stringify(titles, null, 2);
        jsonOut.style = 'white-space: pre; font-family: monospace; background:#111; color:#0f0; margin:0; padding:8px;';
        document.body.appendChild(jsonOut);
        document.body.appendChild(document.createTextNode('All done!'));
    })();
</script>
</body>
</html>
