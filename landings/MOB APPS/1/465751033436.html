```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeFlash · learn Python</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 44px;
            box-shadow: 0 30px 50px -20px rgba(0,0,0,0.6), 0 0 0 8px #334155;
            overflow: hidden;
            position: relative;
            transition: background 0.2s;
            display: flex;
            flex-direction: column;
        }

        /* content wrapper */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--card-bg);
            padding: 0 16px;
        }
        .app-screen::-webkit-scrollbar { width: 4px; }
        .app-screen::-webkit-scrollbar-track { background: var(--card-bg); }
        .app-screen::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 20px; }

        /* theme variables (light default) */
        :root {
            --bg-primary: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --border-light: #E2E8F0;
        }

        body.dark-theme {
            --bg-primary: #0F172A;
            --card-bg: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --border-light: #334155;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0 12px;
            background: var(--bg-primary);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }
        .profile-icon {
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-icon:hover { background: var(--border-light); }

        /* bottom nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--card-bg);
            border-top: 1px solid var(--border-light);
            padding: 8px 0 10px;
            border-radius: 0 0 44px 44px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 8px 14px 6px;
            border-radius: 30px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: transparent;
            color: var(--inactive);
            fill: var(--inactive);
        }
        .nav-item.active {
            background: rgba(37, 99, 235, 0.12);
            color: var(--primary);
            fill: var(--primary);
            transform: scale(1.05);
        }
        .nav-item span {
            font-size: 12px;
            font-weight: 500;
        }

        /* cards & containers */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 18px;
            margin: 8px 0;
            box-shadow: 0 8px 18px -8px rgba(0,0,0,0.08);
            border: 1px solid var(--border-light);
        }

        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 13px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            width: 100%;
            box-shadow: 0 12px 20px -14px var(--primary);
        }
        .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }

        /* progress bar */
        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border-light);
            border-radius: 20px;
            margin: 12px 0;
        }
        .progress-fill {
            width: 64%;
            height: 8px;
            background: var(--primary);
            border-radius: 20px;
            transition: width 0.3s;
        }

        /* small row */
        .row-space {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* modal overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 32px 24px;
            border-radius: 32px;
            width: 300px;
            text-align: center;
            color: var(--text-primary);
            border: 2px solid var(--primary);
        }
        .modal-content button {
            margin-top: 20px;
            background: var(--primary);
            border: none;
            padding: 10px 30px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        /* chart mimic */
        .chart-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            margin: 20px 0 10px;
        }
        .chart-bar {
            width: 22%;
            background: var(--primary);
            height: calc(12px * 5);
            border-radius: 12px 12px 4px 4px;
            transition: height 0.3s;
        }
        .bar1 { height: 48px; }
        .bar2 { height: 72px; }
        .bar3 { height: 38px; }
        .bar4 { height: 58px; }

        /* small lesson items */
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }

        /* utility */
        .hidden { display: none !important; }
        .mt-4 { margin-top: 20px; }
        .link { color: var(--primary); font-weight: 500; cursor: pointer; }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic screens injected via js -->
    <div id="app"></div>
</div>

<script>
    (function() {
        // ---------- THEME TOGGLE ----------
        let darkMode = false;
        const htmlBody = document.body;

        // ---------- ICONS (inline svg) ----------
        const icons = {
            home: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2h-5v-8H8v8H5a2 2 0 0 1-2-2z"/></svg>`,
            learn: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
            progress: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`,
            settings: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 18a10 10 0 0 0 6.36-2.22z"/><path d="M16.5 6.5 19 9"/></svg>`,
            profile: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
            lesson: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>`,
            chart: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`,
            flashcards: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M9 9h6v6H9z"/></svg>`,
            play: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>`,
            check: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>`
        };

        // ---------- SCREEN MANAGER ----------
        let currentScreen = 'onboarding';

        // app container
        const appEl = document.getElementById('app');

        function renderScreen() {
            if (currentScreen === 'onboarding') appEl.innerHTML = renderOnboarding();
            else if (currentScreen === 'home') appEl.innerHTML = renderHome();
            else if (currentScreen === 'learn') appEl.innerHTML = renderLearn();
            else if (currentScreen === 'progress') appEl.innerHTML = renderProgress();
            else if (currentScreen === 'settings') appEl.innerHTML = renderSettings();
            // bottomNav update after each render
            attachListeners();
        }

        // ----- modals for legal -----
        function showModal(text) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.style.display = 'flex';
            modal.innerHTML = `<div class="modal-content"><p>${text}</p><button id="closeModalBtn">OK</button></div>`;
            document.body.appendChild(modal);
            document.getElementById('closeModalBtn').addEventListener('click', () => modal.remove());
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
        }

        // ----- attach navigation, bottom tabs, profile click, etc -----
        function attachListeners() {
            // Profile icon click
            const profileIcon = document.querySelector('.profile-icon');
            if (profileIcon) profileIcon.addEventListener('click', () => {
                currentScreen = 'settings';
                renderScreen();
            });

            // bottom nav
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                item.addEventListener('click', (e) => {
                    const screen = item.dataset.screen;
                    if (screen === 'home') currentScreen = 'home';
                    else if (screen === 'learn') currentScreen = 'learn';
                    else if (screen === 'progress') currentScreen = 'progress';
                    else if (screen === 'settings') currentScreen = 'settings';
                    renderScreen();
                });
            });

            // get started
            const getStarted = document.getElementById('getStartedBtn');
            if (getStarted) getStarted.addEventListener('click', () => {
                currentScreen = 'home';
                renderScreen();
            });

            // privacy & terms
            const privacyLink = document.getElementById('privacyLink');
            if (privacyLink) privacyLink.addEventListener('click', (e) => {
                e.preventDefault();
                showModal('We value your privacy. No data shared without consent.');
            });
            const termsLink = document.getElementById('termsLink');
            if (termsLink) termsLink.addEventListener('click', (e) => {
                e.preventDefault();
                showModal('Terms: Use for learning purposes only.');
            });

            // practice button on learn?
            const practiceBtn = document.getElementById('practiceStartBtn');
            if (practiceBtn) practiceBtn.addEventListener('click', () => alert('Starting Python exercise!'));

            // dark mode toggle inside settings
            const themeToggle = document.getElementById('themeToggle');
            if (themeToggle) {
                themeToggle.checked = darkMode;
                themeToggle.addEventListener('change', (e) => {
                    darkMode = e.target.checked;
                    if (darkMode) htmlBody.classList.add('dark-theme');
                    else htmlBody.classList.remove('dark-theme');
                });
            }
        }

        // ---------- SCREEN TEMPLATES ----------
        function renderOnboarding() {
            return `
                <div class="app-screen">
                    <div style="flex:1; display: flex; flex-direction: column; justify-content: center;">
                        <div style="margin-bottom: 40px;">${icons.flashcards.replace('currentColor', 'var(--primary)')}</div>
                        <h1 style="font-size: 44px; font-weight:800; color:var(--primary);">CodeFlash</h1>
                        <p style="font-size: 22px; font-weight:600; color:var(--text-primary);">Python, in your pocket</p>
                        <p style="margin: 16px 0 32px; color:var(--text-secondary);">Bite‑sized lessons, real coding practice. Master Python step by step.</p>
                        <button class="btn-primary" id="getStartedBtn">Get Started</button>
                        <div style="display:flex; gap:24px; justify-content:center; margin-top:32px;">
                            <a href="#" id="privacyLink" class="link">Privacy</a>
                            <a href="#" id="termsLink" class="link">Terms</a>
                        </div>
                    </div>
                </div>
                <!-- bottom nav hidden on onboarding -->
                <div style="display:none;"></div>
            `;
        }

        function renderHome() {
            return `
                <div class="app-screen">
                    <div class="header">
                        <h1>Home</h1>
                        <div class="profile-icon">${icons.profile.replace('currentColor', 'var(--text-primary)')}</div>
                    </div>
                    <div class="card row-space">
                        <span style="font-weight:600;">🔥 7 day streak</span>
                        <span class="badge">+120 XP</span>
                    </div>
                    <div class="card">
                        <div style="display:flex; gap:16px;">${icons.lesson.replace('currentColor', 'var(--primary)')}<span style="font-weight:700;">Continue: Loops</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:46%"></div></div>
                        <span style="color:var(--text-secondary);">3/8 steps</span>
                    </div>
                    <h3 style="margin-top:18px;">Daily pick</h3>
                    <div class="card" style="display:flex; align-items:center; gap:14px;">
                        ${icons.play.replace('currentColor', 'var(--accent)')}
                        <div><strong>Quick challenge:</strong> fix this code</div>
                    </div>
                    <div class="card" style="margin-top:4px;">
                        <span style="font-weight:600;">🏆 Achievements</span>
                        <div style="display:flex; gap:20px; margin-top:16px;">
                            <span>⚡ 5 days</span> <span>🔥 10 exercises</span> <span>🐍 beginner</span>
                        </div>
                    </div>
                </div>
                ${bottomNavHTML('home')}
            `;
        }

        function renderLearn() {
            return `
                <div class="app-screen">
                    <div class="header">
                        <h1>Learn</h1>
                        <div class="profile-icon">${icons.profile.replace('currentColor', 'var(--text-primary)')}</div>
                    </div>
                    <div class="lesson-item">${icons.lesson.replace('currentColor', 'var(--primary)')}<div><strong>Variables</strong><br>6 min</div></div>
                    <div class="lesson-item">${icons.lesson.replace('currentColor', 'var(--primary)')}<div><strong>Lists & loops</strong><br>12 min</div></div>
                    <div class="lesson-item">${icons.flashcards.replace('currentColor', 'var(--primary)')}<div><strong>Flashcards: syntax</strong><br>15 cards</div></div>
                    <div class="card" style="margin-top:12px;">
                        <button class="btn-primary" id="practiceStartBtn">Practice Python</button>
                    </div>
                    <div style="margin:10px 0;">${icons.check.replace('currentColor', 'var(--primary)')} 4 lessons ready</div>
                </div>
                ${bottomNavHTML('learn')}
            `;
        }

        function renderProgress() {
            return `
                <div class="app-screen">
                    <div class="header">
                        <h1>Progress</h1>
                        <div class="profile-icon">${icons.profile.replace('currentColor', 'var(--text-primary)')}</div>
                    </div>
                    <div class="card"><span>🔥 73% Python basics</span><div class="progress-bar"><div class="progress-fill" style="width:73%"></div></div></div>
                    <div class="card"><span>📊 weekly activity</span>
                        <div class="chart-row">
                            <div class="chart-bar bar1"></div><div class="chart-bar bar2"></div><div class="chart-bar bar3"></div><div class="chart-bar bar4"></div>
                        </div>
                    </div>
                    <div class="card row-space"><span>⚡ XP today</span> <span style="font-weight:700;">140</span></div>
                    <div class="card">${icons.chart.replace('currentColor', 'var(--primary)')} 12 lessons completed</div>
                </div>
                ${bottomNavHTML('progress')}
            `;
        }

        function renderSettings() {
            return `
                <div class="app-screen">
                    <div class="header">
                        <h1>Settings</h1>
                        <div class="profile-icon">${icons.profile.replace('currentColor', 'var(--text-primary)')}</div>
                    </div>
                    <div class="card row-space">
                        <span>🌙 Dark mode</span>
                        <label><input type="checkbox" id="themeToggle"></label>
                    </div>
                    <div class="card"><span>👤 Profile: Pythonista</span></div>
                    <div class="card"><span>🔔 Notifications</span> <span>on</span></div>
                    <div class="card link" id="privacyLink2">Privacy Policy</div>
                    <div class="card link" id="termsLink2">Terms of Service</div>
                </div>
                ${bottomNavHTML('settings')}
            `;
        }

        function bottomNavHTML(active) {
            const tabs = [
                {screen:'home', label:'Home', icon: icons.home},
                {screen:'learn', label:'Learn', icon: icons.learn},
                {screen:'progress', label:'Progress', icon: icons.progress},
                {screen:'settings', label:'Settings', icon: icons.settings}
            ];
            return `<div class="bottom-nav">${tabs.map(t => `
                <div class="nav-item ${active === t.screen ? 'active' : ''}" data-screen="${t.screen}">
                    ${t.icon.replace('currentColor', active === t.screen ? '#2563EB' : 'var(--inactive)')}
                    <span>${t.label}</span>
                </div>`).join('')}</div>`;
        }

        // initial render
        renderScreen();

        // ---------- SCREENSHOT feature (SHIFT + W) ----------
        let screenshotCounter = 1;
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                const phone = document.getElementById('phoneContainer');
                html2canvas?.(phone, { scale: 2 }).then(canvas => {
                    const link = document.createElement('a');
                    let filename = (darkMode ? '6' : screenshotCounter) + '.png';
                    if (!darkMode && screenshotCounter <=5) { 
                        link.download = filename; 
                        screenshotCounter = (screenshotCounter % 5) + 1; 
                    } else if (darkMode) {
                        link.download = '6.png';
                    } else link.download = '1.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }).catch(() => alert('html2canvas not loaded – fallback'));
            }
        });

        // Include html2canvas from CDN (acceptable, single file)
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        document.head.appendChild(script);
    })();
</script>
<!-- inject light/dark base class toggling via js -->
</body>
</html>
```
All done!
