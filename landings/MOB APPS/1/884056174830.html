```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Play · 2026 prototype</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* CSS variables — light mode default */
    :root {
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --text-muted: #64748B;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --border-light: #E2E8F0;
      --icon-inactive: #94A3B8;
      --header-shadow: 0 2px 8px rgba(0,0,0,0.02);
      --card-shadow: 0 4px 12px rgba(0,0,0,0.03);
      --progress-bg: #E2E8F0;
    }

    body.dark {
      --bg: #0F172A;
      --card-bg: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --border-light: #334155;
      --icon-inactive: #64748B;
      --header-shadow: 0 2px 8px rgba(0,0,0,0.5);
      --card-shadow: 0 4px 12px rgba(0,0,0,0.4);
      --progress-bg: #334155;
    }

    body {
      background: #1e1e2f; /* outer background */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background-color: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2c2c3a;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s;
    }

    /* main app content */
    .app-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--primary) var(--border-light);
      padding: 16px 16px 8px 16px;
      gap: 20px;
    }

    .app-screen::-webkit-scrollbar {
      width: 4px;
    }
    .app-screen::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 8px;
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-light);
      margin-bottom: 4px;
    }
    .header h2 {
      font-size: 22px;
      font-weight: 650;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .profile-btn svg {
      width: 28px;
      height: 28px;
      stroke: var(--text-primary);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* bottom navigation */
    .bottom-nav {
      height: 72px;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-light);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 6px 12px;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px 0 4px;
      width: 60px;
      border-radius: 20px;
      transition: transform 0.15s ease, background 0.2s;
      color: var(--icon-inactive);
      fill: none;
      stroke: var(--icon-inactive);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nav-item.active {
      stroke: var(--primary);
      color: var(--primary);
      background: rgba(37, 99, 235, 0.08);
      transform: scale(1.05);
    }
    .nav-item.active svg {
      stroke: var(--primary);
    }
    .nav-item span {
      font-size: 11px;
      font-weight: 500;
      margin-top: 2px;
      color: currentColor;
    }
    .nav-item svg {
      width: 24px;
      height: 24px;
      transition: stroke 0.1s;
    }

    /* cards, buttons */
    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 18px 16px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border-light);
    }
    .btn-primary {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      font-size: 18px;
      padding: 16px;
      border-radius: 40px;
      width: 100%;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 6px 0 var(--primary-dark);
    }
    .btn-primary:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--primary-dark);
    }
    .link-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin: 16px 0 8px;
      font-size: 14px;
    }
    .link-row button {
      background: none;
      border: none;
      color: var(--text-muted);
      text-decoration: underline;
      cursor: pointer;
      font-size: 14px;
    }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal {
      background: var(--card-bg);
      width: 280px;
      padding: 28px 20px;
      border-radius: 36px;
      text-align: center;
      color: var(--text-primary);
      border: 1px solid var(--border-light);
    }
    .modal button {
      margin-top: 20px;
      background: var(--primary);
      border: none;
      color: white;
      padding: 10px 24px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
    }

    .progress-bar {
      background: var(--progress-bg);
      height: 12px;
      border-radius: 20px;
      overflow: hidden;
      margin: 12px 0;
    }
    .progress-fill {
      background: var(--primary);
      width: 0%;
      height: 100%;
      transition: width 0.4s ease;
    }
    .badge-grid {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .badge {
      background: var(--bg);
      padding: 8px 16px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      color: var(--text-primary);
      border: 1px solid var(--border-light);
    }
    .badge svg {
      width: 20px;
      height: 20px;
      stroke: var(--primary);
      stroke-width: 2;
      fill: none;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin: 12px 0;
    }
  </style>
</head>
<body>
  <div class="phone" id="phoneContainer">
    <!-- dynamic header will be injected per screen -->
    <div id="headerPlaceholder"></div>
    <!-- main screen content -->
    <div id="screenContent" class="app-screen"></div>
    <!-- bottom navigation (static) -->
    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-item" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 Z"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-item" data-tab="learn">
        <svg viewBox="0 0 24 24"><path d="M12 4 L20 8 L12 12 L4 8 L12 4 Z M4 14 L12 18 L20 14 M4 10 L12 14 L20 10"/></svg>
        <span>Learn</span>
      </button>
      <button class="nav-item" data-tab="progress">
        <svg viewBox="0 0 24 24"><path d="M21 12 L18 12 L15 20 L9 4 L6 12 L3 12"/><circle cx="12" cy="12" r="9" fill="none"/></svg>
        <span>Progress</span>
      </button>
      <button class="nav-item" data-tab="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15 L17.6 18 M4.6 9 L6.4 6 M12 2 L12 5 M12 22 L12 19 M2 12 L5 12 M22 12 L19 12 M6.4 18 L4.6 15 M17.6 6 L19.4 9"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <script>
    (function() {
      // ------ theme state ------
      let darkMode = false;
      document.body.classList.remove('dark'); // light default

      // ------ icon system (inline svg strings) ------
      const icons = {
        profile: '<svg viewBox="0 0 24 24"><path d="M4 20 C4 17 8 16 12 16 C16 16 20 17 20 20 M12 12 C14 12 16 10 16 8 C16 6 14 4 12 4 C10 4 8 6 8 8 C8 10 10 12 12 12" stroke="currentColor" fill="none"/></svg>',
        home: '<svg viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 Z"/></svg>',
        learn: '<svg viewBox="0 0 24 24"><path d="M12 4 L20 8 L12 12 L4 8 L12 4 Z M4 14 L12 18 L20 14 M4 10 L12 14 L20 10"/></svg>',
        progress: '<svg viewBox="0 0 24 24"><path d="M21 12 L18 12 L15 20 L9 4 L6 12 L3 12"/><circle cx="12" cy="12" r="9" fill="none"/></svg>',
        settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15 L17.6 18 M4.6 9 L6.4 6 M12 2 L12 5 M12 22 L12 19 M2 12 L5 12 M22 12 L19 12 M6.4 18 L4.6 15 M17.6 6 L19.4 9"/></svg>',
        lesson: '<svg viewBox="0 0 24 24"><path d="M2 6 L12 2 L22 6 L12 10 L2 6 Z M2 12 L12 16 L22 12 M2 18 L12 22 L22 18"/></svg>',
        chart: '<svg viewBox="0 0 24 24"><path d="M2 20 L22 20 M6 16 L6 8 M12 16 L12 4 M18 16 L18 12"/></svg>',
        flashcards: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8 L16 8 M8 12 L14 12 M8 16 L12 16"/></svg>',
        play: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M10 8 L16 12 L10 16 Z"/></svg>',
        check: '<svg viewBox="0 0 24 24"><path d="M5 12 L10 17 L19 8"/></svg>'
      };

      // ------ app state ------
      let currentScreen = 'onboarding'; // 'onboarding', 'home', 'learn', 'progress', 'settings'
      let screenshotCounter = 1;

      // ------ modal management ------
      let modalDiv = null;
      function showModal(text) {
        if (modalDiv) document.body.removeChild(modalDiv);
        modalDiv = document.createElement('div');
        modalDiv.className = 'modal-overlay';
        modalDiv.innerHTML = `<div class="modal"><p>${text}</p><button id="closeModalBtn">OK</button></div>`;
        document.body.appendChild(modalDiv);
        document.getElementById('closeModalBtn').addEventListener('click', ()=>{
          document.body.removeChild(modalDiv);
          modalDiv = null;
        });
      }

      // ------ update header & content based on screen ------
      function renderScreen(screen) {
        const headerEl = document.getElementById('headerPlaceholder');
        const contentEl = document.getElementById('screenContent');

        // header generator
        function getHeader(title) {
          return `
            <div class="header">
              <h2>${title}</h2>
              <button class="profile-btn" id="profileBtn">${icons.profile}</button>
            </div>
          `;
        }

        // SCREEN: onboarding (special no bottom nav interaction)
        if (screen === 'onboarding') {
          headerEl.innerHTML = getHeader('Welcome');
          contentEl.innerHTML = `
            <div class="card" style="text-align: center; padding: 40px 20px;">
              <div style="background: #EFF6FF; width: 80px; height: 80px; border-radius: 30px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;">
                <svg width="48" height="48" viewBox="0 0 24 24" stroke="#2563EB" stroke-width="2" fill="none"><path d="M12 4 L20 8 L12 12 L4 8 L12 4 Z M4 14 L12 18 L20 14 M4 10 L12 14 L20 10"/></svg>
              </div>
              <h1 style="font-size: 34px; font-weight: 700; color: var(--primary);">Python</h1>
              <p style="font-size: 20px; font-weight: 500; margin: 8px 0;">code. play. learn.</p>
              <p style="color: var(--text-secondary); margin: 20px 0;">Bite-sized Python puzzles for beginners. Master loops, functions, and logic in minutes.</p>
              <button class="btn-primary" id="getStartedBtn">Get Started</button>
              <div class="link-row">
                <button id="privacyBtn">Privacy Policy</button>
                <button id="termsBtn">Terms of Service</button>
              </div>
            </div>
          `;

          document.getElementById('getStartedBtn').addEventListener('click', ()=>{
            currentScreen = 'home';
            renderScreen('home');
            setActiveTab('home');
          });
          document.getElementById('privacyBtn').addEventListener('click', ()=> showModal('Privacy: your data stays on device.'));
          document.getElementById('termsBtn').addEventListener('click', ()=> showModal('Terms: use = learn, be nice.'));
          document.getElementById('profileBtn').addEventListener('click', ()=>{
            currentScreen = 'settings';
            renderScreen('settings');
            setActiveTab('settings');
          });
          return;
        }

        // all other screens have bottom nav
        let title = '';
        let bodyHtml = '';

        if (screen === 'home') {
          title = 'Home';
          bodyHtml = `
            <div class="card">
              <div style="display: flex; gap: 12px; align-items: center;"><span>${icons.lesson}</span><span style="font-weight:600;">Today's Python puzzle</span></div>
              <p style="margin: 8px 0;">🐍 Reverse a string in 1 line</p>
              <div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div>
              <button class="btn-primary" style="padding:10px;" id="quickPractice">Start practice</button>
            </div>
            <div class="card">
              <div style="display:flex; justify-content:space-between;"><span>🔥 Streak 7 days</span><span>${icons.flashcards}</span></div>
              <div style="display:flex; gap:20px; margin-top:16px;">
                <div><span style="font-size:24px; font-weight:700;">12</span><br>lessons</div>
                <div><span style="font-size:24px; font-weight:700;">3</span><br>badges</div>
              </div>
            </div>
            <div class="badge-grid">
              <div class="badge">${icons.check} List</div>
              <div class="badge">${icons.play} Loops</div>
            </div>
          `;
        } else if (screen === 'learn') {
          title = 'Lessons';
          bodyHtml = `
            <div class="card" style="display:flex; align-items:center; gap:12px; cursor:pointer;" id="lessonDemo">
              ${icons.flashcards} <span><strong>Python basics</strong> · 4 min</span>
            </div>
            <div class="card" style="display:flex; align-items:center; gap:12px;">
              ${icons.lesson} <span><strong>Functions</strong> · 3 min</span>
            </div>
            <div class="card" style="display:flex; align-items:center; gap:12px;">
              ${icons.play} <span><strong>Lists & dicts</strong> · 5 min</span>
            </div>
            <button class="btn-primary" style="margin-top:8px;" id="startPracticeBtn">Start practice</button>
          `;
        } else if (screen === 'progress') {
          title = 'Progress';
          bodyHtml = `
            <div class="card">
              <div style="display:flex; gap:8px;">${icons.chart} <span>Weekly activity</span></div>
              <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
              <div class="stat-row"><span>Completed</span><span>14/20</span></div>
            </div>
            <div class="card">
              <span>🏅 Achievements</span>
              <div style="display:flex; gap:20px; margin-top:16px;">
                <div>⚡ Early bird</div><div>🔥 7 day streak</div>
              </div>
            </div>
          `;
        } else if (screen === 'settings') {
          title = 'Settings';
          bodyHtml = `
            <div class="card">
              <div style="display:flex; align-items:center; justify-content:space-between;">
                <span>Dark theme</span>
                <button id="themeToggleBtn" style="background:var(--primary); border:none; color:white; padding:10px 20px; border-radius:40px; cursor:pointer;">${darkMode ? 'Light' : 'Dark'}</button>
              </div>
            </div>
            <div class="card">
              <div>Profile: pythonista_24</div>
              <div style="margin-top:12px;">${icons.profile}  edit</div>
            </div>
          `;
        }

        headerEl.innerHTML = getHeader(title);
        contentEl.innerHTML = bodyHtml;

        document.getElementById('profileBtn').addEventListener('click', ()=>{
          currentScreen = 'settings';
          renderScreen('settings');
          setActiveTab('settings');
        });

        // additional interactions
        if (screen === 'home' && document.getElementById('quickPractice')) {
          document.getElementById('quickPractice').addEventListener('click', ()=>{
            alert('Practice started! (simulated)');
          });
        }
        if (screen === 'learn') {
          if (document.getElementById('lessonDemo')) {
            document.getElementById('lessonDemo').addEventListener('click', ()=> alert('📘 Python basics: variables'));
          }
          if (document.getElementById('startPracticeBtn')) {
            document.getElementById('startPracticeBtn').addEventListener('click', ()=> alert('Coding challenge loaded'));
          }
        }
        if (screen === 'settings') {
          document.getElementById('themeToggleBtn').addEventListener('click', ()=>{
            darkMode = !darkMode;
            document.body.classList.toggle('dark', darkMode);
            renderScreen('settings'); // refresh settings (button text changes)
            setActiveTab('settings');
          });
        }
      }

      // bottom nav setup + active style
      const navItems = document.querySelectorAll('.nav-item');
      function setActiveTab(tabId) {
        navItems.forEach(item => {
          const tab = item.getAttribute('data-tab');
          if (tab === tabId) {
            item.classList.add('active');
          } else {
            item.classList.remove('active');
          }
        });
      }

      navItems.forEach(btn => {
        btn.addEventListener('click', (e) => {
          const tab = e.currentTarget.getAttribute('data-tab');
          if (tab === 'home') currentScreen = 'home';
          else if (tab === 'learn') currentScreen = 'learn';
          else if (tab === 'progress') currentScreen = 'progress';
          else if (tab === 'settings') currentScreen = 'settings';
          renderScreen(currentScreen);
          setActiveTab(tab);
        });
      });

      // initial render (onboarding)
      renderScreen('onboarding');
      // bottom nav no active on onboarding, but we ensure all inactive
      setActiveTab('none'); 

      // screenshot feature SHIFT+W
      window.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.key === 'W') {
          const phone = document.getElementById('phoneContainer');
          html2canvas?.(phone, { scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            let filename = darkMode ? '6.png' : (screenshotCounter + '.png');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
            if (!darkMode) screenshotCounter = (screenshotCounter % 5) + 1;
          }).catch(() => alert('html2canvas not loaded, but Shift+W works! (saving would need lib)'));
        }
      });

      // include minimal html2canvas via cdn (we can embed)
      const script = document.createElement('script');
      script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
      document.head.appendChild(script);
    })();
  </script>
  <!-- mock html2canvas fallback: define dummy if cdn fails (just for demo) -->
  <script>window.html2canvas = window.html2canvas || function(){ return Promise.resolve({toDataURL:()=>''}) };</script>
</body>
</html>
All done!
