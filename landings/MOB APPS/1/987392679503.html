  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <!-- dynamic screens injected via js -->
  <div class="screen-container" id="appScreen">
    <!-- will be filled by js -->
  </div>
  <!-- bottom nav -->
  <div class="bottom-nav" id="bottomNav"></div>
</div>

<!-- hidden modal for legal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-content" id="modalText">
    <h3 style="margin-bottom: 12px;">Privacy</h3>
    <p style="margin-bottom: 20px;">We respect your data. No tracking, just brain training.</p>
    <button id="closeModalBtn" style="padding: 10px;">Got it</button>
  </div>
</div>

<script>
  (function() {
    // ---------- THEME & STATE ----------
    const theme = { current: 'light' }; // light default
    const appState = {
      currentScreen: 'onboarding',
      darkMode: false
    };

    // screens data: onboarding, home, learn, progress, settings
    let activeScreen = 'onboarding';

    // ---------- SVG ICONS (inline, same style) ----------
    const icons = {
      home: `<svg class="icon-stroke" viewBox="0 0 24 24"><path d="M5 12H3L12 3L21 12H19M5 12V20H19V12M5 12H9M19 12H15M9 20V14H15V20"/></svg>`,
      learn: `<svg class="icon-stroke" viewBox="0 0 24 24"><path d="M12 6V4M12 6C10.9 6 10 6.9 10 8V14C10 15.1 10.9 16 12 16M12 6C13.1 6 14 6.9 14 8V14C14 15.1 13.1 16 12 16M8 10H6M18 10H16M6 20L8 18M18 20L16 18"/></svg>`,
      progress: `<svg class="icon-stroke" viewBox="0 0 24 24"><path d="M21 12V18C21 19.1 20.1 20 19 20H5C3.9 20 3 19.1 3 18V6C3 4.9 3.9 4 5 4H9M15 9L21 3M15 9H18M15 9V6M21 3L15 9"/><circle cx="12" cy="12" r="2"/><path d="M12 14V16"/></svg>`,
      settings: `<svg class="icon-stroke" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M5 12H2M22 12H19M12 5V2M12 22V19M19 19L17 17M7 7L5 5M19 5L17 7M7 17L5 19"/></svg>`,
      profile: `<svg class="icon-stroke" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></svg>`,
      lesson: `<svg class="icon-stroke" viewBox="0 0 24 24"><path d="M2 3H8C9.1 3 10 3.9 10 5V19C10 20.1 9.1 21 8 21H2V3Z M22 3H16C14.9 3 14 3.9 14 5V19C14 20.1 14.9 21 16 21H22V3Z"/></svg>`,
      chart: `<svg class="icon-stroke" viewBox="0 0 24 24"><path d="M21 20H3M7 16V12M12 16V8M17 16V4"/></svg>`,
      flashcards: `<svg class="icon-stroke" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7H15M9 11H15M9 15H13"/></svg>`,
      play: `<svg class="icon-stroke" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8L16 12L10 16V8Z"/></svg>`,
      check: `<svg class="icon-stroke" viewBox="0 0 24 24"><path d="M20 6L9 17L4 12"/></svg>`
    };

    // ---------- Helper: render header ----------
    function renderHeader(title) {
      return `<div class="app-header">
        <h2>${title}</h2>
        <div class="profile-icon" data-screen="settings">${icons.profile}</div>
      </div>`;
    }

    // ---------- Screen HTML builders ----------
    function onboardingScreen() {
      return `
        ${renderHeader('Welcome')}
        <div class="card" style="text-align: center; padding: 32px 20px;">
          <div style="background: #EFF6FF; width: 80px; height: 80px; border-radius: 30px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center;">
            <span style="font-size: 44px; filter: brightness(0.9);">🧠</span>
          </div>
          <h1 style="font-size: 34px; font-weight: 700; letter-spacing: -1px;">Math Brain</h1>
          <p style="font-size: 18px; color: var(--primary); margin: 4px 0 12px;">trainer · daily</p>
          <p style="color: var(--text-secondary); margin: 12px 0 20px;">Master mental math with 5‑minute workouts. Bite‑sized challenges, instant feedback.</p>
          <button id="startFromOnboard">Get Started</button>
          <div class="link-row">
            <span id="privacyLink">Privacy Policy</span>
            <span id="termsLink">Terms of Service</span>
          </div>
        </div>
      `;
    }

    function homeScreen() {
      return `
        ${renderHeader('Home')}
        <div class="card">
          <div class="flex-row"><span class="badge">🔥 12 day streak</span> <span>🎯 340 XP</span></div>
          <h3 style="margin: 12px 0 6px;">Daily workout</h3>
          <div class="flex-row"><span>Arithmetic</span><span>3/5</span></div>
          <div class="progress-bar-bg"><div class="progress-fill" style="width:60%"></div></div>
          <button style="margin-top: 12px;" id="continueLearnBtn">Continue</button>
        </div>
        <div class="card">
          <div class="flex-row"><span>📘 <strong>Recommended</strong></span><span>${icons.flashcards}</span></div>
          <div style="display: flex; gap: 12px; margin-top: 16px;">
            <div style="flex:1; background:var(--highlight-soft); border-radius: 20px; padding:12px;">➕ Addition</div>
            <div style="flex:1; background:var(--highlight-soft); border-radius: 20px; padding:12px;">✖️ Times</div>
          </div>
        </div>
        <div class="card flex-row"><span>⭐ Today’s puzzle</span> <span>${icons.play}</span></div>
      `;
    }

    function learnScreen() {
      return `
        ${renderHeader('Practice')}
        <div class="card">
          <div class="flex-row"><span>Level 7 · mental math</span> <span>${icons.lesson}</span></div>
          <div style="margin: 12px 0;">Operations</div>
          <div class="progress-bar-bg"><div class="progress-fill" style="width:45%"></div></div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px;">
            <div style="background:var(--bg-card); border:1px solid var(--primary); border-radius: 40px; padding:10px; text-align:center;">➕ Add</div>
            <div style="background:var(--bg-card); border:1px solid var(--border-light); border-radius: 40px; padding:10px;">➖ Subtract</div>
            <div style="background:var(--bg-card); border:1px solid var(--border-light); border-radius: 40px; padding:10px;">✖️ Multiply</div>
            <div style="background:var(--bg-card); border:1px solid var(--border-light); border-radius: 40px; padding:10px;">➗ Divide</div>
          </div>
          <button style="margin-top: 20px;" id="startPracticeBtn">Start practice →</button>
        </div>
      `;
    }

    function progressScreen() {
      return `
        ${renderHeader('Progress')}
        <div class="card">
          <div class="flex-row"><span>📊 This week</span><span>+240 XP</span></div>
          <div style="height: 80px; display: flex; align-items: baseline; gap: 8px; margin: 12px 0;">
            <div style="width:18%; height:30px; background:var(--primary); border-radius: 12px;"></div>
            <div style="width:18%; height:50px; background:var(--primary); border-radius: 12px;"></div>
            <div style="width:18%; height:70px; background:var(--primary); border-radius: 12px;"></div>
            <div style="width:18%; height:45px; background:var(--primary); border-radius: 12px;"></div>
            <div style="width:18%; height:60px; background:var(--accent); border-radius: 12px;"></div>
          </div>
          <div class="stat-grid">
            <div class="stat-cell"><span>${icons.chart}</span><br><strong>3,420</strong> total</div>
            <div class="stat-cell"><span>${icons.check}</span><br><strong>86%</strong> accuracy</div>
          </div>
        </div>
        <div class="card"><span>Achievements</span> 🏅🏅🏅 3 unlocked</div>
      `;
    }

    function settingsScreen() {
      const checked = appState.darkMode ? 'checked' : '';
      return `
        ${renderHeader('Settings')}
        <div class="card">
          <div class="flex-row"><span>👤 Username</span><span>MathWhiz</span></div>
          <div class="flex-row" style="margin-top:16px;"><span>🌙 Dark mode</span>
            <label style="width: 44px; height: 24px; background:var(--border-light); border-radius:40px; position:relative;">
              <input type="checkbox" id="darkToggle" style="width:0;height:0;opacity:0;">
              <span style="width:20px;height:20px;background:var(--primary); border-radius:50%; position:absolute; top:2px; left:${appState.darkMode?'22px':'2px'}; transition:0.2s;"></span>
            </label>
          </div>
        </div>
        <div class="card">📱 App version 2026.3</div>
      `;
    }

    // screen map
    const screens = {
      onboarding: onboardingScreen,
      home: homeScreen,
      learn: learnScreen,
      progress: progressScreen,
      settings: settingsScreen
    };

    // ---------- Render active screen + bottom nav ----------
    function renderApp() {
      const container = document.getElementById('appScreen');
      const bottom = document.getElementById('bottomNav');
      if (!container || !bottom) return;

      // render screen content
      container.innerHTML = screens[activeScreen]();

      // bottom navigation items (4)
      const navItems = [
        { id: 'home', label: 'Home', icon: icons.home },
        { id: 'learn', label: 'Learn', icon: icons.learn },
        { id: 'progress', label: 'Progress', icon: icons.progress },
        { id: 'settings', label: 'Settings', icon: icons.settings }
      ];

      bottom.innerHTML = navItems.map(item => {
        const isActive = activeScreen === item.id;
        const iconColor = isActive ? 'active-icon' : 'inactive-icon';
        return `<div class="nav-item ${isActive ? 'active' : ''}" data-nav="${item.id}">
          <div class="nav-icon ${iconColor}">${item.icon}</div>
          <span class="nav-label">${item.label}</span>
        </div>`;
      }).join('');

      // re-attach listeners
      attachListeners();
    }

    // ---------- Event listeners ----------
    function attachListeners() {
      // profile icon click (settings)
      document.querySelectorAll('.profile-icon').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          activeScreen = 'settings';
          renderApp();
        });
      });

      // bottom nav clicks
      document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => {
          const nav = item.dataset.nav;
          if (nav && screens[nav]) {
            activeScreen = nav;
            renderApp();
          }
        });
      });

      // onboarding start button
      const startBtn = document.getElementById('startFromOnboard');
      if (startBtn) startBtn.addEventListener('click', () => {
        activeScreen = 'home';
        renderApp();
      });

      // continue button on home
      const continueBtn = document.getElementById('continueLearnBtn');
      if (continueBtn) continueBtn.addEventListener('click', () => {
        activeScreen = 'learn';
        renderApp();
      });

      // start practice
      const practiceBtn = document.getElementById('startPracticeBtn');
      if (practiceBtn) practiceBtn.addEventListener('click', () => {
        alert('🧮 34 + 57 = ? (demo)');
      });

      // modal links
      const overlay = document.getElementById('modalOverlay');
      const modalText = document.getElementById('modalText');
      const closeModal = document.getElementById('closeModalBtn');

      document.getElementById('privacyLink')?.addEventListener('click', () => {
        modalText.innerHTML = '<h3>Privacy</h3><p>We only store your progress locally. No data sold.</p><button id="closeModalBtn">OK</button>';
        overlay.style.display = 'flex';
        document.getElementById('closeModalBtn')?.addEventListener('click', ()=> overlay.style.display = 'none');
      });
      document.getElementById('termsLink')?.addEventListener('click', () => {
        modalText.innerHTML = '<h3>Terms</h3><p>Use for personal brain training only. Have fun!</p><button id="closeModalBtn">OK</button>';
        overlay.style.display = 'flex';
        document.getElementById('closeModalBtn')?.addEventListener('click', ()=> overlay.style.display = 'none');
      });
      if (closeModal) closeModal.addEventListener('click', ()=> overlay.style.display = 'none');

      // dark mode toggle inside settings
      const darkToggle = document.getElementById('darkToggle');
      if (darkToggle) {
        darkToggle.checked = appState.darkMode;
        darkToggle.addEventListener('change', (e) => {
          appState.darkMode = e.target.checked;
          document.body.classList.toggle('dark', appState.darkMode);
          // update toggle knob visual via re-render (simple)
          renderApp();
        });
      }
    }

    // initial render
    renderApp();

    // ---------- SHIFT + W screenshot (sequential) ----------
    let screenshotCounter = 0;
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const phone = document.getElementById('phoneContainer');
        // in real prototype we can't generate PNG, but we simulate naming:
        const isDark = document.body.classList.contains('dark');
        const num = isDark ? 6 : (screenshotCounter % 5) + 1;
        screenshotCounter = (screenshotCounter + 1) % 5;
        alert(`📸 Screenshot saved as ${num}.png (simulated)`);
      }
    });

    // expose for theme sync
    window.appState = appState;
  })();
</script>

<!-- modal overlay stays -->

  </div>
</div>

<script>
  // re-attach modal close after dynamic overwrite
  document.getElementById('closeModalBtn')?.addEventListener('click', function() {
    document.getElementById('modalOverlay').style.display = 'none';
  });

</body>
