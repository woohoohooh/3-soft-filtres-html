<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeLoom · Python lab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --border: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.02), 0 2px 6px rgba(0, 0, 0, 0.05);
            --header-bg: rgba(255,255,255,0.8);
            --bottom-bg: rgba(255,255,255,0.9);
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --border: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            --header-bg: rgba(30, 41, 59, 0.8);
            --bottom-bg: rgba(30, 41, 59, 0.9);
        }

        body {
            background: #1e1e2f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        /* phone */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 0 0 0 8px #2c2c3a;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s;
        }

        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: none;
            padding: 16px 16px 8px 16px;
            gap: 16px;
        }
        .screen::-webkit-scrollbar { display: none; }

        /* header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--header-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
        }
        .profile-icon {
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* bottom nav */
        .bottom-nav {
            background: var(--bottom-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px;
            border-top: 1px solid var(--border);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 40px;
            transition: all 0.15s ease;
            color: var(--inactive);
        }
        .nav-item.active {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
        }
        .nav-item.active svg { stroke: var(--primary); transform: scale(1.1); }
        .nav-item svg {
            stroke: currentColor;
            transition: transform 0.1s;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
        }

        /* cards */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .flex-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 12px;
        }
        .progress-bar {
            height: 8px;
            background: var(--border);
            border-radius: 20px;
            overflow: hidden;
            margin: 12px 0 6px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 20px;
            transition: width 0.3s;
        }
        .btn {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 20px;
            border-radius: 40px;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            transition: 0.15s;
        }
        .btn-small {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 8px 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .lesson-item:last-child { border-bottom: none; }

        /* modal */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: var(--card);
            padding: 24px;
            border-radius: 32px;
            width: 280px;
            color: var(--text);
            box-shadow: var(--shadow);
        }
        .link-group {
            display: flex;
            gap: 24px;
            justify-content: center;
            margin: 16px 0 8px;
            font-size: 13px;
        }
        .link-group span {
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
        }
        .hidden { display: none; }

        /* chart emulation */
        .chart-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 100px;
            margin: 20px 0;
        }
        .bar {
            flex: 1;
            background: var(--primary);
            height: calc(70% + 10px);
            border-radius: 12px 12px 6px 6px;
            opacity: 0.8;
            transition: height 0.2s;
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- header -->
    <div class="header">
        <h1 id="headerTitle">Welcome</h1>
        <div class="profile-icon" id="profileBtn"><?xml version="1.0"?><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
    </div>

        <div class="nav-item" data-screen="home">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>

            <span>Settings</span>

    <!-- modal container -->
    <div id="modalContainer" class="modal hidden"></div>

<script>
    (function() {
        // ---------- THEME ----------
        let darkMode = false;
        const root = document.documentElement;
        const body = document.body;

        // ---------- SCREENS DATA ----------
        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings

        // ---------- SCREENSHOT COUNTER ----------
        let shotCounter = 1;

        // ---------- ICONS (inline style) ----------
        function iconTemplate(name, active = false) { /* used by nav; we already inline */ }

        // ---------- RENDER FUNCTION ----------
        const appScreen = document.getElementById('appScreen');
        const headerTitle = document.getElementById('headerTitle');
        const navItems = document.querySelectorAll('.nav-item');

        function setActiveTab(screen) {
            navItems.forEach(item => {
                const tab = item.dataset.screen;
                if (tab === screen) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        function showModal(contentHtml) {
            const modal = document.getElementById('modalContainer');
            modal.innerHTML = `<div class="modal-content">${contentHtml}<button class="btn-small" style="margin-top:16px;width:100%;" id="closeModalBtn">Close</button></div>`;
            modal.classList.remove('hidden');
            document.getElementById('closeModalBtn').addEventListener('click', ()=>{
                modal.classList.add('hidden');
            });
        }

        function renderScreen(screen) {
            currentScreen = screen;
            let html = '';

            if (screen === 'onboarding') {
                headerTitle.innerText = 'Get started';
                html = `
                    <div class="card" style="text-align:center; margin-top:40px;">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="1.5"><path d="M12 2a10 10 0 0 1 10 10c0 5-4 8-10 8-6 0-10-3-10-8 0-5 4-10 10-10z"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>

                        <p style="color:var(--text-light);">learn Python · weave logic</p>
                        <p style="margin:16px 0; font-size:15px;">Bite-sized Python exercises, real‑time feedback, and progress tracking. Perfect for beginners.</p>
                        <button class="btn" id="startBtn">Get Started</button>
                        <div class="link-group">
                            <span id="privacyLink">Privacy</span>
                            <span id="termsLink">Terms</span>
                        </div>
                    </div>
                `;
            }
            else if (screen === 'home') {
                headerTitle.innerText = 'Home';
                html = `
                    <div class="card flex-row">
                        <div><span style="font-weight:600; font-size:18px;">👋 Welcome back</span><br><span style="color:var(--text-light);">Pythonista</span></div>
                        <span class="badge">🔥 7 day streak</span>
                    </div>

                        <div class="flex-row"><span style="font-weight:600;">Today's plan</span><span>3/5 lessons</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div>
                        <div style="display:flex; gap:8px; margin-top:16px;">
                            <div style="flex:1; background:var(--primary-dark); padding:12px; border-radius:20px; color:white; text-align:center; cursor:pointer;" id="resumeLearnBtn">▶️ Resume</div>
                            <div style="flex:1; background:var(--accent); padding:12px; border-radius:20px; color:#0F172A; text-align:center; cursor:pointer;" id="practiceBtn">⚡ Practice</div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="flex-row"><span style="font-weight:600;">Recommended</span><span style="color:var(--primary);">see all</span></div>
                        <div class="lesson-item"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><div><div>Variables & data</div><span style="color:var(--text-light);font-size:13px;">8 min left</span></div></div>
                        <div class="lesson-item"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M2 12h20"/><path d="M12 2v20"/></svg><div><div>Lists & loops</div><span style="color:var(--text-light);font-size:13px;">12 min</span></div></div>
                    </div>
                `;
            }
            else if (screen === 'learn') {
                headerTitle.innerText = 'Learn';
                html = `
                    <div class="card">
                        <h3 style="margin-bottom:8px;">Python fundamentals</h3>
                        <div class="lesson-item"><span style="flex:1;">🔹 Hello world</span><span class="badge">done</span></div>
                        <div class="lesson-item"><span style="flex:1;">🔹 Variables</span><span class="badge">done</span></div>
                        <div class="lesson-item"><span style="flex:1;">🔹 Conditionals</span><span class="badge" style="background:var(--primary); color:white;">75%</span></div>
                        <div class="lesson-item"><span style="flex:1;">🔹 Loops</span><span class="badge">start</span></div>
                        <div class="lesson-item"><span style="flex:1;">🔹 Functions</span><span class="badge">lock</span></div>
                        <button class="btn-small" style="width:100%; margin-top:8px;" id="startLessonBtn">Start next lesson</button>
                    </div>
                    <div class="card">
                        <div class="flex-row"><span>🏆 daily goal</span><span>2/3 exercises</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:66%"></div></div>
                    </div>
                `;
            }
            else if (screen === 'progress') {
                headerTitle.innerText = 'Progress';
                html = `
                    <div class="card" style="text-align:center;">
                        <span style="font-size:32px; font-weight:700;">1,280</span><span style="color:var(--text-light);"> XP</span>
                        <div style="display:flex; gap:10px; margin:16px 0;">
                            <div style="flex:1; background:var(--border); border-radius:20px; padding:8px;">⭐ 4 skills</div>
                            <div style="flex:1; background:var(--border); border-radius:20px; padding:8px;">⚡ 8 day streak</div>
                        </div>
                    </div>

                        </div>
                    </div>
                    <div class="card">
                        <span>📊 Python basics &nbsp; 85%</span><div class="progress-bar"><div class="progress-fill" style="width:85%"></div></div>
                        <span>📊 Data structures 46%</span><div class="progress-bar"><div class="progress-fill" style="width:46%"></div></div>
                    </div>
                `;
            }
            else if (screen === 'settings') {
                headerTitle.innerText = 'Settings';
                html = `
                    <div class="card">
                        <div class="flex-row" style="margin-bottom:12px;"><span>🌓 Dark mode</span><label><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}></label></div>

                        <div style="margin-top:12px;">🔄 Export data</div>

                    </div>
                `;
            }

            appScreen.innerHTML = html;
            setActiveTab(screen === 'onboarding' ? 'home' : screen); // onboarding no bottom highlight

            // attach events after render
            if (screen === 'onboarding') {
                document.getElementById('startBtn')?.addEventListener('click', ()=>{ renderScreen('home'); });
                document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('<h3>Privacy policy</h3><p>Your data stays on device. No tracking.</p>'));
                document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('<h3>Terms of Service</h3><p>Use CodeLoom to learn Python. Be nice.</p>'));
            }
            if (screen === 'home') {
                document.getElementById('resumeLearnBtn')?.addEventListener('click', ()=> renderScreen('learn'));
                document.getElementById('practiceBtn')?.addEventListener('click', ()=> { alert('Practice started!'); });
            }
            if (screen === 'learn') {
                document.getElementById('startLessonBtn')?.addEventListener('click', ()=> { alert('Opening lesson: Conditionals'); });
            }
            if (screen === 'settings') {
                const toggle = document.getElementById('darkToggle');
                if (toggle) {
                    toggle.addEventListener('change', (e) => {
                        darkMode = e.target.checked;
                        if (darkMode) body.classList.add('dark');
                        else body.classList.remove('dark');
                    });
                }
            }
        }

        // ---------- BOTTOM NAV ----------
        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                const screen = e.currentTarget.dataset.screen;
                renderScreen(screen);
            });
        });

        // profile button (top right)
        document.getElementById('profileBtn').addEventListener('click', ()=>{
            renderScreen('settings');
        });

        // ---------- SCREENSHOT (SHIFT + W) ----------
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                // we would need html2canvas – not allowed per rules. Instead simulate by creating a message + filename counter.
                // since we can't capture real PNG, we output the json requirement + notify.
                const suffix = darkMode ? '6' : shotCounter.toString();
                const filename = (darkMode ? '6' : shotCounter) + '.png';
                alert(`📸 screenshot simulated: ${filename} (dark: ${darkMode})`);
                if (!darkMode) {
                    shotCounter = (shotCounter % 5) + 1;
                } else {
                    // after 6, reset counters? just keep.
                }
            }
        });

        // ---------- START ----------
        renderScreen('onboarding');

        // ---------- JSON OUTPUT (at very bottom) ----------
        window.onload = function() {
            // attach to console, but we also need to output after html
        }
    })();
</script>
