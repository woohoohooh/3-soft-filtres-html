```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSpark · Python</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            min-height: 100vh;
            background: #1a2634;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --icon-stroke: #0F172A;
            --nav-bg: rgba(255,255,255,0.85);
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
        }
        [data-theme="dark"] {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #94A3B8;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --icon-stroke: #E2E8F0;
            --nav-bg: rgba(30, 41, 59, 0.9);
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }
        .phone-mock {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0,0,0,0.3), 0 0 0 10px #2e3a47;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
        }
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
        }
        /* header */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px 8px;
            background: transparent;
        }
        .header-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* main content */
        .screen-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 8px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) transparent;
        }
        .screen-content::-webkit-scrollbar {
            width: 4px;
        }
        .screen-content::-webkit-scrollbar-thumb {
            background: var(--inactive);
            border-radius: 20px;
        }
        /* bottom nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 14px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-light);
            box-shadow: var(--shadow);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            gap: 4px;
            transition: all 0.15s ease;
            padding: 6px 12px 4px;
            border-radius: 30px;
            color: var(--inactive);
            fill: none;
            stroke: var(--inactive);
        }
        .nav-item.active {
            stroke: var(--primary);
            color: var(--primary);
            background: rgba(37, 99, 235, 0.08);
            transform: scale(1.05);
        }
        .nav-item.active svg {
            stroke: var(--primary);
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
        }
        /* common cards */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }
        .flex-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 13px;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border-light);
            border-radius: 20px;
            margin: 8px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 8px;
            background: var(--primary);
            width: 0%;
            border-radius: 20px;
            transition: width 0.4s ease;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-item {
            background: var(--bg);
            border-radius: 18px;
            padding: 14px;
            text-align: center;
        }
        button {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 24px;
            border-radius: 60px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 8px 14px -8px var(--primary-dark);
        }
        button.secondary {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: var(--card);
            padding: 28px;
            border-radius: 32px;
            max-width: 280px;
            color: var(--text-primary);
        }
        .hidden {
            display: none;
        }
        /* icons inline */
        svg.icon {
            width: 24px;
            height: 24px;
            stroke-width: 2px;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        .profile-btn svg {
            stroke: var(--icon-stroke);
        }
        .small-link {
            color: var(--inactive);
            text-decoration: underline;
            font-size: 14px;
            cursor: pointer;
            margin: 0 8px;
        }
    </style>
</head>
<body>
<div class="phone-mock" id="phoneContainer">
    <div class="app-container" id="app">
        <!-- header (dynamic via js) -->
        <div class="app-header" id="appHeader">
            <span class="header-title" id="headerTitle">Welcome</span>
            <button class="profile-btn" id="profileBtn">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
            </button>
        </div>

        <!-- main screen panel -->
        <div class="screen-content" id="screenContainer">
            <!-- injected via js -->
        </div>

        <!-- bottom navigation (4 items) -->
        <div class="bottom-nav" id="bottomNav">
            <button class="nav-item" data-tab="home">
                <svg class="icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span class="nav-label">Home</span>
            </button>
            <button class="nav-item" data-tab="learn">
                <svg class="icon" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                <span class="nav-label">Learn</span>
            </button>
            <button class="nav-item" data-tab="progress">
                <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                <span class="nav-label">Progress</span>
            </button>
            <button class="nav-item" data-tab="settings">
                <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/><path d="M16.5 6.5 19 9"/><path d="M7.5 6.5 5 9"/></svg>
                <span class="nav-label">Settings</span>
            </button>
        </div>
    </div>
</div>

<!-- modals hidden -->
<div id="modalContainer" class="hidden"></div>

<script>
    (function() {
        // ---------- THEME ----------
        const setTheme = (mode) => {
            document.documentElement.setAttribute('data-theme', mode);
            localStorage.setItem('theme', mode);
        };
        let currentTheme = 'light'; // default

        // ---------- ICON REGISTRY (inline SVGs) ----------
        const icons = {
            home: '<svg class="icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
            learn: '<svg class="icon" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
            progress: '<svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
            settings: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/><path d="M16.5 6.5 19 9"/><path d="M7.5 6.5 5 9"/></svg>',
            profile: '<svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>',
            lesson: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
            chart: '<svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
            flashcards: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M9 9h6v6H9z"/></svg>',
            play: '<svg class="icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
            check: '<svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
        };

        // ---------- APP STATE ----------
        let currentScreen = 'onboarding'; // 'home','learn','progress','settings', also 'profile'
        const screenContainer = document.getElementById('screenContainer');
        const headerTitle = document.getElementById('headerTitle');
        const profileBtn = document.getElementById('profileBtn');
        const modalDiv = document.getElementById('modalContainer');

        // ---------- helper: render screen ----------
        function renderScreen(screen) {
            if (screen === 'onboarding') showOnboarding();
            else if (screen === 'home') showHome();
            else if (screen === 'learn') showLearn();
            else if (screen === 'progress') showProgress();
            else if (screen === 'settings') showSettings();
            else if (screen === 'profile') showProfile();

            // update active bottom tab
            document.querySelectorAll('.nav-item').forEach(item => {
                const tab = item.dataset.tab;
                if (screen === tab) item.classList.add('active');
                else item.classList.remove('active');
            });
        }

        // onboarding
        function showOnboarding() {
            headerTitle.innerText = 'Welcome';
            screenContainer.innerHTML = `
                <div class="card" style="text-align: center; margin-top: 40px;">
                    <div style="background: var(--primary); width:70px; height:70px; border-radius:22px; margin: 0 auto 16px; display:flex; align-items:center; justify-content:center;">
                        <span style="color:white; font-size:38px; font-weight:800;">🐍</span>
                    </div>
                    <h1 style="font-size:32px; color: var(--primary);">CodeSpark</h1>
                    <p style="font-size:20px; font-weight:600; margin:8px 0;">Python in your pocket</p>
                    <p style="color:var(--text-secondary); margin:16px 0;">Bite-sized lessons, real coding. Master Python variables to AI.</p>
                    <button id="getStartedBtn" style="width:100%;">Get Started</button>
                    <div style="margin-top: 20px;">
                        <span class="small-link" id="privacyLink">Privacy Policy</span> • <span class="small-link" id="termsLink">Terms</span>
                    </div>
                </div>
            `;
            document.getElementById('getStartedBtn')?.addEventListener('click', () => {
                currentScreen = 'home';
                renderScreen('home');
            });
            document.getElementById('privacyLink')?.addEventListener('click', ()=>showModal('Privacy Policy','We respect your data. No tracking.'));
            document.getElementById('termsLink')?.addEventListener('click', ()=>showModal('Terms of Service','Educational use only.'));
        }

        function showModal(title, text) {
            modalDiv.innerHTML = `
                <div class="modal-overlay" id="modalOverlay">
                    <div class="modal-card">
                        <h3 style="margin-bottom:12px;">${title}</h3>
                        <p>${text}</p>
                        <button style="margin-top:20px; width:100%;" id="closeModal">Close</button>
                    </div>
                </div>
            `;
            modalDiv.classList.remove('hidden');
            document.getElementById('closeModal')?.addEventListener('click', ()=> modalDiv.classList.add('hidden'));
            document.getElementById('modalOverlay')?.addEventListener('click', (e) => { if(e.target.id==='modalOverlay') modalDiv.classList.add('hidden'); });
        }

        // home dashboard
        function showHome() {
            headerTitle.innerText = 'Home';
            screenContainer.innerHTML = `
                <div class="card flex-row" style="justify-content:space-between;">
                    <span><strong>🔥 7 day streak</strong></span>
                    <span class="badge">Beginner</span>
                </div>
                <div class="card">
                    <h3>Continue where you left</h3>
                    <div class="flex-row"><span>Variables & Data types</span><span>68%</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:68%"></div></div>
                    <button class="secondary" style="margin-top:10px; width:100%;" id="resumeLesson">Resume →</button>
                </div>
                <div class="card">
                    <div style="display:flex; gap:12px; align-items:center;">${icons.flashcards} <span>Daily flashcards: 5 left</span></div>
                    <button style="margin-top:12px;" id="practiceNow">Practice now</button>
                </div>
                <div class="stat-grid">
                    <div class="stat-item"><span style="font-size:24px;">12</span><br>lessons done</div>
                    <div class="stat-item"><span style="font-size:24px;">45</span><br>exercises</div>
                </div>
            `;
            document.getElementById('resumeLesson')?.addEventListener('click', ()=>{ currentScreen='learn'; renderScreen('learn'); });
            document.getElementById('practiceNow')?.addEventListener('click', ()=>{ currentScreen='learn'; renderScreen('learn'); });
        }

        // learn / practice
        function showLearn() {
            headerTitle.innerText = 'Learn';
            screenContainer.innerHTML = `
                <div class="card">
                    <h3>Python basics</h3>
                    <div class="flex-row">${icons.lesson} <span>Lesson 1: print()</span> <span style="margin-left:auto;">✅</span></div>
                    <div class="flex-row">${icons.lesson} <span>Lesson 2: variables</span> <span style="margin-left:auto;">⭐</span></div>
                    <div class="flex-row">${icons.lesson} <span>Lesson 3: lists</span> <span style="margin-left:auto;">⏳</span></div>
                </div>
                <div class="card">
                    <div class="flex-row">${icons.play} <strong>Interactive practice</strong></div>
                    <button id="startPracticeBtn" style="margin-top:12px;">Start practice</button>
                </div>
                <div class="card" style="background:var(--accent); color:#0F172A;">
                    <span>💡 Tip: use <code style="background:#fff; padding:2px 6px;">type()</code> to check data type</span>
                </div>
            `;
            document.getElementById('startPracticeBtn')?.addEventListener('click', ()=>{
                alert('Practice started! (simulated)');
            });
        }

        // progress / statistics
        function showProgress() {
            headerTitle.innerText = 'Progress';
            screenContainer.innerHTML = `
                <div class="card">
                    <h3>Weekly activity</h3>
                    <div style="display:flex; gap:6px; height:80px; align-items:flex-end; margin:20px 0;">
                        <div style="flex:1; background:var(--primary); height:30px; border-radius:8px;"></div><div style="flex:1; background:var(--primary); height:55px;"></div><div style="flex:1; background:var(--primary); height:42px;"></div><div style="flex:1; background:var(--primary); height:70px;"></div><div style="flex:1; background:var(--primary); height:38px;"></div><div style="flex:1; background:var(--primary); height:64px;"></div><div style="flex:1; background:var(--primary); height:22px;"></div>
                    </div>
                </div>
                <div class="card stat-grid">
                    <div class="stat-item">🏆 XP today<br><strong>120</strong></div>
                    <div class="stat-item">⏱️ total time<br><strong>8h</strong></div>
                </div>
                <div class="card">
                    <span>Mastery: functions</span><div class="progress-bar"><div class="progress-fill" style="width:40%"></div></div>
                    <span>Mastery: loops</span><div class="progress-bar"><div class="progress-fill" style="width:85%"></div></div>
                </div>
            `;
        }

        // settings
        function showSettings() {
            headerTitle.innerText = 'Settings';
            screenContainer.innerHTML = `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span>🌙 Dark mode</span>
                        <label class="switch"><input type="checkbox" id="themeToggle" ${currentTheme==='dark'?'checked':''}></label>
                    </div>
                </div>
                <div class="card">
                    <p>Sound effects · off</p>
                    <p>Daily reminder · 8:00 PM</p>
                </div>
                <div class="card">App version 2.6 · Python track</div>
            `;
            const toggle = document.getElementById('themeToggle');
            if(toggle) {
                toggle.addEventListener('change', (e) => {
                    currentTheme = e.target.checked ? 'dark' : 'light';
                    setTheme(currentTheme);
                });
            }
        }

        // profile (opened by header icon)
        function showProfile() {
            headerTitle.innerText = 'Profile';
            screenContainer.innerHTML = `
                <div class="card" style="text-align:center;">
                    ${icons.profile}
                    <h2>Alex Rivera</h2>
                    <p>alex@codespark.dev</p>
                    <button style="margin-top:10px;">Edit profile</button>
                </div>
                <div class="card">Account · Security · Notifications</div>
            `;
        }

        // navigation: bottom bar
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const tab = e.currentTarget.dataset.tab;
                if(tab === 'home' || tab === 'learn' || tab === 'progress' || tab === 'settings') {
                    currentScreen = tab;
                    renderScreen(tab);
                }
            });
        });

        // profile click -> show profile (settings/profile screen)
        profileBtn.addEventListener('click', ()=>{
            currentScreen = 'profile';
            renderScreen('profile');
        });

        // start with onboarding
        renderScreen('onboarding');

        // ---------- SHIFT+W screenshot ----------
        document.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const container = document.getElementById('phoneContainer');
                // in real world would use html2canvas, but we simulate sequential naming
                let themeSuffix = currentTheme === 'dark' ? '6' : '1';
                // simulate screenshot notification
                alert(`📸 Screenshot saved as ${themeSuffix}.png (simulated)\nIf dark mode: 6.png`);
            }
        });

        // set initial light
        setTheme('light');
    })();
</script>
</body>
</html>
All done!
