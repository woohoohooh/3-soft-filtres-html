```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Brain Trainer · prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1e2c;
        }
        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --shadow: 0 20px 30px -10px rgba(0,0,0,0.15), 0 8px 15px rgba(0,0,0,0.1);
            --header-bg: #FFFFFFCC;
            --bottom-bg: #FFFFFF;
            --icon-highlight-bg: #DBEAFE;
        }
        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --shadow: 0 20px 30px -10px #00000055, 0 8px 15px #00000070;
            --header-bg: #1E293BCC;
            --bottom-bg: #1E293B;
            --icon-highlight-bg: #1E3A8A40;
        }
        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: var(--shadow), 0 0 0 10px #2d3349;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background-color 0.2s;
        }
        /* main app screens */
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--border-light);
            padding-bottom: 8px;
        }
        .screen::-webkit-scrollbar { width: 4px; }
        .screen::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 20px; }

        /* header */
        .header {
            padding: 16px 20px 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--header-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-light);
        }
        .header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }
        .profile-icon {
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
            transition: background 0.2s;
        }
        .profile-icon:hover { background: var(--icon-highlight-bg); }

        /* bottom nav */
        .bottom-nav {
            height: 76px;
            background: var(--bottom-bg);
            border-top: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            padding-bottom: 12px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex: 1;
            cursor: pointer;
            transition: transform 0.15s ease;
            color: var(--inactive);
            fill: var(--inactive);
        }
        .nav-item.active {
            transform: scale(1.08);
            color: var(--primary);
            fill: var(--primary);
        }
        .nav-item.active .nav-label {
            color: var(--primary);
            font-weight: 500;
        }
        .nav-icon { width: 26px; height: 26px; }
        .nav-label {
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        /* common cards */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px 16px;
            margin: 12px 16px;
            box-shadow: 0 6px 14px var(--border-light);
            border: 1px solid var(--border-light);
        }
        .flex-row { display: flex; align-items: center; gap: 12px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 8px 16px -6px var(--primary-dark);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            box-shadow: none;
        }
        .progress-bar {
            height: 10px;
            background: var(--border-light);
            border-radius: 20px;
            margin: 8px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 20px;
            transition: width 0.3s;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .modal {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--card);
            padding: 24px;
            border-radius: 32px;
            box-shadow: var(--shadow);
            border: 2px solid var(--primary);
            z-index: 1000;
            max-width: 280px;
            text-align: center;
            display: none;
        }
        .modal-overlay {
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: #00000080;
            backdrop-filter: blur(4px);
            z-index: 999;
            display: none;
        }
        .close-modal {
            margin-top: 16px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        /* micro chart */
        .mini-chart {
            display: flex;
            align-items: flex-end;
            height: 60px;
            gap: 6px;
            margin: 12px 0;
        }
        .bar {
            width: 20px;
            background: var(--primary);
            border-radius: 12px 12px 4px 4px;
            height: calc(100% * var(--h));
            transition: height 0.4s;
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic header + screens injected via js -->
    <div id="app"></div>
</div>

<!-- hidden modal for privacy/terms -->
<div class="modal-overlay" id="modalOverlay"></div>
<div class="modal" id="infoModal">
    <h3 id="modalTitle" style="color: var(--primary); margin-bottom: 8px;">Title</h3>
    <p id="modalBody" style="color: var(--text-secondary);">text</p>
    <button class="close-modal" id="closeModalBtn">OK</button>
</div>

<script>
    (function() {
        // ---------- THEME ----------
        let darkMode = false;
        function toggleTheme() {
            darkMode = !darkMode;
            if (darkMode) document.body.classList.add('dark');
            else document.body.classList.remove('dark');
            renderActiveScreen();  // re-render current screen
        }

        // ---------- ICONS (inline SVG, all same style) ----------
        const icons = {
            home: (active) => `<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="${active ? '#2563EB' : '#94A3B8'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 L3 10 Z"/></svg>`,
            learn: (active) => `<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="${active ? '#2563EB' : '#94A3B8'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6 L12 2 L22 6 L12 10 L2 6 Z"/><path d="M6 12 L6 16 M12 12 L12 18 M18 12 L18 14"/></svg>`,
            progress: (active) => `<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="${active ? '#2563EB' : '#94A3B8'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7 L12 12 L15 15"/></svg>`,
            settings: (active) => `<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="${active ? '#2563EB' : '#94A3B8'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.5"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/></svg>`,
            profile: `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
            lesson: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M4 4 L20 4 L20 20 L4 20 Z M8 8 L16 8 M8 12 L16 12 M8 16 L13 16"/></svg>`,
            chart: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M21 16v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2M7 10l3-3 3 3 4-4"/><path d="M17 10V4h-6"/></svg>`,
            flashcards: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>`,
            play: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>`,
            check: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>`
        };

        // ---------- SCREEN STATES ----------
        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
        let progressPercent = 68; // example

        // ---------- RENDER FUNCTION ----------
        const appDiv = document.getElementById('app');
        function renderScreen() {
            let content = '';
            const activeColor = darkMode ? '#3B82F6' : '#2563EB';
            const inactiveColor = darkMode ? '#64748B' : '#94A3B8';

            // header (title from screen)
            const headerTitle = {
                onboarding: 'Math Brain',
                home: 'Dashboard',
                learn: 'Practice',
                progress: 'Progress',
                settings: 'Settings'
            }[currentScreen] || 'Math Brain';

            // open profile = settings screen
            const profileClick = `onclick="changeScreen('settings')"`;

            content += `
                <div class="header">
                    <h2>${headerTitle}</h2>
                    <div class="profile-icon" ${profileClick}>${icons.profile}</div>
                </div>
                <div class="screen" id="mainScreen">
            `;

            // ------ ONBOARDING ------
            if (currentScreen === 'onboarding') {
                content += `
                    <div style="padding: 32px 20px; text-align: center;">
                        <div style="background: var(--primary); width: 70px; height: 70px; border-radius: 20px; margin: 10px auto; display: flex; align-items: center; justify-content: center;">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 2 L2 7 L12 12 L22 7 L12 2 Z M2 17 L12 22 L22 17 M2 12 L12 17 L22 12"/></svg>
                        </div>
                        <h1 style="color: var(--primary); font-size: 2rem; margin: 8px 0 4px;">Math Brain</h1>
                        <p style="color: var(--accent); font-weight: 600;">train your mental math</p>
                        <p style="color: var(--text-secondary); margin: 20px 0;">Quick, daily brain workouts. Solve puzzles, track streaks, boost your number sense.</p>
                        <button class="btn" style="width:100%;" onclick="changeScreen('home')">Get Started</button>
                        <div style="margin-top: 32px; display: flex; gap: 20px; justify-content: center;">
                            <span style="color: var(--primary); text-decoration: underline; cursor:pointer;" onclick="openModal('Privacy Policy','We respect your data. No tracking.')">Privacy</span>
                            <span style="color: var(--primary); text-decoration: underline; cursor:pointer;" onclick="openModal('Terms of Service','Educational use only. Stay curious.')">Terms</span>
                        </div>
                    </div>
                `;
            }

            // ------ HOME (dashboard) ------
            if (currentScreen === 'home') {
                content += `
                    <div class="card">
                        <div class="flex-row"><span class="badge">🔥 STREAK 12 DAYS</span>${icons.flashcards}</div>
                        <h3 style="color: var(--text-primary); margin-top: 8px;">Today's challenge</h3>
                        <div style="display: flex; gap:8px; margin:12px 0"><span>➕➖✖️➗</span><span>mixed</span></div>
                        <button class="btn btn-outline" style="width:100%" onclick="changeScreen('learn')">Start practice</button>
                    </div>
                    <div class="grid-2" style="margin:0 16px">
                        <div class="card" style="margin:0; padding:16px">
                            <div>${icons.lesson} Lessons</div>
                            <h3 style="color: var(--text-primary);">6/12</h3>
                            <div class="progress-bar"><div class="progress-fill" style="width:50%"></div></div>
                        </div>
                        <div class="card" style="margin:0; padding:16px">
                            <div>${icons.chart} accuracy</div>
                            <h3 style="color: var(--text-primary);">84%</h3>
                            <div class="progress-bar"><div class="progress-fill" style="width:84%"></div></div>
                        </div>
                    </div>
                    <div class="card">
                        <span style="font-weight:600;">Quick stats</span>
                        <div class="mini-chart">
                            <div class="bar" style="--h:0.6"></div><div class="bar" style="--h:0.9"></div><div class="bar" style="--h:0.7"></div><div class="bar" style="--h:1.0"></div><div class="bar" style="--h:0.5"></div>
                        </div>
                    </div>
                    <div class="card" style="text-align:center;">
                        ${icons.check}  "You're faster than 82% today"
                    </div>
                `;
            }

            // ------ LEARN (practice screen) ------
            if (currentScreen === 'learn') {
                content += `
                    <div class="card">
                        <h3 style="color: var(--text-primary);">Mental arithmetic</h3>
                        <div class="flex-row">${icons.play} 3x daily · 5 min</div>
                        <button class="btn" style="width:100%; margin-top:12px;" onclick="updateProgress()">Start exercise</button>
                    </div>
                    <div class="card">
                        <div class="flex-row">${icons.lesson}   Addition · level 4</div>
                        <div class="progress-bar"><div class="progress-fill" style="width:80%"></div></div>
                        <div class="flex-row">${icons.flashcards}   Multiplication · level 2</div>
                        <div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div>
                    </div>
                    <div class="card" style="background: var(--accent); color: #0F172A;">
                        ⚡ quick challenge: 34 × 12 = ?
                    </div>
                `;
            }

            // ------ PROGRESS (statistics) ------
            if (currentScreen === 'progress') {
                content += `
                    <div class="card">
                        <div class="flex-row">${icons.chart}  Weekly activity</div>
                        <div class="mini-chart">
                            <div class="bar" style="--h:0.4"></div><div class="bar" style="--h:0.7"></div><div class="bar" style="--h:0.5"></div><div class="bar" style="--h:0.9"></div><div class="bar" style="--h:0.8"></div><div class="bar" style="--h:1.0"></div><div class="bar" style="--h:0.6"></div>
                        </div>
                    </div>
                    <div class="card">
                        <p><span style="font-weight:700;">Total problems solved</span> 1,284</p>
                        <p><span style="font-weight:700;">Current streak</span> 12 days 🔥</p>
                        <div class="badge">🏅 silver mental calculator</div>
                    </div>
                    <div class="card">
                        ${icons.check}  Weekly goal: 45/50 problems
                        <div class="progress-bar"><div class="progress-fill" style="width:90%"></div></div>
                    </div>
                `;
            }

            // ------ SETTINGS (profile) ------
            if (currentScreen === 'settings') {
                content += `
                    <div class="card" style="display: flex; flex-direction: column; gap: 16px;">
                        <div class="flex-row">${icons.profile}  <span> Alex Chen</span></div>
                        <div class="flex-row">${icons.settings(false)}  <span>App version 2.6.1</span></div>
                        <div style="display: flex; align-items: center; justify-content: space-between;">
                            <span>Dark theme</span>
                            <label class="switch"><input type="checkbox" id="themeToggle" ${darkMode ? 'checked' : ''} onchange="toggleTheme()"> <span class="slider"></span></label>
                        </div>
                        <button class="btn btn-outline" style="margin-top:8px;" onclick="openModal('Profile','Achievements: 8 badges')">View profile</button>
                    </div>
                `;
            }

            content += `</div>`; // close screen

            // bottom navigation (4 items)
            const navItems = [
                { id: 'home', label: 'Home', icon: 'home' },
                { id: 'learn', label: 'Learn', icon: 'learn' },
                { id: 'progress', label: 'Progress', icon: 'progress' },
                { id: 'settings', label: 'Settings', icon: 'settings' }
            ];

            content += `<div class="bottom-nav">`;
            navItems.forEach(item => {
                const isActive = currentScreen === item.id;
                const iconSvg = icons[item.icon](isActive);
                const activeClass = isActive ? 'active' : '';
                content += `<div class="nav-item ${activeClass}" onclick="changeScreen('${item.id}')">${iconSvg}<span class="nav-label">${item.label}</span></div>`;
            });
            content += `</div>`;

            appDiv.innerHTML = content;
        }

        // navigation function
        window.changeScreen = (screen) => {
            currentScreen = screen;
            renderActiveScreen();
        };
        function renderActiveScreen() { renderScreen(); }

        // update progress example (learn start)
        window.updateProgress = () => {
            progressPercent = Math.min(100, progressPercent + 7);
            alert('➕ exercise started! (simulated)');
        };

        // modal
        window.openModal = (title, body) => {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerText = body;
            document.getElementById('infoModal').style.display = 'block';
            document.getElementById('modalOverlay').style.display = 'block';
        };
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal-overlay') || e.target.classList.contains('close-modal')) {
                document.getElementById('infoModal').style.display = 'none';
                document.getElementById('modalOverlay').style.display = 'none';
            }
        });

        // ---------- SCREENSHOT (SHIFT+W) ----------
        let screenshotCounter = 1;
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                // in real prototype we'd use html2canvas, but to stay self-contained we simulate download.
                // we can't actually capture without external lib, but we simulate naming convention.
                const themeSuffix = darkMode ? 6 : screenshotCounter;
                const filename = darkMode ? '6.png' : (screenshotCounter + '.png');
                alert(`📸 Screenshot saved as ${filename} (simulated – actual capture needs html2canvas)`);
                if (!darkMode) screenshotCounter = (screenshotCounter % 5) + 1; // cycle 1-5
            }
        });

        // initial render
        renderActiveScreen();
        // attach theme toggle function globally
        window.toggleTheme = toggleTheme;
        // ensure modal close button works
    })();
</script>
<!-- little extra style for toggle switch -->
<style>
    .switch { position: relative; display: inline-block; width: 48px; height: 24px; }
    .switch input { opacity:0; width:0; height:0; }
    .slider { position: absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background-color: #ccc; border-radius: 24px; transition: 0.2s; }
    .slider:before { position:absolute; content:""; height:18px; width:18px; left:3px; bottom:3px; background-color: white; border-radius: 50%; transition: 0.2s; }
    input:checked + .slider { background-color: #2563EB; }
    input:checked + .slider:before { transform: translateX(24px); }
    body.dark input:checked + .slider { background-color: #3B82F6; }
</style>
</body>
</html>
All done!
