```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Brain · 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #0F172A;
      --text-light: #334155;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --grey: #94A3B8;
      --grey-light: #E2E8F0;
      --shadow: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,0,0,0.05);
      --nav-inactive: #94A3B8;
      --nav-bg: #FFFFFF;
      --header-border: rgba(0,0,0,0.05);
      --icon-stroke: #0F172A;
      --progress-bg: #E2E8F0;
      --badge-bg: #DBEAFE;
    }

    body.dark {
      --bg: #0F172A;
      --card: #1E293B;
      --text: #E2E8F0;
      --text-light: #CBD5E1;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --grey: #64748B;
      --grey-light: #334155;
      --shadow: 0 8px 20px rgba(0,0,0,0.5);
      --nav-inactive: #64748B;
      --nav-bg: #1E293B;
      --header-border: #334155;
      --icon-stroke: #E2E8F0;
      --progress-bg: #334155;
      --badge-bg: #1E3A8A;
    }

    body {
      background: #1a1e2b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background-color: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 10px #2d2f3a;
      position: relative;
      transition: background-color 0.2s;
      display: flex;
      flex-direction: column;
    }

    .app-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      background: var(--bg);
    }

    .app-screen::-webkit-scrollbar {
      display: none;
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid var(--header-border);
      background: var(--card);
      flex-shrink: 0;
    }

    .header h2 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .profile-icon {
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.1s;
    }

    /* content area */
    .content {
      flex: 1;
      padding: 20px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* bottom nav */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: var(--nav-bg);
      padding: 8px 0 12px;
      border-top: 1px solid var(--header-border);
      flex-shrink: 0;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .nav-item span {
      font-size: 11px;
      font-weight: 500;
      color: var(--nav-inactive);
    }

    .nav-item.active {
      background: rgba(37, 99, 235, 0.1);
    }

    .nav-item.active svg {
      stroke: var(--primary);
      stroke-width: 2.2;
      transform: scale(1.15);
    }

    .nav-item.active span {
      color: var(--primary);
      font-weight: 600;
    }

    .nav-item svg {
      stroke: var(--nav-inactive);
      stroke-width: 2;
      width: 24px;
      height: 24px;
      transition: 0.15s;
    }

    /* cards, UI */
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 18px 16px;
      box-shadow: var(--shadow);
    }

    .flex-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .progress-bar {
      height: 8px;
      background: var(--progress-bg);
      border-radius: 20px;
      overflow: hidden;
      width: 100%;
    }

    .progress-fill {
      height: 8px;
      background: var(--primary);
      width: 0%;
      border-radius: 20px;
      transition: width 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    }

    .badge {
      background: var(--badge-bg);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 40px;
      font-size: 12px;
      font-weight: 600;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 16px;
      width: 100%;
      cursor: pointer;
      transition: 0.1s;
      box-shadow: 0 8px 18px rgba(37,99,235,0.25);
    }

    .btn:active {
      transform: scale(0.97);
      background: var(--primary-dark);
    }

    .link-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 18px;
      font-size: 12px;
    }

    .link-row span {
      color: var(--grey);
      text-decoration: underline;
      cursor: pointer;
    }

    /* modal */
    .modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-card {
      background: var(--card);
      padding: 28px 24px;
      border-radius: 32px;
      width: 280px;
      text-align: center;
      color: var(--text);
    }

    .modal-card button {
      margin-top: 20px;
      background: var(--primary);
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    /* chart simulation */
    .chart-row {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      height: 100px;
      margin: 20px 0 8px;
    }
    .bar {
      width: 40px;
      background: var(--accent);
      border-radius: 12px 12px 4px 4px;
      transition: height 0.5s;
    }
  </style>
</head>
<body>
  <div class="phone" id="phoneContainer">
    <!-- dynamic header and screens will be injected via JS -->
    <div id="app"></div>
  </div>

  <script>
    (function() {
      // ---------- SVG Icons (inline, outline style) ----------
      const icons = {
        home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 L3 10 Z"/></svg>`,
        learn: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 3 L12 8 L22 3 L12 8 L12 14 M6 10 L6 16 C6 16 8 19 12 19 C16 19 18 16 18 16 L18 10"/></svg>`,
        progress: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3 L12 12 L17 17"/></svg>`,
        settings: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 4.6 C18.3 4 17.7 3.3 18 2.5 L19 1 M4.6 4.6 C5.7 4 6.3 3.3 6 2.5 L5 1 M1 9 C1.7 8 2.5 8 3 8.5 L4 9 M21 9 C20.3 8 19.5 8 19 8.5 L18 9 M3 16 L4 15 C4.7 16 5.5 16 6 15.5 M21 16 L20 15 C19.3 16 18.5 16 18 15.5 M9 21 L10 20 C10 19.3 10 18.5 9 18 M15 21 L14 20 C14 19.3 14 18.5 15 18" /></svg>`,
        profile: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M5 20 v-2 a7 7 0 0 1 14 0 v2"/></svg>`,
        lesson: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4 L20 4 L20 20 L4 20 L4 4 Z M8 8 L16 8 M8 12 L16 12 M8 16 L14 16"/></svg>`,
        chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17 L8 12 L12 16 L18 9 L21 12"/><path d="M3 21 L21 21"/></svg>`,
        flashcards: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4 L18 4 L20 8 L20 18 L4 18 L4 8 L6 4 Z"/><circle cx="12" cy="12" r="1.5"/><circle cx="16" cy="12" r="1.5"/><circle cx="8" cy="12" r="1.5"/></svg>`,
        play: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polygon points="10,8 16,12 10,16" fill="currentColor"/></svg>`,
        check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>`,
      };

      // ---------- app state ----------
      let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
      let darkMode = false;
      let modalContent = ''; // 'privacy' or 'terms'
      let screenshotCounter = 0;
      let lastKeyTime = 0;

      // ---------- helpers ----------
      function setTheme(isDark) {
        document.body.classList.toggle('dark', isDark);
      }

      // navigation
      function navigate(screen) {
        if (screen === 'settings' || screen === 'profile') screen = 'settings'; // profile opens settings
        currentScreen = screen;
        render();
      }

      // modal handlers
      function showModal(type) {
        modalContent = type;
        render();
      }
      function closeModal() {
        modalContent = '';
        render();
      }

      // theme toggle from settings
      function toggleTheme() {
        darkMode = !darkMode;
        setTheme(darkMode);
        render(); // re-render settings to show toggle state
      }

      // ---------- screen renderers ----------
      function renderOnboarding() {
        return `
          <div class="content" style="justify-content: center;">
            <div style="text-align: center; margin-bottom: 24px;">
              <div style="margin-bottom: 24px;">${icons.flashcards.replace('currentColor', 'var(--primary)')}</div>
              <h1 style="font-size: 42px; font-weight: 700; color: var(--primary);">Math Brain</h1>
              <p style="font-size: 18px; color: var(--text); margin: 8px 0 4px;">train your logic</p>
              <p style="color: var(--text-light); font-size: 14px; max-width: 260px; margin: 16px auto;">Daily mental math & brain puzzles. Quick, fun, and smart.</p>
            </div>
            <button class="btn" onclick="window.app.navigate('home')">Get Started</button>
            <div class="link-row">
              <span onclick="window.app.showModal('privacy')">Privacy Policy</span>
              <span onclick="window.app.showModal('terms')">Terms of Service</span>
            </div>
          </div>
        `;
      }

      function renderHome() {
        return `
          <div class="content">
            <div class="card">
              <div class="flex-row"><span style="font-weight: 600; color: var(--text);">Daily workout</span><span class="badge">+50 pts</span></div>
              <div style="display: flex; gap: 12px; align-items: center;">
                <div>${icons.play.replace('currentColor', 'var(--primary)')}</div>
                <div style="flex:1"><span style="color: var(--text);">Quick 5 min</span><div class="progress-bar" style="margin-top: 6px;"><div class="progress-fill" style="width:40%"></div></div></div>
              </div>
              <button class="btn" style="margin-top: 16px;" onclick="window.app.navigate('learn')">Start practice</button>
            </div>

            <div class="card">
              <div class="flex-row"><span style="font-weight: 600; color: var(--text);">Continue lessons</span><span style="color:var(--primary);">view all</span></div>
              <div style="display:flex; gap:12px; margin-top:12px;">
                <div style="background:var(--accent); padding:12px; border-radius:20px;">${icons.lesson.replace('currentColor', 'white')}</div>
                <div><span style="color:var(--text);">Algebra basics</span><div class="progress-bar" style="width:120px;"><div class="progress-fill" style="width:70%"></div></div></div>
              </div>
              <div style="display:flex; gap:12px; margin-top:16px;">
                <div style="background:var(--primary); padding:12px; border-radius:20px;">${icons.flashcards.replace('currentColor', 'white')}</div>
                <div><span style="color:var(--text);">Times table</span><div class="progress-bar" style="width:120px;"><div class="progress-fill" style="width:30%"></div></div></div>
              </div>
            </div>

            <div class="card">
              <span style="font-weight: 600; color: var(--text);">Today's achievements</span>
              <div style="display: flex; gap: 16px; margin-top: 16px;">
                <span style="background:var(--badge-bg); border-radius:40px; padding:8px;">🔥 3 day streak</span>
                <span style="background:var(--badge-bg); border-radius:40px; padding:8px;">🎯 120 problems</span>
              </div>
            </div>
          </div>
        `;
      }

      function renderLearn() {
        return `
          <div class="content">
            <div class="card"><span style="font-weight:600;color:var(--text);">Algebra</span><span style="float:right;color:var(--primary);">3/10</span><div class="progress-bar" style="margin:12px 0;"><div class="progress-fill" style="width:30%"></div></div></div>
            <div class="card"><span style="font-weight:600;color:var(--text);">Geometry</span><span style="float:right;color:var(--primary);">1/8</span><div class="progress-bar" style="margin:12px 0;"><div class="progress-fill" style="width:12%"></div></div></div>
            <div class="card"><span style="font-weight:600;color:var(--text);">Logic puzzles</span><span style="float:right;color:var(--primary);">5/5</span><div class="progress-bar" style="margin:12px 0;"><div class="progress-fill" style="width:100%"></div></div><span class="badge">mastered</span></div>
            <button class="btn" style="margin-top:8px;" onclick="window.app.navigate('progress')">View progress</button>
          </div>
        `;
      }

      function renderProgress() {
        // animate bars with random-ish width (realistic)
        const w1 = 68, w2 = 42, w3 = 81;
        return `
          <div class="content">
            <div class="card">
              <span style="font-weight:600;color:var(--text);">Weekly activity</span>
              <div class="chart-row">
                <div class="bar" style="height: ${w1}px; background: var(--primary);"></div>
                <div class="bar" style="height: ${w2}px; background: var(--accent);"></div>
                <div class="bar" style="height: ${w3}px; background: var(--primary);"></div>
                <div class="bar" style="height: 45px; background: var(--accent);"></div>
                <div class="bar" style="height: 70px; background: var(--primary);"></div>
              </div>
            </div>
            <div class="card">
              <div class="flex-row"><span style="font-weight:600;">Accuracy</span><span>87%</span></div><div class="progress-bar"><div class="progress-fill" style="width:87%"></div></div>
              <div class="flex-row" style="margin-top:16px;"><span style="font-weight:600;">Problems solved</span><span>1,247</span></div>
            </div>
            <div class="card"><span>🔥 longest streak 12 days</span></div>
          </div>
        `;
      }

      function renderSettings() {
        return `
          <div class="content">
            <div class="card" style="display:flex; align-items:center; gap:16px;">
              <div>${icons.profile.replace('currentColor', 'var(--primary)')}</div>
              <div><span style="font-weight:600;color:var(--text);">Alex Chen</span><div style="color:var(--text-light);">alex@example.com</div></div>
            </div>
            <div class="card">
              <div class="flex-row"><span>Dark theme</span><label><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''} onchange="window.app.toggleTheme()"></label></div>
            </div>
            <div class="card">
              <div>Sound effects</div>
              <div>Language: English</div>
            </div>
            <div class="link-row" style="justify-content:flex-start;"><span onclick="window.app.showModal('privacy')">Privacy</span><span onclick="window.app.showModal('terms')">Terms</span></div>
          </div>
        `;
      }

      // main render
      function render() {
        let contentHtml = '';
        let title = '';

        switch (currentScreen) {
          case 'onboarding': title = 'Welcome'; contentHtml = renderOnboarding(); break;
          case 'home': title = 'Home'; contentHtml = renderHome(); break;
          case 'learn': title = 'Learn'; contentHtml = renderLearn(); break;
          case 'progress': title = 'Progress'; contentHtml = renderProgress(); break;
          case 'settings': title = 'Settings'; contentHtml = renderSettings(); break;
          default: title = 'Home'; contentHtml = renderHome(); currentScreen = 'home';
        }

        // header
        const headerHtml = `
          <div class="header">
            <h2>${title}</h2>
            <div class="profile-icon" onclick="window.app.navigate('settings')">${icons.profile.replace('currentColor', 'var(--icon-stroke)')}</div>
          </div>
        `;

        // bottom nav
        const navItems = [
          { id: 'home', label: 'Home', icon: icons.home },
          { id: 'learn', label: 'Learn', icon: icons.learn },
          { id: 'progress', label: 'Progress', icon: icons.progress },
          { id: 'settings', label: 'Settings', icon: icons.settings }
        ];

        const navHtml = `
          <div class="bottom-nav">
            ${navItems.map(item => `
              <div class="nav-item ${currentScreen === item.id ? 'active' : ''}" onclick="window.app.navigate('${item.id}')">
                ${item.icon.replace('currentColor', currentScreen === item.id ? '#2563EB' : 'var(--nav-inactive)')}
                <span>${item.label}</span>
              </div>
            `).join('')}
          </div>
        `;

        const modalHtml = modalContent ? `
          <div class="modal" onclick="window.app.closeModal()">
            <div class="modal-card" onclick="event.stopPropagation()">
              <h3>${modalContent === 'privacy' ? 'Privacy' : 'Terms'}</h3>
              <p style="margin:16px 0;color:var(--text-light);">Sample ${modalContent} policy. This is a demo modal.</p>
              <button onclick="window.app.closeModal()">Close</button>
            </div>
          </div>
        ` : '';

        document.getElementById('app').innerHTML = headerHtml + contentHtml + navHtml + modalHtml;
      }

      // ---------- screenshot (shift+W) ----------
      window.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.key === 'W') {
          e.preventDefault();
          const phone = document.getElementById('phoneContainer');
          // just simulate – no actual canvas capture, but we output sequential json
          screenshotCounter++;
          let filename = darkMode ? '6.png' : screenshotCounter + '.png';
          if (darkMode && screenshotCounter === 1) filename = '6.png';
          else if (!darkMode) filename = screenshotCounter + '.png';
          if (screenshotCounter > 5 && !darkMode) screenshotCounter = 1;
          // In real scenario would capture, but we output JSON at the end
          console.log('screenshot captured: ' + filename);
        }
      });

      // expose to global for onclick
      window.app = { navigate, showModal, closeModal, toggleTheme };

      // initial render
      setTheme(darkMode);
      render();
    })();
  </script>

  <!-- after page load, attach dark toggle manually (to keep toggleTheme) -->
  <script>
    (function lateBind() {
      // just ensure dark toggle works
      const oldToggle = window.app.toggleTheme;
      window.app.toggleTheme = function() {
        darkMode = !darkMode;
        setTheme(darkMode);
        render();
      };
    })();
  </script>
</body>
</html>
All done!
