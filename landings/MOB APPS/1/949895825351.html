<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic Puzzles · brain training</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1e293b;
            padding: 12px;
        }
        .phone-mock {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 0 8px #334155;
            position: relative;
            transition: background 0.2s;
        }
        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-y: auto;
            scrollbar-width: none;
            position: relative;
        }
        .app-container::-webkit-scrollbar { display: none; }

        /* theme variables (light default) */
        :root {
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --icon-stroke: #0F172A;
            --highlight-bg: rgba(37, 99, 235, 0.08);
        }
        body.dark {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --icon-stroke: #F1F5F9;
            --highlight-bg: rgba(59, 130, 246, 0.15);
        }

        /* header / bottom nav */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 16px 8px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-btn svg {
            width: 28px;
            height: 28px;
            stroke: var(--icon-stroke);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* main content area */
        .screen-content {
            flex: 1;
            padding: 8px 16px 80px; /* room for bottom nav */
        }

        /* bottom navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 360px;
            background: var(--bg-card);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0 12px;
            border-radius: 0 0 44px 44px;
            transition: background 0.2s;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            cursor: pointer;
            gap: 4px;
            padding: 6px 10px;
            border-radius: 30px;
            transition: all 0.15s ease;
            color: var(--inactive);
            fill: none;
            stroke: var(--inactive);
        }
        .nav-item.active {
            color: var(--primary);
            stroke: var(--primary);
            background: var(--highlight-bg);
            transform: scale(1.05);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.1s;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
        }

        /* cards & UI */
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            border: 1px solid var(--border-light);
        }
        .row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 10px 0;
        }
        .progress-bar {
            height: 8px;
            background: var(--border-light);
            border-radius: 20px;
            flex: 1;
        }
        .progress-fill {
            height: 8px;
            background: var(--primary);
            border-radius: 20px;
            width: 0%;
            transition: width 0.3s;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 12px;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-primary:active { opacity: 0.8; transform: scale(0.98); }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 16px 0 8px;
        }
        .link-row button {
            background: none;
            border: none;
            color: var(--primary);
            text-decoration: underline;
            font-size: 13px;
            cursor: pointer;
        }

        /* modal */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: var(--bg-card);
            padding: 24px;
            border-radius: 32px;
            width: 280px;
            text-align: center;
            border: 1px solid var(--border-light);
        }
        .modal-card button {
            margin-top: 20px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        /* charts / stats */
        .chart-row {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 120px;
            margin: 20px 0;
        }
        .bar {
            width: 30px;
            background: var(--primary);
            border-radius: 12px 12px 4px 4px;
            transition: height 0.4s;
        }
        .badge-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 10px;
        }
        .achievement {
            background: var(--bg-primary);
            border-radius: 30px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
<div class="phone-mock" id="phoneContainer">
    <div class="app-container" id="appContainer">
        <!-- dynamic header -->
        <div class="header" id="appHeader">
            <h1 id="headerTitle">Welcome</h1>
            <button class="profile-btn" id="profileBtn">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/></svg>
            </button>
        </div>

        <!-- screen container (dynamic) -->
        <div id="screenContainer" class="screen-content">
            <!-- injected by JS -->
        </div>

        <!-- bottom navigation (fixed) -->
        <div class="bottom-nav">
            <button class="nav-item active" data-nav="home"><svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Home</span></button>
            <button class="nav-item" data-nav="learn"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span>Learn</span></button>
            <button class="nav-item" data-nav="progress"><svg viewBox="0 0 24 24"><path d="M21 12v2a9 9 0 0 1-9 9 9 9 0 0 1-9-9 9 9 0 0 1 9-9h2"/><path d="M21 3v6h-6"/><path d="M15 9 21 3"/></svg><span>Progress</span></button>
            <button class="nav-item" data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Settings</span></button>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- ICON SYSTEM (inline svg) ----------
        // we define minimal set as strings, but icons are already in nav & header. Additional icons for cards.
        // For simplicity we reuse from nav, but we also need check, lesson, etc – we create helpers.
        const iconCheck = '<svg viewBox="0 0 24 24" width="20" height="20"><polyline points="20 6 9 17 4 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
        const iconFlash = '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M13 2L3 14h8l-2 8 10-12h-8l2-8z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
        const iconPlay = '<svg viewBox="0 0 24 24" width="20" height="20"><polygon points="5 3 19 12 5 21 5 3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
        const iconChart = '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M21 12v2a9 9 0 0 1-9 9 9 9 0 0 1-9-9 9 9 0 0 1 9-9h2"/><path d="M15 9 21 3"/></svg>'; // progress style
        const iconLesson = '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';

        // app state
        let currentScreen = 'onboarding';
        let darkMode = false;
        let screenshotCounter = 1;

        // dom elements
        const headerTitle = document.getElementById('headerTitle');
        const screenDiv = document.getElementById('screenContainer');
        const navItems = document.querySelectorAll('.nav-item');
        const profileBtn = document.getElementById('profileBtn');
        const bodyEl = document.body;
        const phoneContainer = document.getElementById('phoneContainer');

        // helper to set theme
        function setTheme(isDark) {
            if (isDark) bodyEl.classList.add('dark');
            else bodyEl.classList.remove('dark');
        }

        // render screen
        function showScreen(screenId) {
            currentScreen = screenId;
            let title = 'Brain Lab';
            if (screenId === 'onboarding') title = 'Welcome';
            else if (screenId === 'home') title = 'Dashboard';
            else if (screenId === 'learn') title = 'Logic Puzzles';
            else if (screenId === 'progress') title = 'Statistics';
            else if (screenId === 'settings') title = 'Settings';
            else if (screenId === 'profile') title = 'Profile';
            headerTitle.innerText = title;

            let html = '';
            if (screenId === 'onboarding') {
                html = `
                    <div class="card" style="text-align: center; padding: 32px 20px;">
                        <div style="background: #EFF6FF; width: 80px; height: 80px; border-radius: 30px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center;">
                            <svg width="48" height="48" viewBox="0 0 24 24" stroke="#2563EB" stroke-width="1.5"><path d="M12 2a10 10 0 0 1 10 10 10 10 0 0 1-10 10 10 10 0 0 1-10-10 10 10 0 0 1 10-10z"/><path d="M12 6v6l4 2"/></svg>
                        </div>
                        <h2 style="font-size: 28px; margin-bottom: 4px;">🧠 Logic Lab</h2>
                        <p style="color: var(--primary); font-weight: 500; margin-bottom: 12px;">train your brain daily</p>
                        <p style="color: var(--text-secondary); margin-bottom: 28px;">Solve puzzles, boost IQ. 5-minute workouts for sharp thinking.</p>
                        <button class="btn-primary" id="getStartedBtn">Get Started</button>
                        <div class="link-row">
                            <button id="privacyModalBtn">Privacy Policy</button>
                            <button id="termsModalBtn">Terms of Service</button>
                        </div>
                    </div>
                `;
            } else if (screenId === 'home') {
                html = `
                    <div class="card">
                        <div style="display: flex; justify-content: space-between;"><span class="badge">🔥 streak 12</span><span>⚡ 240 pts</span></div>
                        <h3 style="margin: 12px 0 6px;">Continue puzzle</h3>
                        <div class="row"><span>Knight & Knaves</span><span>60%</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div>
                        <button class="btn-primary" style="margin-top:16px;" id="continueLearnBtn">Practice now</button>
                    </div>
                    <div class="card">
                        <div style="display: flex; gap: 8px; align-items: center;">${iconFlash}<span style="font-weight:600;">Daily recommendation</span></div>
                        <div class="row"> <span>Nonograms</span> ${iconPlay} </div>
                        <div class="row"> <span>Einstein's riddle</span> ${iconPlay} </div>
                    </div>
                    <div class="card">
                        <span style="font-weight:600;">Today's achievements</span>
                        <div class="badge-grid">
                            <span class="achievement">${iconCheck} 3 in row</span>
                            <span class="achievement">${iconFlash} speed</span>
                        </div>
                    </div>
                `;
            } else if (screenId === 'learn') {
                html = `
                    <div class="card">
                        <h3 style="margin-bottom: 8px;">Logic modules</h3>
                        <div class="row">${iconLesson} Deduction 101 <span style="margin-left: auto;">▶</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div>
                        <div class="row" style="margin-top:12px;">${iconLesson} Pattern recognition <span style="margin-left: auto;">▶</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
                        <div class="row" style="margin-top:12px;">${iconFlash} Lateral thinking <span style="margin-left: auto;">▶</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:15%"></div></div>
                    </div>
                    <div class="card">
                        <div style="display:flex; align-items:center; gap:8px;">${iconPlay} <span>Start a quick puzzle</span></div>
                        <button class="btn-primary" style="margin-top: 12px;">New challenge</button>
                    </div>
                `;
            } else if (screenId === 'progress') {
                html = `
                    <div class="card">
                        <h3>Weekly activity</h3>
                        <div class="chart-row" id="chartBars">
                            <div class="bar" style="height:50px;"></div><div class="bar" style="height:80px;"></div><div class="bar" style="height:65px;"></div><div class="bar" style="height:90px;"></div><div class="bar" style="height:40px;"></div><div class="bar" style="height:110px;"></div><div class="bar" style="height:70px;"></div>
                        </div>
                        <div style="display: flex; justify-content: space-between;"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
                    </div>
                    <div class="card">
                        <div class="row">Total puzzles solved <span>143</span></div><div class="row">Accuracy <span>84%</span></div><div class="row">Current streak <span>12 days</span></div>
                        <div class="badge-grid"><span class="achievement">${iconChart} top 15%</span></div>
                    </div>
                `;
            } else if (screenId === 'settings') {
                html = `
                    <div class="card">
                        <div class="row" style="justify-content: space-between;">
                            <span>Dark mode</span>
                            <label><input type="checkbox" id="darkModeToggle" ${darkMode ? 'checked' : ''} style="transform:scale(1.3);"></label>
                        </div>
                    </div>
                    <div class="card">
                        <div class="row">Sound effects</div>
                        <div class="row">Language</div>
                    </div>
                    <div class="card"><div class="row">App version 2.6.0</div></div>
                `;
            } else if (screenId === 'profile') {
                html = `
                    <div class="card" style="text-align:center;">
                        <svg width="64" height="64" viewBox="0 0 24 24" stroke="var(--primary)" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/></svg>
                        <h3>Alex Chen</h3>
                        <p>member since 2025</p>
                    </div>
                    <div class="card">
                        <div class="row">Email</div><div class="row">Notifications</div><div class="row">Privacy</div>
                    </div>
                `;
            }
            screenDiv.innerHTML = html;

            // attach listeners
            if (screenId === 'onboarding') {
                document.getElementById('getStartedBtn')?.addEventListener('click', () => { showScreen('home'); setActiveNav('home'); });
                document.getElementById('privacyModalBtn')?.addEventListener('click', () => showModal('Privacy Policy', 'We respect your data. No selling.'));
                document.getElementById('termsModalBtn')?.addEventListener('click', () => showModal('Terms of Service', 'Use = agree. Play fair.'));
            }
            if (screenId === 'home') {
                document.getElementById('continueLearnBtn')?.addEventListener('click', ()=> { showScreen('learn'); setActiveNav('learn'); });
            }
            if (screenId === 'settings') {
                const toggle = document.getElementById('darkModeToggle');
                if (toggle) toggle.addEventListener('change', (e) => {
                    darkMode = e.target.checked;
                    setTheme(darkMode);
                });
            }

            // chart animation on progress
            if (screenId === 'progress') {
                setTimeout(() => {
                    document.querySelectorAll('.bar').forEach((b, i) => {
                        if (i===2) b.style.height='110px';
                        else if (i===4) b.style.height='80px';
                    });
                }, 50);
            }
        }

        function showModal(title, msg) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `<div class="modal-card"><h3>${title}</h3><p style="margin:16px 0;">${msg}</p><button id="closeModalBtn">OK</button></div>`;
            document.body.appendChild(modal);
            document.getElementById('closeModalBtn').addEventListener('click', ()=> modal.remove());
        }

        function setActiveNav(screen) {
            navItems.forEach(item => {
                const nav = item.dataset.nav;
                if (nav === screen) item.classList.add('active');
                else item.classList.remove('active');
            });
        }

        // navigation click
        navItems.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const navId = btn.dataset.nav; // home, learn, progress, settings
                showScreen(navId);
                setActiveNav(navId);
            });
        });

        profileBtn.addEventListener('click', () => {
            showScreen('profile');
            // remove active from bottom nav
            navItems.forEach(i => i.classList.remove('active'));
        });

        // screenshot SHIFT+W
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                // capture phone container
                import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
                    html2canvas(phoneContainer, { scale: 2 }).then(canvas => {
                        const link = document.createElement('a');
                        let filename = (darkMode ? '6' : screenshotCounter.toString()) + '.png';
                        if (!darkMode && screenshotCounter < 6) screenshotCounter = (screenshotCounter % 5) + 1; // cycle 1-5
                        if (darkMode) filename = '6.png';
                        else filename = screenshotCounter + '.png';
                        link.download = filename;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    });
                }).catch(() => alert('html2canvas unavailable, but screenshot simulated.'));
            }
        });

        // initial onboarding
        showScreen('onboarding');
        setTheme(false);
    })();
</script>

</body>
</html>
