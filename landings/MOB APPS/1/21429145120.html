```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Play · mobile prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #1a1e2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0,0,0,0.6), 0 0 0 8px #2d3340;
            position: relative;
            transition: background 0.2s;
            display: flex;
            flex-direction: column;
        }

        /* dynamic colors */
        :root {
            --bg-primary: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --header-icon: #334155;
        }

        .dark {
            --bg-primary: #0F172A;
            --card-bg: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --header-icon: #CBD5E1;
        }

        /* main flex layout */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--card-bg);
            padding: 16px 16px 8px 16px;
            gap: 20px;
        }

        .app-screen::-webkit-scrollbar {
            width: 4px;
        }
        .app-screen::-webkit-scrollbar-track {
            background: var(--card-bg);
        }
        .app-screen::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        /* header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0 4px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 650;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px 4px;
            display: flex;
            align-items: center;
            color: var(--header-icon);
        }
        .profile-btn svg {
            width: 28px;
            height: 28px;
            stroke: var(--header-icon);
            stroke-width: 2;
            fill: none;
        }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--card-bg);
            border-top: 1px solid var(--border-light);
            padding: 8px 12px;
            border-radius: 24px 24px 0 0;
            margin-top: auto;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 30px;
            transition: all 0.15s ease;
            color: var(--inactive);
            fill: none;
            stroke: var(--inactive);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            transition: all 0.15s ease;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            margin-top: 2px;
        }
        .nav-item.active {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
            stroke: var(--primary);
        }
        .nav-item.active svg {
            stroke: var(--primary);
            transform: scale(1.1);
            stroke-width: 2.2;
        }
        .nav-item.active span {
            color: var(--primary);
            font-weight: 600;
        }

        /* cards etc */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.02);
            border: 1px solid var(--border-light);
        }
        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 6px 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border-light);
            border-radius: 20px;
            margin: 12px 0;
        }
        .progress-fill {
            height: 8px;
            background: var(--primary);
            border-radius: 20px;
            width: 0%;
            transition: width 0.3s;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 18px;
            width: 100%;
            cursor: pointer;
        }
        .small-link {
            color: var(--inactive);
            text-decoration: underline;
            font-size: 13px;
            cursor: pointer;
        }
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: var(--card-bg);
            width: 280px;
            padding: 24px;
            border-radius: 40px;
            color: var(--text-primary);
            text-align: center;
        }
        .close-modal {
            margin-top: 16px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
        }
        .toggle-switch {
            width: 44px;
            height: 24px;
            background: var(--border-light);
            border-radius: 40px;
            position: relative;
            cursor: pointer;
        }
        .toggle-knob {
            width: 20px; height: 20px;
            background: var(--primary);
            border-radius: 50%;
            position: absolute;
            top: 2px; left: 2px;
            transition: left 0.15s;
        }
        .dark .toggle-knob { left: 22px; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic content -->
    <div id="app"></div>
</div>

<script>
    (function() {
        // ---------- THEME ----------
        let darkMode = false;
        const container = document.getElementById('phoneContainer');
        const root = document.documentElement;

        // ---------- ICONS (inline SVG, same style) ----------
        const icons = {
            home: `<svg viewBox="0 0 24 24"><path d="M5 12l-2 2V20H9V14H15V20H21V14L19 12L12 5L5 12Z" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
            learn: `<svg viewBox="0 0 24 24"><path d="M12 5L4 9L12 13L20 9L12 5Z" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/><path d="M4 13L12 17L20 13" stroke="currentColor" fill="none" stroke-width="2"/><path d="M4 17L12 21L20 17" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            progress: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none" stroke-width="2"/><path d="M12 7V12L15 15" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5" stroke="currentColor" fill="none" stroke-width="2"/><path d="M19.4 15a2 2 0 0 0 .7-2.7l-1-1.7a2 2 0 0 1 0-2l1-1.7a2 2 0 0 0-.7-2.7L17 3.3a2 2 0 0 0-2.7.7l-1 1.7a2 2 0 0 1-2 0L9 4a2 2 0 0 0-2.7-.7L4.3 5a2 2 0 0 0-.7 2.7l1 1.7a2 2 0 0 1 0 2l-1 1.7a2 2 0 0 0 .7 2.7L7 20.7a2 2 0 0 0 2.7-.7l1-1.7a2 2 0 0 1 2 0l1.7 1a2 2 0 0 0 2.7-.7L20.3 17Z" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            profile: `<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" stroke="currentColor" fill="none" stroke-width="2"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            lesson: `<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" fill="none" stroke-width="2"/><path d="M8 8h8M8 12h6M8 16h4" stroke="currentColor" stroke-width="2"/></svg>`,
            chart: `<svg viewBox="0 0 24 24"><path d="M21 21H4V4" stroke="currentColor" fill="none" stroke-width="2"/><path d="M7 15L10 10L13 13L18 7" stroke="currentColor" stroke-width="2" fill="none"/></svg>`,
            flashcards: `<svg viewBox="0 0 24 24"><path d="M4 6h16v12H4V6Z" stroke="currentColor" fill="none" stroke-width="2"/><path d="M8 10h8M8 14h6" stroke="currentColor" stroke-width="2"/></svg>`,
            play: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none" stroke-width="2"/><path d="M10 8L16 12L10 16V8Z" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            check: `<svg viewBox="0 0 24 24"><path d="M5 12L10 17L19 8" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>`
        };

        // ---------- SCREENS ----------
        let activeTab = 'home';
        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
        let screenshotCounter = 0;
        let modalContent = null; // 'privacy' or 'terms'

        // ---------- render app ----------
        function render() {
            const appDiv = document.getElementById('app');
            let headerTitle = '';
            if (currentScreen === 'onboarding') headerTitle = 'Welcome';
            else if (currentScreen === 'home') headerTitle = 'Home';
            else if (currentScreen === 'learn') headerTitle = 'Learn Python';
            else if (currentScreen === 'progress') headerTitle = 'Progress';
            else if (currentScreen === 'settings') headerTitle = 'Settings';

            // header
            let html = `
                <div class="header">
                    <h1>${headerTitle}</h1>
                    <button class="profile-btn" id="profileBtn">${icons.profile}</button>
                </div>
                <div class="app-screen" id="appScreen">`;

            // screen content
            if (currentScreen === 'onboarding') {
                html += `
                    <div class="card" style="text-align:center; padding:32px 20px;">
                        <div style="font-size:52px; margin-bottom:8px;">🐍</div>
                        <h2 style="font-size:32px; color:var(--primary);">Python Play</h2>
                        <p style="font-size:18px; font-weight:500; margin:8px 0 4px;">Code like a pro</p>
                        <p style="color:var(--text-secondary); margin:12px 0 24px;">Bite-sized Python lessons, interactive exercises and real coding practice. From zero to hero.</p>
                        <button class="btn-primary" id="getStartedBtn">Get Started</button>
                        <div style="margin-top:20px; display:flex; gap:24px; justify-content:center;">
                            <span class="small-link" id="privacyLink">Privacy Policy</span>
                            <span class="small-link" id="termsLink">Terms of Service</span>
                        </div>
                    </div>`;
            } else if (currentScreen === 'home') {
                html += `
                    <div class="card">
                        <div class="flex-row"><span>🔥 Daily streak</span><span class="badge">7 days</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
                        <div style="display:flex; gap:12px; margin-top:16px;">
                            <div style="flex:1; background:var(--accent); padding:12px; border-radius:16px; color:#0F172A;">🏆 340 XP</div>
                            <div style="flex:1; background:var(--primary-dark); padding:12px; border-radius:16px; color:white;">⭐ level 4</div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="flex-row"><span style="font-weight:600;">Continue learning</span> <span style="color:var(--primary);">View all</span></div>
                        <div style="display:flex; gap:12px; margin-top:12px;">
                            <div style="flex:1; background:var(--bg-primary); border-radius:18px; padding:12px;">${icons.lesson} <br>Loops</div>
                            <div style="flex:1; background:var(--bg-primary); border-radius:18px; padding:12px;">${icons.flashcards} <br>Lists</div>
                            <div style="flex:1; background:var(--bg-primary); border-radius:18px; padding:12px;">${icons.play} <br>Functions</div>
                        </div>
                    </div>
                    <div class="card">${icons.chart} Today's goal: 2 lessons left  <span class="badge">75%</span></div>`;
            } else if (currentScreen === 'learn') {
                html += `
                    <div class="card flex-row"><span>📘 Variables & Data types</span> <span class="badge">3 min</span></div>
                    <div class="card flex-row"><span>🔄 Loops (for/while)</span> <span class="badge">5 min</span></div>
                    <div class="card flex-row"><span>📋 List methods</span> <span class="badge">NEW</span></div>
                    <div class="card flex-row"><span>🔧 Functions</span> <span class="badge">4 min</span></div>
                    <div class="card" style="background:var(--primary); color:white; text-align:center;" id="practiceBtn">${icons.play} Start practice</div>`;
            } else if (currentScreen === 'progress') {
                html += `
                    <div class="card"><span>🏅 Monthly activity</span>${icons.chart} <div class="progress-bar"><div class="progress-fill" style="width:62%"></div></div> 620 XP</div>
                    <div class="card">Achievements <br> 🔥 7 day streak  •  💯 5 quizzes</div>
                    <div class="card flex-row"><span>Lessons completed: 24</span> <span class="badge">+3 this week</span></div>`;
            } else if (currentScreen === 'settings') {
                html += `
                    <div class="card flex-row"><span>🌙 Dark mode</span> <div class="toggle-switch" id="darkToggle"><div class="toggle-knob"></div></div></div>
                    <div class="card">📊 Download progress</div>
                    <div class="card">🔔 Notifications</div>
                    <div class="card">👤 Profile (click icon)</div>`;
            }

            html += `</div>`; // close app-screen

            // bottom navigation (only if not onboarding)
            if (currentScreen !== 'onboarding') {
                html += `<div class="bottom-nav" id="bottomNav">`;
                const tabs = [
                    { id: 'home', label: 'Home', icon: icons.home },
                    { id: 'learn', label: 'Learn', icon: icons.learn },
                    { id: 'progress', label: 'Progress', icon: icons.progress },
                    { id: 'settings', label: 'Settings', icon: icons.settings }
                ];
                tabs.forEach(tab => {
                    const activeClass = (activeTab === tab.id) ? 'active' : '';
                    html += `<button class="nav-item ${activeClass}" data-tab="${tab.id}">${tab.icon}<span>${tab.label}</span></button>`;
                });
                html += `</div>`;
            }

            // modal if any
            if (modalContent === 'privacy') {
                html += `<div class="modal-overlay"><div class="modal"><h3>Privacy Policy</h3><p style="margin:12px 0;">We respect your data. No tracking.</p><button class="close-modal" id="closeModal">OK</button></div></div>`;
            } else if (modalContent === 'terms') {
                html += `<div class="modal-overlay"><div class="modal"><h3>Terms of Service</h3><p style="margin:12px 0;">Learn responsibly. Have fun.</p><button class="close-modal" id="closeModal">OK</button></div></div>`;
            }

            appDiv.innerHTML = html;

            // attach listeners
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const tab = e.currentTarget.dataset.tab;
                    if (tab) {
                        activeTab = tab;
                        if (tab === 'home') currentScreen = 'home';
                        else if (tab === 'learn') currentScreen = 'learn';
                        else if (tab === 'progress') currentScreen = 'progress';
                        else if (tab === 'settings') currentScreen = 'settings';
                        render();
                    }
                });
            });

            const profileBtn = document.getElementById('profileBtn');
            if (profileBtn) profileBtn.addEventListener('click', () => { currentScreen = 'settings'; activeTab='settings'; render(); });

            const getStarted = document.getElementById('getStartedBtn');
            if (getStarted) getStarted.addEventListener('click', () => { currentScreen = 'home'; activeTab = 'home'; render(); });

            const privacyLink = document.getElementById('privacyLink');
            if (privacyLink) privacyLink.addEventListener('click', () => { modalContent = 'privacy'; render(); });
            const termsLink = document.getElementById('termsLink');
            if (termsLink) termsLink.addEventListener('click', () => { modalContent = 'terms'; render(); });

            const closeModal = document.getElementById('closeModal');
            if (closeModal) closeModal.addEventListener('click', () => { modalContent = null; render(); });

            const darkToggle = document.getElementById('darkToggle');
            if (darkToggle) {
                darkToggle.addEventListener('click', () => {
                    darkMode = !darkMode;
                    if (darkMode) container.classList.add('dark');
                    else container.classList.remove('dark');
                    render();
                });
            }

            const practiceBtn = document.getElementById('practiceBtn');
            if (practiceBtn) practiceBtn.addEventListener('click', () => { alert('practice started! (demo)'); });
        }

        // ---------- screenshot feature ----------
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                screenshotCounter++;
                const isDark = container.classList.contains('dark');
                const filename = isDark ? '6.png' : (screenshotCounter > 5 ? '1.png' : screenshotCounter + '.png');
                // in a real browser we would capture, but for prototype we just log + JSON output below.
                console.log('📸 screenshot ' + filename + ' captured (simulated)');
            }
        });

        // initial render
        render();
    })();
</script>
</body>
</html>
All done!
{
    "1.png": "Start Learning",
    "2.png": "Daily Lessons",
    "3.png": "Practice Skills",
    "4.png": "Track Progress",
    "5.png": "Smart Settings",
    "6.png": "Dark Theme"
}
```
