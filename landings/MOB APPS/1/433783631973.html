```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogicLoom · brain training</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* CSS variables – light mode default */
        :root {
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --text-muted: #64748B;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --border-light: #E2E8F0;
            --icon-inactive: #94A3B8;
            --icon-active: #2563EB;
            --bottom-bg: #FFFFFF;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            --header-icon: #334155;
            --progress-bg: #E2E8F0;
            --badge-bg: #DBEAFE;
            --badge-text: #1E40AF;
        }

        body.dark {
            --bg: #0F172A;
            --card-bg: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --text-muted: #94A3B8;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --border-light: #334155;
            --icon-inactive: #64748B;
            --icon-active: #3B82F6;
            --bottom-bg: #1E293B;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.5), 0 8px 10px -6px rgba(0,0,0,0.3);
            --header-icon: #CBD5E1;
            --progress-bg: #334155;
            --badge-bg: #1E3A5F;
            --badge-text: #90CAF9;
        }

        body {
            background: #111827; /* outer bezel */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background-color 0.2s;
            border: 1px solid #2d3748;
        }

        /* screens container */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            padding: 16px 16px 8px 16px;
            gap: 20px;
        }

        /* header (common) */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0 4px 0;
        }
        .header h2 {
            font-size: 22px;
            font-weight: 650;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-icon {
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            transition: background 0.1s;
            color: var(--header-icon);
        }
        .profile-icon:hover {
            background: var(--border-light);
        }

        /* bottom navigation */
        .bottom-nav {
            background: var(--bottom-bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 10px;
            border-top: 1px solid var(--border-light);
            box-shadow: 0 -2px 8px rgba(0,0,0,0.02);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 20px;
            transition: all 0.15s ease;
            color: var(--icon-inactive);
            fill: var(--icon-inactive);
        }
        .nav-item.active {
            color: var(--icon-active);
            fill: var(--icon-active);
            background: rgba(37, 99, 235, 0.08); /* subtle bg */
            transform: scale(1.05);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            margin-top: 2px;
        }
        .nav-item.inactive svg {
            stroke: var(--icon-inactive);
        }

        /* cards / elements */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .badge {
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
        }
        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 20px;
            overflow: hidden;
            width: 100%;
        }
        .progress-fill {
            height: 8px;
            background: var(--primary);
            width: 0%;
            border-radius: 20px;
            transition: width 0.3s ease;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-item {
            background: var(--bg);
            padding: 14px;
            border-radius: 20px;
            text-align: center;
        }
        .lesson-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .lesson-row:last-child { border: none; }

        /* buttons */
        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            padding: 16px;
            width: 100%;
            border-radius: 60px;
            font-weight: 600;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--primary-dark);
            transition: 0.1s ease;
        }
        .btn-primary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--primary-dark);
        }
        .link-row {
            display: flex;
            gap: 24px;
            justify-content: center;
            margin: 16px 0 8px;
            font-size: 14px;
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
        }

        /* modal */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--card-bg);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            color: var(--text-primary);
            box-shadow: 0 30px 40px black;
        }

        /* icons */
        .icon-xs { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; }

        /* hidden util */
        .hidden { display: none !important; }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic header + screen + bottom nav -->
    <div id="headerPlaceholder" class="header" style="padding: 16px 16px 0 16px;">
        <!-- injected by js -->
    </div>
    <div id="screenContainer" class="app-screen"></div>
    <div id="bottomNav" class="bottom-nav"></div>
</div>

<!-- hidden canvas for screenshot (html2canvas) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
    (function() {
        // ---------- THEME ----------
        let darkMode = false;
        function toggleTheme() {
            darkMode = !darkMode;
            if(darkMode) document.body.classList.add('dark');
            else document.body.classList.remove('dark');
            renderActiveScreen(); // refresh screen (settings updates toggle)
        }

        // ---------- SCREEN MANAGEMENT ----------
        const screens = ['onboarding', 'home', 'learn', 'progress', 'settings'];
        let currentScreen = 'onboarding'; // start
        let screenshotCounter = 1;

        // ---------- ICONS (inline svg) ----------
        function iconHome(active = false) { return `<svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" /></svg>`; }
        function iconLearn(active = false) { return `<svg viewBox="0 0 24 24"><path d="M12 5L4 9L12 13L20 9L12 5Z M4 14L12 18L20 14 M4 14V17 M20 14V17" /></svg>`; }
        function iconProgress(active = false) { return `<svg viewBox="0 0 24 24"><path d="M21 12V19H3V5H12 M15 3L21 9M15 9H21" /></svg>`; }
        function iconSettings(active = false) { return `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a2 2 0 0 0 .7-2.7l-1.8-3.1a2 2 0 0 0-2.6-.8L15 9a4 4 0 0 0-6 0l-.7-.6a2 2 0 0 0-2.6.8L4 12.3a2 2 0 0 0 .7 2.7L5 16a4 4 0 0 0 6 0l.5.4a2 2 0 0 0 2.6.8l3.1-1.8a2 2 0 0 0 .8-2.6L19 14z"/></svg>`; }
        function iconProfile() { return `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`; }
        function iconLesson() { return `<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`; }
        function iconChart() { return `<svg viewBox="0 0 24 24"><path d="M21 3v18H3V3"/><path d="M7 15v2M12 11v6M17 7v10"/></svg>`; }
        function iconFlash() { return `<svg viewBox="0 0 24 24"><path d="M13 2L3 14h8l-2 8 10-12h-8l2-8z"/></svg>`; }
        function iconPlay() { return `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M10 8v8l6-4-6-4z"/></svg>`; }
        function iconCheck() { return `<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>`; }

        // ---------- BOTTOM NAV ----------
        function renderBottomNav() {
            const nav = document.getElementById('bottomNav');
            const items = [
                { id: 'home', label: 'Home', icon: iconHome },
                { id: 'learn', label: 'Learn', icon: iconLearn },
                { id: 'progress', label: 'Progress', icon: iconProgress },
                { id: 'settings', label: 'Settings', icon: iconSettings }
            ];
            let html = '';
            items.forEach(item => {
                const active = (currentScreen === item.id) ? 'active' : 'inactive';
                html += `<div class="nav-item ${active}" data-screen="${item.id}">
                    ${item.icon(active === 'active')}
                    <span>${item.label}</span>
                </div>`;
            });
            nav.innerHTML = html;
            nav.querySelectorAll('.nav-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    const scr = el.dataset.screen;
                    if (scr) { currentScreen = scr; renderActiveScreen(); }
                });
            });
        }

        // ---------- HEADER (title + profile) ----------
        function renderHeader() {
            const ph = document.getElementById('headerPlaceholder');
            let title = '';
            if (currentScreen === 'onboarding') title = 'Welcome';
            else if (currentScreen === 'home') title = 'Dashboard';
            else if (currentScreen === 'learn') title = 'Brain training';
            else if (currentScreen === 'progress') title = 'Your stats';
            else if (currentScreen === 'settings') title = 'Settings';
            ph.innerHTML = `<h2>${title}</h2>
                <div class="profile-icon" id="profileBtn">${iconProfile()}</div>`;
            document.getElementById('profileBtn').addEventListener('click', () => {
                currentScreen = 'settings';
                renderActiveScreen();
            });
        }

        // ---------- MODAL logic ----------
        function showModal(text) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `<div class="modal-content"><p style="margin-bottom:16px;">${text}</p><button class="btn-primary" style="padding:10px;" id="closeModal">Close</button></div>`;
            document.querySelector('.phone').appendChild(modal);
            document.getElementById('closeModal').addEventListener('click', ()=>modal.remove());
        }

        // ---------- DYNAMIC SCREEN RENDER ----------
        function renderActiveScreen() {
            renderHeader();
            renderBottomNav();
            const container = document.getElementById('screenContainer');
            if (currentScreen === 'onboarding') container.innerHTML = onboardingHTML();
            else if (currentScreen === 'home') container.innerHTML = homeHTML();
            else if (currentScreen === 'learn') container.innerHTML = learnHTML();
            else if (currentScreen === 'progress') container.innerHTML = progressHTML();
            else if (currentScreen === 'settings') container.innerHTML = settingsHTML();

            // Attach global listeners (privacy, tos, start, etc)
            if (currentScreen === 'onboarding') {
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                    currentScreen = 'home';
                    renderActiveScreen();
                });
                document.getElementById('privacyLink')?.addEventListener('click', ()=>showModal('Privacy policy · we value your data.'));
                document.getElementById('tosLink')?.addEventListener('click', ()=>showModal('Terms: use brain daily.'));
            }
            if (currentScreen === 'learn') {
                document.querySelectorAll('.start-lesson').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        showModal('Lesson started! (simulated)');
                    });
                });
            }
            if (currentScreen === 'settings') {
                document.getElementById('themeToggle')?.addEventListener('change', (e) => {
                    toggleTheme();
                    renderActiveScreen(); // refresh toggle
                });
            }
            // simulate chart animation in progress
            if (currentScreen === 'progress') {
                setTimeout(() => {
                    document.querySelectorAll('.progress-fill').forEach(el => { el.style.width = '65%'; });
                }, 100);
            }
        }

        // ---------- SCREEN HTML ----------
        function onboardingHTML() {
            return `
                <div style="flex:1; display: flex; flex-direction: column; justify-content: center;">
                    <div class="card" style="text-align: center; background: transparent; box-shadow: none; border: none;">
                        <div style="font-size: 48px; margin-bottom: 16px;">🧠</div>
                        <h1 style="font-size: 36px; font-weight: 700; color: var(--primary);">LogicLoom</h1>
                        <p style="font-size: 18px; margin: 8px 0 4px; color: var(--accent);">train your brain daily</p>
                        <p style="color: var(--text-secondary); margin: 12px 0 24px;">Personal logic puzzles & brain training that adapts to you. Sharpen your mind in 5 min a day.</p>
                        <button class="btn-primary" id="getStartedBtn">Get Started</button>
                        <div class="link-row">
                            <span id="privacyLink">Privacy</span>
                            <span id="tosLink">Terms</span>
                        </div>
                    </div>
                </div>
            `;
        }
        function homeHTML() {
            return `
                <div class="card">
                    <div class="row"><span class="badge">🔥 7 day streak</span><span>⭐ 340 XP</span></div>
                    <div style="margin: 10px 0;">Today's brain boost</div>
                    <div style="background:var(--accent); color:black; padding:12px; border-radius: 20px; display:flex; align-items:center; gap:8px;">
                        ${iconFlash()} <span style="flex:1;">Pattern recognition · 4 min</span> ${iconPlay()}
                    </div>
                </div>
                <div class="grid-2">
                    <div class="card" style="padding:14px;"><h3>🧩 3 puzzles</h3><div class="badge">new</div></div>
                    <div class="card" style="padding:14px;"><h3>📊 IQ Matrix</h3><div class="badge">+120</div></div>
                </div>
                <div class="card">
                    <div class="row"><span>Recommended</span><span>see all</span></div>
                    <div class="lesson-row">${iconLesson()} <span>Logic grid</span> <span style="margin-left:auto;">▶</span></div>
                    <div class="lesson-row">${iconFlash()} <span>Memory match</span> <span style="margin-left:auto;">▶</span></div>
                    <div class="lesson-row">${iconChart()} <span>Speed calc</span> <span style="margin-left:auto;">▶</span></div>
                </div>
            `;
        }
        function learnHTML() {
            return `
                <div class="card"><h3>Daily workout</h3>
                    <div class="lesson-row"><span>🧠 Lateral thinking</span><span class="badge">5 min</span><span class="start-lesson" style="cursor:pointer;">${iconPlay()}</span></div>
                    <div class="lesson-row"><span>🔢 Number sequence</span><span class="badge">8 min</span><span class="start-lesson" style="cursor:pointer;">${iconPlay()}</span></div>
                    <div class="lesson-row"><span>📐 Spatial rotation</span><span class="badge">6 min</span><span class="start-lesson" style="cursor:pointer;">${iconPlay()}</span></div>
                </div>
                <div class="card"><h4>Categories</h4><div class="grid-2">
                    <div>logic</div><div>memory</div><div>verbal</div><div>math</div>
                </div></div>
            `;
        }
        function progressHTML() {
            return `
                <div class="card"><h3>Weekly activity</h3><div style="height:100px; display:flex; gap:6px; align-items:end; margin: 10px 0;">
                    <div style="background:var(--primary); width:20%; height:70px; border-radius:12px;"></div><div style="background:var(--primary); width:20%; height:40px;"></div><div style="background:var(--primary); width:20%; height:90px;"></div><div style="background:var(--primary); width:20%; height:60px;"></div><div style="background:var(--primary); width:20%; height:30px;"></div>
                </div></div>
                <div class="card"><div class="row">Overall brain score <span>1450</span></div><div class="progress-bar"><div class="progress-fill" style="width:58%"></div></div></div>
                <div class="card"><div class="row"><span>🧘 calm</span><span>82%</span></div><div class="progress-bar"><div class="progress-fill" style="width:82%"></div></div></div>
            `;
        }
        function settingsHTML() {
            return `
                <div class="card">
                    <div class="row"><span>Dark theme</span><label><input type="checkbox" id="themeToggle" ${darkMode ? 'checked' : ''}></label></div>
                    <div class="row"><span>Sound</span><span>🔔 on</span></div>
                    <div class="row"><span>Language</span><span>EN</span></div>
                    <hr style="border-color:var(--border-light); margin:12px 0;">
                    <div class="row">Profile: Alex</div>
                </div>
            `;
        }

        // ---------- SCREENSHOT (SHIFT+W) ----------
        document.addEventListener('keydown', function(e) {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const node = document.getElementById('phoneContainer');
                html2canvas(node, { scale: 2, backgroundColor: null }).then(canvas => {
                    const link = document.createElement('a');
                    let filename = (darkMode ? '6' : screenshotCounter.toString()) + '.png';
                    link.download = filename;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    if (!darkMode) screenshotCounter = (screenshotCounter % 5) + 1;
                });
            }
        });

        // ---------- INIT ----------
        renderActiveScreen();

        // make sure profile icon also works from any re-render
        window.profileGo = function() { currentScreen = 'settings'; renderActiveScreen(); };
    })();
</script>
</body>
</html>
All done!
