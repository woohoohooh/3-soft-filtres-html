```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabVault · English builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --border: #E2E8F0;
            --inactive: #94A3B8;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            --radius: 28px;
            --header-icon: #1E293B;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --border: #334155;
            --inactive: #64748B;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
            --header-icon: #F1F5F9;
        }

        body {
            background: #1e1e2f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 48px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.3), 0 0 0 8px #2d2d3a;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background-color 0.2s;
        }

        /* main content (screen area) */
        .screen-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px 8px 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) transparent;
            display: flex;
            flex-direction: column;
        }

        .screen-container::-webkit-scrollbar {
            width: 4px;
        }

        .screen-container::-webkit-scrollbar-thumb {
            background: var(--inactive);
            border-radius: 20px;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 16px 0;
        }

        .header h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--card);
            padding: 8px 4px 10px;
            border-top: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            gap: 4px;
            cursor: pointer;
            flex: 1;
            transition: transform 0.15s ease;
            color: var(--inactive);
            fill: var(--inactive);
        }

        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            transform: scale(1.05);
        }

        .nav-item.active svg {
            filter: drop-shadow(0 0 6px rgba(37,99,235,0.2));
        }

        .nav-item span {
            font-size: 11px;
            font-weight: 500;
        }

        /* cards */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .flex-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .gap-4 { gap: 8px; }
        .mb-2 { margin-bottom: 8px; }
        .mt-2 { margin-top: 8px; }
        .justify-between { display: flex; justify-content: space-between; align-items: center; }

        .progress-bar {
            height: 8px;
            background: var(--border);
            border-radius: 100px;
            overflow: hidden;
            width: 100%;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s;
            border-radius: 100px;
        }

        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
        }

        button.primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 18px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--primary-dark);
            transition: 0.05s linear;
        }

        button.primary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--primary-dark);
        }

        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 20px 0 10px;
            font-size: 13px;
        }

        .link-row button {
            background: none;
            border: none;
            color: var(--inactive);
            text-decoration: underline;
            cursor: pointer;
        }

        /* modal overlay */
        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.hidden { display: none; }

        .modal-content {
            background: var(--card);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            color: var(--text);
            box-shadow: var(--shadow);
        }

        .modal-content button {
            margin-top: 16px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 40px;
            width: 100%;
            font-weight: 600;
        }

        .icon-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }

        .achievement {
            background: var(--bg);
            padding: 6px 10px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* dark mode toggle in settings */
        .switch-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
        }
    </style>
</head>
<body>
    <div class="phone" id="phoneContainer">
        <!-- dynamic header + screen container -->
        <div id="appContent" style="display: flex; flex-direction: column; height: 100%;">
            <!-- header will be injected per screen -->
            <div id="dynamicHeader" class="header" style="padding: 16px 16px 0 16px;"></div>
            <!-- screen container (scrollable) -->
            <div id="screen" class="screen-container"></div>
            <!-- bottom nav -->
            <nav class="bottom-nav" id="bottomNav"></nav>
        </div>
        <!-- hidden modal for privacy/terms -->
        <div id="modalOverlay" class="modal hidden">
            <div class="modal-content">
                <h3 id="modalTitle">Title</h3>
                <p id="modalBody">content</p>
                <button id="closeModal">Close</button>
            </div>
        </div>
    </div>
    <script>
        (function() {
            // ---------- THEME & STATE ----------
            let darkMode = false;
            let currentScreen = 'onboarding'; // screens: onboarding, home, learn, progress, settings
            let screenshotCounter = 0;
            
            // ---------- ICON SYSTEM (inline svg, outline 2px) ----------
            const icons = {
                home: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v11h-7v-7h-4v7H3z"/></svg>`,
                learn: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
                progress: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/></svg>`,
                settings: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.03.03A10 10 0 0 0 12 17.66a10 10 0 0 0 6.37-2.63z"/></svg>`,
                profile: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
                lesson: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>`,
                chart: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/><line x1="9" y1="16" x2="9.01" y2="16"/><line x1="15" y1="16" x2="15.01" y2="16"/></svg>`,
                flashcards: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 8h6"/><path d="M9 12h6"/><path d="M9 16h4"/></svg>`,
                play: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>`,
                check: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>`,
            };

            // screens data
            const appName = 'VocabVault';
            const tagline = 'expand your English, one word at a time';

            function renderHeader(screenTitle) {
                return `<h2>${screenTitle}</h2>
                        <button class="profile-btn" id="profileBtn">${icons.profile}</button>`;
            }

            // ---------- SCREEN RENDERERS ----------
            function onboardingScreen() {
                return `
                    <div style="display: flex; flex-direction: column; min-height: 100%;">
                        <div style="margin-top: 30px; text-align: center;">
                            <div style="background: var(--primary); width: 80px; height: 80px; border-radius: 26px; margin: 0 auto; display: flex; align-items: center; justify-content: center;">
                                <span style="font-size: 44px; color:white;">📘</span>
                            </div>
                            <h1 style="font-size: 42px; font-weight:800; margin-top: 10px; color:var(--text);">${appName}</h1>
                            <p style="font-size: 18px; color: var(--primary); font-weight: 500;">${tagline}</p>
                            <p style="margin-top: 24px; color: var(--text-light);">Master 5000+ words with daily 5-min lessons. Adaptive and fun.</p>
                        </div>
                        <div style="margin-top: 40px;">
                            <button class="primary" id="getStartedBtn">Get Started</button>
                        </div>
                        <div class="link-row">
                            <button id="privacyBtn">Privacy Policy</button>
                            <button id="termsBtn">Terms of Service</button>
                        </div>
                        <div style="flex:1;"></div>
                    </div>
                `;
            }

            function homeDashboard() {
                return `
                    <div class="card">
                        <div class="flex-row justify-between">
                            <span style="font-weight:600;">Daily goal</span>
                            <span>80%</span>
                        </div>
                        <div class="progress-bar mt-2"><div class="progress-fill" style="width:80%"></div></div>
                        <div style="display:flex; gap:8px; margin-top:16px;">
                            <span class="badge">🔥 7 day streak</span>
                            <span class="badge">⭐ 340 XP</span>
                        </div>
                    </div>
                    <div class="card">
                        <h3 style="margin-bottom:8px;">Continue lesson</h3>
                        <div class="flex-row gap-4">
                            ${icons.lesson} <span style="flex:1;">Idioms in business</span>
                            <button style="background:var(--primary); border:none; border-radius:30px; padding:8px 16px; color:white;">${icons.play} Resume</button>
                        </div>
                        <div class="progress-bar mt-2"><div class="progress-fill" style="width:45%"></div></div>
                    </div>
                    <div class="card">
                        <div class="flex-row justify-between"><span><strong>Flashcards: 20 new</strong></span>${icons.flashcards}</div>
                        <p style="margin:8px 0">Collocations · advanced</p>
                        <button style="background:var(--bg); border:1px solid var(--primary); border-radius:40px; padding:10px;">Start practice</button>
                    </div>
                    <div class="card">
                        <div class="flex-row"><span>🏆 Word master</span><span> level 4</span></div>
                    </div>
                `;
            }

            function learnScreen() {
                return `
                    <div class="card">
                        <h3>Today's lessons</h3>
                        <div style="margin:12px 0;">
                            <div class="flex-row justify-between"><span>📘 Business English</span><span>${icons.play}</span></div>
                            <div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div>
                        </div>
                        <div style="margin:12px 0;">
                            <div class="flex-row justify-between"><span>🗣️ Phrasal verbs</span><span>${icons.play}</span></div>
                            <div class="progress-bar"><div class="progress-fill" style="width:10%"></div></div>
                        </div>
                        <div style="margin:12px 0;">
                            <div class="flex-row justify-between"><span>📝 IELTS vocabulary</span><span>${icons.play}</span></div>
                            <div class="progress-bar"><div class="progress-fill" style="width:0%"></div></div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="flex-row"><span>✨ quick practice</span></div>
                        <div style="display:flex; gap:6px; margin-top:10px;">
                            <span class="badge">synonyms</span>
                            <span class="badge">antonyms</span>
                            <span class="badge">definitions</span>
                        </div>
                    </div>
                `;
            }

            function progressScreen() {
                return `
                    <div class="card">
                        <h3>Weekly activity</h3>
                        <div style="height:100px; display:flex; align-items:end; gap:6px; margin:12px 0;">
                            <div style="background:var(--primary); width:20px; height:60px; border-radius:10px;"></div>
                            <div style="background:var(--primary); width:20px; height:80px; border-radius:10px;"></div>
                            <div style="background:var(--primary); width:20px; height:45px; border-radius:10px;"></div>
                            <div style="background:var(--primary); width:20px; height:90px; border-radius:10px;"></div>
                            <div style="background:var(--primary); width:20px; height:70px; border-radius:10px;"></div>
                            <div style="background:var(--accent); width:20px; height:40px; border-radius:10px;"></div>
                            <div style="background:var(--accent); width:20px; height:20px; border-radius:10px;"></div>
                        </div>
                        <p>+240 words learned this month</p>
                    </div>
                    <div class="card">
                        <div class="flex-row justify-between"><span>Accuracy</span><span>87%</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:87%"></div></div>
                        <div class="flex-row justify-between mt-2"><span>Listening</span><span>64%</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:64%"></div></div>
                    </div>
                    <div class="card">
                        <div class="icon-grid">
                            <span class="achievement">🔥 30 day streak</span>
                            <span class="achievement">📚 500 cards</span>
                            <span class="achievement">⚡ speedster</span>
                        </div>
                    </div>
                `;
            }

            function settingsScreen() {
                return `
                    <div class="card">
                        <div class="switch-item">
                            <span>Dark theme</span>
                            <label style="font-size:20px;"><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}></label>
                        </div>
                        <div class="switch-item"><span>Notifications</span><span>🔔 on</span></div>
                        <div class="switch-item"><span>Sound</span><span>🔊</span></div>
                    </div>
                    <div class="card">
                        <p>Profile: Alex L.</p>
                        <p>member since 2025</p>
                    </div>
                `;
            }

            // Navigation
            function showScreen(screenId) {
                currentScreen = screenId;
                const headerDiv = document.getElementById('dynamicHeader');
                const screenDiv = document.getElementById('screen');
                let title = '';
                let content = '';

                switch(screenId) {
                    case 'onboarding': title = 'Welcome'; content = onboardingScreen(); break;
                    case 'home': title = 'Home'; content = homeDashboard(); break;
                    case 'learn': title = 'Learn'; content = learnScreen(); break;
                    case 'progress': title = 'Progress'; content = progressScreen(); break;
                    case 'settings': title = 'Settings'; content = settingsScreen(); break;
                }

                headerDiv.innerHTML = renderHeader(title);
                screenDiv.innerHTML = content;

                // activate bottom nav item
                document.querySelectorAll('.nav-item').forEach(item => {
                    const tab = item.dataset.tab;
                    if (tab === screenId) item.classList.add('active');
                    else item.classList.remove('active');
                });

                // attach profile listener
                document.getElementById('profileBtn')?.addEventListener('click', ()=>{
                    if (currentScreen === 'settings') return;
                    showScreen('settings');
                });

                if (screenId === 'onboarding') {
                    document.getElementById('getStartedBtn')?.addEventListener('click', ()=> showScreen('home'));
                    document.getElementById('privacyBtn')?.addEventListener('click', ()=> showModal('Privacy Policy', 'We respect your data. No selling.'));
                    document.getElementById('termsBtn')?.addEventListener('click', ()=> showModal('Terms of Service', 'Use = learning. Be nice.'));
                }

                if (screenId === 'settings') {
                    const toggle = document.getElementById('darkToggle');
                    if (toggle) {
                        toggle.checked = darkMode;
                        toggle.addEventListener('change', (e) => {
                            darkMode = e.target.checked;
                            document.body.classList.toggle('dark', darkMode);
                            showScreen(currentScreen); // refresh header colors
                        });
                    }
                }
            }

            // modal
            const modal = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            function showModal(title, body) {
                modalTitle.innerText = title;
                modalBody.innerText = body;
                modal.classList.remove('hidden');
            }
            document.getElementById('closeModal').addEventListener('click', ()=> modal.classList.add('hidden'));

            // build bottom nav
            const navItems = [
                { tab: 'home', icon: icons.home, label: 'Home' },
                { tab: 'learn', icon: icons.learn, label: 'Learn' },
                { tab: 'progress', icon: icons.progress, label: 'Progress' },
                { tab: 'settings', icon: icons.settings, label: 'Settings' }
            ];
            const navEl = document.getElementById('bottomNav');
            navEl.innerHTML = navItems.map(item => 
                `<button class="nav-item" data-tab="${item.tab}">${item.icon}<span>${item.label}</span></button>`
            ).join('');
            navEl.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const tab = e.currentTarget.dataset.tab;
                    showScreen(tab);
                });
            });

            // start
            showScreen('onboarding');

            // ---------- SCREENSHOT HOTKEY (SHIFT+W) ----------
            window.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    const container = document.getElementById('phoneContainer');
                    // html2canvas would be external, but we simulate sequential naming 
                    // we just log and increment counter + darkmode logic
                    screenshotCounter++;
                    let filename = screenshotCounter + '.png';
                    if (darkMode) filename = '6.png';
                    alert(`📸 Screenshot saved as ${filename} (simulated).`);
                    if (screenshotCounter >=5 && !darkMode) screenshotCounter=0; // just for demo
                }
            });

            // manual dark mode simulation for screenshot naming
        })();
    </script>
    <!-- no external libs -->
</body>
</html>
All done!
