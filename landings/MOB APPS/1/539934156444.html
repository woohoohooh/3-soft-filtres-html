```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Play · mobile prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #1b2635;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --border: #E2E8F0;
            --icon-inactive: #94A3B8;
            --nav-highlight: rgba(37, 99, 235, 0.1);
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            --bar-bg: #FFFFFF;
            --toggle-bg: #E2E8F0;
        }
        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --border: #334155;
            --icon-inactive: #64748B;
            --nav-highlight: rgba(59, 130, 246, 0.2);
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
            --bar-bg: #1E293B;
            --toggle-bg: #334155;
        }
        .phone-wrap {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .screen-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            transition: background 0.2s;
        }
        header {
            padding: 20px 16px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg);
        }
        .screen-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }
        .profile-btn:hover { background: var(--nav-highlight); }
        main { flex: 1; overflow-y: auto; padding: 8px 16px 0; scrollbar-width: thin; }
        .bottom-nav {
            background: var(--bar-bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 12px;
            border-top: 1px solid var(--border);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            gap: 4px;
            transition: all 0.2s ease;
            color: var(--icon-inactive);
            fill: var(--icon-inactive);
            padding: 8px 4px 4px;
            border-radius: 20px;
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            transform: scale(1.05);
            background: var(--nav-highlight);
        }
        .nav-item.active svg { stroke: var(--primary); }
        .nav-item span { font-size: 12px; font-weight: 500; }
        .nav-item svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
        .hidden-screen { display: none !important; }

        /* cards & elements */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }
        .flex-row { display: flex; align-items: center; gap: 12px; }
        .progress-bar {
            height: 10px;
            background: var(--border);
            border-radius: 20px;
            overflow: hidden;
            margin: 8px 0;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.4s;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
        }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 8px 14px -8px var(--primary);
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--primary);
            color: var(--primary);
        }
        .link-row { display: flex; gap: 24px; justify-content: center; margin: 16px 0; }
        .link-row button { background: none; border: none; color: var(--text-light); text-decoration: underline; cursor: pointer; font-size: 14px; }
        .modal {
            position: fixed; top: 30%; left: 10%; width: 80%; background: var(--card); z-index: 200; border-radius: 32px; padding: 24px; box-shadow: 0 30px 60px rgba(0,0,0,0.5); border: 1px solid var(--border);
        }
        .modal-overlay { position: fixed; inset:0; background: rgba(0,0,0,0.4); z-index: 100; }
        .close-btn { margin-top: 16px; width: 100%; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .chart-line { display: flex; align-items: flex-end; height: 60px; gap: 6px; margin-top: 10px; }
        .chart-bar { flex:1; background: var(--primary); height: calc(70% * var(--h)); border-radius: 8px 8px 4px 4px; min-height: 8px; }
        .icon-grid { display: flex; gap: 12px; flex-wrap: wrap; margin: 12px 0; }
        .icon-grid svg { width: 32px; height: 32px; stroke: var(--primary); }
    </style>
</head>
<body>
<div class="phone-wrap" id="phoneContainer">
    <div class="screen-container" id="appScreen">
        <!-- header + dynamic main -->
        <header id="mainHeader">
            <span class="screen-title" id="headerTitle">Onboarding</span>
            <button class="profile-btn" id="profileIconBtn" aria-label="Profile">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text)"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </button>
        </header>

        <main id="screenContent">
            <!-- injected via JS -->
        </main>

        <nav class="bottom-nav" id="bottomNav">
            <button class="nav-item" data-screen="home"><svg viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></button>
            <button class="nav-item" data-screen="learn"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span>Learn</span></button>
            <button class="nav-item" data-screen="progress"><svg viewBox="0 0 24 24"><path d="M21 12v.2A10 10 0 1 1 12 2"/><polyline points="12 6 12 12 15 15"/><circle cx="12" cy="12" r="10"/></svg><span>Progress</span></button>
            <button class="nav-item" data-screen="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 18a10 10 0 0 0 6.36-2.22z"/><path d="M16.5 6.5 17 7l.5-.5M6.5 6.5 6 7l.5.5"/></svg><span>Settings</span></button>
        </nav>
    </div>
</div>

<!-- modal overlay & container -->
<div id="modalOverlay" class="modal-overlay hidden-screen"></div>
<div id="modalContent" class="modal hidden-screen"></div>

<script>
    (function() {
        // ---- define icons as svg strings (inline) ----
        const icons = {
            home: '<svg viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
            learn: '<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
            progress: '<svg viewBox="0 0 24 24"><path d="M21 12v.2A10 10 0 1 1 12 2"/><polyline points="12 6 12 12 15 15"/><circle cx="12" cy="12" r="10"/></svg>',
            settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 18a10 10 0 0 0 6.36-2.22z"/><path d="M16.5 6.5 17 7l.5-.5M6.5 6.5 6 7l.5.5"/></svg>',
            profile: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
            lesson: '<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
            chart: '<svg viewBox="0 0 24 24"><path d="M21 12v.2A10 10 0 1 1 12 2"/><polyline points="12 6 12 12 15 15"/></svg>',
            flashcards: '<svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="M8 2v4M16 2v4"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/></svg>',
            play: '<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
            check: '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
        };

        // ------- state ---------
        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
        let darkMode = false;
        let screenshotCounter = 1;

        // ----- screen render functions -----
        function renderOnboarding() {
            return `
                <div class="card" style="text-align: center; margin-top: 20px;">
                    <div style="display: flex; justify-content: center; gap: 12px; margin-bottom: 20px;">
                        <svg width="60" height="60" viewBox="0 0 24 24" stroke="var(--primary)" fill="none" stroke-width="2"><path d="M12 2L2 7v8l10 5 10-5V7l-10-5z"/><path d="M2 7l10 5 10-5M12 22V12"/></svg>
                        <span style="font-size: 48px; font-weight: 700; color: var(--primary)">🐍</span>
                    </div>
                    <h2 style="font-size: 32px; color: var(--text)">Python Play</h2>
                    <p style="font-size: 18px; color: var(--accent); margin: 8px 0;">learn by doing</p>
                    <p style="color: var(--text-light); margin: 20px 0;">Master Python with bite-sized exercises, real‑time feedback, and daily coding challenges.</p>
                    <button class="btn" id="getStartedBtn" style="width: 100%;">Get Started</button>
                    <div class="link-row">
                        <button id="privacyModalBtn">Privacy Policy</button>
                        <button id="termsModalBtn">Terms of Service</button>
                    </div>
                </div>
            `;
        }

        function renderHome() {
            return `
                <div class="card">
                    <div class="flex-row"><span class="badge">🔥 7 day streak</span> ${icons.flashcards}</div>
                    <h3 style="margin: 12px 0 4px; color: var(--text)">Python basics</h3>
                    <div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div>
                    <p style="color: var(--text-light);">45% completed</p>
                </div>
                <div class="card">
                    <h3 style="color: var(--text); margin-bottom: 12px;">Recommended for you</h3>
                    <div class="flex-row" style="justify-content: space-between;">
                        <span>🎯 Functions</span> <span class="badge">5 min</span>
                    </div>
                    <div class="flex-row" style="justify-content: space-between; margin-top: 12px;">
                        <span>📚 Lists & dicts</span> <span class="badge">8 min</span>
                    </div>
                    <button class="btn" style="margin-top: 16px; width:100%;" id="practiceNow">Start practice</button>
                </div>
                <div class="card flex-row" style="justify-content: space-around;">
                    <div style="text-align: center;">⭐ 34 XP</div>
                    <div style="text-align: center;">⚡ 12 lessons</div>
                    <div style="text-align: center;">🏆 3 badges</div>
                </div>
            `;
        }

        function renderLearn() {
            return `
                <div class="card">
                    <h3 style="color: var(--text)">Today's plan</h3>
                    <div class="flex-row" style="justify-content:space-between;"><span>Variables</span> ${icons.play}</div>
                    <div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div>
                    <div class="flex-row" style="justify-content:space-between; margin-top:12px;"><span>Conditionals</span> ${icons.lesson}</div>
                    <div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div>
                    <div class="flex-row" style="justify-content:space-between; margin-top:12px;"><span>Loops</span> ${icons.flashcards}</div>
                    <div class="progress-bar"><div class="progress-fill" style="width:10%"></div></div>
                    <button class="btn" style="margin-top:16px; width:100%;">continue</button>
                </div>
                <div class="card">
                    <p style="color: var(--primary)"><strong>Python flashcards</strong> → 20 terms</p>
                </div>
            `;
        }

        function renderProgress() {
            return `
                <div class="card">
                    <h3 style="color: var(--text)">Weekly activity</h3>
                    <div class="chart-line">
                        <div class="chart-bar" style="--h:0.8"></div>
                        <div class="chart-bar" style="--h:0.5"></div>
                        <div class="chart-bar" style="--h:1"></div>
                        <div class="chart-bar" style="--h:0.6"></div>
                        <div class="chart-bar" style="--h:0.9"></div>
                    </div>
                </div>
                <div class="card stat-grid">
                    <div><span style="color: var(--text-light);">Total XP</span><br><span style="font-size:24px;">2,340</span></div>
                    <div><span style="color: var(--text-light);">Lessons</span><br><span style="font-size:24px;">47</span></div>
                    <div><span style="color: var(--text-light);">Accuracy</span><br><span style="font-size:24px;">88%</span></div>
                    <div><span style="color: var(--text-light);">time</span><br><span style="font-size:24px;">12h</span></div>
                </div>
                <div class="card">
                    <span class="badge">🏅 beginner champion</span>
                </div>
            `;
        }

        function renderSettings() {
            return `
                <div class="card">
                    <div class="flex-row" style="justify-content: space-between;">
                        <span>🌙 Dark mode</span>
                        <label class="switch"><input type="checkbox" id="darkModeToggle" ${darkMode ? 'checked' : ''}><span class="slider"></span></label>
                    </div>
                </div>
                <div class="card">
                    <p style="color: var(--text);">Notifications</p>
                    <p style="color: var(--text-light);">Daily reminder · on</p>
                </div>
                <div class="card">
                    <p style="color: var(--text);">Sound effects</p>
                </div>
                <div class="card">
                    <p style="color: var(--text);">Privacy & terms</p>
                    <button class="btn-outline btn" id="privacyModalBtn2" style="margin-top:8px;">Privacy Policy</button>
                </div>
            `;
        }

        function renderProfileScreen() {
            return `
                <div class="card" style="text-align: center;">
                    <svg width="80" height="80" viewBox="0 0 24 24" stroke="var(--primary)" stroke-width="1.5" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <h2 style="color: var(--text); margin: 10px 0;">Pythonista</h2>
                    <p>level 8 · 2340 XP</p>
                    <button class="btn" id="backFromProfile">Back to Home</button>
                </div>
            `;
        }

        // ----- navigation - update screen, header, active nav -----
        function showScreen(screenId) {
            currentScreen = screenId;
            const main = document.getElementById('screenContent');
            const headerTitle = document.getElementById('headerTitle');
            if (screenId === 'onboarding') {
                main.innerHTML = renderOnboarding();
                headerTitle.innerText = 'Onboarding';
            } else if (screenId === 'home') {
                main.innerHTML = renderHome();
                headerTitle.innerText = 'Home';
            } else if (screenId === 'learn') {
                main.innerHTML = renderLearn();
                headerTitle.innerText = 'Learn';
            } else if (screenId === 'progress') {
                main.innerHTML = renderProgress();
                headerTitle.innerText = 'Progress';
            } else if (screenId === 'settings') {
                main.innerHTML = renderSettings();
                headerTitle.innerText = 'Settings';
            } else if (screenId === 'profile') {
                main.innerHTML = renderProfileScreen();
                headerTitle.innerText = 'Profile';
            }

            // update active bottom nav
            document.querySelectorAll('.nav-item').forEach(item => {
                const screenAttr = item.getAttribute('data-screen');
                if (screenAttr === screenId) item.classList.add('active');
                else item.classList.remove('active');
            });

            // hide bottom nav on onboarding and profile
            const bottomNav = document.getElementById('bottomNav');
            if (screenId === 'onboarding' || screenId === 'profile') {
                bottomNav.classList.add('hidden-screen');
            } else {
                bottomNav.classList.remove('hidden-screen');
            }

            // re-attach event listeners after innerHTML change
            attachDynamicListeners();
            if (screenId === 'settings' && document.getElementById('darkModeToggle')) {
                document.getElementById('darkModeToggle').addEventListener('change', toggleDarkMode);
            }
        }

        // ----- modal helpers -----
        function showModal(title, content) {
            const overlay = document.getElementById('modalOverlay');
            const modal = document.getElementById('modalContent');
            modal.innerHTML = `<h3 style="color: var(--primary);">${title}</h3><p style="margin:20px 0;">${content}</p><button class="btn close-btn" id="closeModalBtn">Close</button>`;
            overlay.classList.remove('hidden-screen');
            modal.classList.remove('hidden-screen');
            document.getElementById('closeModalBtn').addEventListener('click', closeModal);
            overlay.addEventListener('click', closeModal, {once:true});
        }
        function closeModal() {
            document.getElementById('modalOverlay').classList.add('hidden-screen');
            document.getElementById('modalContent').classList.add('hidden-screen');
        }

        // ----- dark mode toggle -----
        function toggleDarkMode(e) {
            darkMode = e.target.checked;
            if (darkMode) document.body.classList.add('dark');
            else document.body.classList.remove('dark');
            // re-apply current screen to update icon colors? css vars fine
        }

        // ----- global listeners -----
        function attachDynamicListeners() {
            // onboarding buttons
            const getStarted = document.getElementById('getStartedBtn');
            if (getStarted) getStarted.addEventListener('click', () => showScreen('home'));

            const privacyBtn = document.getElementById('privacyModalBtn');
            if (privacyBtn) privacyBtn.addEventListener('click', () => showModal('Privacy Policy', 'Your data is safe. We do not sell anything.'));
            const termsBtn = document.getElementById('termsModalBtn');
            if (termsBtn) termsBtn.addEventListener('click', () => showModal('Terms of Service', 'Use Python Play for good. Be nice.'));
            const privacyBtn2 = document.getElementById('privacyModalBtn2');
            if (privacyBtn2) privacyBtn2.addEventListener('click', () => showModal('Privacy Policy', 'We respect your privacy.'));
            
            const backProfile = document.getElementById('backFromProfile');
            if (backProfile) backProfile.addEventListener('click', () => showScreen('home'));

            const practiceNow = document.getElementById('practiceNow');
            if (practiceNow) practiceNow.addEventListener('click', () => { alert('Starting practice! (simulated)'); });
        }

        // ---- bottom nav click ----
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const screen = e.currentTarget.getAttribute('data-screen');
                showScreen(screen);
            });
        });

        // profile icon click
        document.getElementById('profileIconBtn').addEventListener('click', () => {
            showScreen('profile');
        });

        // ----- screenshot hotkey SHIFT+W -----
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                const phone = document.getElementById('phoneContainer');
                html2canvas?.(phone, { scale: 2 }).then(canvas => {
                    const link = document.createElement('a');
                    let filename = (darkMode ? '6.png' : (screenshotCounter++) + '.png');
                    if (darkMode && screenshotCounter <=6) filename='6.png';
                    else if (!darkMode && screenshotCounter>5) screenshotCounter=1;
                    link.download = filename;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }).catch(() => alert('html2canvas not loaded — screenshot simulation.'));
            }
        });

        // load html2canvas for screenshot
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        script.onload = () => console.log('html2canvas ready');
        document.head.appendChild(script);

        // start with onboarding
        showScreen('onboarding');
    })();
</script>

<!-- fallback if html2canvas fails -->
</body>
</html>
All done!
