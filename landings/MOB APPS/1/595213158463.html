        .toggle-switch {
            width: 44px;
            height: 24px;

            border-radius: 40px;

            border: none;
            cursor: pointer;
        }

        .toggle-switch::after {
            content: '';

</head>

<!-- modal templates -->

<script>
    (function() {
        // ----- THEME & icons -----
        const theme = { dark: false };

        // define all icons (inline svg strings)
        const icons = {
            home: `<svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" /></svg>`,
            learn: `<svg viewBox="0 0 24 24"><path d="M12 4V20M20 12H4M5 6L19 18M19 6L5 18" stroke-linecap="round"/></svg>`,
            progress: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7V12L15 15"/></svg>`,
            settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M21 12C21 13.2 19.5 13.8 19 14.8C18.5 15.8 19 17.5 18 18.5C17 19.5 15.3 19 14.3 19.5C13.3 20 12.7 21.5 11.5 21.5C10.3 21.5 9.7 20 8.7 19.5C7.7 19 6 19.5 5 18.5C4 17.5 4.5 15.8 4 14.8C3.5 13.8 2 13.2 2 12C2 10.8 3.5 10.2 4 9.2C4.5 8.2 4 6.5 5 5.5C6 4.5 7.7 5 8.7 4.5C9.7 4 10.3 2.5 11.5 2.5C12.7 2.5 13.3 4 14.3 4.5C15.3 5 17 4.5 18 5.5C19 6.5 18.5 8.2 19 9.2C19.5 10.2 21 10.8 21 12Z" /></svg>`,
            profile: `<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></svg>`,
            lesson: `<svg viewBox="0 0 24 24"><path d="M2 3H8C10.2 3 12 4.8 12 7V21C12 19.9 10.7 19 9 19H2V3Z"/><path d="M22 3H16C13.8 3 12 4.8 12 7V21C12 19.9 13.3 19 15 19H22V3Z"/></svg>`,
            chart: `<svg viewBox="0 0 24 24"><path d="M21 16V20H3V16M6 16L9 10L12 14L18 4L21 8" /></svg>`,
            flashcards: `<svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 7H16M8 12H14M8 17H12"/></svg>`,
            play: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16" fill="none" stroke="currentColor"/></svg>`,
            check: `<svg viewBox="0 0 24 24"><path d="M20 6L9 17L4 12" stroke="currentColor"/></svg>`
        };

        // app screens data
        const screens = ['onboarding','home','learn','progress','settings'];
        let activeScreen = 'onboarding';
        let darkMode = false;

        // DOM elements
        const phone = document.getElementById('phoneContainer');
        let modalPrivacy, modalTerms;

        // build UI
        function renderApp() {
            let html = `
            <div class="screen active" id="screen-onboarding">
                <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
                    <div style="margin-bottom:32px;">${icons.flashcards.replace('currentColor', 'var(--primary)')}</div>
                    <h1 style="font-size:44px; font-weight:700; color:var(--primary);">PyLearn</h1>
                    <p style="font-size:20px; color:var(--text-primary); margin:4px 0 12px;">code in your pocket</p>
                    <p style="color:var(--text-secondary); margin-bottom:32px;">Learn Python with short exercises, quizzes, and daily coding challenges. No experience needed.</p>
                    <button class="btn-primary" id="startOnboarding">Get Started →</button>
                    <div class="link-row">
                        <button id="showPrivacy">Privacy Policy</button>
                        <button id="showTerms">Terms of Service</button>
                    </div>
                </div>
            </div>

            <!-- home dashboard -->
            <div class="screen" id="screen-home">
                <div class="header"><h2>Dashboard</h2><button class="profile-btn" id="profileBtnHome">${icons.profile.replace('currentColor', 'var(--icon-stroke)')}</button></div>
                <div class="card"><div style="display:flex; gap:12px;"><span>🔥 streak 12 days</span><span>⭐ 340 XP</span></div><div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div></div>
                <div class="card"><h3 style="margin-bottom:8px;">continue</h3><div class="lesson-item">${icons.play} Variables & strings</div><div class="lesson-item">${icons.play} Lists & loops</div></div>
                <div class="card"><h3>daily challenge</h3><div class="badge-grid"><span class="badge">${icons.flashcards}if/else</span><span class="badge">functions</span></div></div>
            </div>

            <!-- learn / practice -->
            <div class="screen" id="screen-learn">
                <div class="header"><h2>Learn</h2><button class="profile-btn" id="profileBtnLearn">${icons.profile.replace('currentColor', 'var(--icon-stroke)')}</button></div>
                <div class="card"><div class="lesson-item">${icons.lesson}Python basics  • 85%</div><div class="progress-bar"><div class="progress-fill" style="width:85%"></div></div></div>
                <div class="card"><div class="lesson-item">${icons.lesson}Data structures  • 42%</div><div class="progress-bar"><div class="progress-fill" style="width:42%"></div></div></div>
                <div class="card"><div class="lesson-item">${icons.flashcards}OOP / classes  • 21%</div><div class="progress-bar"><div class="progress-fill" style="width:21%"></div></div></div>
                <button class="btn-primary" id="practiceBtn" style="margin-top:8px;">${icons.play} practice now</button>
            </div>

            <!-- progress -->
            <div class="screen" id="screen-progress">
                <div class="header"><h2>Progress</h2><button class="profile-btn" id="profileBtnProgress">${icons.profile.replace('currentColor', 'var(--icon-stroke)')}</button></div>
                <div class="card"><h3>weekly activity</h3><div class="chart-simple"><div class="bar" style="height:60px"></div><div class="bar" style="height:30px"></div><div class="bar" style="height:70px"></div><div class="bar" style="height:50px"></div><div class="bar" style="height:40px"></div></div></div>
                <div class="card"><div class="stat-row"><span>lessons done</span><strong>24</strong></div><div class="stat-row"><span>exercises</span><strong>189</strong></div></div>
                <div class="badge-grid"><span class="badge">${icons.check} quick learner</span><span class="badge">${icons.check} 7-day streak</span></div>
            </div>

            <!-- settings / profile -->
            <div class="screen" id="screen-settings">
                <div class="header"><h2>Settings</h2><button class="profile-btn" id="profileBtnSettings">${icons.profile.replace('currentColor', 'var(--icon-stroke)')}</button></div>
                <div class="card"><div style="display:flex; justify-content:space-between;"><span>Dark mode</span><button class="toggle-switch" id="themeToggle"></button></div></div>
                <div class="card"><div>Account: pythonista@example.com</div><div style="margin-top:12px;">version 2026.1</div></div>
            </div>

            <!-- bottom nav -->
            <div class="bottom-nav" id="bottomNav">
                <button class="nav-item" data-nav="home">${icons.home}<span>Home</span></button>
                <button class="nav-item" data-nav="learn">${icons.learn}<span>Learn</span></button>
                <button class="nav-item" data-nav="progress">${icons.progress}<span>Progress</span></button>
                <button class="nav-item" data-nav="settings">${icons.settings}<span>Settings</span></button>
            </div>
            `;
            phone.innerHTML = html;

            // attach modals
            const modalHtml = document.querySelector('.modal'); // already in dom
            // but we need to reinsert? they exist, we reuse.
            // set active tab
            updateNav('onboarding'); // start hidden, onboarding active
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    const nav = item.dataset.nav;
                    if (nav) switchScreen(nav);
                });
            });

            // profile buttons
            document.querySelectorAll('.profile-btn').forEach(btn => btn.addEventListener('click', () => switchScreen('settings')));

            // onboarding button
            document.getElementById('startOnboarding')?.addEventListener('click', () => switchScreen('home'));

            // practice btn
            document.getElementById('practiceBtn')?.addEventListener('click', () => { alert('Starting Python exercise!'); });

            // modals
            modalPrivacy = document.getElementById('privacyModal');
            modalTerms = document.getElementById('termsModal');
            document.getElementById('showPrivacy')?.addEventListener('click', () => modalPrivacy.classList.add('active'));
            document.getElementById('showTerms')?.addEventListener('click', () => modalTerms.classList.add('active'));
            document.getElementById('closePrivacy')?.addEventListener('click', () => modalPrivacy.classList.remove('active'));
            document.getElementById('closeTerms')?.addEventListener('click', () => modalTerms.classList.remove('active'));

            // theme toggle
            const toggleBtn = document.getElementById('themeToggle');
            if (toggleBtn) {
                toggleBtn.classList.toggle('active', darkMode);
                toggleBtn.addEventListener('click', () => {
                    darkMode = !darkMode;
                    document.documentElement.classList.toggle('dark-mode', darkMode);
                    toggleBtn.classList.toggle('active', darkMode);
                });
            }

            function switchScreen(screenId) {
                if (!screens.includes(screenId) && screenId!=='onboarding') return;
                if (screenId === 'onboarding') return;
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(`screen-${screenId}`)?.classList.add('active');
                activeScreen = screenId;
                updateNav(screenId);
            }

            function updateNav(active) {
                const navItems = document.querySelectorAll('.nav-item');
                navItems.forEach(item => {
                    const nav = item.dataset.nav;
                    if (nav === active) item.classList.add('active');
                    else item.classList.remove('active');
                });
            }

            // initial state: onboarding active, bottom nav hide active
            updateNav('onboarding');
        }

        renderApp();

        // ----- screenshot (SHIFT+W) -----
        let screenshotCounter = 1;
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                const phone = document.getElementById('phoneContainer');
                import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm').then(({default: html2canvas}) => {
                    html2canvas(phone, { scale: 2, backgroundColor: null }).then(canvas => {
                        const link = document.createElement('a');
                        const isDark = document.documentElement.classList.contains('dark-mode');
                        const num = isDark ? 6 : screenshotCounter;
                        link.download = `${num}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        if (!isDark) screenshotCounter = (screenshotCounter % 5) + 1;
                    });
                });
            }
        });

        // pre-set dark class if needed
        window.applyDark = (val) => {
            document.documentElement.classList.toggle('dark-mode', val);
        };
    })();
</script>

<script>

    (function() {
        setTimeout(() => {
            document.getElementById('closePrivacy')?.addEventListener('click', ()=>document.getElementById('privacyModal').classList.remove('active'));
            document.getElementById('closeTerms')?.addEventListener('click', ()=>document.getElementById('termsModal').classList.remove('active'));
            document.getElementById('showPrivacy')?.addEventListener('click', ()=>document.getElementById('privacyModal').classList.add('active'));
            document.getElementById('showTerms')?.addEventListener('click', ()=>document.getElementById('termsModal').classList.add('active'));
        }, 50);
    })();
</script>

<!-- final JSON block (exactly as required) -->
</body>
