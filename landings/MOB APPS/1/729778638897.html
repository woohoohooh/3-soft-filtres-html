```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeSprout · Learn Python</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }
    body {
      background: #1B1F2B;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --border-light: #E2E8F0;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --inactive: #94A3B8;
      --shadow: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,0,0,0.05);
      --progress-bg: #E2E8F0;
    }
    body.dark {
      --bg: #0F172A;
      --card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --border-light: #334155;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --inactive: #64748B;
      --shadow: 0 8px 20px rgba(0,0,0,0.5);
      --progress-bg: #334155;
    }
    .phone-frame {
      width: 360px;
      height: 780px;
      background-color: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: relative;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s;
    }
    .app-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: thin;
      padding: 16px 16px 8px 16px;
      background: var(--bg);
    }
    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 0 2px;
    }
    .header h2 {
      font-size: 22px;
      font-weight: 650;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
    }
    .profile-btn:hover { background: var(--border-light); }
    /* bottom nav */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 12px;
      background: var(--card);
      border-top: 1px solid var(--border-light);
      box-shadow: var(--shadow);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px 0 4px;
      border-radius: 20px;
      transition: all 0.15s ease;
      flex: 1;
      color: var(--inactive);
      fill: var(--inactive);
    }
    .nav-item.active {
      color: var(--primary);
      fill: var(--primary);
      transform: scale(1.05);
      background: rgba(37, 99, 235, 0.08);
    }
    .nav-item span {
      font-size: 11px;
      font-weight: 500;
    }
    .nav-icon {
      width: 24px;
      height: 24px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* cards etc */
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-light);
    }
    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 20px 0 12px;
    }
    .app-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(145deg, var(--primary), var(--accent));
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .app-name {
      font-size: 32px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }
    .tagline {
      font-size: 16px;
      color: var(--text-secondary);
      margin: 4px 0 8px;
    }
    .desc {
      text-align: center;
      color: var(--text-secondary);
      margin: 12px 0 24px;
      line-height: 1.4;
    }
    .btn-primary {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      font-size: 18px;
      padding: 16px;
      border-radius: 60px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 8px 16px -6px var(--primary-dark);
      transition: 0.1s;
    }
    .btn-primary:active { transform: scale(0.97); background: var(--primary-dark); }
    .link-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin: 24px 0 12px;
      font-size: 13px;
    }
    .link-row button {
      background: none;
      border: none;
      color: var(--text-secondary);
      text-decoration: underline;
      cursor: pointer;
    }
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: var(--card);
      padding: 24px;
      border-radius: 32px;
      width: 280px;
      color: var(--text-primary);
    }
    .close-btn { margin-top: 20px; float: right; }
    .badge {
      background: var(--accent);
      color: #0F172A;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 13px;
    }
    .progress-bar {
      height: 8px;
      background: var(--progress-bg);
      border-radius: 20px;
      margin: 10px 0;
    }
    .progress-fill {
      height: 8px;
      background: var(--primary);
      border-radius: 20px;
      width: 0%;
      transition: width 0.3s;
    }
    .row-space {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .lesson-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .chart-simple {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 100px;
      margin: 20px 0;
    }
    .bar {
      flex: 1;
      background: var(--primary);
      height: 20px;
      border-radius: 12px 12px 4px 4px;
      transition: height 0.3s;
    }
    .theme-toggle {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }
    .theme-btn {
      flex:1; padding: 12px; border-radius: 40px; border:1px solid var(--border-light);
      background: var(--card); color:var(--text-primary); font-weight:500; cursor:pointer;
    }
    .theme-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .icon-only { background: none; border: none; cursor: pointer; padding: 4px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<div class="phone-frame" id="phoneFrame">
  <!-- dynamic screens will be injected via JS -->
  <div id="appContainer" class="app-screen"></div>
  <!-- bottom nav (static but hidden on onboarding) -->
  <div id="bottomNav" class="bottom-nav" style="display: none;">
    <button class="nav-item" data-nav="home"><svg class="nav-icon" viewBox="0 0 24 24"><use href="#icon-home"></use></svg><span>Home</span></button>
    <button class="nav-item" data-nav="learn"><svg class="nav-icon" viewBox="0 0 24 24"><use href="#icon-learn"></use></svg><span>Learn</span></button>
    <button class="nav-item" data-nav="progress"><svg class="nav-icon" viewBox="0 0 24 24"><use href="#icon-progress"></use></svg><span>Progress</span></button>
    <button class="nav-item" data-nav="settings"><svg class="nav-icon" viewBox="0 0 24 24"><use href="#icon-settings"></use></svg><span>Settings</span></button>
  </div>
</div>

<!-- hidden SVG sprite -->
<svg style="display:none;" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <g id="icon-home"><path d="M5 12l-2 2v6h6v-4h4v4h6v-6l-2-2-5-5-5 5z"/><path d="M5 12l-2 2v6h6v-4h4v4h6v-6l-2-2-5-5-5 5z" stroke="currentColor" fill="none"/></g>
    <g id="icon-learn"><path d="M12 5l8 4-8 4-8-4 8-4z"/><path d="M4 9v5l8 4 8-4V9"/><path d="M4 9v5l8 4 8-4V9" stroke="currentColor" fill="none"/></g>
    <g id="icon-progress"><path d="M21 12a9 9 0 1 1-9-9" stroke="currentColor" fill="none"/><path d="M21 3v6h-6"/><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/></g>
    <g id="icon-settings"><circle cx="12" cy="12" r="3" stroke="currentColor" fill="none"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z" stroke="currentColor" fill="none"/><path d="M16.5 6.5 14 9" stroke="currentColor"/><path d="M7.5 6.5 10 9" stroke="currentColor"/></g>
    <g id="icon-profile"><circle cx="12" cy="8" r="4" stroke="currentColor" fill="none"/><path d="M5 20v-2a7 7 0 0 1 14 0v2" stroke="currentColor" fill="none"/></g>
    <g id="icon-lesson"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" stroke="currentColor"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" stroke="currentColor" fill="none"/></g>
    <g id="icon-chart"><path d="M21 16v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2" stroke="currentColor"/><path d="M7 10l3-3 3 3 4-4" stroke="currentColor" fill="none"/><path d="M17 10V4h-6" stroke="currentColor"/></g>
    <g id="icon-flashcards"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" fill="none"/><path d="M9 7h6M9 11h4" stroke="currentColor"/></g>
    <g id="icon-play"><circle cx="12" cy="12" r="10" stroke="currentColor" fill="none"/><path d="M10 8v8l5-4-5-4z" fill="currentColor"/></g>
    <g id="icon-check"><path d="M20 6L9 17l-5-5" stroke="currentColor" fill="none"/></g>
  </defs>
</svg>

<script>
(function() {
  // ---- theme & state ----
  let currentScreen = 'onboarding'; // 'onboarding','home','learn','progress','settings'
  let darkMode = false;
  let screenshotCounter = 1;

  const container = document.getElementById('appContainer');
  const bottomNav = document.getElementById('bottomNav');
  const phoneFrame = document.getElementById('phoneFrame');

  // ---- helper icons ----
  function icon(name) {
    return `<svg class="nav-icon" viewBox="0 0 24 24"><use href="#icon-${name}"></use></svg>`;
  }

  // ---- screen renderers ----
  function renderOnboarding() {
    bottomNav.style.display = 'none';
    let html = `
      <div class="logo-area">
        <div class="app-logo">${icon('play')}</div>
        <div class="app-name">CodeSprout</div>
        <div class="tagline">Python for curious minds</div>
        <div class="desc">Bite‑size exercises, real code, and smart feedback — start your Python journey today.</div>
        <button class="btn-primary" id="getStartedBtn">Get Started</button>
        <div class="link-row">
          <button id="privacyLink">Privacy Policy</button>
          <button id="termsLink">Terms of Service</button>
        </div>
      </div>
    `;
    container.innerHTML = html;
    document.getElementById('getStartedBtn').addEventListener('click', ()=>{
      currentScreen = 'home';
      renderHome();
    });
    document.getElementById('privacyLink').addEventListener('click', ()=> showModal('Privacy Policy', 'We respect your data. No tracking, no cookies.'));
    document.getElementById('termsLink').addEventListener('click', ()=> showModal('Terms of Service', 'Use CodeSprout for learning. Be kind.'));
  }

  function renderHome() {
    bottomNav.style.display = 'flex';
    setActiveNav('home');
    container.innerHTML = `
      <div class="header"><h2>Home</h2><button class="profile-btn" id="profileBtnHeader">${icon('profile')}</button></div>
      <div class="card" style="background:linear-gradient(145deg, var(--primary)10%, var(--accent)90%); color:white;">
        <div class="row-space"><span class="badge">🔥 7 day streak</span> <span>🐍 48 XP today</span></div>
        <div style="font-size:26px; font-weight:700; margin:12px 0 4px;">Continue: Loops</div>
        <div style="display:flex; gap:10px; align-items:center;"><span>Lesson 4/8</span> <button class="btn-primary" style="padding:8px 20px; width:auto; background:white; color:var(--primary);" id="resumeLearn">Resume</button></div>
      </div>
      <div class="card">
        <div class="row-space"><span style="font-weight:600;">Daily picks</span> ${icon('flashcards')}</div>
        <div class="lesson-item">${icon('lesson')} <span>Variables & Data types</span> <span class="badge">new</span></div>
        <div class="lesson-item">${icon('lesson')} <span>If/else conditions</span> <span class="badge">populär</span></div>
        <div class="lesson-item">${icon('play')} <span>Lists & loops</span> <span class="progress-fill" style="width:60%;"></span></div>
        <button class="btn-primary" style="margin-top:12px;" id="viewAllLearn">View all lessons</button>
      </div>
    `;
    document.getElementById('profileBtnHeader').addEventListener('click', ()=>{ currentScreen='settings'; renderSettings(); });
    document.getElementById('resumeLearn')?.addEventListener('click', ()=>{ currentScreen='learn'; renderLearn(); });
    document.getElementById('viewAllLearn')?.addEventListener('click', ()=>{ currentScreen='learn'; renderLearn(); });
  }

  function renderLearn() {
    bottomNav.style.display = 'flex';
    setActiveNav('learn');
    container.innerHTML = `
      <div class="header"><h2>Practice</h2><button class="profile-btn" id="profileBtnHeader">${icon('profile')}</button></div>
      <div class="card"><input type="text" placeholder="Search lessons..." style="width:100%; padding:12px; border-radius:40px; border:1px solid var(--border-light); background:var(--card); color:var(--text-primary);"></div>
      <div class="card">
        <div class="row-space"><span style="font-weight:600;">Python basics</span> <span>${icon('chart')}</span></div>
        <div class="lesson-item">${icon('lesson')} Hello world <span class="progress-fill" style="width:100%;"></span></div>
        <div class="lesson-item">${icon('lesson')} Variables <span class="progress-fill" style="width:70%;"></span></div>
        <div class="lesson-item">${icon('lesson')} Data types <span class="progress-fill" style="width:30%;"></span></div>
        <button class="btn-primary" style="margin-top:8px;" id="startPracticeBtn">Start practice</button>
      </div>
    `;
    document.getElementById('profileBtnHeader').addEventListener('click', ()=>{ currentScreen='settings'; renderSettings(); });
    document.getElementById('startPracticeBtn').addEventListener('click', ()=> showModal('Coding playground', 'Open editor – soon!'));
  }

  function renderProgress() {
    bottomNav.style.display = 'flex';
    setActiveNav('progress');
    container.innerHTML = `
      <div class="header"><h2>Progress</h2><button class="profile-btn" id="profileBtnHeader">${icon('profile')}</button></div>
      <div class="card">
        <div class="row-space"><span>🔥 7 days</span><span>⭐ 1240 XP</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:70%;"></div></div>
        <div>Next badge: Loop master (80%)</div>
      </div>
      <div class="stat-grid">
        <div class="card">Lessons <br> <span style="font-size:28px;">24</span></div>
        <div class="card">Practice <br> <span style="font-size:28px;">18</span></div>
      </div>
      <div class="card">
        <div>Weekly activity</div>
        <div class="chart-simple" id="chartBars">
          <div class="bar" style="height:40px;"></div><div class="bar" style="height:70px;"></div><div class="bar" style="height:55px;"></div><div class="bar" style="height:90px;"></div><div class="bar" style="height:30px;"></div><div class="bar" style="height:65px;"></div><div class="bar" style="height:80px;"></div>
        </div>
      </div>
    `;
    document.getElementById('profileBtnHeader').addEventListener('click', ()=>{ currentScreen='settings'; renderSettings(); });
    setTimeout(()=>{ // small animation
      document.querySelectorAll('.bar').forEach(b=> b.style.height = Math.floor(40+Math.random()*50)+'px');
    },100);
  }

  function renderSettings() {
    bottomNav.style.display = 'flex';
    setActiveNav('settings');
    container.innerHTML = `
      <div class="header"><h2>Settings</h2><button class="profile-btn" id="profileBtnHeader">${icon('profile')}</button></div>
      <div class="card">
        <div style="display:flex; gap:16px; align-items:center; margin-bottom:20px;"><div style="background:var(--primary); width:48px; height:48px; border-radius:30px;"></div><div><div>Alex C.</div><div>alex@sprout.dev</div></div></div>
        <div class="theme-toggle">
          <button class="theme-btn ${!darkMode?'active':''}" id="lightThemeBtn">☀️ Light</button>
          <button class="theme-btn ${darkMode?'active':''}" id="darkThemeBtn">🌙 Dark</button>
        </div>
      </div>
      <div class="card">
        <div class="lesson-item">${icon('check')} Notifications</div>
        <div class="lesson-item">${icon('chart')} Daily goal: 20 XP</div>
        <div class="lesson-item">${icon('profile')} Account</div>
        <div class="lesson-item">${icon('flashcards')} Privacy & security</div>
      </div>
    `;
    document.getElementById('profileBtnHeader').addEventListener('click', ()=>{ currentScreen='settings'; renderSettings(); });
    document.getElementById('lightThemeBtn')?.addEventListener('click', ()=>{ setTheme(false); renderSettings(); });
    document.getElementById('darkThemeBtn')?.addEventListener('click', ()=>{ setTheme(true); renderSettings(); });
  }

  function setTheme(dark) {
    darkMode = dark;
    if(dark) document.body.classList.add('dark');
    else document.body.classList.remove('dark');
  }

  function setActiveNav(screen) {
    document.querySelectorAll('.nav-item').forEach(el => {
      const nav = el.dataset.nav;
      if(nav === screen) el.classList.add('active');
      else el.classList.remove('active');
    });
  }

  function showModal(title, text) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `<div class="modal-content"><h3>${title}</h3><p>${text}</p><button class="btn-primary close-btn" style="padding:8px 20px;">Close</button></div>`;
    phoneFrame.appendChild(overlay);
    overlay.querySelector('button').addEventListener('click', ()=> overlay.remove());
  }

  // ---- navigation ----
  function attachNavListeners() {
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const target = e.currentTarget.dataset.nav;
        if(target === 'home') { currentScreen='home'; renderHome(); }
        else if(target === 'learn') { currentScreen='learn'; renderLearn(); }
        else if(target === 'progress') { currentScreen='progress'; renderProgress(); }
        else if(target === 'settings') { currentScreen='settings'; renderSettings(); }
      });
    });
  }

  // ---- screenshot (SHIFT+W) ----
  window.addEventListener('keydown', (e) => {
    if(e.shiftKey && e.key === 'W') {
      e.preventDefault();
      const filename = (darkMode ? '6' : screenshotCounter) + '.png';
      // just simulate download (real capture not possible in pure html, we output the json separately)
      console.log('📸 screenshot saved as ' + filename);
      if(!darkMode) screenshotCounter = (screenshotCounter % 5) + 1;
      alert('📸 Screenshot: ' + filename + ' (simulated)');
    }
  });

  // ---- initial ----
  renderOnboarding();

  // after render we need to re-attach nav listeners each time bottomNav changes? attach once
  attachNavListeners();
  // but also after each render we must re-attach profile header? we add inline listeners
  // also profile inside settings already works.

  // additional: settings from header already calls renderSettings
  window.renderHome = renderHome; window.renderLearn = renderLearn; window.renderProgress = renderProgress; window.renderSettings = renderSettings;

  // override inline click for profile (maybe after home/..)
})();
</script>
<!-- bottom line JSON -->
<pre style="display:none;">{
  "1.png": "Start Learning",
  "2.png": "Daily Lessons",
  "3.png": "Practice Skills",
  "4.png": "Track Progress",
  "5.png": "Smart Settings",
  "6.png": "Dark Theme"
}</pre>
All done!
