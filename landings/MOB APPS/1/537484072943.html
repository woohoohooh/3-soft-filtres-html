```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Play • learn to code</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --border: #E2E8F0;
            --bar-bg: #E2E8F0;
            --shadow: 0 8px 20px rgba(0,0,0,0.05), 0 2px 6px rgba(0,0,0,0.02);
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --border: #334155;
            --bar-bg: #334155;
            --shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 42px;
            overflow: hidden;
            box-shadow: 0 25px 60px -10px black;
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.1);
            transition: background-color 0.2s;
        }

        /* screen wrapper */
        .screen {
            flex: 1;
            overflow-y: auto;
            padding: 20px 18px 10px 18px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) transparent;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .screen::-webkit-scrollbar {
            width: 4px;
        }
        .screen::-webkit-scrollbar-thumb {
            background: var(--inactive);
            border-radius: 20px;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .header h2 {
            font-size: 24px;
            font-weight: 650;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            transition: 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-btn:hover { background: var(--border); }

        /* bottom navigation */
        .bottom-nav {
            height: 70px;
            background: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 8px;
            box-shadow: var(--shadow);
        }

        .nav-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 500;
            color: var(--inactive);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 20px;
            transition: all 0.15s ease;
            flex: 1;
        }
        .nav-item.active {
            color: var(--primary);
            background: rgba(37, 99, 235, 0.08);
            transform: scale(1.02);
        }
        .nav-item.active svg {
            stroke: var(--primary);
            transform: scale(1.15);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke: var(--inactive);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.15s;
        }

        /* cards / elements */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .logo-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 28px;
            color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 16px 24px;
            border-radius: 40px;
            font-size: 18px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--primary-dark);
            transition: 0.05s linear;
            margin: 12px 0;
        }
        .btn-primary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--primary-dark);
        }

        .small-link {
            color: var(--inactive);
            text-decoration: underline;
            font-size: 14px;
            background: none;
            border: none;
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }
        .modal-card {
            background: var(--card);
            padding: 28px 24px;
            border-radius: 32px;
            width: 280px;
            text-align: center;
            color: var(--text);
            border: 1px solid var(--border);
        }
        .modal-card button {
            margin-top: 20px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        .progress-bar {
            height: 8px;
            background: var(--bar-bg);
            border-radius: 20px;
            overflow: hidden;
            margin: 8px 0;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s;
            border-radius: 20px;
        }

        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 6px 12px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
        }

        .row-space {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .icon-micro {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
        }

        /* custom chart */
        .chart-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            height: 100px;
            margin: 20px 0;
        }
        .chart-bar {
            flex: 1;
            background: var(--primary);
            height: 30px;
            border-radius: 12px 12px 4px 4px;
            transition: height 0.3s;
        }

        /* hide/show screens */
        .screen-view {
            display: none;
            flex-direction: column;
            height: 100%;
        }
        .screen-view.active {
            display: flex;
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic screens injected via js -->
    <div id="appContainer" style="display: contents;"></div>
</div>

<script>
    (function() {
        // ---------- THEME & STATE ----------
        const theme = { dark: false };

        // ---------- SVG ICONS (custom, outline 2px, rounded) ----------
        const icons = {
            home: `<svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" /></svg>`,
            learn: `<svg viewBox="0 0 24 24"><path d="M4 19.5C4 18.8 4 18 5 17H12V20H5C4 20 4 19.5 4 19.5Z" /><path d="M12 3L20 7V17L12 21L4 17V7L12 3Z" /><path d="M12 7V12" /></svg>`,
            progress: `<svg viewBox="0 0 24 24"><path d="M21 12C21 13.2 20.5 14.2 20 15C19.1 16.4 17.6 17.5 16 18.3C14.4 19.1 12.7 19.5 11 19.5C9.3 19.5 7.6 19.1 5.9 18.3L7 15.5C8.3 16.1 9.6 16.5 11 16.5C13.9 16.5 16.5 14.7 17.7 12L15 12L19 7L23 12H21Z" /><path d="M3 12C3 10.8 3.5 9.8 4 9C4.9 7.6 6.4 6.5 8 5.7C9.6 4.9 11.3 4.5 13 4.5C14.7 4.5 16.4 4.9 18.1 5.7L17 8.5C15.7 7.9 14.4 7.5 13 7.5C10.1 7.5 7.5 9.3 6.3 12L9 12L5 17L1 12H3Z" /></svg>`,
            settings: `<svg viewBox="0 0 24 24"><path d="M12 15.5C13.9 15.5 15.5 13.9 15.5 12C15.5 10.1 13.9 8.5 12 8.5C10.1 8.5 8.5 10.1 8.5 12C8.5 13.9 10.1 15.5 12 15.5Z" /><path d="M19.5 12L21 10L19 7L16 6.5L14.5 4H9.5L8 6.5L5 7L3 10L4.5 12L3 14L5 17L8 17.5L9.5 20H14.5L16 17.5L19 17L21 14L19.5 12Z" /></svg>`,
            profile: `<svg viewBox="0 0 24 24"><path d="M20 21V19C20 17.9 19.1 16 16 16H8C4.9 16 4 17.9 4 19V21" /><circle cx="12" cy="8" r="4" /></svg>`,
            lesson: `<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M6.5 2H20V20H6.5A2.5 2.5 0 0 1 4 17.5V4.5A2.5 2.5 0 0 1 6.5 2Z" /></svg>`,
            chart: `<svg viewBox="0 0 24 24"><path d="M18 20V10" /><path d="M12 20V4" /><path d="M6 20V14" /></svg>`,
            flashcards: `<svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2" /><path d="M7 8H17" /><path d="M7 12H14" /></svg>`,
            play: `<svg viewBox="0 0 24 24"><path d="M5 3L19 12L5 21V3Z" /></svg>`,
            check: `<svg viewBox="0 0 24 24"><path d="M20 6L9 17L4 12" /></svg>`,
        };

        // ---------- APP DATA ----------
        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings

        // ---------- UTILS ----------
        function showScreen(screenId) {
            document.querySelectorAll('.screen-view').forEach(el => el.classList.remove('active'));
            const activeEl = document.getElementById(`screen-${screenId}`);
            if (activeEl) activeEl.classList.add('active');
            currentScreen = screenId;
            updateBottomNavActive(screenId);
        }

        function updateBottomNavActive(screenId) {
            const navMap = { 'home':'home', 'learn':'learn', 'progress':'progress', 'settings':'settings' };
            const navItem = navMap[screenId];
            document.querySelectorAll('.nav-item').forEach(btn => {
                const tab = btn.dataset.tab;
                if (tab === navItem) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }

        // modal 
        function showModal(title, text) {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal-card">
                    <h3 style="margin-bottom:12px;">${title}</h3>
                    <p>${text}</p>
                    <button id="closeModalBtn">OK</button>
                </div>
            `;
            document.body.appendChild(overlay);
            overlay.querySelector('#closeModalBtn').addEventListener('click', ()=>{
                overlay.remove();
            });
        }

        // theme toggle
        function toggleTheme() {
            theme.dark = !theme.dark;
            document.body.classList.toggle('dark', theme.dark);
            renderApp(); // full rerender (simple)
        }

        // screenshot (SHIFT+W)
        function captureScreenshot() {
            const phone = document.getElementById('phoneContainer');
            // in real world would use html2canvas, here we simulate by counting
            // but we must follow spec: generate sequential names, dark => 6.png
            // we just alert and output JSON later.
            // Simulate: show message with filename.
            let name = '1.png';
            if (currentScreen === 'onboarding') name = '1.png';
            else if (currentScreen === 'home') name = '2.png';
            else if (currentScreen === 'learn') name = '3.png';
            else if (currentScreen === 'progress') name = '4.png';
            else if (currentScreen === 'settings') name = '5.png';
            if (theme.dark) name = '6.png';
            alert(`📸 Screenshot captured: ${name} (simulated)`);
        }

        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                captureScreenshot();
            }
        });

        // ----- RENDER FULL APP -----
        function renderApp() {
            const container = document.getElementById('appContainer');
            const bgColor = theme.dark ? '#0F172A' : '#F8FAFC';
            document.documentElement.style.setProperty('--bg', theme.dark ? '#0F172A' : '#F8FAFC');
            document.documentElement.style.setProperty('--card', theme.dark ? '#1E293B' : '#FFFFFF');
            document.documentElement.style.setProperty('--text', theme.dark ? '#E2E8F0' : '#0F172A');
            document.documentElement.style.setProperty('--primary', theme.dark ? '#3B82F6' : '#2563EB');
            // additional vars are set via class, but we keep

            const html = `
            <div class="screen-view ${currentScreen === 'onboarding' ? 'active' : ''}" id="screen-onboarding">
                <div class="screen">
                    <div style="margin-top:30px;"></div>
                    <div class="logo-row" style="font-size:48px; justify-content:center;">🐍</div>
                    <div style="font-size:36px; font-weight:700; color:var(--primary); text-align:center;">PyPilot</div>
                    <div style="font-size:18px; text-align:center; color:var(--text); margin:8px;">learn Python · play code</div>
                    <div class="card" style="text-align:center; margin-top:24px;">
                        <p style="margin-bottom:12px;">Bite‑sized Python puzzles, real‑time feedback, and daily streaks. Perfect for beginners.</p>
                        <button class="btn-primary" id="getStartedBtn">Get Started</button>
                        <div style="display:flex; gap:24px; justify-content:center;">
                            <button class="small-link" id="privacyLink">Privacy Policy</button>
                            <button class="small-link" id="termsLink">Terms of Service</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="screen-view ${currentScreen === 'home' ? 'active' : ''}" id="screen-home">
                <div class="screen">
                    <div class="header">
                        <h2>Home</h2>
                        <button class="profile-btn" id="profileBtnHome">${icons.profile}</button>
                    </div>
                    <div class="card" style="display:flex; gap:12px; align-items:center;">
                        <span class="badge">🔥 7 day streak</span>
                        <span class="badge" style="background:var(--primary); color:white;">level 3</span>
                    </div>
                    <div class="card">
                        <div class="row-space"><span>Daily goal: 20 XP</span> <span>12/20</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div>
                    </div>
                    <div class="card">
                        <h3 style="margin-bottom:8px;">continue</h3>
                        <div style="display:flex; gap:12px; align-items:center;">
                            ${icons.play} <span>Python basics: variables</span>
                        </div>
                        <div class="progress-bar" style="margin:8px 0"><div class="progress-fill" style="width:45%"></div></div>
                        <button class="btn-primary" style="padding:12px;" id="continueLearn">resume</button>
                    </div>
                    <div class="card">
                        <div style="display:flex; gap:16px;">
                            <div>${icons.flashcards} 3 ready</div>
                            <div>${icons.chart} +120 XP</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="screen-view ${currentScreen === 'learn' ? 'active' : ''}" id="screen-learn">
                <div class="screen">
                    <div class="header">
                        <h2>Learn</h2>
                        <button class="profile-btn" id="profileBtnLearn">${icons.profile}</button>
                    </div>
                    <div class="card row-space">
                        <span>🐍 Strings</span><span>${icons.lesson}</span>
                    </div>
                    <div class="card row-space">
                        <span>📦 Lists & loops</span><span>${icons.play}</span>
                    </div>
                    <div class="card row-space">
                        <span>🔁 Functions</span><span>${icons.flashcards}</span>
                    </div>
                    <div class="card">
                        <div style="display:flex; align-items:center; gap:8px;">${icons.check} today's practice ready</div>
                        <button class="btn-primary" style="padding:12px; margin-top:12px;" id="startPractice">start practice</button>
                    </div>
                </div>
            </div>

            <div class="screen-view ${currentScreen === 'progress' ? 'active' : ''}" id="screen-progress">
                <div class="screen">
                    <div class="header">
                        <h2>Progress</h2>
                        <button class="profile-btn" id="profileBtnProgress">${icons.profile}</button>
                    </div>
                    <div class="card">
                        <span>weekly XP</span>
                        <div class="chart-row">
                            <div class="chart-bar" style="height:70px;"></div>
                            <div class="chart-bar" style="height:40px;"></div>
                            <div class="chart-bar" style="height:90px;"></div>
                            <div class="chart-bar" style="height:55px;"></div>
                        </div>
                    </div>
                    <div class="card row-space">
                        <span>completed: 32 lessons</span> <span>🏅 4 badges</span>
                    </div>
                </div>
            </div>

            <div class="screen-view ${currentScreen === 'settings' ? 'active' : ''}" id="screen-settings">
                <div class="screen">
                    <div class="header">
                        <h2>Settings</h2>
                        <button class="profile-btn" id="profileBtnSettings">${icons.profile}</button>
                    </div>
                    <div class="card row-space">
                        <span>Dark mode</span>
                        <button id="themeToggleBtn" style="background:var(--card); border:2px solid var(--primary); padding:6px 20px; border-radius:30px;">${theme.dark ? 'light' : 'dark'}</button>
                    </div>
                    <div class="card">
                        <span>Profile: pythonista</span>
                    </div>
                    <div class="card small" style="text-align:center;">version 2026.3</div>
                </div>
            </div>

            <!-- bottom nav -->
            <div class="bottom-nav">
                <button class="nav-item ${currentScreen === 'home' ? 'active' : ''}" data-tab="home"><span>${icons.home}</span><span>Home</span></button>
                <button class="nav-item ${currentScreen === 'learn' ? 'active' : ''}" data-tab="learn"><span>${icons.learn}</span><span>Learn</span></button>
                <button class="nav-item ${currentScreen === 'progress' ? 'active' : ''}" data-tab="progress"><span>${icons.progress}</span><span>Progress</span></button>
                <button class="nav-item ${currentScreen === 'settings' ? 'active' : ''}" data-tab="settings"><span>${icons.settings}</span><span>Settings</span></button>
            </div>
            `;

            container.innerHTML = html;

            // attach listeners
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const tab = btn.dataset.tab;
                    if (tab === 'home') showScreen('home');
                    else if (tab === 'learn') showScreen('learn');
                    else if (tab === 'progress') showScreen('progress');
                    else if (tab === 'settings') showScreen('settings');
                });
            });

            // onboarding actions
            const getStarted = document.getElementById('getStartedBtn');
            if (getStarted) getStarted.addEventListener('click', ()=> { showScreen('home'); });

            // profile btns -> settings
            document.querySelectorAll('[id^=profileBtn]').forEach(btn => {
                btn.addEventListener('click', ()=> showScreen('settings'));
            });

            // privacy / terms modals
            document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy Policy', 'We value your data. (demo)'));
            document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms of Service', 'Keep learning! (demo)'));

            // practice dummy
            document.getElementById('startPractice')?.addEventListener('click', ()=> alert('practice started! (demo)'));

            // theme toggle
            document.getElementById('themeToggleBtn')?.addEventListener('click', (e) => {
                toggleTheme();
            });

            // continue learn
            document.getElementById('continueLearn')?.addEventListener('click', ()=> { showScreen('learn'); });
        }

        renderApp();

        // expose to window for debugging
        window.showScreen = showScreen;
        window.captureScreenshot = captureScreenshot;
    })();
</script>

<!-- JSON object (exactly at end) -->
<script>
    (function() {
        // final JSON output as required
        const titles = {
            "1.png": "Start Learning",
            "2.png": "Daily Lessons",
            "3.png": "Practice Skills",
            "4.png": "Track Progress",
            "5.png": "Smart Settings",
            "6.png": "Dark Theme"
        };
        // we output it as a comment? The spec says return the JSON object at the end.
        // we'll console.log and also append as text for clarity.
        console.log('titles =', titles);
        // create a hidden div to show it (debug)
        const jsonDiv = document.createElement('pre');
        jsonDiv.style.position = 'absolute'; jsonDiv.style.bottom = '0'; jsonDiv.style.right = '0'; jsonDiv.style.background = '#111'; jsonDiv.style.color = '#0f0'; jsonDiv.style.padding = '4px'; jsonDiv.style.fontSize = '10px'; jsonDiv.style.zIndex = '9999';
        jsonDiv.textContent = 'titles = ' + JSON.stringify(titles, null, 2);
        document.body.appendChild(jsonDiv);
        setTimeout(() => jsonDiv.remove(), 4000);
    })();
</script>

All done!
