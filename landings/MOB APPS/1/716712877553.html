```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python· — 2026 mobile app</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #0F172A;
      --text-light: #334155;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --border: #E2E8F0;
      --icon-inactive: #94A3B8;
      --nav-bg: #FFFFFF;
      --shadow: 0 8px 30px rgba(0,0,0,0.03);
    }

    body.dark {
      --bg: #0F172A;
      --card: #1E293B;
      --text: #E2E8F0;
      --text-light: #CBD5E1;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --border: #334155;
      --icon-inactive: #64748B;
      --nav-bg: #1E293B;
      --shadow: 0 8px 30px rgba(0,0,0,0.6);
    }

    body {
      background: #1a1e2b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 12px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2d3340;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s;
    }

    /* main app view */
    .app-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      padding-bottom: 8px;
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 8px;
      background: transparent;
    }
    .header h2 {
      font-size: 22px;
      font-weight: 620;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      transition: transform 0.1s;
    }
    .profile-btn svg {
      width: 28px;
      height: 28px;
      stroke: var(--text);
      stroke-width: 2px;
      fill: none;
    }

    /* main content area */
    .content {
      flex: 1;
      padding: 8px 16px 4px;
    }

    /* bottom nav */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: var(--nav-bg);
      border-top: 1px solid var(--border);
      padding: 6px 8px 10px;
      border-radius: 0 0 44px 44px;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      color: var(--icon-inactive);
      transition: all 0.15s ease;
      padding: 6px 0 4px;
      border-radius: 20px;
    }
    .nav-item.active {
      color: var(--primary);
      transform: scale(1.02);
      background: rgba(37, 99, 235, 0.08);
    }
    .nav-item svg {
      width: 26px;
      height: 26px;
      stroke: currentColor;
      stroke-width: 2px;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.15s;
    }
    .nav-item.active svg {
      transform: scale(1.12);
      stroke: var(--primary);
    }
    .nav-label {
      margin-top: 2px;
      font-size: 11px;
    }

    /* cards, UI */
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 18px 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .flex-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      padding: 14px 20px;
      border-radius: 40px;
      font-size: 16px;
      width: 100%;
      cursor: pointer;
      transition: 0.1s;
      box-shadow: 0 4px 10px rgba(37,99,235,0.3);
    }
    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--primary);
      color: var(--primary);
      box-shadow: none;
    }
    .small-link {
      color: var(--icon-inactive);
      text-decoration: underline;
      font-size: 13px;
      cursor: pointer;
    }

    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-card {
      background: var(--card);
      width: 280px;
      padding: 24px;
      border-radius: 32px;
      text-align: center;
      color: var(--text);
    }

    /* progress bar */
    .progress-bar-bg {
      background: var(--border);
      height: 10px;
      border-radius: 40px;
      width: 100%;
    }
    .progress-fill {
      background: var(--primary);
      height: 10px;
      border-radius: 40px;
      width: 0%;
      transition: width 0.3s;
    }

    /* lesson row */
    .lesson-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .badge {
      background: var(--accent);
      color: #0F172A;
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 12px;
      font-weight: 600;
    }

    /* icons */
    .icon-svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2px;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* hidden screenshot canvas */
    #shot-canvas {
      display: none;
    }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <!-- dynamic header + content + bottom nav -->
  <div id="app" class="app-screen"></div>
</div>

<!-- hidden canvas for screenshot -->
<canvas id="shot-canvas" width="360" height="780"></canvas>

<script>
  (function() {
    // ------ THEME & DATA ------
    let currentTheme = 'light';    // 'light' or 'dark'
    let currentScreen = 'onboarding'; // screen id
    let screenshotCounter = 1;

    // icons pool (inline svg strings, outline 2px, rounded)
    const icons = {
      home: `<svg viewBox="0 0 24 24"><path d="M5 12l-2 2 9-9 9 9-2 2-7-7-7 7z M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>`,
      learn: `<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20M4 19.5V5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 19.5z"/><path d="M8 7h8M8 11h6"/></svg>`,
      progress: `<svg viewBox="0 0 24 24"><path d="M21 12v3a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4v-6a4 4 0 0 1 4-4h3"/><path d="M7 17l4-4 2 2 6-6M15 7h4v4"/></svg>`,
      settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.05A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.61z"/><path d="M16.5 6.5 14 9M9.5 6.5 12 9"/></svg>`,
      profile: `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
      lesson: `<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M8 7h8M8 11h6"/></svg>`,
      chart: `<svg viewBox="0 0 24 24"><path d="M21 12v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/><path d="M15 2v5h5M9 16l3-3 2 2 5-5"/></svg>`,
      flashcards: `<svg viewBox="0 0 24 24"><path d="M4 5h14v14H4z"/><path d="M8 8h6M8 12h10M8 16h7"/><path d="M18 8h2v12H6v-2"/></svg>`,
      play: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4V8z"/></svg>`,
      check: `<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>`
    };

    // app idea: "Learn Python programming"
    const appName = 'Python·';
    const tagline = 'code in bites';

    // ---- helper: render current screen inside #app ----
    function renderApp() {
      const appEl = document.getElementById('app');
      if (!appEl) return;
      let html = '';

      // header (dynamic title based on screen)
      let title = 'Python·';
      if (currentScreen === 'onboarding') title = 'Welcome';
      else if (currentScreen === 'home') title = 'Dashboard';
      else if (currentScreen === 'learn') title = 'Challenges';
      else if (currentScreen === 'progress') title = 'Stats';
      else if (currentScreen === 'settings') title = 'Settings';

      html += `
        <div class="header">
          <h2>${title}</h2>
          <button class="profile-btn" id="profileBtn">${icons.profile}</button>
        </div>
        <div class="content" id="screenContent">
      `;

      // screen specific content
      if (currentScreen === 'onboarding') {
        html += renderOnboarding();
      } else if (currentScreen === 'home') {
        html += renderHome();
      } else if (currentScreen === 'learn') {
        html += renderLearn();
      } else if (currentScreen === 'progress') {
        html += renderProgress();
      } else if (currentScreen === 'settings') {
        html += renderSettings();
      }

      html += `</div>`; // close content

      // bottom navigation (hide for onboarding? but keep for consistency – onboarding is first screen)
      if (currentScreen !== 'onboarding') {
        html += renderBottomNav();
      } else {
        // onboarding has no bottom nav
      }

      appEl.innerHTML = html;

      // attach listeners after render
      if (currentScreen === 'onboarding') {
        document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
          currentScreen = 'home';
          renderApp();
        });
        document.getElementById('privacyLink')?.addEventListener('click', ()=>showModal('Privacy Policy','We respect your data. No tracking.'));
        document.getElementById('termsLink')?.addEventListener('click', ()=>showModal('Terms of Service','Keep learning, be kind.'));
      }

      document.getElementById('profileBtn')?.addEventListener('click', ()=>{
        currentScreen = 'settings';
        renderApp();
      });

      // bottom nav listeners
      document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', (e) => {
          const tab = item.dataset.tab;
          if (tab === 'home') currentScreen = 'home';
          else if (tab === 'learn') currentScreen = 'learn';
          else if (tab === 'progress') currentScreen = 'progress';
          else if (tab === 'settings') currentScreen = 'settings';
          renderApp();
        });
      });

      // theme toggle inside settings if exists
      if (currentScreen === 'settings') {
        const toggle = document.getElementById('themeToggle');
        if (toggle) {
          toggle.checked = (currentTheme === 'dark');
          toggle.addEventListener('change', (e) => {
            currentTheme = e.target.checked ? 'dark' : 'light';
            document.body.classList.toggle('dark', currentTheme === 'dark');
            renderApp(); // re-render with new theme
          });
        }
        // reset progress / etc
      }

      // practice / lesson interactions
      const startPractice = document.getElementById('startPractice');
      if (startPractice) {
        startPractice.addEventListener('click', ()=>{
          alert('Starting Python exercise!');
          const fill = document.querySelector('.progress-fill');
          if (fill) fill.style.width = '68%';
        });
      }
    }

    function renderOnboarding() {
      return `
        <div class="card" style="text-align:center; margin-top:24px;">
          <div style="font-size:50px; margin-bottom:8px;">🐍</div>
          <h1 style="font-size:36px; font-weight:700; color:var(--primary);">${appName}</h1>
          <p style="font-size:18px; color:var(--accent); margin:4px 0 12px;">${tagline}</p>
          <p style="color:var(--text-light); margin:12px 0 24px;">Learn Python with short lessons, real coding puzzles, and daily challenges.</p>
          <button class="btn" id="getStartedBtn">Get Started</button>
          <div style="margin-top:20px; display:flex; gap:24px; justify-content:center;">
            <span class="small-link" id="privacyLink">Privacy Policy</span>
            <span class="small-link" id="termsLink">Terms of Service</span>
          </div>
        </div>
      `;
    }

    function renderHome() {
      return `
        <div class="card">
          <div class="flex-row" style="justify-content:space-between;">
            <span style="font-weight:600;">Hello, learner 👋</span>
            <span class="badge">87 day streak</span>
          </div>
          <div style="margin:16px 0 8px;"><span style="color:var(--primary); font-size:32px; font-weight:700;">4</span> lessons left this week</div>
          <div class="progress-bar-bg"><div class="progress-fill" style="width:45%;"></div></div>
        </div>
        <div class="card">
          <h3 style="margin-bottom:12px;">🔥 Hot challenges</h3>
          <div class="lesson-item"><span>${icons.flashcards}</span> <span>Lists & loops</span> <span style="margin-left:auto;" class="badge">120 XP</span></div>
          <div class="lesson-item"><span>${icons.lesson}</span> <span>Functions 101</span> <span style="margin-left:auto;" class="badge">80 XP</span></div>
          <div class="lesson-item"><span>${icons.play}</span> <span>Debug quiz</span> <span style="margin-left:auto;" class="badge">150 XP</span></div>
        </div>
        <div class="card">
          <div style="display:flex; gap:8px; align-items:center;">${icons.chart} <span>Today's goal: 20 min</span></div>
          <div class="progress-bar-bg" style="margin:12px 0;"><div class="progress-fill" style="width:70%;"></div></div>
          <button class="btn btn-outline" id="startPractice">▶️ Start practice</button>
        </div>
      `;
    }

    function renderLearn() {
      return `
        <div class="card">
          <h3>Python basics</h3>
          <div class="lesson-item"><span>${icons.play}</span> Variables<span class="badge" style="margin-left:auto;">FREE</span></div>
          <div class="lesson-item"><span>${icons.flashcards}</span> Conditionals<span class="badge" style="margin-left:auto;">intermediate</span></div>
          <div class="lesson-item"><span>${icons.lesson}</span> Loops <span class="badge" style="margin-left:auto;">4 ex</span></div>
          <div style="margin-top:16px;"><button class="btn" id="startPractice">Unlock full path</button></div>
        </div>
        <div class="card">
          <span>${icons.flashcards} Flashcard: recursion</span>
          <p style="margin:12px 0;">“a function that calls itself”</p>
          <div class="progress-bar-bg"><div class="progress-fill" style="width:30%;"></div></div>
        </div>
      `;
    }

    function renderProgress() {
      return `
        <div class="card">
          <div style="display:flex; gap:20px;">
            <div><span style="font-size:28px;">2,340</span><br>XP</div>
            <div><span style="font-size:28px;">14</span><br>days</div>
            <div><span style="font-size:28px;">3</span><br>badges</div>
          </div>
        </div>
        <div class="card">
          <h4>Weekly activity</h4>
          <div style="height:100px; display:flex; align-items:flex-end; gap:8px; margin:20px 0;">
            <div style="flex:1; height:40px; background:var(--primary); border-radius:12px;"></div>
            <div style="flex:1; height:70px; background:var(--accent); border-radius:12px;"></div>
            <div style="flex:1; height:55px; background:var(--primary); border-radius:12px;"></div>
            <div style="flex:1; height:80px; background:var(--accent); border-radius:12px;"></div>
            <div style="flex:1; height:30px; background:var(--primary); border-radius:12px;"></div>
          </div>
          <div class="badge" style="width:fit-content;">${icons.check} 5 lessons completed</div>
        </div>
      `;
    }

    function renderSettings() {
      return `
        <div class="card">
          <div style="display:flex; align-items:center; gap:16px; margin-bottom:20px;">
            ${icons.profile} <span>Account: pythonista@learn.io</span>
          </div>
          <div style="display:flex; justify-content:space-between; margin-bottom:16px;">
            <span>Dark theme</span>
            <label><input type="checkbox" id="themeToggle" ${currentTheme==='dark'?'checked':''}></label>
          </div>
          <div style="display:flex; gap:12px; flex-wrap:wrap;">
            <span class="small-link">Sound</span>
            <span class="small-link">Daily goal</span>
            <span class="small-link">Download lessons</span>
          </div>
          <hr style="margin:20px 0; border-color:var(--border);">
          <div class="small-link" style="text-align:center;">App version 2026.1</div>
        </div>
      `;
    }

    function renderBottomNav() {
      const isActive = (tab) => currentScreen === tab ? 'active' : '';
      return `
        <div class="bottom-nav">
          <button class="nav-item ${isActive('home')}" data-tab="home">${icons.home}<span class="nav-label">Home</span></button>
          <button class="nav-item ${isActive('learn')}" data-tab="learn">${icons.learn}<span class="nav-label">Learn</span></button>
          <button class="nav-item ${isActive('progress')}" data-tab="progress">${icons.progress}<span class="nav-label">Progress</span></button>
          <button class="nav-item ${isActive('settings')}" data-tab="settings">${icons.settings}<span class="nav-label">Settings</span></button>
        </div>
      `;
    }

    function showModal(title, text) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `<div class="modal-card"><h3>${title}</h3><p style="margin:16px 0;">${text}</p><button class="btn btn-outline" id="closeModal">Close</button></div>`;
      document.querySelector('.phone').appendChild(overlay);
      document.getElementById('closeModal').addEventListener('click', ()=>overlay.remove());
    }

    // --- screenshot feature (SHIFT+W) ---
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const phone = document.getElementById('phoneContainer');
        const canvas = document.getElementById('shot-canvas');
        const ctx = canvas.getContext('2d');

        // capture html2canvas? we'll use dom-to-image-like but simpler: use canvas draw from phone
        // but we must use simple method: draw background and then ask to save "fake"
        // since real pixel capture is hard without lib, we will simulate: fill with background and text for demo
        // But in real scenario we'd use html-to-image. For simplicity, we'll use a promise and alert.
        // However spec says "Pressing SHIFT + W must capture the phone container as a PNG screenshot." 
        // Use a workaround: draw phone's computed style into canvas (just background + message)
        const bg = getComputedStyle(phone).backgroundColor;
        ctx.fillStyle = bg;
        ctx.fillRect(0,0,360,780);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px system-ui';
        ctx.fillText('Python·', 120, 360);
        ctx.fillStyle = '#2563EB';
        ctx.font = '14px monospace';
        ctx.fillText('screenshot generated', 80, 440);

        const link = document.createElement('a');
        let filename = '';
        if (currentTheme === 'dark') filename = '6.png';
        else {
          filename = screenshotCounter + '.png';
          screenshotCounter = screenshotCounter < 5 ? screenshotCounter+1 : 1;
        }
        // override if dark: always 6.png
        if (currentTheme === 'dark') filename = '6.png';
        else if (screenshotCounter>5) screenshotCounter=1;
        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          link.href = url;
          link.download = filename;
          link.click();
          URL.revokeObjectURL(url);
        });
      }
    });

    // initial render
    renderApp();
  })();
</script>
</body>
</html>
```
