<!DOCTYPE html>

  <style>

    }

    :root {
      /* light mode (default) */
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --text-muted: #64748B;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --border: #E2E8F0;
      --icon-inactive: #94A3B8;
      --nav-active-bg: #DBEAFE;
      --progress-bg: #E2E8F0;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
    }

    body.dark {
      --bg: #0F172A;
      --card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --border: #334155;
      --icon-inactive: #64748B;
      --nav-active-bg: #1E3A5F;
      --progress-bg: #334155;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }

    body {
      background: #1c1e2b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background: var(--bg);
      border-radius: 48px;
      box-shadow: 0 30px 50px rgba(0,0,0,0.4), 0 0 0 8px #2c2e3a, 0 0 0 12px #3d3f4e;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: background 0.2s;
    }

    /* main app container (flex column) */
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--bg);
    }

    /* header */
    .header {
      padding: 16px 20px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      font-size: 22px;
      font-weight: 650;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      transition: background 0.2s;
    }
    .profile-btn:hover { background: var(--border); }

    /* main content area */
    .screen-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 8px;
      scrollbar-width: thin;
      scrollbar-color: var(--icon-inactive) var(--bg);
    }
    .screen-container::-webkit-scrollbar { width: 4px; }
    .screen-container::-webkit-scrollbar-track { background: var(--bg); }
    .screen-container::-webkit-scrollbar-thumb { background: var(--icon-inactive); border-radius: 8px; }

    /* bottom navigation */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 12px 10px;
      background: var(--card);
      border-top: 1px solid var(--border);
      box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px 0 4px;
      border-radius: 20px;
      transition: all 0.15s ease;
      color: var(--icon-inactive);
      fill: var(--icon-inactive);
    }
    .nav-item.active {
      color: var(--primary);
      fill: var(--primary);
      transform: scale(1.05);
      background: var(--nav-active-bg);
    }
    .nav-item span {
      font-size: 11px;
      font-weight: 500;
      margin-top: 2px;
    }

    /* cards & common */
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 18px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .flex-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .gap-8 { gap: 8px; }
    .mt-12 { margin-top: 12px; }
    .mb-12 { margin-bottom: 12px; }
    .text-primary { color: var(--text-primary); }
    .text-secondary { color: var(--text-secondary); font-size: 14px; }
    .badge {
      background: var(--accent);
      color: #0F172A;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 600;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 40px;
      padding: 16px;
      font-weight: 600;
      font-size: 18px;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s;
    }
    .btn-primary:active { background: var(--primary-dark); }
    .progress-bar {
      height: 8px;
      background: var(--progress-bg);
      border-radius: 40px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 60%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }

    /* modal */
    .modal {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      align-items: center; justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: var(--card);
      padding: 24px;
      border-radius: 32px;
      width: 280px;
      text-align: center;
      color: var(--text-primary);
    }
    .modal-content button {
      margin-top: 16px;
      background: var(--primary);
      border: none;
      color: white;
      padding: 8px 24px;
      border-radius: 40px;
      font-weight: 600;
    }

    /* screenshot helper (invisible) */
    #screenshot-helper {
      display: none;
    }
  </style>
</head>
<body>

          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          <span>Learn</span>
        </button>

          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>

        <button class="nav-item" data-screen="settings" id="navSettings">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/><path d="M16.5 6.5 17 7l-1.5 1.5"/><path d="M7.5 6.5 7 7l1.5 1.5"/></svg>
          <span>Settings</span>
        </button>
      </div>
    </div>
  </div>

  <!-- modals (privacy & terms) -->
  <div id="modalOverlay" class="modal" onclick="if(event.target===this) closeModal()">
    <div class="modal-content" id="modalContent">
      <h3 id="modalTitle"></h3>
      <p id="modalBody" style="margin:16px 0;"></p>
      <button onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    (function(){
      // --- THEME TOGGLE helper (inside settings)
      // --- ICONS as inline functions (modern outline)
      const icons = {
        home: (active) => `<svg width="${active ? 28 : 26}" height="${active ? 28 : 26}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
        learn: (active) => `<svg width="${active ? 28 : 26}" height="${active ? 28 : 26}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
        progress: (active) => `<svg width="${active ? 28 : 26}" height="${active ? 28 : 26}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`,
        settings: (active) => `<svg width="${active ? 28 : 26}" height="${active ? 28 : 26}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/><path d="M16.5 6.5 17 7l-1.5 1.5"/><path d="M7.5 6.5 7 7l1.5 1.5"/></svg>`,
        profile: `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
        lesson: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
        chart: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="m12 11 1 2 2 1-2 1-1 2-1-2-2-1 2-1 1-2z"/></svg>`,
        flashcards: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v12H4z"/><path d="M8 10h8"/><path d="M8 14h6"/></svg>`,
        play: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
        check: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
      };

      // --- APP STATE
      let currentScreen = 'onboarding';
      let darkMode = false;

      // --- Data for the app (Math Brain Trainer)
      const appName = 'Math Brain Trainer';
      const tagline = 'Train your mental math daily';

      // --- Screen render functions
      function renderOnboarding() {
        document.getElementById('headerTitle').innerText = 'Welcome';
        const container = document.getElementById('screenContainer');
        container.innerHTML = `
          <div style="display:flex; flex-direction:column; align-items:center; text-align:center; padding:24px 8px;">
            <div style="background:linear-gradient(145deg, #2563EB, #38BDF8); width:100px; height:100px; border-radius:32px; display:flex; align-items:center; justify-content:center; margin-bottom:20px;">
              <span style="font-size:56px; font-weight:800; color:white;">🧠</span>
            </div>
            <h1 style="font-size:36px; font-weight:800; color:var(--primary);">${appName}</h1>
            <p style="font-size:18px; color:var(--accent); margin:8px 0 16px;">${tagline}</p>
            <p style="color:var(--text-secondary); max-width:260px; margin-bottom:32px;">Boost your arithmetic skills with 5-minute daily challenges. Fun, fast, effective.</p>
            <button class="btn-primary" id="getStartedBtn">Get Started</button>
            <div style="display:flex; gap:20px; margin:24px 0 10px;">
              <a href="#" id="privacyLink" style="color:var(--primary); text-decoration:none;">Privacy</a>
              <a href="#" id="termsLink" style="color:var(--primary); text-decoration:none;">Terms</a>
            </div>
          </div>
        `;
        document.getElementById('getStartedBtn').addEventListener('click', () => switchScreen('home'));
        document.getElementById('privacyLink').addEventListener('click', (e) => { e.preventDefault(); showModal('Privacy Policy', 'We respect your data. No selling. Simple.'); });
        document.getElementById('termsLink').addEventListener('click', (e) => { e.preventDefault(); showModal('Terms of Service', 'Use Math Trainer for good. Be kind.'); });
        document.getElementById('bottomNav').style.display = 'none';
      }

      function renderHome() {
        document.getElementById('headerTitle').innerText = 'Dashboard';
        const container = document.getElementById('screenContainer');
        container.innerHTML = `
          <div class="card">
            <div class="flex-row" style="justify-content:space-between;">
              <h3 style="color:var(--text-primary);">Welcome back, Alex 👋</h3>
              <span class="badge">streak 7 🔥</span>
            </div>
            <div style="margin-top:16px;">${icons.flashcards} <span style="color:var(--text-primary); font-weight:600;">Daily puzzle ready</span></div>
            <div class="progress-bar mt-12"><div class="progress-fill" style="width:45%"></div></div>
          </div>
          <div class="card">
            <h3 style="margin-bottom:12px;">Today's workout</h3>
            <div class="flex-row gap-8"><span>${icons.play} </span><span style="color:var(--text-primary);">Addition · 5 min</span></div>
            <div class="flex-row gap-8"><span>${icons.play} </span><span style="color:var(--text-primary);">Multiplication · 5 min</span></div>
            <button style="background:var(--primary); color:white; border:none; border-radius:30px; padding:12px; width:100%; margin-top:16px;">Start practice</button>
          </div>
          <div class="card flex-row" style="justify-content:space-between;">
            <span>${icons.chart} Mastery: 340 pts</span>
            <span>🏆 rank #124</span>
          </div>
        `;
        document.getElementById('bottomNav').style.display = 'flex';
        setActiveNav('home');
      }

      function renderLearn() {
        document.getElementById('headerTitle').innerText = 'Lessons';
        const container = document.getElementById('screenContainer');
        container.innerHTML = `
          <div class="card">
            <h3>Arithmetic</h3>
            <div class="flex-row" style="justify-content:space-between;"><span>➕ Addition · 3/5</span> <span>60%</span></div><div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div>
            <div class="flex-row mt-12" style="justify-content:space-between;"><span>✖️ Multiplication · 2/8</span><span>25%</span></div><div class="progress-bar"><div class="progress-fill" style="width:25%"></div></div>
          </div>
          <div class="card">
            <div class="flex-row" style="justify-content:space-between;"><span>${icons.flashcards} Quick flashcards</span><span style="color:var(--primary);">start</span></div>
            <div class="flex-row mt-12">${icons.lesson} New: division tricks</div>
          </div>
        `;
        setActiveNav('learn');
      }

      function renderProgress() {
        document.getElementById('headerTitle').innerText = 'Statistics';
        const container = document.getElementById('screenContainer');
        container.innerHTML = `
          <div class="card">
            <h3>Weekly activity</h3>
            <div style="display:flex; gap:6px; margin:16px 0;">
              <div style="width:28px; height:80px; background:var(--primary); border-radius:20px; align-self:flex-end;"></div>
              <div style="width:28px; height:110px; background:var(--accent); border-radius:20px;"></div>
              <div style="width:28px; height:65px; background:var(--primary); border-radius:20px;"></div>
              <div style="width:28px; height:140px; background:var(--accent); border-radius:20px;"></div>
              <div style="width:28px; height:95px; background:var(--primary); border-radius:20px;"></div>
            </div>
            <div class="flex-row" style="justify-content:space-between;"><span>total sessions: 24</span><span>🏅 3 badges</span></div>
          </div>
          <div class="card">📊 accuracy 87% · speed 2.1s/op</div>
        `;
        setActiveNav('progress');
      }

      function renderSettings() {
        document.getElementById('headerTitle').innerText = 'Settings';
        const container = document.getElementById('screenContainer');
        container.innerHTML = `
          <div class="card">
            <label style="display:flex; align-items:center; justify-content:space-between;">
              <span style="color:var(--text-primary);">Dark mode</span>
              <input type="checkbox" id="themeToggle" ${darkMode ? 'checked' : ''}>
            </label>
          </div>
          <div class="card">
            <div>🔔 Notifications</div>
            <div class="mt-12">🌐 Language: English</div>
          </div>
          <div class="card" style="align-items:center;">🧑 Profile: Alex Chen</div>
        `;
        document.getElementById('themeToggle')?.addEventListener('change', (e) => {
          darkMode = e.target.checked;
          document.body.classList.toggle('dark', darkMode);
        });
        setActiveNav('settings');
      }

      function setActiveNav(screen) {
        ['home','learn','progress','settings'].forEach(id => {
          const btn = document.getElementById(`nav${id.charAt(0).toUpperCase()+id.slice(1)}`);
          if (id === screen) btn.classList.add('active');
          else btn.classList.remove('active');
        });
      }

      function switchScreen(screen) {
        if (screen === 'onboarding') { renderOnboarding(); currentScreen='onboarding'; return; }
        currentScreen = screen;
        if (screen === 'home') renderHome();
        else if (screen === 'learn') renderLearn();
        else if (screen === 'progress') renderProgress();
        else if (screen === 'settings') renderSettings();
      }

      // modals
      window.showModal = (title, body) => {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalBody').innerText = body;
        document.getElementById('modalOverlay').style.display = 'flex';
      }
      window.closeModal = () => document.getElementById('modalOverlay').style.display = 'none';

      // profile
      document.getElementById('profileBtn').addEventListener('click', ()=>{
        if (currentScreen === 'settings') return;
        switchScreen('settings');
      });

      // bottom nav
      document.getElementById('navHome').addEventListener('click', ()=>switchScreen('home'));
      document.getElementById('navLearn').addEventListener('click', ()=>switchScreen('learn'));
      document.getElementById('navProgress').addEventListener('click', ()=>switchScreen('progress'));
      document.getElementById('navSettings').addEventListener('click', ()=>switchScreen('settings'));

      // screenshot SHIFT+W
      window.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.key === 'W') {
          e.preventDefault();
          import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
            html2canvas(document.getElementById('phoneContainer')).then(canvas => {
              const link = document.createElement('a');
              const isDark = document.body.classList.contains('dark');
              const baseName = isDark ? '6' : (window._ssCounter || 0)+1;
              link.download = `${baseName}.png`;
              link.href = canvas.toDataURL('image/png');
              link.click();
              window._ssCounter = (window._ssCounter || 0) % 5 + 1;
            });
          });
        }
      });

      // init
      renderOnboarding();
    })();
  </script>
</body>
</html>
