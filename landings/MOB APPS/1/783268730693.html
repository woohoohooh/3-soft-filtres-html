```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Lab · mobile prototype</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #1a2639;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background: var(--bg-primary);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 30px 60px -15px rgba(0,0,0,0.6), 0 0 0 6px #2d3a4e;
      position: relative;
      transition: background 0.2s;
      display: flex;
      flex-direction: column;
    }

    /* themes – light (default) */
    :root {
      --bg-primary: #F8FAFC;
      --bg-card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --border-light: #E2E8F0;
      --primary-blue: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --inactive-icon: #94A3B8;
      --nav-bg: #FFFFFFCC;
      --backdrop: #FFFFFF;
      --highlight-soft: #EFF6FF;
    }

    body.dark {
      --bg-primary: #0F172A;
      --bg-card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --border-light: #334155;
      --primary-blue: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --inactive-icon: #64748B;
      --nav-bg: #1E293BCC;
      --backdrop: #1E293B;
      --highlight-soft: #1E2A44;
    }

    /* main flex container */
    .app-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--primary-blue) var(--bg-card);
      background: var(--bg-primary);
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 8px 20px;
      background: transparent;
    }
    .header h2 {
      font-size: 22px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .profile-btn svg {
      width: 28px;
      height: 28px;
      stroke: var(--text-primary);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* main content area – screen container */
    .screen-container {
      flex: 1;
      padding: 8px 16px 8px 16px;
      overflow-y: auto;
    }

    /* bottom navigation */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: var(--nav-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 6px 8px;
      border-top: 1px solid var(--border-light);
      box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
      margin: 0 8px 12px 8px;
      border-radius: 34px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      padding: 6px 2px 4px 2px;
      border-radius: 24px;
      min-width: 64px;
      cursor: pointer;
      transition: all 0.15s ease;
      color: var(--inactive-icon);
      fill: none;
    }
    .nav-item svg {
      width: 26px;
      height: 26px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.12s;
    }
    .nav-item span {
      font-size: 11px;
      font-weight: 500;
      margin-top: 4px;
      color: currentColor;
    }

    .nav-item.active {
      color: var(--primary-blue);
      background: var(--highlight-soft);
      transform: scale(1.02);
    }
    .nav-item.active svg {
      transform: scale(1.12);
      stroke-width: 2.2;
    }

    /* cards / UI elements */
    .card {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 18px 16px;
      margin-bottom: 16px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.02), 0 2px 4px rgba(0,20,50,0.03);
      border: 1px solid var(--border-light);
    }

    .badge {
      background: var(--accent);
      color: #0C4A6E;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 40px;
      display: inline-block;
    }

    .btn-primary {
      background: var(--primary-blue);
      color: white;
      border: none;
      border-radius: 40px;
      padding: 14px 24px;
      font-weight: 600;
      font-size: 16px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 8px 16px -6px var(--primary-blue);
      transition: 0.1s;
    }
    .btn-primary:active { transform: scale(0.98); }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 12px 0;
    }

    .progress-bar {
      height: 8px;
      background: var(--border-light);
      border-radius: 40px;
      overflow: hidden;
      margin: 8px 0;
    }
    .progress-fill {
      height: 8px;
      background: var(--primary-blue);
      width: 40%;
      border-radius: 40px;
    }

    .icon-micro {
      width: 40px;
      height: 40px;
      stroke: var(--primary-blue);
      stroke-width: 2;
      fill: none;
    }

    /* modal */
    .modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(3px);
    }
    .modal-content {
      background: var(--bg-card);
      width: 280px;
      padding: 24px;
      border-radius: 40px;
      color: var(--text-primary);
      text-align: center;
      border: 1px solid var(--border-light);
    }
    .modal-content button {
      margin-top: 20px;
      background: var(--primary-blue);
      border: none;
      color: white;
      padding: 8px 30px;
      border-radius: 40px;
      font-weight: 600;
    }
    .hidden { display: none; }
    .small-link { font-size: 14px; color: var(--primary-blue); text-decoration: none; margin: 0 8px; }

    /* lesson row */
    .lesson-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .lesson-item:last-child { border: none; }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* chart simulation */
    .chart-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 100px;
      margin-top: 16px;
    }
    .chart-bar {
      flex: 1;
      background: linear-gradient(to top, var(--primary-blue), var(--accent));
      border-radius: 12px 12px 4px 4px;
      height: calc(100% - 20px);
      transition: height 0.2s;
    }

    /* dark mode toggle */
    .theme-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
    }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <!-- dynamic app -->
  <div class="app-screen" id="appScreen">
    <div class="header">
      <h2 id="screenTitle">Welcome</h2>
      <button class="profile-btn" id="profileBtn">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></svg>
      </button>
    </div>

    <div class="screen-container" id="screenContainer">
      <!-- injected via JS -->
    </div>

    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-item" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2h-5v-8H10v8H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></button>
      <button class="nav-item" data-tab="learn"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span>Learn</span></button>
      <button class="nav-item" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M21 12v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 5 17 10"/><line x1="12" y1="5" x2="12" y2="15"/></svg><span>Progress</span></button>
      <button class="nav-item" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Settings</span></button>
    </nav>
  </div>

  <!-- modal placeholder -->
  <div id="modalContainer" class="hidden"></div>
</div>

<script>
(function() {
  // ----- icon system (inline svg strings) -----
  const ICONS = {
    home: '<svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2h-5v-8H10v8H5a2 2 0 0 1-2-2z"/></svg>',
    learn: '<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
    progress: '<svg viewBox="0 0 24 24"><path d="M21 12v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 5 17 10"/><line x1="12" y1="5" x2="12" y2="15"/></svg>',
    settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
    profile: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></svg>',
    lesson: '<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>',
    chart: '<svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
    flashcards: '<svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="17" x2="12" y2="17"/></svg>',
    play: '<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
    check: '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
  };

  // ------ state ------
  let currentScreen = 'onboarding'; // 'home','learn','progress','settings'
  let darkMode = false;
  let screenshotCounter = 1; // will be used for shift+w

  // ------ theme management ------
  const root = document.documentElement;
  function toggleTheme() {
    darkMode = !darkMode;
    if (darkMode) document.body.classList.add('dark');
    else document.body.classList.remove('dark');
    renderScreen(currentScreen); // refresh colors
  }

  // ------ render functions per screen ------
  function getOnboardingHTML() {
    return `
      <div class="card" style="text-align: center; padding: 32px 20px;">
        <div style="display: flex; justify-content: center; margin-bottom: 16px;">
          <svg width="60" height="60" viewBox="0 0 24 24" stroke="#2563EB" stroke-width="2" fill="none"><path d="M12 2L2 7v10l10 5 10-5V7l-10-5z"/><path d="M2 7l10 5 10-5M12 22V12"/></svg>
        </div>
        <h1 style="font-size: 32px; font-weight:700; color: var(--text-primary);">Python Lab</h1>
        <div class="badge" style="margin: 8px auto 12px;">learn by doing</div>
        <p style="color: var(--text-secondary); margin-bottom: 24px;">Write, run, and master Python. Bite-sized exercises and real code challenges.</p>
        <button class="btn-primary" id="getStartedBtn">Get Started</button>
        <div style="margin-top: 32px;">
          <a href="#" class="small-link" id="privacyLink">Privacy Policy</a> · 
          <a href="#" class="small-link" id="termsLink">Terms of Service</a>
        </div>
      </div>
    `;
  }

  function getHomeHTML() {
    return `
      <div class="card">
        <div class="row"><span style="font-weight:600;">Welcome back, Alex</span> <span class="badge">🔥 12 day streak</span></div>
        <div style="margin: 12px 0; display:flex; gap:8px; flex-wrap:wrap;">
          <span style="background: var(--accent); padding:4px 12px; border-radius:40px;">#Python</span>
          <span style="background: var(--accent); padding:4px 12px; border-radius:40px;">#Loops</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
        <p style="font-size:14px;">70% of weekly goal</p>
      </div>
      <div class="card">
        <h3>Today's picks</h3>
        <div class="lesson-item">${ICONS.lesson}<div><p><strong>Functions</strong> · 8 min</p></div></div>
        <div class="lesson-item">${ICONS.flashcards}<div><p><strong>Flashcards: data types</strong> · 15 cards</p></div></div>
        <div class="lesson-item">${ICONS.play}<div><p><strong>Quick challenge</strong> · lists</p></div></div>
      </div>
      <div class="card">
        <div style="display:flex; gap:20px;"><span>🏆 34 XP</span> <span>⚡ 2 days</span></div>
      </div>
    `;
  }

  function getLearnHTML() {
    return `
      <div class="card"><h3>Beginner path</h3>
        <div class="lesson-item"><span>${ICONS.check}</span> <span>Variables</span> <span class="badge">done</span></div>
        <div class="lesson-item"><span>${ICONS.play}</span> <span>Strings</span> <span class="badge">in progress</span></div>
        <div class="lesson-item"><span>${ICONS.lesson}</span> <span>Lists & loops</span></div>
        <button class="btn-primary" style="margin-top:12px;" id="startPracticeBtn">Start practice</button>
      </div>
      <div class="card"><h4>Recommended</h4><p>Dictionaries · 10 min</p><div class="progress-bar"><div class="progress-fill" style="width:20%"></div></div></div>
    `;
  }

  function getProgressHTML() {
    return `
      <div class="card">
        <h3>Weekly activity</h3>
        <div class="chart-row">
          <div class="chart-bar" style="height:60px;"></div><div class="chart-bar" style="height:80px;"></div><div class="chart-bar" style="height:40px;"></div><div class="chart-bar" style="height:95px;"></div><div class="chart-bar" style="height:70px;"></div><div class="chart-bar" style="height:50px;"></div><div class="chart-bar" style="height:30px;"></div>
        </div>
      </div>
      <div class="stat-grid card">
        <div><span>🏆 1340 XP</span></div><div><span>⚡ 12 days</span></div>
        <div><span>📚 47 lessons</span></div><div><span>⏱️ 8h 22m</span></div>
      </div>
      <div class="card"><h4>Badges</h4> <div style="display:flex; gap:16px;">🐍  ·  🔥  ·  ⚡</div> </div>
    `;
  }

  function getSettingsHTML() {
    return `
      <div class="card">
        <div class="theme-toggle"><span>Dark mode</span> <button id="darkToggleBtn" style="background:var(--primary-blue); color:white; border:none; border-radius:30px; padding:6px 18px;">${darkMode ? 'Light' : 'Dark'}</button></div>
        <hr style="border-color:var(--border-light); margin:16px 0;">
        <div>Profile settings</div><div style="margin:8px 0;">Notifications</div><div>Download data</div>
      </div>
    `;
  }

  function showModal(title, content) {
    const modalDiv = document.createElement('div');
    modalDiv.className = 'modal';
    modalDiv.innerHTML = `<div class="modal-content"><h3>${title}</h3><p style="margin:16px 0;">${content}</p><button id="closeModalBtn">Close</button></div>`;
    document.getElementById('modalContainer').classList.remove('hidden');
    document.getElementById('modalContainer').innerHTML = '';
    document.getElementById('modalContainer').appendChild(modalDiv);
    document.getElementById('closeModalBtn').addEventListener('click', ()=>{
      document.getElementById('modalContainer').classList.add('hidden');
    });
  }

  // navigation & update UI
  function renderScreen(screen) {
    const container = document.getElementById('screenContainer');
    const titleEl = document.getElementById('screenTitle');
    if (screen === 'onboarding') {
      container.innerHTML = getOnboardingHTML();
      titleEl.innerText = 'Welcome';
    } else if (screen === 'home') {
      container.innerHTML = getHomeHTML();
      titleEl.innerText = 'Home';
    } else if (screen === 'learn') {
      container.innerHTML = getLearnHTML();
      titleEl.innerText = 'Learn';
    } else if (screen === 'progress') {
      container.innerHTML = getProgressHTML();
      titleEl.innerText = 'Progress';
    } else if (screen === 'settings') {
      container.innerHTML = getSettingsHTML();
      titleEl.innerText = 'Settings';
    }

    // update bottom nav active
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    if (screen !== 'onboarding') {
      const activeBtn = document.querySelector(`.nav-item[data-tab="${screen}"]`);
      if (activeBtn) activeBtn.classList.add('active');
    }

    // Attach listeners (onboarding, buttons)
    if (screen === 'onboarding') {
      document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
        currentScreen = 'home';
        renderScreen('home');
      });
      document.getElementById('privacyLink')?.addEventListener('click', (e)=>{
        e.preventDefault(); showModal('Privacy Policy', 'We protect your data like a Python snake.');
      });
      document.getElementById('termsLink')?.addEventListener('click', (e)=>{
        e.preventDefault(); showModal('Terms of Service', 'Keep learning, be nice.');
      });
    }
    if (screen === 'learn') {
      document.getElementById('startPracticeBtn')?.addEventListener('click', ()=>{
        showModal('Practice', 'Starting Python challenge …');
      });
    }
    if (screen === 'settings') {
      document.getElementById('darkToggleBtn')?.addEventListener('click', toggleTheme);
    }
  }

  // profile button
  document.getElementById('profileBtn').addEventListener('click', ()=>{
    currentScreen = 'settings';
    renderScreen('settings');
  });

  // bottom nav listeners
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const tab = btn.dataset.tab; // 'home','learn','progress','settings'
      if (tab) {
        currentScreen = tab;
        renderScreen(tab);
      }
    });
  });

  // screenshot hotkey shift+W
  window.addEventListener('keydown', (e) => {
    if (e.shiftKey && e.key === 'W') {
      e.preventDefault();
      const phone = document.getElementById('phoneContainer');
      html2canvas?.(phone, { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        let filename = (darkMode ? '6.png' : (screenshotCounter + '.png'));
        link.download = filename;
        link.href = canvas.toDataURL('image/png');
        link.click();
        if (!darkMode && screenshotCounter <5) screenshotCounter++;
      }).catch(()=> alert('html2canvas not loaded — using fallback, screenshot simulated.'));
    }
  });

  // load html2canvas for screenshot (include)
  const script = document.createElement('script');
  script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  script.onload = ()=> console.log('html2canvas ready');
  document.head.appendChild(script);

  // start with onboarding
  currentScreen = 'onboarding';
  renderScreen('onboarding');
})();
</script>
</body>
