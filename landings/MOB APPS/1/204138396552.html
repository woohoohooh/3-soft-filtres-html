```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeFlow · daily python</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* CSS variables — light mode default */
        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --text-tertiary: #64748B;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --icon-inactive: #94A3B8;
            --nav-highlight: rgba(37, 99, 235, 0.08);
            --progress-bg: #E2E8F0;
            --badge-yellow: #FBBF24;
            --badge-green: #34D399;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --text-tertiary: #94A3B8;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --icon-inactive: #64748B;
            --nav-highlight: rgba(59, 130, 246, 0.15);
            --progress-bg: #334155;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        body {
            background: #1a1e2b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        /* phone mock container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: background-color 0.2s;
        }

        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px 18px 10px 18px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--border-light);
        }

        .app-screen::-webkit-scrollbar {
            width: 4px;
        }
        .app-screen::-webkit-scrollbar-track {
            background: var(--border-light);
        }
        .app-screen::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 20px;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 650;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            transition: background 0.1s;
        }
        .profile-btn:hover {
            background: var(--nav-highlight);
        }
        .icon {
            width: 28px;
            height: 28px;
            stroke: var(--text-primary);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        /* bottom nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 16px 12px;
            background-color: var(--card);
            border-top: 1px solid var(--border-light);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 0 4px 0;
            flex: 1;
            border-radius: 20px;
            transition: all 0.15s ease;
            color: var(--icon-inactive);
            stroke: var(--icon-inactive);
        }
        .nav-item.active {
            color: var(--primary);
            stroke: var(--primary);
            background-color: var(--nav-highlight);
            transform: scale(1.02);
        }
        .nav-icon {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.1s, transform 0.1s;
        }
        .nav-item.active .nav-icon {
            transform: scale(1.1);
            stroke: var(--primary);
        }
        .nav-label {
            font-size: 12px;
            font-weight: 500;
            margin-top: 4px;
            color: currentColor;
        }

        /* cards & elements */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 20px 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            font-weight: 600;
            padding: 16px;
            border: none;
            border-radius: 60px;
            width: 100%;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--primary-dark);
            transition: 0.08s linear;
            margin: 16px 0 24px 0;
        }
        .btn-primary:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--primary-dark);
        }

        .row-links {
            display: flex;
            justify-content: center;
            gap: 28px;
            font-size: 14px;
            font-weight: 500;
            color: var(--primary);
        }
        .link {
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        /* modal */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: var(--card);
            width: 280px;
            padding: 32px 24px;
            border-radius: 40px;
            text-align: center;
            color: var(--text-primary);
            box-shadow: 0 30px 40px #00000055;
        }
        .modal-content button {
            margin-top: 20px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        /* icons */
        .icon-lg {
            width: 56px;
            height: 56px;
            stroke: var(--primary);
            stroke-width: 2;
            fill: none;
            margin-bottom: 12px;
        }
        .badge {
            background: var(--badge-yellow);
            color: #0F172A;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
        }
        .progress-bar {
            background: var(--progress-bg);
            height: 8px;
            border-radius: 20px;
            margin: 12px 0;
        }
        .progress-fill {
            background: var(--primary);
            width: 60%;
            height: 8px;
            border-radius: 20px;
            transition: width 0.2s;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
        }
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-light);
        }

        .hidden-screen {
            display: none !important;
        }

        /* chart spark */
        .chart-simple {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 70px;
            margin: 20px 0 10px;
        }
        .bar {
            width: 20px;
            background: var(--primary);
            border-radius: 12px 12px 4px 4px;
            height: calc(100% * var(--h));
            transition: height 0.3s;
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic screens injected via js -->
    <div id="screenRenderer" class="app-screen"></div>
    <!-- bottom nav fixed -->
    <div class="bottom-nav" id="bottomNav"></div>
</div>

<!-- simple modal container -->
<div id="modalOverlay" class="modal" onclick="if(event.target===this) closeModal()">
    <div class="modal-content" id="modalContent"></div>
</div>

<script>
    (function() {
        // ---------- THEME ----------
        const themeState = { dark: false };
        function toggleTheme() {
            themeState.dark = !themeState.dark;
            document.body.classList.toggle('dark', themeState.dark);
            renderActiveScreen(); 
        }

        // ---------- SCREENSHOT (SHIFT+W) ----------
        let screenshotCounter = 1;
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                html2canvas?.(phone, { scale: 2 }).then(canvas => {
                    const link = document.createElement('a');
                    const isDark = themeState.dark;
                    let filename = isDark ? '6.png' : (screenshotCounter + '.png');
                    if (!isDark && screenshotCounter <=5) {
                        // naming 1..5
                        link.download = screenshotCounter + '.png';
                        screenshotCounter = screenshotCounter < 5 ? screenshotCounter + 1 : 1;
                    } else if (isDark) {
                        link.download = '6.png';
                    } else {
                        link.download = '1.png'; // fallback
                    }
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }).catch(console.warn);
            }
        });

        // ---------- SVG ICON SYSTEM ----------
        const icons = {
            home: `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 L3 10 Z"/></svg>`,
            learn: `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M2 4 L12 2 L22 4 L22 18 L12 20 L2 18 L2 4 Z M12 2 L12 20 M7 8 L9 8 M15 8 L17 8"/></svg>`,
            progress: `<svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7 L12 12 L15 15"/></svg>`,
            settings: `<svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82L12 22zM12 2v4"/></svg>`,
            profile: `<svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
            lesson: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
            chart: `<svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 16v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2"/><path d="M7 10l3-3 3 3 4-4"/><path d="M17 10V4h-6"/></svg>`,
            flashcards: `<svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 6h16v12H4z"/><path d="M8 4v2"/><path d="M16 4v2"/></svg>`,
            play: `<svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>`,
            check: `<svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>`
        };

        // ---------- SCREENS DATA ----------
        let activeScreen = 'onboarding'; 

        function navigateTo(screenId) {
            activeScreen = screenId;
            renderActiveScreen();
        }

        function openProfile() { navigateTo('settings'); }
        function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }

        function showModal(type) {
            const content = type === 'privacy' ? 'Privacy policy: your data is encrypted and never sold.' : 'Terms: use for educational purposes only.';
            document.getElementById('modalContent').innerHTML = `<h3>${type==='privacy'?'Privacy':'Terms'}</h3><p style="margin:16px 0;">${content}</p><button onclick="closeModal()">Close</button>`;
            document.getElementById('modalOverlay').classList.add('active');
        }

        // RENDER engine
        function renderActiveScreen() {
            const container = document.getElementById('screenRenderer');
            const nav = document.getElementById('bottomNav');
            if (!container) return;

            let html = '';

            // ---------- HEADER (dynamic title) ----------
            const titles = {
                onboarding: 'CodeFlow',
                home: 'Dashboard',
                learn: 'Python practice',
                progress: 'Your stats',
                settings: 'Settings'
            };
            const currentTitle = titles[activeScreen] || 'CodeFlow';

            html += `<div class="header">`;
            html += `<h1>${currentTitle}</h1>`;
            html += `<button class="profile-btn" onclick="openProfile()">${icons.profile}</button>`;
            html += `</div>`;

            // ---------- SCREEN CONTENT ----------
            if (activeScreen === 'onboarding') {
                html += `<div style="text-align:center; margin-top:20px;">${icons.flashcards.replace('width="24"', 'class="icon-lg"')}</div>`;
                html += `<h2 style="font-size:32px; font-weight:700; color:var(--primary);">CodeFlow</h2>`;
                html += `<p style="font-size:18px; font-weight:500; margin:8px 0 12px;">learn Python · 5 min a day</p>`;
                html += `<p style="color:var(--text-secondary); margin-bottom:24px;">Bite-sized exercises, flashcards, and real code challenges. Build your skill step by step.</p>`;
                html += `<button class="btn-primary" onclick="navigateTo('home')">Get Started</button>`;
                html += `<div class="row-links"><span class="link" onclick="showModal('privacy')">Privacy</span><span class="link" onclick="showModal('terms')">Terms</span></div>`;
            }
            else if (activeScreen === 'home') {
                html += `<div class="card"><div style="display:flex; justify-content:space-between;"><span class="badge">🔥 12 day streak</span><span>⚡ 340 XP</span></div>`;
                html += `<h3 style="margin:16px 0 8px;">Continue where you left</h3>`;
                html += `<div style="display:flex; gap:12px; align-items:center;"><span>${icons.lesson}</span><div style="flex:1;"><strong>Variables & data types</strong><div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div></div><span>75%</span></div>`;
                html += `<button style="background:var(--primary); color:white; border:none; border-radius:40px; padding:12px; width:100%; margin-top:16px;" onclick="navigateTo('learn')">Resume practice</button>`;
                html += `</div>`;

                html += `<div class="card"><h3>Today’s plan</h3>`;
                html += `<div class="lesson-item">${icons.flashcards} <span>Flashcards: keywords</span> <span style="margin-left:auto;">5min</span></div>`;
                html += `<div class="lesson-item">${icons.play} <span>Quiz: operators</span> <span style="margin-left:auto;">7min</span></div>`;
                html += `<div class="lesson-item">${icons.lesson} <span>Error hunt</span> <span style="margin-left:auto;">4min</span></div>`;
                html += `</div>`;
            }
            else if (activeScreen === 'learn') {
                html += `<div class="card"><h3>Python basics</h3><div class="lesson-item">${icons.check} <span style="flex:1;">Hello world</span> <span class="badge" style="background:#34D399;">done</span></div>`;
                html += `<div class="lesson-item">${icons.check} <span style="flex:1;">Variables</span> <span class="badge" style="background:#34D399;">done</span></div>`;
                html += `<div class="lesson-item">${icons.play} <span style="flex:1;">Conditions</span> <span class="badge" style="background:var(--primary); color:white;">start</span></div>`;
                html += `<div class="lesson-item">${icons.lesson} <span>Loops</span> <span style="color:var(--text-tertiary);">locked</span></div>`;
                html += `</div>`;
                html += `<div class="card" style="background:var(--accent); color:#0F172A;"><strong>Daily review:</strong> 3 quick questions → <span style="float:right;">start</span></div>`;
            }
            else if (activeScreen === 'progress') {
                html += `<div class="card"><h3>Weekly activity</h3><div class="chart-simple"><div style="--h:0.7" class="bar"></div><div style="--h:0.9" class="bar"></div><div style="--h:0.5" class="bar"></div><div style="--h:0.8" class="bar"></div><div style="--h:1" class="bar"></div><div style="--h:0.4" class="bar"></div></div>`;
                html += `<div class="stat-row"><span>Total lessons</span><strong>48</strong></div><div class="stat-row"><span>Practice minutes</span><strong>342</strong></div><div class="stat-row"><span>Python level</span><strong>Intermediate</strong></div>`;
                html += `</div><div class="card"><h3>Achievements</h3>🏆 early bird · 🔥 12 days · ⚡ 500 XP</div>`;
            }
            else if (activeScreen === 'settings') {
                html += `<div class="card"><h3>Preferences</h3><div style="display:flex; justify-content:space-between; align-items:center; margin:20px 0;"><span>Dark mode</span><button onclick="toggleTheme()" style="background:var(--primary); border:none; color:white; padding:8px 24px; border-radius:40px;">toggle</button></div>`;
                html += `<div>Sound effects · on</div><div style="margin:16px 0;">Reminders · daily 8am</div><hr style="border-color:var(--border-light);"><h3>Profile</h3>`;
                html += `<div class="lesson-item">${icons.profile.replace('icon','icon')} <span>alex.dev</span></div>`;
                html += `<div class="lesson-item">${icons.chart} <span>Member since 2025</span></div>`;
                html += `</div>`;
            }

            container.innerHTML = html;

            // bottom nav render
            const navItems = [
                { id: 'home', label: 'Home', icon: 'home' },
                { id: 'learn', label: 'Learn', icon: 'learn' },
                { id: 'progress', label: 'Progress', icon: 'progress' },
                { id: 'settings', label: 'Settings', icon: 'settings' }
            ];
            let navHtml = '';
            navItems.forEach(item => {
                const activeClass = activeScreen === item.id ? 'active' : '';
                navHtml += `<button class="nav-item ${activeClass}" onclick="navigateTo('${item.id}')">`;
                navHtml += icons[item.icon];
                navHtml += `<span class="nav-label">${item.label}</span>`;
                navHtml += `</button>`;
            });
            nav.innerHTML = navHtml;
        }

        // expose to global for inline handlers
        window.navigateTo = navigateTo;
        window.openProfile = openProfile;
        window.toggleTheme = toggleTheme;
        window.showModal = showModal;
        window.closeModal = closeModal;

        // init screen
        renderActiveScreen();

        // include html2canvas for screenshot
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        document.head.appendChild(script);
    })();
</script>
</body>
</html>
```
