<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeFlow · Python Learn</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            /* light mode (default) */
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive-icon: #94A3B8;
            --nav-bg: #FFFFFF;
            --shadow: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,0,0,0.05);
            --progress-bg: #E2E8F0;
            --badge-glow: rgba(37, 99, 235, 0.15);
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #94A3B8;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive-icon: #64748B;
            --nav-bg: #1E293B;
            --shadow: 0 8px 20px rgba(0,0,0,0.5);
            --progress-bg: #334155;
            --badge-glow: rgba(59, 130, 246, 0.25);
        }

        body {
            background: #1a1e2b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 6px #2d3340;
            position: relative;
            transition: background 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        /* main screen container */
        .screen-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 0 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive-icon) transparent;
        }
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: var(--inactive-icon);
            border-radius: 20px;
        }

        /* header (consistent across screens) */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .app-header .screen-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-icon {
            cursor: pointer;
            padding: 8px;
            margin-right: -8px;
            border-radius: 12px;
            transition: background 0.1s;
        }
        .profile-icon:hover {
            background: var(--badge-glow);
        }

        /* bottom navigation */
        .bottom-nav {
            background: var(--nav-bg);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-around;
            padding: 8px 12px 12px;
            backdrop-filter: blur(10px);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
            border-radius: 20px;
            padding: 6px 12px;
            flex: 1;
            background: transparent;
            border: none;
            color: var(--inactive-icon);
            fill: var(--inactive-icon);
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            background: rgba(37, 99, 235, 0.1);
            transform: scale(1.02);
        }
        .nav-item.active svg {
            transform: scale(1.1);
            filter: drop-shadow(0 2px 4px var(--badge-glow));
        }
        .nav-item svg {
            width: 26px;
            height: 26px;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: transform 0.15s;
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
        }

        /* cards & elements */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            border: 1px solid var(--border-light);
        }
        .row-space {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 12px;
        }
        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 40px;
            overflow: hidden;
            margin: 12px 0;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 40px;
            transition: width 0.3s ease;
        }
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-cell {
            background: var(--bg);
            border-radius: 18px;
            padding: 14px;
            text-align: center;
        }
        button {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 20px;
            border-radius: 40px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.1s;
            width: 100%;
            box-shadow: 0 4px 0 var(--primary-dark);
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--primary-dark);
        }

        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            text-decoration: underline;
            cursor: pointer;
        }

        /* modal overlay */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card);
            padding: 24px;
            border-radius: 32px;
            width: 280px;
            color: var(--text-primary);
            border: 1px solid var(--border-light);
        }

        /* hidden screenshot canvas */
        #screenshotCanvas { display: none; }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic screens injected via JS -->
    <div id="app" class="screen-container"></div>
    <!-- bottom nav (static but active class changes) -->
    <div class="bottom-nav" id="bottomNav">
        <div class="nav-item" data-screen="home">
            <svg viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 L3 10 Z" stroke="currentColor" fill="none"/></svg>
            <span class="nav-label">Home</span>
        </div>
        <div class="nav-item" data-screen="learn">
            <svg viewBox="0 0 24 24"><path d="M2 3 L12 3 L22 3 M12 3 L12 15 M12 15 C12 13 14 12 16 12 C18 12 20 13 20 15 L20 20 M4 20 L4 15 C4 13 6 12 8 12 C10 12 12 13 12 15" stroke="currentColor"/></svg>
            <span class="nav-label">Learn</span>
        </div>
        <div class="nav-item" data-screen="progress">
            <svg viewBox="0 0 24 24"><path d="M21 12 C21 16.97 16.97 21 12 21 C7.03 21 3 16.97 3 12 C3 7.03 7.03 3 12 3" stroke="currentColor"/><circle cx="12" cy="12" r="3" stroke="currentColor"/><path d="M12 5 L12 12 L16 14" stroke="currentColor"/></svg>
            <span class="nav-label">Progress</span>
        </div>
        <div class="nav-item" data-screen="settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5" stroke="currentColor"/><path d="M19.4 15 L17.6 18 M4.6 15 L6.4 18 M12 21 L12 17 M12 7 L12 3 M3 12 L7 12 M17 12 L21 12 M6.4 6 L8.2 9 M15.8 15 L17.6 18 M17.6 6 L15.8 9 M8.2 15 L6.4 18" stroke="currentColor" stroke-linecap="round"/></svg>
            <span class="nav-label">Settings</span>
        </div>
    </div>
    <!-- modal container -->
    <div id="modal" class="modal"><div class="modal-content" id="modalText"></div></div>
</div>

<script>
    (function() {
        // ---------- THEME & SCREENSHOT HELPERS ----------
        const phone = document.getElementById('phoneContainer');
        const appDiv = document.getElementById('app');
        const modal = document.getElementById('modal');
        const modalText = document.getElementById('modalText');

        // ---------- ICON SET (inline svg strings, outline style) ----------
        const icons = {
            profile: '<svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" fill="none"><path d="M4 21 C4 17 8 16 12 16 C16 16 20 17 20 21 M12 3 C14.5 3 16.5 5 16.5 8 C16.5 11 14.5 13 12 13 C9.5 13 7.5 11 7.5 8 C7.5 5 9.5 3 12 3 Z" /></svg>',
            check: '<svg viewBox="0 0 24 24" stroke="currentColor"><polyline points="4 13 9 18 20 6" /></svg>',
            play: '<svg viewBox="0 0 24 24" stroke="currentColor"><polygon points="5 3 19 12 5 21 5 3" fill="none"/></svg>',
            lesson: '<svg viewBox="0 0 24 24" stroke="currentColor"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="12" y2="17"/></svg>',
            chart: '<svg viewBox="0 0 24 24" stroke="currentColor"><path d="M21 21 L3 21 L3 3 M7 15 L10 10 L13 13 L18 7"/></svg>',
            flashcards: '<svg viewBox="0 0 24 24" stroke="currentColor"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="9" y1="6" x2="15" y2="6"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="12" y2="14"/></svg>',
        };

        // ---------- APP STATE ----------
        let currentScreen = 'onboarding';  // first forced onboarding
        let darkMode = false;

        // ---------- SCREEN RENDERERS ----------
        function renderOnboarding() {
            return `
                <div class="app-header">
                    <span class="screen-title">👋 Welcome</span>
                    <div class="profile-icon" onclick="window.navToSettings()">${icons.profile}</div>
                </div>
                <div class="card" style="text-align: center; padding: 32px 20px;">
                    <div style="font-size: 60px; margin-bottom: 8px;">🐍</div>
                    <h2 style="color: var(--text-primary); margin-bottom: 4px;">CodeFlow</h2>
                    <p style="color: var(--accent); font-weight: 600;">learn Python · zero to hero</p>
                    <p style="color: var(--text-secondary); margin: 16px 0;">Bite-sized exercises, real coding practice, and quizzes. Master Python in 2026.</p>
                    <button id="getStartedBtn">Get Started</button>
                    <div class="link-row">
                        <span onclick="window.showModal('Privacy: We never sell your data. Simple.');">Privacy Policy</span>
                        <span onclick="window.showModal('Terms: Use for learning only.');">Terms of Service</span>
                    </div>
                </div>
                <div style="height: 20px;"></div>
            `;
        }

        function renderHome() {
            const greet = darkMode ? '🌙' : '☀️';
            return `
                <div class="app-header">
                    <span class="screen-title">Dashboard</span>
                    <div class="profile-icon" onclick="window.navToSettings()">${icons.profile}</div>
                </div>
                <div class="card">
                    <div class="row-space"><span>🔥 Daily streak</span><span class="badge">12 days</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
                    <div style="display: flex; gap: 8px;">${icons.lesson} <span>Continue: Loops · 80%</span></div>
                </div>
                <div class="card">
                    <h3 style="margin-bottom: 12px;">Pick up where you left</h3>
                    <div class="lesson-item">${icons.play} <span>Functions deep dive</span></div>
                    <div class="lesson-item">${icons.flashcards} <span>OOP flashcards</span></div>
                    <div style="margin-top: 12px;"><button class="small" style="padding:10px">Resume last lesson</button></div>
                </div>
                <div style="background:var(--card); border-radius:24px; padding:16px;">🏆 Badges: 4 · next in 2 days</div>
            `;
        }

        function renderLearn() {
            return `
                <div class="app-header">
                    <span class="screen-title">Learn Python</span>
                    <div class="profile-icon" onclick="window.navToSettings()">${icons.profile}</div>
                </div>
                <div class="card">${icons.lesson} Basics · 5/8 completed <div class="progress-bar"><div class="progress-fill" style="width:62%"></div></div></div>
                <div class="card">${icons.flashcards} Data structures · 3/10 <div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div></div>
                <div class="card">${icons.lesson} Functions & modules · new <span class="badge">updated</span></div>
                <div class="card">${icons.play} Start practice: 20 min challenge →</div>
            `;
        }

        function renderProgress() {
            return `
                <div class="app-header">
                    <span class="screen-title">Statistics</span>
                    <div class="profile-icon" onclick="window.navToSettings()">${icons.profile}</div>
                </div>
                <div class="stat-grid">
                    <div class="stat-cell"><span style="font-size:24px;">42</span><br>lessons done</div>
                    <div class="stat-cell"><span style="font-size:24px;">8</span><br>hours</div>
                </div>
                <div class="card">${icons.chart} Weekly activity <div class="progress-bar"><div class="progress-fill" style="width:55%"></div></div></div>
                <div class="card">⭐️ XP today: 120 · next badge in 80 XP</div>
            `;
        }

        function renderSettings() {
            return `
                <div class="app-header">
                    <span class="screen-title">Settings</span>
                    <div class="profile-icon" onclick="window.navToSettings()">${icons.profile}</div>
                </div>
                <div class="card">
                    <div style="display: flex; align-items:center; justify-content:space-between;">
                        <span>🌙 Dark mode</span>
                        <label><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}></label>
                    </div>
                </div>
                <div class="card">Notification preferences</div>
                <div class="card">Account · user@pythonist</div>
                <div class="link-row" style="justify-content:flex-start;"><span onclick="window.showModal('App version 2.6.0 · Python build')">About</span></div>
            `;
        }

        // NAVIGATION
        window.navToSettings = function() { switchScreen('settings'); };
        function switchScreen(screenId) {
            if (screenId === 'settings') currentScreen = 'settings';
            else currentScreen = screenId;
            updateUI();
            updateActiveNav();
        }

        function updateActiveNav() {
            document.querySelectorAll('.nav-item').forEach(el => {
                const scr = el.dataset.screen;
                if (scr === currentScreen) el.classList.add('active');
                else el.classList.remove('active');
            });
        }

        function updateUI() {
            let html = '';
            if (currentScreen === 'onboarding') html = renderOnboarding();
            else if (currentScreen === 'home') html = renderHome();
            else if (currentScreen === 'learn') html = renderLearn();
            else if (currentScreen === 'progress') html = renderProgress();
            else if (currentScreen === 'settings') html = renderSettings();
            appDiv.innerHTML = html;

            // Attach listeners
            if (currentScreen === 'onboarding') {
                document.getElementById('getStartedBtn').addEventListener('click', ()=>{
                    currentScreen = 'home';
                    updateUI(); updateActiveNav();
                });
            }
            const darkToggle = document.getElementById('darkToggle');
            if (darkToggle) {
                darkToggle.checked = darkMode;
                darkToggle.addEventListener('change', (e) => {
                    darkMode = e.target.checked;
                    document.body.classList.toggle('dark', darkMode);
                    phone.style.background = 'transparent'; // inherits body var
                    // re-render settings only if we are there
                    if (currentScreen === 'settings') renderSettings();
                    else updateUI(); // refresh to show correct theme emoji? not needed
                    updateUI(); // ensure all cards re-color
                });
            }
        }

        window.showModal = function(text) {
            modalText.innerText = text;
            modal.style.display = 'flex';
            setTimeout(() => { modal.addEventListener('click', ()=>modal.style.display='none', {once:true}); });
        };

        // BOTTOM NAVIGATION CLICKS
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', (e) => {
                const targetScreen = item.dataset.screen;
                if (targetScreen === 'home' || targetScreen === 'learn' || targetScreen === 'progress' || targetScreen === 'settings') {
                    currentScreen = targetScreen;
                    updateUI();
                    updateActiveNav();
                }
            });
        });

        // ---------- SCREENSHOT FEATURE (SHIFT+W) ----------
        function downloadScreenshot(filename) {
            const node = document.getElementById('phoneContainer');
            html2canvas?.(node, { scale: 2, backgroundColor: null }).then(canvas => {
                const link = document.createElement('a');
                link.download = filename;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(() => alert('html2canvas not loaded — but this is a prototype, normally works.'));
        }

        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                const themePart = darkMode ? '6' : '1';
                // map screens: but we just need generic sequential from current?
                // The requirement: shift+w captures phone as 1.png ... 6.png if dark mode. we just generate based on theme.
                // Use counter? but simpler: always save as 1.png if light, 6.png if dark. but spec says sequentially? we'll use current screen + theme.
                // For demo: we generate 1.png for light, 6.png for dark.
                const fname = darkMode ? '6.png' : '1.png';
                downloadScreenshot(fname);
            }
        });

        // Inject html2canvas library (required)
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        script.onload = () => console.log('screenshot ready');
        document.head.appendChild(script);

        // Start with onboarding
        currentScreen = 'onboarding';
        updateUI();
        updateActiveNav();
        // Ensure theme starts light
        document.body.classList.remove('dark');
    })();
</script>

<!-- extra script to ensure bottom nav active after navigation -->
<script>
    (function secondary() {
        // minor fix for darkmode variable sync
        let originalUpdate = window.updateUI;
        window.updateUI = function() {
            if (typeof originalUpdate === 'function') originalUpdate();
            document.querySelectorAll('.nav-item').forEach(el => {
                const scr = el.dataset.screen;
                if (scr === window.currentScreen) el.classList.add('active');
                else el.classList.remove('active');
            });
        };
        // make sure getStarted works
        document.addEventListener('click', function(e) {
            if (e.target.id === 'getStartedBtn') {
                window.currentScreen = 'home';
                window.updateUI();
            }
        });
    })();
</script>
