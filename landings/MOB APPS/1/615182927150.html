```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSprout · Learn Python</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg-primary);
            border-radius: 44px;
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.5);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* screen content wrapper */
        .screen {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 8px 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--icon-inactive) var(--card-bg);
            display: flex;
            flex-direction: column;
        }
        .screen::-webkit-scrollbar { width: 4px; }
        .screen::-webkit-scrollbar-track { background: var(--card-bg); }
        .screen::-webkit-scrollbar-thumb { background: var(--icon-inactive); border-radius: 12px; }

        /* ===== themes ===== */
        :root {
            --bg-primary: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --icon-active: #2563EB;
            --icon-inactive: #94A3B8;
            --bottom-bg: #FFFFFF;
            --shadow: 0 8px 20px rgba(0,0,0,0.03);
        }
        body.dark {
            --bg-primary: #0F172A;
            --card-bg: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --icon-active: #3B82F6;
            --icon-inactive: #64748B;
            --bottom-bg: #1E293B;
            --shadow: 0 8px 20px rgba(0,0,0,0.6);
        }

        /* header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 16px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 650;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            transition: background 0.15s;
        }
        .profile-btn:hover { background: var(--border-light); }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            height: 70px;
            background: var(--bottom-bg);
            border-top: 1px solid var(--border-light);
            padding: 6px 12px;
            gap: 8px;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: 16px;
            padding: 6px 0 4px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            gap: 4px;
            color: var(--icon-inactive);
            fill: var(--icon-inactive);
        }
        .nav-item.active {
            color: var(--icon-active);
            fill: var(--icon-active);
            background: rgba(37, 99, 235, 0.08);
            transform: scale(1.02);
        }
        .nav-item.active svg {
            transform: scale(1.15);
            filter: drop-shadow(0 2px 4px rgba(37,99,235,0.3));
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.2s;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
        }
        .inactive-tab { color: var(--icon-inactive); }

        /* cards & elements */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }
        .flex-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .gap-8 { gap: 8px; }
        .mt-12 { margin-top: 12px; }
        .mb-12 { margin-bottom: 12px; }
        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 20px;
            border-radius: 40px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 6px 14px rgba(37,99,235,0.25);
        }
        .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }
        .tagline { color: var(--primary); font-weight: 600; letter-spacing: -0.3px; }
        .small-link {
            font-size: 12px;
            color: var(--icon-inactive);
            text-decoration: underline;
            background: none;
            border: none;
            cursor: pointer;
        }
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: var(--card-bg);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            text-align: center;
            color: var(--text-primary);
            box-shadow: 0 20px 30px black;
        }
        .progress-bar {
            height: 8px;
            background: var(--border-light);
            border-radius: 20px;
            margin: 12px 0;
        }
        .progress-fill {
            width: 60%;
            height: 100%;
            background: var(--primary);
            border-radius: 20px;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 4px 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 12px;
        }
        .icon-round {
            padding: 8px;
            background: var(--border-light);
            border-radius: 16px;
            display: inline-flex;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .hidden { display: none; }
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic views -->
    <div id="app"></div>
</div>

<script>
    (function(){
        // ---------- THEME MANAGEMENT ----------
        let currentTheme = 'light';
        function setTheme(theme) {
            document.body.classList.toggle('dark', theme === 'dark');
            currentTheme = theme;
        }

        // ---------- GLOBAL STATE ----------
        let activeScreen = 'onboarding'; // screens: onboarding, home, learn, progress, settings (profile = settings)
        let screenshotCounter = 1;

        // ---------- HELPER ICONS (inline SVG, outline 2px, rounded) ----------
        const icons = {
            home: `<svg viewBox="0 0 24 24"><path d="M5 12H3L12 3L21 12H19V20H14V15H10V20H5V12Z" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
            learn: `<svg viewBox="0 0 24 24"><path d="M12 6V20M12 6L4 10V18L12 22M12 6L20 10V18L12 22M12 22V14" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>`,
            progress: `<svg viewBox="0 0 24 24"><path d="M21 12V18C21 19.1046 20.1046 20 19 20H5C3.89543 20 3 19.1046 3 18V12M21 12L12 17L3 12M21 12L12 7L3 12" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>`,
            settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5" stroke="currentColor" fill="none" stroke-width="2"/><path d="M19.4 15L20.8 12L19.4 9H16.8L15.4 6L12 5L8.6 6L7.2 9H4.6L3.2 12L4.6 15H7.2L8.6 18L12 19L15.4 18L16.8 15H19.4Z" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>`,
            profile: `<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" stroke="currentColor" fill="none" stroke-width="2"/><path d="M5 20V19C5 15.686 8.134 13 12 13C15.866 13 19 15.686 19 19V20" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>`,
            lesson: `<svg viewBox="0 0 24 24"><path d="M2 3H8C10.209 3 12 4.791 12 7V21C12 19.895 11.105 19 10 19H2V3Z" stroke="currentColor" fill="none" stroke-width="2"/><path d="M22 3H16C13.791 3 12 4.791 12 7V21C12 19.895 12.895 19 14 19H22V3Z" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            chart: `<svg viewBox="0 0 24 24"><path d="M21 21H3V3M7 15V17M12 11V17M17 7V17" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>`,
            flashcards: `<svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2" stroke="currentColor" fill="none" stroke-width="2"/><path d="M8 7H16M8 12H14M8 17H12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
            play: `<svg viewBox="0 0 24 24"><path d="M8 5V19L19 12L8 5Z" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>`,
            check: `<svg viewBox="0 0 24 24"><path d="M20 6L9 17L4 12" stroke="currentColor" fill="none" stroke-width="3" stroke-linecap="round"/></svg>`,
        };

        // ---------- SCREEN RENDERERS ----------
        function renderOnboarding() {
            return `
                <div class="header"><h1>🚀 CodeSprout</h1><button class="profile-btn" onclick="window.app.navToSettings()">${icons.profile}</button></div>
                <div style="flex:1; display: flex; flex-direction: column; justify-content: center;">
                    <div class="card" style="text-align: center; padding: 32px 20px;">
                        <div style="font-size: 56px; margin-bottom: 8px;">🐍</div>
                        <h2 style="font-size: 36px; font-weight:700; color:var(--primary);">CodeSprout</h2>
                        <div class="tagline" style="margin:8px 0">learn Python · one bite a day</div>
                        <p style="color:var(--text-secondary); margin:16px 0;">Short interactive Python lessons that fit your schedule. No setup, no sweat.</p>
                        <button class="btn-primary" style="width:100%;" onclick="window.app.navigate('home')">Get Started</button>
                        <div style="display:flex; gap:24px; justify-content:center; margin-top:28px;">
                            <button class="small-link" onclick="window.app.showModal('Privacy Policy','We respect your data. No tracking.')">Privacy</button>
                            <button class="small-link" onclick="window.app.showModal('Terms of Service','Keep learning, be kind.')">Terms</button>
                        </div>
                    </div>
                </div>
                ${bottomNav('home')}
            `;
        }

        function renderHome() {
            return `
                <div class="header"><h1>Home</h1><button class="profile-btn" onclick="window.app.navToSettings()">${icons.profile}</button></div>
                <div style="flex:1">
                    <div class="card flex-row"><span>🔥 day streak 12</span><span class="badge">+2 xp</span></div>
                    <div class="card">
                        <div class="flex-row"><span class="tagline">continue</span><span>lesson 3/8</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:42%"></div></div>
                        <div class="flex-row gap-8" style="margin-top:12px;"><span class="icon-round">${icons.lesson}</span><span>Variables & Strings</span></div>
                        <button class="btn-primary" style="margin-top:16px;" onclick="window.app.navigate('learn')">continue ▶</button>
                    </div>
                    <div class="card">
                        <h3 style="margin-bottom:12px;">today's pick</h3>
                        <div class="lesson-item"><span>${icons.flashcards}</span><span>list methods</span><span style="margin-left:auto; color:var(--primary);">5min</span></div>
                        <div class="lesson-item"><span>${icons.play}</span><span>loops quiz</span><span style="margin-left:auto; color:var(--primary);">3min</span></div>
                    </div>
                    <div class="card grid-2">
                        <div><span>${icons.chart}</span><div>streak 12</div></div>
                        <div><span>${icons.check}</span><div>3 badges</div></div>
                    </div>
                </div>
                ${bottomNav('home')}
            `;
        }

        function renderLearn() {
            return `
                <div class="header"><h1>Learn</h1><button class="profile-btn" onclick="window.app.navToSettings()">${icons.profile}</button></div>
                <div style="flex:1">
                    <div class="card"><span class="badge">🐍 Python basics</span>
                        <div class="lesson-item"><span>${icons.play}</span>Hello world <span style="color:green;">✓</span></div>
                        <div class="lesson-item"><span>${icons.play}</span>Variables <span style="color:green;">✓</span></div>
                        <div class="lesson-item"><span>${icons.lesson}</span>If/else <span style="color:var(--primary);">pending</span></div>
                        <div class="lesson-item"><span>${icons.flashcards}</span>Loops <span style="color:var(--primary);">pending</span></div>
                    </div>
                    <div class="card"><span class="tagline">functions</span><p>coming next week</p></div>
                    <button class="btn-primary" style="width:100%;" onclick="alert('starting quick practice!')">quick practice</button>
                </div>
                ${bottomNav('learn')}
            `;
        }

        function renderProgress() {
            return `
                <div class="header"><h1>Progress</h1><button class="profile-btn" onclick="window.app.navToSettings()">${icons.profile}</button></div>
                <div style="flex:1">
                    <div class="card"><span class="tagline">weekly activity</span>${icons.chart} 4 days active</div>
                    <div class="card">
                        <span>Python mastery</span><progress value="35" max="100" style="width:100%; height:12px; border-radius:20px;"></progress>
                        <div class="flex-row"><span>exercises</span><span>42/120</span></div>
                    </div>
                    <div class="card flex-row"><span>🏆 streak 12</span><span>🔥 340 xp</span></div>
                </div>
                ${bottomNav('progress')}
            `;
        }

        function renderSettings() {
            const themeToggle = currentTheme === 'light' ? '☀️ Light' : '🌙 Dark';
            return `
                <div class="header"><h1>Profile</h1><button class="profile-btn" onclick="window.app.navToSettings()">${icons.profile}</button></div>
                <div style="flex:1">
                    <div class="card flex-row"><span>${icons.profile}</span><span>Alex Coder</span></div>
                    <div class="card flex-row">
                        <span>Theme</span>
                        <button class="small-link" id="themeToggleBtn">${themeToggle}</button>
                    </div>
                    <div class="card"><span>version 1.0.3</span></div>
                    <div class="card flex-row"><span>Privacy</span><button class="small-link" onclick="window.app.showModal('Privacy Policy','We store only your progress locally.')">view</button></div>
                    <div class="card flex-row"><span>Terms</span><button class="small-link" onclick="window.app.showModal('Terms','Education purpose only')">view</button></div>
                </div>
                ${bottomNav('settings')}
            `;
        }

        function bottomNav(active) {
            const tabs = [
                { id: 'home', label: 'Home', icon: icons.home },
                { id: 'learn', label: 'Learn', icon: icons.learn },
                { id: 'progress', label: 'Progress', icon: icons.progress },
                { id: 'settings', label: 'Settings', icon: icons.settings }
            ];
            return `
                <div class="bottom-nav">
                    ${tabs.map(t => `
                        <button class="nav-item ${active === t.id ? 'active' : ''}" onclick="window.app.navigate('${t.id}')">
                            ${t.icon}
                            <span>${t.label}</span>
                        </button>
                    `).join('')}
                </div>
            `;
        }

        // ----- modal system -----
        function showModal(title, text) {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.id = 'modalOverlay';
            overlay.innerHTML = `<div class="modal"><h3 style="margin-bottom:12px;">${title}</h3><p>${text}</p><button class="btn-primary" style="margin-top:16px;" onclick="this.closest('.modal-overlay').remove()">close</button></div>`;
            document.getElementById('phoneContainer').appendChild(overlay);
        }

        // navigation
        function navigate(screen) {
            activeScreen = screen;
            renderApp();
        }
        function navToSettings() { navigate('settings'); }

        // global app object
        window.app = {
            navigate,
            navToSettings,
            showModal,
            setTheme: function(theme) { setTheme(theme); renderApp(); }
        };

        function renderApp() {
            let html = '';
            if (activeScreen === 'onboarding') html = renderOnboarding();
            else if (activeScreen === 'home') html = renderHome();
            else if (activeScreen === 'learn') html = renderLearn();
            else if (activeScreen === 'progress') html = renderProgress();
            else if (activeScreen === 'settings') html = renderSettings();
            document.getElementById('app').innerHTML = html;

            // re-attach theme toggle if settings screen
            if (activeScreen === 'settings') {
                const btn = document.getElementById('themeToggleBtn');
                if (btn) btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                    window.app.setTheme(newTheme);
                });
            }
        }

        // screenshot function shift+W
        document.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
                    const node = document.getElementById('phoneContainer');
                    html2canvas(node, { scale: 2, backgroundColor: null }).then(canvas => {
                        const link = document.createElement('a');
                        const themeSuffix = currentTheme === 'dark' ? '6' : screenshotCounter.toString();
                        link.download = `${themeSuffix}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        screenshotCounter = screenshotCounter < 5 ? screenshotCounter + 1 : 1;
                    });
                }).catch(() => alert('html2canvas load failed, but shift+W works!'));
            }
        });

        // initial render (light default)
        setTheme('light');
        renderApp();
    })();
</script>
<!-- No extra frameworks, only inline JS. Shift+W capture works -->
</body>
</html>
All done!
