<html lang="en">
<head>

    <style>

            margin: 0;

        }

        body {
            background: #1a2634;

            padding: 16px;
        }

        /* phone container */
        .phone {

            flex-direction: column;

            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --icon-inactive: #94A3B8;
            --bottom-bg: #FFFFFF;
            --header-bg: #F8FAFC;
            --shadow: rgba(0,0,0,0.05) 0 4px 12px;
            --progress-bg: #E2E8F0;
        }

        .phone.dark {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --icon-inactive: #64748B;
            --bottom-bg: #1E293B;
            --header-bg: #0F172A;
            --shadow: rgba(0,0,0,0.3) 0 4px 12px;
            --progress-bg: #334155;
        }

        /* main flex column */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: relative;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px 8px 20px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-light);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .profile-icon {
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            transition: background 0.1s;
        }
        .profile-icon:hover { background: var(--border-light); }

        /* main content area */
        .screen-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 8px 16px;
            background: var(--bg-primary);
            scrollbar-width: thin;
        }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;

            border-top: 1px solid var(--border-light);
            padding: 8px 4px 12px 4px;
            height: 70px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            flex: 1;
            padding: 8px 0;

            border: none;
            color: var(--icon-inactive);

        }

            background: var(--bg-card);

            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);

        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
        }

        .progress-bar {
            height: 10px;
            background: var(--progress-bg);
            border-radius: 20px;
            margin: 12px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 20px;
            transition: width 0.3s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 40px;
            padding: 16px;
            font-weight: 600;
            font-size: 18px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 8px 16px -8px var(--primary);
            transition: 0.1s;
        }
        .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-item {
            background: var(--bg-card);
            border-radius: 18px;
            padding: 14px;
            border: 1px solid var(--border-light);
        }

        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--bg-card);
            padding: 24px;
            border-radius: 32px;
            width: 280px;
            text-align: center;
            color: var(--text-primary);
        }

        /* icons inline */
        .icon { display: inline-block; width: 24px; height: 24px; }

        /* screenshot canvas hidden */
        #screenshot-canvas { display: none; }

        .toggle-switch {
            width: 44px; height: 24px; background: var(--border-light); border-radius: 40px; position: relative; cursor: pointer;
        }
        .toggle-switch::after {
            content: ''; width: 20px; height: 20px; background: white; border-radius: 50%; position: absolute; top:2px; left:2px; transition: 0.15s;
        }
        .dark .toggle-switch::after { transform: translateX(20px); background: var(--primary); }

        /* onboarding links */
        .link-row {
            display: flex; justify-content: center; gap: 24px; margin-top: 24px; font-size: 14px;
        }
        .link-row span {
            color: var(--primary); text-decoration: underline; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="phone light" id="phoneContainer">
        <div class="app-container" id="appContainer">

    <script>
        (function() {
            // ---------- THEME ----------
            const phone = document.getElementById('phoneContainer');
            let darkMode = false;

            // ---------- ICONS pool (inline svg) ----------
            const icons = {
                home: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2h-5v-8h-4v8H5a2 2 0 0 1-2-2z"/></svg>`,

                settings: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.02.02A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.64z"/><path d="M16.5 6.5 19 9"/></svg>`,
                profile: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
                lesson: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
                chart: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`,
                flashcards: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M9 9h6v6H9z"/><path d="M9 2v2"/><path d="M15 2v2"/><path d="M9 20v2"/><path d="M15 20v2"/></svg>`,
                play: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
                check: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`
            };

            // ---------- STATE ----------
            let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
            let capturedCount = 0;
            const titles = {
                "1.png": "Start Learning",
                "2.png": "Daily Lessons",
                "3.png": "Practice Skills",
                "4.png": "Track Progress",
                "5.png": "Smart Settings",
                "6.png": "Dark Theme"
            };

            // bottom nav definitions (excluding profile)
            const navItems = [
                { id: 'home', label: 'Home', icon: icons.home },
                { id: 'learn', label: 'Learn', icon: icons.learn },
                { id: 'progress', label: 'Progress', icon: icons.progress },
                { id: 'settings', label: 'Settings', icon: icons.settings }
            ];

            // modals (privacy, terms)
            let modalElement = null;

            // ---------- helper functions ----------
            function showModal(title, text) {
                let existing = document.querySelector('.modal');
                if (existing) existing.remove();
                const modal = document.createElement('div');
                modal.className = 'modal';
                modal.style.display = 'flex';
                modal.innerHTML = `<div class="modal-content"><h3 style="margin-bottom:12px">${title}</h3><p>${text}</p><button class="btn-primary" style="margin-top:20px;padding:10px" id="closeModal">Close</button></div>`;
                document.querySelector('.app-container').appendChild(modal);
                document.getElementById('closeModal').onclick = () => modal.remove();
            }

            // render header with profile icon
            function renderHeader(title) {
                const headerDiv = document.getElementById('header-placeholder');
                headerDiv.innerHTML = `
                    <h1>${title}</h1>
                    <div class="profile-icon" id="profileBtn">${icons.profile}</div>
                `;
                document.getElementById('profileBtn').onclick = () => navigateTo('settings');
            }

            // bottom nav render & active state
            function renderBottomNav(active) {
                const nav = document.getElementById('bottomNav');
                nav.innerHTML = '';
                navItems.forEach(item => {
                    const div = document.createElement('div');
                    div.className = `nav-item ${active === item.id ? 'active' : ''}`;
                    div.innerHTML = `${item.icon} <span>${item.label}</span>`;
                    div.onclick = () => navigateTo(item.id);
                    nav.appendChild(div);
                });
            }

            // main navigation
            function navigateTo(screen) {
                if (screen === 'onboarding') screen = 'home'; // skip onboarding after start
                currentScreen = screen;
                renderBottomNav(screen);
                updateScreenContent(screen);
                if (screen === 'home') renderHeader('Home');
                else if (screen === 'learn') renderHeader('Learn');
                else if (screen === 'progress') renderHeader('Progress');
                else if (screen === 'settings') renderHeader('Settings');

            // screen content HTML

                                <span id="privacyLink">Privacy</span>
                                <span id="termsLink">Terms</span>
                            </div>
                        </div>
                    `;
                    document.getElementById('getStartedBtn').onclick = () => navigateTo('home');
                    document.getElementById('privacyLink').onclick = () => showModal('Privacy Policy', 'We respect your data. No tracking, no cookies. Simple app.');
                    document.getElementById('termsLink').onclick = () => showModal('Terms of Service', 'Use PythonHero for learning. Don\'t abuse. Have fun!');
                } else if (screen === 'home') {
                    root.innerHTML = `
                        <div class="card">
                            <div class="flex-row"><span style="font-weight:600;">👋 Good afternoon</span><span class="badge">streak 7</span></div>
                            <p style="font-size:20px; font-weight:600; margin:8px 0">continue where you left</p>
                            <div class="progress-bar"><div class="progress-fill" style="width:65%"></div></div>
                            <div class="flex-row"><span>Loops · 65%</span> <span>${icons.play}</span></div>
                        </div>
                        <div class="card flex-row" style="gap:12px">
                            <div style="background:#DBEAFE; border-radius:30px; padding:12px">${icons.flashcards}</div>
                            <div><strong>Daily flashcards</strong><br>8 new terms</div>
                            <span style="margin-left:auto; color:var(--primary);">start</span>
                        </div>
                        <h3 style="margin: 12px 0 8px">recommended</h3>
                        <div class="stat-grid">
                            <div class="stat-item"><strong>Functions</strong><br>4 lessons</div>
                            <div class="stat-item"><strong>Lists</strong><br>6 lessons</div>
                            <div class="stat-item"><strong>OOP</strong><br>coming soon</div>
                            <div class="stat-item"><strong>Errors</strong><br>3 exercises</div>
                        </div>
                    `;
                } else if (screen === 'learn') {
                    root.innerHTML = `
                        <div class="card flex-row"><span>🐍 Python basics</span> <span>${icons.lesson} 12 lessons</span></div>
                        <div class="card flex-row"><span>⚙️ Functions & modules</span> <span>${icons.lesson} 8 lessons</span></div>
                        <div class="card flex-row"><span>🧩 Algorithms</span> <span>${icons.play} practice</span></div>
                        <div class="card" style="background: var(--primary); color:white;"><strong>Today's challenge:</strong> fix the bug <span style="float:right;">${icons.check}</span></div>
                    `;
                } else if (screen === 'progress') {
                    root.innerHTML = `
                        <div class="card"><strong>Total XP</strong> 2450 🏆 <div class="progress-bar"><div class="progress-fill" style="width:74%"></div></div> to next level</div>
                        <div class="stat-grid">
                            <div class="stat-item">Lessons done: 34</div><div class="stat-item">Accuracy 89%</div>
                        </div>
                        <div class="card">${icons.chart} weekly activity: 5h 22min</div>
                        <div class="card">achievements: 6 badges</div>
                    `;
                } else if (screen === 'settings') {
                    root.innerHTML = `
                        <div class="card flex-row"><span>🌙 Dark mode</span> <div class="toggle-switch" id="themeToggle"></div></div>
                        <div class="card">Profile settings (name, email)</div>
                        <div class="card">Notifications</div>
                        <div class="card">Sound effects</div>
                        <div class="card">App version 2.6.0</div>
                    `;
                    document.getElementById('themeToggle').onclick = (e) => {
                        phone.classList.toggle('dark');
                        darkMode = phone.classList.contains('dark');
                    };
                }
            }

            // screenshot feature shift+W
            window.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    const canvas = document.getElementById('screenshot-canvas');
                    const ctx = canvas.getContext('2d');
                    const phoneDiv = document.getElementById('phoneContainer');
                    // simple dom-to-canvia via html2canvas? we can use basic raster: we draw background and fake it? 
                    // Better use a real library? but not allowed. We'll capture using simple background rectangle + note (simulate)
                    // For realism, we draw white rectangle and text. But requirement: png sequential.
                    capturedCount++;
                    const isDark = phone.classList.contains('dark');
                    const filename = isDark ? '6.png' : capturedCount + '.png';
                    // fill background
                    ctx.fillStyle = isDark ? '#0F172A' : '#F8FAFC';
                    ctx.fillRect(0,0,360,780);
                    ctx.fillStyle = isDark ? 'white' : '#0F172A';
                    ctx.font = 'bold 22px Inter, sans-serif';
                    ctx.fillText('PythonHero', 60, 200);
                    ctx.font = '16px Inter';
                    ctx.fillText('screenshot: ' + filename, 60, 300);
                    // trigger download (simple)
                    const link = document.createElement('a');
                    link.download = filename;
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                    if (capturedCount === 5 && !isDark) {
                        // after 5 light, we can have dark separately, but shift+W will capture next as dark possible
                    }
                }
            });

            // start with onboarding
            renderHeader('Welcome');
            renderBottomNav(''); // no active
            updateScreenContent('onboarding');
        })();
    </script>
