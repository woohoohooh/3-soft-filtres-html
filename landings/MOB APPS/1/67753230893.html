```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Brain Trainer · prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #1a2639;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg-primary);
            border-radius: 44px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px rgba(255,255,255,0.05);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s;
        }
        /* light mode default */
        :root {
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --shadow: 0 4px 12px rgba(0,0,0,0.04);
            --bottom-bar: #FFFFFF;
        }
        body.dark {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --shadow: 0 4px 12px rgba(0,0,0,0.6);
            --bottom-bar: #1E293B;
        }
        /* main flex container */
        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        /* header */
        .header {
            padding: 16px 20px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-btn svg {
            width: 28px;
            height: 28px;
            stroke: var(--text-primary);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        /* main content */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) transparent;
        }
        .content::-webkit-scrollbar {
            width: 4px;
        }
        .content::-webkit-scrollbar-thumb {
            background-color: var(--inactive);
            border-radius: 8px;
        }
        /* bottom nav */
        .bottom-nav {
            background: var(--bottom-bar);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px;
            backdrop-filter: blur(4px);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 6px 0 4px;
            border-radius: 16px;
            color: var(--inactive);
        }
        .nav-item.active {
            color: var(--primary);
        }
        .nav-item.active .nav-icon {
            transform: scale(1.1);
            stroke: var(--primary);
            filter: drop-shadow(0 2px 6px rgba(37,99,235,0.3));
        }
        .nav-item.active .nav-label {
            font-weight: 600;
            color: var(--primary);
        }
        .nav-item .nav-icon {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.15s;
        }
        .nav-label {
            font-size: 12px;
            margin-top: 2px;
            font-weight: 500;
            color: currentColor;
        }
        /* onboarding specific */
        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 30px 0 16px;
        }
        .app-logo {
            background: linear-gradient(145deg, var(--primary), var(--accent));
            width: 80px;
            height: 80px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .app-name {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }
        .tagline {
            font-size: 18px;
            color: var(--primary);
            font-weight: 500;
            margin: 8px 0 12px;
        }
        .description {
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.4;
            max-width: 280px;
            margin: 0 auto 28px;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 40px;
            box-shadow: 0 10px 20px -5px rgba(37,99,235,0.4);
            transition: 0.1s;
            cursor: pointer;
        }
        .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }
        .legal-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 20px 0 10px;
        }
        .legal-link {
            background: none;
            border: none;
            color: var(--inactive);
            font-size: 14px;
            text-decoration: underline;
            cursor: pointer;
        }
        /* modal */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--bg-card);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            color: var(--text-primary);
            box-shadow: var(--shadow);
        }
        .modal-content h3 { margin-bottom: 12px; }
        .modal-close {
            margin-top: 20px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        /* cards / dashboard */
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 18px;
            margin-bottom: 18px;
            box-shadow: var(--shadow);
        }
        .row-space {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 4px 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
        }
        .progress-bar {
            background: var(--border-light);
            height: 8px;
            border-radius: 20px;
            width: 100%;
            margin: 12px 0;
        }
        .progress-fill {
            background: var(--primary);
            width: 65%;
            height: 8px;
            border-radius: 20px;
            transition: width 0.3s;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-item {
            background: var(--bg-primary);
            border-radius: 20px;
            padding: 14px;
            text-align: center;
        }
        .stat-number {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
        }
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .lesson-icon svg {
            width: 36px;
            height: 36px;
            stroke: var(--primary);
            stroke-width: 2;
        }
        .start-practice {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 40px;
            padding: 12px 24px;
            font-weight: 600;
            cursor: pointer;
            margin: 16px 0 8px;
            width: fit-content;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <div class="app" id="app">
        <!-- header dynamically set by js -->
        <div class="header" id="appHeader">
            <h2 id="headerTitle">Math Brain</h2>
            <button class="profile-btn" id="profileBtn"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>
        </div>

        <!-- main content views -->
        <div class="content" id="contentView"></div>

        <!-- bottom nav (4 items) -->
        <nav class="bottom-nav" id="bottomNav">
            <button class="nav-item" data-screen="home"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="nav-label">Home</span></button>
            <button class="nav-item" data-screen="learn"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span class="nav-label">Learn</span></button>
            <button class="nav-item" data-screen="progress"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg><span class="nav-label">Progress</span></button>
            <button class="nav-item" data-screen="settings"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.05A10 10 0 0 0 12 18a10 10 0 0 0 6.22-2.2z"/><path d="M16.5 6.5 19 9"/><path d="M7.5 6.5 5 9"/></svg><span class="nav-label">Settings</span></button>
        </nav>
    </div>

    <!-- modal container (hidden) -->
    <div id="modalContainer" class="modal-overlay hidden"><div class="modal-content" id="modalInner"><h3 id="modalTitle">Title</h3><p id="modalText">...</p><button class="modal-close" id="closeModal">Close</button></div></div>
</div>

<script>
    (function() {
        // ---------- Icon system (inline svg definitions) ----------
        const icons = {
            home: '<svg viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
            learn: '<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
            progress: '<svg viewBox="0 0 24 24"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>',
            settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.05A10 10 0 0 0 12 18a10 10 0 0 0 6.22-2.2z"/><path d="M16.5 6.5 19 9"/><path d="M7.5 6.5 5 9"/></svg>',
            profile: '<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
            lesson: '<svg viewBox="0 0 24 24"><path d="M12 6v12"/><path d="M8 10v6"/><path d="M16 8v8"/><circle cx="12" cy="12" r="10"/></svg>',
            chart: '<svg viewBox="0 0 24 24"><path d="M21 21H4V4"/><path d="M7 15v4"/><path d="M11 11v8"/><path d="M15 8v11"/><path d="M19 5v14"/></svg>',
            flashcards: '<svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 7h8"/><path d="M8 12h6"/><path d="M8 17h4"/></svg>',
            play: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4V8z"/></svg>',
            check: '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>'
        };

        // App state
        let currentScreen = 'onboarding';
        let darkMode = false;
        let screenshotCounter = 0;

        // DOM elements
        const headerTitle = document.getElementById('headerTitle');
        const contentDiv = document.getElementById('contentView');
        const navItems = document.querySelectorAll('.nav-item');
        const profileBtn = document.getElementById('profileBtn');
        const modalContainer = document.getElementById('modalContainer');
        const modalTitle = document.getElementById('modalTitle');
        const modalText = document.getElementById('modalText');
        const closeModal = document.getElementById('closeModal');
        const phone = document.getElementById('phoneContainer');

        // Helper: show modal
        function showModal(title, text) {
            modalTitle.innerText = title;
            modalText.innerText = text;
            modalContainer.classList.remove('hidden');
        }

        closeModal.addEventListener('click', () => modalContainer.classList.add('hidden'));

        // Screenshot capture (shift+W)
        document.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm').then(html2canvas => {
                    html2canvas.default(phone, { scale: 2 }).then(canvas => {
                        const link = document.createElement('a');
                        screenshotCounter++;
                        const isDark = document.body.classList.contains('dark');
                        let filename = isDark ? '6.png' : (screenshotCounter + '.png');
                        if (isDark) screenshotCounter = 6; // ensure naming but we keep simple
                        else if (screenshotCounter > 5) screenshotCounter = 1;
                        link.download = isDark ? '6.png' : screenshotCounter + '.png';
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    });
                }).catch(console.error);
            }
        });

        // theme toggle
        function toggleTheme() {
            darkMode = !darkMode;
            if (darkMode) document.body.classList.add('dark');
            else document.body.classList.remove('dark');
            renderScreen(currentScreen); // refresh UI
        }

        // --- Render functions per screen ---
        function renderOnboarding() {
            headerTitle.innerText = 'Welcome';
            contentDiv.innerHTML = `
                <div class="logo-area">
                    <div class="app-logo"><svg width="48" height="48" viewBox="0 0 24 24" stroke="#FFFFFF" stroke-width="2" fill="none"><path d="M12 2L2 7v10l10 5 10-5V7l-10-5z"/><path d="M12 12l4-2v4l-4 2-4-2v-4l4 2z"/></svg></div>
                    <div class="app-name">Math Brain</div>
                    <div class="tagline">train your mental math</div>
                    <div class="description">Quick daily workouts to sharpen arithmetic. Adaptive challenges & brain games.</div>
                </div>
                <button class="btn-primary" id="getStartedBtn">Get Started</button>
                <div class="legal-links">
                    <button class="legal-link" id="privacyBtn">Privacy Policy</button>
                    <button class="legal-link" id="termsBtn">Terms of Service</button>
                </div>
            `;
            document.getElementById('getStartedBtn')?.addEventListener('click', () => { currentScreen = 'home'; renderScreen('home'); setActiveNav('home'); });
            document.getElementById('privacyBtn')?.addEventListener('click', () => showModal('Privacy Policy', 'Your data stays on device. No tracking.'));
            document.getElementById('termsBtn')?.addEventListener('click', () => showModal('Terms of Service', 'Use Math Brain for personal learning only.'));
        }

        function renderHome() {
            headerTitle.innerText = 'Home';
            contentDiv.innerHTML = `
                <div class="card">
                    <div class="row-space"><span class="badge">🔥 streak 7 days</span><span>⚡ 230 XP</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
                    <p style="color: var(--text-secondary)">70% to next level</p>
                </div>
                <div class="card">
                    <h3 style="margin-bottom:12px">Daily brain workout</h3>
                    <div class="lesson-item">
                        <span class="lesson-icon">${icons.play}</span>
                        <div><strong>Quick 5 min</strong><p>addition & multiplication</p></div>
                    </div>
                    <div class="lesson-item">
                        <span class="lesson-icon">${icons.flashcards}</span>
                        <div><strong>Mental math cards</strong><p>train speed</p></div>
                    </div>
                    <button class="start-practice" id="homePracticeBtn">Start practice</button>
                </div>
                <div class="card"><h3>Recommended for you</h3><div class="stat-grid"><div class="stat-item"><span class="stat-number">24</span><p>problems left</p></div><div class="stat-item"><span class="stat-number">8</span><p>badges</p></div></div></div>
            `;
            document.getElementById('homePracticeBtn')?.addEventListener('click', () => { currentScreen = 'learn'; renderScreen('learn'); setActiveNav('learn'); });
        }

        function renderLearn() {
            headerTitle.innerText = 'Learn';
            contentDiv.innerHTML = `
                <div class="card"><h3>Arithmetic foundations</h3>
                    <div class="lesson-item"><span class="lesson-icon">${icons.lesson}</span><div><strong>Lesson 1: Speed addition</strong><p>3 exercises</p></div></div>
                    <div class="lesson-item"><span class="lesson-icon">${icons.lesson}</span><div><strong>Lesson 2: Times tables</strong><p>5 exercises</p></div></div>
                    <div class="lesson-item"><span class="lesson-icon">${icons.flashcards}</span><div><strong>Flashcards: division</strong><p>20 cards</p></div></div>
                    <button class="start-practice" id="learnPracticeBtn">Practice all</button>
                </div>
            `;
            document.getElementById('learnPracticeBtn')?.addEventListener('click', () => alert('Starting mixed practice! (demo)'));
        }

        function renderProgress() {
            headerTitle.innerText = 'Progress';
            contentDiv.innerHTML = `
                <div class="card"><h3>Last 7 days</h3>${icons.chart}
                    <div style="display:flex; gap:6px; margin:12px 0;"><div style="height:40px; width:20%; background:var(--primary); border-radius:12px;"></div><div style="height:60px; width:20%; background:var(--primary);"></div><div style="height:30px; width:20%; background:var(--primary);"></div><div style="height:70px; width:20%; background:var(--primary);"></div><div style="height:50px; width:20%; background:var(--primary);"></div></div>
                    <div class="stat-grid"><div class="stat-item"><span class="stat-number">487</span> total XP</div><div class="stat-item"><span class="stat-number">12</span> hours</div></div>
                </div>
                <div class="card"><h3>Achievements</h3><div style="display:flex; gap:12px;"><span>🏅 5 day streak</span><span>🧠 math whiz</span></div></div>
            `;
        }

        function renderSettings() {
            headerTitle.innerText = 'Settings';
            contentDiv.innerHTML = `
                <div class="card">
                    <div class="row-space"><span>Dark mode</span><button id="themeToggleBtn" style="background:var(--primary); border:none; color:white; padding:8px 20px; border-radius:40px;">${darkMode ? 'Light' : 'Dark'}</button></div>
                    <div style="margin-top:24px"><h4>Profile</h4><p>Name: Mathlete</p><p>Member since 2026</p></div>
                </div>
            `;
            document.getElementById('themeToggleBtn')?.addEventListener('click', toggleTheme);
        }

        function renderScreen(screen) {
            if (screen === 'onboarding') renderOnboarding();
            else if (screen === 'home') renderHome();
            else if (screen === 'learn') renderLearn();
            else if (screen === 'progress') renderProgress();
            else if (screen === 'settings') renderSettings();
            else if (screen === 'profile') { currentScreen = 'settings'; renderSettings(); setActiveNav('settings'); }
        }

        function setActiveNav(screen) {
            navItems.forEach(item => {
                const navScreen = item.dataset.screen;
                if (navScreen === screen) item.classList.add('active');
                else item.classList.remove('active');
            });
        }

        // Navigation listeners
        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                const screen = item.dataset.screen;
                currentScreen = screen;
                renderScreen(screen);
                setActiveNav(screen);
            });
        });

        profileBtn.addEventListener('click', () => {
            currentScreen = 'profile';
            renderScreen('profile'); // redirect to settings
            setActiveNav('settings');
        });

        // start on onboarding
        renderScreen('onboarding');
        setActiveNav('none'); // no active tab

        // modal background click to close
        modalContainer.addEventListener('click', (e) => { if (e.target === modalContainer) modalContainer.classList.add('hidden'); });
    })();
</script>
</body>
</html>
All done!
