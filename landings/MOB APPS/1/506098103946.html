      --highlight-bg: rgba(59, 130, 246, 0.15);
      --progress-bg: #334155;
    }

    body {

    .phone {

      position: relative;

      transition: background 0.2s;

    .app-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--primary) var(--border);
      padding-bottom: 8px;
    }

    .app-screen::-webkit-scrollbar {
      width: 4px;
    }
    .app-screen::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 20px;
    }

    /* header (common) */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 8px 20px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .profile-icon {
      cursor: pointer;

      transition: background 0.1s;
    }
    .profile-icon:hover {
      background: var(--highlight-bg);
    }
    .profile-icon svg {
      width: 28px;
      height: 28px;
      stroke: var(--icon-stroke);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* bottom nav */
    .bottom-nav {
      background: var(--card);

      display: flex;
      justify-content: space-around;
      padding: 8px 0 12px;
      box-shadow: var(--shadow);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.15s ease;
      padding: 6px 12px 4px;

      background: transparent;
      color: var(--bottom-nav-inactive);
      stroke: var(--bottom-nav-inactive);
      fill: none;

    .nav-item.active {
      background: var(--highlight-bg);
      color: var(--primary);
      stroke: var(--primary);
      transform: scale(1.05);
    }
    .nav-item svg {
      width: 24px;
      height: 24px;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;

    }

      color: var(--primary);

    .content {

    .card {
      background: var(--card);

      box-shadow: var(--shadow);
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .flex-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .gap-2 { gap: 8px; }
    .mt-4 { margin-top: 16px; }
    .mb-2 { margin-bottom: 8px; }
    .text-primary { color: var(--primary); font-weight: 600; }
    .text-muted { color: var(--text-muted); font-size: 14px; }
    .text-lg { font-size: 18px; font-weight: 600; color: var(--text-primary); }

    /* buttons */
    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      width: 100%;
      padding: 16px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--primary-dark);
      transition: 0.05s linear;
      margin: 16px 0 12px;
    }
    .btn-primary:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--primary-dark);
    }
    .link-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      font-size: 13px;
    }
    .link-row span {
      color: var(--primary);
      text-decoration: underline;
      cursor: pointer;
    }

    /* progress bar */
    .progress-bar {
      height: 10px;
      background: var(--progress-bg);
      border-radius: 20px;
      overflow: hidden;
      width: 100%;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      border-radius: 20px;
      transition: width 0.3s;
    }

    /* modal (simple) */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal {
      background: var(--card);
      width: 280px;
      padding: 24px;
      border-radius: 32px;
      text-align: center;
      color: var(--text-primary);
      border: 1px solid var(--border);
    }
    .modal button {
      background: var(--primary);
      border: none;
      color: white;
      padding: 10px 24px;
      border-radius: 40px;
      font-weight: 600;
      margin-top: 20px;
      cursor: pointer;
    }
    .d-none { display: none; }

    /* icons */
    .icon-sm { width: 44px; height: 44px; stroke: var(--primary); stroke-width: 1.8; fill: none; }

    /* stats grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }
    .stat-item {
      background: var(--bg);
      border-radius: 18px;
      padding: 12px;
      text-align: center;
    }
    .badge {
      background: var(--accent);
      color: #0F172A;
      padding: 4px 10px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
    }
    .toggle-switch {
      width: 44px; height: 24px; background: var(--border); border-radius: 40px; position: relative; cursor: pointer;
    }
    .toggle-knob {
      width: 20px; height: 20px; background: white; border-radius: 50%; position: absolute; top: 2px; left: 2px; transition: 0.1s;
    }
    body.dark .toggle-knob { left: 22px; background: var(--primary); }
  </style>

    (function() {
      // ==================== STATE & DATA ====================
      let currentScreen = 'onboarding'; // default shown

      const appName = 'LogicPuzzle';

      const icons = {
        profile: '<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
        home: '<svg viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 L3 10Z"/></svg>',

        progress: '<svg viewBox="0 0 24 24"><path d="M21 12 L18 12 L18 20 M15 8 L12 8 L12 20 M9 4 L6 4 L6 20 M3 16 L3 20"/></svg>',
        settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z M16.5 6.5 16 8 M12 3v3 M8 6 7.5 4.5"/></svg>',
        lesson: '<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
        chart: '<svg viewBox="0 0 24 24"><path d="M21 16v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2 M7 10l3-3 3 3 4-4"/><path d="M17 10V4h-6"/></svg>',

        play: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4V8z"/></svg>',
        check: '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>'
      };

      // DOM elements
      const screenContainer = document.getElementById('screenContainer');
      const headerTitle = document.getElementById('headerTitle');
      const profileBtn = document.getElementById('profileBtn');
      const modalOverlay = document.getElementById('modalContainer');
      const modalTitle = document.getElementById('modalTitle');
      const modalBody = document.getElementById('modalBody');
      const closeModal = document.getElementById('closeModal');
      const navItems = document.querySelectorAll('.nav-item');
      const phone = document.getElementById('phoneContainer');

      // ==================== SCREEN RENDER ====================
      function renderScreen(screenId) {
        currentScreen = screenId;
        let html = '';
        headerTitle.innerText = screenId === 'onboarding' ? 'Onboarding' : 
                                screenId === 'home' ? 'Home' :
                                screenId === 'learn' ? 'Learn' :
                                screenId === 'progress' ? 'Progress' : 'Settings';

        if (screenId === 'onboarding') {
          html = `<div style="padding: 24px 20px; display: flex; flex-direction: column; align-items: center;">

            <div class="link-row">
              <span id="privacyLink">Privacy Policy</span>
              <span id="termsLink">Terms of Service</span>
            </div>

        } else if (screenId === 'home') {
          html = `<div class="content">
            <div class="card flex-row" style="justify-content: space-between;">

          </div>`;
        } else if (screenId === 'learn') {
          html = `<div class="content"><h2>Lessons</h2><div class="card flex-row"><span>${icons.lesson} Deduction 101</span><span class="badge">new</span></div><div class="card flex-row"><span>${icons.flashcards} Pattern recognition</span><div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div></div><div class="card"><span>${icons.play}  Truth-tellers</span><button class="btn-primary" style="padding: 10px;">start</button></div></div>`;

        }

        screenContainer.innerHTML = html;

        // attach special listeners
        if (screenId === 'onboarding') {

        // update nav active

          if (tab === screenId) {
            item.classList.add('active');

            item.classList.remove('active');

        if (screenId === 'profile') screenId = 'settings'; // profile icon opens settings
        renderScreen(screenId);
      }

      // modal

      function toggleTheme() {
        darkMode = !darkMode;

      }

      // navigation

          const screen = item.getAttribute('data-screen');
          switchScreen(screen);
        });
      });
      profileBtn.addEventListener('click', ()=> switchScreen('settings'));

      // initial render (onboarding)

      // screenshot feature SHIFT+W
      let shotCounter = 1;
      document.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.key === 'W') {
          e.preventDefault();
          // capture phone container
          const node = document.getElementById('phoneContainer');
          // In real world we would use html2canvas, but this is a prototype: simulate download prompt
          // Since we cannot include libs, we just show an alert with sequence name (simulate)
          let fileName = darkMode ? '6.png' : (shotCounter + '.png');

            alert(`📸 Screenshot saved as ${fileName} (simulated)`);
            shotCounter = (shotCounter % 5) + 1;
          } else if (darkMode) {
            alert(`📸 Dark theme screenshot: 6.png (simulated)`);
          } else {
            shotCounter = 1; // reset after 5
            alert(`📸 Screenshot saved as 1.png (simulated)`);
          }
        }
      });

      // extra: ensure modals work
    })();
  </script>
