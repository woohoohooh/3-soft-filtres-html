        </div>
      `,

      progress: `

            <div><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2563EB"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><div>star</div></div>
          </div>
        </div>
      `,
      settings: `
        <div class="card">
          <div style="display:flex; align-items:center; gap:12px;"><svg width="36" stroke="var(--text)"><circle cx="18" cy="12" r="4"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/></svg><div><b>Alex Chen</b><div>alex@learn.co</div></div></div>
        </div>
        <div class="card">
          <div class="row-space"><span>Dark theme</span><label><input type="checkbox" id="darkToggle"></label></div>
          <div style="margin-top:16px;"><span>Sound</span> <span>🔛</span></div>
        </div>
        <div class="card">
          <span>App version 2026.3</span><br>
          <span class="link" id="modalPrivacySettings">Privacy Policy</span> · <span class="link" id="modalTermsSettings">Terms</span>
        </div>
      `

    let currentScreen = 'onboarding';
    const container = document.getElementById('screenContainer');
    const titleEl = document.getElementById('screenTitle');
    const navItems = document.querySelectorAll('.nav-item');
    const profileBtn = document.getElementById('profileHeaderBtn');

    function renderScreen(screenId) {
      if (screenId === 'onboarding') titleEl.innerText = 'Welcome';
      if (screenId === 'home') titleEl.innerText = 'Home';
      if (screenId === 'learn') titleEl.innerText = 'Learn';
      if (screenId === 'progress') titleEl.innerText = 'Progress';
      if (screenId === 'settings') titleEl.innerText = 'Settings';
      container.innerHTML = screens[screenId] || screens.home;

      // re-attach listeners for dynamic items
      if (screenId === 'onboarding') {
        document.getElementById('startGetStarted')?.addEventListener('click', ()=> switchTo('home'));
        document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy Policy', 'We respect your data.'));
        document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms of Service', 'Use Math Brain for good.'));

      if (screenId === 'home') {
        document.getElementById('homeStartLearn')?.addEventListener('click', ()=> switchTo('learn'));
      }
      if (screenId === 'learn') {
        document.getElementById('practiceBtn')?.addEventListener('click', ()=> { alert('starting practice (simulated)'); });
      }
      if (screenId === 'settings') {
        const toggle = document.getElementById('darkToggle');
        if (toggle) {
          toggle.checked = darkMode;
          toggle.addEventListener('change', (e) => {
            darkMode = e.target.checked;
            setTheme(darkMode);
          });
        }
        document.getElementById('modalPrivacySettings')?.addEventListener('click', ()=> showModal('Privacy Policy', 'Short privacy.'));
        document.getElementById('modalTermsSettings')?.addEventListener('click', ()=> showModal('Terms', 'Keep learning.'));
      }
    }

    function switchTo(screenId) {
      currentScreen = screenId;
      renderScreen(screenId);
      // update active nav
      navItems.forEach(item => {
        const tab = item.dataset.tab;
        if (tab === screenId || (screenId==='onboarding' && tab==='home')) {
          item.classList.add('active');
        } else item.classList.remove('active');
      });
    }

    navItems.forEach(item => {
      item.addEventListener('click', () => {
        const tab = item.dataset.tab; // home,learn,progress,settings
        switchTo(tab);
      });
    });

    profileBtn.addEventListener('click', ()=> {
      switchTo('settings');
    });

    // modal helpers
    function showModal(title, text) {
      const overlay = document.getElementById('modalOverlay');
      const modal = document.getElementById('modalContent');
      modal.innerHTML = `<h3 style="margin-bottom:12px;">${title}</h3><p>${text}</p><button id="closeModalBtn" style="margin-top:24px; width:100%;">Close</button>`;
      overlay.classList.remove('hidden');
      modal.classList.remove('hidden');
      document.getElementById('closeModalBtn').addEventListener('click', ()=>{
        overlay.classList.add('hidden');
        modal.classList.add('hidden');
      });
    }
    overlay.addEventListener('click', ()=> {
      overlay.classList.add('hidden');
      modal.classList.add('hidden');
    });

    // start with onboarding
    renderScreen('onboarding');
    navItems.forEach(i => i.classList.remove('active'));

    // screenshot (SHIFT+W)

        alert(`📸 Screenshot saved as ${filename} (simulated)`);
      }
    });

    // expose dark mode global for JSON
    window.getDark = ()=> darkMode;

  })();
</script>

    };
    console.log(JSON.stringify(titles, null, 2));
    // also append to body as hidden?
    const pre = document.createElement('pre');
    pre.style.display = 'none';
    pre.id = 'screenshot-json';
    pre.textContent = JSON.stringify(titles);
    document.body.appendChild(pre);
  })();
