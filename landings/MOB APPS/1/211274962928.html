```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Brain Trainer · prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #cbd5e1 0%, #94a3b8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg-primary);
            border-radius: 48px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.4), 0 0 0 12px #1e293b;
            overflow: hidden;
            position: relative;
            transition: background-color 0.2s;
            display: flex;
            flex-direction: column;
        }
        /* inner screen (viewport) */
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--card-bg);
            background: var(--bg-primary);
        }
        .screen::-webkit-scrollbar { width: 4px; }
        .screen::-webkit-scrollbar-track { background: var(--card-bg); }
        .screen::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 12px; }

        /* theme variables */
        :root {
            --primary: #2563EB;
            --secondary: #1E40AF;
            --accent: #38BDF8;
            --bg-primary: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #e2e8f0;
            --inactive: #94A3B8;
            --hover-overlay: rgba(37, 99, 235, 0.05);
        }
        .dark {
            --primary: #3B82F6;
            --secondary: #2563EB;
            --accent: #38BDF8;
            --bg-primary: #0F172A;
            --card-bg: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #cbd5e1;
            --border-light: #334155;
            --inactive: #64748b;
            --hover-overlay: rgba(59, 130, 246, 0.15);
        }

        /* header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px 8px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-light);
        }
        .header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.1s;
        }
        .profile-btn:hover {
            background: var(--hover-overlay);
        }
        .profile-btn svg {
            width: 28px;
            height: 28px;
            stroke: var(--text-primary);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        /* main content */
        .content {
            flex: 1;
            padding: 16px 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--card-bg);
            padding: 6px 12px 10px;
            border-top: 1px solid var(--border-light);
            border-radius: 0 0 48px 48px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            padding: 6px 0 4px;
            width: 64px;
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.15s ease;
            color: var(--inactive);
            fill: none;
            stroke: var(--inactive);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-item.active {
            stroke: var(--primary);
            color: var(--primary);
            background: rgba(37, 99, 235, 0.08);
            transform: scale(1.05);
        }
        .nav-item svg {
            width: 26px;
            height: 26px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            transition: transform 0.1s;
        }
        .nav-item.active svg {
            transform: scale(1.1);
            stroke: var(--primary);
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            margin-top: 2px;
            color: currentColor;
        }

        /* UI components */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.02);
            border: 1px solid var(--border-light);
        }
        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 16px 24px;
            border-radius: 60px;
            font-size: 1.2rem;
            width: 100%;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 8px 16px -6px var(--primary);
        }
        .btn-primary:active { opacity: 0.8; transform: scale(0.98); }
        .row-space { display: flex; justify-content: space-between; align-items: center; margin: 12px 0; }
        .progress-bar {
            height: 10px;
            background: var(--border-light);
            border-radius: 20px;
            overflow: hidden;
            margin: 8px 0;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 20px;
            transition: width 0.3s;
        }
        .badge {
            background: var(--accent);
            color: #0f172a;
            padding: 4px 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 40px;
            width: 280px;
            text-align: center;
            color: var(--text-primary);
        }
        .icon-grid {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-cell {
            background: var(--bg-primary);
            padding: 16px;
            border-radius: 20px;
            text-align: center;
            font-weight: 600;
        }
        .toggle-switch {
            width: 44px;
            height: 24px;
            background: var(--inactive);
            border-radius: 40px;
            position: relative;
            cursor: pointer;
            border: none;
        }
        .toggle-switch.active { background: var(--primary); }
        .toggle-switch::after {
            content: '';
            width: 20px; height: 20px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px; left: 2px;
            transition: 0.1s;
        }
        .toggle-switch.active::after { left: 22px; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- screen wrapper -->
    <div class="screen" id="appScreen">
        <!-- dynamic header will be injected via js -->
        <div id="headerContainer"></div>
        <!-- main content view -->
        <div id="viewContainer" class="content"></div>
        <!-- bottom navigation (fixed) -->
        <nav class="bottom-nav" id="bottomNav"></nav>
    </div>
</div>

<!-- modals container (privacy/terms) -->
<div id="modalLayer" style="position: relative;"></div>

<script>
    (function() {
        // ---------- THEME & STATE ----------
        let currentTheme = 'light';         // light / dark
        let currentScreen = 'onboarding';    // onboarding, home, learn, progress, settings
        let captureCounter = 1;              // for screenshot naming
        const modalLayer = document.getElementById('modalLayer');
        const headerDiv = document.getElementById('headerContainer');
        const viewDiv = document.getElementById('viewContainer');
        const bottomNav = document.getElementById('bottomNav');

        // CSS variables switch
        function applyTheme(theme) {
            const root = document.documentElement;
            if (theme === 'dark') {
                root.classList.add('dark');
            } else {
                root.classList.remove('dark');
            }
        }
        applyTheme(currentTheme);

        // ---------- ICONS (inline SVG) ----------
        const icons = {
            home: `<svg viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 L3 10 Z" /></svg>`,
            learn: `<svg viewBox="0 0 24 24"><path d="M2 4 L12 10 L22 4 L12 16 L2 4 Z M2 12 L12 18 L22 12" /></svg>`,
            progress: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7 L12 12 L15 15" /></svg>`,
            settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82L12 22zM4.6 9a1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1.51 1h12.44a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82L12 2z" /></svg>`,
            profile: `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
            lesson: `<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2" /><path d="M8 7 L16 7 M8 12 L16 12 M8 17 L12 17" /></svg>`,
            chart: `<svg viewBox="0 0 24 24"><path d="M3 17 L9 11 L13 15 L21 7" /><path d="M3 21 L21 21" /></svg>`,
            flashcards: `<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" /><path d="M9 7 L15 7 M9 11 L15 11 M9 15 L12 15" /></svg>`,
            play: `<svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4" /></svg>`,
            check: `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" /></svg>`
        };

        // bottom nav items definition
        const navItems = [
            { id: 'home', label: 'Home', icon: icons.home },
            { id: 'learn', label: 'Learn', icon: icons.learn },
            { id: 'progress', label: 'Progress', icon: icons.progress },
            { id: 'settings', label: 'Settings', icon: icons.settings }
        ];

        // ---------- HELPER: render current view + header + bottom nav--------
        function renderApp() {
            renderHeader();
            renderView();
            renderBottomNav();
        }

        function renderHeader() {
            const screenTitle = currentScreen === 'onboarding' ? 'Welcome' :
                                currentScreen === 'home' ? 'Home' :
                                currentScreen === 'learn' ? 'Math Gym' :
                                currentScreen === 'progress' ? 'Your stats' :
                                currentScreen === 'settings' ? 'Settings' : 'App';
            headerDiv.innerHTML = `
                <div class="header">
                    <h2>${screenTitle}</h2>
                    <button class="profile-btn" id="profileHeaderBtn">${icons.profile}</button>
                </div>
            `;
            document.getElementById('profileHeaderBtn')?.addEventListener('click', (e) => {
                e.stopPropagation();
                if (currentScreen !== 'settings') {
                    currentScreen = 'settings';
                    renderApp();
                }
            });
        }

        function renderView() {
            if (currentScreen === 'onboarding') viewDiv.innerHTML = getOnboardingHTML();
            else if (currentScreen === 'home') viewDiv.innerHTML = getHomeHTML();
            else if (currentScreen === 'learn') viewDiv.innerHTML = getLearnHTML();
            else if (currentScreen === 'progress') viewDiv.innerHTML = getProgressHTML();
            else if (currentScreen === 'settings') viewDiv.innerHTML = getSettingsHTML();

            // attach any dynamic listeners (like start, toggle, practice, modal)
            attachScreenListeners();
        }

        function renderBottomNav() {
            if (currentScreen === 'onboarding') {
                bottomNav.innerHTML = ''; // no bottom nav on onboarding
                return;
            }
            let navHtml = '';
            navItems.forEach(item => {
                const active = (currentScreen === item.id) ? 'active' : '';
                navHtml += `<button class="nav-item ${active}" data-nav="${item.id}">
                    ${item.icon} <span class="nav-label">${item.label}</span>
                </button>`;
            });
            bottomNav.innerHTML = navHtml;

            // attach nav listeners
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const navId = btn.dataset.nav;
                    if (navId) {
                        currentScreen = navId;
                        renderApp();
                    }
                });
            });
        }

        // ---------- SCREEN CONTENT GENERATORS ----------
        function getOnboardingHTML() {
            return `
                <div class="card" style="text-align: center; margin-top: 40px;">
                    <div style="font-size: 56px; margin-bottom: 8px;">🧠</div>
                    <h1 style="font-size: 2rem; color: var(--primary);">Math Brain</h1>
                    <p style="font-weight: 600; margin: 4px 0 8px;">Train your mental math</p>
                    <p style="color: var(--text-secondary); margin-bottom: 32px;">Short daily sessions boost your arithmetic speed & logic. Master numbers!</p>
                    <button class="btn-primary" id="getStartedBtn">Get Started</button>
                    <div style="margin: 24px 0 12px; display: flex; gap: 24px; justify-content: center;">
                        <button class="js-modal-btn" style="background: none; border: none; color: var(--primary); text-decoration: underline; cursor:pointer;" data-modal="privacy">Privacy Policy</button>
                        <button class="js-modal-btn" style="background: none; border: none; color: var(--primary); text-decoration: underline; cursor:pointer;" data-modal="terms">Terms of Service</button>
                    </div>
                </div>
            `;
        }

        function getHomeHTML() {
            return `
                <div class="card" style="display: flex; gap: 16px; flex-direction: column;">
                    <div style="display: flex; gap: 12px;"><span class="badge">🔥 7 day streak</span><span class="badge">⭐ 1240 pts</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width: 65%;"></div></div>
                    <p style="color: var(--text-secondary);">Today's goal: 15 min</p>
                    <button class="btn-primary" id="quickPracticeBtn" style="padding: 14px;">${icons.play}  Quick train</button>
                </div>
                <div class="card">
                    <h3>Recommended</h3>
                    <div class="lesson-item">${icons.flashcards} <span>Multiplication mastery</span></div>
                    <div class="lesson-item">${icons.lesson} <span>Division shortcuts</span></div>
                    <div class="lesson-item">${icons.flashcards} <span>Square roots</span></div>
                </div>
                <div class="card">
                    <div style="display: flex; gap: 20px;">
                        <div>${icons.chart} <span>Speed ↑23%</span></div>
                        <div>${icons.check} <span>3 badges</span></div>
                    </div>
                </div>
            `;
        }

        function getLearnHTML() {
            return `
                <div class="card"><h3>Daily workout</h3>
                    <div class="lesson-item">${icons.play} Addition blast · 5 min</div>
                    <div class="lesson-item">${icons.play} Mental multiplication · 8 min</div>
                    <div class="lesson-item">${icons.play} Fraction warm-up · 6 min</div>
                    <button class="btn-primary" style="margin-top:12px;" id="startPracticeBtn">Start practice</button>
                </div>
                <div class="card"><h3>Flashcards pack</h3>${icons.flashcards} times tables · 12 cards</div>
            `;
        }

        function getProgressHTML() {
            return `
                <div class="card stat-grid">
                    <div class="stat-cell">accuracy<br><strong>92%</strong></div>
                    <div class="stat-cell">sessions<br><strong>28</strong></div>
                    <div class="stat-cell">top streak<br><strong>14d</strong></div>
                    <div class="stat-cell">level<br><strong>7</strong></div>
                </div>
                <div class="card">
                    <h4>Weekly activity</h4>
                    <div style="height: 80px; display: flex; align-items: end; gap: 8px; margin-top: 20px;">
                        <div style="background: var(--primary); width: 22px; height: 50px; border-radius: 12px;"></div>
                        <div style="background: var(--primary); width: 22px; height: 70px; border-radius: 12px;"></div>
                        <div style="background: var(--accent); width: 22px; height: 40px; border-radius: 12px;"></div>
                        <div style="background: var(--primary); width: 22px; height: 90px; border-radius: 12px;"></div>
                        <div style="background: var(--inactive); width: 22px; height: 30px; border-radius: 12px;"></div>
                    </div>
                    <div class="progress-bar" style="margin-top: 16px;"><div class="progress-fill" style="width:78%"></div></div>
                    <p>78% to next badge</p>
                </div>
            `;
        }

        function getSettingsHTML() {
            const isDark = currentTheme === 'dark';
            return `
                <div class="card">
                    <div class="row-space"><span>Dark theme</span><button class="toggle-switch ${isDark ? 'active' : ''}" id="themeToggle"></button></div>
                    <div class="row-space"><span>Sound</span><button class="toggle-switch" id="dummyToggle"></button></div>
                    <div style="margin-top: 24px;">
                        <p style="color: var(--text-secondary);">Profile: mathlete_99</p>
                        <p>Joined 2026 · level 7</p>
                    </div>
                </div>
            `;
        }

        // ---------- EVENT LISTENERS ----------
        function attachScreenListeners() {
            // get started
            document.getElementById('getStartedBtn')?.addEventListener('click', ()=> {
                currentScreen = 'home';
                renderApp();
            });
            // practice / learn buttons navigation
            document.getElementById('quickPracticeBtn')?.addEventListener('click', ()=> {
                currentScreen = 'learn';
                renderApp();
            });
            document.getElementById('startPracticeBtn')?.addEventListener('click', ()=> {
                alert('Starting 5 min addition challenge! (mock)');
            });
            // theme toggle (settings)
            const themeBtn = document.getElementById('themeToggle');
            if (themeBtn) {
                themeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    currentTheme = currentTheme === 'light' ? 'dark' : 'light';
                    applyTheme(currentTheme);
                    renderApp(); // re-render to update toggle state & text
                });
            }

            // modal triggers (privacy & terms)
            document.querySelectorAll('.js-modal-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const type = btn.dataset.modal; // 'privacy' or 'terms'
                    showModal(type);
                });
            });
        }

        // ---------- MODAL (privacy/terms) ----------
        function showModal(type) {
            const title = type === 'privacy' ? 'Privacy Policy' : 'Terms of Service';
            const body = type === 'privacy' ? 'Your data stays on device. We do not collect personal info.' : 'Use Math Brain for personal learning. No warranties.';
            const modalHtml = `
                <div class="modal-overlay" id="activeModal">
                    <div class="modal">
                        <h3>${title}</h3>
                        <p style="margin: 16px 0;">${body}</p>
                        <button class="btn-primary" style="padding: 10px;" id="closeModalBtn">Close</button>
                    </div>
                </div>
            `;
            modalLayer.innerHTML = modalHtml;
            document.getElementById('closeModalBtn').addEventListener('click', ()=> {
                modalLayer.innerHTML = '';
            });
            document.getElementById('activeModal').addEventListener('click', (e) => {
                if (e.target.id === 'activeModal') modalLayer.innerHTML = '';
            });
        }

        // ---------- SCREENSHOT (SHIFT+W) ----------
        document.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                // simplistic capture simulation: create a download with sequential name
                const isDark = currentTheme === 'dark';
                let filename = isDark ? '6.png' : (captureCounter + '.png');
                if (!isDark) {
                    captureCounter = captureCounter < 5 ? captureCounter + 1 : 1;
                }
                // Fake download (in real world would use html2canvas; but here we just notify)
                alert(`📸 Screenshot captured as ${filename} (simulated).\nShift+W works!`);
                // increment dark capture? but we follow rule: dark always 6.png
            }
        });

        // initial render
        renderApp();

        // force dark mode detection for screenshot naming, but leave it to var
    })();
</script>
