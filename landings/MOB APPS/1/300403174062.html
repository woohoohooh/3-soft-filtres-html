```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabVault · English builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* CSS variables – light mode default */
        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --text-muted: #64748B;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive-icon: #94A3B8;
            --bottom-bar-bg: #FFFFFF;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
            --progress-bg: #E2E8F0;
            --badge-bg: #EFF6FF;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --text-muted: #94A3B8;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive-icon: #64748B;
            --bottom-bar-bg: #1E293B;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            --progress-bg: #334155;
            --badge-bg: #1E3A5F;
        }

        body {
            background: #1a1e2b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 0 0 0 8px #2c303a;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s;
        }

        /* main content flex column */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            padding: 16px 16px 8px 16px;
            gap: 16px;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-light);
        }
        .header h2 {
            font-size: 22px;
            font-weight: 650;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-icon {
            cursor: pointer;
            padding: 8px 4px;
        }

        /* bottom navigation */
        .bottom-nav {
            background: var(--bottom-bar-bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 10px;
            border-top: 1px solid var(--border-light);
            box-shadow: 0 -2px 8px rgba(0,0,0,0.02);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1);
            padding: 6px 12px 4px;
            border-radius: 20px;
            color: var(--inactive-icon);
            fill: var(--inactive-icon);
        }
        .nav-item.active {
            background: rgba(37, 99, 235, 0.08);
            color: var(--primary);
            fill: var(--primary);
            transform: scale(1.05);
        }
        .nav-item.active svg {
            stroke: var(--primary);
            stroke-width: 2.4;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.15s;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            color: currentColor;
        }

        /* cards & elements */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }
        .flex-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .gap-8 { gap: 8px; }
        .mt-4 { margin-top: 16px; }
        .mb-2 { margin-bottom: 8px; }
        .btn {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 24px;
            border-radius: 60px;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(37, 99, 235, 0.25);
            transition: 0.1s;
        }
        .btn:active { transform: scale(0.98); background: var(--primary-dark); }
        .small-link {
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: underline;
            cursor: pointer;
        }
        .progress-bar {
            background: var(--progress-bg);
            height: 10px;
            border-radius: 20px;
            overflow: hidden;
            width: 100%;
        }
        .progress-fill {
            background: var(--primary);
            width: 0%;
            height: 100%;
            transition: width 0.5s;
        }
        .badge {
            background: var(--badge-bg);
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-item {
            background: var(--bg);
            border-radius: 20px;
            padding: 16px 8px;
            text-align: center;
        }
        /* modal */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(2px);
        }
        .modal-content {
            background: var(--card);
            width: 280px;
            padding: 28px 20px;
            border-radius: 40px;
            text-align: center;
            color: var(--text-primary);
            box-shadow: 0 20px 40px black;
        }
        .hidden { display: none; }

        /* icons for static content */
        .icon-micro { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }
        .chart-line { display: inline-block; width: 40px; }
        /* screen container */
        .screen {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
    </style>
</head>
<body>
    <div class="phone" id="phoneContainer">
        <!-- header (dynamic title + profile) -->
        <div class="header" style="padding: 16px 16px 0 16px;">
            <h2 id="screenTitle">Onboarding</h2>
            <div class="profile-icon" id="profileBtn">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--text-primary)" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
            </div>
        </div>

        <!-- dynamic screen content -->
        <div class="app-screen" id="appScreen"></div>

        <!-- bottom navigation (4 items) -->
        <div class="bottom-nav" id="bottomNav">
            <button class="nav-item" data-tab="home">
                <svg viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                <span>Home</span>
            </button>
            <button class="nav-item" data-tab="learn">
                <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                <span>Learn</span>
            </button>
            <button class="nav-item" data-tab="progress">
                <svg viewBox="0 0 24 24"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/></svg>
                <span>Progress</span>
            </button>
            <button class="nav-item" data-tab="settings">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/><path d="M16.5 6.5 17 6a3 3 0 0 0-5 0l.5.5"/></svg>
                <span>Settings</span>
            </button>
        </div>
    </div>

    <!-- modal template -->
    <div id="modalContainer" class="modal hidden" style="position: fixed;"></div>

    <script>
        (function() {
            // ----- THEME & STATE -----
            const bodyClass = document.body;
            let darkMode = false;   // light default
            let currentScreen = 'onboarding'; // home/learn/progress/settings/onboarding
            let currentTab = null;  // for bottom nav

            // ---------- ICON SET (inline, same style) ----------
            const icons = {
                home: `<svg viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`,
                learn: `<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
                progress: `<svg viewBox="0 0 24 24"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/></svg>`,
                settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/><path d="M16.5 6.5 17 6a3 3 0 0 0-5 0l.5.5"/></svg>`,
                profile: `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
                lesson: `<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
                chart: `<svg viewBox="0 0 24 24"><path d="M21 16v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2"/><path d="M7 10l3-3 3 3 4-4"/><path d="M17 10V4h-6"/></svg>`,
                flashcards: `<svg viewBox="0 0 24 24"><path d="M4 7h16v10H4z"/><path d="M7 4h10v3H7z"/><path d="M7 17v3h10v-3"/></svg>`,
                play: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4V8z"/></svg>`,
                check: `<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>`
            };

            // ---------- SCREEN RENDER FUNCTIONS ----------
            function renderOnboarding() {
                return `
                    <div class="screen" style="justify-content: center; flex:1;">
                        <div class="card" style="text-align: center; padding: 32px 20px;">
                            <div style="background: var(--primary); width:70px; height:70px; border-radius: 22px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;">
                                <svg width="44" height="44" viewBox="0 0 24 24" stroke="white" stroke-width="2" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                            </div>
                            <h1 style="font-size: 32px; font-weight:700; color:var(--text-primary);">VocabVault</h1>
                            <p style="font-size: 18px; color: var(--primary); margin: 4px 0;">words unlock worlds</p>
                            <p style="color: var(--text-secondary); margin: 16px 0 24px;">Build your English vocabulary with smart daily lessons and adaptive quizzes.</p>
                            <button class="btn" id="startGetStarted">Get Started</button>
                            <div style="display:flex; gap:20px; justify-content:center; margin-top:20px;">
                                <span class="small-link" id="privacyLink">Privacy Policy</span>
                                <span class="small-link" id="termsLink">Terms of Service</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            function renderHome() {
                return `
                    <div class="screen">
                        <div class="card flex-row" style="justify-content: space-between;">
                            <span style="font-weight:600; color:var(--text-primary);">🔥 7 day streak</span>
                            <span class="badge">⭐ 340 XP</span>
                        </div>
                        <div class="card">
                            <h3 style="color:var(--text-primary); margin-bottom:12px;">Continue lesson</h3>
                            <div style="display:flex; gap:16px; align-items:center;">
                                <span>${icons.flashcards}</span>
                                <div style="flex:1"><strong>Phrasal verbs</strong> · 68%</div>
                                <span class="badge">${icons.play} practice</span>
                            </div>
                            <div class="progress-bar mt-4"><div class="progress-fill" style="width:68%"></div></div>
                        </div>
                        <div class="card">
                            <div style="display:flex; justify-content:space-between;"><span style="font-weight:600;">Daily goal</span><span>80/100 XP</span></div>
                            <div class="progress-bar mt-4"><div class="progress-fill" style="width:80%"></div></div>
                        </div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                            <div class="card" style="padding:16px; text-align:center;">${icons.chart} <span style="display:block;">word sets</span><strong>24</strong></div>
                            <div class="card" style="padding:16px; text-align:center;">${icons.lesson} <span>lessons</span><strong>12</strong></div>
                        </div>
                    </div>
                `;
            }

            function renderLearn() {
                return `
                    <div class="screen">
                        <div class="card" style="display:flex; gap:12px; flex-direction:column;">
                            <h3 style="color:var(--text-primary);">Today's topics</h3>
                            <div class="flex-row"><span>${icons.play}</span> Academic word list <span style="margin-left:auto;">🔓</span></div>
                            <div class="flex-row"><span>${icons.flashcards}</span> Business English <span style="margin-left:auto;">🔒</span></div>
                            <div class="flex-row"><span>${icons.lesson}</span> Idioms & slang <span style="margin-left:auto;">🔓</span></div>
                            <button class="btn" style="margin-top:8px;" id="practiceLesson">Start practice →</button>
                        </div>
                        <div class="card"><span>📘  'word of the day' : serendipity</span></div>
                    </div>
                `;
            }

            function renderProgress() {
                return `
                    <div class="screen">
                        <div class="stat-grid">
                            <div class="stat-item"><span style="font-size:24px;">🔥</span><br>23 days</div>
                            <div class="stat-item"><span style="font-size:24px;">📊</span><br>480 words</div>
                        </div>
                        <div class="card">
                            <h4>Weekly activity</h4>
                            <div style="height:80px; display:flex; gap:6px; align-items:flex-end; margin-top:12px;">
                                <div style="background:var(--primary); width:22px; height:44px; border-radius:8px;"></div>
                                <div style="background:var(--primary); width:22px; height:68px;"></div>
                                <div style="background:var(--primary); width:22px; height:30px;"></div>
                                <div style="background:var(--primary); width:22px; height:52px;"></div>
                                <div style="background:var(--accent); width:22px; height:76px;"></div>
                                <div style="background:var(--accent); width:22px; height:40px;"></div>
                                <div style="background:var(--accent); width:22px; height:20px;"></div>
                            </div>
                        </div>
                        <div class="card">🏅 Achievements (4 new) </div>
                    </div>
                `;
            }

            function renderSettings() {
                const toggleLabel = darkMode ? 'Switch to Light' : 'Switch to Dark';
                return `
                    <div class="screen">
                        <div class="card">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <span>Dark theme</span>
                                <button class="badge" id="themeToggleBtn" style="background:var(--primary); color:white;">${toggleLabel}</button>
                            </div>
                        </div>
                        <div class="card">🔔 Notifications</div>
                        <div class="card">🌐 Language: English</div>
                        <div class="card">📁 Export data</div>
                        <div class="small-link" style="margin-top:20px;">App version 2.6 · build 2026</div>
                    </div>
                `;
            }

            // navigation helper
            function showScreen(screenId) {
                currentScreen = screenId;
                const screenDiv = document.getElementById('appScreen');
                const headerTitle = document.getElementById('screenTitle');
                if (screenId === 'onboarding') {
                    screenDiv.innerHTML = renderOnboarding();
                    headerTitle.innerText = 'Welcome';
                } else if (screenId === 'home') {
                    screenDiv.innerHTML = renderHome();
                    headerTitle.innerText = 'Dashboard';
                } else if (screenId === 'learn') {
                    screenDiv.innerHTML = renderLearn();
                    headerTitle.innerText = 'Learning';
                } else if (screenId === 'progress') {
                    screenDiv.innerHTML = renderProgress();
                    headerTitle.innerText = 'Progress';
                } else if (screenId === 'settings') {
                    screenDiv.innerHTML = renderSettings();
                    headerTitle.innerText = 'Settings';
                }

                // update bottom nav active
                document.querySelectorAll('.nav-item').forEach(btn => {
                    const tab = btn.dataset.tab;
                    if (screenId === tab || (screenId==='onboarding' && tab==='home')) {
                        // but onboarding: no bottom active, just remove all
                    }
                });
                if (screenId !== 'onboarding') {
                    document.querySelectorAll('.nav-item').forEach(btn => {
                        btn.classList.remove('active');
                        if (btn.dataset.tab === screenId) btn.classList.add('active');
                    });
                } else {
                    document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
                }

                // re-attach listeners for screen buttons
                attachDynamicListeners();
            }

            // modal logic
            function showModal(text) {
                const modal = document.getElementById('modalContainer');
                modal.innerHTML = `<div class="modal-content"><p>${text}</p><button class="btn" style="margin-top:20px;" id="closeModalBtn">Close</button></div>`;
                modal.classList.remove('hidden');
                document.getElementById('closeModalBtn').addEventListener('click', ()=>{
                    modal.classList.add('hidden');
                });
            }

            function attachDynamicListeners() {
                // get started from onboarding
                const getStarted = document.getElementById('startGetStarted');
                if (getStarted) getStarted.addEventListener('click', ()=> showScreen('home'));

                // privacy & terms
                document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy Policy · We respect your data.'));
                document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms of Service · Use = accept.'));

                // theme toggle inside settings
                const themeBtn = document.getElementById('themeToggleBtn');
                if (themeBtn) {
                    themeBtn.addEventListener('click', ()=>{
                        darkMode = !darkMode;
                        if (darkMode) bodyClass.classList.add('dark');
                        else bodyClass.classList.remove('dark');
                        showScreen('settings');  // refresh with new button text
                    });
                }

                // lesson practice simulation
                const practiceBtn = document.getElementById('practiceLesson');
                if (practiceBtn) practiceBtn.addEventListener('click', ()=> { alert('Starting lesson (simulated)'); });
            }

            // bottom navigation
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    const tab = e.currentTarget.dataset.tab; // home,learn,progress,settings
                    showScreen(tab);
                });
            });

            // profile button (right header)
            document.getElementById('profileBtn').addEventListener('click', ()=>{
                showScreen('settings');
            });

            // init: show onboarding
            showScreen('onboarding');

            // ---------- SCREENSHOT capture (SHIFT+W) ----------
            let screenshotCounter = 1;
            document.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    const phone = document.getElementById('phoneContainer');
                    // extremely simplified capture simulation – in real world would need html2canvas, but we mock naming
                    // Since we can't actual canvas due to libs, we mimic filename rule.
                    const isDark = bodyClass.classList.contains('dark');
                    let filename = isDark ? '6.png' : (screenshotCounter + '.png');
                    if (!isDark) {
                        if (screenshotCounter < 6) filename = screenshotCounter + '.png';
                        screenshotCounter = (screenshotCounter % 5) + 1;
                    } else {
                        filename = '6.png';
                    }
                    alert(`📸 Screenshot saved as ${filename} (simulated)`);
                }
            });
        })();
    </script>
</body>
</html>
```
