```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabVault · English builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive-icon: #94A3B8;
            --shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,20,40,0.05);
            --header-bg: rgba(255,255,255,0.8);
            --nav-bg: rgba(255,255,255,0.9);
            --progress-bg: #E2E8F0;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive-icon: #64748B;
            --shadow: 0 8px 20px rgba(0,0,0,0.4);
            --header-bg: rgba(30,41,59,0.8);
            --nav-bg: rgba(30,41,59,0.95);
            --progress-bg: #334155;
        }

        body {
            background: #111827;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 25px 60px -15px rgba(0,0,0,0.5), 0 0 0 8px #1E293B;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
        }

        /* main screen area */
        .screen-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 8px 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive-icon) var(--card);
            background: var(--bg);
        }

        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: var(--inactive-icon);
            border-radius: 8px;
        }

        /* header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0 8px 0;
            background: transparent;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            background-color: var(--header-bg);
            margin: -4px -16px 8px -16px;
            padding: 12px 16px 8px 16px;
            border-bottom: 1px solid var(--border-light);
        }
        .screen-title {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }
        .profile-icon {
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            transition: background 0.1s;
        }
        .profile-icon:hover {
            background: var(--border-light);
        }

        /* bottom navigation */
        .bottom-nav {
            height: 68px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 8px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            flex: 1;
            padding: 6px 0;
            border-radius: 20px;
            transition: all 0.15s ease;
            background: transparent;
        }
        .nav-item.active {
            background: rgba(37, 99, 235, 0.1);
        }
        .nav-item.active .nav-icon {
            transform: scale(1.15);
        }
        .nav-icon {
            width: 24px;
            height: 24px;
            transition: transform 0.15s;
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .nav-item.active .nav-label {
            color: var(--primary);
            font-weight: 600;
        }

        /* cards etc */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 20px 16px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }
        .flex-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 13px;
        }
        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 20px;
            margin: 12px 0;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--primary);
            border-radius: 20px;
            transition: width 0.3s;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-item {
            background: var(--bg);
            padding: 14px;
            border-radius: 20px;
            text-align: center;
        }
        .h4 {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--text-primary);
        }
        .chip {
            background: var(--bg);
            padding: 10px 14px;
            border-radius: 40px;
            font-weight: 500;
        }

        /* modal overlay */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: var(--card);
            width: 280px;
            border-radius: 32px;
            padding: 24px;
            color: var(--text-primary);
        }

        .hidden { display: none; }
        button {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 24px;
            border-radius: 40px;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
        }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 16px;
            font-size: 13px;
            color: var(--inactive-icon);
            text-decoration: underline;
            cursor: pointer;
        }
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic header -->
    <div class="header" id="appHeader">
        <span class="screen-title" id="headerTitle">Onboarding</span>
        <span class="profile-icon" id="profileBtn"><?xml version="1.0" encoding="UTF-8"?><svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z" fill="var(--text-primary)" stroke="var(--text-primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>

    <!-- screen content (changes) -->
    <div class="screen-container" id="screenContent"></div>

    <!-- bottom nav (static) -->
    <div class="bottom-nav" id="bottomNav">
        <div class="nav-item" data-screen="home"><span class="nav-icon" id="icon-home"></span><span class="nav-label">Home</span></div>
        <div class="nav-item" data-screen="learn"><span class="nav-icon" id="icon-learn"></span><span class="nav-label">Learn</span></div>
        <div class="nav-item" data-screen="progress"><span class="nav-icon" id="icon-progress"></span><span class="nav-label">Progress</span></div>
        <div class="nav-item" data-screen="settings"><span class="nav-icon" id="icon-settings"></span><span class="nav-label">Settings</span></div>
    </div>

    <!-- modal container (hidden) -->
    <div id="modalContainer" class="modal hidden"></div>
</div>

<script>
    (function(){
        // ---------- SVG ICONS (inline, outline 2px, round) ----------
        const icons = {
            home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10L12 3L21 10V20H3V10Z"/></svg>`,
            learn: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20L12 4L20 20"/><path d="M9 12H15"/></svg>`,
            progress: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3"/><circle cx="12" cy="12" r="9"/><path d="M12 7V12L15 15"/></svg>`,
            settings: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15C18.9 16 18.1 16.7 17.2 17.2L19 20.1L16.1 19.9C15.1 20.4 14 20.6 12.9 20.6H11.1C10 20.6 8.9 20.4 7.9 19.9L5 20.1L6.8 17.2C5.9 16.7 5.1 16 4.6 15L2 15.5L3.5 12.9C3.3 12.3 3.2 11.7 3.2 11C3.2 10.3 3.3 9.7 3.5 9.1L2 6.5L4.6 7C5.1 6 5.9 5.3 6.8 4.8L5 2L7.9 2.1C8.9 1.6 10 1.4 11.1 1.4H12.9C14 1.4 15.1 1.6 16.1 2.1L19 2L17.2 4.9C18.1 5.4 18.9 6.1 19.4 7.1L22 6.5L20.5 9.1C20.7 9.7 20.8 10.3 20.8 11C20.8 11.7 20.7 12.3 20.5 12.9L22 15.5L19.4 15Z"/></svg>`,
            profile: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M5 20V18C5 14.7 7.7 12 11 12H13C16.3 12 19 14.7 19 18V20"/></svg>`,
            lesson: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="M8 2V22"/><path d="M16 2V22"/><path d="M2 8H22"/><path d="M2 16H22"/></svg>`,
            chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 21H3V3"/><path d="M7 15L10 10L13 13L18 7"/></svg>`,
            flashcards: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="1"/><path d="M9 6H15"/><path d="M9 10H15"/><path d="M9 14H13"/></svg>`,
            play: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M10 8L16 12L10 16V8Z"/></svg>`,
            check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17L4 12"/></svg>`
        };

        // inject icons into nav
        document.getElementById('icon-home').innerHTML = icons.home;
        document.getElementById('icon-learn').innerHTML = icons.learn;
        document.getElementById('icon-progress').innerHTML = icons.progress;
        document.getElementById('icon-settings').innerHTML = icons.settings;

        // theme state
        let darkMode = false;

        // current screen
        let currentScreen = 'onboarding';

        // ----- helpers -----
        function setActiveNav(screen) {
            document.querySelectorAll('.nav-item').forEach(el => {
                const ds = el.dataset.screen;
                if (ds === screen) {
                    el.classList.add('active');
                    const icon = el.querySelector('.nav-icon');
                    if (icon) icon.style.color = '#2563EB';
                } else {
                    el.classList.remove('active');
                    const icon = el.querySelector('.nav-icon');
                    if (icon) icon.style.color = '';
                }
            });
        }

        function showModal(title, content) {
            const modal = document.getElementById('modalContainer');
            modal.innerHTML = `<div class="modal-card"><h3 style="margin-bottom:12px;">${title}</h3><p>${content}</p><button style="margin-top:16px;" id="closeModalBtn">Close</button></div>`;
            modal.classList.remove('hidden');
            document.getElementById('closeModalBtn').addEventListener('click', ()=> modal.classList.add('hidden'));
        }

        // header title update
        function updateHeaderTitle(title) {
            document.getElementById('headerTitle').innerText = title;
        }

        // ---------- screens rendering ----------
        function renderScreen(screen) {
            const container = document.getElementById('screenContent');
            if (screen === 'onboarding') {
                updateHeaderTitle('Welcome');
                container.innerHTML = `
                    <div style="text-align:center; padding:24px 0 16px;">
                        <div style="background:var(--primary); width:70px; height:70px; border-radius:24px; margin:0 auto 20px; display:flex; align-items:center; justify-content:center;">
                            <span style="color:white; font-size:36px; font-weight:800;">V</span>
                        </div>
                        <h2 style="font-size:32px; font-weight:800; color:var(--text-primary);">VocabVault</h2>
                        <p style="color:var(--accent); font-weight:600; margin:8px 0 12px;">master English daily</p>
                        <p style="color:var(--text-secondary); margin-bottom:32px;">Build your vocabulary with smart flashcards, quizzes and daily challenges.</p>
                        <button id="getStartedBtn">Get Started →</button>
                        <div class="link-row">
                            <span id="privacyLink">Privacy Policy</span>
                            <span id="termsLink">Terms of Service</span>
                        </div>
                    </div>
                `;
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                    currentScreen = 'home';
                    setActiveNav('home');
                    renderScreen('home');
                });
                document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy Policy','We respect your data. No tracking, no sharing.'));
                document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms of Service','Use VocabVault for learning. Be kind.'));
            }
            else if (screen === 'home') {
                updateHeaderTitle('Home');
                container.innerHTML = `
                    <div class="card">
                        <div class="flex-row"><span class="badge">daily goal</span> <span>🔥 5/10</span></div>
                        <div style="font-size:20px; font-weight:700;">Continue where you left</div>
                        <div class="progress-bar"><div class="progress-fill" style="width:50%;"></div></div>
                        <div style="display:flex; gap:10px; margin-top:10px;">${icons.play}<span style="flex:1;">Idioms master • 5 min</span></div>
                    </div>
                    <div class="card">
                        <div class="flex-row"><span>🌟 recommended</span><span>view all</span></div>
                        <div class="lesson-item">${icons.flashcards} <span><b>Word set 42</b> · 12 cards</span></div>
                        <div class="lesson-item">${icons.lesson} <span><b>Phrasal verbs</b> · 8 min</span></div>
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                        <div class="card" style="padding:16px;">${icons.chart} daily streak 12</div>
                        <div class="card" style="padding:16px;">${icons.check} 92% mastery</div>
                    </div>
                `;
            }
            else if (screen === 'learn') {
                updateHeaderTitle('Learn');
                container.innerHTML = `
                    <div class="card"><span style="font-weight:700;">Start practice</span>
                        <div style="display:flex; gap:8px; margin:12px 0;">${icons.play}  ${icons.flashcards}  ${icons.lesson}</div>
                        <button id="practiceBtn">practice now</button>
                    </div>
                    <div class="card">
                        <span style="font-weight:600;">Today’s topics</span>
                        <div class="lesson-item">${icons.flashcards} · Business collocations</div>
                        <div class="lesson-item">${icons.lesson} · Academic word list</div>
                        <div class="lesson-item">${icons.play} · Listening: news</div>
                    </div>
                `;
                document.getElementById('practiceBtn')?.addEventListener('click', ()=> alert('practice started! (simulated)'));
            }
            else if (screen === 'progress') {
                updateHeaderTitle('Progress');
                container.innerHTML = `
                    <div class="card stat-grid">
                        <div class="stat-item"><span class="h4">1,420</span><br>words</div>
                        <div class="stat-item"><span class="h4">34</span><br>lessons</div>
                        <div class="stat-item"><span class="h4">12</span><br>streak</div>
                        <div class="stat-item"><span class="h4">86%</span><br>accuracy</div>
                    </div>
                    <div class="card">${icons.chart} weekly activity <div class="progress-bar" style="margin:12px 0"><div class="progress-fill" style="width:70%"></div></div> <span>70% this week</span></div>
                    <div class="card">🏅 achievements (3 new) <br> <span>🔥 7-day streak, ⚡ speedster</span></div>
                `;
            }
            else if (screen === 'settings') {
                updateHeaderTitle('Settings');
                container.innerHTML = `
                    <div class="card">
                        <div style="display:flex; align-items:center; justify-content:space-between;">
                            <span>🌙 Dark theme</span>
                            <label><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}></label>
                        </div>
                    </div>
                    <div class="card">
                        <div class="lesson-item">${icons.profile} Account</div>
                        <div class="lesson-item">🔔 Notifications</div>
                        <div class="lesson-item">🗣️ Speaking practice</div>
                    </div>
                `;
                document.getElementById('darkToggle')?.addEventListener('change', (e)=>{
                    darkMode = e.target.checked;
                    document.body.classList.toggle('dark', darkMode);
                    renderScreen('settings');  // refresh checkbox state
                });
            }
            else if (screen === 'profile') {  // profile/settings (click header icon)
                currentScreen = 'settings';
                setActiveNav('settings');
                renderScreen('settings');
            }
            // update bottom nav active (except onboarding)
            if (screen !== 'onboarding') setActiveNav(screen);
        }

        // ----- bottom nav listeners -----
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', (e) => {
                const screen = item.dataset.screen; // home, learn, progress, settings
                if (screen === currentScreen) return;
                currentScreen = screen;
                renderScreen(screen);
            });
        });

        // profile icon click
        document.getElementById('profileBtn').addEventListener('click', ()=>{
            currentScreen = 'settings';
            setActiveNav('settings');
            renderScreen('settings');
        });

        // initial render
        renderScreen('onboarding');

        // ----- screenshot hotkey shift+W -----
        let shotCount = 0;
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                const phone = document.getElementById('phoneContainer');
                const isDark = document.body.classList.contains('dark');
                import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
                    html2canvas(phone, { scale: 2 }).then(canvas => {
                        const link = document.createElement('a');
                        const filename = isDark ? '6.png' : (++shotCount) + '.png';
                        link.download = filename;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    });
                }).catch(() => alert('html2canvas failed, but hotkey works!'));
            }
        });

    })();
</script>
</body>
</html>
All done!
