<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VocabVault · English practice</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #1e1e2f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background-color: var(--bg-primary);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 30px 60px -15px rgba(0,0,0,0.5);
      position: relative;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s;
      border: 1px solid rgba(255,255,255,0.08);
    }

    /* theme variables – light default */
    :root {
      --bg-primary: #F8FAFC;
      --bg-card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --border-light: #E2E8F0;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --inactive: #94A3B8;
      --nav-active-bg: rgba(37, 99, 235, 0.08);
      --shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.03);
    }

    body.dark {
      --bg-primary: #0F172A;
      --bg-card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --border-light: #334155;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --inactive: #64748B;
      --nav-active-bg: rgba(59, 130, 246, 0.15);
      --shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    /* screen container */
    .screen {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px 12px 16px;
      display: flex;
      flex-direction: column;
      scrollbar-width: thin;
      scrollbar-color: var(--inactive) transparent;
    }

    .screen::-webkit-scrollbar {
      width: 4px;
    }
    .screen::-webkit-scrollbar-thumb {
      background: var(--inactive);
      border-radius: 20px;
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0 8px 0;
      margin-bottom: 4px;
    }
    .header h2 {
      font-size: 22px;
      font-weight: 650;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .profile-icon {
      cursor: pointer;
      padding: 6px;
      border-radius: 12px;
      transition: background 0.1s;
    }
    .profile-icon:hover {
      background: var(--nav-active-bg);
    }

    /* bottom navigation */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: var(--bg-card);
      border-top: 1px solid var(--border-light);
      padding: 6px 8px 10px 8px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.02);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 500;
      color: var(--inactive);
      cursor: pointer;
      padding: 6px 12px 4px 12px;
      border-radius: 20px;
      transition: all 0.15s ease;
      background: transparent;
      border: none;
    }
    .nav-item.active {
      color: var(--primary);
      background: var(--nav-active-bg);
      transform: scale(1.02);
    }
    .nav-item .icon {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: transform 0.1s;
    }
    .nav-item.active .icon {
      transform: scale(1.15);
      stroke: var(--primary);
    }

    /* UI components */
    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 28px 0 16px;
    }
    .app-logo {
      width: 64px;
      height: 64px;
      background: var(--primary);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .app-name {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
    }
    .tagline {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    .description {
      text-align: center;
      color: var(--text-secondary);
      margin: 16px 0 28px;
      line-height: 1.5;
      font-size: 15px;
      padding: 0 8px;
    }
    .btn-primary {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      font-size: 18px;
      padding: 16px 24px;
      border-radius: 40px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 10px 20px -8px var(--primary-dark);
      transition: background 0.1s;
    }
    .btn-primary:hover {
      background: var(--primary-dark);
    }
    .legal-links {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin: 32px 0 12px;
      font-size: 13px;
    }
    .legal-links span {
      color: var(--primary);
      text-decoration: underline;
      cursor: pointer;
    }

    /* cards */
    .card {
      background: var(--bg-card);
      border-radius: 26px;
      padding: 20px 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-light);
    }
    .row-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .badge {
      background: var(--accent);
      color: #0F172A;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 30px;
      font-size: 12px;
    }
    .progress-bar {
      height: 8px;
      background: var(--border-light);
      border-radius: 20px;
      margin: 12px 0;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 60%;
      background: var(--primary);
      border-radius: 20px;
    }
    .lesson-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .lesson-item:last-child {
      border-bottom: none;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0;
    }
    .stat-card {
      background: var(--bg-card);
      border-radius: 22px;
      padding: 16px 10px;
      text-align: center;
      border: 1px solid var(--border-light);
    }
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: var(--bg-card);
      padding: 28px;
      border-radius: 44px;
      width: 280px;
      text-align: center;
      color: var(--text-primary);
    }
    .hide {
      display: none !important;
    }

    /* icons inline */
    .icon { stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* chart placeholder */
    .chart-line {
      display: flex;
      align-items: flex-end;
      height: 80px;
      gap: 8px;
      margin: 20px 0 10px;
    }
    .bar {
      width: 20%;
      background: var(--primary);
      height: calc(100% * var(--h));
      border-radius: 12px 12px 6px 6px;
    }

    /* toggle */
    .theme-switch {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .theme-option {
      flex:1; text-align: center; padding: 12px; border-radius: 30px; background: var(--bg-primary); border: 1px solid var(--border-light); cursor: pointer;
    }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <!-- dynamic screens will be injected via js -->
  <div id="app"></div>
  <!-- bottom nav static, but visibility toggled by screen -->
  <div id="bottomNav" class="bottom-nav"></div>
</div>

<script>
  (function() {
    // ---------- THEME & UTILS ----------
    const body = document.body;
    let currentTheme = 'light';         // default
    let currentScreen = 'onboarding';   // screen id
    let screenshotCounter = 1;

    // ---------- ICONS (inline SVG) ----------
    const icons = {
      home: `<svg class="icon" viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 L3 10 Z"/></svg>`,
      learn: `<svg class="icon" viewBox="0 0 24 24"><path d="M2 3 L12 3 L12 21 L2 21 L2 3 Z M12 7 L22 7 L22 21 L12 21 L12 7 Z"/><circle cx="7" cy="12" r="1.5"/><circle cx="17" cy="15" r="1.5"/></svg>`,
      progress: `<svg class="icon" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`,
      settings: `<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/></svg>`,
      profile: `<svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
      lesson: `<svg class="icon" viewBox="0 0 24 24"><path d="M4 4 L20 4 L20 20 L4 20 Z M8 8 L16 8 M8 12 L16 12 M8 16 L13 16"/></svg>`,
      chart: `<svg class="icon" viewBox="0 0 24 24"><path d="M21 16v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2"/><polyline points="7 10 12 5 17 10"/><line x1="12" y1="5" x2="12" y2="16"/></svg>`,
      flashcards: `<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="12" y2="13"/></svg>`,
      play: `<svg class="icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
      check: `<svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`
    };

    // ---------- SCREEN RENDER ----------
    function renderScreen(screenId) {
      const appDiv = document.getElementById('app');
      const bottomNav = document.getElementById('bottomNav');

      if (screenId === 'onboarding') {
        bottomNav.innerHTML = ''; // hide nav
        appDiv.innerHTML = renderOnboarding();
        attachLegalListeners();
      } else {
        // show bottom nav with correct active
        bottomNav.innerHTML = renderBottomNav(screenId);
        appDiv.innerHTML = renderContentScreen(screenId);
        attachNavListeners();
        attachProfileListener(); // profile icon inside header
        // special: attach theme toggle inside settings
        if (screenId === 'settings') attachThemeToggle();
      }
      currentScreen = screenId;
    }

    function renderOnboarding() {
      return `
        <div class="screen">
          <div class="logo-area">
            <div class="app-logo">${icons.flashcards.replace('icon', 'icon')}</div>
            <div class="app-name">VocabVault</div>
            <div class="tagline">master English daily</div>
          </div>
          <div class="description">Build vocabulary with smart flashcards & daily challenges. Just 5 min a day.</div>
          <button class="btn-primary" id="getStartedBtn">Get Started</button>
          <div class="legal-links">
            <span id="privacyLink">Privacy Policy</span>
            <span id="termsLink">Terms of Service</span>
          </div>
        </div>
      `;
    }

    function renderContentScreen(screen) {
      const headerTitle = {
        home: 'Home', learn: 'Practice', progress: 'Progress', settings: 'Settings', profile: 'Profile'
      }[screen] || 'App';
      return `
        <div class="screen">
          <div class="header">
            <h2>${headerTitle}</h2>
            <div class="profile-icon" id="profileIcon">${icons.profile}</div>
          </div>
          ${renderScreenSpecific(screen)}
        </div>
      `;
    }

    function renderScreenSpecific(screen) {
      switch(screen) {
        case 'home': return `
          <div class="card">
            <div class="row-between"><span>🔥 Daily streak</span><span class="badge">7 days</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
            <div style="display:flex; gap:8px; margin: 16px 0;">${icons.play} <span>Continue: Phrasal verbs</span></div>
          </div>
          <div class="card">
            <div class="row-between"><span>📚 Your lessons</span><span>see all</span></div>
            <div class="lesson-item">${icons.lesson} <span>Business English</span></div>
            <div class="lesson-item">${icons.flashcards} <span>Idioms pack</span></div>
            <div class="lesson-item">${icons.play} <span>Pronunciation</span></div>
          </div>
          <div class="card">✨ Word of the day: "persistent"</div>
        `;
        case 'learn': return `
          <div class="card">
            <div style="display:flex; gap:20px; align-items:center;">${icons.flashcards}<span style="font-size:20px;">Flashcards · 20 cards</span></div>
            <button class="btn-primary" style="padding:12px; margin-top:16px;" id="practiceBtn">Start practice</button>
          </div>
          <div class="stats-grid">
            <div class="stat-card">${icons.lesson} 34 learned</div>
            <div class="stat-card">${icons.chart} 82% accuracy</div>
          </div>
          <div class="card">${icons.check} Review 5 overdue words</div>
        `;
        case 'progress': return `
          <div class="card">
            <span>Weekly activity</span>
            <div class="chart-line">
              <div class="bar" style="--h:0.6"></div><div class="bar" style="--h:0.8"></div><div class="bar" style="--h:0.4"></div><div class="bar" style="--h:1"></div><div class="bar" style="--h:0.7"></div>
            </div>
          </div>
          <div class="stats-grid">
            <div class="stat-card">🔥 7 day streak</div>
            <div class="stat-card">⭐ 142 pts</div>
          </div>
          <div class="card">${icons.chart} mastery 68% · +12% vs last week</div>
        `;
        case 'settings': return `
          <div class="card">
            <div class="row-between"><span>🌙 Dark mode</span> <span id="themeToggleLight" class="theme-option">Light</span><span id="themeToggleDark" class="theme-option">Dark</span></div>
            <div style="margin-top:24px;">🔔 Notifications</div>
            <div>🌐 Language: English</div>
            <div style="margin-top:32px;">📌 Privacy & Terms</div>
          </div>
        `;
        case 'profile': return `
          <div class="card" style="align-items:center;">
            ${icons.profile} <h3>Alex Mercer</h3>
            <p>alex@vocab.local</p>
            <div style="margin-top:16px;">⚙️ Account settings</div>
            <div>🎯 Goals: 30 wpm</div>
            <div style="margin-top:32px; color:var(--primary);" id="backFromProfile">← Back to Home</div>
          </div>
        `;
        default: return '';
      }
    }

    function renderBottomNav(active) {
      const items = ['home', 'learn', 'progress', 'settings'];
      return items.map(id => `
        <div class="nav-item ${active === id ? 'active' : ''}" data-nav="${id}">
          ${icons[id]}
          <span>${id.charAt(0).toUpperCase()+id.slice(1)}</span>
        </div>
      `).join('');
    }

    // ----- NAVIGATION & MODALS -----
    function attachNavListeners() {
      document.querySelectorAll('.nav-item').forEach(el => {
        el.addEventListener('click', (e) => {
          const navId = el.dataset.nav;
          renderScreen(navId);
        });
      });
    }

    function attachProfileListener() {
      const profIcon = document.getElementById('profileIcon');
      if (profIcon) profIcon.addEventListener('click', () => renderScreen('profile'));
      const backBtn = document.getElementById('backFromProfile');
      if (backBtn) backBtn.addEventListener('click', () => renderScreen('home'));
    }

    function attachLegalListeners() {
      document.getElementById('privacyLink')?.addEventListener('click', () => showModal('Privacy Policy', 'We respect your data. No selling.'));
      document.getElementById('termsLink')?.addEventListener('click', () => showModal('Terms of Service', 'Use responsibly. Be nice.'));
      document.getElementById('getStartedBtn')?.addEventListener('click', () => renderScreen('home'));
    }

    function showModal(title, text) {
      const modal = document.createElement('div');
      modal.className = 'modal';
      modal.innerHTML = `<div class="modal-content"><h3>${title}</h3><p style="margin:16px 0;">${text}</p><button class="btn-primary" style="padding:10px;" id="closeModal">Close</button></div>`;
      document.body.appendChild(modal);
      document.getElementById('closeModal').addEventListener('click', () => modal.remove());
    }

    // theme toggle inside settings
    function attachThemeToggle() {
      document.getElementById('themeToggleLight')?.addEventListener('click', ()=>{
        body.classList.remove('dark');
        currentTheme = 'light';
      });
      document.getElementById('themeToggleDark')?.addEventListener('click', ()=>{
        body.classList.add('dark');
        currentTheme = 'dark';
      });
    }

    // initial render
    renderScreen('onboarding');

    // ----- SCREENSHOT (SHIFT+W) -----
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const phone = document.getElementById('phoneContainer');
        import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
          html2canvas(phone, { scale: 2, backgroundColor: null }).then(canvas => {
            const link = document.createElement('a');
            const themeSuffix = body.classList.contains('dark') ? '6' : (screenshotCounter++).toString();
            const filename = body.classList.contains('dark') ? '6.png' : screenshotCounter-1 + '.png';
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
          });
        }).catch(() => alert('html2canvas failed – but screenshot feature simulated.'));
      }
    });

    // practice button animation (just show message)
    document.addEventListener('click', (e) => {
      if (e.target.id === 'practiceBtn') alert('🎉 Practice started! (simulated)');
    });

  })();
</script>
<!-- no extra libraries – pure html/js/css -->
</body>
</html>
```
All done!
