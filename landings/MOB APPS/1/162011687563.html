```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Play – learn to code • 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1e2b;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 48px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 10px #2d3349;
            overflow: hidden;
            position: relative;
            transition: background 0.2s;
            display: flex;
            flex-direction: column;
        }

        /* themes */
        :root {
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary-blue: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive-icon: #94A3B8;
            --active-bg: rgba(37, 99, 235, 0.08);
            --shadow-sm: 0 4px 10px rgba(0,0,0,0.02);
            --progress-bg: #E2E8F0;
        }

        body.dark {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary-blue: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive-icon: #64748B;
            --active-bg: rgba(59, 130, 246, 0.15);
            --progress-bg: #334155;
        }

        /* main content */
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 18px 10px 18px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-blue) var(--border-light);
            display: flex;
            flex-direction: column;
        }

        .app-content::-webkit-scrollbar {
            width: 5px;
        }
        .app-content::-webkit-scrollbar-track { background: var(--border-light); border-radius: 8px; }
        .app-content::-webkit-scrollbar-thumb { background: var(--primary-blue); border-radius: 8px; }

        /* header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0 14px 0;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 650;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .profile-icon {
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
            transition: 0.1s;
        }
        .profile-icon:hover { background: var(--active-bg); }
        .profile-icon svg { display: block; }

        /* bottom nav */
        .bottom-nav {
            background: var(--bg-card);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-around;
            padding: 10px 8px 14px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: transform 0.15s ease;
            border: none;
            background: transparent;
            padding: 6px 12px 4px;
            border-radius: 30px;
            color: var(--inactive-icon);
            fill: var(--inactive-icon);
        }
        .nav-item.active {
            background: var(--active-bg);
            transform: scale(1.05);
            color: var(--primary-blue);
            fill: var(--primary-blue);
        }
        .nav-item.active svg { stroke: var(--primary-blue); }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        /* cards */
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 18px 16px;
            margin-bottom: 18px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }

        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
        }

        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 20px;
            margin: 12px 0 6px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary-blue);
            border-radius: 20px;
            transition: width 0.3s;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            background: var(--primary-blue);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 18px;
            border-radius: 40px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: 0.15s;
        }
        button:active { transform: scale(0.98); background: var(--primary-dark); }

        .small-link {
            font-size: 13px;
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 500;
        }

        /* modal */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-card {
            background: var(--bg-card);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            text-align: center;
            color: var(--text-primary);
        }

        /* screen visibility */
        .screen { display: none; flex-direction: column; height: 100%; }
        .screen.active { display: flex; }
        .app-content { flex:1; }

        /* icons list (hidden) */
        .icon-defs { display: none; }

        /* onboarding specific */
        .logo-area { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        .app-name-large { font-size: 40px; font-weight: 700; color: var(--primary-blue); letter-spacing: -1px; }

        .chart-sample {
            display: flex; gap: 6px; align-items: flex-end; height: 100px; margin: 20px 0;
        }
        .bar { width: 22px; background: var(--primary-blue); border-radius: 12px 12px 6px 6px; height: calc(70% - 20px); }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic content filled by js -->
    <div id="screensContainer" style="display: contents;"></div>
</div>

<!-- modal container (hidden by default) -->
<div id="modalLayer" style="display: none;"></div>

<script>
    (function() {
        // ---------- THEME ----------
        const applyTheme = (isDark) => {
            if (isDark) document.body.classList.add('dark');
            else document.body.classList.remove('dark');
        };
        let darkMode = false;

        // ---------- ICONS (inline SVG) ----------
        const icons = {
            home: `<svg viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 L3 10 Z"/></svg>`,
            learn: `<svg viewBox="0 0 24 24"><path d="M2 3 L12 3 L12 21 L2 21 L2 3 Z M22 3 L12 3 L12 21 L22 21 L22 3 Z M7 7 L7 9 M17 7 L17 9"/></svg>`,
            progress: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><path d="M12 3 L12 12 L17 17" stroke="currentColor" fill="none"/></svg>`,
            settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M21 12 L18 12 M6 12 L3 12 M12 3 L12 6 M12 18 L12 21 M4.93 4.93 L7.05 7.05 M16.97 16.97 L19.07 19.07 M19.07 4.93 L16.97 7.05 M7.05 16.97 L4.93 19.07" stroke="currentColor" stroke-width="2" fill="none"/></svg>`,
            profile: `<svg viewBox="0 0 24 24"><path d="M5 20 L5 17 C5 12 19 12 19 17 L19 20 M12 12 C9 12 7 10 7 7 C7 4 9 2 12 2 C15 2 17 4 17 7 C17 10 15 12 12 12 Z"/></svg>`,
            lesson: `<svg viewBox="0 0 24 24"><path d="M2 4 L12 4 L12 20 L2 20 L2 4 Z M22 4 L12 4 L12 20 L22 20 L22 4 Z M7 8 L9 8 M17 8 L19 8"/></svg>`,
            chart: `<svg viewBox="0 0 24 24"><path d="M3 17 L3 21 L21 21 M7 13 L7 19 M12 9 L12 19 M17 5 L17 19" stroke="currentColor" stroke-width="2" fill="none"/></svg>`,
            flashcards: `<svg viewBox="0 0 24 24"><rect x="4" y="2" width="14" height="20" rx="2" stroke="currentColor" fill="none"/><path d="M8 8 L14 8 M8 12 L14 12 M8 16 L12 16" stroke="currentColor" stroke-width="2"/></svg>`,
            play: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><polygon points="10,8 16,12 10,16" fill="currentColor"/></svg>`,
            check: `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" stroke="currentColor" stroke-width="3" fill="none"/></svg>`
        };

        // ---------- screen templates (html) ----------
        function onboardingScreen() {
            return `
                <div class="header"><h1>🐍 Python Play</h1><div class="profile-icon" data-screen="settings">${icons.profile}</div></div>
                <div class="app-content">
                    <div class="logo-area"><span class="app-name-large">Py.</span></div>
                    <h2 style="font-size:32px; line-height:1.2; margin-bottom:8px;">learn to<br>code 2026</h2>
                    <p style="color:var(--text-secondary); margin:16px 0 24px;">Bite‑sized Python lessons, puzzles & real‑time practice. From zero to hero.</p>
                    <button id="getStartedBtn">Get Started →</button>
                    <div style="display:flex; gap:18px; justify-content:center; margin:24px 0 8px;">
                        <span class="small-link" data-modal="privacy">Privacy Policy</span>
                        <span class="small-link" data-modal="terms">Terms of Service</span>
                    </div>
                    <div class="card" style="margin-top:16px;">
                        <span class="badge">daily streak 🔥 7</span>
                        <div style="margin-top:12px; display:flex; gap:12px;">${icons.flashcards} ${icons.lesson} ${icons.play}</div>
                    </div>
                </div>
            `;
        }

        function homeScreen() {
            return `
                <div class="header"><h1>Home</h1><div class="profile-icon" data-screen="settings">${icons.profile}</div></div>
                <div class="app-content">
                    <div class="card"><span class="badge">🌟 current streak 12 days</span><h3 style="margin:12px 0 4px;">keep it up!</h3><div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div><p>3/5 lessons this week</p></div>
                    <div class="card"><div class="row"><span>📘 recommended</span><span class="small-link">view all</span></div><div style="display:flex; gap:16px; margin-top:16px;"><div>${icons.lesson} <span>loops</span></div><div>${icons.flashcards} <span>dicts</span></div><div>${icons.play} <span>quiz</span></div></div></div>
                    <div class="card"><h4>recent practice</h4><div class="row"><span>functions</span><span>92%</span></div><div class="progress-bar"><div class="progress-fill" style="width:92%"></div></div></div>
                </div>
            `;
        }

        function learnScreen() {
            return `
                <div class="header"><h1>Learn</h1><div class="profile-icon" data-screen="settings">${icons.profile}</div></div>
                <div class="app-content">
                    <div class="card"><div class="row"><span>⚡ variables</span><span>lesson 1/5</span></div><div class="progress-bar"><div class="progress-fill" style="width:20%"></div></div><button style="margin-top:12px;padding:8px;" id="startPracticeMock">continue</button></div>
                    <div class="card"><div class="row"><span>🧩 lists</span><span>3 exercises</span></div><div class="progress-bar"><div class="progress-fill" style="width:50%"></div></div></div>
                    <div class="card"><div class="row"><span>🔁 loops</span><span>new</span></div>${icons.play}</div>
                </div>
            `;
        }

        function progressScreen() {
            return `
                <div class="header"><h1>Progress</h1><div class="profile-icon" data-screen="settings">${icons.profile}</div></div>
                <div class="app-content">
                    <div class="card"><h4>weekly activity</h4><div class="chart-sample"><div class="bar" style="height:32px;"></div><div class="bar" style="height:58px;"></div><div class="bar" style="height:44px;"></div><div class="bar" style="height:70px;"></div><div class="bar" style="height:28px;"></div><div class="bar" style="height:62px;"></div><div class="bar" style="height:40px;"></div></div></div>
                    <div class="card"><span class="badge">🏅 4 badges</span><div style="display:flex; gap:14px; margin-top:12px;">${icons.check} ${icons.flashcards} ${icons.chart}</div></div>
                    <div class="card"><span>total lessons completed: 42</span><div class="progress-bar"><div class="progress-fill" style="width:72%"></div></div></div>
                </div>
            `;
        }

        function settingsScreen() {
            return `
                <div class="header"><h1>Settings</h1><div class="profile-icon" data-screen="settings">${icons.profile}</div></div>
                <div class="app-content">
                    <div class="card row"><span>🌙 Dark mode</span><label class="switch"><input type="checkbox" id="darkToggle"></label></div>
                    <div class="card">profile: Alex C.</div>
                    <div class="card">notifications</div>
                    <div class="card">privacy & terms</div>
                </div>
            `;
        }

        // ---------- navigation ----------
        const screens = {
            onboarding: onboardingScreen,
            home: homeScreen,
            learn: learnScreen,
            progress: progressScreen,
            settings: settingsScreen
        };
        let currentScreen = 'onboarding';

        function renderScreen(name) {
            const container = document.getElementById('screensContainer');
            container.innerHTML = `<div class="screen active" id="activeScreen">${screens[name]()}</div>`;
            currentScreen = name;
            attachNavEvents();
            attachModalLinks();
            if (name === 'settings') {
                const toggle = document.getElementById('darkToggle');
                if (toggle) { toggle.checked = darkMode;
                    toggle.addEventListener('change', (e) => { darkMode = e.target.checked; applyTheme(darkMode); renderScreen(currentScreen); });
                }
            }
            // after render, mark active bottom item
            highlightBottomNav(name);
        }

        function highlightBottomNav(screenId) {
            setTimeout(() => {
                document.querySelectorAll('.nav-item').forEach(el => { el.classList.remove('active'); });
                let target;
                if (screenId === 'onboarding' || screenId === 'home') target = 'home';
                else if (screenId === 'learn') target = 'learn';
                else if (screenId === 'progress') target = 'progress';
                else if (screenId === 'settings') target = 'settings';
                const navEl = document.querySelector(`.nav-item[data-nav="${target}"]`);
                if (navEl) navEl.classList.add('active');
            }, 10);
        }

        // bottom nav component
        function bottomNav() {
            return `
                <div class="bottom-nav">
                    <div class="nav-item" data-nav="home">${icons.home}<span>Home</span></div>
                    <div class="nav-item" data-nav="learn">${icons.learn}<span>Learn</span></div>
                    <div class="nav-item" data-nav="progress">${icons.progress}<span>Progress</span></div>
                    <div class="nav-item" data-nav="settings">${icons.settings}<span>Settings</span></div>
                </div>
            `;
        }

        function attachNavEvents() {
            document.querySelectorAll('.nav-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    const nav = e.currentTarget.dataset.nav;
                    if (nav === 'home') renderScreen('home');
                    else if (nav === 'learn') renderScreen('learn');
                    else if (nav === 'progress') renderScreen('progress');
                    else if (nav === 'settings') renderScreen('settings');
                });
            });
            document.querySelectorAll('.profile-icon').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    renderScreen('settings');
                });
            });
            document.getElementById('getStartedBtn')?.addEventListener('click', () => renderScreen('home'));
            document.getElementById('startPracticeMock')?.addEventListener('click', () => alert('practice started! (demo)'));
        }

        function attachModalLinks() {
            document.querySelectorAll('[data-modal]').forEach(el => {
                el.addEventListener('click', (e) => {
                    const type = e.target.dataset.modal;
                    const modalHtml = `<div class="modal-overlay" id="modalOverlay"><div class="modal-card"><h3>${type === 'privacy' ? 'Privacy' : 'Terms'}</h3><p style="margin:16px 0;">simple ${type} statement for python learning app.</p><button id="closeModalBtn">close</button></div></div>`;
                    const layer = document.getElementById('modalLayer');
                    layer.style.display = 'block';
                    layer.innerHTML = modalHtml;
                    document.getElementById('closeModalBtn').addEventListener('click', () => { layer.style.display = 'none'; });
                    document.getElementById('modalOverlay').addEventListener('click', (e) => { if (e.target.id === 'modalOverlay') layer.style.display = 'none'; });
                });
            });
        }

        // initial render with bottomNav
        function initApp() {
            const container = document.getElementById('screensContainer');
            container.innerHTML = `<div class="screen active" id="activeScreen">${screens.onboarding()}</div>${bottomNav()}`;
            currentScreen = 'onboarding';
            attachNavEvents();
            attachModalLinks();
            highlightBottomNav('onboarding');
        }

        initApp();

        // ---------- screenshot SHIFT+W ----------
        let shotCounter = 1;
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
                    html2canvas(phone, { scale: 2, backgroundColor: null }).then(canvas => {
                        const link = document.createElement('a');
                        const isDark = document.body.classList.contains('dark');
                        const fileName = isDark ? '6.png' : (shotCounter + '.png');
                        if (!isDark && shotCounter < 6) { shotCounter = (shotCounter % 5) + 1; }
                        else if (!isDark && shotCounter >=6) shotCounter = 1;
                        link.download = fileName;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    });
                }).catch(() => alert('html2canvas load failed, but you can use any screenshot tool.'));
            }
        });

        // export for global theme
        window.applyTheme = applyTheme;
    })();
</script>

<!-- fake import for html2canvas (will load only on shortcut) -->
<div style="display: none;"></div>

</body>
</html>
All done!
