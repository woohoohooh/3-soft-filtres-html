  (function() {

      chart: `<svg class="icon-micro" viewBox="0 0 24 24"><path d="M21 20H3" stroke="currentColor"/><path d="M6 16V10" stroke="currentColor"/><path d="M12 16V6" stroke="currentColor"/><path d="M18 16V13" stroke="currentColor"/></svg>`,
      flashcards: `<svg class="icon-micro" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" fill="none"/><path d="M9 7H15" stroke="currentColor"/><path d="M9 11H15" stroke="currentColor"/><path d="M9 15H13" stroke="currentColor"/></svg>`,
      play: `<svg class="icon-micro" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><path d="M10 8L16 12L10 16V8Z" stroke="currentColor" fill="none"/></svg>`,
      check: `<svg class="icon-micro" viewBox="0 0 24 24"><path d="M20 6L9 17L4 12" stroke="currentColor"/></svg>`,
    };

    // ----- screen definitions (rich UI) -----
    const screens = {
      onboarding: `
        <div class="screen" id="onboarding-screen">
          <div style="flex:1; display: flex; flex-direction: column; justify-content: center;">
            <div style="font-size: 48px; margin-bottom: 8px;">📘</div>

            <p style="font-size: 18px; color: var(--text-secondary); margin-bottom: 8px;">expand your vocabulary</p>

            <button class="btn-primary" id="getStartedBtn">Get Started</button>

              <button id="termsBtn">Terms of Service</button>

      `,

          <div class="grid-2"><div class="stat"><div>${icons.flashcards}</div><div style="font-weight:600;">120 words</div><div style="font-size:13px;">this week</div></div><div class="stat"><div>${icons.chart}</div><div style="font-weight:600;">85%</div><div>mastery</div></div></div>
          <div style="display:flex; gap:12px; overflow-x:auto; padding:4px 0 16px;"><span class="chip">beginners</span><span class="chip">business</span><span class="chip">idioms</span><span class="chip">travel</span></div>
          <div class="card"><div class="row-between"><span>📋 Today's words</span><span>5 min</span></div><div class="lesson-item"><span>🧠</span><div><b>aberration</b><div style="font-size:12px;">deviation from normal</div></div></div><div class="lesson-item"><span>🧠</span><div><b>catalyst</b><div style="font-size:12px;">something that causes change</div></div></div></div>
        </div>
      `,
      learn: `
        <div class="screen hidden" id="learn-screen">
          <div class="header"><h2>Learn</h2><button class="profile-icon" id="profileHeaderBtn2">${icons.profile}</button></div>
          <div class="card" style="background:var(--accent); color:black;"><div class="row-between"><span>🎯 Daily goal: 15 words</span><span>10/15</span></div><div class="progress-bar" style="background:#ffffff50"><div class="progress-fill" style="width:66%; background:var(--primary-dark);"></div></div></div>
          <div style="margin: 10px 0;">Recommended</div>
          <div class="card row-between"><span><b>Idioms master</b><br>12 lessons</span><span class="chip">60%</span></div>
          <div class="card row-between"><span><b>Academic word list</b><br>8 lessons</span><span class="chip">new</span></div>

      progress: `
        <div class="screen hidden" id="progress-screen">

    // ----- modals container -----
    let modalContainer = null;

    function showModal(title, content) {
      if (modalContainer) modalContainer.remove();
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `<div class="modal"><h3>${title}</h3><p>${content}</p><button id="closeModalBtn">OK</button></div>`;
      document.getElementById('phone').appendChild(overlay);
      modalContainer = overlay;
      overlay.querySelector('#closeModalBtn').onclick = () => { overlay.remove(); modalContainer = null; };
    }

    // ----- navigation -----
    const navItems = ['home', 'learn', 'progress', 'settings'];
    let currentScreen = 'onboarding';

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
      const active = document.getElementById(screenId + '-screen');
      if (active) active.classList.remove('hidden');
      else if (screenId === 'onboarding') document.getElementById('onboarding-screen').classList.remove('hidden');
      currentScreen = screenId;

      // update bottom nav active
      document.querySelectorAll('.nav-item').forEach(item => {
        const tab = item.dataset.tab;
        if (tab === screenId) {
          item.classList.add('active');
          item.classList.remove('inactive');
        } else {
          item.classList.remove('active');
          item.classList.add('inactive');
        }
      });
    }

    // ----- render phone skeleton + bottom nav + screens -----
    function buildUI() {
      const phone = document.getElementById('phone');
      phone.innerHTML = `
        ${screens.onboarding}
        ${screens.home}
        ${screens.learn}
        ${screens.progress}
        ${screens.settings}
        <div class="bottom-nav" id="bottomNav"></div>
      `;

      const navContainer = document.getElementById('bottomNav');
      const tabs = [
        { tab: 'home', label: 'Home', icon: icons.home },
        { tab: 'learn', label: 'Learn', icon: icons.learn },
        { tab: 'progress', label: 'Progress', icon: icons.progress },
        { tab: 'settings', label: 'Settings', icon: icons.settings }
      ];
      tabs.forEach(t => {
        const btn = document.createElement('button');
        btn.className = `nav-item ${t.tab === 'onboarding' ? '' : 'inactive'}`;
        btn.dataset.tab = t.tab;
        btn.innerHTML = `${t.icon}<span>${t.label}</span>`;
        btn.onclick = () => {
          if (t.tab !== 'onboarding') showScreen(t.tab);
        };
        navContainer.appendChild(btn);
      });

      // get started
      document.getElementById('getStartedBtn')?.addEventListener('click', () => {
        showScreen('home');
      });

      // privacy & terms modals
      document.getElementById('privacyBtn')?.addEventListener('click', () => showModal('Privacy Policy', 'Your data is stored locally. We do not share personal info.'));
      document.getElementById('termsBtn')?.addEventListener('click', () => showModal('Terms of Service', 'Use Lingua for personal learning only. v2026.1'));

      // profile header buttons (open settings)
      ['profileHeaderBtn','profileHeaderBtn2','profileHeaderBtn3','profileHeaderBtn4'].forEach(id => {
        document.getElementById(id)?.addEventListener('click', () => showScreen('settings'));
      });

      // continue practice / practice button opens learn screen
      document.getElementById('continuePractice')?.addEventListener('click', ()=>showScreen('learn'));
      document.getElementById('practiceBtn')?.addEventListener('click', ()=>showScreen('learn'));

      // dark mode toggle
      const darkToggle = document.getElementById('darkToggle');
      if (darkToggle) {
        darkToggle.checked = darkMode;
        darkToggle.addEventListener('change', (e) => {
          darkMode = e.target.checked;
          themeToggle();
        });
      }

      // set initial active (onboarding: no bottom highlight, but home later)
      showScreen('onboarding');
    }

    // ----- screenshot: shift+W -----
    document.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const phone = document.getElementById('phone');
        html2canvas(phone, { scale: 2 }).then(canvas => {
          const link = document.createElement('a');
          let filename = '1.png';
          if (currentScreen === 'home') filename = '2.png';
          else if (currentScreen === 'learn') filename = '3.png';
          else if (currentScreen === 'progress') filename = '4.png';
          else if (currentScreen === 'settings') filename = '5.png';
          if (darkMode && (currentScreen !== 'onboarding')) filename = '6.png';
          else if (darkMode && currentScreen === 'onboarding') filename = '6.png';

          link.download = filename;
          link.href = canvas.toDataURL('image/png');
          link.click();
        }).catch(() => alert('html2canvas not loaded – use simple fallback. manually capture.'));
      }
    });

    // load html2canvas from cdn (for screenshot)
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    script.onload = buildUI;
    document.head.appendChild(script);
  })();
</script>
