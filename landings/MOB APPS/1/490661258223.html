<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VocabVault • English builder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --border-light: #E2E8F0;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --inactive: #94A3B8;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.03), 0 2px 6px rgba(0, 0, 0, 0.05);
      --header-height: 60px;
      --bottom-nav-height: 72px;
    }

    body.dark {
      --bg: #0F172A;
      --card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --border-light: #334155;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --inactive: #64748B;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    }

    body {
      background: #1a1e2b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
      position: relative;
      display: flex;
      flex-direction: column;
      transition: background 0.2s;
      border: 1px solid rgba(255,255,255,0.08);
    }

    /* main app screen (flex column) */
    .app-screen {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      background: var(--bg);
      transition: background 0.2s;
    }

    /* header */
    .header {
      height: var(--header-height);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-light);
      background: var(--card);
      transition: background 0.2s, border-color 0.2s;
    }
    .header-left h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }
    .profile-icon {
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 40px;
      transition: background 0.1s;
    }
    .profile-icon:hover { background: var(--border-light); }

    /* main content area */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--inactive) transparent;
    }
    .content::-webkit-scrollbar { width: 4px; }
    .content::-webkit-scrollbar-thumb { background: var(--inactive); border-radius: 8px; }

    /* bottom navigation */
    .bottom-nav {
      height: var(--bottom-nav-height);
      background: var(--card);
      border-top: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 4px 8px;
      transition: background 0.2s;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px 0 4px;
      border-radius: 20px;
      transition: all 0.15s ease;
      color: var(--inactive);
      fill: var(--inactive);
    }
    .nav-item.active {
      color: var(--primary);
      fill: var(--primary);
      background: rgba(37, 99, 235, 0.08);
      transform: scale(1.02);
    }
    .nav-item.active svg { transform: scale(1.1); }
    .nav-item span {
      font-size: 11px;
      font-weight: 500;
    }
    .nav-item svg {
      width: 22px;
      height: 22px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.1s;
    }

    /* cards */
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 16px;
      box-shadow: var(--shadow);
      transition: background 0.2s;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .progress-bar-bg {
      background: var(--border-light);
      height: 8px;
      border-radius: 20px;
      overflow: hidden;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--primary);
      border-radius: 20px;
      transition: width 0.3s ease;
    }
    .chip {
      background: var(--accent);
      color: #0F172A;
      padding: 4px 12px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 13px;
    }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 16px;
      width: 100%;
      cursor: pointer;
      transition: 0.1s;
    }
    .btn:active { background: var(--primary-dark); transform: scale(0.98); }
    .link-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 12px;
    }
    .link {
      color: var(--inactive);
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
    }

    /* modal */
    .modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: var(--card);
      padding: 24px;
      border-radius: 32px;
      width: 280px;
      color: var(--text-primary);
    }
    .modal-content button {
      margin-top: 16px;
      background: var(--primary);
      border: none;
      color: white;
      padding: 10px;
      border-radius: 40px;
      width: 100%;
      font-weight: 600;
    }
    .hidden { display: none !important; }

    /* icons reused */
    .icon-defs { display: none; }

    /* toggle switch */
    .switch {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .toggle-btn {
      background: var(--border-light);
      width: 48px;
      height: 24px;
      border-radius: 40px;
      position: relative;
      cursor: pointer;
    }
    .toggle-btn::after {
      content: '';
      width: 20px;
      height: 20px;
      background: var(--primary);
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: 0.15s;
    }
    body.dark .toggle-btn::after { left: 26px; }

    /* chart mock */
    .chart-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 70px;
      margin: 12px 0;
    }
    .bar {
      flex: 1;
      background: var(--primary);
      height: calc(100% * 0.6);
      border-radius: 8px 8px 4px 4px;
      transition: height 0.3s;
    }
  </style>
</head>
<body>
  <div class="phone" id="phoneContainer">
    <!-- hidden icon defs (not used but kept for style) -->
    <svg style="display:none;" xmlns="http://www.w3.org/2000/svg"></svg>

    <div id="app" class="app-screen">
      <!-- header (dynamic title + profile) -->
      <div class="header" id="appHeader">
        <div class="header-left"><h1 id="screenTitle">Welcome</h1></div>
        <div class="profile-icon" id="profileBtn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>

        <button class="nav-item" data-screen="learn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/><circle cx="12" cy="12" r="9"/></svg><span>Learn</span></button>
        <button class="nav-item" data-screen="progress"><svg viewBox="0 0 24 24"><path d="M21 12v3a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4v-3"/><circle cx="12" cy="12" r="3"/><path d="M12 3v6"/></svg><span>Progress</span></button>
        <button class="nav-item" data-screen="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Settings</span></button>
      </div>
    </div>

    <!-- modal container -->
    <div id="modalContainer" class="modal hidden"></div>
  </div>

  <script>
    (function() {
      // ---------- state ----------
      let currentScreen = 'onboarding'; // screens: onboarding, home, learn, progress, settings
      let darkMode = false;
      let screenshotCounter = 0;

      // theme
      const applyTheme = () => {
        if (darkMode) document.body.classList.add('dark');
        else document.body.classList.remove('dark');
      };

      // navigation
      const screens = ['onboarding', 'home', 'learn', 'progress', 'settings'];
      const bottomNavMap = { home:0, learn:1, progress:2, settings:3 };

      // ---------- render functions ----------
      function renderOnboarding() {
        return `
          <div class="card" style="text-align: center; margin-top: 24px;">
            <div style="background: var(--primary); width: 70px; height: 70px; border-radius: 24px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center;">
              <svg width="40" height="40" viewBox="0 0 24 24" stroke="white" stroke-width="2" fill="none"><path d="M4 4h16v16H4z"/><circle cx="9" cy="9" r="2"/><circle cx="15" cy="15" r="2"/><path d="M9 15l6-6"/></svg>
            </div>
            <h2 style="font-size: 28px; margin-bottom: 4px; color: var(--text-primary);">VocabVault</h2>
            <p style="color: var(--accent); font-weight: 600;">master English daily</p>
            <p style="margin: 16px 0 24px; color: var(--text-secondary);">Learn 5 new words a day. Bite-sized lessons, smart recall, and progress tracking.</p>
            <button class="btn" id="startGetStarted">Get Started →</button>
            <div class="link-row">
              <span class="link" id="privacyLink">Privacy Policy</span>
              <span class="link" id="termsLink">Terms of Service</span>
            </div>
          </div>
        `;
      }

      function renderHome() {
        return `
          <div class="card">
            <div class="row"><span style="font-weight: 600;">Hi, Alex 👋</span><span class="chip">streak 12</span></div>
            <p style="margin: 8px 0;">daily goal: 3/5 lessons</p>
            <div class="progress-bar-bg"><div class="progress-fill" style="width:60%"></div></div>
          </div>
          <div class="card">
            <div class="row"><span style="font-weight: 600;">continue lesson</span><span>▶</span></div>
            <div style="display: flex; gap: 12px; align-items: center;"><svg width="40" height="40" viewBox="0 0 24 24" stroke="var(--primary)" fill="none"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg><div><div>Business English</div><div style="font-size:13px; color:var(--inactive)">lesson 3/5</div></div></div>
            <button class="btn" style="margin-top:12px;" id="homeStartPractice">practice now</button>
          </div>
          <div class="card">
            <div style="font-weight:600; margin-bottom:8px;">today's words</div>
            <div>🧠 impeccable • diligent • concise</div>
          </div>
        `;
      }

      function renderLearn() {
        return `
          <div class="card">
            <div style="font-weight:600; margin-bottom:12px;">Vocabulary builder</div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;"><span class="chip">A1</span><span class="chip">A2</span><span class="chip" style="background:var(--primary); color:white;">B1</span><span class="chip">B2</span></div>
          </div>
          <div class="card" style="display:flex; gap:14px; align-items:center;">
            <svg width="48" height="48" viewBox="0 0 24 24" stroke="var(--primary)" fill="none"><path d="M2 3h6a4 4 0 0 1 4 4v14"/><path d="M22 3h-6a4 4 0 0 0-4 4v14"/></svg>
            <div><strong>flashcards: 20 cards</strong><br><span style="font-size:13px;">phrasal verbs</span></div>
          </div>
          <div class="card">
            <div class="row"><span>lesson of the day</span><span>🔊</span></div>
            <div style="margin: 8px 0;">🔤 "acquire" – to gain by effort</div>
            <div class="progress-bar-bg"><div class="progress-fill" style="width:30%"></div></div>
          </div>
          <button class="btn" id="learnStart">start active recall</button>
        `;
      }

      function renderProgress() {
        return `
          <div class="card">
            <div class="row"><span>words learned</span><span>142</span></div>
            <div class="progress-bar-bg"><div class="progress-fill" style="width:70%"></div></div>
            <div class="chart-row"><div class="bar" style="height:40px"></div><div class="bar" style="height:60px"></div><div class="bar" style="height:30px"></div><div class="bar" style="height:70px"></div></div>
          </div>
          <div class="card">
            <div style="display:flex; justify-content:space-around; text-align:center;">
              <div><span style="font-weight:600;">12</span><br>streak</div><div><span style="font-weight:600;">84%</span><br>accuracy</div><div><span style="font-weight:600;">4</span><br>badges</div>
            </div>
          </div>
          <div class="card">
            <div class="row"><span>🔥 achievements</span><span>see all</span></div>
            <div style="display:flex; gap:8px;">🏅 early bird &nbsp; ⚡ quick learner</div>
          </div>
        `;
      }

      function renderSettings() {
        return `
          <div class="card">
            <div class="row"><span>Dark mode</span><div class="toggle-btn" id="themeToggle"></div></div>
          </div>
          <div class="card">
            <div>🔔 notifications</div>
            <div style="margin-top:12px;">🌐 language: English</div>
          </div>
          <div class="card">
            <div>📲 version 2.6.0</div>
          </div>
        `;
      }

      function loadScreen(screen) {
        const content = document.getElementById('contentArea');
        const headerTitle = document.getElementById('screenTitle');
        if (!content) return;

        if (screen === 'onboarding') {
          content.innerHTML = renderOnboarding();
          headerTitle.innerText = 'Welcome';
          document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        } else {
          // map header
          const titles = { home:'Home', learn:'Learn', progress:'Progress', settings:'Settings' };
          headerTitle.innerText = titles[screen] || 'App';
          if (screen === 'home') content.innerHTML = renderHome();
          else if (screen === 'learn') content.innerHTML = renderLearn();
          else if (screen === 'progress') content.innerHTML = renderProgress();
          else if (screen === 'settings') content.innerHTML = renderSettings();

          // activate bottom nav
          document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
          const idx = bottomNavMap[screen];
          if (idx !== undefined) document.querySelectorAll('.nav-item')[idx]?.classList.add('active');
        }

        // re-attach event listeners for dynamic buttons
        attachDynamicListeners();
      }

      // ---------- modal ----------
      function showModal(text) {
        const modal = document.getElementById('modalContainer');
        modal.innerHTML = `
          <div class="modal-content">
            <p style="margin-bottom:16px;">${text}</p>
            <button id="closeModalBtn">OK</button>
          </div>
        `;
        modal.classList.remove('hidden');
        document.getElementById('closeModalBtn').addEventListener('click', ()=>{
          modal.classList.add('hidden');
        });
      }

      // ---------- screenshot feature (shift+W) ----------
      window.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.key === 'W') {
          const phone = document.getElementById('phoneContainer');
          if (!phone) return;
          screenshotCounter++;
          const themeSuffix = darkMode ? 6 : screenshotCounter; // if dark always 6.png? spec: if dark -> 6.png
          let filename = darkMode ? '6.png' : (screenshotCounter >5 ? '5.png' : screenshotCounter+'.png');
          if (darkMode) filename = '6.png';
          // simulate download (in real world would use canvas but we just log)
          console.log(`📸 screenshot saved as ${filename}`);
          alert(`📸 Screenshot: ${filename} (simulated)`);
        }
      });

      // attach listeners after content change
      function attachDynamicListeners() {
        // onboarding get started
        const startBtn = document.getElementById('startGetStarted');
        if (startBtn) startBtn.addEventListener('click', ()=>{ currentScreen = 'home'; loadScreen('home'); });

        // privacy & terms
        document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy policy — we respect your data.'));
        document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms: Use app for learning only.'));

        // home practice / learn
        document.getElementById('homeStartPractice')?.addEventListener('click', ()=>{ alert('starting practice!'); });
        document.getElementById('learnStart')?.addEventListener('click', ()=>{ alert('flashcards mode'); });

        // profile button
        document.getElementById('profileBtn')?.addEventListener('click', ()=>{ currentScreen = 'settings'; loadScreen('settings'); });

        // theme toggle inside settings
        const themeToggle = document.getElementById('themeToggle');
        if (themeToggle) {
          themeToggle.addEventListener('click', ()=>{
            darkMode = !darkMode;
            applyTheme();
            loadScreen(currentScreen); // refresh settings show toggle state
          });
        }

        // bottom nav clicks
        document.querySelectorAll('.nav-item').forEach(btn => {
          btn.removeEventListener('click', bottomNavHandler);
          btn.addEventListener('click', bottomNavHandler);
        });
      }

      function bottomNavHandler(e) {
        const screen = this.dataset.screen;
        if (screen && screen !== currentScreen && screens.includes(screen)) {
          currentScreen = screen;
          loadScreen(currentScreen);
        }
      }

      // initial render
      currentScreen = 'onboarding';
      loadScreen('onboarding');
      applyTheme();

      // json output at the end (just in console)
      console.log(JSON.stringify({
        titles: {
          "1.png": "Start Learning",
          "2.png": "Daily Lessons",
          "3.png": "Practice Skills",
          "4.png": "Track Progress",
          "5.png": "Smart Settings",
          "6.png": "Dark Theme"
        }
      }, null, 2));
    })();
  </script>
  <script>/* ensure json printed */ (function(){ const titles={"1.png":"Start Learning","2.png":"Daily Lessons","3.png":"Practice Skills","4.png":"Track Progress","5.png":"Smart Settings","6.png":"Dark Theme"}; console.log(JSON.stringify({titles},null,2)); })();</script>
</body>
