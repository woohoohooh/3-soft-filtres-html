<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashLearn · 2026 prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #1b1e2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --border: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --nav-highlight: rgba(37, 99, 235, 0.08);
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
        }
        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --border: #334155;
            --primary: #3B82F6;
            --accent: #38BDF8;
            --inactive: #64748B;
            --nav-highlight: rgba(59, 130, 246, 0.15);
        }
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px rgba(220,220,240,0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background-color 0.2s;
        }
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* header */
        .header {
            padding: 16px 20px 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }
        .header h2 {
            font-size: 20px;
            font-weight: 650;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .profile-icon {
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            transition: background 0.1s;
            line-height: 0;
        }
        .profile-icon:hover {
            background: var(--nav-highlight);
        }
        /* main screen content */
        .screen-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px 8px 16px;
            background: var(--bg);
            scrollbar-width: thin;
        }
        /* bottom nav */
        .bottom-nav {
            background: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 8px 10px 8px;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px 0 4px;
            border-radius: 20px;
            transition: all 0.15s ease;
            color: var(--inactive);
            fill: var(--inactive);
            font-size: 11px;
            font-weight: 500;
            gap: 4px;
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            background: var(--nav-highlight);
            transform: scale(1.02);
        }
        .nav-item.active svg {
            transform: scale(1.1);
            filter: drop-shadow(0 2px 4px rgba(37,99,235,0.2));
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.15s;
        }
        .nav-item span {
            font-size: 11px;
        }
        /* cards */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }
        .flex-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
        }
        .progress-bar {
            height: 8px;
            background: var(--border);
            border-radius: 40px;
            margin: 12px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            border-radius: 40px;
            transition: width 0.3s;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-item {
            background: var(--bg);
            padding: 12px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid var(--border);
        }
        button {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 24px;
            border-radius: 60px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            width: 100%;
        }
        button:active { transform: scale(0.98); background: var(--primary-dark); }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 16px;
            font-size: 12px;
        }
        .link-row span {
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
        }
        /* modal */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: var(--card);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            color: var(--text);
            border: 1px solid var(--border);
            text-align: center;
        }
        .modal-content button {
            margin-top: 20px;
            background: var(--primary);
        }
        .hidden { display: none; }
        .icon-grid {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 8px 0;
        }
        .icon-badge {
            background: var(--accent);
            border-radius: 40px;
            padding: 4px 10px;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <div class="app-container" id="appContainer">
        <!-- dynamic header and screen rendered via js -->
    </div>
</div>
<script>
    (function() {
        // ---------- THEME & CONST ----------
        const container = document.getElementById('appContainer');
        let currentScreen = 'onboarding';
        let darkMode = false;
        let screenshotCounter = 0;
        const titles = {
            "1.png": "Start Learning",
            "2.png": "Daily Lessons",
            "3.png": "Practice Skills",
            "4.png": "Track Progress",
            "5.png": "Smart Settings",
            "6.png": "Dark Theme"
        };

        // ---------- SVG ICONS (inline, same style) ----------
        const icons = {
            home: `<svg viewBox="0 0 24 24"><path d="M5 12H3L12 3L21 12H19M5 12V20H9V16H15V20H19V12M5 12H9M19 12H15" stroke="currentColor" fill="none"/></svg>`,
            learn: `<svg viewBox="0 0 24 24"><path d="M4 19.5L12 15L20 19.5V5L12 9.5L4 5V19.5Z" stroke="currentColor" fill="none"/><path d="M12 9.5V15" stroke="currentColor"/></svg>`,
            progress: `<svg viewBox="0 0 24 24"><path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3" stroke="currentColor" fill="none"/><circle cx="12" cy="12" r="2" stroke="currentColor"/><path d="M12 8V12L15 15" stroke="currentColor"/></svg>`,
            settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5" stroke="currentColor" fill="none"/><path d="M19.4 15C19 15.8 18.3 16.4 17.5 16.6L16.8 18.3C16.4 19.2 15.3 19.5 14.4 19.1L12.5 18.2C12.2 18.4 11.8 18.4 11.5 18.2L9.6 19.1C8.7 19.5 7.6 19.2 7.2 18.3L6.5 16.6C5.7 16.4 5 15.8 4.6 15L2.8 14.5C1.9 14.1 1.6 13 2 12.1L2.9 10.2C2.7 9.9 2.7 9.5 2.9 9.2L2 7.3C1.6 6.4 1.9 5.3 2.8 4.9L4.5 4.2C4.7 3.4 5.3 2.7 6.1 2.3L6.8 0.6C7.2 -0.3 8.3 -0.6 9.2 0.2L11.1 1.1C11.4 0.9 11.8 0.9 12.1 1.1L14 0.2C14.9 -0.2 16 0.1 16.4 1L17.1 2.7C17.9 2.9 18.6 3.5 19 4.3L20.7 5C21.6 5.4 21.9 6.5 21.5 7.4L20.6 9.3C20.8 9.6 20.8 10 20.6 10.3L21.5 12.2C21.9 13.1 21.6 14.2 20.7 14.6L19 15.3Z" stroke="currentColor" fill="none"/></svg>`,
            profile: `<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" stroke="currentColor" fill="none"/><path d="M5 20v-2a7 7 0 0 1 14 0v2" stroke="currentColor" fill="none"/></svg>`,
            lesson: `<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" fill="none"/><path d="M9 8H15M9 12H15M9 16H13" stroke="currentColor"/></svg>`,
            chart: `<svg viewBox="0 0 24 24"><path d="M21 21H3V3M7 15L10 10L13 13L19 7" stroke="currentColor" fill="none"/></svg>`,
            flashcards: `<svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="1" stroke="currentColor" fill="none"/><path d="M9 8H15M9 12H13" stroke="currentColor"/></svg>`,
            play: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><polygon points="10,8 16,12 10,16" fill="currentColor"/></svg>`,
            check: `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" stroke="currentColor" fill="none"/></svg>`
        };

        // ---------- helper: header ----------
        function renderHeader(title) {
            return `<div class="header"><h2>${title}</h2><div class="profile-icon" id="profileBtn">${icons.profile}</div></div>`;
        }

        // ---------- bottom nav ----------
        function renderBottomNav(active) {
            const items = [
                { id: 'home', label: 'Home', icon: icons.home },
                { id: 'learn', label: 'Learn', icon: icons.learn },
                { id: 'progress', label: 'Progress', icon: icons.progress },
                { id: 'settings', label: 'Settings', icon: icons.settings }
            ];
            return `<div class="bottom-nav">${items.map(item => `
                <button class="nav-item ${active === item.id ? 'active' : ''}" data-nav="${item.id}">
                    ${item.icon}
                    <span>${item.label}</span>
                </button>`).join('')}
            </div>`;
        }

        // ---------- modal system ----------
        let modalResolve;
        function showModal(title, content) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `<div class="modal-content"><h3>${title}</h3><p style="margin:16px 0">${content}</p><button id="closeModalBtn">OK</button></div>`;
            document.querySelector('.phone').appendChild(modal);
            document.getElementById('closeModalBtn').onclick = () => { modal.remove(); if(modalResolve) modalResolve(); };
        }

        // ---------- screen rendering ----------
        function renderScreen(screen) {
            let html = '';
            if (screen === 'onboarding') {
                html = renderHeader('Welcome') + `
                <div class="screen-content" style="display:flex; flex-direction:column; justify-content:center;">
                    <div style="text-align:center; margin-bottom:32px;">
                        <div style="font-size:48px; margin-bottom:12px;">🧠</div>
                        <h1 style="font-size:32px; color:var(--primary);">FlashLearn</h1>
                        <p style="font-size:18px; font-weight:500; margin:4px 0;">smart flashcards</p>
                        <p style="color:var(--text-light); margin:20px 0;">Master any topic with adaptive recall. Bite‑sized daily sessions.</p>
                        <button id="getStartedBtn">Get Started</button>
                        <div class="link-row"><span id="privacyLink">Privacy Policy</span><span id="termsLink">Terms of Service</span></div>
                    </div>
                </div>` + renderBottomNav('home'); // nav hidden but consistent
            }
            if (screen === 'home') {
                html = renderHeader('Home') + `
                <div class="screen-content">
                    <div class="card"><div class="flex-row">${icons.flashcards}<span style="font-weight:600;">Daily goal</span></div><div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div><p>3 of 5 cards done</p></div>
                    <div class="card"><h3>Continue lesson</h3><div class="flex-row" style="justify-content:space-between"><span>Python basics</span><span class="badge">60%</span></div><div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div><button class="start-lesson" style="margin-top:12px; padding:10px;">${icons.play}  continue</button></div>
                    <div class="stat-grid"><div class="stat-item"><span>🔥 streak</span><br><span style="font-size:28px;">7</span></div><div class="stat-item"><span>⭐ points</span><br><span style="font-size:28px;">840</span></div></div>
                </div>` + renderBottomNav('home');
            }
            if (screen === 'learn') {
                html = renderHeader('Learn') + `
                <div class="screen-content">
                    <div class="card flex-row" style="justify-content:space-between;"><span>⚡ Python flashcards</span><span class="badge">12 left</span></div>
                    <div class="card flex-row" style="justify-content:space-between;"><span>📘 Data types</span><span class="badge">5 min</span></div>
                    <div class="card flex-row" style="justify-content:space-between;"><span>🔁 Loops</span><span class="badge">mastered</span></div>
                    <button class="start-lesson" style="margin-top:8px;">${icons.play} practice now</button>
                </div>` + renderBottomNav('learn');
            }
            if (screen === 'progress') {
                html = renderHeader('Progress') + `
                <div class="screen-content">
                    <div class="card"><h3>Weekly activity</h3>${icons.chart}<div class="stat-grid"><div class="stat-item">Mon 5</div><div class="stat-item">Tue 8</div></div></div>
                    <div class="card"><div class="flex-row">${icons.flashcards}<span>cards reviewed: 342</span></div><div class="flex-row">${icons.check}<span>mastered: 98</span></div></div>
                </div>` + renderBottomNav('progress');
            }
            if (screen === 'settings') {
                html = renderHeader('Settings') + `
                <div class="screen-content">
                    <div class="card flex-row" style="justify-content:space-between;"><span>🌙 Dark mode</span><label><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}></label></div>
                    <div class="card">Profile: Alex •  ${icons.profile}</div>
                    <div class="card">Notifications, sound..</div>
                </div>` + renderBottomNav('settings');
            }
            // profile = settings actually
            container.innerHTML = html;

            // events
            if (screen === 'onboarding') {
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{ currentScreen='home'; renderScreen('home'); });
                document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy Policy', 'We respect your data. No sharing.'));
                document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms of Service', 'Use = learning. Be nice.'));
            }
            document.querySelectorAll('[data-nav]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const nav = e.currentTarget.dataset.nav;
                    currentScreen = nav;
                    renderScreen(nav);
                });
            });
            document.getElementById('profileBtn')?.addEventListener('click', ()=>{
                currentScreen = 'settings';
                renderScreen('settings');
            });
            const darkToggle = document.getElementById('darkToggle');
            if (darkToggle) {
                darkToggle.checked = darkMode;
                darkToggle.addEventListener('change', (e) => {
                    darkMode = e.target.checked;
                    document.body.classList.toggle('dark', darkMode);
                    renderScreen(currentScreen); // refresh
                });
            }
            // start lesson button simulation (update progress bar)
            document.querySelectorAll('.start-lesson').forEach(b => b.addEventListener('click', ()=>{
                if(currentScreen==='home') { const fill = document.querySelector('.progress-fill'); if(fill) fill.style.width='75%'; }
                showModal('Lesson started', 'Great! keep learning.');
            }));
        }

        // ---------- init light mode ----------
        document.body.classList.remove('dark');
        renderScreen('onboarding');

        // ---------- screenshot hotkey (shift+W) ----------
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                if (!phone) return;
                // index mapping
                let index = 0;
                if (currentScreen === 'onboarding') index = 1;
                else if (currentScreen === 'home') index = 2;
                else if (currentScreen === 'learn') index = 3;
                else if (currentScreen === 'progress') index = 4;
                else if (currentScreen === 'settings') index = 5;
                if (darkMode) index = 6;
                const filename = index + '.png';
                console.log(`📸 screenshot: ${filename} – ${titles[filename]}`);
                // simulate download (base64 placeholder)
                const canvas = document.createElement('canvas');
                canvas.width = 360; canvas.height = 780;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = darkMode ? '#0F172A' : '#F8FAFC';
                ctx.fillRect(0,0,360,780);
                ctx.fillStyle = darkMode ? '#E2E8F0' : '#0F172A';
                ctx.font = 'bold 20px Inter';
                ctx.fillText('📱', 140, 360);
                const link = document.createElement('a');
                link.download = filename;
                link.href = canvas.toDataURL('image/png');
                link.click();
                alert(`📸 captured as ${filename} (simulated)`);
            }
        });
    })();
</script>
