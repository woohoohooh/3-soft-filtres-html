```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Brain Trainer · 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive-icon: #94A3B8;
            --progress-bg: #E2E8F0;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive-icon: #64748B;
            --progress-bg: #334155;
        }

        body {
            background: #0b1120;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            margin: 0;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 0 8px #1E293B;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s;
        }

        /* main app screens */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: none;
            padding: 16px 16px 8px 16px;
        }
        .app-screen::-webkit-scrollbar { display: none; }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 16px 0;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            transition: background 0.15s;
        }
        .profile-btn:hover { background: var(--border-light); }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 12px;
            background-color: var(--card);
            border-top: 1px solid var(--border-light);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px 0 4px;
            border-radius: 20px;
            transition: all 0.2s ease;
            color: var(--inactive-icon);
            fill: var(--inactive-icon);
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            transform: scale(1.05);
            background: rgba(37, 99, 235, 0.08);
        }
        .nav-icon {
            width: 26px;
            height: 26px;
            transition: transform 0.15s;
        }
        .nav-item.active .nav-icon { transform: scale(1.1); }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            margin-top: 2px;
            color: currentColor;
        }

        /* cards & common */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            border: 1px solid var(--border-light);
        }
        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
        }
        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 40px;
            margin: 12px 0 6px;
            overflow: hidden;
        }
        .progress-fill {
            height: 8px;
            background: var(--primary);
            width: 0%;
            border-radius: 40px;
            transition: width 0.3s ease;
        }
        .icon-svg {
            width: 22px;
            height: 22px;
            display: inline-block;
        }
        button {
            background: none;
            border: none;
            cursor: pointer;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            font-weight: 600;
            padding: 14px 24px;
            border-radius: 40px;
            width: 100%;
            font-size: 18px;
            border: none;
            box-shadow: 0 6px 14px rgba(37,99,235,0.3);
            transition: 0.1s;
        }
        .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }

        /* modal */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--card);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            color: var(--text-primary);
            box-shadow: 0 20px 30px black;
        }
        .modal-content button {
            margin-top: 16px;
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
        }
        .hidden { display: none; }

        /* icons inline */
        .icon-placeholder { display: contents; } /* svg definitions */
    </style>
</head>
<body>
    <div class="phone" id="phoneContainer">
        <!-- dynamic header + screen + bottom nav -->
        <div id="app"></div>
    </div>

    <!-- inline SVG icon system -->
    <svg style="display: none;" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- home -->
            <symbol id="icon-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 10L12 3L21 10V20H3V10Z" />
                <path d="M9 20V14H15V20" />
            </symbol>
            <!-- learn -->
            <symbol id="icon-learn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 6L12 2L22 6L12 10L2 6Z" />
                <path d="M2 12V18L12 22L22 18V12" />
                <path d="M12 10V22" />
            </symbol>
            <!-- progress -->
            <symbol id="icon-progress" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3" />
                <circle cx="12" cy="12" r="9" />
                <path d="M12 7V12L15 15" />
            </symbol>
            <!-- settings -->
            <symbol id="icon-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3" />
                <path d="M20 7L21 12L20 17H16L12 21L8 17H4L3 12L4 7H8L12 3L16 7H20Z" />
            </symbol>
            <!-- profile (simple user) -->
            <symbol id="icon-profile" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21V19C20 16.8 18.2 15 16 15H8C5.8 15 4 16.8 4 19V21" />
                <circle cx="12" cy="7" r="4" />
            </symbol>
            <!-- lesson -->
            <symbol id="icon-lesson" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="4" y="4" width="16" height="16" rx="2" />
                <path d="M9 8H15" /><path d="M9 12H15" /><path d="M9 16H12" />
            </symbol>
            <!-- chart -->
            <symbol id="icon-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 16V20H3V4" /><path d="M7 16L10 10L13 13L18 7" />
            </symbol>
            <!-- flashcards -->
            <symbol id="icon-flashcards" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 6H20V18H4V6Z" /><path d="M8 10H16" /><path d="M8 14H13" />
            </symbol>
            <!-- play -->
            <symbol id="icon-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" /><path d="M10 8L16 12L10 16V8Z" />
            </symbol>
            <!-- check -->
            <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 6L9 17L4 12" />
            </symbol>
        </defs>
    </svg>

    <script>
        (function(){
            // ---------- state ----------
            let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
            let darkMode = false;
            let screenshotCounter = 1; // will be used for naming, but we capture on shift+w

            // modal state
            let modalContent = null; // 'privacy' or 'terms'

            // ---------- helper: render icon from symbol ----------
            function renderIcon(symbolId, className = '') {
                return `<svg class="icon-svg ${className}" viewBox="0 0 24 24"><use href="#${symbolId}"></use></svg>`;
            }

            // ---------- data for math brain trainer ----------
            const dailyXP = 180;
            const streak = 7;
            const lessons = [
                { name: 'Mental addition', progress: 80, icon: 'icon-lesson' },
                { name: 'Multiplication table', progress: 45, icon: 'icon-flashcards' },
                { name: 'Equation solver', progress: 20, icon: 'icon-play' }
            ];
            const stats = { games: 24, avgTime: '48s', accuracy: '92%' };

            // ---------- screen renderers ----------
            function renderOnboarding() {
                return `
                    <div class="header">
                        <h1>🧠 MathTrain</h1>
                        <button class="profile-btn" onclick="window.app.navigate('settings')">${renderIcon('icon-profile')}</button>
                    </div>
                    <div class="card" style="text-align: center; padding: 32px 24px;">
                        <div style="font-size: 56px; margin-bottom: 8px;">🧮</div>
                        <h1 style="font-size: 32px; font-weight: 800; color: var(--primary);">Math Brain</h1>
                        <p style="font-size: 18px; font-weight: 500; margin: 4px 0 16px;">trainer · 2026</p>
                        <p style="color: var(--text-secondary); margin-bottom: 32px;">Master mental math daily. Bite‑sized challenges boost your number sense.</p>
                        <button class="btn-primary" onclick="window.app.navigate('home')">Get Started</button>
                        <div style="margin-top: 24px; display: flex; gap: 24px; justify-content: center;">
                            <button style="color: var(--primary); text-decoration: underline;" onclick="window.app.openModal('privacy')">Privacy</button>
                            <button style="color: var(--primary); text-decoration: underline;" onclick="window.app.openModal('terms')">Terms</button>
                        </div>
                    </div>
                `;
            }

            function renderHome() {
                return `
                    <div class="header">
                        <h1>Home</h1>
                        <button class="profile-btn" onclick="window.app.navigate('settings')">${renderIcon('icon-profile')}</button>
                    </div>
                    <div class="card">
                        <div class="flex-row"><span class="badge">🔥 ${streak} day streak</span><span>⭐ ${dailyXP} XP</span></div>
                        <div style="margin-top: 12px; font-weight: 600; font-size: 18px;">Continue where you left</div>
                        <div class="flex-row" style="margin: 8px 0;"><span>Daily workout</span><span>8 min</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width: 60%;"></div></div>
                        <button class="btn-primary" style="margin-top: 16px; padding: 12px;" onclick="window.app.navigate('learn')">${renderIcon('icon-play')} Start practice</button>
                    </div>
                    <div class="card">
                        <div class="flex-row"><span style="font-weight: 600;">Recommended</span><span>view all →</span></div>
                        ${lessons.map(l => `
                        <div class="flex-row" style="margin: 12px 0;">
                            <div style="display: flex; gap: 12px; align-items: center;">${renderIcon(l.icon)} ${l.name}</div>
                            <span>${l.progress}%</span>
                        </div>
                        <div class="progress-bar"><div class="progress-fill" style="width: ${l.progress}%;"></div></div>
                        `).join('')}
                    </div>
                `;
            }

            function renderLearn() {
                return `
                    <div class="header">
                        <h1>Learn</h1>
                        <button class="profile-btn" onclick="window.app.navigate('settings')">${renderIcon('icon-profile')}</button>
                    </div>
                    <div class="card" style="background: linear-gradient(145deg, var(--primary), var(--accent)); color: white;">
                        <div class="flex-row"><span style="font-weight: 700; font-size: 20px;">Daily drill</span> ${renderIcon('icon-play')}</div>
                        <p style="margin: 8px 0;">Complete 10 puzzles</p>
                        <div class="progress-bar" style="background: rgba(255,255,255,0.3);"><div class="progress-fill" style="background:white; width:40%;"></div></div>
                    </div>
                    <div class="card">
                        <h3 style="margin-bottom: 12px;">Flashcards mode</h3>
                        <div style="display: grid; gap: 12px;"> 
                            <div class="flex-row"><span>➕ Addition facts</span> <button onclick="window.app.updateProgress();" style="background: var(--primary); padding:6px 16px; border-radius:40px; color:white;">start</button></div>
                            <div class="flex-row"><span>✖️ Multiplication</span> <button onclick="window.app.updateProgress();" style="background: var(--primary); padding:6px 16px; border-radius:40px; color:white;">start</button></div>
                            <div class="flex-row"><span>🧩 Logic puzzles</span> <button onclick="window.app.updateProgress();" style="background: var(--primary); padding:6px 16px; border-radius:40px; color:white;">start</button></div>
                        </div>
                    </div>
                    <div class="card">
                        <span class="badge">new</span>
                        <p style="margin-top:8px;">Master square roots in 3 days</p>
                    </div>
                `;
            }

            function renderProgress() {
                return `
                    <div class="header">
                        <h1>Progress</h1>
                        <button class="profile-btn" onclick="window.app.navigate('settings')">${renderIcon('icon-profile')}</button>
                    </div>
                    <div class="card">
                        <div class="flex-row"><span>Weekly activity</span> ${renderIcon('icon-chart')}</div>
                        <div style="height: 80px; display: flex; gap: 4px; align-items: flex-end; margin: 12px 0;">
                            <div style="background:var(--primary); width:22px; height:30px; border-radius:8px;"></div>
                            <div style="background:var(--primary); width:22px; height:52px;"></div>
                            <div style="background:var(--primary); width:22px; height:18px;"></div>
                            <div style="background:var(--primary); width:22px; height:70px;"></div>
                            <div style="background:var(--primary); width:22px; height:44px;"></div>
                            <div style="background:var(--primary); width:22px; height:60px;"></div>
                            <div style="background:var(--primary); width:22px; height:38px;"></div>
                        </div>
                    </div>
                    <div class="card">
                        <div>🏆 Achievements</div>
                        <div style="display: flex; gap:16px; margin-top:16px;">
                            <span style="text-align:center">⚡<br>7 days</span>
                            <span style="text-align:center">🧠<br>1000 puzzles</span>
                            <span style="text-align:center">🚀<br>speed</span>
                        </div>
                    </div>
                    <div class="card">
                        <div class="flex-row"><span>Accuracy</span> <span>92%</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:92%"></div></div>
                        <div class="flex-row" style="margin-top:12px;"><span>Games played</span> <span>24</span></div>
                    </div>
                `;
            }

            function renderSettings() {
                const themeLabel = darkMode ? '🌙 Dark' : '☀️ Light';
                return `
                    <div class="header">
                        <h1>Settings</h1>
                        <button class="profile-btn" onclick="window.app.navigate('settings')">${renderIcon('icon-profile')}</button>
                    </div>
                    <div class="card">
                        <div class="flex-row" style="margin-bottom: 20px;">
                            <span>Theme</span>
                            <button onclick="window.app.toggleTheme()" style="background: var(--card); border: 1px solid var(--border-light); padding: 8px 20px; border-radius: 40px;">${themeLabel}</button>
                        </div>
                        <div class="flex-row"><span>Sound</span><span>🔛</span></div>
                        <hr style="border-color: var(--border-light); margin:16px 0;">
                        <div class="flex-row"><span>Profile</span> ${renderIcon('icon-profile')}</div>
                        <div class="flex-row" style="margin-top:16px;"><span>Reminders</span> <span>8:00 AM</span></div>
                        <button style="margin-top:24px; color: var(--primary);">Restore purchases</button>
                    </div>
                `;
            }

            // ---------- app navigation & helpers ----------
            const app = {
                navigate(screen) {
                    if (['home','learn','progress','settings','onboarding'].includes(screen)) {
                        currentScreen = screen;
                        this.render();
                    }
                },
                openModal(type) {
                    modalContent = type;
                    this.render();
                },
                closeModal() {
                    modalContent = null;
                    this.render();
                },
                toggleTheme() {
                    darkMode = !darkMode;
                    document.body.classList.toggle('dark', darkMode);
                    this.render();
                },
                updateProgress() {
                    // simulate progress change
                    setTimeout(() => this.render(), 50);
                },
                render() {
                    let mainContent = '';
                    if (currentScreen === 'onboarding') mainContent = renderOnboarding();
                    else if (currentScreen === 'home') mainContent = renderHome();
                    else if (currentScreen === 'learn') mainContent = renderLearn();
                    else if (currentScreen === 'progress') mainContent = renderProgress();
                    else if (currentScreen === 'settings') mainContent = renderSettings();

                    // bottom nav (except onboarding)
                    const nav = (currentScreen !== 'onboarding') ? `
                        <div class="bottom-nav">
                            <button class="nav-item ${currentScreen==='home'?'active':''}" onclick="window.app.navigate('home')">${renderIcon('icon-home')}<span class="nav-label">Home</span></button>
                            <button class="nav-item ${currentScreen==='learn'?'active':''}" onclick="window.app.navigate('learn')">${renderIcon('icon-learn')}<span class="nav-label">Learn</span></button>
                            <button class="nav-item ${currentScreen==='progress'?'active':''}" onclick="window.app.navigate('progress')">${renderIcon('icon-progress')}<span class="nav-label">Progress</span></button>
                            <button class="nav-item ${currentScreen==='settings'?'active':''}" onclick="window.app.navigate('settings')">${renderIcon('icon-settings')}<span class="nav-label">Settings</span></button>
                        </div>
                    ` : '';

                    let modalHtml = '';
                    if (modalContent === 'privacy') {
                        modalHtml = `
                            <div class="modal" onclick="window.app.closeModal()">
                                <div class="modal-content" onclick="event.stopPropagation()">
                                    <h3>Privacy</h3><p>Your data stays on device. No tracking.</p>
                                    <button onclick="window.app.closeModal()">OK</button>
                                </div>
                            </div>`;
                    } else if (modalContent === 'terms') {
                        modalHtml = `
                            <div class="modal" onclick="window.app.closeModal()">
                                <div class="modal-content" onclick="event.stopPropagation()">
                                    <h3>Terms</h3><p>Math Brain Trainer © 2026. Free to learn.</p>
                                    <button onclick="window.app.closeModal()">OK</button>
                                </div>
                            </div>`;
                    }

                    document.getElementById('app').innerHTML = `
                        <div class="app-screen">${mainContent}</div>
                        ${nav}
                        ${modalHtml}
                    `;
                }
            };
            window.app = app;

            // ---------- screenshot (shift+W) ----------
            document.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    const phone = document.getElementById('phoneContainer');
                    // In real prototype, we'd use html2canvas. but we just simulate.
                    let next = darkMode ? 6 : screenshotCounter;
                    if (!darkMode && screenshotCounter > 5) screenshotCounter = 1;
                    if (darkMode) next = 6;
                    else next = screenshotCounter;
                    alert(`📸 Screenshot saved as ${next}.png (simulated)`);
                    if (!darkMode) screenshotCounter = (screenshotCounter % 5) + 1;
                }
            });

            // initial render
            app.render();
        })();
    </script>
    <script>
        // (additional safety: rerender if dark mode class toggled outside)
    </script>
</body>
</html>
All done!

    "4.png": "Track Progress",
    "5.png": "Smart Settings",
    "6.png": "Dark Theme"
  }
}
