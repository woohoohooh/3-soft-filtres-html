```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeLingua – vocabulary builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #1a1e2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --border: #E2E8F0;
            --header-icon: #334155;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
        }
        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --border: #334155;
            --header-icon: #CBD5E1;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
        }

        #phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 10px #2c3e4e;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
            color: var(--text);
        }

        /* app container (scrollable) */
        .app-screen {
            flex: 1;
            overflow-y: auto;
            padding: 20px 18px 80px 18px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) transparent;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .app-screen::-webkit-scrollbar {
            width: 4px;
        }
        .app-screen::-webkit-scrollbar-thumb {
            background: var(--inactive);
            border-radius: 20px;
        }

        /* header (fixed inside scroll) */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 4px 0;
            margin-bottom: 8px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text);
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 4px;
            color: var(--header-icon);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-btn svg {
            width: 28px;
            height: 28px;
            stroke: var(--header-icon);
            stroke-width: 2;
            fill: none;
        }

        /* bottom nav */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 72px;
            background: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            padding: 6px 0;
            box-shadow: var(--shadow);
            border-radius: 0 0 44px 44px;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            cursor: pointer;
            gap: 4px;
            transition: all 0.15s ease;
            color: var(--inactive);
            fill: none;
            stroke: var(--inactive);
        }
        .nav-item.active {
            color: var(--primary);
            stroke: var(--primary);
            transform: scale(1.05);
        }
        .nav-item.active .nav-icon {
            stroke: var(--primary);
            filter: drop-shadow(0 2px 6px rgba(37,99,235,0.3));
        }
        .nav-icon {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.1s;
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
        }

        /* cards & elements */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .flex-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
        }
        .progress-bar {
            height: 10px;
            background: var(--border);
            border-radius: 20px;
            margin: 10px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 60%;
            background: var(--primary);
            border-radius: 20px;
            transition: width 0.3s ease;
        }
        .btn {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 20px;
            border-radius: 60px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(37,99,235,0.25);
            transition: 0.1s;
            width: 100%;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            box-shadow: none;
        }
        .lesson-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }
        .lesson-item:last-child { border: none; }

        /* modal overlay */
        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: var(--card);
            width: 280px;
            padding: 28px;
            border-radius: 32px;
            text-align: center;
            color: var(--text);
            border: 1px solid var(--border);
        }
        .hidden { display: none; }

        /* chart simulation */
        .chart-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 100px;
            margin: 20px 0 10px;
        }
        .bar {
            flex: 1;
            background: var(--accent);
            height: calc(100% - 20px);
            border-radius: 16px 16px 4px 4px;
            transition: height 0.4s;
        }
        .bar:nth-child(1) { height: 40px; }
        .bar:nth-child(2) { height: 70px; }
        .bar:nth-child(3) { height: 55px; }
        .bar:nth-child(4) { height: 85px; }
        .bar:nth-child(5) { height: 30px; }
        .bar:nth-child(6) { height: 65px; }
        .bar:nth-child(7) { height: 45px; }
    </style>
</head>
<body>
<div id="phone"></div>

<script>
    (function() {
        // ---------- THEME ----------
        let darkMode = false;
        const root = document.documentElement;

        // ---------- ICON SYSTEM (inline svg) ----------
        const icons = {
            home: `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 L3 10 Z" stroke="currentColor" fill="none"/></svg>`,
            learn: `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M2 3 L12 3 L12 21 L2 21 L2 3 Z M22 3 L12 3 L12 21 L22 21 L22 3 Z" stroke="currentColor" fill="none"/><path d="M8 7 L16 7 M8 11 L16 11 M8 15 L14 15" stroke="currentColor"/></svg>`,
            progress: `<svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><path d="M12 7 L12 12 L15 15" stroke="currentColor"/></svg>`,
            settings: `<svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor" fill="none"/><path d="M19.4 15 L21 12 L19.4 9 L17 8.1 L15.5 5.6 L12 5 L8.5 5.6 L7 8.1 L4.6 9 L3 12 L4.6 15 L7 16.9 L8.5 19.4 L12 20 L15.5 19.4 L17 16.9 L19.4 15 Z" stroke="currentColor" fill="none"/></svg>`,
            profile: `<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><path d="M5 20 L5 18 C5 14 8 12 12 12 C16 12 19 14 19 18 L19 20 M12 12 C14 12 16 10 16 8 C16 6 14 4 12 4 C10 4 8 6 8 8 C8 10 10 12 12 12 Z" stroke="currentColor"/></svg>`,
            lesson: `<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><rect x="4" y="6" width="16" height="14" stroke="currentColor"/><path d="M8 10 L16 10 M8 14 L14 14" stroke="currentColor"/></svg>`,
            chart: `<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><path d="M3 17 L9 11 L13 15 L21 7" stroke="currentColor"/><path d="M3 21 L21 21" stroke="currentColor"/></svg>`,
            flashcards: `<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><rect x="5" y="4" width="14" height="16" stroke="currentColor"/><path d="M9 8 L15 8 M9 12 L15 12 M9 16 L13 16" stroke="currentColor"/></svg>`,
            play: `<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><circle cx="12" cy="12" r="9"/><polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/></svg>`,
            check: `<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><path d="M5 13 L10 18 L19 7" stroke="currentColor"/></svg>`
        };

        // ---------- SCREENS (template strings) ----------
        const screens = {
            onboarding: `
                <div class="header"><h1>Welcome</h1><button class="profile-btn" data-profile>${icons.profile}</button></div>
                <div class="card" style="text-align:center;padding:32px 20px;">
                    <div style="background:#EFF6FF;width:80px;height:80px;border-radius:30px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;">${icons.flashcards}</div>
                    <h2 style="font-size:32px; margin-bottom:8px;">LexiLearn</h2>
                    <p style="font-size:18px; font-weight:500;">English vocabulary</p>
                    <p style="margin:16px 0 24px; color:var(--text-light);">Master 5000+ words with smart flashcards and daily challenges.</p>
                    <button class="btn" id="getStarted">Get Started →</button>
                    <div style="display:flex; gap:24px; justify-content:center; margin-top:24px;">
                        <button class="js-modal-link" data-type="privacy" style="background:none;border:none;color:var(--primary);text-decoration:underline;cursor:pointer;">Privacy</button>
                        <button class="js-modal-link" data-type="terms" style="background:none;border:none;color:var(--primary);text-decoration:underline;cursor:pointer;">Terms</button>
                    </div>
                </div>
            `,
            home: `
                <div class="header"><h1>Home</h1><button class="profile-btn" data-profile>${icons.profile}</button></div>
                <div class="card flex-row" style="justify-content: space-between;">
                    <span>🔥 7 day streak</span> <span>⭐ 1240 XP</span>
                </div>
                <div class="card">
                    <h3>Daily goal</h3>
                    <div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div>
                    <p>45% · 9/20 words</p>
                </div>
                <div class="card">
                    <div style="display:flex; gap:16px; align-items:center;">${icons.lesson} <span>Continue lesson: Food & travel</span></div>
                    <button class="btn" style="margin-top:16px;" id="openLearn">Practice now</button>
                </div>
                <div class="card"><div style="display:flex; gap:12px;">${icons.flashcards} Flashcards ready · 15 due</div></div>
            `,
            learn: `
                <div class="header"><h1>Learn</h1><button class="profile-btn" data-profile>${icons.profile}</button></div>
                <div class="card">
                    <div class="flex-row"><span class="badge">Beginner</span><span>▸ 5 min left</span></div>
                    <div class="lesson-item"><span>🍽️ Restaurant phrases</span> <span>80%</span></div>
                    <div class="lesson-item"><span>✈️ Airport vocabulary</span> <span>45%</span></div>
                    <div class="lesson-item"><span>🏨 Hotel & booking</span> <span>20%</span></div>
                </div>
                <div class="card">
                    <h4>Recommended</h4>
                    <div class="lesson-item"><span>🧳 Travel essentials</span><button class="btn-outline" style="padding:6px 18px;">Start</button></div>
                </div>
            `,
            progress: `
                <div class="header"><h1>Progress</h1><button class="profile-btn" data-profile>${icons.profile}</button></div>
                <div class="card">
                    <p>Words learned this week</p>
                    <div class="chart-row">
                        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    </div>
                </div>
                <div class="card flex-row">
                    ${icons.chart} <span>Overall fluency: 34%</span>
                </div>
                <div class="card"><span>🏆 Achievements: 4/12</span><div class="progress-bar" style="margin-top:12px;"><div class="progress-fill" style="width:33%"></div></div></div>
            `,
            settings: `
                <div class="header"><h1>Settings</h1><button class="profile-btn" data-profile>${icons.profile}</button></div>
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center;"><span>🌙 Dark mode</span><label class="switch"><input type="checkbox" id="darkToggle"></label></div>
                    <div style="margin-top:24px;">⚙️ Notifications</div>
                    <div>🔊 Sound effects</div>
                    <div style="margin-top:24px;">🔒 Privacy · Terms</div>
                </div>
            `,
            profileSettings: `
                <div class="header"><h1>Profile</h1><button class="profile-btn" data-profile>${icons.profile}</button></div>
                <div class="card" style="text-align:center;">
                    <div style="background:#E2E8F0; width:80px;height:80px;border-radius:50%;margin:10px auto;display:flex;align-items:center;justify-content:center;">${icons.profile}</div>
                    <h3>Alex Rivera</h3>
                    <p>alex@example.com</p>
                    <button class="btn-outline" style="margin-top:12px;">Edit profile</button>
                </div>
                <div class="card">⭐ Member since 2026 · 12,340 XP</div>
            `
        };

        let currentScreen = 'onboarding';
        const phone = document.getElementById('phone');
        let modalDiv = null;

        function renderScreen() {
            let content = screens[currentScreen] || screens.home;

            // wrap with bottom nav (except no bottom nav for onboarding? we keep onboarding but bottom nav hidden by padding? we show it for all for consistency)
            let bottomNav = `
                <div class="bottom-nav">
                    <button class="nav-item" data-nav="home">${icons.home}<span class="nav-label">Home</span></button>
                    <button class="nav-item" data-nav="learn">${icons.learn}<span class="nav-label">Learn</span></button>
                    <button class="nav-item" data-nav="progress">${icons.progress}<span class="nav-label">Progress</span></button>
                    <button class="nav-item" data-nav="settings">${icons.settings}<span class="nav-label">Settings</span></button>
                </div>
            `;
            // but if onboarding, we maybe still show bottom nav? yes we can. we just add
            phone.innerHTML = `<div class="app-screen" id="appScreen">${content}</div>${bottomNav}`;
            document.querySelectorAll('.nav-item').forEach(btn => {
                const nav = btn.dataset.nav;
                if (nav === currentScreen) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            // profile click
            document.querySelectorAll('[data-profile]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (currentScreen === 'profileSettings') return;
                    currentScreen = 'profileSettings';
                    renderScreen();
                });
            });

            // Get started
            const startBtn = document.getElementById('getStarted');
            if (startBtn) startBtn.addEventListener('click', () => {
                currentScreen = 'home';
                renderScreen();
            });

            // open learn from home
            const openLearn = document.getElementById('openLearn');
            if(openLearn) openLearn.addEventListener('click', ()=>{
                currentScreen='learn'; renderScreen();
            });

            // nav clicks
            document.querySelectorAll('[data-nav]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const target = e.currentTarget.dataset.nav;
                    if (target === 'home' || target === 'learn' || target === 'progress' || target === 'settings') {
                        currentScreen = target;
                        renderScreen();
                    }
                });
            });

            // dark mode toggle inside settings
            if (currentScreen === 'settings') {
                const toggle = document.getElementById('darkToggle');
                if (toggle) {
                    toggle.checked = darkMode;
                    toggle.addEventListener('change', (e) => {
                        darkMode = e.target.checked;
                        if (darkMode) document.body.classList.add('dark');
                        else document.body.classList.remove('dark');
                        renderScreen(); // re-render to show updated colors
                    });
                }
            }

            // modals for privacy/terms
            document.querySelectorAll('.js-modal-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    const type = e.target.dataset.type;
                    const text = type === 'privacy' ? 'We value your privacy. No data sold.' : 'Use of this app means you accept our terms.';
                    showModal(type, text);
                });
            });
        }

        function showModal(title, bodyText) {
            modalDiv = document.createElement('div');
            modalDiv.className = 'modal';
            modalDiv.innerHTML = `<div class="modal-content"><h3 style="margin-bottom:12px;">${title}</h3><p>${bodyText}</p><button class="btn" style="margin-top:16px;" id="closeModal">OK</button></div>`;
            phone.appendChild(modalDiv);
            document.getElementById('closeModal').addEventListener('click', ()=>{
                modalDiv.remove();
                modalDiv = null;
            });
        }

        // screenshot feature SHIFT+W
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phoneEl = document.getElementById('phone');
                import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
                    html2canvas(phoneEl, { scale: 2, backgroundColor: null }).then(canvas => {
                        const link = document.createElement('a');
                        let filename = darkMode ? '6.png' : `${Math.min(parseInt(localStorage.getItem('shotNum') || '0') % 5 + 1,5)}.png`;
                        if (darkMode) filename = '6.png';
                        else {
                            let n = (parseInt(localStorage.getItem('shotNum') || '0') % 5) + 1;
                            filename = n + '.png';
                            localStorage.setItem('shotNum', n);
                        }
                        link.download = filename;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    });
                }).catch(()=> alert('html2canvas failed'));
            }
        });

        // initial render
        renderScreen();

        // json output at the very end (stringified) (will be printed outside)
        window.jsonOutput = {
            titles: {
                "1.png": "Start Learning",
                "2.png": "Daily Lessons",
                "3.png": "Practice Skills",
                "4.png": "Track Progress",
                "5.png": "Smart Settings",
                "6.png": "Dark Theme"
            }
        };
    })();
</script>
<script>window.onload=function(){ console.log('ready'); }</script>
</body>
</html>
All done!
