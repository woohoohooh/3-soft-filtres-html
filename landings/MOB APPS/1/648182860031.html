```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSpark · Python · interactive prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive-icon: #94A3B8;
            --active-bg: rgba(37, 99, 235, 0.08);
            --shadow-sm: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.03);
            --progress-bg: #E2E8F0;
            --badge-bg: #DBEAFE;
            --badge-text: #1E40AF;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #94A3B8;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive-icon: #64748B;
            --active-bg: rgba(59, 130, 246, 0.15);
            --shadow-sm: 0 8px 20px rgba(0,0,0,0.4);
            --progress-bg: #334155;
            --badge-bg: #1E3A5F;
            --badge-text: #90CAF9;
        }

        body {
            background: #1B1F2C; /* outer bezel */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2C3A4B;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background-color 0.2s;
        }

        /* main app screen (screen container) */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            padding: 16px 16px 8px 16px;
            gap: 16px;
            background: var(--bg);
        }

        /* header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0 4px;
        }
        .header-left h2 {
            font-size: 22px;
            font-weight: 650;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-icon {
            cursor: pointer;
            padding: 8px 6px;
            border-radius: 40px;
            transition: background 0.1s;
        }
        .profile-icon:hover { background: var(--active-bg); }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--card);
            padding: 8px 0 14px;
            border-top: 1px solid var(--border-light);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 30px;
            transition: all 0.15s ease;
            background: transparent;
            color: var(--inactive-icon);
            fill: var(--inactive-icon);
        }
        .nav-item.active {
            background: var(--active-bg);
            color: var(--primary);
            fill: var(--primary);
            transform: scale(1.05);
        }
        .nav-item.active svg {
            stroke: var(--primary);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.15s;
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            color: currentColor;
        }

        /* card styles */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }

        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 20px;
            overflow: hidden;
            width: 100%;
        }
        .progress-fill {
            height: 8px;
            background: var(--primary);
            width: 0%;
            border-radius: 20px;
            transition: width 0.3s ease;
        }

        /* buttons */
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 40px;
            padding: 16px 20px;
            font-weight: 600;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            transition: background 0.1s, transform 0.1s;
            box-shadow: 0 6px 0 var(--primary-dark);
        }
        .btn-primary:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--primary-dark); }

        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 20px 0 10px;
            font-size: 14px;
            color: var(--text-secondary);
            text-decoration: underline;
            cursor: pointer;
        }

        /* modal */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--card);
            padding: 30px 24px;
            border-radius: 32px;
            width: 280px;
            text-align: center;
            color: var(--text-primary);
        }
        .modal-content button {
            margin-top: 24px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        .hidden { display: none; }

        /* lesson rows */
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .badge {
            background: var(--badge-bg);
            color: var(--badge-text);
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 13px;
            font-weight: 600;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }
        .stat-cell {
            background: var(--bg);
            padding: 16px 8px;
            border-radius: 18px;
            text-align: center;
        }

        /* simple chart */
        .chart-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 100px;
            margin: 20px 0 8px;
        }
        .chart-bar {
            flex: 1;
            background: var(--accent);
            height: calc(70% * var(--h));
            border-radius: 12px 12px 4px 4px;
            transition: height 0.4s;
        }

        /* dark mode toggle inside settings */
        .theme-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0;
        }
        .toggle-switch {
            width: 52px;
            height: 28px;
            background: var(--inactive-icon);
            border-radius: 40px;
            position: relative;
            cursor: pointer;
        }
        .toggle-switch::after {
            content: '';
            display: block;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: 0.15s;
        }
        body.dark .toggle-switch::after { left: 26px; }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic header + screen + bottom nav will be injected -->
    <div id="app"></div>
</div>

<script>
    (function(){
        // ---------- THEME ----------
        let darkMode = false;
        const body = document.body;

        // ---------- SVG ICONS (outline, 2px stroke, rounded) ----------
        const icons = {
            home: `<svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
            learn: `<svg viewBox="0 0 24 24"><path d="M2 3H8C10.2091 3 12 4.79086 12 7V21C12 19.8954 11.1046 19 10 19H2V3Z" stroke="currentColor" fill="none" stroke-width="2"/><path d="M22 3H16C13.7909 3 12 4.79086 12 7V21C12 19.8954 12.8954 19 14 19H22V3Z" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            progress: `<svg viewBox="0 0 24 24"><path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3" stroke="currentColor" fill="none" stroke-width="2"/><circle cx="12" cy="12" r="2" stroke="currentColor" fill="none" stroke-width="2"/><path d="M12 8V12L14 14" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor" fill="none" stroke-width="2"/><path d="M19.4 15C18.9 16 18.1 16.7 17.2 17.2L19 20.6L16.6 21L14.8 17.7C13.9 17.9 13 17.9 12 17.9C11 17.9 10.1 17.8 9.2 17.5L7.4 20.9L5 20.5L6.8 17.1C5.9 16.6 5.1 15.9 4.6 15L1 15V12H4C4 11.3 4 10.6 4.1 10H1V7H4.6C5.1 6 5.9 5.3 6.8 4.8L5 1.4L7.4 1L9.2 4.3C10.1 4.1 11 4 12 4C13 4 13.9 4.1 14.8 4.4L16.6 1.1L19 1.5L17.2 4.9C18.1 5.4 18.9 6.1 19.4 7.1L23 7V10H20C20 10.7 20 11.4 19.9 12H23V15H19.4Z" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            profile: `<svg viewBox="0 0 24 24"><path d="M20 21V19C20 16.8 18.2 15 16 15H8C5.8 15 4 16.8 4 19V21" stroke="currentColor" fill="none" stroke-width="2"/><circle cx="12" cy="7" r="4" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            lesson: `<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" fill="none" stroke-width="2"/><path d="M9 8H15" stroke="currentColor" stroke-width="2"/><path d="M9 12H15" stroke="currentColor" stroke-width="2"/><path d="M9 16H13" stroke="currentColor" stroke-width="2"/></svg>`,
            chart: `<svg viewBox="0 0 24 24"><path d="M21 21H3V3" stroke="currentColor" fill="none" stroke-width="2"/><path d="M7 15L10 10L13 13L18 7" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            flashcards: `<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" fill="none" stroke-width="2"/><path d="M9 7H15" stroke="currentColor" stroke-width="2"/><path d="M9 11H13" stroke="currentColor" stroke-width="2"/></svg>`,
            play: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none" stroke-width="2"/><path d="M10 8L16 12L10 16V8Z" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            check: `<svg viewBox="0 0 24 24"><path d="M20 6L9 17L4 12" stroke="currentColor" fill="none" stroke-width="2"/></svg>`
        };

        // ---------- APP STATE ----------
        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
        let modalType = null; // 'privacy' or 'terms'

        // ---------- DATA for dynamic content (Python learning) ----------
        const lessons = ['Variables', 'Loops', 'Functions', 'Lists', 'Dicts'];
        const progressPercent = 42;

        // ---------- RENDER FULL APP ----------
        function renderApp() {
            const container = document.getElementById('app');
            container.innerHTML = ''; 

            // ---- build header (screen title + profile) ----
            const headerDiv = document.createElement('div');
            headerDiv.className = 'header';
            let title = 'onboarding';
            if (currentScreen === 'home') title = 'Home';
            else if (currentScreen === 'learn') title = 'Python';
            else if (currentScreen === 'progress') title = 'Progress';
            else if (currentScreen === 'settings') title = 'Settings';
            else if (currentScreen === 'onboarding') title = 'CodeSpark';

            headerDiv.innerHTML = `
                <div class="header-left"><h2>${title}</h2></div>
                <div class="profile-icon" id="profileBtn">${icons.profile}</div>
            `;

            // ---- main screen (content) ----
            const screenDiv = document.createElement('div');
            screenDiv.className = 'app-screen';
            screenDiv.id = 'mainScreen';
            screenDiv.innerHTML = getScreenContent(currentScreen);

            // ---- bottom navigation (hidden on onboarding) ----
            const navDiv = document.createElement('div');
            navDiv.className = 'bottom-nav';
            if (currentScreen === 'onboarding') {
                navDiv.style.display = 'none';
            } else {
                navDiv.style.display = 'flex';
                const items = ['home', 'learn', 'progress', 'settings'];
                items.forEach(id => {
                    const activeClass = (currentScreen === id || (id==='learn' && currentScreen==='learn') || (id==='progress' && currentScreen==='progress') || (id==='settings' && currentScreen==='settings')) ? 'active' : '';
                    let label = id.charAt(0).toUpperCase() + id.slice(1);
                    if (id==='learn') label = 'Learn';
                    navDiv.innerHTML += `
                        <div class="nav-item ${activeClass}" data-nav="${id}">
                            ${icons[id]}
                            <span class="nav-label">${label}</span>
                        </div>
                    `;
                });
            }

            container.appendChild(headerDiv);
            container.appendChild(screenDiv);
            container.appendChild(navDiv);

            // attach listeners
            document.getElementById('profileBtn')?.addEventListener('click', ()=>{
                currentScreen = 'settings';
                renderApp();
            });

            document.querySelectorAll('.nav-item[data-nav]').forEach(el => {
                el.addEventListener('click', (e)=>{
                    const nav = e.currentTarget.dataset.nav;
                    if (nav === 'home') currentScreen = 'home';
                    else if (nav === 'learn') currentScreen = 'learn';
                    else if (nav === 'progress') currentScreen = 'progress';
                    else if (nav === 'settings') currentScreen = 'settings';
                    renderApp();
                });
            });

            // modal links & buttons
            if (currentScreen === 'onboarding') {
                document.getElementById('privacyLink')?.addEventListener('click', ()=>{ modalType='privacy'; renderModal(); });
                document.getElementById('termsLink')?.addEventListener('click', ()=>{ modalType='terms'; renderModal(); });
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                    currentScreen = 'home';
                    renderApp();
                });
            }

            // practice / start buttons (simulate progress)
            document.getElementById('startPracticeBtn')?.addEventListener('click', ()=>{
                alert('Lesson started! (simulated)');
            });
            document.getElementById('fillProgress')?.style && (document.getElementById('fillProgress').style.width = progressPercent+'%');

            // theme toggle inside settings
            if (currentScreen === 'settings') {
                const toggle = document.getElementById('themeToggleBtn');
                if(toggle) toggle.addEventListener('click', ()=>{
                    darkMode = !darkMode;
                    if(darkMode) body.classList.add('dark'); else body.classList.remove('dark');
                    renderApp();
                });
            }

            // close modal if exists
            if (modalType) renderModal();
        }

        function renderModal() {
            const existing = document.querySelector('.modal');
            if(existing) existing.remove();
            if (!modalType) return;
            const modalDiv = document.createElement('div');
            modalDiv.className = 'modal';
            const text = (modalType==='privacy') ? 'Privacy policy: your data is safe.' : 'Terms: educational use only.';
            modalDiv.innerHTML = `
                <div class="modal-content">
                    <p>${text}</p>
                    <button id="closeModalBtn">OK</button>
                </div>
            `;
            document.querySelector('.phone').appendChild(modalDiv);
            document.getElementById('closeModalBtn').addEventListener('click', ()=>{
                modalType = null;
                document.querySelector('.modal')?.remove();
            });
        }

        function getScreenContent(screen) {
            if (screen === 'onboarding') {
                return `
                    <div class="card" style="text-align: center; margin-top: 40px;">
                        <div style="font-size: 48px; margin-bottom: 8px;">🐍</div>
                        <h1 style="font-size: 38px; font-weight: 700; color: var(--primary);">CodeSpark</h1>
                        <p style="font-size: 18px; margin: 10px 0 4px;"><strong>learn Python · playfully</strong></p>
                        <p style="color: var(--text-secondary); margin: 16px 0 28px;">Bite-sized coding exercises, flashcards, and real practice. Master Python from scratch.</p>
                        <button class="btn-primary" id="getStartedBtn">Get Started</button>
                        <div class="link-row">
                            <span id="privacyLink">Privacy Policy</span>
                            <span id="termsLink">Terms of Service</span>
                        </div>
                    </div>
                `;
            }
            else if (screen === 'home') {
                return `
                    <div class="card">
                        <div class="flex-row"><span>🔥 daily streak</span><span class="badge">7 days</span></div>
                        <div style="margin:12px 0"><strong>continue where you left:</strong></div>
                        <div class="lesson-item">${icons.lesson} <span>Functions & scope</span> <span class="badge">80%</span></div>
                        <div class="progress-bar" style="margin:4px 0 16px;"><div class="progress-fill" style="width:80%"></div></div>
                        <button class="btn-primary" id="startPracticeBtn" style="padding:12px; font-size:16px;">▶ continue practice</button>
                    </div>
                    <div class="card">
                        <div class="flex-row"><span>📘 today’s flashcards</span>${icons.flashcards}</div>
                        <div class="lesson-item"><span>list comprehension</span><span class="badge">new</span></div>
                        <div class="lesson-item"><span>lambda functions</span><span class="badge">review</span></div>
                    </div>
                `;
            }
            else if (screen === 'learn') {
                return `
                    <div class="card">
                        <div class="flex-row"><span>🐍 python fundamentals</span><span>+12 xp</span></div>
                        ${lessons.map((l,i)=>`<div class="lesson-item">${icons.lesson} ${l} <span class="badge">${i===0?'start':'locked'}</span></div>`).join('')}
                    </div>
                    <div class="card" style="display:flex; gap:12px; align-items:center;">
                        ${icons.play} <span>quick practice (5 min)</span> <button style="margin-left:auto; background:var(--primary); color:white; border:none; padding:8px 16px; border-radius:40px;">GO</button>
                    </div>
                `;
            }
            else if (screen === 'progress') {
                return `
                    <div class="card">
                        <div class="flex-row"><span>📊 overall progress</span>${icons.chart}</div>
                        <div style="font-size: 38px; font-weight:700; color:var(--primary);">42%</div>
                        <div class="progress-bar"><div class="progress-fill" id="fillProgress" style="width:42%"></div></div>
                    </div>
                    <div class="card">
                        <div>🏆 achievements</div>
                        <div class="stat-grid">
                            <div class="stat-cell"><span>⚡5</span><br>quick learner</div>
                            <div class="stat-cell"><span>🔥7</span><br>day streak</div>
                        </div>
                    </div>
                    <div class="card">
                        <div>weekly activity</div>
                        <div class="chart-row">
                            <div class="chart-bar" style="--h:0.6"></div><div class="chart-bar" style="--h:0.9"></div><div class="chart-bar" style="--h:0.4"></div>
                            <div class="chart-bar" style="--h:0.7"></div><div class="chart-bar" style="--h:1"></div><div class="chart-bar" style="--h:0.5"></div><div class="chart-bar" style="--h:0.3"></div>
                        </div>
                    </div>
                `;
            }
            else if (screen === 'settings') {
                return `
                    <div class="card">
                        <div class="flex-row"><span>👤 profile</span>${icons.profile}</div>
                        <p><strong>Alex</strong> · alex@learn.io</p>
                    </div>
                    <div class="card">
                        <div class="theme-toggle">
                            <span>🌓 dark mode</span>
                            <div class="toggle-switch" id="themeToggleBtn"></div>
                        </div>
                    </div>
                    <div class="card">
                        <div>⚙️ app version 1.0 · python exercises</div>
                    </div>
                `;
            }
            return '';
        }

        renderApp();

        // ---------- SCREENSHOT feature SHIFT+W ----------
        let shotCounter = 1;
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                const phone = document.getElementById('phoneContainer');
                // In real prototype we cannot create actual PNG but we simulate by counting
                const isDark = body.classList.contains('dark');
                const filename = isDark ? '6.png' : (shotCounter + '.png');
                if (!isDark) { shotCounter = (shotCounter % 5) + 1; }
                alert(`📸 screenshot simulated: ${filename} saved (fake capture)`);
            }
        });

        // inject extra style to make chart bar heights work
        const style = document.createElement('style');
        style.innerHTML = `.chart-bar { height: calc(40px + 30px * var(--h)); }`;
        document.head.appendChild(style);

    })();
</script>

<!-- hidden JSON output at very bottom -->
<pre style="display:block; margin-top:20px; font-family:monospace; background:#111; color:#0f0; padding:8px; max-width:360px; margin-left:auto; margin-right:auto;">

  "6.png": "Dark Theme"
}
</pre>
All done!
