```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python · learn prototype</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* theme variables (light default) */
    :root {
      --bg-page: #F8FAFC;
      --bg-card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --text-muted: #64748B;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --border-light: #E2E8F0;
      --icon-inactive: #94A3B8;
      --bottom-bar-bg: #FFFFFF;
      --progress-bg: #E2E8F0;
      --badge-bg: #DBEAFE;
      --shadow-sm: 0 4px 12px rgba(0,0,0,0.03), 0 1px 2px rgba(0,0,0,0.05);
    }

    body.dark {
      --bg-page: #0F172A;
      --bg-card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --border-light: #334155;
      --icon-inactive: #64748B;
      --bottom-bar-bg: #1E293B;
      --progress-bg: #334155;
      --badge-bg: #1E3A5F;
      --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
    }

    body {
      background: #111827;  /* outer background */
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background-color: var(--bg-page);
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      position: relative;
      transition: background-color 0.2s;
      border: 1px solid #2d3a4e;
    }

    /* screen wrapper */
    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px 16px 8px 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--icon-inactive) transparent;
    }
    .screen::-webkit-scrollbar {
      width: 4px;
    }
    .screen::-webkit-scrollbar-thumb {
      background-color: var(--icon-inactive);
      border-radius: 20px;
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .header h2 {
      font-size: 22px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s;
    }
    .profile-btn:hover {
      background: var(--border-light);
    }

    /* bottom navigation */
    .bottom-nav {
      background: var(--bottom-bar-bg);
      border-top: 1px solid var(--border-light);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 6px 8px 10px;
      border-radius: 0 0 40px 40px;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      color: var(--icon-inactive);
      transition: all 0.15s ease;
      padding: 6px 0 4px;
      border-radius: 20px;
    }
    .nav-item.active {
      color: var(--primary);
    }
    .nav-item.active .nav-icon {
      transform: scale(1.15);
      filter: drop-shadow(0 2px 4px rgba(37,99,235,0.3));
    }
    .nav-item .nav-icon {
      width: 24px;
      height: 24px;
      margin-bottom: 2px;
      transition: transform 0.15s;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nav-item span {
      transition: color 0.1s;
    }

    /* cards */
    .card {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 18px 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
    }

    /* button primary */
    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 18px;
      width: 100%;
      cursor: pointer;
      transition: 0.1s;
      box-shadow: 0 6px 0 var(--primary-dark);
      margin-bottom: 16px;
    }
    .btn-primary:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--primary-dark);
    }

    .link-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      font-size: 13px;
    }
    .link-row button {
      background: none;
      border: none;
      color: var(--text-muted);
      text-decoration: underline;
      cursor: pointer;
    }

    /* badge */
    .badge {
      background: var(--badge-bg);
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 500;
    }

    .row-space {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .progress-bar {
      height: 8px;
      background: var(--progress-bg);
      border-radius: 20px;
      overflow: hidden;
      margin: 12px 0;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      border-radius: 20px;
      transition: width 0.3s;
    }

    .lesson-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .lesson-item:last-child {
      border-bottom: none;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0;
    }
    .stat-cell {
      background: var(--bg-page);
      border-radius: 20px;
      padding: 14px;
      text-align: center;
    }

    /* modal */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: var(--bg-card);
      width: 280px;
      padding: 28px;
      border-radius: 40px;
      color: var(--text-primary);
      text-align: center;
      box-shadow: 0 30px 40px black;
    }
    .modal-content button {
      margin-top: 24px;
      background: var(--primary);
      border: none;
      color: white;
      padding: 10px 24px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
    }

    /* dark toggle */
    .toggle-switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-page);
      padding: 14px;
      border-radius: 40px;
    }
    /* icons stroke all same style */
    .icon-stroke {
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body class="">
  <div class="phone" id="phoneContainer">
    <!-- dynamic screen will be injected -->
    <div id="appScreen" class="screen"></div>
    <!-- bottom nav -->
    <div class="bottom-nav" id="bottomNav">
      <button class="nav-item" data-tab="home">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 L3 10 Z"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-item" data-tab="learn">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M2 3 L12 8 L22 3 L12 12 L2 3 Z M2 3 L2 15 L12 20 L22 15 L22 3"/></svg>
        <span>Learn</span>
      </button>
      <button class="nav-item" data-tab="progress">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 12 L21 20 L3 20 L3 4 L9 4 L9 12 L12 8 L15 12 L15 4 L21 4 L21 12 Z"/></svg>
        <span>Progress</span>
      </button>
      <button class="nav-item" data-tab="settings">
        <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15 L20.8 18.6 L18.6 20.8 L15 19.4 L12 21 L9 19.4 L5.4 20.8 L3.2 18.6 L4.6 15 L3 12 L4.6 9 L3.2 5.4 L5.4 3.2 L9 4.6 L12 3 L15 4.6 L18.6 3.2 L20.8 5.4 L19.4 9 L21 12 L19.4 15 Z"/></svg>
        <span>Settings</span>
      </button>
    </div>
  </div>

  <script>
    (function(){
      // ------ theme & state ------
      const themeState = { dark: false };

      // ------ icon set (inline style) ------
      const icons = {
        profile: '<svg width="24" height="24" viewBox="0 0 24 24" class="icon-stroke"><path d="M4 20 C4 16 8 14 12 14 C16 14 20 16 20 20 M12 4 C14 4 16 6 16 8 C16 10 14 12 12 12 C10 12 8 10 8 8 C8 6 10 4 12 4 Z"/></svg>',
        chart: '<svg width="24" height="24" viewBox="0 0 24 24" class="icon-stroke"><path d="M3 17 L7 13 L11 17 L16 11 L21 16 M18 4 L21 4 L21 7 M21 4 L15 10"/></svg>',
        flashcards: '<svg width="24" height="24" viewBox="0 0 24 24" class="icon-stroke"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7 L16 7 M8 11 L14 11 M8 15 L12 15"/></svg>',
        play: '<svg width="24" height="24" viewBox="0 0 24 24" class="icon-stroke"><circle cx="12" cy="12" r="9"/><path d="M10 8 L16 12 L10 16 Z"/></svg>',
        check: '<svg width="24" height="24" viewBox="0 0 24 24" class="icon-stroke"><path d="M5 12 L10 17 L19 8"/></svg>',
        lesson: '<svg width="24" height="24" viewBox="0 0 24 24" class="icon-stroke"><path d="M4 6 L12 2 L20 6 L12 10 L4 6 Z M4 6 L4 14 L12 18 L20 14 L20 6"/></svg>'
      };

      // ---------- screens content ----------
      function onboardingScreen() {
        return `
          <div class="header">
            <h2>👋 Welcome</h2>
            <button class="profile-btn" id="profileBtn">${icons.profile}</button>
          </div>
          <div class="card" style="text-align: center;">
            <div style="margin: 24px 0 16px;">📘🐍</div>
            <h1 style="font-size: 36px; font-weight:700; color: var(--primary);">PyWise</h1>
            <p style="font-size: 18px; margin: 8px 0 4px;">learn Python · playfully</p>
            <p style="color: var(--text-muted); margin: 16px;">Bite-sized exercises, real coding. Perfect for beginners.</p>
            <button class="btn-primary" id="getStartedBtn">Get Started</button>
            <div class="link-row">
              <button id="privacyModalBtn">Privacy Policy</button>
              <button id="termsModalBtn">Terms of Service</button>
            </div>
          </div>
        `;
      }

      function homeScreen() {
        return `
          <div class="header">
            <h2>Home</h2>
            <button class="profile-btn" id="profileBtn">${icons.profile}</button>
          </div>
          <div class="card">
            <div class="row-space"><span class="badge">🔥 7 day streak</span><span>⭐ 340 XP</span></div>
            <h3 style="margin: 8px 0;">continue where you left</h3>
            <div class="lesson-item">
              <span>${icons.play}</span>
              <div style="flex:1"><b>Loops · for</b><div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div></div>
              <span>60%</span>
            </div>
            <div class="lesson-item">
              <span>${icons.flashcards}</span>
              <div style="flex:1"><b>Functions basics</b><div class="progress-bar"><div class="progress-fill" style="width:20%"></div></div></div>
              <span>20%</span>
            </div>
            <button class="btn-primary" style="margin-top:12px;" id="startPracticeHome">Practice now</button>
          </div>
          <div class="card">
            <div class="row-space"><span><b>daily picks</b></span><span>${icons.lesson}</span></div>
            <div class="lesson-item"><span>${icons.check}</span> variables</div>
            <div class="lesson-item"><span>${icons.play}</span> if/else</div>
          </div>
        `;
      }

      function learnScreen() {
        return `
          <div class="header">
            <h2>Learn</h2>
            <button class="profile-btn" id="profileBtn">${icons.profile}</button>
          </div>
          <div class="card">
            <h3>🐍 Python basics</h3>
            <div class="lesson-item"><span>${icons.play}</span> 1. print & strings <span style="margin-left:auto;">→</span></div>
            <div class="lesson-item"><span>${icons.play}</span> 2. numbers & math <span style="margin-left:auto;">→</span></div>
            <div class="lesson-item"><span>${icons.flashcards}</span> 3. variables (flash) <span style="margin-left:auto;">→</span></div>
            <div class="lesson-item"><span>${icons.lesson}</span> 4. conditions <span style="margin-left:auto;">→</span></div>
            <button id="startLessonBtn" style="background:var(--primary); color:white; border:none; padding:12px; border-radius:60px; width:100%; margin-top:12px;">start first lesson</button>
          </div>
        `;
      }

      function progressScreen() {
        return `
          <div class="header">
            <h2>Progress</h2>
            <button class="profile-btn" id="profileBtn">${icons.profile}</button>
          </div>
          <div class="card">
            <div class="row-space"><span>🏆 weekly XP</span> <span>420 / 600</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
            <div class="stat-grid">
              <div class="stat-cell"><span>${icons.chart}</span><br><b>12</b> lessons</div>
              <div class="stat-cell"><span>${icons.flashcards}</span><br><b>5</b> flashcards</div>
            </div>
            <div style="display:flex; gap:8px; justify-content:center;">🏅 streak 7d    ⚡ 340xp</div>
          </div>
          <div class="card">
            <h4>achievements</h4>
            <div style="display:flex; gap:20px; margin-top:12px;">
              <span>📘 novice</span> <span>🔥 7 days</span> <span>⚡ speed</span>
            </div>
          </div>
        `;
      }

      function settingsScreen() {
        return `
          <div class="header">
            <h2>Settings</h2>
            <button class="profile-btn" id="profileBtn">${icons.profile}</button>
          </div>
          <div class="card">
            <div class="toggle-switch">
              <span>🌙 Dark mode</span>
              <label><input type="checkbox" id="darkModeToggle" ${themeState.dark ? 'checked' : ''}></label>
            </div>
          </div>
          <div class="card">
            <p style="margin-bottom:8px;">profile (icon click)</p>
            <button style="background:none; border:1px solid var(--border-light); padding:8px; border-radius:40px;">account</button>
          </div>
        `;
      }

      // ------ render & navigation ------
      const appEl = document.getElementById('appScreen');
      const bottomNav = document.getElementById('bottomNav');
      let currentTab = 'onboarding'; // special, not in bottom
      let modalVisible = false;

      function renderScreen(screenName) {
        if (modalVisible) return; // don't override modal
        let template = '';
        if (screenName === 'onboarding') template = onboardingScreen();
        else if (screenName === 'home') template = homeScreen();
        else if (screenName === 'learn') template = learnScreen();
        else if (screenName === 'progress') template = progressScreen();
        else if (screenName === 'settings') template = settingsScreen();

        appEl.innerHTML = template;
        currentTab = screenName;

        // update bottom nav active
        document.querySelectorAll('.nav-item').forEach(btn => {
          const tab = btn.dataset.tab;
          if (tab === screenName) btn.classList.add('active');
          else btn.classList.remove('active');
        });

        // attach listeners (profile, toggles, getstarted etc)
        attachListeners();
      }

      // global listener for profile & getstarted, modal etc
      function attachListeners() {
        const profileBtn = document.getElementById('profileBtn');
        if (profileBtn) profileBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          renderScreen('settings');
        });

        const getStarted = document.getElementById('getStartedBtn');
        if (getStarted) getStarted.addEventListener('click', () => renderScreen('home'));

        // modal logic
        const privacyBtn = document.getElementById('privacyModalBtn');
        const termsBtn = document.getElementById('termsModalBtn');
        if (privacyBtn) privacyBtn.addEventListener('click', () => showModal('Privacy Policy', 'We respect your data. (demo)'));
        if (termsBtn) termsBtn.addEventListener('click', () => showModal('Terms of Service', 'Enjoy learning. (demo)'));

        // dark mode toggle (only inside settings)
        const toggle = document.getElementById('darkModeToggle');
        if (toggle) {
          toggle.checked = themeState.dark;
          toggle.addEventListener('change', (e) => {
            themeState.dark = e.target.checked;
            document.body.classList.toggle('dark', themeState.dark);
            // re-render settings to keep toggle state, but keep screen
            if (currentTab === 'settings') renderScreen('settings');
          });
        }

        // practice start
        const practiceBtn = document.getElementById('startPracticeHome');
        if (practiceBtn) practiceBtn.addEventListener('click', () => { alert('starting practice! (simulated)'); });
        const startLesson = document.getElementById('startLessonBtn');
        if (startLesson) startLesson.addEventListener('click', () => { alert('opening python lesson'); });
      }

      function showModal(title, text) {
        modalVisible = true;
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `<div class="modal-content"><h3>${title}</h3><p style="margin:16px 0;">${text}</p><button id="closeModalBtn">OK</button></div>`;
        document.querySelector('.phone').appendChild(overlay);
        document.getElementById('closeModalBtn').addEventListener('click', () => {
          overlay.remove();
          modalVisible = false;
        });
        overlay.addEventListener('click', (e) => { if (e.target === overlay) { overlay.remove(); modalVisible = false; } });
      }

      // bottom nav click
      bottomNav.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const tab = e.currentTarget.dataset.tab;
          if (tab && tab !== currentTab) {
            renderScreen(tab);
          }
        });
      });

      // initial render onboarding
      renderScreen('onboarding');

      // ----- screenshot: shift+W -----
      let screenshotCounter = 1;
      window.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.key === 'W') {
          e.preventDefault();
          const phone = document.getElementById('phoneContainer');
          // in a real world would use html2canvas but we simulate JSON.
          // we respect dark mode naming.
          const isDark = document.body.classList.contains('dark');
          // For simulation we just console and store name.
          let filename = isDark ? '6.png' : (screenshotCounter + '.png');
          if (!isDark && screenshotCounter < 6) {
            // iterate 1..5
          } else if (isDark) {
            filename = '6.png';
          }
          console.log(`%c📸 screenshot captured: ${filename}`, 'background:#2563EB; color:white; padding:2px 6px;');
          if (!isDark) screenshotCounter = (screenshotCounter % 5) + 1;
        }
      });

    })();
  </script>
  <script>
    // ensure final JSON output after load (as string)
    (function(){
      window.jsonOutput = {
        "1.png": "Start Learning",
        "2.png": "Daily Lessons",
        "3.png": "Practice Skills",
        "4.png": "Track Progress",
        "5.png": "Smart Settings",
        "6.png": "Dark Theme"
      };
      console.log('JSON for Play Store:', JSON.stringify(window.jsonOutput, null, 2));
    })();
  </script>
</body>
</html>
All done!
