            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --icon-inactive: #94A3B8;

            --progress-bg: #E2E8F0;
            --badge-bg: #DBEAFE;
        }
        body.dark {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --icon-inactive: #64748B;
            --icon-active: #3B82F6;
            --nav-highlight: rgba(59,130,246,0.15);
            --progress-bg: #334155;
            --badge-bg: #1E3A5F;
        }
        /* scrollable content */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px 12px 16px;

        }
        .content::-webkit-scrollbar {

        .content::-webkit-scrollbar-thumb {
            background: var(--icon-inactive);

        }

        .header {

        }
        .header-left h1 {
            font-size: 20px;
            font-weight: 700;

        }

            border-bottom: none;

            width: 32px;
            height: 32px;
            stroke: var(--primary);
            stroke-width: 2;
            fill: none;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 20px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: background 0.15s;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
        }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 16px;

        }
        .link-row span {
            cursor: pointer;
            text-decoration: underline;
        }
        .modal {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-card);
            padding: 24px;
            border-radius: 32px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            z-index: 2000;
            width: 280px;
            border: 1px solid var(--border-light);

        }
        .modal-overlay {
            position: fixed;

        .close-modal {
            margin-top: 20px;

            border: none;
            padding: 12px;
            border-radius: 30px;

        .grid-2 {
            display: grid;

        }
        .stat {
            background: var(--bg-primary);

            padding: 14px;
        }
        .theme-toggle {
            display: flex;
            gap: 8px;
            align-items: center;
        }
    </style>
</head>
<body>
<div class="phone-mock" id="phoneContainer">
    <div class="app-screen" id="appScreen">
        <!-- header injected via js -->
        <div id="headerPlaceholder"></div>
        <!-- main content -->
        <div id="screenContent" class="content"></div>

        <div class="bottom-nav" id="bottomNav"></div>

</div>

<!-- modals (simple) -->
<div class="modal-overlay" id="modalOverlay"></div>
<div class="modal" id="privacyModal"><h3 style="color: var(--primary);">Privacy</h3><p style="margin:12px 0; color: var(--text-secondary);">We respect your data. No unnecessary collection.</p><button class="close-modal" id="closePrivacy">OK</button></div>
<div class="modal" id="termsModal"><h3 style="color: var(--primary);">Terms of Service</h3><p style="margin:12px 0; color: var(--text-secondary);">Use VocabVault for personal growth only.</p><button class="close-modal" id="closeTerms">OK</button></div>

<script>
    (function(){
        // ---------- THEME ----------
        let darkMode = false;
        const root = document.documentElement;
        function applyTheme() {
            if(darkMode) root.classList.add('dark');
            else root.classList.remove('dark');
        }
        applyTheme();

        // ---------- SVG ICON SYSTEM ----------
        const icons = {
            home: '<svg viewBox="0 0 24 24" class="nav-icon"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" stroke="currentColor" fill="none"/></svg>',
            learn: '<svg viewBox="0 0 24 24" class="nav-icon"><path d="M4 6H20M4 12H20M4 18H14" stroke="currentColor"/><circle cx="18" cy="18" r="3" stroke="currentColor" fill="none"/></svg>',
            progress: '<svg viewBox="0 0 24 24" class="nav-icon"><path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3" stroke="currentColor"/><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><path d="M12 7V12L15 15" stroke="currentColor"/></svg>',
            settings: '<svg viewBox="0 0 24 24" class="nav-icon"><circle cx="12" cy="12" r="3" stroke="currentColor"/><path d="M19.4 15C18.9 16 18.1 16.7 17.2 17.2L19 20.6L16 21L15.2 17.8C14.2 18 13.1 18 12 18C10.9 18 9.8 17.9 8.8 17.7L8 21L5 20.6L6.8 17.2C5.9 16.7 5.1 16 4.6 15L2 16L1 13L4.3 11.6C4.1 10.8 4 10 4 9.2C4 8.4 4.1 7.6 4.3 6.8L1 5.4L2 2.8L4.6 4.2C5.1 3.3 5.9 2.6 6.8 2.1L5 0.7L8 0.3L8.8 3.5C9.8 3.3 10.9 3.2 12 3.2C13.1 3.2 14.2 3.3 15.2 3.5L16 0.3L19 0.7L17.2 4.1C18.1 4.6 18.9 5.3 19.4 6.2L22 4.8L23 7.4L19.7 8.8C19.9 9.6 20 10.4 20 11.2C20 12 19.9 12.8 19.7 13.6L23 15L22 17.6L19.4 16Z" stroke="currentColor" fill="none"/></svg>',
            profile: '<svg viewBox="0 0 24 24" class="nav-icon" style="stroke:currentColor"><circle cx="12" cy="8" r="4" stroke="currentColor" fill="none"/><path d="M5 20V19C5 15.1 8.1 12 12 12C15.9 12 19 15.1 19 19V20" stroke="currentColor" fill="none"/></svg>',
            lesson: '<svg viewBox="0 0 24 24" width="28" height="28" stroke="var(--primary)" fill="none"><path d="M4 6H20M4 12H20M4 18H14"/><circle cx="18" cy="18" r="3"/></svg>',
            chart: '<svg viewBox="0 0 24 24" width="28" height="28" stroke="var(--primary)" fill="none"><path d="M21 21H3V3M7 15L10 9L13 12L18 7"/></svg>',
            flashcards: '<svg viewBox="0 0 24 24" width="28" height="28" stroke="var(--primary)" fill="none"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7H15M9 11H13"/></svg>',
            play: '<svg viewBox="0 0 24 24" width="28" height="28" stroke="var(--primary)" fill="none"><circle cx="12" cy="12" r="9"/><polygon points="10,8 16,12 10,16" fill="var(--primary)"/></svg>',
            check: '<svg viewBox="0 0 24 24" width="20" height="20" stroke="var(--primary)" fill="none"><path d="M20 6L9 17L4 12"/></svg>'
        };

        // ---------- APP STATE ----------
        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
        // bottom nav screens: home, learn, progress, settings (profile uses header)

        // Screens data
        const screens = {
            onboarding: { title: 'Welcome' },
            home: { title: 'Home' },
            learn: { title: 'Lessons' },
            progress: { title: 'Progress' },
            settings: { title: 'Settings' }
        };

        // ---------- RENDER SCREEN ----------
        function renderContent(screenId) {
            const container = document.getElementById('screenContent');
            if (!container) return;
            let html = '';
            if (screenId === 'onboarding') {
                html = `
                    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; padding:20px 0;">
                        <div style="margin-bottom:40px;">
                            <svg width="60" height="60" viewBox="0 0 24 24" stroke="var(--primary)" stroke-width="2" fill="none"><path d="M4 4H20V20H4V4Z"/><path d="M8 8H16M8 12H14M8 16H12"/></svg>
                            <h2 style="font-size:40px; font-weight:800; color:var(--primary); margin:8px 0 0;">VocabVault</h2>
                            <p style="color:var(--text-secondary); font-size:16px;">Expand your English, one word at a time.</p>
                        </div>
                        <p style="color:var(--text-secondary); margin-bottom:32px;">Daily exercises, smart reminders & progress tracking. Master 3000+ words.</p>
                        <button class="btn-primary" id="getStartedBtn">Get Started →</button>
                        <div class="link-row">
                            <span id="privacyLink">Privacy Policy</span>
                            <span id="termsLink">Terms of Service</span>
                        </div>
                    </div>
                `;
            } else if (screenId === 'home') {
                html = `
                    <div class="card flex-row"><span class="badge">🔥 7 day streak</span> <span>⭐ 1240 XP</span></div>
                    <div class="card">
                        <h3 style="margin-bottom:10px;">Continue lesson</h3>
                        <div class="lesson-item"><span>Idioms: part 3</span> <span>75%</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div>
                        <button class="btn-primary" style="padding:10px; margin-top:12px;" id="continueLesson">Continue</button>
                    </div>
                    <div class="card">
                        <div style="display:flex; gap:12px; align-items:center;">${icons.flashcards}<span><strong>Daily goal</strong> 20/30 words</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:66%"></div></div>
                    </div>
                    <div class="grid-2">
                        <div class="stat">${icons.chart} 87% mastery</div>
                        <div class="stat">${icons.play} 5 min left</div>
                    </div>
                `;
            } else if (screenId === 'learn') {
                html = `
                    <div class="card"><input type="text" placeholder="Search lessons..." style="width:100%; padding:12px; border-radius:30px; border:1px solid var(--border-light); background:var(--bg-primary); color:var(--text-primary);"></div>
                    <div class="card">
                        <div class="lesson-item">${icons.lesson} <span><strong>Phrasal verbs</strong> 8 exercises</span> ${icons.check}</div>
                        <div class="lesson-item">${icons.flashcards} <span><strong>Academic word list</strong> 15 cards</span></div>
                        <div class="lesson-item">${icons.play} <span><strong>Listening: news</strong> 3 min</span></div>
                    </div>
                `;
            } else if (screenId === 'progress') {
                html = `
                    <div class="card"><h3>Weekly activity</h3><div style="height:100px; display:flex; align-items:flex-end; gap:4px; margin:10px 0;">[Mon Tue Wed Thu Fri Sat Sun]<br> ███ 1200xp</div></div>
                    <div class="card"><span>Badges: 6</span><div style="display:flex;">🏆 ⭐ 🔥 💯 🧠 🎯</div></div>
                    <div class="card"><span>Accuracy 84%</span><div class="progress-bar"><div class="progress-fill" style="width:84%"></div></div></div>
                `;
            } else if (screenId === 'settings') {
                html = `
                    <div class="card">
                        <div style="display:flex; align-items:center; gap:16px;">${icons.profile}<span><strong>Alex Chen</strong><br>alex@example.com</span></div>
                    </div>
                    <div class="card theme-toggle">
                        <span>🌙 Dark mode</span>
                        <label class="switch"><input type="checkbox" id="themeCheckbox" ${darkMode ? 'checked' : ''}><span class="slider"></span></label>
                    </div>
                    <div class="card"><span>Notifications</span> <span>🔔 on</span></div>
                    <div class="card"><span>Sound</span> <span>🔊 80%</span></div>
                `;
            }
            container.innerHTML = html;
            // attach listeners for modals if onboarding
            if (screenId === 'onboarding') {
                document.getElementById('privacyLink')?.addEventListener('click', ()=>openModal('privacy'));
                document.getElementById('termsLink')?.addEventListener('click', ()=>openModal('terms'));
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                    currentScreen = 'home';
                    updateUI();
                });
            }
            if (screenId === 'home') {
                document.getElementById('continueLesson')?.addEventListener('click', ()=>{
                    currentScreen = 'learn';
                    updateUI();
                });
            }
            if (screenId === 'settings') {
                const chk = document.getElementById('themeCheckbox');
                if(chk) {
                    chk.checked = darkMode;
                    chk.addEventListener('change', (e)=>{
                        darkMode = e.target.checked;
                        applyTheme();
                        updateUI(); // re-render settings to keep checkbox consistent
                    });
                }
            }
        }

        // ---------- HEADER ----------
        function renderHeader(screenId) {
            const headerDiv = document.getElementById('headerPlaceholder');
            let title = screens[screenId]?.title || 'VocabVault';
            headerDiv.innerHTML = `
                <div class="header">
                    <div class="header-left"><h1>${title}</h1></div>
                    <div class="profile-icon" id="profileIcon">${icons.profile}</div>
                </div>
            `;
            document.getElementById('profileIcon')?.addEventListener('click', ()=>{
                currentScreen = 'settings';
                updateUI();
            });
        }

        // ---------- BOTTOM NAV ----------
        function renderBottomNav(activeId) {
            const navItems = ['home', 'learn', 'progress', 'settings'];
            const navLabels = { home:'Home', learn:'Learn', progress:'Progress', settings:'Settings' };
            const navDiv = document.getElementById('bottomNav');
            let html = '';
            navItems.forEach(id => {
                const activeClass = (activeId === id && currentScreen !== 'onboarding') ? 'active' : '';
                html += `<div class="nav-item ${activeClass}" data-nav="${id}">
                    ${icons[id]}
                    <span class="nav-label">${navLabels[id]}</span>
                </div>`;
            });
            navDiv.innerHTML = html;
            navDiv.querySelectorAll('.nav-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    const navTo = el.dataset.nav;
                    if (navTo) {
                        currentScreen = navTo;
                        updateUI();
                    }
                });
            });
        }

        // modal logic
        function openModal(type) {
            document.getElementById('modalOverlay').style.display = 'block';
            if(type==='privacy') document.getElementById('privacyModal').style.display = 'block';
            else document.getElementById('termsModal').style.display = 'block';
        }
        function closeModals() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('privacyModal').style.display = 'none';
            document.getElementById('termsModal').style.display = 'none';
        }

        // main update
        function updateUI() {
            renderHeader(currentScreen);
            renderContent(currentScreen);
            if(currentScreen === 'onboarding') {
                // hide bottom nav
                document.getElementById('bottomNav').style.display = 'none';
            } else {
                document.getElementById('bottomNav').style.display = 'flex';
                renderBottomNav(currentScreen);
            }
        }

        // init
        updateUI();

        // modals listeners
        document.getElementById('modalOverlay').addEventListener('click', closeModals);
        document.getElementById('closePrivacy').addEventListener('click', closeModals);
        document.getElementById('closeTerms').addEventListener('click', closeModals);

        // ---------- SHIFT + W screenshot naming ----------
        let screenshotCounter = 1;
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const container = document.getElementById('phoneContainer');
                // Just simulate (in real prototype would capture). For spec we output sequential name.
                let filename = darkMode ? '6.png' : (screenshotCounter + '.png');
                if(darkMode) filename = '6.png';
                else {
                    filename = screenshotCounter + '.png';
                    screenshotCounter = screenshotCounter < 5 ? screenshotCounter+1 : 1;
                }
                alert(`📸 Screenshot saved as ${filename} (simulated)`);
            }
        });

        // inject JSON at the very bottom
        const jsonOutput = {
            "1.png": "Start Learning",
            "2.png": "Daily Lessons",
            "3.png": "Practice Skills",
            "4.png": "Track Progress",
            "5.png": "Smart Settings",
            "6.png": "Dark Theme"
        };
        console.log('titles =', jsonOutput);
        // also output in DOM
        const pre = document.createElement('pre');
        pre.style.position = 'absolute'; pre.style.left = '-999px';
        pre.textContent = JSON.stringify(jsonOutput, null, 2);
        document.body.appendChild(pre);
    })();
</script>
<!-- hidden JSON placeholder -->
<div style="display:none;">All done!</div>
</body>
