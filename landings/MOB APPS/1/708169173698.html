```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeFlow · Learn Python</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1e293b; /* dark background around phone */
    }
    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #0F172A;
      --text-sec: #334155;
      --border: #E2E8F0;
      --primary: #2563EB;
      --primary-light: #3B82F6;
      --secondary: #1E40AF;
      --accent: #38BDF8;
      --inactive: #94A3B8;
      --header-bg: #FFFFFFCC;
      --bottom-bg: #FFFFFF;
      --shadow: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,0,0,0.05);
      --progress-bg: #E2E8F0;
      --badge-bg: #DBEAFE;
    }
    body.dark {
      --bg: #0F172A;
      --card: #1E293B;
      --text: #E2E8F0;
      --text-sec: #CBD5E1;
      --border: #334155;
      --primary: #3B82F6;
      --primary-light: #60A5FA;
      --secondary: #2563EB;
      --accent: #38BDF8;
      --inactive: #64748B;
      --header-bg: #1E293BCC;
      --bottom-bg: #1E293B;
      --shadow: 0 8px 20px rgba(0,0,0,0.4);
      --progress-bg: #334155;
      --badge-bg: #1E3A8A;
    }
    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background-color: var(--bg);
      border-radius: 48px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
      position: relative;
      display: flex;
      flex-direction: column;
      border: 2px solid rgba(255,255,255,0.1);
    }
    /* header + main + bottom nav */
    .app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      transition: background 0.2s;
    }
    .header {
      padding: 20px 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--header-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      font-size: 22px;
      font-weight: 620;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    .profile-icon {
      cursor: pointer;
      padding: 8px;
      border-radius: 12px;
      transition: background 0.1s;
    }
    .profile-icon:hover { background: var(--border); }
    .profile-icon svg { display: block; }
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 8px;
      scrollbar-width: thin;
      scrollbar-color: var(--inactive) var(--bg);
    }
    .main-content::-webkit-scrollbar {
      width: 4px;
    }
    .main-content::-webkit-scrollbar-track { background: var(--bg); }
    .main-content::-webkit-scrollbar-thumb { background: var(--inactive); border-radius: 8px; }

    /* bottom navigation */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 8px 12px;
      background: var(--bottom-bg);
      border-top: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 30px;
      transition: all 0.15s ease;
      color: var(--inactive);
      fill: var(--inactive);
    }
    .nav-item.active {
      color: var(--primary);
      fill: var(--primary);
      background: var(--badge-bg);
      transform: scale(1.05);
    }
    .nav-item.active svg { stroke: var(--primary); }
    .nav-item span { font-size: 11px; font-weight: 500; }
    .nav-item svg { transition: transform 0.15s; }

    /* cards, progress */
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 18px 16px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .flex-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .gap-8 { gap: 8px; }
    .mb-2 { margin-bottom: 8px; }
    .mt-2 { margin-top: 8px; }
    .progress-bar {
      height: 10px;
      background: var(--progress-bg);
      border-radius: 20px;
      overflow: hidden;
      width: 100%;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 20px;
      width: 0%;
      transition: width 0.4s ease;
    }
    .badge {
      background: var(--badge-bg);
      padding: 6px 12px;
      border-radius: 30px;
      color: var(--primary);
      font-weight: 500;
      font-size: 13px;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-item {
      background: var(--bg);
      padding: 14px;
      border-radius: 18px;
      text-align: center;
    }
    button {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      padding: 14px 20px;
      border-radius: 40px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.1s;
      width: 100%;
    }
    button.secondary {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
    }
    .link-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 18px 0 8px;
    }
    .link {
      color: var(--inactive);
      text-decoration: underline;
      font-size: 13px;
      cursor: pointer;
    }
    .modal {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: var(--card);
      padding: 28px 24px;
      border-radius: 36px;
      box-shadow: 0 30px 60px #00000050;
      z-index: 100;
      width: 280px;
      border: 1px solid var(--border);
      color: var(--text);
      display: none;
    }
    .modal.show { display: block; }
    .overlay {
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: #00000060;
      backdrop-filter: blur(3px);
      z-index: 99;
      display: none;
    }
    .overlay.show { display: block; }
    .close-btn {
      margin-top: 20px;
      background: var(--secondary);
    }
    .lesson-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .lesson-item:last-child { border: none; }
    .icon-box svg { display: block; }
  </style>
</head>

<div class="phone" id="phoneContainer">
  <div class="app" id="app">
    <!-- header will be filled by js -->
    <div id="header-placeholder"></div>

    <div class="bottom-nav" id="bottomNav">
      <button class="nav-item" data-tab="home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></button>
      <button class="nav-item" data-tab="learn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span>Learn</span></button>
      <button class="nav-item" data-tab="progress"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/><path d="M9 8V6"/><path d="M15 8V6"/></svg><span>Progress</span></button>
      <button class="nav-item" data-tab="settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.02.02A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.64z"/><path d="M17 9V7"/><path d="M7 9V7"/></svg><span>Settings</span></button>
    </div>
  </div>
</div>

<!-- modals -->
<div class="overlay" id="modalOverlay"></div>
<div class="modal" id="privacyModal"><h2>🔒 Privacy</h2><p style="margin:16px 0">We respect your data. No tracking. (demo mock)</p><button class="close-btn" id="closePrivacy">Close</button></div>
<div class="modal" id="termsModal"><h2>📜 Terms</h2><p style="margin:16px 0">Educational use only. Practice Python safely.</p><button class="close-btn" id="closeTerms">Close</button></div>

<script>
  (function() {
    // ---------- THEME & ICONS ----------
    const icons = {
      profile: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
      check: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
      chart: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2"/><path d="M7 10l3-3 3 3 4-4"/><path d="M17 10V4h-6"/></svg>',
      flashcards: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18"/><path d="M8 2v20"/><path d="M16 2v20"/><path d="M2 8h20"/><path d="M2 16h20"/></svg>',
      play: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
      lesson: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
    };

    // state
    let currentScreen = 'onboarding'; // 'onboarding','home','learn','progress','settings'
    let darkMode = false;
    const themeColors = { light: '#F8FAFC', dark: '#0F172A' };

    // screen title map
    function getTitle(screen) {
      if (screen === 'onboarding') return '✨ CodeFlow';
      if (screen === 'home') return 'Dashboard';
      if (screen === 'learn') return 'Python paths';
      if (screen === 'progress') return 'Your stats';
      if (screen === 'settings') return 'Settings';
      return 'CodeFlow';
    }

    // render header dynamically
    function renderHeader() {
      const title = getTitle(currentScreen);
      let headerHTML = `<div class="header"><h1>${title}</h1><div class="profile-icon" id="profileBtn">${icons.profile}</div></div>`;
      document.getElementById('header-placeholder').innerHTML = headerHTML;
      document.getElementById('profileBtn')?.addEventListener('click', (e) => {
        e.stopPropagation();
        navigateTo('settings');
        setActiveTab('settings');
      });
    }

    // bottom nav active
    function setActiveTab(tab) {
      document.querySelectorAll('.nav-item').forEach(btn => {
        const dataTab = btn.getAttribute('data-tab');
        if (dataTab === tab) btn.classList.add('active');
        else btn.classList.remove('active');
      });
    }

    // navigation
    function navigateTo(screen) {
      currentScreen = screen;
      renderHeader();
      renderScreen(screen);
      if (screen !== 'onboarding') setActiveTab(screen === 'home' ? 'home' : (screen==='learn'?'learn':(screen==='progress'?'progress':'settings')));
    }

    // ---------- SCREEN RENDERERS ----------
    function renderScreen(screen) {
      const container = document.getElementById('screen-content');
      if (screen === 'onboarding') container.innerHTML = getOnboardingHTML();
      else if (screen === 'home') container.innerHTML = getHomeHTML();
      else if (screen === 'learn') container.innerHTML = getLearnHTML();
      else if (screen === 'progress') container.innerHTML = getProgressHTML();
      else if (screen === 'settings') container.innerHTML = getSettingsHTML();
      attachScreenListeners();
    }

    function getOnboardingHTML() {
      return `
        <div class="card" style="text-align:center; margin-top: 20px;">
          <div style="font-size: 60px; margin-bottom: 10px;">🐍</div>
          <h2 style="font-size: 32px; color: var(--primary);">CodeFlow</h2>
          <p style="font-size: 16px; margin: 8px 0 4px; font-weight: 500;">learn Python · 5min a day</p>
          <p style="color: var(--text-sec); margin: 16px;">Master variables, loops, functions with bite-sized interactive exercises.</p>
          <button id="getStartedBtn" style="margin-top: 12px;">Get Started →</button>
          <div class="link-group">
            <span class="link" id="privacyLink">Privacy Policy</span>
            <span class="link" id="termsLink">Terms of Service</span>
          </div>
        </div>
      `;
    }

    function getHomeHTML() {
      return `
        <div class="card">
          <div class="flex-row gap-8"><span class="badge">🔥 streak 12 days</span><span class="badge">⚡ 230 XP</span></div>
          <div style="margin: 16px 0 8px;"><span style="font-weight: 600;">today's goal</span><span style="float:right;">40%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:40%"></div></div>
          <div style="margin-top: 20px; display: flex; gap:12px;">
            <div style="flex:1; background:var(--bg); border-radius: 20px; padding: 12px;">${icons.flashcards}<br> <strong>2 cards</strong><br><span style="font-size:12px;">review</span></div>
            <div style="flex:1; background:var(--bg); border-radius: 20px; padding: 12px;">${icons.lesson}<br> <strong>3 lessons</strong><br><span style="font-size:12px;">pending</span></div>
          </div>
        </div>
        <div class="card"><h3 style="margin-bottom: 12px;">📘 continue learning</h3>
          <div class="lesson-item"><span>⚙️ Functions deep dive</span><span>${icons.play}</span></div>
          <div class="lesson-item"><span>📋 Lists & loops</span><span>${icons.play}</span></div>
          <div class="lesson-item"><span>🧩 Dictionaries</span><span>${icons.play}</span></div>
        </div>
        <div class="card"><h3>🏆 daily badge</h3><div style="display:flex; gap:10px;margin-top:12px;"><span class="badge">early bird</span><span class="badge">focus</span><span class="badge">helper</span></div></div>
      `;
    }

    function getLearnHTML() {
      return `
        <div class="card"><h3>🐍 Python basics</h3><div class="progress-bar" style="margin:12px 0"><div class="progress-fill" style="width:30%"></div></div>
          <div class="lesson-item"><span>#1 print & strings</span><span>${icons.check}</span></div>
          <div class="lesson-item"><span>#2 variables</span><span>${icons.check}</span></div>
          <div class="lesson-item"><span>#3 conditions</span><span>▶️ start</span></div>
          <div class="lesson-item"><span>#4 loops</span><span>🔒 locked</span></div>
        </div>
        <div class="card"><h3>✨ practice</h3><button class="secondary" style="margin-top:10px;">quick challenge (5 min)</button></div>
        <div class="card"><h3>📚 flashcards</h3><div class="flex-row">${icons.flashcards} 12 due · <span class="badge">review</span></div></div>
      `;
    }

    function getProgressHTML() {
      return `
        <div class="stat-grid">
          <div class="stat-item"><span style="font-size:22px;">34</span><br>lessons done</div>
          <div class="stat-item"><span style="font-size:22px;">1,280</span><br>total XP</div>
        </div>
        <div class="card"><h3>⏱️ weekly activity</h3><div style="display:flex; gap:8px; justify-content:space-between;margin:12px 0">M<div style="height:30px;width:12px;background:var(--primary);border-radius:6px;"></div>T<div style="height:50px;width:12px;background:var(--primary);"></div>W<div style="height:24px;width:12px;background:var(--primary);"></div>T<div style="height:40px;width:12px;background:var(--primary);"></div>F<div style="height:60px;width:12px;background:var(--primary);"></div>S<div style="height:20px;width:12px;background:var(--primary);"></div></div></div>
        <div class="card"><h3>📈 accuracy 78%</h3><div class="progress-bar"><div class="progress-fill" style="width:78%"></div></div><p style="margin-top:8px;">${icons.chart} +5% vs last week</p></div>
      `;
    }

    function getSettingsHTML() {
      return `
        <div class="card">
          <h3>⚙️ preferences</h3>
          <div style="display:flex; justify-content:space-between; align-items:center; margin:20px 0;">
            <span>🌙 dark theme</span>
            <label style="width:50px; height:26px; background:var(--inactive); border-radius:30px; position:relative; display:inline-block; cursor:pointer;" id="themeToggle">
              <span style="width:22px; height:22px; background:white; border-radius:50%; position:absolute; top:2px; left:${darkMode?'26px':'2px'}; transition:0.1s;"></span>
            </label>
          </div>
          <div style="margin: 20px 0;">🔔 notifications</div>
          <div>📞 contact support</div>
          <hr style="border-color:var(--border); margin:20px 0;">
          <p style="color:var(--text-sec);">version 2026.3 · python ed</p>
        </div>
      `;
    }

    function attachScreenListeners() {
      // theme toggle
      const toggle = document.getElementById('themeToggle');
      if (toggle) {
        toggle.addEventListener('click', (e) => {
          darkMode = !darkMode;
          document.body.classList.toggle('dark', darkMode);
          // re-render current screen to update toggle thumb (quick)
          renderScreen(currentScreen);
          renderHeader();
          if (currentScreen==='settings') setActiveTab('settings');
        });
      }
      // get started
      document.getElementById('getStartedBtn')?.addEventListener('click', () => {
        navigateTo('home');
        setActiveTab('home');
      });
      // modals
      document.getElementById('privacyLink')?.addEventListener('click', showPrivacy);
      document.getElementById('termsLink')?.addEventListener('click', showTerms);
      // close buttons
      document.getElementById('closePrivacy')?.addEventListener('click', hideModals);
      document.getElementById('closeTerms')?.addEventListener('click', hideModals);
      document.getElementById('modalOverlay')?.addEventListener('click', hideModals);
    }

    // modals
    function showPrivacy() { document.getElementById('privacyModal').classList.add('show'); document.getElementById('modalOverlay').classList.add('show'); }
    function showTerms() { document.getElementById('termsModal').classList.add('show'); document.getElementById('modalOverlay').classList.add('show'); }
    function hideModals() { document.getElementById('privacyModal').classList.remove('show'); document.getElementById('termsModal').classList.remove('show'); document.getElementById('modalOverlay').classList.remove('show'); }

    // bottom nav listeners
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const tab = btn.getAttribute('data-tab');
        if (tab === 'home') navigateTo('home');
        else if (tab === 'learn') navigateTo('learn');
        else if (tab === 'progress') navigateTo('progress');
        else if (tab === 'settings') navigateTo('settings');
      });
    });

    // initial load (onboarding)
    renderHeader();
    renderScreen('onboarding');
    // all inactive
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));

    // screenshot feature shift+W
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const container = document.getElementById('phoneContainer');
        import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm').then(module => {
          const html2canvas = module.default;
          html2canvas(container, { backgroundColor: null }).then(canvas => {
            const link = document.createElement('a');
            const themeSuffix = darkMode ? '6' : (currentScreen === 'onboarding'?'1':(currentScreen==='home'?'2':(currentScreen==='learn'?'3':(currentScreen==='progress'?'4':'5'))));
            link.download = `${themeSuffix}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
          });
        });
      }
    });
  })();
</script>

<script>
  (function() { 
    const titles = {
      "1.png": "Start Learning",
      "2.png": "Daily Lessons",
      "3.png": "Practice Skills",
