```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab mastery · 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #d9e2ef;
      padding: 12px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background-color: var(--bg-primary);
      border-radius: 48px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.3), 0 0 0 8px #e2e8f0;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s;
    }

    /* theme vars – light default */
    :root {
      --bg-primary: #F8FAFC;
      --bg-card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --border-light: #E2E8F0;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --inactive: #94A3B8;
      --nav-bg: #FFFFFF;
      --shadow: 0 4px 12px rgba(0,0,0,0.05);
    }

    body.dark {
      --bg-primary: #0F172A;
      --bg-card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --border-light: #334155;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --inactive: #64748B;
      --nav-bg: #1E293B;
      --shadow: 0 4px 12px rgba(0,0,0,0.5);
    }

    /* main screen container (view stack) */
    .screen-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 8px 16px;
      scrollbar-width: thin;
      background: var(--bg-primary);
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-light);
    }
    .header-left h1 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .profile-btn svg {
      width: 26px;
      height: 26px;
      stroke: var(--text-primary);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* bottom nav */
    .bottom-nav {
      height: 72px;
      background: var(--nav-bg);
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      border-top: 1px solid var(--border-light);
      padding-bottom: 6px;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 20px;
      transition: all 0.15s ease;
      color: var(--inactive);
      fill: none;
    }
    .nav-item svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.1s;
    }
    .nav-item span {
      font-size: 11px;
      font-weight: 500;
      color: currentColor;
    }
    .nav-item.active {
      color: var(--primary);
      background: rgba(37, 99, 235, 0.1);
    }
    .nav-item.active svg {
      transform: scale(1.15);
      stroke: var(--primary);
    }

    /* UI cards */
    .card {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 18px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      background: var(--accent);
      color: #0F172A;
      font-weight: 600;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 30px;
    }
    .progress-bar {
      height: 8px;
      background: var(--border-light);
      border-radius: 30px;
      margin: 12px 0;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      border-radius: 30px;
      transition: width 0.3s;
    }
    .icon-row {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .stat-number {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
    }
    .lesson-item {
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .lesson-item:last-child {
      border-bottom: none;
    }
    button {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      padding: 14px 24px;
      border-radius: 40px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 8px 16px -6px var(--primary-dark);
      transition: 0.1s;
    }
    button.secondary {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
      box-shadow: none;
    }
    .link {
      color: var(--primary);
      font-weight: 500;
      text-decoration: none;
      background: none;
      padding: 6px;
      box-shadow: none;
      font-size: 14px;
    }

    /* modal */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(3px);
    }
    .modal {
      background: var(--bg-card);
      width: 280px;
      border-radius: 32px;
      padding: 24px;
      color: var(--text-primary);
      box-shadow: 0 30px 40px black;
    }
    .modal button {
      margin-top: 16px;
      width: 100%;
    }

    /* hidden utility */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <!-- header (dynamic title & profile) -->
  <div class="header" id="appHeader">
    <div class="header-left"><h1 id="headerTitle">Onboarding</h1></div>
    <button class="profile-btn" id="profileBtn" aria-label="Profile">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </button>
  </div>

  <!-- main screen content injected -->
  <div id="screenContent" class="screen-container"></div>

  <!-- bottom navigation (4 items) -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item" data-nav="home"><svg viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></button>
    <button class="nav-item" data-nav="learn"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span>Learn</span></button>
    <button class="nav-item" data-nav="progress"><svg viewBox="0 0 24 24"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/></svg><span>Progress</span></button>
    <button class="nav-item" data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.02.02A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.64z"/><path d="M4.6 9.36 4.6 9.36a10 10 0 0 1 14.8 0"/></svg><span>Settings</span></button>
  </nav>
</div>

<script>
  (function() {
    // ---------- THEME & ICONS ----------
    const theme = { dark: false };
    function toggleTheme() {
      document.body.classList.toggle('dark', theme.dark);
    }

    // inline svg icon set (all outline 2px, rounded)
    const icons = {
      profile: '<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
      home: '<svg viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
      learn: '<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
      progress: '<svg viewBox="0 0 24 24"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/></svg>',
      settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.02.02A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.64z"/><path d="M4.6 9.36 4.6 9.36a10 10 0 0 1 14.8 0"/></svg>',
      lesson: '<svg viewBox="0 0 24 24"><path d="M2 3h8a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-8a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h9z"/></svg>',
      chart: '<svg viewBox="0 0 24 24"><path d="M21 16v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2"/><path d="M7 10v6"/><path d="M12 6v10"/><path d="M17 4v12"/></svg>',
      flashcards: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" ry="2"/><path d="M7 9h10"/><path d="M7 13h6"/></svg>',
      play: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8" fill="none"/></svg>',
      check: '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" fill="none"/></svg>',
    };

    // ---------- SCREEN MANAGER ----------
    let currentScreen = 'onboarding';
    const headerEl = document.getElementById('headerTitle');
    const contentEl = document.getElementById('screenContent');
    const navItems = document.querySelectorAll('.nav-item');
    const profileBtn = document.getElementById('profileBtn');

    // modal state
    let modalDiv = null;

    function closeModal() { if(modalDiv) { modalDiv.remove(); modalDiv = null; }}

    function showModal(title, body) {
      closeModal();
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };
      modalDiv = overlay;
      overlay.innerHTML = `<div class="modal"><h3 style="margin-bottom:12px">${title}</h3><p style="margin-bottom:20px">${body}</p><button class="link" id="modalCloseBtn">Close</button></div>`;
      document.querySelector('.phone').appendChild(overlay);
      document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    }

    // screens render functions
    function renderOnboarding() {
      headerEl.innerText = 'Vocab master';
      return `
        <div class="card" style="text-align:center; padding:32px 20px">
          <div style="background:#2563EB; width:70px; height:70px; border-radius:20px; margin:0 auto 20px; display:flex; align-items:center; justify-content:center">
            <svg width="44" height="44" viewBox="0 0 24 24" stroke="white" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
          </div>
          <h2 style="font-size:28px; margin-bottom:8px; color:var(--text-primary)">LexiCards</h2>
          <p style="color:var(--accent); font-weight:600">master English vocabulary</p>
          <p style="margin:16px 0 24px; color:var(--text-secondary)">Smart flashcards & daily challenges to grow your word bank.</p>
          <button id="getStartedBtn" style="width:100%">Get Started</button>
          <div style="margin-top:24px; display:flex; gap:24px; justify-content:center">
            <button class="link" id="privacyLink">Privacy</button>
            <button class="link" id="termsLink">Terms</button>
          </div>
        </div>
      `;
    }

    function renderHome() {
      return `
        <div class="card">
          <div class="row"><span class="badge">⚡ daily streak 7</span><span class="stat-number">🔥 142</span></div>
          <div style="margin-top:12px"><strong>Today’s goal</strong><div class="progress-bar"><div class="progress-fill" style="width:65%"></div></div></div>
        </div>
        <div class="card">
          <div class="row"><h3>Recommended</h3><span class="link">see all</span></div>
          <div class="lesson-item">${icons.flashcards} Business collocations</div>
          <div class="lesson-item">${icons.play} Phrasal verbs quiz</div>
          <div class="lesson-item">${icons.lesson} Academic word list</div>
        </div>
        <div class="card" style="background:var(--accent); color:#0F172A">
          <div class="row"><span>🎯 Challenge: 5 new words</span><button class="secondary" style="padding:8px 16px;">Start</button></div>
        </div>
      `;
    }

    function renderLearn() {
      return `
        <div class="card">
          <h3>Beginner</h3>
          <div class="lesson-item"><span>Essentials 1  •  12 words</span> <span class="badge">80%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:80%"></div></div>
          <div class="lesson-item"><span>Food & drinks</span> <span class="badge">30%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div>
          <button style="width:100%; margin-top:16px">continue learning</button>
        </div>
        <div class="card">
          <h3>Flashcards</h3>
          <div class="icon-row">${icons.flashcards} 20 cards ready</div>
          <button class="secondary" style="margin-top:12px">practice now</button>
        </div>
      `;
    }

    function renderProgress() {
      return `
        <div class="card">
          <div class="row"><span>words learned</span><span class="stat-number">189</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:63%"></div></div>
          <div style="display:flex; gap:20px; margin-top:16px">
            <div>${icons.chart} 63%</div><div>${icons.check} 12h</div>
          </div>
        </div>
        <div class="card">
          <h4>Badges</h4>
          <div style="display:flex; gap:20px; margin:12px 0">🏆 🔥 💪</div>
          <div>weekly streak: 7 days</div>
        </div>
        <div class="card"><canvas id="dummyChart" width="280" height="80" style="width:100%; height:80px; background:var(--border-light); border-radius:20px;"></canvas></div>
        <p style="text-align:center">＋15 words this week</p>
      `;
    }

    function renderSettings() {
      const isDark = document.body.classList.contains('dark');
      return `
        <div class="card">
          <div class="row"><span>🌙 Dark mode</span><button class="link" id="themeToggleBtn">${isDark ? 'disable' : 'enable'}</button></div>
        </div>
        <div class="card">
          <div class="row">🔔 Notifications</div>
          <div class="row">🔊 Sound effects</div>
        </div>
        <div class="card">Profile info • language</div>
      `;
    }

    function renderProfileSettings() {
      return `<div class="card"><h3>Profile</h3><p>Alex • intermediate</p><button class="secondary" id="backFromProfile">← back to settings</button></div>`;
    }

    function loadScreen(screen) {
      currentScreen = screen;
      if (screen === 'onboarding') contentEl.innerHTML = renderOnboarding();
      else if (screen === 'home') contentEl.innerHTML = renderHome();
      else if (screen === 'learn') contentEl.innerHTML = renderLearn();
      else if (screen === 'progress') contentEl.innerHTML = renderProgress();
      else if (screen === 'settings') contentEl.innerHTML = renderSettings();
      else if (screen === 'profile') contentEl.innerHTML = renderProfileSettings();

      // update bottom nav active
      navItems.forEach(item => {
        const nav = item.dataset.nav;
        if (nav === screen) item.classList.add('active');
        else item.classList.remove('active');
      });

      // attach events specific
      if (screen === 'onboarding') {
        document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
          loadScreen('home');
        });
        document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy policy','We respect your data. No selling.'));
        document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms of service','Use LexiCards for personal learning only.'));
      }
      if (screen === 'settings') {
        document.getElementById('themeToggleBtn')?.addEventListener('click', (e)=>{
          theme.dark = !theme.dark;
          toggleTheme();
          loadScreen('settings'); // refresh
        });
      }
      if (screen === 'profile') {
        document.getElementById('backFromProfile')?.addEventListener('click', ()=> loadScreen('settings'));
      }
    }

    // navigation
    navItems.forEach(btn => {
      btn.addEventListener('click', (e) => {
        const nav = btn.dataset.nav;
        loadScreen(nav);
      });
    });

    profileBtn.addEventListener('click', ()=>{
      loadScreen('profile');
    });

    // start with onboarding
    loadScreen('onboarding');

    // ---------- SCREENSHOT (SHIFT+W) ----------
    let screenshotCounter = 1;
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const phone = document.getElementById('phoneContainer');
        // rough html2canvas style: we just alert (since real canvas not included)
        // but we simulate the naming
        const isDark = document.body.classList.contains('dark');
        let name = isDark ? '6.png' : (screenshotCounter + '.png');
        if (!isDark && screenshotCounter < 6) {
          // increment for demo, but we output json
          screenshotCounter = screenshotCounter === 5 ? 1 : screenshotCounter+1;
        }
        alert(`📸 screenshot captured: ${name} (simulated)`);
      }
    });

    // ---------- INIT THEME ----------
    theme.dark = false;
    toggleTheme();
  })();
</script>

      "6.png": "Dark Theme"
    };
    console.log(JSON.stringify(json, null, 2));
    document.write('<pre style="white-space:pre-wrap; margin:20px; background:#eee; padding:8px;">' + JSON.stringify(json, null, 2) + '</pre>');
