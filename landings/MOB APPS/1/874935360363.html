```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashLearn · 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* CSS variables – light mode default */
    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --text-tertiary: #64748B;
      --border-light: #E2E8F0;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --icon-inactive: #94A3B8;
      --bottom-bar-bg: #FFFFFF;
      --shadow-sm: 0 4px 12px rgba(0,0,0,0.03), 0 1px 2px rgba(0,0,0,0.05);
      --shadow-hover: 0 8px 20px rgba(37,99,235,0.08);
      --progress-bg: #E2E8F0;
      --badge-gold: #FBBF24;
      --badge-blue: #BFDBFE;
    }

    body.dark {
      --bg: #0F172A;
      --card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --text-tertiary: #94A3B8;
      --border-light: #334155;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --icon-inactive: #64748B;
      --bottom-bar-bg: #1E293B;
      --shadow-sm: 0 8px 20px rgba(0,0,0,0.5);
      --progress-bg: #334155;
      --badge-gold: #B45309;
      --badge-blue: #1E3A8A;
    }

    body {
      background: #111827;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background-color: var(--bg);
      border-radius: 48px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
      border: 1px solid #2d3a4e;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s;
    }

    /* main app view (screen container) */
    .app-screen {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px 12px 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--primary) var(--border-light);
      background: var(--bg);
      transition: background 0.2s;
    }
    .app-screen::-webkit-scrollbar {
      width: 4px;
    }
    .app-screen::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 8px;
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0 16px 0;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 650;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }
    .profile-icon {
      cursor: pointer;
      padding: 8px;
      border-radius: 12px;
      transition: background 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .profile-icon:hover {
      background: var(--border-light);
    }

    /* bottom navigation */
    .bottom-nav {
      background: var(--bottom-bar-bg);
      border-top: 1px solid var(--border-light);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 8px 14px;
      transition: background 0.2s;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 500;
      color: var(--icon-inactive);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 30px;
      transition: all 0.15s ease;
      flex: 1;
    }
    .nav-item.active {
      color: var(--primary);
      background: rgba(37,99,235,0.08);
      transform: scale(1.02);
    }
    .nav-item.active svg {
      stroke: var(--primary);
      transform: scale(1.1);
      filter: drop-shadow(0 2px 6px rgba(37,99,235,0.2));
    }
    .nav-item svg {
      stroke: currentColor;
      transition: all 0.15s;
    }

    /* cards, containers */
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 18px 16px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
      border: 1px solid var(--border-light);
    }

    /* buttons */
    .btn-primary {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      padding: 16px 24px;
      border-radius: 60px;
      font-size: 18px;
      width: 100%;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 4px 0 var(--primary-dark);
    }
    .btn-primary:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--primary-dark);
    }

    .legal-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 18px;
      font-size: 13px;
    }
    .legal-links span {
      color: var(--primary);
      text-decoration: underline;
      cursor: pointer;
    }

    /* progress bars */
    .progress-bar-bg {
      background: var(--progress-bg);
      height: 8px;
      border-radius: 20px;
      margin: 12px 0 6px;
    }
    .progress-fill {
      background: var(--primary);
      width: 0%;
      height: 8px;
      border-radius: 20px;
      transition: width 0.4s ease;
    }

    /* row stats */
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 12px 0;
    }
    .badge {
      background: var(--badge-blue);
      padding: 4px 10px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 600;
    }

    /* modal overlay */
    .modal {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-content {
      background: var(--card);
      width: 280px;
      padding: 28px 20px;
      border-radius: 32px;
      text-align: center;
      color: var(--text-primary);
      border: 1px solid var(--border-light);
    }
    .modal-content button {
      margin-top: 20px;
      background: var(--primary);
      border: none;
      color: white;
      padding: 10px 24px;
      border-radius: 40px;
      font-weight: 600;
    }

    /* chart sparkline */
    .chart-spark {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 50px;
      margin: 16px 0;
    }
    .bar {
      width: 18px;
      background: var(--primary);
      height: calc(100% - 20px);
      border-radius: 12px 12px 4px 4px;
      transition: height 0.5s;
    }

    /* toggle */
    .theme-toggle {
      display: flex;
      gap: 12px;
      margin: 16px 0;
    }
    .theme-option {
      background: var(--border-light);
      padding: 8px 16px;
      border-radius: 30px;
      font-weight: 500;
      cursor: pointer;
    }
    .theme-option.active {
      background: var(--primary);
      color: white;
    }

    /* icon inline style */
    .icon-box {
      display: inline-flex;
    }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <!-- DYNAMIC HEADER (rendered via JS) -->
  <div id="headerPlaceholder"></div>

  <!-- MAIN SCREEN CONTENT -->
  <div id="screenContent" class="app-screen"></div>

  <!-- BOTTOM NAV (fixed) -->
  <div class="bottom-nav" id="bottomNav"></div>

  <!-- MODAL for privacy/terms -->
  <div id="modalOverlay" class="modal" onclick="if(event.target===this) closeModal()">
    <div class="modal-content" id="modalContent">
      <h3 id="modalTitle"></h3>
      <p id="modalBody"></p>
      <button onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script>
  (function() {
    // ---------- ICON SYSTEM (inline SVG) ----------
    function iconHome(active = false) { return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${active ? '#2563EB' : 'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10L12 3L21 10L21 20L3 20L3 10Z"/><rect x="9" y="14" width="6" height="6"/></svg>`; }
    function iconLearn(active = false) { return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${active ? '#2563EB' : 'currentColor'}" stroke-width="2" stroke-linecap="round"><path d="M2 18L12 22L22 18M2 12L12 16L22 12M12 2L2 6L12 10L22 6L12 2Z"/></svg>`; }
    function iconProgress(active = false) { return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${active ? '#2563EB' : 'currentColor'}" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7V12L15 15"/><path d="M5 3L8 6"/><path d="M19 3L16 6"/></svg>`; }
    function iconSettings(active = false) { return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${active ? '#2563EB' : 'currentColor'}" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`; }
    function iconProfile() { return `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`; }
    function iconLesson() { return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="12" y2="13"/></svg>`; }
    function iconChart() { return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`; }
    function iconFlash() { return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M13 2L3 14H12L11 22L21 10H12L13 2Z"/></svg>`; }
    function iconPlay() { return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>`; }
    function iconCheck() { return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>`; }

    // ---------- APP STATE ----------
    let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
    let darkMode = false;
    const themeToggleBtn = () => {
      darkMode = !darkMode;
      if (darkMode) document.body.classList.add('dark');
      else document.body.classList.remove('dark');
      renderScreen(); // refresh with new theme
    };

    // screens data
    const screens = ['onboarding','home','learn','progress','settings'];

    // bottom nav items (except onboarding)
    const navItems = [
      { id: 'home', label: 'Home', icon: iconHome },
      { id: 'learn', label: 'Learn', icon: iconLearn },
      { id: 'progress', label: 'Progress', icon: iconProgress },
      { id: 'settings', label: 'Settings', icon: iconSettings }
    ];

    // modal
    function showModal(title, text) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalBody').innerText = text;
      document.getElementById('modalOverlay').style.display = 'flex';
    }
    window.closeModal = function() { document.getElementById('modalOverlay').style.display = 'none'; };

    // header render
    function renderHeader(title) {
      let headerHTML = `
        <div class="header">
          <h1>${title}</h1>
          <div class="profile-icon" id="profileBtn">${iconProfile()}</div>
        </div>
      `;
      document.getElementById('headerPlaceholder').innerHTML = headerHTML;
      document.getElementById('profileBtn')?.addEventListener('click', ()=>{
        if (currentScreen !== 'settings') {
          currentScreen = 'settings';
          renderScreen();
        }
      });
    }

    // bottom navigation render
    function renderBottomNav(activeId) {
      let navHTML = '';
      navItems.forEach(item => {
        const active = (item.id === activeId);
        navHTML += `
          <button class="nav-item ${active ? 'active' : ''}" data-nav="${item.id}">
            ${item.icon(active)}
            <span>${item.label}</span>
          </button>
        `;
      });
      document.getElementById('bottomNav').innerHTML = navHTML;
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const navId = btn.dataset.nav;
          if (navId) { currentScreen = navId; renderScreen(); }
        });
      });
    }

    // main screen content
    function renderScreenContent() {
      const container = document.getElementById('screenContent');
      if (currentScreen === 'onboarding') {
        renderHeader('Welcome');
        container.innerHTML = `
          <div style="display: flex; flex-direction: column; align-items: center; text-align: center;">
            <div style="margin: 24px 0 16px;">${iconFlash()}</div>
            <h2 style="font-size: 32px; font-weight: 700; color: var(--primary);">FlashLearn</h2>
            <p style="font-size: 18px; margin: 8px 0; color: var(--text-secondary);">master flashcards, remember forever</p>
            <p style="color: var(--text-tertiary); margin: 12px 0 24px;">Science‑backed vocabulary & concept builder. Learn anything with smart cards.</p>
            <button class="btn-primary" id="getStartedBtn">Get Started</button>
            <div class="legal-links">
              <span id="privacyLink">Privacy Policy</span>
              <span id="termsLink">Terms of Service</span>
            </div>
          </div>
        `;
        document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{ currentScreen='home'; renderScreen(); });
        document.getElementById('privacyLink')?.addEventListener('click', ()=>showModal('Privacy Policy','We respect your data. No sharing, ever.'));
        document.getElementById('termsLink')?.addEventListener('click', ()=>showModal('Terms of Service','Educational use only. Be nice.'));
        renderBottomNav('home'); // but hide? we keep but not active onboarding but bottom nav visible – style neutral.
        navItems.forEach(()=>{}); // ignore active
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      } 
      else if (currentScreen === 'home') {
        renderHeader('Home');
        container.innerHTML = `
          <div class="card">
            <div style="display:flex; align-items: center; gap:12px">${iconFlash()}<span style="font-weight:600;font-size:18px">Daily goal</span></div>
            <div class="progress-bar-bg"><div class="progress-fill" style="width:64%"></div></div>
            <div class="stat-row"><span>64% complete</span><span>🔥 12 day streak</span></div>
          </div>
          <div class="card">
            <div style="display:flex; justify-content: space-between;"><span style="font-weight:700;">Continue learning</span><span>see all</span></div>
            <div style="display:flex; gap:12px; margin-top:12px;">
              <span class="badge">Spanish vocab</span><span class="badge">Python basics</span>
            </div>
            <div style="display: flex; gap:16px; align-items:center; margin-top:16px;">${iconLesson()} <span>Body parts · 5 cards left</span> ${iconPlay()}</div>
          </div>
          <div class="card">
            <span style="font-weight:700;">🌟 Achievements</span>
            <div style="display:flex; gap:12px; margin-top:12px;"><span>🔥 7 day</span><span>⚡ speedster</span><span>🧠 100 cards</span></div>
          </div>
        `;
        renderBottomNav('home');
      }
      else if (currentScreen === 'learn') {
        renderHeader('Learn');
        container.innerHTML = `
          <div class="card">
            <div style="display:flex; gap:16px;">${iconFlash()} <span style="font-weight:600;">Flashcard set: Geography</span></div>
            <div class="progress-bar-bg"><div class="progress-fill" style="width:30%"></div></div>
            <div style="display:flex; justify-content: space-between;margin:8px 0"><span>30% mastered</span><span>42/140 cards</span></div>
            <button class="btn-primary" style="padding:12px; font-size:16px;" id="practiceNow">Practice now</button>
          </div>
          <div class="card">
            <span style="font-weight:600;">Daily pick</span>
            <div style="display:flex; align-items:center; gap:12px; margin:12px 0;">${iconLesson()} <span>Capitals of Europe</span> ${iconPlay()}</div>
            <div style="display:flex; align-items:center; gap:12px;">${iconLesson()} <span>Chemical symbols</span> ${iconPlay()}</div>
          </div>
        `;
        document.getElementById('practiceNow')?.addEventListener('click', ()=>{
          alert('Starting practice session (simulated)');
        });
        renderBottomNav('learn');
      }
      else if (currentScreen === 'progress') {
        renderHeader('Progress');
        container.innerHTML = `
          <div class="card">
            <span style="font-weight:700;">Weekly activity</span>
            <div class="chart-spark" id="chartBars">
              <div class="bar" style="height:32px"></div><div class="bar" style="height:18px"></div><div class="bar" style="height:44px"></div><div class="bar" style="height:28px"></div><div class="bar" style="height:52px"></div><div class="bar" style="height:38px"></div>
            </div>
            <div class="stat-row"><span>Total cards: 342</span><span>level 8</span></div>
          </div>
          <div class="card">
            <span>⚡ fastest recall: 2.1s</span>
          </div>
        `;
        renderBottomNav('progress');
        setTimeout(()=>{ // small animation
          const bars = document.querySelectorAll('.bar');
          if(bars.length) bars.forEach((b,i)=> b.style.height = `${20+ i*5}px`);
        }, 100);
      }
      else if (currentScreen === 'settings') {
        renderHeader('Settings');
        container.innerHTML = `
          <div class="card">
            <div style="font-weight:600;">Appearance</div>
            <div class="theme-toggle">
              <span class="theme-option ${!darkMode ? 'active':''}" id="themeLight">☀️ Light</span>
              <span class="theme-option ${darkMode ? 'active':''}" id="themeDark">🌙 Dark</span>
            </div>
            <div style="margin-top:20px;">⚙️ Profile: Alex L.</div>
            <div style="margin-top:8px;">🔔 Notifications on</div>
          </div>
        `;
        document.getElementById('themeLight')?.addEventListener('click', ()=>{ if(darkMode) themeToggleBtn(); });
        document.getElementById('themeDark')?.addEventListener('click', ()=>{ if(!darkMode) themeToggleBtn(); });
        renderBottomNav('settings');
      }
    }

    function renderScreen() {
      renderScreenContent();
    }

    // screenshot hotkey (SHIFT + W)
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const phone = document.getElementById('phoneContainer');
        html2canvas?.(phone, { scale: 2 }).then(canvas => {
          const link = document.createElement('a');
          const themePart = darkMode ? '6' : (currentScreen === 'onboarding'?'1':currentScreen==='home'?'2':currentScreen==='learn'?'3':currentScreen==='progress'?'4':'5');
          link.download = `${themePart}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        }).catch(() => alert('html2canvas not loaded — screenshot dev feature.'));
      }
    });

    // load html2canvas from CDN for screenshot feature
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    script.onload = () => console.log('screenshot ready');
    document.head.appendChild(script);

    // initial render
    renderScreen();
  })();
</script>

  "titles": {

    "4.png": "Track Progress",
    "5.png": "Smart Settings",
    "6.png": "Dark Theme"
  }
}
</pre>
All done!
</body>
</html>
```
