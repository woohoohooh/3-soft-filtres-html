```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Play · mobile prototype</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1a1e2b;
      padding: 16px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background-color: var(--bg-primary);
      border-radius: 44px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 10px #2d3340;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: background-color 0.2s;
    }

    /* light theme (default) */
    :root {
      --bg-primary: #F8FAFC;
      --bg-card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --border-light: #E2E8F0;
      --primary-blue: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --icon-inactive: #94A3B8;
      --nav-highlight: #EFF6FF;
      --progress-bg: #E2E8F0;
    }

    body.dark {
      --bg-primary: #0F172A;
      --bg-card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --border-light: #334155;
      --primary-blue: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --icon-inactive: #64748B;
      --nav-highlight: #1E293B;
      --progress-bg: #334155;
    }

    /* main content flex */
    .app-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: none;
      padding: 16px 16px 8px 16px;
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0 16px 0;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      transition: background 0.15s;
    }
    .profile-btn:hover {
      background: var(--nav-highlight);
    }

    /* bottom navigation */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 12px 12px;
      background: var(--bg-card);
      border-top: 1px solid var(--border-light);
      border-radius: 0 0 44px 44px;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
      border: none;
      cursor: pointer;
      gap: 4px;
      transition: all 0.15s ease;
      padding: 6px 12px 4px;
      border-radius: 30px;
      color: var(--icon-inactive);
      fill: var(--icon-inactive);
    }
    .nav-item.active {
      background: var(--nav-highlight);
      color: var(--primary-blue);
      fill: var(--primary-blue);
      transform: scale(1.05);
    }
    .nav-item.active svg {
      stroke: var(--primary-blue);
    }
    .nav-item span {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    .nav-item svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.1s;
    }

    /* onboarding cards, modals */
    .onboarding-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px 8px;
    }
    .big-logo {
      background: linear-gradient(145deg, #2563EB, #38BDF8);
      width: 90px;
      height: 90px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .app-name {
      font-size: 38px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .tagline {
      font-size: 20px;
      font-weight: 600;
      color: var(--primary-blue);
    }
    .desc {
      color: var(--text-secondary);
      margin: 16px 0 28px;
      line-height: 1.5;
    }
    .btn-primary {
      background: var(--primary-blue);
      border: none;
      color: white;
      font-weight: 600;
      font-size: 18px;
      padding: 16px 32px;
      border-radius: 60px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37,99,235,0.3);
      transition: background 0.15s;
    }
    .btn-primary:hover { background: var(--primary-dark); }
    .legal-links {
      margin-top: 32px;
      display: flex;
      gap: 24px;
    }
    .legal-links button {
      background: none;
      border: none;
      color: var(--text-secondary);
      text-decoration: underline;
      font-size: 14px;
      cursor: pointer;
    }

    /* modal overlay */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-card {
      background: var(--bg-card);
      color: var(--text-primary);
      width: 280px;
      padding: 24px;
      border-radius: 28px;
      box-shadow: 0 20px 30px rgba(0,0,0,0.4);
      text-align: center;
    }
    .modal-card h3 { margin-bottom: 16px; }
    .modal-card button {
      margin-top: 24px;
      padding: 10px 24px;
      background: var(--primary-blue);
      border: none;
      border-radius: 40px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    /* dashboard cards */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0;
    }
    .stat-card {
      background: var(--bg-card);
      padding: 16px 12px;
      border-radius: 24px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.02);
    }
    .badge-row {
      display: flex;
      gap: 8px;
      margin: 12px 0;
    }
    .badge {
      background: #EFF6FF;
      color: #1E40AF;
      padding: 8px 14px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 14px;
    }
    .progress-bar {
      background: var(--progress-bg);
      height: 10px;
      border-radius: 20px;
      margin: 10px 0;
      overflow: hidden;
    }
    .progress-fill {
      width: 67%;
      height: 100%;
      background: var(--primary-blue);
      border-radius: 20px;
    }

    /* lesson list */
    .lesson-item {
      background: var(--bg-card);
      padding: 16px;
      border-radius: 20px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: 0.1s;
    }
    .lesson-item:active { background: var(--nav-highlight); }

    /* chart placeholder */
    .chart-line {
      background: var(--bg-card);
      padding: 20px 12px;
      border-radius: 28px;
      margin: 12px 0;
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      height: 140px;
    }
    .bar {
      width: 24px;
      background: var(--primary-blue);
      border-radius: 12px 12px 4px 4px;
      transition: height 0.3s ease;
    }

    /* hidden screenshot canvas */
    #screenshot-canvas {
      display: none;
    }

    /* hide scroll */
    .app-screen::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div class="phone" id="phoneContainer">
    <!-- dynamic views injected via JS -->
    <div id="viewContainer" class="app-screen"></div>
    <!-- bottom navigation (always visible) -->
    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-item" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 Z"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-item" data-tab="learn">
        <svg viewBox="0 0 24 24"><path d="M2 3 L12 3 L22 8 L12 13 L2 8 L2 3 Z M2 8 L12 13 L12 20 M22 8 L22 14"/></svg>
        <span>Learn</span>
      </button>
      <button class="nav-item" data-tab="progress">
        <svg viewBox="0 0 24 24"><path d="M21 12 A9 9 0 0 1 6 18 L12 12 L12 5 A7 7 0 0 1 21 12 Z"/><circle cx="5" cy="18" r="2"/></svg>
        <span>Progress</span>
      </button>
      <button class="nav-item" data-tab="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z M12 6V4 M16 6l1-2 M8 6L7 4"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <!-- hidden canvas for screenshot -->
  <canvas id="screenshot-canvas" width="360" height="780"></canvas>

  <script>
    (function() {
      // ---------- THEME & STATE ----------
      let currentTheme = 'light';        // default
      let currentScreen = 'onboarding';  // home | learn | progress | settings | profile
      let modalContent = null;           // { title, body }

      // ---------- HELPER: render view ----------
      function render() {
        const container = document.getElementById('viewContainer');
        if (!container) return;

        if (modalContent) {
          // show modal overlay (only if modal active)
          container.innerHTML = getCurrentScreenHTML() + getModalHTML(modalContent);
        } else {
          container.innerHTML = getCurrentScreenHTML();
        }

        // update active nav
        document.querySelectorAll('.nav-item').forEach(btn => {
          const tab = btn.dataset.tab;
          if (!modalContent && (currentScreen === tab || (currentScreen === 'profile' && tab === 'settings'))) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });

        // attach listeners
        attachListeners();
      }

      function getCurrentScreenHTML() {
        switch(currentScreen) {
          case 'onboarding': return onboardingScreen();
          case 'home': return homeScreen();
          case 'learn': return learnScreen();
          case 'progress': return progressScreen();
          case 'settings': return settingsScreen();
          case 'profile': return profileScreen();
          default: return onboardingScreen();
        }
      }

      // ---------- ICON SET (inline, stroke style) ----------
      const icons = {
        profile: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21v-2a6 6 0 0 1 12 0v2"/><circle cx="10" cy="8" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.85"/></svg>',
        lesson: '<svg width="22" height="22" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M2 3 L12 3 L22 8 L12 13 L2 8 L2 3 Z M2 8 L12 13 L12 20"/></svg>',
        chart: '<svg width="22" height="22" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 16v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2M7 10l3-3 3 3 4-4"/><path d="M17 10V4h-6"/></svg>',
        flashcards: '<svg width="22" height="22" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h10M7 13h6"/></svg>',
        play: '<svg width="22" height="22" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor"/></svg>',
        check: '<svg width="22" height="22" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>'
      };

      // ---------- SCREENS ----------
      function onboardingScreen() {
        return `
          <div class="header">
            <h1>Python Play</h1>
            <button class="profile-btn" id="profileIconBtn">${icons.profile}</button>
          </div>
          <div class="onboarding-content">
            <div class="big-logo">${icons.flashcards}</div>
            <div class="app-name">Python Play</div>
            <div class="tagline">code in your pocket</div>
            <div class="desc">Master Python through interactive exercises, bite-sized lessons, and daily challenges. No prior experience needed.</div>
            <button class="btn-primary" id="getStartedBtn">Get Started</button>
            <div class="legal-links">
              <button id="privacyBtn">Privacy Policy</button>
              <button id="termsBtn">Terms of Service</button>
            </div>
          </div>
        `;
      }

      function homeScreen() {
        return `
          <div class="header">
            <h1>Home</h1>
            <button class="profile-btn" id="profileIconBtn">${icons.profile}</button>
          </div>
          <div style="font-weight:600; margin-bottom:8px;">🔥 7 day streak</div>
          <div class="stat-card">
            <div style="display:flex; justify-content:space-between;">
              <span>Daily goal</span> <span>3/5 lessons</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div>
          </div>
          <div class="grid-2">
            <div class="stat-card"><strong>XP today</strong><br>120 ⚡</div>
            <div class="stat-card"><strong>time</strong><br>24 min</div>
          </div>
          <div style="margin: 16px 0 8px; display:flex; gap:8px;">
            <span class="badge">🏆 beginner</span>
            <span class="badge">📦 4 in row</span>
          </div>
          <div style="margin-top:12px;"><strong>Continue learning</strong></div>
          <div class="lesson-item" id="openLearnLesson">
            ${icons.lesson} <span>Variables & Data types</span> <span style="margin-left:auto;">80%</span>
          </div>
          <div class="lesson-item" id="openLearnLesson2">
            ${icons.flashcards} <span>Lists & loops</span> <span style="margin-left:auto;">35%</span>
          </div>
        `;
      }

      function learnScreen() {
        return `
          <div class="header">
            <h1>Learn</h1>
            <button class="profile-btn" id="profileIconBtn">${icons.profile}</button>
          </div>
          <div style="margin-bottom:12px; display:flex; gap:12px;">
            <span class="badge">Python basics</span>
            <span class="badge">functions</span>
          </div>
          <div class="lesson-item">${icons.play} <span>1. print() & strings</span></div>
          <div class="lesson-item">${icons.play} <span>2. numbers & math</span></div>
          <div class="lesson-item">${icons.flashcards} <span>3. variables quiz</span></div>
          <div class="lesson-item">${icons.play} <span>4. if/else</span></div>
          <div style="margin-top:16px; background:var(--bg-card); border-radius:24px; padding:16px;">
            <strong>Today's challenge</strong> 
            <div style="display:flex; align-items:center; gap:12px; margin-top:8px;">
              ${icons.chart} <span>Fix the syntax error – 50xp</span>
            </div>
          </div>
        `;
      }

      function progressScreen() {
        return `
          <div class="header">
            <h1>Progress</h1>
            <button class="profile-btn" id="profileIconBtn">${icons.profile}</button>
          </div>
          <div style="display:flex; justify-content:space-between;"><span>Level 4</span> <span>430/600 XP</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:72%"></div></div>
          <div class="chart-line" id="chartContainer">
            <div class="bar" style="height:60px"></div><div class="bar" style="height:90px"></div><div class="bar" style="height:50px"></div><div class="bar" style="height:110px"></div><div class="bar" style="height:70px"></div>
          </div>
          <div class="grid-2">
            <div class="stat-card">🎯 89% correct</div>
            <div class="stat-card">⚡ 18 lessons</div>
          </div>
          <div style="margin-top:16px;"><strong>Achievements</strong></div>
          <div style="display:flex; gap:10px; margin:8px 0;">
            <span class="badge">🔥 7 days</span>
            <span class="badge">🐍 quick start</span>
          </div>
        `;
      }

      function settingsScreen() {
        return `
          <div class="header">
            <h1>Settings</h1>
            <button class="profile-btn" id="profileIconBtn">${icons.profile}</button>
          </div>
          <div style="background:var(--bg-card); border-radius:24px; padding:16px;">
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
              <span>Dark theme</span>
              <label><input type="checkbox" id="themeToggle" ${currentTheme==='dark'?'checked':''}></label>
            </div>
            <div style="margin-bottom:20px;">🔔 Notifications</div>
            <div>🔒 Privacy</div>
          </div>
          <div style="margin-top:24px; background:var(--bg-card); border-radius:24px; padding:16px;">
            <div>App version 2.6 · Python Play</div>
          </div>
        `;
      }

      function profileScreen() {
        return `
          <div class="header">
            <h1>Profile</h1>
            <button class="profile-btn" id="profileIconBtn" disabled style="opacity:0.5;">${icons.profile}</button>
          </div>
          <div style="text-align:center; margin:16px 0;">${icons.profile}</div>
          <div class="stat-card"><strong>Alex Chen</strong> · codervibes</div>
          <div style="display:grid; gap:12px; margin-top:24px;">
            <div class="lesson-item">📁 My certificates</div>
            <div class="lesson-item">⚙️ Account settings</div>
            <div class="lesson-item">⭐ Achievements (12)</div>
          </div>
          <button id="backFromProfileBtn" style="background:none; border:1px solid var(--border-light); padding:12px; border-radius:60px; width:100%; margin-top:20px;">‹ Back to settings</button>
        `;
      }

      function getModalHTML(modal) {
        return `
          <div class="modal" id="modalOverlay">
            <div class="modal-card">
              <h3>${modal.title}</h3>
              <p>${modal.body}</p>
              <button id="closeModalBtn">Close</button>
            </div>
          </div>
        `;
      }

      // ---------- ATTACH LISTENERS ----------
      function attachListeners() {
        // Profile icon opens profile screen
        const profileBtn = document.getElementById('profileIconBtn');
        if (profileBtn) profileBtn.addEventListener('click', (e) => { e.stopPropagation(); currentScreen = 'profile'; modalContent = null; render(); });

        // Get started (onboarding) -> home
        const getStarted = document.getElementById('getStartedBtn');
        if (getStarted) getStarted.addEventListener('click', () => { currentScreen = 'home'; render(); });

        // Privacy / terms modals
        const privacyBtn = document.getElementById('privacyBtn');
        if (privacyBtn) privacyBtn.addEventListener('click', () => { modalContent = { title: 'Privacy Policy', body: 'Your data is processed locally. No tracking.' }; render(); });
        const termsBtn = document.getElementById('termsBtn');
        if (termsBtn) termsBtn.addEventListener('click', () => { modalContent = { title: 'Terms of Service', body: 'Educational purpose only. By using you agree.' }; render(); });

        // close modal
        const closeModal = document.getElementById('closeModalBtn');
        if (closeModal) closeModal.addEventListener('click', () => { modalContent = null; render(); });
        const overlay = document.getElementById('modalOverlay');
        if (overlay) overlay.addEventListener('click', (e) => { if (e.target === overlay) { modalContent = null; render(); } });

        // bottom nav
        document.querySelectorAll('.nav-item').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const tab = btn.dataset.tab;
            if (tab === 'home') currentScreen = 'home';
            else if (tab === 'learn') currentScreen = 'learn';
            else if (tab === 'progress') currentScreen = 'progress';
            else if (tab === 'settings') currentScreen = 'settings';
            modalContent = null;
            render();
          });
        });

        // theme toggle
        const themeToggle = document.getElementById('themeToggle');
        if (themeToggle) {
          themeToggle.addEventListener('change', (e) => {
            currentTheme = e.target.checked ? 'dark' : 'light';
            document.body.classList.toggle('dark', currentTheme === 'dark');
            render();
          });
        }

        // back from profile
        const backBtn = document.getElementById('backFromProfileBtn');
        if (backBtn) backBtn.addEventListener('click', () => { currentScreen = 'settings'; render(); });

        // lesson items quick navigation
        const openLearn = document.getElementById('openLearnLesson');
        if (openLearn) openLearn.addEventListener('click', () => { currentScreen = 'learn'; modalContent = null; render(); });
        const openLearn2 = document.getElementById('openLearnLesson2');
        if (openLearn2) openLearn2.addEventListener('click', () => { currentScreen = 'learn'; render(); });

        // small chart animation (progress) — set random heights
        const bars = document.querySelectorAll('.bar');
        if (bars.length) {
          bars.forEach((bar, idx) => {
            bar.style.height = (40 + idx * 15) + 'px';
          });
        }
      }

      // ---------- INIT ----------
      function init() {
        // set light default
        document.body.classList.remove('dark');
        render();
      }

      // ---------- SHIFT+W screenshot (phone container) ----------
      document.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.key === 'W') {
          e.preventDefault();
          const phone = document.getElementById('phoneContainer');
          const canvas = document.getElementById('screenshot-canvas');
