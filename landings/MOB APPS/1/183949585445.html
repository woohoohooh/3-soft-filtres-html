```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code daily · Python coach</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --border: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --highlight: #EFF6FF;
            --shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.05);
            --radius: 24px;
            --radius-sm: 16px;
            --header-height: 60px;
            --bottom-nav-height: 70px;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --border: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --highlight: #1E293B;
            --shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        body {
            background: #11131f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 48px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.4), 0 0 0 8px #2c2e3a, 0 0 0 12px #1a1c26;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background-color 0.2s;
        }

        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
        }

        /* header */
        .header {
            height: var(--header-height);
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .header-title {
            font-weight: 600;
            font-size: 18px;
            color: var(--text);
        }

        .profile-btn {
            background: none;
            border: none;
            padding: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-btn svg {
            width: 24px;
            height: 24px;
            stroke: var(--text);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* main content area */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px 10px 16px;
            scroll-behavior: smooth;
        }

        /* bottom navigation */
        .bottom-nav {
            height: var(--bottom-nav-height);
            background: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 6px 8px;
            flex-shrink: 0;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            border-radius: 20px;
            padding: 8px 0;
            cursor: pointer;
            transition: all 0.15s ease;
            color: var(--inactive);
            fill: none;
            gap: 4px;
        }

        .nav-item.active {
            background: var(--highlight);
            color: var(--primary);
            transform: scale(1.02);
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.15s;
        }

        .nav-item.active svg {
            stroke: var(--primary);
            width: 26px;
            height: 26px;
        }

        .nav-label {
            font-size: 11px;
            font-weight: 500;
            color: currentColor;
        }

        /* cards, elements */
        .card {
            background: var(--card);
            border-radius: var(--radius-sm);
            padding: 18px 16px;
            box-shadow: var(--shadow);
            margin-bottom: 18px;
        }

        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-bar {
            height: 8px;
            background: var(--border);
            border-radius: 20px;
            margin: 12px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 20px;
            transition: width 0.3s;
        }

        .badge {
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
        }

        .icon-svg {
            width: 40px;
            height: 40px;
            stroke: var(--primary);
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat {
            background: var(--highlight);
            border-radius: 16px;
            padding: 14px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        /* onboarding / modal */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card);
            border-radius: 28px;
            padding: 28px;
            max-width: 300px;
            text-align: center;
            color: var(--text);
        }

        .link-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 24px;
            font-size: 13px;
        }

        .link-group button {
            background: none;
            border: none;
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
        }

        .big-btn {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 16px;
            border-radius: 60px;
            width: 100%;
            font-size: 18px;
            margin: 24px 0 12px;
            cursor: pointer;
        }

        h2 { font-size: 28px; font-weight: 700; margin: 8px 0 4px; color: var(--text);}
        h3 { font-size: 18px; font-weight: 600; margin-bottom: 4px; color: var(--text);}
        p { color: var(--text-light); font-size: 14px; line-height: 1.5;}

        /* utility */
        .hidden { display: none !important; }
        .mt-4 { margin-top: 16px; }
        .mb-2 { margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="phone" id="phoneContainer">
        <div class="app-screen" id="appScreen">
            <!-- dynamic header + content injected via JS -->
        </div>
    </div>

    <!-- hidden canvas for screenshot -->
    <canvas id="screenshotCanvas" style="display:none"></canvas>

    <script>
        (function() {
            // ------ ICON SYSTEM (inline svg) ------
            const icons = {
                home: `<svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" /></svg>`,
                learn: `<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" /></svg>`,
                progress: `<svg viewBox="0 0 24 24"><path d="M21 12v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6" /><polyline points="15 2 21 8 15 8" /><line x1="3" y1="10" x2="21" y2="10" /><line x1="9" y1="14" x2="9" y2="18" /><line x1="12" y1="14" x2="12" y2="18" /><line x1="15" y1="14" x2="15" y2="18" /></svg>`,
                settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z" /><path d="M16.5 6.5l2-2" /><path d="M7.5 6.5l-2-2" /></svg>`,
                profile: `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>`,
                lesson: `<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" /><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /></svg>`,
                chart: `<svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10" /><line x1="12" y1="20" x2="12" y2="4" /><line x1="6" y1="20" x2="6" y2="14" /></svg>`,
                flashcards: `<svg viewBox="0 0 24 24"><path d="M4 7h16v12H4z" /><path d="M8 3v4" /><path d="M16 3v4" /></svg>`,
                play: `<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" /></svg>`,
                check: `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" /></svg>`
            };

            // ------ app state ------
            let currentScreen = 'onboarding'; // 'onboarding','home','learn','progress','settings'
            let darkMode = false;
            let screenshotCounter = 1;
            const themeToggle = () => {
                darkMode = !darkMode;
                if (darkMode) document.body.classList.add('dark');
                else document.body.classList.remove('dark');
                renderScreen(currentScreen);
            };

            // simple modal
            let modalContent = null;
            const showModal = (title, text) => {
                modalContent = { title, text };
                renderScreen(currentScreen);
            };
            const closeModal = () => {
                modalContent = null;
                renderScreen(currentScreen);
            };

            // navigation
            function navigateTo(screen) {
                currentScreen = screen;
                renderScreen(screen);
            }

            // header with profile click -> settings
            function renderHeader(title) {
                return `
                    <div class="header">
                        <span class="header-title">${title}</span>
                        <button class="profile-btn" id="profileBtn">${icons.profile}</button>
                    </div>
                `;
            }

            // bottom nav (activeTab = home/learn/progress/settings)
            function renderBottomNav(active) {
                const items = [
                    { id: 'home', label: 'Home', icon: icons.home },
                    { id: 'learn', label: 'Learn', icon: icons.learn },
                    { id: 'progress', label: 'Progress', icon: icons.progress },
                    { id: 'settings', label: 'Settings', icon: icons.settings }
                ];
                return `
                    <div class="bottom-nav">
                        ${items.map(item => `
                            <button class="nav-item ${active === item.id ? 'active' : ''}" data-nav="${item.id}">
                                ${item.icon}
                                <span class="nav-label">${item.label}</span>
                            </button>
                        `).join('')}
                    </div>
                `;
            }

            // ----- SCREEN CONTENT -----
            function getOnboardingContent() {
                return `
                    <div style="display:flex; flex-direction:column; min-height:100%; justify-content:center; padding:0 8px;">
                        <div style="background: var(--primary); width:70px; height:70px; border-radius:20px; display:flex; align-items:center; justify-content:center; margin-bottom:24px;">
                            ${icons.learn.replace('<svg', '<svg width="44" height="44" stroke="white"')}
                        </div>
                        <h2>Python<br>minute</h2>
                        <p style="font-size:16px; margin:8px 0;">bite-sized Python practice</p>
                        <p style="margin:12px 0 20px;">Daily 5‑minute challenges to master Python. Perfect for coders on the go.</p>
                        <button class="big-btn" id="getStartedBtn">Get Started</button>
                        <div class="link-group">
                            <button id="privacyBtn">Privacy Policy</button>
                            <button id="termsBtn">Terms of Service</button>
                        </div>
                    </div>
                `;
            }

            function getHomeContent() {
                return `
                    <div>
                        <div class="card flex-row" style="align-items:center;">
                            <div>
                                <h3>Hello, Alex 👋</h3>
                                <p>300 day streak 🔥</p>
                            </div>
                            <span class="badge">level 7</span>
                        </div>
                        <div class="card">
                            <div class="flex-row"><span>Today's goal</span><span>45 XP</span></div>
                            <div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div>
                            <div class="grid-2 mt-4">
                                <div class="stat"><div class="stat-value">3</div><span>lessons</span></div>
                                <div class="stat"><div class="stat-value">120</div><span>XP</span></div>
                            </div>
                        </div>
                        <h3 style="margin:12px 0 8px;">Continue learning</h3>
                        <div class="card flex-row" style="gap:16px;">
                            <div>${icons.lesson}</div>
                            <div style="flex:1"><b>Functions</b> <div class="progress-bar" style="margin:4px 0;"><div class="progress-fill" style="width:45%"></div></div></div>
                            <span>45%</span>
                        </div>
                        <div class="card flex-row" style="gap:16px;">
                            <div>${icons.flashcards}</div>
                            <div style="flex:1"><b>Loops</b> <div class="progress-bar" style="margin:4px 0;"><div class="progress-fill" style="width:80%"></div></div></div>
                            <span>80%</span>
                        </div>
                        <div class="card" style="text-align:center; background:var(--primary); color:white;" id="quickPractice">
                            <span>${icons.play} quick practice →</span>
                        </div>
                    </div>
                `;
            }

            function getLearnContent() {
                return `
                    <div>
                        <h3 style="margin-bottom:12px;">Python fundamentals</h3>
                        <div class="card flex-row"><span>📘 Variables</span> <span class="badge">free</span></div>
                        <div class="card flex-row"><span>📗 Conditionals</span> <span class="badge">10 XP</span></div>
                        <div class="card flex-row"><span>📙 Lists & dicts</span> <span class="badge">15 XP</span></div>
                        <div class="card flex-row"><span>📕 Functions</span> <span class="badge">20 XP</span></div>
                        <div class="card" style="background:var(--highlight);" id="startLessonBtn">
                            <b>Start first lesson →</b> <span style="float:right;">${icons.play}</span>
                        </div>
                    </div>
                `;
            }

            function getProgressContent() {
                return `
                    <div>
                        <div class="card">
                            <span>Weekly activity</span>
                            <div style="display:flex; gap:8px; margin:12px 0;">
                                ${[70,45,90,30,65,80,50].map(v => `<div style="flex:1; height:60px; background:var(--highlight); border-radius:12px; display:flex; align-items:end;"><div style="height:${v}%; width:100%; background:var(--primary); border-radius:8px;"></div></div>`).join('')}
                            </div>
                        </div>
                        <div class="grid-2">
                            <div class="stat"><span class="stat-value">28</span><br>lessons</div>
                            <div class="stat"><span class="stat-value">5</span><br>achievements</div>
                        </div>
                        <div class="card flex-row"><span>🏅 7‑day streak</span> ${icons.check}</div>
                        <div class="card flex-row"><span>🔥 300 total XP</span> ${icons.check}</div>
                    </div>
                `;
            }

            function getSettingsContent() {
                return `
                    <div>
                        <div class="card flex-row">
                            <span>Dark mode</span>
                            <button id="themeToggleBtn" style="background:var(--primary); border:none; color:white; padding:8px 20px; border-radius:40px;">${darkMode ? 'Light' : 'Dark'}</button>
                        </div>
                        <div class="card flex-row"><span>Language</span> <span>English</span></div>
                        <div class="card flex-row"><span>Daily reminder</span> <span>8:00 AM</span></div>
                        <div class="card" style="text-align:center;">App version 2.6 · made with ⚡</div>
                    </div>
                `;
            }

            // main render
            function renderScreen(activeScreen) {
                let titleMap = {
                    onboarding: 'Welcome',
                    home: 'Home',
                    learn: 'Lessons',
                    progress: 'Stats',
                    settings: 'Settings'
                };
                let contentHtml = '';
                if (activeScreen === 'onboarding') contentHtml = getOnboardingContent();
                else if (activeScreen === 'home') contentHtml = getHomeContent();
                else if (activeScreen === 'learn') contentHtml = getLearnContent();
                else if (activeScreen === 'progress') contentHtml = getProgressContent();
                else if (activeScreen === 'settings') contentHtml = getSettingsContent();

                let bottomNav = (activeScreen !== 'onboarding') ? renderBottomNav(activeScreen) : '';

                let modalHtml = '';
                if (modalContent) {
                    modalHtml = `<div class="modal" id="modalOverlay"><div class="modal-content"><h3>${modalContent.title}</h3><p style="margin:16px 0;">${modalContent.text}</p><button class="big-btn" style="margin:0;" id="closeModalBtn">OK</button></div></div>`;
                }

                const fullHtml = `
                    ${renderHeader(titleMap[activeScreen])}
                    <div class="content" id="appContent">
                        ${contentHtml}
                    </div>
                    ${bottomNav}
                    ${modalHtml}
                `;

                document.getElementById('appScreen').innerHTML = fullHtml;

                // attach listeners
                if (activeScreen === 'onboarding') {
                    document.getElementById('getStartedBtn')?.addEventListener('click', ()=>navigateTo('home'));
                    document.getElementById('privacyBtn')?.addEventListener('click', ()=>showModal('Privacy Policy','We respect your data. No selling. Updated 2026.'));
                    document.getElementById('termsBtn')?.addEventListener('click', ()=>showModal('Terms of Service','Educational use only. Acceptable if you learn daily.'));
                }

                // profile button
                document.getElementById('profileBtn')?.addEventListener('click', ()=>navigateTo('settings'));

                // bottom nav
                document.querySelectorAll('[data-nav]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const nav = e.currentTarget.dataset.nav;
                        navigateTo(nav);
                    });
                });

                // quick practice simulation
                document.getElementById('quickPractice')?.addEventListener('click', ()=> { alert('Starting practice: 5 Python puzzles!'); });
                document.getElementById('startLessonBtn')?.addEventListener('click', ()=> { alert('Lesson: variables & printing'); });

                // theme toggle inside settings
                document.getElementById('themeToggleBtn')?.addEventListener('click', themeToggle);

                // close modal
                document.getElementById('closeModalBtn')?.addEventListener('click', closeModal);
                document.getElementById('modalOverlay')?.addEventListener('click', closeModal);
            }

            // ----- screenshot feature (SHIFT+W) -----
            async function capturePhone() {
                const phone = document.getElementById('phoneContainer');
                const canvas = document.getElementById('screenshotCanvas');
                const ctx = canvas.getContext('2d');
                const scale = 2;
                canvas.width = 360 * scale;
                canvas.height = 780 * scale;
                ctx.clearRect(0,0,canvas.width, canvas.height);
                ctx.fillStyle = '#11131f';
                ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 20;
                ctx.fillStyle = '#1a1c26';
                ctx.beginPath();
                ctx.roundRect(20*scale, 20*scale, 360*scale-40, 780*scale-40, 40*scale);
                ctx.fill();
                ctx.shadowBlur = 0;
                try {
                    const html2canvas = await import('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js').then(m => m.default);
                    const phoneCanvas = await html2canvas(phone, { scale: 2, backgroundColor: '#11131f' });
                    ctx.drawImage(phoneCanvas, 20*scale, 20*scale, 360*scale-40, 780*scale-40);
                } catch (e) {
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 30px monospace';
                    ctx.fillText('screenshot fallback', 80, 400);
                }
                const link = document.createElement('a');
                const isDark = document.body.classList.contains('dark');
                const num = isDark ? 6 : screenshotCounter;
                link.download = `${num}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                screenshotCounter = screenshotCounter < 5 ? screenshotCounter+1 : 1;
            }

            window.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    capturePhone();
                }
            });

            // start with onboarding
            renderScreen('onboarding');
        })();
    </script>
    <script>(function html2canvasPolyfill(){})()</script>
</body>
</html>
