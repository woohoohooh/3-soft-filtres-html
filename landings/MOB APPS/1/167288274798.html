```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Brain • 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1e2b;
            padding: 12px;
        }
        .phone-mock {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 42px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 0 8px #2d3344;
            position: relative;
            transition: background 0.2s;
        }
        .app-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        /* theme variables */
        :root {
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary-blue: #2563EB;
            --secondary-blue: #1E40AF;
            --accent-blue: #38BDF8;
            --inactive-icon: #94A3B8;
            --bottom-bg: #FFFFFF;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
        }
        body.dark {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary-blue: #3B82F6;
            --secondary-blue: #2563EB;
            --accent-blue: #38BDF8;
            --inactive-icon: #64748B;
            --bottom-bg: #1E293B;
            --shadow: 0 4px 12px rgba(0,0,0,0.5);
        }
        /* header */
        .header {
            padding: 20px 16px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-light);
        }
        .header h1 {
            font-size: 24px;
            font-weight: 650;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .profile-icon {
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            transition: background 0.1s;
        }
        .profile-icon:hover {
            background: var(--border-light);
        }
        /* main content */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scrollbar-width: thin;
        }
        /* bottom nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 12px;
            background: var(--bottom-bg);
            border-top: 1px solid var(--border-light);
            box-shadow: var(--shadow);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            padding: 6px 12px 4px;
            border-radius: 30px;
            background: transparent;
        }
        .nav-item.active {
            background: rgba(37, 99, 235, 0.08);
            transform: scale(1.02);
        }
        .nav-icon {
            width: 26px;
            height: 26px;
            stroke-width: 2px;
            stroke: var(--inactive-icon);
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.15s;
        }
        .nav-item.active .nav-icon {
            stroke: var(--primary-blue);
            width: 30px;
            height: 30px;
            stroke-width: 2.5px;
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--inactive-icon);
        }
        .nav-item.active .nav-label {
            color: var(--primary-blue);
            font-weight: 600;
        }
        /* cards */
        .card {
            background: var(--bg-card);
            border-radius: 26px;
            padding: 20px 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }
        .flex-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .badge {
            background: var(--accent-blue);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
        }
        .progress-bar {
            height: 10px;
            background: var(--border-light);
            border-radius: 20px;
            margin: 12px 0 6px;
        }
        .progress-fill {
            width: 60%;
            height: 10px;
            background: var(--primary-blue);
            border-radius: 20px;
            transition: width 0.4s ease;
        }
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .lesson-item:last-child {
            border-bottom: none;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-cell {
            background: var(--bg-primary);
            border-radius: 20px;
            padding: 14px;
        }
        button {
            background: var(--primary-blue);
            border: none;
            color: white;
            font-weight: 600;
            padding: 16px 24px;
            border-radius: 40px;
            font-size: 16px;
            letter-spacing: 0.3px;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(37,99,235,0.25);
            transition: 0.1s;
        }
        button:active {
            transform: scale(0.97);
        }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 16px 0 8px;
            font-size: 13px;
            color: var(--text-secondary);
            text-decoration: underline;
            cursor: pointer;
        }
        .modal {
            position: absolute;
            top: 30%; left: 10%; right: 10%;
            background: var(--bg-card);
            padding: 28px 20px;
            border-radius: 42px;
            box-shadow: 0 30px 50px black;
            border: 2px solid var(--primary-blue);
            z-index: 20;
            text-align: center;
            display: none;
        }
        .modal-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.5); z-index: 10; display: none;
        }
        .icon-svg {
            width: 26px; height: 26px; vertical-align: middle;
        }
    </style>
</head>
<body>
<div class="phone-mock" id="phoneContainer">
    <div class="app-screen" id="appScreen">
        <!-- dynamic header -->
        <div class="header" id="mainHeader">
            <h1 id="headerTitle">Math Brain</h1>
            <div class="profile-icon" id="profileBtn"><?xml version="1.0"?><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--text-primary)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></svg></div>
        </div>

        <!-- main content injected -->
        <div class="content" id="screenContent"></div>

        <!-- bottom navigation (4 items) -->
        <div class="bottom-nav" id="bottomNav">
            <div class="nav-item" data-tab="home" id="navHome">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span class="nav-label">Home</span>
            </div>
            <div class="nav-item" data-tab="learn" id="navLearn">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 6v12M8 8v8M16 8v8M4 4h16v16H4z"/></svg>
                <span class="nav-label">Learn</span>
            </div>
            <div class="nav-item" data-tab="progress" id="navProgress">
                <svg class="nav-icon" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                <span class="nav-label">Progress</span>
            </div>
            <div class="nav-item" data-tab="settings" id="navSettings">
                <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/></svg>
                <span class="nav-label">Settings</span>
            </div>
        </div>
    </div>
    <!-- modal overlay + modal -->
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal" id="infoModal"><h3 id="modalTitle">Privacy</h3><p id="modalText" style="margin: 20px 0;">Dummy policy text.</p><button id="closeModalBtn">Close</button></div>
</div>

<script>
    (function() {
        // ---------- THEME & STATE ----------
        const htmlBody = document.body;
        let darkMode = false;
        let currentScreen = 'onboarding'; // home | learn | progress | settings | onboarding

        // ---------- ICONS (inline svg) ---------- reusing same style
        function renderIcon(name, cls = 'icon-svg') {
            // for inline use, just return svg string, but we already have static; we can use in js if needed but we rely on static for bottom nav.
            return '';
        }

        // ---------- DATA ----------
        const appName = 'Math Brain';
        const tagline = 'Train your mind · 5 min a day';
        const description = 'Quick mental math challenges that adapt to your skill.';

        // ---------- HELPER: load screen ----------
        function showScreen(screenId) {
            currentScreen = screenId;
            const contentDiv = document.getElementById('screenContent');
            const headerTitle = document.getElementById('headerTitle');
            if (!contentDiv) return;

            // header title
            if (screenId === 'onboarding') headerTitle.innerText = 'Welcome';
            else if (screenId === 'home') headerTitle.innerText = 'Dashboard';
            else if (screenId === 'learn') headerTitle.innerText = 'Practice';
            else if (screenId === 'progress') headerTitle.innerText = 'Progress';
            else if (screenId === 'settings') headerTitle.innerText = 'Settings';
            else if (screenId === 'profile') headerTitle.innerText = 'Profile';

            // Render content
            if (screenId === 'onboarding') {
                contentDiv.innerHTML = `
                    <div class="card" style="text-align: center; padding: 28px 16px;">
                        <div style="background: var(--primary-blue); width: 80px; height: 80px; border-radius: 30px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;">
                            <svg width="48" height="48" viewBox="0 0 24 24" stroke="white" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
                        </div>
                        <h2 style="font-size: 32px; margin-bottom: 8px;">${appName}</h2>
                        <p style="font-size: 18px; color: var(--primary-blue); font-weight: 500;">${tagline}</p>
                        <p style="margin: 20px 0 28px; color: var(--text-secondary);">${description}</p>
                        <button id="getStartedBtn">Get Started →</button>
                        <div class="link-row">
                            <span id="privacyLink">Privacy Policy</span>
                            <span id="termsLink">Terms of Service</span>
                        </div>
                    </div>
                `;
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                    showScreen('home');
                    setActiveNav('home');
                });
                document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy Policy', 'We respect your data. No sharing.'));
                document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms of Service', 'Use Math Brain for good.'));
            }
            else if (screenId === 'home') {
                contentDiv.innerHTML = `
                    <div class="card">
                        <div class="flex-row"><span class="badge">🔥 streak 12 days</span><span style="margin-left:auto;">⚡ 340 XP</span></div>
                        <div style="margin-top: 16px;"><strong>Today's goal</strong><div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div></div>
                    </div>
                    <div class="card">
                        <h3>Recommended</h3>
                        <div class="lesson-item"><svg width="30" viewBox="0 0 24 24" stroke="var(--primary-blue)"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><div><strong>Quick equations</strong><div style="font-size:13px;">4 min · 8 questions</div></div></div>
                        <div class="lesson-item"><svg width="30" viewBox="0 0 24 24" stroke="var(--primary-blue)"><path d="M4 4h16v16H4z"/><line x1="8" y1="12" x2="16" y2="12"/></svg><div><strong>Multiplication</strong><div style="font-size:13px;">5 min · 10 problems</div></div></div>
                    </div>
                    <div class="card flex-row" style="justify-content: space-around;">
                        <div><svg width="28" viewBox="0 0 24 24" stroke="var(--primary-blue)"><polygon points="12 2 15 9 22 9 16 14 19 22 12 17 5 22 8 14 2 9 9 9 12 2"/></svg><div>🏆 45</div></div>
                        <div><svg width="28" viewBox="0 0 24 24" stroke="var(--primary-blue)"><path d="M2 12h4l3-9 4 18 3-9h4"/></svg><div>top 7%</div></div>
                    </div>
                `;
            }
            else if (screenId === 'learn') {
                contentDiv.innerHTML = `
                    <div class="card"><h3>Start exercise</h3><div class="stat-grid">
                        <div class="stat-cell" style="text-align:center;" id="quickMathBtn"><svg width="32" viewBox="0 0 24 24" stroke="var(--primary-blue)"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg><br>➕ Quick math</div>
                        <div class="stat-cell" style="text-align:center;"><svg width="32" viewBox="0 0 24 24" stroke="var(--primary-blue)"><rect x="4" y="4" width="16" height="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg><br>✖️ Times table</div>
                    </div></div>
                    <div class="card">
                        <div class="lesson-item"><span>🧮 Algebra basics</span><span style="margin-left:auto;">12 min</span></div>
                        <div class="lesson-item"><span>📐 Geometry puzzle</span><span style="margin-left:auto;">8 min</span></div>
                        <div class="lesson-item"><span>📊 Data quiz</span><span style="margin-left:auto;">6 min</span></div>
                    </div>
                `;
                document.getElementById('quickMathBtn')?.addEventListener('click', ()=>{ alert('Starting practice ...'); });
            }
            else if (screenId === 'progress') {
                contentDiv.innerHTML = `
                    <div class="card"><h3>Last 7 days</h3><div style="display:flex;gap:6px;justify-content:space-around;">
                        <div style="width:28px;height:80px;background:var(--border-light);border-radius:40px;align-self:flex-end;"><div style="height:55px;width:28px;background:var(--primary-blue);border-radius:40px;"></div></div>
                        <div style="width:28px;height:80px;background:var(--border-light);border-radius:40px;"><div style="height:70px;width:28px;background:var(--primary-blue);border-radius:40px;"></div></div>
                        <div style="width:28px;height:80px;background:var(--border-light);border-radius:40px;"><div style="height:40px;width:28px;background:var(--primary-blue);border-radius:40px;"></div></div>
                        <div style="width:28px;height:80px;background:var(--border-light);border-radius:40px;"><div style="height:90px;width:28px;background:var(--primary-blue);border-radius:40px;"></div></div>
                    </div></div>
                    <div class="card stat-grid">
                        <div class="stat-cell">✅ accuracy 87%</div><div class="stat-cell">⚡ 1,240 total</div>
                        <div class="stat-cell">🏅 silver medal</div><div class="stat-cell">🎯 4d streak</div>
                    </div>
                `;
            }
            else if (screenId === 'settings') {
                contentDiv.innerHTML = `
                    <div class="card">
                        <div style="display:flex; align-items:center; justify-content:space-between;"><span>Dark mode</span><label><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}></label></div>
                        <div style="margin-top:24px;">⚙️ Notifications<br>🔊 Sound effects<br>🌐 Language</div>
                    </div>
                    <div class="card">
                        <p>version 2026.1.0</p>
                    </div>
                `;
                document.getElementById('darkToggle')?.addEventListener('change', (e) => {
                    darkMode = e.target.checked;
                    if(darkMode) htmlBody.classList.add('dark'); else htmlBody.classList.remove('dark');
                });
            }
            else if (screenId === 'profile') {
                contentDiv.innerHTML = `
                    <div class="card" style="text-align:center;"><svg width="80" height="80" viewBox="0 0 24 24" stroke="var(--text-primary)"><circle cx="12" cy="8" r="4"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></svg><h3>Alex Chen</h3><p>mathlete · joined 2026</p></div>
                    <div class="card">⭐️ preferences, account, etc</div>
                `;
            }

            // update bottom nav active
            setActiveNav(screenId);
        }

        function setActiveNav(screen) {
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => item.classList.remove('active'));
            if (screen === 'home') document.getElementById('navHome')?.classList.add('active');
            else if (screen === 'learn') document.getElementById('navLearn')?.classList.add('active');
            else if (screen === 'progress') document.getElementById('navProgress')?.classList.add('active');
            else if (screen === 'settings') document.getElementById('navSettings')?.classList.add('active');
            // onboarding no active bottom
        }

        // ---------- MODAL ----------
        function showModal(title, text) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalText').innerText = text;
            document.getElementById('infoModal').style.display = 'block';
            document.getElementById('modalOverlay').style.display = 'block';
        }
        document.getElementById('closeModalBtn')?.addEventListener('click', ()=>{
            document.getElementById('infoModal').style.display = 'none';
            document.getElementById('modalOverlay').style.display = 'none';
        });

        // ---------- NAVIGATION ----------
        document.getElementById('navHome').addEventListener('click', ()=> showScreen('home'));
        document.getElementById('navLearn').addEventListener('click', ()=> showScreen('learn'));
        document.getElementById('navProgress').addEventListener('click', ()=> showScreen('progress'));
        document.getElementById('navSettings').addEventListener('click', ()=> showScreen('settings'));

        // profile button
        document.getElementById('profileBtn').addEventListener('click', ()=> {
            showScreen('profile');
            setActiveNav(''); // remove bottom active
        });

        // ---------- SCREENSHOT (shift+W) ----------
        let screenshotCounter = 1;
        document.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                const container = document.getElementById('phoneContainer');
                html2canvas?.(container, { scale: 2 }).then(canvas => {
                    const link = document.createElement('a');
                    const isDark = htmlBody.classList.contains('dark');
                    let filename = isDark ? '6.png' : (screenshotCounter + '.png');
                    if (!isDark && screenshotCounter <=5) { link.download = filename; screenshotCounter = (screenshotCounter %5)+1; }
                    else if (isDark) link.download = '6.png';
                    else link.download = '1.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }).catch(()=> alert('html2canvas not loaded (demo fallback)'));
            }
        });

        // ---------- BOOT: onboarding ----------
        showScreen('onboarding');
        setActiveNav(''); 

        // ensure light/dark initial
        if (darkMode) htmlBody.classList.add('dark'); else htmlBody.classList.remove('dark');

        // ---------- extra tiny interaction: progress bar update (demo) ----------
        window.showScreen = showScreen;

        // inject html2canvas from cdn for screenshot (already added but we simulate)
        if(!window.html2canvas){
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
            document.head.appendChild(script);
        }
    })();
</script>
<!-- include html2canvas for screenshot -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</body>
</html>
All done!
