```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LingoRise – vocabulary builder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --border-light: #E2E8F0;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --icon-inactive: #94A3B8;
      --icon-active: #2563EB;
      --nav-bg: #FFFFFF;
      --header-icon: #334155;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
      --progress-bg: #E2E8F0;
      --badge-gold: #FBBF24;
    }

    body.dark {
      --bg: #0F172A;
      --card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --border-light: #334155;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --icon-inactive: #64748B;
      --icon-active: #3B82F6;
      --nav-bg: #1E293B;
      --header-icon: #CBD5E1;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      --progress-bg: #334155;
      --badge-gold: #F59E0B;
    }

    body {
      background: #1a1e2b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background: var(--bg);
      border-radius: 48px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.3);
      position: relative;
      display: flex;
      flex-direction: column;
      transition: background 0.2s;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 20px 16px 12px 16px;
      scrollbar-width: thin;
      background: var(--bg);
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding: 0 4px;
    }
    .header h2 {
      font-size: 22px;
      font-weight: 650;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .profile-icon svg {
      width: 28px;
      height: 28px;
      stroke: var(--header-icon);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* bottom navigation */
    .bottom-nav {
      height: 72px;
      background: var(--nav-bg);
      border-top: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 8px;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 20px;
      transition: all 0.15s ease;
      color: var(--icon-inactive);
      fill: none;
      stroke: var(--icon-inactive);
    }
    .nav-item.active {
      background: rgba(37, 99, 235, 0.08);
      stroke: var(--icon-active);
      color: var(--icon-active);
    }
    .nav-item.active svg {
      stroke: var(--icon-active);
      transform: scale(1.1);
    }
    .nav-item svg {
      width: 24px;
      height: 24px;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: transform 0.1s;
    }
    .nav-label {
      font-size: 11px;
      font-weight: 500;
    }

    /* cards & elements */
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-light);
    }
    .row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      background: var(--accent);
      padding: 4px 10px;
      border-radius: 30px;
      color: #0F172A;
      font-weight: 600;
      font-size: 13px;
    }
    .progress-bar {
      height: 8px;
      background: var(--progress-bg);
      border-radius: 20px;
      margin: 10px 0;
    }
    .progress-fill {
      width: 60%;
      height: 8px;
      background: var(--primary);
      border-radius: 20px;
      transition: width 0.3s;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-item {
      background: var(--bg);
      padding: 12px;
      border-radius: 16px;
      text-align: center;
    }
    .stat-number {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
    }
    button.primary {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      padding: 14px 24px;
      border-radius: 40px;
      font-size: 16px;
      width: 100%;
      cursor: pointer;
      transition: 0.1s;
    }
    button.primary:active { opacity: 0.8; }
    .link-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-secondary);
      text-decoration: underline;
      cursor: pointer;
    }
    .lesson-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .modal-overlay {
      position: fixed; top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .modal {
      background: var(--card);
      padding: 24px;
      border-radius: 32px;
      width: 280px;
      text-align: center;
    }
    .hidden { display: none; }

    /* custom svg icons */
    .chart-line {
      stroke: var(--primary);
      stroke-width: 2;
      fill: none;
    }

    /* theme toggle */
    .theme-row {
      display: flex; align-items: center; justify-content: space-between;
    }
    .toggle-switch {
      width: 48px; height: 24px; background: var(--border-light); border-radius: 40px;
      position: relative; cursor: pointer;
    }
    .toggle-knob {
      width: 20px; height: 20px; background: white; border-radius: 50%;
      position: absolute; top:2px; left:2px; transition: 0.15s;
    }
    body.dark .toggle-knob { left: 26px; background: var(--primary); }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <!-- dynamic screen -->
  <div id="appScreen" class="screen"></div>
  <!-- bottom nav -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 Z"/></svg><span class="nav-label">Home</span></button>
    <button class="nav-item" data-tab="learn"><svg viewBox="0 0 24 24"><path d="M2 3 L8 3 L16 12 L8 21 L2 21"/><path d="M22 3 L16 3 L8 12 L16 21 L22 21"/></svg><span class="nav-label">Learn</span></button>
    <button class="nav-item" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M21 21 L3 21 L3 3"/><path d="M7 15 L7 10"/><path d="M12 15 L12 6"/><path d="M17 15 L17 13"/></svg><span class="nav-label">Progress</span></button>
    <button class="nav-item" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82L12 22z"/><path d="M4.6 9a1.65 1.65 0 0 0-.33 1.82c.26.61.86.99 1.51 1h12.44a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82L12 2z"/></svg><span class="nav-label">Settings</span></button>
  </nav>
</div>

<!-- modal container -->
<div id="modalContainer" class="hidden"></div>

<script>
  (function() {
    // ---------- icon system ----------
    const icons = {
      profile: '<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
      home: '<svg viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 Z"/></svg>',
      learn: '<svg viewBox="0 0 24 24"><path d="M2 3 L8 3 L16 12 L8 21 L2 21"/><path d="M22 3 L16 3 L8 12 L16 21 L22 21"/></svg>',
      progress: '<svg viewBox="0 0 24 24"><path d="M21 21 L3 21 L3 3"/><path d="M7 15 L7 10"/><path d="M12 15 L12 6"/><path d="M17 15 L17 13"/></svg>',
      settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82L12 22z"/><path d="M4.6 9a1.65 1.65 0 0 0-.33 1.82c.26.61.86.99 1.51 1h12.44a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82L12 2z"/></svg>',
      check: '<svg viewBox="0 0 24 24"><path d="M20 6 L9 17 L4 12"/></svg>',
      play: '<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
      lesson: '<svg viewBox="0 0 24 24"><path d="M2 3 L8 3 L16 12 L8 21 L2 21"/></svg>',
      chart: '<svg viewBox="0 0 24 24"><path d="M21 21 L3 21 L3 3"/><path d="M7 15 L7 10"/><path d="M12 15 L12 6"/><path d="M17 15 L17 13"/></svg>',
      flashcards: '<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M7 9 L17 9"/><path d="M7 13 L14 13"/></svg>'
    };

    // theme state
    let darkMode = false;

    // current screen
    let currentScreen = 'onboarding';

    // screenshot counter
    let shotCounter = 1;

    // ---------- render functions ----------
    function render() {
      const container = document.getElementById('appScreen');
      if (currentScreen === 'onboarding') container.innerHTML = renderOnboarding();
      else if (currentScreen === 'home') container.innerHTML = renderHome();
      else if (currentScreen === 'learn') container.innerHTML = renderLearn();
      else if (currentScreen === 'progress') container.innerHTML = renderProgress();
      else if (currentScreen === 'settings') container.innerHTML = renderSettings();

      // update bottom nav active state
      document.querySelectorAll('.nav-item').forEach(btn => {
        const tab = btn.dataset.tab;
        if (tab === currentScreen) btn.classList.add('active');
        else btn.classList.remove('active');
      });

      // attach header profile click
      const profileBtn = document.getElementById('profileBtn');
      if (profileBtn) profileBtn.addEventListener('click', (e) => { e.preventDefault(); currentScreen = 'settings'; render(); });
    }

    function renderOnboarding() {
      return `
        <div class="header"><h2>Welcome</h2><button class="profile-btn" id="profileBtn">${icons.profile}</button></div>
        <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
          <div style="font-size:50px; margin-bottom:8px;">📘</div>
          <h1 style="font-size:36px; font-weight:700; color:var(--primary);">LingoRise</h1>
          <p style="font-size:18px; font-weight:500; margin:8px 0 4px;">English vocabulary builder</p>
          <p style="color:var(--text-secondary); margin:16px 0;">Master 3000+ words with daily micro‑lessons and smart spaced repetition.</p>
          <button class="primary" id="getStartedBtn">Get Started</button>
          <div class="link-row" id="policyLinks">
            <span id="privacyLink">Privacy Policy</span>
            <span id="termsLink">Terms of Service</span>
          </div>
        </div>
      `;
    }

    function renderHome() {
      return `
        <div class="header"><h2>Home</h2><button class="profile-btn" id="profileBtn">${icons.profile}</button></div>
        <div class="card" style="background:var(--primary); color:white; border:none;">
          <div style="display:flex; align-items:center; gap:8px;">${icons.lesson}<span style="font-weight:600;">Daily goal</span></div>
          <div style="font-size:28px; font-weight:700; margin:8px 0;">12 / 20 words</div>
          <div class="progress-bar" style="background:rgba(255,255,255,0.3);"><div class="progress-fill" style="width:60%; background:white;"></div></div>
        </div>
        <h3 style="margin-bottom:8px;">Continue learning</h3>
        <div class="card lesson-item"><span>🆕 Word list 1</span><span style="color:var(--primary);">80%</span></div>
        <div class="card lesson-item"><span>🔁 Phrasal verbs</span><span style="color:var(--primary);">45%</span></div>
        <div class="card" style="display:flex; gap:12px; align-items:center;">
          <span>${icons.flashcards}</span>
          <span><strong>Daily flashcards</strong><br>12 new cards</span>
          <button class="primary" style="width:auto; padding:8px 20px; margin-left:auto;" id="quickPractice">Practice</button>
        </div>
      `;
    }

    function renderLearn() {
      return `
        <div class="header"><h2>Learn</h2><button class="profile-btn" id="profileBtn">${icons.profile}</button></div>
        <div class="grid-2">
          <div class="card" style="text-align:center;"><span>${icons.lesson}</span><br><strong>Beginner</strong><br>34 words</div>
          <div class="card" style="text-align:center;"><span>${icons.flashcards}</span><br><strong>Intermediate</strong><br>128 words</div>
        </div>
        <div class="card"><div style="display:flex; gap:12px;">${icons.play} <span>Listening drill</span></div></div>
        <div class="card"><div style="display:flex; gap:12px;">${icons.check} <span>Quiz: synonyms</span></div></div>
        <button class="primary" id="startLessonBtn" style="margin-top:8px;">Start new lesson</button>
      `;
    }

    function renderProgress() {
      return `
        <div class="header"><h2>Progress</h2><button class="profile-btn" id="profileBtn">${icons.profile}</button></div>
        <div class="grid-2">
          <div class="stat-item"><span class="stat-number">450</span><br>words learned</div>
          <div class="stat-item"><span class="stat-number">12</span><br>day streak</div>
        </div>
        <div class="card"><span>${icons.chart} Mastery level · 68%</span><div class="progress-bar"><div class="progress-fill" style="width:68%"></div></div></div>
        <div class="card"><span>🏆 Achievements</span><div style="display:flex; gap:8px; margin-top:8px;"><span class="badge">🔥 7 day</span><span class="badge">⭐ 100 words</span></div></div>
      `;
    }

    function renderSettings() {
      return `
        <div class="header"><h2>Settings</h2><button class="profile-btn" id="profileBtn">${icons.profile}</button></div>
        <div class="card theme-row"><span>🌓 Dark theme</span><div class="toggle-switch" id="themeToggle"><div class="toggle-knob"></div></div></div>
        <div class="card">Account · john@example.com</div>
        <div class="card">Notifications</div>
        <div class="card">Privacy & terms</div>
        <div style="font-size:12px; color:var(--text-secondary); margin-top:40px; text-align:center;">LingoRise v1.0</div>
      `;
    }

    // navigation
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const tab = e.currentTarget.dataset.tab;
        if (tab === 'home' || tab === 'learn' || tab === 'progress' || tab === 'settings') {
          currentScreen = tab;
          render();
        }
      });
    });

    // modal handling
    function showModal(text) {
      const modalDiv = document.getElementById('modalContainer');
      modalDiv.innerHTML = `<div class="modal-overlay"><div class="modal"><p>${text}</p><button class="primary" style="margin-top:16px;" id="closeModal">OK</button></div></div>`;
      modalDiv.classList.remove('hidden');
      document.getElementById('closeModal').addEventListener('click', ()=>{ modalDiv.classList.add('hidden'); });
    }

    // global click handler for dynamic buttons
    document.addEventListener('click', (e) => {
      if (e.target.id === 'getStartedBtn') { currentScreen = 'home'; render(); }
      if (e.target.id === 'privacyLink') showModal('Privacy policy: we respect your data. (demo)');
      if (e.target.id === 'termsLink') showModal('Terms of service: use responsibly.');
      if (e.target.id === 'quickPractice' || e.target.id === 'startLessonBtn') { currentScreen = 'learn'; render(); }
      if (e.target.closest('#themeToggle')) {
        darkMode = !darkMode;
        document.body.classList.toggle('dark', darkMode);
        render(); // keep current screen
      }
    });

    // screenshot: shift+W
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const phone = document.getElementById('phoneContainer');
        import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
          html2canvas(phone, { scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            const isDark = document.body.classList.contains('dark');
            const filename = isDark ? '6.png' : (shotCounter + '.png');
            if (!isDark && shotCounter < 6) { shotCounter = (shotCounter % 5) + 1; }
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
          });
        }).catch(() => alert('html2canvas failed, but shift+W works.'));
      }
    });

    // first render
    render();

    // expose for later
    window.showModal = showModal;
  })();
</script>

<!-- json output -->
<pre style="display:none;">
All done!
</pre>

      "6.png": "Dark Theme"
    };
    console.log('JSON output:', titles);
    // also append to body as hidden then visible for completion
    const jsonDiv = document.createElement('pre');
    jsonDiv.style = 'white-space: pre-wrap; background: #111; color:#0f0; padding:8px; margin:8px; font-size:10px; border-radius:8px;';
    jsonDiv.innerText = 'titles = ' + JSON.stringify(titles, null, 2);
    document.body.appendChild(jsonDiv);
  })();
</script>
