            --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);

        }

        .header {
            padding: 16px 16px 8px;

            justify-content: space-between;
            align-items: center;
            background: transparent;

            font-size: 22px;

            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-btn {
            background: none;
            border: none;

            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            transition: background 0.1s;
        }
        .profile-btn:hover { background: var(--border-light); }

        /* content area */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 8px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--border-light);
        }
        .content::-webkit-scrollbar { width: 4px; }
        .content::-webkit-scrollbar-track { background: var(--border-light); }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 12px 16px;

            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-light);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px 14px;
            border-radius: 30px;

            fill: var(--icon-inactive);
        }
        .nav-item.active {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
            fill: var(--primary);

        }

        }
        .nav-item span {
            font-size: 11px;

            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.1s;
        }

        /* cards / elements */

            background: var(--card);

            padding: 18px 16px;

            overflow: hidden;
            width: 100%;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 20px;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-card {
            background: var(--bg);
            border-radius: 18px;
            padding: 16px 12px;
            text-align: center;
        }
        .stat-number {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
        }
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--modal-overlay);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
            z-index: 1000;
        }
        .modal.hidden { display: none; }
        .modal-card {
            background: var(--card);
            padding: 26px 24px;
            border-radius: 36px;
            width: 280px;
            text-align: center;
            color: var(--text-primary);
            box-shadow: var(--shadow);
        }
        .modal-card button {
            margin-top: 20px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: 600;

        }

        .small-link {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 13px;

            margin: 0 8px;
        }

        /* toggle */
        .switch { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
        .toggle-btn {
            background: var(--border-light);
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            color: var(--text-primary);
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <div class="app-screen" id="appScreen">

<!-- hidden modal for privacy/terms -->
<div id="modalOverlay" class="modal hidden">
    <div class="modal-card" id="modalContent">
        <h3>Privacy Policy</h3>
        <p style="margin:12px 0;">We only store your learning progress locally. No data sharing.</p>
        <button id="closeModalBtn">Got it</button>

</div>

<script>
    (function(){
        // ---------- ICON SYSTEM (inline SVG) ----------
        const icons = {
            home: `<svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" /></svg>`,
            learn: `<svg viewBox="0 0 24 24"><path d="M4 4H20V8L12 13L4 8V4Z" /><path d="M4 12V20H20V12" /></svg>`,
            progress: `<svg viewBox="0 0 24 24"><path d="M21 12V20H3V12" /><path d="M7 10V4H17V10" /><circle cx="12" cy="16" r="2"/></svg>`,
            settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15L20.8 12L19.4 9H16.6L15.2 6L12 4.8L8.8 6L7.4 9H4.6L3.2 12L4.6 15H7.4L8.8 18L12 19.2L15.2 18L16.6 15H19.4Z" /></svg>`,
            profile: `<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" /></svg>`,
            lesson: `<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="12" y2="13"/></svg>`,
            chart: `<svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`,
            flashcards: `<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7H15M9 11H13"/></svg>`,
            play: `<svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg>`,
            check: `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`
        };

        // ---------- APP STATE ----------
        let currentScreen = 'onboarding'; // 'onboarding','home','learn','progress','settings'
        let darkMode = false;
        let screenshotCounter = 1; // for naming

        // screens data
        const screens = ['onboarding','home','learn','progress','settings'];
        let activeTab = 'home'; // bottom nav

        // DOM elements
        const appScreen = document.getElementById('appScreen');
        const modal = document.getElementById('modalOverlay');
        const modalContent = document.getElementById('modalContent');

        // helper: render icon
        function renderIcon(name) {
            return icons[name] || icons['home'];
        }

        // set theme
        function applyTheme() {
            if (darkMode) document.body.classList.add('dark');
            else document.body.classList.remove('dark');
        }

        // show modal (privacy or terms)
        function showModal(type) {
            if (type === 'privacy') {
                modalContent.innerHTML = `<h3>Privacy Policy</h3><p style="margin:12px 0;">We protect your data. No tracking, no selling.</p><button id="closeModalBtn">OK</button>`;
            } else {
                modalContent.innerHTML = `<h3>Terms of Service</h3><p style="margin:12px 0;">Free for personal use. Learn Python daily.</p><button id="closeModalBtn">Accept</button>`;
            }
            modal.classList.remove('hidden');
            document.getElementById('closeModalBtn').addEventListener('click', ()=> modal.classList.add('hidden'), {once:true});
        }

        // bottom navigation click handler
        function onNavClick(tab) {
            if (tab === 'home') { currentScreen = 'home'; activeTab = 'home'; }
            else if (tab === 'learn') { currentScreen = 'learn'; activeTab = 'learn'; }
            else if (tab === 'progress') { currentScreen = 'progress'; activeTab = 'progress'; }
            else if (tab === 'settings') { currentScreen = 'settings'; activeTab = 'settings'; }
            renderScreen();
        }

        // profile icon -> open settings
        function openProfile() {
            currentScreen = 'settings';
            activeTab = 'settings'; // highlight settings even though profile not in bottom nav
            renderScreen();
        }

        // ---------- SCREEN RENDERERS ----------
        function renderScreen() {
            const headerTitle = {
                onboarding: '🐍 Python',
                home: 'Dashboard',
                learn: 'Learn',
                progress: 'Progress',
                settings: 'Settings'
            }[currentScreen] || 'App';

            let contentHtml = '';

            // header
            let headerHtml = `
                <div class="header">
                    <h1>${headerTitle}</h1>
                    <button class="profile-btn" id="profileIconBtn">${icons.profile}</button>
                </div>
            `;

            // CONTENT per screen
            if (currentScreen === 'onboarding') {
                contentHtml = `
                    <div class="content" style="display: flex; flex-direction: column; justify-content: center;">
                        <div style="text-align: center; margin-bottom: 30px;">
                            <div style="font-size: 64px; margin-bottom: 8px;">🐍</div>
                            <h1 style="font-size: 40px; font-weight:700; color: var(--primary);">Python</h1>
                            <p style="font-size: 18px; color: var(--text-secondary);">mini labs</p>
                            <p style="margin: 20px 0; color: var(--text-secondary);">Bite-sized coding puzzles & flashcards. Master Python 3.x, one lesson a day.</p>
                            <button id="getStartedBtn" style="background: var(--primary); color: white; border: none; padding: 16px 40px; border-radius: 60px; font-weight: 600; font-size: 18px; width: 100%;">Get Started</button>
                            <div style="margin-top: 20px;">
                                <button class="small-link" id="privacyLink">Privacy Policy</button> • 
                                <button class="small-link" id="termsLink">Terms of Service</button>
                            </div>
                        </div>
                    </div>
                `;
            }
            else if (currentScreen === 'home') {
                contentHtml = `
                    <div class="content">
                        <div class="card">
                            <div class="row"><span class="badge">🔥 7 day streak</span><span>⭐ 124 XP</span></div>
                            <h3>Continue where you left</h3>
                            <div class="lesson-item"><span>${icons.play}</span> <span style="flex:1;">Functions & scope</span> <span>85%</span></div>
                            <div class="progress-bar"><div class="progress-fill" style="width:85%"></div></div>
                            <button id="quickPractice" style="margin-top:16px; background:var(--accent); border:none; padding:12px; width:100%; border-radius:40px; font-weight:600;">▶️ Quick practice</button>
                        </div>
                        <div class="card">
                            <h4>Today's flashcards</h4>
                            ${icons.flashcards} <span>list comprehension</span> • <span>lambda</span> • <span>decorator</span>
                        </div>
                        <div class="card">
                            <div class="stat-grid">
                                <div class="stat-card"><span class="stat-number">12</span><br>lessons</div>
                                <div class="stat-card"><span class="stat-number">4</span><br>badges</div>
                            </div>
                        </div>
                    </div>
                `;
            }
            else if (currentScreen === 'learn') {
                contentHtml = `
                    <div class="content">
                        <div class="card">
                            <h3>Python basics</h3>
                            <div class="lesson-item">${icons.lesson} Variables & data types <span class="badge">new</span></div>
                            <div class="lesson-item">${icons.lesson} Conditionals <span>${icons.check}</span></div>
                            <div class="lesson-item">${icons.flashcards} Loops (practice) <span>${icons.play}</span></div>
                        </div>
                        <div class="card">
                            <h3>Intermediate</h3>
                            <div class="lesson-item">${icons.lesson} Functions <span>50%</span></div>
                            <div class="progress-bar"><div class="progress-fill" style="width:50%"></div></div>
                        </div>
                        <button style="background:var(--primary); color:white; padding:16px; width:100%; border:none; border-radius:60px;">Start new lesson</button>
                    </div>
                `;
            }
            else if (currentScreen === 'progress') {
                contentHtml = `
                    <div class="content">
                        <div class="card">
                            <h3>Weekly activity</h3>
                            <div style="height: 80px; display: flex; gap:4px; align-items: flex-end; margin: 12px 0;">
                                <div style="background:var(--primary); width:18px; height:30px; border-radius:8px;"></div><div style="background:var(--primary); width:18px; height:48px;"></div><div style="background:var(--primary); width:18px; height:22px;"></div><div style="background:var(--primary); width:18px; height:60px;"></div><div style="background:var(--primary); width:18px; height:40px;"></div>
                            </div>
                            <div class="stat-grid">
                                <div class="stat-card">${icons.chart} 8h</div>
                                <div class="stat-card">🎯 89%</div>
                            </div>
                        </div>
                        <div class="card">Badges: 🐍 rookie • ⚡ 5 day streak • 🧠 logic</div>
                    </div>
                `;
            }
            else if (currentScreen === 'settings') {
                contentHtml = `
                    <div class="content">
                        <div class="card">
                            <div style="display:flex; gap:12px; align-items:center;">${icons.profile} <span>codier_123</span></div>
                        </div>
                        <div class="card switch">
                            <span>🌙 Dark mode</span>
                            <button id="themeToggleBtn" class="toggle-btn">${darkMode ? 'ON' : 'OFF'}</button>
                        </div>
                        <div class="card">
                            <p>Sound effects • Notifications</p>
                            <p style="margin-top:8px;">App version 2026.1</p>
                        </div>
                        <button class="small-link" id="privacySetting">Privacy</button> 
                        <button class="small-link" id="termsSetting">Terms</button>
                    </div>
                `;
            }

            // bottom navigation (only if not onboarding)
            let bottomHtml = '';
            if (currentScreen !== 'onboarding') {
                bottomHtml = `
                    <div class="bottom-nav">
                        <button class="nav-item ${activeTab==='home'?'active':''}" data-nav="home">
                            ${icons.home} <span>Home</span>
                        </button>
                        <button class="nav-item ${activeTab==='learn'?'active':''}" data-nav="learn">
                            ${icons.learn} <span>Learn</span>
                        </button>
                        <button class="nav-item ${activeTab==='progress'?'active':''}" data-nav="progress">
                            ${icons.progress} <span>Progress</span>
                        </button>
                        <button class="nav-item ${activeTab==='settings'?'active':''}" data-nav="settings">
                            ${icons.settings} <span>Settings</span>
                        </button>
                    </div>
                `;
            }

            appScreen.innerHTML = headerHtml + contentHtml + bottomHtml;

            // attach listeners
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const nav = btn.dataset.nav;
                    if (nav) onNavClick(nav);
                });
            });

            if (currentScreen === 'onboarding') {
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                    currentScreen = 'home';
                    activeTab = 'home';
                    renderScreen();
                });
                document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('privacy'));
                document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('terms'));
            }

            // profile icon
            document.getElementById('profileIconBtn')?.addEventListener('click', openProfile);

            // theme toggle inside settings
            if (currentScreen === 'settings') {
                document.getElementById('themeToggleBtn')?.addEventListener('click', ()=>{
                    darkMode = !darkMode;
                    applyTheme();
                    renderScreen(); // re-render to reflect toggle text
                });
                document.getElementById('privacySetting')?.addEventListener('click', ()=> showModal('privacy'));
                document.getElementById('termsSetting')?.addEventListener('click', ()=> showModal('terms'));
            }

            // quick practice (any screen)
            document.getElementById('quickPractice')?.addEventListener('click', ()=>{
                alert('Starting quick python quiz!');
            });

            // close modal external
            document.getElementById('closeModalBtn')?.addEventListener('click', ()=> modal.classList.add('hidden'));
        }

        // screenshot feature shift+W
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                // in real prototype we simulate naming. we output json later.
                // just increment logic
                let name = screenshotCounter + '.png';
                if (darkMode) name = '6.png';
                else name = screenshotCounter + '.png';
                alert(`📸 Screenshot captured: ${name} (simulated)`);
                if (!darkMode) screenshotCounter = (screenshotCounter % 5) + 1;
            }
        });

        // initial render
        renderScreen();
        applyTheme();

        // expose for later json output
        window.playStoreTitles = {
            "1.png": "Start Learning",
            "2.png": "Daily Lessons",
            "3.png": "Practice Skills",
            "4.png": "Track Progress",
            "5.png": "Smart Settings",
            "6.png": "Dark Theme"
        };

    })();
</script>

<!-- hidden modal container already present -->
</body>
