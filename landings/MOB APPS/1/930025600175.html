```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSpark · JavaScript Practice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.1);
            transition: background 0.2s;
        }

        /* theme variables */
        .light {
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --icon-inactive: #94A3B8;
            --primary: #2563EB;
            --secondary: #1E40AF;
            --accent: #38BDF8;
            --progress-bg: #E2E8F0;
        }

        .dark {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --icon-inactive: #64748B;
            --primary: #3B82F6;
            --secondary: #2563EB;
            --accent: #38BDF8;
            --progress-bg: #334155;
        }

        /* main flex layout */
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 8px 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--bg-card);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .app-content::-webkit-scrollbar {
            width: 4px;
        }
        .app-content::-webkit-scrollbar-track {
            background: var(--bg-card);
        }
        .app-content::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 20px;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 0;
        }
        .header h2 {
            font-size: 24px;
            font-weight: 650;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-btn {
            background: none;
            border: none;
            padding: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-btn svg {
            width: 28px;
            height: 28px;
            stroke: var(--text-primary);
            stroke-width: 2;
            transition: 0.1s;
        }
        .profile-btn:hover svg {
            stroke: var(--primary);
        }

        /* bottom nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--bg-card);
            padding: 8px 12px 12px;
            border-top: 1px solid var(--border-light);
            border-radius: 0 0 48px 48px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            cursor: pointer;
            gap: 4px;
            transition: transform 0.15s ease;
            padding: 6px 12px 4px;
            border-radius: 40px;
        }
        .nav-item.active {
            background: rgba(37, 99, 235, 0.1);
            transform: scale(1.05);
        }
        .nav-item.active svg {
            stroke: var(--primary);
            stroke-width: 2.2;
            transform: scale(1.1);
        }
        .nav-item.active span {
            color: var(--primary);
            font-weight: 500;
        }
        .nav-item svg {
            width: 26px;
            height: 26px;
            stroke: var(--icon-inactive);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.1s;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            color: var(--icon-inactive);
        }

        /* cards */
        .card {
            background: var(--bg-card);
            border-radius: 28px;
            padding: 18px 20px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.02);
            border: 1px solid var(--border-light);
        }

        .row-space {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
        }

        .progress-bar {
            height: 12px;
            background: var(--progress-bg);
            border-radius: 40px;
            margin: 16px 0 8px;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 40px;
            transition: width 0.4s ease;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .stat-item {
            background: var(--bg-primary);
            border-radius: 20px;
            padding: 14px;
            text-align: center;
        }

        /* onboarding specific */
        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 40px 0 24px;
        }
        .big-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(145deg, var(--primary), var(--accent));
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .big-icon svg {
            width: 48px;
            height: 48px;
            stroke: white;
            stroke-width: 2;
        }
        .get-started {
            background: var(--primary);
            border: none;
            color: white;
            font-size: 18px;
            font-weight: 600;
            padding: 16px;
            border-radius: 60px;
            width: 100%;
            margin: 20px 0 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .get-started:hover {
            background: var(--secondary);
        }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
        }
        .link-row button {
            background: none;
            border: none;
            color: var(--text-secondary);
            text-decoration: underline;
            font-size: 14px;
            cursor: pointer;
        }

        /* modal */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal.hidden {
            display: none;
        }
        .modal-card {
            background: var(--bg-card);
            width: 280px;
            border-radius: 40px;
            padding: 28px 20px;
            color: var(--text-primary);
            text-align: center;
            box-shadow: 0 20px 30px black;
        }
        .modal-card button {
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            margin-top: 20px;
            font-weight: 600;
            cursor: pointer;
        }

        /* lesson items */
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .lesson-icon {
            background: var(--bg-primary);
            border-radius: 18px;
            padding: 10px;
        }
        .lesson-icon svg {
            width: 28px;
            height: 28px;
            stroke: var(--primary);
        }

        .theme-toggle {
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            border-radius: 40px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        /* screenshot utility */
        .hidden-trigger {
            opacity: 0;
            position: fixed;
            pointer-events: none;
        }
    </style>
</head>
<body class="light">
<div class="phone light" id="phoneContainer">
    <!-- header (dynamic via js) -->
    <div class="app-content" id="screenContainer">
        <!-- screens injected by js -->
    </div>
    <!-- bottom nav (static) -->
    <div class="bottom-nav" id="bottomNav">
        <button class="nav-item" data-tab="home"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12l-2 2 9 9 9-9-2-2-7 5-7-5z"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg><span>Home</span></button>
        <button class="nav-item" data-tab="learn"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14"/><circle cx="12" cy="12" r="9"/></svg><span>Learn</span></button>
        <button class="nav-item" data-tab="progress"><svg viewBox="0 0 24 24" fill="none"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><rect x="3" y="12" width="18" height="9" rx="2"/><path d="M7 17v2M17 17v2"/></svg><span>Progress</span></button>
        <button class="nav-item" data-tab="settings"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 18a10 10 0 0 0 6.36-2.22z"/><path d="M16.5 7.5 19 5M5 5l2.5 2.5"/></svg><span>Settings</span></button>
    </div>
</div>

<!-- hidden modal -->
<div id="modal" class="modal hidden">
    <div class="modal-card" id="modalContent">
        <h3 id="modalTitle">Privacy Policy</h3>
        <p id="modalBody">We respect your data. This is a demo prototype.</p>
        <button id="modalClose">OK</button>
    </div>
</div>

<script>
    (function(){
        // ---------- THEME & CONST ----------
        const phone = document.getElementById('phoneContainer');
        const screenDiv = document.getElementById('screenContainer');
        const navButtons = document.querySelectorAll('.nav-item');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const modalClose = document.getElementById('modalClose');

        let currentScreen = 'onboarding'; // home|learn|progress|settings|onboarding
        let darkMode = false;
        let screenshotCounter = 1;
        let isOnboardingDone = false;

        // ---------- SVG ICONS ----------
        const icons = {
            home: '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12l-2 2 9 9 9-9-2-2-7 5-7-5z"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>',
            learn: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14"/><circle cx="12" cy="12" r="9"/></svg>',
            progress: '<svg viewBox="0 0 24 24" fill="none"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><rect x="3" y="12" width="18" height="9" rx="2"/><path d="M7 17v2M17 17v2"/></svg>',
            settings: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 18a10 10 0 0 0 6.36-2.22z"/><path d="M16.5 7.5 19 5M5 5l2.5 2.5"/></svg>',
            profile: '<svg viewBox="0 0 24 24" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
            lesson: '<svg viewBox="0 0 24 24" fill="none"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
            chart: '<svg viewBox="0 0 24 24" fill="none"><path d="M21 16v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2"/><path d="M7 10v6M12 7v9M17 4v12"/></svg>',
            flashcards: '<svg viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>',
            play: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4V8z"/></svg>',
            check: '<svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5"/></svg>'
        };

        // ---------- SCREEN RENDER ----------
        function renderScreen(screen) {
            if (!isOnboardingDone && screen !== 'onboarding') {
                screen = 'onboarding';
            }
            if (screen === 'onboarding') {
                screenDiv.innerHTML = renderOnboarding();
                updateNavActive(null);
            } else {
                isOnboardingDone = true;
                screenDiv.innerHTML = renderGenericScreen(screen);
                updateNavActive(screen);
            }

            // update header title
            const headerTitle = document.getElementById('dynamicHeaderTitle');
            if(headerTitle) {
                if(screen === 'home') headerTitle.innerText = 'Dashboard';
                else if(screen === 'learn') headerTitle.innerText = 'Practice JS';
                else if(screen === 'progress') headerTitle.innerText = 'Your Stats';
                else if(screen === 'settings') headerTitle.innerText = 'Settings';
                else if(screen === 'onboarding') headerTitle.innerText = 'Welcome';
            }

            // attach listeners for onboarding links
            if(screen === 'onboarding') {
                document.getElementById('privacyLink')?.addEventListener('click', ()=>showModal('Privacy Policy', 'We value your privacy. No data collected.'));
                document.getElementById('termsLink')?.addEventListener('click', ()=>showModal('Terms of Service', 'Educational prototype. All rights reserved.'));
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                    isOnboardingDone = true;
                    currentScreen = 'home';
                    renderScreen('home');
                });
            }
            if(screen === 'settings') {
                document.querySelector('.theme-toggle')?.addEventListener('click', toggleTheme);
            }
        }

        function renderOnboarding() {
            return `
                <div class="header">
                    <h2 id="dynamicHeaderTitle">Welcome</h2>
                    <button class="profile-btn" id="profileBtnOnboard"><svg viewBox="0 0 24 24" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>
                </div>
                <div class="logo-area">
                    <div class="big-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14"/><circle cx="12" cy="12" r="9"/></svg></div>
                    <h1 style="color: var(--primary); font-size: 32px;">CodeSpark</h1>
                    <p style="font-size: 18px; color: var(--text-secondary); margin: 8px 0;">JavaScript daily</p>
                    <p style="color: var(--text-secondary); text-align: center; max-width: 260px;">Bite-sized coding challenges. Master JS one exercise at a time.</p>
                </div>
                <button class="get-started" id="getStartedBtn">Get Started</button>
                <div class="link-row">
                    <button id="privacyLink">Privacy Policy</button>
                    <button id="termsLink">Terms of Service</button>
                </div>
                <div style="margin-top: 20px; text-align: center; font-size: 13px; color: var(--text-secondary);">v2.6.0 · 2026</div>
            `;
        }

        function renderGenericScreen(active) {
            let content = '';
            if (active === 'home') {
                content = `
                    <div class="card">
                        <div class="row-space"><span style="font-weight: 600;">Daily streak</span><span class="badge">15 days 🔥</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div>
                        <div style="display: flex; gap:10px; margin:12px 0;"><span>⬜⬜⬜⬜⬜⬜⬜⬜</span><span>75%</span></div>
                        <button class="get-started" style="padding:12px;" id="quickPractice">Quick practice →</button>
                    </div>
                    <div class="grid-2">
                        <div class="card" style="padding: 16px;"><span style="display:block; font-size:22px; font-weight:bold;">12</span><span>lessons done</span></div>
                        <div class="card" style="padding: 16px;"><span style="display:block; font-size:22px; font-weight:bold;">580</span><span>XP today</span></div>
                    </div>
                    <div class="card">
                        <div class="row-space"><span style="font-weight:600;">Continue</span><span>▶ 2/5</span></div>
                        <div class="lesson-item"><span class="lesson-icon">${icons.flashcards}</span><div><div>Variables & Data</div><span style="font-size:13px; color:gray;">3 min left</span></div></div>
                        <div class="lesson-item"><span class="lesson-icon">${icons.play}</span><div><div>Functions II</div><span style="font-size:13px; color:gray;">New</span></div></div>
                    </div>
                `;
            } else if (active === 'learn') {
                content = `
                    <div class="card" style="text-align:center;">
                        <span style="font-size:20px; font-weight:600;">JS Fundamentals</span>
                        <div style="display:flex; gap:8px; justify-content:center; margin:12px 0;">${icons.lesson} ${icons.flashcards} ${icons.play}</div>
                    </div>
                    <div class="card"> <div class="lesson-item"><span class="lesson-icon">${icons.play}</span><div><span>★ Conditionals</span></div><span style="margin-left:auto;">▶</span></div>
                    <div class="lesson-item"><span class="lesson-icon">${icons.lesson}</span><div><span>★ Loops</span></div><span style="margin-left:auto;">▶</span></div>
                    <div class="lesson-item"><span class="lesson-icon">${icons.flashcards}</span><div><span>★ Arrays</span></div><span style="margin-left:auto;">▶</span></div></div>
                    <div class="card"><span style="font-weight:600;">Today's goal</span><div class="progress-bar"><div class="progress-fill" style="width:40%"></div></div><span>2/5 exercises</span></div>
                `;
            } else if (active === 'progress') {
                content = `
                    <div class="card"><span style="font-weight:600;">Weekly activity</span>${icons.chart}
                        <div style="height:80px; display:flex; align-items:end; gap:4px; margin:12px 0;"><div style="background:var(--primary); width:20px; height:32px; border-radius:8px;"></div><div style="background:var(--primary); width:20px; height:58px;"></div><div style="background:var(--primary); width:20px; height:40px;"></div><div style="background:var(--primary); width:20px; height:70px;"></div><div style="background:var(--primary); width:20px; height:25px;"></div></div>
                    </div>
                    <div class="grid-2"><div class="stat-item">⭐ 1340 XP</div><div class="stat-item">🏆 8 badges</div></div>
                    <div class="card"><span>Accuracy 87%</span><div class="progress-bar"><div class="progress-fill" style="width:87%"></div></div></div>
                `;
            } else if (active === 'settings') {
                content = `
                    <div class="card">
                        <div style="display: flex; align-items: center; justify-content: space-between;"><span>Dark mode</span><button class="theme-toggle" id="themeToggleBtn">🌙 / ☀️</button></div>
                        <div style="margin-top:24px;">🔔 Notifications on</div>
                        <div style="margin-top:16px;">🔒 Privacy · Terms</div>
                        <div style="margin-top:24px; color: gray;">Version 2026.3</div>
                    </div>
                `;
            }
            return `
                <div class="header">
                    <h2 id="dynamicHeaderTitle">${active}</h2>
                    <button class="profile-btn" id="profileBtnGeneric"><svg viewBox="0 0 24 24" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>
                </div>
                ${content}
            `;
        }

        function updateNavActive(tab) {
            navButtons.forEach(btn => {
                const tabAttr = btn.getAttribute('data-tab');
                if (tabAttr === tab) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function showModal(title, text) {
            modalTitle.innerText = title;
            modalBody.innerText = text;
            modal.classList.remove('hidden');
        }

        // ---------- EVENT LISTENERS ----------
        navButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const tab = btn.getAttribute('data-tab');
                if (!isOnboardingDone && tab !== 'onboarding') {
                    renderScreen('onboarding');
                } else {
                    currentScreen = tab;
                    renderScreen(tab);
                }
            });
        });

        modalClose.addEventListener('click', ()=>{
            modal.classList.add('hidden');
        });

        // profile icon -> settings
        document.addEventListener('click', (e) => {
            if (e.target.closest('.profile-btn')) {
                if (!isOnboardingDone) return;
                currentScreen = 'settings';
                renderScreen('settings');
            }
        });

        // quick practice demo
        document.addEventListener('click', (e) => {
            if (e.target.id === 'quickPractice') {
                alert('Starting practice: "Variables quiz"');
            }
        });

        function toggleTheme() {
            const phone = document.getElementById('phoneContainer');
            const body = document.body;
            if (phone.classList.contains('light')) {
                phone.classList.remove('light');
                phone.classList.add('dark');
                body.classList.remove('light');
                body.classList.add('dark');
                darkMode = true;
            } else {
                phone.classList.remove('dark');
                phone.classList.add('light');
                body.classList.remove('dark');
                body.classList.add('light');
                darkMode = false;
            }
        }

        // screenshot shortcut SHIFT+W
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
                    html2canvas(phone, { scale: 2, backgroundColor: null }).then(canvas => {
                        const link = document.createElement('a');
                        const num = darkMode ? 6 : screenshotCounter;
                        link.download = num + '.png';
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        if (!darkMode && screenshotCounter < 5) screenshotCounter++;
                    });
                }).catch(() => alert('html2canvas failed, but this is prototype.'));
            }
        });

        // initial render
        renderScreen('onboarding');
    })();
</script>
