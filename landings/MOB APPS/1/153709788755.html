```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeSpace – Python Playground</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: #1e293b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    /* phone container */
    #phone {
      width: 360px;
      height: 780px;
      background: var(--bg-primary);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #334155;
      position: relative;
      transition: background 0.2s;
    }

    /* inner app screen */
    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: background 0.2s, color 0.2s;
    }

    /* theme variables */
    :root {
      --bg-primary: #F8FAFC;
      --bg-card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --border-light: #E2E8F0;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --inactive: #94A3B8;
      --header-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    .dark-mode {
      --bg-primary: #0F172A;
      --bg-card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --border-light: #334155;
      --primary: #3B82F6;
      --accent: #38BDF8;
      --inactive: #64748B;
      --header-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 8px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-light);
      box-shadow: var(--header-shadow);
    }
    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }
    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
    }
    .profile-btn svg {
      width: 28px;
      height: 28px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* main content */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px 8px;
      scrollbar-width: thin;
      background: var(--bg-primary);
    }

    /* bottom nav */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: var(--bg-card);
      border-top: 1px solid var(--border-light);
      padding: 8px 12px;
      height: 72px;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 20px;
      transition: all 0.15s ease;
      color: var(--inactive);
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nav-item.active {
      color: var(--primary);
      background: rgba(37, 99, 235, 0.1);
      transform: scale(1.05);
    }
    .nav-item svg {
      width: 24px;
      height: 24px;
      transition: transform 0.1s;
    }
    .nav-item.active svg {
      transform: scale(1.1);
    }
    .nav-item span {
      font-size: 11px;
      font-weight: 500;
    }

    /* onboarding */
    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 40px 0 20px;
    }
    .app-logo {
      background: linear-gradient(145deg, #2563EB, #38BDF8);
      width: 80px;
      height: 80px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 12px 20px -10px #2563EB80;
    }
    .app-logo svg {
      width: 48px;
      height: 48px;
      stroke: white;
      stroke-width: 2;
    }
    .app-name {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .tagline {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-primary);
    }
    .description {
      text-align: center;
      color: var(--text-secondary);
      margin: 16px 0 32px;
      line-height: 1.4;
      padding: 0 12px;
    }
    .get-started {
      background: var(--primary);
      border: none;
      color: white;
      width: 100%;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: 600;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 10px 20px -5px #2563EB80;
      transition: 0.1s;
    }
    .get-started:active { transform: scale(0.97); }
    .legal-links {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin: 32px 0 20px;
    }
    .legal-links button {
      background: none;
      border: none;
      color: var(--inactive);
      text-decoration: underline;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* cards & components */
    .card {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 20px 16px;
      margin-bottom: 16px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.02);
      border: 1px solid var(--border-light);
    }
    .row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 12px 0;
    }
    .progress-bar {
      height: 10px;
      background: var(--border-light);
      border-radius: 40px;
      overflow: hidden;
      width: 100%;
    }
    .progress-fill {
      height: 10px;
      background: var(--primary);
      width: 60%;
      border-radius: 40px;
    }
    .badge {
      background: var(--accent);
      color: #0F172A;
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-item {
      background: var(--bg-primary);
      border-radius: 20px;
      padding: 16px;
      text-align: center;
      border: 1px solid var(--border-light);
    }
    .stat-number {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
    }
    .lesson-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .lesson-item:last-child { border: none; }

    /* modal */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-card {
      background: var(--bg-card);
      width: 280px;
      padding: 24px;
      border-radius: 32px;
      text-align: center;
      color: var(--text-primary);
    }
    .modal-card button {
      margin-top: 20px;
      background: var(--primary);
      border: none;
      color: white;
      padding: 10px 24px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
    }
    .hidden { display: none !important; }

    /* icons inline */
    .icon-symbol { display: none; }
  </style>
</head>
<body>
<div id="phone">
  <div id="app" class="">
    <!-- header (dynamic) -->
    <div class="header" id="app-header">
      <h1 id="header-title">Onboarding</h1>
      <button class="profile-btn" id="profileBtn" aria-label="Profile">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
    </div>

    <!-- main content panels -->
    <div id="content-area" class="content"></div>

    <!-- bottom nav (hidden on onboarding) -->
    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-item" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2h-5v-8h-4v8H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></button>
      <button class="nav-item" data-tab="learn"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span>Learn</span></button>
      <button class="nav-item" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/></svg><span>Progress</span></button>
      <button class="nav-item" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Settings</span></button>
    </nav>
  </div>
</div>

<!-- hidden modal container -->
<div id="modalContainer" class="hidden"></div>

<script>
  (function(){
    // ---------- app state ----------
    const theme = { dark: false };
    let currentScreen = 'onboarding'; 
    let screenshotCounter = 1;

    // ---------- icon render helper ----------
    function icon(name, size = 24) {
      const paths = {
        home: '<path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2h-5v-8h-4v8H5a2 2 0 0 1-2-2z"/>',
        learn: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
        progress: '<path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/>',
        settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
        profile: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
        lesson: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
        chart: '<path d="M21 16v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2"/><path d="M7 10l3-3 3 3 4-4"/><path d="M17 10V4h-6"/>',
        flashcards: '<path d="M4 4h12v12H4z"/><path d="M8 8h8v8H8z"/><path d="M12 16v4"/>',
        play: '<polygon points="5 3 19 12 5 21 5 3"/>',
        check: '<polyline points="20 6 9 17 4 12"/>',
      };
      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${paths[name] || paths.home}</svg>`;
    }

    // ---------- render screen ----------
    function renderScreen(screen) {
      const content = document.getElementById('content-area');
      const headerTitle = document.getElementById('header-title');
      const bottomNav = document.getElementById('bottomNav');
      const profileBtn = document.getElementById('profileBtn');

      if (screen === 'onboarding') {
        bottomNav.classList.add('hidden');
        headerTitle.innerText = 'CodeSpace';
        content.innerHTML = `
          <div class="logo-area">
            <div class="app-logo">${icon('learn', 48)}</div>
            <div class="app-name">CodeSpace</div>
            <div class="tagline">Python, simply.</div>
          </div>
          <div class="description">
            Master Python through bite-sized exercises and real‑time feedback. Perfect for beginners.
          </div>
          <button class="get-started" id="startOnboarding">Get Started</button>
          <div class="legal-links">
            <button id="privacyModalBtn">Privacy Policy</button>
            <button id="termsModalBtn">Terms of Service</button>
          </div>
        `;
        document.getElementById('startOnboarding')?.addEventListener('click', ()=>{
          currentScreen = 'home';
          renderScreen('home');
        });
        document.getElementById('privacyModalBtn')?.addEventListener('click', ()=>showModal('Privacy Policy', 'We respect your data. No creepy tracking.'));
        document.getElementById('termsModalBtn')?.addEventListener('click', ()=>showModal('Terms of Service', 'Keep learning, be nice.'));
      } else {
        bottomNav.classList.remove('hidden');
        if (screen === 'home') headerTitle.innerText = 'Home';
        else if (screen === 'learn') headerTitle.innerText = 'Learn';
        else if (screen === 'progress') headerTitle.innerText = 'Progress';
        else if (screen === 'settings') headerTitle.innerText = 'Settings';
        else if (screen === 'profile') headerTitle.innerText = 'Profile';

        if (screen === 'home') {
          content.innerHTML = `
            <div class="card">
              <h3>🔥 7 day streak</h3>
              <div class="row"><span>Daily goal: 20 XP</span><span class="badge">80%</span></div>
              <div class="progress-bar"><div class="progress-fill" style="width:80%"></div></div>
            </div>
            <div class="card">
              <h3>Continue learning</h3>
              <div class="lesson-item"><span>🟢 Variables</span>${icon('play',20)}</div>
              <div class="lesson-item"><span>🟡 Lists & loops</span>${icon('play',20)}</div>
              <div class="lesson-item"><span>🔵 Functions</span>${icon('play',20)}</div>
            </div>
            <div class="stat-grid">
              <div class="stat-item"><span class="stat-number">8</span><br/>lessons</div>
              <div class="stat-item"><span class="stat-number">340</span><br/>XP</div>
            </div>
          `;
        } else if (screen === 'learn') {
          content.innerHTML = `
            <div class="card">
              <h3>📘 Python basics</h3>
              <div class="lesson-item"><span>1. Hello world</span>${icon('check',20)}</div>
              <div class="lesson-item"><span>2. Variables</span>${icon('play',20)}</div>
              <div class="lesson-item"><span>3. If/else</span>${icon('play',20)}</div>
              <div class="lesson-item"><span>4. Loops</span>${icon('play',20)}</div>
              <button class="get-started" style="margin-top:16px;">Start practice</button>
            </div>
          `;
        } else if (screen === 'progress') {
          content.innerHTML = `
            <div class="card">
              <h3>⚡ Weekly activity</h3>
              <div style="height:100px; display:flex; gap:6px; align-items:flex-end; margin:20px 0">
                <div style="flex:1; height:40px; background:var(--primary); border-radius:8px;"></div>
                <div style="flex:1; height:70px; background:var(--primary); border-radius:8px;"></div>
                <div style="flex:1; height:50px; background:var(--primary); border-radius:8px;"></div>
                <div style="flex:1; height:90px; background:var(--primary); border-radius:8px;"></div>
                <div style="flex:1; height:60px; background:var(--primary); border-radius:8px;"></div>
              </div>
            </div>
            <div class="stat-grid">
              <div class="stat-item"><span class="stat-number">12</span><br/>streak</div>
              <div class="stat-item"><span class="stat-number">3</span><br/>badges</div>
            </div>
          `;
        } else if (screen === 'settings') {
          content.innerHTML = `
            <div class="card">
              <h3>⚙️ Appearance</h3>
              <div style="display:flex; gap:16px; margin:16px 0">
                <button id="lightModeBtn" style="flex:1; padding:10px; background:var(--bg-card); border:2px solid var(--primary); border-radius:40px;">Light</button>
                <button id="darkModeBtn" style="flex:1; padding:10px; background:var(--bg-card); border:2px solid var(--border-light); border-radius:40px;">Dark</button>
              </div>
              <h3>🔔 Notifications</h3>
              <div class="lesson-item"><span>Daily reminder</span> <span>ON</span></div>
            </div>
          `;
          document.getElementById('lightModeBtn')?.addEventListener('click', ()=>setTheme(false));
          document.getElementById('darkModeBtn')?.addEventListener('click', ()=>setTheme(true));
        } else if (screen === 'profile') {
          content.innerHTML = `
            <div class="card" style="text-align:center;">
              ${icon('profile', 64)}
              <h2>Alex C.</h2>
              <p>alex@codespace.dev</p>
              <div style="margin:24px 0">⚡ 340 XP · 8 lessons</div>
              <button class="get-started" id="backFromProfile">Back to Home</button>
            </div>
          `;
          document.getElementById('backFromProfile')?.addEventListener('click', ()=>{
            currentScreen = 'home';
            renderScreen('home');
          });
        }

        // active nav highlight
        document.querySelectorAll('.nav-item').forEach(btn => {
          const tab = btn.dataset.tab;
          if (tab === screen) btn.classList.add('active');
          else btn.classList.remove('active');
        });
      }

      // profile button click
      profileBtn.onclick = () => {
        currentScreen = 'profile';
        renderScreen('profile');
      };
    }

    // theme
    function setTheme(dark) {
      theme.dark = dark;
      const appEl = document.getElementById('app');
      if (dark) appEl.classList.add('dark-mode');
      else appEl.classList.remove('dark-mode');
    }

    // modal
    function showModal(title, text) {
      const modalDiv = document.createElement('div');
      modalDiv.className = 'modal';
      modalDiv.innerHTML = `<div class="modal-card"><h3>${title}</h3><p style="margin:16px 0;">${text}</p><button id="closeModalBtn">OK</button></div>`;
      document.body.appendChild(modalDiv);
      document.getElementById('closeModalBtn').addEventListener('click', ()=> modalDiv.remove());
    }

    // navigation
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const tab = btn.dataset.tab;
        if (tab) { currentScreen = tab; renderScreen(tab); }
      });
    });

    // init onboarding
    renderScreen('onboarding');

    // ---------- screenshot shift+W ----------
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const phone = document.getElementById('phone');
        html2canvas?.(phone, { scale: 2 }).then(canvas => {
          const link = document.createElement('a');
          const themeSuffix = theme.dark ? '6' : screenshotCounter;
          link.download = `${themeSuffix}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
          if (!theme.dark && screenshotCounter < 5) screenshotCounter++;
        }).catch(() => alert('html2canvas not loaded (fallback)'));
      }
    });
