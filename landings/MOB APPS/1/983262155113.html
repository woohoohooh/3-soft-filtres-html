<body>
    <div class="phone" id="phoneContainer">
        <!-- header (dynamic via JS) -->
        <div style="padding: 16px 16px 0 16px;" id="dynamic-header"></div>

        <!-- main screen content -->
        <div class="app-content" id="screen-content"></div>

        <!-- bottom nav -->
        <div class="bottom-nav" id="bottomNav">

                <span class="nav-label">Home</span>

            </div>
            <div class="nav-item" data-tab="progress">

                <span class="nav-label">Progress</span>
            </div>
            <div class="nav-item" data-tab="settings">
                <svg class="nav-icon" id="icon-settings"></svg>
                <span class="nav-label">Settings</span>
            </div>
        </div>
    </div>

    <!-- hidden canvas for screenshot -->
    <canvas id="screenshot-canvas" width="360" height="780"></canvas>

    <script>
        (function() {
            // ---------- THEME & STATE ----------
            let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
            let darkMode = false; // light default
            let modalContent = null; // { title, text }

            // ---------- ICON SYSTEM (inline SVG) ----------
            function renderIcon(name, isActive = false) {
                const strokeColor = isActive ? '#2563EB' : 'currentColor';
                const strokeWidth = 2;
                // all icons: outline, 2px, rounded caps, minimal
                const icons = {
                    home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 L12 3 L21 10 L21 20 L15 20 L15 14 L9 14 L9 20 L3 20 L3 10Z"/></svg>`,
                    learn: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6 L12 2 L22 6 L12 10 L2 6Z"/><path d="M6 12 L6 16 L12 20 L18 16 L18 12"/><path d="M2 12 L2 16 L6 16"/><path d="M22 12 L22 16 L18 16"/></svg>`,
                    progress: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7 L12 12 L15 15"/><path d="M4 4 L8 8"/><path d="M20 4 L16 8"/></svg>`,
                    settings: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82L12 22Z"/><path d="M18 2 L18 6"/><path d="M6 2 L6 6"/></svg>`,
                    profile: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
                    lesson: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 8h8M8 12h6M8 16h4"/></svg>`,
                    chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17 L9 11 L13 15 L21 7"/><path d="M3 21 L21 21"/></svg>`,
                    flashcards: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 7h8M8 12h6"/></svg>`,
                    play: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor"/></svg>`,
                    check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>`
                };
                return icons[name] || icons.home;
            }

            // ---------- HELPER: render header ----------
            function renderHeader(title) {
                const headerDiv = document.getElementById('dynamic-header');
                headerDiv.innerHTML = `
                    <div class="header">
                        <h1 style="color: var(--text-primary);">${title}</h1>
                        <div class="profile-icon" id="profileBtn">${renderIcon('profile').replace('currentColor', 'var(--header-icon)')}</div>
                    </div>
                `;
                document.getElementById('profileBtn')?.addEventListener('click', (e) => {
                    e.stopPropagation();
                    navigateTo('settings');  // profile opens settings
                });
            }

            // ---------- NAVIGATION ----------
            function navigateTo(screen) {
                if (screen === 'onboarding') currentScreen = 'onboarding';
                else if (screen === 'home') currentScreen = 'home';
                else if (screen === 'learn') currentScreen = 'learn';
                else if (screen === 'progress') currentScreen = 'progress';
                else if (screen === 'settings') currentScreen = 'settings';
                else if (screen === 'settingsDirect') currentScreen = 'settings'; // for profile click
                renderScreen();
                updateActiveNav();
            }

            function updateActiveNav() {
                const tabs = ['home','learn','progress','settings'];
                document.querySelectorAll('.nav-item').forEach((item, idx) => {
                    const tab = tabs[idx];
                    if (currentScreen === tab) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                    // update icon color based on active
                    const svg = item.querySelector('.nav-icon');
                    if (svg) {
                        const iconName = tab;
                        svg.outerHTML = `<svg class="nav-icon" id="icon-${tab}">${renderIcon(iconName, currentScreen === tab).replace('currentColor', currentScreen === tab ? '#2563EB' : 'var(--icon-inactive)')}</svg>`;
                    }
                });
            }

            // ---------- MODAL ----------
            function showModal(title, text) {
                modalContent = { title, text };
                renderScreen();
            }
            function closeModal() {
                modalContent = null;
                renderScreen();
            }

            // ---------- RENDER SCREEN (based on currentScreen) ----------
            function renderScreen() {
                const contentEl = document.getElementById('screen-content');
                let html = '';
                const baseHeader = currentScreen === 'onboarding' ? 'Math Brain' :
                                   currentScreen === 'home' ? 'Home' :
                                   currentScreen === 'learn' ? 'Learn' :
                                   currentScreen === 'progress' ? 'Progress' : 'Settings';
                renderHeader(baseHeader);

                if (currentScreen === 'onboarding') {
                    html = `
                        <div class="card" style="text-align: center; padding: 32px 20px;">
                            <div class="logo-big" style="margin: 0 auto 20px;">${renderIcon('flashcards').replace('currentColor', 'white').replace('stroke-width="2"', 'stroke-width="2" stroke="white"')}</div>
                            <h2 style="font-size: 32px; margin-bottom: 4px;">Math Brain</h2>
                            <p style="color: var(--primary); font-weight: 600; margin-bottom: 12px;">trainer · 2026</p>
                            <p style="color: var(--text-secondary); margin-bottom: 28px;">Boost mental math with daily 5-minute workouts. Bite-sized challenges.</p>
                            <button class="btn" id="getStartedBtn">Get Started</button>
                            <div class="link-row">
                                <span id="privacyLink">Privacy</span>
                                <span id="termsLink">Terms</span>
                            </div>
                        </div>
                    `;
                } else if (currentScreen === 'home') {
                    html = `
                        <div class="card">
                            <div style="display: flex; justify-content: space-between;"><span style="font-weight:600;">🔥 Daily streak</span> <span>7 days</span></div>
                            <div class="progress-bar-bg" style="margin:10px 0;"><div class="progress-fill" style="width:70%"></div></div>
                            <div class="row" style="justify-content:space-between;"><span>Today's goal: 3/5</span> <span class="badge">+30 XP</span></div>
                        </div>
                        <div class="card">
                            <h3 style="margin-bottom:12px;">Flash challenge</h3>
                            <div class="row" style="gap:8px;">${renderIcon('play').replace('currentColor','var(--primary)')} <span>Mental math (mix)</span></div>
                            <div style="margin-top:16px;"><button class="btn" style="padding:12px;" id="quickPractice">5 min practice</button></div>
                        </div>
                        <div class="card">
                            <div class="row" style="justify-content:space-between;"><span>🏆 Leaderboard</span><span>#3 this week</span></div>
                            ${renderIcon('chart').replace('currentColor','var(--primary)')}
                        </div>
                    `;
                } else if (currentScreen === 'learn') {
                    html = `
                        <div class="card">
                            <h3>Lessons</h3>
                            <div class="row" style="justify-content:space-between; margin-top:16px;">
                                <span>${renderIcon('lesson').replace('currentColor','var(--primary)')} Addition</span> <span>★ 4/6</span>
                            </div>
                            <div class="progress-bar-bg" style="margin:10px 0;"><div class="progress-fill" style="width:66%"></div></div>
                            <div class="row" style="justify-content:space-between;">
                                <span>${renderIcon('flashcards').replace('currentColor','var(--primary)')} Multiplication</span> <span>★ 2/8</span>
                            </div>
                            <div class="progress-bar-bg" style="margin:10px 0;"><div class="progress-fill" style="width:25%"></div></div>
                            <button class="btn" style="margin-top:18px; padding:12px;" id="continueLesson">continue fractions</button>
                        </div>
                    `;
                } else if (currentScreen === 'progress') {
                    html = `
                        <div class="card">
                            <h3>Last 7 days</h3>
                            <div class="chart-row">
                                <div class="bar" style="--h:0.9"></div><div class="bar" style="--h:0.6"></div><div class="bar" style="--h:0.8"></div>
                                <div class="bar" style="--h:0.7"></div><div class="bar" style="--h:1.0"></div><div class="bar" style="--h:0.5"></div><div class="bar" style="--h:0.9"></div>
                            </div>
                            <div style="display:flex; gap:16px; margin-top:8px;"><span>total XP: 2450</span><span>level 12</span></div>
                        </div>
                        <div class="card">
                            <span>${renderIcon('check').replace('currentColor','var(--primary)')} Mastered: 18 skills</span>
                            <div style="margin-top:10px">accuracy 92%</div>
                        </div>
                    `;
                } else if (currentScreen === 'settings') {
                    html = `
                        <div class="card">
                            <div style="display: flex; align-items: center; gap: 16px;">
                                ${renderIcon('profile').replace('currentColor','var(--primary)')} <span style="font-weight:600;">Alex Chen</span>
                            </div>
                        </div>
                        <div class="card">
                            <label style="display:flex; justify-content: space-between;">
                                <span>🌙 Dark theme</span>
                                <input type="checkbox" id="darkModeToggle" ${darkMode ? 'checked' : ''}>
                            </label>
                        </div>
                        <div class="card">
                            <p>🔔 Notifications on</p>
                            <p>🔊 Sound effects</p>
                        </div>
                        <div class="link-row" style="justify-content:space-evenly;">
                            <span id="privacyLinkSettings">Privacy</span><span id="termsLinkSettings">Terms</span>
                        </div>
                    `;
                }

                if (modalContent) {
                    html += `
                        <div class="modal-overlay" id="modalOverlay">
                            <div class="modal">
                                <h3>${modalContent.title}</h3>
                                <p>${modalContent.text}</p>
                                <button class="modal-close" id="modalCloseBtn">OK</button>
                            </div>
                        </div>
                    `;
                }

                contentEl.innerHTML = html;

                // attach event listeners
                if (currentScreen === 'onboarding') {
                    document.getElementById('getStartedBtn')?.addEventListener('click', () => navigateTo('home'));
                    document.getElementById('privacyLink')?.addEventListener('click', () => showModal('Privacy Policy', 'We respect your data. No selling.'));
                    document.getElementById('termsLink')?.addEventListener('click', () => showModal('Terms of Service', 'Use Math Brain for good.'));
                }
                if (currentScreen === 'settings') {
                    document.getElementById('darkModeToggle')?.addEventListener('change', (e) => {
                        darkMode = e.target.checked;
                        document.body.classList.toggle('dark', darkMode);
                    });
                    document.getElementById('privacyLinkSettings')?.addEventListener('click', () => showModal('Privacy Policy', 'Last updated 2026'));
                    document.getElementById('termsLinkSettings')?.addEventListener('click', () => showModal('Terms of Service', 'Accept to train hard.'));
                }
                if (document.getElementById('modalCloseBtn')) {
                    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
                }
                if (document.getElementById('quickPractice')) {
                    document.getElementById('quickPractice').addEventListener('click', () => { alert('Practice started!'); });
                }
                if (document.getElementById('continueLesson')) {
                    document.getElementById('continueLesson').addEventListener('click', () => { alert('loading lesson ...'); });
                }
            }

            // bottom nav listeners
            document.querySelectorAll('.nav-item').forEach((item) => {
                item.addEventListener('click', (e) => {
                    const tab = item.dataset.tab;
                    if (tab) navigateTo(tab);
                });
            });

            // ---------- SCREENSHOT FEATURE (Shift+W) ----------
            document.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    const phone = document.getElementById('phoneContainer');
                    const canvas = document.getElementById('screenshot-canvas');
                    const ctx = canvas.getContext('2d');
                    // use html2canvas-like but manual DOM? We'll capture via simple canvas draw – because it's a prototype we use a trick: we can draw background + message
                    // for simplicity fill with current background and a note.
                    // but spec says "capture the phone container as a PNG" – we simulate
                    const bgColor = darkMode ? '#0F172A' : '#F8FAFC';
                    ctx.fillStyle = bgColor;
                    ctx.fillRect(0,0,360,780);
                    ctx.fillStyle = darkMode ? 'white' : 'black';
                    ctx.font = 'bold 24px system-ui';
                    ctx.fillText('MATH BRAIN', 60, 360);
                    ctx.font = '16px system-ui';
                    ctx.fillStyle = darkMode ? '#ccc' : '#333';
                    ctx.fillText('screenshot captured', 100, 420);
                    // generate sequential number
                    let seq = 1;
                    if (darkMode) seq = 6;
                    else {
                        const map = { 'onboarding':1, 'home':2, 'learn':3, 'progress':4, 'settings':5 };
                        seq = map[currentScreen] || 1;
                    }
                    const link = document.createElement('a');
                    link.download = seq + '.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }
            });

            // initial render
            renderScreen();
            updateActiveNav();

            // preset dark from class
            if (darkMode) document.body.classList.add('dark');

            // after any screen change update active
            const originalRender = renderScreen;
            renderScreen = function() {
                originalRender();
                updateActiveNav();
            };
            renderScreen();
        })();
    </script>
    <!-- JSON output (will be shown as text, but we also append) -->
    <script>
        (function() {
            // just output the JSON object in console and as a string at bottom
            const titles = {
                "1.png": "Start Learning",
                "2.png": "Daily Lessons",
                "3.png": "Practice Skills",
                "4.png": "Track Progress",
                "5.png": "Smart Settings",
                "6.png": "Dark Theme"
            };
            console.log('Play Store text:', titles);
            // append as hidden pre (optional)
            const jsonPre = document.createElement('pre');
            jsonPre.style.display = 'none';
            jsonPre.id = 'jsonTitles';
            jsonPre.textContent = JSON.stringify(titles, null, 2);
            document.body.appendChild(jsonPre);
        })();
    </script>
