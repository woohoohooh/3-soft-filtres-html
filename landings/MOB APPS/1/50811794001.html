```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Brain Trainer · prototype</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #0F172A;
      --text-light: #334155;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --grey: #94A3B8;
      --border: #E2E8F0;
      --nav-inactive: #94A3B8;
      --shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.05);
      --header-height: 60px;
      --bottom-nav-height: 70px;
    }

    body.dark {
      --bg: #0F172A;
      --card: #1E293B;
      --text: #E2E8F0;
      --text-light: #CBD5E1;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --border: #334155;
      --nav-inactive: #64748B;
      --shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    body {
      background: #0b1120; /* outer background */
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.2s;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background: var(--bg);
      border-radius: 42px;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), 0 0 0 10px #2c3e50;
      overflow: hidden;
      position: relative;
      transition: background 0.2s;
      display: flex;
      flex-direction: column;
    }

    /* main content area (flex column: header + scrollable + bottom nav) */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      background: var(--bg);
    }

    /* header */
    .header {
      height: var(--header-height);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      flex-shrink: 0;
    }
    .header-title {
      font-weight: 700;
      font-size: 20px;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    .profile-icon {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 8px;
    }
    .profile-icon:hover { background: var(--border); }

    /* scrollable screen content */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scrollbar-width: thin;
      scrollbar-color: var(--grey) var(--card);
    }
    .screen-content::-webkit-scrollbar {
      width: 4px;
    }
    .screen-content::-webkit-scrollbar-thumb {
      background: var(--grey);
      border-radius: 8px;
    }

    /* bottom navigation */
    .bottom-nav {
      height: var(--bottom-nav-height);
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 8px;
      flex-shrink: 0;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: transform 0.15s ease;
      flex: 1;
      padding: 8px 0;
      border-radius: 20px;
    }
    .nav-item.active {
      background: rgba(37, 99, 235, 0.08);
      transform: scale(1.02);
    }
    .nav-item.active .nav-icon svg {
      stroke: var(--primary);
      stroke-width: 2.2;
      transform: scale(1.1);
      filter: drop-shadow(0 2px 4px rgba(37,99,235,0.2));
    }
    .nav-item.active .nav-label {
      color: var(--primary);
      font-weight: 600;
    }
    .nav-icon svg {
      width: 24px;
      height: 24px;
      stroke: var(--nav-inactive);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: all 0.15s;
    }
    .nav-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--nav-inactive);
      transition: color 0.15s;
    }

    /* cards & UI */
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 18px 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .card-title {
      font-weight: 700;
      font-size: 18px;
      color: var(--text);
      margin-bottom: 12px;
    }
    .row-space {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .badge {
      background: var(--accent);
      color: #0F172A;
      padding: 4px 10px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 600;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: 20px;
      margin: 8px 0;
    }
    .progress-fill {
      height: 8px;
      background: var(--primary);
      border-radius: 20px;
      width: 0%;
      transition: width 0.3s;
    }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 40px;
      padding: 14px 20px;
      font-weight: 600;
      font-size: 16px;
      width: 100%;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 4px 10px rgba(37,99,235,0.3);
    }
    .btn-small {
      background: var(--primary-dark);
      padding: 8px 14px;
      font-size: 14px;
      width: auto;
      border-radius: 30px;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-item {
      background: var(--bg);
      border-radius: 20px;
      padding: 12px;
    }
    .stat-number {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
    }
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: var(--card);
      padding: 28px;
      border-radius: 32px;
      max-width: 280px;
      color: var(--text);
      text-align: center;
    }
    .icon-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin: 10px 0;
    }
    .link {
      color: var(--primary);
      text-decoration: underline;
      cursor: pointer;
      font-size: 14px;
    }
    .hidden { display: none; }
    .mt-4 { margin-top: 16px; }
    .flex { display: flex; gap: 10px; align-items: center; }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <div class="app-container" id="appContainer">
    <!-- dynamic header injected via JS -->
    <div id="headerPlaceholder"></div>

    <!-- dynamic screen content -->
    <div id="screenContent" class="screen-content"></div>

    <!-- bottom nav (static, but highlights via js) -->
    <div class="bottom-nav" id="bottomNav">
      <div class="nav-item" data-tab="home"><span class="nav-icon" id="icon-home"></span><span class="nav-label">Home</span></div>
      <div class="nav-item" data-tab="learn"><span class="nav-icon" id="icon-learn"></span><span class="nav-label">Learn</span></div>
      <div class="nav-item" data-tab="progress"><span class="nav-icon" id="icon-progress"></span><span class="nav-label">Progress</span></div>
      <div class="nav-item" data-tab="settings"><span class="nav-icon" id="icon-settings"></span><span class="nav-label">Settings</span></div>
    </div>
  </div>
</div>

<!-- modal container (hidden by default) -->
<div id="modalContainer" class="modal hidden" onclick="if(event.target===this) closeModal()">
  <div class="modal-content" id="modalContent"></div>
</div>

<script>
  (function() {
    // ----- THEME & UTILS -----
    const theme = { dark: false };
    function toggleTheme() {
      document.body.classList.toggle('dark');
      theme.dark = document.body.classList.contains('dark');
      renderActiveScreen(); // refresh icons colors etc
    }

    // ----- SVG ICON FACTORY (consistent 24x24, stroke 2, round) -----
    function createSvgIcon(shape) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('width', '24');
      svg.setAttribute('height', '24');
      svg.setAttribute('fill', 'none');
      svg.setAttribute('stroke', 'currentColor');
      svg.setAttribute('stroke-width', '2');
      svg.setAttribute('stroke-linecap', 'round');
      svg.setAttribute('stroke-linejoin', 'round');
      if (shape === 'home') {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', 'M3 10 L12 3 L21 10 L21 20 L3 20 L3 10Z');
        svg.appendChild(path);
      } else if (shape === 'learn') {
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', '4'); rect.setAttribute('y', '6'); rect.setAttribute('width', '16'); rect.setAttribute('height', '12'); rect.setAttribute('rx', '2');
        svg.appendChild(rect);
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', '8'); line.setAttribute('y1', '10'); line.setAttribute('x2', '16'); line.setAttribute('y2', '10');
        svg.appendChild(line);
      } else if (shape === 'progress') {
        const polyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
        polyline.setAttribute('points', '22 12 18 12 15 21 9 3 6 12 2 12');
        svg.appendChild(polyline);
      } else if (shape === 'settings') {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', '12'); circle.setAttribute('cy', '12'); circle.setAttribute('r', '3');
        svg.appendChild(circle);
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', 'M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.5-1H5.78a1.65 1.65 0 0 0-1.5 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 18a10 10 0 0 0 6.36-2.22l.04-.04z');
        svg.appendChild(path);
      } else if (shape === 'profile') {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2');
        svg.appendChild(path);
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', '12'); circle.setAttribute('cy', '7'); circle.setAttribute('r', '4');
        svg.appendChild(circle);
      } else if (shape === 'flashcards') {
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', '5'); rect.setAttribute('y', '3'); rect.setAttribute('width', '14'); rect.setAttribute('height', '18'); rect.setAttribute('rx', '2');
        svg.appendChild(rect);
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', '9'); line.setAttribute('y1', '8'); line.setAttribute('x2', '15'); line.setAttribute('y2', '8');
        svg.appendChild(line);
      } else if (shape === 'play') {
        const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        polygon.setAttribute('points', '5 3 19 12 5 21 5 3');
        svg.appendChild(polygon);
      } else if (shape === 'check') {
        const polyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
        polyline.setAttribute('points', '20 6 9 17 4 12');
        svg.appendChild(polyline);
      } else if (shape === 'lesson') {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', 'M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z');
        svg.appendChild(path);
        const path2 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path2.setAttribute('d', 'M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z');
        svg.appendChild(path2);
      } else if (shape === 'chart') {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', '18'); line.setAttribute('y1', '20'); line.setAttribute('x2', '18'); line.setAttribute('y2', '10');
        svg.appendChild(line);
        const line2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line2.setAttribute('x1', '12'); line2.setAttribute('y1', '20'); line2.setAttribute('x2', '12'); line2.setAttribute('y2', '4');
        svg.appendChild(line2);
        const line3 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line3.setAttribute('x1', '6'); line3.setAttribute('y1', '20'); line3.setAttribute('x2', '6'); line3.setAttribute('y2', '14');
        svg.appendChild(line3);
      }
      return svg;
    }

    // inject icons into static nav
    function renderIcons() {
      const homeIcon = document.getElementById('icon-home'); if(homeIcon) homeIcon.innerHTML = '', homeIcon.appendChild(createSvgIcon('home'));
      const learnIcon = document.getElementById('icon-learn'); if(learnIcon) learnIcon.innerHTML = '', learnIcon.appendChild(createSvgIcon('learn'));
      const progressIcon = document.getElementById('icon-progress'); if(progressIcon) progressIcon.innerHTML = '', progressIcon.appendChild(createSvgIcon('progress'));
      const settingsIcon = document.getElementById('icon-settings'); if(settingsIcon) settingsIcon.innerHTML = '', settingsIcon.appendChild(createSvgIcon('settings'));
    }
    renderIcons();

    // navigation state
    let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
    const headerPlaceholder = document.getElementById('headerPlaceholder');
    const screenEl = document.getElementById('screenContent');
    const bottomNav = document.getElementById('bottomNav');
    const modal = document.getElementById('modalContainer');
    const modalContent = document.getElementById('modalContent');

    function closeModal() { modal.classList.add('hidden'); }
    window.closeModal = closeModal;

    function showModal(title, body) {
      modalContent.innerHTML = `<h3 style="margin-bottom:12px;">${title}</h3><p>${body}</p><button class="btn btn-small" onclick="closeModal()">Close</button>`;
      modal.classList.remove('hidden');
    }

    // ----- RENDER HEADER (dynamic) -----
    function renderHeader(screenName) {
      let title = 'Math Brain';
      if (screenName === 'home') title = 'Dashboard';
      else if (screenName === 'learn') title = 'Training';
      else if (screenName === 'progress') title = 'Statistics';
      else if (screenName === 'settings') title = 'Settings';
      else if (screenName === 'onboarding') title = 'Welcome';
      headerPlaceholder.innerHTML = `
        <div class="header">
          <span class="header-title">${title}</span>
          <div class="profile-icon" id="profileBtn">${createSvgIcon('profile').outerHTML}</div>
        </div>
      `;
      document.getElementById('profileBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        navigateTo('settings');
      });
    }

    // ----- RENDER SCREEN BASED ON currentScreen -----
    function renderOnboarding() {
      return `
        <div class="card" style="text-align:center;">
          <div style="margin: 24px 0 16px;">${createSvgIcon('flashcards').outerHTML}</div>
          <h2 style="font-size: 32px; color: var(--primary);">🧠 Math Brain</h2>
          <p style="font-size: 18px; margin: 8px 0 4px;">train your mental math</p>
          <p style="color: var(--text-light); margin: 16px;">Daily exercises to boost arithmetic speed and logic. 5-min workouts.</p>
          <button class="btn" id="getStartedBtn">Get Started</button>
          <div style="display:flex; gap:20px; justify-content:center; margin-top: 24px;">
            <span class="link" id="privacyLink">Privacy</span>
            <span class="link" id="termsLink">Terms</span>
          </div>
        </div>
      `;
    }

    function renderHome() {
      return `
        <div class="card">
          <div class="row-space"><span class="card-title">🔥 Daily streak</span><span class="badge">7 days</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
          <p style="margin: 12px 0">Next lesson in 2h</p>
        </div>
        <div class="card">
          <div class="card-title">Continue</div>
          <div class="flex"><span class="nav-icon">${createSvgIcon('lesson').outerHTML}</span> <span><strong>Addition 100</strong> — 80%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:80%"></div></div>
          <button class="btn-small" id="continueLesson" style="margin-top:12px;">Continue</button>
        </div>
        <div class="card">
          <div class="card-title">Today’s challenge</div>
          <div class="flex"><span class="nav-icon">${createSvgIcon('play').outerHTML}</span> <span>Rapid fire · 2min</span></div>
          <button class="btn-small" id="startChallenge" style="margin-top:8px;">Start</button>
        </div>
      `;
    }

    function renderLearn() {
      return `
        <div class="card"><span class="card-title">Arithmetic</span>
          <div class="flex"><span class="nav-icon">${createSvgIcon('lesson').outerHTML}</span>Addition · 45xp</div>
          <div class="flex"><span class="nav-icon">${createSvgIcon('lesson').outerHTML}</span>Subtraction · 60xp</div>
          <div class="flex"><span class="nav-icon">${createSvgIcon('flashcards').outerHTML}</span>Multiplication table</div>
          <button class="btn-small" id="startPractice" style="margin-top:14px;">Practice all</button>
        </div>
        <div class="card"><span class="card-title">Logic puzzles</span>
          <div>Number sequences</div><div>Patterns</div>
        </div>
      `;
    }

    function renderProgress() {
      return `
        <div class="card"><span class="card-title">This week</span>
          <div class="stat-grid">
            <div class="stat-item"><span class="stat-number">340</span> xp</div>
            <div class="stat-item"><span class="stat-number">12</span> lessons</div>
          </div>
          <div style="margin-top:16px;">${createSvgIcon('chart').outerHTML}  accuracy 92%</div>
          <div class="progress-bar"><div class="progress-fill" style="width:92%"></div></div>
        </div>
        <div class="card">🏅 Achievements: 4 badges</div>
      `;
    }

    function renderSettings() {
      return `
        <div class="card">
          <div class="card-title">Appearance</div>
          <div class="flex" style="justify-content: space-between;">
            <span>Dark mode</span>
            <button class="btn-small" id="themeToggleBtn">Toggle</button>
          </div>
        </div>
        <div class="card">
          <div>Profile settings</div>
          <div>Notifications</div>
        </div>
      `;
    }

    function renderActiveScreen() {
      renderHeader(currentScreen);
      let content = '';
      if (currentScreen === 'onboarding') content = renderOnboarding();
      else if (currentScreen === 'home') content = renderHome();
      else if (currentScreen === 'learn') content = renderLearn();
      else if (currentScreen === 'progress') content = renderProgress();
      else if (currentScreen === 'settings') content = renderSettings();

      screenEl.innerHTML = content;

      // attach listeners for modals etc
      if (currentScreen === 'onboarding') {
        document.getElementById('getStartedBtn')?.addEventListener('click', ()=> navigateTo('home'));
        document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy Policy', 'We respect your data. This is a demo.'));
        document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms of Service', 'Educational use only.'));
      }
      if (currentScreen === 'settings') {
        document.getElementById('themeToggleBtn')?.addEventListener('click', toggleTheme);
      }
      if (currentScreen === 'home') {
        document.getElementById('continueLesson')?.addEventListener('click', ()=> { alert('Lesson resumed! (demo)'); });
        document.getElementById('startChallenge')?.addEventListener('click', ()=> { alert('Challenge started!'); });
      }
      if (currentScreen === 'learn') {
        document.getElementById('startPractice')?.addEventListener('click', ()=> { alert('Let’s practice!'); });
      }
      // update active tab
      updateActiveNav();
    }

    function updateActiveNav() {
      const tabs = ['home','learn','progress','settings'];
      document.querySelectorAll('.nav-item').forEach((item, idx) => {
        const tab = tabs[idx];
        if (currentScreen === tab) item.classList.add('active');
        else item.classList.remove('active');
      });
    }

    // navigation function
    function navigateTo(screen) {
      if (screen === 'settings' && currentScreen === 'settings') { /* already there */ }
      currentScreen = screen;
      renderActiveScreen();
    }

    // bottom nav listeners
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', (e) => {
        const tab = item.getAttribute('data-tab');
        if (tab) navigateTo(tab);
      });
    });

    // initial render
    renderActiveScreen();

    // screenshot capture (SHIFT+W)
    document.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const phone = document.getElementById('phoneContainer');
        // We'll just simulate by "downloading" a placeholder; in real scenario you'd use html2canvas.
        // Since html2canvas not allowed, we trigger a fake download with sequential name.
        const count = theme.dark ? '6' : (window._shotCounter || 0) % 5 + 1;
        if (!theme.dark) window._shotCounter = (window._shotCounter || 0) + 1;
        alert(`📸 Screenshot ${theme.dark ? '6.png' : count+'.png'} (simulated)`);
      }
    });

    // expose navigate for global calls
    window.navigateTo = navigateTo;
