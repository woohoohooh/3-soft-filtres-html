    <div class="phone light" id="phoneContainer">

    <script>
        (function(){
            // ----- theme & icons (inline SVG) -----
            const theme = { current: 'light' };
            const container = document.getElementById('phoneContainer');
            const headerTitle = document.getElementById('headerTitle');
            const screenDiv = document.getElementById('screenContainer');
            const modalDiv = document.getElementById('modalContainer');
            const modalText = document.getElementById('modalText');
            const closeModal = document.getElementById('closeModal');
            const profileBtn = document.getElementById('profileHeaderBtn');
            const navItems = document.querySelectorAll('.nav-item');
            const bodyClass = document.body;

            // hide modal by default
            modalDiv.addEventListener('click', (e) => { if(e.target === modalDiv) modalDiv.classList.add('hidden'); });
            closeModal.addEventListener('click', () => modalDiv.classList.add('hidden'));

            function showModal(msg) { modalText.innerText = msg; modalDiv.classList.remove('hidden'); }

            // ----- SCREENS DATA -----
            let currentScreen = 'onboarding'; // start with onboarding

            // helpers
            function setActiveNav(screenId) {
                navItems.forEach(item => {
                    const scr = item.dataset.screen;
                    if (scr === screenId) item.classList.add('active');
                    else item.classList.remove('active');
                });
            }

            function renderScreen(screen) {
                if (screen === 'onboarding') {
                    headerTitle.innerText = 'Math Brain';
                    setActiveNav('none'); // no highlight
                    let html = `
                        <div class="card" style="text-align:center; padding:32px 20px;">
                            <svg width="64" height="64" viewBox="0 0 24 24" stroke="${theme.current==='light'?'#2563EB':'#3B82F6'}" stroke-width="1.5" fill="none"><path d="M4 4 L8 8 M8 4 L4 8 M16 4 L20 8 M20 4 L16 8 M12 12 L12 20 M8 16 L16 16"/><circle cx="12" cy="12" r="10"/></svg>
                            <h1 style="font-size:36px; margin:12px 0 4px;">Math Brain</h1>
                            <p style="color:var(--primary); font-weight:600;">train your mental math</p>
                            <p style="margin:16px 0; color:var(--text-secondary);">Quick daily workouts to boost arithmetic skills. 5 minutes a day keeps the calculator away.</p>
                            <button class="btn" id="startOnboarding" style="margin-top:10px;">Get Started</button>
                            <div style="display:flex; gap:16px; justify-content:center; margin-top:28px;">
                                <span class="link" id="privacyLink">Privacy Policy</span>
                                <span class="link" id="termsLink">Terms of Service</span>
                            </div>
                        </div>
                    `;
                    screenDiv.innerHTML = html;
                    document.getElementById('startOnboarding')?.addEventListener('click', ()=>{
                        currentScreen = 'home';
                        renderScreen('home');
                    });
                    document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy: we respect your data.'));
                    document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms: use Math Brain wisely.'));
                }
                else if (screen === 'home') {
                    headerTitle.innerText = 'Home';
                    setActiveNav('home');
                    let html = `
                        <div class="card" style="background:linear-gradient(145deg, var(--primary), var(--accent)); color:white;">
                            <div class="row"><span class="badge" style="background:white; color:var(--primary);">⭐ STREAK 12 days</span><span>🏆 level 7</span></div>
                            <h2 style="margin:8px 0">Good evening, Alex</h2>
                            <p>Today's target: 40 problems</p>
                            <div class="progress-bar" style="background:rgba(255,255,255,0.3)"><div class="progress-fill" style="width:65%; background:white;"></div></div>
                        </div>
                        <div class="card">
                            <div class="row"><h3>Daily workout</h3><span class="link" id="startPractice">Start →</span></div>
                            <div class="icon-row"><span class="badge">+ -</span><span class="badge">× ÷</span><span class="badge">mixed</span></div>
                        </div>
                        <div class="card">
                            <h3>Recommended</h3>
                            <div style="display:flex; gap:12px; margin-top:12px;">
                                <div style="flex:1; background:var(--bg-primary); border-radius:20px; padding:12px;"><svg width="32" height="32" viewBox="0 0 24 24" stroke="var(--primary)" fill="none"><circle cx="12" cy="12" r="10"/><path d="M8 12 L16 12"/></svg><p>Multiplication</p></div>
                                <div style="flex:1; background:var(--bg-primary); border-radius:20px; padding:12px;"><svg width="32" height="32" viewBox="0 0 24 24" stroke="var(--primary)" fill="none"><path d="M4 4 L8 8 M8 4 L4 8"/><circle cx="16" cy="8" r="2"/></svg><p>Fractions</p></div>
                            </div>
                        </div>
                    `;
                    screenDiv.innerHTML = html;
                    document.getElementById('startPractice')?.addEventListener('click', ()=>{ currentScreen='learn'; renderScreen('learn'); });
                }
                else if (screen === 'learn') {
                    headerTitle.innerText = 'Learn';
                    setActiveNav('learn');
                    let html = `
                        <div class="card"><h3>Today's lesson</h3><p>Powers of 10</p><div class="progress-bar"><div class="progress-fill" style="width:20%"></div></div><button class="btn" style="margin-top:12px;" id="contLesson">Continue →</button></div>
                        <div class="card">
                            <h3>Practice sets</h3>
                            <div style="display:flex; justify-content:space-between; margin:12px 0;"><span>➕ Addition</span><span>86%</span></div><div class="progress-bar"><div class="progress-fill" style="width:86%"></div></div>
                            <div style="display:flex; justify-content:space-between;"><span>✖️ Multiplication</span><span>42%</span></div><div class="progress-bar"><div class="progress-fill" style="width:42%"></div></div>
                            <button class="btn-outline btn" style="margin-top:16px;" id="geniusMode">genius mode</button>
                        </div>
                    `;
                    screenDiv.innerHTML = html;
                    document.getElementById('contLesson')?.addEventListener('click', ()=>showModal('Lesson preview: powers of 10 exercise.'));
                    document.getElementById('geniusMode')?.addEventListener('click', ()=>showModal('Genius mode – hard problems.'));
                }
                else if (screen === 'progress') {
                    headerTitle.innerText = 'Progress';
                    setActiveNav('progress');
                    let html = `
                        <div class="card"><h3>This week</h3><div class="stat-grid"><div class="stat-item"><span class="stat-number">328</span><br>problems</div><div class="stat-item"><span class="stat-number">47</span><br>mins</div></div></div>
                        <div class="card"><h3>Achievements</h3><div style="display:flex; gap:10px; margin:16px 0;"><span class="badge">🔥 5 streak</span><span class="badge">⚡ speedster</span><span class="badge">🧮 master</span></div><div style="display:flex; gap:6px;"><svg width="40" viewBox="0 0 24 24" stroke="var(--primary)"><polygon points="12,2 16,8 22,9 18,14 19,20 12,17 5,20 6,14 2,9 8,8 12,2"/></svg><span>new: bronze multiplier</span></div></div>
                        <div class="card"><h3>Accuracy trend</h3><svg width="100%" height="50" viewBox="0 0 200 30" stroke="var(--primary)" fill="none"><polyline points="2,25 30,15 70,22 120,8 170,18 190,8" stroke-width="2"/></svg></div>
                    `;
                    screenDiv.innerHTML = html;
                }
                else if (screen === 'settings') {
                    headerTitle.innerText = 'Settings';
                    setActiveNav('settings');
                    let html = `
                        <div class="card">
                            <h3>Appearance</h3>
                            <div class="theme-switch">
                                <button class="theme-btn" id="lightTheme">Light</button>
                                <button class="theme-btn" id="darkTheme">Dark</button>
                            </div>
                            <div style="margin-top:20px;"><span class="link" id="showProfile">Profile info</span></div>
                            <hr style="border-color:var(--border-light);margin:20px 0;">
                            <div><span class="link" id="privacySettings">Privacy</span> · <span class="link" id="termsSettings">Terms</span></div>
                        </div>
                    `;
                    screenDiv.innerHTML = html;
                    document.getElementById('lightTheme')?.addEventListener('click', ()=>{ theme.current='light'; container.className='phone light'; bodyClass.className='light'; document.querySelectorAll('.profile-icon svg').forEach(s=>s.setAttribute('stroke', '#0F172A')); renderScreen(currentScreen); });
                    document.getElementById('darkTheme')?.addEventListener('click', ()=>{ theme.current='dark'; container.className='phone dark'; bodyClass.className='dark'; document.querySelectorAll('.profile-icon svg').forEach(s=>s.setAttribute('stroke', '#E2E8F0')); renderScreen(currentScreen); });
                    document.getElementById('showProfile')?.addEventListener('click', ()=>showModal('Alex M. · joined 2026 · math brain'));
                    document.getElementById('privacySettings')?.addEventListener('click', ()=>showModal('We never sell data.'));
                    document.getElementById('termsSettings')?.addEventListener('click', ()=>showModal('© Math Brain 2026'));
                }
            }

            // navigation
            navItems.forEach(btn => btn.addEventListener('click', (e)=>{
                const target = e.currentTarget.dataset.screen;
                if (target) { currentScreen = target; renderScreen(target); }
            }));

            profileBtn.addEventListener('click', ()=>{ currentScreen = 'settings'; renderScreen('settings'); });

            // initial screen: onboarding
            renderScreen('onboarding');

            // ----- screenshot hotkey SHIFT+W -----
            let screenshotCounter = 1;
            document.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    const phone = document.getElementById('phoneContainer');
                    html2canvas(phone, { scale: 2 }).then(canvas => {
                        const link = document.createElement('a');
                        let filename = (theme.current === 'dark') ? '6.png' : (screenshotCounter + '.png');
                        if (theme.current === 'dark') filename = '6.png';
                        else { filename = screenshotCounter + '.png'; screenshotCounter = (screenshotCounter % 5) + 1; }
                        link.download = filename;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    }).catch(() => alert('html2canvas not loaded – but we simulate.'));
                }
            });

            // inject html2canvas from CDN (realistic)
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
            document.head.appendChild(script);

            // JSON output at the end (invisible, but must be printed)
            window.addEventListener('load', ()=>{
                console.log('ready');
            });

            // final JSON block will be printed after all.
        })();
    </script>
    <script>
        // this will print the JSON after rendering (as requested)

            const titles = {
                "1.png": "Start Learning",
                "2.png": "Daily Lessons",
                "3.png": "Practice Skills",
                "4.png": "Track Progress",
                "5.png": "Smart Settings",

            };
            console.log(JSON.stringify(titles, null, 2));

                pre.style.display = 'none';
                pre.textContent = JSON.stringify(titles);
                document.body.appendChild(pre);

        })();
