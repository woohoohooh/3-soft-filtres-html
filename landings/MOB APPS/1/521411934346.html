```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logic Puzzles · Brain Training</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #0F172A;
      --text-light: #334155;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --inactive: #94A3B8;
      --border: #E2E8F0;
      --shadow: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,0,0,0.05);
      --highlight: #EFF6FF;
      --progress-bg: #E2E8F0;
      --success: #10B981;
    }

    body.dark {
      --bg: #0F172A;
      --card: #1E293B;
      --text: #E2E8F0;
      --text-light: #CBD5E1;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --inactive: #64748B;
      --border: #334155;
      --shadow: 0 8px 20px rgba(0,0,0,0.5);
      --highlight: #1E293B;
      --progress-bg: #334155;
    }

    body {
      background: #1a1e2b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3), 0 0 0 8px #2c3e50;
      position: relative;
      transition: background 0.2s;
      display: flex;
      flex-direction: column;
    }

    /* main app screen */
    .app-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .app-screen::-webkit-scrollbar { display: none; }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 18px 8px;
    }
    .header h2 {
      font-size: 22px;
      font-weight: 650;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .profile-icon svg {
      width: 28px;
      height: 28px;
      stroke: var(--text);
      stroke-width: 2px;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* bottom navigation */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 6px 12px 14px;
      background: var(--card);
      border-top: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      cursor: pointer;
      gap: 4px;
      transition: all 0.15s ease;
      color: var(--inactive);
      fill: none;
    }
    .nav-item svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.15s, stroke 0.1s;
    }
    .nav-item span {
      font-size: 11px;
      font-weight: 500;
      color: currentColor;
    }
    .nav-item.active {
      color: var(--primary);
      transform: scale(1.05);
    }
    .nav-item.active svg {
      transform: scale(1.1);
    }
    .nav-item.inactive {
      color: var(--inactive);
    }

    /* onboarding / cards etc */
    .content {
      padding: 16px 18px 24px;
      flex: 1;
    }

    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 24px 0 16px;
    }
    .app-logo {
      background: linear-gradient(145deg, var(--primary), var(--accent));
      width: 72px;
      height: 72px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .app-logo svg {
      width: 44px;
      height: 44px;
      stroke: white;
      stroke-width: 2;
    }
    .app-name {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
    }
    .tagline {
      font-size: 16px;
      color: var(--primary);
      font-weight: 500;
      margin: 4px 0 8px;
    }
    .description {
      text-align: center;
      color: var(--text-light);
      margin: 8px 0 24px;
      line-height: 1.5;
    }
    .btn-primary {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      font-size: 18px;
      padding: 16px 32px;
      border-radius: 60px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(37,99,235,0.25);
      transition: 0.1s;
    }
    .btn-primary:active { transform: scale(0.97); background: var(--primary-dark); }

    .small-links {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin: 20px 0 8px;
      font-size: 14px;
    }
    .link {
      color: var(--inactive);
      text-decoration: underline;
      cursor: pointer;
    }

    /* dashboard cards */
    .section-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin: 20px 0 12px;
    }
    .stats-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: var(--card);
      flex: 1;
      padding: 14px 8px;
      border-radius: 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stat-card svg { width: 28px; height: 28px; stroke: var(--primary); margin-bottom: 6px; }
    .stat-value { font-size: 22px; font-weight: 700; color: var(--text); }
    .stat-label { font-size: 12px; color: var(--text-light); }

    .progress-card {
      background: var(--card);
      border-radius: 24px;
      padding: 16px;
      margin: 16px 0;
      box-shadow: var(--shadow);
    }
    .progress-label { display: flex; justify-content: space-between; margin-bottom: 6px; color: var(--text); }
    .progress-bar-bg { background: var(--progress-bg); height: 10px; border-radius: 20px; overflow: hidden; }
    .progress-fill { background: var(--primary); width: 65%; height: 100%; border-radius: 20px; }

    .badge-row {
      display: flex;
      gap: 12px;
      margin: 16px 0;
    }
    .badge {
      background: var(--card);
      border-radius: 30px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow);
    }
    .badge svg { width: 20px; height: 20px; stroke: var(--accent); }

    .lesson-item {
      background: var(--card);
      border-radius: 20px;
      padding: 16px;
      margin: 12px 0;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow);
      cursor: pointer;
    }
    .lesson-icon svg { width: 32px; height: 32px; stroke: var(--primary); }
    .lesson-info h4 { color: var(--text); font-weight: 600; }
    .lesson-info p { color: var(--text-light); font-size: 13px; }

    /* modal overlay */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal.hidden { display: none; }
    .modal-content {
      background: var(--card);
      padding: 24px;
      border-radius: 40px;
      width: 280px;
      text-align: center;
      color: var(--text);
      box-shadow: 0 20px 30px black;
    }
    .modal-content button {
      margin-top: 20px;
      background: var(--primary);
      border: none;
      color: white;
      padding: 10px 24px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
    }

    /* theme toggle */
    .theme-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      padding: 16px;
      border-radius: 30px;
      margin: 16px 0;
    }
    .switch { width: 44px; height: 24px; background: var(--inactive); border-radius: 60px; appearance: none; cursor: pointer; position: relative; }
    .switch:checked { background: var(--primary); }
    .switch::before { content: ''; position: absolute; width: 20px; height: 20px; background: white; border-radius: 50%; top: 2px; left: 2px; transition: 0.1s; }
    .switch:checked::before { left: 22px; }

    /* chart simulation */
    .chart-simple {
      display: flex; gap: 8px; align-items: flex-end; height: 80px; margin: 20px 0;
    }
    .bar {
      flex: 1; background: var(--primary); height: calc(100% * 0.7); border-radius: 12px 12px 6px 6px;
      animation: barUp 0.4s ease;
    }
    .bar:nth-child(2) { height: 45px; }
    .bar:nth-child(3) { height: 68px; }
    .bar:nth-child(4) { height: 32px; }
    .bar:nth-child(5) { height: 56px; }
    @keyframes barUp { 0% { transform: scaleY(0.2); } 100% { transform: scaleY(1); } }

    /* icons inline as symbols (defined in js) */
    .hidden-svg-defs { display: none; }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <div class="app-screen" id="appScreen">
    <!-- dynamic content injected via JS -->
  </div>
  <!-- bottom nav static, will be shown/hidden per screen -->
  <div class="bottom-nav" id="bottomNav">
    <button class="nav-item" data-tab="home" id="navHome">
      <svg viewBox="0 0 24 24"><use href="#icon-home"></use></svg>
      <span>Home</span>
    </button>
    <button class="nav-item" data-tab="learn" id="navLearn">
      <svg viewBox="0 0 24 24"><use href="#icon-learn"></use></svg>
      <span>Learn</span>
    </button>
    <button class="nav-item" data-tab="progress" id="navProgress">
      <svg viewBox="0 0 24 24"><use href="#icon-progress"></use></svg>
      <span>Progress</span>
    </button>
    <button class="nav-item" data-tab="settings" id="navSettings">
      <svg viewBox="0 0 24 24"><use href="#icon-settings"></use></svg>
      <span>Settings</span>
    </button>
  </div>
</div>

<!-- modal for privacy/terms -->
<div id="modalOverlay" class="modal hidden">
  <div class="modal-content" id="modalContent">
    <h3 id="modalTitle">Title</h3>
    <p id="modalBody">text</p>
    <button id="modalClose">Close</button>
  </div>
</div>

<script>
  (function() {
    // ---------- ICON SYSTEM (inline SVG symbols) ----------
    const svgNamespace = "http://www.w3.org/2000/svg";
    const defsContainer = document.createElementNS(svgNamespace, "svg");
    defsContainer.setAttribute("style", "display:none;");
    defsContainer.setAttribute("id", "icon-defs");
    const defs = document.createElementNS(svgNamespace, "defs");

    const icons = {
      home: '<path d="M5 12l-2 2 9-9 9 9-2 2-7-7-7 7z M12 5l7 7v7h-5v-5h-4v5H5v-7l7-7z"/>',
      learn: '<path d="M12 4v16M8 8v8M16 8v8M4 12h2M18 12h2"/> <rect x="2" y="6" width="20" height="12" rx="2" stroke="currentColor" fill="none"/>',
      progress: '<path d="M4 20h16M6 16v-6M10 16V8M14 16V5M18 16v-3"/> <circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/>',
      settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.05A10 10 0 0 0 12 17.66a10 10 0 0 0 6.26-2.22zM16.5 6.5 16 7l-1.5-1.5"/><path d="M10 4.5 12 3l2 1.5"/>',
      profile: '<circle cx="12" cy="8" r="4" stroke="currentColor" fill="none"/><path d="M5 20v-2a7 7 0 0 1 14 0v2" stroke="currentColor" fill="none"/>',
      lesson: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
      chart: '<path d="M21 16v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2M7 10l3-3 3 3 4-4M17 10V4h-3"/>',
      flashcards: '<rect x="4" y="3" width="16" height="18" rx="2" ry="2"/><path d="M9 8h6M9 12h4M9 16h2"/>',
      play: '<circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor"/>',
      check: '<polyline points="20 6 9 17 4 12" stroke="currentColor" fill="none"/>',
    };

    for (let [name, path] of Object.entries(icons)) {
      const symbol = document.createElementNS(svgNamespace, "symbol");
      symbol.setAttribute("id", `icon-${name}`);
      symbol.setAttribute("viewBox", "0 0 24 24");
      symbol.setAttribute("fill", "none");
      symbol.setAttribute("stroke", "currentColor");
      symbol.setAttribute("stroke-width", "2");
      symbol.setAttribute("stroke-linecap", "round");
      symbol.setAttribute("stroke-linejoin", "round");
      const temp = document.createElementNS(svgNamespace, "g");
      temp.innerHTML = path;
      while (temp.firstChild) symbol.appendChild(temp.firstChild);
      defs.appendChild(symbol);
    }

    defsContainer.appendChild(defs);
    document.body.prepend(defsContainer);

    // ---------- APP STATE ----------
    let currentScreen = 'onboarding'; // 'onboarding','home','learn','progress','settings'
    let darkMode = false;
    let screenshotCounter = 1;

    // screens container
    const appEl = document.getElementById('appScreen');
    const bottomNav = document.getElementById('bottomNav');
    const modal = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const modalClose = document.getElementById('modalClose');
    modalClose.addEventListener('click', ()=>modal.classList.add('hidden'));

    // helpers
    function showModal(title, text) {
      modalTitle.innerText = title;
      modalBody.innerText = text;
      modal.classList.remove('hidden');
    }

    // header component with profile
    function renderHeader(title) {
      return `
        <div class="header">
          <h2>${title}</h2>
          <button class="profile-btn" id="profileHeaderBtn">
            <svg class="profile-icon" viewBox="0 0 24 24"><use href="#icon-profile"></use></svg>
          </button>
        </div>
      `;
    }

    // set active nav
    function setActiveNav(tab) {
      const navs = ['home','learn','progress','settings'];
      navs.forEach(t => {
        const el = document.getElementById(`nav${t.charAt(0).toUpperCase()+t.slice(1)}`);
        if (t === tab) {
          el.classList.add('active');
          el.classList.remove('inactive');
        } else {
          el.classList.remove('active');
          el.classList.add('inactive');
        }
      });
    }

    function renderScreen() {
      if (currentScreen === 'onboarding') {
        bottomNav.style.display = 'none';
        appEl.innerHTML = `
          ${renderHeader('Welcome')}
          <div class="content">
            <div class="logo-area">
              <div class="app-logo"><svg viewBox="0 0 24 24"><use href="#icon-flashcards"></use></svg></div>
              <div class="app-name">BrainLab</div>
              <div class="tagline">logic puzzles & training</div>
              <div class="description">Train your brain with daily logic puzzles, reasoning games and cognitive challenges.</div>
            </div>
            <button class="btn-primary" id="getStartedBtn">Get Started</button>
            <div class="small-links">
              <span class="link" id="privacyLink">Privacy Policy</span>
              <span class="link" id="termsLink">Terms of Service</span>
            </div>
          </div>
        `;
        document.getElementById('getStartedBtn').addEventListener('click', ()=>{
          currentScreen = 'home';
          renderScreen();
        });
        document.getElementById('privacyLink').addEventListener('click', ()=>showModal('Privacy','We respect your data. Nothing is sold.'));
        document.getElementById('termsLink').addEventListener('click', ()=>showModal('Terms','Use this app for educational purposes only.'));
        document.getElementById('profileHeaderBtn').addEventListener('click', ()=>{
          currentScreen = 'settings';
          renderScreen();
        });
      } 
      else {
        bottomNav.style.display = 'flex';
        let content = '';
        if (currentScreen === 'home') {
          content = `
            ${renderHeader('Home')}
            <div class="content">
              <div class="stats-row">
                <div class="stat-card"><svg><use href="#icon-flashcards"></use></svg><span class="stat-value">12</span><span class="stat-label">lessons</span></div>
                <div class="stat-card"><svg><use href="#icon-chart"></use></svg><span class="stat-value">340</span><span class="stat-label">puzzles</span></div>
                <div class="stat-card"><svg><use href="#icon-play"></use></svg><span class="stat-value">5</span><span class="stat-label">streak</span></div>
              </div>
              <div class="progress-card">
                <div class="progress-label"><span>Daily goal</span><span>65%</span></div>
                <div class="progress-bar-bg"><div class="progress-fill" style="width:65%"></div></div>
              </div>
              <div class="badge-row">
                <div class="badge"><svg><use href="#icon-check"></use></svg> Quick thinker</div>
                <div class="badge"><svg><use href="#icon-flashcards"></use></svg> Novice</div>
              </div>
              <div class="section-title">Today's pick</div>
              <div class="lesson-item" id="sampleLesson">
                <div class="lesson-icon"><svg><use href="#icon-lesson"></use></svg></div>
                <div class="lesson-info"><h4>Einstein's riddle</h4><p>5 min · logic</p></div>
              </div>
            </div>
          `;
        } else if (currentScreen === 'learn') {
          content = `
            ${renderHeader('Learn')}
            <div class="content">
              <div class="lesson-item"><div class="lesson-icon"><svg><use href="#icon-lesson"></use></svg></div><div class="lesson-info"><h4>Deduction 101</h4><p>8 puzzles</p></div></div>
              <div class="lesson-item"><div class="lesson-icon"><svg><use href="#icon-flashcards"></use></svg></div><div class="lesson-info"><h4>Pattern recognition</h4><p>6 exercises</p></div></div>
              <div class="lesson-item"><div class="lesson-icon"><svg><use href="#icon-play"></use></svg></div><div class="lesson-info"><h4>Lateral thinking</h4><p>3 challenges</p></div></div>
              <button class="btn-primary" style="margin-top:16px;" id="startPracticeBtn">Start practice</button>
            </div>
          `;
        } else if (currentScreen === 'progress') {
          content = `
            ${renderHeader('Progress')}
            <div class="content">
              <div class="stats-row">
                <div class="stat-card"><span class="stat-value">47</span><span class="stat-label">days</span></div>
                <div class="stat-card"><span class="stat-value">128</span><span class="stat-label">solved</span></div>
              </div>
              <div class="chart-simple"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
              <div class="progress-card"><div class="progress-label">Logic master <span>80%</span></div><div class="progress-bar-bg"><div class="progress-fill" style="width:80%"></div></div></div>
            </div>
          `;
        } else if (currentScreen === 'settings') {
          content = `
            ${renderHeader('Settings')}
            <div class="content">
              <div class="theme-row">
                <span>Dark mode</span>
                <input type="checkbox" class="switch" id="themeToggle" ${darkMode ? 'checked' : ''}>
              </div>
              <div class="lesson-item" style="justify-content:center;">Profile: logic learner</div>
              <div style="margin-top:16px;"><small>version 1.0 · brain training</small></div>
            </div>
          `;
        }
        appEl.innerHTML = content;

        // profile header btn
        const profileBtn = document.getElementById('profileHeaderBtn');
        if(profileBtn) profileBtn.addEventListener('click', ()=>{ currentScreen = 'settings'; renderScreen(); });

        if (currentScreen === 'home') {
          document.getElementById('sampleLesson')?.addEventListener('click', ()=>{ currentScreen = 'learn'; renderScreen(); });
        }
        if (currentScreen === 'learn') {
          document.getElementById('startPracticeBtn')?.addEventListener('click', ()=>alert('Practice started!'));
        }
        if (currentScreen === 'settings') {
          const toggle = document.getElementById('themeToggle');
          if (toggle) {
            toggle.checked = darkMode;
            toggle.addEventListener('change', (e)=>{
              darkMode = e.target.checked;
              document.body.classList.toggle('dark', darkMode);
              renderScreen(); // re-render to update colors
            });
          }
        }

        // nav handlers
        setActiveNav(currentScreen);
      }
      // reattach bottom nav listeners
      document.getElementById('navHome').addEventListener('click', ()=>{ currentScreen = 'home'; renderScreen(); });
      document.getElementById('navLearn').addEventListener('click', ()=>{ currentScreen = 'learn'; renderScreen(); });
      document.getElementById('navProgress').addEventListener('click', ()=>{ currentScreen = 'progress'; renderScreen(); });
      document.getElementById('navSettings').addEventListener('click', ()=>{ currentScreen = 'settings'; renderScreen(); });
    }

    // ---------- screenshot (shift+W) ----------
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        const phone = document.getElementById('phoneContainer');
        import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm').then(({default: html2canvas}) => {
          html2canvas(phone, { backgroundColor: null }).then(canvas => {
            const link = document.createElement('a');
            const num = darkMode ? 6 : screenshotCounter;
            link.download = `${num}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            screenshotCounter = screenshotCounter < 5 ? screenshotCounter+1 : 1;
          });
        }).catch(() => alert('html2canvas failed, but shift+W works!'));
      }
    });

    // initial render
    document.body.classList.toggle('dark', darkMode);
    renderScreen();
  })();
</script>
