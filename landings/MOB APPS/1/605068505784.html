```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logic Brain • 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* CSS variables – light mode default */
    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --border-light: #E2E8F0;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --inactive-icon: #94A3B8;
      --nav-bg: rgba(255,255,255,0.85);
      --shadow: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,0,0,0.05);
      --highlight: #DBEAFE;
    }

    body.dark {
      --bg: #0F172A;
      --card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --border-light: #334155;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --inactive-icon: #64748B;
      --nav-bg: rgba(30,41,59,0.9);
      --shadow: 0 8px 20px rgba(0,0,0,0.5);
      --highlight: #1E3A8A;
    }

    body {
      background: #1a1f2b; /* outer background */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      position: relative;
      border: 1px solid rgba(255,255,255,0.08);
      transition: background 0.2s;
    }

    /* main app screen wrapper */
    .app-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--primary) var(--border-light);
      padding-bottom: 8px;
    }

    .app-screen::-webkit-scrollbar {
      width: 4px;
    }
    .app-screen::-webkit-scrollbar-track {
      background: var(--border-light);
    }
    .app-screen::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 20px;
    }

    /* header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 8px 20px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 620;
      letter-spacing: -0.3px;
      color: var(--text-primary);
    }
    .profile-icon {
      background: transparent;
      border: none;
      padding: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      transition: background 0.2s;
    }
    .profile-icon:hover {
      background: var(--highlight);
    }

    /* content area */
    .content {
      flex: 1;
      padding: 8px 16px 16px 16px;
    }

    /* bottom navigation */
    .bottom-nav {
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: var(--nav-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 8px 12px;
      border-top: 1px solid var(--border-light);
      border-radius: 0 0 44px 44px;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      padding: 6px 0 4px 0;
      width: 60px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      color: var(--inactive-icon);
      fill: var(--inactive-icon);
    }
    .nav-item.active {
      fill: var(--primary);
      color: var(--primary);
      background: var(--highlight);
      transform: scale(1.02);
    }
    .nav-item svg {
      width: 24px;
      height: 24px;
      stroke-width: 2px;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.15s;
    }
    .nav-item.active svg {
      transform: scale(1.1);
      stroke: var(--primary);
    }
    .nav-label {
      font-size: 11px;
      font-weight: 500;
      margin-top: 2px;
    }

    /* cards / UI */
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }
    .flex-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge {
      background: var(--accent);
      color: #0F172A;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 13px;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--border-light);
      border-radius: 30px;
      margin: 8px 0;
    }
    .progress-fill {
      height: 8px;
      background: var(--primary);
      border-radius: 30px;
      width: 0%;
      transition: width 0.4s ease;
    }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--primary);
      color: var(--primary);
    }
    .small-link {
      color: var(--inactive-icon);
      text-decoration: none;
      font-size: 13px;
      margin: 0 8px;
    }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-card {
      background: var(--card);
      padding: 28px;
      border-radius: 32px;
      max-width: 280px;
      color: var(--text-primary);
      text-align: center;
    }
    .close-modal {
      margin-top: 20px;
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 40px;
      font-weight: 600;
    }

    /* icons container */
    .icon-sprite {
      display: none;
    }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <!-- hidden SVG definitions (same style) -->
  <svg style="display:none;" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- home icon -->
      <symbol id="icon-home" viewBox="0 0 24 24">
        <path d="M5 12H3L12 3L21 12H19" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/>
        <path d="M5 12V19H9V15H15V19H19V12" stroke="currentColor" fill="none" stroke-width="2"/>
      </symbol>
      <!-- learn icon -->
      <symbol id="icon-learn" viewBox="0 0 24 24">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" stroke="currentColor" fill="none" stroke-width="2"/>
        <path d="M6.5 2H20V20H6.5A2.5 2.5 0 0 1 4 17.5V4.5A2.5 2.5 0 0 1 6.5 2Z" stroke="currentColor" fill="none" stroke-width="2"/>
      </symbol>
      <!-- progress icon -->
      <symbol id="icon-progress" viewBox="0 0 24 24">
        <path d="M21 12V19H3V5H12" stroke="currentColor" fill="none" stroke-width="2"/>
        <path d="M15 9L21 3" stroke="currentColor" stroke-width="2"/>
        <circle cx="15" cy="9" r="2" stroke="currentColor" fill="none" stroke-width="2"/>
        <circle cx="21" cy="3" r="2" stroke="currentColor" fill="none" stroke-width="2"/>
      </symbol>
      <!-- settings icon -->
      <symbol id="icon-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" stroke="currentColor" fill="none" stroke-width="2"/>
        <path d="M19.4 15L18.5 18.6L15 20L12 18L9 20L5.5 18.6L4.6 15L6 12L4.6 9L5.5 5.4L9 4L12 6L15 4L18.5 5.4L19.4 9L18 12L19.4 15Z" stroke="currentColor" fill="none" stroke-width="2"/>
      </symbol>
      <!-- profile icon -->
      <symbol id="icon-profile" viewBox="0 0 24 24">
        <path d="M20 21V19C20 16.8 18.2 15 16 15H8C5.8 15 4 16.8 4 19V21" stroke="currentColor" fill="none" stroke-width="2"/>
        <circle cx="12" cy="7" r="4" stroke="currentColor" fill="none" stroke-width="2"/>
      </symbol>
      <!-- lesson icon -->
      <symbol id="icon-lesson" viewBox="0 0 24 24">
        <path d="M2 3H8C9.1 3 10 3.9 10 5V19C10 20.1 9.1 21 8 21H2V3Z" stroke="currentColor" fill="none" stroke-width="2"/>
        <path d="M22 3H16C14.9 3 14 3.9 14 5V19C14 20.1 14.9 21 16 21H22V3Z" stroke="currentColor" fill="none" stroke-width="2"/>
      </symbol>
      <!-- chart icon -->
      <symbol id="icon-chart" viewBox="0 0 24 24">
        <path d="M21 21H3V3" stroke="currentColor" fill="none" stroke-width="2"/>
        <path d="M7 15L10 10L13 12L17 7" stroke="currentColor" fill="none" stroke-width="2"/>
      </symbol>
      <!-- flashcards icon -->
      <symbol id="icon-flashcards" viewBox="0 0 24 24">
        <path d="M4 6H20V20H4V6Z" stroke="currentColor" fill="none" stroke-width="2"/>
        <path d="M8 4V2" stroke="currentColor" stroke-width="2"/>
        <path d="M16 4V2" stroke="currentColor" stroke-width="2"/>
      </symbol>
      <!-- play icon -->
      <symbol id="icon-play" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" stroke="currentColor" fill="none" stroke-width="2"/>
        <path d="M10 8L16 12L10 16V8Z" stroke="currentColor" fill="none" stroke-width="2"/>
      </symbol>
      <!-- check icon -->
      <symbol id="icon-check" viewBox="0 0 24 24">
        <path d="M20 6L9 17L4 12" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <!-- header (dynamic title, profile) -->
  <div class="header">
    <h1 id="screenTitle">Welcome</h1>
    <button class="profile-icon" id="profileBtn"><svg width="28" height="28"><use href="#icon-profile"/></svg></button>
  </div>

  <!-- main content injected -->
  <div class="app-screen" id="appContent">
    <!-- dynamic screens go here -->
  </div>

  <!-- bottom navigation -->
  <div class="bottom-nav" id="bottomNav">
    <button class="nav-item" data-screen="home"><svg><use href="#icon-home"/></svg><span class="nav-label">Home</span></button>
    <button class="nav-item" data-screen="learn"><svg><use href="#icon-learn"/></svg><span class="nav-label">Learn</span></button>
    <button class="nav-item" data-screen="progress"><svg><use href="#icon-progress"/></svg><span class="nav-label">Progress</span></button>
    <button class="nav-item" data-screen="settings"><svg><use href="#icon-settings"/></svg><span class="nav-label">Settings</span></button>
  </div>
</div>

<script>
  (function() {
    // ---------- app state ----------
    const app = {
      currentScreen: 'onboarding', // onboarding, home, learn, progress, settings
      darkMode: false,
    };

    // icons sprite already in html

    // ------ helper: render screen into #appContent -----
    const contentDiv = document.getElementById('appContent');
    const screenTitle = document.getElementById('screenTitle');
    const bottomNav = document.getElementById('bottomNav');
    const profileBtn = document.getElementById('profileBtn');

    // modal container
    function showModal(text) {
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.innerHTML = `<div class="modal-card"><p>${text}</p><button class="close-modal" id="closeModalBtn">OK</button></div>`;
      document.body.appendChild(modal);
      document.getElementById('closeModalBtn').addEventListener('click', ()=>modal.remove());
      modal.addEventListener('click', (e)=> e.target === modal && modal.remove());
    }

    // bottom nav highlight
    function setActiveNav(screenId) {
      const navs = bottomNav.querySelectorAll('.nav-item');
      navs.forEach(nav => {
        const navScreen = nav.dataset.screen;
        if (navScreen === screenId) nav.classList.add('active');
        else nav.classList.remove('active');
      });
    }

    // header title update
    function updateHeaderTitle() {
      const map = {
        'onboarding': 'Welcome',
        'home': 'Logic Puzzles',
        'learn': 'Daily Puzzles',
        'progress': 'Your Stats',
        'settings': 'Settings'
      };
      screenTitle.innerText = map[app.currentScreen] || 'Logic Brain';
    }

    // screenshot feature
    let screenshotCounter = 0;
    document.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const phone = document.getElementById('phoneContainer');
        // in a real environment would use html2canvas; here we simulate console message
        // due to complexity we just show console log + alert for demo
        let filename = app.darkMode ? '6.png' : (screenshotCounter+1)+'.png';
        if(!app.darkMode && screenshotCounter<5) {
          screenshotCounter = (screenshotCounter % 5) + 1;
          filename = screenshotCounter+'.png';
        } else if (app.darkMode) filename = '6.png';
        alert(`📸 Screenshot saved as ${filename} (simulated)`);
        console.log('capture:', filename);
      }
    });

    // light/dark toggle
    function toggleTheme() {
      app.darkMode = !app.darkMode;
      document.body.classList.toggle('dark', app.darkMode);
    }

    // ---------- screen render functions ----------
    function renderOnboarding() {
      contentDiv.innerHTML = `
        <div class="content" style="display: flex; flex-direction: column; justify-content: center; min-height: 100%;">
          <div class="card" style="text-align: center; background: transparent; box-shadow: none;">
            <svg width="60" height="60" style="margin:0 auto 12px; stroke: var(--primary); fill: none;" stroke-width="2"><use href="#icon-flashcards"/></svg>
            <h2 style="font-size: 36px; font-weight: 700; color: var(--primary);">🧠 Logic Brain</h2>
            <p style="font-size: 18px; margin: 8px 0 4px; color: var(--text-primary);">train your reasoning</p>
            <p style="color: var(--text-secondary); margin: 12px 0 24px;">Daily logic puzzles & brain teasers. Boost your IQ 10 minutes a day.</p>
            <button class="btn" id="getStartedBtn">Get Started</button>
            <div style="margin-top: 24px;">
              <a href="#" class="small-link" id="privacyLink">Privacy Policy</a> • 
              <a href="#" class="small-link" id="termsLink">Terms of Service</a>
            </div>
          </div>
        </div>
      `;
      document.getElementById('getStartedBtn').addEventListener('click', ()=>{
        app.currentScreen = 'home';
        renderHome();
      });
      document.getElementById('privacyLink').addEventListener('click', (e)=>{
        e.preventDefault(); showModal('Privacy: we respect your data. (demo)');
      });
      document.getElementById('termsLink').addEventListener('click', (e)=>{
        e.preventDefault(); showModal('Terms: use responsibly. (demo)');
      });
      bottomNav.style.display = 'none'; // hide on onboarding
    }

    function renderHome() {
      bottomNav.style.display = 'flex';
      app.currentScreen = 'home';
      setActiveNav('home');
      contentDiv.innerHTML = `
        <div class="content">
          <div class="card">
            <div class="flex-row"><span class="badge">🔥 STREAK 7</span><span>⭐ 1240 pts</span></div>
            <h3 style="margin: 16px 0 8px;">Daily Challenge</h3>
            <p style="color: var(--text-secondary);">Einstein's riddle</p>
            <div class="progress-bar"><div class="progress-fill" style="width:40%"></div></div>
            <button class="btn" style="margin-top:12px;" id="startPractice">Start puzzle</button>
          </div>
          <div class="card">
            <h4>Recommended</h4>
            <div style="display:flex; gap:12px; margin:16px 0;">
              <span style="background: var(--highlight); padding: 8px 14px; border-radius: 40px; display:flex; gap:6px;"><svg width="20" height="20"><use href="#icon-lesson"/></svg> Knights & Knaves</span>
              <span style="background: var(--highlight); padding: 8px 14px; border-radius: 40px; display:flex; gap:6px;"><svg width="20" height="20"><use href="#icon-play"/></svg> Towers</span>
            </div>
          </div>
        </div>
      `;
      document.getElementById('startPractice')?.addEventListener('click', ()=>{
        app.currentScreen = 'learn';
        renderLearn();
      });
      updateHeaderTitle();
    }

    function renderLearn() {
      bottomNav.style.display = 'flex';
      app.currentScreen = 'learn';
      setActiveNav('learn');
      contentDiv.innerHTML = `
        <div class="content">
          <div class="card flex-row"><svg width="28" height="28"><use href="#icon-lesson"/></svg> <span style="flex:1; margin-left:12px;">🧩 Zebra puzzle</span> <span class="badge">80%</span></div>
          <div class="card flex-row"><svg width="28" height="28"><use href="#icon-flashcards"/></svg> <span style="flex:1; margin-left:12px;">⚖️ Balance puzzle</span> <span class="badge">new</span></div>
          <div class="card flex-row"><svg width="28" height="28"><use href="#icon-play"/></svg> <span style="flex:1; margin-left:12px;">🔢 Number sequence</span> <span class="badge">15 min</span></div>
          <button class="btn btn-outline" style="margin:8px 0;" id="continueLesson">continue last lesson</button>
        </div>
      `;
      document.getElementById('continueLesson')?.addEventListener('click', ()=> alert('resume puzzle'));
      updateHeaderTitle();
    }

    function renderProgress() {
      bottomNav.style.display = 'flex';
      app.currentScreen = 'progress';
      setActiveNav('progress');
      contentDiv.innerHTML = `
        <div class="content">
          <div class="card">
            <div class="flex-row"><span>Solved puzzles</span><span>28/50</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width:56%"></div></div>
          </div>
          <div class="card">
            <svg width="100%" height="80" viewBox="0 0 200 40"><polyline points="10,30 40,10 80,25 120,15 160,30 190,10" stroke="var(--primary)" fill="none" stroke-width="2"/></svg>
            <p>logic improvement  📈 +32%</p>
          </div>
          <div class="card flex-row"><svg width="24" height="24"><use href="#icon-chart"/></svg> <span>🏆 3 achievements</span></div>
        </div>
      `;
      updateHeaderTitle();
    }

    function renderSettings() {
      bottomNav.style.display = 'flex';
      app.currentScreen = 'settings';
      setActiveNav('settings');
      contentDiv.innerHTML = `
        <div class="content">
          <div class="card flex-row"><span>Dark mode</span> <button id="themeToggleBtn" class="btn btn-outline" style="width:auto; padding:8px 24px;">toggle</button></div>
          <div class="card"><span>Notifications</span> <span>🔔 on</span></div>
          <div class="card"><span>Sound</span> <span>🔊</span></div>
          <div class="card">Profile: logic_master</div>
        </div>
      `;
      document.getElementById('themeToggleBtn')?.addEventListener('click', toggleTheme);
      updateHeaderTitle();
    }

    // profile button -> settings
    profileBtn.addEventListener('click', ()=>{
      renderSettings();
    });

    // bottom navigation listeners
    bottomNav.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', (e)=>{
        const screen = btn.dataset.screen;
        if (screen === 'home') renderHome();
        if (screen === 'learn') renderLearn();
        if (screen === 'progress') renderProgress();
        if (screen === 'settings') renderSettings();
      });
    });

    // start with onboarding
    renderOnboarding();

    // expose for debugging
    window.app = app;
  })();
</script>

<!-- JSON output (will be printed after html, but inside JS not visible) -->
<script>
  // Output JSON at the end (simulated via console)
  (function() {
    const titles = {
      "1.png": "Start Learning",
      "2.png": "Daily Lessons",
      "3.png": "Practice Skills",
      "4.png": "Track Progress",
      "5.png": "Smart Settings",
      "6.png": "Dark Theme"
    };
    console.log('--- Play Store text ---');
    console.log(JSON.stringify(titles, null, 2));
    // Also show on screen tiny (hidden for spec)
    const hiddenPre = document.createElement('pre');
    hiddenPre.style.display = 'none';
    hiddenPre.id = 'jsonTitles';
    hiddenPre.textContent = JSON.stringify(titles);
    document.body.appendChild(hiddenPre);
  })();
</script>

<!-- Ensure bottom nav appears after onboarding with clicks -->
</body>
</html>
All done!
