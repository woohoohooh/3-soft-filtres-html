```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaSwift · vocabulary builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #1a2639;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 10px rgba(48, 56, 70, 0.8);
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s, color 0.2s;
        }
        /* theme variables */
        :root {
            --bg-primary: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --shadow-sm: 0 4px 8px rgba(0,0,0,0.02), 0 2px 4px rgba(0,0,0,0.02);
        }
        .dark-mode {
            --bg-primary: #0F172A;
            --card-bg: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --accent: #38BDF8;
            --inactive: #64748B;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
        }
        /* content area scroll */
        .screen-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px 12px 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) transparent;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .screen-content::-webkit-scrollbar {
            width: 4px;
        }
        .screen-content::-webkit-scrollbar-thumb {
            background: var(--inactive);
            border-radius: 20px;
        }

        /* header */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 16px 8px 16px;
            background: var(--bg-primary);
        }
        .header-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .profile-icon {
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            transition: background 0.2s;
        }
        .profile-icon:hover { background: var(--card-bg); }
        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 12px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 30px;
            transition: all 0.2s ease;
            flex: 1;
            max-width: 70px;
        }
        .nav-item.active {
            background: rgba(37, 99, 235, 0.12);
            transform: scale(1.02);
        }
        .nav-item.active .nav-icon svg {
            stroke: var(--primary);
            stroke-width: 2.4;
            transform: scale(1.1);
            filter: drop-shadow(0 2px 4px rgba(37,99,235,0.2));
        }
        .nav-item.active .nav-label {
            color: var(--primary);
            font-weight: 600;
        }
        .nav-icon svg {
            width: 24px;
            height: 24px;
            stroke: var(--inactive);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: all 0.15s;
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--inactive);
        }
        /* cards */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }
        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
        }
        .progress-bar {
            height: 10px;
            background: var(--border-light);
            border-radius: 20px;
            margin: 12px 0;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--primary);
            border-radius: 20px;
            transition: width 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 8px;
        }
        .stat-item {
            background: var(--bg-primary);
            padding: 14px;
            border-radius: 20px;
            text-align: center;
        }
        button {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 16px;
            border-radius: 60px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 14px rgba(37,99,235,0.25);
        }
        button.secondary {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            box-shadow: none;
        }
        .link-group {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-top: 16px;
            font-size: 13px;
            color: var(--inactive);
        }
        .link-group span {
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        /* modal */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }
        .modal-card {
            background: var(--card-bg);
            width: 280px;
            padding: 28px 20px;
            border-radius: 40px;
            text-align: center;
            color: var(--text-primary);
            border: 1px solid var(--border-light);
        }
        .hidden { display: none; }
        /* onboarding specific */
        .onboarding-logo {
            background: linear-gradient(145deg, var(--primary), var(--accent));
            width: 80px;
            height: 80px;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto 16px;
        }
        .tagline {
            font-size: 18px;
            font-weight: 600;
            margin: 8px 0 4px;
            color: var(--text-primary);
        }
        .lesson-item {
            display: flex;
            gap: 16px;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .icon-small svg {
            width: 32px;
            height: 32px;
            stroke: var(--primary);
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic header & views will be injected via JS -->
    <div id="app"></div>
</div>
<script>
    (function(){
        // ---------- THEME & SCREENSHOT HELPERS ----------
        let currentTheme = 'light';  // default light
        let currentScreen = 'onboarding';
        let screenshotCounter = 1;
        const modalStack = { visible: false, content: '' };

        // ---------- SVG ICONS (inline, outline style) ----------
        const icons = {
            home: `<svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" /></svg>`,
            learn: `<svg viewBox="0 0 24 24"><path d="M12 5L4 9L12 13L20 9L12 5Z M4 14L12 18L20 14" /></svg>`,
            progress: `<svg viewBox="0 0 24 24"><path d="M21 12V18C21 19.1 20.1 20 19 20H5C3.9 20 3 19.1 3 18V12M3 6C3 4.9 3.9 4 5 4H19C20.1 4 21 4.9 21 6V8L12 13L3 8V6Z" /></svg>`,
            settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M20 7.5L19.3 5.3L17 4.5L14 6L12 3L10 6L7 4.5L4.7 5.3L4 7.5L6 10.5L4 13.5L4.7 15.7L7 16.5L10 15L12 18L14 15L17 16.5L19.3 15.7L20 13.5L18 10.5L20 7.5Z" /></svg>`,
            profile: `<svg viewBox="0 0 24 24"><path d="M20 21V19C20 16.8 18.2 15 16 15H8C5.8 15 4 16.8 4 19V21M16 7C16 9.2 14.2 11 12 11C9.8 11 8 9.2 8 7C8 4.8 9.8 3 12 3C14.2 3 16 4.8 16 7Z" /></svg>`,
            lesson: `<svg viewBox="0 0 24 24"><path d="M4 20H20M4 20H20M4 4H20H4ZM4 20V4H20V20H4ZM8 7V12L12 9.5L16 12V7H8Z" /></svg>`,
            chart: `<svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20V14" /></svg>`,
            flashcards: `<svg viewBox="0 0 24 24"><path d="M4 6H20M4 12H20M4 18H14" /></svg>`,
            play: `<svg viewBox="0 0 24 24"><path d="M8 5L19 12L8 19V5Z" /></svg>`,
            check: `<svg viewBox="0 0 24 24"><path d="M20 6L9 17L4 12" /></svg>`,
        };

        // ---------- DOM elements ----------
        const app = document.getElementById('app');

        // ---------- helper: render header + bottom nav + screen ----------
        function renderScreen(screenId, title = '') {
            let headerTitle = title;
            if (!headerTitle) {
                if (screenId === 'onboarding') headerTitle = 'Welcome';
                else if (screenId === 'home') headerTitle = 'Home';
                else if (screenId === 'learn') headerTitle = 'Vocabulary';
                else if (screenId === 'progress') headerTitle = 'Insights';
                else if (screenId === 'settings') headerTitle = 'Settings';
            }

            const headerHtml = `
                <div class="app-header">
                    <span class="header-title">${headerTitle}</span>
                    <div class="profile-icon" id="profileBtn">${icons.profile}</div>
                </div>
            `;

            let screenHtml = '';
            if (screenId === 'onboarding') screenHtml = onboardingScreen();
            else if (screenId === 'home') screenHtml = homeScreen();
            else if (screenId === 'learn') screenHtml = learnScreen();
            else if (screenId === 'progress') screenHtml = progressScreen();
            else if (screenId === 'settings') screenHtml = settingsScreen();

            const bottomNavHtml = (screenId !== 'onboarding') ? `
                <div class="bottom-nav" id="bottomNav">
                    <div class="nav-item ${screenId==='home'?'active':''}" data-nav="home"><span class="nav-icon">${icons.home}</span><span class="nav-label">Home</span></div>
                    <div class="nav-item ${screenId==='learn'?'active':''}" data-nav="learn"><span class="nav-icon">${icons.learn}</span><span class="nav-label">Learn</span></div>
                    <div class="nav-item ${screenId==='progress'?'active':''}" data-nav="progress"><span class="nav-icon">${icons.progress}</span><span class="nav-label">Progress</span></div>
                    <div class="nav-item ${screenId==='settings'?'active':''}" data-nav="settings"><span class="nav-icon">${icons.settings}</span><span class="nav-label">Settings</span></div>
                </div>
            ` : '';

            app.innerHTML = headerHtml + `<div class="screen-content" id="screenContent">${screenHtml}</div>` + (bottomNavHtml || '');

            // attach nav listeners
            if (screenId !== 'onboarding') {
                document.querySelectorAll('.nav-item').forEach(item => {
                    item.addEventListener('click', (e) => {
                        const nav = item.dataset.nav;
                        if (nav) navigateTo(nav);
                    });
                });
            }
            document.getElementById('profileBtn')?.addEventListener('click', ()=>{
                navigateTo('settings');
            });
            // additional listeners for onboarding etc
            if (screenId === 'onboarding') {
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=> navigateTo('home'));
                document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy Policy', 'We respect your data. No unnecessary collection.'));
                document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms of Service', 'Use LinguaSwift for personal growth.'));
            }
            if (screenId === 'home') {
                document.getElementById('startPractice')?.addEventListener('click', ()=> navigateTo('learn'));
                setTimeout(()=>{ let bar = document.getElementById('dailyProgressFill'); if(bar) bar.style.width = '68%'; }, 100);
            }
            if (screenId === 'progress') {
                setTimeout(()=>{ let bar = document.getElementById('chartFill1'); if(bar) bar.style.width = '45%'; }, 100);
                setTimeout(()=>{ let bar = document.getElementById('chartFill2'); if(bar) bar.style.width = '80%'; }, 300);
            }
            if (screenId === 'settings') {
                document.getElementById('themeToggle')?.addEventListener('click', toggleTheme);
            }
        }

        // ---------- SCREENS ----------
        function onboardingScreen() {
            return `
                <div class="onboarding-logo">${icons.flashcards}</div>
                <h1 style="font-size:34px; font-weight:700; text-align:center; color:var(--text-primary);">LinguaSwift</h1>
                <div class="tagline" style="text-align:center;">master English words · daily</div>
                <p style="text-align:center; color:var(--text-secondary); margin:12px 0 28px;">Bite‑sized vocabulary challenges. Learn 5 new words a day with smart repetition.</p>
                <button id="getStartedBtn">Get started →</button>
                <div class="link-group">
                    <span id="privacyLink">Privacy</span>
                    <span id="termsLink">Terms</span>
                </div>
            `;
        }

        function homeScreen() {
            return `
                <div class="card">
                    <div class="flex-row"><span style="font-weight:600;">🔥 daily streak</span><span class="badge">12 days</span></div>
                    <div class="progress-bar"><div class="progress-fill" id="dailyProgressFill" style="width:0%"></div></div>
                    <div style="display:flex; gap:12px; margin-top:16px;">
                        <button style="flex:2;" id="startPractice">practice now</button>
                        <button class="secondary" style="flex:1;">review</button>
                    </div>
                </div>
                <div class="card">
                    <div class="flex-row"><span style="font-weight:600;">📘 recent lessons</span><span>see all</span></div>
                    <div class="lesson-item"><span class="icon-small">${icons.lesson}</span><div><b>Travel & directions</b><div style="font-size:13px;">6 words left</div></div></div>
                    <div class="lesson-item"><span class="icon-small">${icons.lesson}</span><div><b>Business English</b><div style="font-size:13px;">3 words left</div></div></div>
                    <div class="lesson-item"><span class="icon-small">${icons.flashcards}</span><div><b>Flashcards: idioms</b><div style="font-size:13px;">review 12</div></div></div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                    <div class="card" style="padding:16px;">📊 mastery<br><span style="font-size:24px; font-weight:700;">68%</span></div>
                    <div class="card" style="padding:16px;">🏆 points<br><span style="font-size:24px; font-weight:700;">2,340</span></div>
                </div>
            `;
        }

        function learnScreen() {
            return `
                <div class="card"><span style="font-weight:600;">⭐ recommended for you</span>
                    <div class="lesson-item"><span>${icons.play}</span><div><b>Technology terms</b><div style="font-size:12px;">10 min · 8 new words</div></div></div>
                    <div class="lesson-item"><span>${icons.flashcards}</span><div><b>Advanced synonyms</b><div style="font-size:12px;">flashcards · 20 cards</div></div></div>
                </div>
                <div class="card">
                    <div class="flex-row"><span style="font-weight:600;">📖 vocabulary builder</span></div>
                    <div class="lesson-item"><span>${icons.check}</span><div><b>Word: ubiquitous</b><div style="font-size:12px;">tap to practice</div></div></div>
                    <div class="lesson-item"><span>${icons.check}</span><div><b>Word: meticulous</b><div style="font-size:12px;">due for review</div></div></div>
                    <button style="margin-top:12px;" class="secondary">start new lesson</button>
                </div>
            `;
        }

        function progressScreen() {
            return `
                <div class="card">
                    <span style="font-weight:600;">📈 weekly activity</span>
                    <div style="margin:16px 0;"><span>mon</span><div class="progress-bar" style="width:80%;"><div class="progress-fill" id="chartFill1" style="width:0%"></div></div></div>
                    <div style="margin:16px 0;"><span>wed</span><div class="progress-bar" style="width:80%;"><div class="progress-fill" id="chartFill2" style="width:0%"></div></div></div>
                </div>
                <div class="stat-grid">
                    <div class="stat-item">📚 words learned<br><span style="font-size:28px; font-weight:700;">342</span></div>
                    <div class="stat-item">⏱️ practice time<br><span style="font-size:28px; font-weight:700;">18h</span></div>
                    <div class="stat-item">🏅 achievements<br><span style="font-size:28px; font-weight:700;">9</span></div>
                    <div class="stat-item">🔥 longest streak<br><span style="font-size:28px; font-weight:700;">21</span></div>
                </div>
                <div class="card">✨ next badge: word master (8/10)</div>
            `;
        }

        function settingsScreen() {
            return `
                <div class="card">
                    <div class="flex-row"><span>🌓 dark mode</span><button class="secondary" id="themeToggle" style="padding:8px 20px;">toggle</button></div>
                    <div class="flex-row" style="margin-top:20px;"><span>🔔 notifications</span><span>on</span></div>
                    <div class="flex-row"><span>🔤 language</span><span>English</span></div>
                    <div class="flex-row"><span>📞 support</span><span>help@lingua.swift</span></div>
                </div>
                <div class="card">👤 profile: Alex Learner<br>member since 2025</div>
            `;
        }

        // ---------- modal ----------
        function showModal(title, text) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `<div class="modal-card"><h3 style="margin-bottom:12px;">${title}</h3><p style="margin-bottom:24px;">${text}</p><button class="secondary" id="closeModalBtn">close</button></div>`;
            document.querySelector('.phone').appendChild(modal);
            document.getElementById('closeModalBtn').addEventListener('click', ()=> modal.remove());
        }

        // ---------- theme ----------
        function toggleTheme() {
            const container = document.getElementById('phoneContainer');
            container.classList.toggle('dark-mode');
            currentTheme = container.classList.contains('dark-mode') ? 'dark' : 'light';
        }

        // ---------- navigation ----------
        function navigateTo(screen) {
            if (screen === 'home') renderScreen('home', 'Home');
            else if (screen === 'learn') renderScreen('learn', 'Learn');
            else if (screen === 'progress') renderScreen('progress', 'Progress');
            else if (screen === 'settings') renderScreen('settings', 'Settings');
            else if (screen === 'onboarding') renderScreen('onboarding', 'Welcome');
        }

        // ---------- screenshot feature (shift+W) ----------
        document.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                const phone = document.getElementById('phoneContainer');
                // simplistic: we just simulate by showing alert with naming rule. Real screenshot would require library. We output sequential.
                let filename = screenshotCounter + '.png';
                if (currentTheme === 'dark') filename = '6.png';
                alert(`📸 Screenshot captured: ${filename} (simulated).\nIn real scenario phone container would be saved.`);
                screenshotCounter = screenshotCounter === 5 ? 1 : screenshotCounter+1; // cycle for demo
            }
        });

        // ---------- start ----------
        renderScreen('onboarding', 'Welcome');

        // add final JSON output after page load (console + append)
        window.addEventListener('load', ()=>{
            const jsonData = {
                "1.png": "Start Learning",
                "2.png": "Daily Lessons",
                "3.png": "Practice Skills",
                "4.png": "Track Progress",
                "5.png": "Smart Settings",
                "6.png": "Dark Theme"
            };
            console.log('Play Store texts:', jsonData);
            // append as comment in body (invisible)
            const script = document.createElement('script');
            script.type = 'application/json';
            script.id = 'screenshot-titles';
            script.textContent = JSON.stringify(jsonData, null, 2);
            document.body.appendChild(script);
        });

    })();
</script>
<!-- JSON will be appended as script, but also printed at very bottom per request -->
</body>
</html>
All done!
