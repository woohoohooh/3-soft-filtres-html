```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Brain Trainer · prototype</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1a1e2b;
      padding: 12px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background: var(--bg-primary);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2c3142;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: background 0.2s;
    }

    /* theme variables (light default) */
    :root {
      --bg-primary: #F8FAFC;
      --bg-card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --border-light: #E2E8F0;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --icon-inactive: #94A3B8;
      --bottom-bg: #FFFFFF;
      --shadow-sm: 0 4px 6px -1px rgb(0 0 0 / 0.05);
    }

    body.dark {
      --bg-primary: #0F172A;
      --bg-card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --border-light: #334155;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --icon-inactive: #64748B;
      --bottom-bg: #1E293B;
    }

    /* main content area */
    .app-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px 12px 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--primary) var(--bg-card);
    }
    .app-content::-webkit-scrollbar {
      width: 4px;
    }
    .app-content::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 20px;
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 0 4px;
    }
    .header h2 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }
    .profile-icon {
      cursor: pointer;
      padding: 8px;
      border-radius: 12px;
      transition: background 0.1s;
    }
    .profile-icon:hover { background: var(--bg-card); }
    .profile-icon svg {
      width: 28px;
      height: 28px;
      stroke: var(--primary);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* bottom navigation */
    .bottom-nav {
      background: var(--bottom-bg);
      border-top: 1px solid var(--border-light);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 12px 10px;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      padding: 6px 12px 4px;
      border-radius: 30px;
    }
    .nav-item span {
      font-size: 11px;
      font-weight: 500;
      color: var(--icon-inactive);
    }
    .nav-item svg {
      width: 24px;
      height: 24px;
      stroke: var(--icon-inactive);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: all 0.15s;
    }
    /* active tab */
    .nav-item.active {
      background: rgba(37, 99, 235, 0.08);
    }
    .nav-item.active svg {
      stroke: var(--primary);
      transform: scale(1.15);
      stroke-width: 2.4;
    }
    .nav-item.active span {
      color: var(--primary);
      font-weight: 600;
    }

    /* cards / containers */
    .card {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
    }

    .flex-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .progress-bar-bg {
      height: 10px;
      background: var(--border-light);
      border-radius: 20px;
      margin: 12px 0 6px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 20px;
      width: 0%;
      transition: width 0.3s ease;
    }

    .badge {
      background: var(--accent);
      color: #0F172A;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 13px;
    }

    button {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      padding: 14px 20px;
      border-radius: 60px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--primary-dark);
      transition: 0.05s linear;
      width: 100%;
    }
    button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--primary-dark);
    }

    .link-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-secondary);
      text-decoration: underline;
      cursor: pointer;
    }

    /* modal */
    .modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal.hidden { display: none; }
    .modal-card {
      background: var(--bg-card);
      width: 280px;
      padding: 28px 20px;
      border-radius: 32px;
      text-align: center;
      color: var(--text-primary);
      border: 2px solid var(--primary);
    }
    .modal-card button {
      margin-top: 20px;
      width: auto;
      padding: 10px 30px;
      display: inline-block;
      box-shadow: none;
    }

    /* chart dummy */
    .chart-row {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 120px;
      margin: 20px 0 10px;
    }
    .chart-bar {
      flex: 1;
      background: linear-gradient(to top, var(--primary), var(--accent));
      border-radius: 12px 12px 4px 4px;
      transition: height 0.3s;
    }

    .settings-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .toggle-switch {
      width: 44px;
      height: 24px;
      background: var(--border-light);
      border-radius: 40px;
      position: relative;
      cursor: pointer;
    }
    .toggle-switch.active { background: var(--primary); }
    .toggle-switch::after {
      content: '';
      width: 20px; height: 20px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 2px; left: 2px;
      transition: 0.15s;
    }
    .toggle-switch.active::after { left: 22px; }

    /* utility */
    .hidden { display: none; }
    .mt-4 { margin-top: 16px; }
    .text-secondary { color: var(--text-secondary); }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <!-- dynamic views render here -->
  <div id="app"></div>
</div>

<script>
  (function() {
    // ----- THEME TOGGLE -----
    let darkMode = false;

    // ----- SVG ICON FACTORY (outline 2px, rounded caps) -----
    function iconHome(active = false) { return `<svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10L21 21H15V15H9V21H3L3 10Z" /></svg>`; }
    function iconLearn(active = false) { return `<svg viewBox="0 0 24 24"><path d="M2 3H8C10.2 3 12 4.8 12 7V21C12 19.9 11.1 19 10 19H2V3Z M22 3H16C13.8 3 12 4.8 12 7V21C12 19.9 12.9 19 14 19H22V3Z" /></svg>`; }
    function iconProgress(active = false) { return `<svg viewBox="0 0 24 24"><path d="M21 21H3V3 M7 15L10 10L13 13L18 6" /></svg>`; }
    function iconSettings(active = false) { return `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15L20.8 12L19.4 9H16.7C16.3 8.1 15.7 7.2 15 6.6L16.3 4L13.9 2.3L11.8 3.9C10.9 3.7 10 3.7 9.2 3.9L7.1 2.3L4.7 4L6 6.6C5.3 7.2 4.7 8.1 4.3 9H1.6L0.2 12L1.6 15H4.3C4.7 15.9 5.3 16.8 6 17.4L4.7 20L7.1 21.7L9.2 20.1C10.1 20.3 11 20.3 11.8 20.1L13.9 21.7L16.3 20L15 17.4C15.7 16.8 16.3 15.9 16.7 15H19.4Z" /></svg>`; }
    function iconProfile() { return `<svg viewBox="0 0 24 24"><path d="M20 21V19C20 16.8 18.2 15 16 15H8C5.8 15 4 16.8 4 19V21 M16 7C16 9.2 14.2 11 12 11C9.8 11 8 9.2 8 7C8 4.8 9.8 3 12 3C14.2 3 16 4.8 16 7Z" /></svg>`; }
    function iconLesson() { return `<svg viewBox="0 0 24 24"><path d="M4 4H20V20H4V4Z M8 8H16M8 12H14M8 16H12"/></svg>`; }
    function iconChart() { return `<svg viewBox="0 0 24 24"><path d="M21 21H3V3 M7 15L10 10L13 13L18 6"/></svg>`; }
    function iconFlash() { return `<svg viewBox="0 0 24 24"><path d="M13 3L4 14H12L11 21L20 10H12L13 3Z"/></svg>`; }
    function iconPlay() { return `<svg viewBox="0 0 24 24"><path d="M5 3L19 12L5 21V3Z"/></svg>`; }
    function iconCheck() { return `<svg viewBox="0 0 24 24"><path d="M20 6L9 17L4 12"/></svg>`; }

    // ----- current screen -----
    let currentScreen = 'onboarding';

    // modals
    let modalType = null; // 'privacy' or 'terms'

    // ----- render function -----
    function render() {
      const root = document.getElementById('app');
      const themeClass = darkMode ? 'dark' : 'light';
      document.body.className = themeClass;

      let html = '';

      // ------ HEADER (common for all except onboarding?) we show on all except maybe onboarding, but we show it always with screen title.
      if (currentScreen !== 'onboarding') {
        let title = '';
        if (currentScreen === 'home') title = 'Dashboard';
        else if (currentScreen === 'learn') title = 'Brain training';
        else if (currentScreen === 'progress') title = 'Statistics';
        else if (currentScreen === 'settings') title = 'Settings';
        else title = 'Math Trainer';

        html += `
          <div class="header">
            <h2>${title}</h2>
            <div class="profile-icon" onclick="navigateTo('settings')">${iconProfile()}</div>
          </div>
        `;
      }

      // ------ SCREEN CONTENT ------
      if (currentScreen === 'onboarding') {
        html += `
          <div class="app-content" style="display: flex; flex-direction: column; justify-content: center;">
            <div style="text-align: center; margin-bottom: 20px;">
              <div style="background: var(--primary); width: 80px; height: 80px; border-radius: 28px; margin: 20px auto 16px; display: flex; align-items: center; justify-content: center;">
                ${iconFlash().replace('<svg', '<svg width="48" height="48" stroke="white" stroke-width="1.8"')}
              </div>
              <h1 style="font-size: 40px; font-weight: 800; color: var(--primary);">Math</h1>
              <h1 style="font-size: 40px; font-weight: 300; margin-top: -10px; color: var(--text-primary);">Brain</h1>
              <p style="font-size: 20px; font-weight: 600; margin: 8px 0 4px; color: var(--text-primary);">Train your mind</p>
              <p class="text-secondary" style="max-width: 240px; margin: 12px auto;">Daily arithmetic & logic puzzles. Quick sessions, real progress.</p>
            </div>
            <button onclick="navigateTo('home')" style="margin-top: 20px;">Get Started →</button>
            <div class="link-row">
              <span onclick="openModal('privacy')">Privacy Policy</span>
              <span onclick="openModal('terms')">Terms of Service</span>
            </div>
          </div>
        `;
      } else {
        // wrap content + bottom nav
        html += `<div class="app-content" id="mainContent">`;

        // dynamic inner
        if (currentScreen === 'home') {
          html += `
            <div class="card">
              <div class="flex-row"><span>Daily streak</span><span class="badge">7 days</span></div>
              <div class="progress-bar-bg"><div class="progress-fill" style="width:70%"></div></div>
              <div style="display: flex; gap: 12px; margin-top: 16px;">
                <div style="flex:1; background: var(--primary); border-radius: 20px; padding: 12px; color:white;">${iconPlay().replace('<svg', '<svg width=\"28\" height=\"28\" stroke=\"white\"')}<br>Quick play</div>
                <div style="flex:1; background: var(--accent); border-radius: 20px; padding: 12px; color: #0F172A;">${iconLesson().replace('<svg', '<svg width=\"28\" height=\"28\" stroke=\"#0F172A\"')}<br>Lesson</div>
              </div>
            </div>
            <div class="card">
              <div class="flex-row"><span>Recommended</span><span>view all</span></div>
              <div style="display: flex; gap: 12px; margin: 12px 0;">
                <span>➕ addition</span><span>✖️ multiplication</span><span>🧩 logic</span>
              </div>
              <div style="background: var(--border-light); border-radius: 20px; padding: 14px;">⚡ 5 min brain warmup</div>
            </div>
            <div class="card">
              <span>Today's goal</span>
              <div class="progress-bar-bg"><div class="progress-fill" style="width:45%"></div></div>
              <span class="text-secondary">45% completed</span>
            </div>
          `;
        } else if (currentScreen === 'learn') {
          html += `
            <div class="card flex-row"><span>➕ Addition (level 3)</span><span>${iconPlay().replace('<svg', '<svg width=\"28\" height=\"28\" stroke=\"var(--primary)\"')}</span></div>
            <div class="card flex-row"><span>✖️ Multiplication tables</span><span>${iconPlay().replace('<svg', '<svg width=\"28\" height=\"28\" stroke=\"var(--primary)\"')}</span></div>
            <div class="card flex-row"><span>🧩 Logic puzzles</span><span>${iconPlay().replace('<svg', '<svg width=\"28\" height=\"28\" stroke=\"var(--primary)\"')}</span></div>
            <div class="card">⚡ Speed drills · 10 tasks <button style="padding:8px;margin-top:8px;">Start</button></div>
          `;
        } else if (currentScreen === 'progress') {
          html += `
            <div class="card">
              <span>Weekly activity</span>
              <div class="chart-row">
                <div class="chart-bar" style="height:80px;"></div><div class="chart-bar" style="height:50px;"></div><div class="chart-bar" style="height:110px;"></div><div class="chart-bar" style="height:70px;"></div><div class="chart-bar" style="height:90px;"></div>
              </div>
            </div>
            <div class="card flex-row"><span>⭐ Achievements</span><span>3 new</span></div>
            <div class="card">Accuracy 89% <div class="progress-bar-bg"><div class="progress-fill" style="width:89%"></div></div></div>
          `;
        } else if (currentScreen === 'settings') {
          html += `
            <div class="card">
              <div class="settings-item"><span>Dark mode</span><div id="darkToggle" class="toggle-switch ${darkMode ? 'active' : ''}" onclick="toggleTheme()"></div></div>
              <div class="settings-item"><span>Sound effects</span><div class="toggle-switch"></div></div>
              <div class="settings-item"><span>Daily reminder</span><div class="toggle-switch active"></div></div>
              <div style="margin-top:20px;">👤 Profile: Alex</div>
              <button style="margin-top:20px;">Sign out</button>
            </div>
          `;
        }

        html += `</div>`; // close app-content

        // bottom navigation
        html += `
          <div class="bottom-nav">
            <div class="nav-item ${currentScreen === 'home' ? 'active' : ''}" onclick="navigateTo('home')">${iconHome()} <span>Home</span></div>
            <div class="nav-item ${currentScreen === 'learn' ? 'active' : ''}" onclick="navigateTo('learn')">${iconLearn()} <span>Learn</span></div>
            <div class="nav-item ${currentScreen === 'progress' ? 'active' : ''}" onclick="navigateTo('progress')">${iconProgress()} <span>Progress</span></div>
            <div class="nav-item ${currentScreen === 'settings' ? 'active' : ''}" onclick="navigateTo('settings')">${iconSettings()} <span>Settings</span></div>
          </div>
        `;
      }

      // modal overlay
      if (modalType) {
        let modalText = modalType === 'privacy' ? 'Privacy: we respect your data.' : 'Terms: use Math Brain Trainer responsibly.';
        html += `
          <div class="modal" id="modalOverlay">
            <div class="modal-card">
              <h3>${modalType === 'privacy' ? 'Privacy Policy' : 'Terms of Service'}</h3>
              <p style="margin:20px 0;">${modalText}</p>
              <button onclick="closeModal()">OK</button>
            </div>
          </div>
        `;
      } else {
        html += `<div class="modal hidden" id="modalOverlay"></div>`;
      }

      root.innerHTML = html;
    }

    // navigation
    window.navigateTo = function(screen) {
      currentScreen = screen;
      modalType = null;
      render();
    };

    window.openModal = function(type) {
      modalType = type;
      render();
    };
    window.closeModal = function() {
      modalType = null;
      render();
    };

    window.toggleTheme = function() {
      darkMode = !darkMode;
      render();
    };

    // screenshot feature shift+W
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const phone = document.getElementById('phoneContainer');
        import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
          html2canvas(phone, { scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            const themeSuffix = darkMode ? '6' : (document.querySelectorAll('.app-content') ? '1' : '1'); // but we simulate sequential naming: we will just generate 1.png for first, 2.. but we have to keep count. Use simple incremental.
            if (!window.screenshotCounter) window.screenshotCounter = 0;
            window.screenshotCounter = (window.screenshotCounter % 5) + 1;
            let filename = (darkMode ? '6' : window.screenshotCounter) + '.png';
            link.download = filename;
            link.href = canvas.toDataURL();
            link.click();
          });
        });
      }
    });

    // first render
    render();
  })();
</script>
</body>
</html>
```
All done!
