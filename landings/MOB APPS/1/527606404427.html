```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeFlow · Learn Python</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --border-light: #E2E8F0;
      --inactive: #94A3B8;
      --icon-stroke: #0F172A;
      --nav-bg: rgba(255,255,255,0.85);
      --shadow: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,0,0,0.05);
    }

    body.dark {
      --bg: #0F172A;
      --card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --border-light: #334155;
      --inactive: #64748B;
      --icon-stroke: #E2E8F0;
      --nav-bg: rgba(30, 41, 59, 0.9);
      --shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    body {
      background: #1a1f2b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 30px 50px rgba(0,0,0,0.4), 0 0 0 8px #2c313d;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: background 0.2s;
    }

    /* main screen area */
    .screen-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 8px 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--inactive) transparent;
    }
    .screen-container::-webkit-scrollbar {
      width: 4px;
    }
    .screen-container::-webkit-scrollbar-thumb {
      background: var(--inactive);
      border-radius: 8px;
    }

    /* header (title + profile) */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-top: 4px;
    }
    .header h2 {
      font-size: 24px;
      font-weight: 650;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 30px;
      transition: 0.15s;
    }
    .profile-btn:hover {
      background: var(--border-light);
    }
    .profile-btn svg {
      width: 28px;
      height: 28px;
      stroke: var(--icon-stroke);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* bottom navigation */
    .bottom-nav {
      background: var(--nav-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-light);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 4px 14px;
      border-radius: 0 0 44px 44px;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
      border: none;
      cursor: pointer;
      gap: 4px;
      transition: all 0.2s ease;
      padding: 6px 0 4px;
      border-radius: 30px;
    }
    .nav-item svg {
      width: 26px;
      height: 26px;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: 0.15s;
    }
    .nav-item span {
      font-size: 11px;
      font-weight: 500;
      transition: 0.15s;
    }
    .nav-item.active {
      background: rgba(37, 99, 235, 0.12);
    }
    .nav-item.active svg {
      stroke: var(--primary);
      transform: scale(1.1);
      stroke-width: 2.2;
    }
    .nav-item.active span {
      color: var(--primary);
      font-weight: 600;
    }
    .nav-item:not(.active) svg {
      stroke: var(--inactive);
    }
    .nav-item:not(.active) span {
      color: var(--inactive);
    }

    /* cards, progress etc */
    .card {
      background: var(--card);
      border-radius: 22px;
      padding: 18px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
      border: 1px solid var(--border-light);
    }
    .flex-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .lesson-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .lesson-item:last-child { border: none; }
    .progress-bar {
      height: 8px;
      background: var(--border-light);
      border-radius: 30px;
      margin: 12px 0 6px;
    }
    .progress-fill {
      width: 60%;
      height: 8px;
      background: var(--primary);
      border-radius: 30px;
      transition: width 0.3s ease;
    }
    .badge {
      background: var(--accent);
      color: #0F172A;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 40px;
      font-size: 12px;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-item {
      background: var(--bg);
      border-radius: 20px;
      padding: 14px;
      text-align: center;
    }
    button {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      padding: 16px 20px;
      border-radius: 60px;
      font-size: 18px;
      width: 100%;
      cursor: pointer;
      transition: 0.15s;
    }
    button.secondary {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
    }
    .link-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin: 18px 0 8px;
    }
    .link-row button {
      background: none;
      border: none;
      color: var(--inactive);
      font-size: 14px;
      padding: 6px;
      width: auto;
      text-decoration: underline;
    }
    .modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--card);
      padding: 28px;
      border-radius: 32px;
      width: 280px;
      box-shadow: 0 30px 50px black;
      border: 1px solid var(--border-light);
      z-index: 200;
    }
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(3px);
      z-index: 100;
    }
    .hidden { display: none; }
    .mt-4 { margin-top: 16px; }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <!-- dynamic header + screen -->
  <div style="flex:1; display: flex; flex-direction: column; overflow: hidden;">
    <div style="padding: 16px 16px 0 16px;">
      <div class="header">
        <h2 id="screenTitle">Welcome</h2>
        <button class="profile-btn" id="profileBtn" aria-label="Profile">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
      </div>
    </div>
    <!-- screen content (changes) -->
    <div class="screen-container" id="screenContent"></div>
    <!-- bottom navigation -->
    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-item" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Home</span></button>
      <button class="nav-item" data-tab="learn"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span>Learn</span></button>
      <button class="nav-item" data-tab="progress"><svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><span>Progress</span></button>
      <button class="nav-item" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.02.02A10 10 0 0 0 12 17.66a10 10 0 0 0 6.38-2.64z"/><path d="M4.6 8.97A10 10 0 0 1 12 5a10 10 0 0 1 7.4 3.97"/></svg><span>Settings</span></button>
    </nav>
  </div>
  <!-- modal overlays (hidden) -->
  <div id="modalOverlay" class="modal-overlay hidden"></div>
  <div id="modalWindow" class="modal hidden"></div>
</div>
<script>
  (function() {
    // ---- theme & icons ----
    const htmlEl = document.documentElement;
    let darkMode = false; // light default
    const themeToggle = () => { 
      darkMode = !darkMode; 
      if (darkMode) document.body.classList.add('dark'); else document.body.classList.remove('dark');
    };

    // ---- global state ----
    let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
    let modalType = null; // 'privacy', 'terms'

    // ---- screens data (python learning) ----
    const screens = {
      onboarding: `
        <div style="text-align: center; margin-top: 30px;">
          <svg width="70" height="70" viewBox="0 0 24 24" style="stroke:#2563EB; stroke-width:1.8; fill:none; margin:0 auto 10px;"><path d="M12 2L2 7v10l10 5 10-5V7l-10-5z"/><path d="M2 7l10 5 10-5M12 22V12"/></svg>
          <h1 style="font-size: 42px; font-weight:700; color:var(--primary);">CodeFlow</h1>
          <p style="font-size: 18px; color:var(--accent); margin:4px 0 8px;">learn Python · 3 min a day</p>
          <p style="color:var(--text-secondary); max-width:260px; margin:10px auto;">Interactive Python exercises, bite-sized lessons and real coding practice.</p>
          <button id="getStartedBtn" style="margin:24px 0 12px; background:var(--primary);">Get Started</button>
          <div class="link-row">
            <button id="privacyLink">Privacy Policy</button>
            <button id="termsLink">Terms of Service</button>
          </div>
        </div>
      `,
      home: `
        <div class="card">
          <div class="flex-row"><span style="font-weight:600;">🔥 12 day streak</span><span class="badge">+xp</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:42%"></div></div>
          <p style="margin-top:6px;">Daily goal: 42/100 XP</p>
        </div>
        <div class="card">
          <h3 style="margin-bottom:12px;">Continue learning</h3>
          <div class="lesson-item"><svg width="24" height="24" viewBox="0 0 24 24" style="stroke:var(--primary); stroke-width:2; fill:none;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><div><b>Functions</b><p>parameters, scope</p></div></div>
          <div class="lesson-item"><svg width="24" height="24" viewBox="0 0 24 24" style="stroke:var(--primary); stroke-width:2; fill:none;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><div><b>Lists & loops</b><p>8 min left</p></div></div>
          <button class="secondary" style="margin-top:12px;" id="homeToLearn">Start practice</button>
        </div>
        <div class="card"><span>📘 today's pick: <b>Dictionaries</b> → 4 exercises</span></div>
      `,
      learn: `
        <div class="card"><input type="text" placeholder="Search lessons..." style="width:100%; padding:14px; background:var(--bg); border:1px solid var(--border-light); border-radius:40px; color:var(--text-primary);"></div>
        <div class="card"><h3>Beginner</h3>${lessonList('Basics · 5 steps', 'Variables · 4 steps', 'Strings · 6 steps')}</div>
        <div class="card"><h3>Intermediate</h3>${lessonList('Functions · 7 steps', 'Lists · 5 steps', 'Dicts · 6 steps')}</div>
        <button id="learnPracticeBtn" style="margin:8px 0 20px;">Practice mixing</button>
      `,
      progress: `
        <div class="stat-grid">
          <div class="stat-item"><span style="font-size:26px; font-weight:700;">43</span><br>lessons done</div>
          <div class="stat-item"><span style="font-size:26px; font-weight:700;">1,280</span><br>total XP</div>
        </div>
        <div class="card"><div style="display:flex; gap:8px; margin-bottom:6px;"><span>🏆 Python basics</span><span style="margin-left:auto;">80%</span></div><div class="progress-bar"><div class="progress-fill" style="width:80%"></div></div></div>
        <div class="card"><div style="display:flex; gap:8px;"><span>⭐ Functions</span><span style="margin-left:auto;">45%</span></div><div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div></div>
        <div class="card"><canvas id="dummyChart" width="280" height="90" style="display:block; width:100%; height:auto; background:var(--bg); border-radius:16px;"></canvas></div>
        <script>let c=document.getElementById('dummyChart');if(c){let ctx=c.getContext('2d');ctx.clearRect(0,0,280,90);ctx.fillStyle='#2563EB';ctx.fillRect(20,50,30,30);ctx.fillStyle='#38BDF8';ctx.fillRect(70,30,30,50);ctx.fillStyle='#2563EB';ctx.fillRect(120,20,30,60);ctx.fillStyle='#38BDF8';ctx.fillRect(170,40,30,40);ctx.fillStyle='#94A3B8';ctx.fillRect(220,60,30,20);}<\/script>
      `,
      settings: `
        <div class="card">
          <div style="display:flex; align-items:center; gap:16px; margin-bottom:20px;"><svg width="40" height="40" viewBox="0 0 24 24" stroke="var(--primary)" stroke-width="1.8" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><div><b style="font-size:18px;">Alex Rivera</b><p>alex@codeflow.dev</p></div></div>
        </div>
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center;"><span>Dark theme</span><button id="themeToggleBtn" style="width:60px; padding:10px; background:var(--primary); border-radius:40px;">🌙</button></div>
        </div>
        <div class="card"><div>🔔 Notifications</div><div>🌐 Language: English</div><div>⬇️ Download lessons</div></div>
        <div class="card"><div style="color:var(--text-secondary);">Version 2.6 · build 2026</div></div>
      `,
    };
    function lessonList(a,b,c) { return `<div class="lesson-item"><svg width="24" height="24" viewBox="0 0 24 24" stroke="var(--primary)" fill="none"><polyline points="9 18 15 12 9 6"/></svg><span>${a}</span></div><div class="lesson-item"><svg width="24" height="24" viewBox="0 0 24 24" stroke="var(--primary)" fill="none"><polyline points="9 18 15 12 9 6"/></svg><span>${b}</span></div><div class="lesson-item"><svg width="24" height="24" viewBox="0 0 24 24" stroke="var(--primary)" fill="none"><polyline points="9 18 15 12 9 6"/></svg><span>${c}</span></div>`; }

    // ---- render utils ----
    function renderScreen(screenId) {
      const container = document.getElementById('screenContent');
      const titleEl = document.getElementById('screenTitle');
      if (!container) return;
      if (screenId === 'onboarding') titleEl.innerText = 'Welcome';
      else if (screenId === 'home') titleEl.innerText = 'Home';
      else if (screenId === 'learn') titleEl.innerText = 'Learn';
      else if (screenId === 'progress') titleEl.innerText = 'Progress';
      else if (screenId === 'settings') titleEl.innerText = 'Settings';
      container.innerHTML = screens[screenId] || screens.home;
      // extra binding after render
      if (screenId === 'onboarding') {
        document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{ setActiveTab('home'); });
        document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('privacy'));
        document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('terms'));
      }
      if (screenId === 'home') document.getElementById('homeToLearn')?.addEventListener('click', ()=> setActiveTab('learn'));
      if (screenId === 'learn') document.getElementById('learnPracticeBtn')?.addEventListener('click', ()=>{ alert('practice started (simulated)'); });
      if (screenId === 'settings') document.getElementById('themeToggleBtn')?.addEventListener('click', themeToggle);
    }

    // ---- modal ----
    function showModal(type) {
      modalType = type;
      const overlay = document.getElementById('modalOverlay');
      const win = document.getElementById('modalWindow');
      overlay.classList.remove('hidden');
      win.classList.remove('hidden');
      win.innerHTML = type==='privacy'?`<h3 style="color:var(--primary);">Privacy</h3><p style="margin:16px 0;">We protect your data like it’s our own. No selling, no tracking.</p><button id="closeModalBtn">Got it</button>`:`<h3 style="color:var(--primary);">Terms</h3><p style="margin:16px 0;">Use CodeFlow for good. Be kind, keep learning.</p><button id="closeModalBtn">Close</button>`;
      document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    }
    function closeModal() {
      document.getElementById('modalOverlay').classList.add('hidden');
      document.getElementById('modalWindow').classList.add('hidden');
    }

    // ---- navigation ----
    function setActiveTab(tabId) {
      currentScreen = tabId;
      renderScreen(tabId);
      // update bottom nav active style
      document.querySelectorAll('.nav-item').forEach(btn => {
        const tab = btn.dataset.tab;
        if (tab === tabId) btn.classList.add('active');
        else btn.classList.remove('active');
      });
    }

    // ---- bottom nav listeners ----
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const tab = e.currentTarget.dataset.tab;
        if (tab) setActiveTab(tab);
      });
    });

    // profile button -> settings
    document.getElementById('profileBtn').addEventListener('click', ()=>{
      setActiveTab('settings');
    });

    // close modal on overlay
    document.getElementById('modalOverlay')?.addEventListener('click', closeModal);

    // init onboarding
    setActiveTab('onboarding');

    // ---- screenshot feature SHIFT+W ----
    let screenshotCounter = 1;
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const phone = document.getElementById('phoneContainer');
        if (!phone) return;
        import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm').then(({default: html2canvas}) => {
          html2canvas(phone, { backgroundColor: null, scale: 1.8 }).then(canvas => {
            const link = document.createElement('a');
            const isDark = document.body.classList.contains('dark');
            let filename = isDark ? '6.png' : screenshotCounter + '.png';
            if (isDark) filename = '6.png';
            else if (screenshotCounter<=5) filename = screenshotCounter+'.png';
            else filename = '1.png';
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
            if (!isDark) { screenshotCounter = (screenshotCounter % 5) + 1; }
          });
        }).catch(()=> alert('html2canvas failed, but shift+w works.'));
      }
    });

  })();
</script>
</body>
</html>
