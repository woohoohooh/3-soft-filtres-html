```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code daily · Python play</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --icon-inactive: #94A3B8;
            --nav-active-bg: rgba(37, 99, 235, 0.08);
            --shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,20,40,0.05);
            --progress-bg: #E2E8F0;
            --badge-gold: #FBBF24;
            --badge-blue: #2563EB10;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #94A3B8;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --icon-inactive: #64748B;
            --nav-active-bg: rgba(59, 130, 246, 0.15);
            --shadow: 0 8px 20px rgba(0,0,0,0.4);
            --progress-bg: #334155;
            --badge-gold: #F59E0B;
        }

        body {
            background: #0b1120;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 48px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 0 10px #1e293b;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s;
        }

        /* main app view */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--icon-inactive) transparent;
            padding-bottom: 8px;
        }

        .app-screen::-webkit-scrollbar {
            width: 4px;
        }
        .app-screen::-webkit-scrollbar-thumb {
            background: var(--icon-inactive);
            border-radius: 20px;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px 8px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-icon {
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            transition: background 0.2s;
        }
        .profile-icon:hover {
            background: var(--nav-active-bg);
        }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 12px;
            background-color: var(--card);
            border-top: 1px solid var(--border-light);
            box-shadow: var(--shadow);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 24px;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            background: transparent;
            border: none;
            width: 70px;
        }
        .nav-item.active {
            background: var(--nav-active-bg);
            transform: scale(1.02);
        }
        .nav-icon {
            width: 24px;
            height: 24px;
            stroke-width: 2px;
            stroke: var(--icon-inactive);
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.15s, transform 0.2s;
        }
        .active .nav-icon {
            stroke: var(--primary);
            transform: scale(1.15);
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--icon-inactive);
            transition: color 0.15s;
        }
        .active .nav-label {
            color: var(--primary);
            font-weight: 600;
        }

        /* common cards */
        .card {
            background: var(--card);
            border-radius: 20px;
            padding: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }
        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .gap-2 { gap: 8px; }

        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 24px;
            border-radius: 40px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 8px 16px -6px var(--primary);
            transition: 0.1s;
        }
        .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }

        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 20px;
            margin: 8px 0;
        }
        .progress-fill {
            height: 8px;
            background: var(--primary);
            border-radius: 20px;
            width: 60%;
        }

        .badge {
            background: var(--badge-blue);
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            color: var(--primary);
        }

        /* modal */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }
        .modal-content {
            background: var(--card);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            color: var(--text-primary);
            box-shadow: 0 30px 60px black;
        }

        .icon-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 12px 0;
        }

        .hidden { display: none; }

        /* onboarding */
        .logo-big {
            background: var(--primary);
            width: 64px;
            height: 64px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        /* stats */
        .stat-number {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
        }
        .divider {
            height: 1px;
            background: var(--border-light);
            margin: 16px 0;
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic header + screen container -->
    <div id="appHeader" class="header">
        <h1 id="screenTitle">Welcome</h1>
        <div class="profile-icon" id="profileBtn">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--text-primary)" style="stroke:currentColor">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke-width="2" stroke-linecap="round"/>
                <circle cx="12" cy="7" r="4" stroke-width="2"/>
            </svg>
        </div>
    </div>

    <!-- main screen content -->
    <div id="screenContent" class="app-screen">
        <!-- injected by js -->
    </div>

    <!-- bottom nav -->
    <div class="bottom-nav" id="bottomNav">
        <div class="nav-item" data-tab="home">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2h-5v-8h-4v8H5a2 2 0 0 1-2-2z"/></svg>
            <span class="nav-label">Home</span>
        </div>
        <div class="nav-item" data-tab="learn">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            <span class="nav-label">Learn</span>
        </div>
        <div class="nav-item" data-tab="progress">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/></svg>
            <span class="nav-label">Progress</span>
        </div>
        <div class="nav-item" data-tab="settings">
            <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 18a10 10 0 0 0 6.36-2.22z"/><path d="M16.5 9.4V6.5a3 3 0 0 0-3-3h-3a3 3 0 0 0-3 3v2.9"/></svg>
            <span class="nav-label">Settings</span>
        </div>
    </div>
</div>

<script>
    (function(){
        // ---------- THEME ----------
        let darkMode = false;
        function toggleTheme() {
            darkMode = !darkMode;
            if (darkMode) document.body.classList.add('dark');
            else document.body.classList.remove('dark');
        }

        // ---------- ICONS pool (inline style) ----------
        const icons = {
            profile: `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
            lesson: `<svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
            chart: `<svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/></svg>`,
            flashcards: `<svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M9 9h6"/><path d="M9 15h4"/></svg>`,
            play: `<svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
            check: `<svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><polyline points="20 6 9 17 4 12"/></svg>`
        };

        // ---------- app state ----------
        let currentScreen = 'onboarding'; // or home, learn, progress, settings
        const contentDiv = document.getElementById('screenContent');
        const headerTitle = document.getElementById('screenTitle');
        const profileBtn = document.getElementById('profileBtn');
        const navItems = document.querySelectorAll('.nav-item');

        // ---------- modal helpers ----------
        function showModal(title, body) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `<div class="modal-content"><h3 style="margin-bottom:16px;">${title}</h3><p>${body}</p><button class="btn-primary" style="margin-top:20px; width:100%;" id="closeModal">Close</button></div>`;
            document.querySelector('.phone').appendChild(modal);
            document.getElementById('closeModal').addEventListener('click', ()=> modal.remove());
        }

        // ---------- render screen based on currentScreen ----------
        function renderScreen() {
            let html = '';
            if (currentScreen === 'onboarding') {
                headerTitle.innerText = 'Get started';
                html = `
                    <div style="padding:20px; display:flex; flex-direction:column; gap:24px;">
                        <div class="logo-big" style="background:var(--primary);">
                            <svg width="40" height="40" viewBox="0 0 24 24" stroke="white" stroke-width="2" fill="none"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
                        </div>
                        <h1 style="font-size:36px; font-weight:700; color:var(--text-primary);">Python<br>playground</h1>
                        <p style="color:var(--text-secondary); font-size:18px;">Write, run, learn.</p>
                        <p style="color:var(--text-secondary);">Daily Python exercises with instant feedback. From zero to hero.</p>
                        <button class="btn-primary" id="startGetStarted" style="width:100%;">Get Started</button>
                        <div style="display:flex; gap:24px; justify-content:center; margin-top:8px;">
                            <a href="#" id="privacyLink" style="color:var(--primary);">Privacy</a>
                            <a href="#" id="termsLink" style="color:var(--primary);">Terms</a>
                        </div>
                        <div class="card" style="margin-top:12px;"><span class="badge">🔥 5 day streak</span><p style="margin-top:12px;">Complete 1 lesson today</p></div>
                    </div>
                `;
            } else if (currentScreen === 'home') {
                headerTitle.innerText = 'Home';
                html = `
                    <div style="padding:16px;">
                        <div class="card">
                            <div class="flex-row"><span>👋 Welcome back, Alex</span><span class="badge">⭐ 340 XP</span></div>
                            <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
                            <div class="flex-row"><span>Daily goal: 70%</span><span>7/10 lessons</span></div>
                        </div>
                        <div class="card">
                            <div class="flex-row"><h3>Continue learning</h3>${icons.play}</div>
                            <div style="display:flex; gap:12px; margin:12px 0;">
                                <span class="badge" style="background:var(--primary); color:white;">Functions</span>
                                <span class="badge">Loops</span>
                            </div>
                            <p>Python functions · 3 min left</p>
                        </div>
                        <div class="card flex-row">
                            <span>🔥 Daily streak 5</span> ${icons.flashcards}
                        </div>
                        <div class="card"><div class="flex-row"><span>📘 practice: dictionaries</span>${icons.lesson}</div></div>
                    </div>
                `;
            } else if (currentScreen === 'learn') {
                headerTitle.innerText = 'Learn';
                html = `
                    <div style="padding:16px;">
                        <div class="card flex-row"><span>🐍 Python basics</span><span>12 lessons</span></div>
                        <div class="card flex-row"><span>📊 Data structures</span><span>8 lessons</span></div>
                        <div class="card flex-row"><span>⚙️ Algorithms</span><span>5 lessons</span></div>
                        <div class="card"><span class="badge">🔥 new: OOP</span><div class="progress-bar" style="margin-top:12px;"><div style="width:20%; height:8px; background:var(--primary); border-radius:20px;"></div></div></div>
                        <button class="btn-primary" style="width:100%;" id="startPracticeBtn">Start practice</button>
                    </div>
                `;
            } else if (currentScreen === 'progress') {
                headerTitle.innerText = 'Progress';
                html = `
                    <div style="padding:16px;">
                        <div class="card">
                            <span class="stat-number">2,340 XP</span>
                            <p>level 12 · next in 160 XP</p>
                            <div class="progress-bar"><div style="width:65%; height:8px; background:var(--primary); border-radius:20px;"></div></div>
                        </div>
                        <div class="card flex-row">
                            <span>📊 weekly activity</span> ${icons.chart}
                        </div>
                        <div class="card"><span>🏅 achievements (4)</span><div style="display:flex; gap:8px;">🔥 5 days · ⚡ 10 lessons · 🐍 python</div></div>
                        <div class="card">correct answers: 89%</div>
                    </div>
                `;
            } else if (currentScreen === 'settings') {
                headerTitle.innerText = 'Settings';
                html = `
                    <div style="padding:16px;">
                        <div class="card flex-row">
                            <span>🌙 Dark mode</span>
                            <label class="switch"><input type="checkbox" id="themeToggle" ${darkMode ? 'checked' : ''}><span class="slider"></span></label>
                        </div>
                        <div class="card">🔔 Notifications</div>
                        <div class="card">🌐 Language · English</div>
                        <div class="card flex-row"><span>Profile: Alex</span>${icons.profile}</div>
                    </div>
                `;
            }
            contentDiv.innerHTML = html;
            attachScreenEvents();
        }

        function attachScreenEvents() {
            if (currentScreen === 'onboarding') {
                document.getElementById('startGetStarted')?.addEventListener('click', ()=>{
                    currentScreen = 'home';
                    setActiveNav('home');
                    renderScreen();
                });
                document.getElementById('privacyLink')?.addEventListener('click', (e)=>{
                    e.preventDefault(); showModal('Privacy Policy', 'We respect your data. No creepy tracking.');
                });
                document.getElementById('termsLink')?.addEventListener('click', (e)=>{
                    e.preventDefault(); showModal('Terms of Service', 'Keep learning, be nice.');
                });
            }
            if (currentScreen === 'learn') {
                document.getElementById('startPracticeBtn')?.addEventListener('click', ()=>{
                    showModal('Quick practice', 'Write a function that returns the sum of two numbers.');
                });
            }
            if (currentScreen === 'settings') {
                const cb = document.getElementById('themeToggle');
                if (cb) cb.addEventListener('change', toggleTheme);
            }
        }

        // bottom nav active + navigation
        function setActiveNav(tab) {
            navItems.forEach(item => {
                const tabName = item.dataset.tab;
                if (tabName === tab) {
                    item.classList.add('active');
                    if (tabName === 'home' && currentScreen !== 'home') currentScreen = 'home';
                    else if (tabName === 'learn') currentScreen = 'learn';
                    else if (tabName === 'progress') currentScreen = 'progress';
                    else if (tabName === 'settings') currentScreen = 'settings';
                } else {
                    item.classList.remove('active');
                }
            });
            if (currentScreen !== 'onboarding') renderScreen();
        }

        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                const tab = item.dataset.tab;
                setActiveNav(tab);
            });
        });

        profileBtn.addEventListener('click', ()=>{
            currentScreen = 'settings';
            setActiveNav('settings');
            renderScreen();
        });

        // start with onboarding, home not active yet
        window.addEventListener('load', ()=>{
            currentScreen = 'onboarding';
            renderScreen();
        });

        // ---------- screenshot feature SHIFT+W ----------
        let screenshotCounter = 1;
        document.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                const container = document.getElementById('phoneContainer');
                html2canvas(container, { scale: 2 }).then(canvas => {
                    const link = document.createElement('a');
                    let filename = darkMode ? '6.png' : (screenshotCounter + '.png');
                    link.download = filename;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    if (!darkMode && screenshotCounter < 5) screenshotCounter++;
                }).catch(() => alert('html2canvas not loaded – using fallback.'));
            }
        });

        // inject html2canvas from cdn
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        document.head.appendChild(script);

    })();
</script>
<!-- manual style for switch (settings) -->
<style>
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity:0; width:0; height:0; }
    .slider { position: absolute; cursor: pointer; top:0; left:0; right:0; bottom:0; background-color: #ccc; border-radius: 34px; transition: .2s; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 2px; bottom: 2px; background-color: white; border-radius: 50%; transition: .2s; }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(20px); }
</style>
</body>
</html>
All done!
