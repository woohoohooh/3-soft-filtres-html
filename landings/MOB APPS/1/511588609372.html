```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabVault · English builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: #1a2634;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        /* theme variables (light default) */
        .phone {
            --bg-primary: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-hover: #1E40AF;
            --accent: #38BDF8;
            --icon-inactive: #94A3B8;
            --bottom-bar: #FFFFFF;
            --shadow: 0 20px 35px -8px rgba(0,0,0,0.2);
            --chart-1: #2563EB;
            --chart-2: #38BDF8;
            --badge-bg: #EFF6FF;
        }

        .phone.dark {
            --bg-primary: #0F172A;
            --card-bg: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-hover: #2563EB;
            --accent: #38BDF8;
            --icon-inactive: #64748B;
            --bottom-bar: #1E293B;
            --shadow: 0 20px 35px -8px #020617;
            --chart-1: #3B82F6;
            --chart-2: #38BDF8;
            --badge-bg: #1E3A5F;
        }

        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background 0.2s;
            border: 1px solid #2d3a4e;
        }

        /* screen container */
        .screen-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 18px 12px 18px;
            scrollbar-width: thin;
            scrollbar-color: var(--icon-inactive) transparent;
        }
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: var(--icon-inactive);
            border-radius: 20px;
        }

        /* header */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px 4px 16px;
        }
        .app-header h2 {
            font-size: 22px;
            font-weight: 650;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-icon {
            cursor: pointer;
            padding: 8px 6px;
        }

        /* bottom navigation */
        .bottom-nav {
            background: var(--bottom-bar);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 16px;
            border-top: 1px solid var(--border-light);
            border-radius: 0 0 48px 48px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.15s;
            padding: 6px 10px 4px;
            border-radius: 30px;
        }
        .nav-item.active {
            background: rgba(37, 99, 235, 0.08);
            transform: scale(1.02);
        }
        .nav-icon {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke: var(--icon-inactive);
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.1s, transform 0.1s;
        }
        .active .nav-icon {
            stroke: var(--primary);
            transform: scale(1.15);
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--icon-inactive);
            transition: color 0.1s;
        }
        .active .nav-label {
            color: var(--primary);
            font-weight: 600;
        }

        /* cards & common */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 18px 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            border: 1px solid var(--border-light);
        }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 40px;
            padding: 16px 20px;
            font-size: 17px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-secondary {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 18px 0 6px;
            font-size: 14px;
        }
        .link-row span {
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
        }

        /* modal */
        .modal {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--card-bg);
            padding: 24px;
            border-radius: 36px;
            width: 280px;
            box-shadow: 0 30px 40px #00000060;
            border: 1px solid var(--border-light);
            z-index: 1000;
            color: var(--text-primary);
            text-align: center;
        }
        .modal button {
            margin-top: 20px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 28px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        .overlay {
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: #00000080;
            z-index: 999;
        }

        /* progress bar */
        .progress-bar {
            height: 8px;
            background: var(--border-light);
            border-radius: 20px;
            margin: 12px 0;
        }
        .progress-fill {
            height: 8px;
            background: var(--primary);
            width: 0%;
            border-radius: 20px;
            transition: width 0.3s;
        }

        .badge {
            background: var(--badge-bg);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
        }

        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* custom chart */
        .chart-mini {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 80px;
            margin: 16px 0;
        }
        .bar {
            width: 22px;
            background: var(--chart-1);
            border-radius: 12px 12px 4px 4px;
            transition: height 0.3s;
        }
        .bar:nth-child(2) { background: var(--chart-2); }
        .bar:nth-child(4) { background: var(--chart-2); }

        /* toggle */
        .theme-toggle {
            display: flex;
            gap: 12px;
            margin: 10px 0;
        }
        .theme-btn {
            flex:1; padding: 12px; border-radius: 40px; border:1px solid var(--border-light);
            background: var(--card-bg); color: var(--text-primary); font-weight: 500;
            cursor: pointer;
        }
        .theme-btn.active {
            background: var(--primary); color: white; border: none;
        }

        /* hidden screenshot canvas */
        #screenshot-canvas {
            display: none;
        }

        /* list items */
        .lesson-item {
            padding: 16px 0;
            border-bottom: 1px solid var(--border-light);
        }
    </style>
</head>
<body>
<div class="phone light" id="phoneContainer">
    <!-- header (dynamic title set by JS) -->
    <div class="app-header">
        <h2 id="screenTitle">Welcome</h2>
        <div class="profile-icon" id="profileBtn"><?xml version="1.0"?><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
    </div>

    <!-- main screen content -->
    <div class="screen-container" id="screenContainer">
        <!-- will be replaced by JS -->
    </div>

    <!-- bottom navigation -->
    <div class="bottom-nav" id="bottomNav">
        <div class="nav-item" data-tab="home"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span class="nav-label">Home</span></div>
        <div class="nav-item" data-tab="learn"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span class="nav-label">Learn</span></div>
        <div class="nav-item" data-tab="progress"><svg class="nav-icon" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span class="nav-label">Progress</span></div>
        <div class="nav-item" data-tab="settings"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/><path d="M16.5 6.5 17 7l-3 3-3-3 .5-.5a3.5 3.5 0 1 1 5 0z"/></svg><span class="nav-label">Settings</span></div>
    </div>
</div>

<!-- hidden canvas for screenshot -->
<canvas id="screenshot-canvas" width="360" height="780"></canvas>

<script>
    (function() {
        // ------ THEME / ICONS / CONSTANTS ------
        const container = document.getElementById('phoneContainer');
        const screenDiv = document.getElementById('screenContainer');
        const titleEl = document.getElementById('screenTitle');
        const profileBtn = document.getElementById('profileBtn');
        const navItems = document.querySelectorAll('.nav-item');

        // icon set (inline svg strings)
        const icons = {
            home: '<svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
            learn: '<svg class="nav-icon" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
            progress: '<svg class="nav-icon" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
            settings: '<svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/><path d="M16.5 6.5 17 7l-3 3-3-3 .5-.5a3.5 3.5 0 1 1 5 0z"/></svg>',
            profile: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
            lesson: '<svg width="20" height="20" viewBox="0 0 24 24" stroke="var(--primary)" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
            chart: '<svg width="20" height="20" viewBox="0 0 24 24" stroke="var(--primary)" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
            flashcards: '<svg width="20" height="20" viewBox="0 0 24 24" stroke="var(--primary)" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18"/><path d="M7 2v20M17 2v20"/></svg>',
            play: '<svg width="20" height="20" viewBox="0 0 24 24" stroke="var(--primary)" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
            check: '<svg width="20" height="20" viewBox="0 0 24 24" stroke="var(--primary)" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>',
        };

        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
        let darkMode = false;
        let modalContent = null; // {title, text}

        // ----- helper functions -----
        function setTheme(isDark) {
            if (isDark) {
                container.classList.remove('light');
                container.classList.add('dark');
            } else {
                container.classList.remove('dark');
                container.classList.add('light');
            }
            darkMode = isDark;
            renderScreen(currentScreen); // refresh icons color etc
        }

        // show modal
        function showModal(title, text) {
            modalContent = { title, text };
            renderModal();
        }
        function closeModal() {
            modalContent = null;
            renderModal();
        }
        function renderModal() {
            const existingOverlay = document.querySelector('.overlay');
            if (existingOverlay) existingOverlay.remove();
            if (!modalContent) return;

            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            overlay.onclick = closeModal;
            const modalDiv = document.createElement('div');
            modalDiv.className = 'modal';
            modalDiv.innerHTML = `<h3 style="margin-bottom:12px">${modalContent.title}</h3><p>${modalContent.text}</p><button id="modalCloseBtn">OK</button>`;
            modalDiv.onclick = (e) => e.stopPropagation();
            overlay.appendChild(modalDiv);
            document.body.appendChild(overlay);
            document.getElementById('modalCloseBtn')?.addEventListener('click', closeModal);
        }

        // ----- screen renderers -----
        function renderOnboarding() {
            titleEl.innerText = 'VocabVault';
            return `
                <div style="text-align:center; margin-top:20px">
                    <div style="background:var(--primary); width:70px; height:70px; border-radius:22px; margin:10px auto; display:flex; align-items:center; justify-content:center">
                        <span style="color:white; font-size:40px; font-weight:700">V</span>
                    </div>
                    <h1 style="font-size:32px; margin:10px 0 4px; color:var(--text-primary)">VocabVault</h1>
                    <p style="color:var(--primary); font-weight:600">master English daily</p>
                    <p style="color:var(--text-secondary); margin:20px 16px">Build your vocabulary with smart flashcards, daily challenges, and progress tracking.</p>
                    <button class="btn" id="startBtn">Get Started →</button>
                    <div class="link-row">
                        <span id="privacyLink">Privacy Policy</span>
                        <span id="termsLink">Terms of Service</span>
                    </div>
                </div>
            `;
        }

        function renderHome() {
            titleEl.innerText = 'Home';
            return `
                <div class="card">
                    <div class="flex-row"><span class="badge">🔥 streak 12 days</span> <span>⚡ 450 XP</span></div>
                    <h3 style="margin:16px 0 6px; color:var(--text-primary)">Continue lesson</h3>
                    <div class="flex-row"><span>Phrasal verbs</span><span>76%</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:76%"></div></div>
                    <button class="btn" style="margin-top:12px" id="contLearn">Continue</button>
                </div>
                <div class="card">
                    <div class="flex-row"><span>🏆 daily goal</span><span>80%</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:80%"></div></div>
                    <div style="display:flex; gap:12px; margin-top:12px">${icons.flashcards} <span>3 topics left</span></div>
                </div>
                <div class="card">
                    <h4>Recent topics</h4>
                    <div class="lesson-item flex-row"><span>Business English</span>${icons.play}</div>
                    <div class="lesson-item flex-row"><span>Idioms</span>${icons.play}</div>
                </div>
            `;
        }

        function renderLearn() {
            titleEl.innerText = 'Learn';
            return `
                <div class="card">
                    <div class="flex-row"><h3>Daily deck</h3>${icons.flashcards}</div>
                    <div class="lesson-item flex-row"><span>Word set #23 · 10 cards</span>${icons.play}</div>
                    <div class="lesson-item flex-row"><span>Synonyms · 8 cards</span>${icons.play}</div>
                    <button class="btn" style="margin-top:8px" id="practiceStart">Start practice</button>
                </div>
                <div class="card">
                    <div class="flex-row"><span>Grammar mini‑lesson</span><span>5 min</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:40%"></div></div>
                    <p>Present perfect</p>
                </div>
            `;
        }

        function renderProgress() {
            titleEl.innerText = 'Progress';
            // chart bars animation
            setTimeout(() => { // dynamic after render
                document.querySelectorAll('.bar').forEach((b,i) => { b.style.height = [50,68,42,76,63][i]+'px'; });
            },20);
            return `
                <div class="card">
                    <h3>Weekly activity</h3>
                    <div class="chart-mini">
                        <div class="bar" style="height:20px"></div><div class="bar" style="height:20px"></div><div class="bar" style="height:20px"></div><div class="bar" style="height:20px"></div><div class="bar" style="height:20px"></div>
                    </div>
                </div>
                <div class="card">
                    <div class="flex-row"><span>words mastered</span><span>248</span></div><div class="progress-bar"><div class="progress-fill" style="width:62%"></div></div>
                    <div class="flex-row"><span>quizzes passed</span><span>32</span></div><div class="progress-bar"><div class="progress-fill" style="width:80%"></div></div>
                    <div style="margin-top:8px">${icons.chart} +18% this month</div>
                </div>
                <div class="card"><span class="badge">achievement</span> <p>🔥 7 day streak</p>${icons.check}</div>
            `;
        }

        function renderSettings() {
            titleEl.innerText = 'Settings';
            return `
                <div class="card">
                    <h4>Appearance</h4>
                    <div class="theme-toggle">
                        <button class="theme-btn ${!darkMode ? 'active' : ''}" id="lightModeBtn">Light</button>
                        <button class="theme-btn ${darkMode ? 'active' : ''}" id="darkModeBtn">Dark</button>
                    </div>
                </div>
                <div class="card">
                    <div class="lesson-item flex-row"><span>Profile</span> > </div>
                    <div class="lesson-item flex-row"><span>Notifications</span> > </div>
                    <div class="lesson-item flex-row"><span>Language</span> English</div>
                </div>
            `;
        }

        function renderScreen(screen) {
            if (screen === 'onboarding') screenDiv.innerHTML = renderOnboarding();
            else if (screen === 'home') screenDiv.innerHTML = renderHome();
            else if (screen === 'learn') screenDiv.innerHTML = renderLearn();
            else if (screen === 'progress') screenDiv.innerHTML = renderProgress();
            else if (screen === 'settings') screenDiv.innerHTML = renderSettings();

            // reattach nav active
            navItems.forEach(item => {
                const tab = item.dataset.tab;
                if ((screen === 'onboarding' && tab==='home') || screen === tab) {
                    if (screen==='onboarding' && tab==='home') {} else
                    item.classList.add('active');
                } else item.classList.remove('active');
            });
            if (screen==='onboarding') { // highlight home as active
                document.querySelector('[data-tab="home"]').classList.add('active');
            }

            // bind events
            if (screen==='onboarding') {
                document.getElementById('startBtn')?.addEventListener('click', ()=>{ currentScreen='home'; renderScreen('home'); });
                document.getElementById('privacyLink')?.addEventListener('click', ()=>showModal('Privacy Policy','We value your privacy. No data sharing.'));
                document.getElementById('termsLink')?.addEventListener('click', ()=>showModal('Terms of Service','Use VocabVault for personal learning only.'));
            }
            if (screen==='home') {
                document.getElementById('contLearn')?.addEventListener('click', ()=>{ currentScreen='learn'; renderScreen('learn'); });
            }
            if (screen==='learn') {
                document.getElementById('practiceStart')?.addEventListener('click', ()=>showModal('Practice','Starting vocabulary drill!'));
            }
            if (screen==='settings') {
                document.getElementById('lightModeBtn')?.addEventListener('click', ()=>setTheme(false));
                document.getElementById('darkModeBtn')?.addEventListener('click', ()=>setTheme(true));
            }
        }

        // navigation
        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                const tab = item.dataset.tab; // home,learn,progress,settings
                currentScreen = tab;
                renderScreen(tab);
            });
        });

        // profile click -> settings
        profileBtn.addEventListener('click', ()=>{
            currentScreen = 'settings';
            renderScreen('settings');
        });

        // init onboarding
        renderScreen('onboarding');

        // ------ screenshot (SHIFT+W) ------
        document.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                const canvas = document.getElementById('screenshot-canvas');
                const ctx = canvas.getContext('2d');
                // simple dom canvas capture via html2canvas? we don't have library, but we can simulate by drawing background
                // for prototype, we capture via simple alert and simulate filename.
                // But requirement: must be sequential png. We'll simulate by producing dummy download.
                // since we can't easily render full dom to canvas without external lib, we generate dummy blobs and number.
                let seq = 1;
                if (darkMode) seq = 6;
                else {
                    // determine from currentScreen? but spec: sequential 1..5 for light, 6 for dark
                    // we just increment internally
                    if (!window.__ssCount) window.__ssCount = 1;
                    seq = window.__ssCount;
                    window.__ssCount = (window.__ssCount % 5) + 1;
                    if (darkMode) seq = 6;
                }
                // fake canvas: fill with phone background + text for demonstration
                ctx.fillStyle = darkMode ? '#0F172A' : '#F8FAFC';
                ctx.fillRect(0,0,360,780);
                ctx.fillStyle = darkMode ? '#E2E8F0' : '#0F172A';
                ctx.font = 'bold 24px Inter';
                ctx.fillText('VocabVault', 40,200);
                ctx.fillStyle = '#2563EB';
                ctx.fillText('screenshot', 50,300);
                // trigger download
                canvas.toBlob(blob => {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = seq + '.png';
                    a.click();
                });
            }
        });

        // expose for later modals etc
        window.showModal = showModal;
    })();
</script>
