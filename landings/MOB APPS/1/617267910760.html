```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Brain · 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            /* light mode (default) */
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary-blue: #2563EB;
            --secondary-blue: #1E40AF;
            --accent-blue: #38BDF8;
            --icon-inactive: #94A3B8;
            --progress-bg: #E2E8F0;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.03);
            --header-bg: rgba(255,255,255,0.8);
            --bottom-nav-bg: #FFFFFF;
        }

        body.dark {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary-blue: #3B82F6;
            --secondary-blue: #2563EB;
            --accent-blue: #38BDF8;
            --icon-inactive: #64748B;
            --progress-bg: #334155;
            --shadow-sm: 0 8px 16px rgba(0,0,0,0.4);
            --header-bg: rgba(15,23,42,0.9);
            --bottom-nav-bg: #1E293B;
        }

        body {
            background: #1a1e2b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg-primary);
            border-radius: 44px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2c313b;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background-color 0.2s;
        }

        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: none;
            background: var(--bg-primary);
            transition: background 0.2s;
        }

        .app-screen::-webkit-scrollbar {
            display: none;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px 8px;
            background: transparent;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-light);
        }

        .header-left h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .profile-icon {
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            transition: background 0.2s;
        }
        .profile-icon:hover { background: var(--border-light); }

        /* bottom navigation */
        .bottom-nav {
            height: 70px;
            background: var(--bottom-nav-bg);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 4px 8px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex: 1;
            cursor: pointer;
            transition: transform 0.15s ease;
            padding: 8px 0;
            border-radius: 20px;
            background: transparent;
        }

        .nav-item.active {
            background: rgba(37, 99, 235, 0.08);
            transform: scale(1.02);
        }

        .nav-icon {
            width: 26px;
            height: 26px;
            transition: all 0.15s;
        }

        .nav-item.active .nav-icon {
            transform: scale(1.15);
        }

        .nav-label {
            font-size: 11px;
            font-weight: 500;
            transition: color 0.15s;
        }

        .nav-item.active .nav-label {
            color: var(--primary-blue);
            font-weight: 600;
        }

        /* cards & common */
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 18px 16px;
            margin: 12px 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }

        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            background: var(--accent-blue);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 13px;
        }

        .btn-primary {
            background: var(--primary-blue);
            border: none;
            color: white;
            font-weight: 600;
            padding: 16px 24px;
            border-radius: 60px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 8px 16px -6px var(--primary-blue);
            transition: 0.1s;
            width: 100%;
        }
        .btn-primary:active { transform: scale(0.98); background: var(--secondary-blue); }

        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 20px;
            margin: 8px 0;
        }
        .progress-fill {
            width: 60%;
            height: 8px;
            background: var(--primary-blue);
            border-radius: 20px;
            transition: width 0.3s;
        }

        /* modal */
        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal.hidden { display: none; }
        .modal-content {
            background: var(--bg-card);
            width: 280px;
            padding: 24px;
            border-radius: 36px;
            color: var(--text-primary);
            text-align: center;
            border: 1px solid var(--border-light);
        }
        .modal-content button {
            margin-top: 16px;
            background: var(--primary-blue);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
        }

        /* onboarding svg */
        .big-logo svg {
            width: 64px;
            height: 64px;
            stroke: var(--primary-blue);
            stroke-width: 2;
            fill: none;
        }
        .small-link {
            color: var(--text-secondary);
            text-decoration: underline;
            font-size: 14px;
            cursor: pointer;
            margin: 0 10px;
        }

        /* settings toggles */
        .toggle-switch {
            width: 44px;
            height: 24px;
            background: var(--icon-inactive);
            border-radius: 40px;
            position: relative;
            cursor: pointer;
        }
        .toggle-switch::after {
            content: '';
            width: 20px; height: 20px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: 0.15s;
        }
        body.dark .toggle-switch::after { left: 22px; }
        body.dark .toggle-switch { background: var(--primary-blue); }

        /* chart dummy */
        .chart-row {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 80px;
            margin: 12px 0;
        }
        .bar {
            width: 20px;
            background: var(--primary-blue);
            border-radius: 12px 12px 4px 4px;
            transition: height 0.3s;
        }

        /* icon style */
        .icon-stroke { stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
</head>
<body>
    <div class="phone" id="phoneContainer">
        <!-- main app view (screen + bottom nav) -->
        <div class="app-screen" id="appScreen">
            <!-- dynamic header and content injected via JS -->
        </div>
        <!-- fixed bottom nav -->
        <div class="bottom-nav" id="bottomNav">
            <div class="nav-item" data-tab="home">
                <span class="nav-icon" id="icon-home"></span>
                <span class="nav-label">Home</span>
            </div>
            <div class="nav-item" data-tab="learn">
                <span class="nav-icon" id="icon-learn"></span>
                <span class="nav-label">Learn</span>
            </div>
            <div class="nav-item" data-tab="progress">
                <span class="nav-icon" id="icon-progress"></span>
                <span class="nav-label">Progress</span>
            </div>
            <div class="nav-item" data-tab="settings">
                <span class="nav-icon" id="icon-settings"></span>
                <span class="nav-label">Settings</span>
            </div>
        </div>
    </div>

    <!-- modal for privacy/terms -->
    <div class="modal hidden" id="modalOverlay"><div class="modal-content" id="modalContent">...</div></div>

    <script>
        (function() {
            // ---------- ICON SVG system (inline, same style) ----------
            const icons = {
                home: `<svg viewBox="0 0 24 24" class="icon-stroke"><path d="M5 12l7-7 7 7v7h-5v-5h-4v5H5z"/></svg>`,
                learn: `<svg viewBox="0 0 24 24" class="icon-stroke"><path d="M2 3h6a4 4 0 014 4v14H3a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M22 3h-6a4 4 0 00-4 4v14h7a1 1 0 001-1V4a1 1 0 00-1-1z"/></svg>`,
                progress: `<svg viewBox="0 0 24 24" class="icon-stroke"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>`,
                settings: `<svg viewBox="0 0 24 24" class="icon-stroke"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a2 2 0 00.7-2.7l-1-1.7a2 2 0 00-2.7-.7L16 10"/><path d="M4.6 9A2 2 0 004 11.7l1 1.7a2 2 0 002.7.7L8 14"/><path d="M9 4.6A2 2 0 0111.7 4l1.7 1a2 2 0 01.7 2.7L14 8"/><path d="M15 19.4a2 2 0 01-2.7.7l-1.7-1a2 2 0 01-.7-2.7L10 16"/></svg>`,
                profile: `<svg viewBox="0 0 24 24" class="icon-stroke"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
                lesson: `<svg viewBox="0 0 24 24" class="icon-stroke"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>`,
                chart: `<svg viewBox="0 0 24 24" class="icon-stroke"><path d="M21 12v8a1 1 0 01-1 1H4a1 1 0 01-1-1V4a1 1 0 011-1h8"/><path d="M15 9l5-5M16 4h4v4"/></svg>`,
                flashcards: `<svg viewBox="0 0 24 24" class="icon-stroke"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><path d="M8 7h8M8 12h6M8 17h4"/></svg>`,
                play: `<svg viewBox="0 0 24 24" class="icon-stroke"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4V8z"/></svg>`,
                check: `<svg viewBox="0 0 24 24" class="icon-stroke"><path d="M20 6L9 17l-5-5"/></svg>`
            };

            function setIcon(elementId, iconName, color = 'currentColor') {
                const el = document.getElementById(elementId);
                if (el) el.innerHTML = icons[iconName] || icons.home;
            }

            // ---------- state ----------
            let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
            let theme = 'light'; // light/dark
            let screenshotCounter = 0;

            // ---------- render main content (without bottom nav) ----------
            function renderScreen(screenName) {
                const screenEl = document.getElementById('appScreen');
                let headerTitle = '';
                if (screenName === 'onboarding') headerTitle = 'Welcome';
                else if (screenName === 'home') headerTitle = 'Dashboard';
                else if (screenName === 'learn') headerTitle = 'Math Drills';
                else if (screenName === 'progress') headerTitle = 'Your stats';
                else if (screenName === 'settings') headerTitle = 'Settings';

                const profileIconHtml = `<span class="profile-icon" id="profileBtn">${icons.profile}</span>`;

                let contentHtml = '';

                // ---- ONBOARDING ----
                if (screenName === 'onboarding') {
                    contentHtml = `
                        <div class="header">
                            <div class="header-left"><h1>🧮 Math Brain</h1></div>
                            <div>${profileIconHtml}</div>
                        </div>
                        <div class="card" style="text-align:center; margin-top:40px;">
                            <div class="big-logo">${icons.learn}</div>
                            <h2 style="font-size:32px; margin:10px 0 4px;">Math Brain</h2>
                            <p style="font-size:16px; color:var(--text-secondary);">train your mental math</p>
                            <p style="margin:16px 0; color:var(--text-primary);">Daily 5‑minute workouts. Boost speed & logic.</p>
                            <button class="btn-primary" id="startOnboarding">Get Started</button>
                            <div style="margin:24px 0 12px;">
                                <span class="small-link" id="privacyLink">Privacy Policy</span> · 
                                <span class="small-link" id="termsLink">Terms of Service</span>
                            </div>
                        </div>
                    `;
                } else {
                    // standard header for other screens
                    contentHtml = `
                        <div class="header">
                            <div class="header-left"><h1>${headerTitle}</h1></div>
                            <div>${profileIconHtml}</div>
                        </div>
                    `;
                    // screen-specific body
                    if (screenName === 'home') {
                        contentHtml += `
                            <div class="card">
                                <div class="flex-row"><span class="badge">daily streak 7 🔥</span><span>➕ mental math</span></div>
                                <h3>Today’s goal: 30 problems</h3>
                                <div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div>
                                <div style="display:flex; gap:10px; margin-top:16px;">
                                    <span>${icons.flashcards} 3 lessons</span>
                                    <span>${icons.play} practice</span>
                                </div>
                            </div>
                            <div class="card flex-row"><span>${icons.lesson} Next: Multiplication</span><span>▶️ start</span></div>
                            <div class="card">
                                <span style="display:flex; gap:12px;">${icons.chart} weekly activity</span>
                                <div class="chart-row"><div class="bar" style="height:40px"></div><div class="bar" style="height:70px"></div><div class="bar" style="height:50px"></div><div class="bar" style="height:80px"></div><div class="bar" style="height:30px"></div></div>
                            </div>
                        `;
                    } else if (screenName === 'learn') {
                        contentHtml += `
                            <div class="card flex-row"><span>➕ Addition · 12 ex</span><span>${icons.play} start</span></div>
                            <div class="card flex-row"><span>➖ Subtraction · 8 ex</span><span>${icons.play}</span></div>
                            <div class="card flex-row"><span>✖️ Multiplication · 15 ex</span><span>${icons.play}</span></div>
                            <div class="card flex-row"><span>🧩 Logic puzzles</span><span>${icons.flashcards}</span></div>
                            <div class="card" style="text-align:center;">✨ new: square roots ✨</div>
                        `;
                    } else if (screenName === 'progress') {
                        contentHtml += `
                            <div class="card"><h3>📊 accuracy 84%</h3><div class="progress-bar"><div class="progress-fill" style="width:84%"></div></div></div>
                            <div class="card flex-row"><span>${icons.chart} problems solved</span><span>1,284</span></div>
                            <div class="card"><span>🏅 5 achievements</span> <span>⚡ speed demon</span></div>
                            <div class="card">${icons.flashcards} mastery: 3 topics</div>
                        `;
                    } else if (screenName === 'settings') {
                        contentHtml += `
                            <div class="card flex-row">
                                <span>🌙 Dark mode</span>
                                <span class="toggle-switch" id="themeToggle"></span>
                            </div>
                            <div class="card">Sound effects (coming)</div>
                            <div class="card">Reminders</div>
                            <div class="card small-link" id="privacyLinkSettings">Privacy</div>
                            <div class="card small-link" id="termsLinkSettings">Terms</div>
                        `;
                    }
                }

                // keep bottom nav fixed outside, only replace inner content (header+body)
                // but bottom nav stays, we just refresh scrollable part
                const oldContent = screenEl.innerHTML;
                // rebuild keeping bottom nav out? bottom-nav is separate, screenEl contains everything above bottom-nav
                // our structure: .app-screen holds header+cards, bottom-nav is sibling
                screenEl.innerHTML = contentHtml;

                // re-attach profile click
                document.querySelectorAll('#profileBtn, .profile-icon').forEach(el => {
                    if (el) el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        currentScreen = 'settings';
                        renderScreen('settings');
                        updateActiveNav('settings');
                    });
                });

                // onboarding buttons
                if (screenName === 'onboarding') {
                    document.getElementById('startOnboarding')?.addEventListener('click', ()=>{
                        currentScreen = 'home';
                        renderScreen('home');
                        updateActiveNav('home');
                    });
                    document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy Policy','We respect your data. (demo)'));
                    document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms of Service','Math Brain 2026 demo terms.'));
                }
                // privacy/terms in settings
                if (screenName === 'settings') {
                    document.getElementById('privacyLinkSettings')?.addEventListener('click', ()=> showModal('Privacy Policy','We respect your data.'));
                    document.getElementById('termsLinkSettings')?.addEventListener('click', ()=> showModal('Terms of Service','Math Brain 2026 demo.'));
                    document.getElementById('themeToggle')?.addEventListener('click', toggleTheme);
                }

                // extra interactions: start practice from home etc. (tiny simulation)
                document.querySelectorAll('.flex-row span:last-child, .card .flex-row span').forEach(el => {
                    if (el.textContent.includes('start') || el.textContent.includes('▶')) {
                        el.addEventListener('click', (e) => {
                            e.stopPropagation();
                            alert('practice started! (simulated)');
                        });
                    }
                });
            }

            // update bottom nav active & icons color
            function updateActiveNav(activeTab) {
                const navs = document.querySelectorAll('.nav-item');
                const tabs = ['home','learn','progress','settings'];
                navs.forEach((item, idx) => {
                    const tab = tabs[idx];
                    const iconSpan = item.querySelector('.nav-icon');
                    const label = item.querySelector('.nav-label');
                    if (tab === activeTab) {
                        item.classList.add('active');
                        if (iconSpan) iconSpan.style.color = '#2563EB';
                        if (label) label.style.color = '#2563EB';
                    } else {
                        item.classList.remove('active');
                        if (iconSpan) iconSpan.style.color = '#94A3B8';
                        if (label) label.style.color = '#94A3B8';
                    }
                    // set icon svg
                    if (iconSpan) {
                        iconSpan.innerHTML = icons[tab] || icons.home;
                    }
                });
            }

            // modal
            function showModal(title, text) {
                const modal = document.getElementById('modalOverlay');
                const content = document.getElementById('modalContent');
                content.innerHTML = `<h3>${title}</h3><p>${text}</p><button id="closeModalBtn">OK</button>`;
                modal.classList.remove('hidden');
                document.getElementById('closeModalBtn').addEventListener('click', ()=> modal.classList.add('hidden'));
            }
            document.getElementById('modalOverlay')?.addEventListener('click', (e) => {
                if(e.target === document.getElementById('modalOverlay')) e.target.classList.add('hidden');
            });

            // theme toggle
            function toggleTheme() {
                document.body.classList.toggle('dark');
                theme = document.body.classList.contains('dark') ? 'dark' : 'light';
                // re-render current screen to update colors (already variables)
                renderScreen(currentScreen);
                updateActiveNav(currentScreen);
            }

            // bottom navigation listeners
            function initBottomNav() {
                const navItems = document.querySelectorAll('.nav-item');
                navItems.forEach(item => {
                    item.addEventListener('click', (e) => {
                        const tab = item.dataset.tab; // home, learn, progress, settings
                        if (tab === 'home' || tab === 'learn' || tab === 'progress' || tab === 'settings') {
                            currentScreen = tab;
                            renderScreen(tab);
                            updateActiveNav(tab);
                        }
                    });
                });
            }

            // ---------- screenshot (shift+w) ----------
            window.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    const phone = document.getElementById('phoneContainer');
                    // simplistic: in real world would use html2canvas but here we just simulate naming.
                    // we just log sequence.
                    screenshotCounter++;
                    let filename = screenshotCounter + '.png';
                    if (theme === 'dark' && screenshotCounter === 1) filename = '6.png'; // but shift+w multiple times
                    // better: always capture based on screen? but spec: if dark mode enabled -> 6.png for that capture
                    // simpler: for demo, we fake it by alerting.
                    alert(`📸 Screenshot saved as ${theme==='dark'?'6.png':screenshotCounter+'.png'} (simulated)`);
                }
            });

            // initial render: onboarding
            renderScreen('onboarding');
            updateActiveNav(''); // no active tab at onboarding
            initBottomNav();

            // set profile icon after render (it's inside header, but profile icon already)
            // also add dummy click for play buttons etc.
            window.showModal = showModal;

            // final touches: set initial icons for bottom nav (colors grey)
            document.querySelectorAll('.nav-item').forEach((item, idx) => {
                const tab = item.dataset.tab;
                const iconSpan = item.querySelector('.nav-icon');
                if (iconSpan) { iconSpan.innerHTML = icons[tab]; iconSpan.style.color = '#94A3B8'; }
            });
        })();
    </script>
</body>
</html>
