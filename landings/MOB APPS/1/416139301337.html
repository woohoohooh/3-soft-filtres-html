    .profile-btn {
      background: none;

      border-radius: 20px;

      fill: var(--inactive);
    }
    .nav-item.active {

      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;

    }

      background: var(--bg);

      padding: 14px;
      text-align: center;
    }
    .btn {
      background: var(--primary);
      color: white;
      font-weight: 600;
      padding: 16px 24px;
      border: none;
      border-radius: 60px;

      cursor: pointer;

    .link-row {
      display: flex;

      gap: 24px;

    }
    .text-link {
      background: none;
      border: none;
      color: var(--inactive);
      text-decoration: underline;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .lesson-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .lesson-item:last-child { border: none; }
    .icon-bg {
      background: rgba(56,189,248,0.15);

      border-radius: 18px;
      line-height: 0;
    }
    .modal-overlay {
      position: fixed;

      background: rgba(0,0,0,0.5);

    .modal-card {
      background: var(--card);

    .theme-toggle {
      display: flex;

      justify-content: space-between;
      margin-top: 24px;
    }
  </style>
</head>

<script>
(function() {
  // ----- Icon system (reusable inline) -----
  // not needed separately, all icons inline in html.

  const screens = {
    onboarding: { name: 'Onboarding', render: () => `
      <div class="card" style="text-align: center; margin-top: 20px;">
        <svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="1.5" style="margin:0 auto 12px;"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <h1 style="font-size: 2.4rem; font-weight:800; letter-spacing:-.02em;">CodeMentor</h1>

          <button class="text-link" id="privacyLink">Privacy Policy</button>
          <button class="text-link" id="termsLink">Terms of Service</button>
        </div>
      </div>
    ` },
    home: { name: 'Home', render: () => `
      <div class="card">
        <div class="flex-row"><span class="badge">🔥 7 day streak</span><span style="margin-left:auto;">👋 Alex</span></div>
        <h3 style="margin: 16px 0 8px;">Continue where you left</h3>
        <div class="lesson-item"><div class="icon-bg"><svg width="24" height="24" viewBox="0 0 24 24" stroke="var(--primary)" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div><div><p><strong>Loops & conditions</strong></p><small>75% completed</small></div></div>
        <div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div>
        <div style="display:flex; gap:8px; margin-top:20px;"><button class="btn" style="padding:12px;" id="practiceHomeBtn">▶️ Practice now</button></div>
      </div>
      <div class="card"><h4>Today's challenge</h4><p>Write a function that returns the sum of a list.</p><button class="btn" style="margin-top:16px; padding:12px;" id="startChallenge">Start</button></div>
      <div class="stat-grid"><div class="stat-cell">🏆<br><strong>123</strong><br>XP today</div><div class="stat-cell">📊<br><strong>45min</strong><br>learn time</div></div>
    ` },
    learn: { name: 'Learn', render: () => `
      <div class="card"><h3>Python basics</h3><div class="lesson-item"><div class="icon-bg">📘</div><div><p>Variables & Data types</p><small>5 min</small></div></div><div class="lesson-item"><div class="icon-bg">📗</div><div><p>Lists & tuples</p><small>8 min</small></div></div><div class="lesson-item"><div class="icon-bg">📙</div><div><p>Functions</p><small>12 min</small></div><div class="badge" style="margin-left:auto;">NEW</div></div><div class="lesson-item"><div class="icon-bg">🔁</div><div><p>Loops</p><small>10 min</small></div></div></div>
      <div class="card"><h4>Flashcards</h4><div class="flex-row" style="justify-content:center; gap:20px;"><span>⚡ 'list.append()'</span><span>🔹 adds element</span></div></div>
    ` },
    progress: { name: 'Progress', render: () => `
      <div class="card"><h3>Weekly activity</h3><div style="display:flex; gap:6px; justify-content:space-between; margin:24px 0;"><div style="height:40px; width:22px; background:#2563EB; border-radius:12px;"></div><div style="height:70px; width:22px; background:#2563EB;"></div><div style="height:50px; width:22px; background:#94A3B8;"></div><div style="height:90px; width:22px; background:#2563EB;"></div><div style="height:65px; width:22px; background:#2563EB;"></div><div style="height:110px; width:22px; background:#2563EB;"></div><div style="height:30px; width:22px; background:#94A3B8;"></div></div><div class="progress-bar"><div class="progress-fill" style="width:68%"></div></div><p style="margin-top:8px;">68% of weekly goal</p></div>
      <div class="stat-grid"><div class="stat-cell">🏅 rank: 4</div><div class="stat-cell">⭐ 2300 XP</div><div class="stat-cell">📘 12 lessons</div><div class="stat-cell">⚡ 8h</div></div>
      <div class="card"><h4>Achievements</h4>🏅🏅🏅 Early bird · 5 days streak · Code master</div>
    ` },
    settings: { name: 'Settings', render: () => `
      <div class="card"><h3>Profile</h3><div class="lesson-item"><svg width="32" stroke="var(--text)"><circle cx="16" cy="10" r="4"/><path d="M28 22v2a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-2"/></svg><span><strong>Alex Chen</strong><br>alex@pythonist</span></div></div>
      <div class="card"><h4>Appearance</h4><div class="theme-toggle"><span>Dark mode</span><label><input type="checkbox" id="darkModeToggle">  Enable</label></div></div>
      <div class="card"><h4>Reminders</h4><p>Daily goal: 20 min</p></div>
      <div class="card"><h4>About</h4><p>CodeMentor v1.0 · 2026</p></div>
    ` }
  };

  // state
  let currentScreen = 'onboarding';
  let darkMode = false;
  const modalHandlers = {};

  // helpers
  function renderScreen() {
    const contentDiv = document.getElementById('screenContent');
    const titleEl = document.getElementById('screenTitle');
    const screen = screens[currentScreen];
    if (screen) {
      titleEl.innerText = screen.name;
      contentDiv.innerHTML = screen.render();
    }
    // update active nav
    document.querySelectorAll('.nav-item').forEach(btn => {
      const nav = btn.dataset.nav;
      if (nav === currentScreen) btn.classList.add('active');
      else btn.classList.remove('active');
    });
    attachScreenEvents();
  }

  function attachScreenEvents() {
    if (currentScreen === 'onboarding') {
      document.getElementById('getStartedBtn')?.addEventListener('click', () => { currentScreen = 'home'; renderScreen(); });
      document.getElementById('privacyLink')?.addEventListener('click', () => showModal('Privacy Policy', 'We keep your data safe and never sell it.'));
      document.getElementById('termsLink')?.addEventListener('click', () => showModal('Terms of Service', 'Use = learning. Be nice.'));
    }
    if (currentScreen === 'home') {
      document.getElementById('practiceHomeBtn')?.addEventListener('click', ()=>{ currentScreen='learn'; renderScreen(); });
      document.getElementById('startChallenge')?.addEventListener('click', ()=>{ alert('Challenge started! (simulated)'); });
    }
    if (currentScreen === 'settings') {
      const cb = document.getElementById('darkModeToggle');
      if (cb) {
        cb.checked = darkMode;
        cb.addEventListener('change', (e) => {
          darkMode = e.target.checked;
          document.body.classList.toggle('dark', darkMode);
          localStorage.setItem('codementorDark', darkMode);
        });
      }
    }
    // progress bar animation on progress
    if (currentScreen === 'progress') {
      setTimeout(() => {
        document.querySelectorAll('.progress-fill').forEach(el => { if(el.style.width === '0%') el.style.width = '42%'; });
      }, 50);
    }
  }

  function showModal(title, text) {
    const modal = document.getElementById('modalOverlay');
    document.getElementById('modalContent').innerHTML = `<h3>${title}</h3><p style="margin:12px 0;">${text}</p><button class="btn" id="closeModal">OK</button>`;
    modal.classList.remove('hidden');
    document.getElementById('closeModal').addEventListener('click', () => modal.classList.add('hidden'));
  }

  // navigation
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const nav = e.currentTarget.dataset.nav;
      if (nav && screens[nav]) {
        currentScreen = nav;
        renderScreen();
      }
    });
  });

  document.getElementById('profileIconBtn').addEventListener('click', () => {
    currentScreen = 'settings';
    renderScreen();
  });

  // dark mode init
  const saved = localStorage.getItem('codementorDark');
  if (saved === 'true') { darkMode = true; document.body.classList.add('dark'); }

  // SHIFT+W screenshot
  window.addEventListener('keydown', (e) => {
    if (e.shiftKey && e.key === 'W') {
      e.preventDefault();
      import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
        const phone = document.getElementById('phoneFrame');
        html2canvas(phone, { scale: 2, backgroundColor: null }).then(canvas => {
          const link = document.createElement('a');
          const darkSuffix = darkMode ? '6' : (() => { 
            const map = { onboarding:1, home:2, learn:3, progress:4, settings:5 };
            return map[currentScreen] || 1;
          })();
          link.download = `${darkSuffix}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        });
      }).catch(() => alert('html2canvas failed to load, but screenshot simulated.'));
    }
  });

  // initial render
  renderScreen();

  // modal close outside
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target.classList.contains('modal-overlay')) e.target.classList.add('hidden');
  });

})();
</script>
</body>
</html>
