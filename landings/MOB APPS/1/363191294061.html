;

        }

        .screen-content {

        }

        }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;

        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;

            padding: 6px 12px;

            color: var(--nav-inactive);
            fill: var(--nav-inactive);
        }
        .nav-item.active {
            background: rgba(37, 99, 235, 0.08);

            fill: var(--primary);

        }

        }

        }

        }

            position: absolute;

            align-items: center;

</head>

<script>
    (function() {
        // ----- theme & container -----

        const screenDiv = document.getElementById('screenContainer');
        const navItems = document.querySelectorAll('.nav-item');

        // ----- global state -----
        let currentScreen = 'onboarding'; // 'onboarding', 'home', 'learn', 'progress', 'settings'
        let darkMode = false;
        let screenshotCounter = 1;

        // ----- icon system (inline, outline 2px) -----
        const icons = {
            home: '<svg viewBox="0 0 24 24"><path d="M15 21v-6a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v6"/><path d="M3 10a2 2 0 0 1 .8-1.6l7-5.2a2 2 0 0 1 2.4 0l7 5.2A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',

            settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a2 2 0 0 0 .4-2.2l-1.2-2.1a2 2 0 0 0-1.7-1H7a2 2 0 0 0-1.7 1L4 12.8a2 2 0 0 0 .4 2.2L8 19a2 2 0 0 0 1.4.6h5.2a2 2 0 0 0 1.4-.6z"/><path d="M12 2v2"/><path d="M12 22v-2"/></svg>',

            updateHeaderTitle();

            document.getElementById('app').appendChild(overlay);
            document.getElementById('closeModal').addEventListener('click', () => overlay.remove());
        }

                renderScreen();

            screenDiv.innerHTML = `

            screenDiv.innerHTML = `

                renderSettings(); // re-render to reflect toggle
            });
            document.getElementById('resetOnboarding')?.addEventListener('click', ()=>{
                currentScreen = 'onboarding';
                setActiveTab(null);

            });

                if (!isDark && screenshotCounter <=5) {
                    // use number
                } else if (isDark) filename='6.png';

    })();
