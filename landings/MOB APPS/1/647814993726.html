```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSprout · Python Playground</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* CSS variables – light mode default */
        :root {
            --bg-page: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --text-muted: #64748B;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive-icon: #94A3B8;
            --border-light: #E2E8F0;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            --progress-bg: #E2E8F0;
            --badge-bg: #DBEAFE;
        }

        body.dark {
            --bg-page: #0F172A;
            --card-bg: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --text-muted: #94A3B8;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive-icon: #64748B;
            --border-light: #334155;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
            --progress-bg: #334155;
            --badge-bg: #1E3A5F;
        }

        body {
            background: #1a1f2b; /* outer background to frame the phone */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg-page);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 25px 60px -15px rgba(0,20,40,0.6), 0 0 0 10px #2c3a4b;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
            color: var(--text-primary);
        }

        /* main content area (flex column, header + content + bottom nav) */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 16px 8px;
        }
        .header h2 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }
        .profile-btn:hover { transform: scale(1.05); }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--card-bg);
            border-top: 1px solid var(--border-light);
            padding: 8px 12px 12px;
            margin-top: auto;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px 10px 4px;
            border-radius: 20px;
            transition: all 0.15s ease;
            color: var(--inactive-icon);
            fill: var(--inactive-icon);
            gap: 4px;
            flex: 1;
            max-width: 70px;
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            background: rgba(37, 99, 235, 0.08);
            transform: scale(1.05);
        }
        .nav-item.active svg {
            stroke: var(--primary);
        }
        .nav-item svg {
            stroke: currentColor;
            stroke-width: 2px;
            stroke-linecap: round;
            stroke-linejoin: round;
            width: 24px;
            height: 24px;
            transition: stroke 0.15s;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
        }

        /* main screen content (dynamic) */
        .screen-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive-icon) transparent;
        }

        /* cards, elements */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }
        .flex-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .icon-badge {
            display: inline-flex;
            align-items: center;
            background: var(--badge-bg);
            border-radius: 30px;
            padding: 4px 10px;
            font-size: 13px;
            font-weight: 500;
            color: var(--primary-dark);
        }
        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 30px;
            margin: 12px 0 6px;
            overflow: hidden;
        }
        .progress-fill {
            height: 8px;
            background: var(--primary);
            width: 0%;
            border-radius: 30px;
            transition: width 0.3s ease;
        }
        .btn {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 20px;
            border-radius: 40px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
            text-align: center;
        }
        .btn-small {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
        }
        .outline-btn {
            background: transparent;
            border: 1.5px solid var(--primary);
            color: var(--primary);
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 30px;
        }

        /* modal */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: var(--card-bg);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            color: var(--text-primary);
        }
        .modal-close {
            margin-top: 16px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 30px;
            width: 100%;
            font-weight: 600;
        }

        /* onboarding specific */
        .logo-big {
            background: var(--primary);
            width: 64px; height: 64px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .tagline {
            font-size: 22px;
            font-weight: 700;
            margin: 8px 0 4px;
        }
        .legal-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 24px 0 8px;
            font-size: 13px;
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
        }

        /* hidden screenshot canvas */
        #screenshot-canvas {
            display: none;
        }
    </style>
</head>
<body>
    <div class="phone" id="phoneContainer">
        <div class="app-container" id="app">
            <!-- header will be injected per screen -->
            <div id="header-placeholder"></div>

            <!-- main screen content -->
            <div id="screen-content" class="screen-content"></div>

            <!-- bottom navigation (static) -->
            <div class="bottom-nav" id="bottomNav">
                <button class="nav-item" data-tab="home">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M5 12l-2 2 9 9 9-9-2-2-7 5V3H5v14l-2-2z"/></svg>
                    <span>Home</span>
                </button>
                <button class="nav-item" data-tab="learn">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M12 4L4 8l8 4 8-4-8-4zM4 16l8 4 8-4M4 12l8 4 8-4"/></svg>
                    <span>Learn</span>
                </button>
                <button class="nav-item" data-tab="progress">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/></svg>
                    <span>Progress</span>
                </button>
                <button class="nav-item" data-tab="settings">
                    <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    <span>Settings</span>
                </button>
            </div>
        </div>

        <!-- modal placeholders -->
        <div id="privacyModal" class="modal"><div class="modal-card"><h3>Privacy</h3><p>Your data stays local. No tracking.</p><button class="modal-close" onclick="closeModal('privacyModal')">OK</button></div></div>
        <div id="termsModal" class="modal"><div class="modal-card"><h3>Terms</h3><p>Educational use only. Be kind.</p><button class="modal-close" onclick="closeModal('termsModal')">OK</button></div></div>
    </div>

    <canvas id="screenshot-canvas" width="360" height="780"></canvas>
    <script>
        (function(){
            // ---------- icon system (inline svg strings) ----------
            const icons = {
                profile: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
                lesson: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
                chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 16v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2M7 10l3-3 3 3 4-4"/><path d="M17 10V4h-6"/></svg>`,
                flashcards: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>`,
                play: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>`,
                check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg>`,
            };

            // ---------- state ----------
            let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
            let darkMode = false;
            let screenshotCounter = 1;
            const phoneEl = document.getElementById('phoneContainer');

            // ---------- helper functions ----------
            function render() {
                const headerPlace = document.getElementById('header-placeholder');
                const contentDiv = document.getElementById('screen-content');
                let headerHtml = '';
                let contentHtml = '';

                // ----- header (screen title + profile icon) -----
                const titles = {
                    onboarding: 'Welcome', home: 'Dashboard', learn: 'Python Lab', progress: 'Your Stats', settings: 'Settings'
                };
                const screenTitle = titles[currentScreen] || 'CodeSprout';
                headerHtml = `
                    <div class="header">
                        <h2>${screenTitle}</h2>
                        <button class="profile-btn" id="profileBtn">${icons.profile}</button>
                    </div>
                `;

                // ----- screen content -----
                if (currentScreen === 'onboarding') {
                    contentHtml = `
                        <div style="text-align: center; padding-top: 20px;">
                            <div class="logo-big" style="margin: 0 auto 20px;">
                                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                            </div>
                            <div class="tagline">CodeSprout</div>
                            <div style="color: var(--text-secondary); margin: 4px 0 20px;">learn Python · one bite a day</div>
                            <p style="color: var(--text-muted); margin-bottom: 28px;">Bite-sized Python exercises, flashcards, and real‑time progress. Perfect for beginners.</p>
                            <button class="btn" id="getStartedBtn">Get Started</button>
                            <div class="legal-links">
                                <span id="privacyLink">Privacy</span>
                                <span id="termsLink">Terms</span>
                            </div>
                        </div>
                    `;
                } else if (currentScreen === 'home') {
                    contentHtml = `
                        <div class="card">
                            <div class="flex-row"><span class="icon-badge">🔥 12 day streak</span></div>
                            <div style="margin-top:12px;"><strong>Continue where you left:</strong></div>
                            <div class="flex-row" style="justify-content:space-between; margin-top:10px;">
                                <span>Variables & Data types</span> <span>75%</span>
                            </div>
                            <div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div>
                            <button class="btn-small" id="resumeLesson" style="margin-top:6px;">▶ Continue</button>
                        </div>
                        <div class="card">
                            <div style="display:flex; gap:12px; align-items:center;">
                                ${icons.flashcards}
                                <span style="font-weight:600;">Daily flashcards</span>
                            </div>
                            <p style="margin:6px 0;">Review 5 Python keywords</p>
                            <button class="outline-btn" id="startFlashcards">Start</button>
                        </div>
                        <div class="card">
                            <div style="display:flex; gap:12px;">${icons.chart}<span>Recommended</span></div>
                            <p>• Lists & loops<br>• Functions 101<br>• Debugging tips</p>
                        </div>
                    `;
                } else if (currentScreen === 'learn') {
                    contentHtml = `
                        <div class="card">
                            <h4>Beginner</h4>
                            <div class="flex-row">${icons.lesson} <span>Python syntax</span><span style="margin-left:auto;">3/5</span></div>
                            <div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div>
                            <div class="flex-row" style="margin-top:12px;">${icons.lesson} <span>Variables</span><span>✅</span></div>
                            <div class="flex-row">${icons.lesson} <span>Conditionals</span><span>🔒</span></div>
                        </div>
                        <div class="card">
                            <h4>Practice</h4>
                            <div class="flex-row">${icons.play}<span>Code challenge: FizzBuzz</span></div>
                            <button class="btn-small" style="margin-top:10px;">Start</button>
                        </div>
                    `;
                } else if (currentScreen === 'progress') {
                    contentHtml = `
                        <div class="card">
                            <h4>Overall progress</h4>
                            <div style="display:flex; gap:10px; align-items:center;">${icons.chart}<span>42 lessons done</span></div>
                            <div class="progress-bar"><div class="progress-fill" style="width:42%"></div></div>
                        </div>
                        <div class="card">
                            <div style="display:flex; gap:16px;">
                                <div><span style="font-size:24px;">🏆</span><br>3 badges</div>
                                <div><span style="font-size:24px;">⚡</span><br>2 day streak</div>
                                <div><span style="font-size:24px;">⌛</span><br>8h total</div>
                            </div>
                        </div>
                        <div class="card">
                            <span>Weekly activity</span>
                            <div style="display:flex; gap:4px; margin-top:12px;">
                                <div style="width:20px; height:40px; background:var(--primary); border-radius:6px;"></div>
                                <div style="width:20px; height:25px; background:var(--primary); opacity:0.7;"></div>
                                <div style="width:20px; height:55px; background:var(--primary);"></div>
                                <div style="width:20px; height:30px; background:var(--primary); opacity:0.6;"></div>
                                <div style="width:20px; height:48px; background:var(--primary);"></div>
                            </div>
                        </div>
                    `;
                } else if (currentScreen === 'settings') {
                    contentHtml = `
                        <div class="card">
                            <h4>Appearance</h4>
                            <div style="display:flex; align-items:center; gap:16px; margin-top:8px;">
                                <span>🌙 Dark mode</span>
                                <button class="btn-small" id="themeToggle">${darkMode ? 'Light' : 'Dark'}</button>
                            </div>
                        </div>
                        <div class="card">
                            <h4>Profile</h4>
                            <p>Pythonista · joined 2026</p>
                            <button class="outline-btn">Edit</button>
                        </div>
                        <div class="card">
                            <h4>About</h4>
                            <p>CodeSprout v1.0</p>
                        </div>
                    `;
                }

                headerPlace.innerHTML = headerHtml;
                contentDiv.innerHTML = contentHtml;

                // attach profile click
                document.getElementById('profileBtn')?.addEventListener('click', ()=>{
                    currentScreen = 'settings';
                    updateActiveTab('settings');
                    render();
                });

                // specific event listeners
                if (currentScreen === 'onboarding') {
                    document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                        currentScreen = 'home';
                        updateActiveTab('home');
                        render();
                    });
                    document.getElementById('privacyLink')?.addEventListener('click', ()=>openModal('privacyModal'));
                    document.getElementById('termsLink')?.addEventListener('click', ()=>openModal('termsModal'));
                }
                if (currentScreen === 'home') {
                    document.getElementById('resumeLesson')?.addEventListener('click', ()=>alert('📘 Starting lesson: Variables'));
                    document.getElementById('startFlashcards')?.addEventListener('click', ()=>alert('🔁 5 flashcards ready'));
                }
                if (currentScreen === 'settings') {
                    document.getElementById('themeToggle')?.addEventListener('click', ()=>{
                        darkMode = !darkMode;
                        document.body.classList.toggle('dark', darkMode);
                        render();
                    });
                }
            }

            // bottom nav handling
            function updateActiveTab(tabId) {
                document.querySelectorAll('.nav-item').forEach(item => {
                    const tab = item.dataset.tab;
                    if (tab === tabId) item.classList.add('active');
                    else item.classList.remove('active');
                });
            }

            function navigateFromTab(tab) {
                if (tab === 'home') currentScreen = 'home';
                else if (tab === 'learn') currentScreen = 'learn';
                else if (tab === 'progress') currentScreen = 'progress';
                else if (tab === 'settings') currentScreen = 'settings';
                render();
            }

            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const tab = e.currentTarget.dataset.tab;
                    navigateFromTab(tab);
                });
            });

            // modal functions
            window.openModal = (id) => document.getElementById(id).style.display = 'flex';
            window.closeModal = (id) => document.getElementById(id).style.display = 'none';

            // screenshot (SHIFT+W)
            window.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    const phone = document.getElementById('phoneContainer');
                    const canvas = document.getElementById('screenshot-canvas');
                    const ctx = canvas.getContext('2d');
                    import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm').then(module => {
                        const html2canvas = module.default;
                        html2canvas(phone, { scale: 2, backgroundColor: null }).then(canvas2 => {
                            ctx.clearRect(0,0,360,780);
                            ctx.drawImage(canvas2,0,0,360,780);
                            const link = document.createElement('a');
                            const isDark = document.body.classList.contains('dark');
                            let filename = isDark ? '6.png' : (screenshotCounter + '.png');
                            if (!isDark && screenshotCounter<5) { link.download = screenshotCounter+'.png'; screenshotCounter++; }
                            else if (isDark) link.download = '6.png';
                            else link.download = '5.png'; // fallback
                            link.href = canvas.toDataURL('image/png');
                            link.click();
                        });
                    }).catch(()=> alert('html2canvas failed, but shift+w works.'));
                }
            });

            // initial render
            render();
            updateActiveTab('home'); // but current screen is onboarding, so override visually
            // make onboarding active no nav highlight: set none active
            document.querySelectorAll('.nav-item').forEach(i=> i.classList.remove('active'));

            // additional: when onboarding, nav can stay inactive
        })();
    </script>
    <!-- JSON output (Play Store text) -->
    <script>
        console.log(JSON.stringify({
            "1.png": "Start Learning",
            "2.png": "Daily Lessons",
            "3.png": "Practice Skills",
            "4.png": "Track Progress",
            "5.png": "Smart Settings",
            "6.png": "Dark Theme"
        }, null, 2));
    </script>
</body>
</html>
