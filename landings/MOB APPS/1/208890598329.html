```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code daily · Learn Python</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* CSS variables – light mode default */
    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #0F172A;
      --text-light: #334155;
      --border: #E2E8F0;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --inactive: #94A3B8;
      --shadow: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,0,0,0.05);
      --bar-bg: rgba(255,255,255,0.8);
      --backdrop: rgba(0,0,0,0.2);
      --progress-bg: #E2E8F0;
    }

    body.dark {
      --bg: #0F172A;
      --card: #1E293B;
      --text: #E2E8F0;
      --text-light: #CBD5E1;
      --border: #334155;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --inactive: #64748B;
      --shadow: 0 8px 20px rgba(0,0,0,0.5);
      --bar-bg: rgba(30,41,59,0.9);
      --backdrop: rgba(0,0,0,0.6);
      --progress-bg: #334155;
    }

    body {
      background: #0b1120;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background: var(--bg);
      border-radius: 44px;
      box-shadow: 0 30px 50px rgba(0,0,0,0.6), 0 0 0 8px #1e2b3a;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: background 0.2s;
    }

    /* main screen area (flex column, no scroll outside) */
    .app-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--inactive) var(--card);
      padding-bottom: 8px;
    }
    .app-screen::-webkit-scrollbar { width: 4px; }
    .app-screen::-webkit-scrollbar-track { background: var(--card); }
    .app-screen::-webkit-scrollbar-thumb { background: var(--inactive); border-radius: 8px; }

    /* header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 8px;
      background: transparent;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      transition: background 0.1s;
    }
    .profile-btn:hover { background: var(--border); }

    /* bottom nav */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 6px 12px 10px;
      background: var(--bar-bg);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px 0 4px;
      border-radius: 20px;
      transition: all 0.15s ease;
      color: var(--inactive);
      fill: var(--inactive);
    }
    .nav-item.active {
      color: var(--primary);
      fill: var(--primary);
      transform: scale(1.05);
      background: rgba(37,99,235,0.08);
    }
    .nav-item span {
      font-size: 11px;
      font-weight: 500;
      margin-top: 2px;
    }
    .icon {
      width: 24px;
      height: 24px;
      stroke-width: 2px;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* cards, containers */
    .content {
      padding: 8px 16px 16px;
    }
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 20px 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }
    .chip {
      background: var(--accent);
      color: #0F172A;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 40px;
      font-size: 13px;
    }
    .progress-bar {
      height: 8px;
      background: var(--progress-bg);
      border-radius: 20px;
      margin: 12px 0;
    }
    .progress-fill {
      height: 8px;
      background: var(--primary);
      width: 0%;
      border-radius: 20px;
      transition: width 0.3s ease;
    }
    .badge {
      background: var(--accent);
      color: #0F172A;
      border-radius: 40px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
    }
    .btn {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      padding: 16px 24px;
      border-radius: 60px;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(37,99,235,0.2);
      transition: 0.1s;
      width: 100%;
    }
    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--primary);
      color: var(--primary);
      box-shadow: none;
    }
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--backdrop);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-card {
      background: var(--card);
      width: 280px;
      padding: 28px;
      border-radius: 32px;
      text-align: center;
      color: var(--text);
    }
    .hidden { display: none; }
    a { color: var(--primary); text-decoration: none; font-weight: 500; }
    .link-row { display: flex; justify-content: center; gap: 24px; margin-top: 16px; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-item { background: var(--bg); border-radius: 20px; padding: 14px; text-align: center; }
    .value { font-size: 26px; font-weight: 700; color: var(--primary); }
    .label { font-size: 12px; color: var(--text-light); }

    /* onboarding icon row */
    .logo-big {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <!-- header (dynamic via JS) -->
  <div class="header" id="appHeader">
    <h1 id="headerTitle">Onboarding</h1>
    <button class="profile-btn" id="profileBtn">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="var(--text)"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </button>
  </div>

  <!-- main container for screens -->
  <div class="app-screen" id="screenContainer"></div>

  <!-- bottom navigation (hidden on onboarding) -->
  <div class="bottom-nav" id="bottomNav">
    <button class="nav-item" data-tab="home"><svg class="icon" viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></button>
    <button class="nav-item" data-tab="learn"><svg class="icon" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span>Learn</span></button>
    <button class="nav-item" data-tab="progress"><svg class="icon" viewBox="0 0 24 24"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/></svg><span>Progress</span></button>
    <button class="nav-item" data-tab="settings"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.02.02A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.64z"/><path d="M4.6 9a1.65 1.65 0 0 0-.33 1.82c.26.61.86.99 1.51 1h12.44a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82L19 8.98A10 10 0 0 0 5 9z"/></svg><span>Settings</span></button>
  </div>
</div>

<!-- modal container (simple) -->
<div id="modalContainer" class="modal hidden"></div>

<script>
  (function() {
    // ----- icon system (inline svg) -----
    const ICONS = {
      home: '<svg class="icon" viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
      learn: '<svg class="icon" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
      progress: '<svg class="icon" viewBox="0 0 24 24"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/></svg>',
      settings: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.02.02A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.64z"/><path d="M4.6 9a1.65 1.65 0 0 0-.33 1.82c.26.61.86.99 1.51 1h12.44a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82L19 8.98A10 10 0 0 0 5 9z"/></svg>',
      profile: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
      lesson: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
      chart: '<svg class="icon" viewBox="0 0 24 24"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/></svg>',
      flashcards: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 4h16v12H4z"/><path d="M8 8h8"/><path d="M8 12h6"/></svg>',
      play: '<svg class="icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
      check: '<svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
    };

    // ------ app state ------
    let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
    let darkMode = false;
    let screenshotCounter = 1;

    // ------ theme ------
    function toggleTheme() {
      darkMode = !darkMode;
      document.body.classList.toggle('dark', darkMode);
      renderScreen(currentScreen);
    }

    // ------ navigation ------
    function navigateTo(screen) {
      if (screen === 'settings' || screen === 'profile') {
        currentScreen = 'settings';
      } else if (screen === 'home' || screen === 'learn' || screen === 'progress') {
        currentScreen = screen;
      } else if (screen === 'onboarding') {
        currentScreen = 'onboarding';
      } else {
        currentScreen = 'home';
      }
      renderScreen(currentScreen);
    }

    // profile click = settings screen
    document.getElementById('profileBtn').addEventListener('click', () => navigateTo('settings'));

    // bottom nav listeners
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const tab = btn.dataset.tab;
        if (tab) navigateTo(tab);
      });
    });

    // ------ modal helpers ------
    function showModal(title, text) {
      const modal = document.getElementById('modalContainer');
      modal.innerHTML = `<div class="modal-card"><h3 style="margin-bottom:12px;">${title}</h3><p style="margin-bottom:20px;">${text}</p><button class="btn btn-outline" style="padding:10px;" id="closeModal">Close</button></div>`;
      modal.classList.remove('hidden');
      document.getElementById('closeModal').addEventListener('click', ()=> modal.classList.add('hidden'));
    }

    // ------ render engine ------
    function renderScreen(screen) {
      const container = document.getElementById('screenContainer');
      const headerTitle = document.getElementById('headerTitle');
      const bottomNav = document.getElementById('bottomNav');

      // hide bottom nav on onboarding
      if (screen === 'onboarding') {
        bottomNav.style.display = 'none';
      } else {
        bottomNav.style.display = 'flex';
      }

      // set active tab class
      document.querySelectorAll('.nav-item').forEach(item => {
        const tab = item.dataset.tab;
        if (tab === screen) item.classList.add('active');
        else item.classList.remove('active');
      });

      // ----- header title -----
      if (screen === 'onboarding') headerTitle.innerText = 'Welcome';
      else if (screen === 'home') headerTitle.innerText = 'Dashboard';
      else if (screen === 'learn') headerTitle.innerText = 'Practice';
      else if (screen === 'progress') headerTitle.innerText = 'Progress';
      else if (screen === 'settings') headerTitle.innerText = 'Settings';

      // ----- screen content -----
      if (screen === 'onboarding') {
        container.innerHTML = `
          <div class="content" style="display:flex; flex-direction:column; justify-content:center; min-height:100%;">
            <div class="logo-big">${ICONS.flashcards.replace('icon', 'icon')}</div>
            <h1 style="font-size:40px; font-weight:800; color:var(--primary); margin-bottom:8px;">code daily</h1>
            <p style="font-size:20px; font-weight:600; color:var(--text);">learn Python · 3 min a day</p>
            <p style="margin: 20px 0 10px; color:var(--text-light);">Bite-sized Python exercises, flashcards & quizzes. Build your skill step by step.</p>
            <button class="btn" id="getStartedBtn">Get Started</button>
            <div class="link-row">
              <a href="#" id="privacyLink">Privacy</a>
              <a href="#" id="termsLink">Terms</a>
            </div>
          </div>
        `;
        document.getElementById('getStartedBtn').addEventListener('click', ()=> navigateTo('home'));
        document.getElementById('privacyLink').addEventListener('click', (e) => { e.preventDefault(); showModal('Privacy Policy', 'We respect your data. No creepy tracking.'); });
        document.getElementById('termsLink').addEventListener('click', (e) => { e.preventDefault(); showModal('Terms of Service', 'Keep learning, be kind.'); });
      }

      else if (screen === 'home') {
        container.innerHTML = `
          <div class="content">
            <div class="chip" style="margin-bottom:8px;">🔥 7 day streak</div>
            <div class="card">
              <div style="display:flex; justify-content:space-between"><span>Today's goal</span> <span>1/3 lessons</span></div>
              <div class="progress-bar"><div class="progress-fill" style="width:33%"></div></div>
              <div style="display:flex; gap:10px; margin-top:16px;">
                <span class="badge">⚡ 5 min left</span>
                <span class="badge">🐍 Python</span>
              </div>
            </div>
            <div class="row">
              <div class="card" style="flex:1; padding:16px;">${ICONS.lesson} <strong>Variables</strong><br><small>2 min</small></div>
              <div class="card" style="flex:1; padding:16px;">${ICONS.flashcards} <strong>Loops</strong><br><small>flashcards</small></div>
            </div>
            <div class="card">
              <h3>Recommended</h3>
              <div style="display:flex; gap:12px; margin:10px 0">${ICONS.play} Start "Functions" chapter</div>
              <div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div>
            </div>
          </div>
        `;
      } 
      else if (screen === 'learn') {
        container.innerHTML = `
          <div class="content">
            <div class="card">
              <h3>Today's exercise</h3>
              <p style="margin:12px 0;">f-strings & variables</p>
              <button class="btn" style="padding:12px;" id="practiceBtn">Start practice</button>
            </div>
            <div class="card">
              <div style="display:flex; gap:20px;">${ICONS.flashcards} <div><strong>Flashcards: 12 due</strong><div class="progress-bar" style="width:120px;"><div class="progress-fill" style="width:75%"></div></div></div></div>
            </div>
          </div>
        `;
        document.getElementById('practiceBtn')?.addEventListener('click', ()=> showModal('Quick exercise', 'Print "Hello, world!"'));
      }
      else if (screen === 'progress') {
        container.innerHTML = `
          <div class="content">
            <div class="card stat-grid">
              <div class="stat-item"><span class="value">34</span><div class="label">lessons</div></div>
              <div class="stat-item"><span class="value">7</span><div class="label">streak</div></div>
              <div class="stat-item"><span class="value">128</span><div class="label">XP today</div></div>
              <div class="stat-item"><span class="value">3</span><div class="label">badges</div></div>
            </div>
            <div class="card">
              <h4>Weekly activity</h4>
              <div style="height:80px; display:flex; gap:6px; align-items:flex-end; margin:15px 0;">
                <div style="background:var(--primary); width:20%; height:40px; border-radius:8px;"></div>
                <div style="background:var(--primary); width:20%; height:70px;"></div>
                <div style="background:var(--accent); width:20%; height:55px;"></div>
                <div style="background:var(--primary); width:20%; height:30px;"></div>
                <div style="background:var(--accent); width:20%; height:80px;"></div>
              </div>
            </div>
          </div>
        `;
      }
      else if (screen === 'settings') {
        container.innerHTML = `
          <div class="content">
            <div class="card">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span>🌙 Dark theme</span>
                <label class="switch"><input type="checkbox" id="themeToggle" ${darkMode ? 'checked' : ''}><span class="slider"></span></label>
              </div>
            </div>
            <div class="card">
              <p>Profile: learner@python</p>
              <p style="margin-top:8px;">︎︎︎${ICONS.profile.replace('width="28"', 'width="24"')}  Edit picture</p>
            </div>
          </div>
        `;
        document.getElementById('themeToggle')?.addEventListener('change', toggleTheme);
      }

      // update bottom nav active state after render
      document.querySelectorAll('.nav-item').forEach(item => {
        if (item.dataset.tab === screen) item.classList.add('active');
        else item.classList.remove('active');
      });
    }

    // ----- screenshot (SHIFT+W) -----
    document.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const phone = document.getElementById('phoneContainer');
        html2canvas?.(phone, { scale: 2 }).then(canvas => {
          const link = document.createElement('a');
          const seq = darkMode ? 6 : screenshotCounter;
          link.download = `${seq}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
          screenshotCounter = screenshotCounter < 5 ? screenshotCounter+1 : 1; // cycle 1-5
        }).catch(() => alert('html2canvas not loaded — use fallback.'));
      }
    });

    // start with onboarding
    renderScreen('onboarding');

    // inject html2canvas for screenshot (simple)
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    document.head.appendChild(script);
  })();
</script>
<!-- minimal switch style -->
<style>
  .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position: absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background:#ccc; border-radius:34px; }
  .slider:before { position:absolute; content:""; height:20px; width:20px; left:2px; bottom:2px; background:white; border-radius:50%; transition:.2s; }
  input:checked + .slider { background: #2563EB; }
  input:checked + .slider:before { transform: translateX(22px); }
</style>
</body>
</html>
All done!
