```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabBuilder · mobile prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #475569;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --grey-light: #E2E8F0;
            --grey-icon: #94A3B8;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            --header-height: 56px;
            --bottom-nav-height: 72px;
            --active-bg: rgba(37, 99, 235, 0.08);
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #94A3B8;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --grey-light: #334155;
            --grey-icon: #64748B;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
            --active-bg: rgba(59, 130, 246, 0.15);
        }

        body {
            background: #1a1e2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .app-screen::-webkit-scrollbar { display: none; }

        /* header */
        .header {
            height: var(--header-height);
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--grey-light);
            background: var(--card);
            flex-shrink: 0;
        }
        .header .title {
            font-weight: 600;
            font-size: 18px;
            color: var(--text);
            letter-spacing: -0.2px;
        }
        .profile-icon {
            cursor: pointer;
            padding: 8px;
            margin: -8px;
            border-radius: 30px;
            transition: background 0.1s;
        }
        .profile-icon:hover { background: var(--grey-light); }

        /* bottom nav */
        .bottom-nav {
            height: var(--bottom-nav-height);
            background: var(--card);
            border-top: 1px solid var(--grey-light);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding-bottom: 8px;
            flex-shrink: 0;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
            color: var(--grey-icon);
            fill: var(--grey-icon);
            font-size: 11px;
            font-weight: 500;
            border-radius: 20px;
            padding: 6px 0 4px;
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            transform: scale(1.05);
            background: var(--active-bg);
        }
        .nav-item .icon {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-item.active .icon {
            stroke: var(--primary);
            filter: drop-shadow(0 2px 4px rgba(37,99,235,0.2));
        }

        /* content */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* cards */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 20px 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--grey-light);
        }

        .badge {
            background: var(--accent);
            color: #0C4A6E;
            font-weight: 600;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 30px;
            display: inline-block;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 40px;
            padding: 14px 24px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: 0.1s;
        }
        .btn:active { opacity: 0.8; }

        .row-space {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-bar {
            height: 8px;
            background: var(--grey-light);
            border-radius: 30px;
            overflow: hidden;
            width: 100%;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 30px;
            transition: width 0.2s;
        }

        /* modal */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: var(--card);
            width: 280px;
            border-radius: 28px;
            padding: 24px;
            color: var(--text);
            box-shadow: 0 30px 60px black;
        }
        .modal-close {
            margin-top: 16px;
            text-align: right;
            font-weight: 600;
            color: var(--primary);
            cursor: pointer;
        }

        /* icons */
        .icon-svg { display: none; } /* store definitions */

        /* onboarding specific */
        .logo-big {
            width: 64px;
            height: 64px;
            background: var(--primary);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }
        .legal-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 20px 0 8px;
            font-size: 13px;
            color: var(--grey-icon);
            text-decoration: underline;
            cursor: pointer;
        }

        /* lesson list */
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid var(--grey-light);
        }
        .lesson-icon {
            background: var(--accent);
            width: 44px;
            height: 44px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-cell {
            background: var(--bg);
            border-radius: 18px;
            padding: 14px 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="phone" id="phoneContainer">
        <!-- SVG sprite -->
        <svg style="display:none;" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- home -->
                <g id="icon-home"><path d="M5 12l7-7 7 7v9h-5v-6h-4v6H5v-9z" stroke="currentColor" fill="none" stroke-width="2"/></g>
                <!-- learn (book open) -->
                <g id="icon-learn"><path d="M2 4h4a4 4 0 014 4v10a2 2 0 01-2 2H2V4z M22 4h-4a4 4 0 00-4 4v10a2 2 0 002 2h6V4z" stroke="currentColor" fill="none" stroke-width="2"/></g>
                <!-- progress (chart) -->
                <g id="icon-progress"><path d="M21 21H4V4 M9 17v-4 M13 17V8 M17 17v-6" stroke="currentColor" fill="none" stroke-width="2"/></g>
                <!-- settings (gear) -->
                <g id="icon-settings"><circle cx="12" cy="12" r="3" stroke="currentColor" fill="none" stroke-width="2"/><path d="M19.4 15a2 2 0 00.4-1.8l.9-2.4a2 2 0 00-1-2.6l-2.2-.8a8 8 0 00-1.4-1.4l-.8-2.2a2 2 0 00-2.6-1l-2.4.9A2 2 0 008 4.6L5.6 5.4a2 2 0 00-1 2.6l.8 2.2a8 8 0 000 2.8l-.8 2.2a2 2 0 001 2.6l2.4.9a2 2 0 001.8.4l2.4-.9a8 8 0 002.8 0l2.2.8a2 2 0 002.6-1l.9-2.4a2 2 0 00-.4-1.8z" stroke="currentColor" fill="none" stroke-width="2"/></g>
                <!-- profile (simple user) -->
                <g id="icon-profile"><path d="M5 20v-2a7 7 0 0114 0v2" stroke="currentColor" fill="none" stroke-width="2"/><circle cx="12" cy="8" r="4" stroke="currentColor" fill="none" stroke-width="2"/></g>
                <!-- lesson (play) -->
                <g id="icon-lesson"><polygon points="5 3 19 12 5 21 5 3" stroke="currentColor" fill="none" stroke-width="2"/></g>
                <!-- flashcards -->
                <g id="icon-flashcards"><path d="M4 4h12v12H4z M8 8h8v8H8z M16 8l4-4v12l-4 4" stroke="currentColor" fill="none" stroke-width="2"/></g>
                <!-- check -->
                <g id="icon-check"><polyline points="20 6 9 17 4 12" stroke="currentColor" fill="none" stroke-width="2"/></g>
            </defs>
        </svg>

        <!-- DYNAMIC SCREEN RENDER -->
        <div id="appScreen" class="app-screen"></div>
    </div>

    <!-- modal root -->
    <div id="modalRoot"></div>

    <script>
        (function(){
            // ----- theme management -----
            const applyTheme = (isDark) => {
                if(isDark) document.body.classList.add('dark');
                else document.body.classList.remove('dark');
            };

            // ----- icon helper: returns SVG string with currentColor -----
            function renderIcon(iconId, className = '') {
                return `<svg class="icon ${className}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#${iconId}" /></svg>`;
            }

            // ----- app state -----
            let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
            let darkMode = false;
            let modalContent = null; // { title, body }

            // ----- screens definition -----
            const screens = {
                onboarding: () => {
                    return `
                        <div class="header">
                            <div class="title">Welcome</div>
                            <div class="profile-icon" onclick="navigateTo('settings')">${renderIcon('icon-profile')}</div>
                        </div>
                        <div class="content" style="justify-content: center;">
                            <div class="logo-big">
                                ${renderIcon('icon-flashcards')}
                            </div>
                            <h1 style="font-size: 32px; color: var(--primary);">LexiCards</h1>
                            <p style="font-size: 20px; font-weight: 500;">English vocabulary builder</p>
                            <p style="color: var(--text-light); margin: 10px 0;">Master 10 words daily. Bite‑sized flashcards & spaced repetition.</p>
                            <button class="btn" onclick="navigateTo('home')">Get Started</button>
                            <div class="legal-links">
                                <span onclick="openModal('Privacy Policy','We respect your privacy. No data collected.')">Privacy Policy</span>
                                <span onclick="openModal('Terms of Service','Learn with LexiCards — simple terms.')">Terms of Service</span>
                            </div>
                        </div>
                        ${bottomNav('onboarding')}
                    `;
                },
                home: () => {
                    return `
                        <div class="header">
                            <div class="title">Dashboard</div>
                            <div class="profile-icon" onclick="navigateTo('settings')">${renderIcon('icon-profile')}</div>
                        </div>
                        <div class="content">
                            <div class="card">
                                <div class="row-space">
                                    <span class="badge">🔥 7 day streak</span>
                                    <span style="color: var(--primary);">+45 XP</span>
                                </div>
                                <h3 style="margin: 12px 0 8px;">Continue where you left</h3>
                                <div style="display: flex; gap:12px; align-items:center;">
                                    ${renderIcon('icon-lesson')}
                                    <div style="flex:1">
                                        <div><strong>Business collocations</strong></div>
                                        <div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div>
                                    </div>
                                    <button onclick="navigateTo('learn')" style="background:var(--primary); border:none; border-radius:30px; color:white; padding:6px 16px;">resume</button>
                                </div>
                            </div>
                            <div class="card">
                                <h4>Daily goal</h4>
                                <div class="progress-bar" style="margin:10px 0"><div class="progress-fill" style="width:40%"></div></div>
                                <div class="row-space"><span>8/20 words</span><span>+20 XP</span></div>
                            </div>
                            <div class="stat-grid">
                                <div class="stat-cell"><strong>124</strong><br>words learned</div>
                                <div class="stat-cell"><strong>12</strong><br>lessons</div>
                            </div>
                            <div class="card">
                                <h4>🏆 achievements</h4>
                                <div style="display:flex; gap:8px; margin-top:12px;">
                                    <span style="background:var(--grey-light); padding:8px 12px; border-radius:30px;">🔥 7 days</span>
                                    <span style="background:var(--grey-light); padding:8px 12px; border-radius:30px;">⚡ speed</span>
                                </div>
                            </div>
                        </div>
                        ${bottomNav('home')}
                    `;
                },
                learn: () => {
                    return `
                        <div class="header">
                            <div class="title">Practice</div>
                            <div class="profile-icon" onclick="navigateTo('settings')">${renderIcon('icon-profile')}</div>
                        </div>
                        <div class="content">
                            <div class="card">
                                <div style="display:flex; gap:16px;">
                                    <div class="lesson-icon">${renderIcon('icon-flashcards')}</div>
                                    <div><h3>Flashcards: unit 4</h3><span style="color:var(--text-light);">22 cards</span></div>
                                </div>
                                <button class="btn" style="margin-top:12px;" onclick="updateProgress()">Start practice</button>
                            </div>
                            <div class="lesson-item">
                                <div class="lesson-icon">${renderIcon('icon-lesson')}</div>
                                <div><strong>Idioms in use</strong><div class="progress-bar" style="width:80px;"><div class="progress-fill" style="width:30%"></div></div></div>
                            </div>
                            <div class="lesson-item">
                                <div class="lesson-icon">${renderIcon('icon-check')}</div>
                                <div><strong>Phrasal verbs</strong><div class="progress-bar" style="width:80px;"><div class="progress-fill" style="width:70%"></div></div></div>
                            </div>
                            <div class="card"><h4>recommended for you</h4><p style="margin-top:8px;">🔤 Academic word list</p></div>
                        </div>
                        ${bottomNav('learn')}
                    `;
                },
                progress: () => {
                    return `
                        <div class="header">
                            <div class="title">Statistics</div>
                            <div class="profile-icon" onclick="navigateTo('settings')">${renderIcon('icon-profile')}</div>
                        </div>
                        <div class="content">
                            <div class="card">
                                <h3>Last 7 days</h3>
                                <div style="display:flex; gap:4px; height:80px; align-items:flex-end; margin:15px 0;">
                                    <div style="flex:1; background:var(--primary); height:40px; border-radius:6px;"></div>
                                    <div style="flex:1; background:var(--primary); height:55px;"></div>
                                    <div style="flex:1; background:var(--primary); height:30px;"></div>
                                    <div style="flex:1; background:var(--primary); height:70px;"></div>
                                    <div style="flex:1; background:var(--primary); height:45px;"></div>
                                    <div style="flex:1; background:var(--primary); height:60px;"></div>
                                    <div style="flex:1; background:var(--primary); height:80px;"></div>
                                </div>
                                <div class="row-space"><span>words learned: 178</span><span>🔥 streak 7</span></div>
                            </div>
                            <div class="stat-grid">
                                <div class="stat-cell">⏱️ 4.2h</div>
                                <div class="stat-cell">🎯 89% mastery</div>
                            </div>
                        </div>
                        ${bottomNav('progress')}
                    `;
                },
                settings: () => {
                    return `
                        <div class="header">
                            <div class="title">Profile & Settings</div>
                            <div class="profile-icon" onclick="navigateTo('settings')">${renderIcon('icon-profile')}</div>
                        </div>
                        <div class="content">
                            <div style="display:flex; gap:16px; align-items:center; margin-bottom:16px;">
                                <div style="background:var(--primary); width:56px; height:56px; border-radius:28px; display:flex; align-items:center; justify-content:center;">${renderIcon('icon-profile')}</div>
                                <div><h3>Alex Mercer</h3><span>alex@example.com</span></div>
                            </div>
                            <div class="card">
                                <div class="row-space">
                                    <span>🌙 Dark mode</span>
                                    <label><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''} onchange="toggleDark()"></label>
                                </div>
                            </div>
                            <div class="card">
                                <p>🔔 Notifications</p>
                                <p>🌐 Language: English</p>
                            </div>
                            <div style="margin-top:12px;">
                                <small style="color:var(--grey-icon);">version 1.0 · VocabBuilder</small>
                            </div>
                        </div>
                        ${bottomNav('settings')}
                    `;
                }
            };

            function bottomNav(active) {
                const items = ['home', 'learn', 'progress', 'settings'];
                const labels = { home:'Home', learn:'Learn', progress:'Progress', settings:'Settings' };
                const icons = { home:'icon-home', learn:'icon-learn', progress:'icon-progress', settings:'icon-settings' };
                return `
                    <div class="bottom-nav">
                        ${items.map(id => `
                            <div class="nav-item ${active === id ? 'active' : ''}" onclick="navigateTo('${id}')">
                                ${renderIcon(icons[id])}
                                <span>${labels[id]}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // navigation
            window.navigateTo = (screen) => {
                if(screen === 'home' || screen === 'learn' || screen === 'progress' || screen === 'settings' || screen === 'onboarding') {
                    currentScreen = screen;
                    renderApp();
                }
            };

            // modal
            window.openModal = (title, body) => {
                modalContent = { title, body };
                renderModal();
            };
            window.closeModal = () => {
                modalContent = null;
                renderModal();
            };

            function renderModal() {
                const root = document.getElementById('modalRoot');
                if(!modalContent) { root.innerHTML = ''; return; }
                root.innerHTML = `
                    <div class="modal-overlay" onclick="closeModal()">
                        <div class="modal-card" onclick="event.stopPropagation()">
                            <h3>${modalContent.title}</h3>
                            <p style="margin:16px 0;">${modalContent.body}</p>
                            <div class="modal-close" onclick="closeModal()">Got it</div>
                        </div>
                    </div>
                `;
            }

            // theme toggle
            window.toggleDark = () => {
                darkMode = !darkMode;
                applyTheme(darkMode);
                renderApp(); // re-render settings checkbox state
            };

            // progress demo animation
            window.updateProgress = () => {
                const fills = document.querySelectorAll('.progress-fill');
                fills.forEach(f => f.style.width = Math.floor(Math.random()*80+20)+'%');
            };

            // render main screen
            function renderApp() {
                const container = document.getElementById('appScreen');
                container.innerHTML = screens[currentScreen]();
                // update checkbox if settings screen and dark
                const chk = document.getElementById('darkToggle');
                if(chk) chk.checked = darkMode;
            }

            // initial render
            applyTheme(false);
            renderApp();

            // screenshot shortcut SHIFT+W
            window.addEventListener('keydown', (e) => {
                if(e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    const phone = document.getElementById('phoneContainer');
                    import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
                        html2canvas(phone, { scale: 2 }).then(canvas => {
                            const link = document.createElement('a');
                            const baseName = darkMode ? '6' : (document.querySelectorAll('[data-num]').length || '1');
                            // simple counter
                            let num = darkMode ? 6 : (window._ssCounter || 1);
                            link.download = `${num}.png`;
                            link.href = canvas.toDataURL('image/png');
                            link.click();
                            if(!darkMode) window._ssCounter = ((window._ssCounter||1) % 5) + 1;
                        });
                    });
                }
            });
        })();
    </script>
    <!-- include html2canvas for screenshot -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</body>
</html>
All done!
