<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1e2b;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2c3142;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
        }

        /* theme variables */
        .light-theme {
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-subtle: #E2E8F0;
            --icon-inactive: #94A3B8;
            --nav-highlight: rgba(37, 99, 235, 0.1);
        }

        .dark-theme {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #A0AEC0;
            --border-subtle: #2D3A4F;
            --icon-inactive: #64748B;
            --nav-highlight: rgba(59, 130, 246, 0.2);
        }

        /* main content */
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px 8px 16px;
            scrollbar-width: thin;
            background: var(--bg-primary);
            transition: background 0.2s;
        }

        /* header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }
        .profile-icon {
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            transition: background 0.1s;
        }
        .profile-icon:hover { background: var(--border-subtle); }

        /* bottom navigation */
        .bottom-nav {
            height: 72px;
            background: var(--bg-card);
            border-top: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 8px;
            transition: background 0.2s;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex: 1;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            border-radius: 24px;
            padding: 6px 0;
            color: var(--icon-inactive);
            fill: var(--icon-inactive);
        }
        .nav-item.active {
            color: #2563EB;
            fill: #2563EB;
            background: var(--nav-highlight);
            transform: scale(1.02);
        }
        .nav-item.active svg {
            transform: scale(1.1);
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
        }
        .nav-icon svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.15s;
        }

        /* cards */
        .card {
            background: var(--bg-card);

            padding: 18px 16px;
            margin-bottom: 16px;

            transition: background 0.2s;
        }
        .lesson-row {
            display: flex;
            align-items: center;
            gap: 16px;

            border-bottom: 1px solid var(--border-subtle);

        .badge {
            background: #2563EB10;

            display: grid;
            grid-template-columns: 1fr 1fr;

        .logo-area {
            display: flex;

            height: 64px;

        }
        .app-name {
            font-size: 36px;
            font-weight: 800;
            color: #2563EB;

        }
        .tagline {
            font-size: 16px;

            background: #2563EB;

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;

            color: var(--text-secondary);
            text-decoration: underline;
            cursor: pointer;

        /* modal */
        .modal {
            position: absolute;

            align-items: center;
            justify-content: center;
            z-index: 100;

        .modal-content {
            background: var(--bg-card);

        }
        .modal-content button {
            margin-top: 16px;
            background: #2563EB;

            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        /* hidden screenshot canvas */
        #screenshot-canvas {

        .hidden { display: none; }
        .chart-line { stroke: #2563EB; stroke-width: 2; }
        button { cursor: pointer; }

</head>
<body>
    <div id="phoneContainer" class="phone light-theme">
        <!-- dynamic screens injected via js -->
        <div id="screenRoot" class="app-content"></div>
        <!-- bottom navigation -->
        <nav class="bottom-nav" id="bottomNav">
            <!-- filled by js -->
        </nav>
    </div>

    <!-- canvas for screenshot -->
    <canvas id="screenshot-canvas" width="360" height="780"></canvas>

    <script>
        (function() {
            // ---------- THEME & STATE ----------
            let currentTheme = 'light';
            let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
            let screenshotCounter = 1;
            const modalState = { visible: false, content: '' };

            // ---------- SVG ICONS (inline, outline 2px, rounded) ----------
            const icons = {
                home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10L12 3L21 10V20H3V10Z"/><path d="M9 20V14H15V20"/></svg>`,
                learn: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6L12 2L22 6L12 10L2 6Z"/><path d="M2 16L12 20L22 16"/><path d="M2 11L12 15L22 11"/></svg>`,
                progress: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12C21 16.97 16.97 21 12 21C7.03 21 3 16.97 3 12C3 7.03 7.03 3 12 3"/><path d="M12 7V12L15 15"/><circle cx="12" cy="12" r="9"/></svg>`,
                settings: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.03.03A10 10 0 0 0 12 17.66a10 10 0 0 0 6.37-2.63z"/><path d="M16.5 6.5L19 9"/><path d="M7.5 6.5L5 9"/></svg>`,
                profile: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
                lesson: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>`,
                chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 21H3V3"/><path d="M7 15L10 10L13 13L18 7"/></svg>`,
                flashcards: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h4"/></svg>`,
                play: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M10 8v8l6-4-6-4z"/></svg>`,
                check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17L4 12"/></svg>`
            };

            // ---------- RENDER SCREEN BASED ON STATE ----------
            function render() {
                const root = document.getElementById('screenRoot');
                const bottomNav = document.getElementById('bottomNav');
                const phone = document.getElementById('phoneContainer');
                phone.className = `phone ${currentTheme}-theme`;

                // build bottom nav (4 items)
                const navItems = [
                    { id: 'home', label: 'Home', icon: icons.home },
                    { id: 'learn', label: 'Learn', icon: icons.learn },
                    { id: 'progress', label: 'Progress', icon: icons.progress },
                    { id: 'settings', label: 'Settings', icon: icons.settings }
                ];
                bottomNav.innerHTML = navItems.map(item => {
                    const active = currentScreen === item.id || (item.id === 'home' && currentScreen === 'onboarding') ? 'active' : '';
                    return `<button class="nav-item ${active}" data-nav="${item.id}">
                        <span class="nav-icon">${item.icon}</span>
                        <span class="nav-label">${item.label}</span>
                    </button>`;
                }).join('');

                // attach nav events
                document.querySelectorAll('.nav-item').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const navId = btn.dataset.nav;
                        if (navId === 'home') currentScreen = 'home';
                        else if (navId === 'learn') currentScreen = 'learn';
                        else if (navId === 'progress') currentScreen = 'progress';
                        else if (navId === 'settings') currentScreen = 'settings';
                        render();
                    });
                });

                // render main screen content
                root.innerHTML = getScreenContent(currentScreen);

                // profile click
                document.querySelectorAll('.profile-icon').forEach(el => {
                    el.addEventListener('click', () => {
                        currentScreen = 'settings';
                        render();
                    });
                });

                // "Get Started"
                const getStarted = document.getElementById('getStartedBtn');
                if (getStarted) getStarted.addEventListener('click', () => {
                    currentScreen = 'home';
                    render();
                });

                // modal triggers
                document.querySelectorAll('[data-modal]').forEach(el => {
                    el.addEventListener('click', (e) => {
                        const type = el.dataset.modal;
                        showModal(type === 'privacy' ? 'Privacy Policy · We protect your data.' : 'Terms of Service · Learn Python fairly.');
                    });
                });

                // start practice simulation
                const startPractice = document.getElementById('startPractice');
                if (startPractice) {
                    startPractice.addEventListener('click', () => {
                        const fill = document.querySelector('.progress-fill');
                        if (fill) fill.style.width = '68%';
                    });
                }
                // theme toggle inside settings
                const themeToggle = document.getElementById('themeToggle');
                if (themeToggle) {
                    themeToggle.addEventListener('click', () => {
                        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
                        render();
                    });
                }
            }

            function getScreenContent(screen) {
                if (screen === 'onboarding') return onboardingScreen();
                if (screen === 'home') return homeScreen();
                if (screen === 'learn') return learnScreen();
                if (screen === 'progress') return progressScreen();
                if (screen === 'settings') return settingsScreen();
                return onboardingScreen();
            }

            // ---------- SCREEN TEMPLATES ----------
            function onboardingScreen() {
                return `
                    <div class="logo-area">
                        <div class="big-logo">${icons.learn.replace('24', '64')}</div>
                        <div class="app-name">CodeFlow</div>
                        <div class="tagline">Learn Python · 3 min a day</div>
                        <p style="text-align:center; margin:12px 0; color:var(--text-secondary);">Bite-sized exercises, flashcards, and real coding practice. From zero to hero.</p>
                    </div>
                    <button class="get-started" id="getStartedBtn">Get Started</button>
                    <div class="footer-links">
                        <span data-modal="privacy">Privacy</span>
                        <span data-modal="terms">Terms</span>
                    </div>
                `;
            }

            function homeScreen() {
                return `
                    <div class="header">
                        <h1>Home</h1>
                        <div class="profile-icon">${icons.profile}</div>
                    </div>
                    <div class="card">
                        <div style="display:flex; justify-content:space-between;"><span class="badge">🔥 streak 7 days</span><span>🏆 120 XP</span></div>
                        <div style="font-size:20px; font-weight:700; margin:12px 0 6px;">Continue where you left</div>
                        <div class="lesson-row"><span class="nav-icon">${icons.play}</span> <span style="flex:1;">Variables & Data types</span> <span>85%</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:85%"></div></div>
                        <div class="lesson-row"><span class="nav-icon">${icons.flashcards}</span> <span style="flex:1;">Loops review</span> <span>42%</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:42%"></div></div>
                    </div>
                    <div class="card">
                        <h3 style="margin-bottom:12px;">Today's plan</h3>
                        <div class="lesson-row"><span class="nav-icon">${icons.check}</span> Functions challenge</div>
                        <div class="lesson-row"><span class="nav-icon">${icons.lesson}</span> List comprehensions</div>
                    </div>
                `;
            }

            function learnScreen() {
                return `
                    <div class="header">
                        <h1>Learn</h1>
                        <div class="profile-icon">${icons.profile}</div>
                    </div>
                    <div class="card">
                        <div style="display:flex; gap:12px; align-items:center;">
                            <span class="nav-icon" style="color:#2563EB;">${icons.flashcards}</span>
                            <div><strong>Python basics I</strong><br>12 flashcards</div>
                        </div>
                        <button id="startPractice" style="background:#2563EB20; border:1px solid #2563EB; border-radius:40px; padding:8px; width:100%; margin-top:12px;">▶ Start practice</button>
                    </div>
                    <div class="card">
                        <div class="lesson-row"><span class="nav-icon">${icons.lesson}</span> If/else (4 min)</div>
                        <div class="lesson-row"><span class="nav-icon">${icons.lesson}</span> While loops (3 min)</div>
                        <div class="lesson-row"><span class="nav-icon">${icons.lesson}</span> Functions (7 min)</div>
                    </div>
                `;
            }

            function progressScreen() {
                return `
                    <div class="header">
                        <h1>Progress</h1>
                        <div class="profile-icon">${icons.profile}</div>
                    </div>
                    <div class="card">
                        <div style="display:flex; gap:8px;">${icons.chart} <strong>Weekly activity</strong></div>
                        <svg viewBox="0 0 24 8" width="100%" style="margin:12px 0;">
                            <polyline points="0,6 3,2 6,5 9,3 12,7 15,4 18,6 21,2 24,5" stroke="#2563EB" stroke-width="2" fill="none"/>
                        </svg>
                    </div>
                    <div class="stat-grid">
                        <div class="stat-item">🔥 7 day streak</div>
                        <div class="stat-item">⭐ 340 XP</div>
                        <div class="stat-item">📘 12 lessons</div>
                        <div class="stat-item">⏱️ 48 min</div>
                    </div>
                    <div class="card">
                        <span>Python mastery</span><div class="progress-bar"><div class="progress-fill" style="width:32%"></div></div>32%
                    </div>
                `;
            }

            function settingsScreen() {
                const toggleIcon = currentTheme === 'light' ? '🌙 Dark mode' : '☀️ Light mode';
                return `
                    <div class="header">
                        <h1>Settings</h1>
                        <div class="profile-icon">${icons.profile}</div>
                    </div>
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span>Theme</span>
                            <button id="themeToggle" style="background:#2563EB; color:white; border:none; padding:8px 16px; border-radius:40px;">${toggleIcon}</button>
                        </div>
                    </div>
                    <div class="card">
                        <p>Profile: coderyan</p>
                        <p>Notifications on</p>
                        <p>Version 2.0.1</p>
                    </div>
                `;
            }

            function showModal(text) {
                const modalDiv = document.createElement('div');
                modalDiv.className = 'modal';
                modalDiv.innerHTML = `<div class="modal-content"><p>${text}</p><button id="closeModalBtn">OK</button></div>`;
                document.getElementById('phoneContainer').appendChild(modalDiv);
                document.getElementById('closeModalBtn').addEventListener('click', () => modalDiv.remove());
            }

            // ---------- SCREENSHOT (SHIFT+W) ----------
            document.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    const phone = document.getElementById('phoneContainer');
                    const canvas = document.getElementById('screenshot-canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // map background
                    const bgColor = currentTheme === 'light' ? '#F8FAFC' : '#0F172A';
                    ctx.fillStyle = bgColor;
                    ctx.fillRect(0, 0, 360, 780);
                    
                    // very simple dom to canvas (using foreignObject) - inline approach
                    const data = `<svg width="360" height="780" xmlns="http://www.w3.org/2000/svg"><foreignObject width="360" height="780">${new XMLSerializer().serializeToString(phone)}</foreignObject></svg>`;
                    const img = new Image();
                    const blob = new Blob([data], { type: 'image/svg+xml' });
                    const url = URL.createObjectURL(blob);
                    img.onload = function() {
                        ctx.drawImage(img, 0, 0);
                        URL.revokeObjectURL(url);
                        const link = document.createElement('a');
                        let filename = currentTheme === 'light' ? screenshotCounter + '.png' : '6.png';
                        if (currentTheme === 'light' && screenshotCounter <=5) {
                            link.download = screenshotCounter + '.png';
                            screenshotCounter = (screenshotCounter % 5) + 1;
                        } else {
                            link.download = '6.png';
                        }
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    };
                    img.src = url;
                }
            });

            // initial render
            render();

            // after first render attach global modal listeners (delegation)
        })();
    </script>
</body>
</html>
All done!
