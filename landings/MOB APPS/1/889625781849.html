<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSprout • Python Playground</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --border: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.03);
            --header-height: 60px;
            --bottom-nav-height: 70px;
            --radius: 24px;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --border: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --inactive: #64748B;
            --shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        body {
            background: #0b1120;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 25px 60px -10px rgba(0,20,40,0.4), 0 0 0 8px #1e2a3a;
            position: relative;
            transition: background 0.2s;
            display: flex;
            flex-direction: column;
        }

        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) transparent;
            padding-bottom: 8px;
        }

        .app-screen::-webkit-scrollbar {
            width: 4px;
        }
        .app-screen::-webkit-scrollbar-thumb {
            background: var(--inactive);
            border-radius: 20px;
        }

        /* header */
        .header {
            height: var(--header-height);
            padding: 0 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: var(--card);
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .profile-icon {
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: var(--bg);
            transition: 0.1s;
        }
        .profile-icon:hover { background: var(--border); }
        .profile-icon svg { width: 24px; height: 24px; stroke: var(--text); stroke-width: 2; fill: none; }

        /* bottom nav */
        .bottom-nav {
            height: var(--bottom-nav-height);
            background: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 8px;
            flex-shrink: 0;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            transition: transform 0.15s ease;
            border-radius: 20px;
            padding: 8px 0;
            background: transparent;
            color: var(--inactive);
            fill: none;
            stroke: var(--inactive);
        }
        .nav-item.active {
            transform: scale(1.05);
            background: rgba(37, 99, 235, 0.08);
            color: var(--primary);
            stroke: var(--primary);
        }
        .nav-item.active svg { stroke: var(--primary); }
        .nav-item span {
            font-size: 0.7rem;
            font-weight: 500;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.1s;
        }

        /* main content */
        .content {
            flex: 1;
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* cards */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        /* buttons */
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1.1rem;
            width: 100%;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 6px 0 var(--primary-dark);
        }
        .btn-primary:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--primary-dark); }

        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 18px;
            font-size: 0.85rem;
        }
        .link-row span {
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
        }

        /* modal */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal.hidden { display: none; }
        .modal-content {
            background: var(--card);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            color: var(--text);
            border: 1px solid var(--border);
            position: relative;
        }
        .close-modal {
            float: right;
            font-size: 1.6rem;
            cursor: pointer;
            line-height: 1;
        }

        /* progress bar */
        .progress-bar {
            height: 10px;
            background: var(--border);
            border-radius: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 20px;
            transition: width 0.3s;
        }

        /* row items */
        .lesson-item, .stat-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .lesson-item:last-child { border-bottom: none; }

        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* chart simulation */
        .chart-bars {
            display: flex;
            gap: 6px;
            align-items: flex-end;
            height: 100px;
            margin: 12px 0;
        }
        .bar {
            flex: 1;
            background: var(--primary);
            height: calc(30% + 10px);
            border-radius: 12px 12px 6px 6px;
            opacity: 0.7;
            transition: height 0.2s;
        }

        .bar:nth-child(1) { height: 45px; }
        .bar:nth-child(2) { height: 72px; }
        .bar:nth-child(3) { height: 38px; }
        .bar:nth-child(4) { height: 90px; }
        .bar:nth-child(5) { height: 60px; }

        /* icon sprite */
        .icon-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .icon-example svg { width: 28px; height: 28px; stroke: var(--text); stroke-width: 2; }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- header (dynamic via JS) -->
    <div class="header" id="appHeader">
        <h1 id="headerTitle">Welcome</h1>
        <div class="profile-icon" id="profileBtn">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></svg>
        </div>
    </div>

    <!-- main screen container -->
    <div class="app-screen" id="screenContainer"></div>

    <!-- bottom navigation -->
    <div class="bottom-nav" id="bottomNav">
        <div class="nav-item" data-tab="home"><svg viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></div>
        <div class="nav-item" data-tab="learn"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span>Learn</span></div>
        <div class="nav-item" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg><span>Progress</span></div>
        <div class="nav-item" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Settings</span></div>
    </div>

    <!-- hidden modal for privacy/terms -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>

<script>
    (function() {
        // ---------- app state ----------
        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
        let isDark = false;
        let screenshotCounter = 1;

        // ---------- theme ----------
        function toggleTheme() {
            isDark = !isDark;
            document.body.classList.toggle('dark', isDark);
            renderScreen(currentScreen);
        }

        // ---------- icons as svg (inline) ----------
        const Icons = {
            home: '<svg viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
            learn: '<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
            progress: '<svg viewBox="0 0 24 24"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>',
            settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
            profile: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></svg>',
            check: '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
            play: '<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
            chart: '<svg viewBox="0 0 24 24"><path d="M21 16v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2"/><path d="M7 10l3-3 3 3 4-4"/></svg>',
            flashcards: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 8h6"/><path d="M9 12h6"/><path d="M9 16h4"/></svg>'
        };

        // ---------- render functions ----------
        function renderScreen(screen) {
            const container = document.getElementById('screenContainer');
            const headerTitle = document.getElementById('headerTitle');
            let html = '';

            if (screen === 'onboarding') {
                headerTitle.innerText = 'Welcome';
                html = `
                    <div class="content" style="justify-content: center;">
                        <div style="text-align: center; margin-bottom: 20px;">
                            <div style="background: var(--primary); width: 72px; height: 72px; border-radius: 24px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center;">
                                <svg width="42" height="42" viewBox="0 0 24 24" stroke="white" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                            </div>
                            <h1 style="font-size: 2rem; color: var(--primary);">CodeSprout</h1>
                            <p style="font-size: 1.2rem; margin: 8px 0;">Python for everyone</p>
                            <p style="color: var(--text-light); padding: 0 12px;">Bite‑sized Python exercises, instant feedback, and progress tracking. Start from zero.</p>
                        </div>
                        <button class="btn-primary" id="getStartedBtn">Get Started</button>
                        <div class="link-row">
                            <span id="privacyLink">Privacy Policy</span>
                            <span id="termsLink">Terms of Service</span>
                        </div>
                    </div>
                `;
            } else if (screen === 'home') {
                headerTitle.innerText = 'Home';
                html = `
                    <div class="content">
                        <div class="card">
                            <h3 style="margin-bottom: 12px;">🔥 Daily streak 7 days</h3>
                            <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
                            <p style="margin-top: 8px;">2/3 lessons today</p>
                        </div>
                        <div class="card">
                            <div style="display: flex; gap: 16px; align-items: center;">
                                <span class="badge">RECOMMENDED</span>
                                <span>🐍 Python basics</span>
                            </div>
                            <div style="display: flex; gap: 12px; margin-top: 16px;">
                                <div style="flex:1; background: var(--bg); padding: 16px; border-radius: 20px; text-align: center;" id="continueLearning">▶️ Continue</div>
                            </div>
                        </div>
                        <div class="card">
                            <h4>Your next milestones</h4>
                            <div class="lesson-item"><span>Variables</span> ${Icons.check.replace('stroke="current"','stroke="green"')}</div>
                            <div class="lesson-item"><span>Lists</span> ${Icons.play}</div>
                        </div>
                    </div>
                `;
            } else if (screen === 'learn') {
                headerTitle.innerText = 'Learn';
                html = `
                    <div class="content">
                        <div class="card">
                            <h3>Python fundamentals</h3>
                            <div class="lesson-item"><span>📘 1. Hello world</span> <span class="badge">FREE</span></div>
                            <div class="lesson-item"><span>📘 2. Variables</span> <span class="badge">START</span></div>
                            <div class="lesson-item"><span>📘 3. Conditionals</span> <span class="badge">LOCKED</span></div>
                        </div>
                        <div class="card">
                            <h3>Practice drills</h3>
                            <div class="icon-row">${Icons.flashcards} Flashcards  •  ${Icons.play} challenges</div>
                        </div>
                    </div>
                `;
            } else if (screen === 'progress') {
                headerTitle.innerText = 'Progress';
                html = `
                    <div class="content">
                        <div class="card">
                            <h3>Weekly activity</h3>
                            <div class="chart-bars">
                                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                            </div>
                        </div>
                        <div class="card">
                            <div class="stat-item"><span>Lessons done</span> <strong>18/42</strong></div>
                            <div class="stat-item"><span>XP today</span> <strong>340</strong></div>
                        </div>
                    </div>
                `;
            } else if (screen === 'settings') {
                headerTitle.innerText = 'Settings';
                html = `
                    <div class="content">
                        <div class="card">
                            <div class="lesson-item"><span>🌙 Dark mode</span> <label><input type="checkbox" id="darkToggle" ${isDark ? 'checked' : ''}></label></div>
                            <div class="lesson-item"><span>🔔 Notifications</span> <span>ON</span></div>
                            <div class="lesson-item"><span>🎨 Theme</span> <span>Blue</span></div>
                        </div>
                        <div class="card">
                            <h4>Profile</h4>
                            <div class="profile-icon" style="margin: 12px auto;">${Icons.profile}</div>
                            <p style="text-align: center;">alice@example.com</p>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;

            // attach listeners specific to screen
            if (screen === 'onboarding') {
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                    currentScreen = 'home';
                    renderScreen('home');
                    setActiveTab('home');
                });
                document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy Policy', 'We store only progress data. No tracking.'));
                document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms of Service', 'Keep learning, be nice.'));
            } else if (screen === 'settings') {
                document.getElementById('darkToggle')?.addEventListener('change', toggleTheme);
            }

            // bottom nav active update
            setActiveTab(screen === 'onboarding' ? 'home' : screen); // onboarding fallback

            // profile button listener
            document.getElementById('profileBtn').onclick = ()=>{
                currentScreen = 'settings';
                renderScreen('settings');
                setActiveTab('settings');
            };
        }

        function setActiveTab(tab) {
            document.querySelectorAll('.nav-item').forEach(el => {
                const data = el.dataset.tab;
                if (data === tab) el.classList.add('active');
                else el.classList.remove('active');
            });
        }

        // modal logic
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalText = document.getElementById('modalText');
        window.showModal = (title, text) => {
            modalTitle.innerText = title;
            modalText.innerText = text;
            modal.classList.remove('hidden');
        };
        document.getElementById('closeModal').onclick = ()=> modal.classList.add('hidden');
        window.onclick = (e) => { if (e.target === modal) modal.classList.add('hidden'); };

        // bottom navigation
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', (e) => {
                const tab = item.dataset.tab;
                if (tab === 'home' || tab === 'learn' || tab === 'progress' || tab === 'settings') {
                    currentScreen = tab;
                    renderScreen(tab);
                }
            });
        });

        // screenshot feature (Shift+W)
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm').then(({default: html2canvas}) => {
                    html2canvas(document.getElementById('phoneContainer'), { scale: 2 }).then(canvas => {
                        const link = document.createElement('a');
                        const darkSuffix = isDark ? '6' : screenshotCounter;
                        link.download = (isDark ? '6' : screenshotCounter) + '.png';
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        if (!isDark) screenshotCounter = (screenshotCounter % 5) + 1;
                    });
                });
            }
        });

        // init
        renderScreen('onboarding');
    })();
</script>
