```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VocabVault · English builder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #0F172A;
      --text-light: #334155;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --grey: #94A3B8;
      --border: #E2E8F0;
      --shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.03);
      --nav-inactive: #94A3B8;
      --nav-bg: #FFFFFF;
      --header-bg: #F8FAFC;
      --progress-bg: #E2E8F0;
      --badge-bg: #DBEAFE;
    }

    body.dark {
      --bg: #0F172A;
      --card: #1E293B;
      --text: #E2E8F0;
      --text-light: #CBD5E1;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --grey: #475569;
      --border: #334155;
      --shadow: 0 8px 20px rgba(0,0,0,0.6);
      --nav-inactive: #64748B;
      --nav-bg: #1E293B;
      --header-bg: #0F172A;
      --progress-bg: #334155;
      --badge-bg: #1E3A8A;
    }

    body {
      background: #1e1e2f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 12px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background-color: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 30px 50px rgba(0,0,0,0.3), 0 0 0 8px #2d2d3a;
      position: relative;
      transition: background-color 0.2s;
      display: flex;
      flex-direction: column;
    }

    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px 16px 8px 16px;
      scrollbar-width: thin;
      background: var(--bg);
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0 12px 0;
      background: var(--header-bg);
    }
    .header h2 {
      font-size: 22px;
      font-weight: 650;
      color: var(--text);
    }
    .profile-icon {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* bottom nav */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: var(--nav-bg);
      padding: 8px 0 6px;
      border-top: 1px solid var(--border);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
      border: none;
      cursor: pointer;
      gap: 4px;
      font-size: 11px;
      font-weight: 500;
      color: var(--nav-inactive);
      transition: all 0.15s;
      padding: 6px 12px;
      border-radius: 30px;
    }
    .nav-item.active {
      color: var(--primary);
      background: rgba(37, 99, 235, 0.08);
      transform: scale(1.02);
    }
    .nav-item.active svg {
      stroke: var(--primary);
      stroke-width: 2.4;
      filter: drop-shadow(0 2px 4px rgba(37,99,235,0.3));
    }
    .nav-item svg {
      stroke: currentColor;
      stroke-width: 2px;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      width: 24px;
      height: 24px;
      transition: 0.1s;
    }

    /* cards & elements */
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 20px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .flex-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-primary {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      padding: 16px 24px;
      border-radius: 60px;
      width: 100%;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 8px 16px -6px var(--primary-dark);
      transition: 0.1s;
    }
    .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }
    .link-row {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin: 16px 0 8px;
      font-size: 14px;
    }
    .link-row button {
      background: none;
      border: none;
      color: var(--grey);
      text-decoration: underline;
      font-size: 13px;
      cursor: pointer;
    }

    /* progress bar */
    .progress-bar {
      height: 8px;
      background: var(--progress-bg);
      border-radius: 20px;
      margin: 12px 0;
    }
    .progress-fill {
      height: 8px;
      background: var(--primary);
      border-radius: 20px;
      width: 0%;
      transition: width 0.3s ease;
    }

    .badge {
      background: var(--badge-bg);
      color: var(--primary-dark);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
    }

    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: var(--card);
      padding: 28px 24px;
      border-radius: 32px;
      width: 280px;
      text-align: center;
      color: var(--text);
    }

    .hidden { display: none; }

    /* chart simulation */
    .mini-chart {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 80px;
      margin: 20px 0 10px;
    }
    .bar {
      flex: 1;
      background: var(--accent);
      height: calc(100% * var(--h));
      border-radius: 12px 12px 4px 4px;
      opacity: 0.8;
    }

    /* SVG icon sprite (inline) */
    .icon-defs { display: none; }

    /* onboarding */
    .logo-big {
      font-size: 52px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="phone" id="phoneContainer">
    <!-- hidden SVG definitions -->
    <svg style="display:none;" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <g id="icon-home"><path d="M5 12l7-7 7 7v7h-5v-5h-4v5H5z"/></g>
        <g id="icon-learn"><path d="M12 5v14M7 8h10M7 12h6M7 16h4"/><rect x="4" y="4" width="16" height="16" rx="2"/></g>
        <g id="icon-progress"><path d="M4 20h16M6 16v-6M12 16v-9M18 16V8"/></g>
        <g id="icon-settings"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/><path d="M16.5 6.5 16 8l-2-2 1.5-1.5"/></g>
        <g id="icon-profile"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>
        <g id="icon-lesson"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></g>
        <g id="icon-chart"><path d="M21 21H4V4"/><path d="M7 15l2-4 3 3 4-6"/></g>
        <g id="icon-flashcards"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 11h4"/></g>
        <g id="icon-play"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4V8z"/></g>
        <g id="icon-check"><path d="M20 6L9 17l-5-5"/></g>
      </defs>
    </svg>

    <!-- dynamic screen container -->
    <div id="appScreen" class="screen">
      <!-- injected by JS -->
    </div>

    <!-- bottom nav (always visible) -->
    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-item" data-tab="home"><svg><use href="#icon-home"/></svg><span>Home</span></button>
      <button class="nav-item" data-tab="learn"><svg><use href="#icon-learn"/></svg><span>Learn</span></button>
      <button class="nav-item" data-tab="progress"><svg><use href="#icon-progress"/></svg><span>Progress</span></button>
      <button class="nav-item" data-tab="settings"><svg><use href="#icon-settings"/></svg><span>Settings</span></button>
    </nav>
  </div>

  <!-- modal container (hidden) -->
  <div id="modalContainer" class="modal hidden" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3 id="modalTitle"></h3>
      <p id="modalBody"></p>
      <button class="btn-primary" style="margin-top:16px;" onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    (function() {
      // ---------- state & variables ----------
      let currentScreen = 'onboarding'; // 'onboarding', 'home', 'learn', 'progress', 'settings', 'profileSettings'
      let darkMode = false;
      let screenshotCounter = 1;
      const appScreen = document.getElementById('appScreen');
      const bottomNav = document.getElementById('bottomNav');
      const modal = document.getElementById('modalContainer');
      const modalTitle = document.getElementById('modalTitle');
      const modalBody = document.getElementById('modalBody');

      // ---------- helper functions ----------
      function closeModal() {
        modal.classList.add('hidden');
      }
      window.closeModal = closeModal;

      function showModal(title, text) {
        modalTitle.innerText = title;
        modalBody.innerText = text;
        modal.classList.remove('hidden');
      }

      // theme toggle
      function toggleTheme() {
        darkMode = !darkMode;
        document.body.classList.toggle('dark', darkMode);
        renderScreen(currentScreen); // refresh to update colors
      }

      // icon render helper
      function icon(name, className = '') {
        return `<svg class="${className}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"><use href="#icon-${name}"/></svg>`;
      }

      // ---------- screen renderers ----------
      function renderOnboarding() {
        return `
          <div class="header">
            <h2>VocabVault</h2>
            <button class="profile-icon" onclick="navigateTo('profileSettings')">${icon('profile')}</button>
          </div>
          <div style="flex:1; display: flex; flex-direction: column; justify-content: center;">
            <div class="logo-big">📘 V</div>
            <h1 style="font-size:32px; font-weight:700; color:var(--primary);">VocabVault</h1>
            <p style="font-size:18px; margin:8px 0 4px; color:var(--text);">master English daily</p>
            <p style="color:var(--text-light); margin-bottom:32px;">Bite-sized vocabulary & smart quizzes. 5 min a day.</p>
            <button class="btn-primary" onclick="navigateTo('home')">Get Started</button>
            <div class="link-row">
              <button onclick="showModal('Privacy Policy','Your data stays on device. No tracking.')">Privacy</button>
              <button onclick="showModal('Terms of Service','Educational use only. v2026')">Terms</button>
            </div>
          </div>
        `;
      }

      function renderHome() {
        return `
          <div class="header">
            <h2>Home</h2>
            <button class="profile-icon" onclick="navigateTo('profileSettings')">${icon('profile')}</button>
          </div>
          <div class="card">
            <div class="flex-row"><span style="font-weight:600;">daily streak 🔥 12</span><span class="badge">+45 XP</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
            <div style="display:flex; gap:12px; margin-top:12px;">
              <span>${icon('flashcards')} 3 ready</span>
              <span>${icon('play')} practice</span>
            </div>
          </div>
          <div class="card">
            <div class="flex-row"><span style="font-weight:600;">word of the day</span> <span class="badge">new</span></div>
            <p style="font-size:24px; margin:8px 0;">ephemeral</p>
            <p style="color:var(--text-light);">lasting a short time</p>
            <button class="btn-primary" style="margin-top:16px;" onclick="startQuickLesson()">${icon('play', '')} learn</button>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
            <div class="card" style="padding:16px;"><span>${icon('lesson')}</span> lesson 5 ready</div>
            <div class="card" style="padding:16px;"><span>${icon('chart')}</span> +200 words</div>
          </div>
        `;
      }

      function renderLearn() {
        return `
          <div class="header">
            <h2>Learn</h2>
            <button class="profile-icon" onclick="navigateTo('profileSettings')">${icon('profile')}</button>
          </div>
          <div class="card flex-row"><span>📘 beginner</span><span>${icon('check')} 12/20</span></div>
          <div class="card" style="padding:12px;"><span>${icon('flashcards')} · idioms · 5 min</span><div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div></div>
          <div class="card" onclick="startQuickLesson()" style="cursor:pointer;">
            <div class="flex-row"><span style="font-weight:600;">🔥 phrasal verbs</span> ${icon('play')}</div>
            <p style="color:var(--text-light);">run into, give up ..</p>
          </div>
          <div class="card" onclick="startQuickLesson()" style="cursor:pointer;">
            <div class="flex-row"><span>collocations</span> <span>${icon('lesson')}</span></div>
          </div>
        `;
      }

      function renderProgress() {
        return `
          <div class="header">
            <h2>Progress</h2>
            <button class="profile-icon" onclick="navigateTo('profileSettings')">${icon('profile')}</button>
          </div>
          <div class="card">
            <span>words learned</span>
            <h2>1,428</h2>
            <div class="progress-bar"><div class="progress-fill" style="width:68%"></div></div>
            <div class="mini-chart">
              <div class="bar" style="--h:0.6"></div><div class="bar" style="--h:0.9"></div><div class="bar" style="--h:0.4"></div><div class="bar" style="--h:0.7"></div><div class="bar" style="--h:1"></div>
            </div>
          </div>
          <div class="card flex-row"><span>🏆 7 day streak</span><span>${icon('check')} 3 badges</span></div>
        `;
      }

      function renderSettings() {
        return `
          <div class="header">
            <h2>Settings</h2>
            <button class="profile-icon" onclick="navigateTo('profileSettings')">${icon('profile')}</button>
          </div>
          <div class="card flex-row">
            <span>🌙 Dark mode</span>
            <button class="btn-primary" style="width:auto; padding:10px 20px;" onclick="toggleTheme()">toggle</button>
          </div>
          <div class="card">
            <p>notifications: daily reminder</p>
            <p>sound: off</p>
          </div>
        `;
      }

      function renderProfileSettings() {
        return `
          <div class="header">
            <h2>Profile</h2>
            <button class="profile-icon" onclick="navigateTo('home')">${icon('profile')}</button>
          </div>
          <div class="card" style="text-align:center;">
            ${icon('profile')} <h3>Alex Learner</h3>
            <p>joined 2026 · level 9</p>
            <button class="btn-primary" style="margin-top:16px;" onclick="navigateTo('settings')">app settings</button>
          </div>
        `;
      }

      function startQuickLesson() {
        showModal('Quick lesson','You started a mini exercise! (simulated)');
        setTimeout(()=>{ closeModal(); }, 1500);
      }
      window.startQuickLesson = startQuickLesson;

      function navigateTo(screen) {
        currentScreen = screen;
        renderScreen(screen);
        updateBottomNav(screen);
      }
      window.navigateTo = navigateTo;

      function updateBottomNav(screen) {
        const tabs = ['home','learn','progress','settings'];
        let activeTab = screen;
        if (!tabs.includes(screen) && screen !== 'onboarding' && screen !== 'profileSettings') activeTab = 'home';
        if (screen === 'onboarding' || screen === 'profileSettings') activeTab = null; // hide active
        document.querySelectorAll('.nav-item').forEach((btn, idx) => {
          const tab = btn.dataset.tab;
          if (activeTab === tab) btn.classList.add('active');
          else btn.classList.remove('active');
        });
      }

      function renderScreen(screen) {
        let html = '';
        if (screen === 'onboarding') html = renderOnboarding();
        else if (screen === 'home') html = renderHome();
        else if (screen === 'learn') html = renderLearn();
        else if (screen === 'progress') html = renderProgress();
        else if (screen === 'settings') html = renderSettings();
        else if (screen === 'profileSettings') html = renderProfileSettings();
        else html = renderHome(); // fallback
        appScreen.innerHTML = html;
      }

      // attach bottom nav listeners
      bottomNav.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const tab = e.currentTarget.dataset.tab; // home,learn,progress,settings
          if (tab === 'home') navigateTo('home');
          else if (tab === 'learn') navigateTo('learn');
          else if (tab === 'progress') navigateTo('progress');
          else if (tab === 'settings') navigateTo('settings');
        });
      });

      // screenshot SHIFT+W
      window.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.key === 'W') {
          e.preventDefault();
          const phone = document.getElementById('phoneContainer');
          // simple canvas capture simulation (would need html2canvas in real, but here we just output JSON name)
          // we just fake filename
          let filename = screenshotCounter + '.png';
          if (darkMode) filename = '6.png';
          alert(`📸 Screenshot saved as ${filename} (simulated)`);
          if (!darkMode) screenshotCounter = (screenshotCounter % 5) + 1;
        }
      });

      // initial render
      renderScreen('onboarding');
      updateBottomNav('onboarding');

      // expose to global for onclick
      window.toggleTheme = toggleTheme;
      window.startQuickLesson = startQuickLesson;
    })();
  </script>
  <!-- JSON output (Play Store) -->
  <script>
    (function() {
      // output json after load (in console / but we put as text)
      const titles = {
        "1.png": "Start Learning",
        "2.png": "Daily Lessons",
        "3.png": "Practice Skills",
        "4.png": "Track Progress",
        "5.png": "Smart Settings",
        "6.png": "Dark Theme"
      };
      console.log('titles =', JSON.stringify(titles, null, 2));
      // also show on page (hidden but per spec)
      const pre = document.createElement('pre');
      pre.style.display = 'none';
      pre.textContent = 'titles = ' + JSON.stringify(titles);
      document.body.appendChild(pre);
    })();
  </script>
  All done!
</body>
</html>
