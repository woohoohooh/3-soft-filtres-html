```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSpark · Learn Python</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            /* light mode (default) */
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive-icon: #94A3B8;
            --bottom-nav-bg: #FFFFFF;
            --shadow: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,0,0,0.05);
            --highlight: #EFF6FF;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive-icon: #64748B;
            --bottom-nav-bg: #1E293B;
            --shadow: 0 8px 20px rgba(0,0,0,0.5);
            --highlight: #2D3A4F;
        }

        body {
            background: #11151f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 25px 60px -10px rgba(0,20,40,0.5);
            position: relative;
            transition: background 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
        }

        /* screen wrapper */
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive-icon) transparent;
            padding: 0 20px 8px 20px;
        }
        .screen::-webkit-scrollbar { width: 4px; }
        .screen::-webkit-scrollbar-thumb { background: var(--inactive-icon); border-radius: 20px; }

        /* header (common) */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0 12px 0;
            background: var(--bg);
            position: sticky;
            top: 0;
            z-index: 5;
        }
        .header h2 {
            font-size: 1.5rem;
            font-weight: 650;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }
        .profile-icon {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            transition: background 0.1s;
        }
        .profile-icon:hover { background: var(--border-light); }

        /* bottom navigation */
        .bottom-nav {
            background: var(--bottom-nav-bg);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 12px;
            box-shadow: var(--shadow);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1);
            padding: 6px 0 4px;
            border-radius: 16px;
            color: var(--inactive-icon);
            fill: var(--inactive-icon);
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            transform: scale(1.05);
            background: var(--highlight);
        }
        .nav-icon {
            width: 26px;
            height: 26px;
            margin-bottom: 2px;
            transition: transform 0.15s;
        }
        .nav-item.active .nav-icon { transform: scale(1.15); }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* onboarding cards etc */
        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 30px 0 20px;
        }
        .app-logo {
            background: linear-gradient(145deg, var(--primary), var(--accent));
            width: 70px;
            height: 70px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 8px 14px rgba(37,99,235,0.3);
        }
        .app-name {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .tagline {
            font-size: 1.1rem;
            color: var(--primary);
            font-weight: 500;
            margin: 4px 0 10px;
        }
        .description {
            text-align: center;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 32px;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 40px;
            padding: 16px 32px;
            font-size: 1.2rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(37,99,235,0.4);
            transition: background 0.2s;
            margin-bottom: 20px;
        }
        .btn-primary:hover { background: var(--primary-dark); }
        .legal-links {
            display: flex;
            gap: 24px;
            justify-content: center;
            font-size: 0.8rem;
        }
        .legal-links button {
            background: none;
            border: none;
            color: var(--text-secondary);
            text-decoration: underline;
            cursor: pointer;
        }

        /* cards / progress */
        .dashboard-card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }
        .row-space {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .badge {
            background: var(--highlight);
            padding: 6px 12px;
            border-radius: 40px;
            color: var(--primary);
            font-weight: 600;
            font-size: 0.9rem;
        }
        .progress-bar-bg {
            height: 10px;
            background: var(--border-light);
            border-radius: 20px;
            margin: 12px 0;
        }
        .progress-fill {
            height: 10px;
            background: var(--primary);
            border-radius: 20px;
            width: 0%;
            transition: width 0.3s;
        }
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 16px 0;
        }
        .stat-cell {
            background: var(--bg);
            padding: 14px;
            border-radius: 20px;
            text-align: center;
        }

        /* modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-card {
            background: var(--card);
            width: 280px;
            padding: 28px;
            border-radius: 40px;
            text-align: center;
        }
        .modal-close {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 10px 24px;
            margin-top: 16px;
            cursor: pointer;
        }

        /* svg inline */
        .icon-defs { display: none; }

        /* hide/show screens */
        .screen-view { display: none; }
        .screen-view.active-screen { display: flex; flex-direction: column; height: 100%; }
    </style>
</head>
<body>
    <!-- hidden SVG definitions (modern outline 2px stroke) -->
    <svg style="display:none;" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- home icon -->
            <symbol id="icon-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" />
            </symbol>
            <!-- learn icon (book) -->
            <symbol id="icon-learn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4H20V20H4V4Z M8 8H16 M8 12H14 M8 16H12" />
            </symbol>
            <!-- progress / chart -->
            <symbol id="icon-progress" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 21H4V4 M7 15L10 10L13 13L18 7" />
            </symbol>
            <!-- settings -->
            <symbol id="icon-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3.5"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62zM4 9h16" />
            </symbol>
            <!-- profile (simple user) no circle, just figure -->
            <symbol id="icon-profile" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            </symbol>
            <!-- lesson / flashcard -->
            <symbol id="icon-lesson" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="3" width="14" height="18" rx="2"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/>
            </symbol>
            <!-- chart small -->
            <symbol id="icon-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
            </symbol>
            <!-- flashcards icon -->
            <symbol id="icon-flashcards" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8h8M8 12h6M8 16h4"/>
            </symbol>
            <!-- play -->
            <symbol id="icon-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="8 5 19 12 8 19 8 5"/>
            </symbol>
            <!-- check -->
            <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
            </symbol>
        </defs>
    </svg>

    <div class="phone" id="phoneContainer">
        <!-- dynamic screens injected via JS -->
        <div id="screenRenderer" style="display: contents;"></div>
    </div>

    <!-- modal for privacy/terms -->
    <div id="legalModal" class="modal" onclick="if(event.target===this)closeModal()">
        <div class="modal-card" id="modalContent">
            <h3 id="modalTitle">Privacy Policy</h3>
            <p id="modalBody">We respect your data. This is a demo app.</p>
            <button class="modal-close" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        (function(){
            // ---------- THEME & STATE ----------
            let currentTheme = 'light'; // default light
            let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
            const screens = ['onboarding', 'home', 'learn', 'progress', 'settings'];
            const appName = 'CodeSpark';
            const tagLine = 'Python in your pocket';
            
            // simple sequential screenshot counter
            let screenshotCounter = 1;

            // ---------- helper to render active screen ----------
            function renderApp() {
                const container = document.getElementById('screenRenderer');
                let html = '';
                
                // generate all screens (hidden with CSS)
                screens.forEach(s => {
                    let activeClass = (s === currentScreen) ? 'active-screen' : '';
                    html += `<div class="screen-view ${activeClass}" id="screen-${s}">`;
                    html += renderHeader(s); // dynamic title based on screen
                    
                    // screen content
                    if (s === 'onboarding') html += renderOnboarding();
                    else if (s === 'home') html += renderHome();
                    else if (s === 'learn') html += renderLearn();
                    else if (s === 'progress') html += renderProgress();
                    else if (s === 'settings') html += renderSettings();
                    
                    // bottom nav (except onboarding? onboarding has no bottom nav according to typical flow, but we keep nav hidden via style? we only show bottom nav on main screens)
                    if (s !== 'onboarding') {
                        html += renderBottomNav(s);
                    } else {
                        // onboarding no bottom nav, but we need to close screen div
                    }
                    html += '</div>'; // close screen-view
                });
                
                container.innerHTML = html;
                attachNavListeners();
                attachProfileListener();
                attachGetStartedListener();
                attachLegalListeners();
                attachSettingsToggle();
                attachPracticeButtons(); // progress bar updates, etc.
                applyThemeClass();
            }

            function renderHeader(screenId) {
                let title = 'CodeSpark';
                if (screenId === 'home') title = 'Dashboard';
                else if (screenId === 'learn') title = 'Lessons';
                else if (screenId === 'progress') title = 'Progress';
                else if (screenId === 'settings') title = 'Settings';
                else if (screenId === 'onboarding') title = 'Welcome';
                
                return `
                    <div class="header">
                        <h2>${title}</h2>
                        <button class="profile-icon" id="profileBtn" aria-label="Profile">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#icon-profile" /></svg>
                        </button>
                    </div>
                `;
            }

            function renderOnboarding() {
                return `
                    <div class="screen">
                        <div class="logo-area">
                            <div class="app-logo">
                                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><use href="#icon-flashcards"/></svg>
                            </div>
                            <div class="app-name">${appName}</div>
                            <div class="tagline">${tagLine}</div>
                            <p class="description">Master Python with bite-sized challenges and smart flashcards. Perfect for beginners and pros.</p>
                        </div>
                        <button class="btn-primary" id="getStartedBtn">Get Started</button>
                        <div class="legal-links">
                            <button id="privacyBtn">Privacy Policy</button>
                            <button id="termsBtn">Terms of Service</button>
                        </div>
                        <div style="height:40px;"></div>
                    </div>
                `;
            }

            function renderHome() {
                return `
                    <div class="screen">
                        <div class="dashboard-card">
                            <div class="row-space"><span class="badge">🔥 7 day streak</span> <span>🏆 340 XP</span></div>
                            <h3 style="margin:8px 0; color:var(--text-primary)">Continue where you left</h3>
                            <div class="lesson-item">
                                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><use href="#icon-play"/></svg>
                                <div><strong>Functions & Scope</strong><br><span style="font-size:12px;">68% completed</span></div>
                            </div>
                            <div class="progress-bar-bg"><div class="progress-fill" style="width:68%"></div></div>
                            <button class="btn-primary" style="padding:12px; margin:8px 0 0;" id="practiceHomeBtn">Practice now</button>
                        </div>

                        <div class="dashboard-card">
                            <div class="row-space"><span>📘 Daily pick</span><svg width="20" height="20" stroke="var(--primary)"><use href="#icon-flashcards"/></svg></div>
                            <p><strong>List comprehension</strong> — 5 min read</p>
                            <div style="display:flex; gap:8px; margin-top:10px;"><svg width="20" height="20" stroke="var(--accent)"><use href="#icon-check"/></svg><span>interactive example</span></div>
                        </div>
                    </div>
                `;
            }

            function renderLearn() {
                return `
                    <div class="screen">
                        <div class="dashboard-card">
                            <h3>Python fundamentals</h3>
                            <div class="lesson-item"><svg width="28" stroke="var(--primary)"><use href="#icon-lesson"/></svg> Variables & Data types <span style="margin-left:auto; color:green;">✓</span></div>
                            <div class="lesson-item"><svg width="28" stroke="var(--primary)"><use href="#icon-lesson"/></svg> Lists & Loops <span style="margin-left:auto;">80%</span></div>
                            <div class="lesson-item"><svg width="28" stroke="var(--primary)"><use href="#icon-lesson"/></svg> Dictionaries <span style="margin-left:auto;">🔥 new</span></div>
                            <div class="progress-bar-bg"><div class="progress-fill" style="width:45%"></div></div>
                        </div>
                        <div class="dashboard-card">
                            <div class="row-space"><span>📌 Flashcards: Exceptions</span><svg width="24" stroke="var(--primary)"><use href="#icon-flashcards"/></svg></div>
                            <button class="btn-primary" style="padding:10px;" id="startFlashcard">Start review</button>
                        </div>
                    </div>
                `;
            }

            function renderProgress() {
                return `
                    <div class="screen">
                        <div class="dashboard-card">
                            <div class="row-space"><span>Weekly XP</span><span>450 / 600</span></div>
                            <div class="progress-bar-bg"><div class="progress-fill" style="width:75%"></div></div>
                            <div class="stat-grid">
                                <div class="stat-cell"><strong>34</strong><br>lessons</div>
                                <div class="stat-cell"><strong>1280</strong><br>total XP</div>
                            </div>
                        </div>
                        <div class="dashboard-card">
                            <svg width="100%" height="60" viewBox="0 0 200 40" stroke="var(--primary)" stroke-width="2" fill="none">
                                <polyline points="10,30 40,15 70,28 100,10 130,25 160,18 190,30" stroke="var(--accent)"/>
                            </svg>
                            <p style="text-align:center;">📈 last 7 days</p>
                        </div>
                        <div class="dashboard-card">
                            <span>Badges: </span> <span>🔥 4 days · 🐍 3 streak</span>
                        </div>
                    </div>
                `;
            }

            function renderSettings() {
                const isDark = document.body.classList.contains('dark');
                return `
                    <div class="screen">
                        <div class="dashboard-card">
                            <div style="display:flex; align-items:center; justify-content:space-between;">
                                <span>🌓 Dark mode</span>
                                <button id="themeToggleBtn" style="background:var(--card); border:1px solid var(--border-light); border-radius:30px; padding:6px 14px;">${isDark ? 'Light' : 'Dark'}</button>
                            </div>
                        </div>
                        <div class="dashboard-card">
                            <p>Profile: Pythonista</p>
                            <p>Email: learner@example.com</p>
                        </div>
                        <div class="dashboard-card">
                            <p>Download progress — Export</p>
                        </div>
                    </div>
                `;
            }

            function renderBottomNav(active) {
                const items = [
                    { id: 'home', label: 'Home', icon: 'home' },
                    { id: 'learn', label: 'Learn', icon: 'learn' },
                    { id: 'progress', label: 'Progress', icon: 'progress' },
                    { id: 'settings', label: 'Settings', icon: 'settings' }
                ];
                let navHtml = `<div class="bottom-nav">`;
                items.forEach(item => {
                    const activeClass = (item.id === active) ? 'active' : '';
                    navHtml += `
                        <button class="nav-item ${activeClass}" data-screen="${item.id}">
                            <svg class="nav-icon" width="26" height="26" viewBox="0 0 24 24"><use href="#icon-${item.icon}" /></svg>
                            <span class="nav-label">${item.label}</span>
                        </button>
                    `;
                });
                navHtml += `</div>`;
                return navHtml;
            }

            // ----- navigation -----
            function attachNavListeners() {
                document.querySelectorAll('.nav-item').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const targetScreen = btn.dataset.screen;
                        if (targetScreen) switchToScreen(targetScreen);
                    });
                });
            }

            function switchToScreen(screenId) {
                if (screenId === 'onboarding') return; // avoid
                currentScreen = screenId;
                renderApp();
            }

            function attachProfileListener() {
                const profileBtn = document.getElementById('profileBtn');
                if (profileBtn) profileBtn.addEventListener('click', ()=> switchToScreen('settings'));
            }

            function attachGetStartedListener() {
                const startBtn = document.getElementById('getStartedBtn');
                if (startBtn) startBtn.addEventListener('click', ()=> switchToScreen('home'));
            }

            // modal
            window.openModal = (title, text) => {
                document.getElementById('modalTitle').innerText = title;
                document.getElementById('modalBody').innerText = text;
                document.getElementById('legalModal').style.display = 'flex';
            };
            window.closeModal = () => document.getElementById('legalModal').style.display = 'none';

            function attachLegalListeners() {
                document.getElementById('privacyBtn')?.addEventListener('click', ()=> openModal('Privacy Policy', 'We do not sell your data. This is a prototype.'));
                document.getElementById('termsBtn')?.addEventListener('click', ()=> openModal('Terms of Service', 'Educational use only. No warranties.'));
            }

            function attachSettingsToggle() {
                const toggle = document.getElementById('themeToggleBtn');
                if (toggle) {
                    toggle.addEventListener('click', ()=>{
                        document.body.classList.toggle('dark');
                        applyThemeClass();
                        renderApp(); // refresh settings text
                    });
                }
            }

            function applyThemeClass() {
                if (document.body.classList.contains('dark')) currentTheme = 'dark';
                else currentTheme = 'light';
            }

            function attachPracticeButtons() {
                document.querySelectorAll('#practiceHomeBtn, #startFlashcard').forEach(btn => {
                    if (btn) btn.addEventListener('click', ()=> alert('Lesson simulation! (demo)'));
                });
            }

            // ---------- screenshot (SHIFT+W) ----------
            window.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    const phone = document.getElementById('phoneContainer');
                    html2canvas?.(phone, { scale: 2 }).then(canvas => {
                        const link = document.createElement('a');
                        let num = (document.body.classList.contains('dark')) ? 6 : screenshotCounter;
                        if (document.body.classList.contains('dark')) num = 6;
                        else { if (screenshotCounter>5) screenshotCounter=1; num = screenshotCounter; screenshotCounter++; }
                        link.download = `${num}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    }).catch(()=> alert('html2canvas not loaded (fallback)'));
                }
            });

            // load html2canvas for screenshot (we add script dynamically)
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
            document.head.appendChild(script);

            // initial render
            renderApp();
        })();
    </script>
    <!-- ensure modal close works -->
    <script>
        function closeModal() { document.getElementById('legalModal').style.display = 'none'; }
    </script>
</body>
</html>
All done!
