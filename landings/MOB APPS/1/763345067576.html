```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeFlow · Python play</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --border-light: #E2E8F0;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --inactive: #94A3B8;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
      --header-height: 60px;
      --bottom-nav-height: 72px;
      --icon-stroke: 2px;
    }

    body.dark {
      --bg: #0F172A;
      --card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --border-light: #334155;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --inactive: #64748B;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }

    body {
      background: #1a1e2b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
      position: relative;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255,255,255,0.1);
      transition: background 0.2s;
    }

    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 12px 20px;
      scrollbar-width: thin;
      scrollbar-color: var(--inactive) transparent;
    }
    .screen-content::-webkit-scrollbar { width: 4px; }
    .screen-content::-webkit-scrollbar-thumb { background: var(--inactive); border-radius: 20px; }

    /* header */
    .header {
      height: var(--header-height);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      border-bottom: 1px solid var(--border-light);
    }
    .header-left h1 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 30px;
      transition: background 0.2s;
    }
    .profile-btn:hover { background: var(--border-light); }

    /* bottom navigation */
    .bottom-nav {
      height: var(--bottom-nav-height);
      background: var(--card);
      border-top: 1px solid var(--border-light);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 4px 8px;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px 0;
      border-radius: 30px;
      transition: all 0.15s ease;
      color: var(--inactive);
      fill: none;
      stroke: var(--inactive);
    }
    .nav-item.active {
      color: var(--primary);
      stroke: var(--primary);
      background: rgba(37, 99, 235, 0.08);
      transform: scale(1.02);
    }
    .nav-item.active svg {
      stroke: var(--primary);
      transform: scale(1.1);
    }
    .nav-label {
      font-size: 11px;
      font-weight: 500;
    }

    /* cards & elements */
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 18px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .flex-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .badge {
      background: var(--accent);
      color: #0F172A;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 12px;
    }
    .progress-bar {
      height: 8px;
      background: var(--border-light);
      border-radius: 20px;
      overflow: hidden;
      margin: 12px 0;
    }
    .progress-fill {
      height: 8px;
      background: var(--primary);
      width: 0%;
      border-radius: 20px;
      transition: width 0.4s;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-item {
      background: var(--bg);
      border-radius: 20px;
      padding: 12px;
    }
    .lesson-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .lesson-item:last-child { border: none; }
    .icon-bg {
      background: rgba(56, 189, 248, 0.15);
      padding: 10px;
      border-radius: 18px;
      line-height: 0;
    }
    button {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      padding: 14px 24px;
      border-radius: 40px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.15s;
      width: fit-content;
    }
    button.outline {
      background: transparent;
      border: 1.5px solid var(--primary);
      color: var(--primary);
    }

    /* modal */
    .modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-content {
      background: var(--card);
      width: 280px;
      padding: 24px;
      border-radius: 36px;
      text-align: center;
      color: var(--text-primary);
    }
    .modal-close {
      margin-top: 20px;
      background: var(--primary);
      width: 100%;
    }
    .hidden { display: none; }

    /* onboarding specific */
    .onboarding-logo {
      background: var(--primary);
      width: 70px;
      height: 70px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px auto 16px;
    }
    .tagline {
      font-size: 18px;
      font-weight: 600;
      margin: 8px 0 4px;
    }
    .description {
      color: var(--text-secondary);
      font-size: 15px;
      margin: 10px 0 24px;
    }
    .legal-links {
      display: flex;
      gap: 24px;
      justify-content: center;
      margin: 28px 0 16px;
      font-size: 13px;
    }
    .legal-links span {
      color: var(--primary);
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <!-- header injected via JS -->
  <div id="headerPlaceholder"></div>

  <!-- main screen container -->
  <div id="appScreen" class="screen-content"></div>

  <!-- bottom nav (static, controlled) -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item" data-tab="home">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10L12 3L21 10V20H3V10Z"/><path d="M9 20V14H15V20"/></svg>
      <span class="nav-label">Home</span>
    </button>
    <button class="nav-item" data-tab="learn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3H8C10.2 3 12 4.8 12 7V21C12 19.9 11.1 19 10 19H2V3Z"/><path d="M22 3H16C13.8 3 12 4.8 12 7V21C12 19.9 12.9 19 14 19H22V3Z"/></svg>
      <span class="nav-label">Learn</span>
    </button>
    <button class="nav-item" data-tab="progress">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V18C21 19.1 20.1 20 19 20H5C3.9 20 3 19.1 3 18V12"/><rect x="7" y="2" width="10" height="12" rx="1"/><path d="M12 8V2"/></svg>
      <span class="nav-label">Progress</span>
    </button>
    <button class="nav-item" data-tab="settings">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15C18.9 16 18.1 16.7 17.2 17.2L19 20.6L16.9 21.5L15 18.2C14.1 18.4 13.1 18.4 12 18.4C10.9 18.4 9.9 18.3 9 18.1L7.1 21.4L5 20.5L6.8 17.1C5.9 16.6 5.1 15.9 4.6 15L1 15L1 12L4.6 12C4.5 11.3 4.5 10.7 4.6 10L1 10L1 7L4.6 7C5.1 6 5.9 5.3 6.8 4.8L5 1.5L7.1 0.6L9 3.9C9.9 3.7 10.9 3.6 12 3.6C13.1 3.6 14.1 3.8 15 4L16.9 0.7L19 1.6L17.2 5C18.1 5.5 18.9 6.2 19.4 7.2L22.8 7.2L22.8 10.2L19.8 10.2C19.9 10.9 19.9 11.5 19.8 12.2L22.8 12.2L22.8 15.2L19.4 15Z"/></svg>
      <span class="nav-label">Settings</span>
    </button>
  </nav>
</div>

<!-- modal templates -->
<div id="modalContainer" class="modal hidden"></div>

<script>
  (function() {
    // ---------- THEME / DARK MODE ----------
    const setTheme = (isDark) => {
      if (isDark) document.body.classList.add('dark');
      else document.body.classList.remove('dark');
    };
    let darkMode = false; // light default

    // ---------- ICON SYSTEM (reusable) ----------
    const icons = {
      profile: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21V19C20 16.8 18.2 15 16 15H8C5.8 15 4 16.8 4 19V21"/><circle cx="12" cy="7" r="4"/></svg>',
      check: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
      chart: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V20H3V16"/><path d="M7 10L10 13L15 7L20 12"/></svg>',
      flashcards: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M8 10h8M8 14h5"/></svg>',
      play: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
      lesson: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>'
    };

    // ---------- STATE ----------
    let currentScreen = 'onboarding'; // 'onboarding','home','learn','progress','settings'
    let activeTab = 'home'; // for bottom nav
    const screens = ['home','learn','progress','settings'];

    // ---------- UTILS: render header ----------
    function renderHeader(title) {
      return `
        <div class="header">
          <div class="header-left"><h1>${title}</h1></div>
          <button class="profile-btn" id="profileHeaderBtn">${icons.profile}</button>
        </div>
      `;
    }

    // ---------- SCREEN RENDERERS ----------
    function getOnboardingScreen() {
      return `
        <div style="text-align: center; padding: 12px 0;">
          <div class="onboarding-logo">${icons.flashcards.replace('width="24"','width="40"').replace('height="24"','height="40"').replace('stroke="currentColor"','stroke="white"')}</div>
          <h2 style="font-size: 34px; font-weight: 700; letter-spacing: -1px;">CodeFlow</h2>
          <div class="tagline">learn Python · 3 min a day</div>
          <div class="description">Bite-sized Python challenges, flashcards, and real code practice. From zero to hero.</div>
          <button id="getStartedBtn" style="width: 100%;">Get Started</button>
          <div class="legal-links">
            <span id="privacyLink">Privacy Policy</span>
            <span id="termsLink">Terms of Service</span>
          </div>
        </div>
      `;
    }

    function getHomeScreen() {
      return `
        <div style="margin-top: 16px;">
          <div class="card">
            <div class="flex-row"><span class="badge">🔥 daily streak 7</span><span>⭐ 340 XP</span></div>
            <h3 style="margin: 16px 0 6px;">Continue where you left</h3>
            <div class="lesson-item">
              <div class="icon-bg">${icons.play}</div>
              <div style="flex:1"><b>Variables & Data types</b><div style="font-size:13px;color:var(--text-secondary)">60% complete</div></div>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div>
            <button class="outline" style="width:100%; margin-top:8px;" id="homeResumeBtn">Resume</button>
          </div>
          <div class="card">
            <div class="flex-row"><span><b>Today's picks</b></span><span style="color:var(--primary)">4 challenges</span></div>
            <div class="lesson-item"><div class="icon-bg">${icons.flashcards}</div><div><b>Lists & loops</b><div style="font-size:12px">flashcards · 5 min</div></div></div>
            <div class="lesson-item"><div class="icon-bg">${icons.lesson}</div><div><b>Functions 101</b><div style="font-size:12px">practice · 8 min</div></div></div>
          </div>
        </div>
      `;
    }

    function getLearnScreen() {
      return `
        <div style="margin-top:16px;">
          <div class="card">
            <h3>Python foundations</h3>
            <div class="lesson-item"><div class="icon-bg">${icons.check}</div><div><b>Syntax & variables</b><span style="float:right;color:green;">done</span></div></div>
            <div class="lesson-item"><div class="icon-bg">${icons.play}</div><div><b>Conditionals</b><span style="float:right;color:var(--primary)">75%</span></div></div>
            <div class="lesson-item"><div class="icon-bg">${icons.flashcards}</div><div><b>Loops</b><span style="float:right;color:var(--primary)">new</span></div></div>
            <div class="lesson-item"><div class="icon-bg">${icons.lesson}</div><div><b>Functions</b><span style="float:right;">locked</span></div></div>
          </div>
          <div class="card">
            <div class="flex-row"><span><b>Practice zone</b></span><button class="outline" style="padding:8px 16px;">start</button></div>
            <div class="progress-bar" style="margin:12px 0 4px;"><div class="progress-fill" style="width:30%"></div></div>
            <div style="font-size:14px;">30% of weekly goal</div>
          </div>
        </div>
      `;
    }

    function getProgressScreen() {
      return `
        <div style="margin-top:16px;">
          <div class="card">
            <div class="flex-row"><span><b>Last 7 days</b></span>${icons.chart}</div>
            <div style="display:flex; gap:6px; justify-content:space-between; margin:20px 0;">
              <div style="width:28px; height:40px; background:var(--primary); border-radius:12px; opacity:0.5;"></div><div style="width:28px; height:60px; background:var(--primary); border-radius:12px;"></div><div style="width:28px; height:35px; background:var(--primary); border-radius:12px; opacity:0.4;"></div><div style="width:28px; height:80px; background:var(--primary); border-radius:12px;"></div><div style="width:28px; height:70px; background:var(--primary); border-radius:12px;"></div><div style="width:28px; height:45px; background:var(--primary); border-radius:12px; opacity:0.6;"></div><div style="width:28px; height:55px; background:var(--primary); border-radius:12px;"></div>
            </div>
          </div>
          <div class="stat-grid">
            <div class="stat-item"><span style="font-size:28px;">24</span><br>lessons done</div>
            <div class="stat-item"><span style="font-size:28px;">1,280</span><br>total XP</div>
            <div class="stat-item"><span style="font-size:28px;">7</span><br>day streak</div>
            <div class="stat-item"><span style="font-size:28px;">4</span><br>achievements</div>
          </div>
        </div>
      `;
    }

    function getSettingsScreen() {
      return `
        <div style="margin-top:16px;">
          <div class="card">
            <div class="flex-row"><span><b>Appearance</b></span><button id="themeToggleBtn" class="outline" style="padding:8px 20px;">${darkMode ? 'Light' : 'Dark'}</button></div>
            <div style="margin:20px 0 10px;"><span>Sound effects</span> <span style="float:right;">🔔 on</span></div>
            <div><span>Daily reminder</span> <span style="float:right;">8:00 PM</span></div>
          </div>
          <div class="card">
            <div><b>Profile</b> <span style="float:right;">Alex C.</span></div>
            <hr style="border-color:var(--border-light);margin:12px 0;">
            <div>Account ·  alex@mail.com</div>
          </div>
        </div>
      `;
    }

    // ---------- MAIN RENDER ----------
    function renderScreen() {
      const screenEl = document.getElementById('appScreen');
      const headerPlaceholder = document.getElementById('headerPlaceholder');
      let bodyHTML = '', headerTitle = '';

      if (currentScreen === 'onboarding') {
        headerTitle = 'Welcome';
        bodyHTML = getOnboardingScreen();
        document.getElementById('bottomNav').classList.add('hidden');
      } else {
        document.getElementById('bottomNav').classList.remove('hidden');
        if (currentScreen === 'home') { headerTitle = 'Home'; bodyHTML = getHomeScreen(); }
        else if (currentScreen === 'learn') { headerTitle = 'Learn'; bodyHTML = getLearnScreen(); }
        else if (currentScreen === 'progress') { headerTitle = 'Progress'; bodyHTML = getProgressScreen(); }
        else if (currentScreen === 'settings') { headerTitle = 'Settings'; bodyHTML = getSettingsScreen(); }
      }

      headerPlaceholder.innerHTML = renderHeader(headerTitle);
      screenEl.innerHTML = bodyHTML;

      // bottom nav active
      document.querySelectorAll('.nav-item').forEach(btn => {
        const tab = btn.dataset.tab;
        if (currentScreen !== 'onboarding' && tab === currentScreen) {
          btn.classList.add('active');
          activeTab = tab;
        } else btn.classList.remove('active');
      });

      // attach listeners
      attachScreenListeners();
    }

    // ---------- EVENT LISTENERS ----------
    function attachScreenListeners() {
      // profile button
      const profileBtn = document.getElementById('profileHeaderBtn');
      if (profileBtn) profileBtn.addEventListener('click', () => { currentScreen = 'settings'; renderScreen(); });

      // onboarding actions
      if (currentScreen === 'onboarding') {
        document.getElementById('getStartedBtn')?.addEventListener('click', () => {
          currentScreen = 'home';
          renderScreen();
        });
        document.getElementById('privacyLink')?.addEventListener('click', () => showModal('Privacy Policy', 'We respect your data. No selling.'));
        document.getElementById('termsLink')?.addEventListener('click', () => showModal('Terms of Service', 'Educational use only. Be nice.'));
      }

      // theme toggle (settings)
      if (currentScreen === 'settings') {
        document.getElementById('themeToggleBtn')?.addEventListener('click', () => {
          darkMode = !darkMode;
          setTheme(darkMode);
          renderScreen(); // refresh (text changes)
        });
      }

      // resume lesson (home) -> go to learn
      document.getElementById('homeResumeBtn')?.addEventListener('click', () => {
        currentScreen = 'learn';
        renderScreen();
      });

      // bottom nav clicks
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const tab = btn.dataset.tab;
          if (tab && screens.includes(tab)) {
            currentScreen = tab;
            renderScreen();
          }
        });
      });
    }

    // ---------- MODAL ----------
    function showModal(title, text) {
      const modalDiv = document.getElementById('modalContainer');
      modalDiv.innerHTML = `
        <div class="modal-content">
          <h3 style="margin-bottom: 12px;">${title}</h3>
          <p>${text}</p>
          <button class="modal-close" id="modalCloseBtn">OK</button>
        </div>
      `;
      modalDiv.classList.remove('hidden');
      document.getElementById('modalCloseBtn').addEventListener('click', () => modalDiv.classList.add('hidden'));
      modalDiv.addEventListener('click', (e) => { if (e.target === modalDiv) modalDiv.classList.add('hidden'); });
    }

    // ---------- SCREENSHOT (SHIFT+W) ----------
    let screenshotCounter = 1;
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const phone = document.getElementById('phoneContainer');
        import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm').then(({ default: html2canvas }) => {
          html2canvas(phone, { scale: 2, backgroundColor: null }).then(canvas => {
            const link = document.createElement('a');
            const darkSuffix = darkMode ? '6' : screenshotCounter;
            link.download = `${darkMode ? 6 : screenshotCounter}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            if (!darkMode) screenshotCounter = (screenshotCounter % 5) + 1;
          });
        }).catch(() => alert('html2canvas failed'));
      }
    });
