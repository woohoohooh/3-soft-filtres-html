```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeQuest · Learn Python</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1e293b;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px -10px rgba(0,0,0,0.5), 0 0 0 8px #334155;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
        }

        /* theme variables */
        :root {
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --shadow: 0 4px 12px rgba(0,0,0,0.03);
            --nav-active-bg: rgba(37, 99, 235, 0.08);
            --progress-bg: #E2E8F0;
        }

        body.dark {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --shadow: 0 4px 12px rgba(0,0,0,0.4);
            --nav-active-bg: rgba(59, 130, 246, 0.15);
            --progress-bg: #334155;
        }

        /* main flex column */
        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px 8px 20px;
            background: var(--bg-primary);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .profile-icon {
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
            transition: background 0.15s;
        }
        .profile-icon:hover { background: var(--nav-active-bg); }

        /* content area */
        .screen-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px 0 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) transparent;
        }
        .screen-content::-webkit-scrollbar { width: 4px; }
        .screen-content::-webkit-scrollbar-thumb { background: var(--inactive); border-radius: 4px; }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--bg-card);
            padding: 8px 12px 10px;
            border-top: 1px solid var(--border-light);
            box-shadow: var(--shadow);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 24px;
            transition: all 0.15s ease;
            background: transparent;
            border: none;
            width: 64px;
        }

        .nav-item.active {
            background: var(--nav-active-bg);
            transform: scale(1.02);
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke: var(--inactive);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.15s, transform 0.15s;
        }

        .nav-item.active svg {
            stroke: var(--primary);
            transform: scale(1.15);
        }

        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            color: var(--inactive);
            transition: color 0.15s;
        }

        .nav-item.active span {
            color: var(--primary);
            font-weight: 600;
        }

        /* onboarding cards */
        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 32px 0 24px;
        }

        .app-logo svg {
            width: 72px;
            height: 72px;
            stroke: var(--primary);
            stroke-width: 1.8;
            fill: none;
        }

        .app-name {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            margin-top: 8px;
        }

        .tagline {
            font-size: 18px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .description {
            text-align: center;
            color: var(--text-secondary);
            margin: 16px 0 28px;
            line-height: 1.5;
            padding: 0 12px;
        }

        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            font-size: 18px;
            padding: 16px 24px;
            border-radius: 40px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 8px 16px -6px var(--primary-dark);
            transition: background 0.1s, transform 0.1s;
        }
        .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }

        .legal-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 24px 0 16px;
        }
        .legal-links button {
            background: none;
            border: none;
            color: var(--inactive);
            text-decoration: underline;
            font-size: 14px;
            cursor: pointer;
        }

        /* modal */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal.hidden { display: none; }
        .modal-card {
            background: var(--bg-card);
            width: 280px;
            padding: 28px 20px;
            border-radius: 28px;
            text-align: center;
            color: var(--text-primary);
            box-shadow: 0 30px 40px black;
        }
        .modal-card h3 { font-size: 20px; margin-bottom: 12px; }
        .modal-card p { font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; }
        .modal-card button {
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px 32px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
        }

        /* dashboard cards */
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 18px 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }

        .row-space {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 12px;
        }

        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 20px;
            margin: 12px 0 6px;
        }
        .progress-fill {
            width: 0%;
            height: 8px;
            background: var(--primary);
            border-radius: 20px;
            transition: width 0.3s;
        }

        .stat-grid {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .stat-item {
            background: var(--bg-primary);
            padding: 12px;
            border-radius: 20px;
            flex: 1 0 40%;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border-light);
        }

        /* lesson item */
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
        }
        .lesson-item:last-child { border: none; }

        .icon-bg {
            background: var(--nav-active-bg);
            padding: 10px;
            border-radius: 18px;
        }

        .toggle-switch {
            width: 44px;
            height: 24px;
            background: var(--inactive);
            border-radius: 40px;
            display: inline-block;
            position: relative;
            cursor: pointer;
        }
        .toggle-switch.dark {
            background: var(--primary);
        }
        .toggle-switch::after {
            content: '';
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: left 0.15s;
        }
        .toggle-switch.dark::after {
            left: 22px;
        }

        .hidden { display: none; }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <div class="app" id="app">
        <!-- dynamic header -->
        <div class="header" id="appHeader">
            <h1 id="headerTitle">Welcome</h1>
            <div class="profile-icon" id="profileBtn">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
            </div>
        </div>

        <!-- screen container (views) -->
        <div id="screenContainer" class="screen-content"></div>

        <!-- bottom nav (4 items) -->
        <div class="bottom-nav" id="bottomNav">
            <div class="nav-item" data-tab="home">
                <svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z"/></svg>
                <span>Home</span>
            </div>
            <div class="nav-item" data-tab="learn">
                <svg viewBox="0 0 24 24"><path d="M2 3H8C9.1 3 10 3.9 10 5V21L6 18L2 21V5C2 3.9 2.9 3 4 3"/><path d="M22 3H16C14.9 3 14 3.9 14 5V21L18 18L22 21V5C22 3.9 21.1 3 20 3"/></svg>
                <span>Learn</span>
            </div>
            <div class="nav-item" data-tab="progress">
                <svg viewBox="0 0 24 24"><path d="M21 12V18C21 19.1 20.1 20 19 20H5C3.9 20 3 19.1 3 18V6C3 4.9 3.9 4 5 4H12"/><path d="M15 9L21 3"/><path d="M15 3H21V9"/></svg>
                <span>Progress</span>
            </div>
            <div class="nav-item" data-tab="settings">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15L21 12L19.4 9L17 8L15 4H9L7 8L4.6 9L3 12L4.6 15L7 16L9 20H15L17 16L19.4 15Z"/></svg>
                <span>Settings</span>
            </div>
        </div>
    </div>

    <!-- modal privacy/terms -->
    <div id="modalOverlay" class="modal hidden">
        <div class="modal-card">
            <h3 id="modalTitle">Privacy Policy</h3>
            <p id="modalText">We respect your data. This is a demo app.</p>
            <button id="closeModal">OK</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // ----- theme & state -----
        const body = document.body;
        let darkMode = false;
        let currentScreen = 'onboarding'; // screens: onboarding, home, learn, progress, settings

        // ----- icon system (inline svg) -----
        const icons = {
            home: '<svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z"/></svg>',
            learn: '<svg viewBox="0 0 24 24"><path d="M2 3H8C9.1 3 10 3.9 10 5V21L6 18L2 21V5C2 3.9 2.9 3 4 3"/><path d="M22 3H16C14.9 3 14 3.9 14 5V21L18 18L22 21V5C22 3.9 21.1 3 20 3"/></svg>',
            progress: '<svg viewBox="0 0 24 24"><path d="M21 12V18C21 19.1 20.1 20 19 20H5C3.9 20 3 19.1 3 18V6C3 4.9 3.9 4 5 4H12"/><path d="M15 9L21 3"/><path d="M15 3H21V9"/></svg>',
            settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15L21 12L19.4 9L17 8L15 4H9L7 8L4.6 9L3 12L4.6 15L7 16L9 20H15L17 16L19.4 15Z"/></svg>',
            profile: '<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
            lesson: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8V16"/><path d="M8 12H16"/></svg>',
            chart: '<svg viewBox="0 0 24 24"><path d="M21 16V20H3V4H7V16H21Z"/><path d="M7 12H13V16H7"/><path d="M13 8H17V16H13"/></svg>',
            flashcards: '<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="M7 7H17"/><path d="M7 12H17"/><path d="M7 17H13"/></svg>',
            play: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16" fill="currentColor"/></svg>',
            check: '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
        };

        // ----- header & nav refs -----
        const headerTitle = document.getElementById('headerTitle');
        const screenDiv = document.getElementById('screenContainer');
        const navItems = document.querySelectorAll('.nav-item');
        const profileBtn = document.getElementById('profileBtn');
        const modal = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalText = document.getElementById('modalText');
        const closeModal = document.getElementById('closeModal');

        // ---- helpers ----
        function setScreen(screenId) {
            currentScreen = screenId;
            if (screenId === 'onboarding') headerTitle.innerText = 'Welcome';
            else if (screenId === 'home') headerTitle.innerText = 'Home';
            else if (screenId === 'learn') headerTitle.innerText = 'Learn Python';
            else if (screenId === 'progress') headerTitle.innerText = 'Progress';
            else if (screenId === 'settings') headerTitle.innerText = 'Settings';

            renderScreen(screenId);
            updateActiveNav(screenId);
        }

        function updateActiveNav(screen) {
            navItems.forEach(item => {
                const tab = item.dataset.tab;
                if (screen === tab) item.classList.add('active');
                else item.classList.remove('active');
            });
        }

        // ----- renderers -----
        function renderOnboarding() {
            return `
                <div class="logo-area">
                    <div class="app-logo">${icons.flashcards.replace('stroke="currentColor"', `stroke="var(--primary)"`)}</div>
                    <div class="app-name">CodeQuest</div>
                    <div class="tagline">learn Python · 5 min a day</div>
                </div>
                <p class="description">Master Python through bite-sized challenges. Interactive lessons, real code examples, and progress tracking.</p>
                <button class="btn-primary" id="getStartedBtn">Get Started</button>
                <div class="legal-links">
                    <button id="privacyBtn">Privacy Policy</button>
                    <button id="termsBtn">Terms of Service</button>
                </div>
                <!-- extra spacing -->
                <div style="height:20px"></div>
            `;
        }

        function renderHome() {
            return `
                <div class="card">
                    <div class="row-space"><span class="badge">🔥 streak 7 days</span><span>🏆 120 XP</span></div>
                    <h3 style="margin: 10px 0 6px">Continue where you left</h3>
                    <div class="lesson-item" id="resumeLesson">
                        <div class="icon-bg">${icons.lesson}</div>
                        <div><strong>Variables & Data Types</strong><br>50% completed</div>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" style="width:50%"></div></div>
                </div>
                <div class="card">
                    <div class="row-space"><strong>Daily pick</strong> <span>${icons.play}</span></div>
                    <div style="display:flex; gap:12px; margin:8px 0">
                        <span>⚡ if/else</span><span>🔄 loops</span><span>📋 lists</span>
                    </div>
                    <button class="btn-primary" style="padding:12px" id="quickPractice">Practice now</button>
                </div>
                <div class="card">
                    <strong>Upcoming lessons</strong>
                    <div class="lesson-item"><span>🔹 Functions (new)</span><span>5 min</span></div>
                    <div class="lesson-item"><span>🔹 Dictionaries</span><span>8 min</span></div>
                </div>
            `;
        }

        function renderLearn() {
            return `
                <div class="card" style="text-align:center">
                    <h3>Python basics</h3>
                    <div style="display:flex; gap:10px; margin:14px 0; justify-content:center">
                        <span class="badge">8 topics</span><span class="badge">⭐ 340 XP</span>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" style="width:32%"></div></div>
                </div>
                <div class="lesson-item"><div class="icon-bg">${icons.play}</div> <div><strong>1. Hello World</strong><br>Interactive</div> </div>
                <div class="lesson-item"><div class="icon-bg">${icons.play}</div> <div><strong>2. Variables</strong><br>Quiz</div> </div>
                <div class="lesson-item"><div class="icon-bg">${icons.play}</div> <div><strong>3. Conditionals</strong><br>Coding</div> </div>
                <div class="lesson-item"><div class="icon-bg">${icons.flashcards}</div> <div><strong>4. Loops</strong><br>Flashcards</div> </div>
                <button class="btn-primary" style="margin-top:12px" id="startLesson">Start lesson</button>
            `;
        }

        function renderProgress() {
            return `
                <div class="card">
                    <div class="row-space"><strong>Weekly activity</strong> <span>${icons.chart}</span></div>
                    <div style="display:flex; gap:4px; height:50px; align-items:flex-end; margin:14px 0">
                        <div style="background:var(--primary); width:20%; height:30px; border-radius:8px"></div>
                        <div style="background:var(--primary); width:20%; height:48px; border-radius:8px"></div>
                        <div style="background:var(--primary); width:20%; height:22px; border-radius:8px"></div>
                        <div style="background:var(--primary); width:20%; height:40px; border-radius:8px"></div>
                        <div style="background:var(--accent); width:20%; height:56px; border-radius:8px"></div>
                    </div>
                </div>
                <div class="stat-grid">
                    <div class="stat-item">${icons.check} <span>85% correct</span></div>
                    <div class="stat-item">🔥 7 day streak</div>
                    <div class="stat-item">📘 23 lessons</div>
                    <div class="stat-item">⏱️ 4.2h total</div>
                </div>
                <div class="card">
                    <strong>Achievements</strong>
                    <div style="display:flex; gap:12px; margin-top:16px">
                        <span>🏅 Quick starter</span><span>⚡ 5 day streak</span><span>🐍 Pythonista</span>
                    </div>
                </div>
            `;
        }

        function renderSettings() {
            return `
                <div class="card">
                    <div class="row-space">
                        <span>Dark mode</span>
                        <span class="toggle-switch ${darkMode ? 'dark' : ''}" id="themeToggle"></span>
                    </div>
                </div>
                <div class="card">
                    <div class="lesson-item"><span>🔔 Notifications</span></div>
                    <div class="lesson-item"><span>🔒 Privacy</span></div>
                    <div class="lesson-item"><span>🌐 Language</span></div>
                    <div class="lesson-item"><span>ℹ️ App version 1.2.0</span></div>
                </div>
                <div style="height:10px"></div>
            `;
        }

        function renderScreen(name) {
            if (name === 'onboarding') screenDiv.innerHTML = renderOnboarding();
            else if (name === 'home') screenDiv.innerHTML = renderHome();
            else if (name === 'learn') screenDiv.innerHTML = renderLearn();
            else if (name === 'progress') screenDiv.innerHTML = renderProgress();
            else if (name === 'settings') screenDiv.innerHTML = renderSettings();

            // attach dynamic listeners
            if (name === 'onboarding') {
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                    setScreen('home');
                });
                document.getElementById('privacyBtn')?.addEventListener('click', ()=> showModal('Privacy Policy','Simple privacy demo. No data collected.'));
                document.getElementById('termsBtn')?.addEventListener('click', ()=> showModal('Terms of Service','Educational demo only.'));
            }
            if (name === 'home') {
                document.getElementById('resumeLesson')?.addEventListener('click', ()=> alert('resume lesson (demo)'));
                document.getElementById('quickPractice')?.addEventListener('click', ()=> alert('starting practice'));
            }
            if (name === 'learn') {
                document.getElementById('startLesson')?.addEventListener('click', ()=> alert('open lesson: variables'));
            }
            if (name === 'settings') {
                const toggle = document.getElementById('themeToggle');
                if (toggle) toggle.addEventListener('click', (e) => {
                    darkMode = !darkMode;
                    if(darkMode) body.classList.add('dark'); else body.classList.remove('dark');
                    renderScreen('settings'); // re-render to show toggle state
                });
            }
        }

        function showModal(title, text) {
            modalTitle.innerText = title;
            modalText.innerText = text;
            modal.classList.remove('hidden');
        }

        // ----- navigation listeners -----
        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                const tab = item.dataset.tab; // home, learn, progress, settings
                setScreen(tab);
            });
        });

        profileBtn.addEventListener('click', ()=>{
            setScreen('settings');
        });

        closeModal.addEventListener('click', ()=> modal.classList.add('hidden'));
