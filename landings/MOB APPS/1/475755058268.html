<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashLearn — vocabulary builder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #0F172A;
      --text-light: #475569;
      --border: #E2E8F0;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --inactive: #94A3B8;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
      --radius: 24px;
    }

    body.dark {
      --bg: #0F172A;
      --card: #1E293B;
      --text: #E2E8F0;
      --text-light: #94A3B8;
      --border: #334155;
      --primary: #3B82F6;
      --inactive: #64748B;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }

    body {
      background: #1a1e2b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background: var(--bg);
      border-radius: 48px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      position: relative;
      transition: background 0.2s;
    }

    /* main app screens */
    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: none;
      padding: 0 16px;
    }
    .screen::-webkit-scrollbar { display: none; }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 8px;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
    }
    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px 4px;
      color: var(--primary);
    }
    .profile-btn svg {
      width: 28px;
      height: 28px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* bottom navigation */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: var(--card);
      padding: 8px 4px 12px;
      border-top: 1px solid var(--border);
      box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 40px;
      transition: all 0.15s ease;
      color: var(--inactive);
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nav-item.active {
      color: var(--primary);
      background: rgba(37, 99, 235, 0.08);
      transform: scale(1.05);
    }
    .nav-item.active svg {
      stroke: var(--primary);
      stroke-width: 2.2;
    }
    .nav-item span {
      font-size: 11px;
      font-weight: 500;
      color: currentColor;
    }
    .nav-item svg {
      width: 22px;
      height: 22px;
    }

    /* cards & UI */
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 18px;
      margin: 12px 0;
      box-shadow: var(--shadow);
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .progress-bar {
      height: 8px;
      background: var(--border);
      border-radius: 20px;
      margin: 12px 0;
    }
    .progress-fill {
      width: 60%;
      height: 100%;
      background: var(--primary);
      border-radius: 20px;
      transition: width 0.3s;
    }
    .badge-grid {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 16px 0;
    }
    .badge {
      background: var(--accent);
      color: #0F172A;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 14px;
      opacity: 0.9;
    }
    button {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      padding: 14px 24px;
      border-radius: 40px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.15s;
    }
    button.outline {
      background: transparent;
      border: 1.5px solid var(--primary);
      color: var(--primary);
    }
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-content {
      background: var(--card);
      padding: 24px;
      border-radius: 32px;
      width: 280px;
      color: var(--text);
      text-align: center;
    }

    /* screenshot canvas hidden */
    #shot {
      display: none;
    }
    .small-link {
      color: var(--primary);
      font-size: 14px;
      text-decoration: underline;
      cursor: pointer;
      margin: 0 8px;
    }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <!-- dynamic header + screen + bottom nav will be injected -->
</div>
<canvas id="shot" width="360" height="780"></canvas>

<script>
  (function() {
    // ---- icon system (inline svg) ----
    const icons = {
      home: (active) => `<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" stroke-width="2"/></svg>`,
      learn: (active) => `<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><path d="M4 20L12 4L20 20M8 14H16" stroke-width="2"/></svg>`,
      progress: (active) => `<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><circle cx="12" cy="12" r="9" stroke-width="2"/><path d="M12 7V12L15 15" stroke-width="2"/></svg>`,
      settings: (active) => `<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><circle cx="12" cy="12" r="2.5" stroke-width="2"/><path d="M21 12C21 13.5 19.5 15 18 15C16.5 15 15 16.5 15 18C15 19.5 13.5 21 12 21C10.5 21 9 19.5 9 18C9 16.5 7.5 15 6 15C4.5 15 3 13.5 3 12C3 10.5 4.5 9 6 9C7.5 9 9 7.5 9 6C9 4.5 10.5 3 12 3C13.5 3 15 4.5 15 6C15 7.5 16.5 9 18 9C19.5 9 21 10.5 21 12Z" stroke-width="2"/></svg>`,
      profile: `<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><path d="M4 20C4 17 8 15 12 15C16 15 20 17 20 20M12 12C14.5 12 16.5 10 16.5 7.5C16.5 5 14.5 3 12 3C9.5 3 7.5 5 7.5 7.5C7.5 10 9.5 12 12 12Z" stroke-width="2"/></svg>`,
      lesson: `<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><path d="M4 19.5L12 14L20 19.5V5C20 4 19 3 18 3H6C5 3 4 4 4 5V19.5Z" stroke-width="2"/><path d="M8 8H16M8 12H12" stroke-width="2"/></svg>`,
      chart: `<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><path d="M3 17L7 13L11 17L17 11L21 15" stroke-width="2"/><path d="M3 21H21M4 3V21" stroke-width="2"/></svg>`,
      flashcards: `<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><rect x="4" y="2" width="16" height="20" rx="2" stroke-width="2"/><path d="M8 7H16M8 11H14" stroke-width="2"/></svg>`,
      play: `<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><circle cx="12" cy="12" r="9" stroke-width="2"/><path d="M10 8L16 12L10 16V8Z" stroke-width="2"/></svg>`,
      check: `<svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><path d="M20 6L9 17L4 12" stroke-width="2"/></svg>`,
    };

    // ---- state ----
    let currentScreen = 'onboarding'; // 'home','learn','progress','settings'
    let darkMode = false;
    let modalContent = null; // string or null

    // ---- helpers ----
    function emitUpdate() { render(); }
    function setScreen(s) { currentScreen = s; emitUpdate(); }
    function toggleTheme() { darkMode = !darkMode; document.body.classList.toggle('dark', darkMode); emitUpdate(); }
    function showModal(text) { modalContent = text; emitUpdate(); }
    function closeModal() { modalContent = null; emitUpdate(); }

    // ---- main render ----
    function render() {
      const container = document.getElementById('phoneContainer');
      if (!container) return;

      const headerTitle = {
        onboarding: 'FlashLearn',
        home: 'Dashboard',
        learn: 'Vocabulary',
        progress: 'Statistics',
        settings: 'Settings'
      }[currentScreen] || 'FlashLearn';

      const header = `
        <div class="header">
          <h1>${headerTitle}</h1>
          <button class="profile-btn" id="profileBtn">${icons.profile}</button>
        </div>
      `;

      let body = '';
      if (currentScreen === 'onboarding') body = onboardingScreen();
      else if (currentScreen === 'home') body = homeScreen();
      else if (currentScreen === 'learn') body = learnScreen();
      else if (currentScreen === 'progress') body = progressScreen();
      else if (currentScreen === 'settings') body = settingsScreen();

      const nav = (currentScreen !== 'onboarding') ? bottomNav() : '';

      container.innerHTML = header + `<div class="screen" id="activeScreen">${body}</div>` + nav;

      // Attach listeners after render
      if (currentScreen === 'onboarding') {
        document.getElementById('getStarted')?.addEventListener('click', () => { currentScreen = 'home'; emitUpdate(); });
        document.getElementById('privacyLink')?.addEventListener('click', () => showModal('Privacy Policy — we respect your data.'));
        document.getElementById('termsLink')?.addEventListener('click', () => showModal('Terms of Service — use responsibly.'));
      }
      document.getElementById('profileBtn')?.addEventListener('click', () => { currentScreen = 'settings'; emitUpdate(); });

      // bottom nav listeners
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const tab = btn.dataset.tab;
          if (tab) { currentScreen = tab; emitUpdate(); }
        });
      });

      // settings theme toggle
      document.getElementById('themeToggle')?.addEventListener('click', toggleTheme);

      // modal
      if (modalContent) {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `<div class="modal-content"><p>${modalContent}</p><button class="outline" style="margin-top:16px;" id="closeModalBtn">Close</button></div>`;
        container.appendChild(modalDiv);
        document.getElementById('closeModalBtn')?.addEventListener('click', closeModal);
      }

      // practice button demo
      document.getElementById('practiceBtn')?.addEventListener('click', () => {
        alert('Practice started! (simulated)');
      });
      // simulate progress update
      const fill = document.querySelector('.progress-fill');
      if (fill) fill.style.width = Math.floor(40 + Math.random()*40) + '%';
    }

    // ---- screens ----
    function onboardingScreen() {
      return `
        <div style="text-align: center; padding: 40px 0;">
          <div style="background:var(--primary); width:80px; height:80px; border-radius:30px; margin:20px auto; display:flex; align-items:center; justify-content:center;">
            <span style="color:white; font-size:42px; font-weight:800;">F</span>
          </div>
          <h1 style="font-size:32px; color:var(--text);">FlashLearn</h1>
          <p style="color:var(--accent); font-size:18px; margin:8px;">master words daily</p>
          <p style="color:var(--text-light); max-width:260px; margin:16px auto;">Build your English vocabulary with smart flashcards and daily challenges.</p>
          <button id="getStarted" style="width:80%;">Get Started</button>
          <div style="margin:24px 0;">
            <span class="small-link" id="privacyLink">Privacy Policy</span> • 
            <span class="small-link" id="termsLink">Terms of Service</span>
          </div>
        </div>
      `;
    }

    function homeScreen() {
      return `
        <div class="card">
          <div class="row"><span style="font-weight:600;">Daily goal</span><span>70%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
          <div style="display:flex; gap:8px; margin:16px 0 0;">
            <span class="badge">🔥 12 day streak</span>
            <span class="badge">⭐ 340 XP</span>
          </div>
        </div>
        <div class="card">
          <h3 style="margin-bottom:8px;">Recommended lesson</h3>
          <div style="display:flex; gap:16px; align-items:center;">
            <span>${icons.lesson}</span>
            <div><strong>Business English</strong><br>8 new words</div>
            <button style="padding:8px 16px; margin-left:auto;">${icons.play}</button>
          </div>
        </div>
        <div class="badge-grid">
          <span class="badge">travel</span><span class="badge">work</span><span class="badge">idioms</span>
        </div>
        <div class="card" style="display:flex; gap:20px; justify-content:space-around;">
          <div>${icons.flashcards} <strong>48</strong> cards</div>
          <div>${icons.chart} <strong>3</strong> quizzes</div>
        </div>
        <button id="practiceBtn" style="margin:8px 0 24px;">Quick practice</button>
      `;
    }

    function learnScreen() {
      return `
        <div class="card" style="padding:0;">
          <div style="padding:16px; border-bottom:1px solid var(--border);">
            <span style="font-weight:600;">Today’s deck</span> <span style="float:right;">12/20</span>
          </div>
          <div style="padding:16px; display:flex; gap:12px;">
            <span>${icons.flashcards}</span><span>essential words set 5</span>
          </div>
        </div>
        <div class="card">
          <h3>Phrasal verbs</h3>
          <div class="progress-bar"><div class="progress-fill" style="width:40%"></div></div>
          <div style="display:flex; gap:8px; margin:8px 0;">
            <button style="flex:1;">start</button>
            <button class="outline" style="flex:1;">review</button>
          </div>
        </div>
        <div class="card">
          <p><span>${icons.lesson}</span>  •  Intermediate  •  15 min</p>
          <p style="margin-top:8px;">Collocations: make/do</p>
        </div>
      `;
    }

    function progressScreen() {
      return `
        <div class="card">
          <div class="row"><span>Words learned</span><span>1,430</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:74%"></div></div>
          <div class="row"><span>Quizzes passed</span><span>28</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:90%"></div></div>
        </div>
        <div class="card">
          <h3>Weekly activity</h3>
          <div style="display:flex; gap:8px; margin:12px 0;">
            ${[70,45,90,60,80,50,95].map(v => `<div style="height:50px; width:22px; background:var(--primary); border-radius:12px; opacity:${v/100};"></div>`).join('')}
          </div>
        </div>
        <div class="badge-grid">
          <span class="badge">🔥 12 wk streak</span>
          <span class="badge">🏅 polyglot</span>
        </div>
      `;
    }

    function settingsScreen() {
      return `
        <div class="card">
          <div class="row"><span>Dark mode</span><button class="outline" id="themeToggle" style="padding:8px 24px;">toggle</button></div>
          <div class="row" style="margin-top:16px;"><span>Notifications</span><span>on</span></div>
          <div class="row"><span>Sound</span><span>off</span></div>
        </div>
        <div class="card">
          <p>Profile</p>
          <div style="display:flex; align-items:center; gap:12px;">${icons.profile} <span>Alex Johnson</span></div>
        </div>
        <div style="margin-top:24px; text-align:center;">
          <span class="small-link" onclick="showModal('version 1.0')">App version 1.0</span>
        </div>
      `;
    }

    function bottomNav() {
      const tabs = [
        { id: 'home', label: 'Home', icon: 'home' },
        { id: 'learn', label: 'Learn', icon: 'learn' },
        { id: 'progress', label: 'Progress', icon: 'progress' },
        { id: 'settings', label: 'Settings', icon: 'settings' }
      ];
      return `
        <div class="bottom-nav">
          ${tabs.map(t => {
            const active = (currentScreen === t.id);
            return `<button class="nav-item ${active ? 'active' : ''}" data-tab="${t.id}">
              ${icons[t.icon](active)}<span>${t.label}</span>
            </button>`;
          }).join('')}
        </div>
      `;
    }

    // ---- screenshot ----
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const phone = document.getElementById('phoneContainer');
        const canvas = document.getElementById('shot');
        const ctx = canvas.getContext('2d');
        // use html2canvas-like manually? we can use dom-to-image? no, but we use simple canvas draw from xml? We'll use dom-to-image polyfill? For pure html we raster the phone container with a trick: inline style background.
        // Since no external libs, we alert to use a real tool, but we simulate naming.
        // We'll just trigger download with a dummy gray image + filename logic.
        // We'll output filenames: 1.png..6.png depending on dark mode
        const isDark = document.body.classList.contains('dark');
        const baseName = isDark ? '6.png' : (window._shotCounter || 1) + '.png';
        if (!isDark) {
          window._shotCounter = (window._shotCounter || 1) + 1;
          if (window._shotCounter > 5) window._shotCounter = 1;
        }
        // fake download (just a mock message)
        alert(`[DEV] Screenshot saved as ${baseName} (mock — use real capture tool)`);
      }
    });

    // initial render
    render();

    // expose for modal links
    window.showModal = showModal;

  })();
</script>
