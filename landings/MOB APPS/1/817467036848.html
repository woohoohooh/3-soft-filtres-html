```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeFlash · Python learn</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --border: #E2E8F0;
            --inactive: #94A3B8;
            --shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.05);
        }
        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --border: #334155;
            --inactive: #64748B;
            --shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        body {
            background: #1a1e2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        #phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
        }
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 16px 18px 8px 18px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) transparent;
        }
        .screen::-webkit-scrollbar {
            width: 4px;
        }
        .screen::-webkit-scrollbar-thumb {
            background: var(--inactive);
            border-radius: 20px;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 16px 0;
        }
        .header h2 {
            font-size: 22px;
            font-weight: 650;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .profile-icon {
            background: transparent;
            border: none;
            padding: 6px;
            cursor: pointer;
            border-radius: 12px;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-icon:hover {
            background: var(--border);
        }
        .profile-icon svg {
            width: 26px;
            height: 26px;
            stroke: var(--text);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* bottom nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 14px 12px;
            background: var(--card);
            border-top: 1px solid var(--border);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }
        .nav-item {
            background: transparent;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 500;
            color: var(--inactive);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 30px;
            transition: all 0.2s ease;
            stroke: var(--inactive);
            stroke-width: 2;
        }
        .nav-item.active {
            color: var(--primary);
            stroke: var(--primary);
            background: rgba(37, 99, 235, 0.08);
            transform: scale(1.05);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-item span {
            color: currentColor;
        }

        /* cards / elements */
        .big-card {
            background: var(--card);
            border-radius: 28px;
            padding: 20px 18px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }
        .onboarding-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 32px;
        }
        .logo-svg {
            width: 70px;
            height: 70px;
            stroke: var(--primary);
            stroke-width: 2;
            fill: rgba(37,99,235,0.1);
            margin-bottom: 16px;
        }
        .app-name {
            font-size: 34px;
            font-weight: 700;
            color: var(--primary-dark);
            letter-spacing: -1px;
        }
        .tagline {
            font-size: 18px;
            font-weight: 500;
            color: var(--accent);
            margin: 6px 0 12px;
        }
        .desc {
            color: var(--text-light);
            text-align: center;
            line-height: 1.5;
            margin: 10px 0 28px;
        }
        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            font-size: 18px;
            padding: 18px 24px;
            border-radius: 60px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(37,99,235,0.25);
            transition: 0.1s;
        }
        .btn-primary:active {
            transform: scale(0.98);
            background: var(--primary-dark);
        }
        .legal-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 30px;
            font-size: 13px;
        }
        .legal-links button {
            background: none;
            border: none;
            color: var(--inactive);
            text-decoration: underline;
            cursor: pointer;
        }

        /* modal */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card);
            padding: 28px;
            border-radius: 40px;
            width: 280px;
            color: var(--text);
            box-shadow: 0 20px 30px black;
        }
        .modal-content button {
            margin-top: 20px;
            background: var(--primary);
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            width: 100%;
        }

        /* progress */
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 16px 0 8px;
        }
        .progress-bar-bg {
            background: var(--border);
            height: 10px;
            border-radius: 20px;
            overflow: hidden;
        }
        .progress-fill {
            background: var(--primary);
            width: 0%;
            height: 10px;
            border-radius: 20px;
            transition: width 0.3s ease;
        }
        .badge-grid {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 15px 0;
        }
        .badge {
            background: rgba(56, 189, 248, 0.15);
            border-radius: 40px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
            font-weight: 500;
        }
        .chart-svg {
            width: 100%;
            height: 100px;
            margin: 12px 0;
        }

        .lesson-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }
        .lesson-play {
            background: var(--accent);
            border: none;
            border-radius: 40px;
            padding: 8px 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        .hidden {
            display: none !important;
        }

        /* toggle */
        .theme-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
<div id="phone"></div>

<script>
    (function() {
        // ---------- THEME & STATE ----------
        let currentTheme = 'light';
        let currentScreen = 'onboarding'; // screens: onboarding, home, learn, progress, settings
        let modalContent = null; // 'privacy' or 'terms'

        // icons (svg strings, outline 2px, round caps)
        const icons = {
            home: `<svg viewBox="0 0 24 24"><path d="M5 12l-2 2v8h8v-6h6v6h8v-8l-2-2L12 3 5 12z" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
            learn: `<svg viewBox="0 0 24 24"><path d="M2 3h8c2 0 4 1 4 4v12c0-2-2-4-4-4H2V3zM22 3h-8c-2 0-4 1-4 4v12c0-2 2-4 4-4h8V3z" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>`,
            progress: `<svg viewBox="0 0 24 24"><path d="M21 21v-8M15 21v-6M9 21V9M3 21V3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`,
            settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5" stroke="currentColor" fill="none" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62l.04-.04zM4.6 9a1.65 1.65 0 0 0-.33 1.82c.3.65.98 1.09 1.51 1h12.44c.53 0 1.21-.44 1.51-1 .34-.74.1-1.6-.33-1.82l-.04-.04A10 10 0 0 0 12 6.34a10 10 0 0 0-6.36 2.62l-.04.04z" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>`,
            profile: `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7" r="4" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            lesson: `<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2" stroke="currentColor" fill="none" stroke-width="2"/><path d="M8 7h8M8 11h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
            chart: `<svg viewBox="0 0 24 24"><path d="M21 21H4V4" stroke="currentColor" fill="none" stroke-width="2"/><path d="M7 15l3-4 3 4 4-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
            flashcards: `<svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z M8 4v4M16 4v4" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            play: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" fill="none" stroke-width="2"/><path d="M10 8l6 4-6 4V8z" fill="currentColor" stroke="none"/></svg>`,
            check: `<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`,
        };

        // ----- helper: render screen inside phone -----
        const phone = document.getElementById('phone');

        function renderApp() {
            const themeClass = currentTheme === 'dark' ? 'dark' : '';
            document.body.className = themeClass;

            let modalHTML = '';
            if (modalContent === 'privacy') {
                modalHTML = `<div class="modal"><div class="modal-content"><h3>Privacy</h3><p style="margin:16px 0">We respect your data. No tracking.</p><button onclick="window.closeModal()">OK</button></div></div>`;
            } else if (modalContent === 'terms') {
                modalHTML = `<div class="modal"><div class="modal-content"><h3>Terms</h3><p style="margin:16px 0">Educational use only. Be nice.</p><button onclick="window.closeModal()">OK</button></div></div>`;
            }

            let headerTitle = '';
            if (currentScreen === 'onboarding') headerTitle = 'Welcome';
            else if (currentScreen === 'home') headerTitle = 'Dashboard';
            else if (currentScreen === 'learn') headerTitle = 'Python';
            else if (currentScreen === 'progress') headerTitle = 'Stats';
            else if (currentScreen === 'settings') headerTitle = 'Settings';

            const header = `
                <div class="header">
                    <h2>${headerTitle}</h2>
                    <button class="profile-icon" onclick="window.goToSettings()">${icons.profile}</button>
                </div>
            `;

            let content = '';

            // ----- SCREENS -----
            if (currentScreen === 'onboarding') {
                content = `
                    <div class="onboarding-logo">
                        <div class="logo-svg">${icons.flashcards.replace('currentColor', 'var(--primary)')}</div>
                        <div class="app-name">CodeFlash</div>
                        <div class="tagline">learn Python · 3 min a day</div>
                        <div class="desc">Bite‑sized Python lessons, flashcards and coding challenges. Build skills fast.</div>
                        <button class="btn-primary" onclick="window.navTo('home')">Get Started</button>
                        <div class="legal-links">
                            <button onclick="window.openModal('privacy')">Privacy Policy</button>
                            <button onclick="window.openModal('terms')">Terms of Service</button>
                        </div>
                    </div>
                `;
            } else if (currentScreen === 'home') {
                content = `
                    <div class="big-card">
                        <div style="display:flex; gap:16px; align-items:center;">
                            <span>${icons.lesson.replace('currentColor', 'var(--primary)')}</span>
                            <div><strong>Current streak</strong> 12 days 🔥</div>
                        </div>
                        <div class="progress-bar-bg" style="margin:16px 0"><div class="progress-fill" style="width:68%"></div></div>
                        <div style="display:flex; justify-content:space-between;"><span>Python basics</span><span>68%</span></div>
                    </div>
                    <div class="big-card">
                        <h3 style="margin-bottom:16px;">Daily pick</h3>
                        <div class="lesson-item">
                            <span>${icons.play.replace('currentColor', 'var(--primary)')}</span>
                            <div><strong>Lists & loops</strong> · 5 min</div>
                            <button class="lesson-play" onclick="window.navTo('learn')">Start</button>
                        </div>
                        <div class="lesson-item">
                            <span>${icons.flashcards.replace('currentColor', 'var(--primary)')}</span>
                            <div><strong>Functions</strong> · flashcards</div>
                            <button class="lesson-play" onclick="window.navTo('learn')">Review</button>
                        </div>
                    </div>
                    <div class="big-card">
                        <div style="display:flex; justify-content:space-between;"><span>Today's XP</span><span>140 / 200</span></div>
                        <div class="progress-bar-bg" style="margin-top:10px;"><div class="progress-fill" style="width:70%"></div></div>
                    </div>
                `;
            } else if (currentScreen === 'learn') {
                content = `
                    <div class="big-card" style="text-align:center;">
                        <span style="font-size:40px;">🐍</span>
                        <h3>Python: Variables</h3>
                        <p style="margin:15px 0;">A variable is like a labeled box that stores a value.</p>
                        <div style="background:var(--bg); border-radius:24px; padding:16px;">x = 5<br>name = "Alex"</div>
                        <button class="btn-primary" style="margin-top:24px;" onclick="window.showPractice()">Practice →</button>
                    </div>
                    <div class="big-card">
                        <div class="lesson-item"><span>${icons.check.replace('currentColor', 'var(--primary)')}</span> Lesson 1/8 completed</div>
                        <div class="progress-bar-bg"><div class="progress-fill" style="width:12%"></div></div>
                    </div>
                `;
            } else if (currentScreen === 'progress') {
                content = `
                    <div class="big-card">
                        <h3>Weekly activity</h3>
                        <div class="chart-svg">${icons.chart.replace('currentColor', 'var(--primary)')}</div>
                        <div class="stat-row"><span>Lessons done</span> <strong>24</strong></div>
                        <div class="stat-row"><span>Accuracy</span> <strong>88%</strong></div>
                    </div>
                    <div class="big-card">
                        <h4>Badges</h4>
                        <div class="badge-grid">
                            <span class="badge">🔥 7 day streak</span>
                            <span class="badge">🐍 rookie</span>
                            <span class="badge">⚡ 100 exercises</span>
                        </div>
                    </div>
                `;
            } else if (currentScreen === 'settings') {
                content = `
                    <div class="big-card">
                        <div class="theme-row">
                            <span>Dark mode</span>
                            <label><input type="checkbox" id="themeToggle" ${currentTheme==='dark'?'checked':''} onchange="window.toggleTheme()"></label>
                        </div>
                        <div style="margin:20px 0;">Profile</div>
                        <div class="lesson-item"><span>${icons.profile.replace('currentColor', 'var(--text)')}</span> Alex C.</div>
                        <div class="lesson-item"><span>⚙️</span> App version 2.6</div>
                        <button class="btn-primary" style="margin-top:20px;" onclick="window.navTo('home')">Back to home</button>
                    </div>
                `;
            }

            // bottom navigation (hidden on onboarding)
            let bottomNav = '';
            if (currentScreen !== 'onboarding') {
                bottomNav = `
                    <div class="bottom-nav">
                        <button class="nav-item ${currentScreen==='home'?'active':''}" onclick="window.navTo('home')">${icons.home}<span>Home</span></button>
                        <button class="nav-item ${currentScreen==='learn'?'active':''}" onclick="window.navTo('learn')">${icons.learn}<span>Learn</span></button>
                        <button class="nav-item ${currentScreen==='progress'?'active':''}" onclick="window.navTo('progress')">${icons.progress}<span>Progress</span></button>
                        <button class="nav-item ${currentScreen==='settings'?'active':''}" onclick="window.navTo('settings')">${icons.settings}<span>Settings</span></button>
                    </div>
                `;
            }

            phone.innerHTML = `
                <div class="screen ${themeClass}">
                    ${header}
                    ${content}
                </div>
                ${bottomNav}
                ${modalHTML}
            `;
        }

        // navigation functions (exposed globally)
        window.navTo = function(screen) {
            if (screen === 'settings') currentScreen = 'settings';
            else currentScreen = screen;
            modalContent = null;
            renderApp();
        };
        window.goToSettings = function() {
            currentScreen = 'settings';
            modalContent = null;
            renderApp();
        };
        window.openModal = function(type) {
            modalContent = type;
            renderApp();
        };
        window.closeModal = function() {
            modalContent = null;
            renderApp();
        };
        window.toggleTheme = function() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            renderApp();
        };
        window.showPractice = function() {
            alert("Practice started! (simulated)");
        };

        // screenshot (SHIFT+W)
        window.addEventListener('keydown', function(e) {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phoneEl = document.getElementById('phone');
                // dummy: we just simulate naming.
                let filename = '1.png';
                if (currentScreen === 'home') filename = '2.png';
                else if (currentScreen === 'learn') filename = '3.png';
                else if (currentScreen === 'progress') filename = '4.png';
                else if (currentScreen === 'settings') filename = '5.png';
                if (currentTheme === 'dark') filename = '6.png';
                alert(`📸 Screenshot captured: ${filename} (mock – real save requires canvas)`);
            }
        });

        // first render
        renderApp();
    })();
</script>

    "3.png": "Practice Skills",
    "4.png": "Track Progress",
    "5.png": "Smart Settings",
    "6.png": "Dark Theme"
}
</pre>
