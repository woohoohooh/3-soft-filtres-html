```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeLingua · mobile prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        :root {
            /* light mode (default) */
            --bg-app: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --text-muted: #64748B;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --border-light: #E2E8F0;
            --icon-inactive: #94A3B8;
            --nav-bg: #FFFFFF;
            --shadow: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,0,0,0.05);
            --progress-bg: #E2E8F0;
            --badge-gold: #FBBF24;
        }

        body.dark {
            --bg-app: #0F172A;
            --card-bg: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --text-muted: #94A3B8;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --border-light: #334155;
            --icon-inactive: #64748B;
            --nav-bg: #1E293B;
            --shadow: 0 8px 20px rgba(0,0,0,0.5);
            --progress-bg: #334155;
            --badge-gold: #F59E0B;
        }

        body {
            background: #1a1e2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg-app);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2c313b;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s;
        }

        /* main app content (flex column) */
        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--bg-app);
            color: var(--text-primary);
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px 8px 20px;
            background: transparent;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 650;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .profile-icon {
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            transition: background 0.15s;
        }
        .profile-icon:hover {
            background: rgba(37, 99, 235, 0.1);
        }
        .profile-icon svg {
            display: block;
            width: 28px;
            height: 28px;
            stroke: var(--text-primary);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* main screen area */
        .screen-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px 8px 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--bg-app);
        }
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 20px;
        }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--nav-bg);
            padding: 10px 0 16px;
            border-top: 1px solid var(--border-light);
            box-shadow: 0 -2px 8px rgba(0,0,0,0.02);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            padding: 6px 14px;
            border-radius: 30px;
            background: transparent;
        }
        .nav-item svg {
            width: 26px;
            height: 26px;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.15s;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            transition: all 0.15s;
        }
        /* active tab */
        .nav-item.active {
            background: rgba(37, 99, 235, 0.12);
        }
        .nav-item.active svg {
            stroke: var(--primary);
            transform: scale(1.1);
            stroke-width: 2.2;
        }
        .nav-item.active span {
            color: var(--primary);
            font-weight: 600;
        }
        /* inactive */
        .nav-item:not(.active) svg {
            stroke: var(--icon-inactive);
        }
        .nav-item:not(.active) span {
            color: var(--icon-inactive);
        }

        /* cards & elements */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 18px 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }
        .flex-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .gap-4 { gap: 4px; }
        .mt-2 { margin-top: 8px; }
        .mb-2 { margin-bottom: 8px; }
        .text-primary { color: var(--primary); }
        .text-muted { color: var(--text-muted); }
        .font-bold { font-weight: 700; }
        .text-lg { font-size: 18px; }
        .icon-small svg { width: 22px; height: 22px; stroke: var(--primary); }

        /* progress */
        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 20px;
            margin: 12px 0 6px;
        }
        .progress-fill {
            height: 8px;
            background: var(--primary);
            border-radius: 20px;
            width: 0%;
            transition: width 0.3s ease;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
        }

        /* buttons */
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 20px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 18px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(37,99,235,0.25);
            transition: 0.15s;
        }
        .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 16px 0 8px;
            font-size: 13px;
        }
        .link-row span {
            color: var(--text-muted);
            text-decoration: underline;
            cursor: pointer;
        }

        /* modal */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg);
            max-width: 280px;
            padding: 28px 24px;
            border-radius: 40px;
            text-align: center;
            border: 1px solid var(--border-light);
        }
        .hide { display: none; }

        /* icons definition */
        .icon-set { display: none; } /* hidden container, we use inline in nav */
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <div class="app" id="app">
        <!-- header (dynamic title & profile) -->
        <div class="header">
            <h1 id="screenTitle">Onboarding</h1>
            <div class="profile-icon" id="profileBtn">
                <svg viewBox="0 0 24 24"><path d="M4 20c1.5-2.5 4-4 8-4s6.5 1.5 8 4M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0z"/></svg>
            </div>
        </div>

        <!-- dynamic screen content -->
        <div class="screen-container" id="screenContent"></div>

        <!-- bottom navigation (only 4 items) -->
        <div class="bottom-nav" id="bottomNav">
            <div class="nav-item" data-screen="home"><svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v11h-7v-7h-4v7H3z"/></svg><span>Home</span></div>
            <div class="nav-item" data-screen="learn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/><circle cx="12" cy="12" r="9"/></svg><span>Learn</span></div>
            <div class="nav-item" data-screen="progress"><svg viewBox="0 0 24 24"><path d="M21 12v3a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a4 4 0 0 1 4-4h8"/><path d="M15 3h6v6M9 15l9-9"/></svg><span>Progress</span></div>
            <div class="nav-item" data-screen="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.02.02A10 10 0 0 0 12 17.66a10 10 0 0 0 6.26-2.21z"/><path d="M16.5 6.5 19 9"/></svg><span>Settings</span></div>
        </div>
    </div>

    <!-- modal container (hidden) -->
    <div id="modalContainer" class="modal hide" onclick="event.target===this && closeModal()">
        <div class="modal-content" id="modalText">Privacy policy dummy text. We respect your data.</div>
    </div>
</div>

<script>
    (function(){
        // ---- icon templates (optional but not needed inline) ----
        // ---- app state ----
        let currentScreen = 'onboarding'; 
        const theme = { dark: false };
        let screenshotCounter = 1;

        // DOM elements
        const screenContent = document.getElementById('screenContent');
        const screenTitle = document.getElementById('screenTitle');
        const navItems = document.querySelectorAll('.nav-item');
        const profileBtn = document.getElementById('profileBtn');
        const modal = document.getElementById('modalContainer');
        const modalText = document.getElementById('modalText');

        // ---- helper functions ----
        function closeModal() { modal.classList.add('hide'); }
        window.closeModal = closeModal;

        function showModal(text) { modalText.innerText = text; modal.classList.remove('hide'); }

        // ---- render screens based on string ----
        function renderScreen(screen) {
            if (screen === 'onboarding') renderOnboarding();
            else if (screen === 'home') renderHome();
            else if (screen === 'learn') renderLearn();
            else if (screen === 'progress') renderProgress();
            else if (screen === 'settings') renderSettings();
            // sync header title
            updateHeaderTitle(screen);
            // bottom nav active state (except onboarding)
            updateNavActive(screen);
        }

        function updateHeaderTitle(screen) {
            const titles = {
                onboarding: 'Welcome',
                home: 'Home',
                learn: 'Lessons',
                progress: 'Insights',
                settings: 'Settings'
            };
            screenTitle.innerText = titles[screen] || 'App';
        }

        function updateNavActive(screen) {
            navItems.forEach(item => {
                const data = item.dataset.screen;
                if (data === screen) item.classList.add('active');
                else item.classList.remove('active');
            });
        }

        // ---- onboarding ----
        function renderOnboarding() {
            screenContent.innerHTML = `
                <div class="card" style="text-align: center; padding: 32px 20px;">
                    <svg width="70" height="70" viewBox="0 0 24 24" stroke="var(--primary)" fill="none" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                    <h2 style="font-size: 34px; margin: 12px 0 4px;">CodeLingua</h2>
                    <p style="font-size: 18px; color: var(--primary); font-weight: 500;">English vocabulary builder</p>
                    <p style="margin: 16px 0; color: var(--text-secondary);">Master 3000+ words with daily micro‑lessons. Fun, fast and effective.</p>
                    <button class="btn-primary" id="getStartedBtn">Get Started</button>
                    <div class="link-row">
                        <span id="privacyLink">Privacy Policy</span>
                        <span id="termsLink">Terms of Service</span>
                    </div>
                </div>
            `;
            document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                currentScreen = 'home';
                renderScreen('home');
            });
            document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('We never sell your data. Updated 2026.'));
            document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Use = learning. v2.1.0 effective immediately.'));
        }

        // ---- Home dashboard (enriched) ----
        function renderHome() {
            screenContent.innerHTML = `
                <div class="card">
                    <div class="flex-row" style="justify-content: space-between;">
                        <span class="badge">🔥 7 day streak</span>
                        <span class="text-muted icon-small"><svg viewBox="0 0 24 24" stroke="var(--primary)"><path d="M12 2v4M12 22v-4M4 12H2h2m16 0h2-2M5.6 5.6l2.8 2.8m7.2-2.8l-2.8 2.8"/></svg> 480 XP</span>
                    </div>
                    <div style="font-size: 26px; font-weight: 700; margin: 8px 0;">Continue lesson</div>
                    <div style="background: var(--bg-app); border-radius: 20px; padding: 12px;">
                        <div class="flex-row"><span>Phrasal verbs</span><span>3/8</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:37.5%"></div></div>
                        <button class="btn-primary" style="padding: 12px; margin-top: 10px;" id="resumeLearn">Resume</button>
                    </div>
                </div>
                <div class="card">
                    <div class="flex-row" style="justify-content: space-between;">
                        <span class="font-bold">Daily picks</span> <span class="text-muted">see all</span>
                    </div>
                    <div class="flex-row gap-4 mt-2">
                        <div style="flex:1; background:var(--bg-app); border-radius: 16px; padding: 10px; text-align: center;"><svg viewBox="0 0 24 24" stroke="var(--primary)" width="30"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><div>Idioms</div></div>
                        <div style="flex:1; background:var(--bg-app); border-radius: 16px; padding: 10px; text-align: center;"><svg viewBox="0 0 24 24" stroke="var(--primary)" width="30"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><div>Stories</div></div>
                    </div>
                </div>
                <div class="card">
                    <span class="font-bold">This week's goal</span>
                    <div class="progress-bar mt-2"><div class="progress-fill" style="width:65%"></div></div>
                    <div class="flex-row" style="justify-content: space-between;"><span>65%</span><span>130/200 XP</span></div>
                </div>
            `;
            document.getElementById('resumeLearn')?.addEventListener('click', ()=>{
                currentScreen = 'learn';
                renderScreen('learn');
            });
        }

        // ---- Learn / practice ----
        function renderLearn() {
            screenContent.innerHTML = `
                <div class="card"><span class="badge" style="background:var(--accent);">new</span><span class="text-lg font-bold"> Vocabulary</span>
                    <div class="flex-row" style="justify-content: space-between; margin: 12px 0;">
                        <span>1. "ubiquitous"</span> <svg viewBox="0 0 24 24" stroke="var(--primary)" width="24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
                    </div>
                    <button class="btn-primary" style="padding: 10px;" id="practiceBtn">Start practice</button>
                </div>
                <div class="card">
                    <div class="flex-row"><svg viewBox="0 0 24 24" stroke="var(--primary)" width="22"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M8 7h8M8 11h6"/></svg><span>Lesson 4: Collocations</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:25%"></div></div>
                </div>
                <div class="card">
                    <div class="flex-row"><svg viewBox="0 0 24 24" stroke="var(--primary)" width="22"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span> Flashcards: 32 due</span></div>
                </div>
            `;
            document.getElementById('practiceBtn')?.addEventListener('click', ()=> alert('practice started! (mock)'));
        }

        // ---- progress statistics with chart animation ----
        function renderProgress() {
            screenContent.innerHTML = `
                <div class="card">
                    <span class="font-bold text-lg">Weekly activity</span>
                    <div style="display: flex; gap: 6px; margin: 20px 0; align-items: flex-end; height: 120px;">
                        <div style="flex:1; background:var(--primary); height:70px; border-radius: 12px 12px 4px 4px;"></div>
                        <div style="flex:1; background:var(--primary); height:90px; border-radius: 12px 12px 4px 4px;"></div>
                        <div style="flex:1; background:var(--primary); height:50px; border-radius: 12px 12px 4px 4px;"></div>
                        <div style="flex:1; background:var(--primary); height:110px; border-radius: 12px 12px 4px 4px;"></div>
                        <div style="flex:1; background:var(--primary); height:80px; border-radius: 12px 12px 4px 4px;"></div>
                    </div>
                    <div class="flex-row" style="justify-content: space-around;"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span></div>
                </div>
                <div class="card flex-row" style="justify-content: space-around;">
                    <div><span class="text-muted">Lessons</span> <span class="text-lg font-bold">24</span></div>
                    <div><span class="text-muted">Words</span> <span class="text-lg font-bold">187</span></div>
                    <div><span class="text-muted">Streak</span> <span class="text-lg font-bold">7</span></div>
                </div>
                <div class="card">
                    <span>🏆 achievements</span>
                    <div class="flex-row"><svg viewBox="0 0 24 24" stroke="gold" width="30"><circle cx="12" cy="8" r="6"/><path d="M6 21v-4a6 6 0 0 1 12 0v4"/></svg> Early bird</div>
                </div>
            `;
        }

        // ---- Settings with theme toggle ----
        function renderSettings() {
            screenContent.innerHTML = `
                <div class="card">
                    <div class="flex-row" style="justify-content: space-between;">
                        <span>Dark mode</span>
                        <label style="width: 50px; height: 26px; background: var(--primary); border-radius: 40px; display: inline-block; cursor: pointer;" id="toggleThemeBtn">
                            <span style="display: block; width: 22px; height: 22px; background: white; border-radius: 50%; margin: 2px; transition: transform 0.2s; transform: translateX(${theme.dark ? '26px' : '0'});"></span>
                        </label>
                    </div>
                </div>
                <div class="card">
                    <div>Profile: Alex</div>
                    <div class="text-muted">member since 2026</div>
                </div>
                <div class="card" style="text-align: center;">
                    <span>🔔 Notifications</span><br>
                    <span class="text-muted">daily reminder on</span>
                </div>
            `;
            document.getElementById('toggleThemeBtn')?.addEventListener('click', ()=>{
                theme.dark = !theme.dark;
                document.body.classList.toggle('dark', theme.dark);
                renderSettings(); // re-render to move toggle
            });
        }

        // ---- navigation click ----
        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                const targetScreen = item.dataset.screen;
                if (targetScreen) {
                    currentScreen = targetScreen;
                    renderScreen(targetScreen);
                }
            });
        });

        // profile button -> open settings
        profileBtn.addEventListener('click', ()=>{
            currentScreen = 'settings';
            renderScreen('settings');
        });

        // ---- screenshot feature (shift + W) ----
        document.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                // html2canvas is not included, but we simulate naming
                // we just log and increase counter (real capture would need library)
                console.log('📸 screenshot simulated:', (theme.dark ? '6.png' : screenshotCounter+'.png'));
                if (!theme.dark && screenshotCounter < 5) screenshotCounter++;
                // In a real scenario with html2canvas we'd capture, but we follow spec: naming only.
                alert('DEV: screenshot ' + (theme.dark ? '6.png' : screenshotCounter+'.png') + ' (simulated)');
            }
        });

        // ---- initial render ----
        renderScreen('onboarding');

        // expose for modal close
        window.showModal = showModal;

        // final JSON output (will be printed after HTML)
    })();
</script>
<!-- screenshot titles JSON (in plain text, but required at the end) -->
<pre style="display:none;" id="jsonOutput"></pre>
<script>
    (function printJSON(){
        // json output at the very end
        const json = {
            titles: {
                "1.png": "Start Learning",
                "2.png": "Daily Lessons",
                "3.png": "Practice Skills",
                "4.png": "Track Progress",
                "5.png": "Smart Settings",
                "6.png": "Dark Theme"
            }
        };
        const el = document.getElementById('jsonOutput');
        if(el) el.innerText = JSON.stringify(json, null, 2);
    })();
</script>
</body>
</html>
All done!
