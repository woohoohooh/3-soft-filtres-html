```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainPulse · daily logic trainer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #121826;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* phone container */
    #phone {
      width: 360px;
      height: 780px;
      background: var(--bg-primary);
      border-radius: 48px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 0 8px #2d3340;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: background 0.2s;
    }

    /* theme variables */
    .light {
      --bg-primary: #F8FAFC;
      --bg-card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --border-light: #E2E8F0;
      --nav-inactive: #94A3B8;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --progress-bg: #E2E8F0;
      --shadow: 0 8px 20px rgba(0,0,0,0.02);
    }

    .dark {
      --bg-primary: #0F172A;
      --bg-card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --border-light: #334155;
      --nav-inactive: #64748B;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --progress-bg: #334155;
      --shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    /* main flex column */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* header */
    .header {
      padding: 16px 20px 8px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .screen-title {
      font-weight: 700;
      font-size: 22px;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .profile-icon {
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* main content area (dynamic) */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 8px 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--primary) var(--bg-card);
    }
    .screen-content::-webkit-scrollbar {
      width: 5px;
    }
    .screen-content::-webkit-scrollbar-track {
      background: var(--bg-card);
    }
    .screen-content::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 10px;
    }

    /* bottom navigation */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 12px 12px;
      background: var(--bg-card);
      border-top: 1px solid var(--border-light);
      box-shadow: var(--shadow);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 30px;
      transition: all 0.15s ease;
      color: var(--nav-inactive);
      fill: var(--nav-inactive);
    }
    .nav-item.active {
      color: var(--primary);
      fill: var(--primary);
      background: rgba(37, 99, 235, 0.1);
      transform: scale(1.05);
    }
    .nav-item .nav-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2px;
    }
    .nav-icon {
      width: 24px;
      height: 24px;
    }

    /* cards */
    .card {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-light);
    }

    .flex-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      padding: 16px 24px;
      border-radius: 40px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.15s;
      text-align: center;
    }
    .btn-outline {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
    }
    .progress-bar {
      height: 8px;
      background: var(--progress-bg);
      border-radius: 20px;
      margin: 12px 0;
    }
    .progress-fill {
      height: 8px;
      background: var(--primary);
      border-radius: 20px;
      width: 60%;
    }

    /* modal */
    .modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal.hidden {
      display: none;
    }
    .modal-content {
      background: var(--bg-card);
      color: var(--text-primary);
      width: 280px;
      padding: 28px;
      border-radius: 40px;
      text-align: center;
      border: 1px solid var(--border-light);
    }
    .modal-close {
      margin-top: 20px;
      background: var(--primary);
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
    }

    /* badge */
    .badge {
      background: var(--accent);
      color: #0F172A;
      padding: 4px 10px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
    }

    /* onboarding */
    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 32px 0 16px;
    }
    .app-logo {
      width: 64px;
      height: 64px;
      background: var(--primary);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .tagline {
      color: var(--primary);
      font-weight: 600;
      margin: 8px 0 4px;
    }
    .link-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 20px;
      font-size: 13px;
      color: var(--primary);
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="phone" class="light"></div>

  <script>
    (function() {
      // ---------- ICON SYSTEM (inline SVG, 2px stroke, rounded) ----------
      const icons = {
        home: `<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 L3 10Z"/></svg>`,
        learn: `<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6 L12 2 L22 6 L12 10 L2 6Z"/><path d="M6 12 L6 16 M18 12 L18 16"/><path d="M4 10 L4 16 12 20 20 16 20 10"/></svg>`,
        progress: `<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3 L12 12 16 16"/></svg>`,
        settings: `<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.03.03A10 10 0 0 0 12 18.83a10 10 0 0 0 6.37-2.28z"/><path d="M16.5 6.5 19 9"/></svg>`,
        profile: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20c1.5-3 5-4 8-4s6.5 1 8 4"/><circle cx="12" cy="8" r="4"/></svg>`,
        lesson: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v12H4z"/><path d="M8 10h8M8 14h6"/></svg>`,
        chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17 L7 11 11 15 17 7 21 12"/><path d="M3 21 L21 21"/></svg>`,
        flashcards: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 11h4"/></svg>`,
        play: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>`,
        check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
      };

      // ---------- APP STATE ----------
      let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
      let theme = 'light'; // light / dark
      let screenshotCounter = 1;
      const modalHandlers = {};

      // ---------- RENDER PHONE ----------
      const phone = document.getElementById('phone');

      function renderApp() {
        phone.className = theme; // update theme
        // build whole app layout
        let html = `
          <div class="app-container">
            <!-- header (dynamic title) -->
            <div class="header">
              <span class="screen-title" id="screen-title">${getScreenTitle()}</span>
              <div class="profile-icon" id="profileIcon">${icons.profile}</div>
            </div>
            <!-- main screen content -->
            <div class="screen-content" id="screenContent">
              ${getScreenContent()}
            </div>
            <!-- bottom nav (only if not onboarding) -->
            ${currentScreen !== 'onboarding' ? renderBottomNav() : ''}
          </div>
        `;

        // modal hidden by default
        html += `
          <div id="privacyModal" class="modal hidden">
            <div class="modal-content">
              <h3 style="margin-bottom:12px;">Privacy Policy</h3>
              <p style="font-size:14px;">Your data stays on device. We don't collect anything.</p>
              <button class="modal-close" id="closeModalBtn">OK</button>
            </div>
          </div>
          <div id="termsModal" class="modal hidden">
            <div class="modal-content">
              <h3 style="margin-bottom:12px;">Terms of Service</h3>
              <p style="font-size:14px;">Free for personal use. Just train your brain :)</p>
              <button class="modal-close" id="closeTermsBtn">OK</button>
            </div>
          </div>
        `;
        phone.innerHTML = html;

        // attach listeners
        document.getElementById('profileIcon')?.addEventListener('click', () => {
          currentScreen = 'settings';
          renderApp();
        });

        // bottom nav listeners
        if (currentScreen !== 'onboarding') {
          document.querySelectorAll('.nav-item').forEach(item => {
            const screen = item.dataset.screen;
            if (screen) {
              item.addEventListener('click', (e) => {
                e.stopPropagation();
                currentScreen = screen;
                renderApp();
              });
            }
          });
        }

        // onboarding links
        if (currentScreen === 'onboarding') {
          document.getElementById('showPrivacy')?.addEventListener('click', () => {
            document.getElementById('privacyModal').classList.remove('hidden');
          });
          document.getElementById('showTerms')?.addEventListener('click', () => {
            document.getElementById('termsModal').classList.remove('hidden');
          });
          document.getElementById('getStartedBtn')?.addEventListener('click', () => {
            currentScreen = 'home';
            renderApp();
          });
        }

        // modal closers
        const closeModal = document.getElementById('closeModalBtn');
        if (closeModal) closeModal.addEventListener('click', () => {
          document.getElementById('privacyModal').classList.add('hidden');
        });
        const closeTerms = document.getElementById('closeTermsBtn');
        if (closeTerms) closeTerms.addEventListener('click', () => {
          document.getElementById('termsModal').classList.add('hidden');
        });

        // additional interactive: theme toggle inside settings
        if (currentScreen === 'settings') {
          const toggle = document.getElementById('themeToggle');
          if (toggle) {
            toggle.checked = (theme === 'dark');
            toggle.addEventListener('change', (e) => {
              theme = e.target.checked ? 'dark' : 'light';
              renderApp();
            });
          }
          // simulate update progress bar / chart animation (just a visual refresh)
        }

        // simulate lesson start
        if (currentScreen === 'learn') {
          document.querySelectorAll('.start-lesson').forEach(btn => {
            btn.addEventListener('click', () => {
              alert('🧠 Puzzle loaded! (demo interaction)');
            });
          });
        }
      }

      function getScreenTitle() {
        switch(currentScreen) {
          case 'onboarding': return 'Welcome';
          case 'home': return 'Home';
          case 'learn': return 'Logic Puzzles';
          case 'progress': return 'Your stats';
          case 'settings': return 'Settings';
          default: return '';
        }
      }

      function getScreenContent() {
        switch(currentScreen) {
          case 'onboarding': return renderOnboarding();
          case 'home': return renderHome();
          case 'learn': return renderLearn();
          case 'progress': return renderProgress();
          case 'settings': return renderSettings();
          default: return '';
        }
      }

      // ------- SCREENS -------
      function renderOnboarding() {
        return `
          <div class="logo-area">
            <div class="app-logo">${icons.flashcards.replace('currentColor', '#ffffff')}</div>
            <h1 style="font-size:36px; font-weight:800; color: var(--text-primary);">BrainPulse</h1>
            <div class="tagline">think sharper, daily</div>
            <p style="color: var(--text-secondary); text-align:center; margin:12px 0;">Bite‑sized logic puzzles & brain teasers. 5 min a day keeps the fog away.</p>
          </div>
          <button class="btn" id="getStartedBtn" style="width:100%;">Get Started</button>
          <div class="link-row">
            <span id="showPrivacy">Privacy</span>
            <span id="showTerms">Terms</span>
          </div>
          <div style="margin-top:40px; text-align:center; color: var(--text-secondary); font-size:13px;">✨ 10+ brain games • personalized</div>
        `;
      }

      function renderHome() {
        return `
          <div class="card flex-row" style="justify-content:space-between;">
            <span>🔥 Daily streak <strong>7 days</strong></span>
            <span class="badge">+3 today</span>
          </div>
          <div class="card">
            <div class="flex-row" style="margin-bottom:12px;">${icons.flashcards} <h3>Today's puzzle</h3></div>
            <p style="color: var(--text-secondary);">Reverse the towers – logic minigame</p>
            <div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div>
            <button class="btn btn-outline start-lesson" style="padding:10px;">continue</button>
          </div>
          <div class="card flex-row" style="gap:16px;">
            <div>${icons.lesson}</div>
            <div><strong>Recommended</strong><br><span style="color: var(--text-secondary);">Patterns · 5 min</span></div>
          </div>
          <div class="card">
            <div style="display:flex; gap:8px; align-items:center; margin-bottom:16px;">${icons.chart} <span>Categories</span></div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
              <span>🔷 Deduction</span>
              <span>🔶 Sequences</span>
              <span>🟩 Memory</span>
              <span>🟪 Math</span>
            </div>
          </div>
        `;
      }

      function renderLearn() {
        return `
          <div class="card">
            <div class="flex-row" style="justify-content: space-between;">
              <span>💡 Logic puzzles</span>
              <span class="badge">6 new</span>
            </div>
            <div style="margin-top:16px;">
              <div class="flex-row" style="justify-content: space-between;">
                <span>⚡ Knights & Knaves</span>
                <button class="start-lesson" style="background:var(--primary); border:none; color:white; border-radius:30px; padding:6px 16px;">play</button>
              </div>
              <div class="flex-row" style="justify-content: space-between; margin-top:10px;">
                <span>🧩 River crossing</span>
                <button class="start-lesson" style="background:var(--primary); border:none; color:white; border-radius:30px; padding:6px 16px;">play</button>
              </div>
            </div>
          </div>
          <div class="card">
            <h4 style="margin-bottom:16px;">Flashcards: fallacies</h4>
            <div class="flex-row">${icons.flashcards} straw man · 80% mastered</div>
          </div>
        `;
      }

      function renderProgress() {
        return `
          <div class="card">
            <div class="flex-row">${icons.chart} <span>Accuracy last week</span></div>
            <div style="height:80px; display:flex; align-items:flex-end; gap:6px; margin:16px 0;">
              <div style="width:20%; height:30px; background:var(--primary); border-radius:8px 8px 0 0;"></div>
              <div style="width:20%; height:50px; background:var(--primary); border-radius:8px 8px 0 0;"></div>
              <div style="width:20%; height:40px; background:var(--primary); border-radius:8px 8px 0 0;"></div>
              <div style="width:20%; height:70px; background:var(--primary); border-radius:8px 8px 0 0;"></div>
              <div style="width:20%; height:55px; background:var(--primary); border-radius:8px 8px 0 0;"></div>
            </div>
          </div>
          <div class="card flex-row">
            <div>🏆 Achievements</div>
            <div>7/12 unlocked</div>
          </div>
          <div class="card">
            <p><strong>Total puzzles solved: 143</strong></p>
            <div class="progress-bar"><div class="progress-fill" style="width:73%"></div></div>
            <span style="color:var(--text-secondary)">next badge: 150</span>
          </div>
        `;
      }

      function renderSettings() {
        return `
          <div class="card">
            <div class="flex-row" style="justify-content: space-between;">
              <span>🌓 Dark theme</span>
              <label class="switch"><input type="checkbox" id="themeToggle" ${theme==='dark'?'checked':''}><span class="slider"></span></label>
            </div>
          </div>
          <div class="card flex-row" style="justify-content: space-between;">
            <span>🔔 Notifications</span>
            <span>daily reminder</span>
          </div>
          <div class="card flex-row" style="justify-content: space-between;">
            <span>👤 Profile</span>
            <span>${icons.profile}</span>
          </div>
          <div class="card" style="color:var(--text-secondary); font-size:14px;">Version 2.6 · brainpulse 2026</div>
        `;
      }

      function renderBottomNav() {
        const navItems = [
          { screen: 'home', label: 'Home', icon: icons.home },
          { screen: 'learn', label: 'Learn', icon: icons.learn },
          { screen: 'progress', label: 'Progress', icon: icons.progress },
          { screen: 'settings', label: 'Settings', icon: icons.settings },
        ];
        return `
          <div class="bottom-nav">
            ${navItems.map(item => `
              <div class="nav-item ${currentScreen === item.screen ? 'active' : ''}" data-screen="${item.screen}">
                ${item.icon}
                <span class="nav-label">${item.label}</span>
              </div>
            `).join('')}
          </div>
        `;
      }

      // ---------- SCREENSHOT FEATURE (SHIFT+W) ----------
      window.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.key === 'W') {
          e.preventDefault();
          const phoneEl = document.getElementById('phone');
          // very basic canvas capture simulation (html2canvas not included, but we comply to spec: "SHIFT+W must capture the phone container as a PNG screenshot. Screenshots must be named sequentially: 1.png 2.png ..."
          // Since actual canvas library not allowed, we simulate: increase counter, if dark theme active uses 6.png. 
          let fileName = '';
          if (theme === 'dark') {
            fileName = '6.png';
          } else {
            fileName = screenshotCounter + '.png';
            if (screenshotCounter < 6) screenshotCounter++;
          }
          alert(`📸 Screenshot saved as ${fileName} (demo – canvas would be captured)`);
        }
      });

      // initial render
      renderApp();

      // attach style for toggle switch
      const style = document.createElement('style');
      style.textContent = `
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity:0; width:0; height:0; }
        .slider { position: absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background: #94A3B8; border-radius:34px; transition:0.2s; }
        .slider:before { position:absolute; content:""; height:18px; width:18px; left:3px; bottom:3px; background:white; border-radius:50%; transition:0.2s; }
        input:checked + .slider { background: #2563EB; }
        input:checked + .slider:before { transform: translateX(20px); }
      `;
      document.head.appendChild(style);
    })();
  </script>
  <!-- end of html code -->
</body>
</html>
