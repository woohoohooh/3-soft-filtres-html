```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Brain Trainer · 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* CSS variables – light mode default */
    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #0F172A;
      --text-light: #334155;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --border: #E2E8F0;
      --inactive: #94A3B8;
      --header-bg: #FFFFFFCC;
      --shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.03);
    }

    body.dark {
      --bg: #0F172A;
      --card: #1E293B;
      --text: #E2E8F0;
      --text-light: #CBD5E1;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --border: #334155;
      --inactive: #64748B;
      --header-bg: #1E293BCC;
      --shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    body {
      background: #11131F;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background-color: var(--bg);
      border-radius: 48px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2C2F3A;
      overflow: hidden;
      position: relative;
      transition: background-color 0.2s;
      display: flex;
      flex-direction: column;
    }

    /* main app screen container */
    .app-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-bottom: 8px;
    }
    .app-screen::-webkit-scrollbar { display: none; }

    /* header – fixed like modern android */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px 8px 20px;
      background: transparent;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      background-color: var(--header-bg);
      border-bottom: 1px solid var(--border);
      z-index: 5;
    }
    .header-left h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
    }
    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* bottom navigation */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: var(--card);
      padding: 8px 10px 10px;
      border-top: 1px solid var(--border);
      box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
      backdrop-filter: blur(4px);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
      border: none;
      cursor: pointer;
      gap: 4px;
      transition: transform 0.15s ease;
      color: var(--inactive);
      fill: var(--inactive);
    }
    .nav-item.active {
      transform: scale(1.05);
      color: var(--primary);
      fill: var(--primary);
    }
    .nav-item.active .nav-icon {
      filter: drop-shadow(0 2px 6px var(--primary));
    }
    .nav-label {
      font-size: 11px;
      font-weight: 500;
    }
    .nav-icon {
      width: 24px;
      height: 24px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* screen content */
    .screen {
      flex: 1;
      padding: 16px 20px 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* cards, buttons */
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 20px 18px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .btn-primary {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      padding: 16px 24px;
      border-radius: 60px;
      font-size: 16px;
      box-shadow: 0 8px 18px #2563EB30;
      transition: 0.1s;
      cursor: pointer;
    }
    .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }
    .link-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      font-size: 13px;
      color: var(--primary);
      margin-top: 8px;
    }
    .link-row button {
      background: none;
      border: none;
      color: var(--primary);
      text-decoration: underline;
      cursor: pointer;
      font-size: 13px;
    }

    /* modal */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-card {
      background: var(--card);
      width: 280px;
      border-radius: 32px;
      padding: 28px 20px;
      color: var(--text);
      text-align: center;
      box-shadow: 0 20px 40px black;
    }
    .modal-card button {
      margin-top: 20px;
      background: var(--primary);
      border: none;
      color: white;
      padding: 10px 28px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
    }

    /* progress bar */
    .progress-bar-bg {
      background: var(--border);
      height: 10px;
      border-radius: 20px;
      margin: 10px 0;
    }
    .progress-fill {
      background: var(--primary);
      width: 60%;
      height: 10px;
      border-radius: 20px;
      transition: width 0.3s;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      color: var(--text);
    }

    /* small chart simulation */
    .chart-dots {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      height: 60px;
      margin-top: 12px;
    }
    .bar {
      width: 22px;
      background: var(--primary);
      border-radius: 12px 12px 6px 6px;
      transition: height 0.3s;
    }

    /* custom icons are inline-svg inside .nav-icon, but we reuse them via JS */
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <!-- dynamic header + screen -->
  <div id="header"></div>
  <div id="screenContent" class="app-screen"></div>
  <div id="bottomNav"></div>

  <!-- modal placeholder -->
  <div id="modalContainer"></div>
</div>

<script>
  (function() {
    // ---------- THEME ----------
    let darkMode = false;
    const themeToggle = () => {
      darkMode = !darkMode;
      document.body.classList.toggle('dark', darkMode);
      renderCurrentScreen(); // re-render with new theme
    };

    // ---------- ICONS SYSTEM (inline SVG, outline 2px, round caps) ----------
    const icons = {
      home: `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M5 12l7-7 7 7v7h-5v-5h-4v5H5z"/></svg>`,
      learn: `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14M5 5l14 14M5 19L19 5"/></svg>`, // abstract learning grid
      progress: `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 12v8a1 1 0 01-1 1H4a1 1 0 01-1-1V4a1 1 0 011-1h8"/><path d="M15 9l5-5M20 4h-5v5"/></svg>`,
      settings: `<svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82L12 22zM4.6 9a1.65 1.65 0 0 0-.33 1.82c.26.61.86.99 1.51 1h12.44a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82L12 2z"/></svg>`,
      profile: `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
      lesson: `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
      chart: `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 21H4V4"/><path d="M7 15v4M12 11v8M17 7v12"/></svg>`,
      flashcards: `<svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 9h8M8 13h6"/></svg>`,
      play: `<svg class="nav-icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
      check: `<svg class="nav-icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`
    };

    // ---------- STATE ----------
    let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
    let modal = { visible: false, content: '' };

    // ---------- RENDER HEADER ----------
    function renderHeader() {
      let title = '';
      switch (currentScreen) {
        case 'onboarding': title = 'Welcome'; break;
        case 'home': title = 'Dashboard'; break;
        case 'learn': title = 'Daily Workout'; break;
        case 'progress': title = 'Your stats'; break;
        case 'settings': title = 'Profile & Settings'; break;
        default: title = 'Math Brain';
      }
      return `
        <div class="header">
          <div class="header-left"><h1>${title}</h1></div>
          <button class="profile-btn" id="profileBtn">${icons.profile}</button>
        </div>
      `;
    }

    // ---------- SCREENS ----------
    function getOnboarding() {
      return `
        <div class="screen">
          <div class="card" style="text-align:center;">
            <div style="font-size: 44px; margin: 20px 0 8px;">🧠</div>
            <h2 style="font-size: 32px; font-weight:800;">Math Brain</h2>
            <p style="font-size: 18px; color: var(--primary);">trainer · 2026</p>
            <p style="margin: 16px 0; color: var(--text-light);">Sharpen mental math with 5-min daily workouts. Bite-sized challenges, instant feedback.</p>
            <button class="btn-primary" id="getStartedBtn" style="width:100%;">Get Started</button>
            <div class="link-row">
              <button id="privacyBtn">Privacy</button>
              <button id="termsBtn">Terms</button>
            </div>
          </div>
        </div>
      `;
    }

    function getHome() {
      return `
        <div class="screen">
          <div class="card">
            <h3>🔥 current streak</h3>
            <div style="font-size: 40px; font-weight:700;">12 days</div>
            <div class="progress-bar-bg"><div class="progress-fill" style="width:70%"></div></div>
            <div class="stat-row"><span>today's target</span><span>70%</span></div>
          </div>
          <div class="card">
            <div style="display:flex; gap:12px; align-items:center;">${icons.flashcards}<span style="font-weight:600;">Daily puzzle</span></div>
            <p style="margin:12px 0">15 + 27 ÷ 3 = ?</p>
            <button class="btn-primary" id="practiceNow" style="padding:12px;">show answer</button>
          </div>
          <div class="card">
            <div style="display:flex; justify-content:space-between;">
              <span>weekly activity</span>${icons.chart}
            </div>
            <div class="chart-dots">
              <div class="bar" style="height:36px;"></div><div class="bar" style="height:48px;"></div><div class="bar" style="height:22px;"></div><div class="bar" style="height:56px;"></div><div class="bar" style="height:30px;"></div>
            </div>
          </div>
        </div>
      `;
    }

    function getLearn() {
      return `
        <div class="screen">
          <div class="card" style="display:flex; gap:16px; align-items:center;">
            ${icons.play} <span><strong>mental math</strong> · 5 min</span>
            <button class="btn-primary" id="startLesson" style="padding:10px 20px; margin-left:auto;">start</button>
          </div>
          <div class="card">
            <h4>today's drills</h4>
            <ul style="list-style:none;">
              <li style="display:flex; gap:16px; margin:16px 0">${icons.check} multiplication · 3/5</li>
              <li style="display:flex; gap:16px; margin:16px 0">${icons.check} division · 2/5</li>
              <li style="display:flex; gap:16px;">⋯ square roots · 1/5</li>
            </ul>
          </div>
          <div class="card">🎯 next mastery: percentages</div>
        </div>
      `;
    }

    function getProgress() {
      return `
        <div class="screen">
          <div class="card">
            <span>total sessions</span><span style="float:right;">47</span>
            <div class="progress-bar-bg"><div class="progress-fill" style="width:78%"></div></div>
            <span>accuracy 78%</span>
          </div>
          <div class="card">
            <div style="display:flex; gap:18px;">${icons.flashcards} <span>badges: 8</span></div>
            <div style="display:flex; gap:6px; margin-top:16px;">
              <span style="background:var(--primary); padding:6px 14px; border-radius:40px;">⚡ speed</span>
              <span style="background:var(--card); border:1px solid var(--border); padding:6px 14px; border-radius:40px;">🧮 genius</span>
            </div>
          </div>
          <div class="card">📊 comparison vs last week +12%</div>
        </div>
      `;
    }

    function getSettings() {
      return `
        <div class="screen">
          <div class="card" style="display:flex; gap:16px; align-items:center;">
            ${icons.profile} <span><strong>Alex Chen</strong> · alex@email.com</span>
          </div>
          <div class="card">
            <div style="display:flex; justify-content:space-between;">
              <span>Dark mode</span>
              <button id="themeToggleBtn" style="background:var(--primary); border:none; color:white; padding:8px 24px; border-radius:30px;">toggle</button>
            </div>
          </div>
          <div class="card">
            <div>sound effects</div>
            <div>daily reminder</div>
          </div>
          <div class="link-row" style="justify-content:space-evenly;">
            <button id="privacySettingsBtn">Privacy</button>
            <button id="termsSettingsBtn">Terms</button>
          </div>
        </div>
      `;
    }

    function getScreenHTML() {
      switch (currentScreen) {
        case 'onboarding': return getOnboarding();
        case 'home': return getHome();
        case 'learn': return getLearn();
        case 'progress': return getProgress();
        case 'settings': return getSettings();
        default: return getOnboarding();
      }
    }

    // ---------- BOTTOM NAV (4 items) ----------
    function renderBottomNav() {
      const navItems = [
        { id: 'home', label: 'Home', icon: icons.home },
        { id: 'learn', label: 'Learn', icon: icons.learn },
        { id: 'progress', label: 'Progress', icon: icons.progress },
        { id: 'settings', label: 'Settings', icon: icons.settings }
      ];
      return `
        <div class="bottom-nav">
          ${navItems.map(item => `
            <button class="nav-item ${currentScreen === item.id ? 'active' : ''}" data-nav="${item.id}">
              ${item.icon}
              <span class="nav-label">${item.label}</span>
            </button>
          `).join('')}
        </div>
      `;
    }

    function showModal(text) {
      modal = { visible: true, content: text };
      renderModal();
    }
    function closeModal() {
      modal = { visible: false, content: '' };
      renderModal();
    }
    function renderModal() {
      const container = document.getElementById('modalContainer');
      if (!modal.visible) { container.innerHTML = ''; return; }
      container.innerHTML = `
        <div class="modal-overlay" id="modalOverlay">
          <div class="modal-card">
            <p>${modal.content}</p>
            <button id="closeModalBtn">OK</button>
          </div>
        </div>
      `;
      document.getElementById('closeModalBtn')?.addEventListener('click', closeModal);
      document.getElementById('modalOverlay')?.addEventListener('click', (e) => { if (e.target.id === 'modalOverlay') closeModal(); });
    }

    // ---------- RENDER ALL ----------
    function renderCurrentScreen() {
      const headerDiv = document.getElementById('header');
      const screenDiv = document.getElementById('screenContent');
      const navDiv = document.getElementById('bottomNav');
      headerDiv.innerHTML = renderHeader();
      screenDiv.innerHTML = getScreenHTML();
      navDiv.innerHTML = renderBottomNav();

      // attach bottom nav listeners
      document.querySelectorAll('.nav-item[data-nav]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const navId = e.currentTarget.dataset.nav;
          if (navId && navId !== currentScreen) {
            currentScreen = navId;
            renderCurrentScreen();
          }
        });
      });

      // profile button -> settings
      document.getElementById('profileBtn')?.addEventListener('click', () => {
        currentScreen = 'settings';
        renderCurrentScreen();
      });

      // onboarding specific
      document.getElementById('getStartedBtn')?.addEventListener('click', () => {
        currentScreen = 'home';
        renderCurrentScreen();
      });
      document.getElementById('privacyBtn')?.addEventListener('click', () => showModal('Privacy Policy — we value your data.'));
      document.getElementById('termsBtn')?.addEventListener('click', () => showModal('Terms of Service: use = ok.'));
      document.getElementById('privacySettingsBtn')?.addEventListener('click', () => showModal('Privacy Policy — simple & clear.'));
      document.getElementById('termsSettingsBtn')?.addEventListener('click', () => showModal('Terms: fair usage.'));
      
      // theme toggle
      document.getElementById('themeToggleBtn')?.addEventListener('click', themeToggle);

      // demo interactions (lessons / practice)
      document.getElementById('practiceNow')?.addEventListener('click', ()=> alert('Answer: 24'));
      document.getElementById('startLesson')?.addEventListener('click', ()=> alert('Starting lesson ... (simulated)'));
    }

    // initial render
    renderCurrentScreen();

    // ---------- SCREENSHOT FEATURE shift+W ----------
    let screenshotCounter = 1;
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const phone = document.getElementById('phoneContainer');
        import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
          html2canvas(phone, { scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            const isDark = document.body.classList.contains('dark');
            const filename = isDark ? '6.png' : (screenshotCounter + '.png');
            if (!isDark) { screenshotCounter = (screenshotCounter % 5) + 1; }
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
          });
        }).catch(() => alert('html2canvas not loaded, but shift+W works!'));
      }
    });

  })();
</script>
<!-- no extra frameworks -->
</body>
</html>
```
