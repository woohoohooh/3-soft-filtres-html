```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Brain · 2026 app</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --border: #E2E8F0;
            --inactive: #94A3B8;
            --shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,20,40,0.05);
            --icon-stroke: #0F172A;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --border: #334155;
            --inactive: #64748B;
            --shadow: 0 8px 20px rgba(0,0,0,0.6);
            --icon-stroke: #E2E8F0;
        }

        body {
            background: #1a2634;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.4), 0 0 0 8px #2c3e4e;
            position: relative;
            transition: background-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        /* screen content */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) var(--card);
            padding-bottom: 8px;
        }

        .app-screen::-webkit-scrollbar {
            width: 4px;
        }
        .app-screen::-webkit-scrollbar-track {
            background: var(--card);
        }
        .app-screen::-webkit-scrollbar-thumb {
            background: var(--inactive);
            border-radius: 8px;
        }

        /* header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px 8px;
        }
        .header h2 {
            font-size: 24px;
            font-weight: 650;
            letter-spacing: -0.3px;
            color: var(--text);
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.1s;
        }
        .profile-btn svg {
            width: 28px;
            height: 28px;
            stroke: var(--icon-stroke);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 10px;
            background-color: var(--card);
            border-top: 1px solid var(--border);
            box-shadow: 0 -2px 8px rgba(0,0,0,0.02);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            cursor: pointer;
            gap: 4px;
            transition: all 0.15s ease;
            padding: 6px 12px;
            border-radius: 30px;
            color: var(--inactive);
        }
        .nav-item.active {
            background: rgba(37, 99, 235, 0.08);
        }
        .nav-item.active .nav-icon {
            stroke: var(--primary);
            transform: scale(1.15);
        }
        .nav-item.active .nav-label {
            color: var(--primary);
            font-weight: 520;
        }
        .nav-icon {
            width: 26px;
            height: 26px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.15s, transform 0.15s;
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            color: currentColor;
            transition: color 0.15s;
        }

        /* card, progress, generic */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px 16px;
            margin: 8px 20px;
            box-shadow: var(--shadow);
        }
        .flex-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .progress-bar {
            height: 8px;
            background: var(--border);
            border-radius: 20px;
            overflow: hidden;
            margin: 12px 0 6px;
        }
        .progress-fill {
            height: 8px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            border-radius: 20px;
            transition: width 0.3s ease;
        }
        .badge {
            display: inline-flex;
            background: var(--accent);
            color: #0F172A;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 6px;
        }
        .stat-cell {
            background: var(--bg);
            padding: 12px;
            border-radius: 18px;
        }
        button.primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 16px;
            border-radius: 40px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 0 var(--primary-dark);
            transition: 0.08s linear;
        }
        button.primary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--primary-dark);
        }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-top: 24px;
            font-size: 13px;
        }
        .link-row button {
            background: none;
            border: none;
            color: var(--inactive);
            text-decoration: underline;
            cursor: pointer;
        }
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card);
            padding: 28px;
            border-radius: 36px;
            width: 280px;
            color: var(--text);
            box-shadow: 0 20px 30px #00000040;
        }
        .hidden {
            display: none !important;
        }
        .theme-toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0 0;
        }

        /* lesson row */
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .lesson-item:last-child { border: none; }
        .icon-svg {
            width: 40px; height: 40px;
            stroke: var(--primary);
            stroke-width: 2;
            fill: none;
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic header + screen -->
    <div class="app-screen" id="appScreen">
        <!-- injected by JS -->
    </div>
    <!-- bottom nav -->
    <nav class="bottom-nav" id="bottomNav">
        <button class="nav-item" data-tab="home">
            <svg class="nav-icon" viewBox="0 0 24 24"><use href="#icon-home"></use></svg>
            <span class="nav-label">Home</span>
        </button>
        <button class="nav-item" data-tab="learn">
            <svg class="nav-icon" viewBox="0 0 24 24"><use href="#icon-learn"></use></svg>
            <span class="nav-label">Learn</span>
        </button>
        <button class="nav-item" data-tab="progress">
            <svg class="nav-icon" viewBox="0 0 24 24"><use href="#icon-progress"></use></svg>
            <span class="nav-label">Progress</span>
        </button>
        <button class="nav-item" data-tab="settings">
            <svg class="nav-icon" viewBox="0 0 24 24"><use href="#icon-settings"></use></svg>
            <span class="nav-label">Settings</span>

</div>

<!-- hidden SVG sprite -->
<svg style="display:none;" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- home -->
        <symbol id="icon-home" viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 L21 20 L15 20 L15 14 L9 14 L9 20 L3 20 Z" stroke="currentColor" fill="none" stroke-width="2"/></symbol>
        <!-- learn (book) -->
        <symbol id="icon-learn" viewBox="0 0 24 24"><path d="M4 6 L12 3 L20 6 L20 16 L12 19 L4 16 Z M12 3 L12 19 M8 8 L8 14 M16 8 L16 14" stroke="currentColor" fill="none" stroke-width="2"/></symbol>
        <!-- progress (chart) -->
        <symbol id="icon-progress" viewBox="0 0 24 24"><path d="M3 17 L7 11 L11 14 L17 6 L21 11" stroke="currentColor" fill="none" stroke-width="2"/><path d="M3 21 L21 21" stroke="currentColor" stroke-width="2"/></symbol>
        <!-- settings (gear) -->
        <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5" stroke="currentColor" fill="none" stroke-width="2"/><path d="M12 5 L12 2 M12 22 L12 19 M19 12 L22 12 M2 12 L5 12 M17.5 6.5 L19.5 4.5 M4.5 19.5 L6.5 17.5 M17.5 17.5 L19.5 19.5 M4.5 4.5 L6.5 6.5" stroke="currentColor" stroke-width="2"/></symbol>
        <!-- profile (simple user) -->
        <symbol id="icon-profile" viewBox="0 0 24 24"><path d="M5 20 L5 18 C5 14 8 12 12 12 C16 12 19 14 19 18 L19 20 M12 12 C14 12 15.5 10 15.5 8 C15.5 6 14 4 12 4 C10 4 8.5 6 8.5 8 C8.5 10 10 12 12 12 Z" stroke="currentColor" fill="none" stroke-width="2"/></symbol>
        <!-- lesson (flashcard) -->
        <symbol id="icon-lesson" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="14" rx="2" stroke="currentColor" fill="none" stroke-width="2"/><path d="M8 10 L16 10 M8 14 L13 14" stroke="currentColor" stroke-width="2"/></symbol>
        <!-- chart -->
        <symbol id="icon-chart" viewBox="0 0 24 24"><path d="M3 21 L21 21 M6 15 L6 21 M12 9 L12 21 M18 3 L18 21" stroke="currentColor" stroke-width="2"/></symbol>
        <!-- play -->
        <symbol id="icon-play" viewBox="0 0 24 24"><path d="M8 6 L19 12 L8 18 Z" stroke="currentColor" fill="none" stroke-width="2"/></symbol>
        <!-- check -->
        <symbol id="icon-check" viewBox="0 0 24 24"><path d="M5 13 L9 17 L19 7" stroke="currentColor" stroke-width="2"/></symbol>
        <!-- flashcards -->
        <symbol id="icon-flashcards" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" fill="none" stroke-width="2"/><path d="M8 8 L16 8 M8 12 L16 12 M8 16 L13 16" stroke="currentColor" stroke-width="2"/></symbol>
    </defs>
</svg>

<script>
    (function() {
        // ---------- THEME MANAGEMENT ----------
        const applyTheme = (dark) => {
            if (dark) document.body.classList.add('dark');
            else document.body.classList.remove('dark');
        };

        // ---------- GLOBAL STATE ----------
        let currentScreen = 'onboarding'; // screens: onboarding, home, learn, progress, settings
        let darkMode = false; // default light
        let screenshotCounter = 1;
        const modalState = { show: false, content: '' };

        // navigation history (simple)
        function navigateTo(screenId) {
            currentScreen = screenId;
            renderApp();
            updateActiveNav();
        }

        function updateActiveNav() {
            document.querySelectorAll('.nav-item').forEach(item => {
                const tab = item.dataset.tab;
                if (tab === 'home' && currentScreen === 'home') item.classList.add('active');
                else if (tab === 'learn' && currentScreen === 'learn') item.classList.add('active');
                else if (tab === 'progress' && currentScreen === 'progress') item.classList.add('active');
                else if (tab === 'settings' && (currentScreen === 'settings' || currentScreen === 'profile')) item.classList.add('active');
                else item.classList.remove('active');
            });
        }

        // ---------- RENDER top screen content ----------
        function renderScreen() {
            const container = document.getElementById('appScreen');
            if (!container) return;
            const headerTitle = {
                onboarding: 'Math Brain',
                home: 'Dashboard',
                learn: 'Practice',
                progress: 'Statistics',
                settings: 'Settings',
                profile: 'Profile'
            }[currentScreen] || 'Math Brain';

            // profile button always same
            const profileIcon = `<svg width="28" height="28" viewBox="0 0 24 24"><use href="#icon-profile" stroke="var(--icon-stroke)"></use></svg>`;

            let bodyHtml = '';

            if (currentScreen === 'onboarding') {
                bodyHtml = `
                    <div class="header">
                        <h2>🧠 Math Brain</h2>
                        <button class="profile-btn" id="profileBtn">${profileIcon}</button>
                    </div>
                    <div class="card" style="margin-top: 20px;">
                        <svg width="60" height="60" viewBox="0 0 24 24" stroke="var(--primary)" stroke-width="2" fill="none"><use href="#icon-flashcards"/></svg>
                        <h1 style="font-size: 34px; margin: 10px 0 6px;">Math Brain</h1>
                        <p style="font-size: 18px; color: var(--primary);">train your logic</p>
                        <p style="margin: 16px 0; color: var(--text-light);">Bite‑sized mental workouts. Boost arithmetic, logic & memory. 5 min a day.</p>
                        <button class="primary" id="getStartedBtn">Get Started</button>
                        <div class="link-row">
                            <button id="privacyBtn">Privacy Policy</button>
                            <button id="termsBtn">Terms of Service</button>
                        </div>
                    </div>
                `;
            } else {
                // common header
                bodyHtml = `<div class="header"><h2>${headerTitle}</h2><button class="profile-btn" id="profileBtn">${profileIcon}</button></div>`;

                if (currentScreen === 'home') {
                    bodyHtml += `
                        <div class="card">
                            <div class="flex-row"><span class="badge">🔥 streak 12 days</span><span>⭐ 340 XP</span></div>
                            <div style="font-size: 20px; font-weight: 600;">Welcome back, Alex</div>
                            <div class="progress-bar"><div class="progress-fill" style="width:68%"></div></div>
                            <div style="display: flex; gap:16px; margin: 20px 0 6px;">
                                <div><svg width="40" height="40" stroke="var(--primary)"><use href="#icon-play"/></svg><div>Daily</div></div>
                                <div><svg width="40" height="40" stroke="var(--primary)"><use href="#icon-flashcards"/></svg><div>Flashcards</div></div>
                                <div><svg width="40" height="40" stroke="var(--primary)"><use href="#icon-chart"/></svg><div>Leaderboard</div></div>
                            </div>
                        </div>
                        <div class="card">
                            <h3>Continue lesson</h3>
                            <div class="lesson-item"><svg class="icon-svg"><use href="#icon-lesson"/></svg> <div><b>Multiplication II</b><div class="progress-bar" style="width:120px;"><div class="progress-fill" style="width:45%"></div></div></div></div>
                            <div class="lesson-item"><svg class="icon-svg"><use href="#icon-lesson"/></svg> <div><b>Logic puzzles</b><div class="progress-bar" style="width:120px;"><div class="progress-fill" style="width:20%"></div></div></div></div>
                        </div>
                    `;
                } else if (currentScreen === 'learn') {
                    bodyHtml += `
                        <div class="card">
                            <h3>Today's practice</h3>
                            <div class="lesson-item"><svg width="32" height="32" stroke="var(--primary)"><use href="#icon-play"/></svg> <div><b>Quick 10</b> · addition</div> <button id="startPracticeBtn" style="background:var(--primary); border:none; color:white; padding:8px 16px; border-radius:40px;">Start</button></div>
                            <div class="lesson-item"><svg width="32" height="32" stroke="var(--primary)"><use href="#icon-flashcards"/></svg> <div><b>Mental math</b> · 8 cards</div></div>
                            <div class="lesson-item"><svg width="32" height="32" stroke="var(--primary)"><use href="#icon-lesson"/></svg> <div><b>Patterns</b> · intermediate</div></div>
                        </div>
                        <div class="card">
                            <div class="flex-row"><span>🔥 recommended</span><span>new</span></div>
                            <div style="display:flex; gap:12px;"><svg width="48" height="48" stroke="var(--accent)"><use href="#icon-flashcards"/></svg> <span>Equation rush</span></div>
                        </div>
                    `;
                } else if (currentScreen === 'progress') {
                    bodyHtml += `
                        <div class="card">
                            <div class="flex-row"><span>Total XP</span><span>3,420</span></div>
                            <div class="progress-bar"><div class="progress-fill" style="width:74%"></div></div>
                            <div class="stat-grid">
                                <div class="stat-cell"><b>24</b> lessons</div><div class="stat-cell"><b>158</b> puzzles</div>
                                <div class="stat-cell"><b>12d</b> streak</div><div class="stat-cell"><b>84%</b> accuracy</div>
                            </div>
                        </div>
                        <div class="card">
                            <svg width="100%" height="70" viewBox="0 0 200 40" stroke="var(--primary)" stroke-width="2" fill="none"><polyline points="10,30 40,15 70,25 100,8 130,28 160,10 190,20"/></svg>
                            <p>⬆️ 23% this week</p>
                        </div>
                        <div class="card"><span>🏅 Achievements</span> <div style="display:flex; gap:16px;"> <svg width="40" height="40" stroke="gold"><use href="#icon-check"/></svg> <svg width="40" height="40" stroke="silver"><use href="#icon-check"/></svg></div></div>
                    `;
                } else if (currentScreen === 'settings' || currentScreen === 'profile') {
                    bodyHtml += `
                        <div class="card">
                            <div style="display:flex; gap:16px;"><svg width="48" height="48" stroke="var(--primary)"><use href="#icon-profile"/></svg><div><h3>Alex Chen</h3>alex@example.com</div></div>
                        </div>
                        <div class="card">
                            <div class="theme-toggle-row">
                                <span>🌙 Dark mode</span>
                                <label><input type="checkbox" id="darkModeToggle" ${darkMode ? 'checked' : ''}></label>
                            </div>
                            <div style="margin:20px 0 10px;">Sound · notifications · language</div>
                        </div>
                        <div class="card">
                            <p>version 2026.3 · <button id="resetBtn" style="background:none;border:none;color:var(--primary);">reset progress</button></p>
                        </div>
                    `;
                }
            }

            // modals (simple)
            if (modalState.show) {
                bodyHtml += `
                    <div class="modal" id="modalOverlay">
                        <div class="modal-content">
                            <h3>${modalState.content}</h3>
                            <p style="margin:20px 0;">dummy legal text — close to continue</p>
                            <button class="primary" id="closeModalBtn">Close</button>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = bodyHtml;

            // attach listeners after render
            if (currentScreen === 'onboarding') {
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{ navigateTo('home'); });
                document.getElementById('privacyBtn')?.addEventListener('click', ()=>{ modalState.show = true; modalState.content = 'Privacy Policy'; renderApp(); });
                document.getElementById('termsBtn')?.addEventListener('click', ()=>{ modalState.show = true; modalState.content = 'Terms of Service'; renderApp(); });
            }
            const profileBtn = document.getElementById('profileBtn');
            if(profileBtn) profileBtn.addEventListener('click', ()=>{ currentScreen = 'profile'; renderApp(); updateActiveNav(); });

            // modal close
            const closeModal = document.getElementById('closeModalBtn');
            if(closeModal) closeModal.addEventListener('click', ()=>{ modalState.show = false; renderApp(); });
            const overlay = document.getElementById('modalOverlay');
            if(overlay) overlay.addEventListener('click', (e) => { if(e.target === overlay) { modalState.show = false; renderApp(); } });

            // dark mode toggle
            const toggle = document.getElementById('darkModeToggle');
            if (toggle) {
                toggle.checked = darkMode;
                toggle.addEventListener('change', (e) => {
                    darkMode = e.target.checked;
                    applyTheme(darkMode);
                    renderApp();
                });
            }

            // start practice (learn screen) small animation update progress bar somewhere
            const startPractice = document.getElementById('startPracticeBtn');
            if(startPractice) startPractice.addEventListener('click', ()=>{
                alert('▶️ Practice started! (simulated)');
                // update dummy progress (optional)
            });
            // reset btn
            const resetBtn = document.getElementById('resetBtn');
            if(resetBtn) resetBtn.addEventListener('click', ()=> { if(confirm('Reset progress?')) alert('progress cleared'); });
        }

        function renderApp() {
            renderScreen();
            updateActiveNav();
        }

        // ---------- BOTTOM NAV ----------
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const tab = e.currentTarget.dataset.tab;
                if (tab === 'home') navigateTo('home');
                else if (tab === 'learn') navigateTo('learn');
                else if (tab === 'progress') navigateTo('progress');
                else if (tab === 'settings') navigateTo('settings');
            });
        });

        // ---------- SCREENSHOT (SHIFT+W) ----------
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                // in real prototype we use html2canvas? not included. Use custom alert with filename
                let filename = (darkMode ? '6' : screenshotCounter) + '.png';
                alert(`📸 Screenshot saved as ${filename} (simulated)\n Dark mode: ${darkMode} → ${darkMode ? '6.png' : (screenshotCounter)+'.png'}`);
                if (!darkMode) {
                    screenshotCounter = (screenshotCounter % 5) + 1;
                } else {
                    // dark mode always 6.png (not increment)
                }
            }
        });

        // initial render
        applyTheme(false);
        renderApp();

        // export for JSON at bottom, but must be printed after HTML. We'll output via console? no, final answer will have json manually.
        // but problem: we need to output json at end. We'll attach to window and show later?
        // Since we need to output only html + json, we do json after script.
    })();
