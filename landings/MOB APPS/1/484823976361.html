  <div class="app" id="app">

<script>
  (function() {
    // ----- theme -----
    const root = document.documentElement;
    let darkMode = false;

    // ----- icon system (inline svg strings) -----
    const icons = {
      profile: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
      lesson: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
      chart: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
      flashcards: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 8h6"/><path d="M9 12h6"/><path d="M9 16h4"/></svg>',
      play: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
      check: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>'
    };

    // ----- app state -----
    let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
    const headerTitles = {
      onboarding: 'Welcome',
      home: 'Home',
      learn: 'Python Playground',
      progress: 'Your stats',
      settings: 'Settings'
    };

    // ----- render functions -----
    function renderOnboarding() {
      return `
        <div class="card" style="text-align: center; padding: 32px 20px;">
          <div style="background: #E9F2FF; width: 80px; height: 80px; border-radius: 30px; margin: 10px auto 20px; display: flex; align-items: center; justify-content: center;">
            <span style="font-size: 44px; font-weight: 700; color: #2563EB;">🐍</span>
          </div>
          <h2 style="font-size: 36px; font-weight: 700; color: var(--primary);">CodeSpark</h2>
          <p style="font-size: 18px; margin: 12px 0 6px; font-weight: 500;">Python, human style</p>
          <p style="color: var(--text-secondary); margin-bottom: 30px;">Bite-sized coding & real practice. No setup, just learn.</p>
          <button id="getStartedBtn">Get Started</button>
          <div style="margin-top: 24px;">
            <span class="small-link" id="privacyLink">Privacy Policy</span> · 
            <span class="small-link" id="termsLink">Terms of Service</span>
          </div>
        </div>
      `;
    }

    function renderHome() {
      return `
        <div class="card">
          <div class="row"><span class="chip">🔥 streak 7 days</span><span>🏆 120 XP today</span></div>
          <h3 style="margin: 12px 0 6px;">Continue where you left</h3>
          <div class="lesson-item">
            ${icons.lesson} <div><div>Variables & Data types</div><div class="progress-bar" style="width:140px;"><div class="progress-fill" style="width:80%"></div></div></div>
            ${icons.play}
          </div>
          <div class="lesson-item">
            ${icons.flashcards} <div><div>If/else challenges</div><div class="progress-bar" style="width:140px;"><div class="progress-fill" style="width:40%"></div></div></div>
            ${icons.play}
          </div>
        </div>
        <div class="card">
          <div class="row"><span><strong>Today's mission</strong></span><span class="badge">2/5</span></div>
          <div class="lesson-item">${icons.check} <span>For loop practice</span></div>
          <div class="lesson-item">${icons.check} <span>Functions basics</span></div>
          <div class="lesson-item"><span style="opacity:0.4;">${icons.lesson}</span> <span style="opacity:0.6;">List methods</span></div>
        </div>
        <div class="card" style="display: flex; gap: 16px;">
          <div style="flex:1; text-align:center;">${icons.chart} <div>760 XP</div><small>this week</small></div>
          <div style="flex:1; text-align:center;">${icons.flashcards} <div>12 lessons</div><small>completed</small></div>
        </div>
      `;
    }

    function renderLearn() {
      return `
        <div class="card">
          <h3>Python Essentials</h3>
          <div class="lesson-item">${icons.lesson} Basics 1: print & strings <span class="badge">free</span></div>
          <div class="lesson-item">${icons.lesson} Lists & dictionaries <span class="badge">new</span></div>
          <div class="lesson-item">${icons.flashcards} Loops (while/for) </div>
          <div class="lesson-item">${icons.flashcards} Functions & scope </div>
          <button style="margin-top: 8px; padding:12px;">Start practice →</button>
        </div>
        <div class="card">
          <div class="row"><span>🚀 Code challenges</span><span>🔥 4 available</span></div>
          <div class="lesson-item">${icons.play} FizzBuzz · easy</div>
          <div class="lesson-item">${icons.play} Palindrome · medium</div>
        </div>
      `;
    }

    function renderProgress() {
      return `
        <div class="card">
          <h3>Weekly activity</h3>
          <div style="display:flex; gap:6px; margin: 16px 0;">
            <div style="width:20px; height:60px; background:var(--primary); border-radius:10px; opacity:0.5;"></div>
            <div style="width:20px; height:90px; background:var(--primary); border-radius:10px;"></div>
            <div style="width:20px; height:40px; background:var(--primary); border-radius:10px; opacity:0.4;"></div>
            <div style="width:20px; height:70px; background:var(--primary); border-radius:10px;"></div>
            <div style="width:20px; height:100px; background:var(--primary); border-radius:10px;"></div>
            <div style="width:20px; height:55px; background:var(--primary); border-radius:10px; opacity:0.7;"></div>
            <div style="width:20px; height:80px; background:var(--primary); border-radius:10px;"></div>
          </div>
          <div class="stat-grid">
            <div class="stat-cell"><span style="font-size:28px;">14</span><br>lessons</div>
            <div class="stat-cell"><span style="font-size:28px;">3</span><br>streak</div>
            <div class="stat-cell"><span style="font-size:28px;">230</span><br>XP today</div>
            <div class="stat-cell"><span style="font-size:28px;">8</span><br>badges</div>
          </div>
        </div>
        <div class="card">🏅 achievement: quick learner · +50XP</div>
      `;
    }

    function renderSettings() {
      return `
        <div class="card">
          <div class="row"><span>🌙 Dark mode</span><label style="width: 50px;"><input type="checkbox" id="darkModeToggle" ${darkMode ? 'checked' : ''} style="transform:scale(1.3);"></label></div>
          <div class="row"><span>🔔 Notifications</span><span>on</span></div>
          <div class="row"><span>🔊 Sound</span><span>off</span></div>
          <div style="margin-top: 24px;">⚙️ Profile: pythonista_01</div>
          <div style="margin-top: 12px;">📲 Version 2.6.0 · <span class="small-link" id="resetOnboarding">reset onboarding</span></div>
        </div>
      `;
    }

    // ----- screen router + header update -----
    function showScreen(screenId) {
      currentScreen = screenId;
      const contentDiv = document.getElementById('screenContent');
      const headerTitle = document.getElementById('headerTitle');
      headerTitle.innerText = headerTitles[screenId] || 'App';

      if (screenId === 'onboarding') contentDiv.innerHTML = renderOnboarding();
      else if (screenId === 'home') contentDiv.innerHTML = renderHome();
      else if (screenId === 'learn') contentDiv.innerHTML = renderLearn();
      else if (screenId === 'progress') contentDiv.innerHTML = renderProgress();
      else if (screenId === 'settings') contentDiv.innerHTML = renderSettings();

      // bottom nav active class update (hide active for onboarding)
      document.querySelectorAll('.nav-item').forEach(item => {
        const tab = item.dataset.tab;
        if (screenId !== 'onboarding' && tab === screenId) item.classList.add('active');
        else item.classList.remove('active');
      });

      // attach special listeners after render
      attachScreenListeners();
    }

    // ----- listeners after dynamic render -----
    function attachScreenListeners() {
      // onboarding buttons
      const getStarted = document.getElementById('getStartedBtn');
      if (getStarted) getStarted.addEventListener('click', () => { showScreen('home'); });

      const privacy = document.getElementById('privacyLink');
      const terms = document.getElementById('termsLink');
      if (privacy) privacy.addEventListener('click', () => showModal('Privacy Policy', 'We respect your data. (demo)'));
      if (terms) terms.addEventListener('click', () => showModal('Terms of Service', 'Keep learning, be nice.'));

      // dark mode toggle inside settings
      const toggle = document.getElementById('darkModeToggle');
      if (toggle) {
        toggle.checked = darkMode;
        toggle.addEventListener('change', (e) => {
          darkMode = e.target.checked;
          if (darkMode) root.classList.add('dark-mode');
          else root.classList.remove('dark-mode');
          // re-render settings to keep checkbox state but fine
          if (currentScreen === 'settings') showScreen('settings');
        });
      }

      // reset onboarding (settings)
      const resetBtn = document.getElementById('resetOnboarding');
      if (resetBtn) resetBtn.addEventListener('click', () => { showScreen('onboarding'); });

      // "start practice" simulation (learn screen)
      document.querySelectorAll('button').forEach(btn => {
        if (btn.textContent.includes('Start practice')) {
          btn.addEventListener('click', () => alert('▶️ practice launched (demo)'));
        }
      });
    }

    // ----- modal system -----
    function showModal(title, text) {
      const modal = document.getElementById('modalContainer');
      modal.innerHTML = `
        <div class="modal-card">
          <h3 style="margin-bottom: 12px;">${title}</h3>
          <p style="margin-bottom: 24px;">${text}</p>
          <button id="closeModalBtn" style="padding: 10px;">Close</button>
        </div>
      `;
      modal.classList.remove('hidden');
      document.getElementById('closeModalBtn').addEventListener('click', () => {
        modal.classList.add('hidden');
      });
    }

    // ----- bottom navigation -----
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', (e) => {
        const tab = item.dataset.tab; // home,learn,progress,settings
        if (tab) showScreen(tab);
      });
    });

    // profile icon click => settings screen
    document.getElementById('profileBtn').addEventListener('click', () => {
      showScreen('settings');
    });

    // initialize onboarding
    showScreen('onboarding');

    // ----- screenshot feature (shift+W) -----
    let screenshotCounter = 1;
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const phone = document.getElementById('phoneContainer');
        // we use html2canvas via CDN (included below)
        if (typeof html2canvas !== 'undefined') {
          const fileName = darkMode ? '6.png' : (screenshotCounter + '.png');
          html2canvas(phone, { scale: 2, backgroundColor: null }).then(canvas => {
            const link = document.createElement('a');
            link.download = fileName;
            link.href = canvas.toDataURL('image/png');
            link.click();
            if (!darkMode && screenshotCounter < 5) screenshotCounter++;
          });
        } else {
          alert('html2canvas not loaded yet?');
        }
      }
    });

    // inject html2canvas for screenshots
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    document.head.appendChild(script);
  })();
</script>
</body>
</html>
