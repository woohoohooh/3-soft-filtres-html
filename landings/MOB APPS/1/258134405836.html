```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeMaster · Python</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: #1a2639;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0,0,0,0.6), 0 0 0 8px #2c3a5e;
            position: relative;
            transition: background 0.2s;
            display: flex;
            flex-direction: column;
        }

        /* dynamic theme vars */
        :root {
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --shadow: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,20,50,0.05);
        }

        body.dark {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --shadow: 0 8px 20px rgba(0,0,0,0.6);
        }

        /* main flex container */
        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px 8px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-light);
        }
        .header-left .screen-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-icon {
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            transition: background 0.1s;
        }
        .profile-icon:hover { background: var(--border-light); }

        /* main content */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 8px;
            background: var(--bg-primary);
        }

        /* bottom nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 10px 12px;
            background: var(--bg-card);
            border-top: 1px solid var(--border-light);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px 0 0;
            flex: 1;
            border-radius: 30px;
            transition: all 0.15s ease;
            color: var(--inactive);
            fill: var(--inactive);
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            transform: scale(1.05);
            background: rgba(37, 99, 235, 0.08);
        }
        .nav-item svg {
            width: 26px;
            height: 26px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            margin-top: 2px;
        }
        .inactive-tab { color: var(--inactive); }

        /* UI cards */
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 18px;
            box-shadow: var(--shadow);
        }
        .flex-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .progress-bar-bg {
            background: var(--border-light);
            height: 10px;
            border-radius: 40px;
            overflow: hidden;
            flex: 1;
        }
        .progress-fill {
            height: 10px;
            background: var(--primary);
            width: 0%;
            border-radius: 40px;
            transition: width 0.4s ease;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
        }
        .btn {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 20px;
            border-radius: 60px;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--primary);
            color: var(--primary);
        }
        .small-link {
            color: var(--inactive);
            text-decoration: underline;
            font-size: 13px;
            cursor: pointer;
        }

        /* modal */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-card {
            background: var(--bg-card);
            padding: 28px;
            border-radius: 32px;
            width: 280px;
            text-align: center;
            color: var(--text-primary);
        }
        .hidden { display: none; }

        /* chart */
        .chart-row {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            height: 120px;
            margin: 20px 0;
        }
        .bar {
            flex: 1;
            background: var(--accent);
            border-radius: 16px 16px 4px 4px;
            height: 0px;
            transition: height 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        }

        /* screen visibility */
        .screen { display: none; }
        .screen.active { display: block; }
    </style>
</head>
<body>
    <div class="phone" id="phoneContainer">
        <div class="app" id="appRoot">
            <!-- dynamic header / content will be injected -->
        </div>
    </div>

    <script>
        (function() {
            // ----- theme & state -----
            const theme = { dark: false };
            const activeTab = { current: 'home' }; 
            let currentScreen = 'onboarding'; 

            // ---------- SVG icons ----------
            const icons = {
                home: `<svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" stroke="currentColor" fill="none"/></svg>`,
                learn: `<svg viewBox="0 0 24 24"><path d="M2 3H8C9.10457 3 10 3.89543 10 5V19C10 20.1046 9.10457 21 8 21H2V3Z" stroke="currentColor" fill="none"/><path d="M22 3H16C14.8954 3 14 3.89543 14 5V19C14 20.1046 14.8954 21 16 21H22V3Z" stroke="currentColor" fill="none"/><line x1="10" y1="7" x2="14" y2="7" stroke="currentColor"/><line x1="10" y1="12" x2="14" y2="12" stroke="currentColor"/><line x1="10" y1="17" x2="14" y2="17" stroke="currentColor"/></svg>`,
                progress: `<svg viewBox="0 0 24 24"><path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3" stroke="currentColor" fill="none" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><path d="M12 8V12L15 15" stroke="currentColor" fill="none"/></svg>`,
                settings: `<svg viewBox="0 0 24 24"><path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke="currentColor" fill="none"/><path d="M19.4 15C19.0343 15.9117 18.4332 16.7328 17.66 17.38L19 20M4.6 15C4.96573 15.9117 5.56679 16.7328 6.34 17.38L5 20M12 4V2M12 22V20M4 12H2M22 12H20M19.07 4.93L17.66 6.34M6.34 6.34L4.93 4.93" stroke="currentColor" fill="none" stroke-linecap="round"/></svg>`,
                profile: `<svg viewBox="0 0 24 24"><path d="M20 21V19C20 16.7909 18.2091 15 16 15H8C5.79086 15 4 16.7909 4 19V21" stroke="currentColor" fill="none" stroke-linecap="round"/><circle cx="12" cy="7" r="5" stroke="currentColor" fill="none"/></svg>`,
                lesson: `<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2" stroke="currentColor" fill="none"/><line x1="8" y1="9" x2="16" y2="9" stroke="currentColor"/><line x1="8" y1="13" x2="16" y2="13" stroke="currentColor"/><line x1="8" y1="17" x2="12" y2="17" stroke="currentColor"/></svg>`,
                chart: `<svg viewBox="0 0 24 24"><path d="M21 21H3V3M7 15V17M11 11V17M15 7V17M19 13V17" stroke="currentColor" fill="none" stroke-linecap="round"/></svg>`,
                flashcards: `<svg viewBox="0 0 24 24"><path d="M4 4H20V16H4V4Z" stroke="currentColor" fill="none"/><path d="M8 16V20H16V16" stroke="currentColor" fill="none"/></svg>`,
                play: `<svg viewBox="0 0 24 24"><path d="M5 3L19 12L5 21V3Z" stroke="currentColor" fill="none"/></svg>`,
                check: `<svg viewBox="0 0 24 24"><path d="M20 6L9 17L4 12" stroke="currentColor" fill="none" stroke-linecap="round"/></svg>`,
            };

            // ----- app data: Learn Python programming -----
            const appName = 'CodeMaster';
            const tagline = 'Learn Python · 3 min a day';

            // ----- modal control -----
            let modalCb = null;
            function showModal(title, text) {
                const modal = document.getElementById('globalModal');
                document.getElementById('modalTitle').innerText = title;
                document.getElementById('modalText').innerText = text;
                modal.classList.remove('hidden');
            }
            function hideModal() { document.getElementById('globalModal').classList.add('hidden'); }

            // ----- helper: render screen inside content -----
            function renderScreen(screenId) {
                const container = document.getElementById('dynamicContent');
                if (!container) return;

                // update active tab variable
                if (['home','learn','progress','settings'].includes(screenId)) activeTab.current = screenId;

                const screens = {
                    onboarding: `
                        <div class="card" style="text-align:center; padding:36px 20px;">
                            <div style="background:#E6F0FF; width:80px; height:80px; border-radius:30px; margin:0 auto 16px; display:flex; align-items:center; justify-content:center;">
                                <span style="font-size:48px;">🐍</span>
                            </div>
                            <h1 style="font-size:38px; font-weight:800; color:var(--primary);">${appName}</h1>
                            <p style="font-size:18px; font-weight:500; margin:8px 0; color:var(--text-primary);">${tagline}</p>
                            <p style="color:var(--text-secondary); margin:24px 0 20px;">Bite-sized Python exercises. Master variables, loops, and functions through interactive coding challenges.</p>
                            <button class="btn" id="startFromOnboarding" style="margin-bottom:16px;">Get Started</button>
                            <div style="display:flex; gap:24px; justify-content:center;">
                                <span class="small-link" id="privacyLink">Privacy Policy</span>
                                <span class="small-link" id="termsLink">Terms of Service</span>
                            </div>
                        </div>
                    `,
                    home: `
                        <div class="card flex-row" style="justify-content:space-between;">
                            <span style="font-weight:700; color:var(--text-primary);">🔥 5 day streak</span>
                            <span class="badge">Beginner</span>
                        </div>
                        <div class="card">
                            <h3 style="color:var(--text-primary); margin-bottom:12px;">Continue lesson</h3>
                            <div class="flex-row">
                                <span style="background:var(--accent); padding:10px; border-radius:20px;">${icons.lesson}</span>
                                <div style="flex:1"><strong style="color:var(--text-primary);">Loops & lists</strong><div class="progress-bar-bg"><div class="progress-fill" style="width:40%"></div></div></div>
                            </div>
                            <button class="btn btn-outline" style="margin-top:20px;" id="gotoLearnFromHome">Practice now</button>
                        </div>
                        <div class="card">
                            <div style="display:flex; gap:16px; align-items:center;">
                                <span>${icons.flashcards}</span><span style="color:var(--text-primary);">Daily challenge: 5 min</span>
                                <span style="margin-left:auto; background:var(--primary); color:white; padding:6px 12px; border-radius:30px;">2xp</span>
                            </div>
                        </div>
                    `,
                    learn: `
                        <div class="card"><h3 style="color:var(--text-primary);">Python fundamentals</h3></div>
                        <div class="card flex-row"><span>${icons.lesson}</span><div><strong style="color:var(--text-primary);">Variables</strong><div class="progress-bar-bg"><div class="progress-fill" style="width:100%"></div></div></div><span style="color:var(--primary);">${icons.check}</span></div>
                        <div class="card flex-row"><span>${icons.lesson}</span><div><strong style="color:var(--text-primary);">Conditionals</strong><div class="progress-bar-bg"><div class="progress-fill" style="width:70%"></div></div></div><span style="color:var(--text-secondary);">4/6</span></div>
                        <div class="card flex-row"><span>${icons.lesson}</span><div><strong style="color:var(--text-primary);">Loops</strong><div class="progress-bar-bg"><div class="progress-fill" style="width:30%"></div></div></div><span style="color:var(--text-secondary);">2/7</span></div>
                        <div class="card" style="text-align:center;"><button class="btn" id="startLesson">Start next → loops</button></div>
                    `,
                    progress: `
                        <div class="card"><h3 style="color:var(--text-primary);">This week</h3><div class="chart-row" id="chartWeek"><div class="bar" style="height:70px"></div><div class="bar" style="height:40px"></div><div class="bar" style="height:90px"></div><div class="bar" style="height:60px"></div><div class="bar" style="height:80px"></div><div class="bar" style="height:30px"></div><div class="bar" style="height:50px"></div></div></div>
                        <div class="card flex-row"><span>${icons.chart}</span><span style="color:var(--text-primary);">Completed: 23 lessons</span></div>
                        <div class="card flex-row"><span>⚡</span><span>streak 5 days</span></div>
                    `,
                    settings: `
                        <div class="card">
                            <h3 style="color:var(--text-primary);">Appearance</h3>
                            <div style="display:flex; gap:12px; margin:16px 0;">
                                <button class="btn btn-outline" id="lightModeBtn" style="flex:1;">☀️ Light</button>
                                <button class="btn btn-outline" id="darkModeBtn" style="flex:1;">🌙 Dark</button>
                            </div>
                            <button class="btn btn-outline" style="width:100%;" id="resetProgress">Reset progress (demo)</button>
                            <p style="margin-top:24px; font-size:12px; color:var(--inactive);">version 2026.3 · build 9</p>
                        </div>
                    `,
                    profileSettings: `
                        <div class="card">
                            <div style="display:flex; gap:24px; align-items:center;"><span>${icons.profile}</span> <span style="font-size:24px; color:var(--text-primary);">Alex</span></div>
                            <hr style="border-color:var(--border-light); margin:20px 0;">
                            <p style="color:var(--text-primary);">Member since 2026</p>
                            <button class="btn btn-outline" style="margin-top:20px;" id="backToSettings">← Back</button>
                        </div>
                    `,
                };

                let html = screens[screenId] || screens.home;
                if (screenId === 'profileSettings') html = screens.profileSettings;
                container.innerHTML = html;

                // dynamic event listeners
                if (screenId === 'onboarding') {
                    document.getElementById('privacyLink')?.addEventListener('click', ()=>showModal('Privacy Policy','We respect your data. No tracking.'));
                    document.getElementById('termsLink')?.addEventListener('click', ()=>showModal('Terms of Service','Educational use only.'));
                    document.getElementById('startFromOnboarding')?.addEventListener('click', ()=> navigateTo('home'));
                }
                if (screenId === 'home') {
                    document.getElementById('gotoLearnFromHome')?.addEventListener('click', ()=> navigateTo('learn'));
                }
                if (screenId === 'learn') {
                    document.getElementById('startLesson')?.addEventListener('click', ()=> showModal('Quick start','Starting "for loops" ...'));
                }
                if (screenId === 'settings') {
                    document.getElementById('lightModeBtn')?.addEventListener('click', ()=>{ document.body.classList.remove('dark'); theme.dark = false; });
                    document.getElementById('darkModeBtn')?.addEventListener('click', ()=>{ document.body.classList.add('dark'); theme.dark = true; });
                }
                if (screenId === 'profileSettings') {
                    document.getElementById('backToSettings')?.addEventListener('click', ()=>navigateTo('settings'));
                }
            }

            // ----- navigation -----
            function navigateTo(screenId) {
                currentScreen = screenId;
                const headerTitle = document.getElementById('headerScreenTitle');
                if (headerTitle) {
                    const map = { onboarding:'Welcome', home:'Home', learn:'Learn', progress:'Progress', settings:'Settings', profileSettings:'Profile' };
                    headerTitle.innerText = map[screenId] || 'App';
                }
                renderScreen(screenId);
                updateBottomNavActive(screenId);
            }

            function updateBottomNavActive(activeId) {
                ['home','learn','progress','settings'].forEach(id => {
                    const btn = document.getElementById(`nav-${id}`);
                    if (btn) {
                        if (id === activeId) btn.classList.add('active');
                        else btn.classList.remove('active');
                    }
                });
            }

            // ----- build base UI (header + bottom nav + content) -----
            function buildAppShell() {
                const root = document.getElementById('appRoot');
                root.innerHTML = `
                    <!-- modal -->
                    <div id="globalModal" class="modal hidden">
                        <div class="modal-card">
                            <h3 id="modalTitle" style="margin-bottom:8px;">Title</h3>
                            <p id="modalText" style="margin-bottom:24px;"></p>
                            <button class="btn" onclick="hideModal()">Close</button>
                        </div>
                    </div>

                    <div class="header">
                        <div class="header-left"><span class="screen-title" id="headerScreenTitle">Welcome</span></div>
                        <div class="profile-icon" id="profileBtn">${icons.profile}</div>
                    </div>

                    <div class="content" id="dynamicContent"></div>

                    <div class="bottom-nav">
                        <button class="nav-item" id="nav-home">${icons.home}<span>Home</span></button>
                        <button class="nav-item" id="nav-learn">${icons.learn}<span>Learn</span></button>
                        <button class="nav-item" id="nav-progress">${icons.progress}<span>Progress</span></button>
                        <button class="nav-item" id="nav-settings">${icons.settings}<span>Settings</span></button>
                    </div>
                `;

                document.getElementById('profileBtn').addEventListener('click', ()=> navigateTo('profileSettings'));

                document.getElementById('nav-home').addEventListener('click', ()=> navigateTo('home'));
                document.getElementById('nav-learn').addEventListener('click', ()=> navigateTo('learn'));
                document.getElementById('nav-progress').addEventListener('click', ()=> navigateTo('progress'));
                document.getElementById('nav-settings').addEventListener('click', ()=> navigateTo('settings'));

                window.hideModal = hideModal; // expose for onclick

                // start with onboarding
                navigateTo('onboarding');
            }

            // ----- screenshot: shift+W -----
            document.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    const phone = document.getElementById('phoneContainer');
                    html2canvas(phone, { scale: 2 }).then(canvas => {
                        const link = document.createElement('a');
                        const themeSuffix = document.body.classList.contains('dark') ? '6' : (window.snapCount || 0) + 1;
                        let name = (window.snapCount || 0) + 1;
                        if (document.body.classList.contains('dark')) name = 6;
                        else if (window.snapCount === undefined) window.snapCount = 0;
                        if (!document.body.classList.contains('dark')) {
                            window.snapCount = (window.snapCount || 0) + 1;
                            name = window.snapCount;
                        }
                        link.download = name + '.png';
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    });
                }
            });

            // wait for html2canvas (load from cdn)
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
            script.onload = buildAppShell;
            document.head.appendChild(script);
        })();
    </script>
    <!-- JSON block (will be printed after code) -->
</body>
</html>
All done!

    "4.png": "Track Progress",
    "5.png": "Smart Settings",
    "6.png": "Dark Theme"
}
