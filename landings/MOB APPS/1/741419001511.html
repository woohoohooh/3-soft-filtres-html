<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;

            align-items: center;

        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg-primary);
            border-radius: 44px;
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.5), 0 0 0 8px #2d3e4f;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s;
        }

        /* light / dark variables */
        :root {
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary-blue: #2563EB;
            --primary-dark: #1E40AF;
            --accent-blue: #38BDF8;
            --icon-inactive: #94A3B8;
            --bottom-bar-bg: #FFFFFF;
            --header-bg: #F8FAFC;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.02);
        }

        .dark {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary-blue: #3B82F6;
            --primary-dark: #2563EB;
            --accent-blue: #38BDF8;
            --icon-inactive: #64748B;
            --bottom-bar-bg: #1E293B;
            --header-bg: #0F172A;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
        }

        /* main flex layout */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            background: var(--bg-primary);
        }

        /* header */
        .header {
            height: 60px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-light);
        }
        .header-left .title {
            font-weight: 700;
            font-size: 20px;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .header-right {
            cursor: pointer;
            padding: 8px;
        }

        /* main content (screen container) */
        .screen-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px 12px 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-blue) var(--bg-card);
        }
        .screen-content::-webkit-scrollbar {
            width: 4px;
        }
        .screen-content::-webkit-scrollbar-track {
            background: var(--bg-card);
        }
        .screen-content::-webkit-scrollbar-thumb {
            background: var(--primary-blue);
            border-radius: 10px;
        }

        /* bottom navigation */
        .bottom-nav {
            height: 70px;
            background: var(--bottom-bar-bg);
            border-top: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 6px 10px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            flex: 1;
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 8px 0;
            border-radius: 30px;
        }
        .nav-item.active {
            background: rgba(37, 99, 235, 0.08);
            transform: scale(1.02);
        }
        .nav-item.active .nav-icon svg {
            stroke: var(--primary-blue);
            stroke-width: 2.2;
            width: 26px;
            height: 26px;
        }
        .nav-item.active .nav-label {
            color: var(--primary-blue);
            font-weight: 600;
        }
        .nav-icon svg {
            width: 22px;
            height: 22px;
            stroke: var(--icon-inactive);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.15s;
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--icon-inactive);
        }

        /* cards, progress, etc */
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 20px 18px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 18px;
            border: 1px solid var(--border-light);
        }
        .badge {
            background: var(--accent-blue);
            color: #0F172A;
            font-weight: 600;
            font-size: 12px;

            border-radius: 30px;
            display: inline-block;
        }
        .progress-bar-bg {
            height: 8px;
            background: var(--border-light);
            border-radius: 30px;
            margin: 12px 0;
        }
        .progress-fill {
            height: 8px;
            background: var(--primary-blue);
            border-radius: 30px;
            width: 0%;
            transition: width 0.3s ease;
        }
        .row-space {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .icon-svg-small {
            width: 20px;
            height: 20px;
            stroke: var(--primary-blue);
            stroke-width: 2;
            fill: none;
        }
        button {
            background: var(--primary-blue);
            border: none;
            color: white;
            font-weight: 600;
            padding: 16px 24px;
            border-radius: 60px;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(37,99,235,0.2);
            transition: 0.1s;
        }
        button:active { transform: scale(0.98); background: var(--primary-dark); }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 24px 0 8px;
            color: var(--icon-inactive);
            font-size: 13px;
        }
        .link-row span {
            text-decoration: underline;
            cursor: pointer;
        }

        /* modal */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: var(--bg-card);
            width: 280px;
            padding: 28px;
            border-radius: 32px;
            text-align: center;
            color: var(--text-primary);
        }

        /* extra UI */
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0;
        }
        .stat-item {
            background: var(--bg-primary);
            padding: 14px;
            border-radius: 20px;
        }
        .flashcard {
            background: var(--accent-blue);
            color: #0F172A;
            padding: 20px;
            border-radius: 24px;
            font-weight: 700;
            margin: 12px 0;
        }
        .avatar {
            background: var(--primary-blue);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 16px 0;
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <div class="app-container" id="app">
        <!-- header (dynamic via js) -->
        <div class="header" id="appHeader">
            <div class="header-left"><span class="title" id="headerTitle">FlashLearn</span></div>
            <div class="header-right" id="profileBtn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
        </div>

        <!-- main screens injected here -->
        <div class="screen-content" id="screenContainer"></div>

        <!-- bottom navigation -->
        <div class="bottom-nav" id="bottomNav">
            <div class="nav-item" data-tab="home"><span class="nav-icon" id="icon-home"></span><span class="nav-label">Home</span></div>
            <div class="nav-item" data-tab="learn"><span class="nav-icon" id="icon-learn"></span><span class="nav-label">Learn</span></div>
            <div class="nav-item" data-tab="progress"><span class="nav-icon" id="icon-progress"></span><span class="nav-label">Progress</span></div>
            <div class="nav-item" data-tab="settings"><span class="nav-icon" id="icon-settings"></span><span class="nav-label">Settings</span></div>
        </div>
    </div>

    <!-- modal dialogs (privacy & terms) -->
    <div class="modal" id="modalOverlay"><div class="modal-card" id="modalContent"><h3 id="modalTitle"></h3><p id="modalBody"></p><button style="margin-top:20px;" id="closeModal">OK</button></div></div>
</div>

<script>
    (function(){
        // ---------- THEME ----------
        const applyTheme = (isDark) => {
            document.documentElement.classList.toggle('dark', isDark);
        };
        let darkMode = false;

        // ---------- ICON SYSTEM (inline svg) ----------
        const icons = {
            home: '<svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2h-5v-8h-4v8H5a2 2 0 0 1-2-2z"/></svg>',
            learn: '<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
            progress: '<svg viewBox="0 0 24 24"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/></svg>',
            settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82L12 22z"/><path d="M4.6 9a1.65 1.65 0 0 0-.33 1.82c.26.61.86.99 1.51.99h12.44a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82L12 2z"/></svg>',
            profile: '<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
            lesson: '<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
            chart: '<svg viewBox="0 0 24 24"><path d="M21 21H4V4"/><path d="M7 15v4"/><path d="M11 9v10"/><path d="M15 12v7"/><path d="M19 5v14"/></svg>',
            flashcards: '<svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 7h8"/><path d="M8 12h6"/><path d="M8 17h4"/></svg>',
            play: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>',
            check: '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
        };
        // inject icons into nav
        document.getElementById('icon-home').innerHTML = icons.home;
        document.getElementById('icon-learn').innerHTML = icons.learn;
        document.getElementById('icon-progress').innerHTML = icons.progress;
        document.getElementById('icon-settings').innerHTML = icons.settings;

        // ---------- STATE ----------
        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
        let screenshotCounter = 1;

        // ---------- SCREEN RENDER ----------
        const container = document.getElementById('screenContainer');
        const headerTitle = document.getElementById('headerTitle');

        function renderScreen(screen) {
            if (screen === 'onboarding') {
                headerTitle.innerText = 'FlashLearn';
                container.innerHTML = `
                    <div style="display:flex; flex-direction:column; min-height:100%;">
                        <div style="margin-top:20px; text-align:center;">
                            <div style="background:#2563EB; width:70px; height:70px; border-radius:22px; margin:0 auto; display:flex; align-items:center; justify-content:center;">
                                ${icons.flashcards.replace('<svg','<svg width="42" height="42" stroke="white"')}
                            </div>
                            <h1 style="font-size:38px; font-weight:800; margin:12px 0 4px; color:var(--text-primary);">FlashLearn</h1>
                            <p style="color:var(--accent-blue); font-weight:600;">master anything, daily</p>
                            <p style="color:var(--text-secondary); margin:16px 0 32px;">Smart flashcards & spaced repetition. Learn languages, science & more in minutes.</p>
                            <button id="getStartedBtn">Get Started →</button>
                            <div class="link-row"><span id="privacyLink">Privacy Policy</span><span id="termsLink">Terms of Service</span></div>
                        </div>
                    </div>
                `;
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                    currentScreen = 'home';
                    setActiveTab('home');
                    renderScreen('home');
                });
                document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy Policy','We respect your data. No selling.'));
                document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms of Service','Educational use only.'));
            }
            else if (screen === 'home') {
                headerTitle.innerText = 'Dashboard';
                container.innerHTML = `
                    <div class="card" style="display:flex; gap:12px; align-items:center;">
                        <div class="avatar">${icons.profile.replace('<svg','<svg width="24" height="24" stroke="white"')}</div>
                        <div><span style="font-weight:700; color:var(--text-primary);">Alex Chen</span><span class="badge" style="margin-left:10px;">🔥 7 day streak</span></div>
                    </div>
                    <div class="card">
                        <div class="row-space"><span style="font-weight:600;">Daily goal</span><span>80%</span></div>
                        <div class="progress-bar-bg"><div class="progress-fill" style="width:80%"></div></div>
                        <div style="display:flex; gap:16px; margin-top:16px;">
                            <span style="display:flex; gap:6px;">${icons.flashcards}<span>5 due</span></span>
                            <span style="display:flex; gap:6px;">${icons.play}<span>practice</span></span>
                        </div>
                    </div>
                    <div class="card">
                        <h3 style="margin-bottom:12px;">Continue learning</h3>
                        <div style="display:flex; gap:16px; align-items:center;"><span>🇫🇷 French vocab</span> <span style="flex:1;"><div class="progress-bar-bg"><div class="progress-fill" style="width:45%"></div></div></span></div>
                        <div style="display:flex; gap:16px; align-items:center; margin-top:12px;"><span>🧠 Psychology 101</span> <span style="flex:1;"><div class="progress-bar-bg"><div class="progress-fill" style="width:20%"></div></div></span></div>
                    </div>
                `;
            }
            else if (screen === 'learn') {
                headerTitle.innerText = 'Learn';
                container.innerHTML = `
                    <div class="card">${icons.flashcards} <strong style="margin-left:10px;">Today’s flashcards</strong></div>
                    <div class="flashcard" id="flashcardDemo">What does "polyglot" mean?</div>
                    <button id="revealBtn" style="padding:12px;">Show answer</button>
                    <div style="margin-top:16px;" class="card">
                        <div class="row-space"><span>Programming</span><span>12 cards</span></div>
                        <div class="row-space"><span>Medical terms</span><span>8 cards</span></div>
                    </div>
                `;
                document.getElementById('revealBtn')?.addEventListener('click', ()=>{
                    document.getElementById('flashcardDemo').innerText = 'a person who knows several languages.';
                });
            }
            else if (screen === 'progress') {
                headerTitle.innerText = 'Progress';
                container.innerHTML = `
                    <div class="card">
                        <div class="row-space"><span>Weekly activity</span>${icons.chart}</div>
                        <div style="height:100px; display:flex; align-items:flex-end; gap:6px; margin:12px 0;">
                            <div style="background:var(--primary-blue); width:20%; height:40px; border-radius:8px;"></div>
                            <div style="background:var(--primary-blue); width:20%; height:70px;"></div>
                            <div style="background:var(--primary-blue); width:20%; height:55px;"></div>
                            <div style="background:var(--primary-blue); width:20%; height:90px;"></div>
                            <div style="background:var(--primary-blue); width:20%; height:30px;"></div>
                        </div>
                    </div>
                    <div class="stat-grid">
                        <div class="stat-item">📊 342 cards mastered</div>
                        <div class="stat-item">⏱️ 4.2h total</div>
                    </div>
                    <div class="card">⭐ Achievements: 4 badges</div>
                `;
            }
            else if (screen === 'settings') {
                headerTitle.innerText = 'Settings';
                container.innerHTML = `
                    <div class="card theme-toggle">
                        <span>🌓 Dark mode</span>
                        <label><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}></label>
                    </div>
                    <div class="card">🔔 Notifications</div>
                    <div class="card">🗣️ Language: English</div>
                    <div class="card">📲 App version 2026.2</div>
                `;
                const toggle = document.getElementById('darkToggle');
                if(toggle) toggle.addEventListener('change', (e) => {
                    darkMode = e.target.checked;
                    applyTheme(darkMode);
                    renderScreen(currentScreen);
                });
            }
            // update bottom nav active
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if (screen !== 'onboarding') {
                const tabMap = {home:'home', learn:'learn', progress:'progress', settings:'settings'};
                const active = document.querySelector(`.nav-item[data-tab="${tabMap[screen]}"]`);
                if(active) active.classList.add('active');
            }
        }

        // bottom nav listeners
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', (e) => {
                const tab = item.getAttribute('data-tab');
                if (tab === 'home') currentScreen = 'home';
                else if (tab === 'learn') currentScreen = 'learn';
                else if (tab === 'progress') currentScreen = 'progress';
                else if (tab === 'settings') currentScreen = 'settings';
                renderScreen(currentScreen);
            });
        });

        // profile icon -> settings
        document.getElementById('profileBtn').addEventListener('click', ()=>{
            currentScreen = 'settings';
            setActiveTab('settings');
            renderScreen('settings');
        });

        function setActiveTab(tab) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const active = document.querySelector(`.nav-item[data-tab="${tab}"]`);
            if(active) active.classList.add('active');
        }

        // modal
        const modal = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        window.showModal = (title, text) => {
            modalTitle.innerText = title;
            modalBody.innerText = text;
            modal.style.display = 'flex';
        };
        document.getElementById('closeModal').addEventListener('click', ()=>{
            modal.style.display = 'none';
        });
        window.addEventListener('click', (e) => { if(e.target === modal) modal.style.display = 'none'; });

        // screenshot SHIFT+W
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                const phone = document.getElementById('phoneContainer');
                html2canvas?.(phone, {scale:2}).then(canvas => {
                    const link = document.createElement('a');
                    const themeSuffix = darkMode ? '6' : (screenshotCounter++);
                    let filename = darkMode ? '6.png' : (screenshotCounter-1)+'.png';
                    link.download = filename;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }).catch(()=> alert('html2canvas not loaded — fallback, but assume it works.'));
            }
        });

        // initial render
        renderScreen('onboarding');
        applyTheme(false);

        // dummy html2canvas (lightweight mock, but real CDN in head)
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        document.head.appendChild(script);
    })();
</script>
<!-- include html2canvas for screenshot feature (async) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</body>
</html>
