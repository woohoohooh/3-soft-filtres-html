```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Brain Trainer • prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1e2b;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg-primary);
            border-radius: 48px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2d3344;
            overflow: hidden;
            position: relative;
            transition: background-color 0.2s;
        }

        /* inner screen (no notch, just clean) */
        .screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            position: relative;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--card-bg);
        }
        .screen::-webkit-scrollbar {
            width: 4px;
        }
        .screen::-webkit-scrollbar-track {
            background: var(--card-bg);
        }
        .screen::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 8px;
        }

        /* theme variables (light default) */
        :root {
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --bg-primary: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --text-muted: #64748B;
            --border-light: #E2E8F0;
            --icon-inactive: #94A3B8;
            --bottom-nav-bg: #FFFFFF;
            --highlight-soft: rgba(37, 99, 235, 0.08);
        }

        /* dark mode class (applied to .screen) */
        .screen.dark {
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --bg-primary: #0F172A;
            --card-bg: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --text-muted: #94A3B8;
            --border-light: #334155;
            --icon-inactive: #64748B;
            --bottom-nav-bg: #1E293B;
            --highlight-soft: rgba(59, 130, 246, 0.15);
        }

        /* header */
        .header {
            padding: 18px 20px 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-light);
            background: var(--bg-primary);
            position: sticky;
            top: 0;
            z-index: 5;
        }
        .header-left .screen-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .header-right {
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            transition: background 0.1s;
        }
        .header-right:hover {
            background: var(--highlight-soft);
        }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: var(--bottom-nav-bg);
            padding: 10px 8px 14px 8px;
            border-top: 1px solid var(--border-light);
            margin-top: auto;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 20px;
            transition: all 0.15s ease;
            background: transparent;
            border: none;
            flex: 1;
            max-width: 70px;
        }
        .nav-item.active {
            background: var(--highlight-soft);
            transform: scale(1.02);
        }
        .nav-item .icon {
            width: 24px;
            height: 24px;
            stroke: var(--icon-inactive);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.15s, transform 0.15s;
        }
        .nav-item.active .icon {
            stroke: var(--primary);
            transform: scale(1.15);
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            color: var(--icon-inactive);
            transition: color 0.15s;
        }
        .nav-item.active span {
            color: var(--primary);
            font-weight: 600;
        }

        /* main content area */
        .content {
            flex: 1;
            padding: 16px 18px 10px 18px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* cards */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.03);
            border: 1px solid var(--border-light);
        }

        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            font-size: 16px;
            padding: 14px 20px;
            border-radius: 60px;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s, transform 0.05s;
            box-shadow: 0 6px 14px rgba(37,99,235,0.3);
        }
        .btn-primary:active {
            transform: scale(0.98);
            background: var(--primary-dark);
        }

        /* link row small */
        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 14px;
            font-size: 13px;
        }
        .link-row span {
            color: var(--text-muted);
            text-decoration: underline;
            cursor: pointer;
        }

        /* modal overlay (hidden by default) */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.15s;
        }
        .modal.show {
            visibility: visible;
            opacity: 1;
        }
        .modal-content {
            background: var(--card-bg);
            width: 280px;
            padding: 28px 24px;
            border-radius: 32px;
            text-align: center;
            border: 1px solid var(--border-light);
            color: var(--text-primary);
        }
        .modal-content h3 {
            margin-bottom: 12px;
            color: var(--primary);
        }
        .modal-content button {
            margin-top: 20px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 8px 30px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        /* lesson row, progress, stats */
        .lesson-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .lesson-item:last-child {
            border-bottom: none;
        }
        .progress-bar-bg {
            height: 8px;
            background: var(--border-light);
            border-radius: 20px;
            overflow: hidden;
            margin: 8px 0 4px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 20px;
            transition: width 0.4s;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
        }
        .stat-grid {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .stat-cell {
            background: var(--bg-primary);
            padding: 12px 10px;
            border-radius: 20px;
            flex: 1 0 40%;
            border: 1px solid var(--border-light);
            text-align: center;
        }

        /* chart simulation */
        .chart-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 100px;
            margin: 20px 0;
        }
        .chart-bar {
            flex: 1;
            background: var(--primary);
            height: calc(100% * 0.7);
            border-radius: 12px 12px 4px 4px;
            transition: height 0.5s;
        }

        /* custom svg icon set */
        .icon-set {
            display: none;
        }

        /* screenshot helper */
        .hidden-capture {
            display: none;
        }

        .app-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
<div class="phone">
    <div class="screen light" id="appScreen">
        <!-- header (dynamically updated) -->
        <div class="header" id="mainHeader">
            <div class="header-left"><span class="screen-title" id="screenTitle">Welcome</span></div>
            <div class="header-right" id="profileBtn"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
        </div>

        <!-- dynamic content -->
        <div class="content" id="screenContent"></div>

        <!-- bottom navigation (static) -->
        <div class="bottom-nav" id="bottomNav">
            <div class="nav-item" data-tab="home"><svg class="icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Home</span></div>
            <div class="nav-item" data-tab="learn"><svg class="icon" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span>Learn</span></div>
            <div class="nav-item" data-tab="progress"><svg class="icon" viewBox="0 0 24 24"><path d="M21 12v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 5 17 10"/><line x1="12" y1="5" x2="12" y2="15"/></svg><span>Progress</span></div>
            <div class="nav-item" data-tab="settings"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 18a10 10 0 0 0 6.36-2.22z"/><path d="M16.5 6.5 19 9"/><path d="M7.5 6.5 5 9"/></svg><span>Settings</span></div>
        </div>
    </div>
</div>

<!-- modal container -->
<div class="modal" id="modal">
    <div class="modal-content" id="modalText">
        <h3 id="modalTitle">Privacy Policy</h3>
        <p id="modalBody">Your data is safe with us. No sharing, just learning.</p>
        <button id="closeModal">OK</button>
    </div>
</div>

<script>
    (function() {
        // ----- app state -----
        let currentScreen = 'onboarding'; // 'onboarding','home','learn','progress','settings'
        let darkMode = false;
        let screenshotCounter = 1;

        // ----- theme -----
        const screenEl = document.getElementById('appScreen');
        const toggleTheme = () => {
            darkMode = !darkMode;
            if(darkMode) screenEl.classList.add('dark'); else screenEl.classList.remove('dark');
        };

        // ----- modals (privacy/terms) -----
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        function showModal(type) {
            if(type === 'privacy') {
                modalTitle.innerText = 'Privacy Policy';
                modalBody.innerText = 'We respect your privacy. No data leaves this prototype.';
            } else {
                modalTitle.innerText = 'Terms of Service';
                modalBody.innerText = 'Educational use only. Keep learning!';
            }
            modal.classList.add('show');
        }
        document.getElementById('closeModal').addEventListener('click', ()=>{
            modal.classList.remove('show');
        });
        window.addEventListener('click', (e) => { if(e.target === modal) modal.classList.remove('show'); });

        // ----- bottom nav activation -----
        const navItems = document.querySelectorAll('.nav-item');
        function setActiveTab(tabId) {
            navItems.forEach(item => {
                const data = item.getAttribute('data-tab');
                if(data === tabId) item.classList.add('active');
                else item.classList.remove('active');
            });
        }

        // ----- header title helper -----
        const screenTitleSpan = document.getElementById('screenTitle');

        // ----- RENDER functions -----
        function renderScreen() {
            const contentDiv = document.getElementById('screenContent');
            if(currentScreen === 'onboarding') renderOnboarding(contentDiv);
            else if(currentScreen === 'home') renderHome(contentDiv);
            else if(currentScreen === 'learn') renderLearn(contentDiv);
            else if(currentScreen === 'progress') renderProgress(contentDiv);
            else if(currentScreen === 'settings') renderSettings(contentDiv);
            updateHeaderByScreen();
        }

        function updateHeaderByScreen() {
            if(currentScreen === 'onboarding') screenTitleSpan.innerText = 'Welcome';
            else if(currentScreen === 'home') screenTitleSpan.innerText = 'Dashboard';
            else if(currentScreen === 'learn') screenTitleSpan.innerText = 'Mental Gym';
            else if(currentScreen === 'progress') screenTitleSpan.innerText = 'Statistics';
            else if(currentScreen === 'settings') screenTitleSpan.innerText = 'Settings';
        }

        function renderOnboarding(container) {
            container.innerHTML = `
                <div class="card" style="text-align: center; padding: 36px 20px;">
                    <div class="app-logo" style="justify-content: center;">
                        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="${darkMode ? '#3B82F6' : '#2563EB'}" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                        <span style="font-size: 32px; font-weight: 700; color: var(--primary);">MathMind</span>
                    </div>
                    <p style="font-size: 18px; font-weight: 500; margin: 6px 0 4px;">train your brain daily</p>
                    <p style="color: var(--text-secondary); margin: 16px 0;">Become a mental math master with 5‑minute workouts. Adaptive challenges & instant feedback.</p>
                    <button class="btn-primary" id="getStartedBtn">Get Started</button>
                    <div class="link-row">
                        <span id="privacyLink">Privacy Policy</span>
                        <span id="termsLink">Terms of Service</span>
                    </div>
                </div>
            `;
            document.getElementById('privacyLink')?.addEventListener('click', ()=>showModal('privacy'));
            document.getElementById('termsLink')?.addEventListener('click', ()=>showModal('terms'));
            document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                currentScreen = 'home';
                setActiveTab('home');
                renderScreen();
            });
            setActiveTab('none');
        }

        function renderHome(container) {
            container.innerHTML = `
                <div class="card" style="display: flex; gap: 12px; align-items: center;">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
                    <div><div style="font-weight: 600; font-size: 18px;">Daily challenge</div><span style="color: var(--text-muted);">5 puzzles · 345 pts</span></div>
                    <button style="margin-left: auto; background: var(--primary); border: none; color: white; padding: 8px 16px; border-radius: 40px;" id="quickPractice">Practice</button>
                </div>
                <div class="card">
                    <div style="display: flex; justify-content: space-between;"><span style="font-weight: 600;">Today's streak</span><span>7 days 🔥</span></div>
                    <div class="progress-bar-bg"><div class="progress-fill" style="width:70%"></div></div>
                    <div style="display: flex; gap: 20px; margin-top: 16px;">
                        <div><span style="color: var(--text-muted);">Lessons done</span><br><span style="font-size: 22px; font-weight: 700;">12</span></div>
                        <div><span style="color: var(--text-muted);">Accuracy</span><br><span style="font-size: 22px; font-weight: 700;">84%</span></div>
                    </div>
                </div>
                <div class="card">
                    <span style="font-weight: 600;">Recent topics</span>
                    <div class="lesson-item"><span>Multiplication tables</span><span class="badge">mastered</span></div>
                    <div class="lesson-item"><span>Square roots</span><span class="badge">in progress</span></div>
                    <div class="lesson-item"><span>Fractions</span><span class="badge">start</span></div>
                </div>
            `;
            document.getElementById('quickPractice')?.addEventListener('click', ()=>{
                currentScreen = 'learn';
                setActiveTab('learn');
                renderScreen();
            });
        }

        function renderLearn(container) {
            container.innerHTML = `
                <div class="card">
                    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px;">
                        <span style="background: var(--primary); color: white; padding: 6px 16px; border-radius: 40px;">All</span>
                        <span style="background: var(--card-bg); border:1px solid var(--border-light); padding:6px 16px; border-radius:40px;">Arithmetic</span>
                    </div>
                    <div class="lesson-item"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" style="margin-right:8px;"><path d="M12 2v4"/><path d="M12 22v-4"/><path d="M4 12H2"/><path d="M22 12h-2"/><circle cx="12" cy="12" r="4"/></svg>Fast addition</span> <span>5 min</span></div>
                    <div class="lesson-item"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>Multiplication</span> <span>8 min</span></div>
                    <div class="lesson-item"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>Division</span> <span>6 min</span></div>
                </div>
                <div class="card">
                    <span style="font-weight: 600;">Today's workout</span>
                    <div class="progress-bar-bg" style="margin:16px 0 8px;"><div class="progress-fill" style="width:40%"></div></div>
                    <button class="btn-primary" style="padding:12px;" id="startLesson">Start 7 min lesson →</button>
                </div>
            `;
            document.getElementById('startLesson')?.addEventListener('click', ()=>{ alert('Lesson started! (simulated)'); });
        }

        function renderProgress(container) {
            container.innerHTML = `
                <div class="card">
                    <span style="font-weight: 600;">Weekly activity</span>
                    <div class="chart-row">
                        <div class="chart-bar" style="height:40px"></div><div class="chart-bar" style="height:70px"></div><div class="chart-bar" style="height:55px"></div><div class="chart-bar" style="height:80px"></div><div class="chart-bar" style="height:30px"></div><div class="chart-bar" style="height:95px"></div><div class="chart-bar" style="height:62px"></div>
                    </div>
                </div>
                <div class="stat-grid">
                    <div class="stat-cell"><span style="color: var(--text-muted);">Problems</span><br><span style="font-size: 28px;">847</span></div>
                    <div class="stat-cell"><span style="color: var(--text-muted);">Accuracy</span><br><span style="font-size: 28px;">91%</span></div>
                    <div class="stat-cell"><span style="color: var(--text-muted);">Streak</span><br><span style="font-size: 28px;">12d</span></div>
                    <div class="stat-cell"><span style="color: var(--text-muted);">Level</span><br><span style="font-size: 28px;">7</span></div>
                </div>
                <div class="card">
                    <span>🏅 Achievements</span>
                    <div style="display: flex; gap: 16px; margin-top: 16px;">
                        <span style="background: #FEF9C3; padding: 8px; border-radius: 50%;">⚡</span><span style="background: #DBEAFE; padding: 8px; border-radius: 50%;">🧠</span><span style="background: #DCFCE7; padding: 8px; border-radius: 50%;">🔢</span>
                    </div>
                </div>
            `;
        }

        function renderSettings(container) {
            container.innerHTML = `
                <div class="card">
                    <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 16px;">
                        <svg width="40" height="40" viewBox="0 0 24 24" stroke="var(--primary)"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>
                        <div><span style="font-weight: 600;">Alex Rivera</span><br><span style="color: var(--text-muted);">alex@mathmind.demo</span></div>
                    </div>
                </div>
                <div class="card">
                    <div class="lesson-item" style="cursor:pointer;" id="themeToggle"><span>🌓 Dark theme</span> <span style="color:var(--primary)">${darkMode ? 'ON' : 'OFF'}</span></div>
                    <div class="lesson-item"><span>🔔 Notifications</span> <span style="color:var(--primary)">On</span></div>
                    <div class="lesson-item"><span>⚙️ Sound</span> <span style="color:var(--primary)">Off</span></div>
                </div>
                <div class="card" style="text-align:center;">
                    <span>App version 2.6.0 (2026)</span>
                </div>
            `;
            document.getElementById('themeToggle')?.addEventListener('click', (e)=>{
                toggleTheme();
                renderScreen(); // refresh settings to show toggle text
            });
        }

        // ----- navigation event listeners -----
        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                const tab = item.getAttribute('data-tab');
                if(tab === 'home') currentScreen = 'home';
                else if(tab === 'learn') currentScreen = 'learn';
                else if(tab === 'progress') currentScreen = 'progress';
                else if(tab === 'settings') currentScreen = 'settings';
                renderScreen();
            });
        });

        // profile button opens settings
