<!DOCTYPE html>

    <style>

        /* phone container */
        .phone {

            position: relative;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s;
        }

        /* main app screen (screen content) */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--icon-inactive) var(--card-bg);
            background: var(--bg-primary);
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px 8px 20px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-subtle);
        }
        .header h2 {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-icon {
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            transition: background 0.15s;
        }
        .profile-icon:hover {
            background: var(--card-bg);
        }

        /* bottom nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 12px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-subtle);
            backdrop-filter: blur(4px);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 20px;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            flex: 1;
            max-width: 70px;
        }
        .nav-item span {
            font-size: 11px;

            transform: scale(1.15);
        }
        .nav-item.active svg {

        }
        .nav-item.active span {
            color: var(--primary);
            font-weight: 600;
        }

        /* theme variables */
        :root {
            --primary: #2563EB;

            profile: `<svg width="26" height="26" viewBox="0 0 24 24"><path d="M20 21V19C20 16.7909 18.2091 15 16 15H8C5.79086 15 4 16.7909 4 19V21" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/></svg>`,

        // ---------- RENDER HEADER ----------
        function renderHeader(title) {
            return `
                <div class="header">
                    <h2>${title}</h2>
                    <div class="profile-icon" id="profileBtn">${icons.profile}</div>

            { id: 'progress', label: 'Progress', icon: icons.progress },

        function renderBottomNav(active) {
            return navItems.map(item => `
                <div class="nav-item ${active === item.id ? 'active' : ''}" data-nav="${item.id}">
                    <span class="nav-icon">${item.icon}</span>
                    <span>${item.label}</span>

                content = `

                        <div style="display:flex; flex-direction:column; align-items:center;">
                            <div class="logo-big">${icons.flashcards.replace('currentColor', 'white')}</div>

                            <p style="color:var(--text-secondary); max-width:260px; margin:10px 0;">Daily mental math & logic puzzles. Bite-sized exercises to keep you sharp.</p>

            } else if (screen === 'home') {
                content = `
                    <div class="content">
                        <div class="badge">⚡ 5 day streak</div>
                        <div class="card">
                            <div class="row"><span style="font-weight:600;">Today's goal</span> <span>80%</span></div>
                            <div class="progress-bar"><div class="progress-fill" style="width:80%"></div></div>
                            <div style="display:flex; gap:12px; margin-top:12px;">
                                <div style="flex:1; background:var(--bg-primary); border-radius:20px; padding:12px; text-align:center;">

            } else if (screen === 'learn') {
                content = `

                            <div class="lesson-item">${icons.lesson} <span><b>Algebra</b> basics</span> ${icons.play}</div>

                                <div style="width:28px; height:70px; background:var(--progress-bg); border-radius:30px;"><div style="height:65px; width:100%; background:var(--primary); border-radius:30px;"></div></div>

                                <div style="width:28px; height:70px; background:var(--progress-bg); border-radius:30px;"><div style="height:55px; width:100%; background:var(--primary); border-radius:30px;"></div></div>

        // ---------- update UI ----------
        function updateUI(targetScreen) {
            currentScreen = targetScreen;
            let headerTitle = {
                onboarding: 'Welcome',
                home: 'Dashboard',
                learn: 'Learn',
                progress: 'Progress',
                settings: 'Settings'
            }[targetScreen];

            document.getElementById('headerPlaceholder').innerHTML = renderHeader(headerTitle);
            document.getElementById('screenContent').innerHTML = renderScreen(targetScreen);
            document.getElementById('bottomNav').innerHTML = renderBottomNav(
                targetScreen === 'onboarding' ? 'home' : targetScreen  // onboarding shows home inactive
            );

            // attach nav listeners
            document.querySelectorAll('.nav-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    const navId = el.dataset.nav;
                    if (navId && navId !== currentScreen) {
                        updateUI(navId);
                    }
                });
            });

            // profile click
            const profileBtn = document.getElementById('profileBtn');
            if (profileBtn) profileBtn.addEventListener('click', () => updateUI('settings'));

            // special onboarding listeners
            if (targetScreen === 'onboarding') {
                document.getElementById('getStartedBtn')?.addEventListener('click', () => updateUI('home'));
                document.getElementById('privacyLink')?.addEventListener('click', () => showModal('Privacy Policy', 'We respect your data. No sharing.'));
                document.getElementById('termsLink')?.addEventListener('click', () => showModal('Terms of Service', 'Use Math Brain for personal learning only.'));
            }
            if (targetScreen === 'home') {
                document.getElementById('quickPractice')?.addEventListener('click', () => updateUI('learn'));
            }
            if (targetScreen === 'settings') {
                const toggle = document.getElementById('themeToggle');
                if (toggle) {
                    toggle.checked = darkMode;
                    toggle.addEventListener('change', (e) => {
                        darkMode = e.target.checked;
                        document.documentElement.style.setProperty('color-scheme', darkMode? 'dark':'light');
                        document.getElementById('phoneContainer').className = `phone ${darkMode ? 'dark-mode' : ''}`;
                        updateUI(currentScreen); // refresh settings to keep toggle state
                    });
                }
            }
        }

        // modal for privacy/terms
        function showModal(title, text) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `<div class="modal-card"><h3 style="margin-bottom:12px;">${title}</h3><p>${text}</p><button id="closeModalBtn">Close</button></div>`;
            document.getElementById('phoneContainer').appendChild(modal);
            document.getElementById('closeModalBtn').addEventListener('click', () => modal.remove());
        }

        // ----- screenshot feature (SHIFT+W) -----
        document.addEventListener('keydown', async (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                const canvas = document.getElementById('screenshotCanvas');
                const ctx = canvas.getContext('2d');
                const width = 360, height = 780;
                canvas.width = width; canvas.height = height;
                ctx.fillStyle = darkMode ? '#0F172A' : '#F8FAFC'; // background approximation
                ctx.fillRect(0, 0, width, height);
                // simple html2canvas-like: use dom-to-image fallback? but we inline.
                // better use external lib? but limited. We'll use a simple dataURL workaround – capture only outer style.
                // for demonstration we generate a base "screenshot" with timestamp.
                ctx.font = 'bold 24px Inter';
                ctx.fillStyle = darkMode ? 'white' : 'black';
                ctx.fillText('Math Brain', 60, 360);
                ctx.fillStyle = '#2563EB';
                ctx.fillRect(40, 420, 280, 4);
                const link = document.createElement('a');
                let filename = darkMode ? '6.png' : (screenshotCounter++) + '.png';
                if (darkMode && filename !== '6.png') filename = '6.png'; // dark always 6
                if (!darkMode && screenshotCounter>5) screenshotCounter=1; // keep 1-5
                link.download = filename;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }
        });

        // start with onboarding
        updateUI('onboarding');
        // prefill dark mode off
        document.getElementById('phoneContainer').className = 'phone';
    })();
</script>
</body>
</html>
```
