```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSpark • Learn JavaScript</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        /* CSS variables – light mode (default) */
        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --border: #E2E8F0;
            --progress-bg: #E2E8F0;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            --icon-stroke: #0F172A;
            --header-icon: #0F172A;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --border: #334155;
            --progress-bg: #334155;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
            --icon-stroke: #E2E8F0;
            --header-icon: #E2E8F0;
        }

        body {
            background: #1a1e2b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            position: relative;
            border: 2px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
        }

        .app-screen {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 0 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--border);
            display: flex;
            flex-direction: column;
        }

        /* header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0 16px 0;
            background: var(--bg);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--header-icon);
        }

        /* bottom nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 12px 14px;
            background: var(--card);
            border-top: 1px solid var(--border);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 30px;
            transition: all 0.2s ease;
            gap: 2px;
            color: var(--inactive);
            fill: none;
            stroke: currentColor;
        }

        .nav-item.active {
            background: rgba(37, 99, 235, 0.12);
            color: var(--primary);
            transform: scale(1.05);
        }

        .nav-item.active svg {
            stroke: var(--primary);
            stroke-width: 2.4;
        }

        .nav-item span {
            font-size: 12px;
            font-weight: 500;
        }

        /* cards */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .flex-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 20px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 20px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 6px 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
        }

        button {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px;
            border-radius: 60px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s ease;
            width: 100%;
        }
        button.secondary {
            background: transparent;
            border: 1.5px solid var(--primary);
            color: var(--primary);
        }

        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card);
            padding: 26px;
            border-radius: 36px;
            width: 280px;
            color: var(--text);
            text-align: center;
        }
        .close-btn {
            margin-top: 20px;
            background: var(--primary);
        }

        .icon-grid {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .stat-number {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
        }

        /* small links */
        .small-links {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin: 16px 0 8px;
        }
        .small-links button {
            background: none;
            border: none;
            color: var(--inactive);
            font-size: 13px;
            text-decoration: underline;
            padding: 0;
            width: auto;
        }
        .hidden { display: none; }

        /* chart mimic */
        .chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 80px;
            margin: 15px 0;
        }
        .bar {
            width: 22px;
            background: var(--primary);
            border-radius: 12px 12px 4px 4px;
            height: calc(70% * var(--h));
            transition: height 0.3s;
        }
    </style>
</head>
<body class="">
<div class="phone" id="phoneContainer">
    <!-- dynamic header -->
    <div class="header" id="appHeader">
        <h1 id="screenTitle">Onboarding</h1>
        <button class="profile-btn" id="profileBtn">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
        </button>
    </div>

    <!-- main content (screens injected) -->
    <div class="app-screen" id="screenContainer"></div>

    <!-- bottom navigation (hidden on onboarding) -->
    <div class="bottom-nav" id="bottomNav">
        <button class="nav-item" data-tab="home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Home</span></button>
        <button class="nav-item" data-tab="learn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span>Learn</span></button>
        <button class="nav-item" data-tab="progress"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/></svg><span>Progress</span></button>
        <button class="nav-item" data-tab="settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/><path d="M16.5 6.5 17 8l-1.5.5L17 9l-1.5.5L17 10l-1 .5"/></svg><span>Settings</span></button>
    </div>
</div>

<script>
    (function() {
        // ---------- icon system (inline svg) ----------
        const icons = {
            home: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
            learn: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
            progress: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/></svg>',
            settings: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/><path d="M16.5 6.5 17 8l-1.5.5L17 9l-1.5.5L17 10l-1 .5"/></svg>',
            profile: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
            lesson: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
            chart: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/></svg>',
            flashcards: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
            play: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
            check: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>',
        };

        // ---------- app state ----------
        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
        let lightDark = 'light'; // 'light' or 'dark'
        let screenshotCounter = 1;

        const screenContainer = document.getElementById('screenContainer');
        const bottomNav = document.getElementById('bottomNav');
        const headerTitle = document.getElementById('screenTitle');
        const profileBtn = document.getElementById('profileBtn');
        const phone = document.getElementById('phoneContainer');

        // ---------- helper: render active screen ----------
        function renderScreen(screen) {
            if (screen === 'onboarding') {
                bottomNav.classList.add('hidden');
                headerTitle.innerText = 'Welcome';
                screenContainer.innerHTML = `
                    <div class="card" style="text-align: center; margin-top: 20px;">
                        <div style="background: #2563EB20; width: 80px; height: 80px; border-radius: 30px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2"><path d="M12 2a10 10 0 0 1 10 10c0 5-4 8-10 8-6 0-10-3-10-8 0-5 4-10 10-10z"/><path d="M8 13h8"/><path d="M8 9h8"/></svg>
                        </div>
                        <h2 style="font-size: 32px; margin-bottom: 8px;">CodeSpark</h2>
                        <p style="font-size: 18px; color: var(--primary); font-weight: 500;">JavaScript drills</p>
                        <p style="margin: 20px 0 12px; color: var(--text-light);">Bite-sized coding puzzles. Master JS one concept at a time.</p>
                        <button id="getStartedBtn">Get Started</button>
                        <div class="small-links">
                            <button id="privacyModalBtn">Privacy Policy</button>
                            <button id="termsModalBtn">Terms of Service</button>
                        </div>
                    </div>
                `;
                document.getElementById('getStartedBtn').addEventListener('click', ()=>{
                    currentScreen = 'home';
                    renderScreen('home');
                });
                document.getElementById('privacyModalBtn').addEventListener('click', ()=> showModal('Privacy Policy','We respect your data. No sharing.'));
                document.getElementById('termsModalBtn').addEventListener('click', ()=> showModal('Terms of Service','Educational use only.'));
            } 
            else if (screen === 'home') {
                bottomNav.classList.remove('hidden');
                headerTitle.innerText = 'Home';
                setActiveTab('home');
                screenContainer.innerHTML = `
                    <div class="card">
                        <div class="flex-row"><span class="badge">🔥 streak 7 days</span>${icons.flashcards}</div>
                        <h3 style="margin: 12px 0 6px;">Continue where you left</h3>
                        <p>Closures · 3 min left</p>
                        <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
                        <button class="secondary" id="resumeLesson">Resume</button>
                    </div>
                    <div class="card">
                        <div class="flex-row" style="justify-content: space-between;"><span>⭐ Daily challenge</span>${icons.play}</div>
                        <p style="margin: 8px 0">Fix the async bug – 50 XP</p>
                        <button id="startChallenge">Start</button>
                    </div>
                    <div class="card">
                        <h4>Recommended for you</h4>
                        <div class="flex-row"><span>• Array methods</span><span>🔥</span></div>
                        <div class="flex-row"><span>• Promises</span><span>⭐</span></div>
                    </div>
                `;
                document.getElementById('resumeLesson')?.addEventListener('click', ()=>{ currentScreen='learn'; renderScreen('learn'); });
                document.getElementById('startChallenge')?.addEventListener('click', ()=>{ currentScreen='learn'; renderScreen('learn'); });
            }
            else if (screen === 'learn') {
                headerTitle.innerText = 'Learn';
                setActiveTab('learn');
                screenContainer.innerHTML = `
                    <div class="card">
                        <div class="flex-row"><span>📘 JavaScript fundamentals</span>${icons.lesson}</div>
                        <div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div>
                        <p>8 / 18 completed</p>
                    </div>
                    <div class="card">
                        <div class="flex-row" style="justify-content: space-between;"><span>⚡ Scope & Closures</span><span>5 min</span></div>
                        <div class="flex-row" style="justify-content: space-between; margin-top: 8px;"><span>⏱️ Async JS</span><span>12 min</span></div>
                        <div class="flex-row" style="justify-content: space-between;"><span>🧩 Classes</span><span>8 min</span></div>
                        <button style="margin-top:16px;" id="practiceBtn">Practice active lesson</button>
                    </div>
                `;
                document.getElementById('practiceBtn')?.addEventListener('click', ()=> showModal('Practice','Write code → "Hello"'));
            }
            else if (screen === 'progress') {
                headerTitle.innerText = 'Progress';
                setActiveTab('progress');
                screenContainer.innerHTML = `
                    <div class="card">
                        <div style="display: flex; gap: 12px; align-items: center;">
                            <span class="stat-number">2,450</span> <span>XP total</span>
                        </div>
                        <div class="chart" id="chartBars">
                            <div class="bar" style="--h:0.9"></div><div class="bar" style="--h:0.6"></div><div class="bar" style="--h:1"></div><div class="bar" style="--h:0.7"></div><div class="bar" style="--h:0.4"></div>
                        </div>
                        <div style="display: flex; justify-content: space-between;"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span></div>
                    </div>
                    <div class="card"><span>🔥 21 day streak · 3 badges</span></div>
                `;
            }
            else if (screen === 'settings') {
                headerTitle.innerText = 'Settings';
                setActiveTab('settings');
                screenContainer.innerHTML = `
                    <div class="card">
                        <div style="display: flex; align-items: center; justify-content: space-between;">
                            <span>🌙 Dark mode</span>
                            <button id="themeToggleBtn" style="width: auto; padding: 8px 18px;">${lightDark==='light'?'Switch to dark':'Switch to light'}</button>
                        </div>
                    </div>
                    <div class="card">
                        <p>Profile: Alex Dev</p>
                        <p>Email: alex@example.com</p>
                        <button class="secondary" id="showProfileFromSettings">View full profile</button>
                    </div>
                `;
                document.getElementById('themeToggleBtn')?.addEventListener('click', toggleTheme);
                document.getElementById('showProfileFromSettings')?.addEventListener('click', ()=> showModal('Profile','Coder · joined 2025'));
            }
        }

        function setActiveTab(tab) {
            document.querySelectorAll('.nav-item').forEach(el => {
                const txt = el.querySelector('span')?.innerText.toLowerCase() || '';
                if (txt === tab) el.classList.add('active');
                else el.classList.remove('active');
            });
        }

        function showModal(title, msg) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `<div class="modal-content"><h3>${title}</h3><p style="margin:20px 0;">${msg}</p><button class="close-btn">Close</button></div>`;
            document.body.appendChild(modal);
            modal.querySelector('.close-btn').addEventListener('click', ()=>modal.remove());
        }

        function toggleTheme() {
            lightDark = lightDark === 'light' ? 'dark' : 'light';
            document.body.classList.toggle('dark', lightDark === 'dark');
            if (currentScreen === 'settings') renderScreen('settings');
        }

        // bottom nav listeners
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const tab = btn.querySelector('span')?.innerText.toLowerCase() || '';
                if (tab === 'home' || tab === 'learn' || tab === 'progress' || tab === 'settings') {
                    currentScreen = tab;
                    renderScreen(tab);
                }
            });
        });

        profileBtn.addEventListener('click', ()=>{
            currentScreen = 'settings';
            renderScreen('settings');
        });

        // screenshot feature shift+W
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
                    html2canvas(phone, { scale: 2 }).then(canvas => {
                        const link = document.createElement('a');
                        let filename = (lightDark === 'dark' ? '6' : screenshotCounter) + '.png';
                        if (lightDark !== 'dark' && screenshotCounter <=5) {
                            if (screenshotCounter===1 && currentScreen!=='onboarding') screenshotCounter=2; // rough but okay
                            filename = screenshotCounter + '.png';
                            screenshotCounter = (screenshotCounter % 5) + 1;
                        } else if (lightDark === 'dark') {
                            filename = '6.png';
                        }
                        link.download = filename;
                        link.href = canvas.toDataURL();
                        link.click();
                    });
                });
            }
        });

        // initial render
        renderScreen('onboarding');

        // final JSON (output after all)
        window.jsonOutput = {
            "1.png": "Start Learning",
            "2.png": "Daily Lessons",
            "3.png": "Practice Skills",
            "4.png": "Track Progress",
            "5.png": "Smart Settings",
            "6.png": "Dark Theme"
        };
    })();
</script>
</body>
</html>
All done!
