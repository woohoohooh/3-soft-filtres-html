<script>
  (function() {
    // ---------- THEME ----------
    let currentTheme = 'light';
    const container = document.getElementById('phoneContainer');

    // ---------- SVG Icons (inline, all outline 2px) ----------
    const icons = {
      home: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M5 12H3L12 3L21 12H19M5 12V20H19V12M5 12H9M19 12H15M9 20V14H15V20"/></svg>`,

      settings: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z M19.4 15C18.9 16 18.1 16.7 17.2 17.2L19 20.6L16 21L15.2 18.2C14.3 18.5 13.3 18.6 12.3 18.6C11.3 18.6 10.3 18.5 9.4 18.2L8.6 21L5.6 20.6L7.4 17.2C6.5 16.7 5.7 16 5.2 15L2 14.5L3 11.5L2 8.5L5.2 8C5.7 7 6.5 6.3 7.4 5.8L5.6 2.4L8.6 2L9.4 4.8C10.3 4.5 11.3 4.4 12.3 4.4C13.3 4.4 14.3 4.5 15.2 4.8L16 2L19 2.4L17.2 5.8C18.1 6.3 18.9 7 19.4 8L22 8.5L21 11.5L22 14.5L19.4 15Z"/></svg>`,
      profile: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M20 21V19C20 17.9 19.1 16.7 18 16.3M4 21V19C4 16.8 6.2 14 9 14M16 7C16 9.2 14.2 11 12 11C9.8 11 8 9.2 8 7C8 4.8 9.8 3 12 3C14.2 3 16 4.8 16 7Z"/><circle cx="12" cy="7" r="4"/><path d="M12 14C9.33 14 7 16 7 19H17C17 16 14.67 14 12 14Z"/></svg>`,
      lesson: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M4 4H20V20H4V4Z M8 8H16M8 12H14M8 16H12"/></svg>`,
      chart: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 16V20H3V4H7V16H21Z M7 12L11 8L15 12L19 8"/></svg>`,
      flashcards: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M18 4H6V20H18V4Z M9 8H15M9 12H13M9 16H11"/></svg>`,
      play: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M5 3L19 12L5 21V3Z"/></svg>`,
      check: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M20 6L9 17L4 12"/></svg>`
    };

    // ----- app data: english vocabulary builder (chosen) -----
    const appName = 'LingoRise';
    const tagline = 'Expand your vocabulary, daily.';
    const description = 'Master 3000+ words with smart flashcards and real-life sentences.';

    // ----- screens HTML -----
    const screens = {
      onboarding: `
        <div class="header"><h2>Welcome</h2><button class="profile-btn" data-gotosettings>${icons.profile}</button></div>
        <div class="content-flex" style="justify-content: center; text-align: center;">
          <div style="margin: 20px 0;">
            <div style="background: #E2E8F0; width: 80px; height: 80px; border-radius: 24px; margin: 0 auto; display: flex; align-items: center; justify-content: center; background: var(--primary);">${icons.flashcards.replace('icon-svg', 'icon-svg' )}</div>
            <h1 style="font-size: 42px; font-weight: 700; margin: 10px 0 4px;">${appName}</h1>
            <p style="font-size: 18px; color: var(--primary);">${tagline}</p>
            <p style="margin: 24px 0; color: var(--text-secondary);">${description}</p>
            <button class="btn-primary" id="getStartedBtn">Get Started →</button>
            <div class="link-group"><button id="privacyBtn">Privacy</button><button id="termsBtn">Terms</button></div>
          </div>
        </div>
      `,
      home: `
        <div class="header"><h2>Home</h2><button class="profile-btn" data-gotosettings>${icons.profile}</button></div>
        <div class="content">
          <div class="card row"><span>🔥 Daily streak: 12 days</span><span class="badge">+35 XP</span></div>
          <div class="card"><div style="font-weight:600;">Continue lesson</div><div>Phrasal verbs</div><div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div><button class="btn-primary" style="padding:10px;font-size:16px; margin-top:12px;" id="quickLearn">Continue</button></div>
          <div class="card"><div style="display:flex; gap:12px;">${icons.lesson} <span>Recommended: “Business English”</span></div></div>
          <div class="card"><div style="display:flex; gap:8px;">${icons.flashcards} <span>5 words to review</span></div></div>
      </div>`,
      learn: `
        <div class="header"><h2>Learn</h2><button class="profile-btn" data-gotosettings>${icons.profile}</button></div>
        <div class="content">
          <div class="card"><div style="font-weight:bold;">Today's words</div><div>1. ubiquitous</div><div>2. meticulous</div><div class="progress-bar" style="margin:10px 0"><div class="progress-fill" style="width:30%"></div></div><button class="btn-primary" style="padding:12px;">Start practice</button></div>
          <div class="card row"><span>📘 Idioms masterclass</span>${icons.play}</div>
          <div class="card row"><span>🔠 200 most frequent</span>${icons.play}</div>
      </div>`,
      progress: `
        <div class="header"><h2>Progress</h2><button class="profile-btn" data-gotosettings>${icons.profile}</button></div>
        <div class="content">
          <div class="card"><div>Words learned: 147 / 500</div><div class="progress-bar"><div class="progress-fill" style="width:29%"></div></div></div>
          <div class="card"><div>Accuracy this week</div><div class="chart-simple"><div class="bar" style="height:40px"></div><div class="bar" style="height:60px"></div><div class="bar" style="height:30px"></div><div class="bar" style="height:70px"></div><div class="bar" style="height:50px"></div></div></div>
          <div class="card">⭐ Achievements: 8 badges</div>
      </div>`,
      settings: `
        <div class="header"><h2>Settings</h2><button class="profile-btn" data-gotosettings>${icons.profile}</button></div>
        <div class="content">
          <div class="card row"><span>🌙 Dark mode</span><button id="themeToggleBtn" style="background:var(--primary); border:none; color:white; padding:8px 20px; border-radius:40px;">toggle</button></div>
          <div class="card">Profile: Alex L.</div>
          <div class="card">Notifications</div>
          <div class="card">Privacy & Terms</div>
      </div>`
    };

    let activePage = 'onboarding';

    function renderScreen() {
      const screenDiv = document.getElementById('appScreen');
      screenDiv.innerHTML = screens[activePage];

      // re-attach navigation events
      document.querySelectorAll('[data-gotosettings]').forEach(btn => {
        btn.addEventListener('click', () => { setActivePage('settings'); });
      });

      if (activePage === 'onboarding') {
        document.getElementById('getStartedBtn').addEventListener('click', ()=>{
          setActivePage('home');
        });
        document.getElementById('privacyBtn').addEventListener('click', ()=> showModal('Privacy policy', 'We respect your data.'));
        document.getElementById('termsBtn').addEventListener('click', ()=> showModal('Terms of service', 'Use wisely.'));
      }
      if (activePage === 'home') {
        document.getElementById('quickLearn')?.addEventListener('click', ()=>{ setActivePage('learn'); });
      }
      if (activePage === 'settings') {
        document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);
      }

      // bottom nav rebuild
      renderBottomNav();
    }

    function renderBottomNav() {
      const navHTML = `
        <div class="bottom-nav">
          <button class="nav-item ${activePage==='home'?'active':''}" data-page="home"><span class="icon-svg">${icons.home}</span><span>Home</span></button>
          <button class="nav-item ${activePage==='learn'?'active':''}" data-page="learn"><span class="icon-svg">${icons.learn}</span><span>Learn</span></button>
          <button class="nav-item ${activePage==='progress'?'active':''}" data-page="progress"><span class="icon-svg">${icons.progress}</span><span>Progress</span></button>
          <button class="nav-item ${activePage==='settings'?'active':''}" data-page="settings"><span class="icon-svg">${icons.settings}</span><span>Settings</span></button>
        </div>
      `;
      // if bottom nav already exists replace, else append
      let bottom = document.querySelector('.bottom-nav');
      if (bottom) bottom.remove();
      const screenDiv = document.getElementById('appScreen');
      screenDiv.insertAdjacentHTML('beforeend', navHTML);

      document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', (e) => {
          const page = item.dataset.page;
          if (page) setActivePage(page);
        });
      });
    }

    function setActivePage(page) {
      activePage = page;
      renderScreen();
    }

    // modal helper
    function showModal(title, msg) {
      const modalOverlay = document.createElement('div');
      modalOverlay.className = 'modal-overlay';
      modalOverlay.innerHTML = `<div class="modal"><h3>${title}</h3><p>${msg}</p><button class="btn-primary" style="margin-top:16px;" id="closeModal">Close</button></div>`;
      document.body.appendChild(modalOverlay);
      document.getElementById('closeModal').addEventListener('click', ()=> modalOverlay.remove());
      modalOverlay.addEventListener('click', (e)=>{ if(e.target===modalOverlay) modalOverlay.remove(); });
    }

    // theme
    function toggleTheme() {
      if (currentTheme === 'light') {
        container.classList.remove('light');
        container.classList.add('dark');
        currentTheme = 'dark';
      } else {
        container.classList.remove('dark');
        container.classList.add('light');
        currentTheme = 'light';
      }
    }

    // screenshot hotkey (shift+W)
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const phone = document.querySelector('.phone');
        html2canvas(phone, { scale: 2 }).then(canvas => {
          const link = document.createElement('a');
          const themeSuffix = currentTheme === 'dark' ? '6' : (screenshotCounter % 5) + 1;
          link.download = `${themeSuffix}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
          screenshotCounter = (screenshotCounter + 1) % 5;
        }).catch(() => alert('html2canvas not loaded — simulate screenshot.'));
      }
    });

    // polyfill / note: we didn't include html2canvas to keep single file. just mock.
    window.html2canvas = function(el) { 
      return new Promise(res => { 
        let canvas = document.createElement('canvas');
        canvas.width=360; canvas.height=780;
        res(canvas); 
      }); 
    };

    let screenshotCounter = 0;
    // initial render
    renderScreen();
  })();
</script>
</body>
