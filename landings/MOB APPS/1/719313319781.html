<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeLingua · vocabulary builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --border: #E2E8F0;
            --shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,20,50,0.03);
            --header-height: 60px;
            --bottom-nav-height: 72px;
            --icon-stroke: 2px;
            --icon-linecap: round;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --border: #334155;
            --shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        body {
            background: #111827;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }

        /* phone container */
        #phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 48px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 10px #2d2d2d;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
        }

        /* main app screen (header + content + bottom nav) */
        #app-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        /* header */
        .header {
            height: var(--header-height);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: var(--card);
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            transition: background 0.15s;
        }
        .profile-btn:hover { background: var(--border); }

        /* main content (screen container) */
        #screen-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) transparent;
        }

        /* bottom navigation */
        .bottom-nav {
            height: var(--bottom-nav-height);
            background: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            padding: 4px 0 8px;
            flex-shrink: 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 24px;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            color: var(--inactive);
            fill: none;
            stroke: var(--inactive);
            stroke-width: var(--icon-stroke);
            stroke-linecap: var(--icon-linecap);
            stroke-linejoin: round;
        }

        .nav-item.active {
            color: var(--primary);
            stroke: var(--primary);
            background: rgba(37, 99, 235, 0.08);
            transform: scale(1.05);
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            transition: transform 0.15s;
        }
        .nav-item.active svg {
            transform: scale(1.1);
        }

        .nav-label {
            font-size: 11px;
            font-weight: 500;
        }

        /* buttons & cards */
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 40px;
            padding: 16px 20px;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 8px 16px -6px var(--primary-dark);
            transition: 0.1s;
        }
        .btn-primary:active { opacity: 0.8; transform: scale(0.98); }

        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: var(--card);
            padding: 28px 24px;
            border-radius: 32px;
            width: 280px;
            color: var(--text);
            text-align: center;
            box-shadow: 0 30px 50px black;
        }
        .modal-card h3 { margin-bottom: 12px; }
        .modal-card p { margin-bottom: 24px; color: var(--text-light); }
        .modal-card button {
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px 30px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        /* utility */
        .small-link { font-size: 13px; color: var(--inactive); text-decoration: underline; cursor: pointer; margin: 0 8px; }

        /* dashboard cards */
        .card {
            background: var(--card);
            border-radius: 28px;
            padding: 20px 18px;
            margin-bottom: 18px;
            box-shadow: var(--shadow);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .row-space { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 4px 12px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
        }
        .progress-bar {
            background: var(--border);
            height: 12px;
            border-radius: 40px;
            margin: 12px 0;
            width: 100%;
            overflow: hidden;
        }
        .progress-fill {
            background: var(--primary);
            height: 100%;
            width: 0%;
            border-radius: 40px;
            transition: width 0.3s;
        }

        .icon-row svg { width: 32px; height: 32px; stroke: var(--primary); margin-right: 8px; }
        .flex-icon { display: flex; align-items: center; gap: 12px; }
        .chart-placeholder {
            background: var(--bg);
            height: 80px;
            border-radius: 20px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 8px;
        }
        .bar {
            background: var(--primary);
            width: 20%;
            height: calc(30% + 10px);
            border-radius: 12px 12px 4px 4px;
        }

        /* hide class */
        .hidden { display: none !important; }
    </style>
</head>

<script>
    (function() {
        // ------ theme state -----
        let darkMode = false;
        const themeToggle = () => {
            darkMode = !darkMode;
            if (darkMode) document.body.classList.add('dark');
            else document.body.classList.remove('dark');
            renderCurrentScreen(); // refresh UI
        };

        // ------ icon system -----
        function iconProfile() { return `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`; }

        // ------ screens data -----
        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings

        // modals
        let modalContent = null;

        // ------ render function -----
        const contentDiv = document.getElementById('screen-content');
        const headerTitle = document.getElementById('header-title');
        const navItems = document.querySelectorAll('.nav-item');

        function setActiveTab(tabId) {
            navItems.forEach(item => {
                const tab = item.dataset.tab;
                if (tab === tabId) item.classList.add('active');
                else item.classList.remove('active');
            });
        }

        function showModal(title, text) {
            modalContent = { title, text };
            renderCurrentScreen();
        }
        function closeModal() {
            modalContent = null;
            renderCurrentScreen();
        }

        // ------ onboarding screen (with policy modals) -----
        function renderOnboarding() {
            headerTitle.innerText = 'Welcome';
            setActiveTab('none');
            let html = `
                <div class="card" style="text-align: center; margin-top: 20px;">
                    <div style="background: var(--primary); width: 70px; height: 70px; border-radius: 24px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;">
                        <svg width="44" height="44" viewBox="0 0 24 24" stroke="white" stroke-width="1.8" fill="none"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                    </div>
                    <h2 style="font-size: 28px; margin-bottom: 8px;">LinguaFlash</h2>
                    <p style="color: var(--primary); font-weight: 600;">English vocabulary builder</p>
                    <p style="margin: 24px 0; color: var(--text-light);">Master 3000+ words with daily 5-min workouts. Smart spaced repetition.</p>
                    <button class="btn-primary" id="getStartedBtn">Get Started →</button>
                    <div style="margin: 30px 0 20px;">
                        <span class="small-link" id="privacyLink">Privacy Policy</span> · 
                        <span class="small-link" id="termsLink">Terms of Service</span>
                    </div>
                </div>
            `;
            contentDiv.innerHTML = html;
            document.getElementById('getStartedBtn').addEventListener('click', ()=>{
                currentScreen = 'home';
                renderCurrentScreen();
            });
            document.getElementById('privacyLink').addEventListener('click', ()=> showModal('Privacy Policy', 'We respect your data. No selling. Standard stuff.'));
            document.getElementById('termsLink').addEventListener('click', ()=> showModal('Terms of Service', 'Use app wisely. Don\'t break laws.'));
        }

        // Home dashboard
        function renderHome() {
            headerTitle.innerText = 'Home';
            setActiveTab('home');
            let html = `
                <div class="card">
                    <div class="row-space"><span class="badge">🔥 7 day streak</span><span>⚡ 240 XP</span></div>
                    <h3>Continue lesson</h3>
                    <div class="flex-icon"><svg width="28" height="28" viewBox="0 0 24 24" stroke="var(--primary)"><path d="M12 2v4M12 22v-4M4 12H2M8 12H6M18 12h-2M22 12h-2M19.07 4.93l-2.83 2.83M6.9 17.1l-2.82 2.82M17.1 6.9l2.82-2.82M4.93 19.07l2.83-2.83"/></svg><span>Phrasal verbs • 5 min</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div>
                    <button class="btn-primary" style="padding:12px;" id="resumeLearn">Resume</button>
                </div>
                <div class="card">
                    <div class="row-space"><h4>Daily goal</h4><span>15/20 min</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div>
                    <div style="display:flex; gap:10px; margin-top:16px;">
                        <span style="background: var(--accent); padding:6px 16px; border-radius: 40px; color:black;">🎯 3 lessons left</span>
                    </div>
                </div>
                <div class="card" style="display:flex; gap:8px; flex-wrap:wrap;">
                    <span style="background:var(--border); border-radius:40px; padding:8px 16px;">📗 idioms</span>
                    <span style="background:var(--border); border-radius:40px; padding:8px 16px;">✍️ writing</span>
                    <span style="background:var(--border); border-radius:40px; padding:8px 16px;">🔊 listening</span>
                </div>
            `;
            contentDiv.innerHTML = html;
            document.getElementById('resumeLearn')?.addEventListener('click', ()=>{
                currentScreen = 'learn';
                renderCurrentScreen();
            });
        }

        // Learn / practice
        function renderLearn() {
            headerTitle.innerText = 'Learn';
            setActiveTab('learn');
            let html = `
                <div class="card" style="background: var(--primary); color:white;">
                    <h3>Daily practice</h3>
                    <p style="opacity:0.9;">5 new words · synonyms</p>
                    <button class="btn-primary" style="background:white; color: var(--primary); margin-top:12px;" id="startPractice">Start practice →</button>
                </div>
                <div class="card">
                    <h4>Lessons</h4>
                    <div class="flex-icon"><svg width="24" height="24" stroke="var(--primary)"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> Business English</div>
                    <div class="flex-icon"><svg width="24" height="24" stroke="var(--primary)"><path d="M4 4h16v16H4z"/><path d="M9 9h6v6H9z"/></svg> Travel vocabulary</div>
                    <div class="flex-icon"><svg width="24" height="24" stroke="var(--primary)"><path d="M21 11.5v1a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2h1.5"/><path d="M3 3l18 18"/></svg> Slang & idioms</div>
                </div>
                <div class="card"><span class="badge">🎧 listening lab</span> <span class="badge">📖 story</span></div>
            `;
            contentDiv.innerHTML = html;
            document.getElementById('startPractice')?.addEventListener('click', ()=> alert('Practice started! (simulated)'));
        }

        // Progress
        function renderProgress() {
            headerTitle.innerText = 'Progress';
            setActiveTab('progress');
            let html = `
                <div class="card">
                    <h3>This week</h3>
                    <div class="chart-placeholder">
                        <div class="bar" style="height:36px;"></div><div class="bar" style="height:52px;"></div><div class="bar" style="height:24px;"></div><div class="bar" style="height:68px;"></div><div class="bar" style="height:44px;"></div>
                    </div>
                </div>
                <div class="card">
                    <div class="row-space"><span>Mastered words</span><span>342</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:34%"></div></div>
                    <div class="row-space"><span>Quizzes passed</span><span>18</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:72%"></div></div>
                </div>
                <div class="card">
                    <span class="badge">🏅 word master</span> <span class="badge">⚡ 5 day streak</span>
                </div>
            `;
            contentDiv.innerHTML = html;
        }

        // Settings / profile (with theme toggle)
        function renderSettings() {
            headerTitle.innerText = 'Settings';
            setActiveTab('settings');
            let html = `
                <div class="card">
                    <div class="flex-icon"><svg width="24" height="24" stroke="currentColor"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg> Theme</div>
                    <button class="btn-primary" style="padding:12px; margin-top:12px;" id="themeToggleBtn">Switch to Dark mode</button>
                </div>
                <div class="card">
                    <p><strong>Profile</strong> · name@example.com</p>
                    <p>Member since Feb 2026</p>
                </div>
                <div class="card">App version 2.6.1 · build 2026</div>
            `;
            contentDiv.innerHTML = html;
            document.getElementById('themeToggleBtn').addEventListener('click', (e)=>{
                themeToggle();
                e.target.innerText = darkMode ? 'Switch to Light mode' : 'Switch to Dark mode';
                renderCurrentScreen(); // refresh to update colors
            });
        }

        function renderCurrentScreen() {
            if (modalContent) {
                // show modal overlay, keep current screen bg
                let modalHtml = `<div class="modal" id="modalOverlay"><div class="modal-card"><h3>${modalContent.title}</h3><p>${modalContent.text}</p><button id="closeModalBtn">OK</button></div></div>`;
                // first render base screen
                if (currentScreen === 'onboarding') renderOnboarding();
                else if (currentScreen === 'home') renderHome();
                else if (currentScreen === 'learn') renderLearn();
                else if (currentScreen === 'progress') renderProgress();
                else if (currentScreen === 'settings') renderSettings();
                // append modal
                contentDiv.insertAdjacentHTML('beforeend', modalHtml);
                document.getElementById('closeModalBtn').addEventListener('click', ()=>{
                    modalContent = null;
                    renderCurrentScreen();
                });
                document.getElementById('modalOverlay')?.addEventListener('click', (e)=>{
                    if (e.target.id === 'modalOverlay') closeModal();
                });
            } else {
                if (currentScreen === 'onboarding') renderOnboarding();
                else if (currentScreen === 'home') renderHome();
                else if (currentScreen === 'learn') renderLearn();
                else if (currentScreen === 'progress') renderProgress();
                else if (currentScreen === 'settings') renderSettings();
            }
        }

        // bottom navigation listeners
        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                const tab = e.currentTarget.dataset.tab;
                if (tab === 'home') currentScreen = 'home';
                else if (tab === 'learn') currentScreen = 'learn';
                else if (tab === 'progress') currentScreen = 'progress';
                else if (tab === 'settings') currentScreen = 'settings';
                renderCurrentScreen();
            });
        });

        // profile button -> settings
        document.getElementById('profileBtn').addEventListener('click', ()=>{
            currentScreen = 'settings';
            renderCurrentScreen();
        });

        // screenshot logic (SHIFT+W)
        document.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                captureScreenshot();
            }
        });

        let screenshotCounter = 0;
        function captureScreenshot() {
            const phone = document.getElementById('phone');
            const canvas = document.getElementById('screenshotCanvas');
            const ctx = canvas.getContext('2d');
            // simple html2canvas style – use dom-to-image like? Since no libs, we use a trick: draw background.
            // For demonstration: simulate by filling with colors and text.
            // Real screenshot would need external lib, but we fake filenames.
            const isDark = document.body.classList.contains('dark');
            const baseName = isDark ? '6.png' : (screenshotCounter < 5 ? (screenshotCounter+1)+'.png' : '1.png');
            if (!isDark) screenshotCounter = (screenshotCounter % 5) + 1;
            alert(`📸 Screenshot saved as ${baseName} (simulated)`);
        }

        // initial render
        renderCurrentScreen();

        // expose for theme updates etc
        window.showModal = showModal;
    })();
</script>
