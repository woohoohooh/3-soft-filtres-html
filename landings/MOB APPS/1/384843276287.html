        /* phone container */
        .phone {
            width: 360px;

            overflow: hidden;

            display: none;
            flex-direction: column;

            display: flex;
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic header + content injected via js -->
    <div id="appContent" class="app-screen"></div>

</div>

<script>
    (function() {
        // ----- THEME TOGGLE (light/dark) -----
        let darkMode = false;
        const htmlEl = document.documentElement;

        // ----- CUSTOM SVG ICONS (all inline, 2px stroke, rounded) -----
        const icons = {
            home: `<svg viewBox="0 0 24 24"><path d="M5 12H3L12 3L21 12H19" stroke="currentColor" fill="none"/><path d="M5 12V20H19V12" stroke="currentColor" fill="none"/><rect x="9" y="15" width="6" height="5" stroke="currentColor" fill="none"/></svg>`,
            learn: `<svg viewBox="0 0 24 24"><path d="M2 3H8C9.1 3 10 3.9 10 5V21L6 18L2 21V5C2 3.9 2.9 3 4 3Z" stroke="currentColor" fill="none"/><path d="M22 3H16C14.9 3 14 3.9 14 5V21L18 18L22 21V5C22 3.9 21.1 3 20 3Z" stroke="currentColor" fill="none"/></svg>`,
            progress: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><path d="M12 7V12L15 15" stroke="currentColor" fill="none"/><circle cx="12" cy="12" r="2" stroke="currentColor" fill="none"/></svg>`,
            settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor" fill="none"/><path d="M19.4 15L20.8 12L19.4 9H16.7L14.9 6.5L12 5.5L9.1 6.5L7.3 9H4.6L3.2 12L4.6 15H7.3L9.1 17.5L12 18.5L14.9 17.5L16.7 15H19.4Z" stroke="currentColor" fill="none"/></svg>`,
            profile: `<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" stroke="currentColor" fill="none"/><path d="M5 20V18C5 14.7 7.7 12 11 12H13C16.3 12 19 14.7 19 18V20" stroke="currentColor" fill="none"/></svg>`,
            lesson: `<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" fill="none"/><path d="M8 10H16" stroke="currentColor"/><path d="M8 14H13" stroke="currentColor"/></svg>`,
            chart: `<svg viewBox="0 0 24 24"><path d="M21 21H3V3" stroke="currentColor" fill="none"/><path d="M7 15L10 10L13 13L18 7" stroke="currentColor" fill="none"/></svg>`,
            flashcards: `<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" fill="none"/><path d="M9 8H15" stroke="currentColor"/><path d="M9 12H13" stroke="currentColor"/></svg>`,
            play: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><polygon points="10,8 16,12 10,16" stroke="currentColor" fill="none"/></svg>`,
            check: `<svg viewBox="0 0 24 24"><path d="M20 6L9 17L4 12" stroke="currentColor" fill="none"/></svg>`
        };

        // ----- APP STATE -----
        let currentScreen = 'onboarding'; // screens: onboarding, home, learn, progress, settings
        let modal = { show: false, type: '' };

        // ----- RENDER FUNCTION (updates entire appContent) -----
        function render() {
            const container = document.getElementById('appContent');
            const nav = document.getElementById('bottomNav');
            if (!container || !nav) return;

            // Build header based on active screen (title left, profile right)
            const screenTitles = {
                onboarding: 'Welcome', home: 'Home', learn: 'Brain training', progress: 'Your stats', settings: 'Settings'
            };
            const title = screenTitles[currentScreen] || 'Math trainer';

            // Header HTML (profile icon always clickable)
            const headerHtml = `
                <div class="header">
                    <h2>${title}</h2>
                    <div class="profile-icon" id="profileBtn">${icons.profile}</div>
                </div>
            `;

            // ---- SCREENS content (each screen as div with class screen + active class) ----
            const onboardingHtml = `
                <div class="screen ${currentScreen === 'onboarding' ? 'active' : ''}" id="screen-onboarding">
                    <div class="card" style="text-align: center; padding: 32px 20px;">
                        <div style="margin-bottom: 16px;">${icons.flashcards.replace('currentColor', 'var(--primary)')}</div>
                        <h1 style="font-size: 42px; font-weight: 700; color: var(--primary);">Math</h1>
                        <p style="font-size: 24px; font-weight: 500; margin-bottom: 8px;">brain trainer</p>
                        <p style="color: var(--text-secondary); margin: 12px 0;">Quick daily workouts to sharpen your mental math. Become faster than a calculator!</p>
                        <button class="btn" id="getStartedBtn" style="margin: 24px 0 12px;">Get Started</button>
                        <div style="display: flex; gap: 20px; justify-content: center;">
                            <span class="small-link" id="privacyLink">Privacy Policy</span>
                            <span class="small-link" id="termsLink">Terms of Service</span>
                        </div>
                    </div>
                </div>
            `;

            const homeHtml = `
                <div class="screen ${currentScreen === 'home' ? 'active' : ''}" id="screen-home">
                    <div class="card flex-row justify-between">
                        <div><span class="badge">🔥 streak 12</span></div>
                        <div><span>⚡ 340 XP</span></div>
                    </div>
                    <div class="card">
                        <div class="flex-row justify-between"><span style="font-weight: 600;">Today's goal</span><span>65%</span></div>
                        <div class="progress-bar-bg mt-2"><div class="progress-fill" style="width:65%"></div></div>
                        <div class="flex-row gap-4" style="margin-top: 20px;">
                            <div>${icons.play.replace('currentColor', 'var(--primary)')}</div>
                            <div><strong>Quick match</strong><br>5+5 · 3 left</div>
                        </div>
                    </div>
                    <div class="card">
                        <h3>Recommended</h3>
                        <div class="flex-row justify-between mt-2">
                            <span>🧮 Mental multiplication</span> <span>8 min</span>
                        </div>
                        <div class="progress-bar-bg mt-1"><div class="progress-fill" style="width:30%"></div></div>
                    </div>
                </div>
            `;

            const learnHtml = `
                <div class="screen ${currentScreen === 'learn' ? 'active' : ''}" id="screen-learn">
                    <div class="card flex-row gap-4">
                        ${icons.lesson.replace('currentColor', 'var(--primary)')}
                        <div><strong>Lesson 1: Addition</strong><br>2 rounds left</div>
                    </div>
                    <div class="card flex-row gap-4">
                        ${icons.flashcards.replace('currentColor', 'var(--primary)')}
                        <div><strong>Lesson 2: Subtraction</strong><br>new</div>
                    </div>
                    <div class="card flex-row gap-4">
                        ${icons.play.replace('currentColor', 'var(--primary)')}
                        <div><strong>Daily challenge</strong><br>10 problems · 4⭐</div>
                    </div>
                    <div class="card" style="text-align: center;">
                        <button class="btn" id="practiceBtn" style="padding: 12px;">START PRACTICE</button>
                    </div>
                </div>
            `;

            const progressHtml = `
                <div class="screen ${currentScreen === 'progress' ? 'active' : ''}" id="screen-progress">
                    <div class="card">
                        <div class="flex-row justify-between"><span>Weekly activity</span>${icons.chart.replace('currentColor', 'var(--primary)')}</div>
                        <div style="height: 80px; display: flex; align-items: end; gap: 8px; margin: 10px 0;">
                            <div style="background: var(--primary); width: 20%; height: 40px; border-radius: 12px;"></div>
                            <div style="background: var(--primary); width: 20%; height: 70px; border-radius: 12px;"></div>
                            <div style="background: var(--primary); width: 20%; height: 55px; border-radius: 12px;"></div>
                            <div style="background: var(--primary); width: 20%; height: 80px; border-radius: 12px;"></div>
                            <div style="background: var(--primary); width: 20%; height: 30px; border-radius: 12px;"></div>
                        </div>
                    </div>
                    <div class="card flex-row justify-between">
                        <span>Total problems</span> <strong>1,240</strong>
                    </div>
                    <div class="card"><span>🏅 accuracy 92%</span></div>
                </div>
            `;

            const settingsHtml = `
                <div class="screen ${currentScreen === 'settings' ? 'active' : ''}" id="screen-settings">
                    <div class="card flex-row justify-between">
                        <span>Dark mode</span>
                        <label class="switch"><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''} style="transform: scale(1.2);"></label>
                    </div>
                    <div class="card flex-row">${icons.profile.replace('currentColor', 'var(--primary)')} <span>Profile: Alex M.</span></div>
                    <div class="card flex-row">🔔 Notifications</div>
                </div>
            `;

            // combine screens (only active visible via CSS)
            container.innerHTML = headerHtml + onboardingHtml + homeHtml + learnHtml + progressHtml + settingsHtml;

            // ----- bottom navigation (4 items) -----
            const navItems = [
                { id: 'home', icon: icons.home, label: 'Home' },
                { id: 'learn', icon: icons.learn, label: 'Learn' },
                { id: 'progress', icon: icons.progress, label: 'Progress' },
                { id: 'settings', icon: icons.settings, label: 'Settings' }
            ];
            nav.innerHTML = navItems.map(item => `
                <div class="nav-item ${currentScreen === item.id ? 'active' : ''}" data-screen="${item.id}">
                    ${item.icon}
                    <span>${item.label}</span>
                </div>
            `).join('');

            // attach bottom nav listeners
            document.querySelectorAll('.nav-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    const screen = el.dataset.screen;
                    if (screen) { currentScreen = screen; render(); }
                });
            });

            // Profile icon click -> open settings
            const profileBtn = document.getElementById('profileBtn');
            if (profileBtn) profileBtn.addEventListener('click', () => {
                currentScreen = 'settings';
                render();
            });

            // Get started
            const getStarted = document.getElementById('getStartedBtn');
            if (getStarted) getStarted.addEventListener('click', () => {
                currentScreen = 'home';
                render();
            });

            // practice button inside learn
            const practiceBtn = document.getElementById('practiceBtn');
            if (practiceBtn) practiceBtn.addEventListener('click', () => {
                alert('Starting a quick training! (simulated)');
            });

            // Privacy & Terms modals
            const privacy = document.getElementById('privacyLink');
            const terms = document.getElementById('termsLink');
            if (privacy) privacy.addEventListener('click', () => showModal('Privacy Policy: We value your data. (mock)'));
            if (terms) terms.addEventListener('click', () => showModal('Terms of Service: Use responsibly.'));

            // Dark mode toggle inside settings
            const toggleDark = document.getElementById('darkToggle');
            if (toggleDark) {
                toggleDark.addEventListener('change', (e) => {
                    darkMode = e.target.checked;
                    if (darkMode) htmlEl.classList.add('dark');
                    else htmlEl.classList.remove('dark');
                    render(); // re-render to keep icon states (no loss)
                });
            }

            // if modal flag active, show modal (after render)
            if (modal.show) {
                const modalDiv = document.createElement('div');
                modalDiv.className = 'modal';
                modalDiv.id = 'activeModal';
                modalDiv.innerHTML = `
                    <div class="modal-content">
                        <p>${modal.type}</p>
                        <button class="close-btn" id="closeModalBtn">Close</button>
                    </div>
                `;
                container.appendChild(modalDiv);
                document.getElementById('closeModalBtn')?.addEventListener('click', () => {
                    modal.show = false;
                    render();
                });
            }
        }

        function showModal(text) {
            modal = { show: true, type: text };
            render();
        }

        // ----- screenshot hotkey SHIFT+W -----
        document.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                if (!phone) return;

                // we need to capture as png (dom-to-image like) but here we simulate by generating a dummy screenshot message
                // sequential naming based on current dark mode
                import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
                    html2canvas(phone, { scale: 2 }).then(canvas => {
                        const link = document.createElement('a');
                        const darkSuffix = darkMode ? '6' : Math.min(window._shotCounter || 0, 5) + 1;
                        if (!darkMode) {
                            window._shotCounter = (window._shotCounter || 0) + 1;
                            if (window._shotCounter > 5) window._shotCounter = 1;
                        }
                        const filename = darkMode ? '6.png' : (window._shotCounter + '.png');
                        link.download = filename;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    });
                }).catch(() => alert('html2canvas not loaded, but screenshot simulated.'));
            }
        });

        // initial render
        render();

        // expose for screenshot naming
        window._shotCounter = 0;
    })();
</script>
