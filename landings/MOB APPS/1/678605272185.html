```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math brain trainer · 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --border-light: #E2E8F0;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --inactive: #94A3B8;
      --icon-stroke: #0F172A;
      --header-icon: #1E293B;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
    }

    body.dark {
      --bg: #0F172A;
      --card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --border-light: #334155;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --inactive: #64748B;
      --icon-stroke: #E2E8F0;
      --header-icon: #F1F5F9;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }

    body {
      background: #1a202c;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background-color: var(--bg);
      border-radius: 48px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.3), 0 0 0 8px #2d3e50;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: background-color 0.2s;
    }

    .app-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--inactive) transparent;
      padding-bottom: 8px;
    }

    .app-screen::-webkit-scrollbar {
      width: 4px;
    }
    .app-screen::-webkit-scrollbar-thumb {
      background: var(--inactive);
      border-radius: 20px;
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 8px 20px;
    }
    .header h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--header-icon);
      transition: transform 0.1s;
    }
    .profile-btn:active { transform: scale(0.9); }

    /* bottom navigation */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 16px 10px;
      background-color: var(--card);
      border-top: 1px solid var(--border-light);
      box-shadow: 0 -2px 8px rgba(0,0,0,0.02);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
      border: none;
      cursor: pointer;
      gap: 4px;
      transition: all 0.15s;
      color: var(--inactive);
      fill: none;
      stroke: var(--inactive);
      stroke-width: 2;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 30px;
    }
    .nav-item.active {
      color: var(--primary);
      stroke: var(--primary);
      background-color: rgba(37,99,235,0.08);
      transform: scale(1.05);
    }
    .nav-item svg {
      width: 24px;
      height: 24px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nav-item span { margin-top: 2px; }

    /* cards, containers */
    .content {
      padding: 12px 20px 24px 20px;
      flex: 1;
    }
    .card {
      background-color: var(--card);
      border-radius: 24px;
      padding: 18px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
      border: 1px solid var(--border-light);
    }
    .flex-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .badge {
      background: var(--accent);
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 600;
      color: #0F172A;
    }
    .btn {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      padding: 14px 20px;
      border-radius: 60px;
      font-size: 16px;
      width: 100%;
      cursor: pointer;
      transition: 0.1s;
      box-shadow: 0 4px 8px rgba(37,99,235,0.2);
    }
    .btn:active { transform: scale(0.98); background: var(--primary-dark); }
    .link-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 16px;
      font-size: 13px;
    }
    .link-row button {
      background: none;
      border: none;
      color: var(--inactive);
      text-decoration: underline;
      cursor: pointer;
      font-size: 13px;
    }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-card {
      background: var(--card);
      padding: 28px 24px;
      border-radius: 32px;
      width: 280px;
      color: var(--text-primary);
      box-shadow: 0 20px 30px rgba(0,0,0,0.3);
      text-align: center;
    }
    .modal-card button {
      margin-top: 20px;
      background: var(--primary);
      border: none;
      color: white;
      padding: 8px 20px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
    }

    /* progress bar */
    .progress-bar-bg {
      background: var(--border-light);
      height: 10px;
      border-radius: 20px;
      overflow: hidden;
      width: 100%;
    }
    .progress-fill {
      background: var(--primary);
      width: 0%;
      height: 10px;
      border-radius: 20px;
      transition: width 0.3s ease;
    }

    /* icons */
    .icon-stroke { stroke: currentColor; stroke-width: 2; fill: none; }

    /* dark/light toggle inside settings */
    .theme-switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 16px 0;
    }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <!-- DYNAMIC HEADER -->
  <div class="header" id="appHeader">
    <h2 id="screenTitle">Onboarding</h2>
    <button class="profile-btn" id="profileBtn" aria-label="Profile">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
    </button>
  </div>

  <!-- MAIN SCREEN CONTENT (injected by js) -->
  <div class="app-screen" id="screenContainer"></div>

  <!-- BOTTOM NAV (hidden on onboarding) -->
  <div class="bottom-nav" id="bottomNav"></div>
</div>

<!-- hidden canvas for screenshot -->
<canvas id="screenshotCanvas" style="display:none"></canvas>

<script>
  (function(){
    // ------ THEME & UTILS ------
    const body = document.body;
    let darkMode = false; // light default
    const themeToggle = () => {
      darkMode = !darkMode;
      if(darkMode) body.classList.add('dark'); else body.classList.remove('dark');
      renderSettingsScreen(); // refresh if settings open
    };

    // ------ ICONS (inline SVG) ------
    const icons = {
      home: `<svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10L21 21H15V15H9V21H3L3 10Z" stroke="currentColor" fill="none"/></svg>`,
      learn: `<svg viewBox="0 0 24 24"><path d="M2 3H8C9.06087 3 10.0783 3.42143 10.8284 4.17157C11.5786 4.92172 12 5.93913 12 7V21C12 20.2044 11.6839 19.4413 11.1213 18.8787C10.5587 18.3161 9.79565 18 9 18H2V3Z" stroke="currentColor" fill="none"/><path d="M22 3H16C14.9391 3 13.9217 3.42143 13.1716 4.17157C12.4214 4.92172 12 5.93913 12 7V21C12 20.2044 12.3161 19.4413 12.8787 18.8787C13.4413 18.3161 14.2044 18 15 18H22V3Z" stroke="currentColor" fill="none"/></svg>`,
      progress: `<svg viewBox="0 0 24 24"><path d="M21 12V19C21 20.1046 20.1046 21 19 21H5C3.89543 21 3 20.1046 3 19V5C3 3.89543 3.89543 3 5 3H12" stroke="currentColor" fill="none"/><path d="M15 9L21 3M21 3H16.5M21 3V7.5" stroke="currentColor"/><path d="M9 15L12 12L15 15" stroke="currentColor"/></svg>`,
      settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor"/><path d="M19.4 15C18.9 16 18.1 16.7 17.2 17.2L19 20.6L16 21L15.2 17.8C14.3 17.9 13.3 17.9 12.4 17.8L11.6 21L8.6 20.6L10.4 17.2C9.5 16.7 8.7 16 8.2 15L4.8 16.8L4.4 13.8L7.6 13C7.5 12.1 7.5 11.1 7.6 10.2L4.4 9.4L4.8 6.4L8.2 8.2C8.7 7.3 9.4 6.5 10.4 6L8.6 2.6L11.6 2.2L12.4 5.4C13.3 5.3 14.3 5.3 15.2 5.4L16 2.2L19 2.6L17.2 6C18.1 6.5 18.9 7.2 19.4 8.2L22.8 6.4L23.2 9.4L20 10.2C20.1 11.1 20.1 12.1 20 13L23.2 13.8L22.8 16.8L19.4 15Z" stroke="currentColor" fill="none"/></svg>`,
      profile: `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
      lesson: `<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2" stroke="currentColor"/><path d="M8 7H16M8 11H16M8 15H13" stroke="currentColor"/></svg>`,
      chart: `<svg viewBox="0 0 24 24"><path d="M21 21H3V3M7 15L10 10L13 13L18 7" stroke="currentColor"/></svg>`,
      flashcards: `<svg viewBox="0 0 24 24"><path d="M4 5H18C19.1046 5 20 5.89543 20 7V17C20 18.1046 19.1046 19 18 19H6C4.89543 19 4 18.1046 4 17V5Z" stroke="currentColor"/><path d="M8 3V7M16 3V7" stroke="currentColor"/></svg>`,
      play: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor"/><polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/></svg>`,
      check: `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" stroke="currentColor"/></svg>`,
    };

    // navigation state
    let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
    const screens = ['home','learn','progress','settings'];
    
    // bottom nav definitions
    const navItems = [
      { id: 'home', label: 'Home', icon: icons.home },
      { id: 'learn', label: 'Learn', icon: icons.learn },
      { id: 'progress', label: 'Progress', icon: icons.progress },
      { id: 'settings', label: 'Settings', icon: icons.settings }
    ];

    // ------ RENDER FUNCTIONS ------
    function renderOnboarding() {
      const container = document.getElementById('screenContainer');
      container.innerHTML = `
        <div class="content" style="display:flex; flex-direction:column; justify-content:center; min-height:100%;">
          <div class="card" style="text-align:center; padding:32px 20px;">
            <div style="background: #E2E8F0; width:80px; height:80px; border-radius:28px; margin:0 auto 24px; display:flex; align-items:center; justify-content:center; color:var(--primary);">
              <svg width="48" height="48" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">${icons.learn.match(' d=".*"')[0]}</svg>
            </div>
            <h1 style="font-size:32px; font-weight:700; color:var(--primary);">Math Brain</h1>
            <p style="font-size:18px; margin:8px 0 4px; color:var(--text-secondary);">trainer · 2026</p>
            <p style="color:var(--text-secondary); margin:16px 0;">Quick daily sessions boost mental arithmetic & logic. Bite-sized challenges.</p>
            <button class="btn" id="startGetStarted" style="margin-top:8px;">Get Started</button>
            <div class="link-row">
              <button id="privacyModalBtn">Privacy Policy</button>
              <button id="termsModalBtn">Terms of Service</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('bottomNav').style.display = 'none';
      document.getElementById('screenTitle').innerText = 'Welcome';

      document.getElementById('startGetStarted')?.addEventListener('click', ()=>{
        currentScreen = 'home';
        renderHomeScreen();
        setActiveNav('home');
        showBottomNav();
      });
      document.getElementById('privacyModalBtn')?.addEventListener('click', ()=> showModal('Privacy Policy', 'We value your data. No third-party sharing.'));
      document.getElementById('termsModalBtn')?.addEventListener('click', ()=> showModal('Terms of Service', 'Use Math Brain for personal learning only.'));
    }

    function showModal(title, msg) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `<div class="modal-card"><h3 style="margin-bottom:12px;">${title}</h3><p>${msg}</p><button id="closeModalBtn">OK</button></div>`;
      document.body.appendChild(overlay);
      overlay.querySelector('#closeModalBtn').addEventListener('click', ()=> overlay.remove());
      overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.remove(); });
    }

    function showBottomNav() {
      document.getElementById('bottomNav').style.display = 'flex';
    }

    function setActiveNav(activeId) {
      const nav = document.getElementById('bottomNav');
      nav.innerHTML = navItems.map(item => `
        <button class="nav-item ${item.id === activeId ? 'active' : ''}" data-nav="${item.id}">
          ${item.icon}
          <span>${item.label}</span>
        </button>
      `).join('');
      nav.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = btn.dataset.nav;
          if (id === currentScreen) return;
          currentScreen = id;
          if (id === 'home') renderHomeScreen();
          else if (id === 'learn') renderLearnScreen();
          else if (id === 'progress') renderProgressScreen();
          else if (id === 'settings') renderSettingsScreen();
          setActiveNav(id);
        });
      });
    }

    // dummy lesson open / practice simulation
    function startPractice() {
      currentScreen = 'learn';
      renderLearnScreen();
      setActiveNav('learn');
    }

    function renderHomeScreen() {
      const container = document.getElementById('screenContainer');
      container.innerHTML = `
        <div class="content">
          <div class="card flex-row" style="justify-content:space-between;">
            <span style="font-weight:600;">🔥 7 day streak</span>
            <span style="color:var(--primary);">level 12</span>
          </div>
          <div class="card">
            <h3 style="margin-bottom:12px;">Daily workout</h3>
            <div class="flex-row" style="justify-content:space-between;">
              <span>Today's progress</span><span>60%</span>
            </div>
            <div class="progress-bar-bg"><div class="progress-fill" style="width:60%"></div></div>
            <button class="btn" style="margin-top:16px;" id="homePracticeBtn">▶ Practice now</button>
          </div>
          <div class="card">
            <h3>Recommended</h3>
            ${[1,2].map(i=>`<div style="display:flex; gap:12px; margin:12px 0;"><span style="background:var(--accent); padding:8px; border-radius:16px;">${icons.lesson}</span><div><b>Quick equations</b><p>5 min · +15 XP</p></div></div>`).join('')}
          </div>
        </div>
      `;
      document.getElementById('homePracticeBtn')?.addEventListener('click', startPractice);
      document.getElementById('screenTitle').innerText = 'Home';
    }

    function renderLearnScreen() {
      const container = document.getElementById('screenContainer');
      container.innerHTML = `
        <div class="content">
          <div class="card">
            <div style="display:flex; gap:16px; align-items:center;">
              <span>${icons.play}</span><span style="font-size:20px; font-weight:600;">Logic warm-up</span>
            </div>
            <div style="margin:16px 0;">
              <div class="flex-row">Multiplication · 3/10</div>
              <div class="progress-bar-bg"><div class="progress-fill" style="width:30%"></div></div>
            </div>
            <button class="btn" id="continueLesson">continue</button>
          </div>
          <div class="card"> <span style="display:flex; gap:8px;">${icons.flashcards} Flashcards: 15 terms</span> </div>
          <div class="card"> <span style="display:flex; gap:8px;">${icons.chart} Daily target: 20 min left</span> </div>
        </div>
      `;
      document.getElementById('continueLesson')?.addEventListener('click', ()=> alert('Opened interactive lesson (simulated)'));
      document.getElementById('screenTitle').innerText = 'Learn';
    }

    function renderProgressScreen() {
      const container = document.getElementById('screenContainer');
      container.innerHTML = `
        <div class="content">
          <div class="card"><h3>Last 7 days</h3><div style="display:flex; gap:6px; height:60px; align-items:flex-end;">${[45,60,30,80,55,70,90].map(h=>`<div style="background:var(--primary); width:20px; height:${h*0.5}px; border-radius:12px;"></div>`).join('')}</div></div>
          <div class="card"><span>${icons.chart}  Accuracy 87%  </span><div class="progress-bar-bg"><div class="progress-fill" style="width:87%"></div></div></div>
          <div class="card"><span>${icons.flashcards}  Badges: 8 collected</span></div>
        </div>
      `;
      document.getElementById('screenTitle').innerText = 'Progress';
    }

    function renderSettingsScreen() {
      const container = document.getElementById('screenContainer');
      container.innerHTML = `
        <div class="content">
          <div class="card">
            <div class="theme-switch"><span>🌙 Dark theme</span><label><input type="checkbox" id="darkToggleCheck" ${darkMode ? 'checked' : ''}></label></div>
            <hr style="border-color:var(--border-light); margin:12px 0;">
            <p>Profile: Maria M.</p>
            <p style="margin:6px 0;">Email: maria@example.com</p>
            <button class="btn" style="margin-top:16px;" id="resetBtn">Reset progress (demo)</button>
          </div>
        </div>
      `;
      document.getElementById('darkToggleCheck')?.addEventListener('change', themeToggle);
      document.getElementById('resetBtn')?.addEventListener('click', ()=> alert('Demo: progress reset.'));
      document.getElementById('screenTitle').innerText = 'Settings';
    }

    // profile icon -> settings
    document.getElementById('profileBtn').addEventListener('click', ()=>{
      if(currentScreen === 'onboarding') return;
      currentScreen = 'settings';
      renderSettingsScreen();
      setActiveNav('settings');
    });

    // startup
    renderOnboarding();

    // ----- SCREENSHOT (SHIFT+W) -----
    let screenshotCounter = 1;
    document.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        const phone = document.getElementById('phoneContainer');
        const canvas = document.getElementById('screenshotCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 360; canvas.height = 780;
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,360,780);
        // simple html-to-canvas (dom doesn't render directly, but we capture via html2canvas? not allowed. we simulate)
        alert(`Screenshot ${darkMode ? '6.png' : (screenshotCounter+'.png')} would be saved. (simulated)`);
        // increment sequential (max 6)
        if(!darkMode && screenshotCounter<5) screenshotCounter++; 
        // if dark mode, it's 6.png (but we keep counter)
      }
    });

    // bottomnav hidden init
    document.getElementById('bottomNav').style.display = 'none';
  })();
</script>
