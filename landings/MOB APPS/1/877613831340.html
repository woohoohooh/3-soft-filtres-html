```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashLearn · prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            /* light mode (default) */
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive-icon: #94A3B8;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            --nav-bg: #FFFFFF;
            --header-bg: #F8FAFC;
            --progress-bg: #E2E8F0;
            --badge-bg: #DBEAFE;
            --badge-text: #1E40AF;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive-icon: #64748B;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
            --nav-bg: #1E293B;
            --header-bg: #0F172A;
            --progress-bg: #334155;
            --badge-bg: #1E3A8A;
            --badge-text: #BFDBFE;
        }

        body {
            background: #1a1e2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0,0,0,0.6);
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* main app screen */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: none;
            background: var(--bg);
            transition: background 0.2s;
        }
        .app-screen::-webkit-scrollbar { display: none; }

        /* header */
        .header {
            padding: 16px 18px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-light);
        }
        .header h2 {
            font-size: 22px;
            font-weight: 650;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            transition: opacity 0.1s;
        }
        .profile-btn svg {
            width: 26px;
            height: 26px;
            stroke: var(--text-primary);
            stroke-width: 2;
        }

        /* main content */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 18px 16px 10px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 12px;
            background: var(--nav-bg);
            border-top: 1px solid var(--border-light);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            gap: 4px;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            color: var(--inactive-icon);
            fill: none;
            padding: 6px 0 4px;
            border-radius: 30px;
        }
        .nav-item.active {
            color: var(--primary);
            transform: scale(1.05);
            background: rgba(37, 99, 235, 0.1);
        }
        .nav-item svg {
            width: 26px;
            height: 26px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.1s;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            color: currentColor;
        }

        /* cards */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 20px 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }
        .flex-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .badge {
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
        }
        .progress-bar {
            height: 10px;
            background: var(--progress-bg);
            border-radius: 20px;
            overflow: hidden;
            margin: 12px 0;
        }
        .progress-fill {
            height: 100%;
            width: 65%;
            background: var(--primary);
            border-radius: 20px;
            transition: width 0.4s ease;
        }
        .lesson-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-light);
            padding: 14px 0;
        }
        .lesson-item:last-child { border-bottom: none; }
        .icon-sm svg {
            width: 32px;
            height: 32px;
            stroke: var(--primary);
            stroke-width: 2;
        }

        /* modal overlay */
        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }
        .modal.hidden { display: none; }
        .modal-content {
            background: var(--card);
            padding: 28px 24px;
            border-radius: 32px;
            width: 280px;
            text-align: center;
            color: var(--text-primary);
            border: 1px solid var(--border-light);
        }
        .modal-content button {
            margin-top: 20px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
        }

        /* screenshot capture helper */
        canvas { display: none; }

        /* svg icons definition placeholder */
        .hidden-defs { display: none; }
    </style>
</head>
<body class="">
    <div class="phone" id="phoneContainer">
        <!-- hidden SVG sprites – defined via JS later, but we also inline icons per use -->
        <div class="app-screen" id="appScreen">
            <!-- header will be rewritten by js, but we keep static container -->
            <div class="header" id="mainHeader"></div>
            <!-- content injected -->
            <div class="content" id="screenContent"></div>
            <!-- bottom nav -->
            <div class="bottom-nav" id="bottomNav"></div>
        </div>
    </div>

    <!-- modals (privacy & terms) hidden by default -->
    <div id="privacyModal" class="modal hidden">
        <div class="modal-content">
            <h3 style="margin-bottom: 10px;">Privacy Policy</h3>
            <p style="font-size: 14px;">We respect your data. No tracking, no sharing. Everything stays local.</p>
            <button id="closePrivacy">Got it</button>
        </div>
    </div>
    <div id="termsModal" class="modal hidden">
        <div class="modal-content">
            <h3 style="margin-bottom: 10px;">Terms of Service</h3>
            <p style="font-size: 14px;">Use FlashLearn for personal growth. Be kind, keep learning.</p>
            <button id="closeTerms">Accept</button>
        </div>
    </div>

    <script>
        (function() {
            // ------ THEME & STATE ------
            let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
            let darkMode = false;

            // ------ ICON FACTORY (inline svg strings) ------
            function iconHome(active = false) { return `<svg viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 Z" stroke="currentColor" fill="none"/></svg>`; }
            function iconLearn(active = false) { return `<svg viewBox="0 0 24 24"><path d="M2 6 L12 2 L22 6 L12 10 L2 6 Z M2 6 L2 16 L12 20 L22 16 L22 6" stroke="currentColor" fill="none"/><path d="M8 9 L8 14 L12 16 L16 14 L16 9" stroke="currentColor" fill="none"/></svg>`; }
            function iconProgress(active = false) { return `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><path d="M12 3 L12 12 L17 15" stroke="currentColor" fill="none"/></svg>`; }
            function iconSettings(active = false) { return `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor" fill="none"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z M16.5 6.5 L19 9 M5 9 L7.5 6.5" stroke="currentColor" fill="none"/></svg>`; }
            function iconProfile() { return `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" fill="none"/><circle cx="12" cy="7" r="4" stroke="currentColor" fill="none"/></svg>`; }
            function iconLesson() { return `<svg viewBox="0 0 24 24"><path d="M12 2 L2 7 L12 12 L22 7 L12 2 Z M2 17 L12 22 L22 17 M2 12 L12 17 L22 12" stroke="currentColor" fill="none"/></svg>`; }
            function iconChart() { return `<svg viewBox="0 0 24 24"><path d="M3 17 L9 11 L13 15 L21 7" stroke="currentColor" fill="none"/><path d="M3 21 L21 21" stroke="currentColor"/><path d="M3 3 L3 21" stroke="currentColor"/></svg>`; }
            function iconFlashcards() { return `<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" fill="none"/><path d="M9 7 L15 7 M9 11 L15 11 M9 15 L13 15" stroke="currentColor"/></svg>`; }
            function iconPlay() { return `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none"/></svg>`; }
            function iconCheck() { return `<svg viewBox="0 0 24 24"><path d="M20 6 L9 17 L4 12" stroke="currentColor" fill="none"/></svg>`; }

            // ------ UI RENDER ------
            function renderScreen() {
                const headerEl = document.getElementById('mainHeader');
                const contentEl = document.getElementById('screenContent');
                const navEl = document.getElementById('bottomNav');

                // header (dynamic title)
                const titles = {
                    onboarding: 'Welcome', home: 'Home', learn: 'Learning', progress: 'Progress', settings: 'Settings'
                };
                headerEl.innerHTML = `
                    <h2>${titles[currentScreen]}</h2>
                    <button class="profile-btn" id="profileBtnHeader">${iconProfile()}</button>
                `;

                // bottom nav (always same, highlight active)
                const navItems = [
                    { id: 'home', label: 'Home', icon: iconHome },
                    { id: 'learn', label: 'Learn', icon: iconLearn },
                    { id: 'progress', label: 'Progress', icon: iconProgress },
                    { id: 'settings', label: 'Settings', icon: iconSettings }
                ];
                navEl.innerHTML = '';
                navItems.forEach(item => {
                    const btn = document.createElement('button');
                    btn.className = `nav-item ${currentScreen === item.id ? 'active' : ''}`;
                    btn.setAttribute('data-nav', item.id);
                    btn.innerHTML = `${item.icon(currentScreen === item.id)}<span>${item.label}</span>`;
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        if (item.id === 'home') currentScreen = 'home';
                        else if (item.id === 'learn') currentScreen = 'learn';
                        else if (item.id === 'progress') currentScreen = 'progress';
                        else if (item.id === 'settings') currentScreen = 'settings';
                        renderScreen();
                    });
                    navEl.appendChild(btn);
                });

                // screen content
                contentEl.innerHTML = getScreenContent(currentScreen);

                // re-attach profile click
                document.getElementById('profileBtnHeader')?.addEventListener('click', () => {
                    currentScreen = 'settings';
                    renderScreen();
                });

                // onboarding specific: get started + policy modals
                if (currentScreen === 'onboarding') {
                    document.getElementById('getStartedBtn')?.addEventListener('click', () => {
                        currentScreen = 'home';
                        renderScreen();
                    });
                    document.getElementById('privacyLink')?.addEventListener('click', (e) => {
                        e.preventDefault();
                        document.getElementById('privacyModal').classList.remove('hidden');
                    });
                    document.getElementById('termsLink')?.addEventListener('click', (e) => {
                        e.preventDefault();
                        document.getElementById('termsModal').classList.remove('hidden');
                    });
                }
                // theme toggle in settings
                if (currentScreen === 'settings') {
                    const toggle = document.getElementById('themeToggle');
                    if (toggle) {
                        toggle.checked = darkMode;
                        toggle.addEventListener('change', (e) => {
                            darkMode = e.target.checked;
                            if (darkMode) document.body.classList.add('dark');
                            else document.body.classList.remove('dark');
                            renderScreen(); // refresh to show themed cards
                        });
                    }
                }
            }

            function getScreenContent(screen) {
                switch(screen) {
                    case 'onboarding':
                        return `
                            <div class="card" style="text-align: center; margin-top: 30px;">
                                <div style="font-size: 56px; margin-bottom: 10px;">🧠</div>
                                <h2 style="font-size: 40px; font-weight: 700; color: var(--primary);">FlashLearn</h2>
                                <p style="font-size: 18px; color: var(--text-secondary); margin: 8px 0;">master anything, daily</p>
                                <p style="margin: 20px 0 10px; color: var(--text-primary);">Flashcards & brain training that stick. 5 min a day.</p>
                                <button id="getStartedBtn" style="background: var(--primary); border: none; color: white; font-weight: 600; width: 100%; padding: 16px; border-radius: 60px; font-size: 18px; margin: 20px 0;">Get Started</button>
                                <div style="display: flex; gap: 24px; justify-content: center; margin: 12px 0 8px;">
                                    <a href="#" id="privacyLink" style="color: var(--primary); text-decoration: none;">Privacy</a>
                                    <a href="#" id="termsLink" style="color: var(--primary); text-decoration: none;">Terms</a>
                                </div>
                            </div>
                        `;
                    case 'home':
                        return `
                            <div class="card">
                                <div class="flex-row" style="justify-content: space-between;"><span class="badge">🔥 5 day streak</span>${iconFlashcards()}</div>
                                <h3 style="margin: 20px 0 8px; font-size: 22px;">Continue where you left</h3>
                                <div class="lesson-item"><span>🧩 Logic puzzles</span> <span>75%</span></div>
                                <div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div>
                                <button style="background:var(--primary); border:none; color:white; padding:14px; border-radius:40px; width:100%; font-weight:600;">${iconPlay()}  Resume practice</button>
                            </div>
                            <div class="card">
                                <div style="display:flex; gap:12px; align-items:center;">${iconChart()}<span style="font-weight:600;">Today's goals</span></div>
                                <div class="lesson-item"><span>📘 3 new flashcards</span> ${iconCheck()}</div>
                                <div class="lesson-item"><span>🧮 1 brain warmup</span> ${iconCheck()}</div>
                            </div>
                        `;
                    case 'learn':
                        return `
                            <div class="card">
                                <h3 style="margin-bottom: 16px;">Recommended lessons</h3>
                                <div class="lesson-item"><span>🔤 Vocabulary builder</span> ${iconPlay()}</div>
                                <div class="lesson-item"><span>🧠 Memory palace</span> ${iconPlay()}</div>
                                <div class="lesson-item"><span>🌍 Geography facts</span> ${iconPlay()}</div>
                                <div class="badge" style="margin-top: 12px;">➕ 4 more packs</div>
                            </div>
                            <div class="card">
                                <div class="flex-row">${iconLesson()} <span>Daily flashcard set: 15 cards</span></div>
                                <div class="progress-bar" style="margin:16px 0"><div class="progress-fill" style="width:30%"></div></div>
                                <button style="background:var(--primary); border:none; color:white; padding:14px; border-radius:40px; width:100%;">Start learning</button>
                            </div>
                        `;
                    case 'progress':
                        return `
                            <div class="card">
                                <h3>📊 Your stats</h3>
                                <div style="display:flex; gap:20px; margin:16px 0;">
                                    <div><span style="font-size:32px;">87</span><br>lessons</div>
                                    <div><span style="font-size:32px;">12</span><br>hours</div>
                                    <div><span style="font-size:32px;">4</span><br>badges</div>
                                </div>
                            </div>
                            <div class="card">
                                <div style="display:flex; justify-content:space-between;">Weekly activity ${iconChart()}</div>
                                <div style="height:60px; display:flex; align-items:end; gap:8px; margin:16px 0;">
                                    <div style="background:var(--primary); width:20%; height:30px; border-radius:12px;"></div>
                                    <div style="background:var(--primary); width:20%; height:50px; border-radius:12px;"></div>
                                    <div style="background:var(--primary); width:20%; height:20px; border-radius:12px;"></div>
                                    <div style="background:var(--primary); width:20%; height:70px; border-radius:12px;"></div>
                                    <div style="background:var(--primary); width:20%; height:40px; border-radius:12px;"></div>
                                </div>
                            </div>
                        `;
                    case 'settings':
                        return `
                            <div class="card">
                                <div style="display:flex; align-items:center; gap:20px;">${iconProfile()} <span>Profile: Alex</span></div>
                                <hr style="border-color: var(--border-light); margin:20px 0;">
                                <div style="display:flex; justify-content:space-between;">
                                    <span>🌙 Dark mode</span>
                                    <label class="switch"><input type="checkbox" id="themeToggle"><span class="slider"></span></label>
                                </div>
                                <p style="margin-top: 24px;">⚡️ daily reminder · sound · download</p>
                            </div>
                            <div class="card" style="text-align:center;">
                                ${iconSettings()} <span>version 1.0 · 2026</span>
                            </div>
                        `;
                    default: return '';
                }
            }

            // modal close buttons
            document.getElementById('closePrivacy').addEventListener('click', () => {
                document.getElementById('privacyModal').classList.add('hidden');
            });
            document.getElementById('closeTerms').addEventListener('click', () => {
                document.getElementById('termsModal').classList.add('hidden');
            });

            // ------ screenshot (SHIFT+W) ------
            let screenshotCounter = 0;
            window.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    const phone = document.getElementById('phoneContainer');
                    html2canvas?.(phone, { scale: 2, backgroundColor: null }).then(canvas => {
                        const link = document.createElement('a');
                        let filename = (darkMode ? '6.png' : (++screenshotCounter + '.png'));
                        if (darkMode) filename = '6.png';
                        else if (screenshotCounter > 5) screenshotCounter = 1; 
                        link.download = filename;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    }).catch(() => alert('html2canvas not loaded — but this is a prototype'));
                }
            });

            // inject html2canvas (CDN fallback)
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
            script.onload = () => console.log('screenshot ready');
            document.head.appendChild(script);

            // initial render
            renderScreen();

            // style for toggle
            const style = document.createElement('style');
            style.innerHTML = `
                .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
                .switch input { opacity:0; width:0; height:0; }
                .slider { position: absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background-color: #ccc; border-radius: 24px; transition: .2s; }
                .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .2s; }
                input:checked + .slider { background-color: var(--primary); }
                input:checked + .slider:before { transform: translateX(22px); }
            `;
            document.head.appendChild(style);
        })();
    </script>
</body>
</html>
All done!
