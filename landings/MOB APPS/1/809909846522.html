<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #1b2b3f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }
        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --border: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --nav-highlight: rgba(37, 99, 235, 0.08);
            --progress-bg: #E2E8F0;
            --shadow: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,0,0,0.05);
        }
        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --border: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --inactive: #64748B;
            --nav-highlight: rgba(59, 130, 246, 0.15);
            --progress-bg: #334155;
            --shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.4), 0 0 0 10px #3a4a5e;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
        }
        .app-screen {
            flex: 1;
            overflow-y: auto;
            padding: 20px 20px 8px 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--border);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .app-screen::-webkit-scrollbar {
            width: 4px;
        }
        .app-screen::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 8px;
        }
        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .header h2 {
            font-size: 1.5rem;
            font-weight: 650;
            color: var(--text);
            letter-spacing: -0.02em;
        }
        .profile-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* bottom nav */
        .bottom-nav {
            background: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 12px;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.02);
            transition: background 0.2s;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 0 4px;
            border-radius: 16px;
            transition: all 0.15s ease;
            color: var(--inactive);
            fill: var(--inactive);
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            background: var(--nav-highlight);
            transform: scale(1.02);
        }
        .nav-item.active svg {
            transform: scale(1.1);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            margin-bottom: 2px;
            transition: transform 0.15s;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-item span {
            font-size: 0.7rem;
            font-weight: 500;
        }
        /* cards / UI */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .flex-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .gap-8 { gap: 8px; }
        .mb-2 { margin-bottom: 8px; }
        .mt-2 { margin-top: 8px; }
        .blue-badge {
            background: var(--primary);
            color: white;
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 40px;
            overflow: hidden;
            width: 100%;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            border-radius: 40px;
            transition: width 0.3s;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 40px;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.1s;
            box-shadow: 0 6px 14px rgba(37,99,235,0.25);
        }
        .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 12px 0 8px;
            font-size: 0.75rem;
            color: var(--inactive);
        }
        .link-row button {
            background: none;
            border: none;
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: var(--card);
            padding: 24px;
            border-radius: 32px;
            width: 280px;
            color: var(--text);
            box-shadow: 0 30px 40px black;
        }
        .modal button {
            margin-top: 16px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 30px;
            width: 100%;
            font-weight: 600;
        }
        .hidden { display: none; }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 8px 12px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .badge svg { stroke: #0F172A; }
        .chart {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 90px;
            margin: 12px 0;
        }
        .bar {
            width: 22px;
            background: var(--primary);
            border-radius: 12px 12px 4px 4px;
            height: calc(70% * var(--h));
            transition: height 0.3s;
        }
        .switch {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 16px 0;
        }
    </style>
</head>

            <button class="nav-item" data-tab="progress"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"><path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7V12L15 15" stroke="currentColor" stroke-width="2"/></svg><span>Progress</span></button>
            <button class="nav-item" data-tab="settings"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/><path d="M19.4 15C19.0333 15.6844 18.55 16.2939 17.98 16.8L18 17C18.7956 17.7957 19.2 18.8457 19.2 19.9785C19.2 21.1113 18.7956 22.1613 18 22.957C17.2043 23.7527 16.1543 24.1571 15.0215 24.1571C13.8887 24.1571 12.8387 23.7527 12.043 22.957L12 22.98C11.3156 23.3467 10.7061 23.83 10.2 24.4L9 22.82C9.36667 22.1356 9.85 21.5261 10.42 21.02L10.4 20.8C9.60435 20.0043 9.2 18.9543 9.2 17.8215C9.2 16.6887 9.60435 15.6387 10.4 14.843C11.1957 14.0474 12.2457 13.643 13.3785 13.643C14.5113 13.643 15.5613 14.0474 16.357 14.843L16.6 15C17.2844 14.6333 17.8939 14.15 18.4 13.58L19.4 15Z" stroke="currentColor" stroke-width="2" transform="rotate(45 12 12) translate(0 -6)"/></svg><span>Settings</span></button>

<script>
(function() {
    // ----- ICON SET (inline svg strings) -----
    const icons = {
        profile: '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
        chart: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V20H3V16"/><path d="M7 10L10 13L15 7L20 13"/></svg>',
        flashcards: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8H15"/><path d="M9 12H15"/><path d="M9 16H13"/></svg>',
        play: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/></svg>',
        check: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17L4 12"/></svg>',
        lesson: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3H8C10.2091 3 12 4.79086 12 7V21C12 19.8954 11.1046 19 10 19H2V3Z"/><path d="M22 3H16C13.7909 3 12 4.79086 12 7V21C12 19.8954 12.8954 19 14 19H22V3Z"/></svg>'
    };

    // state
    let currentScreen = 'onboarding';
    let darkMode = false;
    let screenshotCounter = 1;

    // screens HTML
    function onboardingScreen() {
        return `
            <div class="card" style="text-align: center; padding: 32px 16px;">
                <div style="background: var(--primary); width: 70px; height: 70px; border-radius: 20px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; color: white; font-size: 32px; font-weight: 800;">C</div>
                <h1 style="font-size: 2rem; color: var(--primary);">CodeLingua</h1>
                <p style="font-size: 1rem; font-weight: 500; margin: 8px 0;">learn Python · playful</p>
                <p style="color: var(--text-light); margin: 12px 0;">Bite-sized Python exercises, flashcards, and real code challenges. From zero to hero.</p>
                <button class="btn-primary" id="startGetStarted">Get Started</button>
                <div class="link-row">
                    <button id="privacyLink">Privacy Policy</button>
                    <button id="termsLink">Terms of Service</button>
                </div>
            </div>
        `;
    }
    function homeScreen() {
        return `
            <div class="header"><h2>Home</h2><button class="profile-btn" id="profileHeaderBtn">${icons.profile}</button></div>
            <div class="card flex-row gap-8">
                <span class="badge">${icons.flashcards} daily streak 7</span>
                <span class="badge">${icons.chart} 340 XP</span>
            </div>
            <div class="card">
                <h3 style="margin-bottom: 8px;">Continue lesson</h3>
                <div style="display: flex; gap: 12px; align-items: center;"><span>Python basics</span> <span style="flex:1"><div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div></span></div>
                <button class="btn-primary" style="margin-top: 12px;" id="continueLessonBtn">${icons.play} continue</button>
            </div>
            <div class="card">
                <div style="display: flex; justify-content: space-between;"><span>🔥 daily goal</span><span>60%</span></div>
                <div class="progress-bar mt-2"><div class="progress-fill" style="width:60%"></div></div>
            </div>
            <div class="card"><h4>latest exercises</h4>${icons.lesson} Variables · loops · functions</div>
        `;
    }
    function learnScreen() {
        return `
            <div class="header"><h2>Learn</h2><button class="profile-btn" id="profileHeaderBtn">${icons.profile}</button></div>
            <div class="card" style="display: flex; gap:12px; align-items: center;"><span>${icons.flashcards} Python flashcards</span><span class="blue-badge">new</span></div>
            <div class="card"><span>${icons.lesson} 1. Data types</span><div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div></div>
            <div class="card"><span>${icons.play} 2. Control flow</span><div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div></div>
            <div class="card"><span>${icons.lesson} 3. Functions</span><div class="progress-bar"><div class="progress-fill" style="width:10%"></div></div></div>
            <button class="btn-primary" id="startPracticeBtn">start practice</button>
        `;
    }
    function progressScreen() {
        return `
            <div class="header"><h2>Progress</h2><button class="profile-btn" id="profileHeaderBtn">${icons.profile}</button></div>
            <div class="card stat-grid">
                <div><small>lessons</small><br><strong>12/30</strong></div><div><small>xp today</small><br><strong>140</strong></div>
                <div><small>streak</small><br><strong>7</strong></div><div><small>badges</small><br><strong>3</strong></div>
            </div>
            <div class="card"><span>weekly activity</span><div class="chart"><div class="bar" style="--h:0.8"></div><div class="bar" style="--h:0.5"></div><div class="bar" style="--h:0.9"></div><div class="bar" style="--h:0.6"></div><div class="bar" style="--h:0.4"></div><div class="bar" style="--h:0.7"></div><div class="bar" style="--h:1"></div></div></div>
            <div class="card">${icons.chart} 340xp this week</div>
        `;
    }
    function settingsScreen() {
        return `
            <div class="header"><h2>Settings</h2><button class="profile-btn" id="profileHeaderBtn">${icons.profile}</button></div>
            <div class="card"><div class="switch"><span>🌙 Dark mode</span><label><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}></label></div></div>
            <div class="card">profile info<br><small>julia.coder</small></div>
            <div class="card">${icons.check} sound, reminders</div>
        `;
    }
    function profileScreen() { // profile / settings (full screen)
        return settingsScreen(); // but header title "Profile" — but we set it below
    }

    function renderScreen() {
        const container = document.getElementById('screenContainer');
        let html = '';
        if (currentScreen === 'onboarding') html = onboardingScreen();
        else if (currentScreen === 'home') html = homeScreen();
        else if (currentScreen === 'learn') html = learnScreen();
        else if (currentScreen === 'progress') html = progressScreen();
        else if (currentScreen === 'settings') html = settingsScreen();
        else if (currentScreen === 'profile') html = profileScreen().replace('Settings','Profile');
        container.innerHTML = html;

        // header override: remove duplicate if needed, but we keep structure. Also attach profile click
        const profileBtn = document.getElementById('profileHeaderBtn');
        if (profileBtn) profileBtn.addEventListener('click', (e) => { e.stopPropagation(); navigateTo('profile'); });
        // bottom nav active update
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        if (currentScreen !== 'onboarding' && currentScreen !== 'profile') {
            const tab = currentScreen;
            document.querySelector(`.nav-item[data-tab="${tab}"]`)?.classList.add('active');
        } else if (currentScreen === 'profile') {
            // no bottom highlight
        }
        // additional listeners
        document.getElementById('startGetStarted')?.addEventListener('click', ()=>{ navigateTo('home'); });
        document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy Policy','We value your privacy. No data shared.'));
        document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms of Service','Educational use only.'));
        document.getElementById('continueLessonBtn')?.addEventListener('click', ()=> alert('resume lesson (demo)'));
        document.getElementById('startPracticeBtn')?.addEventListener('click', ()=> alert('starting practice session'));
        document.getElementById('darkToggle')?.addEventListener('change', (e)=> {
            darkMode = e.target.checked;
            document.body.classList.toggle('dark', darkMode);
            renderScreen(); 
        });
    }

    function navigateTo(screen) {
        if (screen === 'profile') currentScreen = 'profile';
        else if (screen === 'home' || screen === 'learn' || screen === 'progress' || screen === 'settings') currentScreen = screen;
        else currentScreen = 'home';
        renderScreen();
    }

    // modal
    const modalOverlay = document.getElementById('modal');
    const modalText = document.getElementById('modalText');
    function showModal(title, text) { modalText.innerText = text; modalOverlay.classList.remove('hidden'); }
    document.getElementById('modalClose').addEventListener('click', ()=> modalOverlay.classList.add('hidden'));
    modalOverlay.addEventListener('click', (e)=> { if(e.target === modalOverlay) modalOverlay.classList.add('hidden'); });

    // bottom nav listeners
    document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const tab = btn.getAttribute('data-tab');
            if (tab) navigateTo(tab);
        });
    });

    // screenshot SHIFT+W
    window.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.key === 'W') {
            const phone = document.getElementById('phoneContainer');
            html2canvas?.(phone, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                let num = screenshotCounter;
                if (darkMode) num = 6;
                link.download = num + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                screenshotCounter = screenshotCounter < 5 ? screenshotCounter+1 : 1;
            }).catch(() => alert('html2canvas not loaded — using fallback, but screenshot not saved. Include library or use DevTools.'));
        }
    });

    // dummy html2canvas fallback if not loaded (just alert)
    if (typeof html2canvas === 'undefined') {
        window.html2canvas = function() { return Promise.reject(); };
    }

    // initial render
    renderScreen();
    // inject header dynamically: but we have inside screens, but for onboarding we need a custom header? we'll keep as is.
})();
</script>
<!-- html2canvas library for screenshot -->

    })();
</script>
