```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainPulse · logic trainer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            /* light mode (default) */
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --primary-blue: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive-icon: #94A3B8;
            --border-light: #E2E8F0;
            --progress-bg: #E2E8F0;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            --header-bg: rgba(255,255,255,0.8);
        }

        body.dark {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --primary-blue: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive-icon: #64748B;
            --border-light: #334155;
            --progress-bg: #334155;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
            --header-bg: rgba(30,41,59,0.8);
        }

        body {
            background: #1a1e2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg-primary);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0,0,0,0.3), 0 0 0 8px #2d3748;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s;
        }

        /* main app screen container */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            background: var(--bg-primary);
            transition: background 0.2s;
            padding-bottom: 8px;
        }

        /* header */
        .header {
            padding: 16px 20px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--header-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-light);
        }
        .header-left h1 {
            font-size: 22px;
            font-weight: 650;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .profile-icon {
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
            transition: background 0.1s;
        }
        .profile-icon:hover { background: var(--border-light); }

        /* bottom navigation */
        .bottom-nav {
            background: var(--bg-card);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-around;
            padding: 6px 12px 12px;
            backdrop-filter: blur(12px);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            border-radius: 16px;
            padding: 6px 0 4px;
            transition: all 0.15s ease;
            color: var(--inactive-icon);
            fill: var(--inactive-icon);
        }
        .nav-item.active {
            color: var(--primary-blue);
            fill: var(--primary-blue);
            background: rgba(37,99,235,0.1);
            transform: scale(1.02);
        }
        .nav-item.active svg {
            transform: scale(1.15);
            filter: drop-shadow(0 2px 4px rgba(37,99,235,0.2));
        }
        .nav-item svg {
            width: 26px;
            height: 26px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.12s;
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
        }

        /* content */
        .content {
            flex: 1;
            padding: 16px 16px 8px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* cards */
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }

        .row-space {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
        }

        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 30px;
            margin: 12px 0;
            width: 100%;
        }
        .progress-fill {
            width: 67%;
            height: 100%;
            background: var(--primary-blue);
            border-radius: 30px;
            transition: width 0.3s;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-item {
            background: var(--bg-primary);
            border-radius: 20px;
            padding: 14px 8px;
            text-align: center;
        }

        button {
            background: var(--primary-blue);
            border: none;
            color: white;
            font-weight: 600;
            padding: 16px 24px;
            border-radius: 40px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 4px 12px rgba(37,99,235,0.3);
            width: 100%;
        }
        button.secondary {
            background: transparent;
            border: 2px solid var(--primary-blue);
            color: var(--primary-blue);
            box-shadow: none;
        }

        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 20px;
            font-size: 13px;
        }
        .link-row span {
            color: var(--primary-blue);
            text-decoration: underline;
            cursor: pointer;
        }

        /* modal */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: var(--bg-card);
            width: 280px;
            border-radius: 32px;
            padding: 28px 20px;
            color: var(--text-primary);
            text-align: center;
        }

        /* icon sprite system */
        .hidden { display: none; }

        /* theme toggle */
        .theme-switch {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic header & screens -->
    <div id="app"></div>
    <!-- bottom nav (static) -->
    <div class="bottom-nav" id="bottomNav"></div>
</div>

<!-- modal overlay -->
<div id="modalOverlay" class="modal" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
        <h3 id="modalTitle" style="margin-bottom: 12px;">Privacy</h3>
        <p id="modalText" style="margin-bottom: 20px;">Your data stays on device. No tracking.</p>
        <button class="secondary" style="padding:10px;" onclick="closeModal()">Close</button>
    </div>
</div>

<script>
    (function() {
        // ---------- THEME & CONST ----------
        const lightVariables = {
            '--bg-primary': '#F8FAFC',
            '--bg-card': '#FFFFFF',
            '--text-primary': '#0F172A',
            '--primary-blue': '#2563EB',
            '--inactive-icon': '#94A3B8',
        };
        const darkVariables = {
            '--bg-primary': '#0F172A',
            '--bg-card': '#1E293B',
            '--text-primary': '#E2E8F0',
            '--primary-blue': '#3B82F6',
            '--inactive-icon': '#64748B',
        };

        let currentTheme = 'light';
        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
        let screenshotCounter = 1;
        let darkModeScreenshots = false;

        // ---------- SVG ICONS ----------
        const icons = {
            home: `<svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            learn: `<svg viewBox="0 0 24 24"><path d="M4 20H20M4 20V8L12 3L20 8V20M4 20L20 20M8 12V16M16 12V16M12 7V10" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            progress: `<svg viewBox="0 0 24 24"><path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3M21 12L12 12L16 8M21 12L16 16M12 3C16.9706 3 21 7.02944 21 12M12 3V8M12 21V16" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor" fill="none" stroke-width="2"/><path d="M19.4 15.5L18.5 18.6L15.4 19.4L12 21L8.6 19.4L5.5 18.5L4.6 15.4L3 12L4.6 8.6L5.5 5.5L8.6 4.6L12 3L15.4 4.6L18.5 5.5L19.4 8.6L21 12L19.4 15.5Z" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            profile: `<svg viewBox="0 0 24 24"><path d="M20 21V19C20 16.8 18.2 15 16 15H8C5.8 15 4 16.8 4 19V21M16 7C16 9.2 14.2 11 12 11C9.8 11 8 9.2 8 7C8 4.8 9.8 3 12 3C14.2 3 16 4.8 16 7Z" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            lesson: `<svg viewBox="0 0 24 24"><path d="M12 6V12L15 15M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            chart: `<svg viewBox="0 0 24 24"><path d="M3 17L7 13L11 17L18 10L21 13M21 3V21H3V3" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            flashcards: `<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" fill="none" stroke-width="2"/><path d="M8 8H16M8 12H14M8 16H12" stroke="currentColor" stroke-width="2"/></svg>`,
            play: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" fill="none" stroke-width="2"/><polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/></svg>`,
            check: `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
        };

        // ---------- APP STATE ----------
        let state = {
            theme: 'light',
            screen: 'onboarding',
            dailyGoal: 67,
            lessonsCompleted: 12,
            streak: 7,
        };

        // helpers
        function setTheme(theme) {
            const root = document.documentElement;
            const body = document.body;
            if (theme === 'dark') {
                body.classList.add('dark');
                currentTheme = 'dark';
                darkModeScreenshots = true;
            } else {
                body.classList.remove('dark');
                currentTheme = 'light';
                darkModeScreenshots = false;
            }
            renderScreen(state.screen); // re-render current screen
        }

        // modal
        function showModal(title, text) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalText').innerText = text;
            document.getElementById('modalOverlay').style.display = 'flex';
        }
        window.closeModal = function() { document.getElementById('modalOverlay').style.display = 'none'; };

        // navigation
        window.navigateTo = function(screen) {
            state.screen = screen;
            renderScreen(screen);
        };

        // header click -> open settings (profile)
        window.openProfile = function() {
            state.screen = 'settings';
            renderScreen('settings');
        };

        // ----- SCREEN RENDERERS -----
        function renderOnboarding() {
            return `
                <div class="header">
                    <div class="header-left"><h1>BrainPulse</h1></div>
                    <div class="profile-icon" onclick="openProfile()">${icons.profile}</div>
                </div>
                <div class="content" style="justify-content: center;">
                    <div class="card" style="text-align: center;">
                        <div style="font-size: 48px; margin-bottom: 8px;">🧠</div>
                        <h2 style="font-size: 32px; margin: 8px 0 4px;">Logic puzzles</h2>
                        <div style="color: var(--primary-blue); font-weight: 600; margin-bottom: 12px;">train your brain</div>
                        <p style="margin: 16px 0; color: var(--text-secondary);">Daily mind workouts with adaptive logic puzzles. Bite-sized challenges that sharpen reasoning.</p>
                        <button onclick="navigateTo('home')">Get Started →</button>
                        <div class="link-row">
                            <span onclick="showModal('Privacy Policy','We respect your privacy. No data leaves your device.')">Privacy</span>
                            <span onclick="showModal('Terms of Service','By using BrainPulse you agree to fair play.')">Terms</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderHome() {
            return `
                <div class="header">
                    <div class="header-left"><h1>Home</h1></div>
                    <div class="profile-icon" onclick="openProfile()">${icons.profile}</div>
                </div>
                <div class="content">
                    <div class="card">
                        <div class="row-space"><span>Daily puzzle</span><span class="badge">+10 XP</span></div>
                        <div style="display:flex; gap:12px; align-items:center;">
                            <span>${icons.play}</span>
                            <span style="font-weight:600;">Logic grid · hard</span>
                        </div>
                        <div class="progress-bar"><div class="progress-fill" style="width:40%"></div></div>
                        <button class="secondary" style="padding:12px;" onclick="navigateTo('learn')">Continue</button>
                    </div>
                    <div class="grid-2">
                        <div class="stat-item">🧩 ${state.lessonsCompleted} puzzles</div>
                        <div class="stat-item">🔥 ${state.streak} day streak</div>
                    </div>
                    <div class="card">
                        <div class="row-space"><span>Recommended</span><span>see all</span></div>
                        <div style="display:flex; gap:16px; margin:8px 0;">
                            <span>${icons.flashcards}</span><span>Nonograms</span>
                        </div>
                        <div style="display:flex; gap:16px;">
                            <span>${icons.lesson}</span><span>Sudoku (easy)</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderLearn() {
            return `
                <div class="header">
                    <div class="header-left"><h1>Practice</h1></div>
                    <div class="profile-icon" onclick="openProfile()">${icons.profile}</div>
                </div>
                <div class="content">
                    <div class="card" style="display:flex; align-items:center; gap:12px;" onclick="showModal('Lesson','🔓 more lessons coming soon')">
                        ${icons.lesson} <span style="flex:1;">Logic foundations</span> <span>67%</span>
                    </div>
                    <div class="card" style="display:flex; align-items:center; gap:12px;" onclick="showModal('Exercise','Start brain teaser')">
                        ${icons.flashcards} <span style="flex:1;">Brain teasers</span> <span>12 min</span>
                    </div>
                    <div class="card" style="background:var(--primary-blue);color:white;" onclick="navigateTo('progress')">
                        <span>${icons.chart}  View insights →</span>
                    </div>
                    <button onclick="showModal('Daily workout','5 new puzzles ready!')">Start practice</button>
                </div>
            `;
        }

        function renderProgress() {
            return `
                <div class="header">
                    <div class="header-left"><h1>Progress</h1></div>
                    <div class="profile-icon" onclick="openProfile()">${icons.profile}</div>
                </div>
                <div class="content">
                    <div class="card">
                        <span>This month</span>
                        <div style="height:70px; display:flex; align-items:end; gap:4px; margin:12px 0;">
                            <div style="background:var(--primary-blue); width:20px; height:40px; border-radius:6px;"></div>
                            <div style="background:var(--primary-blue); width:20px; height:65px;"></div>
                            <div style="background:var(--primary-blue); width:20px; height:30px;"></div>
                            <div style="background:var(--primary-blue); width:20px; height:55px;"></div>
                            <div style="background:var(--accent); width:20px; height:70px;"></div>
                        </div>
                    </div>
                    <div class="card row-space"><span>Lessons done</span><strong>${state.lessonsCompleted}</strong></div>
                    <div class="card row-space"><span>Accuracy</span><strong>84%</strong></div>
                    <div class="card" style="text-align:center;">🏆 3 achievements unlocked</div>
                </div>
            `;
        }

        function renderSettings() {
            return `
                <div class="header">
                    <div class="header-left"><h1>Settings</h1></div>
                    <div class="profile-icon" onclick="openProfile()">${icons.profile}</div>
                </div>
                <div class="content">
                    <div class="card">
                        <div class="theme-switch">
                            <span>Dark mode</span>
                            <label><input type="checkbox" id="themeCheck" ${currentTheme==='dark'?'checked':''} onchange="toggleTheme()"></label>
                        </div>
                    </div>
                    <div class="card row-space"><span>Profile</span> <span>${icons.profile}</span></div>
                    <div class="card row-space"><span>Notifications</span> <span>off</span></div>
                    <div class="link-row" style="justify-content:space-evenly;">
                        <span onclick="showModal('Privacy','Your data is private')">Privacy</span>
                        <span onclick="showModal('Terms','Logic puzzles only')">Terms</span>
                    </div>
                </div>
            `;
        }

        function renderScreen(screen) {
            const appDiv = document.getElementById('app');
            let html = '';
            if (screen === 'onboarding') html = renderOnboarding();
            else if (screen === 'home') html = renderHome();
            else if (screen === 'learn') html = renderLearn();
            else if (screen === 'progress') html = renderProgress();
            else if (screen === 'settings') html = renderSettings();
            else html = renderHome();

            appDiv.innerHTML = html;
            // update bottom nav active
            updateBottomNav(screen);
        }

        function updateBottomNav(active) {
            const navMap = {
                'home': 0,
                'learn': 1,
                'progress': 2,
                'settings': 3,
                'onboarding': 0, // fallback home after get started
            };
            const idx = navMap[active] ?? 0;
            const navItems = [
                { id: 'home', icon: icons.home, label: 'Home' },
                { id: 'learn', icon: icons.learn, label: 'Learn' },
                { id: 'progress', icon: icons.progress, label: 'Progress' },
                { id: 'settings', icon: icons.settings, label: 'Settings' },
            ];
            let navHtml = '';
            navItems.forEach((item, i) => {
                const activeClass = (i === idx && active !== 'onboarding') ? 'active' : '';
                navHtml += `<div class="nav-item ${activeClass}" onclick="navigateTo('${item.id}')">
                    ${item.icon} <span class="nav-label">${item.label}</span>
                </div>`;
            });
            document.getElementById('bottomNav').innerHTML = navHtml;
        }

        window.toggleTheme = function() {
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            setTheme(newTheme);
        };

        // screenshot: shift+W
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                const phone = document.getElementById('phoneContainer');
                // simplistic approach: use html2canvas? not allowed, but we simulate naming.
                // Since no external libs, just "capture" by logging and updating sequential name.
                const isDark = document.body.classList.contains('dark');
                let filename = isDark ? '6.png' : (screenshotCounter + '.png');
                if (!isDark && screenshotCounter <=5) filename = screenshotCounter + '.png';
                if (isDark) filename = '6.png';
                alert(`📸 Screenshot saved as ${filename} (simulated)`);
                if (!isDark && screenshotCounter <5) screenshotCounter++;
                // don't increment dark, always 6
            }
        });

        // initial render
        renderScreen('onboarding');
        setTheme('light');
    })();
</script>

    </div>
</div>
