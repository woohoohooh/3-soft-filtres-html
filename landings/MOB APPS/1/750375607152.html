```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python · Learn mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            background: #1b2b40;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --border: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --inactive-light: #CBD5E1;
            --shadow: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,0,0,0.05);
        }
        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --border: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --inactive-light: #475569;
            --shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .phone-frame {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 42px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s;
        }
        .screen-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) var(--card);
            padding-bottom: 0;
        }
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background-color: var(--inactive);
            border-radius: 8px;
        }
        /* header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px 8px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 650;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .profile-icon {
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            transition: background 0.15s;
        }
        .profile-icon:hover {
            background: var(--inactive-light);
        }
        /* bottom nav */
        .bottom-nav {
            background: var(--card);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 10px;
            border-top: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1);
            padding: 6px 12px 4px;
            border-radius: 20px;
            gap: 4px;
        }
        .nav-item.active {
            background: rgba(37, 99, 235, 0.1);
            transform: scale(1.02);
        }
        .nav-item.active .nav-icon svg {
            stroke: var(--primary) !important;
            stroke-width: 2.4px;
            transform: scale(1.1);
        }
        .nav-item .nav-icon svg {
            stroke: var(--inactive);
            stroke-width: 2px;
            transition: all 0.15s;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            color: var(--inactive);
            transition: color 0.15s;
        }
        .nav-item.active span {
            color: var(--primary);
            font-weight: 600;
        }
        .nav-item:not(.active):hover .nav-icon svg {
            stroke: var(--primary-dark);
        }
        /* screen content */
        .screen {
            display: none;
            flex-direction: column;
            flex: 1;
            padding: 8px 16px 12px;
        }
        .screen.active {
            display: flex;
        }
        /* cards */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }
        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
        }
        .progress-bar {
            height: 10px;
            background: var(--inactive-light);
            border-radius: 40px;
            margin: 8px 0;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--primary);
            border-radius: 40px;
            transition: width 0.3s ease;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-item {
            background: var(--bg);
            border-radius: 18px;
            padding: 12px 10px;
            border: 1px solid var(--border);
        }
        .lesson-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .lesson-row:last-child {
            border-bottom: none;
        }
        button {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 20px;
            border-radius: 40px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 10px rgba(37,99,235,0.3);
        }
        button.secondary {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            box-shadow: none;
        }
        .link {
            color: var(--primary);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
        }
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            text-align: center;
            color: var(--text);
        }
        .modal-close {
            margin-top: 20px;
            background: var(--primary);
            padding: 10px;
            border-radius: 40px;
        }
        /* toggle */
        .switch {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 16px 0;
        }
        /* screenshot area */
        #phone-for-screenshot {
            width: 360px;
            height: 780px;
            overflow: hidden;
            border-radius: 42px;
        }
    </style>
</head>
<body>
    <div id="phone-for-screenshot" class="phone-frame">
        <!-- dynamic main container -->
        <div class="screen-container" id="app-container">
            <!-- header will be set by js -->
            <div id="dynamic-header" class="header"></div>
            <!-- screens -->
            <div id="screens-wrapper" style="flex:1; display: flex; flex-direction: column;">
                <!-- screens injected via JS -->
            </div>
            <!-- bottom nav -->
            <div class="bottom-nav" id="bottomNav"></div>
        </div>
    </div>

    <!-- modal container -->
    <div id="modal-container" style="display: none;"></div>

    <script>
        (function(){
            // ---------- THEME ----------
            const root = document.documentElement;
            let darkMode = false;
            function toggleTheme() {
                darkMode = !darkMode;
                if (darkMode) document.body.classList.add('dark');
                else document.body.classList.remove('dark');
                // update settings toggle text if visible
                const toggleEl = document.getElementById('themeToggleText');
                if (toggleEl) toggleEl.innerText = darkMode ? 'Dark' : 'Light';
            }

            // ---------- SVG ICONS (2px stroke, rounded caps) ----------
            const icons = {
                home: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
                learn: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
                progress: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/></svg>`,
                settings: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.03.03A10 10 0 0 0 12 17.66a10 10 0 0 0 6.37-2.63z"/></svg>`,
                profile: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
                lesson: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>`,
                chart: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`,
                flashcards: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>`,
                play: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
                check: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`
            };

            // ---------- NAVIGATION STATE ----------
            let currentScreen = 'onboarding'; // default
            const screens = ['onboarding', 'home', 'learn', 'progress', 'settings'];

            // ---------- BUILD SCREENS HTML ----------
            function getScreenHTML(screenId) {
                switch(screenId) {
                    case 'onboarding':
                        return `<div class="screen active" id="screen-onboarding" style="padding-top: 60px;">
                            <div style="display:flex; flex-direction:column; align-items:center; text-align:center;">
                                <div style="background:var(--primary); width:70px; height:70px; border-radius:20px; display:flex; align-items:center; justify-content:center; margin-bottom:16px;">${icons.learn.replace('22','36').replace('22','36')}</div>
                                <h1 style="font-size:36px; font-weight:700; color:var(--primary);">PyLearn</h1>
                                <p style="font-size:18px; font-weight:600; margin:6px 0 12px;">code like a pro</p>
                                <p style="color:var(--text-light); max-width:260px; margin-bottom:32px;">Master Python with bite-sized exercises, real-time feedback, and daily challenges.</p>
                                <button id="getStartedBtn" style="width:100%;">Get Started →</button>
                                <div style="display:flex; gap:24px; margin-top:40px;">
                                    <a href="#" id="privacyLink" class="link">Privacy</a>
                                    <a href="#" id="termsLink" class="link">Terms</a>
                                </div>
                            </div>
                        </div>`;
                    case 'home':
                        return `<div class="screen" id="screen-home">
                            <div class="flex-row"><span class="badge">🔥 7 day streak</span><span>${icons.flashcards.replace('22','20')}</span></div>
                            <div class="card">
                                <h3 style="margin-bottom:8px;">Continue where you left</h3>
                                <div class="lesson-row"><span>${icons.play.replace('22','24')}</span> <span style="flex:1;">Variables & Data types</span> <span class="badge" style="background:var(--primary); color:white;">75%</span></div>
                                <div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div>
                                <button class="secondary" style="margin-top:12px;" onclick="window.navToScreen('learn')">Continue</button>
                            </div>
                            <h3>Today's picks</h3>
                            <div class="grid-2">
                                <div class="card" style="padding:14px;">🐍 <strong>Loops</strong> <span style="font-size:12px;">3 min</span></div>
                                <div class="card" style="padding:14px;">📋 <strong>Lists</strong> <span style="font-size:12px;">5 min</span></div>
                                <div class="card" style="padding:14px;">🔧 <strong>Functions</strong> <span>4 min</span></div>
                                <div class="card" style="padding:14px;">📚 <strong>Dicts</strong> <span>6 min</span></div>
                            </div>
                        </div>`;
                    case 'learn':
                        return `<div class="screen" id="screen-learn">
                            <h2 style="margin-bottom:6px;">Python fundamentals</h2>
                            <div class="card lesson-row"><span>${icons.lesson.replace('22','24')}</span> <span style="flex:1;">1. Hello world</span> <span class="check" style="color:var(--primary);">${icons.check.replace('22','20')}</span></div>
                            <div class="card lesson-row"><span>${icons.lesson.replace('22','24')}</span> <span style="flex:1;">2. Variables</span> <span class="check">${icons.play.replace('22','20')}</span></div>
                            <div class="card lesson-row"><span>${icons.lesson.replace('22','24')}</span> <span style="flex:1;">3. Conditionals</span> <span>${icons.play.replace('22','20')}</span></div>
                            <div class="card lesson-row"><span>${icons.lesson.replace('22','24')}</span> <span style="flex:1;">4. Loops</span> <span>locked</span></div>
                            <button style="margin-top:16px;" onclick="window.startPractice()">quick practice →</button>
                        </div>`;
                    case 'progress':
                        return `<div class="screen" id="screen-progress">
                            <div class="card"><h3>Overall progress</h3>
                                <div style="display:flex; gap:16px; align-items:center;"><span>Python basics</span> <span style="font-weight:700;">38%</span></div>
                                <div class="progress-bar"><div class="progress-fill" style="width:38%"></div></div>
                                <div style="margin-top:16px;">⚡ 230 XP this week</div>
                            </div>
                            <div class="grid-2">
                                <div class="stat-item"><strong>12</strong> <span>lessons done</span></div>
                                <div class="stat-item"><strong>45</strong> <span>exercises</span></div>
                                <div class="stat-item"><strong>3</strong> <span>badges</span></div>
                                <div class="stat-item"><strong>8d</strong> <span>streak</span></div>
                            </div>
                            <div class="card">${icons.chart}  weekly activity chart (mock)</div>
                        </div>`;
                    case 'settings':
                        return `<div class="screen" id="screen-settings">
                            <div class="card">
                                <div class="flex-row"><span>👤 Username</span> <span class="link">edit</span></div>
                                <div class="flex-row"><span>🔔 Notifications</span> <span>on</span></div>
                                <div class="switch"><span>🌙 Dark mode</span> <label><input type="checkbox" id="themeSwitcher" ${darkMode ? 'checked' : ''} onchange="toggleTheme()"></label></div>
                                <div class="flex-row"><span>🎯 Daily goal</span> <span>15 min</span></div>
                            </div>
                            <div class="card"><h4>Account</h4> email, reset data etc</div>
                            <button class="secondary" style="margin-top:8px;" onclick="window.navToScreen('home')">Back to home</button>
                        </div>`;
                    default: return '';
                }
            }

            // ---------- RENDER ALL ----------
            function renderApp() {
                const wrapper = document.getElementById('screens-wrapper');
                let html = '';
                screens.forEach(s => { html += getScreenHTML(s); });
                wrapper.innerHTML = html;

                // set active class
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                const activeEl = document.getElementById(`screen-${currentScreen}`);
                if (activeEl) activeEl.classList.add('active');

                // build header
                const headerTitles = {
                    onboarding: 'PyLearn', home: 'Dashboard', learn: 'Practice', progress: 'Insights', settings: 'Profile'
                };
                document.getElementById('dynamic-header').innerHTML = `
                    <h1>${headerTitles[currentScreen]}</h1>
                    <div class="profile-icon" id="profileBtn">${icons.profile}</div>
                `;

                // bottom nav
                const navMap = [
                    { id: 'home', label: 'Home', icon: icons.home },
                    { id: 'learn', label: 'Learn', icon: icons.learn },
                    { id: 'progress', label: 'Progress', icon: icons.progress },
                    { id: 'settings', label: 'Settings', icon: icons.settings }
                ];
                let navHtml = '';
                navMap.forEach(item => {
                    const activeClass = (currentScreen === item.id) ? 'active' : '';
                    navHtml += `<button class="nav-item ${activeClass}" data-screen="${item.id}">
                        <span class="nav-icon">${item.icon}</span>
                        <span>${item.label}</span>
                    </button>`;
                });
                document.getElementById('bottomNav').innerHTML = navHtml;

                // re-attach listeners
                document.querySelectorAll('.nav-item').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const screen = btn.dataset.screen;
                        window.navToScreen(screen);
                    });
                });
                document.getElementById('profileBtn')?.addEventListener('click', ()=> window.navToScreen('settings'));

                // onboarding btns
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=> window.navToScreen('home'));
                const modal = (type) => {
                    const modalHtml = `<div class="modal" id="modal"><div class="modal-content"><h3>${type}</h3><p>dummy policy text for prototype.</p><button class="modal-close" id="modalClose">close</button></div></div>`;
                    document.getElementById('modal-container').innerHTML = modalHtml;
                    document.getElementById('modal-container').style.display = 'block';
                    document.getElementById('modalClose').addEventListener('click', ()=> document.getElementById('modal-container').style.display='none');
                };
                document.getElementById('privacyLink')?.addEventListener('click', (e) => { e.preventDefault(); modal('Privacy Policy'); });
                document.getElementById('termsLink')?.addEventListener('click', (e) => { e.preventDefault(); modal('Terms of Service'); });

                // theme toggle inside settings
                const cb = document.getElementById('themeSwitcher');
                if (cb) {
                    cb.checked = darkMode;
                    cb.addEventListener('change', toggleTheme);
                }
            }

            window.navToScreen = function(screenId) {
                if (screens.includes(screenId) || screenId === 'onboarding') {
                    currentScreen = screenId;
                    renderApp();
                }
            };
            window.startPractice = function() {
                alert('Practice started (simulated)');
                const bar = document.querySelector('.progress-fill');
                if (bar) bar.style.width = '55%';
            };
            window.toggleTheme = toggleTheme;

            // screenshot capture (shift+w)
            document.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    const node = document.getElementById('phone-for-screenshot');
                    import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
                        html2canvas(node, { backgroundColor: null }).then(canvas => {
                            const link = document.createElement('a');
                            const themeSuffix = darkMode ? '6' : (window._seq || 1);
                            link.download = `${themeSuffix}.png`;
                            link.href = canvas.toDataURL('image/png');
                            link.click();
                            window._seq = ((window._seq||1) % 5) + 1;
                        });
                    }).catch(() => alert('html2canvas not loaded, but pretend screenshot'));
                }
            });

            // initial
            renderApp();
        })();
    </script>
    <!-- ensure html2canvas async load -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</body>
</html>
All done!
