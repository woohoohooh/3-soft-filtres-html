```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabVault · English builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #475569;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --border: #E2E8F0;
            --icon-stroke: #0F172A;
            --highlight: #DBEAFE;
            --shadow: 0 4px 12px rgba(0,0,0,0.04);
            --bar-bg: #E2E8F0;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #94A3B8;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --border: #334155;
            --icon-stroke: #E2E8F0;
            --highlight: #1E3A5F;
            --shadow: 0 4px 12px rgba(0,0,0,0.3);
            --bar-bg: #334155;
        }

        body {
            background: #1a1e2b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 42px;
            overflow: hidden;
            box-shadow: 0 25px 50px -10px rgba(0,0,0,0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.08);
        }

        /* main screen wrapper */
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 16px 16px 4px 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) transparent;
        }
        .screen::-webkit-scrollbar { width: 4px; }
        .screen::-webkit-scrollbar-thumb { background: var(--inactive); border-radius: 8px; }

        /* header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0 14px 0;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 650;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .profile-icon {
            cursor: pointer;
            padding: 6px;
            border-radius: 30px;
            transition: background 0.15s;
        }
        .profile-icon:hover { background: var(--highlight); }
        .profile-icon svg { display: block; }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 10px;
            background: var(--card);
            border-top: 1px solid var(--border);
            box-shadow: 0 -2px 8px rgba(0,0,0,0.02);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 40px;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            background: transparent;
            gap: 3px;
        }
        .nav-item.active {
            background: var(--highlight);
            transform: scale(1.02);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            transition: all 0.15s;
        }
        .nav-item.active svg {
            transform: scale(1.15);
            stroke: var(--primary);
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            transition: color 0.15s;
        }
        .nav-item.active span { color: var(--primary); font-weight: 600; }
        .nav-item:not(.active) span { color: var(--inactive); }
        .nav-item:not(.active) svg { stroke: var(--inactive); }

        /* cards */
        .card {
            background: var(--card);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        /* buttons */
        .btn-primary {
            background: var(--primary);
            color: white;
            font-weight: 600;
            font-size: 18px;
            padding: 16px 20px;
            border: none;
            border-radius: 50px;
            width: 100%;
            cursor: pointer;
            transition: background 0.15s, transform 0.05s;
            box-shadow: 0 6px 14px rgba(37,99,235,0.25);
            letter-spacing: 0.3px;
        }
        .btn-primary:active { background: var(--primary-dark); transform: scale(0.98); }

        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 16px 0 8px;
            font-size: 13px;
        }
        .link-row span {
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
        }

        /* modal */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }
        .modal-content {
            background: var(--card);
            width: 280px;
            padding: 24px;
            border-radius: 28px;
            color: var(--text);
            border: 1px solid var(--border);
            text-align: center;
        }
        .modal-content h3 { margin-bottom: 12px; }
        .modal-content button {
            margin-top: 18px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
        }

        /* progress */
        .progress-bar {
            height: 8px;
            background: var(--bar-bg);
            border-radius: 20px;
            margin: 12px 0 6px;
        }
        .progress-fill {
            height: 8px;
            background: var(--primary);
            border-radius: 20px;
            width: 0%;
            transition: width 0.6s ease;
        }

        .badge-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .badge {
            background: var(--highlight);
            color: var(--primary-dark);
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .chart-container {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 100px;
            margin: 16px 0 8px;
        }
        .bar {
            width: 20px;
            background: linear-gradient(to top, var(--primary), var(--accent));
            border-radius: 8px 8px 4px 4px;
            transition: height 0.5s;
        }

        /* hidden util */
        .hidden { display: none !important; }
        .mt-2 { margin-top: 8px; }
        .icon-row { display: flex; gap: 20px; align-items: center; margin: 12px 0; }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- header (dynamic title + profile) -->
    <div class="header" style="padding: 12px 16px 0 16px;">
        <h1 id="screenTitle">Onboarding</h1>
        <div class="profile-icon" id="profileBtn" title="Profile / Settings">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--icon-stroke)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
        </div>
    </div>

    <!-- dynamic screens injected here -->
    <div id="appScreen" class="screen"></div>

    <!-- bottom nav (4 items) -->
    <div class="bottom-nav" id="bottomNav">
        <div class="nav-item" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Home</span></div>
        <div class="nav-item" data-nav="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span>Learn</span></div>
        <div class="nav-item" data-nav="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/><path d="M9 8V6"/><path d="M15 8V6"/></svg><span>Progress</span></div>
        <div class="nav-item" data-nav="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/><path d="M16.5 6.5 19 9"/><path d="M7.5 6.5 5 9"/></svg><span>Settings</span></div>
    </div>
</div>

<script>
(function() {
    // ----- THEME (light default) -----
    const root = document.documentElement;
    let darkMode = false;
    const themeToggle = () => {
        darkMode = !darkMode;
        document.body.classList.toggle('dark', darkMode);
    };

    // ----- SVG icon set (2px stroke, rounded) -----
    const icons = {
        home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
        learn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
        progress: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/><path d="M9 8V6"/><path d="M15 8V6"/></svg>',
        settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/><path d="M16.5 6.5 19 9"/><path d="M7.5 6.5 5 9"/></svg>',
        profile: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
        lesson: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>',
        chart: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
        flashcards: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/></svg>',
        play: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
        check: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>'
    };

    // ----- state -----
    let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
    const screenDiv = document.getElementById('appScreen');
    const titleEl = document.getElementById('screenTitle');
    const navItems = document.querySelectorAll('.nav-item');
    const profileBtn = document.getElementById('profileBtn');

    // modal
    let modalDiv = null;

    function showModal(text) {
        if (modalDiv) modalDiv.remove();
        modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `<div class="modal-content"><h3>${text}</h3><p style="margin:10px 0">Sample legal text.</p><button id="closeModalBtn">Close</button></div>`;
        document.body.appendChild(modalDiv);
        document.getElementById('closeModalBtn').addEventListener('click', ()=> { modalDiv.remove(); modalDiv = null; });
    }

    // ----- render functions -----
    function renderOnboarding() {
        return `
            <div style="display: flex; flex-direction: column; justify-content: center; min-height: 100%;">
                <div class="card" style="text-align: center; background:transparent; box-shadow:none; border:none;">
                    <div style="background: var(--primary); width: 64px; height:64px; border-radius: 18px; margin: 0 auto 16px; display:flex; align-items: center; justify-content: center;">
                        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                    </div>
                    <h1 style="font-size: 42px; font-weight:700; color:var(--primary); margin-bottom:4px;">VocabVault</h1>
                    <p style="font-size: 18px; font-weight: 500; color: var(--accent);">master English daily</p>
                    <p style="margin: 20px 0 16px; color: var(--text-light);">Build vocabulary with smart flashcards, daily challenges, and progress tracking.</p>
                    <button class="btn-primary" id="startGetStarted">Get Started</button>
                    <div class="link-row">
                        <span id="privacyLink">Privacy Policy</span>
                        <span id="termsLink">Terms of Service</span>
                    </div>
                </div>
            </div>
        `;
    }

    function renderHome() {
        return `
            <div>
                <div class="card">
                    <h3 style="margin-bottom: 6px;">🔥 Daily streak 12</h3>
                    <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
                    <p style="color:var(--text-light);">Today's goal: 20 words · 14 done</p>
                </div>
                <div class="card">
                    <div style="display:flex; justify-content: space-between;"><span style="font-weight:600;">Continue lesson</span> <span>B1 · 5 min</span></div>
                    <div style="display:flex; align-items:center; gap:12px; margin:12px 0 8px;">
                        ${icons.flashcards} <span style="flex:1;">Phrasal verbs: turn / take</span> ${icons.play}
                    </div>
                    <div class="badge-row"><span class="badge">intermediate</span><span class="badge">+10 xp</span></div>
                </div>
                <div class="card">
                    <p style="font-weight:600; margin-bottom:10px;">📘 Recommended for you</p>
                    <div style="display:flex; gap:14px;"> 
                        <div>${icons.lesson} Idioms</div><div>${icons.flashcards} 200 cards</div>
                    </div>
                </div>
            </div>
        `;
    }

    function renderLearn() {
        return `
            <div>
                <div class="card" style="background: var(--accent); color:#0F172A;"><h3>Today's topic: Business English</h3><button class="btn-primary" style="background: #0F172A; color:white; margin-top:10px;" id="practiceNow">Practice now</button></div>
                <div class="card"><h4>Word sets</h4> ${icons.flashcards} Academic (34) <progress value=".5" max="1" style="width:100%; height:8px; border-radius:20px;"></progress></div>
                <div class="card"><h4>Listening drill</h4> ${icons.play} Pronunciation: minimal pairs</div>
                <div class="card">${icons.check} Quiz: synonyms · 10 questions</div>
            </div>
        `;
    }

    function renderProgress() {
        return `
            <div>
                <div class="card stats-grid">
                    <div><span class="badge">words</span> <h2>1,240</h2></div>
                    <div><span class="badge">xp</span> <h2>4,580</h2></div>
                </div>
                <div class="card">
                    <h4>Weekly activity</h4>
                    <div class="chart-container">
                        <div class="bar" style="height:60px;"></div><div class="bar" style="height:38px;"></div><div class="bar" style="height:72px;"></div><div class="bar" style="height:50px;"></div><div class="bar" style="height:90px;"></div><div class="bar" style="height:45px;"></div><div class="bar" style="height:30px;"></div>
                    </div>
                </div>
                <div class="card">${icons.chart} mastery: 72% · next level in 2 days</div>
                <div class="badge-row"><span class="badge">🔥 12 week streak</span><span class="badge">🥇 top 10%</span></div>
            </div>
        `;
    }

    function renderSettings() {
        return `
            <div>
                <div class="card"><h4>Preferences</h4>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin:16px 0;">
                        <span>Dark theme</span>
                        <label class="switch"><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}><span class="slider"></span></label>
                    </div>
                    <p>Notifications on · sound effects</p>
                </div>
                <div class="card">Profile: Alex · ${icons.profile}</div>
                <div class="card">Reminders: daily 8:00 PM</div>
            </div>
        `;
    }

    function renderProfileSettings() {
        currentScreen = 'settings';
        return renderSettings();
    }

    function loadScreen(screen) {
        let html = '';
        if (screen === 'onboarding') html = renderOnboarding();
        else if (screen === 'home') html = renderHome();
        else if (screen === 'learn') html = renderLearn();
        else if (screen === 'progress') html = renderProgress();
        else if (screen === 'settings') html = renderSettings();

        screenDiv.innerHTML = html;
        if (screen === 'onboarding') titleEl.innerText = 'VocabVault';
        else if (screen === 'home') titleEl.innerText = 'Home';
        else if (screen === 'learn') titleEl.innerText = 'Learn';
        else if (screen === 'progress') titleEl.innerText = 'Progress';
        else if (screen === 'settings') titleEl.innerText = 'Settings';

        // bottom nav active
        navItems.forEach(item => {
            const nav = item.dataset.nav;
            if ((screen === 'onboarding' && nav === 'home') || screen === nav) {
                item.classList.add('active');
            } else {
                item.classList.remove('active');
            }
        });

        // attach events
        if (screen === 'onboarding') {
            document.getElementById('startGetStarted')?.addEventListener('click', ()=> { currentScreen='home'; loadScreen('home'); });
            document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy Policy (demo)'));
            document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms of Service (demo)'));
        }
        if (screen === 'learn') {
            document.getElementById('practiceNow')?.addEventListener('click', ()=> { alert('Practice started!'); });
        }
        if (screen === 'settings') {
            const toggle = document.getElementById('darkToggle');
            if (toggle) toggle.addEventListener('change', (e) => { themeToggle(); loadScreen('settings'); });
        }
    }

    // navigation
    navItems.forEach(item => {
        item.addEventListener('click', (e) => {
            const nav = item.dataset.nav; // home/learn/progress/settings
            if (nav === 'home' && currentScreen !== 'home') { currentScreen = 'home'; loadScreen('home'); }
            else if (nav === 'learn' && currentScreen !== 'learn') { currentScreen = 'learn'; loadScreen('learn'); }
            else if (nav === 'progress' && currentScreen !== 'progress') { currentScreen = 'progress'; loadScreen('progress'); }
            else if (nav === 'settings' && currentScreen !== 'settings') { currentScreen = 'settings'; loadScreen('settings'); }
        });
    });

    profileBtn.addEventListener('click', ()=> {
        currentScreen = 'settings';
        loadScreen('settings');
    });

    // start with onboarding
    loadScreen('onboarding');

    // screenshot shortcut SHIFT+W
    document.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.key === 'W') {
            const container = document.getElementById('phoneContainer');
            html2canvas?.(container, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                let idx = darkMode ? 6 : (currentScreen === 'onboarding'? 1 : currentScreen === 'home'? 2 : currentScreen === 'learn'? 3 : currentScreen === 'progress'? 4 : 5);
                if (darkMode) idx = 6;
                link.download = `${idx}.png`;
                link.href = canvas.toDataURL();
                link.click();
            }).catch(() => alert('html2canvas not loaded – use fallback'));
        }
    });

    // we embed html2canvas via CDN (allowed, vanilla)
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    document.head.appendChild(script);
})();
</script>
<!-- no extra frameworks -->
</body>
</html>
All done!
