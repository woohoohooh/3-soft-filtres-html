```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeFlow • daily science facts</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #1a2639;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background-color: var(--bg-primary);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2d3b4f;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s;
    }

    /* inner screen */
    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px 16px 8px 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--icon-inactive) var(--card-bg);
      background: var(--bg-primary);
    }

    .screen::-webkit-scrollbar {
      width: 4px;
    }
    .screen::-webkit-scrollbar-track {
      background: var(--card-bg);
    }
    .screen::-webkit-scrollbar-thumb {
      background: var(--icon-inactive);
      border-radius: 8px;
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-light);
      margin-bottom: 16px;
    }

    .header h2 {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .profile-icon {
      cursor: pointer;
      padding: 6px;
      border-radius: 12px;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .profile-icon:hover {
      background: var(--card-hover);
    }

    /* bottom navigation */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 12px 10px;
      background: var(--card-bg);
      border-top: 1px solid var(--border-light);
      backdrop-filter: blur(4px);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 20px;
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      flex: 1;
    }

    .nav-item.active {
      background: rgba(37, 99, 235, 0.08);
      transform: scale(1.02);
    }

    .nav-item.active .nav-icon {
      transform: scale(1.15);
    }

    .nav-icon {
      width: 24px;
      height: 24px;
      stroke: var(--icon-color);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, transform 0.2s;
    }

    .nav-item.active .nav-icon {
      stroke: var(--primary-blue);
    }

    .nav-label {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-secondary);
      transition: color 0.15s;
    }

    .nav-item.active .nav-label {
      color: var(--primary-blue);
      font-weight: 600;
    }

    /* buttons */
    .btn-primary {
      background: var(--primary-blue);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 8px 16px -6px rgba(37,99,235,0.3);
    }
    .btn-primary:active { transform: scale(0.98); background: #1e4fd0; }

    /* links */
    .link-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 24px;
      font-size: 0.8rem;
    }
    .link-row span {
      color: var(--text-secondary);
      text-decoration: underline;
      cursor: pointer;
    }

    /* modal overlay */
    .modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-content {
      background: var(--card-bg);
      width: 280px;
      padding: 24px;
      border-radius: 32px;
      color: var(--text-primary);
      box-shadow: 0 20px 30px #00000040;
      text-align: center;
    }
    .modal-content h3 { margin-bottom: 12px; }
    .modal-close {
      margin-top: 20px;
      background: var(--primary-blue);
      border: none;
      color: white;
      padding: 10px 18px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
    }

    /* cards / dashboard */
    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 6px 14px var(--shadow-color);
    }

    .row-space {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .badge {
      background: var(--accent-light);
      color: var(--primary-blue);
      padding: 6px 12px;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .progress-bar {
      height: 8px;
      background: var(--border-light);
      border-radius: 20px;
      margin: 12px 0;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary-blue), var(--accent-blue));
      border-radius: 20px;
      transition: width 0.3s ease;
    }

    .fact-item {
      border-left: 3px solid var(--primary-blue);
      padding-left: 12px;
      margin: 14px 0;
      color: var(--text-primary);
      font-size: 0.95rem;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-cell {
      background: var(--bg-primary);
      padding: 12px;
      border-radius: 18px;
      text-align: center;
    }

    .icon-small {
      width: 32px;
      height: 32px;
      stroke: var(--primary-blue);
      fill: none;
      stroke-width: 2;
    }

    /* charts (minimal) */
    .chart-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 100px;
      margin: 20px 0;
    }
    .bar {
      flex: 1;
      background: linear-gradient(to top, #2563EB, #38BDF8);
      border-radius: 8px 8px 4px 4px;
      transition: height 0.4s;
    }

    /* switch */
    .switch { display: flex; align-items: center; gap: 12px; }
    .toggle {
      width: 46px; height: 24px; background: var(--icon-inactive);
      border-radius: 40px; position: relative; cursor: pointer;
    }
    .toggle::after {
      content: ''; width: 20px; height: 20px; background: white;
      border-radius: 50%; position: absolute; top: 2px; left: 2px;
      transition: 0.2s;
    }
    .dark .toggle::after { left: 24px; }

    /* variable themes */
    :root {
      --primary-blue: #2563EB;
      --secondary-blue: #1E40AF;
      --accent-blue: #38BDF8;
      --bg-primary: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --icon-inactive: #94A3B8;
      --border-light: #E2E8F0;
      --shadow-color: rgba(0,0,0,0.04);
      --card-hover: #F1F5F9;
      --accent-light: #DBEAFE;
    }
    .dark {
      --bg-primary: #0F172A;
      --card-bg: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --icon-inactive: #64748B;
      --border-light: #334155;
      --shadow-color: #02061780;
      --card-hover: #2D3A4F;
      --accent-light: #1E3A5F;
    }

    /* icon definitions */
    .hide { display: none; }
    .screen-content { display: block; }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <!-- dynamic header + screens -->
  <div class="screen" id="screenContainer">
    <!-- header injected via JS -->
  </div>
  <!-- bottom nav -->
  <div class="bottom-nav" id="bottomNav"></div>
</div>

<!-- hidden icon sprite (just for reuse, but we use inline per icon) -->
<script>
(function() {
  // ---------- constants & theme ----------
  const PRIMARY = '#2563EB';
  const INACTIVE = '#94A3B8';

  let currentTheme = 'light';
  let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
  let screenshotCounter = 1;

  // ---------- SVG icons as reusable functions (outline, 2px stroke, rounded) ----------
  function iconHome(active = false) { return `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M5 12l-2 2 9-9 9 9-2-2-7-7-7 7z M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" stroke="${active ? PRIMARY : INACTIVE}" fill="none"/></svg>`; }
  function iconLearn(active = false) { return `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" stroke="${active ? PRIMARY : INACTIVE}" fill="none"/></svg>`; }
  function iconProgress(active = false) { return `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 12v-2a5 5 0 0 0-5-5h-2M3 12v-2a5 5 0 0 1 5-5h2M12 3v18M9 21h6" stroke="${active ? PRIMARY : INACTIVE}" fill="none"/><circle cx="12" cy="12" r="2" stroke="${active ? PRIMARY : INACTIVE}" fill="none"/></svg>`; }
  function iconSettings(active = false) { return `<svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="${active ? PRIMARY : INACTIVE}" fill="none"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.03.03A10 10 0 0 0 12 17.66a10 10 0 0 0 6.37-2.63z M4.73 8.91A10 10 0 0 1 12 5.3a10 10 0 0 1 7.27 3.61" stroke="${active ? PRIMARY : INACTIVE}" fill="none"/></svg>`; }
  function iconProfile() { return `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="${currentTheme==='dark'?'#E2E8F0':'#0F172A'}" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`; }
  function iconFlashcard() { return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${PRIMARY}" stroke-width="2"><path d="M4 4h16v16H4z M8 8h8M8 12h6"/></svg>`; }
  function iconChart() { return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${PRIMARY}" stroke-width="2"><path d="M21 21H4V4M7 15v4M12 11v8M17 7v12"/></svg>`; }
  function iconPlay() { return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${PRIMARY}" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>`; }
  function iconCheck() { return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${PRIMARY}" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>`; }

  // ---------- screen templates ----------
  function getHeader(title) {
    return `<div class="header"><h2>${title}</h2><div class="profile-icon" id="profileBtn">${iconProfile()}</div></div>`;
  }

  function onboardingScreen() {
    return `
      ${getHeader('CodeFlow')}
      <div style="flex:1; display: flex; flex-direction: column; justify-content: center;">
        <div style="margin-bottom: 20px;">${iconFlashcard()}${iconChart()}${iconPlay()}</div>
        <h1 style="font-size: 2.2rem; font-weight:700; color: var(--primary-blue);">CodeFlow</h1>
        <p style="font-size:1.2rem; color: var(--text-primary);">daily science facts</p>
        <p style="margin: 16px 0; color: var(--text-secondary);">Absorb a stunning science fact every day. Short, visual, and mind‑expanding.</p>
        <button class="btn-primary" id="getStartedBtn">Get Started</button>
        <div class="link-row">
          <span id="privacyLink">Privacy Policy</span>
          <span id="termsLink">Terms of Service</span>
        </div>
      </div>
    `;
  }

  function homeDashboard() {
    return `
      ${getHeader('Home')}
      <div class="card">
        <div class="row-space"><span>🌟 daily fact</span><span class="badge">new</span></div>
        <div class="fact-item">A teaspoon of neutron star weighs 6 billion tons.</div>
        <div class="progress-bar"><div class="progress-fill" style="width:65%"></div></div>
        <div style="display: flex; gap:8px; margin-top:8px">${iconPlay()}<span>continue streak: 12 days</span></div>
      </div>
      <div class="card">
        <div class="row-space"><span>📚 today’s picks</span><span>see all →</span></div>
        <div style="display:flex; gap:12px; align-items:center; margin:10px 0"><span>🧠 quantum entanglement</span>${iconFlashcard()}</div>
        <div style="display:flex; gap:12px; align-items:center"><span>⚡ electricity from lemons</span>${iconPlay()}</div>
      </div>
      <div class="card">
        <span>🏆 achievements</span>
        <div style="display:flex; gap:16px; margin-top:12px">
          <span>🔥 7 day</span><span>⭐ novice</span><span>📘 10 facts</span>
        </div>
      </div>
    `;
  }

  function learnScreen() {
    return `
      ${getHeader('Learn')}
      <div class="card">
        <div class="row-space"><span>⚡ science flash</span><span>${iconFlashcard()}</span></div>
        <div style="display:flex; justify-content:space-between;"><span>Physics</span><span>85%</span></div><div class="progress-bar"><div class="progress-fill" style="width:85%"></div></div>
        <div style="display:flex; justify-content:space-between; margin-top:12px;"><span>Biology</span><span>42%</span></div><div class="progress-bar"><div class="progress-fill" style="width:42%"></div></div>
        <button class="btn-primary" style="margin-top:16px;" id="startPracticeBtn">start practice →</button>
      </div>
      <div class="card">
        <span>📖 today's lesson:引力 waves</span>
        <p style="margin:8px 0; color:var(--text-secondary)">ripples in spacetime...</p>
        <span>${iconPlay()} 5 min read</span>
      </div>
    `;
  }

  function progressScreen() {
    return `
      ${getHeader('Progress')}
      <div class="card">
        <span>📊 last 7 days</span>
        <div class="chart-row">
          <div class="bar" style="height:30px"></div><div class="bar" style="height:50px"></div><div class="bar" style="height:70px"></div>
          <div class="bar" style="height:40px"></div><div class="bar" style="height:90px"></div><div class="bar" style="height:60px"></div><div class="bar" style="height:30px"></div>
        </div>
      </div>
      <div class="card stat-grid">
        <div class="stat-cell"><span>🧠 facts</span><br><strong>147</strong></div>
        <div class="stat-cell"><span>🔥 streak</span><br><strong>12</strong></div>
        <div class="stat-cell"><span>⚡ quizzes</span><br><strong>34</strong></div>
        <div class="stat-cell"><span>🏅 level</span><br><strong>4</strong></div>
      </div>
      <div class="card">${iconChart()}  accuracy 88% <div class="progress-bar"><div class="progress-fill" style="width:88%"></div></div></div>
    `;
  }

  function settingsScreen() {
    return `
      ${getHeader('Settings')}
      <div class="card">
        <div class="switch">
          <span>🌓 dark mode</span>
          <div class="toggle" id="themeToggle"></div>
        </div>
      </div>
      <div class="card">
        <div>🔔 notifications</div>
        <div style="margin-top:12px;">🔒 privacy</div>
        <div style="margin-top:12px;" id="profileSettingsOption">👤 profile (you)</div>
      </div>
    `;
  }

  // ---------- render navigation & screen ----------
  function renderScreen() {
    const container = document.getElementById('screenContainer');
    let html = '';
    if (currentScreen === 'onboarding') html = onboardingScreen();
    else if (currentScreen === 'home') html = homeDashboard();
    else if (currentScreen === 'learn') html = learnScreen();
    else if (currentScreen === 'progress') html = progressScreen();
    else if (currentScreen === 'settings') html = settingsScreen();

    container.innerHTML = html;

    // re-attach header profile click
    const profileBtn = document.getElementById('profileBtn');
    if (profileBtn) profileBtn.addEventListener('click', () => { currentScreen = 'settings'; renderScreen(); renderNav(); });

    // onboarding button & links
    const getStarted = document.getElementById('getStartedBtn');
    if (getStarted) getStarted.addEventListener('click', () => { currentScreen = 'home'; renderScreen(); renderNav(); });

    const privacy = document.getElementById('privacyLink');
    const terms = document.getElementById('termsLink');
    if (privacy) privacy.addEventListener('click', () => showModal('Privacy Policy', 'We respect your data. No selling.'));
    if (terms) terms.addEventListener('click', () => showModal('Terms of Service', 'Use responsibly. Be curious.'));

    const startPractice = document.getElementById('startPracticeBtn');
    if (startPractice) startPractice.addEventListener('click', () => { alert('practice session started! (simulated)'); });

    // theme toggle in settings
    const toggle = document.getElementById('themeToggle');
    if (toggle) {
      toggle.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        currentTheme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        renderScreen(); renderNav();  // icons need update
      });
    }
  }

  function renderNav() {
    const nav = document.getElementById('bottomNav');
    const items = [
      { id: 'home', label: 'Home', icon: iconHome },
      { id: 'learn', label: 'Learn', icon: iconLearn },
      { id: 'progress', label: 'Progress', icon: iconProgress },
      { id: 'settings', label: 'Settings', icon: iconSettings },
    ];
    nav.innerHTML = items.map(item => {
      const active = currentScreen === item.id;
      return `<div class="nav-item ${active ? 'active' : ''}" data-screen="${item.id}">
        ${item.icon(active)}<span class="nav-label">${item.label}</span>
      </div>`;
    }).join('');

    nav.querySelectorAll('.nav-item').forEach(el => {
      el.addEventListener('click', (e) => {
        const screen = el.dataset.screen;
        if (screen) { currentScreen = screen; renderScreen(); renderNav(); }
      });
    });
  }

  // modal system
  function showModal(title, text) {
    const modalDiv = document.createElement('div');
    modalDiv.className = 'modal';
    modalDiv.innerHTML = `<div class="modal-content"><h3>${title}</h3><p>${text}</p><button class="modal-close" id="modalCloseBtn">OK</button></div>`;
    document.querySelector('.phone').appendChild(modalDiv);
    document.getElementById('modalCloseBtn').addEventListener('click', () => modalDiv.remove());
  }

  // screenshot (shift+W)
  window.addEventListener('keydown', (e) => {
    if (e.shiftKey && e.key === 'W') {
      e.preventDefault();
      const phone = document.getElementById('phoneContainer');
      // In real html2canvas not available; we simulate: generate sequential name
      let filename = screenshotCounter + '.png';
      if (currentTheme === 'dark' && screenshotCounter === 1) filename = '6.png'; // but we want dark = 6.png rule: if dark then 6.png only if dark first? we respect spec: if dark mode enabled screenshot must be 6.png
      if (currentTheme === 'dark') filename = '6.png';
      else filename = screenshotCounter + '.png';
      alert(`📸 screenshot captured: ${filename} (simulated)`);
      screenshotCounter = screenshotCounter === 5 ? 1 : screenshotCounter+1; // cycle
    }
  });

  // initial render
  renderScreen();
  renderNav();

  // output json at the very bottom after all code
  window.onload = function() {
    // will be printed after HTML
  }
})();
</script>
</body>
</html>
All done!
