```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VocabVault · English builder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --text-muted: #64748B;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --border-light: #E2E8F0;
      --icon-inactive: #94A3B8;
      --nav-highlight: rgba(37, 99, 235, 0.08);
      --progress-bg: #E2E8F0;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.02), 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    body.dark {
      --bg: #0F172A;
      --card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --border-light: #334155;
      --icon-inactive: #64748B;
      --nav-highlight: rgba(59, 130, 246, 0.15);
      --progress-bg: #334155;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    body {
      background: #1a1e2b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    /* phone frame */
    .phone {
      width: 360px;
      height: 780px;
      background-color: var(--bg);
      border-radius: 42px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3), 0 0 0 8px #2c2f3a;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s;
    }

    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: none;
      background: var(--bg);
      transition: background 0.2s;
    }
    .screen::-webkit-scrollbar { display: none; }

    /* header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 8px;
      background: var(--bg);
      border-bottom: 1px solid var(--border-light);
    }
    .header h2 {
      font-size: 22px;
      font-weight: 650;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      transition: background 0.2s;
    }
    .profile-btn:hover { background: var(--nav-highlight); }

    /* bottom nav */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 8px 8px;
      background: var(--card);
      border-top: 1px solid var(--border-light);
      backdrop-filter: blur(4px);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
      border: none;
      gap: 4px;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 20px;
      transition: all 0.15s ease;
      color: var(--icon-inactive);
      fill: var(--icon-inactive);
    }
    .nav-item.active {
      background: var(--nav-highlight);
      color: var(--primary);
      fill: var(--primary);
      transform: scale(1.05);
    }
    .nav-item.active svg { stroke: var(--primary); }
    .nav-item svg { stroke: currentColor; transition: stroke 0.15s; }
    .nav-item span {
      font-size: 11px;
      font-weight: 500;
    }

    /* content */
    .content {
      flex: 1;
      padding: 16px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* cards */
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 18px 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-light);
    }

    .flex-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge {
      background: var(--accent);
      color: #0F172A;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 40px;
      font-size: 12px;
    }

    .progress-bar {
      height: 8px;
      background: var(--progress-bg);
      border-radius: 40px;
      margin: 12px 0 6px;
      overflow: hidden;
    }
    .progress-fill {
      height: 8px;
      background: var(--primary);
      width: 0%;
      border-radius: 40px;
      transition: width 0.3s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      width: 100%;
    }
    .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }

    .small-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
    }

    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal.hidden { display: none; }
    .modal-card {
      background: var(--card);
      padding: 28px;
      border-radius: 32px;
      max-width: 280px;
      text-align: center;
      color: var(--text-primary);
    }

    .lesson-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .lesson-icon {
      background: rgba(37,99,235,0.1);
      padding: 8px;
      border-radius: 18px;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .stat-cell {
      background: var(--bg);
      padding: 16px;
      border-radius: 20px;
      text-align: center;
    }

    /* icons */
    .icon { width: 24px; height: 24px; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .icon-small { width: 20px; height: 20px; stroke-width: 2; }
    .icon-large { width: 32px; height: 32px; }

    /* theme toggle */
    .theme-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
    }
    .switch {
      width: 48px;
      height: 24px;
      background: var(--icon-inactive);
      border-radius: 40px;
      appearance: none;
      cursor: pointer;
      position: relative;
    }
    .switch:checked { background: var(--primary); }
    .switch::before {
      content: '';
      width: 20px; height: 20px; background: white; border-radius: 50%;
      position: absolute; top: 2px; left: 2px; transition: 0.15s;
    }
    .switch:checked::before { left: 26px; }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <!-- dynamic header + screens -->
  <div id="app"></div>
</div>

<script>
  (function() {
    // ---------- THEME ----------
    let darkMode = false;
    const themeToggle = () => { darkMode = !darkMode; document.body.classList.toggle('dark', darkMode); render(); };

    // ---------- SCREEN STATE ----------
    let currentScreen = 'onboarding'; // onboarding | home | learn | progress | settings
    let modalContent = null; // null / 'privacy' / 'terms'

    // ---------- ICONS (inline svg) ----------
    const icons = {
      home: `<svg class="icon" viewBox="0 0 24 24"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 L3 10 Z" stroke="currentColor"/></svg>`,
      learn: `<svg class="icon" viewBox="0 0 24 24"><path d="M2 6 L12 2 L22 6 L12 10 L2 6 Z M2 6 L2 16 L12 20 L22 16 L22 6" stroke="currentColor"/><path d="M8 9 L8 13" stroke="currentColor"/><path d="M16 9 L16 13" stroke="currentColor"/></svg>`,
      progress: `<svg class="icon" viewBox="0 0 24 24"><path d="M21 12 L21 20 L3 20 L3 4 L9 4 L9 12 L15 12 L15 6 L21 6 L21 12 Z" stroke="currentColor"/></svg>`,
      settings: `<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor"/><path d="M19.4 15 L20.6 18 L18 20.6 L15 19.4 L12 21 L9 19.4 L6 20.6 L3.4 18 L4.6 15 L3 12 L4.6 9 L3.4 6 L6 3.4 L9 4.6 L12 3 L15 4.6 L18 3.4 L20.6 6 L19.4 9 L21 12 L19.4 15 Z" stroke="currentColor"/></svg>`,
      profile: `<svg class="icon" viewBox="0 0 24 24"><path d="M5 20 L5 17 C5 13 8 11 12 11 C16 11 19 13 19 17 L19 20" stroke="currentColor"/><circle cx="12" cy="7" r="4" stroke="currentColor"/></svg>`,
      lesson: `<svg class="icon-small" viewBox="0 0 24 24"><path d="M4 6 L12 2 L20 6 L12 10 L4 6 Z M4 6 L4 16 L12 20 L20 16 L20 6" stroke="currentColor"/></svg>`,
      chart: `<svg class="icon-small" viewBox="0 0 24 24"><path d="M3 17 L9 11 L13 15 L21 7" stroke="currentColor"/><path d="M3 21 L21 21" stroke="currentColor"/></svg>`,
      flashcards: `<svg class="icon-small" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor"/><path d="M9 8 L15 8 M9 12 L13 12" stroke="currentColor"/></svg>`,
      play: `<svg class="icon-small" viewBox="0 0 24 24"><polygon points="8,6 20,12 8,18 8,6" stroke="currentColor"/></svg>`,
      check: `<svg class="icon-small" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" stroke="currentColor"/></svg>`,
    };

    // ---------- HELPERS ----------
    function navigate(screen) { currentScreen = screen; render(); }
    function openModal(type) { modalContent = type; render(); }
    function closeModal() { modalContent = null; render(); }

    // ---------- SCREENSHOT (shift+W) ----------
    let screenshotCounter = 0;
    document.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        const container = document.getElementById('phoneContainer');
        if (!container) return;
        import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
          html2canvas(container, { backgroundColor: null }).then(canvas => {
            const link = document.createElement('a');
            const isDark = document.body.classList.contains('dark');
            const name = isDark ? '6.png' : (++screenshotCounter + '.png');
            if (!isDark && screenshotCounter > 5) screenshotCounter = 1;
            link.download = name;
            link.href = canvas.toDataURL('image/png');
            link.click();
          });
        });
      }
    });

    // ---------- RENDER MAIN ----------
    function render() {
      const headerTitle = {
        onboarding: 'Welcome', home: 'Home', learn: 'Lessons', progress: 'Progress', settings: 'Settings'
      }[currentScreen] || 'VocabVault';

      const appEl = document.getElementById('app');
      if (!appEl) return;

      // header (except onboarding minimal? we keep same style)
      const header = `
        <div class="header">
          <h2>${headerTitle}</h2>
          <button class="profile-btn" onclick="window.navigateToSettings()">${icons.profile}</button>
        </div>
      `;

      // content
      let contentHtml = '';
      if (currentScreen === 'onboarding') contentHtml = renderOnboarding();
      else if (currentScreen === 'home') contentHtml = renderHome();
      else if (currentScreen === 'learn') contentHtml = renderLearn();
      else if (currentScreen === 'progress') contentHtml = renderProgress();
      else if (currentScreen === 'settings') contentHtml = renderSettings();

      // bottom nav (hidden for onboarding)
      const navHtml = currentScreen === 'onboarding' ? '' : `
        <div class="bottom-nav">
          <button class="nav-item ${currentScreen==='home'?'active':''}" onclick="window.navigate('home')">${icons.home}<span>Home</span></button>
          <button class="nav-item ${currentScreen==='learn'?'active':''}" onclick="window.navigate('learn')">${icons.learn}<span>Learn</span></button>
          <button class="nav-item ${currentScreen==='progress'?'active':''}" onclick="window.navigate('progress')">${icons.progress}<span>Progress</span></button>
          <button class="nav-item ${currentScreen==='settings'?'active':''}" onclick="window.navigate('settings')">${icons.settings}<span>Settings</span></button>
        </div>
      `;

      // modal
      const modalHtml = modalContent ? `
        <div class="modal" onclick="closeModal()">
          <div class="modal-card" onclick="event.stopPropagation()">
            <h3 style="margin-bottom:12px">${modalContent==='privacy'?'Privacy Policy':'Terms of Service'}</h3>
            <p style="margin-bottom:20px">This is a demo prototype. No data is collected.</p>
            <button class="btn-primary" onclick="closeModal()">OK</button>
          </div>
        </div>
      ` : '';

      appEl.innerHTML = `
        <div class="screen">
          ${currentScreen !== 'onboarding' ? header : ''}
          <div class="content">
            ${contentHtml}
          </div>
          ${navHtml}
        </div>
        ${modalHtml}
      `;
    }

    function renderOnboarding() {
      return `
        <div style="display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:32px;">
          <div style="background:rgba(37,99,235,0.1); padding:16px; border-radius:48px; margin-bottom:24px;">${icons.learn.replace('icon','icon-large')}</div>
          <h1 style="font-size:34px; font-weight:700; color:var(--text-primary);">VocabVault</h1>
          <p style="font-size:18px; color:var(--accent); margin:8px 0 12px;">build your English, one word at a time</p>
          <p style="color:var(--text-secondary); max-width:260px; margin-bottom:32px;">Master 3000+ words with smart flashcards and daily challenges.</p>
          <button class="btn-primary" style="margin-bottom:20px;" onclick="window.navigate('home')">Get Started</button>
          <div style="display:flex; gap:28px; margin-bottom:20px;">
            <button class="small-link" onclick="openModal('privacy')">Privacy</button>
            <button class="small-link" onclick="openModal('terms')">Terms</button>
          </div>
        </div>
      `;
    }

    function renderHome() {
      return `
        <div class="card">
          <div class="flex-row"><span style="font-weight:600">Daily goal</span> <span class="badge">+15 XP</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div>
          <div class="flex-row" style="margin-top:8px"><span>1,240 words</span> <span>🔥 12 day streak</span></div>
        </div>
        <div class="card">
          <div class="flex-row" style="margin-bottom:12px"><span style="font-weight:600">Continue lesson</span> <span>👇</span></div>
          <div class="lesson-item"><span class="lesson-icon">${icons.flashcards}</span><div><b>Irregular verbs</b><p style="font-size:12px">7/10 mastered</p></div></div>
          <div class="lesson-item"><span class="lesson-icon">${icons.play}</span><div><b>Phrasal verbs</b><p style="font-size:12px">start · 5 min</p></div></div>
          <button class="btn-primary" style="margin-top:12px;padding:12px;" onclick="window.navigate('learn')">Start practice</button>
        </div>
        <div style="display:flex; gap:12px; justify-content:center;">
          <span class="badge">🎯 5 new words</span><span class="badge">📘 quiz ready</span>
        </div>
      `;
    }

    function renderLearn() {
      return `
        <div class="card">
          <h3 style="margin-bottom:12px">Todays picks</h3>
          <div class="lesson-item"><span class="lesson-icon">${icons.flashcards}</span><div><b>Collocations</b><span style="margin-left:8px;font-size:13px">🔁 8 cards</span></div></div>
          <div class="lesson-item"><span class="lesson-icon">${icons.play}</span><div><b>Listening quiz</b><span style="margin-left:8px;font-size:13px">🎧 5 min</span></div></div>
          <div class="lesson-item"><span class="lesson-icon">${icons.lesson}</span><div><b>Word origins</b><span style="margin-left:8px;font-size:13px">📖 short read</span></div></div>
        </div>
        <div class="card">
          <div class="flex-row"><span>Recommended</span><span>view all</span></div>
          <div class="progress-bar" style="margin:16px 0 6px"><div class="progress-fill" style="width:35%"></div></div>
          <span style="font-size:13px">35% of B2 level completed</span>
        </div>
      `;
    }

    function renderProgress() {
      return `
        <div class="card">
          <div class="flex-row"><span>This week</span>${icons.chart}</div>
          <div style="display:flex; gap:6px; margin:16px 0; height:70px; align-items:flex-end;">
            <div style="flex:1; background:var(--primary); height:30px; border-radius:12px;"></div>
            <div style="flex:1; background:var(--primary); height:48px; border-radius:12px;"></div>
            <div style="flex:1; background:var(--primary); height:22px; border-radius:12px;"></div>
            <div style="flex:1; background:var(--primary); height:60px; border-radius:12px;"></div>
            <div style="flex:1; background:var(--accent); height:40px; border-radius:12px;"></div>
            <div style="flex:1; background:var(--accent); height:34px; border-radius:12px;"></div>
            <div style="flex:1; background:var(--accent); height:20px; border-radius:12px;"></div>
          </div>
          <div class="stat-grid">
            <div class="stat-cell"><b>2.4k</b><p style="font-size:13px">words learned</p></div>
            <div class="stat-cell"><b>48</b><p style="font-size:13px">lessons done</p></div>
          </div>
        </div>
        <div class="card"><span>🏆 Achievements</span><div style="display:flex; gap:12px; margin-top:16px;">🔥 12 day streak · ⚡ 5 rapid · 🎯 master</div></div>
      `;
    }

    function renderSettings() {
      return `
        <div class="card">
          <div class="flex-row"><span>Dark mode</span> <input type="checkbox" class="switch" ${darkMode?'checked':''} onchange="window.toggleTheme()"></div>
        </div>
        <div class="card">
          <div class="lesson-item">${icons.profile} Profile details</div>
          <div class="lesson-item">${icons.settings} Notifications</div>
          <div class="lesson-item">${icons.settings} Language: English</div>
        </div>
        <div class="card" style="text-align:center; color:var(--text-muted); font-size:13px;">VocabVault v1.0 · demo prototype</div>
      `;
    }

    // expose globals
    window.navigate = navigate;
    window.navigateToSettings = () => navigate('settings');
    window.openModal = openModal;
    window.closeModal = closeModal;
    window.toggleTheme = () => { themeToggle(); render(); };

    // initial render
    render();
  })();
</script>
</body>
</html>
All done!
