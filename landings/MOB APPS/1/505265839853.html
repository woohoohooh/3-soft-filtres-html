```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Brain Trainer · prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --shadow: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,0,0,0.05);
            --nav-bg: rgba(255,255,255,0.85);
            --backdrop: #F1F5F9;
        }

        [data-theme="dark"] {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --shadow: 0 8px 20px rgba(0,0,0,0.5);
            --nav-bg: rgba(30,41,59,0.9);
            --backdrop: #0B1120;
        }

        body {
            background: #11141f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2c2f36;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
        }

        /* main app screen (view container) */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) transparent;
            padding-bottom: 4px;
        }

        .app-screen::-webkit-scrollbar {
            width: 4px;
        }

        .app-screen::-webkit-scrollbar-thumb {
            background: var(--inactive);
            border-radius: 20px;
        }

        /* header (fixed inside scroll) */
        .header {
            padding: 16px 20px 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: transparent;
            position: sticky;
            top: 0;
            background-color: var(--bg);
            z-index: 10;
            backdrop-filter: blur(4px);
        }

        .header-title {
            font-size: 22px;
            font-weight: 650;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }

        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 6px 2px 6px;
            border-radius: 30px;
            transition: 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-btn:hover { background: var(--border-light); }

        /* bottom navigation */
        .bottom-nav {
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 12px;
            border-radius: 0 0 44px 44px;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            gap: 4px;
            color: var(--inactive);
            fill: var(--inactive);
        }

        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            transform: scale(1.05);
        }

        .nav-item.active .nav-icon {
            filter: drop-shadow(0 2px 6px rgba(37,99,235,0.3));
        }

        .nav-icon {
            width: 26px;
            height: 26px;
            transition: 0.15s;
        }

        .nav-label {
            font-size: 11px;
            font-weight: 500;
        }

        /* cards */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px 16px;
            margin: 12px 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }

        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-bar {
            height: 8px;
            background: var(--border-light);
            border-radius: 20px;
            margin: 12px 0 6px;
            overflow: hidden;
        }

        .progress-fill {
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 20px;
        }

        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 30px;
        }

        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 16px 24px;
            border-radius: 60px;
            font-size: 18px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 8px 16px -6px var(--primary-dark);
            transition: 0.1s;
        }
        .btn-primary:active { transform: scale(0.97); }

        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .modal-content {
            background: var(--card);
            padding: 28px;
            border-radius: 36px;
            width: 280px;
            text-align: center;
            color: var(--text-primary);
        }

        .legal-link {
            background: none;
            border: none;
            color: var(--inactive);
            text-decoration: underline;
            font-size: 14px;
            margin: 8px;
            cursor: pointer;
        }

        /* hidden screenshot canvas */
        #screenshot-canvas {
            display: none;
        }

        /* icon sprite (inline) */
        .icon-svg {
            width: 26px;
            height: 26px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="phone" id="phoneContainer" data-theme="light">
        <!-- dynamic screen container -->
        <div id="appScreen" class="app-screen"></div>
        <!-- bottom nav -->
        <nav class="bottom-nav" id="bottomNav">
            <button class="nav-item" data-nav="home"><span class="nav-icon" id="icon-home"></span><span class="nav-label">Home</span></button>
            <button class="nav-item" data-nav="learn"><span class="nav-icon" id="icon-learn"></span><span class="nav-label">Learn</span></button>
            <button class="nav-item" data-nav="progress"><span class="nav-icon" id="icon-progress"></span><span class="nav-label">Progress</span></button>
            <button class="nav-item" data-nav="settings"><span class="nav-icon" id="icon-settings"></span><span class="nav-label">Settings</span></button>
        </nav>
    </div>

    <!-- hidden canvas for screenshot -->
    <canvas id="screenshot-canvas" width="360" height="780"></canvas>

    <script>
        (function() {
            // ---------- SVG Icons (inline, 2px stroke, rounded) ----------
            const icons = {
                home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z"/></svg>`,
                learn: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 6L12 2L22 6L12 10L2 6Z"/><path d="M6 10v6c4 2 8 2 12 0v-6"/></svg>`,
                progress: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l3-3 3 3 4-4"/><path d="M17 6h4v4"/></svg>`,
                settings: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82L12 22z"/><path d="M4.6 9a1.65 1.65 0 0 0-.33 1.82c.26.61.86 1 1.51 1h12.44a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82L12 2z"/></svg>`,
                profile: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
                lesson: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M8 8h8M8 12h6"/></svg>`,
                chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2"/><path d="M7 10l3-3 3 3 4-4"/><path d="M17 6h4v4"/></svg>`,
                flashcards: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M9 9h6v6H9z"/></svg>`,
                play: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>`,
                check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>`
            };

            // inject icons into placeholders
            function injectIcons() {
                for (let [key, svg] of Object.entries(icons)) {
                    let el = document.getElementById(`icon-${key}`);
                    if (el) el.innerHTML = svg;
                }
                // also for dynamic icons
            }

            // ---------- App state ----------
            let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
            let theme = 'light'; // light/dark

            // ---------- render functions ----------
            function render() {
                const container = document.getElementById('appScreen');
                const html = getScreenHTML(currentScreen);
                container.innerHTML = html;
                // re-inject icons for dynamic parts
                document.querySelectorAll('[data-icon]').forEach(el => {
                    const name = el.dataset.icon;
                    if (icons[name]) el.innerHTML = icons[name];
                });
                updateActiveNav();
                attachListeners();
            }

            function getScreenHTML(screen) {
                switch(screen) {
                    case 'onboarding': return renderOnboarding();
                    case 'home': return renderHome();
                    case 'learn': return renderLearn();
                    case 'progress': return renderProgress();
                    case 'settings': return renderSettings();
                    default: return renderHome();
                }
            }

            // header partial (title + profile)
            function renderHeader(title) {
                return `<div class="header"><span class="header-title">${title}</span><button class="profile-btn" id="profileHeaderBtn"><span class="nav-icon" data-icon="profile" style="color:var(--text-primary)"></span></button></div>`;
            }

            function renderOnboarding() {
                return `
                    ${renderHeader('Math Brain')}
                    <div style="padding:20px; text-align:center;">
                        <div style="background:var(--primary); width:80px; height:80px; border-radius:26px; margin:20px auto; display:flex; align-items:center; justify-content:center;">
                            <span class="nav-icon" data-icon="flashcards" style="color:white; width:48px; height:48px;"></span>
                        </div>
                        <h1 style="font-size:34px; font-weight:700; color:var(--text-primary);">Math Brain</h1>
                        <p style="font-size:18px; color:var(--accent); font-weight:500;">trainer · daily logic</p>
                        <p style="color:var(--text-secondary); margin:20px 0;">Boost mental math & logic with 5-min brain games. Personalized drills, instant feedback.</p>
                        <button class="btn-primary" id="getStartedBtn">Get Started</button>
                        <div style="margin-top:32px;">
                            <button class="legal-link" id="privacyLink">Privacy Policy</button>
                            <button class="legal-link" id="termsLink">Terms of Service</button>
                        </div>
                    </div>
                `;
            }

            function renderHome() {
                return `
                    ${renderHeader('Dashboard')}
                    <div class="card">
                        <div class="flex-row"><span style="font-weight:600;">Daily puzzle</span><span class="badge">+10 XP</span></div>
                        <div style="font-size:28px; font-weight:700; margin:8px 0;">28 + 17</div>
                        <div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div>
                        <div style="display:flex; gap:8px; margin-top:12px;">
                            <button class="nav-item" style="flex-direction:row; gap:6px; background:var(--primary); color:white; border-radius:40px; padding:8px 16px;" id="quickPractice"><span class="nav-icon" data-icon="play"></span> practice</button>
                        </div>
                    </div>
                    <div class="card">
                        <div class="flex-row"><span style="font-weight:600;">continue</span><span>🔥 5 day streak</span></div>
                        <div style="display:flex; gap:12px; margin:10px 0;">
                            <span class="badge" style="background:#2563EB20; color:var(--primary);">➕ addition</span>
                            <span class="badge" style="background:#2563EB20; color:var(--primary);">✖️ multiplication</span>
                        </div>
                    </div>
                    <div class="card">
                        <span style="font-weight:600;">today's goal</span>
                        <div class="progress-bar" style="margin:8px 0;"><div class="progress-fill" style="width:30%"></div></div>
                        <span style="color:var(--text-secondary);">3/10 exercises</span>
                    </div>
                `;
            }

            function renderLearn() {
                return `
                    ${renderHeader('Learn')}
                    <div class="card" style="display:flex; gap:12px; flex-direction:column;">
                        <div class="flex-row"><span data-icon="lesson" class="nav-icon"></span> <span style="flex:1; margin-left:8px;">Addition level 1</span> <span>▶️</span></div>
                        <div class="flex-row"><span data-icon="lesson" class="nav-icon"></span> <span style="flex:1; margin-left:8px;">Multiplication tables</span> <span>🔒</span></div>
                        <div class="flex-row"><span data-icon="flashcards" class="nav-icon"></span> <span style="flex:1; margin-left:8px;">Logic puzzles</span> <span>🔄</span></div>
                    </div>
                    <div class="card">
                        <span style="font-weight:600;">recommended</span>
                        <div style="display:flex; gap:10px; margin-top:12px;"><span class="badge">quick 5 min</span><span class="badge">new</span></div>
                    </div>
                `;
            }

            function renderProgress() {
                return `
                    ${renderHeader('Progress')}
                    <div class="card">
                        <span style="font-weight:600;">weekly activity</span>
                        <div style="height:90px; display:flex; align-items:flex-end; gap:8px; margin: 10px 0;">
                            <div style="background:var(--primary); width:20%; height:40px; border-radius:10px;"></div>
                            <div style="background:var(--primary); width:20%; height:70px; border-radius:10px;"></div>
                            <div style="background:var(--accent); width:20%; height:55px; border-radius:10px;"></div>
                            <div style="background:var(--primary); width:20%; height:80px; border-radius:10px;"></div>
                            <div style="background:var(--inactive); width:20%; height:30px; border-radius:10px;"></div>
                        </div>
                    </div>
                    <div class="card flex-row"><span>🏅 logic master</span><span data-icon="check" class="nav-icon" style="color:green;"></span></div>
                    <div class="card"><span>total sessions: 43</span></div>
                `;
            }

            function renderSettings() {
                return `
                    ${renderHeader('Settings')}
                    <div class="card">
                        <div class="flex-row"><span>Dark mode</span><label><input type="checkbox" id="themeToggle" ${theme==='dark'?'checked':''}></label></div>
                        <div style="margin-top:20px;">🔔 notifications</div>
                        <div>🌐 language</div>
                    </div>
                    <div class="card">
                        <span>profile</span>
                        <div class="flex-row">username<span>math_wiz</span></div>
                    </div>
                `;
            }

            // update bottom nav active
            function updateActiveNav() {
                document.querySelectorAll('.nav-item').forEach(el => {
                    const nav = el.dataset.nav;
                    if ((currentScreen === 'onboarding' && nav === 'home') || currentScreen === nav) {
                        el.classList.add('active');
                    } else {
                        el.classList.remove('active');
                    }
                });
            }

            function attachListeners() {
                // profile header
                const profileBtn = document.getElementById('profileHeaderBtn');
                if (profileBtn) profileBtn.addEventListener('click', (e) => { e.stopPropagation(); currentScreen = 'settings'; render(); });

                // get started
                const getStarted = document.getElementById('getStartedBtn');
                if (getStarted) getStarted.addEventListener('click', () => { currentScreen = 'home'; render(); });

                // bottom nav
                document.querySelectorAll('.nav-item').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const nav = btn.dataset.nav;
                        if (nav === 'home') currentScreen = 'home';
                        else if (nav === 'learn') currentScreen = 'learn';
                        else if (nav === 'progress') currentScreen = 'progress';
                        else if (nav === 'settings') currentScreen = 'settings';
                        render();
                    });
                });

                // legal modals
                const privacy = document.getElementById('privacyLink');
                const terms = document.getElementById('termsLink');
                if (privacy) privacy.addEventListener('click', () => showModal('Privacy Policy', 'We protect your data. (demo)'));
                if (terms) terms.addEventListener('click', () => showModal('Terms of Service', 'Educational use only. (demo)'));

                // quick practice from home
                const prac = document.getElementById('quickPractice');
                if (prac) prac.addEventListener('click', () => { currentScreen = 'learn'; render(); });

                // theme toggle inside settings
                const toggle = document.getElementById('themeToggle');
                if (toggle) {
                    toggle.checked = (theme === 'dark');
                    toggle.addEventListener('change', (e) => {
                        theme = e.target.checked ? 'dark' : 'light';
                        document.getElementById('phoneContainer').setAttribute('data-theme', theme);
                        render(); // re-render to reflect theme inside
                    });
                }
            }

            function showModal(title, msg) {
                const modal = document.createElement('div');
                modal.className = 'modal';
                modal.innerHTML = `<div class="modal-content"><h3 style="margin-bottom:12px;">${title}</h3><p>${msg}</p><button class="btn-primary" style="margin-top:20px; padding:10px;" id="closeModal">Close</button></div>`;
                document.body.appendChild(modal);
                document.getElementById('closeModal').addEventListener('click', () => modal.remove());
                modal.addEventListener('click', (e) => { if(e.target === modal) modal.remove(); });
            }

            // screenshot (SHIFT+W)
            window.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    const phone = document.getElementById('phoneContainer');
                    const canvas = document.getElementById('screenshot-canvas');
                    const ctx = canvas.getContext('2d');

                    html2canvas(phone, { scale: 2, backgroundColor: null }).then(captured => {
                        ctx.clearRect(0,0,360,780);
                        ctx.drawImage(captured, 0, 0, 360, 780);
                        const link = document.createElement('a');
                        let index = theme === 'dark' ? 6 : (window.__shotCount || 0) % 5 + 1;
                        if (theme === 'dark') index = 6;
                        else { if(!window.__shotCount) window.__shotCount = 0; window.__shotCount++; index = window.__shotCount; }
                        link.download = index + '.png';
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    });
                }
            });

            // inject static icons (nav)
            injectIcons();
            // initial render
            render();
        })();

        // html2canvas from CDN (will be loaded)
        function loadScript(src) {
            return new Promise((resolve) => { let s = document.createElement('script'); s.src = src; s.onload = resolve; document.head.appendChild(s); });
        }
        window.addEventListener('load', () => {
            if (typeof html2canvas === 'undefined') loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/6.0.0-alpha.2/html2canvas.min.js');
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/6.0.0-alpha.2/html2canvas.min.js"></script>
</body>
</html>
All done!
