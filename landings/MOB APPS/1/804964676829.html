```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python · Learn & practice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --nav-bg: #FFFFFF;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            --progress-bg: #E2E8F0;
            --badge-gold: #F59E0B;
            --badge-blue: #2563EB10;
        }

        [data-theme="dark"] {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --nav-bg: #1E293B;
            --shadow: 0 10px 25px -5px #00000030, 0 8px 10px -6px #00000050;
            --progress-bg: #334155;
            --badge-blue: #3B82F620;
        }

        body {
            background: #1a1f2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
            border: 1px solid #2d3a4e;
        }

        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px 16px 8px 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) var(--bg);
        }
        .app-screen::-webkit-scrollbar {
            width: 4px;
        }
        .app-screen::-webkit-scrollbar-track {
            background: var(--bg);
        }
        .app-screen::-webkit-scrollbar-thumb {
            background: var(--inactive);
            border-radius: 8px;
        }

        /* header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0 16px 0;
        }
        .header h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }
        .profile-icon {
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
            transition: background 0.2s;
        }
        .profile-icon:hover {
            background: var(--badge-blue);
        }

        /* bottom nav */
        .bottom-nav {
            background: var(--nav-bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px;
            border-top: 1px solid var(--border-light);
            box-shadow: var(--shadow);
            transition: all 0.2s;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 30px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: transparent;
            border: none;
            width: 70px;
        }
        .nav-item.active {
            background: var(--badge-blue);
            transform: scale(1.05);
        }
        .nav-item.active svg {
            stroke: var(--primary);
            stroke-width: 2.4;
            transform: scale(1.1);
            filter: drop-shadow(0 2px 4px var(--primary20));
        }
        .nav-item.active span {
            color: var(--primary);
            font-weight: 600;
        }
        .nav-item svg {
            stroke: var(--inactive);
            stroke-width: 2;
            transition: all 0.2s;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            color: var(--inactive);
            transition: color 0.2s;
        }

        /* cards & content */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 20px 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }
        .flex-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .badge {
            background: var(--badge-blue);
            color: var(--primary);
            font-weight: 600;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 30px;
            margin: 12px 0;
        }
        .progress-fill {
            height: 8px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 30px;
            width: 0%;
            transition: width 0.4s ease;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            font-weight: 600;
            border: none;
            padding: 16px;
            border-radius: 60px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 0 var(--primary-dark);
        }
        .btn-primary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--primary-dark);
        }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 16px;
            font-size: 13px;
        }
        .link-row span {
            color: var(--inactive);
            text-decoration: underline;
            cursor: pointer;
        }
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .lesson-item:last-child {
            border-bottom: none;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-box {
            background: var(--bg);
            border-radius: 18px;
            padding: 16px 8px;
            text-align: center;
        }
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000000aa;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal.show {
            visibility: visible;
            opacity: 1;
        }
        .modal-content {
            background: var(--card);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            color: var(--text-primary);
            text-align: center;
        }

        /* SVG icon set */
        .icon-defs {
            display: none;
        }

        /* onboarding extra */
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .app-name {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="phone" id="phoneContainer">
        <!-- header will be injected per screen -->
        <div id="dynamicHeader" class="header" style="padding: 16px 16px 8px 16px;"></div>

        <!-- main screen content -->
        <div id="screenContent" class="app-screen"></div>

        <!-- bottom navigation (static) -->
        <div class="bottom-nav" id="bottomNav">
            <div class="nav-item" data-tab="home">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 10L12 3L21 10L21 20H3V10Z" stroke-linecap="round" stroke-linejoin="round"/><rect x="9" y="14" width="6" height="6" stroke-linecap="round"/></svg>
                <span>Home</span>
            </div>
            <div class="nav-item" data-tab="learn">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5L4 9L12 13L20 9L12 5Z" stroke-linecap="round"/><path d="M4 13L12 17L20 13" stroke-linecap="round"/></svg>
                <span>Learn</span>
            </div>
            <div class="nav-item" data-tab="progress">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="14" width="4" height="6" stroke-linecap="round"/><rect x="10" y="8" width="4" height="12"/><rect x="16" y="4" width="4" height="16"/></svg>
                <span>Progress</span>
            </div>
            <div class="nav-item" data-tab="settings">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M20 7.5L19 5L16 4L12 6L8 4L5 5L4 7.5L6 12L4 16.5L5 19L8 20L12 18L16 20L19 19L20 16.5L18 12L20 7.5Z" stroke-linecap="round"/></svg>
                <span>Settings</span>
            </div>
        </div>
    </div>

    <!-- modal container -->
    <div class="modal" id="policyModal">
        <div class="modal-content">
            <h3 style="margin-bottom:12px;">Privacy Policy</h3>
            <p style="margin-bottom:16px;">We protect your data. No sharing, no tracking. Education only.</p>
            <button class="btn-primary" style="padding:10px;" onclick="closeModal()">Got it</button>
        </div>
    </div>
    <div class="modal" id="termsModal">
        <div class="modal-content">
            <h3 style="margin-bottom:12px;">Terms of Service</h3>
            <p style="margin-bottom:16px;">Use this app to learn Python. Be respectful, practice daily.</p>
            <button class="btn-primary" style="padding:10px;" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        (function(){
            // ---------- STATE ----------
            let currentTheme = 'light';
            let currentScreen = 'onboarding'; // screens: onboarding, home, learn, progress, settings
            let screenshotCounter = 1;
            const bottomNavItems = document.querySelectorAll('.nav-item');

            // ---------- UTILS: show modal ----------
            window.openModal = function(type) {
                if(type==='privacy') document.getElementById('policyModal').classList.add('show');
                else if(type==='terms') document.getElementById('termsModal').classList.add('show');
            };
            window.closeModal = function() {
                document.getElementById('policyModal').classList.remove('show');
                document.getElementById('termsModal').classList.remove('show');
            };

            // ---------- RENDER FUNCTION ----------
            function renderScreen() {
                const headerDiv = document.getElementById('dynamicHeader');
                const contentDiv = document.getElementById('screenContent');

                // default header title
                let headerTitle = '';
                if (currentScreen === 'onboarding') headerTitle = 'Welcome';
                else if (currentScreen === 'home') headerTitle = 'Dashboard';
                else if (currentScreen === 'learn') headerTitle = 'Python Path';
                else if (currentScreen === 'progress') headerTitle = 'Your stats';
                else if (currentScreen === 'settings') headerTitle = 'Settings';

                // header HTML (profile icon right)
                headerDiv.innerHTML = `
                    <h2>${headerTitle}</h2>
                    <div class="profile-icon" onclick="navigateTo('settings')">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke:var(--text-primary); stroke-width:1.8;">
                            <circle cx="12" cy="8" r="4" stroke-linecap="round"/>
                            <path d="M5 20v-2a7 7 0 0 1 14 0v2" stroke-linecap="round"/>
                        </svg>
                    </div>
                `;

                // screen content
                if (currentScreen === 'onboarding') {
                    contentDiv.innerHTML = `
                        <div class="card" style="background:transparent; box-shadow:none; border:none; margin-top:20px;">
                            <div class="logo-area">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M12 2L2 7L12 12L22 7L12 2Z"/><path d="M2 17L12 22L22 17"/><path d="M2 12L12 17L22 12"/></svg>
                                <span class="app-name">PyLearn</span>
                            </div>
                            <h3 style="font-size:22px; margin-bottom:8px;">Master Python</h3>
                            <p style="color:var(--text-secondary); margin-bottom:24px;">Bite-sized coding lessons. Practice, quiz, repeat. From zero to hero.</p>
                            <button class="btn-primary" onclick="navigateTo('home')">Get Started</button>
                            <div class="link-row">
                                <span onclick="openModal('privacy')">Privacy</span>
                                <span onclick="openModal('terms')">Terms</span>
                            </div>
                        </div>
                    `;
                } else if (currentScreen === 'home') {
                    contentDiv.innerHTML = `
                        <div class="card">
                            <div class="flex-row"><span class="badge"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path d="M5 14v2a7 7 0 0 0 14 0v-2"/></svg>  daily streak 7</span> <span>🔥 120 XP</span></div>
                            <h3 style="margin:16px 0 4px;">Continue where you left</h3>
                            <div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div>
                            <div class="flex-row"><span>Variables</span><span>45%</span></div>
                            <button class="btn-primary" style="margin-top:16px;" onclick="navigateTo('learn')">Resume practice</button>
                        </div>
                        <div class="card">
                            <div class="flex-row"><span style="font-weight:600;">Today's pick</span> <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)"><path d="M12 5v14M5 12h14"/></svg></div>
                            <div class="lesson-item"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><div><strong>Lists & loops</strong><p style="font-size:12px;">8 min · beginner</p></div></div>
                            <div class="lesson-item"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2 2"/></svg><div><strong>Functions</strong><p style="font-size:12px;">12 min · intermediate</p></div></div>
                        </div>
                        <div class="card">
                            <div class="flex-row"><span>🔥 achievements</span><span>+3 new</span></div>
                            <div style="display:flex; gap:16px; margin-top:12px;">
                                <span><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--badge-gold)"><circle cx="12" cy="8" r="4" fill="none"/><path d="M5 14v2a7 7 0 0 0 14 0v-2"/></svg> 5 day</span>
                                <span><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--badge-gold)"><rect x="6" y="10" width="4" height="8"/><rect x="14" y="6" width="4" height="12"/></svg> 100 ex</span>
                            </div>
                        </div>
                    `;
                } else if (currentScreen === 'learn') {
                    contentDiv.innerHTML = `
                        <div class="card">
                            <h3>Python fundamentals</h3>
                            <div class="lesson-item"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg> <div><strong>Variables & Data</strong><p>5 steps · 10 XP</p></div></div>
                            <div class="lesson-item"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)"><path d="M4 4L20 20M20 4L4 20"/></svg> <div><strong>Conditionals</strong><p>8 steps · 20 XP</p></div></div>
                            <div class="lesson-item"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)"><path d="M4 12h16M12 4v16"/></svg> <div><strong>Loops (for/while)</strong><p>6 steps · 25 XP</p></div></div>
                        </div>
                        <div class="card">
                            <span class="badge">⬆️ advanced</span>
                            <div class="lesson-item"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 16L15 8"/></svg> <div><strong>List comprehensions</strong><p>4 steps · 30 XP</p></div></div>
                        </div>
                        <button class="btn-primary" style="margin-bottom:8px;">Start practice →</button>
                    `;
                } else if (currentScreen === 'progress') {
                    contentDiv.innerHTML = `
                        <div class="card">
                            <div class="flex-row"><span>Total XP</span><span style="font-weight:800;">1,240</span></div>
                            <div class="progress-bar" style="margin:12px 0;"><div class="progress-fill" style="width:62%"></div></div>
                            <div class="flex-row"><span>Next level in 360 XP</span></div>
                        </div>
                        <div class="card">
                            <div class="stat-grid">
                                <div class="stat-box"><span>🔥 7</span><br>streak</div>
                                <div class="stat-box"><span>⚡ 24</span><br>lessons</div>
                                <div class="stat-box"><span>🏆 8</span><br>badges</div>
                                <div class="stat-box"><span>📊 78%</span><br>accuracy</div>
                            </div>
                        </div>
                        <div class="card">
                            <span style="font-weight:600;">Weekly activity</span>
                            <div style="display:flex; gap:6px; margin:16px 0;">
                                <svg width="100%" height="40" viewBox="0 0 200 30"><rect x="0" y="20" width="20" height="10" fill="var(--primary)" rx="4"/><rect x="30" y="8" width="20" height="22" fill="var(--primary)" rx="4"/><rect x="60" y="12" width="20" height="18" fill="var(--primary)" rx="4"/><rect x="90" y="4" width="20" height="26" fill="var(--primary)" rx="4"/><rect x="120" y="16" width="20" height="14" fill="var(--primary)" rx="4"/><rect x="150" y="0" width="20" height="30" fill="var(--primary)" rx="4"/><rect x="180" y="10" width="20" height="20" fill="var(--primary)" rx="4"/></svg>
                            </div>
                        </div>
                    `;
                } else if (currentScreen === 'settings') {
                    contentDiv.innerHTML = `
                        <div class="card">
                            <div style="display:flex; gap:16px; align-items:center;"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--primary)"><circle cx="12" cy="8" r="4"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></svg><div><strong>Alex Rivera</strong><p>alex@py.com</p></div></div>
                        </div>
                        <div class="card">
                            <div class="flex-row" style="margin-bottom:16px;"><span>🌙 Dark mode</span> <label><input type="checkbox" id="themeToggle" ${currentTheme==='dark'?'checked':''} onchange="toggleTheme()"></label></div>
                            <div class="flex-row"><span>🔔 Notifications</span> <span>On</span></div>
                            <div class="flex-row" style="margin-top:16px;"><span>📶 Download over WiFi</span></div>
                        </div>
                        <div class="card">
                            <p style="margin-bottom:8px;">Privacy & Terms</p>
                            <p style="color:var(--inactive);" onclick="openModal('privacy')">Privacy Policy</p>
                            <p style="color:var(--inactive); margin-top:8px;" onclick="openModal('terms')">Terms of Service</p>
                        </div>
                    `;
                    // set toggle state after render
                    setTimeout(() => {
                        const chk = document.getElementById('themeToggle');
                        if(chk) chk.checked = currentTheme === 'dark';
                    }, 50);
                }

                updateBottomNav();
            }

            function updateBottomNav() {
                bottomNavItems.forEach(item => {
                    const tab = item.getAttribute('data-tab');
                    if (currentScreen === tab || (tab==='home' && currentScreen==='onboarding')) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                });
            }

            // ---------- NAVIGATION ----------
            window.navigateTo = function(screen) {
                if (screen === 'settings') currentScreen = 'settings';
                else if (screen === 'home') currentScreen = 'home';
                else if (screen === 'learn') currentScreen = 'learn';
                else if (screen === 'progress') currentScreen = 'progress';
                else currentScreen = screen; // onboarding fallback
                renderScreen();
            };

            // bottom nav click listeners
            bottomNavItems.forEach(item => {
                item.addEventListener('click', (e) => {
                    const tab = item.getAttribute('data-tab');
                    if (tab === 'home') currentScreen = 'home';
                    else if (tab === 'learn') currentScreen = 'learn';
                    else if (tab === 'progress') currentScreen = 'progress';
                    else if (tab === 'settings') currentScreen = 'settings';
                    renderScreen();
                });
            });

            // ---------- THEME ----------
            window.toggleTheme = function() {
                const chk = document.getElementById('themeToggle');
                if (chk && chk.checked) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    currentTheme = 'dark';
                } else {
                    document.documentElement.setAttribute('data-theme', 'light');
                    currentTheme = 'light';
                }
                renderScreen(); // re-render to update toggle visual
            };

            // ---------- SCREENSHOT (SHIFT+W) ----------
            window.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    const phone = document.getElementById('phoneContainer');
                    // simplistic PNG capture simulation (just triggers download with sequential name)
                    const canvas = document.createElement('canvas');
                    canvas.width = 360; canvas.height = 780;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = currentTheme==='dark' ? '#0F172A' : '#F8FAFC';
                    ctx.fillRect(0,0,360,780);
                    ctx.fillStyle = '#2563EB';
                    ctx.font = 'bold 24px Inter';
                    ctx.fillText('Python', 40, 300);
                    const link = document.createElement('a');
                    let name = screenshotCounter + '.png';
                    if (currentTheme === 'dark' && screenshotCounter === 1) name = '6.png';
                    else if (currentTheme === 'dark') name = '6.png';
                    else name = screenshotCounter + '.png';
                    link.download = name;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    screenshotCounter = screenshotCounter === 5 ? 1 : screenshotCounter+1;
                }
            });

            // ---------- INIT ----------
            renderScreen();
        })();
    </script>
