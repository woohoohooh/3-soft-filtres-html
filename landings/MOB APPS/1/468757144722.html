```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Python · 2026 prototype</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    :root {
      /* light mode (default) */
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --border-light: #E2E8F0;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --inactive-icon: #94A3B8;
      --nav-highlight: rgba(37, 99, 235, 0.08);
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
    }

    body.dark {
      --bg: #0F172A;
      --card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --border-light: #334155;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --inactive-icon: #64748B;
      --nav-highlight: rgba(59, 130, 246, 0.15);
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }

    body {
      background: #1a1e2b; /* outer background */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 12px;
    }

    /* phone shell */
    .phone {
      width: 360px;
      height: 780px;
      background-color: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 0 0 0 8px #2c313d;
      position: relative;
      transition: background-color 0.2s;
      display: flex;
      flex-direction: column;
    }

    /* main container (flex column) */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      background-color: var(--bg);
      transition: background-color 0.2s;
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 8px 20px;
      background-color: var(--bg);
    }
    .header-left h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 12px;
      transition: background 0.15s;
    }
    .profile-btn:hover {
      background-color: var(--nav-highlight);
    }
    .profile-btn svg {
      width: 28px;
      height: 28px;
      stroke: var(--text-primary);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* main screen content (dynamic) */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px 8px 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--inactive-icon) transparent;
    }
    .screen-content::-webkit-scrollbar {
      width: 4px;
    }
    .screen-content::-webkit-scrollbar-thumb {
      background-color: var(--inactive-icon);
      border-radius: 20px;
    }

    /* bottom navigation */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 12px 14px 12px;
      background-color: var(--card);
      border-top: 1px solid var(--border-light);
      backdrop-filter: blur(4px);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 30px;
      transition: all 0.15s ease;
      color: var(--inactive-icon);
      fill: none;
      stroke: var(--inactive-icon);
    }
    .nav-item.active {
      background-color: var(--nav-highlight);
      transform: scale(1.05);
    }
    .nav-item.active svg {
      stroke: var(--primary);
      stroke-width: 2.4;
    }
    .nav-item.active .nav-label {
      color: var(--primary);
      font-weight: 500;
    }
    .nav-item svg {
      width: 26px;
      height: 26px;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s;
    }
    .nav-label {
      font-size: 11px;
      font-weight: 500;
      margin-top: 4px;
      color: var(--inactive-icon);
    }
    .nav-item.active .nav-label {
      color: var(--primary);
    }

    /* cards / UI components */
    .card {
      background-color: var(--card);
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-light);
    }
    .flex-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .lesson-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .lesson-item:last-child {
      border-bottom: none;
    }
    .progress-bar-bg {
      height: 8px;
      background-color: var(--border-light);
      border-radius: 100px;
      margin: 8px 0;
    }
    .progress-fill {
      height: 8px;
      background-color: var(--primary);
      border-radius: 100px;
      width: 0%;
    }
    .badge {
      background-color: var(--accent);
      color: #0F172A;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 40px;
      font-size: 12px;
    }
    button.primary {
      background-color: var(--primary);
      border: none;
      padding: 16px;
      width: 100%;
      border-radius: 60px;
      font-weight: 600;
      font-size: 18px;
      color: white;
      cursor: pointer;
      box-shadow: 0 8px 20px -8px var(--primary);
      transition: background 0.15s;
    }
    button.primary:active { background-color: var(--primary-dark); }
    .link-row {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin-top: 20px;
    }
    .link-btn {
      background: none;
      border: none;
      color: var(--inactive-icon);
      text-decoration: underline;
      font-size: 14px;
      cursor: pointer;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-item {
      background: var(--bg);
      padding: 12px;
      border-radius: 18px;
      text-align: center;
    }
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: var(--card);
      padding: 28px;
      border-radius: 32px;
      max-width: 280px;
      text-align: center;
      color: var(--text-primary);
    }

    /* icons reusable */
    .icon-defs { display: none; }

    /* shift+w screenshot hidden helper */
    .screenshot-helper {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #000;
      color: #fff;
      padding: 4px;
      font-size: 10px;
      border-radius: 8px;
      opacity: 0.3;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- hidden SVG definitions (same style) -->
  <svg style="display:none;" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- home icon: simple house -->
      <g id="icon-home"><path d="M5 12 L12 5 L19 12 L19 20 L14 20 L14 14 L10 14 L10 20 L5 20 L5 12 Z" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
      <!-- learn icon: book/open book -->
      <g id="icon-learn"><path d="M4 6 L12 4 L20 6 L20 18 L12 20 L4 18 L4 6 Z M12 4 L12 20" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
      <!-- progress icon: simple bar chart -->
      <g id="icon-progress"><path d="M4 20 L4 8 M10 20 L10 4 M16 20 L16 12 M22 20 L22 16" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></g>
      <!-- settings icon: gear -->
      <g id="icon-settings"><circle cx="12" cy="12" r="3.5" stroke="currentColor" fill="none" stroke-width="2"/><path d="M19.4 15 L16.6 15.8 L15.8 18.6 L12 20 L8.2 18.6 L7.4 15.8 L4.6 15 L4.6 9 L7.4 8.2 L8.2 5.4 L12 4 L15.8 5.4 L16.6 8.2 L19.4 9 L19.4 15 Z" stroke="currentColor" fill="none" stroke-width="2"/></g>
      <!-- profile icon: simple user head & shoulders -->
      <g id="icon-profile"><circle cx="12" cy="8" r="3.5" stroke="currentColor" fill="none" stroke-width="2"/><path d="M4 20 L4 17 C4 13 8 12 12 12 C16 12 20 13 20 17 L20 20" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></g>
      <!-- lesson / play icon: play triangle -->
      <g id="icon-play"><polygon points="6,5 20,12 6,19 6,5" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
      <!-- chart icon (simple line) -->
      <g id="icon-chart"><polyline points="4,16 8,10 12,14 18,6 22,12" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></g>
      <!-- flashcards icon: two overlapping rectangles -->
      <g id="icon-flashcards"><rect x="6" y="6" width="12" height="14" rx="1.5" stroke="currentColor" fill="none" stroke-width="2"/><rect x="10" y="8" width="12" height="14" rx="1.5" stroke="currentColor" fill="none" stroke-width="2"/></g>
      <!-- check icon -->
      <g id="icon-check"><polyline points="4 13 9 18 20 6" stroke="currentColor" fill="none" stroke-width="3" stroke-linecap="round"/></g>
    </defs>
  </svg>

  <div class="phone" id="phoneContainer">
    <div class="app-container" id="app">
      <!-- header (dynamic via js) -->
      <div class="header" id="appHeader">
        <div class="header-left"><h1 id="headerTitle">Onboarding</h1></div>
        <button class="profile-btn" id="profileButton"><svg viewBox="0 0 24 24"><use href="#icon-profile" /></svg></button>
      </div>

      <!-- main content panels -->
      <div class="screen-content" id="screenContainer"></div>

      <!-- bottom navigation (4 items) -->
      <nav class="bottom-nav" id="bottomNav">
        <button class="nav-item" data-tab="home"><svg viewBox="0 0 24 24"><use href="#icon-home"/></svg><span class="nav-label">Home</span></button>
        <button class="nav-item" data-tab="learn"><svg viewBox="0 0 24 24"><use href="#icon-learn"/></svg><span class="nav-label">Learn</span></button>
        <button class="nav-item" data-tab="progress"><svg viewBox="0 0 24 24"><use href="#icon-progress"/></svg><span class="nav-label">Progress</span></button>
        <button class="nav-item" data-tab="settings"><svg viewBox="0 0 24 24"><use href="#icon-settings"/></svg><span class="nav-label">Settings</span></button>
      </nav>
    </div>
  </div>

  <!-- modals container (privacy, terms) -->
  <div id="modalLayer" style="display: none;"></div>

  <script>
    (function() {
      // ----- app state -----
      const screens = ['onboarding', 'home', 'learn', 'progress', 'settings'];
      let currentScreen = 'onboarding';      // first: onboarding
      let darkMode = false;
      let screenshotCounter = 0;
      
      // ----- helper icons from defs -----
      
      // ----- render functions per screen -----
      function getIconSvg(name, width=24, height=24) {
        return `<svg viewBox="0 0 24 24" width="${width}" height="${height}"><use href="#icon-${name}" /></svg>`;
      }

      function renderOnboarding() {
        return `
          <div class="card" style="text-align: center; padding: 32px 16px;">
            ${getIconSvg('flashcards', 60, 60)}
            <h1 style="font-size: 40px; font-weight: 800; margin: 16px 0 4px; color: var(--primary);">Daily Python</h1>
            <p style="font-size: 20px; font-weight: 500; margin-bottom: 12px;">code · learn · grow</p>
            <p style="color: var(--text-secondary); margin-bottom: 32px;">Bite-sized Python exercises. Master coding step by step, with real‑time feedback.</p>
            <button class="primary" id="startOnboarding">Get Started →</button>
            <div class="link-row">
              <button class="link-btn" id="privacyLink">Privacy Policy</button>
              <button class="link-btn" id="termsLink">Terms of Service</button>
            </div>
          </div>
        `;
      }

      function renderHome() {
        return `
          <div class="card">
            <div class="flex-row"><span class="badge">🔥 7 day streak</span><span>${getIconSvg('check',20,20)}</span></div>
            <h2 style="margin: 8px 0;">Welcome back, Alex</h2>
            <p style="color: var(--text-secondary);">Continue where you left off</p>
            <div class="lesson-item">
              ${getIconSvg('play',32,32)}
              <div style="flex:1"><strong>Loops & conditions</strong><div class="progress-bar-bg"><div class="progress-fill" style="width:70%"></div></div></div>
              <span>70%</span>
            </div>
            <div class="lesson-item">
              ${getIconSvg('flashcards',32,32)}
              <div style="flex:1"><strong>Functions deep dive</strong><div class="progress-bar-bg"><div class="progress-fill" style="width:30%"></div></div></div>
              <span>30%</span>
            </div>
          </div>
          <div class="card">
            <div class="flex-row"><h3>Today's challenge</h3> ${getIconSvg('play')}</div>
            <p style="margin: 6px 0;">"FizzBuzz" · easy</p>
            <div style="display: flex; gap:8px; margin-top:12px;"><span class="badge">57 XP</span> <span class="badge">6 min</span></div>
            <button class="primary" style="margin-top:16px; padding:12px;" id="quickPractice">Start practice</button>
          </div>
        `;
      }

      function renderLearn() {
        return `
          <div class="card">
            <h3>Python fundamentals</h3>
            <div class="lesson-item">${getIconSvg('play',28,28)}<div><span>Variables & data types</span><div class="progress-bar-bg"><div class="progress-fill" style="width:100%"></div></div></div></div>
            <div class="lesson-item">${getIconSvg('play',28,28)}<div><span>Lists & tuples</span><div class="progress-bar-bg"><div class="progress-fill" style="width:60%"></div></div></div></div>
            <div class="lesson-item">${getIconSvg('play',28,28)}<div><span>Dictionaries</span><div class="progress-bar-bg"><div class="progress-fill" style="width:15%"></div></div></div></div>
            <button style="background:none; border:none; color: var(--primary); font-weight:600;">See all 12 modules →</button>
          </div>
          <div class="card">
            <h3>Code flashcards</h3>
            <div class="lesson-item">${getIconSvg('flashcards',28,28)} 30 cards · methods</div>
            <div class="lesson-item">${getIconSvg('flashcards',28,28)} 20 cards · syntax</div>
          </div>
        `;
      }

      function renderProgress() {
        return `
          <div class="card">
            <div class="flex-row"><h3>This week</h3>${getIconSvg('chart',24,24)}</div>
            <div class="stat-grid">
              <div class="stat-item"><span style="font-size:24px; font-weight:700;">5</span> <span style="color:var(--text-secondary);">lessons</span></div>
              <div class="stat-item"><span style="font-size:24px; font-weight:700;">230</span> <span style="color:var(--text-secondary);">XP</span></div>
              <div class="stat-item"><span style="font-size:24px; font-weight:700;">3</span> <span style="color:var(--text-secondary);">streak</span></div>
              <div class="stat-item"><span style="font-size:24px; font-weight:700;">78%</span> <span style="color:var(--text-secondary);">accuracy</span></div>
            </div>
          </div>
          <div class="card">
            <div class="flex-row"><h3>Badges</h3><span>4 earned</span></div>
            <div style="display: flex; gap:16px; margin: 12px 0;">
              <span style="background: var(--accent); padding:8px 12px; border-radius:40px;">🔥 7 days</span>
              <span style="background: var(--border-light); padding:8px 12px; border-radius:40px;">⚡ loop master</span>
            </div>
          </div>
        `;
      }

      function renderSettings() {
        return `
          <div class="card">
            <h3>Preferences</h3>
            <div class="lesson-item" style="justify-content:space-between;">
              <span>Dark theme</span>
              <label class="switch"><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}><span class="slider"></span></label>
            </div>
            <div class="lesson-item"><span>Sound effects</span><span>🔔 on</span></div>
            <div class="lesson-item"><span>Daily reminder</span><span>⏰ 8:00 PM</span></div>
          </div>
          <div class="card">
            <h3>Account</h3>
            <div class="lesson-item">${getIconSvg('profile',24,24)} Alex C.</div>
            <div class="lesson-item">alex@pythonist</div>
          </div>
        `;
      }

      // ----- navigation & update -----
      function showScreen(screenId) {
        currentScreen = screenId;
        updateUI();
      }

      function updateUI() {
        const container = document.getElementById('screenContainer');
        const headerTitle = document.getElementById('headerTitle');
        if (!container) return;

        // render screen
        if (currentScreen === 'onboarding') {
          container.innerHTML = renderOnboarding();
          headerTitle.innerText = 'Onboarding';
        } else if (currentScreen === 'home') {
          container.innerHTML = renderHome();
          headerTitle.innerText = 'Home';
        } else if (currentScreen === 'learn') {
          container.innerHTML = renderLearn();
          headerTitle.innerText = 'Learn';
        } else if (currentScreen === 'progress') {
          container.innerHTML = renderProgress();
          headerTitle.innerText = 'Progress';
        } else if (currentScreen === 'settings') {
          container.innerHTML = renderSettings();
          headerTitle.innerText = 'Settings';
        }

        // bottom nav active class
        document.querySelectorAll('.nav-item').forEach(btn => {
          const tab = btn.dataset.tab;
          if (tab === currentScreen) btn.classList.add('active');
          else btn.classList.remove('active');
        });

        // attach special listeners
        if (currentScreen === 'onboarding') {
          document.getElementById('startOnboarding')?.addEventListener('click', ()=>{
            showScreen('home');
          });
          document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy Policy','We respect your data. No third-party sharing.'));
          document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms of Service','Educational use only. Updated 2026.'));
        }
        if (currentScreen === 'home') {
          document.getElementById('quickPractice')?.addEventListener('click', ()=>{
            alert('✨ practice session started! (simulated)');
          });
        }
        if (currentScreen === 'settings') {
          const toggle = document.getElementById('darkToggle');
          if (toggle) {
            toggle.checked = darkMode;
            toggle.addEventListener('change', (e) => {
              darkMode = e.target.checked;
              document.body.classList.toggle('dark', darkMode);
              updateUI(); // re-render settings toggle state
            });
          }
        }
      }

      // modal
      function showModal(title, text) {
        const modalLayer = document.getElementById('modalLayer');
        modalLayer.style.display = 'flex';
        modalLayer.innerHTML = `
          <div class="modal">
            <div class="modal-content">
              <h3>${title}</h3><p>${text}</p><button class="primary" style="margin-top:16px;" id="closeModal">Close</button>
            </div>
          </div>
        `;
        document.getElementById('closeModal').addEventListener('click', ()=>{
          modalLayer.style.display = 'none';
        });
      }

      // profile button -> settings
      document.getElementById('profileButton').addEventListener('click', ()=>{
        showScreen('settings');
      });

      // bottom navigation
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const tab = e.currentTarget.dataset.tab;
          if (tab) showScreen(tab);
        });
      });

      // initialize
      updateUI();

      // ----- SHIFT + W screenshot feature -----
      window.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.key === 'W') {
          e.preventDefault();
          screenshotCounter++;
          const phone = document.getElementById('phoneContainer');
          const isDark = document.body.classList.contains('dark');
          const filename = isDark ? '6.png' : (screenshotCounter <=5 ? screenshotCounter+'.png' : '1.png'); // simple rule, but sequential naming: counter 1..5 for light, 6 for dark
          // use the actual screenshot naming: shift+W first light => 1.png, second => 2.png … if dark active → 6.png
          let finalName = '';
          if (darkMode) finalName = '6.png';
          else {
            let num = screenshotCounter > 5 ? 5 : screenshotCounter;
            finalName = num + '.png';
          }
          alert(`📸 Screenshot saved as ${finalName} (simulated – real capture needs html2canvas)`);
          // This is a prototype, we simulate capture.
        }
      });

      // extra: clicking outside modal closes
      document.addEventListener('click', (e) => {
        if (e.target.classList.contains('modal')) {
          document.getElementById('modalLayer').style.display = 'none';
        }
      });

    })();
  </script>

  <!-- tiny screenshot helper (invisible) -->
  <div class="screenshot-helper">shift+W simulate screenshot</div>

  <!-- JSON Play Store text (will be output after html) -->
</body>
</html>
