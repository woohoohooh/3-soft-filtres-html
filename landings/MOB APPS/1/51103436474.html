```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python·mini — learn to code</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #1e2b3a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg-primary);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2d3e53;
            position: relative;
            transition: background-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        /* inner screen */
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 16px 16px 8px 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--icon-inactive) var(--card-bg);
            background: var(--bg-primary);
        }
        .screen::-webkit-scrollbar {
            width: 4px;
        }
        .screen::-webkit-scrollbar-thumb {
            background: var(--icon-inactive);
            border-radius: 20px;
        }

        /* light / dark vars */
        :root {
            --bg-primary: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --icon-active: #2563EB;
            --icon-inactive: #94A3B8;
            --border-light: #E2E8F0;
            --progress-bg: #E2E8F0;
            --accent-blue: #38BDF8;
        }

        .dark-mode {
            --bg-primary: #0F172A;
            --card-bg: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --icon-active: #3B82F6;
            --icon-inactive: #64748B;
            --border-light: #334155;
            --progress-bg: #334155;
            --accent-blue: #38BDF8;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 12px 0;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 16px;
        }
        .header-left .title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .profile-icon {
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: background 0.1s;
        }
        .profile-icon:hover {
            background: var(--border-light);
        }
        .profile-icon svg {
            width: 28px;
            height: 28px;
            stroke: var(--text-primary);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* bottom nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--card-bg);
            border-top: 1px solid var(--border-light);
            padding: 6px 8px 10px 8px;
            border-radius: 0 0 44px 44px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 6px 12px 4px 12px;
            border-radius: 20px;
            background: transparent;
        }
        .nav-item.active {
            background: rgba(37, 99, 235, 0.1);
            transform: scale(1.02);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: all 0.1s;
        }
        .nav-item.active svg {
            stroke: var(--icon-active);
            width: 28px;
            height: 28px;
            margin-bottom: 2px;
        }
        .nav-item.inactive svg {
            stroke: var(--icon-inactive);
            width: 24px;
            height: 24px;
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            margin-top: 2px;
        }
        .nav-item.active .nav-label {
            color: var(--icon-active);
            font-weight: 600;
        }
        .nav-item.inactive .nav-label {
            color: var(--icon-inactive);
        }

        /* cards & elements */
        .card {
            background: var(--card-bg);
            border-radius: 22px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            border: 1px solid var(--border-light);
        }
        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .badge {
            background: var(--accent-blue);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: var(--progress-bg);
            border-radius: 20px;
            margin: 12px 0;
        }
        .progress-fill {
            height: 10px;
            background: var(--icon-active);
            border-radius: 20px;
            width: 0%;
            transition: width 0.3s ease;
        }
        .btn-primary {
            background: var(--icon-active);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: 0.1s;
        }
        .btn-primary:active { opacity: 0.7; }
        .link-group {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 16px;
        }
        .text-link {
            color: var(--text-secondary);
            text-decoration: underline;
            font-size: 14px;
            cursor: pointer;
        }
        .lesson-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .icon-symbol svg {
            width: 32px;
            height: 32px;
            stroke: var(--icon-active);
            stroke-width: 2;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 12px 0;
        }
        .stat-cell {
            background: var(--bg-primary);
            border-radius: 18px;
            padding: 16px 8px;
            text-align: center;
        }
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 28px;
            border-radius: 32px;
            width: 280px;
            color: var(--text-primary);
            text-align: center;
        }
        .close-modal {
            margin-top: 20px;
            background: var(--icon-active);
            border: none;
            color: white;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        /* onboarding */
        .logo-big svg {
            width: 56px;
            height: 56px;
            stroke: var(--icon-active);
            stroke-width: 2;
            fill: none;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic views render here -->
    <div id="appView" class="screen"></div>
    <!-- bottom nav (static but controlled via JS) -->
    <div class="bottom-nav" id="bottomNav"></div>
</div>

<!-- screenshot helper (hidden) -->
<canvas id="screenshotCanvas" style="display:none"></canvas>

<script>
    (function() {
        // ---------- THEME ----------
        let darkMode = false;

        // ---------- ICON SYSTEM (inline svg) ----------
        const icons = {
            home: `<svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" stroke="currentColor" fill="none"/></svg>`,
            learn: `<svg viewBox="0 0 24 24"><path d="M4 19.5L12 14L20 19.5M12 5V14M12 14L4.5 9.5M12 14L19.5 9.5" stroke="currentColor" fill="none"/><path d="M12 5L20 9.5V16M4 9.5L12 5V14L4 18.5V9.5Z" stroke="currentColor" fill="none"/></svg>`,
            progress: `<svg viewBox="0 0 24 24"><path d="M21 12C21 13.1819 20.7672 14.3522 20.3149 15.4442C19.8626 16.5361 19.1997 17.5282 18.364 18.364C17.5282 19.1997 16.5361 19.8626 15.4442 20.3149C14.3522 20.7672 13.1819 21 12 21C10.8181 21 9.64778 20.7672 8.55585 20.3149C7.46392 19.8626 6.47177 19.1997 5.63604 18.364C4.80031 17.5282 4.13738 16.5361 3.68508 15.4442C3.23279 14.3522 3 13.1819 3 12C3 9.61305 3.94821 7.32387 5.63604 5.63604C7.32387 3.94821 9.61305 3 12 3" stroke="currentColor" fill="none"/><circle cx="12" cy="12" r="2.5" stroke="currentColor" fill="none"/><path d="M12 8V12L15 15" stroke="currentColor" fill="none"/></svg>`,
            settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5" stroke="currentColor" fill="none"/><path d="M19.4 15L20.8 12L19.4 9H16.7L15.3 6H8.7L7.3 9H4.6L3.2 12L4.6 15H7.3L8.7 18H15.3L16.7 15H19.4Z" stroke="currentColor" fill="none"/></svg>`,
            profile: `<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" stroke="currentColor" fill="none"/><path d="M5 20v-2a7 7 0 0 1 14 0v2" stroke="currentColor" fill="none"/></svg>`,
            lesson: `<svg viewBox="0 0 24 24"><path d="M2 3H8C9.06087 3 10.0783 3.42143 10.8284 4.17157C11.5786 4.92172 12 5.93913 12 7V21C12 20.2044 11.6839 19.4413 11.1213 18.8787C10.5587 18.3161 9.79565 18 9 18H2V3Z" stroke="currentColor" fill="none"/><path d="M22 3H16C14.9391 3 13.9217 3.42143 13.1716 4.17157C12.4214 4.92172 12 5.93913 12 7V21C12 20.2044 12.3161 19.4413 12.8787 18.8787C13.4413 18.3161 14.2044 18 15 18H22V3Z" stroke="currentColor" fill="none"/></svg>`,
            chart: `<svg viewBox="0 0 24 24"><path d="M21 21H3V3M7 15V17M11 11V17M15 7V17M19 13V17" stroke="currentColor" fill="none"/></svg>`,
            flashcards: `<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" fill="none"/><path d="M9 7H15M9 11H15M9 15H12" stroke="currentColor"/></svg>`,
            play: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><polygon points="10,8 16,12 10,16" stroke="currentColor" fill="none"/></svg>`,
            check: `<svg viewBox="0 0 24 24"><path d="M20 6L9 17L4 12" stroke="currentColor" fill="none"/></svg>`
        };

        // ---------- APP STATE ----------
        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
        let screenshotCounter = 1;

        // ---------- DOM elements ----------
        const appView = document.getElementById('appView');
        const bottomNav = document.getElementById('bottomNav');

        // ---------- helper to render icon from name ----------
        function renderIcon(name, className = '') {
            return icons[name] || icons['home'];
        }

        // ---------- render bottom nav based on active screen (except onboarding) ----------
        function renderBottomNav(active) {
            if (currentScreen === 'onboarding') {
                bottomNav.innerHTML = ''; // hidden
                return;
            }
            const navItems = [
                { id: 'home', label: 'Home', icon: 'home' },
                { id: 'learn', label: 'Learn', icon: 'learn' },
                { id: 'progress', label: 'Progress', icon: 'progress' },
                { id: 'settings', label: 'Settings', icon: 'settings' }
            ];
            let html = '';
            navItems.forEach(item => {
                const isActive = (active === item.id);
                const activeClass = isActive ? 'active' : 'inactive';
                html += `<div class="nav-item ${activeClass}" data-nav="${item.id}">
                    <div style="stroke:currentColor">${renderIcon(item.icon)}</div>
                    <span class="nav-label">${item.label}</span>
                </div>`;
            });
            bottomNav.innerHTML = html;
            document.querySelectorAll('.nav-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    const navId = el.dataset.nav;
                    if (navId) switchScreen(navId);
                });
            });
        }

        // ---------- modals for privacy/terms ----------
        function showModal(title, text) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `<div class="modal-content"><h3>${title}</h3><p style="margin:16px 0">${text}</p><button class="close-modal">OK</button></div>`;
            document.querySelector('.phone').appendChild(modal);
            modal.querySelector('.close-modal').addEventListener('click', () => modal.remove());
        }

        // ---------- main render function ----------
        function switchScreen(screen) {
            currentScreen = screen;
            renderScreen();
        }

        function renderScreen() {
            if (currentScreen === 'onboarding') {
                renderOnboarding();
                bottomNav.innerHTML = ''; // hide bottom nav
            } else {
                renderBottomNav(currentScreen);
                if (currentScreen === 'home') renderHome();
                else if (currentScreen === 'learn') renderLearn();
                else if (currentScreen === 'progress') renderProgress();
                else if (currentScreen === 'settings') renderSettings();
            }
        }

        // ---------- onboarding ----------
        function renderOnboarding() {
            let html = `
                <div class="header">
                    <div class="header-left"><span class="title">Welcome</span></div>
                    <div class="profile-icon" id="profileBtnOnboard"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" stroke="currentColor" fill="none"/><path d="M5 20v-2a7 7 0 0 1 14 0v2" stroke="currentColor" fill="none"/></svg></div>
                </div>
                <div style="flex:1; display:flex; flex-direction:column; justify-content:center; text-align:center;">
                    <div class="logo-big" style="margin-bottom:24px">${icons.lesson}</div>
                    <h1 style="font-size:38px; font-weight:800; color:var(--text-primary);">Python·mini</h1>
                    <p style="font-size:16px; color:var(--text-secondary); margin:8px 20px;">write less, learn more</p>
                    <p style="color:var(--text-secondary); margin:12px 16px;">Bite‑sized Python exercises. Master loops, functions and logic in 5 min/day.</p>
                    <button class="btn-primary" id="getStartedBtn">Get Started</button>
                    <div class="link-group">
                        <span class="text-link" id="privacyLink">Privacy Policy</span>
                        <span class="text-link" id="termsLink">Terms of Service</span>
                    </div>
                </div>
            `;
            appView.innerHTML = html;
            document.getElementById('getStartedBtn').addEventListener('click', () => switchScreen('home'));
            document.getElementById('privacyLink').addEventListener('click', () => showModal('Privacy Policy','We respect your data. No tracking.'));
            document.getElementById('termsLink').addEventListener('click', () => showModal('Terms of Service','Enjoy learning! Acceptable use only.'));
            document.getElementById('profileBtnOnboard').addEventListener('click', () => switchScreen('settings'));
        }

        // ---------- home dashboard ----------
        function renderHome() {
            let html = `
                <div class="header">
                    <div class="header-left"><span class="title">Home</span></div>
                    <div class="profile-icon" id="profileHome"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" stroke="currentColor" fill="none"/><path d="M5 20v-2a7 7 0 0 1 14 0v2" stroke="currentColor" fill="none"/></svg></div>
                </div>
                <div class="card">
                    <div class="flex-row"><span style="font-weight:600">🔥 12 day streak</span><span class="badge">+50 XP</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:65%"></div></div>
                    <p style="color:var(--text-secondary)">Today's goal: 20 min · 65%</p>
                </div>
                <div class="card">
                    <h3>Continue learning</h3>
                    <div class="lesson-item"><span class="icon-symbol">${icons.lesson}</span><div><strong>Loops</strong><br><span style="font-size:13px">Lesson 4/6</span></div></div>
                    <div class="lesson-item"><span class="icon-symbol">${icons.flashcards}</span><div><strong>Functions</strong><br><span style="font-size:13px">3 flashcards left</span></div></div>
                </div>
                <div class="card">
                    <div style="display:flex; gap:12px; align-items:center;"><span class="icon-symbol">${icons.chart}</span><span style="font-weight:600">Weekly activity</span></div>
                    <div style="height:60px; display:flex; align-items:end; gap:6px; margin-top:12px;">
                        <div style="background:var(--icon-active); width:20%; height:30px; border-radius:8px;"></div><div style="background:var(--icon-active); width:20%; height:48px; border-radius:8px;"></div><div style="background:var(--icon-active); width:20%; height:22px;"></div><div style="background:var(--icon-active); width:20%; height:55px;"></div><div style="background:var(--icon-active); width:20%; height:40px;"></div>
                    </div>
                </div>
                <button class="btn-primary" id="practiceHome">Start practice →</button>
            `;
            appView.innerHTML = html;
            document.getElementById('profileHome').addEventListener('click', ()=>switchScreen('settings'));
            document.getElementById('practiceHome').addEventListener('click', ()=>switchScreen('learn'));
        }

        // ---------- learn ----------
        function renderLearn() {
            let html = `
                <div class="header"><div class="header-left"><span class="title">Learn</span></div><div class="profile-icon" id="profileLearn"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></svg></div></div>
                <div class="card">${icons.flashcards} <strong>Python basics</strong> <span style="float:right">75%</span><div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div></div>
                <div class="card"><div class="lesson-item"><span class="icon-symbol">${icons.play}</span><div><strong>Variables</strong><span style="margin-left:16px;color:var(--text-secondary)">5 min</span></div></div><div class="lesson-item"><span class="icon-symbol">${icons.play}</span><div><strong>Lists</strong><span style="margin-left:16px;color:var(--text-secondary)">8 min</span></div></div></div>
                <button class="btn-primary" id="smartPractice">Quick drill →</button>
            `;
            appView.innerHTML = html;
            document.getElementById('profileLearn')?.addEventListener('click', ()=>switchScreen('settings'));
            document.getElementById('smartPractice')?.addEventListener('click', ()=>alert('practice mode (demo)'));
        }

        // ---------- progress ----------
        function renderProgress() {
            let html = `
                <div class="header"><div class="header-left"><span class="title">Progress</span></div><div class="profile-icon" id="profileProgress"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></svg></div></div>
                <div class="stat-grid"><div class="stat-cell"><strong>340</strong> XP</div><div class="stat-cell"><strong>12</strong> days</div></div>
                <div class="card"><span>Lessons completed: 23</span><div class="progress-bar"><div class="progress-fill" style="width:46%"></div></div></div>
                <div class="card"><span>${icons.chart} Accuracy 88%</span></div>
            `;
            appView.innerHTML = html;
            document.getElementById('profileProgress')?.addEventListener('click', ()=>switchScreen('settings'));
        }

        // ---------- settings (profile) ----------
        function renderSettings() {
            let html = `
                <div class="header"><div class="header-left"><span class="title">Settings</span></div><div class="profile-icon" id="profileSettings"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></svg></div></div>
                <div class="card"><label style="display:flex; align-items:center; gap:12px"><span>Dark mode</span><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}></label></div>
                <div class="card"><span>Account: pythonista@learn.io</span></div>
                <div class="card"><span>Notifications on</span></div>
                <button class="btn-primary" id="logoutDummy">Back to home</button>
            `;
            appView.innerHTML = html;
            document.getElementById('profileSettings')?.addEventListener('click', ()=>switchScreen('settings'));
            document.getElementById('darkToggle')?.addEventListener('change', (e) => {
                darkMode = e.target.checked;
                document.querySelector('.phone').classList.toggle('dark-mode', darkMode);
            });
            document.getElementById('logoutDummy')?.addEventListener('click', ()=>switchScreen('home'));
        }

        // ---------- screenshot shift+w ----------
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                html2canvas?.(phone, { scale: 2 }).then(canvas => {
                    const link = document.createElement('a');
                    const isDark = document.querySelector('.phone')?.classList.contains('dark-mode');
                    let filename = (isDark ? '6.png' : (screenshotCounter + '.png'));
                    if (!isDark && screenshotCounter <=5) {
                        // but always count sequentially for first five
                        filename = screenshotCounter + '.png';
                        screenshotCounter = (screenshotCounter % 5) + 1;
                    } else if (isDark) {
                        filename = '6.png';
                    }
                    link.download = filename;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }).catch(() => alert('screenshot failed (html2canvas missing?)'));
            }
        });

        // load html2canvas from CDN
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        script.onload = () => console.log('screenshot ready');
        document.head.appendChild(script);

        // initial render
        renderScreen();
    })();
</script>
</body>
</html>
All done!
