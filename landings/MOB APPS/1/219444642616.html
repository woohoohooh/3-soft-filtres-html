```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSpark – JavaScript practice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #1a1e2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --border: #E2E8F0;
            --inactive: #94A3B8;
            --tab-highlight: rgba(37, 99, 235, 0.08);
        }
        .dark-mode {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --border: #334155;
            --inactive: #64748B;
            --tab-highlight: rgba(59, 130, 246, 0.15);
        }

        .phone-frame {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* main container */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: none;
            padding: 16px 16px 8px 16px;
        }
        .app-screen::-webkit-scrollbar { display: none; }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 16px 0;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
        }
        .profile-btn:hover { background: var(--tab-highlight); }

        /* bottom nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--card);
            padding: 8px 12px;
            border-top: 1px solid var(--border);
            border-radius: 0 0 44px 44px;
            height: 72px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            gap: 4px;
            cursor: pointer;
            flex: 1;
            transition: all 0.15s ease;
            padding: 6px 0;
            border-radius: 30px;
        }
        .nav-item.active {
            background: var(--tab-highlight);
        }
        .nav-item.active .nav-icon svg {
            stroke: var(--primary);
            transform: scale(1.15);
        }
        .nav-item .nav-icon svg {
            stroke: var(--inactive);
            transition: all 0.15s ease;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            color: var(--inactive);
        }
        .nav-item.active span {
            color: var(--primary);
            font-weight: 600;
        }

        /* cards & elements */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            border: 1px solid var(--border);
        }
        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            font-size: 18px;
            padding: 16px;
            border-radius: 60px;
            width: 100%;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 8px 14px -8px var(--primary);
        }
        .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }
        .small-link { color: var(--inactive); font-size: 12px; text-decoration: none; margin: 0 6px; }
        .modal-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.6);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: var(--card); padding: 28px; border-radius: 40px;
            width: 280px; text-align: center; color: var(--text);
        }
        .modal h3 { margin-bottom: 8px; }
        .modal button { margin-top: 16px; background: var(--primary); border: none; padding: 10px 24px; border-radius: 40px; color: white; font-weight: 600; cursor: pointer; }

        .lesson-row {
            display: flex; align-items: center; gap: 16px; padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }
        .lesson-row:last-child { border: none; }
        .badge {
            background: var(--accent); padding: 4px 12px; border-radius: 40px; color: #0F172A; font-weight: 500; font-size: 12px;
        }
        .progress-bar {
            background: var(--border); height: 8px; border-radius: 20px; width: 100%;
        }
        .progress-fill {
            background: var(--primary); width: 0%; height: 8px; border-radius: 20px;
            transition: width 0.3s;
        }
        .stat-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
        }

        /* icons (all inline) */
        .icon-defs { display: none; }
        svg { display: block; }
    </style>
</head>
<body>
<div class="phone-frame" id="phoneFrame">
    <!-- dynamic screens injected via js -->
    <div id="screenContainer" class="app-screen"></div>
    <!-- bottom nav fixed -->
    <div class="bottom-nav" id="bottomNav">
        <button class="nav-item" data-tab="home">
            <span class="nav-icon" id="icon-home"></span>
            <span>Home</span>
        </button>
        <button class="nav-item" data-tab="learn">
            <span class="nav-icon" id="icon-learn"></span>
            <span>Learn</span>
        </button>
        <button class="nav-item" data-tab="progress">
            <span class="nav-icon" id="icon-progress"></span>
            <span>Progress</span>
        </button>
        <button class="nav-item" data-tab="settings">
            <span class="nav-icon" id="icon-settings"></span>
            <span>Settings</span>
        </button>
    </div>
</div>

<script>
    (function() {
        // ---------- icon system ----------
        const icons = {
            home: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 Z"/></svg>`,
            learn: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6 L12 2 L22 6 L12 10 L2 6 Z"/><path d="M2 12 L12 16 L22 12"/><path d="M2 18 L12 22 L22 18"/></svg>`,
            progress: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3 L12 12 L17 14"/></svg>`,
            settings: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.5"/><path d="M19.4 7.5 C20 8.5 20 9.7 19.4 10.7 L18 13 C17.6 13.7 17.6 14.6 18 15.3 L19.4 17.6 C20 18.6 19.7 19.9 18.7 20.5 L17.3 21.3 C16.3 21.9 15.1 21.6 14.5 20.6 L13.1 18.3 C12.7 17.6 11.9 17.3 11.1 17.3 L8.9 17.3 C8.1 17.3 7.3 17.6 6.9 18.3 L5.5 20.6 C4.9 21.6 3.7 21.9 2.7 21.3 L1.3 20.5 C0.3 19.9 -0.0 18.6 0.6 17.6 L2 15.3 C2.4 14.6 2.4 13.7 2 13 L0.6 10.7 C-0.0 9.7 0.3 8.4 1.3 7.8 L2.7 7 C3.7 6.4 4.9 6.7 5.5 7.7 L6.9 10 C7.3 10.7 8.1 11 8.9 11 L11.1 11 C11.9 11 12.7 10.7 13.1 10 L14.5 7.7 C15.1 6.7 16.3 6.4 17.3 7 L18.7 7.8 C19.7 8.4 20 9.7 19.4 10.7 Z"/></svg>`,
            profile: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
            lesson: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="12" y2="17"/></svg>`,
            chart: `<svg width="22" height="22" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`,
            flashcards: `<svg width="22" height="22" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/></svg>`,
            play: `<svg width="22" height="22" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/></svg>`,
            check: `<svg width="22" height="22" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>`
        };

        // inject icons into nav
        document.getElementById('icon-home').innerHTML = icons.home;
        document.getElementById('icon-learn').innerHTML = icons.learn;
        document.getElementById('icon-progress').innerHTML = icons.progress;
        document.getElementById('icon-settings').innerHTML = icons.settings;

        // app state
        let currentScreen = 'onboarding'; // 'onboarding','home','learn','progress','settings'
        let darkMode = false;
        let screenshotCounter = 1;

        // ---------- render functions ----------
        function render() {
            const container = document.getElementById('screenContainer');
            if (currentScreen === 'onboarding') container.innerHTML = renderOnboarding();
            else if (currentScreen === 'home') container.innerHTML = renderHome();
            else if (currentScreen === 'learn') container.innerHTML = renderLearn();
            else if (currentScreen === 'progress') container.innerHTML = renderProgress();
            else if (currentScreen === 'settings') container.innerHTML = renderSettings();

            // update active tab
            document.querySelectorAll('.nav-item').forEach((btn, idx) => {
                const tab = btn.dataset.tab;
                if ((currentScreen === 'onboarding' && tab === 'home') || currentScreen === tab) {
                    btn.classList.add('active');
                } else btn.classList.remove('active');
            });

            // attach event listeners for UI
            attachEvents();
        }

        // onboarding
        function renderOnboarding() {
            return `
                <div class="header"><h1>CodeSpark</h1><button class="profile-btn" id="profileIcon">${icons.profile}</button></div>
                <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
                    <div style="font-size: 52px; margin-bottom:16px;">⚡</div>
                    <h2 style="font-size:32px; color:var(--primary);">CodeSpark</h2>
                    <p style="font-size:20px; font-weight:600; margin:8px 0 4px; color:var(--text);">JavaScript. Every day.</p>
                    <p style="color:var(--text-light); margin:8px 0 24px;">Bite‑size coding practice that fits your routine. Master JS one challenge at a time.</p>
                    <button class="btn-primary" id="getStartedBtn">Get Started</button>
                    <div style="margin-top: 32px; text-align:center;">
                        <a href="#" class="small-link" id="privacyLink">Privacy Policy</a> • <a href="#" class="small-link" id="termsLink">Terms of Service</a>
                    </div>
                </div>
            `;
        }

        function renderHome() {
            return `
                <div class="header"><h1>Home</h1><button class="profile-btn" id="profileIcon">${icons.profile}</button></div>
                <div class="card" style="background:linear-gradient(145deg, var(--primary), var(--accent)); color:white;">
                    <span style="font-size:20px; font-weight:600;">Daily streak: 7 days 🔥</span>
                    <div style="margin-top:12px;"><span>Today's challenge: closures</span></div>
                </div>
                <div class="card"><h3 style="margin-bottom:12px;">Continue learning</h3>
                    <div class="lesson-row"><span class="badge">JS</span> <span style="flex:1;">Functions & scope</span> <span>80%</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:80%"></div></div>
                    <div class="lesson-row"><span class="badge">JS</span> <span style="flex:1;">Array methods</span> <span>45%</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div>
                </div>
                <div class="card"><h3>Pick a quick lesson</h3>
                    <div style="display:flex; gap:16px; margin:16px 0 8px;">
                        <span>${icons.flashcards} Variables</span>
                        <span>${icons.lesson} Loops</span>
                        <span>${icons.play} Promises</span>
                    </div>
                </div>
            `;
        }

        function renderLearn() {
            return `
                <div class="header"><h1>Learn</h1><button class="profile-btn" id="profileIcon">${icons.profile}</button></div>
                <div class="card"><h3>JavaScript basics</h3>
                    <div class="lesson-row">${icons.lesson} <span>Variables & data types</span> ${icons.check}</div>
                    <div class="lesson-row">${icons.lesson} <span>Functions</span> ${icons.play}</div>
                    <div class="lesson-row">${icons.lesson} <span>Arrays</span> ${icons.play}</div>
                    <div class="lesson-row">${icons.flashcards} <span>ES6 features</span> ${icons.play}</div>
                </div>
                <div class="card"><h3>Practice (interactive)</h3><button class="btn-primary" style="font-size:16px; padding:12px;" id="startPracticeBtn">Start practice →</button></div>
            `;
        }

        function renderProgress() {
            return `
                <div class="header"><h1>Progress</h1><button class="profile-btn" id="profileIcon">${icons.profile}</button></div>
                <div class="card stat-grid">
                    <div><span style="color:var(--text-light);">Lessons done</span><br><span style="font-size:32px;">24</span></div>
                    <div><span style="color:var(--text-light);">Streak</span><br><span style="font-size:32px;">7🔥</span></div>
                </div>
                <div class="card"><h3>Weekly activity</h3>${icons.chart} <div style="height:80px; display:flex; align-items:end; gap:4px;"><div style="background:var(--primary); width:20%; height:40px; border-radius:12px;"></div><div style="background:var(--primary); width:20%; height:70px;"></div><div style="background:var(--primary); width:20%; height:50px;"></div><div style="background:var(--primary); width:20%; height:90px;"></div><div style="background:var(--accent); width:20%; height:30px;"></div></div></div>
                <div class="card">⭐ Achievements: 3 badges <br> <span>🔥 7 day streak · ⚡ Fast learner</span></div>
            `;
        }

        function renderSettings() {
            return `
                <div class="header"><h1>Settings</h1><button class="profile-btn" id="profileIcon">${icons.profile}</button></div>
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center;"><span>Dark theme</span><label><input type="checkbox" id="themeToggle" ${darkMode ? 'checked' : ''}></label></div>
                </div>
                <div class="card"><h3>Profile</h3><p>Name: Jane Coder</p>${icons.profile} <span>jane@example.com</span></div>
                <div class="card">Sound · Notifications · Language</div>
            `;
        }

        function attachEvents() {
            const profileBtn = document.getElementById('profileIcon');
            if (profileBtn) profileBtn.addEventListener('click', (e) => { e.stopPropagation(); currentScreen = 'settings'; render(); });

            const getStarted = document.getElementById('getStartedBtn');
            if (getStarted) getStarted.addEventListener('click', () => { currentScreen = 'home'; render(); });

            // privacy / terms modals
            const privacy = document.getElementById('privacyLink');
            const terms = document.getElementById('termsLink');
            if (privacy) privacy.addEventListener('click', (e) => { e.preventDefault(); showModal('Privacy Policy', 'We respect your data. (mock)'); });
            if (terms) terms.addEventListener('click', (e) => { e.preventDefault(); showModal('Terms of Service', 'Keep learning, be nice.'); });

            const startPractice = document.getElementById('startPracticeBtn');
            if (startPractice) startPractice.addEventListener('click', () => { alert('Practice started! (mock)'); });

            const themeToggle = document.getElementById('themeToggle');
            if (themeToggle) {
                themeToggle.addEventListener('change', (e) => {
                    darkMode = e.target.checked;
                    document.getElementById('phoneFrame').classList.toggle('dark-mode', darkMode);
                });
            }
        }

        function showModal(title, text) {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `<div class="modal"><h3>${title}</h3><p>${text}</p><button id="closeModalBtn">Close</button></div>`;
            document.querySelector('.phone-frame').appendChild(overlay);
            document.getElementById('closeModalBtn').addEventListener('click', () => overlay.remove());
            overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
        }

        // navigation
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const tab = btn.dataset.tab;
                if (tab === 'home' && currentScreen === 'onboarding') currentScreen = 'home';
                else if (tab !== 'home' && currentScreen === 'onboarding') currentScreen = tab;
                else currentScreen = tab;
                render();
            });
        });

        // screenshot: shift+W
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm').then(module => {
                    const canvasPromise = module.default(document.querySelector('.phone-frame'));
                    canvasPromise.then(canvas => {
                        const link = document.createElement('a');
                        let filename = (darkMode ? '6' : screenshotCounter) + '.png';
                        link.download = filename;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        if (!darkMode && screenshotCounter < 5) screenshotCounter++;
                    });
                });
            }
        });

        // init theme class
        document.getElementById('phoneFrame').classList.toggle('dark-mode', darkMode);

        // render initial screen
        render();

    })();
</script>
</body>
</html>
All done!
