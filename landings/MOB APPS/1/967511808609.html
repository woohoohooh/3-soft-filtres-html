```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Mentor • mobile prototype</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1e2b;
      padding: 16px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background-color: var(--bg-primary);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 0 0 0 8px #2d3344;
      position: relative;
      transition: background-color 0.2s;
    }

    .app-screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
      position: relative;
    }

    /* header */
    .header {
      padding: 20px 18px 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-muted);
    }

    .header h2 {
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -0.3px;
      color: var(--text-primary);
    }

    .profile-icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      transition: background 0.15s;
    }
    .profile-icon-btn:hover {
      background: var(--card-bg);
    }

    /* main content */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
      scrollbar-width: thin;
      scrollbar-color: var(--primary-light) var(--bg-secondary);
    }
    .content::-webkit-scrollbar {
      width: 4px;
    }
    .content::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }
    .content::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 8px;
    }

    /* bottom nav */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: var(--card-bg);
      padding: 8px 6px 10px;
      border-top: 1px solid var(--border-muted);
      backdrop-filter: blur(2px);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px 12px 4px;
      border-radius: 30px;
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1);
      color: var(--text-muted);
      fill: var(--text-muted);
    }

    .nav-item.active {
      background: rgba(37, 99, 235, 0.08);
      color: var(--primary);
      fill: var(--primary);
      transform: scale(1.02);
    }

    .nav-item.active svg {
      stroke: var(--primary);
      transform: scale(1.1);
    }

    .nav-item svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: transform 0.15s;
    }

    .nav-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    /* cards, UI */
    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 20px 18px;
      margin-bottom: 18px;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.02);
      border: 1px solid var(--border-muted);
    }

    .badge {
      background: var(--primary-soft);
      color: var(--primary-dark);
      padding: 6px 12px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      padding: 16px 24px;
      border-radius: 60px;
      font-size: 18px;
      width: 100%;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.25);
    }
    .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }

    .text-link {
      color: var(--text-muted);
      text-decoration: underline;
      background: none;
      border: none;
      font-size: 13px;
      cursor: pointer;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .progress-bar {
      height: 8px;
      background: var(--bg-secondary);
      border-radius: 40px;
      overflow: hidden;
      width: 100%;
    }
    .progress-fill {
      height: 8px;
      background: var(--primary);
      width: 0%;
      border-radius: 40px;
      transition: width 0.3s ease;
    }

    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(3px);
    }
    .modal {
      background: var(--card-bg);
      width: 280px;
      padding: 24px;
      border-radius: 32px;
      color: var(--text-primary);
      box-shadow: 0 30px 50px rgba(0,0,0,0.5);
    }
    .modal button {
      margin-top: 20px;
      background: var(--primary);
      border: none;
      color: white;
      padding: 12px;
      width: 100%;
      border-radius: 40px;
      font-weight: 600;
    }

    /* icons inline style */
    .icon-micro { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }

    /* theme vars */
    :root {
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --bg-primary: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-primary: #0F172A;
      --text-muted: #64748B;
      --bg-secondary: #E2E8F0;
      --border-muted: #E9EEF2;
      --primary-soft: #DBEAFE;
    }
    .dark-mode {
      --bg-primary: #0F172A;
      --card-bg: #1E293B;
      --text-primary: #E2E8F0;
      --text-muted: #94A3B8;
      --bg-secondary: #334155;
      --border-muted: #334155;
      --primary-soft: #1E3A5F;
    }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <div class="app-screen" id="appScreen">
    <!-- header injected per screen -->
    <div id="headerPlaceholder"></div>

    <!-- main content -->
    <div id="contentArea" class="content"></div>

    <!-- bottom nav -->
    <div class="bottom-nav" id="bottomNav"></div>
  </div>
</div>

<!-- modal container -->
<div id="modalContainer" style="position:absolute; top:0; left:0; width:100%; height:0;"></div>

<script>
  (function(){
    // ---------- THEME & STATE ----------
    let darkMode = false;
    let currentScreen = 'onboarding';  // screens: onboarding, home, learn, progress, settings

    // ---------- SVG ICONS (outline style, 2px, rounded) ----------
    const icons = {
      home: `<svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" stroke="currentColor" fill="none"/></svg>`,
      learn: `<svg viewBox="0 0 24 24"><path d="M4 19.5L12 14L20 19.5M12 4V14M12 14L19 9M12 14L5 9" stroke="currentColor" fill="none"/></svg>`,
      progress: `<svg viewBox="0 0 24 24"><path d="M21 12V18C21 19.1046 20.1046 20 19 20H5C3.89543 20 3 19.1046 3 18V12M7 10L12 5L17 10M12 5V16" stroke="currentColor" fill="none"/></svg>`,
      settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5" stroke="currentColor" fill="none"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82L12 22zM4.6 9a1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1.51 1h12.44a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82L12 2z" stroke="currentColor" fill="none"/></svg>`,
      profile: `<svg viewBox="0 0 24 24"><path d="M4 20C4 18 8 16 12 16C16 16 20 18 20 20M16 8C16 10.2091 14.2091 12 12 12C9.79086 12 8 10.2091 8 8C8 5.79086 9.79086 4 12 4C14.2091 4 16 5.79086 16 8Z" stroke="currentColor" fill="none"/></svg>`,
      lesson: `<svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="14" rx="2" stroke="currentColor" fill="none"/><path d="M8 10H16M8 14H12" stroke="currentColor"/></svg>`,
      chart: `<svg viewBox="0 0 24 24"><path d="M21 21H3V3M7 15L10 11L13 14L19 8" stroke="currentColor" fill="none"/></svg>`,
      flashcards: `<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" fill="none"/><path d="M9 7H15M9 11H12" stroke="currentColor"/></svg>`,
      play: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><polygon points="10 8 16 12 10 16 10 8" stroke="currentColor" fill="currentColor"/></svg>`,
      check: `<svg viewBox="0 0 24 24"><path d="M5 12L10 17L20 7" stroke="currentColor" fill="none"/></svg>`
    };

    // ---------- HELPER: render header ----------
    function renderHeader(title) {
      return `
        <div class="header">
          <h2>${title}</h2>
          <button class="profile-icon-btn" id="profileHeaderBtn">${icons.profile}</button>
        </div>
      `;
    }

    // ---------- SCREEN CONTENT ----------
    function getScreenContent(screen) {
      if (screen === 'onboarding') return `
        <div class="card" style="text-align: center; margin-top: 20px;">
          <div style="background: var(--primary-soft); width: 70px; height: 70px; border-radius: 24px; margin: 20px auto 16px; display: flex; align-items: center; justify-content: center;">
            <span style="font-size: 38px; font-weight: 700; color: var(--primary);">Py</span>
          </div>
          <h1 style="font-size: 38px; font-weight: 700; letter-spacing: -1px;">Python<br>Mentor</h1>
          <p style="font-size: 16px; color: var(--primary); font-weight: 500; margin: 8px 0;">learn to code in 5 min/day</p>
          <p style="color: var(--text-muted); margin: 18px 0 28px;">Interactive Python exercises, real‑time feedback, and smart revision.</p>
          <button class="btn-primary" id="getStartedBtn">Get Started</button>
          <div style="margin: 20px 0 12px; display: flex; gap: 24px; justify-content: center;">
            <button class="text-link" id="privacyLink">Privacy Policy</button>
            <button class="text-link" id="termsLink">Terms of Service</button>
          </div>
        </div>
      `;
      else if (screen === 'home') return `
        <div class="card" style="display: flex; align-items: center; gap: 12px;">
          <span class="badge">🔥 12 day streak</span>
          <span class="badge">⭐ 340 XP</span>
        </div>
        <div class="card">
          <h3 style="margin-bottom: 16px;">Continue lesson</h3>
          <div class="row">
            ${icons.lesson} <span><strong>Variables & Data types</strong>  78%</span>
          </div>
          <div class="progress-bar" style="margin: 12px 0 20px;"><div class="progress-fill" style="width:78%"></div></div>
          <button class="btn-primary" style="padding:12px;" id="continueLearnBtn">Continue practice</button>
        </div>
        <div class="card">
          <div style="display: flex; justify-content: space-between;">
            <span><strong>Daily pick</strong></span> <span>${icons.flashcards} 3 challenges</span>
          </div>
          <div style="display: flex; gap: 16px; margin-top: 16px;">
            <span style="background: var(--bg-secondary); padding: 10px; border-radius: 20px;">🐍 lists</span>
            <span style="background: var(--bg-secondary); padding: 10px; border-radius: 20px;">🔁 loops</span>
            <span style="background: var(--bg-secondary); padding: 10px; border-radius: 20px;">📚 dicts</span>
          </div>
        </div>
        <div class="card">
          <span><strong>Your achievements</strong></span>
          <div style="display: flex; gap: 20px; margin-top: 16px;">
            <div>🔥 7d</div><div>⚡ 200 ex</div><div>🏆 beginner</div>
          </div>
        </div>
      `;
      else if (screen === 'learn') return `
        <div class="card"><input type="text" placeholder="Search lessons..." style="width:100%; padding:14px; border-radius: 40px; border:1px solid var(--border-muted); background: var(--card-bg); color: var(--text-primary);"></div>
        <div class="card">
          <div style="display:flex; justify-content: space-between;"><span><strong>Basics</strong></span><span>${icons.check} 4/6</span></div>
          <div class="progress-bar" style="margin:8px 0;"><div class="progress-fill" style="width:66%"></div></div>
          <div style="margin-top: 16px;">⬤ Variables <span style="float:right;">${icons.play}</span></div>
          <div style="margin-top: 12px;">⬤ Strings <span style="float:right;">${icons.play}</span></div>
        </div>
        <div class="card">
          <div><strong>Control flow</strong> <span style="float:right;">🔒 2 locked</span></div>
          <div style="margin-top: 16px; opacity:0.5;">⬤ if/else</div>
        </div>
        <div class="card">
          <div><strong>Functions</strong> <span style="float:right;">⭐ 4 exercises</span></div>
        </div>
      `;
      else if (screen === 'progress') return `
        <div class="card">
          <h3>Weekly activity</h3>
          <div style="display:flex; gap:8px; margin:20px 0; align-items:flex-end; height:120px;">
            <div style="flex:1; background:var(--primary); height:70px; border-radius:12px;"></div>
            <div style="flex:1; background:var(--primary); height:100px;"></div>
            <div style="flex:1; background:var(--primary); height:50px;"></div>
            <div style="flex:1; background:var(--primary); height:85px;"></div>
            <div style="flex:1; background:var(--accent); height:40px;"></div>
          </div>
        </div>
        <div class="card">
          <div><strong>Total lessons</strong> 34</div><progress value="34" max="100" style="width:100%;"></progress>
          <div style="margin-top:12px;"><strong>Practice minutes</strong> 247</div>
          <div style="margin-top:12px;">🏅 Python basics mastered</div>
        </div>
        <div class="card">${icons.chart}  <span>Accuracy 84% ↑12%</span></div>
      `;
      else if (screen === 'settings') return `
        <div class="card">
          <div style="display: flex; align-items: center; gap: 12px;">${icons.profile} <span><strong>Alex Chen</strong>  ·  beginner</span></div>
        </div>
        <div class="card">
          <div style="display:flex; justify-content: space-between;">
            <span>Dark mode</span>
            <label class="switch"><input type="checkbox" id="darkModeToggle" ${darkMode ? 'checked' : ''} style="transform: scale(1.2);"></label>
          </div>
        </div>
        <div class="card">Notification preferences</div>
        <div class="card">Sound effects & voice</div>
        <div class="card">Privacy & Terms</div>
        <div class="card">App version 2.4.0 · 2026</div>
      `;
    }

    // ---------- RENDER UI (header, content, bottom nav) ----------
    function renderApp() {
      const headerPlaceholder = document.getElementById('headerPlaceholder');
      const contentArea = document.getElementById('contentArea');
      const bottomNav = document.getElementById('bottomNav');

      // header title map
      const headerTitle = {
        onboarding: '✨ Python',
        home: 'Home',
        learn: 'Learn',
        progress: 'Progress',
        settings: 'Settings'
      };

      headerPlaceholder.innerHTML = renderHeader(headerTitle[currentScreen]);

      // main content
      contentArea.innerHTML = getScreenContent(currentScreen);

      // bottom nav (hidden on onboarding)
      if (currentScreen === 'onboarding') {
        bottomNav.style.display = 'none';
      } else {
        bottomNav.style.display = 'flex';
        const navItems = [
          { id: 'home', label: 'Home', icon: icons.home },
          { id: 'learn', label: 'Learn', icon: icons.learn },
          { id: 'progress', label: 'Progress', icon: icons.progress },
          { id: 'settings', label: 'Settings', icon: icons.settings }
        ];
        bottomNav.innerHTML = navItems.map(item => `
          <button class="nav-item ${currentScreen === item.id ? 'active' : ''}" data-nav="${item.id}">
            ${item.icon}
            <span class="nav-label">${item.label}</span>
          </button>
        `).join('');
      }

      // Attach nav listeners
      document.querySelectorAll('.nav-item[data-nav]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const target = btn.dataset.nav;
          if (target) { currentScreen = target; renderApp(); }
        });
      });

      // profile button (open settings)
      const profileBtn = document.getElementById('profileHeaderBtn');
      if (profileBtn) profileBtn.addEventListener('click', () => { currentScreen = 'settings'; renderApp(); });

      // specific onboarding btns
      if (currentScreen === 'onboarding') {
        document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
          currentScreen = 'home'; renderApp();
        });
        document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy Policy', 'We respect your data. No tracking.'));
        document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms of Service', 'Free for personal use.'));
      }

      // dark mode toggle inside settings
      if (currentScreen === 'settings') {
        const toggle = document.getElementById('darkModeToggle');
        if (toggle) {
          toggle.checked = darkMode;
          toggle.addEventListener('change', (e) => {
            darkMode = e.target.checked;
            document.body.classList.toggle('dark-mode', darkMode);
            document.querySelector('.phone').classList.toggle('dark-mode', darkMode);
            renderApp(); // refresh icon state
          });
        }
      }

      // continue button on home -> learn
      if (currentScreen === 'home') {
        document.getElementById('continueLearnBtn')?.addEventListener('click', ()=>{
          currentScreen = 'learn'; renderApp();
        });
      }
    }

    // modal system
    function showModal(title, text) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `<div class="modal"><h3>${title}</h3><p style="margin:20px 0;">${text}</p><button id="closeModalBtn">OK</button></div>`;
      document.getElementById('modalContainer').appendChild(overlay);
      document.getElementById('closeModalBtn').addEventListener('click', ()=> overlay.remove());
      overlay.addEventListener('click', (e) => { if(e.target===overlay) overlay.remove(); });
    }

    // initial render
    renderApp();

    // ---------- SCREENSHOT feature SHIFT+W ----------
    let screenshotCounter = 1;
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const phone = document.getElementById('phoneContainer');
        html2canvas?.(phone, { scale: 2 }).then(canvas => {
          const link = document.createElement('a');
          const isDark = darkMode;
          let filename = isDark ? '6.png' : (screenshotCounter + '.png');
          if (!isDark && screenshotCounter <=5) {
            // sequential 1..5
            filename = screenshotCounter + '.png';
            screenshotCounter = (screenshotCounter % 5) + 1;
          } else if (isDark) {
            filename = '6.png';
          }
          link.download = filename;
          link.href = canvas.toDataURL('image/png');
          link.click();
        }).catch(() => alert('html2canvas not loaded — but this is a demo.'));
      }
    });

    // fake html2canvas fallback for demo (just alert)
    if (!window.html2canvas) {
      window.html2canvas = (el) => {
        alert('screenshot simulation: ' + (darkMode? '6.png' : screenshotCounter+'.png') + ' saved (mock)');
        return Promise.reject();
      };
    }
    // END screenshot

  })();
</script>

<!-- html2canvas library for real screenshot -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<div style="display: none;">icons placeholder</div>
</body>
</html>
