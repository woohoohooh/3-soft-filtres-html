```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Brain Trainer · 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      min-height: 100vh;
      background: #1a2639;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #0F172A;
      --text-light: #334155;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --grey: #94A3B8;
      --grey-light: #E2E8F0;
      --header-icon: #1E293B;
      --nav-inactive: #94A3B8;
      --shadow: 0 20px 35px -8px rgba(0,0,0,0.1), 0 5px 15px rgba(0,0,0,0.05);
    }
    body.dark {
      --bg: #0F172A;
      --card: #1E293B;
      --text: #E2E8F0;
      --text-light: #CBD5E1;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --grey: #64748B;
      --grey-light: #334155;
      --header-icon: #F1F5F9;
      --nav-inactive: #64748B;
      --shadow: 0 20px 35px -8px rgba(0,0,0,0.6);
    }
    .phone-mock {
      width: 360px;
      height: 780px;
      background: var(--bg);
      border-radius: 48px;
      box-shadow: var(--shadow), 0 0 0 10px #2d3a4e;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: background 0.2s;
    }
    .app-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--grey) var(--bg);
      padding: 0 16px;
    }
    .app-screen::-webkit-scrollbar {
      width: 4px;
    }
    .app-screen::-webkit-scrollbar-thumb {
      background: var(--grey);
      border-radius: 20px;
    }
    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 8px 0;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .header h2 {
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    .profile-icon {
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .profile-icon svg {
      width: 26px;
      height: 26px;
      stroke: var(--header-icon);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* bottom nav */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: var(--card);
      padding: 8px 0 14px;
      border-top: 1px solid var(--grey-light);
      box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
      transition: all 0.1s;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
      border: none;
      cursor: pointer;
      gap: 4px;
      transition: all 0.15s ease;
      padding: 4px 12px;
      border-radius: 30px;
    }
    .nav-item svg {
      width: 24px;
      height: 24px;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: all 0.15s;
    }
    .nav-item span {
      font-size: 11px;
      font-weight: 500;
      transition: all 0.15s;
    }
    .nav-item.active {
      background: rgba(37, 99, 235, 0.1);
    }
    .nav-item.active svg {
      stroke: var(--primary);
      transform: scale(1.1);
      stroke-width: 2.4;
    }
    .nav-item.active span {
      color: var(--primary);
      font-weight: 600;
    }
    .nav-item.inactive svg {
      stroke: var(--nav-inactive);
    }
    .nav-item.inactive span {
      color: var(--nav-inactive);
    }
    /* onboarding cards */
    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 40px 0 20px;
    }
    .app-logo-svg svg {
      width: 70px;
      height: 70px;
      stroke: var(--primary);
      stroke-width: 2;
      fill: none;
    }
    .app-name {
      font-size: 32px;
      font-weight: 700;
      color: var(--primary);
      margin: 8px 0 4px;
    }
    .tagline {
      font-size: 18px;
      font-weight: 500;
      color: var(--accent);
    }
    .desc {
      color: var(--text-light);
      text-align: center;
      margin: 16px 0;
      line-height: 1.5;
    }
    .btn-primary {
      background: var(--primary);
      border: none;
      color: white;
      width: 100%;
      padding: 16px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37,99,235,0.3);
      transition: 0.1s;
      margin: 24px 0 16px;
    }
    .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }
    .legal-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 14px;
    }
    .legal-links button {
      background: none;
      border: none;
      color: var(--grey);
      text-decoration: underline;
      cursor: pointer;
    }
    /* cards */
    .dashboard-card {
      background: var(--card);
      border-radius: 28px;
      padding: 20px 18px;
      margin-bottom: 16px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.03), 0 0 0 1px var(--grey-light) inset;
    }
    .flex-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .progress-bar-bg {
      height: 10px;
      background: var(--grey-light);
      border-radius: 20px;
      margin: 12px 0;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 20px;
      transition: width 0.3s ease;
    }
    .badge-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 10px 0;
    }
    .badge {
      background: var(--primary);
      color: white;
      border-radius: 40px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }
    .stat-item {
      background: var(--bg);
      border-radius: 24px;
      padding: 16px 10px;
      text-align: center;
    }
    .lesson-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--grey-light);
    }
    .lesson-item:last-child { border-bottom: none; }
    /* modal */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-content {
      background: var(--card);
      padding: 28px 24px;
      border-radius: 40px;
      width: 280px;
      text-align: center;
      color: var(--text);
    }
    .modal-content button {
      margin-top: 24px;
      background: var(--primary);
      border: none;
      color: white;
      padding: 10px 30px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
    }
    .hidden { display: none; }
    .mt-4 { margin-top: 16px; }
    .icon-small svg { width: 20px; height: 20px; stroke: currentColor; }
  </style>
</head>
<body>
<div class="phone-mock" id="phoneContainer">
  <!-- header (dynamic via js) -->
  <div id="headerContainer" class="header"></div>

  <!-- main screen content -->
  <div id="screenContent" class="app-screen"></div>

  <!-- bottom navigation (fixed) -->
  <div class="bottom-nav" id="bottomNav"></div>
</div>

<script>
  (function(){
    // ------ LIGHT / DARK ------
    let darkMode = false;
    const htmlBody = document.body;
    const container = document.getElementById('phoneContainer');

    // ------ APP STATE ------
    let currentScreen = 'onboarding'; // 'home','learn','progress','settings'
    let modalActive = false;

    // ------ ICON SYSTEM (inline SVG) ------
    function iconHome(active = false) { return `<svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" stroke="currentColor" fill="none"/></svg>`; }
    function iconLearn(active = false) { return `<svg viewBox="0 0 24 24"><path d="M2 3H8C10.2 3 12 4.8 12 7V21C12 19.9 11.1 19 10 19H2V3Z" stroke="currentColor" fill="none"/><path d="M22 3H16C13.8 3 12 4.8 12 7V21C12 19.9 12.9 19 14 19H22V3Z" stroke="currentColor" fill="none"/></svg>`; }
    function iconProgress(active = false) { return `<svg viewBox="0 0 24 24"><path d="M21 12V19C21 20.1 20.1 21 19 21H5C3.9 21 3 20.1 3 19V5C3 3.9 3.9 3 5 3H12" stroke="currentColor" fill="none" stroke-linecap="round"/><circle cx="18" cy="6" r="2" stroke="currentColor" fill="none"/><path d="M8 16L11 12L14 15L21 7" stroke="currentColor" fill="none" stroke-linecap="round"/></svg>`; }
    function iconSettings(active = false) { return `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor" fill="none"/><path d="M19.4 15C19 15.6 18.7 16.2 18.2 16.7L19.5 19L17.9 20.5L15.5 19.2C14.9 19.5 14.2 19.8 13.5 19.9L12 22H10L8.5 19.9C7.8 19.7 7.2 19.4 6.5 19.2L4.1 20.5L2.5 19L3.8 16.6C3.5 16 3.2 15.4 3.1 14.7L1 13.2V11.2L3.1 9.7C3.3 9 3.6 8.3 3.8 7.7L2.5 5.4L4.1 3.8L6.5 5.1C7.1 4.8 7.8 4.5 8.5 4.3L10 2H12L13.5 4.1C14.2 4.3 14.8 4.6 15.5 4.9L17.9 3.6L19.5 5.2L18.2 7.6C18.5 8.2 18.8 8.9 19 9.6L21 11.1V13.1L19.4 15Z" stroke="currentColor" fill="none"/></svg>`; }
    function iconProfile() { return `<svg viewBox="0 0 24 24"><path d="M20 21V19C20 16.8 18.2 15 16 15H8C5.8 15 4 16.8 4 19V21" stroke="currentColor" fill="none" stroke-linecap="round"/><circle cx="12" cy="7" r="4" stroke="currentColor" fill="none"/></svg>`; }
    function iconLesson() { return `<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2" stroke="currentColor" fill="none"/><path d="M8 7H16" stroke="currentColor" stroke-linecap="round"/><path d="M8 12H16" stroke="currentColor" stroke-linecap="round"/><path d="M8 17H13" stroke="currentColor" stroke-linecap="round"/></svg>`; }
    function iconChart() { return `<svg viewBox="0 0 24 24"><path d="M21 21H3V3" stroke="currentColor" fill="none" stroke-linecap="round"/><path d="M7 15V10" stroke="currentColor" stroke-width="2"/><path d="M12 15V7" stroke="currentColor" stroke-width="2"/><path d="M17 15V13" stroke="currentColor" stroke-width="2"/></svg>`; }
    function iconFlashcards() { return `<svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2" stroke="currentColor" fill="none"/><path d="M9 8H15" stroke="currentColor"/><path d="M9 12H15" stroke="currentColor"/><path d="M9 16H12" stroke="currentColor"/></svg>`; }
    function iconPlay() { return `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><path d="M10 8L16 12L10 16V8Z" stroke="currentColor" fill="none"/></svg>`; }
    function iconCheck() { return `<svg viewBox="0 0 24 24"><path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2" fill="none"/></svg>`; }

    // ----- RENDER FUNCTIONS -----
    function renderHeader(title) {
      return `<h2>${title}</h2>
        <button class="profile-icon" id="profileBtn">${iconProfile()}</button>`;
    }

    function renderBottomNav(active) {
      const items = ['home', 'learn', 'progress', 'settings'];
      const labels = ['Home', 'Learn', 'Progress', 'Settings'];
      const icons = [iconHome, iconLearn, iconProgress, iconSettings];
      return items.map((id, idx) => {
        const isActive = active === id;
        return `<button class="nav-item ${isActive ? 'active' : 'inactive'}" data-nav="${id}">
          ${icons[idx](isActive)}
          <span>${labels[idx]}</span>
        </button>`;
      }).join('');
    }

    function onNavigate(screen) {
      if (modalActive) return;
      currentScreen = screen;
      updateUI();
    }

    function openModal(text) {
      modalActive = true;
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.id = 'modalOverlay';
      overlay.innerHTML = `<div class="modal-content"><p>${text}</p><button id="closeModalBtn">Close</button></div>`;
      container.appendChild(overlay);
      document.getElementById('closeModalBtn').addEventListener('click', () => {
        overlay.remove();
        modalActive = false;
      });
    }

    // ------ SCREEN BUILDERS ------
    function screenOnboarding() {
      return `
        <div class="logo-area">
          <div class="app-logo-svg">${iconLearn()}</div>
          <div class="app-name">Math Mind</div>
          <div class="tagline">train your brain daily</div>
        </div>
        <p class="desc">Quick mental math & logic challenges. 5-min workouts to boost your number sense.</p>
        <button class="btn-primary" id="getStartedBtn">Get Started</button>
        <div class="legal-links">
          <button id="privacyBtn">Privacy</button>
          <button id="termsBtn">Terms</button>
        </div>
        <div style="margin: 20px 0;"></div>
      `;
    }

    function screenHome() {
      return `
        <div class="dashboard-card">
          <div class="flex-row"><span style="font-weight:600;">🔥 Daily streak</span><span>7 days</span></div>
          <div class="progress-bar-bg"><div class="progress-fill" style="width:70%"></div></div>
          <div class="badge-group">
            <span class="badge">${iconFlashcards()} 4 left</span>
            <span class="badge">${iconPlay()} practice</span>
          </div>
        </div>
        <div class="dashboard-card">
          <div class="flex-row"><span style="font-weight:600;">Recommended for you</span><span>→</span></div>
          <div class="lesson-item">${iconLesson()} <span>Times tables · 3 min</span></div>
          <div class="lesson-item">${iconFlashcards()} <span>Division flashcards</span></div>
          <div class="lesson-item">${iconPlay()} <span>Mental math game</span></div>
        </div>
        <div class="dashboard-card">
          <div style="font-weight:600;">Today's brain warmup</div>
          <div class="progress-bar-bg mt-4"><div class="progress-fill" style="width:45%"></div></div>
          <div style="display:flex; justify-content:space-between; margin:6px 0;"><span>45% complete</span><button id="startPracticeHome" class="badge" style="background:var(--primary);">continue</button></div>
        </div>
      `;
    }

    function screenLearn() {
      return `
        <div class="dashboard-card">
          <div style="font-size:18px; font-weight:600;">📘 Math fundamentals</div>
          ${[1,2,3].map(i=>`<div class="lesson-item">${iconLesson()} <span>Lesson ${i}: Arithmetic ${i}</span> <span style="margin-left:auto;color:var(--primary);">${i==1?'75%':i==2?'30%':'new'}</span></div>`).join('')}
          <button id="startPracticeLearn" class="btn-primary" style="padding:12px;margin-top:12px;">Start practice</button>
        </div>
        <div class="dashboard-card">
          <span style="font-weight:600;">Today's goal</span>
          <div class="progress-bar-bg"><div class="progress-fill" style="width:60%"></div></div>
        </div>
      `;
    }

    function screenProgress() {
      return `
        <div class="dashboard-card">
          <div class="flex-row"><span>📊 Last 7 days</span>${iconChart()}</div>
          <div style="height:60px; display:flex; gap:4px; align-items:flex-end; margin:20px 0;">
            <div style="flex:1; height:30px; background:var(--primary); border-radius:10px;"></div>
            <div style="flex:1; height:45px; background:var(--primary); border-radius:10px;"></div>
            <div style="flex:1; height:20px; background:var(--primary); border-radius:10px;"></div>
            <div style="flex:1; height:55px; background:var(--accent); border-radius:10px;"></div>
            <div style="flex:1; height:40px; background:var(--primary); border-radius:10px;"></div>
            <div style="flex:1; height:25px; background:var(--primary); border-radius:10px;"></div>
            <div style="flex:1; height:60px; background:var(--primary); border-radius:10px;"></div>
          </div>
        </div>
        <div class="dashboard-card stat-grid">
          <div class="stat-item"><span style="font-size:24px; font-weight:700;">78</span><br>problems</div>
          <div class="stat-item"><span style="font-size:24px;">12</span><br>streak</div>
          <div class="stat-item"><span style="font-size:24px;">3</span><br>badges</div>
          <div class="stat-item"><span style="font-size:24px;">8d</span><br>top week</div>
        </div>
        <div class="dashboard-card">${iconCheck()} Achievements: Quick starter, +</div>
      `;
    }

    function screenSettings() {
      return `
        <div class="dashboard-card">
          <div class="flex-row"><span>🌙 Dark mode</span><label><input type="checkbox" id="darkModeToggle" ${darkMode ? 'checked' : ''}></label></div>
          <div class="lesson-item">${iconProfile()} Account</div>
          <div class="lesson-item">${iconSettings()} Preferences</div>
          <div class="lesson-item">Notifications</div>
          <div class="lesson-item">Sound</div>
        </div>
      `;
    }

    function updateUI() {
      const headerDiv = document.getElementById('headerContainer');
      const contentDiv = document.getElementById('screenContent');
      const navDiv = document.getElementById('bottomNav');

      let screenTitle = 'Math Mind';
      if (currentScreen === 'onboarding') screenTitle = 'Welcome';
      else if (currentScreen === 'home') screenTitle = 'Home';
      else if (currentScreen === 'learn') screenTitle = 'Learn';
      else if (currentScreen === 'progress') screenTitle = 'Progress';
      else if (currentScreen === 'settings') screenTitle = 'Settings';

      headerDiv.innerHTML = renderHeader(screenTitle);
      if (currentScreen === 'onboarding') contentDiv.innerHTML = screenOnboarding();
      else if (currentScreen === 'home') contentDiv.innerHTML = screenHome();
      else if (currentScreen === 'learn') contentDiv.innerHTML = screenLearn();
      else if (currentScreen === 'progress') contentDiv.innerHTML = screenProgress();
      else if (currentScreen === 'settings') contentDiv.innerHTML = screenSettings();

      navDiv.innerHTML = renderBottomNav(currentScreen === 'onboarding' ? 'home' : currentScreen);

      // attach events
      document.querySelectorAll('[data-nav]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const nav = e.currentTarget.dataset.nav;
          onNavigate(nav);
        });
      });

      const profileBtn = document.getElementById('profileBtn');
      if (profileBtn) profileBtn.addEventListener('click', () => { onNavigate('settings'); });

      if (currentScreen === 'onboarding') {
        document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{ onNavigate('home'); });
        document.getElementById('privacyBtn')?.addEventListener('click', ()=>{ openModal('Privacy policy — dummy text.'); });
        document.getElementById('termsBtn')?.addEventListener('click', ()=>{ openModal('Terms of service — dummy text.'); });
      }
      if (currentScreen === 'home') {
        document.getElementById('startPracticeHome')?.addEventListener('click', ()=>{ onNavigate('learn'); });
      }
      if (currentScreen === 'learn') {
        document.getElementById('startPracticeLearn')?.addEventListener('click', ()=>{ alert('practice started!'); });
      }
      if (currentScreen === 'settings') {
        const toggle = document.getElementById('darkModeToggle');
        if (toggle) {
          toggle.checked = darkMode;
          toggle.addEventListener('change', (e) => {
            darkMode = e.target.checked;
            if (darkMode) htmlBody.classList.add('dark');
            else htmlBody.classList.remove('dark');
            updateUI();
          });
        }
      }
    }

    // ------ SCREENSHOT FEATURE (SHIFT+W) ------
    let screenshotCounter = 1;
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const phone = document.getElementById('phoneContainer');
        import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm').then(module => {
          const html2canvas = module.default;
          html2canvas(phone, { scale: 2, backgroundColor: null }).then(canvas => {
            const link = document.createElement('a');
            const isDark = document.body.classList.contains('dark');
            let filename = isDark ? '6.png' : (screenshotCounter + '.png');
            if (!isDark && screenshotCounter <=5) { link.download = screenshotCounter+'.png'; screenshotCounter = (screenshotCounter %5)+1; }
            else if (isDark) link.download = '6.png';
            else link.download = '1.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
          });
        }).catch(()=> alert('html2canvas failed'));
