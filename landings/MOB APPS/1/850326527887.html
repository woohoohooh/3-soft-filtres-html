```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabMaster • 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --border: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --success: #10B981;
            --warning: #F59E0B;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --border: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --inactive: #64748B;
        }

        body {
            background: #1a202c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
            transition: background 0.2s, color 0.2s;
            display: flex;
            flex-direction: column;
        }

        /* screen wrapper */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .app-screen::-webkit-scrollbar { display: none; }

        /* header */
        .header {
            padding: 16px 20px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }
        .header h2 { font-size: 1.4rem; font-weight: 600; color: var(--text); letter-spacing: -0.3px; }
        .profile-icon { cursor: pointer; padding: 4px; }

        /* bottom nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 10px;
            background: var(--card);
            border-top: 1px solid var(--border);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 4px 10px;
            border-radius: 20px;
            background: transparent;
        }
        .nav-item.active {
            background: rgba(37, 99, 235, 0.08);
            transform: scale(1.05);
        }
        .nav-item.active .nav-icon { color: var(--primary); stroke: var(--primary); stroke-width: 2.2; }
        .nav-item .nav-icon { stroke: var(--inactive); stroke-width: 2; fill: none; transition: stroke 0.1s; }
        .nav-label { font-size: 0.7rem; font-weight: 500; color: var(--text-light); }
        .nav-item.active .nav-label { color: var(--primary); font-weight: 600; }

        /* content */
        .content {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* cards */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        /* modal */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: var(--card);
            width: 280px;
            border-radius: 32px;
            padding: 28px 24px;
            color: var(--text);
            box-shadow: 0 30px 50px black;
        }
        .modal-card button {
            margin-top: 20px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 40px;
            font-weight: 600;
            width: 100%;
        }

        /* buttons */
        .btn-primary {
            background: var(--primary);
            color: white;
            font-weight: 600;
            border: none;
            padding: 16px;
            border-radius: 60px;
            font-size: 1.1rem;
            box-shadow: 0 8px 20px -8px var(--primary);
            transition: 0.1s;
            cursor: pointer;
        }
        .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }

        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 16px;
            font-size: 0.8rem;
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
        }

        /* progress */
        .progress-bar {
            height: 8px;
            background: var(--border);
            border-radius: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* icons inline */
        .icon-svg { width: 24px; height: 24px; display: block; }

        /* chart simulation */
        .chart-row {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 80px;
            margin-top: 10px;
        }
        .bar {
            width: 22px;
            background: var(--primary);
            border-radius: 12px 12px 4px 4px;
            transition: height 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="phone" id="phoneContainer">
        <div class="app-screen" id="appScreen">
            <!-- header injected via JS -->
            <div id="headerPlaceholder"></div>
            <!-- main content -->
            <div id="contentArea" class="content"></div>
            <!-- bottom nav -->
            <div class="bottom-nav" id="bottomNav"></div>
        </div>
        <!-- modal container -->
        <div class="modal" id="modal"><div class="modal-card" id="modalContent"></div></div>
    </div>

    <script>
        (function() {
            // ---------- SVG ICONS (inline, same style) ----------
            const icons = {
                home: `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 L12 3 L21 10 L21 20 L15 20 L15 14 L9 14 L9 20 L3 20 Z"/></svg>`,
                learn: `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2 6 L12 2 L22 6 L12 10 L2 6 Z M2 6 L2 16 L12 20 L22 16 L22 6 M8 9 L8 14 L16 17 L16 12"/></svg>`,
                progress: `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 7 L12 12 L15 15 M12 3 L12 5 M21 12 L19 12 M5 12 L3 12 M12 19 L12 21"/></svg>`,
                settings: `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M20 7 L20 10 M20 14 L20 17 M4 7 L4 10 M4 14 L4 17 M7 4 L10 4 M14 4 L17 4 M7 20 L10 20 M14 20 L17 20"/></svg>`,
                profile: `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 20 L5 18 C5 14 9 14 12 14 C15 14 19 14 19 18 L19 20 M12 4 C14 4 16 6 16 9 C16 12 14 14 12 14 C10 14 8 12 8 9 C8 6 10 4 12 4 Z"/></svg>`,
                lesson: `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4 L20 4 L20 20 L4 20 Z M8 8 L16 8 M8 12 L16 12 M8 16 L13 16"/></svg>`,
                chart: `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 17 L9 11 L13 15 L21 7 M21 3 L21 21 L3 21 L3 3"/></svg>`,
                flashcards: `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8 L15 8 M9 12 L15 12 M9 16 L13 16"/></svg>`,
                play: `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M10 8 L16 12 L10 16 Z"/></svg>`,
                check: `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6 L9 17 L4 12"/></svg>`
            };

            // ---------- state ----------
            let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
            let darkMode = false;
            let screenshotCounter = 1;

            // ---------- DOM elements ----------
            const headerPlaceholder = document.getElementById('headerPlaceholder');
            const contentArea = document.getElementById('contentArea');
            const bottomNav = document.getElementById('bottomNav');
            const modal = document.getElementById('modal');
            const modalContent = document.getElementById('modalContent');

            // ---------- helper: render header ----------
            function renderHeader(title) {
                headerPlaceholder.innerHTML = `
                    <div class="header">
                        <h2>${title}</h2>
                        <div class="profile-icon" id="profileBtn">${icons.profile}</div>
                    </div>
                `;
                document.getElementById('profileBtn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    navigateTo('settings');
                });
            }

            // ---------- render bottom nav (4 items) ----------
            function renderBottomNav(active) {
                const items = [
                    { id: 'home', label: 'Home', icon: icons.home },
                    { id: 'learn', label: 'Learn', icon: icons.learn },
                    { id: 'progress', label: 'Progress', icon: icons.progress },
                    { id: 'settings', label: 'Settings', icon: icons.settings }
                ];
                let html = '';
                items.forEach(item => {
                    const activeClass = (active === item.id) ? 'active' : '';
                    html += `<div class="nav-item ${activeClass}" data-nav="${item.id}">
                        <span class="nav-icon">${item.icon}</span>
                        <span class="nav-label">${item.label}</span>
                    </div>`;
                });
                bottomNav.innerHTML = html;
                document.querySelectorAll('.nav-item').forEach(el => {
                    el.addEventListener('click', (e) => {
                        const navId = el.dataset.nav;
                        if (navId) navigateTo(navId);
                    });
                });
            }

            // ---------- modal helpers ----------
            function showModal(title, text) {
                modalContent.innerHTML = `<h3 style="margin-bottom:12px;">${title}</h3><p style="margin-bottom:24px;">${text}</p><button id="closeModalBtn">Close</button>`;
                modal.style.display = 'flex';
                document.getElementById('closeModalBtn').addEventListener('click', () => modal.style.display = 'none');
            }

            // ---------- screens content ----------
            function renderScreen() {
                let contentHtml = '';
                let headerTitle = '';

                if (currentScreen === 'onboarding') {
                    headerTitle = 'Welcome';
                    contentHtml = `
                        <div class="card" style="text-align:center; padding:32px 20px;">
                            <div style="background:var(--primary); width:72px; height:72px; border-radius:24px; margin:0 auto 20px; display:flex; align-items:center; justify-content:center; color:white; font-size:2.2rem; font-weight:800;">V</div>
                            <h1 style="font-size:2rem; margin-bottom:8px; color:var(--text);">VocabMaster</h1>
                            <p style="color:var(--accent); font-weight:600; margin-bottom:10px;">build your word power</p>
                            <p style="color:var(--text-light); margin-bottom:28px;">Master 10 new words daily with smart quizzes and memory games. Perfect for IELTS & TOEFL.</p>
                            <button class="btn-primary" id="getStartedBtn">Get Started</button>
                            <div class="link-row">
                                <span id="privacyLink">Privacy Policy</span>
                                <span id="termsLink">Terms of Service</span>
                            </div>
                        </div>
                    `;
                } else if (currentScreen === 'home') {
                    headerTitle = 'Home';
                    contentHtml = `
                        <div class="card" style="display:flex; align-items:center; gap:12px;">
                            <span class="badge">🔥 7 day streak</span>
                            <span class="badge" style="background:var(--primary); color:white;">level 4</span>
                        </div>
                        <div class="card">
                            <h3 style="margin-bottom:12px;">daily goal</h3>
                            <div style="display:flex; justify-content:space-between;"><span>15 words</span><span>10/15</span></div>
                            <div class="progress-bar" style="margin:10px 0;"><div class="progress-fill" style="width:67%"></div></div>
                            <button class="btn-primary" style="margin-top:10px;" id="practiceNow">practice now</button>
                        </div>
                        <div class="card">
                            <h3>flashcards review</h3>
                            <div style="display:flex; gap:20px; margin-top:14px;">
                                <div>${icons.flashcards}</div>
                                <div><strong>24 due</strong> <span style="color:var(--text-light);">cards</span></div>
                                <div style="margin-left:auto;">${icons.play}</div>
                            </div>
                        </div>
                    `;
                } else if (currentScreen === 'learn') {
                    headerTitle = 'Learn';
                    contentHtml = `
                        <div class="card"><h3>today's lessons</h3></div>
                        <div class="card" style="display:flex; gap:16px; align-items:center;">
                            ${icons.lesson}<div><strong>Business vocab</strong><div class="progress-bar" style="width:120px;"><div class="progress-fill" style="width:30%"></div></div></div>
                        </div>
                        <div class="card" style="display:flex; gap:16px; align-items:center;">
                            ${icons.flashcards}<div><strong>Irregular verbs</strong><div class="progress-bar" style="width:120px;"><div class="progress-fill" style="width:70%"></div></div></div>
                        </div>
                        <div class="card" style="display:flex; gap:16px; align-items:center;">
                            ${icons.play}<div><strong>Synonyms quiz</strong><div class="progress-bar" style="width:120px;"><div class="progress-fill" style="width:10%"></div></div></div>
                        </div>
                        <button class="btn-primary" id="startPractice">start practice</button>
                    `;
                } else if (currentScreen === 'progress') {
                    headerTitle = 'Progress';
                    contentHtml = `
                        <div class="card"><h3>weekly activity</h3><div class="chart-row"><div class="bar" style="height:50px;"></div><div class="bar" style="height:28px;"></div><div class="bar" style="height:42px;"></div><div class="bar" style="height:68px;"></div><div class="bar" style="height:30px;"></div></div></div>
                        <div class="card" style="display:flex; align-items:center; gap:12px;"><span>${icons.chart}</span> <span>mastered: 210 words</span></div>
                        <div class="card"><span>⭐️ 4 badges earned</span></div>
                    `;
                } else if (currentScreen === 'settings') {
                    headerTitle = 'Settings';
                    contentHtml = `
                        <div class="card" style="display:flex; align-items:center; justify-content:space-between;">
                            <span>🌙 Dark theme</span>
                            <label class="switch"><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}><span class="slider"></span></label>
                        </div>
                        <div class="card" style="cursor:pointer;" id="showProfileModal">👤 Profile info</div>
                        <div class="card" style="cursor:pointer;" id="showPrivacyModal">📄 Privacy Policy</div>
                        <div class="card" style="cursor:pointer;" id="showTermsModal">📜 Terms</div>
                    `;
                }

                contentArea.innerHTML = contentHtml;
                renderHeader(headerTitle);
                if (currentScreen !== 'onboarding') renderBottomNav(currentScreen);
                else bottomNav.innerHTML = ''; // no bottom nav on onboarding

                // attach listeners
                if (currentScreen === 'onboarding') {
                    document.getElementById('getStartedBtn').addEventListener('click', () => navigateTo('home'));
                    document.getElementById('privacyLink').addEventListener('click', () => showModal('Privacy Policy','We respect your data. No sharing.'));
                    document.getElementById('termsLink').addEventListener('click', () => showModal('Terms of Service','Use app for lawful purposes only.'));
                }
                if (currentScreen === 'home') {
                    document.getElementById('practiceNow')?.addEventListener('click', ()=> navigateTo('learn'));
                }
                if (currentScreen === 'learn') {
                    document.getElementById('startPractice')?.addEventListener('click', ()=> showModal('Practice','load a lesson...'));
                }
                if (currentScreen === 'settings') {
                    const toggle = document.getElementById('darkToggle');
                    if (toggle) toggle.addEventListener('change', (e) => {
                        darkMode = e.target.checked;
                        document.body.classList.toggle('dark', darkMode);
                    });
                    document.getElementById('showProfileModal')?.addEventListener('click', ()=> showModal('Profile','username: learner@vocab | member since 2026'));
                    document.getElementById('showPrivacyModal')?.addEventListener('click', ()=> showModal('Privacy Policy','We respect your data. No sharing.'));
                    document.getElementById('showTermsModal')?.addEventListener('click', ()=> showModal('Terms of Service','Use app for lawful purposes only.'));
                }
            }

            function navigateTo(screen) {
                if (screen === 'settings' || screen === 'home' || screen === 'learn' || screen === 'progress' || screen === 'onboarding') {
                    currentScreen = screen;
                    renderScreen();
                }
            }

            // ---------- screenshot (SHIFT+W) ----------
            window.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    const node = document.getElementById('phoneContainer');
                    // In a real environment would use html2canvas; here we simulate download.
                    // Simulate sequential naming (just alert for prototype)
                    const filename = darkMode ? '6.png' : (screenshotCounter + '.png');
                    if (!darkMode && screenshotCounter < 6) screenshotCounter++;
                    alert(`[DEV] Screenshot saved as ${filename} (simulated)`);
                }
            });

            // initial render
            renderScreen();

            // expose theme for dark class
            window.toggleDark = (v) => { document.body.classList.toggle('dark', v); };
        })();
    </script>

    <!-- tiny extra switch style -->
    <style>
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity:0; width:0; height:0; }
        .slider { position: absolute; cursor: pointer; top:0; left:0; right:0; bottom:0; background:#ccc; border-radius:34px; }
        .slider:before { position:absolute; content:""; height:20px; width:20px; left:2px; bottom:2px; background:white; border-radius:50%; transition:0.2s; }
        input:checked + .slider { background:var(--primary); }
        input:checked + .slider:before { transform:translateX(20px); }
    </style>
</body>
</html>
All done!
