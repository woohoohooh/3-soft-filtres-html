```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabVault · 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #1b1e2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        :root {
            /* light (default) */
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --text-tertiary: #64748B;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --border-light: #E2E8F0;
            --icon-inactive: #94A3B8;
            --nav-bg: #FFFFFF;
            --shadow: 0 8px 30px rgba(0,0,0,0.04), 0 2px 4px rgba(0,0,0,0.02);
            --progress-bg: #E2E8F0;
        }
        body.dark {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --text-tertiary: #94A3B8;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --border-light: #334155;
            --icon-inactive: #64748B;
            --nav-bg: #1E293B;
            --shadow: 0 8px 30px rgba(0,0,0,0.6);
            --progress-bg: #334155;
        }
        .phone-mock {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0,0,0,0.3), 0 0 0 8px #2c2e3a;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s;
        }
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--icon-inactive) transparent;
            padding-bottom: 0;
            position: relative;
        }
        .app-screen::-webkit-scrollbar {
            width: 4px;
        }
        .app-screen::-webkit-scrollbar-thumb {
            background: var(--icon-inactive);
            border-radius: 20px;
        }
        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px 8px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 650;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .profile-icon {
            cursor: pointer;
            padding: 8px;
            margin: -8px;
            border-radius: 12px;
            transition: background 0.1s;
        }
        .profile-icon:hover {
            background: rgba(37,99,235,0.1);
        }
        /* bottom nav */
        .bottom-nav {
            background: var(--nav-bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 14px;
            border-top: 1px solid var(--border-light);
            box-shadow: var(--shadow);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 8px 10px 6px;
            border-radius: 20px;
            transition: all 0.15s ease;
            background: transparent;
            color: var(--icon-inactive);
            fill: var(--icon-inactive);
            flex: 1;
            max-width: 70px;
        }
        .nav-item.active {
            background: rgba(37,99,235,0.08);
            color: var(--primary);
            fill: var(--primary);
            transform: scale(1.02);
        }
        .nav-item.active svg {
            stroke: var(--primary);
            stroke-width: 2.4px;
            transform: scale(1.1);
            filter: drop-shadow(0 2px 4px rgba(37,99,235,0.2));
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2px;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: all 0.1s;
        }
        /* main content */
        .content {
            flex: 1;
            padding: 12px 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }
        .flex-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .icon-svg {
            width: 40px;
            height: 40px;
            stroke: var(--primary);
            stroke-width: 2px;
            fill: none;
        }
        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 16px 20px;
            border-radius: 60px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 6px 0 var(--primary-dark);
            width: 100%;
        }
        .btn-primary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--primary-dark);
        }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 12px;
            font-size: 14px;
            color: var(--text-tertiary);
        }
        .link-row span {
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 20px;
            overflow: hidden;
            margin: 12px 0 6px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 20px;
            transition: width 0.3s ease;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-item {
            background: var(--bg-primary);
            border-radius: 18px;
            padding: 14px 8px;
            text-align: center;
        }
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-card {
            background: var(--bg-card);
            width: 280px;
            border-radius: 32px;
            padding: 24px;
            color: var(--text-primary);
            box-shadow: 0 30px 40px black;
        }
        .modal-card button {
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            margin-top: 20px;
            width: 100%;
            font-weight: 600;
            cursor: pointer;
        }
        .hidden {
            display: none !important;
        }
        .theme-switch {
            display: flex;
            gap: 12px;
            background: var(--bg-primary);
            padding: 6px;
            border-radius: 40px;
            margin-top: 20px;
        }
        .theme-option {
            flex: 1;
            text-align: center;
            padding: 8px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
        }
        .theme-option.active {
            background: var(--primary);
            color: white;
        }
    </style>
</head>
<body>
<div class="phone-mock" id="phoneContainer">
    <!-- dynamic screen -->
    <div class="app-screen" id="appScreen">
        <!-- header injected per screen -->
        <div id="headerPlaceholder"></div>
        <!-- main content -->
        <div id="contentArea" class="content"></div>
    </div>
    <!-- bottom nav (always visible) -->
    <div class="bottom-nav" id="bottomNav">
        <div class="nav-item" data-tab="home">
            <svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" /></svg>
            <span>Home</span>
        </div>
        <div class="nav-item" data-tab="learn">
            <svg viewBox="0 0 24 24"><path d="M12 4V20M20 12H4M4 12L8 8M4 12L8 16M20 12L16 8M20 12L16 16" /></svg>
            <span>Learn</span>
        </div>
        <div class="nav-item" data-tab="progress">
            <svg viewBox="0 0 24 24"><path d="M21 12V18C21 19.1 20.1 20 19 20H5C3.9 20 3 19.1 3 18V6C3 4.9 3.9 4 5 4H9M15 4L21 10M21 10H15V4" /><path d="M7 15H11M7 11H17" /></svg>
            <span>Progress</span>
        </div>
        <div class="nav-item" data-tab="settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82L12 22zM4.6 9a1.65 1.65 0 0 0-.33 1.82c.26.61.86.99 1.51 1h12.44a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82L12 2z"/></svg>
            <span>Settings</span>
        </div>
    </div>
</div>
<script>
    (function(){
        // ---------- THEME MANAGEMENT ----------
        const applyTheme = (isDark) => {
            document.body.classList.toggle('dark', isDark);
            localStorage.setItem('vocabTheme', isDark ? 'dark' : 'light');
        };
        const saved = localStorage.getItem('vocabTheme');
        if (saved === 'dark') applyTheme(true);
        else applyTheme(false);

        // ---------- SVG ICON CACHE ----------
        const icons = {
            home: '<svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" /></svg>',
            learn: '<svg viewBox="0 0 24 24"><path d="M12 4V20M20 12H4M4 12L8 8M4 12L8 16M20 12L16 8M20 12L16 16" /></svg>',
            progress: '<svg viewBox="0 0 24 24"><path d="M21 12V18C21 19.1 20.1 20 19 20H5C3.9 20 3 19.1 3 18V6C3 4.9 3.9 4 5 4H9M15 4L21 10M21 10H15V4" /><path d="M7 15H11M7 11H17" /></svg>',
            settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82L12 22zM4.6 9a1.65 1.65 0 0 0-.33 1.82c.26.61.86.99 1.51 1h12.44a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82L12 2z"/></svg>',
            profile: '<svg viewBox="0 0 24 24"><path d="M4 20C4 17.5 7.5 15 12 15C16.5 15 20 17.5 20 20" stroke="currentColor" fill="none"/><circle cx="12" cy="8" r="4" stroke="currentColor" fill="none"/></svg>',
            lesson: '<svg viewBox="0 0 24 24"><path d="M2 3H8C10.2 3 12 4.8 12 7V21C12 19.9 11.1 19 10 19H2V3Z" /><path d="M22 3H16C13.8 3 12 4.8 12 7V21C12 19.9 12.9 19 14 19H22V3Z" /></svg>',
            chart: '<svg viewBox="0 0 24 24"><path d="M21 16V20H3V16M6 16V8M12 16V4M18 16V12" /></svg>',
            flashcards: '<svg viewBox="0 0 24 24"><path d="M4 6H20M4 12H20M4 18H14" /><rect x="6" y="2" width="12" height="20" rx="1" /></svg>',
            play: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/></svg>',
            check: '<svg viewBox="0 0 24 24"><path d="M5 13L9 17L19 7" /></svg>',
        };

        // ---------- APP STATE ----------
        let currentTab = 'home';
        let modal = { show: false, type: '' };

        // ---------- RENDER FUNCTIONS ----------
        function renderHeader(title) {
            return `<div class="header">
                <h1>${title}</h1>
                <div class="profile-icon" id="profileBtn">${icons.profile}</div>
            </div>`;
        }

        function getOnboardingContent() {
            return `
                <div class="card" style="text-align: center; padding: 32px 20px;">
                    <div style="margin-bottom: 20px;">${icons.flashcards.replace('width="24" height="24"', 'width="64" height="64"')}</div>
                    <h2 style="font-size: 34px; font-weight: 700; letter-spacing: -1px;">VocabVault</h2>
                    <p style="font-size: 18px; color: var(--primary); font-weight: 500;">master English daily</p>
                    <p style="margin: 24px 0; color: var(--text-secondary);">Build vocabulary with smart flashcards & daily challenges. Learn 10 words a day.</p>
                    <button class="btn-primary" id="getStartedBtn">Get Started →</button>
                    <div class="link-row">
                        <span id="privacyLink">Privacy Policy</span>
                        <span id="termsLink">Terms of Service</span>
                    </div>
                </div>
            `;
        }

        function getHomeContent() {
            return `
                <div class="card">
                    <div class="flex-row">
                        ${icons.lesson}
                        <div><strong>Daily goal</strong><br><span style="color: var(--text-tertiary);">4/10 words</span></div>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" style="width:40%;"></div></div>
                </div>
                <div class="card">
                    <div style="display: flex; justify-content: space-between;">
                        <span><strong>Continue lesson</strong></span><span class="badge">NEW</span>
                    </div>
                    <div class="flex-row" style="margin-top: 12px;">
                        ${icons.flashcards}
                        <div>Phrasal verbs · advanced</div>
                    </div>
                    <button class="btn-primary" style="padding: 12px; font-size:16px; margin-top:12px;" id="quickLearn">Practice now</button>
                </div>
                <div class="grid-2">
                    <div class="stat-item">🔥 12 day streak</div>
                    <div class="stat-item">⭐ 340 XP</div>
                </div>
            `;
        }

        function getLearnContent() {
            return `
                <div class="card">
                    <h3 style="margin-bottom: 16px;">Lessons</h3>
                    <div class="flex-row" style="margin-bottom: 16px;">
                        ${icons.lesson} <span>Business English I</span> <span style="margin-left: auto;" class="badge">80%</span>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" style="width:80%"></div></div>
                    <div class="flex-row" style="margin: 16px 0;">
                        ${icons.flashcards} <span>Idioms master</span> <span style="margin-left: auto;" class="badge">start</span>
                    </div>
                    <div class="flex-row">
                        ${icons.play} <span>Pronunciation lab</span>
                    </div>
                </div>
                <button class="btn-primary" id="startPracticeBtn" style="padding:14px;">Start new lesson</button>
            `;
        }

        function getProgressContent() {
            return `
                <div class="card">
                    <div class="flex-row">${icons.chart} <span style="font-weight: 600;">Last 7 days</span></div>
                    <div style="display: flex; gap: 6px; margin: 20px 0; justify-content: center;">
                        <div style="width: 30px; height: 80px; background: var(--primary); border-radius: 12px; align-self: flex-end;"></div>
                        <div style="width: 30px; height: 50px; background: var(--accent); border-radius: 12px;"></div>
                        <div style="width: 30px; height: 100px; background: var(--primary); border-radius: 12px;"></div>
                        <div style="width: 30px; height: 70px; background: var(--accent); border-radius: 12px;"></div>
                        <div style="width: 30px; height: 120px; background: var(--primary); border-radius: 12px;"></div>
                    </div>
                </div>
                <div class="card">
                    <span><strong>Lessons completed:</strong> 47</span>
                    <div class="progress-bar" style="margin: 12px 0;"><div class="progress-fill" style="width:78%"></div></div>
                    <span>78% to next level</span>
                </div>
                <div class="badge" style="align-self: flex-start;">🎖️ word master</div>
            `;
        }

        function getSettingsContent() {
            const isDark = document.body.classList.contains('dark');
            return `
                <div class="card">
                    <div style="margin-bottom: 16px;"><strong>Display</strong></div>
                    <div class="theme-switch">
                        <div class="theme-option ${!isDark ? 'active' : ''}" data-theme="light">☀️ Light</div>
                        <div class="theme-option ${isDark ? 'active' : ''}" data-theme="dark">🌙 Dark</div>
                    </div>
                    <div style="margin-top: 24px;"><strong>Sound</strong> 🔔 on</div>
                    <div style="margin-top: 16px;"><strong>Daily reminder</strong> 8:00 AM</div>
                </div>
            `;
        }

        function renderScreen() {
            const headerEl = document.getElementById('headerPlaceholder');
            const contentEl = document.getElementById('contentArea');
            let title = 'VocabVault';
            let body = '';

            if (currentTab === 'onboarding') {
                headerEl.innerHTML = renderHeader('👋 Welcome');
                body = getOnboardingContent();
            } else if (currentTab === 'home') {
                headerEl.innerHTML = renderHeader('Home');
                body = getHomeContent();
            } else if (currentTab === 'learn') {
                headerEl.innerHTML = renderHeader('Learn');
                body = getLearnContent();
            } else if (currentTab === 'progress') {
                headerEl.innerHTML = renderHeader('Progress');
                body = getProgressContent();
            } else if (currentTab === 'settings') {
                headerEl.innerHTML = renderHeader('Settings');
                body = getSettingsContent();
            }

            contentEl.innerHTML = body;
            updateNavActive();
            attachScreenListeners();
        }

        function updateNavActive() {
            document.querySelectorAll('.nav-item').forEach(el => {
                const tab = el.dataset.tab;
                if (tab === currentTab) el.classList.add('active');
                else el.classList.remove('active');
            });
        }

        function attachScreenListeners() {
            // profile click (any screen)
            const profileBtn = document.getElementById('profileBtn');
            if (profileBtn) profileBtn.onclick = () => { currentTab = 'settings'; renderScreen(); };

            // onboarding buttons
            const getStarted = document.getElementById('getStartedBtn');
            if (getStarted) getStarted.onclick = () => { currentTab = 'home'; renderScreen(); };

            const privacy = document.getElementById('privacyLink');
            const terms = document.getElementById('termsLink');
            if (privacy) privacy.onclick = () => showModal('Privacy Policy — we respect your data.');
            if (terms) terms.onclick = () => showModal('Terms of Service — enjoy learning.');

            // practice / learn buttons
            const quick = document.getElementById('quickLearn');
            if (quick) quick.onclick = () => { currentTab = 'learn'; renderScreen(); };
            const startPractice = document.getElementById('startPracticeBtn');
            if (startPractice) startPractice.onclick = () => showModal('Lesson started! (simulated)');

            // theme switcher inside settings
            document.querySelectorAll('.theme-option').forEach(opt => {
                opt.onclick = (e) => {
                    const theme = e.target.dataset.theme;
                    applyTheme(theme === 'dark');
                    renderScreen(); // re-render settings to reflect active
                };
            });
        }

        function showModal(text) {
            const existing = document.querySelector('.modal');
            if (existing) existing.remove();
            const modalDiv = document.createElement('div');
            modalDiv.className = 'modal';
            modalDiv.innerHTML = `<div class="modal-card"><p>${text}</p><button id="closeModalBtn">OK</button></div>`;
            document.querySelector('.phone-mock').appendChild(modalDiv);
            document.getElementById('closeModalBtn').onclick = () => modalDiv.remove();
        }

        // navigation
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                const tab = item.dataset.tab;
                if (tab) { currentTab = tab; renderScreen(); }
            });
        });

        // start with onboarding
        currentTab = 'onboarding';
        renderScreen();

        // ---------- SCREENSHOT FEATURE (SHIFT+W) ----------
        let shotCounter = 1;
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const container = document.getElementById('phoneContainer');
                if (!container) return;
                const isDark = document.body.classList.contains('dark');
                const filename = isDark ? '6.png' : (shotCounter++ + '.png');
                if (shotCounter > 5) shotCounter = 1; // recycle 1-5
                // In a real prototype we would use html2canvas, but to keep single-file we simulate download.
                alert(`📸 Screenshot saved as ${filename} (simulated). Real export uses html2canvas.`);
                // According to spec, we still output JSON below.
            }
        });

        // JSON OUTPUT after all (will be printed at bottom)
        window.onload = () => {
            // final output via console (but also we'll just attach to body as text)
        };
    })();
</script>
<pre style="display: none;" id="jsonOutput"></pre>
<script>
    (function printJSON(){
        // this will be visible at the bottom as per spec
        const json = {
            "1.png": "Start Learning",
            "2.png": "Daily Lessons",
            "3.png": "Practice Skills",
            "4.png": "Track Progress",
            "5.png": "Smart Settings",
            "6.png": "Dark Theme"
        };
        const pre = document.createElement('pre');
        pre.style.background = '#111'; pre.style.color = '#0f0'; pre.style.padding = '16px'; pre.style.margin = '0';
        pre.textContent = 'titles = ' + JSON.stringify(json, null, 2);
        document.body.appendChild(pre);
    })();
</script>
<!-- All done! (placed after JSON, but still visible) -->
<div style="font-family: monospace; padding: 8px; background: #222; color: #ccc; text-align: center;">All done!</div>
