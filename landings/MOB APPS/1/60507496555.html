```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogicPulse · brain training</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #1a1e2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            --header-icon: #1E293B;
            --progress-bg: #E2E8F0;
            --badge-gold: #FBBF24;
        }
        .dark-mode {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
            --header-icon: #F1F5F9;
            --progress-bg: #334155;
            --badge-gold: #F59E0B;
        }
        .phone-frame {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5), 0 0 0 8px #2c3e4e;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background 0.2s;
        }
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 16px 16px 0 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) var(--card);
        }
        .screen::-webkit-scrollbar {
            width: 4px;
        }
        .screen::-webkit-scrollbar-thumb {
            background: var(--inactive);
            border-radius: 8px;
        }
        /* header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-top: 4px;
        }
        .header h2 {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* bottom nav */
        .bottom-nav {
            height: 68px;
            background: var(--card);
            border-top: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 8px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            gap: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 8px 0;
            border-radius: 24px;
            color: var(--inactive);
            fill: var(--inactive);
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            background: rgba(37, 99, 235, 0.08);
            transform: scale(1.02);
        }
        .nav-item.active svg {
            transform: scale(1.1);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.15s;
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
        }
        /* cards */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }
        .flex-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chip {
            background: var(--accent);
            color: #0F172A;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
        }
        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 40px;
            margin: 12px 0 6px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 40px;
            transition: width 0.3s;
        }
        .badge-group {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }
        .badge {
            background: var(--bg);
            border-radius: 40px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            border: 1px solid var(--border-light);
        }
        .lesson-item {
            padding: 14px 0;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .lesson-item:last-child {
            border-bottom: none;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0;
        }
        .stat-card {
            background: var(--bg);
            border-radius: 20px;
            padding: 16px 10px;
            text-align: center;
        }
        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 16px 24px;
            border-radius: 40px;
            font-size: 18px;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 8px 16px -6px var(--primary);
        }
        .btn-primary:active { background: var(--primary-dark); }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 20px;
            font-size: 14px;
        }
        .link-row button {
            background: none;
            border: none;
            color: var(--inactive);
            text-decoration: underline;
            cursor: pointer;
        }
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            backdrop-filter: blur(4px);
        }
        .modal {
            background: var(--card);
            width: 280px;
            border-radius: 32px;
            padding: 24px;
            text-align: center;
            color: var(--text-primary);
        }
        .hidden { display: none; }
        .mt-2 { margin-top: 8px; }
        .mt-4 { margin-top: 16px; }
        .icon-small { width: 40px; height: 40px; stroke: var(--primary); }
    </style>
</head>
<body>
    <div class="phone-frame" id="phoneFrame">
        <!-- screens will be injected via js -->
        <div id="appContainer" class="screen" style="padding-bottom: 0;"></div>
        <div class="bottom-nav" id="bottomNav">
            <button class="nav-item" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10L21 20H15V14H9V20H3V10Z" stroke="currentColor" fill="none"/></svg><span class="nav-label">Home</span></button>
            <button class="nav-item" data-tab="learn"><svg viewBox="0 0 24 24"><path d="M12 4L20 9V20H4V9L12 4Z" stroke="currentColor" fill="none"/><path d="M9 12H15V20H9V12Z" stroke="currentColor" fill="none"/></svg><span class="nav-label">Learn</span></button>
            <button class="nav-item" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M21 12V20H3V12" stroke="currentColor" fill="none"/><path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" fill="none"/><path d="M6 9V16" stroke="currentColor"/><path d="M18 9V16" stroke="currentColor"/><path d="M12 12V20" stroke="currentColor"/></svg><span class="nav-label">Progress</span></button>
            <button class="nav-item" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor" fill="none"/><path d="M19.4 15L18.5 17.6L15.6 19.4L13 18.5L10.4 19.4L7.5 17.6L6 15L6.9 12.4L6 9.8L7.5 7.2L10.4 5.4L13 6.3L15.6 5.4L18.5 7.2L20 9.8L19.1 12.4L20 15H19.4Z" stroke="currentColor" fill="none"/></svg><span class="nav-label">Settings</span></button>
        </div>
    </div>

    <script>
        (function(){
            // ---------- SVG icons (inline) ----------
            const icons = {
                profile: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
                check: '<svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>',
                play: '<svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor"><polygon points="5 3 19 12 5 21 5 3" fill="none"/></svg>',
                chart: '<svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor"><path d="M21 16v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2"/><path d="M7 10l3-3 3 3 4-4"/><path d="M17 10V4h-6"/></svg>',
                flashcards: '<svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor"><path d="M4 6h16v12H4z"/><path d="M8 4v4"/><path d="M16 4v4"/></svg>',
                lesson: '<svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>'
            };

            // ---------- global state ----------
            let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
            let darkMode = false;
            let screenshotCounter = 1;

            // ---------- root container ----------
            const container = document.getElementById('appContainer');
            const phoneFrame = document.getElementById('phoneFrame');
            const navItems = document.querySelectorAll('.nav-item');

            // ---------- helper: render active screen ----------
            function renderScreen(screenId) {
                if (screenId === 'onboarding') renderOnboarding();
                else if (screenId === 'home') renderHome();
                else if (screenId === 'learn') renderLearn();
                else if (screenId === 'progress') renderProgress();
                else if (screenId === 'settings') renderSettings();

                // update bottom nav active state (only if not onboarding)
                navItems.forEach(item => {
                    const tab = item.dataset.tab;
                    if (screenId === tab) item.classList.add('active');
                    else item.classList.remove('active');
                });
                if (screenId === 'onboarding') {
                    navItems.forEach(i => i.classList.remove('active'));
                }
            }

            // ----- onboarding -----
            function renderOnboarding() {
                currentScreen = 'onboarding';
                let html = `
                    <div class="header">
                        <h2>LogicPulse</h2>
                        <button class="profile-btn" id="profileIconBtn">${icons.profile}</button>
                    </div>
                    <div style="text-align: center; margin-top: 20px;">
                        <svg width="80" height="80" viewBox="0 0 24 24" stroke="var(--primary)" stroke-width="1.5" fill="none"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
                        <h1 style="font-size: 36px; font-weight:700; color: var(--primary);">LogicPulse</h1>
                        <p style="font-size: 18px; color: var(--accent); margin: 8px 0;">think sharper</p>
                        <p style="color: var(--text-secondary); margin: 20px 0;">Daily logic puzzles & brain training. Bite-sized challenges to boost IQ.</p>
                        <button class="btn-primary" id="getStartedBtn">Get Started</button>
                        <div class="link-row">
                            <button id="privacyModalBtn">Privacy Policy</button>
                            <button id="termsModalBtn">Terms of Service</button>
                        </div>
                    </div>
                `;
                container.innerHTML = html;
                document.getElementById('profileIconBtn').addEventListener('click', ()=>{
                    renderSettings();
                    navItems.forEach(i=>i.classList.remove('active'));
                });
                document.getElementById('getStartedBtn').addEventListener('click', ()=>{
                    renderHome();
                    navItems.forEach(i=>{ if(i.dataset.tab==='home') i.classList.add('active'); else i.classList.remove('active'); });
                });
                document.getElementById('privacyModalBtn').addEventListener('click', ()=> showModal('Privacy Policy', 'We value your privacy. No data is sold.'));
                document.getElementById('termsModalBtn').addEventListener('click', ()=> showModal('Terms of Service', 'Use responsibly. Don’t cheat yourself.'));
            }

            function showModal(title, msg) {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.innerHTML = `<div class="modal"><h3>${title}</h3><p style="margin:16px 0;">${msg}</p><button class="btn-primary" style="padding:10px;" id="closeModal">Close</button></div>`;
                phoneFrame.appendChild(overlay);
                document.getElementById('closeModal').addEventListener('click', ()=> overlay.remove());
                overlay.addEventListener('click', (e)=> { if(e.target===overlay) overlay.remove(); });
            }

            // ----- home dashboard -----
            function renderHome() {
                currentScreen = 'home';
                let html = `
                    <div class="header">
                        <h2>For you</h2>
                        <button class="profile-btn" id="profileIconBtn">${icons.profile}</button>
                    </div>
                    <div class="card">
                        <div class="flex-row"><span class="chip">streak 12 days</span> <span>🔥</span></div>
                        <p style="font-size: 20px; font-weight:600; margin-top:12px;">Daily puzzle</p>
                        <div class="progress-bar"><div class="progress-fill" style="width:65%"></div></div>
                        <div class="flex-row"><span>3/5 solved</span> <button class="badge" id="resumeLearn"><svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg> resume</button></div>
                    </div>
                    <div class="card">
                        <p style="font-weight:600;">Today’s brain workout</p>
                        <div class="lesson-item"><span>🧩</span> <span style="flex:1;">River crossing</span> <span class="badge">5 min</span></div>
                        <div class="lesson-item"><span>🔢</span> <span style="flex:1;">Number sequence</span> <span class="badge">8 min</span></div>
                        <div class="lesson-item"><span>📐</span> <span style="flex:1;">Spatial rotation</span> <span class="badge">4 min</span></div>
                    </div>
                    <div class="badge-group">
                        <span class="badge">🧠 340 IQ</span>
                        <span class="badge">⚡ 88%</span>
                        <span class="badge">🏅 6 badges</span>
                    </div>
                `;
                container.innerHTML = html;
                document.getElementById('profileIconBtn').addEventListener('click', ()=>{ renderSettings(); navItems.forEach(i=>i.classList.remove('active')); });
                document.getElementById('resumeLearn')?.addEventListener('click', ()=> { renderLearn(); setActiveNav('learn'); });
            }

            // ----- learn / practice -----
            function renderLearn() {
                currentScreen = 'learn';
                let html = `
                    <div class="header">
                        <h2>Lessons</h2>
                        <button class="profile-btn" id="profileIconBtn">${icons.profile}</button>
                    </div>
                    <div class="card">
                        <div class="flex-row"><span>🧩 Logic puzzles</span> <span>80%</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:80%"></div></div>
                        <div class="lesson-item"><span>${icons.lesson}</span> <span>Truth tellers</span> <button class="badge" id="startPractice">Start</button></div>
                        <div class="lesson-item"><span>${icons.lesson}</span> <span>Knights & knaves</span> <button class="badge">Start</button></div>
                        <div class="lesson-item"><span>${icons.flashcards}</span> <span>Deduction cards</span> <button class="badge">Review</button></div>
                    </div>
                `;
                container.innerHTML = html;
                document.getElementById('profileIconBtn').addEventListener('click', ()=>{ renderSettings(); navItems.forEach(i=>i.classList.remove('active')); });
                document.getElementById('startPractice')?.addEventListener('click', ()=>{ alert('Starting puzzle → logic gate practice.'); });
            }

            // ----- progress / statistics -----
            function renderProgress() {
                currentScreen = 'progress';
                let html = `
                    <div class="header">
                        <h2>Progress</h2>
                        <button class="profile-btn" id="profileIconBtn">${icons.profile}</button>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-card"><span>🧠</span><br><strong>23</strong> <span>puzzles</span></div>
                        <div class="stat-card"><span>⏱️</span><br><strong>8.4s</strong> <span>avg</span></div>
                    </div>
                    <div class="card">
                        <span>weekly activity</span>
                        <div style="display:flex; gap:6px; height:60px; align-items:flex-end; margin:16px 0;">
                            <div style="width:20%; background:var(--primary); height:30px; border-radius:8px;"></div>
                            <div style="width:20%; background:var(--primary); height:50px;"></div>
                            <div style="width:20%; background:var(--accent); height:22px;"></div>
                            <div style="width:20%; background:var(--primary); height:45px;"></div>
                            <div style="width:20%; background:var(--primary); height:36px;"></div>
                        </div>
                        <div class="flex-row"><span>total sessions</span> <span>47</span></div>
                        <div class="progress-bar mt-2"><div class="progress-fill" style="width:67%"></div></div>
                    </div>
                    <div class="badge-group">🏆 logic master · 🔥 12d streak</div>
                `;
                container.innerHTML = html;
                document.getElementById('profileIconBtn').addEventListener('click', ()=>{ renderSettings(); navItems.forEach(i=>i.classList.remove('active')); });
            }

            // ----- settings / profile -----
            function renderSettings() {
                currentScreen = 'settings';
                let html = `
                    <div class="header">
                        <h2>Settings</h2>
                        <button class="profile-btn" id="profileIconBtn">${icons.profile}</button>
                    </div>
                    <div class="card">
                        <div class="flex-row"><span>🌙 Dark theme</span><label><input type="checkbox" id="themeToggle" ${darkMode ? 'checked' : ''}></label></div>
                        <div class="lesson-item"><span>🔔 Notifications</span> <span>on</span></div>
                        <div class="lesson-item"><span>🎯 daily goal</span> <span>15 min</span></div>
                        <div class="lesson-item"><span>👤 profile</span> <span>Alex</span></div>
                        <button class="btn-primary" style="margin-top:16px;" id="resetBtn">Reset progress</button>
                    </div>
                `;
                container.innerHTML = html;
                document.getElementById('profileIconBtn').addEventListener('click', ()=>{ renderSettings(); });
                const toggle = document.getElementById('themeToggle');
                if (toggle) toggle.addEventListener('change', (e)=> {
                    darkMode = e.target.checked;
                    if (darkMode) phoneFrame.classList.add('dark-mode');
                    else phoneFrame.classList.remove('dark-mode');
                });
                document.getElementById('resetBtn')?.addEventListener('click', ()=> alert('Demo: nothing erased.'));
            }

            function setActiveNav(tab) {
                navItems.forEach(i => { if(i.dataset.tab===tab) i.classList.add('active'); else i.classList.remove('active'); });
            }

            // ---------- bottom nav listeners ----------
            navItems.forEach(item => {
                item.addEventListener('click', (e) => {
                    e.preventDefault();
                    const tab = item.dataset.tab;
                    if (tab === 'home') renderHome();
                    else if (tab === 'learn') renderLearn();
                    else if (tab === 'progress') renderProgress();
                    else if (tab === 'settings') renderSettings();
                });
            });

            // ---------- screenshot feature (Shift+W) ----------
            window.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm').then(({default: html2canvas}) => {
                        html2canvas(phoneFrame, { backgroundColor: null }).then(canvas => {
                            const link = document.createElement('a');
                            const isDark = phoneFrame.classList.contains('dark-mode');
                            let filename = (isDark ? 6 : screenshotCounter) + '.png';
                            if (!isDark && screenshotCounter < 6) filename = screenshotCounter + '.png';
                            else if (isDark) filename = '6.png';
                            link.download = filename;
                            link.href = canvas.toDataURL('image/png');
                            link.click();
                            if (!isDark && screenshotCounter < 6) screenshotCounter++;
                        });
                    }).catch(() => alert('html2canvas load error, but shift+w works.'));
                }
            });

            // ---------- initial render ----------
            renderOnboarding();

            // ---------- inject JSON at very end (as object) ----------
            window.playStoreTitles = {
                "1.png": "Start Learning",
                "2.png": "Daily Lessons",
                "3.png": "Practice Skills",
                "4.png": "Track Progress",
                "5.png": "Smart Settings",
                "6.png": "Dark Theme"
            };
            // show JSON as requested
            const jsonOutput = {
                titles: {
                    "1.png": "Start Learning",
                    "2.png": "Daily Lessons",
                    "3.png": "Practice Skills",
                    "4.png": "Track Progress",
                    "5.png": "Smart Settings",
                    "6.png": "Dark Theme"
                }
            };
            console.log(JSON.stringify(jsonOutput, null, 2));
        })();
    </script>
    <script>(function(){ /* json block */ })();</script>
</body>
</html>
All done!
