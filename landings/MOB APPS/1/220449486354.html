```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Brain Trainer · prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 48px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5), 0 0 0 10px #334155;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background-color 0.2s;
        }

        /* theme variables */
        :root {
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --progress-bg: #E2E8F0;
        }

        body.dark {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --progress-bg: #334155;
        }

        /* main content area (screens) */
        .screen-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) transparent;
            background: var(--bg-primary);
        }

        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: var(--inactive);
            border-radius: 8px;
        }

        /* header */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-light);
        }
        .header-title {
            font-weight: 700;
            font-size: 20px;
            color: var(--text-primary);
        }
        .profile-icon {
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            transition: background 0.15s;
        }
        .profile-icon:hover {
            background: var(--border-light);
        }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--bg-card);
            padding: 6px 8px 10px;
            border-top: 1px solid var(--border-light);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 500;
            color: var(--inactive);
            transition: all 0.15s ease;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 20px;
            flex: 1;
        }
        .nav-item.active {
            color: var(--primary);
            background: rgba(37, 99, 235, 0.08);
            transform: scale(1.02);
        }
        .nav-item.active svg {
            stroke: var(--primary);
            stroke-width: 2.2;
            transform: scale(1.1);
        }
        .nav-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-icon svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        /* cards & UI */
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }
        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .gap-2 { gap: 8px; }
        .mt-3 { margin-top: 12px; }
        .mb-2 { margin-bottom: 8px; }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 40px;
            padding: 14px 24px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: 0.1s;
        }
        .btn:active { transform: scale(0.98); background: var(--primary-dark); }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 16px;
            font-size: 13px;
        }
        .link-row span {
            color: var(--inactive);
            text-decoration: underline;
            cursor: pointer;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
        }
        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 30px;
            margin: 10px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 30px;
            transition: width 0.3s;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-card {
            background: var(--bg-primary);
            border-radius: 16px;
            padding: 16px 8px;
            text-align: center;
        }
        .icon-circle {
            width: 40px;
            height: 40px;
            background: rgba(37, 99, 235, 0.1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .lesson-item:last-child { border: none; }

        /* modal overlay (privacy/terms) */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--bg-card);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            color: var(--text-primary);
            text-align: center;
        }
        .modal-close {
            margin-top: 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 40px;
            padding: 10px 20px;
            font-weight: 600;
            cursor: pointer;
        }

        /* hidden */
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- header (dynamic title) -->
    <div class="app-header">
        <div class="header-title" id="headerTitle">Onboarding</div>
        <div class="profile-icon" id="profileBtn">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--text-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
        </div>
    </div>

    <!-- dynamic screens injected here -->
    <div id="screenContainer" class="screen-container"></div>

    <!-- bottom nav (4 items) -->
    <div class="bottom-nav" id="bottomNav">
        <div class="nav-item" data-tab="home">
            <span class="nav-icon" id="icon-home"></span>
            <span>Home</span>
        </div>
        <div class="nav-item" data-tab="learn">
            <span class="nav-icon" id="icon-learn"></span>
            <span>Learn</span>
        </div>
        <div class="nav-item" data-tab="progress">
            <span class="nav-icon" id="icon-progress"></span>
            <span>Progress</span>
        </div>
        <div class="nav-item" data-tab="settings">
            <span class="nav-icon" id="icon-settings"></span>
            <span>Settings</span>
        </div>
    </div>
</div>

<!-- modal placeholder -->
<div id="modalContainer"></div>

<script>
    (function() {
        // ---------- THEME ----------
        const applyTheme = (isDark) => {
            if (isDark) document.body.classList.add('dark');
            else document.body.classList.remove('dark');
        };

        // ---------- ICON SYSTEM (inline svg, outline, 2px, round) ----------
        const icons = {
            home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10L12 3L21 10V20H3V10Z"/></svg>`,
            learn: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6L12 2L22 6L12 10L2 6Z"/><path d="M2 6V16L12 20L22 16V6"/><path d="M12 10V20"/></svg>`,
            progress: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3V12L17 17"/></svg>`,
            settings: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.07.09A10 10 0 0 0 12 18a10 10 0 0 0 6.26-2.22z"/><path d="M16.5 7.5 19 5"/><path d="M7.5 7.5 5 5"/></svg>`,
            profile: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
            lesson: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>`,
            chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2"/><path d="M7 10l3-3 3 3 4-4"/><path d="M17 10V4h-6"/></svg>`,
            flashcards: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 17h5M17 7h5"/></svg>`,
            play: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
            check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`
        };

        // inject icons into nav
        document.getElementById('icon-home').innerHTML = icons.home;
        document.getElementById('icon-learn').innerHTML = icons.learn;
        document.getElementById('icon-progress').innerHTML = icons.progress;
        document.getElementById('icon-settings').innerHTML = icons.settings;

        // ---------- SCREEN DATA (MATH BRAIN TRAINER) ----------
        let currentScreen = 'onboarding'; // override start
        let darkMode = false;

        const screens = {
            onboarding: `
                <div class="card" style="text-align: center; padding: 32px 20px;">
                    <div style="background: #EFF6FF; width: 80px; height: 80px; border-radius: 30px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center;">
                        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                    </div>
                    <h1 style="font-size: 34px; font-weight: 800; color: var(--text-primary);">Math Brain</h1>
                    <p style="font-size: 18px; color: var(--primary); margin-bottom: 16px;">trainer · daily agility</p>
                    <p style="color: var(--text-secondary); margin-bottom: 24px;">Boost your mental math with 5‑minute workouts. Adaptive challenges for all levels.</p>
                    <button class="btn" id="startGetStarted">Get Started</button>
                    <div class="link-row">
                        <span id="privacyLink">Privacy Policy</span>
                        <span id="termsLink">Terms of Service</span>
                    </div>
                </div>
            `,
            home: `
                <div class="card">
                    <div class="flex-row"><span class="badge">🔥 streak 7 days</span><span>👋 Alex</span></div>
                    <h2 style="margin: 12px 0 4px; font-size: 24px;">Today's goal</h2>
                    <div class="progress-bar"><div class="progress-fill" style="width:65%" id="homeProgress"></div></div>
                    <p style="color:var(--text-secondary)">3/5 lessons completed</p>
                </div>
                <div class="card">
                    <div class="flex-row"><h3>Daily workout</h3> <span class="badge">➕ new</span></div>
                    <div class="lesson-item"> <span class="nav-icon">${icons.play}</span> <span>Quick 10 sums</span> <span style="margin-left:auto;">5 min</span> </div>
                    <div class="lesson-item"> <span class="nav-icon">${icons.flashcards}</span> <span>Multiplication blast</span><span>3 min</span> </div>
                    <button class="btn" style="margin-top:12px;" id="quickPractice">Start practice</button>
                </div>
                <div class="card flex-row gap-2">
                    <div class="icon-circle">${icons.lesson}</div><div><strong>Next: fractions</strong><br>ready in 2h</div>
                </div>
            `,
            learn: `
                <div class="card"><h3>Topics</h3></div>
                <div class="card">
                    <div class="lesson-item">${icons.lesson} <span>Addition & subtraction</span><span class="badge">80%</span></div>
                    <div class="lesson-item">${icons.lesson} <span>Multiplication tables</span><span class="badge">45%</span></div>
                    <div class="lesson-item">${icons.lesson} <span>Division / fractions</span><span>🔒</span></div>
                    <div class="lesson-item">${icons.lesson} <span>Mental equations</span><span>🔒</span></div>
                    <button class="btn" id="unlockLesson" style="margin-top:10px;">Unlock next (250 pts)</button>
                </div>
            `,
            progress: `
                <div class="card"><h3>Last 7 days</h3><div style="display:flex; gap:8px; justify-content:space-around; margin:10px 0">${[70,85,60,90,75,88,92].map(v=>`<div style="height:${v*0.5}px; width:20px; background:var(--primary); border-radius:10px;"></div>`).join('')}</div></div>
                <div class="stat-grid">
                    <div class="stat-card"><span class="icon-circle">${icons.chart}</span><div><strong>1,280</strong><br>points</div></div>
                    <div class="stat-card"><span class="icon-circle">${icons.check}</span><div><strong>46</strong><br>lessons</div></div>
                </div>
                <div class="card"><h4>Achievements</h4><div class="flex-row"><span>⚡ speed demon</span><span>+100</span></div><div class="flex-row"><span>🧮 10 streak</span><span>new</span></div></div>
            `,
            settings: `
                <div class="card">
                    <div class="flex-row"><span>Dark mode</span><label style="width: 50px;"><input type="checkbox" id="darkModeToggle"></label></div>
                </div>
                <div class="card">
                    <div class="lesson-item">${icons.profile} Profile</div>
                    <div class="lesson-item">${icons.settings} Preferences</div>
                    <div class="lesson-item">${icons.check} Notifications</div>
                </div>
                <div class="card" style="text-align:center;">version 1.0 · Math Brain</div>
            `
        };

        const headerMap = {
            onboarding: 'Onboarding',
            home: 'Home',
            learn: 'Learn',
            progress: 'Progress',
            settings: 'Settings'
        };

        let modalVisible = false;
        function showModal(text) {
            const modalHtml = `<div class="modal" id="activeModal"><div class="modal-content"><p>${text}</p><button class="modal-close" id="closeModalBtn">Close</button></div></div>`;
            document.getElementById('modalContainer').innerHTML = modalHtml;
            document.getElementById('closeModalBtn').addEventListener('click', () => {
                document.getElementById('modalContainer').innerHTML = '';
                modalVisible = false;
            });
            modalVisible = true;
        }

        function renderScreen(screenId) {
            if (!screens[screenId]) return;
            document.getElementById('screenContainer').innerHTML = screens[screenId];
            document.getElementById('headerTitle').innerText = headerMap[screenId] || 'Math Brain';

            // re-attach listeners
            if (screenId === 'onboarding') {
                document.getElementById('startGetStarted')?.addEventListener('click', ()=>{
                    navigateTo('home');
                    setActiveTab('home');
                });
                document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy policy: your data stays local.'));
                document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms: Use for educational purposes only.'));
            }
            if (screenId === 'home') {
                document.getElementById('quickPractice')?.addEventListener('click', ()=>{
                    alert('Starting a quick 10‑question workout!');
                    document.getElementById('homeProgress')?.style.setProperty('width', '75%');
                });
            }
            if (screenId === 'learn') {
                document.getElementById('unlockLesson')?.addEventListener('click', ()=> alert('Spend 250 points? (simulated)'));
            }
            if (screenId === 'settings') {
                const toggle = document.getElementById('darkModeToggle');
                if (toggle) {
                    toggle.checked = darkMode;
                    toggle.addEventListener('change', (e) => {
                        darkMode = e.target.checked;
                        applyTheme(darkMode);
                        // re-render settings to keep consistency
                        renderScreen('settings');
                    });
                }
            }
        }

        function navigateTo(screen) {
            currentScreen = screen;
            renderScreen(screen);
            if (screen !== 'onboarding') {
                document.getElementById('bottomNav').classList.remove('hidden');
            } else {
                document.getElementById('bottomNav').classList.add('hidden');
            }
        }

        function setActiveTab(tabId) {
            document.querySelectorAll('.nav-item').forEach(el => {
                const tab = el.dataset.tab;
                if (tab === tabId) el.classList.add('active');
                else el.classList.remove('active');
            });
        }

        // bottom nav listeners
        document.querySelectorAll('.nav-item').forEach(el => {
            el.addEventListener('click', (e) => {
                const tab = el.dataset.tab;
                if (tab === 'home' || tab === 'learn' || tab === 'progress' || tab === 'settings') {
                    navigateTo(tab);
                    setActiveTab(tab);
                }
            });
        });

        // profile icon -> settings
        document.getElementById('profileBtn').addEventListener('click', ()=>{
            navigateTo('settings');
            setActiveTab('settings');
        });

        // init onboarding + hide bottom nav
        window.addEventListener('load', ()=>{
            navigateTo('onboarding');
            setActiveTab('home'); // default highlight but hidden
            document.getElementById('bottomNav').classList.add('hidden');
        });

        // ---------- SCREENSHOT: SHIFT+W ----------
        document.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                // simplistic capture simulation: generate sequential names
                // In a real scenario would use html2canvas, but as a prototype we mimic.
                // we just log filenames and show alert with naming.
                let fileName = '1.png';
                if (currentScreen === 'onboarding') fileName = '1.png';
                else if (currentScreen === 'home') fileName = '2.png';
                else if (currentScreen === 'learn') fileName = '3.png';
                else if (currentScreen === 'progress') fileName = '4.png';
                else if (currentScreen === 'settings') fileName = '5.png';
                if (darkMode) fileName = '6.png';
                alert(`📸 Screenshot saved as ${fileName} (simulated)`);
            }
        });

        // Prefill progress bar animation (just for demo)
        // also keep darkmode apply
        applyTheme(darkMode);
    })();
</script>

<!-- JSON output as requested -->
<pre style="display:none;">{
    "1.png": "Start Learning",
    "2.png": "Daily Lessons",
    "3.png": "Practice Skills",
    "4.png": "Track Progress",
    "5.png": "Smart Settings",
    "6.png": "Dark Theme"
}</pre>
All done!
</body>
</html>
