```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logic Brain Trainer · 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: #1a1e2b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* PHONE CONTAINER */
    .phone {
      width: 360px;
      height: 780px;
      background: var(--bg-primary);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2c3142;
      position: relative;
      transition: background 0.2s;
    }

    /* APP SCREEN (internal scroll) */
    .app-screen {
      height: 100%;
      display: flex;
 flex-direction: column;
      background: var(--bg-primary);
      position: relative;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--primary-light) var(--card-bg);
    }
    .app-screen::-webkit-scrollbar { width: 4px; }
    .app-screen::-webkit-scrollbar-track { background: var(--card-bg); }
    .app-screen::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 20px; }

    /* LIGHT / DARK VARIABLES */
    :root {
      --bg-primary: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --inactive: #94A3B8;
      --border-light: #E2E8F0;
      --highlight: #EFF6FF;
      --shadow: 0 4px 12px rgba(0,0,0,0.02), 0 2px 4px rgba(0,0,0,0.02);
    }

    body.dark {
      --bg-primary: #0F172A;
      --card-bg: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --inactive: #64748B;
      --border-light: #334155;
      --highlight: #1E293B;
      --shadow: 0 4px 12px rgba(0,0,0,0.3);
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 8px;
      background: transparent;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }
    .profile-btn {
      background: none;
      border: none;
      padding: 8px 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* BOTTOM NAV */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: var(--card-bg);
      border-top: 1px solid var(--border-light);
      padding: 6px 8px 10px;
      box-shadow: var(--shadow);
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      gap: 4px;
      cursor: pointer;
      padding: 6px 0 4px;
      transition: all 0.15s ease;
      border-radius: 30px;
      color: var(--inactive);
      fill: var(--inactive);
    }
    .nav-item.active {
      color: var(--primary);
      fill: var(--primary);
      transform: scale(1.05);
      background: var(--highlight);
    }
    .nav-item .nav-label {
      font-size: 11px;
      font-weight: 500;
    }

    /* MAIN CONTENT */
    .content {
      flex: 1;
      padding: 12px 16px 16px;
    }

    /* CARDS */
    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 18px 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-light);
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .progress-bar {
      height: 8px;
      background: var(--border-light);
      border-radius: 30px;
      overflow: hidden;
      margin: 12px 0;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      border-radius: 30px;
      transition: width 0.3s ease;
    }
    .badge-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .badge {
      background: var(--highlight);
      padding: 10px 14px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
      font-weight: 500;
      border: 1px solid var(--border-light);
    }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 16px 24px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 18px;
      width: 100%;
      cursor: pointer;
      transition: 0.1s ease;
    }
    .btn:active { transform: scale(0.98); background: var(--primary-dark); }
    .link-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 24px;
    }
    .link {
      color: var(--inactive);
      font-size: 14px;
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0;
    }
    .stat-cell {
      background: var(--bg-primary);
      padding: 14px;
      border-radius: 20px;
      text-align: center;
    }

    /* MODAL */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-card {
      background: var(--card-bg);
      padding: 28px;
      border-radius: 32px;
      width: 280px;
      text-align: center;
      color: var(--text-primary);
    }
    .modal-card button {
      margin-top: 24px;
      background: var(--primary);
      border: none;
      color: white;
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
    }
    .hidden { display: none !important; }

    /* TOGGLE */
    .theme-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
    }
    .switch {
      width: 48px;
      height: 24px;
      background: var(--inactive);
      border-radius: 40px;
      appearance: none;
      cursor: pointer;
      position: relative;
    }
    .switch:checked { background: var(--primary); }
    .switch:before {
      content: '';
      width: 20px; height: 20px; background: white; border-radius: 50%;
      position: absolute; top: 2px; left: 2px;
      transition: 0.15s;
    }
    .switch:checked:before { left: 26px; }

    /* SVG icons */
    .icon { width: 24px; height: 24px; stroke-width: 2; stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .nav-icon { width: 26px; height: 26px; }
  </style>
</head>
<body>
  <div class="phone" id="phoneContainer">
    <div class="app-screen" id="appScreen">
      <!-- dynamic header / content will be injected by JS -->
    </div>
  </div>

  <script>
    (function() {
      // ---------- SVG ICONS (outline, 2px, rounded, same style) ----------
      const icons = {
        home: `<svg class="icon nav-icon" viewBox="0 0 24 24"><path d="M5 12H3L12 3L21 12H19" stroke="currentColor" fill="none"/><path d="M5 12V20H19V12" stroke="currentColor"/><rect x="9" y="14" width="6" height="6" stroke="currentColor"/></svg>`,
        learn: `<svg class="icon nav-icon" viewBox="0 0 24 24"><path d="M2 3H8C10.2091 3 12 4.79086 12 7V21C12 19.8954 11.1046 19 10 19H2V3Z" stroke="currentColor"/><path d="M22 3H16C13.7909 3 12 4.79086 12 7V21C12 19.8954 12.8954 19 14 19H22V3Z" stroke="currentColor"/></svg>`,
        progress: `<svg class="icon nav-icon" viewBox="0 0 24 24"><path d="M21 12V20H3V12" stroke="currentColor"/><path d="M7 10V16" stroke="currentColor"/><path d="M12 7V16" stroke="currentColor"/><path d="M17 4V16" stroke="currentColor"/></svg>`,
        settings: `<svg class="icon nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor"/><path d="M19.4 15C19.1 15.6 18.7 16.2 18.2 16.7L17 17.5L15.5 19L14.1 19.6C13.4 19.9 12.7 20 12 20C11.3 20 10.6 19.9 9.9 19.6L8.5 19L7 17.5L5.8 16.7C5.3 16.2 4.9 15.6 4.6 15L4 13.5C4 12.8 4 12.1 4 11.4L4.6 9.9C4.9 9.3 5.3 8.7 5.8 8.2L7 7L8.5 5.5L9.9 4.9C10.6 4.6 11.3 4.5 12 4.5C12.7 4.5 13.4 4.6 14.1 4.9L15.5 5.5L17 7L18.2 8.2C18.7 8.7 19.1 9.3 19.4 9.9L20 11.4V12.5L19.4 15Z" stroke="currentColor"/></svg>`,
        profile: `<svg class="icon" viewBox="0 0 24 24"><path d="M20 21V19C20 16.7909 18.2091 15 16 15H8C5.79086 15 4 16.7909 4 19V21" stroke="currentColor"/><circle cx="12" cy="8" r="4" stroke="currentColor"/></svg>`,
        lesson: `<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor"/><path d="M8 7H16" stroke="currentColor"/><path d="M8 12H16" stroke="currentColor"/><path d="M8 17H13" stroke="currentColor"/></svg>`,
        chart: `<svg class="icon" viewBox="0 0 24 24"><path d="M21 20H3V4" stroke="currentColor"/><rect x="7" y="10" width="2" height="10" stroke="currentColor"/><rect x="12" y="6" width="2" height="14" stroke="currentColor"/><rect x="17" y="8" width="2" height="12" stroke="currentColor"/></svg>`,
        flashcards: `<svg class="icon" viewBox="0 0 24 24"><path d="M4 5H18C19.1046 5 20 5.89543 20 7V18C20 19.1046 19.1046 20 18 20H6C4.89543 20 4 19.1046 4 18V5Z" stroke="currentColor"/><path d="M8 4V8H14V4" stroke="currentColor"/></svg>`,
        play: `<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor"/><path d="M10 8L16 12L10 16V8Z" stroke="currentColor"/></svg>`,
        check: `<svg class="icon" viewBox="0 0 24 24"><path d="M20 6L9 17L4 12" stroke="currentColor"/></svg>`
      };

      // ---------- APP STATE ----------
      let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
      let darkMode = false;
      let modalContent = null; // 'privacy' or 'terms' or null
      let screenshotCounter = 0;
      
      // data for demo
      let dailyGoal = 65; // percent

      // screens definition
      const screens = {
        onboarding: renderOnboarding,
        home: renderHome,
        learn: renderLearn,
        progress: renderProgress,
        settings: renderSettings
      };

      function setScreen(screenId) {
        currentScreen = screenId;
        renderApp();
      }

      // helper: header + bottom nav wrapper
      function renderApp() {
        const screenDiv = document.getElementById('appScreen');
        const header = renderHeader(currentScreen);
        const content = screens[currentScreen]();
        const bottom = renderBottomNav(currentScreen);
        screenDiv.innerHTML = header + content + bottom;
        attachNavListeners();
        attachProfileListener();
        attachSpecificListeners();
        if (modalContent) renderModal(modalContent);
      }

      function renderHeader(screenName) {
        let title = 'Logic Trainer';
        if (screenName === 'home') title = 'Dashboard';
        else if (screenName === 'learn') title = 'Puzzles';
        else if (screenName === 'progress') title = 'Statistics';
        else if (screenName === 'settings') title = 'Settings';
        else if (screenName === 'onboarding') title = 'Welcome';
        return `
          <div class="header">
            <h1>${title}</h1>
            <button class="profile-btn" id="profileBtn">${icons.profile}</button>
          </div>
        `;
      }

      function renderBottomNav(active) {
        const navItems = [
          { id: 'home', label: 'Home', icon: icons.home },
          { id: 'learn', label: 'Learn', icon: icons.learn },
          { id: 'progress', label: 'Progress', icon: icons.progress },
          { id: 'settings', label: 'Settings', icon: icons.settings }
        ];
        return `
          <div class="bottom-nav">
            ${navItems.map(item => `
              <button class="nav-item ${active === item.id ? 'active' : ''}" data-nav="${item.id}">
                ${item.icon}
                <span class="nav-label">${item.label}</span>
              </button>
            `).join('')}
          </div>
        `;
      }

      // ---- Onboarding ----
      function renderOnboarding() {
        return `
          <div class="content">
            <div style="text-align: center; margin: 24px 0 16px;">
              <div style="background: var(--primary); width: 80px; height: 80px; border-radius: 28px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center;">
                <svg width="44" height="44" viewBox="0 0 24 24" stroke="white" stroke-width="2"><path d="M12 2L2 7L12 12L22 7L12 2Z" fill="none"/><path d="M2 17L12 22L22 17" fill="none"/><path d="M2 12L12 17L22 12" fill="none"/></svg>
              </div>
              <h2 style="font-size: 32px; font-weight: 700; color: var(--text-primary);">Logic Mind</h2>
              <p style="color: var(--text-secondary); margin: 4px 0;">train your brain daily</p>
              <p style="color: var(--text-secondary); margin: 16px 0;">Sharpen logic with 5-min puzzles. Adaptive challenges for all levels.</p>
            </div>
            <button class="btn" id="getStartedBtn">Get Started</button>
            <div class="link-row">
              <button class="link" id="privacyLink">Privacy Policy</button>
              <button class="link" id="termsLink">Terms of Service</button>
            </div>
          </div>
        `;
      }

      // ---- Home Dashboard ----
      function renderHome() {
        return `
          <div class="content">
            <div class="card">
              <div class="row"><span style="font-weight: 600;">Daily brain boost</span> <span>${dailyGoal}%</span></div>
              <div class="progress-bar"><div class="progress-fill" style="width:${dailyGoal}%;"></div></div>
              <div style="display: flex; gap: 8px; margin-top: 12px;">
                <span class="badge"><span>🔥 12 day streak</span></span>
                <span class="badge"><span>🏆 430 pts</span></span>
              </div>
            </div>
            <div class="card">
              <div class="row"><span style="font-weight: 600;">Today's puzzles</span> <span>3/5</span></div>
              <div style="margin: 12px 0;">
                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 10px;">${icons.flashcards}<span>Pattern recognition</span></div>
                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 10px;">${icons.lesson}<span>Lateral thinking</span></div>
                <div style="display: flex; align-items: center; gap: 12px;">${icons.play}<span>Memory grid</span></div>
              </div>
              <button class="btn" style="padding: 12px;" id="homeStartBtn">Start practice</button>
            </div>
          </div>
        `;
      }

      // ---- Learn (Practice) ----
      function renderLearn() {
        return `
          <div class="content">
            <div class="card">
              <h3 style="margin-bottom: 12px;">Critical thinking</h3>
              <div style="display:flex; align-items:center; gap:8px; margin: 12px 0;">${icons.lesson} <span>20 puzzles · intermediate</span></div>
              <div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div>
            </div>
            <div class="card">
              <div class="row"><span style="font-weight:600;">Recommended</span></div>
              <div style="display:flex; gap:12px; margin-top:12px;">
                <span class="badge">Deduction</span>
                <span class="badge">Spatial</span>
                <span class="badge">Math</span>
              </div>
              <button class="btn" style="padding: 14px; margin-top: 16px;" id="learnPracticeBtn">Start new lesson</button>
            </div>
          </div>
        `;
      }

      // ---- Progress ----
      function renderProgress() {
        return `
          <div class="content">
            <div class="card">
              <div class="stat-grid">
                <div class="stat-cell"><span style="font-size:20px; font-weight:700;">47</span><br>puzzles</div>
                <div class="stat-cell"><span style="font-size:20px; font-weight:700;">8</span><br>badges</div>
              </div>
              <div style="margin: 12px 0;">${icons.chart} Mastery level 5</div>
              <div class="badge-group">
                <span class="badge">${icons.check} Fast thinker</span>
                <span class="badge">🔥 12 day streak</span>
              </div>
            </div>
            <div class="card">
              <span style="font-weight:600;">Weekly activity</span>
              <div style="display:flex; gap:4px; margin:16px 0; height:60px; align-items:flex-end;">
                <div style="width:14%; background:var(--primary); height:24px; border-radius:6px;"></div><div style="width:14%; background:var(--primary); height:40px;"></div><div style="width:14%; background:var(--primary); height:18px;"></div><div style="width:14%; background:var(--primary); height:52px;"></div><div style="width:14%; background:var(--primary); height:30px;"></div><div style="width:14%; background:var(--primary); height:46px;"></div><div style="width:14%; background:var(--primary); height:38px;"></div>
              </div>
            </div>
          </div>
        `;
      }

      // ---- Settings (with theme toggle) ----
      function renderSettings() {
        return `
          <div class="content">
            <div class="card">
              <div style="margin-bottom:20px; display:flex; align-items:center; gap:16px;">${icons.profile} <span>Profile: Logic master</span></div>
              <div class="theme-toggle">Dark mode <input type="checkbox" class="switch" id="darkToggle" ${darkMode ? 'checked' : ''}></div>
            </div>
            <div class="card">
              <div>Reminders</div>
              <div>Language</div>
              <div style="margin-top:12px;">App version 2026.1</div>
            </div>
          </div>
        `;
      }

      // ----- modal -----
      function renderModal(type) {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.id = 'activeModal';
        let text = type === 'privacy' ? 'Privacy: No data shared. Your progress stays on device.' : 'Terms: Use for personal learning only.';
        modalDiv.innerHTML = `<div class="modal-card"><p>${text}</p><button id="closeModalBtn">OK</button></div>`;
        document.body.appendChild(modalDiv);
        document.getElementById('closeModalBtn').addEventListener('click', ()=>{
          document.getElementById('activeModal')?.remove();
          modalContent = null;
        });
      }

      // listeners
      function attachNavListeners() {
        document.querySelectorAll('.nav-item').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const nav = e.currentTarget.dataset.nav;
            if (nav) setScreen(nav);
          });
        });
      }
      function attachProfileListener() {
        const profile = document.getElementById('profileBtn');
        if (profile) profile.addEventListener('click', () => setScreen('settings'));
      }
      function attachSpecificListeners() {
        if (currentScreen === 'onboarding') {
          document.getElementById('getStartedBtn')?.addEventListener('click', ()=> setScreen('home'));
          document.getElementById('privacyLink')?.addEventListener('click', ()=> { modalContent='privacy'; renderModal('privacy'); });
          document.getElementById('termsLink')?.addEventListener('click', ()=> { modalContent='terms'; renderModal('terms'); });
        }
        if (currentScreen === 'home') {
          document.getElementById('homeStartBtn')?.addEventListener('click', ()=> setScreen('learn'));
        }
        if (currentScreen === 'learn') {
          document.getElementById('learnPracticeBtn')?.addEventListener('click', ()=> { dailyGoal = Math.min(100, dailyGoal+5); setScreen('progress'); });
        }
        if (currentScreen === 'settings') {
          const toggle = document.getElementById('darkToggle');
          if (toggle) {
            toggle.checked = darkMode;
            toggle.addEventListener('change', (e) => {
              darkMode = e.target.checked;
              document.body.classList.toggle('dark', darkMode);
              renderApp(); 
            });
          }
        }
      }

      // ---------- SCREENSHOT FEATURE (SHIFT+W) ----------
      document.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.key === 'W') {
          e.preventDefault();
          const phone = document.getElementById('phoneContainer');
          if (!phone) return;
          screenshotCounter++;
          let filename = darkMode ? '6.png' : screenshotCounter + '.png';
          if (screenshotCounter > 5 && !darkMode) screenshotCounter = 1; // simple roll
          if (darkMode) filename = '6.png';
          
          // dummy capture alert (simulate, real screenshot would use html2canvas, but here just console)
          alert(`📸 Screenshot saved as ${filename} (simulated)`);
        }
      });

      // initial render
      renderApp();

      // JSON output after window load (as requested)
      window.addEventListener('load', ()=>{
        console.log('All done!');
      });

      // the JSON object (stringified) will be appended after the code in final answer.
    })();
  </script>
  <script>
    // final JSON output (displayed as per requirement)
    (function(){ 
      const titles = {
        "1.png": "Start Learning",
        "2.png": "Daily Lessons",
        "3.png": "Practice Skills",
        "4.png": "Track Progress",
        "5.png": "Smart Settings",
        "6.png": "Dark Theme"
      };
      console.log(JSON.stringify(titles, null, 2));
    })();
  </script>
</body>
</html>
All done!
