```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VocabVenture · English builder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }
    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #b0c4de 0%, #cbd5e0 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background-color: var(--bg-primary);
      border-radius: 48px;
      box-shadow: 0 30px 50px -10px rgba(0,20,40,0.5), 0 0 0 8px #e9eef3;
      overflow: hidden;
      position: relative;
      transition: background-color 0.2s;
    }
    /* inner screen */
    .screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      transition: background-color 0.2s, color 0.2s;
    }
    /* theme variables (light default) */
    .light-theme {
      --bg-primary: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --border-light: #E2E8F0;
      --primary-blue: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --icon-inactive: #94A3B8;
      --bottom-bg: #FFFFFF;
      --header-icon: #334155;
    }
    .dark-theme {
      --bg-primary: #0F172A;
      --card-bg: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --border-light: #334155;
      --primary-blue: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --icon-inactive: #64748B;
      --bottom-bg: #1E293B;
      --header-icon: #CBD5E1;
    }
    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 8px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 650;
      letter-spacing: -0.3px;
      color: var(--text-primary);
    }
    .profile-icon {
      cursor: pointer;
      padding: 8px 6px;
      border-radius: 12px;
      transition: background 0.15s;
    }
    .profile-icon:hover {
      background: rgba(37,99,235,0.1);
    }
    /* main content area (flex grow, scroll) */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 8px;
      scrollbar-width: thin;
      scrollbar-color: var(--primary-blue) var(--border-light);
    }
    .content::-webkit-scrollbar {
      width: 4px;
    }
    .content::-webkit-scrollbar-thumb {
      background: var(--primary-blue);
      border-radius: 20px;
    }
    /* bottom navigation */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background-color: var(--bottom-bg);
      border-top: 1px solid var(--border-light);
      padding: 8px 8px 12px;
      border-radius: 0 0 48px 48px;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
      border: none;
      cursor: pointer;
      gap: 4px;
      transition: all 0.15s ease;
      padding: 4px 12px;
      border-radius: 20px;
      color: var(--icon-inactive);
      fill: var(--icon-inactive);
    }
    .nav-item.active {
      color: var(--primary-blue);
      fill: var(--primary-blue);
      background: rgba(37,99,235,0.08);
      transform: scale(1.05);
    }
    .nav-item.active svg {
      stroke: var(--primary-blue);
    }
    .nav-item svg {
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      width: 24px;
      height: 24px;
      fill: none;
      transition: stroke 0.15s;
    }
    .nav-item span {
      font-size: 12px;
      font-weight: 500;
      transition: color 0.15s;
    }
    .inactive-tab {
      color: var(--icon-inactive);
      fill: none;
    }
    /* cards & elements */
    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 18px 16px;
      margin-bottom: 16px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.02), 0 2px 4px rgba(0,20,30,0.05);
    }
    .flex-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-primary {
      background: var(--primary-blue);
      border: none;
      color: white;
      font-weight: 600;
      padding: 14px 24px;
      border-radius: 40px;
      font-size: 18px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(37,99,235,0.25);
      transition: 0.1s;
    }
    .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }
    .link-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 20px;
      font-size: 14px;
    }
    .link-row button {
      background: none;
      border: none;
      color: var(--primary-blue);
      text-decoration: underline;
      cursor: pointer;
      font-size: 14px;
    }
    .badge {
      background: var(--accent);
      color: #0F172A;
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
    }
    .progress-bar {
      background: #ddd;
      height: 10px;
      border-radius: 20px;
      margin: 12px 0;
      overflow: hidden;
    }
    .progress-fill {
      background: var(--primary-blue);
      width: 60%;
      height: 100%;
      border-radius: 20px;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-item {
      background: var(--bg-primary);
      border-radius: 20px;
      padding: 16px 8px;
      text-align: center;
    }
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: var(--card-bg);
      max-width: 280px;
      padding: 24px;
      border-radius: 32px;
      color: var(--text-primary);
    }
    .close-btn {
      margin-top: 20px;
      background: var(--primary-blue);
      border: none;
      color: white;
      padding: 8px 20px;
      border-radius: 40px;
      font-weight: 600;
    }
    .icon-svg {
      width: 22px;
      height: 22px;
      vertical-align: middle;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="phone light-theme" id="phoneContainer">
  <div class="screen" id="appScreen">
    <!-- dynamic header -->
    <div class="header" id="mainHeader">
      <h1 id="headerTitle">Welcome</h1>
      <div class="profile-icon" id="profileBtn">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--header-icon);">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
    </div>

    <!-- content area (injected by js) -->
    <div class="content" id="screenContent"></div>

    <!-- bottom navigation -->
    <div class="bottom-nav" id="bottomNav">
      <button class="nav-item" data-nav="home">
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v11h-7v-7h-4v7H3z"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-item" data-nav="learn">
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span>Learn</span>
      </button>
      <button class="nav-item" data-nav="progress">
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M21 12v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h7"/><polyline points="15 2 21 2 21 8"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        <span>Progress</span>
      </button>
      <button class="nav-item" data-nav="settings">
        <svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.05.05A10 10 0 0 0 12 18a10 10 0 0 0 6.26-2.2zM4.6 9a1.65 1.65 0 0 0-.33 1.82c.2.44.66.73 1.15.73h12.96c.5 0 .96-.3 1.16-.73.2-.44.16-.95-.14-1.33l-.05-.05A10 10 0 0 0 12 6a10 10 0 0 0-6.26 2.2z"/></svg>
        <span>Settings</span>
      </button>
    </div>
  </div>
</div>

<!-- modal placeholder -->
<div id="modalContainer" class="hidden"></div>

<script>
  (function() {
    // ---- app idea: English vocabulary builder ----
    const screens = {
      onboarding: { title: 'Welcome' },
      home: { title: 'Home' },
      learn: { title: 'Lessons' },
      progress: { title: 'Progress' },
      settings: { title: 'Settings' }
    };

    let currentScreen = 'onboarding';
    let currentTheme = 'light'; // 'light' or 'dark'

    // ---- helper: apply theme ----
    function setTheme(theme) {
      const phone = document.getElementById('phoneContainer');
      phone.classList.remove('light-theme', 'dark-theme');
      phone.classList.add(theme === 'dark' ? 'dark-theme' : 'light-theme');
      currentTheme = theme;
    }

    // ---- modals for privacy & terms ----
    function showModal(title, text) {
      const modalDiv = document.createElement('div');
      modalDiv.className = 'modal';
      modalDiv.innerHTML = `
        <div class="modal-content">
          <h3 style="margin-bottom:12px;">${title}</h3>
          <p style="margin-bottom:20px;">${text}</p>
          <button class="close-btn" id="closeModalBtn">Close</button>
        </div>
      `;
      document.body.appendChild(modalDiv);
      document.getElementById('closeModalBtn').addEventListener('click', () => {
        modalDiv.remove();
      });
      modalDiv.addEventListener('click', (e) => { if(e.target === modalDiv) modalDiv.remove(); });
    }

    // ---- render screen based on currentScreen ----
    function renderScreen() {
      const contentDiv = document.getElementById('screenContent');
      const headerTitle = document.getElementById('headerTitle');
      let html = '';

      if (currentScreen === 'onboarding') {
        headerTitle.innerText = 'VocabVenture';
        html = `
          <div class="card" style="text-align:center; padding:32px 16px;">
            <svg width="80" height="80" viewBox="0 0 24 24" stroke="var(--primary-blue)" stroke-width="1.5" fill="none" style="margin:0 auto 16px;">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
            <h2 style="font-size:32px; margin-bottom:8px;">LexiCards</h2>
            <p style="font-size:18px; color: var(--primary-blue); font-weight:500;">master words daily</p>
            <p style="margin:24px 0 20px; color:var(--text-secondary);">Build your English vocabulary with smart flashcards, daily challenges, and progress tracking.</p>
            <button class="btn-primary" id="getStartedBtn">Get Started</button>
            <div class="link-row">
              <button id="privacyModalBtn">Privacy Policy</button>
              <button id="termsModalBtn">Terms of Service</button>
            </div>
          </div>
        `;
      } else if (currentScreen === 'home') {
        headerTitle.innerText = 'Home';
        html = `
          <div class="card">
            <div class="flex-row"><span class="badge">✨ DAILY STREAK 7</span></div>
            <h3 style="margin:12px 0 6px;">Hello, Alex!</h3>
            <p>You've learned 24 new words this week</p>
            <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
            <div style="display:flex; justify-content:space-between;"><span>700 XP</span><span>→ 1000</span></div>
          </div>
          <div class="card">
            <h4>Continue learning</h4>
            <div class="flex-row" style="justify-content:space-between;">
              <span>📘 Business English</span><span>75%</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div>
            <div class="flex-row" style="margin-top:12px;"><svg width="20" height="20" viewBox="0 0 24 24" stroke="var(--primary-blue)"><polygon points="5 3 19 12 5 21 5 3"/></svg><span>Resume lesson →</span></div>
          </div>
          <div class="card flex-row" style="gap:20px;">
            <div><span style="font-size:24px;">📚</span><p>Idioms</p></div>
            <div><span style="font-size:24px;">🗣️</span><p>Pronunciation</p></div>
            <div><span style="font-size:24px;">✍️</span><p>Writing</p></div>
          </div>
        `;
      } else if (currentScreen === 'learn') {
        headerTitle.innerText = 'Learn';
        html = `
          <div class="card flex-row"><svg width="36" height="36" viewBox="0 0 24 24" stroke="var(--primary-blue)"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><div><h3>Flashcards: 150 cards</h3><p style="color:var(--text-secondary);">phrasal verbs</p></div></div>
          <div class="card flex-row"><svg width="36" height="36" viewBox="0 0 24 24" stroke="var(--primary-blue)"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><div><h3>Quick quiz</h3><p>synonyms · 10 min</p></div></div>
          <div class="card flex-row"><svg width="36" height="36" viewBox="0 0 24 24" stroke="var(--primary-blue)"><polygon points="12 2 22 7 22 17 12 22 2 17 2 7 12 2"/><line x1="12" y1="22" x2="12" x2="12" y2="12"/><polyline points="22 7 12 12 2 7"/></svg><div><h3>Word groups</h3><p>academic / business</p></div></div>
          <button class="btn-primary" id="practiceBtn" style="margin-top:4px;">Start practice</button>
        `;
      } else if (currentScreen === 'progress') {
        headerTitle.innerText = 'Progress';
        html = `
          <div class="stat-grid">
            <div class="stat-item"><span style="font-size:28px;">🔥</span><h3>12</h3><p>streak</p></div>
            <div class="stat-item"><span style="font-size:28px;">⭐</span><h3>430</h3><p>total xp</p></div>
          </div>
          <div class="card"><h4>Weekly activity</h4><svg width="100%" height="50" viewBox="0 0 200 40" stroke="var(--primary-blue)"><polyline points="0,30 20,20 40,25 60,10 80,15 100,5 120,15 140,12 160,20 180,20 200,18" fill="none" stroke-width="2"/></svg></div>
          <div class="card"><h4>Badges (4)</h4><div style="display:flex; gap:16px;">🏅🏅🏅🏅</div></div>
          <div class="card"><h4>Mastered: 89 words</h4><div class="progress-bar"><div class="progress-fill" style="width:48%"></div></div><p>December goal 48%</p></div>
        `;
      } else if (currentScreen === 'settings') {
        headerTitle.innerText = 'Settings';
        html = `
          <div class="card">
            <div class="flex-row" style="justify-content:space-between;">
              <span>🌙 Dark mode</span>
              <label><input type="checkbox" id="darkModeToggle" ${currentTheme==='dark'?'checked':''}></label>
            </div>
          </div>
          <div class="card"><h4>Profile</h4><p>Name: Alex Chen</p><p>Member since 2025</p></div>
          <div class="card"><h4>Reminders</h4><p>Daily 8:00 PM</p></div>
          <div class="card"><h4>Sound & animations</h4><p>On</p></div>
        `;
      }

      contentDiv.innerHTML = html;

      // attach event listeners
      if (currentScreen === 'onboarding') {
        document.getElementById('getStartedBtn')?.addEventListener('click', () => { navigateTo('home'); });
        document.getElementById('privacyModalBtn')?.addEventListener('click', () => { showModal('Privacy Policy', 'We respect your privacy. No data sold to third parties. Simple.'); });
        document.getElementById('termsModalBtn')?.addEventListener('click', () => { showModal('Terms of Service', 'Use the app for learning. Be kind. English only.'); });
      }
      if (currentScreen === 'learn') {
        document.getElementById('practiceBtn')?.addEventListener('click', ()=> alert('Practice session started! (simulated)'));
      }
      if (currentScreen === 'settings') {
        const toggle = document.getElementById('darkModeToggle');
        if(toggle) {
          toggle.addEventListener('change', (e) => {
            setTheme(e.target.checked ? 'dark' : 'light');
          });
        }
      }

      // active nav highlight
      document.querySelectorAll('.nav-item').forEach(btn => {
        const nav = btn.dataset.nav;
        if ((nav === 'home' && currentScreen === 'home') ||
            (nav === 'learn' && currentScreen === 'learn') ||
            (nav === 'progress' && currentScreen === 'progress') ||
            (nav === 'settings' && (currentScreen === 'settings' || currentScreen === 'onboarding'? false: false ))) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      // if onboarding, remove all active
      if(currentScreen === 'onboarding') {
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      }
    }

    function navigateTo(screenId) {
      if(screenId === 'settings' || screenId === 'progress' || screenId === 'learn' || screenId === 'home') {
        currentScreen = screenId;
      } else if (screenId === 'onboarding') { currentScreen = 'onboarding'; }
      renderScreen();
    }

    // ---- bottom nav listeners ----
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const nav = e.currentTarget.dataset.nav; // 'home', 'learn', 'progress', 'settings'
        if (nav === 'home') navigateTo('home');
        else if (nav === 'learn') navigateTo('learn');
        else if (nav === 'progress') navigateTo('progress');
        else if (nav === 'settings') navigateTo('settings');
      });
    });

    // profile icon click -> open settings
    document.getElementById('profileBtn').addEventListener('click', () => {
      navigateTo('settings');
    });

    // initial render
    renderScreen();

    // ---- screenshot capture (SHIFT+W) ----
    let screenshotCounter = 0;
    document.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const phone = document.getElementById('phoneContainer');
        import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm').then((mod) => {
          const html2canvas = mod.default;
          html2canvas(phone, { scale: 2, backgroundColor: null }).then(canvas => {
            const link = document.createElement('a');
            let filename = '';
            if (currentTheme === 'dark') filename = '6.png';
            else {
              screenshotCounter = (screenshotCounter % 5) + 1;
              filename = screenshotCounter + '.png';
            }
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
          });
        }).catch(() => alert('html2canvas load failed, but shift+w works.'));
      }
    });

    // ---- expose for theme toggles etc ----
    window.showModal = showModal;
  })();
</script>

      "6.png": "Dark Theme"
    };
    console.log(JSON.stringify(titles, null, 2));
    document.getElementById('jsonData').innerText = JSON.stringify(titles, null, 2);
