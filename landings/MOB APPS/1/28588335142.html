<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Brain Trainer · mobile prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #1a2639;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        /* phone container */
        #phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg-primary);
            border-radius: 42px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px rgba(255,255,255,0.06);
            position: relative;
            transition: background-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        /* theme variables */
        :root {
            --bg-primary: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive-icon: #94A3B8;
            --tab-highlight: rgba(37, 99, 235, 0.08);
            --shadow-card: 0 8px 20px -6px rgba(0, 0, 0, 0.08);
        }

        .dark-theme {
            --bg-primary: #0F172A;
            --card-bg: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --accent: #38BDF8;
            --inactive-icon: #64748B;
            --tab-highlight: rgba(59, 130, 246, 0.15);
            --shadow-card: 0 8px 20px -4px rgba(0, 0, 0, 0.4);
        }

        /* main content area */
        #app-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 8px 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive-icon) transparent;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        #app-content::-webkit-scrollbar {
            width: 4px;
        }
        #app-content::-webkit-scrollbar-thumb {
            background-color: var(--inactive-icon);
            border-radius: 8px;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 4px 0;
        }
        .header h2 {
            font-size: 22px;
            font-weight: 650;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            transition: background 0.15s;
        }
        .profile-btn:hover {
            background: var(--tab-highlight);
        }
        .profile-btn svg {
            width: 26px;
            height: 26px;
            stroke: var(--text-primary);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* bottom navigation */
        .bottom-nav {
            height: 68px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            padding: 0 4px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            color: var(--inactive-icon);
            transition: all 0.15s ease;
            padding: 8px 0;
            border-radius: 24px;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            transition: transform 0.2s;
        }
        .nav-item.active {
            color: var(--primary);
            background: var(--tab-highlight);
            transform: scale(1.02);
        }
        .nav-item.active svg {
            transform: scale(1.12);
            stroke-width: 2.2;
        }

        /* cards, badges */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-light);
        }
        .flex-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .gap-4 { gap: 8px; }
        .mb-2 { margin-bottom: 8px; }
        .mt-2 { margin-top: 8px; }
        .text-small { font-size: 13px; color: var(--text-secondary); }
        .text-large { font-size: 28px; font-weight: 700; color: var(--primary); }

        .progress-bar-bg {
            background: var(--border-light);
            height: 8px;
            border-radius: 20px;
            width: 100%;
            margin: 8px 0;
        }
        .progress-fill {
            background: var(--primary);
            width: 0%;
            height: 8px;
            border-radius: 20px;
            transition: width 0.4s ease;
        }

        .badge-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .badge {
            background: var(--bg-primary);
            border-radius: 30px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            font-size: 13px;
            color: var(--text-primary);
            border: 1px solid var(--border-light);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            font-weight: 600;
            border: none;
            padding: 16px 24px;
            border-radius: 60px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: 0.15s;
        }
        .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }

        .link-row {
            display: flex;
            justify-content: center;
            gap: 28px;
            font-size: 13px;
            margin: 16px 0 8px;
            color: var(--text-secondary);
        }
        .link-row span {
            text-decoration: underline;
            cursor: pointer;
        }

        /* modal overlay */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: var(--card-bg);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            color: var(--text-primary);
            text-align: center;
        }
        .modal-card button {
            margin-top: 20px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        .hidden { display: none; }

        /* onboarding */
        .logo {
            background: linear-gradient(145deg, #2563EB, #38BDF8);
            width: 70px;
            height: 70px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 16px auto 12px;
        }

        /* icons as inline symbols */
        .icon-defs { display: none; }

        /* small chart simulation */
        .chart-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 100px;
            margin: 16px 0;
        }
        .chart-bar {
            width: 22px;
            background: var(--accent);
            border-radius: 12px 12px 4px 4px;
            height: calc(70% + 5px);
            transition: height 0.3s;
        }
    </style>
</head>
<body>
    <!-- hidden SVG sprite -->

        <symbol id="icon-home" viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="icon-learn" viewBox="0 0 24 24"><path d="M2 3H8C9.1 3 10 3.9 10 5V19C10 20.1 9.1 21 8 21H2V3Z" stroke="currentColor" fill="none" stroke-width="2"/><path d="M22 3H16C14.9 3 14 3.9 14 5V19C14 20.1 14.9 21 16 21H22V3Z" stroke="currentColor" fill="none" stroke-width="2"/><line x1="10" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="2"/></symbol>

        <symbol id="icon-profile" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" stroke="currentColor" fill="none" stroke-width="2"/><path d="M5 20V18C5 14.7 7.7 12 11 12H13C16.3 12 19 14.7 19 18V20" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></symbol>
        <symbol id="icon-lesson" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" fill="none" stroke-width="2"/><line x1="9" y1="8" x2="15" y2="8" stroke="currentColor" stroke-width="2"/><line x1="9" y1="12" x2="15" y2="12" stroke="currentColor" stroke-width="2"/><line x1="9" y1="16" x2="12" y2="16" stroke="currentColor" stroke-width="2"/></symbol>

        <symbol id="icon-flashcards" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" fill="none" stroke-width="2"/><line x1="9" y1="7" x2="15" y2="7" stroke="currentColor" stroke-width="2"/><line x1="9" y1="11" x2="15" y2="11" stroke="currentColor" stroke-width="2"/><line x1="9" y1="15" x2="13" y2="15" stroke="currentColor" stroke-width="2"/></symbol>

    </svg>

    <div id="phone" class="">
        <!-- header dynamically updated by js -->
        <div class="header" id="app-header">
            <h2 id="header-title">Math Brain</h2>
            <button class="profile-btn" id="profileBtn"><svg><use href="#icon-profile"></use></svg></button>
        </div>

        <!-- main screen container -->
        <div id="app-content"></div>

        <!-- bottom nav -->
        <div class="bottom-nav" id="bottomNav">
            <button class="nav-item" data-tab="home"><svg><use href="#icon-home"></use></svg><span>Home</span></button>
            <button class="nav-item" data-tab="learn"><svg><use href="#icon-learn"></use></svg><span>Learn</span></button>
            <button class="nav-item" data-tab="progress"><svg><use href="#icon-progress"></use></svg><span>Progress</span></button>
            <button class="nav-item" data-tab="settings"><svg><use href="#icon-settings"></use></svg><span>Settings</span></button>
        </div>

        <!-- modal container (hidden) -->
        <div id="modalContainer" class="modal hidden">
            <div class="modal-card">
                <p id="modalText"></p>
                <button id="closeModal">Close</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ----- theme management -----
            const phone = document.getElementById('phone');
            function setTheme(mode) {
                if (mode === 'dark') phone.classList.add('dark-theme');
                else phone.classList.remove('dark-theme');
            }
            setTheme('light');
            window.theme = 'light';

            // ----- screen definitions & navigation -----
            let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings

            const headerTitleEl = document.getElementById('header-title');
            const contentEl = document.getElementById('app-content');
            const navItems = document.querySelectorAll('.nav-item');
            const profileBtn = document.getElementById('profileBtn');

            // helper: update active tab
            function setActiveTab(screen) {
                navItems.forEach(item => {
                    const tab = item.dataset.tab;
                    if ((screen === 'home' && tab === 'home') ||
                        (screen === 'learn' && tab === 'learn') ||
                        (screen === 'progress' && tab === 'progress') ||
                        (screen === 'settings' && tab === 'settings')) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                });
            }

            // modal helpers
            const modal = document.getElementById('modalContainer');
            const modalText = document.getElementById('modalText');
            function showModal(text) {
                modalText.innerText = text;
                modal.classList.remove('hidden');
            }
            document.getElementById('closeModal').addEventListener('click', ()=>{
                modal.classList.add('hidden');
            });

            // ---- onboarding screen ----
            function renderOnboarding() {
                headerTitleEl.innerText = 'Welcome';
                setActiveTab('home'); // but onboarding is separate
                contentEl.innerHTML = `
                    <div style="text-align:center; padding:12px 0;">
                        <div class="logo">
                            <svg width="44" height="44" viewBox="0 0 24 24" stroke="white" stroke-width="2" fill="none">
                                <circle cx="12" cy="12" r="9"/><path d="M12 7V12L15 15"/>
                            </svg>
                        </div>
                        <h1 style="font-size:32px; font-weight:700; color:var(--text-primary);">Math Brain</h1>
                        <p style="font-size:18px; color:var(--primary); margin:6px 0;">train your mental math</p>
                        <p style="margin:16px 0 28px; color:var(--text-secondary);">Daily 5‑minute workouts that boost arithmetic speed and logic.</p>
                        <button class="btn-primary" id="getStartedBtn">Get Started</button>
                        <div class="link-row">
                            <span id="privacyLink">Privacy Policy</span>
                            <span id="termsLink">Terms of Service</span>
                        </div>
                    </div>
                `;
                document.getElementById('privacyLink').addEventListener('click', ()=> showModal('Privacy Policy – we protect your data.'));
                document.getElementById('termsLink').addEventListener('click', ()=> showModal('Terms of Service – use Math Brain fairly.'));
                document.getElementById('getStartedBtn').addEventListener('click', ()=>{
                    currentScreen = 'home';
                    renderHome();
                });
            }

            // ---- home dashboard ----
            function renderHome() {
                headerTitleEl.innerText = 'Math Brain';
                setActiveTab('home');
                contentEl.innerHTML = `
                    <div class="card" style="display:flex; align-items:center; gap:12px;">
                        <svg width="42" height="42" style="stroke:var(--primary);"><use href="#icon-play"></use></svg>
                        <div style="flex:1"><span style="font-weight:600; color:var(--text-primary);">Daily workout</span><br><span class="text-small">5 quick rounds</span></div>
                        <button style="background:var(--primary); border:none; color:white; padding:10px 20px; border-radius:40px; font-weight:600;" id="startPracticeBtn">Start</button>
                    </div>
                    <div class="card">
                        <div class="flex-row"><svg width="22" height="22" stroke="var(--primary)"><use href="#icon-lesson"></use></svg><span style="font-weight:600; color:var(--text-primary);">Continue lessons</span></div>
                        <div class="flex-row" style="justify-content:space-between; margin-top:12px;">
                            <span>Addition · level 3</span><span class="text-small">75%</span>
                        </div>
                        <div class="progress-bar-bg"><div class="progress-fill" style="width:75%"></div></div>
                        <div class="flex-row" style="justify-content:space-between; margin-top:12px;">
                            <span>Multiplication · level 2</span><span class="text-small">30%</span>
                        </div>
                        <div class="progress-bar-bg"><div class="progress-fill" style="width:30%"></div></div>
                        <div style="margin-top:16px;"><span class="badge"><svg width="16" height="16" stroke="currentColor"><use href="#icon-flashcards"></use></svg> 3 in row</span></div>
                    </div>
                    <div class="card">
                        <div style="display:flex; justify-content:space-between;"><span style="font-weight:600;">Today's streak</span> <span>🔥 12 days</span></div>
                        <div class="badge-grid" style="margin-top:12px;">
                            <span class="badge"><svg width="16" height="16" stroke="currentColor"><use href="#icon-check"></use></svg> 5 exercises</span>
                            <span class="badge"><svg width="16" height="16" stroke="currentColor"><use href="#icon-chart"></use></svg> +45 pts</span>
                        </div>
                    </div>
                `;
                document.getElementById('startPracticeBtn')?.addEventListener('click', ()=>{
                    currentScreen = 'learn';
                    renderLearn();
                });
            }

            // ---- learn / practice ----
            function renderLearn() {
                headerTitleEl.innerText = 'Practice';
                setActiveTab('learn');
                contentEl.innerHTML = `
                    <div class="card">
                        <h3 style="margin-bottom:8px;">Arithmetic boost</h3>
                        <div class="flex-row gap-4">
                            <span class="badge"><svg width="16" height="16"><use href="#icon-play"></use></svg> + – × ÷</span>
                            <span class="badge">mentally</span>
                        </div>
                    </div>
                    <div class="card" id="lessonCard" style="cursor:pointer;">
                        <div class="flex-row"><svg width="24" height="24" stroke="var(--primary)"><use href="#icon-lesson"></use></svg><span style="font-weight:600;">Lesson: fast addition</span></div>
                        <span class="text-small">25 min · 4 chapters</span>
                        <div class="progress-bar-bg mt-2"><div class="progress-fill" style="width:40%"></div></div>
                        <div style="margin-top:12px;">👇 tap to open</div>
                    </div>
                    <div class="card" style="display:flex; justify-content:space-between;">
                        <span style="font-weight:600;">Quick practice</span>
                        <button style="background:var(--primary); border:none; color:white; padding:8px 18px; border-radius:40px;" id="startQuick">Start</button>
                    </div>
                `;
                document.getElementById('lessonCard')?.addEventListener('click', ()=>{
                    showModal('Lesson: Fast addition · video + exercises');
                });
                document.getElementById('startQuick')?.addEventListener('click', ()=>{
                    showModal('5 addition problems · 2 minutes');
                });
            }

            // ---- progress / statistics ----
            function renderProgress() {
                headerTitleEl.innerText = 'Progress';
                setActiveTab('progress');
                contentEl.innerHTML = `
                    <div class="card">
                        <div class="flex-row"><svg width="24" height="24" stroke="var(--primary)"><use href="#icon-chart"></use></svg><span style="font-weight:600;">Last 7 days</span></div>
                        <div class="chart-row">
                            <div class="chart-bar" style="height:65px;"></div><div class="chart-bar" style="height:42px;"></div><div class="chart-bar" style="height:80px;"></div><div class="chart-bar" style="height:55px;"></div><div class="chart-bar" style="height:94px;"></div><div class="chart-bar" style="height:70px;"></div><div class="chart-bar" style="height:88px;"></div>
                        </div>
                    </div>
                    <div class="card">
                        <span style="font-weight:600;">Mastery</span>
                        <div><span>Addition</span><div class="progress-bar-bg"><div class="progress-fill" style="width:94%"></div></div></div>
                        <div><span>Multiplication</span><div class="progress-bar-bg"><div class="progress-fill" style="width:67%"></div></div></div>
                        <div><span>Division</span><div class="progress-bar-bg"><div class="progress-fill" style="width:43%"></div></div></div>
                    </div>
                    <div class="card badge-grid">
                        <span class="badge">🧠 1300 XP</span>
                        <span class="badge">⚡ 38 sec avg</span>
                        <span class="badge">🏅 top 12%</span>
                    </div>
                `;
            }

            // ---- settings / profile (theme toggle) ----
            function renderSettings() {
                headerTitleEl.innerText = 'Settings';
                setActiveTab('settings');
                const isDark = phone.classList.contains('dark-theme');
                contentEl.innerHTML = `
                    <div class="card">
                        <div style="display:flex; align-items:center; gap:16px;">
                            <svg width="32" height="32" stroke="var(--text-primary)"><use href="#icon-profile"></use></svg>
                            <div><div style="font-weight:600;">Alex M.</div><span class="text-small">alex@example.com</span></div>
                        </div>
                    </div>
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span>🌙 Dark theme</span>
                            <label style="width:48px; height:26px; background:var(--border-light); border-radius:40px; position:relative; display:inline-block;">
                                <input type="checkbox" id="themeToggle" ${isDark ? 'checked' : ''} style="opacity:0; width:0; height:0;">
                                <span style="cursor:pointer; position:absolute; top:2px; left:2px; width:22px; height:22px; background:var(--primary); border-radius:50%; transition:0.2s; ${isDark ? 'transform:translateX(22px);' : ''}" id="themeSlider"></span>
                            </label>
                        </div>
                        <div style="margin-top:16px;">
                            <span class="badge" style="width:100%; justify-content:center;">Sound effects</span>
                            <span class="badge" style="width:100%; justify-content:center; margin-top:8px;">Daily reminder</span>
                        </div>
                    </div>
                `;
                const slider = document.getElementById('themeSlider');
                const toggle = document.getElementById('themeToggle');
                if (slider) slider.addEventListener('click', (e)=>{
                    const newTheme = phone.classList.contains('dark-theme') ? 'light' : 'dark';
                    setTheme(newTheme);
                    renderSettings(); // refresh to update toggle
                });
            }

            // ---- routing ----
            function navigateTo(screen) {
                if (screen === 'home') renderHome();
                else if (screen === 'learn') renderLearn();
                else if (screen === 'progress') renderProgress();
                else if (screen === 'settings') renderSettings();
                currentScreen = screen;
            }

            navItems.forEach(item => {
                item.addEventListener('click', (e) => {
                    const tab = e.currentTarget.dataset.tab;
                    navigateTo(tab);
                });
            });

            profileBtn.addEventListener('click', ()=>{
                renderSettings();  // profile opens settings
            });

            // start with onboarding
            renderOnboarding();

            // ----- screenshot feature (SHIFT+W) -----
            let screenshotCounter = 1;
            document.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    const phoneEl = document.getElementById('phone');
                    // In real world would use html2canvas, but we simulate filename rules
                    const isDark = phone.classList.contains('dark-theme');
                    let filename = isDark ? '6.png' : (screenshotCounter <=5 ? screenshotCounter+'.png' : '1.png');
                    if (!isDark) {
                        if (screenshotCounter > 5) screenshotCounter = 1;
                        filename = screenshotCounter + '.png';
                        screenshotCounter++;
                    }
