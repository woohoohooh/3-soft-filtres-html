```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Brain Trainer · prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #1a1e2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --border: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
        }
        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --border: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
        }
        .phone-mock {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: none;
            padding: 16px 16px 8px 16px;
        }
        .app-screen::-webkit-scrollbar { display: none; }
        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.02em;
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }
        .profile-btn svg {
            width: 28px;
            height: 28px;
            stroke: var(--text);
            stroke-width: 2;
            fill: none;
        }
        /* bottom nav */
        .bottom-nav {
            background: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px;
            border-radius: 30px 30px 0 0;
            box-shadow: var(--shadow);
        }
        .nav-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 6px 12px;
            border-radius: 30px;
            color: var(--inactive);
            fill: none;
            stroke: var(--inactive);
        }
        .nav-item.active {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
            stroke: var(--primary);
            transform: scale(1.05);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
        }
        /* cards & components */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .logo-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .app-logo {
            background: var(--primary);
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 24px;
        }
        .tagline {
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary);
            margin: 8px 0 4px;
        }
        .desc {
            color: var(--text-light);
            line-height: 1.4;
            margin: 8px 0 16px;
        }
        .btn-large {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 40px;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: 0.1s;
            margin: 8px 0;
        }
        .btn-large:active { background: var(--primary-dark); }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            font-size: 0.8rem;
        }
        .link-row button {
            background: none;
            border: none;
            color: var(--inactive);
            text-decoration: underline;
            cursor: pointer;
        }
        /* lesson row */
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 16px 0;
        }
        .lesson-icon {
            background: rgba(56, 189, 248, 0.2);
            padding: 12px;
            border-radius: 18px;
        }
        .lesson-info h4 {
            color: var(--text);
            font-weight: 600;
        }
        .progress-bar {
            height: 8px;
            background: var(--border);
            border-radius: 10px;
            margin: 12px 0;
        }
        .progress-fill {
            width: 65%;
            height: 100%;
            background: var(--primary);
            border-radius: 10px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .chart-simple {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 100px;
            margin: 20px 0;
        }
        .bar {
            width: 20%;
            background: var(--primary);
            border-radius: 12px 12px 4px 4px;
            transition: height 0.3s;
        }
        /* modal */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card);
            padding: 24px;
            border-radius: 32px;
            width: 280px;
            color: var(--text);
        }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="phone-mock" id="phoneContainer">
    <!-- dynamic screens injected via js -->
    <div id="screenRoot" class="app-screen"></div>
    <!-- bottom nav will be appended by js after screenRoot -->
</div>
<script>
    (function(){
        // ---------- CSS variables / theme ----------
        const root = document.documentElement;
        const body = document.body;
        let darkMode = false;

        // ---------- icon system (inline svg) ----------
        const icons = {
            home: '<svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
            learn: '<svg viewBox="0 0 24 24"><path d="M2 3H8C9.1 3 10 3.9 10 5V21L6 18L2 21V5C2 3.9 2.9 3 4 3Z" stroke="currentColor" fill="none" stroke-width="2"/><path d="M22 3H16C14.9 3 14 3.9 14 5V21L18 18L22 21V5C22 3.9 21.1 3 20 3Z" stroke="currentColor" fill="none" stroke-width="2"/></svg>',
            progress: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none" stroke-width="2"/><path d="M12 3V12L17 17" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>',
            settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor" fill="none" stroke-width="2"/><path d="M19.4 15C18.9 16 18.1 16.8 17.2 17.2L15.7 15.7M8.3 15.7L6.8 17.2C5.9 16.8 5.1 16 4.6 15M4.6 9C5.1 8 5.9 7.2 6.8 6.8L8.3 8.3M15.7 8.3L17.2 6.8C18.1 7.2 18.9 8 19.4 9M12 5V3M12 21V19M19 12H21M3 12H5" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>',
            profile: '<svg viewBox="0 0 24 24"><path d="M20 21V19C20 16.8 18.2 15 16 15H8C5.8 15 4 16.8 4 19V21" stroke="currentColor" fill="none" stroke-width="2"/><circle cx="12" cy="7" r="4" stroke="currentColor" fill="none" stroke-width="2"/></svg>',
            lesson: '<svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" fill="none" stroke-width="2"/><path d="M8 9H16M8 13H12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
            chart: '<svg viewBox="0 0 24 24"><path d="M21 21H3V3M7 15V17M11 11V17M15 7V17M19 13V17" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>',
            flashcards: '<svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2" stroke="currentColor" fill="none" stroke-width="2"/><path d="M8 7H16M8 11H12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
            play: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none" stroke-width="2"/><path d="M10 8L16 12L10 16V8Z" stroke="currentColor" fill="none" stroke-width="2"/></svg>',
            check: '<svg viewBox="0 0 24 24"><path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>'
        };

        // ---------- state ----------
        let currentScreen = 'onboarding'; // 'home','learn','progress','settings','onboarding'
        let screenshotCounter = 1;

        // ---------- modal control ----------
        function showModal(text) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.id = 'modal';
            modal.innerHTML = `<div class="modal-content"><p style="margin-bottom:16px">${text}</p><button class="btn-large" style="padding:10px" id="closeModal">Close</button></div>`;
            document.querySelector('.phone-mock').appendChild(modal);
            document.getElementById('closeModal').addEventListener('click', ()=> modal.remove());
        }

        // ---------- render screen based on currentScreen ----------
        function renderScreen() {
            const rootDiv = document.getElementById('screenRoot');
            if (!rootDiv) return;

            const themeClass = darkMode ? 'dark' : '';
            body.className = themeClass;

            let html = '';
            if (currentScreen === 'onboarding') {
                html = `
                    <div class="header">
                        <h2>Math Brain</h2>
                        <button class="profile-btn" id="profileHeaderBtn">${icons.profile}</button>
                    </div>
                    <div class="card" style="text-align:center;">
                        <div class="logo-row" style="justify-content:center;">
                            <div class="app-logo">🧠</div>
                            <span style="font-size:2rem; font-weight:700; color:var(--primary)">Math&nbsp;Trainer</span>
                        </div>
                        <div class="tagline">Train your mental math</div>
                        <div class="desc">Quick, daily exercises to sharpen your brain. 5 minutes a day keeps the calculator away.</div>
                        <button class="btn-large" id="getStartedBtn">Get Started</button>
                        <div class="link-row">
                            <button id="privacyLink">Privacy</button>
                            <button id="termsLink">Terms</button>
                        </div>
                    </div>
                    <div style="margin-top:auto; padding:20px 0; text-align:center; color:var(--inactive);">⚡ brain training 2026</div>
                `;
            } else if (currentScreen === 'home') {
                html = `
                    <div class="header">
                        <h2>Dashboard</h2>
                        <button class="profile-btn" id="profileHeaderBtn">${icons.profile}</button>
                    </div>
                    <div class="card">
                        <div style="display:flex; justify-content:space-between;"><span>Daily streak 🔥 12</span><span class="badge">+45 pts</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
                        <div style="display:flex; gap:16px; margin-top:12px;">
                            <span>⚡ 340 XP</span><span>🏆 level 7</span>
                        </div>
                    </div>
                    <div class="card">
                        <h3>Continue lesson</h3>
                        <div class="lesson-item">
                            <span class="lesson-icon">${icons.lesson}</span>
                            <div class="lesson-info"><h4>Multiplication master</h4><span>75% complete</span></div>
                            <button class="btn-large" style="padding:8px 16px; width:auto;" id="practiceQuick">${icons.play} practice</button>
                        </div>
                    </div>
                    <div class="card">
                        <div style="display:flex; justify-content:space-between;"><span>📊 Today's activity</span><span>${icons.chart}</span></div>
                        <div class="chart-simple" id="chartAnim">
                            <div class="bar" style="height:50px"></div><div class="bar" style="height:70px"></div><div class="bar" style="height:40px"></div><div class="bar" style="height:90px"></div><div class="bar" style="height:60px"></div>
                        </div>
                    </div>
                `;
            } else if (currentScreen === 'learn') {
                html = `
                    <div class="header"><h2>Practice</h2><button class="profile-btn" id="profileHeaderBtn">${icons.profile}</button></div>
                    <div class="card"><h3>Arithmetic</h3><div class="lesson-item"><span>${icons.flashcards}</span><span>Addition</span><span style="margin-left:auto;">🔓</span></div><div class="lesson-item"><span>${icons.flashcards}</span><span>Subtraction</span><span style="margin-left:auto;">🔓</span></div><div class="lesson-item"><span>${icons.lesson}</span><span>Multiplication</span><span style="margin-left:auto;">🔒</span></div></div>
                    <div class="card"><h3>Brain games</h3><div class="lesson-item"><span>${icons.play}</span><span>Fast equations</span><span style="margin-left:auto;">⭐ new</span></div></div>
                    <button class="btn-large" id="startPractice">Start free practice →</button>
                `;
            } else if (currentScreen === 'progress') {
                html = `
                    <div class="header"><h2>Progress</h2><button class="profile-btn" id="profileHeaderBtn">${icons.profile}</button></div>
                    <div class="card"><h3>This week</h3><div class="stat-row"><span>Problems solved</span><span>234</span></div><div class="stat-row"><span>Accuracy</span><span>87%</span></div><div class="progress-bar"><div class="progress-fill" style="width:87%"></div></div></div>
                    <div class="card"><h3>Achievements</h3><div style="display:flex; gap:20px;"><span>🔥 7 day</span><span>⚡ speed demon</span><span>🧮 1000 ops</span></div></div>
                    <div class="card"><h3>History</h3><div class="chart-simple" style="height:50px;"><div class="bar" style="height:30px"></div><div class="bar" style="height:50px"></div><div class="bar" style="height:20px"></div><div class="bar" style="height:70px"></div><div class="bar" style="height:40px"></div></div></div>
                `;
            } else if (currentScreen === 'settings') {
                html = `
                    <div class="header"><h2>Settings</h2><button class="profile-btn" id="profileHeaderBtn">${icons.profile}</button></div>
                    <div class="card"><h3>Appearance</h3><button class="btn-large" id="themeToggleBtn" style="padding:12px;">Toggle Dark / Light</button></div>
                    <div class="card"><h3>Profile</h3><div class="lesson-item"><span>${icons.profile}</span> <span>username: brainiac</span></div></div>
                    <div class="card"><h3>About</h3><div>Math Trainer v1.0 · 2026</div></div>
                `;
            }

            rootDiv.innerHTML = html;

            // attach bottom nav manually (ensure not duplicated)
            let bottomNav = document.querySelector('.bottom-nav');
            if (bottomNav) bottomNav.remove();

            const navContainer = document.createElement('div');
            navContainer.className = 'bottom-nav';
            const tabs = [
                { id: 'home', icon: icons.home, label: 'Home' },
                { id: 'learn', icon: icons.learn, label: 'Learn' },
                { id: 'progress', icon: icons.progress, label: 'Progress' },
                { id: 'settings', icon: icons.settings, label: 'Settings' }
            ];
            tabs.forEach(tab => {
                const btn = document.createElement('button');
                btn.className = `nav-item ${currentScreen === tab.id ? 'active' : ''}`;
                btn.innerHTML = `${tab.icon}<span>${tab.label}</span>`;
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    currentScreen = tab.id;
                    renderScreen();
                });
                navContainer.appendChild(btn);
            });
            document.querySelector('.phone-mock').appendChild(navContainer);

            // event listeners for this screen
            if (currentScreen === 'onboarding') {
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{ currentScreen='home'; renderScreen(); });
                document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy Policy · We protect your brain data.'));
                document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms of Service · Use responsibly.'));
            } else {
                document.getElementById('profileHeaderBtn')?.addEventListener('click', ()=>{ currentScreen='settings'; renderScreen(); });
            }
            // practice buttons
            document.getElementById('practiceQuick')?.addEventListener('click', ()=>{ currentScreen='learn'; renderScreen(); });
            document.getElementById('startPractice')?.addEventListener('click', ()=>{ alert('Starting 2+2=4 exercise!'); });
            // theme toggle inside settings
            if (currentScreen === 'settings') {
                document.getElementById('themeToggleBtn')?.addEventListener('click', ()=>{
                    darkMode = !darkMode;
                    if (darkMode) body.classList.add('dark');
                    else body.classList.remove('dark');
                    renderScreen(); // re-render to reflect colors
                });
            }
            // extra animation on home chart (simulate update)
            if (currentScreen === 'home') {
                setTimeout(() => {
                    const bars = document.querySelectorAll('#chartAnim .bar');
                    if (bars.length) {
                        bars[0].style.height = '65px';
                        bars[1].style.height = '45px';
                        bars[2].style.height = '80px';
                    }
                }, 100);
            }
        }

        // ---------- screenshot (shift + w) ----------
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                if (!phone) return;
                import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
                    html2canvas(phone, { scale: 2, backgroundColor: null }).then(canvas => {
                        const link = document.createElement('a');
                        let filename = darkMode ? '6.png' : (screenshotCounter + '.png');
                        if (!darkMode && screenshotCounter <=5) {
                            // increment for next shot (only light mode count)
                            link.download = filename;
                            screenshotCounter = (screenshotCounter % 5) + 1;
                        } else if (darkMode) {
                            link.download = '6.png';
                        } else {
                            link.download = '1.png'; // fallback
                        }
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    });
                }).catch(() => alert('html2canvas failed, but screenshot feature works with library.'));
            }
        });

        // initial render
        renderScreen();

        // expose for later calls
        window.showModal = showModal;
    })();
</script>
</body>
</html>
