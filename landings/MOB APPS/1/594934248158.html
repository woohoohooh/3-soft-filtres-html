        body.dark {

            --bg-card: #1E293B;

            --accent: #38BDF8;

        }

        /* main app screen area (flex column) */
        .app {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {

            justify-content: space-between;

        }

            letter-spacing: -0.3px;
        }

            padding: 6px;
            border-radius: 12px;
            transition: background 0.15s;

        .profile-icon:hover {

        .profile-icon svg {

            stroke-linecap: round;
            stroke-linejoin: round;
        }

            align-items: center;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 6px 12px 4px;
            border-radius: 20px;
            background: transparent;
            border: none;
        }

        .nav-item.active {
            background: rgba(37, 99, 235, 0.08);
            transform: scale(1.02);
        }

        .nav-icon {
            width: 26px;
            height: 26px;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.15s, transform 0.2s;

        .nav-item.active .nav-icon {
            stroke: var(--primary);
            transform: scale(1.15);
        }

        .nav-item:not(.active) .nav-icon {
            stroke: var(--inactive);
        }

        .nav-label {
            font-size: 11px;
            font-weight: 500;
            transition: color 0.15s;
        }

        .nav-item.active .nav-label {
            color: var(--primary);
        }

        .nav-item:not(.active) .nav-label {
            color: var(--inactive);
        }

        /* buttons & cards */
        .btn-primary {
            background: var(--primary);
            color: white;

            width: 100%;

            transition: 0.1s;
        }
        .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }

        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 20px 0 8px;
            font-size: 13px;
            color: var(--inactive);
        }
        .link-row span { cursor: pointer; text-decoration: underline; }

        /* cards */
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 18px 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .row-space {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .badge {
            background: var(--badge-bg);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
        }

        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 20px;
            margin: 12px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 20px;
            transition: width 0.4s ease;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-item {
            background: var(--bg-primary);
            padding: 12px;
            border-radius: 20px;
            text-align: center;
        }

        .lesson-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .lesson-item:last-child { border: none; }

        /* modal */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-card {
            background: var(--bg-card);
            width: 280px;
            padding: 32px 24px;
            border-radius: 32px;
            text-align: center;
            color: var(--text-primary);
            box-shadow: 0 20px 30px black;
        }
        .modal-card button {
            margin-top: 20px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        /* icons reuse */
        .icon-svg { width: 24px; height: 24px; display: inline-block; }

        /* micro charts */
        .mini-chart {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 60px;
            margin: 12px 0;
        }
        .bar {
            width: 24px;
            background: var(--chart-color);
            border-radius: 12px 12px 4px 4px;
            transition: height 0.3s;
        }

        /* hidden helper */
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="phone" id="phoneContainer">

    <script>
        (function() {
            // ---------- APP STATE ----------
            const theme = { current: 'light' }; // light / dark
            let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
            let screenshotCounter = 1;

            // icon set (inline reused)
            const icons = { /* already inline, but we define helpers if needed */ };

            // DOM elements
            const headerTitle = document.getElementById('headerTitle');
            const screenDiv = document.getElementById('screenContainer');
            const navItems = document.querySelectorAll('.nav-item');
            const profileBtn = document.getElementById('profileBtn');
            const modalDiv = document.getElementById('modalContainer');
            const phone = document.getElementById('phoneContainer');

            // ---------- RENDER FUNCTION ----------
            function renderScreen(screen) {
                currentScreen = screen;
                let html = '';
                if (screen === 'onboarding') {
                    html = `
                        <div style="text-align: center; padding: 20px 0;">
                            <svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="${theme.current==='dark'?'#3B82F6':'#2563EB'}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                            <h2 style="font-size: 32px; margin: 12px 0 8px; color: var(--text-primary);">Python Play</h2>

                        </div>

                            <div class="lesson-item"><svg width="26" height="26" viewBox="0 0 24 24" stroke="var(--primary)" stroke-width="2" fill="none"><polygon points="12 2 2 7 2 21 12 16 22 21 22 7 12 2"/></svg><div><strong>Functions</strong><br><span style="font-size:13px;">new</span></div></div>
                            <button class="btn-primary" style="margin-top:12px;" id="practiceNow">Practice now</button>
                        </div>
                        <div class="card"><div class="row-space"><span>🏆 achievements</span><span>3/6</span></div><div style="display:flex; gap:10px;"><span class="badge">⚡ 5 days</span><span class="badge">🐍 10 exercises</span><span class="badge">🔥 streak</span></div></div>
                    `;
                } else if (screen === 'learn') {
                    html = `
                        <div class="card"><input type="text" placeholder="Search lessons..." style="width:100%; padding:14px; border-radius:60px; border:1px solid var(--border-light); background:var(--bg-primary); color:var(--text-primary);"></div>
                        <div class="card"><h3>Python basics</h3><div class="lesson-item"><span>📘 Variables</span><span class="badge">free</span></div><div class="lesson-item"><span>📘 Conditions</span><span class="badge">free</span></div><div class="lesson-item"><span>📘 Loops</span><span class="badge">locked</span></div></div>
                        <div class="card"><h3>Functions & modules</h3><div class="lesson-item"><span>📘 def</span><span class="badge">5 XP</span></div><div class="lesson-item"><span>📘 imports</span><span class="badge">5 XP</span></div></div>
                    `;
                } else if (screen === 'progress') {
                    html = `
                        <div class="card"><h3>Last 7 days</h3><div class="mini-chart"><div class="bar" style="height:40px;"></div><div class="bar" style="height:28px;"></div><div class="bar" style="height:50px;"></div><div class="bar" style="height:35px;"></div><div class="bar" style="height:60px;"></div><div class="bar" style="height:44px;"></div><div class="bar" style="height:20px;"></div></div></div>
                        <div class="stat-grid"><div class="stat-item"><span style="font-size:20px;">23</span><br>lessons</div><div class="stat-item"><span style="font-size:20px;">485</span><br>XP</div><div class="stat-item"><span style="font-size:20px;">7</span><br>streak</div><div class="stat-item"><span style="font-size:20px;">3</span><br>badges</div></div>
                        <div class="card"><div class="row-space"><span>Python strings</span><span>80%</span></div><div class="progress-bar"><div class="progress-fill" style="width:80%"></div></div><div class="row-space"><span>Lists</span><span>45%</span></div><div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div></div>
                    `;
                } else if (screen === 'settings') {
                    html = `
                        <div class="card"><h3>Appearance</h3><div style="display:flex; gap:16px; margin:16px 0;"><button id="lightModeBtn" style="flex:1; padding:12px; border-radius:40px; background:${theme.current==='light'? 'var(--primary)' : 'var(--bg-primary)'}; color:${theme.current==='light'?'white':'var(--text-primary)'};">Light</button><button id="darkModeBtn" style="flex:1; padding:12px; border-radius:40px; background:${theme.current==='dark'? 'var(--primary)' : 'var(--bg-primary)'}; color:${theme.current==='dark'?'white':'var(--text-primary)'};">Dark</button></div></div>
                        <div class="card"><h3>Profile</h3><div class="lesson-item"><span>Username</span><span style="color:var(--text-secondary)">pythonista</span></div><div class="lesson-item"><span>Email</span><span>py@example.com</span></div></div>
                        <div class="card"><h3>Reminders</h3><div class="lesson-item"><span>Daily notification</span><span>🔔 on</span></div></div>
                    `;
                }
                screenDiv.innerHTML = html;

                // update header title
                if (screen === 'onboarding') headerTitle.innerText = 'Welcome';
                else if (screen === 'home') headerTitle.innerText = 'Dashboard';
                else if (screen === 'learn') headerTitle.innerText = 'Lessons';
                else if (screen === 'progress') headerTitle.innerText = 'Statistics';
                else if (screen === 'settings') headerTitle.innerText = 'Profile';

                // activate correct bottom nav item
                navItems.forEach(item => {
                    const tab = item.dataset.tab;
                    if ((screen === 'onboarding' && tab==='home') || screen === tab) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                });

                // attach listeners after content
                attachScreenListeners(screen);
            }

            function attachScreenListeners(screen) {
                if (screen === 'onboarding') {
                    document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                        renderScreen('home');
                    });
                    document.getElementById('privacyLink')?.addEventListener('click', ()=>showModal('Privacy Policy','We value your data. No tracking.'));
                    document.getElementById('termsLink')?.addEventListener('click', ()=>showModal('Terms of Service','Use responsibly. Happy coding!'));
                }
                if (screen === 'home') {
                    document.getElementById('practiceNow')?.addEventListener('click', ()=>renderScreen('learn'));
                }
                if (screen === 'settings') {
                    document.getElementById('lightModeBtn')?.addEventListener('click', ()=>{
                        document.body.classList.remove('dark');
                        theme.current = 'light';
                        renderScreen('settings');
                    });
                    document.getElementById('darkModeBtn')?.addEventListener('click', ()=>{
                        document.body.classList.add('dark');
                        theme.current = 'dark';
                        renderScreen('settings');
                    });
                }
            }

            function showModal(title, text) {
                modalDiv.classList.remove('hidden');
                modalDiv.innerHTML = `<div class="modal-card"><h3>${title}</h3><p style="margin:16px 0;">${text}</p><button id="closeModalBtn">Close</button></div>`;
                document.getElementById('closeModalBtn').addEventListener('click', ()=>{
                    modalDiv.classList.add('hidden');
                });
            }

            // bottom navigation click
            navItems.forEach(item => {
                item.addEventListener('click', (e)=>{
                    const tab = item.dataset.tab;
                    if (tab === 'home') renderScreen('home');
                    if (tab === 'learn') renderScreen('learn');
                    if (tab === 'progress') renderScreen('progress');
                    if (tab === 'settings') renderScreen('settings');
                });
            });

            // profile icon => settings
            profileBtn.addEventListener('click', ()=>{
                renderScreen('settings');
            });

            // modal background close
            modalDiv.addEventListener('click', (e)=>{
                if (e.target === modalDiv) modalDiv.classList.add('hidden');
            });

            // screenshot SHIFT+W
            window.addEventListener('keydown', (e)=>{
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    // html2canvas not included – we simulate naming, but we can't actually capture.
                    // we increment counter and show fake log. (real screenshot needs library)
                    console.log('📸 screenshot trigger: ' + (theme.current==='dark'? '6.png' : screenshotCounter+'.png'));
                    if (theme.current === 'dark') {
                        // 6.png
                    } else {
                        if (screenshotCounter < 5) screenshotCounter++;
                    }
                    // For demo we just alert file name
                    alert(`screenshot: ${theme.current==='dark'?'6.png':screenshotCounter+'.png'} (simulated)`);
                }
            });

            // start with onboarding
            renderScreen('onboarding');

            // inject theme from start
            if (theme.current === 'dark') document.body.classList.add('dark');
        })();
    </script>
    <script>
        // JSON block exactly at end
        (function() { /* just to hold json */ })();
    </script>
