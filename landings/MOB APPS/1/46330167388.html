```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeLingua · mobile prototype</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* CSS variables – light mode default */
    :root {
      --bg-page: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --text-muted: #64748B;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --border-light: #E2E8F0;
      --icon-inactive: #94A3B8;
      --header-icon: #1E293B;
      --bottom-nav-bg: #FFFFFF;
      --shadow: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,0,0,0.05);
    }

    body.dark {
      --bg-page: #0F172A;
      --card-bg: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --border-light: #334155;
      --icon-inactive: #64748B;
      --header-icon: #E2E8F0;
      --bottom-nav-bg: #1E293B;
      --shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    body {
      background: #1a1e2b; /* outer background */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background: var(--bg-page);
      border-radius: 48px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.3), 0 0 0 10px #2c3e50;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: background 0.2s;
    }

    /* main app screen (content area) */
    .app-screen {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px 8px 18px;
      scrollbar-width: thin;
      scrollbar-color: var(--icon-inactive) transparent;
    }

    .app-screen::-webkit-scrollbar {
      width: 4px;
    }
    .app-screen::-webkit-scrollbar-thumb {
      background: var(--icon-inactive);
      border-radius: 20px;
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px 6px 18px;
      background: transparent;
    }
    .header h2 {
      font-size: 22px;
      font-weight: 620;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .profile-icon {
      cursor: pointer;
      padding: 6px;
      border-radius: 12px;
      transition: background 0.1s;
    }
    .profile-icon:hover { background: var(--border-light); }

    /* bottom navigation */
    .bottom-nav {
      background: var(--bottom-nav-bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 12px 12px;
      border-top: 1px solid var(--border-light);
      box-shadow: var(--shadow);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 8px 10px 6px;
      border-radius: 20px;
      transition: all 0.15s ease;
      background: transparent;
      border: none;
      width: 64px;
    }
    .nav-item.active {
      background: rgba(37, 99, 235, 0.1);
      transform: scale(1.02);
    }
    .nav-item.active .nav-icon {
      stroke: var(--primary);
      stroke-width: 2.4;
      width: 26px;
      height: 26px;
    }
    .nav-item.active .nav-label {
      color: var(--primary);
      font-weight: 520;
      font-size: 11px;
    }
    .nav-icon {
      stroke: var(--icon-inactive);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      width: 24px;
      height: 24px;
      transition: all 0.1s;
    }
    .nav-label {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      transition: color 0.1s;
    }

    /* cards & elements */
    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 18px 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-light);
    }
    .flex-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .badge {
      background: var(--accent);
      padding: 4px 12px;
      border-radius: 30px;
      color: #0F172A;
      font-weight: 600;
      font-size: 12px;
    }
    .progress-bar {
      height: 8px;
      background: var(--border-light);
      border-radius: 30px;
      margin: 12px 0;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 60%;
      background: var(--primary);
      border-radius: 30px;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }
    .stat-cell {
      background: var(--bg-page);
      border-radius: 16px;
      padding: 12px 8px;
      text-align: center;
    }
    .btn {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      padding: 14px 24px;
      border-radius: 40px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s;
    }
    .btn-small {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 30px;
      font-weight: 500;
      cursor: pointer;
    }
    .link-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin: 18px 0 8px;
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: underline;
      cursor: pointer;
    }
    /* modal */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: var(--card-bg);
      width: 280px;
      padding: 28px 20px;
      border-radius: 32px;
      text-align: center;
      color: var(--text-primary);
      box-shadow: 0 30px 50px black;
    }
    .hidden { display: none; }

    /* icons list hidden */
    .svg-defs { display: none; }

    /* lesson item */
    .lesson-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
    }
  </style>
</head>
<body>
  <!-- inline SVG definitions – custom outline icons -->
  <svg style="display:none;" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- home -->
      <symbol id="icon-home" viewBox="0 0 24 24"><path d="M5 12H3L12 3L21 12H19V20H13V14H11V20H5V12Z" stroke="current" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <!-- learn (book/open) -->
      <symbol id="icon-learn" viewBox="0 0 24 24"><path d="M2 3H8C9.1 3 10 3.9 10 5V19C10 17.9 9.1 17 8 17H2V3Z" stroke="current" stroke-width="2" fill="none"/><path d="M22 3H16C14.9 3 14 3.9 14 5V19C14 17.9 14.9 17 16 17H22V3Z" stroke="current" stroke-width="2" fill="none"/></symbol>
      <!-- progress (chart) -->
      <symbol id="icon-progress" viewBox="0 0 24 24"><path d="M21 20H3V4" stroke="current" stroke-width="2" fill="none"/><path d="M7 16L10 10L14 13L19 6" stroke="current" stroke-width="2" fill="none"/></symbol>
      <!-- settings (gear) -->
      <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="current" stroke-width="2" fill="none"/><path d="M19.4 15C18.9 16 18 16.6 17 16.9L19.5 20.6L15.5 19.4C14.7 19.7 13.8 19.9 12.8 19.9C11.8 19.9 10.9 19.7 10.1 19.4L6.1 20.6L8.6 16.9C7.6 16.6 6.7 15.9 6.2 15L2.5 15L5.2 11.9C5.1 11.3 5 10.7 5 10.1C5 9.5 5.1 8.9 5.2 8.3L2.5 5.2H6.2C6.7 4.2 7.6 3.4 8.6 3.1L6.1 -0.6L10.1 0.6C10.9 0.3 11.8 0.1 12.8 0.1C13.8 0.1 14.7 0.3 15.5 0.6L19.5 -0.6L17 3.1C18 3.4 18.9 4.1 19.4 5.1L23 5.2L20.3 8.3C20.4 8.9 20.5 9.5 20.5 10.1C20.5 10.7 20.4 11.3 20.3 11.9L23 15H19.4Z" stroke="current" stroke-width="2" fill="none"/></symbol>
      <!-- profile -->
      <symbol id="icon-profile" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" stroke="current" stroke-width="2" fill="none"/><path d="M5 20V18C5 14.7 7.7 12 11 12H13C16.3 12 19 14.7 19 18V20" stroke="current" stroke-width="2" fill="none"/></symbol>
      <!-- lesson (small book) -->
      <symbol id="icon-lesson" viewBox="0 0 24 24"><path d="M4 19.5C4 18.1 5.1 17 6.5 17H20" stroke="current" stroke-width="2" fill="none"/><path d="M6.5 2H20V20H6.5C5.1 20 4 18.9 4 17.5V4.5C4 3.1 5.1 2 6.5 2Z" stroke="current" stroke-width="2" fill="none"/></symbol>
      <!-- chart mini -->
      <symbol id="icon-chart" viewBox="0 0 24 24"><path d="M21 20H3V4" stroke="current" stroke-width="2" fill="none"/><path d="M7 16L10 12L14 15L19 8" stroke="current" stroke-width="2" fill="none"/></symbol>
      <!-- flashcards -->
      <symbol id="icon-flashcards" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" stroke="current" stroke-width="2" fill="none"/><path d="M9 8H15" stroke="current" stroke-width="2"/><path d="M9 12H13" stroke="current" stroke-width="2"/></symbol>
      <!-- play -->
      <symbol id="icon-play" viewBox="0 0 24 24"><path d="M5 3L19 12L5 21V3Z" stroke="current" stroke-width="2" fill="none"/></symbol>
      <!-- check -->
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="M5 13L10 18L20 6" stroke="current" stroke-width="2" fill="none"/></symbol>
    </defs>
  </svg>

  <div class="phone" id="phoneContainer">
    <!-- header (dynamic title + profile) -->
    <div class="header">
      <h2 id="screenTitle">Onboarding</h2>
      <div class="profile-icon" id="profileBtn">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--header-icon)" stroke-width="2">
          <circle cx="12" cy="8" r="4" stroke="current" fill="none"/>
          <path d="M5 20V18C5 14.7 7.7 12 11 12H13C16.3 12 19 14.7 19 18V20" stroke="current" fill="none"/>
        </svg>
      </div>
    </div>

    <!-- dynamic screen content -->
    <div class="app-screen" id="screenContent"></div>

    <!-- bottom navigation (4 items) -->
    <div class="bottom-nav" id="bottomNav">
      <div class="nav-item" data-screen="home">
        <svg class="nav-icon" viewBox="0 0 24 24"><use href="#icon-home"></use></svg>
        <span class="nav-label">Home</span>
      </div>
      <div class="nav-item" data-screen="learn">
        <svg class="nav-icon" viewBox="0 0 24 24"><use href="#icon-learn"></use></svg>
        <span class="nav-label">Learn</span>
      </div>
      <div class="nav-item" data-screen="progress">
        <svg class="nav-icon" viewBox="0 0 24 24"><use href="#icon-progress"></use></svg>
        <span class="nav-label">Progress</span>
      </div>
      <div class="nav-item" data-screen="settings">
        <svg class="nav-icon" viewBox="0 0 24 24"><use href="#icon-settings"></use></svg>
        <span class="nav-label">Settings</span>
      </div>
    </div>
  </div>

  <!-- modal container (privacy, terms) -->
  <div id="modalContainer" class="modal hidden"></div>

  <script>
    (function() {
      // ----- THEME & STATE -----
      const theme = { dark: false };
      const appState = { currentScreen: 'onboarding' };

      // ----- SCREENSHOT HELPER (shift+W) -----
      let screenshotCounter = 1;
      document.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.key === 'W') {
          e.preventDefault();
          const phone = document.getElementById('phoneContainer');
          // in real prototype we simulate: just show alert with filename
          const isDark = document.body.classList.contains('dark');
          let filename = isDark ? '6.png' : (screenshotCounter + '.png');
          if (!isDark && screenshotCounter <=5) {
            // sequential 1..5
          } else if (isDark) {
            filename = '6.png';
          } else {
            filename = '5.png'; // fallback
          }
          alert(`📸 Screenshot saved as ${filename} (simulated)`);
          if (!isDark && screenshotCounter < 5) screenshotCounter++;
        }
      });

      // ----- MODAL FUNCTION -----
      function showModal(text) {
        const modal = document.getElementById('modalContainer');
        modal.innerHTML = `
          <div class="modal-content">
            <p style="margin-bottom:24px;">${text}</p>
            <button class="btn-small" id="closeModalBtn">Close</button>
          </div>
        `;
        modal.classList.remove('hidden');
        document.getElementById('closeModalBtn').addEventListener('click', ()=>{
          modal.classList.add('hidden');
        });
      }

      // ----- ICON RENDERER -----
      function icon(shape, w=20, h=20, stroke='currentColor') {
        return `<svg width="${w}" height="${h}" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2"><use href="#icon-${shape}"></use></svg>`;
      }

      // ----- SCREEN RENDERERS -----
      function renderOnboarding() {
        document.getElementById('screenTitle').innerText = 'Codingora';
        return `
          <div class="card" style="text-align:center; margin-top:30px;">
            ${icon('flashcards', 60,60,'var(--primary)')}
            <h1 style="font-size:40px; font-weight:700; margin:8px 0 4px;">Codingora</h1>
            <p style="font-size:18px; color:var(--primary);">JavaScript · daily</p>
            <p style="margin:24px 0; color:var(--text-secondary);">Bite‑size JS challenges & flashcards. Build muscle memory for coding interviews.</p>
            <button class="btn" id="getStartedBtn">Get Started</button>
            <div class="link-row">
              <span id="privacyLink">Privacy Policy</span>
              <span id="termsLink">Terms of Service</span>
            </div>
          </div>
        `;
      }

      function renderHome() {
        document.getElementById('screenTitle').innerText = 'Home';
        return `
          <div class="card">
            <div class="flex-row"><span class="badge">streak 7 days 🔥</span><span>⭐ 340 XP</span></div>
            <h3 style="margin:12px 0 4px;">Continue where you left</h3>
            <div class="lesson-item">${icon('play',28,28,'var(--primary)')} <div><strong>Closures II</strong><p>3/5 tasks</p></div></div>
            <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
            <button class="btn-small" id="resumePractice">Resume</button>
          </div>
          <div class="card">
            <div class="flex-row"><span>⚡ Daily pick</span> ${icon('flashcards',22,22)}</div>
            <p><strong>this keyword</strong> — 5 flashcards</p>
            <button class="btn-small" id="dailyLesson">Start</button>
          </div>
          <div class="stat-grid">
            <div class="stat-cell">${icon('check',24,24,'#2563EB')}<p style="font-size:20px;">12</p><span>lessons</span></div>
            <div class="stat-cell">${icon('chart',24,24,'#2563EB')}<p style="font-size:20px;">88%</p><span>accuracy</span></div>
          </div>
        `;
      }

      function renderLearn() {
        document.getElementById('screenTitle').innerText = 'Practice';
        return `
          <div class="card"><h3>JS Fundamentals</h3>${icon('lesson',24,24)}<div class="lesson-item"><span>Variables</span> <span>🔥 4/6</span></div><div class="progress-bar"><div class="progress-fill" style="width:50%"></div></div></div>
          <div class="card"><h3>Scope & Closures</h3><div class="lesson-item"><span>Scope chain</span><span>2/4</span></div><div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div></div>
          <div class="card">${icon('flashcards',28,28)} <strong>Flashcard set: Promises</strong> <button class="btn-small" style="margin-top:8px;" id="startFlashcards">Practice</button></div>
        `;
      }

      function renderProgress() {
        document.getElementById('screenTitle').innerText = 'Statistics';
        return `
          <div class="card"><h3>This week</h3>${icon('chart',32,32,'var(--accent)')}<div class="stat-grid"><div class="stat-cell">Mon<br>🔥</div><div class="stat-cell">Wed<br>🔥🔥</div><div class="stat-cell">Fri<br>⭐</div><div class="stat-cell">Sun<br>🔥</div></div></div>
          <div class="card"><h3>Badges</h3><div style="display:flex; gap:16px;">${icon('flashcards',32,32)}${icon('play',32,32)}${icon('check',32,32)}</div><p>3 earned</p></div>
          <div class="card">Total XP: 2,450  <div class="progress-bar"><div class="progress-fill" style="width:74%"></div></div> to next level</div>
        `;
      }

      function renderSettings() {
        document.getElementById('screenTitle').innerText = 'Settings';
        const isDark = document.body.classList.contains('dark');
        return `
          <div class="card">
            <h3>Appearance</h3>
            <label style="display:flex; align-items:center; gap:12px; margin-top:16px;">
              <span>🌙 Dark mode</span>
              <input type="checkbox" id="darkToggle" ${isDark ? 'checked' : ''}>
            </label>
          </div>
          <div class="card">
            <h3>Profile</h3>
            <p>${icon('profile',28,28)} Maria Dev · Pro since 2026</p>
          </div>
          <div class="card">
            <p>Sound · Notifications · Language</p>
          </div>
          <div class="link-row" style="justify-content:space-around;">
            <span id="privacyLink2">Privacy</span><span id="termsLink2">Terms</span>
          </div>
        `;
      }

      // ----- NAVIGATION -----
      function loadScreen(screenId) {
        appState.currentScreen = screenId;
        const content = document.getElementById('screenContent');
        if (screenId === 'onboarding') content.innerHTML = renderOnboarding();
        else if (screenId === 'home') content.innerHTML = renderHome();
        else if (screenId === 'learn') content.innerHTML = renderLearn();
        else if (screenId === 'progress') content.innerHTML = renderProgress();
        else if (screenId === 'settings') content.innerHTML = renderSettings();

        // re-attach listeners
        attachScreenListeners(screenId);
        updateActiveNav(screenId);
      }

      function updateActiveNav(screen) {
        document.querySelectorAll('.nav-item').forEach(item => {
          const data = item.dataset.screen;
          if (data === screen) item.classList.add('active');
          else item.classList.remove('active');
        });
      }

      // ----- EVENT LISTENERS PER SCREEN -----
      function attachScreenListeners(screen) {
        if (screen === 'onboarding') {
          document.getElementById('getStartedBtn')?.addEventListener('click', ()=> loadScreen('home'));
          document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy: your data is safe.'));
          document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms: educational use only.'));
        }
        if (screen === 'home') {
          document.getElementById('resumePractice')?.addEventListener('click', ()=> { alert('→ practice resumed'); });
          document.getElementById('dailyLesson')?.addEventListener('click', ()=> loadScreen('learn'));
        }
        if (screen === 'learn') {
          document.getElementById('startFlashcards')?.addEventListener('click', ()=> alert('opening flashcards …'));
        }
        if (screen === 'settings') {
          const toggle = document.getElementById('darkToggle');
          if (toggle) {
            toggle.addEventListener('change', (e) => {
              if (e.target.checked) document.body.classList.add('dark');
              else document.body.classList.remove('dark');
            });
          }
          document.getElementById('privacyLink2')?.addEventListener('click', ()=> showModal('Privacy: data stays local.'));
          document.getElementById('termsLink2')?.addEventListener('click', ()=> showModal('Terms: for demo purpose.'));
        }
      }

      // ----- BOTTOM NAVIGATION -----
      document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', (e) => {
          const screen = item.dataset.screen;
          if (screen) loadScreen(screen);
        });
      });

      // ----- PROFILE BUTTON (opens settings) -----
      document.getElementById('profileBtn').addEventListener('click', ()=>{
        loadScreen('settings');
      });

      // ----- START WITH ONBOARDING -----
      loadScreen('onboarding');

      // remove any leftover modals on background click
      window.addEventListener('click', (e) => {
        const modal = document.getElementById('modalContainer');
        if (e.target === modal) modal.classList.add('hidden');
      });

    })();
  </script>

  <!-- JSON object output as requested (at bottom) -->
  <script>
    // print JSON after full load (just as object, but required as output in HTML)
    (function() {
      const titles = {
        "1.png": "Start Learning",
        "2.png": "Daily Lessons",
        "3.png": "Practice Skills",
        "4.png": "Track Progress",
        "5.png": "Smart Settings",
        "6.png": "Dark Theme"
      };
      console.log('PlayStore titles:', titles);
      // inject as visible text? spec says output at the end, we put inside <pre> for clarity
      document.currentScript.insertAdjacentHTML('afterend', `<pre style="display:none;" id="jsonTitles">${JSON.stringify(titles, null, 2)}</pre>`);
