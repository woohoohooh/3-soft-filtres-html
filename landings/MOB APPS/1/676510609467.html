```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabVault · English builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a202c;
            padding: 12px;
        }
        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg-primary);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0,0,0,0.5), 0 0 0 10px #2d3748;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s;
        }
        /* themes */
        :root {
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --header-bg: #FFFFFF;
            --bottom-bg: #FFFFFF;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
        }
        .dark-mode {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --header-bg: #1E293B;
            --bottom-bg: #1E293B;
            --shadow: 0 4px 12px rgba(0,0,0,0.3);
        }
        /* main flex column */
        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-light);
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .profile-icon {
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-icon svg {
            width: 26px;
            height: 26px;
            stroke: var(--primary);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        /* screen content */
        .screen-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 8px 16px;
            background: var(--bg-primary);
            scrollbar-width: thin;
        }
        /* bottom nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 8px 10px;
            background: var(--bottom-bg);
            border-top: 1px solid var(--border-light);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            cursor: pointer;
            padding: 6px 0 4px;
            border-radius: 20px;
            transition: all 0.15s ease;
            background: transparent;
            gap: 2px;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.15s;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            transition: all 0.15s;
        }
        /* active tab */
        .nav-item.active {
            background: rgba(37, 99, 235, 0.1);
        }
        .nav-item.active svg {
            stroke: #2563EB;
            transform: scale(1.15);
            stroke-width: 2.2;
        }
        .nav-item.active span {
            color: #2563EB;
            font-weight: 600;
        }
        .nav-item:not(.active) svg {
            stroke: var(--inactive);
        }
        .nav-item:not(.active) span {
            color: var(--inactive);
        }
        /* cards */
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }
        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
        }
        .progress-bar {
            height: 8px;
            background: var(--border-light);
            border-radius: 20px;
            overflow: hidden;
            margin: 12px 0;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 20px;
            transition: width 0.3s;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-item {
            background: var(--bg-primary);
            padding: 12px;
            border-radius: 18px;
        }
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .lesson-item:last-child { border-bottom: none; }
        /* modal overlay */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal.show {
            visibility: visible;
            opacity: 1;
        }
        .modal-content {
            background: var(--bg-card);
            width: 280px;
            padding: 24px;
            border-radius: 36px;
            color: var(--text-primary);
            text-align: center;
        }
        .modal-content button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            margin-top: 16px;
            cursor: pointer;
        }
        /* onboarding */
        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 30px 0 20px;
        }
        .app-logo svg {
            width: 70px;
            height: 70px;
            stroke: var(--primary);
            stroke-width: 2;
            fill: none;
        }
        .app-name {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            margin-top: 4px;
        }
        .tagline {
            font-size: 16px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .description {
            text-align: center;
            color: var(--text-secondary);
            margin: 16px 0;
            line-height: 1.4;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin: 16px 0 12px;
        }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            font-size: 14px;
        }
        .footer-links span {
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
        }
        /* hidden canvas for screenshot */
        #shot-canvas {
            display: none;
        }
    </style>
</head>
<body>
    <div class="phone" id="phoneContainer">
        <div class="app" id="app">
            <!-- header will be dynamically updated by js -->
            <div class="header" id="appHeader">
                <h1 id="headerTitle">Onboarding</h1>
                <div class="profile-icon" id="profileBtn">
                    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
            </div>

            <!-- main screen container -->
            <div class="screen-container" id="screenContainer"></div>

            <!-- bottom navigation (4 icons) -->
            <div class="bottom-nav" id="bottomNav">
                <div class="nav-item" data-screen="home">
                    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span>Home</span>
                </div>
                <div class="nav-item" data-screen="learn">
                    <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                    <span>Learn</span>
                </div>
                <div class="nav-item" data-screen="progress">
                    <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                    <span>Progress</span>
                </div>
                <div class="nav-item" data-screen="settings">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    <span>Settings</span>
                </div>
            </div>
        </div>

        <!-- modal privacy/terms -->
        <div class="modal" id="modal">
            <div class="modal-content" id="modalContent">
                <h3 id="modalTitle">Privacy Policy</h3>
                <p id="modalBody">Your data is stored locally. No tracking.</p>
                <button id="closeModal">Got it</button>
            </div>
        </div>
    </div>

    <!-- hidden canvas for screenshot -->
    <canvas id="shot-canvas" width="360" height="780"></canvas>

    <script>
        (function() {
            // ---------- Icon system ----------
            function iconProfile() { return '<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'; }
            function iconHome() { return '<svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>'; }
            function iconLearn() { return '<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>'; }
            function iconProgress() { return '<svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>'; }
            function iconSettings() { return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>'; }
            function iconLesson() { return '<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>'; }
            function iconChart() { return '<svg viewBox="0 0 24 24"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>'; }
            function iconFlash() { return '<svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>'; }
            function iconPlay() { return '<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>'; }
            function iconCheck() { return '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'; }

            // App state
            let currentScreen = 'onboarding'; // start with onboarding
            let darkMode = false;

            // Screens HTML
            function onboardingScreen() {
                return `
                    <div class="logo-area">
                        <div class="app-logo">${iconFlash()}</div>
                        <div class="app-name">VocabVault</div>
                        <div class="tagline">build your English</div>
                    </div>
                    <div class="description">
                        <strong>Master 3000+ words</strong> with daily 5‑min exercises. Interactive flashcards and quizzes.
                    </div>
                    <button class="btn-primary" id="getStartedBtn">Get Started</button>
                    <div class="footer-links">
                        <span id="privacyLink">Privacy Policy</span>
                        <span id="termsLink">Terms of Service</span>
                    </div>
                `;
            }

            function homeScreen() {
                return `
                    <div class="card">
                        <div class="flex-row"><span class="badge">🔥 streak 7</span><span>⭐ 120 xp</span></div>
                        <h3 style="color: var(--text-primary);">Continue lesson</h3>
                        <div class="lesson-item">
                            ${iconLesson()} <span style="flex:1;">Business English 3</span> <span>75%</span>
                        </div>
                        <div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div>
                        <button class="btn-primary" id="continuePractice" style="padding:12px;">keep learning</button>
                    </div>
                    <div class="card">
                        <div class="flex-row"><h4>daily pick</h4>${iconPlay()}</div>
                        <div style="display:flex; gap:10px; margin-top:10px;">
                            <span style="background:var(--accent); padding:6px 16px; border-radius:30px;">phrasal verbs</span>
                            <span style="background:var(--border-light); padding:6px 16px; border-radius:30px;">idioms</span>
                        </div>
                    </div>
                    <div class="card">
                        <h4>flashcards to review</h4>
                        <div style="display: flex; justify-content: space-around; margin: 16px 0;">
                            <span>🔄 12 due</span>
                            <span>✅ 34 mastered</span>
                        </div>
                        ${iconFlash()} <span style="margin-left:8px;">word deck: 46 left</span>
                    </div>
                `;
            }

            function learnScreen() {
                return `
                    <div class="card">
                        <h3>Vocabulary builder</h3>
                        <div class="lesson-item">${iconLesson()} A1: basics <span style="margin-left:auto;">🔓</span></div>
                        <div class="lesson-item">${iconLesson()} A2: everyday <span style="margin-left:auto;">75%</span></div>
                        <div class="lesson-item">${iconLesson()} B1: intermediate <span style="margin-left:auto;">🔒</span></div>
                        <div class="lesson-item">${iconLesson()} B2: advanced <span style="margin-left:auto;">🔒</span></div>
                    </div>
                    <div class="card">
                        <div class="flex-row"><span>quick practice</span> ${iconPlay()}</div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;">
                            <span style="background:var(--bg-primary); border-radius:30px; padding:10px;">synonyms</span>
                            <span style="background:var(--bg-primary); border-radius:30px; padding:10px;">antonyms</span>
                        </div>
                    </div>
                `;
            }

            function progressScreen() {
                return `
                    <div class="card">
                        <h3>weekly activity</h3>
                        <div style="height:80px; display:flex; align-items:flex-end; gap:6px; margin:10px 0;">
                            <div style="background:var(--primary); width:20%; height:40px; border-radius:12px;"></div>
                            <div style="background:var(--primary); width:20%; height:65px; border-radius:12px;"></div>
                            <div style="background:var(--accent); width:20%; height:30px; border-radius:12px;"></div>
                            <div style="background:var(--primary); width:20%; height:70px; border-radius:12px;"></div>
                            <div style="background:var(--inactive); width:20%; height:20px; border-radius:12px;"></div>
                        </div>
                        <div class="stat-grid">
                            <div class="stat-item"><strong>1340</strong> words</div>
                            <div class="stat-item"><strong>12</strong> days</div>
                            <div class="stat-item"><strong>78%</strong> mastery</div>
                            <div class="stat-item"><strong>4</strong> badges</div>
                        </div>
                    </div>
                    <div class="card">
                        ${iconChart()}  achievements
                        <div style="display:flex; gap:8px; margin-top:12px;">
                            <span style="background:var(--accent); padding:6px 12px; border-radius: 40px;">🔥 7 streak</span>
                            <span style="background:var(--border-light); padding:6px 12px;">⭐ novice</span>
                        </div>
                    </div>
                `;
            }

            function settingsScreen() {
                return `
                    <div class="card">
                        <div style="display:flex; align-items:center; gap:12px;">
                            ${iconProfile()} <span>My profile</span>
                        </div>
                        <div style="margin-top:20px; display:flex; justify-content:space-between;">
                            <span>Dark mode</span>
                            <label><input type="checkbox" id="darkModeToggle" ${darkMode ? 'checked' : ''}></label>
                        </div>
                        <div style="margin-top:16px;">Reminders: daily 9am</div>
                        <div style="margin-top:16px;">Sound effects</div>
                        <hr style="margin:20px 0; border-color:var(--border-light);">
                        <div>Privacy · Terms · v2.6.4</div>
                    </div>
                `;
            }

            // render current screen
            function renderScreen() {
                const container = document.getElementById('screenContainer');
                const headerTitle = document.getElementById('headerTitle');
                if (currentScreen === 'onboarding') {
                    container.innerHTML = onboardingScreen();
                    headerTitle.innerText = 'Welcome';
                } else if (currentScreen === 'home') {
                    container.innerHTML = homeScreen();
                    headerTitle.innerText = 'Home';
                } else if (currentScreen === 'learn') {
                    container.innerHTML = learnScreen();
                    headerTitle.innerText = 'Learn';
                } else if (currentScreen === 'progress') {
                    container.innerHTML = progressScreen();
                    headerTitle.innerText = 'Progress';
                } else if (currentScreen === 'settings') {
                    container.innerHTML = settingsScreen();
                    headerTitle.innerText = 'Settings';
                }

                // re-attach listeners after innerHTML
                attachScreenListeners();
                updateNavActive();
            }

            function attachScreenListeners() {
                // onboarding get started
                const getStarted = document.getElementById('getStartedBtn');
                if (getStarted) getStarted.addEventListener('click', ()=>{
                    currentScreen = 'home';
                    renderScreen();
                });

                // privacy / terms modals
                const privacy = document.getElementById('privacyLink');
                const terms = document.getElementById('termsLink');
                if (privacy) privacy.addEventListener('click', ()=> showModal('Privacy Policy', 'We respect your privacy. No data collection.'));
                if (terms) terms.addEventListener('click', ()=> showModal('Terms of Service', 'Use for learning only.'));
                
                // continue practice (home)
                const practiceBtn = document.getElementById('continuePractice');
                if (practiceBtn) practiceBtn.addEventListener('click', ()=>{
                    currentScreen = 'learn';
                    renderScreen();
                });

                // dark mode toggle inside settings
                const toggle = document.getElementById('darkModeToggle');
                if (toggle) {
                    toggle.checked = darkMode;
                    toggle.addEventListener('change', (e) => {
                        darkMode = e.target.checked;
                        document.documentElement.classList.toggle('dark-mode', darkMode);
                        renderScreen(); // refresh settings checkbox state
                    });
                }
            }

            function showModal(title, text) {
                document.getElementById('modalTitle').innerText = title;
                document.getElementById('modalBody').innerText = text;
                document.getElementById('modal').classList.add('show');
            }

            // bottom nav
            function updateNavActive() {
                document.querySelectorAll('.nav-item').forEach(item => {
                    const screen = item.dataset.screen;
                    if (screen === currentScreen) item.classList.add('active');
                    else item.classList.remove('active');
                });

            // navigation click
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (currentScreen === 'onboarding') return; // block until onboarded

                    if (target) {
                        currentScreen = target;
                        renderScreen();

                });

            // profile icon opens settings
            document.getElementById('profileBtn').addEventListener('click', ()=>{
                if (currentScreen === 'onboarding') return;
                currentScreen = 'settings';

            // close modal
            document.getElementById('closeModal').addEventListener('click', ()=>{
                document.getElementById('modal').classList.remove('show');

            // init onboarding
            renderScreen();

            // ---------- screenshot (SHIFT+W) ----------
            let shotCounter = 1;
            window.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    const phone = document.getElementById('phoneContainer');
                    const canvas = document.getElementById('shot-canvas');
                    const ctx = canvas.getContext('2d');
                    import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm').then(html2canvas => {
                        html2canvas.default(phone, { scale: 2, backgroundColor: null }).then(canvas2d => {
                            ctx.clearRect(0,0,360,780);
                            ctx.drawImage(canvas2d, 0, 0, 360, 780);
                            const link = document.createElement('a');
                            let filename = darkMode ? '6.png' : (shotCounter + '.png');
                            if (darkMode) filename = '6.png';
                            else {
                                filename = shotCounter + '.png';
                                shotCounter = shotCounter < 5 ? shotCounter + 1 : 1;
                            }
                            link.download = filename;
                            canvas.toBlob(blob => {
                                link.href = URL.createObjectURL(blob);
                                link.click();
                            });
                        });
                    }).catch(()=> alert('html2canvas failed'));
                }
            });

            // expose for dark mode init
            window.darkMode = darkMode;

        })();
