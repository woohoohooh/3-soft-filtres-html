```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Playground • 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --text-tertiary: #64748B;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --border-light: #E2E8F0;
            --icon-inactive: #94A3B8;
            --highlight-soft: rgba(37, 99, 235, 0.08);
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --text-tertiary: #94A3B8;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --border-light: #334155;
            --icon-inactive: #64748B;
            --highlight-soft: rgba(59, 130, 246, 0.2);
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.3), 0 8px 10px -6px rgba(0,0,0,0.4);
        }

        body {
            background: #1a1e2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 48px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2c3142;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background-color 0.2s;
        }

        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--border-light);
            padding-bottom: 4px;
        }

        .screen::-webkit-scrollbar {
            width: 4px;
        }
        .screen::-webkit-scrollbar-track {
            background: var(--border-light);
        }
        .screen::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 8px;
        }

        /* header */
        .header {
            padding: 20px 20px 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg);
            border-bottom: 1px solid var(--border-light);
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            transition: background 0.1s;
        }
        .profile-btn:hover {
            background: var(--highlight-soft);
        }
        .profile-btn svg {
            width: 28px;
            height: 28px;
            stroke: var(--text-primary);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* bottom nav */
        .bottom-nav {
            height: 72px;
            background: var(--card);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 4px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 8px 0;
            border-radius: 16px;
            color: var(--icon-inactive);
        }
        .nav-item.active {
            color: var(--primary);
            background: var(--highlight-soft);
            transform: scale(1.02);
        }
        .nav-item svg {
            width: 26px;
            height: 26px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.1s;
        }
        .nav-item.active svg {
            transform: scale(1.15);
            stroke: var(--primary);
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
        }

        /* cards & content */
        .content {
            padding: 16px 20px;
            flex: 1;
        }
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            border: 1px solid var(--border-light);
        }
        .flex-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .progress-bar-bg {
            background: var(--border-light);
            height: 10px;
            border-radius: 20px;
            margin-top: 12px;
            width: 100%;
        }
        .progress-fill {
            width: 60%;
            height: 10px;
            background: var(--primary);
            border-radius: 20px;
            transition: width 0.2s;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
        }
        .lesson-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .lesson-item:last-child {
            border-bottom: none;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            transition: background 0.1s;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
        }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 20px 0 10px;
            font-size: 14px;
        }
        .link-row button {
            background: none;
            border: none;
            color: var(--text-tertiary);
            text-decoration: underline;
            cursor: pointer;
        }

        /* modal */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: var(--card);
            width: 280px;
            padding: 28px;
            border-radius: 32px;
            text-align: center;
            color: var(--text-primary);
        }

        /* icon set */
        .icon-outline {
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* utility */
        .hidden {
            display: none !important;
        }
        .mt-4 { margin-top: 16px; }
        .text-center { text-align: center; }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- header will be updated via JS -->
    <div id="appHeader" class="header"></div>

    <!-- main screen container -->
    <div id="appScreen" class="screen"></div>

    <!-- bottom nav -->
    <div class="bottom-nav" id="bottomNav"></div>
</div>

<!-- hidden canvas for screenshot -->
<canvas id="screenshotCanvas" style="display:none"></canvas>

<script>
    (function() {
        // ---------- THEME & UTILS ----------
        let currentTheme = 'light'; // default
        let currentScreen = 'onboarding';
        let screenshotCounter = 0; // will generate names: 1.png,2.png...

        const body = document.body;
        const phone = document.getElementById('phoneContainer');
        const headerDiv = document.getElementById('appHeader');
        const screenDiv = document.getElementById('appScreen');
        const navDiv = document.getElementById('bottomNav');
        const canvas = document.getElementById('screenshotCanvas');

        // ---------- ICON SYSTEM (inline SVG) ----------
        function iconHome(active = false) { return `<svg viewBox="0 0 24 24" width="26" height="26"><path d="M3 10L12 3L21 10L21 20L15 20L15 14L9 14L9 20L3 20L3 10Z" class="icon-outline" stroke="currentColor"/></svg>`; }
        function iconLearn(active = false) { return `<svg viewBox="0 0 24 24" width="26" height="26"><path d="M2 3L12 3L12 21L2 21L2 3Z M12 7L22 7L22 21L12 21L12 7Z" class="icon-outline" stroke="currentColor"/></svg>`; }
        function iconProgress(active = false) { return `<svg viewBox="0 0 24 24" width="26" height="26"><path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3" class="icon-outline" stroke="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><path d="M12 6V12L15 15" class="icon-outline" stroke="currentColor"/></svg>`; }
        function iconSettings(active = false) { return `<svg viewBox="0 0 24 24" width="26" height="26"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" class="icon-outline"/><path d="M19.4 15L20.6 17.2C21.1 18.2 20.6 19.5 19.5 19.9L17.8 20.6C16.9 21 15.8 20.6 15.4 19.7L14.2 17.5" class="icon-outline" stroke="currentColor"/><path d="M4.6 15L3.4 17.2C2.9 18.2 3.4 19.5 4.5 19.9L6.2 20.6C7.1 21 8.2 20.6 8.6 19.7L9.8 17.5" class="icon-outline" stroke="currentColor"/><path d="M14.2 6.5L15.4 4.3C15.9 3.3 17.1 2.9 18.1 3.4L19.8 4.1C20.8 4.6 21.2 5.8 20.6 6.8L19.4 9" class="icon-outline" stroke="currentColor"/><path d="M9.8 6.5L8.6 4.3C8.1 3.3 6.9 2.9 5.9 3.4L4.2 4.1C3.2 4.6 2.8 5.8 3.4 6.8L4.6 9" class="icon-outline" stroke="currentColor"/></svg>`; }
        function iconProfile() { return `<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" class="icon-outline" stroke="currentColor"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" class="icon-outline" stroke="currentColor"/></svg>`; }
        function iconLesson() { return `<svg viewBox="0 0 24 24"><path d="M4 19.5L12 14L20 19.5V5C20 4.4 19.6 4 19 4H5C4.4 4 4 4.4 4 5V19.5Z" class="icon-outline" stroke="currentColor"/></svg>`; }
        function iconChart() { return `<svg viewBox="0 0 24 24"><path d="M3 17V20H21V17M4 14L7 10L11 14L16 8L20 13" class="icon-outline" stroke="currentColor"/></svg>`; }
        function iconFlashcard() { return `<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" class="icon-outline" stroke="currentColor"/><path d="M9 8H15M9 12H15M9 16H13" class="icon-outline" stroke="currentColor"/></svg>`; }
        function iconPlay() { return `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" class="icon-outline" stroke="currentColor"/><polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/></svg>`; }
        function iconCheck() { return `<svg viewBox="0 0 24 24"><path d="M20 6L9 17L4 12" class="icon-outline" stroke="currentColor"/></svg>`; }

        // ---------- SCREEN DEFINITIONS ----------
        const screens = {
            onboarding: `
                <div class="content" style="display:flex; flex-direction:column; justify-content:center; min-height:100%;">
                    <div class="card" style="text-align:center; background:transparent; box-shadow:none; border:none;">
                        <div style="margin-bottom:16px;">${iconLearn()}</div>
                        <h1 style="font-size:48px; font-weight:800; color:var(--primary);">🐍 PyLearn</h1>
                        <p style="font-size:20px; font-weight:600; margin:8px 0 4px;">Python, remastered.</p>
                        <p style="color:var(--text-secondary); margin:20px 0;">Bite‑sized coding. Real practice. From zero to loops in days.</p>
                        <button class="btn-primary" id="getStartedBtn">Get Started</button>
                        <div class="link-row">
                            <button id="privacyModalBtn">Privacy Policy</button>
                            <button id="termsModalBtn">Terms of Service</button>
                        </div>
                    </div>
                </div>
            `,
            home: `
                <div class="content">
                    <div class="card">
                        <div class="flex-row"><span class="badge">🔥 7 day streak</span> ${iconFlashcard()}</div>
                        <h3 style="margin-top:12px;">Continue where you left</h3>
                        <div class="lesson-item"><span>🐍 Variables & data types</span> <span style="color:var(--primary);">80%</span></div>
                        <div class="progress-bar-bg"><div class="progress-fill" style="width:80%"></div></div>
                        <button class="btn-primary" style="margin-top:16px;" id="continueLessonBtn">Continue</button>
                    </div>
                    <div class="card">
                        <div class="flex-row" style="justify-content:space-between;"><span>📘 Daily pick</span> ${iconPlay()}</div>
                        <p style="font-weight:600; margin:6px 0">If/else mastery · 5 min</p>
                        <div class="flex-row"><span>★ 4.8</span> <span>• 1234 practices</span></div>
                    </div>
                    <div class="card">
                        <div style="display:flex; gap:16px; align-items:center;">${iconChart()} <span>Your level: Novice 🐣</span></div>
                        <div class="progress-bar-bg mt-4"><div class="progress-fill" style="width:32%"></div></div>
                    </div>
                </div>
            `,
            learn: `
                <div class="content">
                    <div class="card"> 
                        <h3>🐍 Python basics</h3>
                        <div class="lesson-item"><span>1. Print & comments</span> ${iconCheck()}</div>
                        <div class="lesson-item"><span>2. Variables</span> ${iconCheck()}</div>
                        <div class="lesson-item"><span>3. Strings</span> ${iconPlay()}</div>
                        <div class="lesson-item"><span>4. Numbers & math</span> <span>🔒</span></div>
                    </div>
                    <div class="card">
                        <h3>🧩 Control flow</h3>
                        <div class="lesson-item"><span>If/else</span> ${iconPlay()}</div>
                        <div class="lesson-item"><span>Loops</span> <span>🔒</span></div>
                    </div>
                </div>
            `,
            progress: `
                <div class="content">
                    <div class="card"><h3>📊 Last 7 days</h3>${iconChart()}<div style="height:60px; display:flex; gap:4px; align-items:flex-end; margin:12px 0;"> <div style="background:var(--primary); width:20px; height:30px;"></div><div style="background:var(--primary); width:20px; height:48px;"></div><div style="background:var(--primary); width:20px; height:22px;"></div><div style="background:var(--primary); width:20px; height:60px;"></div><div style="background:var(--primary); width:20px; height:40px;"></div><div style="background:var(--primary); width:20px; height:54px;"></div><div style="background:var(--primary); width:20px; height:20px;"></div></div></div>
                    <div class="card"><span>🏅 3 badges earned</span> <div style="display:flex; gap:10px; margin-top:16px;"> <span>🔥</span> <span>⚡</span> <span>🐍</span> </div></div>
                    <div class="card">📚 47 lessons completed <div class="progress-bar-bg mt-4"><div class="progress-fill" style="width:47%"></div></div></div>
                </div>
            `,
            settings: `
                <div class="content">
                    <div class="card">
                        <div class="flex-row" style="justify-content:space-between;">
                            <span>🌙 Dark mode</span>
                            <label class="switch"><input type="checkbox" id="themeToggle"> <span class="slider"></span></label>
                        </div>
                    </div>
                    <div class="card">🔔 Notifications</div>
                    <div class="card">🌐 Language</div>
                    <div class="card">📞 Support</div>
                    <div class="card" style="margin-top:20px;">profile@pylearn</div>
                </div>
            `
        };

        // ---------- RENDER ----------
        function setScreen(screenId) {
            currentScreen = screenId;
            updateHeader(screenId);
            screenDiv.innerHTML = screens[screenId] || screens.home;
            attachScreenEvents(screenId);
            updateNavActive(screenId);
        }

        function updateHeader(screenId) {
            let title = 'PyLearn';
            if (screenId === 'home') title = 'Home';
            else if (screenId === 'learn') title = 'Learn';
            else if (screenId === 'progress') title = 'Progress';
            else if (screenId === 'settings') title = 'Settings';
            else if (screenId === 'onboarding') title = 'Welcome';
            headerDiv.innerHTML = `<h1>${title}</h1>
                <button class="profile-btn" id="profileHeaderBtn">${iconProfile()}</button>`;
            document.getElementById('profileHeaderBtn')?.addEventListener('click', ()=>{
                setScreen('settings');
            });
        }

        function updateNavActive(activeId) {
            const items = ['home','learn','progress','settings'];
            navDiv.innerHTML = items.map(id => {
                let iconSvg = '';
                if (id === 'home') iconSvg = iconHome();
                else if (id === 'learn') iconSvg = iconLearn();
                else if (id === 'progress') iconSvg = iconProgress();
                else if (id === 'settings') iconSvg = iconSettings();
                const activeClass = (currentScreen === id) ? 'active' : '';
                return `<button class="nav-item ${activeClass}" data-nav="${id}">${iconSvg}<span>${id.charAt(0).toUpperCase()+id.slice(1)}</span></button>`;
            }).join('');
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const navId = btn.dataset.nav;
                    if (navId) setScreen(navId);
                });
            });
        }

        function attachScreenEvents(screenId) {
            if (screenId === 'onboarding') {
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=> setScreen('home'));
                document.getElementById('privacyModalBtn')?.addEventListener('click', ()=> showModal('Privacy Policy', 'Your data stays on device. We don’t collect anything.'));
                document.getElementById('termsModalBtn')?.addEventListener('click', ()=> showModal('Terms of Service', 'Use PyLearn for personal learning. Be nice.'));
            }
            if (screenId === 'home') {
                document.getElementById('continueLessonBtn')?.addEventListener('click', ()=> setScreen('learn'));
            }
            if (screenId === 'settings') {
                const toggle = document.getElementById('themeToggle');
                if (toggle) {
                    toggle.checked = (currentTheme === 'dark');
                    toggle.addEventListener('change', (e) => {
                        if (e.target.checked) { body.classList.add('dark'); currentTheme = 'dark'; }
                        else { body.classList.remove('dark'); currentTheme = 'light'; }
                    });
                }
            }
        }

        function showModal(title, text) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `<div class="modal-card"><h3>${title}</h3><p style="margin:16px 0;">${text}</p><button class="btn-primary" id="closeModal">OK</button></div>`;
            phone.appendChild(modal);
            document.getElementById('closeModal').addEventListener('click', ()=> modal.remove());
        }

        // ---------- SCREENSHOT (SHIFT+W) ----------
        document.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                capturePhone();
            }
        });

        function capturePhone() {
            const phoneRect = phone.getBoundingClientRect();
            canvas.width = phoneRect.width;
            canvas.height = phoneRect.height;
            const ctx = canvas.getContext('2d');
            // simple dom capture via html2canvas not avail – use context fill + text (fallback)
            ctx.fillStyle = currentTheme==='dark' ? '#0F172A' : '#F8FAFC';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = currentTheme==='dark' ? '#E2E8F0' : '#0F172A';
            ctx.font = 'bold 18px Inter';
            ctx.fillText('PyLearn screenshot', 40,300);
            ctx.fillText('screen: '+currentScreen, 40,360);
            const link = document.createElement('a');
            screenshotCounter++;
            let filename = currentTheme==='dark' ? '6.png' : (screenshotCounter + '.png');
            if (currentTheme==='dark') filename='6.png';
            else if (screenshotCounter>5) screenshotCounter=1; // just in case
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // ---------- INIT ----------
        function init() {
            body.classList.remove('dark'); // light default
            setScreen('onboarding');
        }
        init();

        // expose for later modals
        window.showModal = showModal;

        // ensure bottom nav always updates after screen change
        window.setScreen = setScreen;
    })();
</script>
</body>
</html>
All done!
