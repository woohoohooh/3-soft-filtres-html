```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Brain Trainer · 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --grey: #94A3B8;
            --border: #E2E8F0;
            --icon-inactive: #94A3B8;
            --header-icon: #1E293B;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --grey: #475569;
            --border: #334155;
            --icon-inactive: #64748B;
            --header-icon: #E2E8F0;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        body {
            background: #1e1e2f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            position: relative;
            border: 2px solid rgba(255,255,255,0.1);
            transition: background-color 0.2s;
        }

        .screen-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 16px 12px 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--grey) transparent;
            background: var(--bg);
        }
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: var(--grey);
            border-radius: 20px;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 4px;
        }
        .header h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.5px;
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: var(--header-icon);
        }

        /* bottom nav */
        .bottom-nav {
            height: 70px;
            background: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 8px;
            box-shadow: var(--shadow);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: transparent;
            border: none;
            padding: 6px 10px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.15s ease;
            flex: 1;
            color: var(--icon-inactive);
        }
        .nav-item.active {
            color: var(--primary);
            background: rgba(37, 99, 235, 0.08);
            transform: scale(1.02);
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
        }
        .icon-svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-item.active .icon-svg {
            stroke: var(--primary);
            width: 26px;
            height: 26px;
        }

        /* cards */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 12px;
        }

        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 20px;
            border-radius: 60px;
            width: 100%;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--primary-dark);
            transition: 0.07s linear;
            margin: 12px 0;
        }
        .btn-primary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--primary-dark);
        }

        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 16px 0 8px;
        }
        .link-row button {
            background: none;
            border: none;
            color: var(--grey);
            font-size: 13px;
            text-decoration: underline;
            cursor: pointer;
        }

        .progress-bar-bg {
            background: var(--border);
            height: 8px;
            border-radius: 100px;
            overflow: hidden;
            width: 100%;
        }
        .progress-fill {
            background: var(--primary);
            height: 100%;
            width: 0%;
            border-radius: 100px;
            transition: width 0.4s ease;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }
        .stat-item {
            background: var(--bg);
            border-radius: 18px;
            padding: 14px;
            text-align: center;
        }

        .badge-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .badge-icon {
            background: var(--primary);
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* modal */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card);
            padding: 30px 24px;
            border-radius: 40px;
            width: 280px;
            text-align: center;
            color: var(--text);
            border: 2px solid var(--primary);
        }
        .modal-content button {
            margin-top: 20px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        .chart-mini {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 70px;
            margin: 12px 0;
        }
        .bar {
            width: 22px;
            background: var(--primary);
            border-radius: 8px 8px 4px 4px;
            transition: height 0.3s;
        }
        .bar:nth-child(2) { background: var(--accent); height: 40px; }
        .bar:nth-child(1) { height: 58px; }
        .bar:nth-child(3) { height: 28px; }
        .bar:nth-child(4) { height: 48px; }
        .bar:nth-child(5) { height: 62px; }

        /* hidden helper */
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic screens -->
    <div class="screen-container" id="screenRoot"></div>
    <!-- bottom nav (static) -->
    <div class="bottom-nav" id="bottomNav">
        <button class="nav-item" data-nav="home"><span class="icon-svg" id="icon-home"></span><span>Home</span></button>
        <button class="nav-item" data-nav="learn"><span class="icon-svg" id="icon-learn"></span><span>Learn</span></button>
        <button class="nav-item" data-nav="progress"><span class="icon-svg" id="icon-progress"></span><span>Progress</span></button>
        <button class="nav-item" data-nav="settings"><span class="icon-svg" id="icon-settings"></span><span>Settings</span></button>
    </div>
</div>

<!-- modal container -->
<div id="modalContainer" class="modal hidden"></div>

<script>
    (function() {
        // ----- THEME & STATE -----
        let currentScreen = 'onboarding'; // home/learn/progress/settings + onboarding
        let darkMode = false;
        const themeToggleBtn = () => { darkMode = !darkMode; document.body.classList.toggle('dark', darkMode); renderCurrentScreen(); };

        // ----- SVG ICONS (2px stroke, rounded) -----
        const icons = {
            home: `<svg viewBox="0 0 24 24" class="icon-svg"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" stroke="currentColor" fill="none"/></svg>`,
            learn: `<svg viewBox="0 0 24 24" class="icon-svg"><path d="M4 19.5L12 15L20 19.5M12 4V15M4 8L12 4L20 8V18L12 22L4 18V8Z" stroke="currentColor" fill="none"/></svg>`,
            progress: `<svg viewBox="0 0 24 24" class="icon-svg"><path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3M21 12C21 7.02944 16.9706 3 12 3M21 12H17M12 3V7M12 12L9 9M12 21V17" stroke="currentColor"/></svg>`,
            settings: `<svg viewBox="0 0 24 24" class="icon-svg"><circle cx="12" cy="12" r="2.5" stroke="currentColor" fill="none"/><path d="M19.4 15C18.9 16 18 16.6 17 16.9L16 15.5M4.6 9C5.1 8 6 7.4 7 7.1L8 8.5M7 16.9C6 16.6 5.1 16 4.6 15L5.6 13.5M17 7.1C18 7.4 18.9 8 19.4 9L18.4 10.5M12 4.5V7M12 20.5V17M4.5 12H7M20.5 12H17" stroke="currentColor"/></svg>`,
            profile: `<svg viewBox="0 0 24 24" class="icon-svg"><path d="M4 20C4 17 8 15 12 15C16 15 20 17 20 20M12 12C14.2091 12 16 10.2091 16 8C16 5.79086 14.2091 4 12 4C9.79086 4 8 5.79086 8 8C8 10.2091 9.79086 12 12 12Z" stroke="currentColor" fill="none"/></svg>`,
            lesson: `<svg viewBox="0 0 24 24" class="icon-svg"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" fill="none"/><path d="M8 8H16M8 12H14" stroke="currentColor"/></svg>`,
            chart: `<svg viewBox="0 0 24 24" class="icon-svg"><path d="M3 17L8 12L12 16L18 10L21 13" stroke="currentColor"/><path d="M3 20H21M3 4V20" stroke="currentColor"/></svg>`,
            flashcards: `<svg viewBox="0 0 24 24" class="icon-svg"><path d="M4 6H20V18H4V6Z" stroke="currentColor" fill="none"/><path d="M8 4V8M16 4V8" stroke="currentColor"/></svg>`,
            play: `<svg viewBox="0 0 24 24" class="icon-svg"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/></svg>`,
            check: `<svg viewBox="0 0 24 24" class="icon-svg"><path d="M20 6L9 17L4 12" stroke="currentColor"/></svg>`,
        };

        // embed icons into nav buttons
        document.getElementById('icon-home').outerHTML = icons.home;
        document.getElementById('icon-learn').outerHTML = icons.learn;
        document.getElementById('icon-progress').outerHTML = icons.progress;
        document.getElementById('icon-settings').outerHTML = icons.settings;

        // helpers
        function esc(str) { return str.replace(/[&<>"]/g, function(m) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]; }); }

        // modal
        function showModal(title, body) {
            const m = document.getElementById('modalContainer');
            m.innerHTML = `<div class="modal-content"><h3>${esc(title)}</h3><p style="margin:16px 0">${esc(body)}</p><button id="closeModalBtn">Close</button></div>`;
            m.classList.remove('hidden');
            document.getElementById('closeModalBtn').onclick = ()=> m.classList.add('hidden');
        }

        // ----- SCREEN RENDERERS -----
        const screenRenderers = {
            onboarding: () => {
                return `
                    <div class="header"><h2>🧠 Math Brain</h2><button class="profile-btn" id="profileIcon">${icons.profile}</button></div>
                    <div class="card" style="text-align:center;padding:32px 20px;">
                        <div style="font-size:64px;margin-bottom:8px;">🧮</div>
                        <h1 style="font-size:32px;color:var(--primary);">Math Trainer</h1>
                        <p style="font-size:18px;margin:8px 0 4px;">train your brain daily</p>
                        <p style="color:var(--text-light);margin:20px 0 10px;">Quick mental math & logic puzzles. 5-min workouts.</p>
                        <button class="btn-primary" id="getStartedBtn">Get Started</button>
                        <div class="link-row">
                            <button id="privacyLink">Privacy Policy</button>
                            <button id="termsLink">Terms of Service</button>
                        </div>
                    </div>
                `;
            },
            home: () => {
                return `
                    <div class="header"><h2>🏠 Home</h2><button class="profile-btn" id="profileIcon">${icons.profile}</button></div>
                    <div class="card">
                        <div class="row"><span class="badge">STREAK 12</span><span>🔥 340 XP</span></div>
                        <h3 style="margin:12px 0 6px;">Today’s brain warm-up</h3>
                        <div class="progress-bar-bg"><div class="progress-fill" style="width:60%"></div></div>
                        <p style="margin:8px 0 0;">3/5 lessons</p>
                    </div>
                    <div class="card">
                        <div class="row">${icons.flashcards}<span style="font-weight:600;">Quick flash cards</span></div>
                        <p>Mental math · 2 min</p>
                        <button class="btn-primary" style="padding:10px;font-size:16px;" id="startPracticeBtn">▶️ Practice now</button>
                    </div>
                    <div class="card">
                        <div class="row">${icons.chart}<span style="font-weight:600;">Weekly activity</span></div>
                        <div class="chart-mini"><div class="bar" style="height:42px;"></div><div class="bar" style="height:28px;"></div><div class="bar" style="height:56px;"></div><div class="bar" style="height:32px;"></div><div class="bar" style="height:48px;"></div></div>
                    </div>
                `;
            },
            learn: () => {
                return `
                    <div class="header"><h2>📘 Learn</h2><button class="profile-btn" id="profileIcon">${icons.profile}</button></div>
                    <div class="card row" style="justify-content:space-between;"><span>Arithmetic</span><span>🔥 80%</span></div>
                    <div class="card row" style="justify-content:space-between;"><span>Algebra</span><span>🔥 45%</span></div>
                    <div class="card row" style="justify-content:space-between;"><span>Geometry</span><span>🔥 30%</span></div>
                    <div class="card">${icons.lesson} Multiplication table · 3min left <button class="btn-primary" style="margin-top:12px;padding:8px;" id="startPracticeBtn2">▶️ Continue</button></div>
                `;
            },
            progress: () => {
                return `
                    <div class="header"><h2>📊 Progress</h2><button class="profile-btn" id="profileIcon">${icons.profile}</button></div>
                    <div class="card"><h3>Accuracy</h3><div class="progress-bar-bg"><div class="progress-fill" style="width:78%"></div></div><p>78% last 30d</p></div>
                    <div class="stat-grid">
                        <div class="stat-item"><span>📐</span><br><strong>3400</strong><br>points</div>
                        <div class="stat-item"><span>🏆</span><br><strong>14</strong><br>badges</div>
                    </div>
                    <div class="card"><h4>Recent achievements</h4><div class="badge-container"><span class="badge-icon">⚡</span><span class="badge-icon">🧠</span><span class="badge-icon">🔥</span></div></div>
                `;
            },
            settings: () => {
                return `
                    <div class="header"><h2>⚙️ Settings</h2><button class="profile-btn" id="profileIcon">${icons.profile}</button></div>
                    <div class="card">
                        <div class="row" style="justify-content:space-between"><span>Dark mode</span><button id="themeToggleBtn" style="background:var(--primary);color:white;border:none;padding:8px 18px;border-radius:40px;">${darkMode?'LIGHT':'DARK'}</button></div>
                    </div>
                    <div class="card">Profile info (demo)</div>
                    <div class="card">Sound · Notifications</div>
                `;
            }
        };

        function renderScreen(screenId) {
            const container = document.getElementById('screenRoot');
            if (!screenRenderers[screenId]) screenId = 'home';
            container.innerHTML = screenRenderers[screenId]();

            // after render attach listeners
            if (screenId === 'onboarding') {
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{ currentScreen='home'; renderScreen('home'); updateNavActive('home'); });
                document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy Policy', 'We respect your data. (demo)'));
                document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms of Service', 'Educational use only.'));
            }

            // profile icon anywhere
            document.getElementById('profileIcon')?.addEventListener('click', ()=>{ currentScreen='settings'; renderScreen('settings'); updateNavActive('settings'); });

            // nav active update + bottom nav click listeners
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.onclick = (e) => {
                    const navTo = btn.dataset.nav;
                    if (navTo === 'home' || navTo === 'learn' || navTo === 'progress' || navTo === 'settings') {
                        currentScreen = navTo;
                        renderScreen(navTo);
                        updateNavActive(navTo);
                    }
                };
            });

            // practice buttons
            document.getElementById('startPracticeBtn')?.addEventListener('click', ()=>{ alert('Starting mental math practice!'); });
            document.getElementById('startPracticeBtn2')?.addEventListener('click', ()=>{ alert('Resume multiplication lesson'); });

            // theme toggle inside settings
            document.getElementById('themeToggleBtn')?.addEventListener('click', (e) => {
                themeToggleBtn();
                e.target.innerText = darkMode ? 'LIGHT' : 'DARK';
            });
        }

        function updateNavActive(active) {
            document.querySelectorAll('.nav-item').forEach(item => {
                const nav = item.dataset.nav;
                if (nav === active) item.classList.add('active');
                else item.classList.remove('active');
            });
        }

        // initial
        renderScreen('onboarding');
        updateNavActive('none'); 

        // screenshot feature shift+W
        let screenshotCounter = 1;
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.code === 'KeyW') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                html2canvas(phone, { scale: 2 }).then(canvas => {
                    const link = document.createElement('a');
                    let filename = darkMode ? '6.png' : (screenshotCounter + '.png');
                    if (darkMode) filename = '6.png';
                    else if (screenshotCounter <=5) { filename = screenshotCounter + '.png'; screenshotCounter++; }
                    else filename = '1.png';
                    link.download = filename;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }).catch(()=> alert('html2canvas not loaded – use fallback'));
            }
        });

        // add dummy html2canvas via CDN (screenshot fallback)
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        document.head.appendChild(script);
    })();
</script>

<!-- fallback for screenshot if library missing (mock) but will work -->
</body>
</html>
All done!
