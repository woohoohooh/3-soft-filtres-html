```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeLingua · prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.05);
            --header-height: 60px;
            --bottom-nav-height: 72px;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        body {
            background: #1a1f2b; /* outer bezel */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s;
        }

        /* phone container */
        #phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6), 0 0 0 6px #2c3e50;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s;
        }

        /* main app view (screen container) */
        #app {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: none;
            background-color: var(--bg);
            transition: background 0.2s;
        }
        #app::-webkit-scrollbar { display: none; }

        /* header */
        .header {
            height: var(--header-height);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-light);
            background-color: var(--card);
            flex-shrink: 0;
        }
        .header .title {
            font-weight: 600;
            font-size: 1.2rem;
            color: var(--text-primary);
        }
        .profile-icon {
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            transition: opacity 0.1s;
        }
        .profile-icon svg {
            width: 24px;
            height: 24px;
            stroke: var(--text-primary);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* main content */
        .content {
            flex: 1;
            padding: 20px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background-color: var(--bg);
        }

        /* bottom navigation */
        .bottom-nav {
            height: var(--bottom-nav-height);
            background-color: var(--card);
            border-top: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding-bottom: 8px;
            flex-shrink: 0;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 6px 12px;
            border-radius: 20px;
            background: transparent;
        }
        .nav-item.active {
            background: rgba(37, 99, 235, 0.08);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.15s;
        }
        .nav-item.active svg {
            stroke: var(--primary);
            transform: scale(1.15);
        }
        .nav-item.inactive svg {
            stroke: var(--inactive);
        }
        .nav-label {
            font-size: 0.65rem;
            font-weight: 500;
            transition: color 0.15s;
        }
        .nav-item.active .nav-label {
            color: var(--primary);
        }
        .nav-item.inactive .nav-label {
            color: var(--inactive);
        }

        /* UI components */
        .card {
            background-color: var(--card);
            border-radius: 20px;
            padding: 18px 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }
        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .progress-bar-bg {
            height: 8px;
            background: var(--border-light);
            border-radius: 20px;
            margin: 12px 0 6px;
        }
        .progress-fill {
            height: 8px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 20px;
            width: 0%;
            transition: width 0.3s;
        }
        .badge {
            background: var(--accent);
            padding: 6px 12px;
            border-radius: 30px;
            color: #0F172A;
            font-weight: 600;
            font-size: 0.8rem;
        }
        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.15s;
            text-align: center;
        }
        .btn-primary:active { opacity: 0.8; transform: scale(0.98); }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 16px;
            font-size: 0.8rem;
            color: var(--inactive);
            text-decoration: underline;
            cursor: pointer;
        }
        /* modal */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: var(--card);
            padding: 28px 24px;
            border-radius: 32px;
            width: 280px;
            text-align: center;
            color: var(--text-primary);
            border: 1px solid var(--border-light);
        }
        .modal-card button {
            margin-top: 20px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        .hidden { display: none; }

        /* icons set */
        .icon-defs { display: none; }
    </style>
</head>
<body>
    <div id="phone">
        <!-- header (dynamic title) -->
        <div class="header" id="app-header">
            <span class="title" id="header-title">Onboarding</span>
            <div class="profile-icon" id="profileBtn">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2" fill="none"/></svg>
            </div>
        </div>

        <!-- main screen content injected via js -->
        <div id="app" class="content"></div>

        <!-- bottom navigation (static, shows active by js) -->
        <div class="bottom-nav" id="bottomNav">
            <div class="nav-item inactive" data-tab="home">
                <svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2h-5v-8h-4v8H5a2 2 0 0 1-2-2z" stroke="currentColor" fill="none"/></svg>
                <span class="nav-label">Home</span>
            </div>
            <div class="nav-item inactive" data-tab="learn">
                <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" stroke="currentColor"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" stroke="currentColor"/></svg>
                <span class="nav-label">Learn</span>
            </div>
            <div class="nav-item inactive" data-tab="progress">
                <svg viewBox="0 0 24 24"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2" stroke="currentColor" fill="none"/><circle cx="12" cy="16" r="5" stroke="currentColor"/><path d="M12 11v5" stroke="currentColor"/><path d="M9 8V6" stroke="currentColor"/><path d="M15 8V6" stroke="currentColor"/></svg>
                <span class="nav-label">Progress</span>
            </div>
            <div class="nav-item inactive" data-tab="settings">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82L12 22z" stroke="currentColor"/><path d="M4.6 9a1.65 1.65 0 0 0-.33 1.82c.26.61.86.99 1.51 1h12.44a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82L12 2z" stroke="currentColor"/></svg>
                <span class="nav-label">Settings</span>
            </div>
        </div>
    </div>

    <!-- modals for privacy/terms -->
    <div id="modalContainer" class="modal hidden"></div>

    <script>
        (function() {
            // ---------- THEME / CONST ----------
            const STORAGE_KEY = 'codeLingua_theme';
            let darkMode = localStorage.getItem(STORAGE_KEY) === 'dark';
            applyTheme(darkMode);

            // ---------- ICONS (inline helper, but we use inline in html) ----------

            // ---------- APP STATE ----------
            let currentScreen = 'onboarding'; // home, learn, progress, settings
            let lessonProgress = 37; // percent for demo

            // screens: onboarding, home, learn, progress, settings

            // ---------- RENDER FUNCTION ----------
            function renderScreen(screen) {
                const appEl = document.getElementById('app');
                const headerTitle = document.getElementById('header-title');
                if (!appEl) return;

                // onboarding is special (no bottom nav active)
                if (screen === 'onboarding') {
                    headerTitle.innerText = 'Welcome';
                    appEl.innerHTML = getOnboardingHTML();
                    document.querySelectorAll('.nav-item').forEach(i => i.classList.add('inactive'));
                    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                    attachOnboardingEvents();
                    return;
                }

                // normal screens
                headerTitle.innerText = screen.charAt(0).toUpperCase() + screen.slice(1);
                if (screen === 'home') appEl.innerHTML = getHomeHTML();
                else if (screen === 'learn') appEl.innerHTML = getLearnHTML();
                else if (screen === 'progress') appEl.innerHTML = getProgressHTML();
                else if (screen === 'settings') appEl.innerHTML = getSettingsHTML();

                // update bottom nav active
                document.querySelectorAll('.nav-item').forEach(item => {
                    const tab = item.dataset.tab;
                    if (tab === screen) {
                        item.classList.add('active');
                        item.classList.remove('inactive');
                    } else {
                        item.classList.remove('active');
                        item.classList.add('inactive');
                    }
                });

                // attach bottom nav listeners again (they persist but ensure)
                attachNavEvents();

                // extra dynamic updates (progress bars)
                if (screen === 'home' || screen === 'progress') {
                    setTimeout(() => updateProgressFill(), 20);
                }
            }

            function getOnboardingHTML() {
                return `
                    <div class="card" style="text-align: center; padding: 32px 20px;">
                        <svg width="70" height="70" viewBox="0 0 24 24" stroke="var(--primary)" stroke-width="1.5" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                        <h1 style="margin: 16px 0 4px; color: var(--primary);">CodeLingua</h1>
                        <p style="font-size: 1.1rem; font-weight: 500;">JavaScript · daily drills</p>
                        <p style="margin: 12px 0 24px; color: var(--text-secondary);">Bite-sized coding challenges & vocabulary for JS learners.</p>
                        <button class="btn-primary" id="getStartedBtn">Get Started →</button>
                        <div class="link-row" id="policyLinks">
                            <span id="privacyLink">Privacy Policy</span>
                            <span id="termsLink">Terms of Service</span>
                        </div>
                    </div>
                `;
            }

            function getHomeHTML() {
                return `
                    <div class="card flex-row"><span>🔥 Daily streak</span> <span class="badge">7 days</span></div>
                    <div class="card"><div class="flex-row"><span>Today's goal</span><span>${lessonProgress}%</span></div><div class="progress-bar-bg"><div class="progress-fill" id="goalFill" style="width:${lessonProgress}%"></div></div></div>
                    <div class="card" style="display: flex; gap: 12px; align-items: center;">
                        <svg width="40" height="40" viewBox="0 0 24 24" stroke="var(--primary)" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
                        <div><strong>Next: Closures</strong><p style="color: var(--text-secondary);">Lesson 4/6</p></div>
                        <button class="btn-primary" style="margin-left: auto; padding: 8px 18px;" id="quickPracticeBtn">Start</button>
                    </div>
                    <div class="card"><span>📘 "Array methods" ready for review</span></div>
                `;
            }

            function getLearnHTML() {
                return `
                    <div class="card"><h3>JavaScript essentials</h3><div style="margin: 8px 0;">⚡ Scope & closure</div><div>⚡ Promises (2 exercises)</div><div style="margin-top: 8px;"><button class="btn-primary" id="startLessonBtn" style="padding: 10px;">Continue learning →</button></div></div>
                    <div class="card"><h4>Vocabulary: 12 new terms</h4><div class="flex-row"><span>hoisting</span><input type="checkbox"></div></div>
                `;
            }

            function getProgressHTML() {
                return `
                    <div class="card"><h3>This week</h3><div style="height:80px; display:flex; gap:6px; align-items:end;">${[40,65,30,80,45,70,90].map((h,i)=>`<div style="background:var(--primary); width:20px; height:${h*0.6}%; border-radius:8px;"></div>`).join('')}</div></div>
                    <div class="card"><div class="flex-row"><span>Lessons done</span><span>24/60</span></div><div class="progress-bar-bg"><div class="progress-fill" id="lessonFill" style="width:40%"></div></div></div>
                    <div class="card"><span>🏆 Achievements: 3 · Rank: Novice</span></div>
                `;
            }

            function getSettingsHTML() {
                const checked = darkMode ? 'checked' : '';
                return `
                    <div class="card flex-row"><span>🌙 Dark mode</span><label class="switch"><input type="checkbox" id="themeToggle" ${checked} style="width:24px; height:24px;"></label></div>
                    <div class="card"><span>🔔 Notifications</span></div>
                    <div class="card"><span>🌐 Language: English</span></div>
                    <div class="card"><span>📲 Version 1.2.3</span></div>
                `;
            }

            // attach events after onboarding
            function attachOnboardingEvents() {
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                    currentScreen = 'home';
                    renderScreen('home');
                });
                document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy Policy', 'We respect your data. (demo)'));
                document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms of Service', 'Educational use only.'));
            }

            function attachNavEvents() {
                document.querySelectorAll('.nav-item').forEach(item => {
                    item.removeEventListener('click', navHandler);
                    item.addEventListener('click', navHandler);
                });
            }
            function navHandler(e) {
                const tab = this.dataset.tab;
                if (!tab) return;
                currentScreen = tab;
                renderScreen(tab);
            }

            function showModal(title, text) {
                const modal = document.getElementById('modalContainer');
                modal.innerHTML = `<div class="modal-card"><h3>${title}</h3><p style="margin:12px 0;">${text}</p><button id="closeModalBtn">Close</button></div>`;
                modal.classList.remove('hidden');
                document.getElementById('closeModalBtn').addEventListener('click', ()=> modal.classList.add('hidden'));
            }

            // profile button -> settings
            document.getElementById('profileBtn').addEventListener('click', ()=>{
                currentScreen = 'settings';
                renderScreen('settings');
            });

            // theme toggle dynamic inside settings
            function applyTheme(dark) {
                if (dark) document.body.classList.add('dark');
                else document.body.classList.remove('dark');
                localStorage.setItem(STORAGE_KEY, dark ? 'dark' : 'light');
            }

            // listen for theme toggle (delegation)
            document.addEventListener('change', (e)=>{
                if (e.target.id === 'themeToggle') {
                    darkMode = e.target.checked;
                    applyTheme(darkMode);
                }
            });

            function updateProgressFill() {
                const fill = document.getElementById('goalFill');
                if (fill) fill.style.width = lessonProgress + '%';
                const fill2 = document.getElementById('lessonFill');
                if (fill2) fill2.style.width = '40%';
            }

            // start quick practice (home)
            document.addEventListener('click', (e)=>{
                if (e.target.id === 'quickPracticeBtn' || e.target.id === 'startLessonBtn') {
                    currentScreen = 'learn';
                    renderScreen('learn');
                }
            });

            // initial render
            renderScreen('onboarding');

            // ----- screenshot functionality (SHIFT + W) -----
            let screenshotCounter = 1;
            document.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    capturePhoneContainer();
                }
            });

            function capturePhoneContainer() {
                const phone = document.getElementById('phone');
                if (!phone) return;

                // determine file name base
                const isDark = document.body.classList.contains('dark');
                let fileName = isDark ? '6.png' : (screenshotCounter + '.png');
                if (!isDark) {
                    screenshotCounter = (screenshotCounter % 5) + 1;
                }

                // dummy capture: in real prototype we'd use html2canvas, but here we simply show a download prompt via canvas
                // (simulate because we can't include libs, but we use built-in)
                import('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js').then((module) => {
                    const html2canvas = module.default;
                    html2canvas(phone, { scale: 2, backgroundColor: null }).then(canvas => {
                        const link = document.createElement('a');
                        link.download = fileName;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    });
                }).catch(() => {
                    alert('Shift+W: Screenshot simulation.\nIn real prototype, html2canvas would generate ' + fileName);
                });
            }

            // expose for later
            window.counter = screenshotCounter;
        })();
    </script>

    <!-- placeholder for icons definition (already inline) -->

    <!-- bottom navigation event listeners re-attach after render, fine -->

    <!-- JSON object required at very end -->
    <script>
        (function(){ /* output json after page */ })();
    </script>
</body>
</html>
All done!
