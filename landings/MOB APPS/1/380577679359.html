```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeFlow · Python practice</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #1a1e2b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --border-light: #E2E8F0;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --inactive: #94A3B8;
      --shadow: 0 20px 35px -8px rgba(0,0,0,0.15), 0 5px 10px -4px rgba(0,0,0,0.05);
      --header-icon: #1E293B;
      --progress-bg: #E2E8F0;
      --badge-bg: #DBEAFE;
      --badge-text: #1E40AF;
    }

    body.dark {
      --bg: #0F172A;
      --card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --border-light: #334155;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --inactive: #64748B;
      --shadow: 0 20px 35px -8px rgba(0,0,0,0.6), 0 5px 10px -4px rgba(0,0,0,0.3);
      --header-icon: #F1F5F9;
      --progress-bg: #334155;
      --badge-bg: #1E3A8A;
      --badge-text: #BFDBFE;
    }

    #phone {
      width: 360px;
      height: 780px;
      background: var(--bg);
      border-radius: 48px;
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      position: relative;
      transition: background 0.2s;
      border: 1px solid rgba(255,255,255,0.08);
    }

    /* screen container */
    #app-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 20px 20px 8px 20px;
      scrollbar-width: thin;
      scrollbar-color: var(--inactive) transparent;
    }
    #app-screen::-webkit-scrollbar { width: 4px; }
    #app-screen::-webkit-scrollbar-thumb { background: var(--inactive); border-radius: 8px; }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .header h2 {
      font-size: 22px;
      font-weight: 650;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .profile-btn svg {
      width: 26px;
      height: 26px;
      stroke: var(--header-icon);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* bottom navigation */
    .bottom-nav {
      height: 70px;
      background: var(--card);
      border-top: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 8px;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
      padding: 8px 0 4px;
      border-radius: 20px;
    }
    .nav-item svg {
      width: 26px;
      height: 26px;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: all 0.15s;
    }
    .nav-item span {
      font-size: 11px;
      font-weight: 500;
      margin-top: 4px;
      transition: all 0.15s;
    }
    .nav-item.active {
      background: rgba(37, 99, 235, 0.08);
    }
    .nav-item.active svg {
      stroke: var(--primary);
      stroke-width: 2.5;
      transform: scale(1.1);
    }
    .nav-item.active span {
      color: var(--primary);
      font-weight: 600;
    }
    .nav-item.inactive svg {
      stroke: var(--inactive);
    }
    .nav-item.inactive span {
      color: var(--inactive);
    }

    /* cards & content */
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 18px 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.02);
      border: 1px solid var(--border-light);
    }

    .flex-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .gap-4 { gap: 4px; }
    .mb-2 { margin-bottom: 8px; }
    .mt-2 { margin-top: 8px; }
    .text-small { font-size: 13px; color: var(--text-secondary); }

    .btn-primary {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      padding: 16px 24px;
      border-radius: 40px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 8px 18px rgba(37,99,235,0.2);
    }
    .btn-primary:active { transform: scale(0.97); background: var(--primary-dark); }

    .link-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 20px;
    }
    .link-row button {
      background: none;
      border: none;
      color: var(--inactive);
      text-decoration: underline;
      font-size: 13px;
      cursor: pointer;
    }

    .progress-bar {
      height: 8px;
      background: var(--progress-bg);
      border-radius: 20px;
      margin: 12px 0 4px;
    }
    .progress-fill {
      height: 8px;
      background: var(--primary);
      border-radius: 20px;
      width: 0%;
      transition: width 0.3s ease;
    }

    .badge {
      background: var(--badge-bg);
      color: var(--badge-text);
      padding: 6px 12px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 13px;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-card {
      background: var(--card);
      width: 280px;
      padding: 26px 20px;
      border-radius: 32px;
      text-align: center;
      color: var(--text-primary);
      box-shadow: var(--shadow);
    }
    .modal-card button {
      margin-top: 20px;
      background: var(--primary);
      border: none;
      color: white;
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
    }
    .hidden { display: none; }

    /* onboarding */
    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 30px 0 20px;
    }
    .app-logo {
      background: linear-gradient(145deg, #2563EB, #38BDF8);
      width: 70px;
      height: 70px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }
    .app-name {
      font-size: 32px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
    }
    .tagline {
      font-size: 16px;
      color: var(--text-secondary);
      margin: 8px 0 12px;
    }

    /* dark mode toggle inside settings */
    .theme-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .switch {
      position: relative;
      width: 48px;
      height: 24px;
      background: var(--border-light);
      border-radius: 40px;
      border: none;
      cursor: pointer;
    }
    .switch[aria-pressed="true"] { background: var(--primary); }
    .switch::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      background: white;
      border-radius: 50%;
      top: 2px; left: 2px;
      transition: 0.15s;
    }
    .switch[aria-pressed="true"]::after { left: 26px; }

    /* icons uniform */
    .icon-outline { stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
<div id="phone">
  <!-- dynamic views -->
  <div id="app-screen"></div>
  <!-- bottom nav (hidden on onboarding) -->
  <div id="bottom-nav" class="bottom-nav"></div>
</div>

<!-- screenshot helper (hidden) -->
<div style="display: none;" id="screenshot-helper"></div>

<script>
(function() {
  // ----- THEME & STATE -----
  let currentScreen = 'onboarding'; // 'home','learn','progress','settings','profile'
  let darkMode = false;
  let screenshotCounter = 1;        // used for shift+w naming

  // root element for dark class
  const body = document.body;
  const phone = document.getElementById('phone');

  // ----- SVG ICONS (inline, same style) -----
  const icons = {
    home: `<svg viewBox="0 0 24 24" class="icon-outline"><path d="M5 12H3l9-9 9 9h-2v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7z"/><path d="M9 21V12h6v9"/></svg>`,
    learn: `<svg viewBox="0 0 24 24" class="icon-outline"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
    progress: `<svg viewBox="0 0 24 24" class="icon-outline"><path d="M21 12v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l3-3 3 3 4-4"/><path d="M17 6l4-4v8"/></svg>`,
    settings: `<svg viewBox="0 0 24 24" class="icon-outline"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.05.05A10 10 0 0 0 12 17.66a10 10 0 0 0 6.26-2.28zM4.73 8.99a1.65 1.65 0 0 0 1.51 1h12.52a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.21-1.68A10 10 0 0 0 12 5a10 10 0 0 0-7.06 2.34 1.65 1.65 0 0 0-.21 1.65z"/></svg>`,
    profile: `<svg viewBox="0 0 24 24" class="icon-outline"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
    lesson: `<svg viewBox="0 0 24 24" class="icon-outline"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>`,
    chart: `<svg viewBox="0 0 24 24" class="icon-outline"><path d="M21 21H4V4"/><path d="M7 15v4"/><path d="M11 11v8"/><path d="M15 8v11"/><path d="M19 5v14"/></svg>`,
    flashcards: `<svg viewBox="0 0 24 24" class="icon-outline"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 7h8"/><path d="M8 12h6"/><path d="M8 17h4"/></svg>`,
    play: `<svg viewBox="0 0 24 24" class="icon-outline"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
    check: `<svg viewBox="0 0 24 24" class="icon-outline"><polyline points="20 6 9 17 4 12"/></svg>`,
  };

  // ----- Helper: render bottom nav based on active screen -----
  function renderBottomNav(activeId) {
    const nav = document.getElementById('bottom-nav');
    if (!nav) return;
    if (currentScreen === 'onboarding' || currentScreen === 'profile') {
      nav.innerHTML = ''; // no bottom nav on onboarding & profile
      return;
    }
    const items = [
      { id: 'home', label: 'Home', icon: icons.home },
      { id: 'learn', label: 'Learn', icon: icons.learn },
      { id: 'progress', label: 'Progress', icon: icons.progress },
      { id: 'settings', label: 'Settings', icon: icons.settings }
    ];
    nav.innerHTML = items.map(item => {
      const active = (activeId === item.id);
      return `<button class="nav-item ${active ? 'active' : 'inactive'}" data-nav="${item.id}">
        ${item.icon} <span>${item.label}</span>
      </button>`;
    }).join('');
    nav.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const target = btn.dataset.nav;
        if (target) { currentScreen = target; renderApp(); }
      });
    });
  }

  // ----- modal control (privacy/terms) -----
  function showModal(title, text) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `<div class="modal-card"><h3 style="margin-bottom:12px;">${title}</h3><p style="color:var(--text-secondary);">${text}</p><button id="closeModalBtn">Close</button></div>`;
    document.body.appendChild(overlay);
    document.getElementById('closeModalBtn').addEventListener('click', () => overlay.remove());
  }

  // ----- Screens content -----
  function renderScreen() {
    const container = document.getElementById('app-screen');
    if (!container) return;

    let html = '';

    // common header (except onboarding hides profile icon? we'll show it anyway but it opens profile)
    const showHeader = currentScreen !== 'onboarding';
    if (showHeader) {
      let title = 'Home';
      if (currentScreen === 'learn') title = 'Learn';
      else if (currentScreen === 'progress') title = 'Progress';
      else if (currentScreen === 'settings') title = 'Settings';
      else if (currentScreen === 'profile') title = 'Profile';
      else title = 'Home';
      html += `<div class="header">
        <h2>${title}</h2>
        <button class="profile-btn" id="profileHeaderBtn">${icons.profile}</button>
      </div>`;
    }

    // ----- ONBOARDING -----
    if (currentScreen === 'onboarding') {
      html = `<div class="header" style="justify-content:flex-end;"><button class="profile-btn" id="profileHeaderBtn">${icons.profile}</button></div>` + `
        <div class="logo-area">
          <div class="app-logo">${icons.learn.replace('width="24"', 'width="40"').replace('height="24"', 'height="40"').replace('stroke:#', 'stroke:white')}</div>
          <div class="app-name">CodeFlow</div>
          <div class="tagline">learn Python · 5 min a day</div>
          <p style="color:var(--text-secondary); text-align:center; margin:12px 24px;">Bite-sized coding exercises, flashcards & quizzes. Build real skills.</p>
        </div>
        <button class="btn-primary" id="getStartedBtn">Get Started</button>
        <div class="link-row">
          <button id="privacyBtn">Privacy Policy</button>
          <button id="termsBtn">Terms of Service</button>
        </div>
      `;
    }

    // ----- HOME dashboard (Python themed) -----
    if (currentScreen === 'home') {
      html += `
        <div class="card">
          <div class="flex-row" style="justify-content:space-between;">
            <span class="badge">🔥 7 day streak</span>
            <span class="text-small">⚡ 230 XP today</span>
          </div>
          <div style="margin-top:16px;"><span style="font-weight:700; color:var(--text-primary);">Next lesson:</span> <span style="color:var(--text-secondary);">Functions & scope</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:65%"></div></div>
          <div class="flex-row gap-4" style="justify-content:space-between; margin-top:8px;">
            <span class="text-small">65% complete</span><span class="text-small">4/6 exercises</span>
          </div>
        </div>
        <div class="card">
          <div style="display:flex; gap:16px; align-items:center; margin-bottom:12px;">${icons.flashcards} <span style="font-weight:600;">Daily flashcards</span></div>
          <div class="flex-row" style="justify-content:space-between;"><span>variables</span> <span class="badge">👍 94%</span></div>
          <div class="flex-row" style="justify-content:space-between; margin-top:8px;"><span>lists</span> <span class="badge">👍 76%</span></div>
        </div>
        <div class="card">
          <div style="display:flex; gap:8px; align-items:center;">${icons.chart} <span style="font-weight:600;">Recommended for you</span></div>
          <div class="flex-row" style="margin-top:16px; gap:10px; flex-wrap:wrap;">
            <span class="badge" style="background:var(--accent); color:#0F172A;">loops</span>
            <span class="badge" style="background:var(--accent); color:#0F172A;">dictionaries</span>
            <span class="badge" style="background:var(--accent); color:#0F172A;">OOP</span>
          </div>
        </div>
        <button class="btn-primary" style="margin-top:6px;" id="practiceHomeBtn">Start practice →</button>
      `;
    }

    // ----- LEARN screen -----
    if (currentScreen === 'learn') {
      html += `
        <div class="card" style="padding:0;">
          <div style="padding:16px; border-bottom:1px solid var(--border-light);"><span style="font-weight:600;">Python basics</span><span class="badge" style="float:right;">3/8</span></div>
          <div style="padding:16px; border-bottom:1px solid var(--border-light);"><span style="font-weight:600;">Data structures</span><span class="badge" style="float:right;">1/6</span></div>
          <div style="padding:16px;"><span style="font-weight:600;">Algorithms 101</span><span class="badge" style="float:right;">0/5</span></div>
        </div>
        <div class="card flex-row" style="justify-content:space-between;">
          <span>💡 <strong>Today's goal</strong> finish 1 lesson</span>
          <span class="badge">+25 XP</span>
        </div>
        <div class="card">
          <div class="flex-row" style="margin-bottom:12px;">${icons.play} <span>Quick exercise: fix this code</span></div>
          <pre style="background:var(--bg); padding:10px; border-radius:12px;">print("hello world)</pre>
          <button class="btn-primary" style="margin-top:12px;" id="showHint">show hint</button>
        </div>
      `;
    }

    // ----- PROGRESS + STATISTICS (rich) -----
    if (currentScreen === 'progress') {
      html += `
        <div class="card">
          <div style="display:flex; gap:24px; align-items:center; justify-content:center;">
            <div style="text-align:center;"><span style="font-size:32px; font-weight:700; color:var(--primary);">87</span><br><span class="text-small">lessons</span></div>
            <div style="text-align:center;"><span style="font-size:32px; font-weight:700; color:var(--primary);">12</span><br><span class="text-small">days</span></div>
            <div style="text-align:center;"><span style="font-size:32px; font-weight:700; color:var(--primary);">435</span><br><span class="text-small">xp</span></div>
          </div>
        </div>
        <div class="card">
          <div class="flex-row" style="justify-content:space-between;"><span>Python mastery</span><span>78%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:78%"></div></div>
          <div class="flex-row" style="justify-content:space-between; margin-top:12px;"><span>Daily goal</span><span>60%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div>
        </div>
        <div class="card flex-row" style="justify-content:space-around;">
          <div>🏆 <strong>3</strong> badges</div>
          <div>⚡ <strong>14</strong> streak</div>
          <div>📊 <strong>top 18%</strong></div>
        </div>
        ${icons.chart}
        <canvas id="dummyChart" width="280" height="80" style="margin-top:8px; background:var(--card); border-radius:24px; padding:6px;"></canvas>
      `;
      // mini chart animation via canvas later
      setTimeout(() => {
        const canvas = document.getElementById('dummyChart');
        if (canvas) {
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0,0,280,80);
          ctx.fillStyle = 'var(--primary)';
          [40,60,45,70,65,80,75].forEach((h,i) => {
            ctx.fillRect(20 + i*35, 70 - h*0.6, 12, h*0.6);
          });
        }
      }, 50);
    }

    // ----- SETTINGS / PROFILE (profile also uses same structure) -----
    if (currentScreen === 'settings' || currentScreen === 'profile') {
      html += `
        <div class="card">
          <div class="theme-row"><span>Dark theme</span><button class="switch" id="themeToggleBtn" aria-pressed="${darkMode}"></button></div>
        </div>
        <div class="card">
          <div class="flex-row" style="justify-content:space-between;"><span>Account</span> <span class="text-small">alex@py.dev</span></div>
          <div class="flex-row" style="justify-content:space-between; margin-top:12px;"><span>Notifications</span> <span class="badge">on</span></div>
          <div class="flex-row" style="justify-content:space-between; margin-top:12px;"><span>Language</span> <span>Python 3.12</span></div>
        </div>
        <div class="card">
          <div>📱 App version 2.4.0</div>
          <div style="margin-top:8px;">📧 support@codeflow.dev</div>
        </div>
        <button class="btn-primary" id="resetBtn" style="margin-top:6px;">reset progress (demo)</button>
      `;
    }

    container.innerHTML = html;

    // Attach event listeners after render
    if (currentScreen === 'onboarding') {
      document.getElementById('getStartedBtn')?.addEventListener('click', () => { currentScreen = 'home'; renderApp(); });
      document.getElementById('privacyBtn')?.addEventListener('click', () => showModal('Privacy', 'We protect your code. No data sharing.'));
