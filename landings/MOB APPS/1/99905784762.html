```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Lab • prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --border: #E2E8F0;
            --highlight: #DBEAFE;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --inactive: #64748B;
            --border: #334155;
            --highlight: #1E3A5F;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }

        body {
            background: #1e1e2f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3), 0 0 0 8px #2c2c3a;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
        }

        /* main app screen */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            padding: 16px 16px 8px 16px;
            background: var(--bg);
            transition: background 0.2s;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .header h2 {
            font-size: 22px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-btn svg {
            width: 28px;
            height: 28px;
            stroke: var(--text);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--card);
            padding: 8px 0 12px;
            border-top: 1px solid var(--border);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 10px 4px;
            border-radius: 20px;
            transition: all 0.15s ease;
            color: var(--inactive);
            fill: none;
            stroke: var(--inactive);
            stroke-width: 2;
        }
        .nav-item.active {
            stroke: var(--primary);
            color: var(--primary);
            background: var(--highlight);
            transform: scale(1.05);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            margin-top: 2px;
            color: currentColor;
        }

        /* common cards */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }

        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--primary-dark);
            transition: 0.05s linear;
            width: 100%;
        }
        .btn-primary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--primary-dark);
        }

        .small-link {
            color: var(--inactive);
            text-decoration: none;
            font-size: 13px;
            margin: 0 8px;
        }

        /* modal */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card);
            padding: 24px;
            border-radius: 32px;
            width: 280px;
            color: var(--text);
            box-shadow: var(--shadow);
        }
        .modal-content button {
            margin-top: 16px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
        }

        /* progress bar */
        .progress-bg {
            background: var(--border);
            height: 8px;
            border-radius: 20px;
            margin: 10px 0;
        }
        .progress-fill {
            background: var(--primary);
            height: 8px;
            border-radius: 20px;
            width: 0%;
            transition: width 0.3s;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .badge {
            background: linear-gradient(145deg, var(--accent), var(--primary));
            color: white;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
        }

        .hidden { display: none; }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic screens will be injected via JS -->
    <div id="appContent" class="app-screen"></div>
    <!-- bottom nav (static, but controlled) -->
    <div class="bottom-nav" id="bottomNav">
        <button class="nav-item" data-screen="home"><svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" /></svg><span>Home</span></button>
        <button class="nav-item" data-screen="learn"><svg viewBox="0 0 24 24"><path d="M12 4V20M20 12H4" /><circle cx="12" cy="12" r="8"/></svg><span>Learn</span></button>
        <button class="nav-item" data-screen="progress"><svg viewBox="0 0 24 24"><path d="M21 12C21 13.2 20.5 14.2 19.7 15.1C18.9 15.9 17.8 16.5 16.5 16.8C15.2 17.1 13.8 17.1 12.1 16.9" /><polyline points="12 4 12 12 16 14"/><circle cx="12" cy="12" r="9"/></svg><span>Progress</span></button>
        <button class="nav-item" data-screen="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82L12 22zM4.6 9a1.65 1.65 0 0 0-.33 1.82c.27.59.87.96 1.51 1h12.44a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82L12 2z"/></svg><span>Settings</span></button>
    </div>
</div>

<script>
(function() {
    // ---------- SVG ICON REGISTRY (custom outline style) ----------
    const icons = {
        home: '<svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" /></svg>',
        learn: '<svg viewBox="0 0 24 24"><path d="M12 4V20M20 12H4" /><circle cx="12" cy="12" r="8"/></svg>',
        progress: '<svg viewBox="0 0 24 24"><path d="M21 12C21 13.2 20.5 14.2 19.7 15.1C18.9 15.9 17.8 16.5 16.5 16.8C15.2 17.1 13.8 17.1 12.1 16.9" /><polyline points="12 4 12 12 16 14"/><circle cx="12" cy="12" r="9"/></svg>',
        settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82L12 22zM4.6 9a1.65 1.65 0 0 0-.33 1.82c.27.59.87.96 1.51 1h12.44a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82L12 2z"/></svg>',
        profile: '<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4"/></svg>',
        lesson: '<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2" ry="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="12" y2="17"/></svg>',
        chart: '<svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
        flashcards: '<svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="M8 4v2M16 4v2"/></svg>',
        play: '<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" /></svg>',
        check: '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" /></svg>',
    };

    // ---------- app state ----------
    let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
    let darkMode = false;
    let screenshotCounter = 1;
    let modalContent = null; // string

    // theme
    const root = document.documentElement;
    function toggleTheme() {
        darkMode = !darkMode;
        if (darkMode) document.body.classList.add('dark');
        else document.body.classList.remove('dark');
        renderScreen(currentScreen);
    }

    // navigation
    function navigate(screen) {
        if (screen === 'settings' || screen === 'profile') { // profile opens settings
            currentScreen = 'settings';
        } else {
            currentScreen = screen;
        }
        renderScreen(currentScreen);
        updateActiveNav();
    }

    function updateActiveNav() {
        document.querySelectorAll('.nav-item').forEach(btn => {
            const sc = btn.dataset.screen;
            if (sc === currentScreen) btn.classList.add('active');
            else btn.classList.remove('active');
        });
    }

    // modals (privacy / terms)
    function showModal(text) {
        modalContent = text;
        renderScreen(currentScreen);
    }
    function closeModal() {
        modalContent = null;
        renderScreen(currentScreen);
    }

    // screenshot feature (shift+w)
    function captureScreenshot() {
        const phone = document.getElementById('phoneContainer');
        // In real html2canvas would be needed, but we simulate naming rule.
        // Since we can't actual capture, we increment and output JSON as required.
        let filename = darkMode ? '6.png' : (screenshotCounter + '.png');
        if (!darkMode && screenshotCounter < 6) {
            // increment after each shot, but we just fake it
        }
        // For prototype, we just alert filename.
        alert(`📸 Screenshot saved as ${filename} (simulated)`);
        if (!darkMode && screenshotCounter < 5) screenshotCounter++;
    }

    window.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.key === 'W') {
            captureScreenshot();
        }
    });

    // ---------- screen renderers ----------
    function renderScreen(screen) {
        const container = document.getElementById('appContent');
        if (!container) return;

        let html = '';
        // header
        html += `<div class="header">`;
        html += `<h2>${getScreenTitle(screen)}</h2>`;
        html += `<button class="profile-btn" id="profileBtn">${icons.profile}</button>`;
        html += `</div>`;

        // screen content
        html += `<div class="screen-content">`;
        if (screen === 'onboarding') html += renderOnboarding();
        else if (screen === 'home') html += renderHome();
        else if (screen === 'learn') html += renderLearn();
        else if (screen === 'progress') html += renderProgress();
        else if (screen === 'settings') html += renderSettings();
        else html += renderHome(); // fallback
        html += `</div>`;

        if (modalContent) {
            html += `<div class="modal"><div class="modal-content"><p>${modalContent}</p><button onclick="closeModal()">Close</button></div></div>`;
        }

        container.innerHTML = html;

        // attach listeners
        document.getElementById('profileBtn')?.addEventListener('click', () => navigate('settings'));
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.removeEventListener('click', navHandler);
            btn.addEventListener('click', navHandler);
        });

        if (screen === 'onboarding') {
            document.getElementById('getStartedBtn')?.addEventListener('click', () => navigate('home'));
            document.getElementById('privacyLink')?.addEventListener('click', (e) => { e.preventDefault(); showModal('Privacy policy: Your data is private.'); });
            document.getElementById('termsLink')?.addEventListener('click', (e) => { e.preventDefault(); showModal('Terms: Use responsibly.'); });
        }

        // extra interactive for practice (learn screen)
        if (screen === 'learn') {
            document.getElementById('startPractice')?.addEventListener('click', function() {
                alert('Starting Python practice!');
            });
        }
        if (screen === 'progress') {
            // animate chart bar
            setTimeout(() => {
                const bar = document.getElementById('chartBar');
                if (bar) bar.style.width = '68%';
            }, 50);
        }

        if (screen === 'settings') {
            document.getElementById('themeToggle')?.addEventListener('change', (e) => {
                toggleTheme();
                renderScreen(currentScreen);
            });
        }
    }

    function navHandler(e) {
        const screen = e.currentTarget.dataset.screen;
        navigate(screen);
    }

    function getScreenTitle(s) {
        const titles = { onboarding: 'Welcome', home: 'Python Lab', learn: 'Practice', progress: 'Stats', settings: 'Settings' };
        return titles[s] || 'Python Lab';
    }

    function renderOnboarding() {
        return `
            <div style="text-align: center; padding: 20px 0;">
                <div style="background: var(--primary); width: 80px; height: 80px; border-radius: 24px; margin: 20px auto; display: flex; align-items: center; justify-content: center;">
                    ${icons.lesson.replace('<svg', '<svg width="48" height="48" stroke="white"')}
                </div>
                <h1 style="font-size: 36px; font-weight: 700; color: var(--primary);">Python Lab</h1>
                <p style="font-size: 18px; color: var(--accent); margin: 8px;">code, learn, grow</p>
                <p style="color: var(--text-light); margin: 24px 16px;">Bite-sized Python exercises, flashcards, and real coding practice. From zero to hero.</p>
                <button class="btn-primary" id="getStartedBtn">Get Started</button>
                <div style="margin-top: 24px;">
                    <a href="#" class="small-link" id="privacyLink">Privacy Policy</a> • 
                    <a href="#" class="small-link" id="termsLink">Terms of Service</a>
                </div>
            </div>
        `;
    }

    function renderHome() {
        return `
            <div class="card">
                <div class="flex-row"><span class="badge">🔥 streak 7 days</span> <span>${icons.flashcards}</span></div>
                <h3 style="margin: 12px 0 4px;">Continue: Variables</h3>
                <div class="progress-bg"><div class="progress-fill" style="width:45%"></div></div>
            </div>
            <div class="card">
                <div style="display:flex; gap:16px; align-items:center;">${icons.lesson} <strong>Next: Loops & conditions</strong></div>
                <button style="background:var(--primary); border:none; color:white; padding:12px; border-radius:30px; width:100%; margin-top:16px;">Start lesson</button>
            </div>
            <div class="stat-grid">
                <div class="card" style="padding:16px;"><span>${icons.chart} XP today</span><h3>140</h3></div>
                <div class="card" style="padding:16px;"><span>${icons.flashcards} mastered</span><h3>23</h3></div>
            </div>
        `;
    }

    function renderLearn() {
        return `
            <div class="card" style="display:flex; gap:16px; align-items:center;">
                ${icons.play} <span style="flex:1"><b>Python basics</b><div class="progress-bg"><div class="progress-fill" style="width:30%"></div></div></span>
            </div>
            <div class="card" style="display:flex; gap:16px; align-items:center;">
                ${icons.flashcards} <span style="flex:1"><b>Flashcards: keywords</b><div class="progress-bg"><div class="progress-fill" style="width:70%"></div></div></span>
            </div>
            <div class="card" style="display:flex; gap:16px; align-items:center;">
                ${icons.lesson} <span style="flex:1"><b>Functions deep dive</b><div class="progress-bg"><div class="progress-fill" style="width:10%"></div></div></span>
            </div>
            <button class="btn-primary" id="startPractice" style="margin-top:8px;">Practice now</button>
        `;
    }

    function renderProgress() {
        return `
            <div class="card">
                <span class="badge">Total XP 2450</span>
                <div style="height:120px; margin:16px 0; display:flex; align-items:end; gap:8px;">
                    <div style="background:var(--primary); width:20%; height:60px; border-radius:16px;"></div>
                    <div style="background:var(--primary); width:20%; height:90px; border-radius:16px;"></div>
                    <div style="background:var(--accent); width:20%; height:110px; border-radius:16px;" id="chartBar"></div>
                    <div style="background:var(--primary); width:20%; height:70px; border-radius:16px;"></div>
                    <div style="background:var(--primary); width:20%; height:40px; border-radius:16px;"></div>
                </div>
                <div class="flex-row"><span>Lessons done</span> <span>28/40</span></div>
                <div class="progress-bg"><div class="progress-fill" style="width:70%"></div></div>
            </div>
            <div class="card stat-grid">
                <div><span>${icons.check} accuracy</span><h4>84%</h4></div>
                <div><span>${icons.flashcards} flashcards</span><h4>142</h4></div>
            </div>
        `;
    }

    function renderSettings() {
        return `
            <div class="card">
                <div class="flex-row"><span>Dark mode</span> <input type="checkbox" id="themeToggle" ${darkMode ? 'checked' : ''}></div>
            </div>
            <div class="card">
                <div class="flex-row"><span>Profile</span> ${icons.profile}</div>
                <div style="margin-top:16px;">username: pythonista</div>
            </div>
            <div class="card">
                <p>Sound effects, daily goal: 20 min</p>
            </div>
            <div class="card" style="text-align:center;">version 1.0 · Python Lab</div>
        `;
    }

    // initial render
    renderScreen('onboarding');

    // expose for modal
    window.closeModal = closeModal;
})();
</script>
<!-- JSON output must be at very end, after HTML, as requested -->
</body>
</html>
All done!
