```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Playground · 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1e293b;
        }
        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --grey: #94A3B8;
            --grey-light: #E2E8F0;
            --header-icon: #1e293b;
            --bottom-bg: #FFFFFF;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
        }
        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --grey: #64748B;
            --grey-light: #334155;
            --header-icon: #F1F5F9;
            --bottom-bg: #1E293B;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }
        .phone-frame {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 42px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
            transition: background 0.2s;
        }
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .app-container::-webkit-scrollbar { display: none; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px 8px;
        }
        .header-left h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .profile-icon {
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            transition: background 0.2s;
        }
        .profile-icon:hover { background: var(--grey-light); }
        .content {
            flex: 1;
            padding: 8px 20px 12px;
            overflow-y: auto;
        }
        /* bottom nav */
        .bottom-nav {
            height: 72px;
            background: var(--bottom-bg);
            border-top: 1px solid var(--grey-light);
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            padding: 4px 0 8px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            flex: 1;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: transparent;
            border: none;
            padding: 8px 0 4px;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            color: var(--grey);
            transition: 0.2s;
        }
        .nav-item.active span { color: var(--primary); font-weight: 600; }
        .nav-item.active .icon-svg { 
            stroke: var(--primary) !important; 
            transform: scale(1.12);
            filter: drop-shadow(0 2px 4px rgba(37,99,235,0.2));
        }
        .nav-item.active { background: rgba(37,99,235,0.06); border-radius: 20px 20px 12px 12px; }
        .icon-svg { 
            width: 26px; 
            height: 26px; 
            stroke: var(--grey);
            stroke-width: 2px;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: 0.2s;
        }
        /* card styles */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--grey-light);
        }
        .flex-row { display: flex; align-items: center; gap: 12px; }
        .progress-bar {
            height: 8px;
            background: var(--grey-light);
            border-radius: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.4s ease;
        }
        .btn {
            background: var(--primary);
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 40px;
            padding: 14px 20px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(37,99,235,0.25);
            transition: 0.15s;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--grey-light);
            color: var(--text);
            box-shadow: none;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 4px 12px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 12px;
        }
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: var(--card);
            width: 280px;
            padding: 24px;
            border-radius: 40px;
            color: var(--text);
            text-align: center;
        }
        .link-group {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 24px;
            font-size: 12px;
            color: var(--grey);
            text-decoration: underline;
            cursor: pointer;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="phone-frame" id="phoneFrame">
    <div class="app-container" id="appContainer">
        <!-- header will be injected by JS -->
        <div id="header-placeholder"></div>
        <!-- main content -->
        <div class="content" id="content-area"></div>
        <!-- bottom nav -->
        <div class="bottom-nav" id="bottomNav"></div>
    </div>
</div>

<!-- modal container -->
<div id="modalContainer" class="hidden"></div>

<script>
    (function(){
        // ---------- SVG icon system ----------
        const icons = {
            home: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M5 12H3L12 3L21 12H19V20H13V14H11V20H5V12Z" /></svg>`,
            learn: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 5L5 8V16L12 19L19 16V8L12 5Z M12 5V19 M8 10V14 M16 10V14" /></svg>`,
            progress: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 12V20H3V12 M7 10V16 M12 7V16 M17 4V16" /></svg>`,
            settings: `<svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M19.4 15L20.8 12L19.4 9H16.8L15.4 6H8.6L7.2 9H4.6L3.2 12L4.6 15H7.2L8.6 18H15.4L16.8 15H19.4Z" /></svg>`,
            profile: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M4 20C4 17 8 15 12 15C16 15 20 17 20 20 M12 12C14.2 12 16 10.2 16 8C16 5.8 14.2 4 12 4C9.8 4 8 5.8 8 8C8 10.2 9.8 12 12 12Z" /></svg>`,
            lesson: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M4 5H20V19H4V5Z M8 9H16 M8 13H14" /></svg>`,
            chart: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M3 17V20H21V17 M7 14V10 M12 14V6 M17 14V8" /></svg>`,
            flashcards: `<svg class="icon-svg" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M8 8H16 M8 12H14 M8 16H12" /></svg>`,
            play: `<svg class="icon-svg" viewBox="0 0 24 24"><polygon points="8 6 20 12 8 18 8 6" /></svg>`,
            check: `<svg class="icon-svg" viewBox="0 0 24 24"><polyline points="4 13 9 18 20 6" /></svg>`
        };

        // ----- APP STATE -----
        let currentScreen = 'onboarding'; // screens: onboarding, home, learn, progress, settings
        let darkMode = false;
        let screenshotCounter = 0;
        const appIdea = 'Learn Python programming'; // fixed idea

        // ----- helper functions -----
        function updateTheme() {
            if (darkMode) document.body.classList.add('dark');
            else document.body.classList.remove('dark');
        }
        function showModal(content) {
            const modal = document.getElementById('modalContainer');
            modal.innerHTML = `<div class="modal"><div class="modal-card">${content}<button class="btn btn-outline" style="margin-top:16px;" onclick="document.getElementById('modalContainer').classList.add('hidden')">Close</button></div></div>`;
            modal.classList.remove('hidden');
        }

        // navigation tabs
        const navTabs = [
            { id: 'home', label: 'Home', icon: 'home' },
            { id: 'learn', label: 'Learn', icon: 'learn' },
            { id: 'progress', label: 'Progress', icon: 'progress' },
            { id: 'settings', label: 'Settings', icon: 'settings' }
        ];

        // ------ RENDER HEADER -----
        function renderHeader(title) {
            return `
                <div class="header">
                    <div class="header-left"><h1>${title}</h1></div>
                    <div class="profile-icon" id="profileBtn">${icons.profile}</div>
                </div>
            `;
        }

        // ------ RENDER BOTTOM NAV -----
        function renderBottomNav(activeId) {
            return navTabs.map(tab => `
                <button class="nav-item ${activeId === tab.id ? 'active' : ''}" data-nav="${tab.id}">
                    ${icons[tab.icon]}
                    <span>${tab.label}</span>
                </button>
            `).join('');
        }

        // ------ SCREEN RENDERERS -----
        function onboardingScreen() {
            return `
                <div style="display:flex; flex-direction:column; gap:24px; margin-top:40px;">
                    <div style="background:var(--primary); width:70px; height:70px; border-radius:22px; display:flex; align-items:center; justify-content:center; margin-bottom:8px;">
                        ${icons.flashcards.replace('class="icon-svg"', 'style="width:44px;height:44px;stroke:white;"')}
                    </div>
                    <h1 style="font-size:40px; font-weight:800; color:var(--primary);">Py<span style="color:var(--text);">Play</span></h1>
                    <p style="font-size:20px; font-weight:600; color:var(--text);">code like a pro</p>
                    <p style="color:var(--text-light); line-height:1.5;">Bite-sized Python exercises, real‑time feedback, and gamified learning. Perfect for beginners.</p>
                    <button class="btn" id="getStartedBtn" style="width:100%;">Get Started</button>
                    <div class="link-group">
                        <span id="privacyLink">Privacy Policy</span>
                        <span id="termsLink">Terms of Service</span>
                    </div>
                </div>
            `;
        }

        function homeScreen() {
            return `
                <div style="display:flex; flex-direction:column; gap:18px;">
                    <div class="card" style="display:flex; align-items:center; gap:12px;">
                        <div style="background:var(--accent); border-radius:50px; padding:12px;">${icons.play}</div>
                        <div><strong>Daily streak</strong> 🔥 12 days</div>
                        <div style="margin-left:auto; font-weight:bold; color:var(--primary);">+30 XP</div>
                    </div>
                    <div class="card">
                        <h3 style="margin-bottom:12px;">Continue learning</h3>
                        <div class="flex-row" style="justify-content:space-between;"><span>Functions</span><span>4/8</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:50%"></div></div>
                        <div class="flex-row" style="margin-top:12px;"><span>Lists</span><span>2/6</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:33%"></div></div>
                        <button class="btn btn-outline" style="width:100%; margin-top:16px;" id="homePracticeBtn">Practice now</button>
                    </div>
                    <div class="card flex-row">
                        <div><span class="badge">new</span><p style="font-weight:600;">Dictionaries</p></div>
                        <div style="margin-left:auto;">${icons.lesson}</div>
                    </div>
                </div>
            `;
        }

        function learnScreen() {
            return `
                <div style="display:flex; flex-direction:column; gap:14px;">
                    <div class="card flex-row" style="justify-content:space-between;"><span>📘 Basics I</span> <span class="badge">3/5</span></div>
                    <div class="card flex-row" style="justify-content:space-between;"><span>🐍 Loops</span> <span class="badge">0/4</span></div>
                    <div class="card flex-row" style="justify-content:space-between;"><span>📦 Functions</span> <span class="badge">4/8</span></div>
                    <div class="card" style="background:var(--accent); color:#0F172A; font-weight:600;" id="startLessonBtn">▶ Start new lesson: lists</div>
                </div>
            `;
        }

        function progressScreen() {
            return `
                <div style="display:flex; flex-direction:column; gap:16px;">
                    <div class="card">
                        <h3>Python mastery</h3>
                        <div style="margin:10px 0"><span>Overall progress</span><span style="float:right;">42%</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:42%"></div></div>
                    </div>
                    <div class="card flex-row">
                        ${icons.chart} <span>XP this week: 1240</span>
                    </div>
                    <div class="card">
                        <div class="flex-row"><span>🏆 Badges</span><span>4 collected</span></div>
                        <div style="display:flex; gap:8px; margin-top:12px;">
                            <span style="background:gold; padding:6px 12px; border-radius:30px;">🔥 7d streak</span>
                            <span style="background:silver; padding:6px 12px; border-radius:30px;">⚡ 50 loops</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function settingsScreen() {
            return `
                <div style="display:flex; flex-direction:column; gap:12px;">
                    <div class="card flex-row" style="justify-content:space-between;">
                        <span>Dark mode</span>
                        <label class="switch"><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}></label>
                    </div>
                    <div class="card flex-row" style="justify-content:space-between;"><span>Sound</span><span>🔛</span></div>
                    <div class="card flex-row" style="justify-content:space-between;"><span>Language</span><span>English</span></div>
                    <div class="card" id="profileSettingsBtn" style="cursor:pointer;">👤 Profile (icon click also works)</div>
                </div>
            `;
        }

        // render active screen
        function renderScreen(screen) {
            const contentDiv = document.getElementById('content-area');
            const headerPlace = document.getElementById('header-placeholder');
            let headerTitle = 'Python';
            if (screen === 'onboarding') headerTitle = 'Welcome';
            else if (screen === 'home') headerTitle = 'Home';
            else if (screen === 'learn') headerTitle = 'Lessons';
            else if (screen === 'progress') headerTitle = 'Stats';
            else if (screen === 'settings') headerTitle = 'Settings';
            headerPlace.innerHTML = renderHeader(headerTitle);

            if (screen === 'onboarding') contentDiv.innerHTML = onboardingScreen();
            else if (screen === 'home') contentDiv.innerHTML = homeScreen();
            else if (screen === 'learn') contentDiv.innerHTML = learnScreen();
            else if (screen === 'progress') contentDiv.innerHTML = progressScreen();
            else if (screen === 'settings') contentDiv.innerHTML = settingsScreen();

            document.getElementById('bottomNav').innerHTML = renderBottomNav(screen === 'onboarding' ? 'home' : screen);
            attachEvents(screen);
        }

        // event binding
        function attachEvents(screen) {
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const navId = btn.dataset.nav;
                    if (navId === 'home') currentScreen = 'home';
                    else if (navId === 'learn') currentScreen = 'learn';
                    else if (navId === 'progress') currentScreen = 'progress';
                    else if (navId === 'settings') currentScreen = 'settings';
                    renderScreen(currentScreen);
                });
            });

            document.getElementById('profileBtn')?.addEventListener('click', () => {
                currentScreen = 'settings';
                renderScreen('settings');
            });

            // onboarding
            if (screen === 'onboarding') {
                document.getElementById('getStartedBtn')?.addEventListener('click', () => {
                    currentScreen = 'home';
                    renderScreen('home');
                });
                document.getElementById('privacyLink')?.addEventListener('click', () => showModal('<h3>📄 Privacy Policy</h3><p>Your data stays local. No tracking.</p>'));
                document.getElementById('termsLink')?.addEventListener('click', () => showModal('<h3>📜 Terms</h3><p>Keep learning, be respectful.</p>'));
            }

            if (screen === 'settings') {
                const toggle = document.getElementById('darkToggle');
                if (toggle) {
                    toggle.checked = darkMode;
                    toggle.addEventListener('change', (e) => {
                        darkMode = e.target.checked;
                        updateTheme();
                        renderScreen(currentScreen); // refresh for toggle appearance
                    });
                }
                document.getElementById('profileSettingsBtn')?.addEventListener('click', () => {
                    showModal('<h3>👤 Pythonista</h3><p>Level: 8 · 1240 XP</p>');
                });
            }

            // start lesson simulation
            const startBtn = document.getElementById('startLessonBtn') || document.getElementById('homePracticeBtn');
            if (startBtn) {
                startBtn.addEventListener('click', () => {
                    currentScreen = 'learn';
                    renderScreen('learn');
                });
            }
        }

        // ------ screenshot (SHIFT+W) ------
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                screenshotCounter++;
                const frame = document.getElementById('phoneFrame');
                // In real prototype we just log; but we simulate naming
                let filename = screenshotCounter + '.png';
                if (darkMode && screenshotCounter <= 5) filename = '6.png'; // dark override
                else if (!darkMode && screenshotCounter <=5) filename = screenshotCounter + '.png';
                else filename = (darkMode ? '6' : (screenshotCounter % 5+1)) + '.png';
                alert(`📸 Screenshot saved as ${filename} (simulated)`);
            }
        });

        // ---- start ----
        renderScreen('onboarding');

        // expose for inline modal close
        window.closeModal = () => document.getElementById('modalContainer').classList.add('hidden');

        // final JSON titles (display at bottom)
        window.jsonTitles = {
            "1.png": "Start Learning",
            "2.png": "Daily Lessons",
            "3.png": "Practice Skills",
            "4.png": "Track Progress",
            "5.png": "Smart Settings",
            "6.png": "Dark Theme"
        };
    })();
</script>
<!-- inline style for switch -->
<style>
.switch { position: relative; display: inline-block; width: 44px; height: 24px; }
.switch input { opacity:0; width:0; height:0; }
.switch:before { content:''; position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background:var(--grey); border-radius:34px; transition:0.2s; }
.switch:after { content:''; position:absolute; height:20px; width:20px; left:2px; bottom:2px; background:white; border-radius:50%; transition:0.2s; }
input:checked + .switch:before { background:var(--primary); }
input:checked + .switch:after { transform:translateX(20px); }
</style>
<script>
    // final JSON output
    console.log(JSON.stringify(window.jsonTitles, null, 2));
    document.currentScript?.remove();
</script>
</body>
</html>
All done!
