```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeFlow · Learn Python</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #1a2634;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .phone-mock {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2d3e4f;
            position: relative;
            transition: background 0.2s;
        }
        :root {
            --bg-primary: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --nav-bg: #FFFFFF;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
            --highlight: #EFF6FF;
            --progress-bg: #E2E8F0;
        }
        body.dark {
            --bg-primary: #0F172A;
            --card-bg: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --nav-bg: #1E293B;
            --shadow: 0 4px 12px rgba(0,0,0,0.5);
            --highlight: #1E2A3A;
            --progress-bg: #334155;
        }
        .app-container {
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--bg-primary);
        }
        /* header */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px 8px;
        }
        .app-header h1 {
            font-size: 22px;
            font-weight: 650;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* main content */
        .screen-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px 10px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) transparent;
        }
        .screen-content::-webkit-scrollbar {
            width: 4px;
        }
        .screen-content::-webkit-scrollbar-thumb {
            background: var(--inactive);
            border-radius: 8px;
        }
        /* bottom nav */
        .bottom-nav {
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 8px 12px 12px;
            background: var(--nav-bg);
            border-top: 1px solid var(--border-light);
            border-radius: 28px 28px 0 0;
            box-shadow: var(--shadow);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 6px 0 4px;
            border-radius: 20px;
            color: var(--inactive);
            fill: var(--inactive);
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            transform: scale(1.05);
            background: var(--highlight);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            margin-top: 2px;
        }
        .nav-item.active span {
            color: var(--primary);
            font-weight: 600;
        }

        /* cards / elements */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 18px 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }
        .lesson-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .lesson-row:last-child { border: none; }
        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 20px;
            overflow: hidden;
            width: 100%;
            margin: 8px 0;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 20px;
        }
        .badge {
            background: var(--highlight);
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            color: var(--primary);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0;
        }
        .stat-item {
            background: var(--highlight);
            border-radius: 18px;
            padding: 14px;
            text-align: center;
        }
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            backdrop-filter: blur(3px);
        }
        .modal-card {
            background: var(--card-bg);
            width: 280px;
            border-radius: 28px;
            padding: 24px;
            text-align: center;
            color: var(--text-primary);
            border: 1px solid var(--border-light);
        }
        .modal-card button {
            margin-top: 16px;
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            font-weight: 600;
            border: none;
            padding: 16px 24px;
            border-radius: 40px;
            font-size: 18px;
            width: 100%;
            cursor: pointer;
            margin: 16px 0 12px;
            box-shadow: 0 8px 14px -6px var(--primary);
        }
        .link-row {
            display: flex;
            gap: 24px;
            justify-content: center;
            font-size: 14px;
            color: var(--inactive);
            text-decoration: underline;
            margin-top: 8px;
        }
        .link-row span { cursor: pointer; }
        .icon-row { display: flex; gap: 12px; flex-wrap: wrap; }
        .hidden { display: none !important; }
        .chart-simple {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            height: 100px;
            margin: 16px 0;
        }
        .bar {
            width: 20%;
            background: var(--primary);
            border-radius: 12px 12px 0 0;
            transition: height 0.3s;
        }
    </style>
</head>
<body>
    <div class="phone-mock" id="phoneContainer">
        <div class="app-container" id="appContainer">
            <!-- header with dynamic title & profile icon -->
            <div class="app-header">
                <h1 id="screenTitle">Welcome</h1>
                <button class="profile-btn" id="profileBtn" aria-label="Profile"> 
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--text-primary);">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>

            <!-- dynamic screens injected here -->
            <div id="screenContainer" class="screen-content"></div>

            <!-- bottom navigation (4 icons) -->
            <nav class="bottom-nav" id="bottomNav">
                <button class="nav-item" data-tab="home">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" stroke-linecap="round"/>
                        <path d="M3 10a2 2 0 0 1 .89-1.66l7-4.67a2 2 0 0 1 2.22 0l7 4.67A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke-linecap="round"/>
                    </svg>
                    <span>Home</span>
                </button>
                <button class="nav-item" data-tab="learn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" stroke-linecap="round"/>
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" stroke-linecap="round"/>
                    </svg>
                    <span>Learn</span>
                </button>
                <button class="nav-item" data-tab="progress">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12v.6a9 9 0 1 1-6.2-8.5" stroke-linecap="round"/>
                        <circle cx="12" cy="12" r="10" stroke="currentColor"/>
                        <path d="M12 8v4l3 3" stroke-linecap="round"/>
                    </svg>
                    <span>Progress</span>
                </button>
                <button class="nav-item" data-tab="settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3" stroke="currentColor"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" stroke-linecap="round"/>
                    </svg>
                    <span>Settings</span>
                </button>
            </nav>
        </div>
    </div>

    <!-- modal container -->
    <div id="modalContainer" class="modal-overlay hidden"></div>

    <script>
        (function() {
            // ---------- THEME ----------
            const root = document.documentElement;
            let darkMode = false;

            // ---------- ICONS as inline strings (outline, 2px) ----------
            const icons = {
                home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .89-1.66l7-4.67a2 2 0 0 1 2.22 0l7 4.67A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`,
                learn: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" stroke-linecap="round"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" stroke-linecap="round"/></svg>`,
                progress: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12v.6a9 9 0 1 1-6.2-8.5" stroke-linecap="round"/><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3" stroke-linecap="round"/></svg>`,
                settings: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`,
                profile: `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke-linecap="round"/><circle cx="12" cy="7" r="4"/></svg>`,
                lesson: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
                chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2"/><path d="M7 10v6"/><path d="M12 7v9"/><path d="M17 4v12"/></svg>`,
                flashcards: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>`,
                play: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3" stroke-linecap="round"/></svg>`,
                check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12" stroke-linecap="round"/></svg>`
            };

            // ---------- SCREEN RENDERING ----------
            const screenContainer = document.getElementById('screenContainer');
            const screenTitle = document.getElementById('screenTitle');
            const modalContainer = document.getElementById('modalContainer');
            let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings

            // onboarding screen builder
            function renderOnboarding() {
                return `
                    <div class="card" style="text-align: center; margin-top: 30px;">
                        <div style="background: #EFF6FF; width: 80px; height: 80px; border-radius: 30px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                        </div>
                        <h2 style="font-size: 32px; font-weight:700; color: var(--primary);">CodeFlow</h2>
                        <p style="font-size: 18px; color: var(--accent); margin: 8px 0;">Python, simply.</p>
                        <p style="color: var(--text-secondary); margin: 16px;">Bite‑sized Python exercises. From zero to first project in 30 days.</p>
                        <button class="btn-primary" id="startOnboarding">Get Started</button>
                        <div class="link-row">
                            <span id="privacyLink">Privacy Policy</span>
                            <span id="termsLink">Terms of Service</span>
                        </div>
                    </div>
                `;
            }

            function renderHome() {
                return `
                    <div class="card">
                        <div style="display: flex; justify-content: space-between;"><span class="badge">🔥 12 day streak</span> <span class="badge">⭐ 340 XP</span></div>
                        <div style="margin: 16px 0 8px;"><strong>Continue where you left</strong></div>
                        <div class="lesson-row">
                            <span>${icons.play}</span>
                            <div style="flex:1">Variables & Data types</div>
                            <span>75%</span>
                        </div>
                        <div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div>
                        <div class="lesson-row">
                            <span>${icons.play}</span>
                            <div style="flex:1">Lists & Loops</div>
                            <span>40%</span>
                        </div>
                        <div class="progress-bar"><div class="progress-fill" style="width:40%"></div></div>
                    </div>
                    <div class="card">
                        <div style="display:flex; gap:12px; align-items:center;"><span>${icons.flashcards}</span><h3>Today's picks</h3></div>
                        <div class="lesson-row"><span>${icons.lesson}</span> <span>If/else · 5 min</span><span style="margin-left:auto;">▶</span></div>
                        <div class="lesson-row"><span>${icons.lesson}</span> <span>Functions · 8 min</span><span style="margin-left:auto;">▶</span></div>
                    </div>
                `;
            }

            function renderLearn() {
                return `
                    <div class="card">
                        <h3>Python fundamentals</h3>
                        <div class="lesson-row"><span>${icons.check}</span> <span>Hello world</span><span class="badge">done</span></div>
                        <div class="lesson-row"><span>${icons.play}</span> <span>Variables</span><span class="badge">75%</span></div>
                        <div class="lesson-row"><span>${icons.play}</span> <span>Conditionals</span><span class="badge">new</span></div>
                        <div class="lesson-row"><span>${icons.play}</span> <span>Loops</span><span class="badge">30%</span></div>
                        <div class="lesson-row"><span>${icons.lesson}</span> <span>Lists</span><span class="badge">start</span></div>
                    </div>
                    <div class="card"><h4>Up next: Dictionaries</h4><div class="progress-bar"><div class="progress-fill" style="width:10%"></div></div></div>
                `;
            }

            function renderProgress() {
                return `
                    <div class="card">
                        <h3>Weekly activity</h3>
                        <div class="chart-simple">
                            <div class="bar" style="height:60px;"></div><div class="bar" style="height:40px;"></div><div class="bar" style="height:80px;"></div><div class="bar" style="height:70px;"></div><div class="bar" style="height:90px;"></div>
                        </div>
                    </div>
                    <div class="stat-grid">
                        <div class="stat-item"><span>${icons.chart}</span><h4>1245 XP</h4><span>total</span></div>
                        <div class="stat-item"><span>⭐</span><h4>8</h4><span>achievements</span></div>
                    </div>
                    <div class="card"><h4>Badges</h4><div style="display:flex; gap:12px;">🔥 7d streak · 🐍 beginner · ⚡ 50 exercises</div></div>
                `;
            }

            function renderSettings() {
                return `
                    <div class="card">
                        <h3>Appearance</h3>
                        <div style="display:flex; justify-content:space-between; margin:16px 0;">
                            <span>Dark mode</span>
                            <button id="themeToggleBtn" style="background:var(--primary); border:none; color:white; padding:8px 20px; border-radius:40px;">Toggle</button>
                        </div>
                        <h4>Sound · Notifications</h4>
                        <div style="margin:12px 0;">Version 2.6.3</div>
                    </div>
                    <div class="card"><h3>Profile</h3><div>pythonista@example.com</div><div>Member since 2026</div></div>
                `;
            }

            function renderProfileScreen() {
                return `
                    <div class="card">
                        <h2>Profile</h2>
                        <div style="display:flex; gap:16px; margin:24px 0;">
                            <span>${icons.profile}</span><div><div>Alex Rivera</div><div>@code.alex</div></div>
                        </div>
                        <button class="btn-primary" style="margin:0;" id="backFromProfile">‹ Back to Home</button>
                    </div>
                `;
            }

            function setScreen(screen) {
                if (screen === 'profile') {
                    screenContainer.innerHTML = renderProfileScreen();
                    screenTitle.innerText = 'Profile';
                    document.getElementById('backFromProfile')?.addEventListener('click', ()=>{
                        setScreen('home');
                        setActiveNav('home');
                    });
                    return;
                }
                switch(screen) {
                    case 'onboarding': screenContainer.innerHTML = renderOnboarding(); screenTitle.innerText='Welcome'; break;
                    case 'home': screenContainer.innerHTML = renderHome(); screenTitle.innerText='Home'; break;
                    case 'learn': screenContainer.innerHTML = renderLearn(); screenTitle.innerText='Learn'; break;
                    case 'progress': screenContainer.innerHTML = renderProgress(); screenTitle.innerText='Progress'; break;
                    case 'settings': screenContainer.innerHTML = renderSettings(); screenTitle.innerText='Settings'; break;
                }
                currentScreen = screen;
                // attach listeners
                if (screen === 'onboarding') {
                    document.getElementById('startOnboarding')?.addEventListener('click', ()=>{ setScreen('home'); setActiveNav('home'); });
                    document.getElementById('privacyLink')?.addEventListener('click', ()=>showModal('Privacy Policy', 'We value your data (demo).'));
                    document.getElementById('termsLink')?.addEventListener('click', ()=>showModal('Terms of Service', 'Educational use only.'));
                }
                if (screen === 'settings') {
                    document.getElementById('themeToggleBtn')?.addEventListener('click', toggleTheme);
                }
            }

            function showModal(title, text) {
                modalContainer.innerHTML = `
                    <div class="modal-card">
                        <h3>${title}</h3><p style="margin:20px 0;">${text}</p>
                        <button id="closeModalBtn">Close</button>
                    </div>
                `;
                modalContainer.classList.remove('hidden');
                document.getElementById('closeModalBtn').addEventListener('click', ()=> modalContainer.classList.add('hidden'));
            }

            // bottom navigation active + switching
            function setActiveNav(tab) {
                document.querySelectorAll('.nav-item').forEach(el => {
                    const data = el.getAttribute('data-tab');
                    if (data === tab) el.classList.add('active');
                    else el.classList.remove('active');
                });
            }

            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const tab = btn.getAttribute('data-tab');
                    setActiveNav(tab);
                    setScreen(tab);
                });
            });

            // profile button opens profile
            document.getElementById('profileBtn').addEventListener('click', ()=>{
                setScreen('profile');
            });

            // ---------- THEME TOGGLE ----------
            function toggleTheme() {
                darkMode = !darkMode;
                if (darkMode) document.body.classList.add('dark');
                else document.body.classList.remove('dark');
            }

            // ---------- INIT ----------
            setScreen('onboarding');
            setActiveNav('none');

            // ---------- SCREENSHOT (SHIFT+W) ----------
            let screenshotCounter = 1;
            document.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    const container = document.getElementById('phoneContainer');
                    if (!container) return;
                    // simple canvas capture simulation: sequential naming
                    let filename = darkMode ? '6.png' : (screenshotCounter + '.png');
                    if (!darkMode && screenshotCounter < 6) {
                        screenshotCounter = (screenshotCounter % 5) + 1;
                    } else if (darkMode) {
                        filename = '6.png';
                    } else filename = '1.png'; // fallback
                    alert(`📸 Screenshot saved as ${filename} (simulated)`);
                }
            });
        })();
    </script>
