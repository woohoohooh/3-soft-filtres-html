```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Champ • mobile app</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #1a2639;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background-color: var(--bg-primary);
      border-radius: 48px;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.4), 0 0 0 10px #2d3b4f;
      overflow: hidden;
      position: relative;
      transition: background-color 0.2s;
    }

    /* main app screen (flex column) */
    .app-screen {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      background-color: var(--bg-primary);
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px 12px 20px;
      background-color: var(--card-bg);
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .header .title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }
    .profile-btn:hover { transform: scale(1.05); }
    .profile-btn svg { width: 28px; height: 28px; stroke: var(--text-primary); stroke-width: 2; fill: none; }

    /* main content */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 8px 16px;
      background-color: var(--bg-primary);
      scrollbar-width: thin;
      scrollbar-color: var(--primary) var(--card-bg);
    }
    .content::-webkit-scrollbar { width: 5px; }
    .content::-webkit-scrollbar-track { background: var(--card-bg); }
    .content::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 20px; }

    /* bottom nav */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background-color: var(--card-bg);
      padding: 8px 6px 10px 6px;
      border-top: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 -2px 8px rgba(0,0,0,0.02);
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px 0 4px;
      border-radius: 20px;
      transition: all 0.15s ease;
      color: var(--text-secondary);
      fill: none;
    }
    .nav-item svg {
      width: 24px;
      height: 24px;
      stroke-width: 2;
      stroke: currentColor;
      transition: transform 0.15s, stroke 0.15s;
    }
    .nav-item span {
      font-size: 11px;
      font-weight: 500;
      margin-top: 4px;
      color: currentColor;
    }
    .nav-item.active {
      color: var(--primary);
      background-color: rgba(37, 99, 235, 0.08);
      transform: scale(1.02);
    }
    .nav-item.active svg { transform: scale(1.1); stroke-width: 2.4; }
    .nav-item.inactive { color: var(--text-secondary); }

    /* cards / common */
    .card {
      background-color: var(--card-bg);
      border-radius: 24px;
      padding: 18px 16px;
      margin-bottom: 16px;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.02), 0 2px 4px rgba(0,20,50,0.05);
      border: 1px solid rgba(0,0,0,0.02);
    }

    .flex-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge {
      background-color: var(--accent-light);
      color: var(--primary-dark);
      font-weight: 600;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 40px;
    }

    .progress-bar {
      height: 8px;
      background-color: var(--border-light);
      border-radius: 20px;
      margin: 12px 0 6px;
      overflow: hidden;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 20px;
      transition: width 0.3s ease;
    }

    /* buttons */
    .btn-primary {
      background-color: var(--primary);
      border: none;
      color: white;
      font-weight: 700;
      font-size: 16px;
      padding: 16px 20px;
      border-radius: 60px;
      width: 100%;
      cursor: pointer;
      transition: 0.1s;
      box-shadow: 0 8px 18px rgba(37,99,235,0.2);
    }
    .btn-primary:active { transform: scale(0.98); background-color: var(--primary-dark); }

    .link-small {
      font-size: 13px;
      color: var(--text-tertiary);
      text-decoration: none;
      margin: 0 8px;
    }

    /* modal overlay (simple) */
    .modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      backdrop-filter: blur(3px);
    }
    .modal-content {
      background-color: var(--card-bg);
      width: 280px;
      padding: 28px 20px;
      border-radius: 32px;
      text-align: center;
      color: var(--text-primary);
      box-shadow: 0 30px 40px #00000030;
    }
    .modal-content button {
      margin-top: 24px;
      background-color: var(--primary);
      border: none;
      color: white;
      padding: 12px 32px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
    }

    /* dark / light vars */
    :root {
      --bg-primary: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #64748B;
      --text-tertiary: #94A3B8;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --accent-light: #E0F2FE;
      --border-light: #E2E8F0;
    }
    .dark-mode {
      --bg-primary: #0F172A;
      --card-bg: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #94A3B8;
      --text-tertiary: #64748B;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --accent-light: #1E3A5F;
      --border-light: #334155;
    }

    /* onboarding specific */
    .logo-box {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .app-name {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
    }
    .tagline {
      font-size: 18px;
      font-weight: 600;
      margin: 12px 0 8px;
    }
    .lesson-item {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }
    .icon-bg {
      background-color: var(--accent-light);
      padding: 8px;
      border-radius: 18px;
    }
    /* chart mock */
    .chart-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 100px;
      margin: 16px 0;
    }
    .chart-bar {
      flex: 1;
      background: linear-gradient(to top, var(--primary), var(--accent));
      border-radius: 12px 12px 6px 6px;
      height: 0px;
      transition: height 0.5s;
    }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <div class="app-screen" id="appScreen">
    <!-- header dynamically set by js -->
    <div class="header" id="mainHeader">
      <span class="title" id="headerTitle">Python Champ</span>
      <button class="profile-btn" id="profileBtn" aria-label="profile">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></svg>
      </button>
    </div>

    <!-- main content area (views injected) -->
    <div class="content" id="viewContainer"></div>

    <!-- bottom navigation (4 items) -->
    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-item" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Home</span></button>
      <button class="nav-item" data-nav="learn"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span>Learn</span></button>
      <button class="nav-item" data-nav="progress"><svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><span>Progress</span></button>
      <button class="nav-item" data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 18a10 10 0 0 0 6.36-2.22z"/><path d="M16.5 6.5 19 9"/><path d="M7.5 6.5 5 9"/></svg><span>Settings</span></button>
    </nav>
  </div>
</div>

<!-- hidden canvas for screenshot -->
<canvas id="screenshotCanvas" style="display:none;"></canvas>

<script>
  (function(){
    // ---------- THEME & VARIABLES ----------
    let currentTheme = 'light';        // default
    let currentView = 'onboarding';    // onboarding, home, learn, progress, settings
    let modalContent = null;           // 'privacy' or 'terms'
    let darkMode = false;

    const viewContainer = document.getElementById('viewContainer');
    const headerTitle = document.getElementById('headerTitle');
    const profileBtn = document.getElementById('profileBtn');
    const bottomNav = document.getElementById('bottomNav');
    const phoneContainer = document.getElementById('phoneContainer');

    // ---------- ICON SYSTEM (inline svg) ----------
    const icons = {
      home: '<svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
      learn: '<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
      progress: '<svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',
      settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 18a10 10 0 0 0 6.36-2.22z"/><path d="M16.5 6.5 19 9"/><path d="M7.5 6.5 5 9"/></svg>',
      profile: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></svg>',
      lesson: '<svg viewBox="0 0 24 24"><path d="M12 2v4M12 22v-4M4 12H2M22 12h-2M6 6l-2-2M20 20l-2-2M6 18l-2 2M20 4l-2 2"/><circle cx="12" cy="12" r="4"/></svg>',
      chart: '<svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',
      flashcards: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18"/></svg>',
      play: '<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
      check: '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
    };

    // ---------- SCREEN RENDER ----------
    function renderView(view) {
      if (view === 'onboarding') renderOnboarding();
      else if (view === 'home') renderHome();
      else if (view === 'learn') renderLearn();
      else if (view === 'progress') renderProgress();
      else if (view === 'settings') renderSettings();

      // update active tab in bottom nav (except onboarding)
      const navItems = document.querySelectorAll('.nav-item');
      navItems.forEach(item => {
        const nav = item.getAttribute('data-nav');
        if (view !== 'onboarding' && nav === view) {
          item.classList.add('active');
          item.classList.remove('inactive');
        } else {
          item.classList.remove('active');
          item.classList.add('inactive');
        }
      });

      // header title update
      if (view === 'onboarding') headerTitle.innerText = 'Welcome';
      else if (view === 'home') headerTitle.innerText = 'Home';
      else if (view === 'learn') headerTitle.innerText = 'Lessons';
      else if (view === 'progress') headerTitle.innerText = 'Your stats';
      else if (view === 'settings') headerTitle.innerText = 'Settings';
    }

    // ----- onboarding -----
    function renderOnboarding() {
      let html = `
        <div class="card" style="background:transparent; box-shadow:none; border:none;">
          <div class="logo-box"><span class="app-name">🐍 Python Champ</span></div>
          <div class="tagline">learn to code, one bite at a time</div>
          <p style="color: var(--text-secondary); margin-bottom: 28px;">Interactive Python exercises, daily challenges, and real code practice. No experience needed.</p>
          <button class="btn-primary" id="getStartedBtn">Get Started</button>
          <div style="text-align:center; margin: 28px 0 16px;">
            <a href="#" class="link-small" id="privacyLink">Privacy Policy</a> • <a href="#" class="link-small" id="termsLink">Terms of Service</a>
          </div>
        </div>
      `;
      viewContainer.innerHTML = html;
      document.getElementById('getStartedBtn').addEventListener('click', ()=>{
        currentView = 'home';
        renderView('home');
      });
      document.getElementById('privacyLink').addEventListener('click', (e)=>{
        e.preventDefault(); showModal('privacy');
      });
      document.getElementById('termsLink').addEventListener('click', (e)=>{
        e.preventDefault(); showModal('terms');
      });
    }

    // ----- home dashboard (rich) -----
    function renderHome() {
      let html = `
        <div class="card">
          <div class="flex-row"><span style="font-weight:600;">🔥 daily streak</span><span class="badge">7 days</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
          <div style="display:flex; gap:10px; margin-top:14px;">
            <span style="background: var(--accent-light); padding:6px 16px; border-radius:30px;">🐍 48 XP</span>
            <span style="background: var(--accent-light); padding:6px 16px; border-radius:30px;">⭐ level 3</span>
          </div>
        </div>
        <div class="card">
          <div class="flex-row"><span style="font-weight:600;">continue learning</span><span>▶ 2 min</span></div>
          <div class="lesson-item"><span class="icon-bg">${icons.lesson}</span><div><div>Variables & Data types</div><div class="progress-bar" style="width:70%"><div class="progress-fill" style="width:45%"></div></div></div></div>
          <div class="lesson-item"><span class="icon-bg">${icons.flashcards}</span><div><div>Loops (flashcards)</div><div class="progress-bar"><div class="progress-fill" style="width:20%"></div></div></div></div>
          <button class="btn-primary" style="margin-top:8px;" id="homeToLearn">resume</button>
        </div>
        <div class="card">
          <div class="flex-row"><span style="font-weight:600;">🏆 achievements</span></div>
          <div style="display:flex; gap:12px; margin:12px 0;">
            <span style="background:gold; padding:8px; border-radius:50%;">🔥</span><span>7 day streak</span>
            <span style="background:silver; padding:8px; border-radius:50%;">⚡</span><span>first code</span>
          </div>
        </div>
      `;
      viewContainer.innerHTML = html;
      document.getElementById('homeToLearn')?.addEventListener('click', ()=>{
        currentView = 'learn'; renderView('learn');
      });
    }

    // ----- learn / practice -----
    function renderLearn() {
      let html = `
        <div class="card">
          <div class="flex-row"><span style="font-weight:600;">📘 Python basics</span><span>${icons.play} start</span></div>
          <div class="lesson-item"><span>✔️ print()</span><span class="badge">new</span></div>
          <div class="lesson-item"><span>✔️ if/else</span><span class="badge">quiz</span></div>
          <div class="lesson-item"><span>✔️ loops</span><span class="badge">practice</span></div>
          <button class="btn-primary" style="margin-top:10px;" id="mockPractice">start practice</button>
        </div>
        <div class="card">
          <span style="font-weight:600;">📚 today's challenge</span>
          <p style="margin:12px 0;">Fix the function to return sum of list</p>
          <div style="background:var(--bg-primary); padding:16px; border-radius:16px;">def sum_list(nums): <br> &nbsp;&nbsp; # your code</div>
          <button class="btn-primary" style="margin-top:16px;">run ▶</button>
        </div>
      `;
      viewContainer.innerHTML = html;
      document.getElementById('mockPractice')?.addEventListener('click', ()=>{
        alert('practice session started (mock)');
      });
    }

    // ----- progress / statistics + chart animation -----
    function renderProgress() {
      let html = `
        <div class="card">
          <div class="flex-row"><span style="font-weight:600;">📈 weekly activity</span></div>
          <div class="chart-row" id="chartRow">
            <div class="chart-bar" style="height:40px"></div>
            <div class="chart-bar" style="height:70px"></div>
            <div class="chart-bar" style="height:55px"></div>
            <div class="chart-bar" style="height:80px"></div>
            <div class="chart-bar" style="height:30px"></div>
            <div class="chart-bar" style="height:95px"></div>
            <div class="chart-bar" style="height:65px"></div>
          </div>
          <div class="flex-row"><span>total lessons: 28</span><span>⚡ 340 XP</span></div>
        </div>
        <div class="card">
          <div class="flex-row"><span style="font-weight:600;">🏅 skill mastery</span></div>
          <div>basics <span style="float:right;">80%</span><div class="progress-bar"><div class="progress-fill" style="width:80%"></div></div></div>
          <div>functions <span style="float:right;">45%</span><div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div></div>
          <div>OOP <span style="float:right;">20%</span><div class="progress-bar"><div class="progress-fill" style="width:20%"></div></div></div>
        </div>
      `;
      viewContainer.innerHTML = html;
      // animate bars after render
      setTimeout(() => {
        const bars = document.querySelectorAll('.chart-bar');
        bars.forEach((b, idx) => {
          const val = [40,70,55,80,30,95,65][idx];
          b.style.height = val + 'px';
        });
      }, 30);
    }

    // ----- settings (with theme toggle) -----
    function renderSettings() {
      let html = `
        <div class="card">
          <div class="flex-row"><span>🌓 Dark mode</span>
            <label style="font-size:20px;"><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}> toggle</label>
          </div>
        </div>
        <div class="card">
          <div>account: pythonista@example.com</div>
          <div style="margin-top:12px;">notifications on</div>
          <div style="margin-top:12px;">sound effects</div>
        </div>
        <div class="card">
          <div>app version 2.6.0</div>
        </div>
      `;
      viewContainer.innerHTML = html;
      const toggle = document.getElementById('darkToggle');
      if (toggle) {
        toggle.addEventListener('change', (e) => {
          darkMode = e.target.checked;
          if (darkMode) phoneContainer.classList.add('dark-mode');
          else phoneContainer.classList.remove('dark-mode');
          // re-render settings to reflect (but keep current view)
          if (currentView === 'settings') renderSettings(); 
          else renderView(currentView); 
        });
      }
    }

    // modal for privacy/terms
    function showModal(type) {
      const title = type === 'privacy' ? 'Privacy Policy' : 'Terms of Service';
      const body = type === 'privacy' ? 'We respect your data. (mock)' : 'Keep learning = accept terms. (mock)';
      const modalDiv = document.createElement('div');
      modalDiv.className = 'modal';
      modalDiv.id = 'genericModal';
      modalDiv.innerHTML = `<div class="modal-content"><h3>${title}</h3><p style="margin:20px 0;">${body}</p><button id="closeModalBtn">Close</button></div>`;
      phoneContainer.appendChild(modalDiv);
      document.getElementById('closeModalBtn').addEventListener('click', ()=>{
        document.getElementById('genericModal').remove();
      });
    }

    // navigation + profile button
    function setupNavigation() {
      // bottom nav
      bottomNav.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const nav = btn.getAttribute('data-nav');
          if (nav === 'home' || nav === 'learn' || nav === 'progress' || nav === 'settings') {
            currentView = nav;
            renderView(nav);
          }
        });
      });
      // profile click -> settings screen
      profileBtn.addEventListener('click', ()=>{
        currentView = 'settings';
        renderView('settings');
      });
    }

    // INIT: onboarding first
    renderView('onboarding');
    setupNavigation();

    // ---------- SCREENSHOT (SHIFT+W) ----------
    let screenshotCounter = 1;
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        captureScreenshot();
      }
    });

    function captureScreenshot() {
