```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic Puzzles · Brain training</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --progress-bg: #E2E8F0;
            --shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,20,40,0.05);
            --header-icon: #334155;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --progress-bg: #334155;
            --shadow: 0 8px 20px rgba(0,0,0,0.4);
            --header-icon: #CBD5E1;
        }

        body {
            background: #1a2635;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 44px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2d3e5a;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background-color 0.2s;
        }

        /* main app screen (visible content) */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: var(--bg);
        }

        /* header */
        .header {
            padding: 16px 20px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 650;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .profile-btn {
            background: none;
            border: none;
            padding: 8px 4px;
            cursor: pointer;
            color: var(--header-icon);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* main content area (dynamic) */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 8px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) transparent;
        }

        .content::-webkit-scrollbar {
            width: 4px;
        }
        .content::-webkit-scrollbar-thumb {
            background-color: var(--inactive);
            border-radius: 8px;
        }

        /* bottom navigation */
        .bottom-nav {
            background-color: var(--card);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 10px;
            border-top: 1px solid var(--border-light);
            box-shadow: var(--shadow);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 12px 4px;
            border-radius: 24px;
            transition: all 0.15s ease;
            color: var(--inactive);
            fill: var(--inactive);
        }

        .nav-item.active {
            background: rgba(37, 99, 235, 0.08);
            color: var(--primary);
            fill: var(--primary);
            transform: scale(1.05);
        }

        .nav-item.active svg {
            stroke: var(--primary);
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2px;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.1s;
        }

        .nav-label {
            font-size: 11px;
            font-weight: 500;
            margin-top: 4px;
            color: currentColor;
        }

        /* card styles */
        .card {
            background-color: var(--card);
            border-radius: 24px;
            padding: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .row {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
        }

        .progress-bar {
            height: 10px;
            background: var(--progress-bg);
            border-radius: 20px;
            overflow: hidden;
            margin: 12px 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            border-radius: 20px;
            transition: width 0.3s;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 40px;
            padding: 16px 24px;
            font-weight: 600;
            font-size: 18px;
            width: 100%;
            cursor: pointer;
            transition: 0.1s;
        }
        .btn:active { background: var(--primary-dark); }

        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 16px 0 8px;
            font-size: 13px;
        }
        .link-row button {
            background: none;
            border: none;
            color: var(--inactive);
            text-decoration: underline;
            cursor: pointer;
        }

        /* modal */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: var(--card);
            width: 280px;
            border-radius: 32px;
            padding: 24px;
            color: var(--text-primary);
            box-shadow: 0 20px 30px #00000055;
        }
        .modal p { margin: 12px 0; }
        .modal-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            float: right;
        }

        /* icon sprite (hidden) */
        .icon-defs { display: none; }

        /* demo chart */
        .chart-row {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 80px;
            margin-top: 10px;
        }
        .bar {
            flex: 1;
            background: var(--primary);
            height: calc(100% - 20px);
            border-radius: 8px 8px 0 0;
            transition: height 0.3s;
        }
        .bar-label { font-size: 10px; text-align: center; margin-top: 4px; }

        /* toggle */
        .toggle-switch {
            width: 48px;
            height: 24px;
            background: var(--inactive);
            border-radius: 40px;
            display: inline-block;
            position: relative;
            cursor: pointer;
        }
        .toggle-switch::after {
            content: '';
            width: 20px; height: 20px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px; left: 2px;
            transition: 0.2s;
        }
        .dark .toggle-switch::after { left: 26px; }

    </style>
</head>
<body>
    <div class="phone" id="phoneContainer">
        <div class="app-screen" id="appScreen">
            <!-- header (dynamic via js) -->
            <div class="header" id="appHeader">
                <h1 id="headerTitle">Onboarding</h1>
                <button class="profile-btn" id="profileBtn">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </button>
            </div>

            <!-- dynamic content -->
            <div class="content" id="contentArea"></div>

            <!-- bottom nav -->
            <div class="bottom-nav" id="bottomNav">
                <button class="nav-item" data-tab="home">
                    <svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2h-5v-8h-4v8H5a2 2 0 0 1-2-2z"/></svg>
                    <span class="nav-label">Home</span>
                </button>
                <button class="nav-item" data-tab="learn">
                    <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                    <span class="nav-label">Learn</span>
                </button>
                <button class="nav-item" data-tab="progress">
                    <svg viewBox="0 0 24 24"><path d="M21 12v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 5 17 10"/><line x1="12" y1="5" x2="12" y2="15"/></svg>
                    <span class="nav-label">Progress</span>
                </button>
                <button class="nav-item" data-tab="settings">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/><path d="M16.5 6.5 19 9"/><path d="M7.5 6.5 5 9"/></svg>
                    <span class="nav-label">Settings</span>
                </button>
            </div>
        </div>
    </div>

    <!-- modal overlay (hidden) -->
    <div id="modalOverlay" class="modal-overlay" style="display: none;">
        <div class="modal" id="modalContent">
            <h3 id="modalTitle"></h3>
            <p id="modalBody"></p>
            <button class="modal-btn" id="modalClose">OK</button>
        </div>
    </div>

    <script>
        (function() {
            // ---------- app state ----------
            const screens = ['onboarding', 'home', 'learn', 'progress', 'settings'];
            let currentScreen = 'onboarding';
            let darkMode = false;
            let screenshotCounter = 1;

            // theme
            const root = document.documentElement;
            const body = document.body;

            // ---------- render functions ----------
            function render() {
                updateHeaderTitle();
                renderContent();
                highlightNav();
            }

            function updateHeaderTitle() {
                const el = document.getElementById('headerTitle');
                if (!el) return;
                const map = {
                    'onboarding': 'Welcome',
                    'home': 'Home',
                    'learn': 'Logic puzzles',
                    'progress': 'Statistics',
                    'settings': 'Settings'
                };
                el.innerText = map[currentScreen] || '';
            }

            function renderContent() {
                const area = document.getElementById('contentArea');
                if (!area) return;
                if (currentScreen === 'onboarding') area.innerHTML = onboardingHTML();
                else if (currentScreen === 'home') area.innerHTML = homeHTML();
                else if (currentScreen === 'learn') area.innerHTML = learnHTML();
                else if (currentScreen === 'progress') area.innerHTML = progressHTML();
                else if (currentScreen === 'settings') area.innerHTML = settingsHTML();

                // attach special listeners if needed
                if (currentScreen === 'onboarding') {
                    document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                        currentScreen = 'home';
                        render();
                    });
                    document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy Policy', 'We respect your data. This is a demo app.'));
                    document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms of Service', 'Educational use only. No real data collection.'));
                }
                if (currentScreen === 'learn') {
                    document.getElementById('startPuzzle')?.addEventListener('click', ()=>{
                        alert('Puzzle started! (demo)');
                        // animate progress bar
                        const fill = document.querySelector('.progress-fill');
                        if (fill) fill.style.width = '68%';
                    });
                }
                if (currentScreen === 'settings') {
                    const toggle = document.getElementById('themeToggle');
                    if (toggle) {
                        toggle.addEventListener('click', (e) => {
                            e.stopPropagation();
                            darkMode = !darkMode;
                            if (darkMode) body.classList.add('dark');
                            else body.classList.remove('dark');
                            render(); // refresh icons maybe
                        });
                    }
                }
            }

            function onboardingHTML() {
                return `
                    <div class="card" style="text-align: center; margin-top: 30px;">
                        <svg width="64" height="64" viewBox="0 0 24 24" stroke="var(--primary)" fill="none" stroke-width="1.5">
                            <circle cx="12" cy="12" r="10"/><path d="M9 9 L15 15 M15 9 L9 15"/>
                        </svg>
                        <h2 style="font-size: 32px; margin: 8px 0 4px;">🧠 logic</h2>
                        <p style="font-size: 18px; color: var(--primary);">brain training</p>
                        <p style="margin: 16px 0; color: var(--text-secondary);">Daily puzzles, riddles & mind teasers. Improve your logic step by step.</p>
                        <button class="btn" id="getStartedBtn">Get Started</button>
                        <div class="link-row">
                            <button id="privacyLink">Privacy Policy</button>
                            <button id="termsLink">Terms of Service</button>
                        </div>
                    </div>
                `;
            }

            function homeHTML() {
                return `
                    <div class="card">
                        <div class="row">
                            <span class="badge">🔥 streak 7 days</span>
                        </div>
                        <h3 style="margin: 12px 0 4px;">Welcome back, Alex</h3>
                        <p style="color: var(--text-secondary);">Continue your puzzle journey</p>
                    </div>
                    <div class="card">
                        <div style="display:flex; justify-content:space-between;"><span>Today's puzzle</span><span>⚡</span></div>
                        <div style="font-size: 20px; font-weight: 600;">Einstein's riddle</div>
                        <div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div>
                        <div style="display:flex; gap:8px;">
                            <svg width="24" height="24" viewBox="0 0 24 24" stroke="var(--primary)" fill="none"><circle cx="12" cy="8" r="4"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></svg>
                            <span>85% completed</span>
                        </div>
                    </div>
                    <div class="card">
                        <h4>Recommended puzzles</h4>
                        <div style="display: flex; gap: 12px; margin-top: 12px;">
                            <div style="flex:1; background: var(--accent)20; border-radius: 20px; padding: 12px;">
                                <svg width="28" height="28" viewBox="0 0 24 24" stroke="var(--primary)"><polygon points="12 2 22 7 22 17 12 22 2 17 2 7 12 2"/><line x1="12" y1="22" x2="12" y2="12"/></svg>
                                <p>Sudoku</p>
                            </div>
                            <div style="flex:1; background: var(--accent)20; border-radius: 20px; padding: 12px;">
                                <svg width="28" height="28" viewBox="0 0 24 24" stroke="var(--primary)"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                                <p>Timed</p>
                            </div>
                        </div>
                    </div>
                `;
            }

            function learnHTML() {
                return `
                    <div class="card">
                        <h3>Logic puzzles · level 2</h3>
                        <div class="progress-bar"><div class="progress-fill" style="width:40%"></div></div>
                        <button class="btn" id="startPuzzle" style="padding:12px; font-size:16px; margin-top:12px;">▶ Start practice</button>
                    </div>
                    <div class="card">
                        <h4>Next: Knights and knaves</h4>
                        <p>10 min · 8 questions</p>
                    </div>
                    <div class="card">
                        <svg width="40" height="40" viewBox="0 0 24 24" stroke="var(--accent)"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                        <p style="margin-top:8px;">Master syllogisms today</p>
                    </div>
                `;
            }

            function progressHTML() {
                return `
                    <div class="card">
                        <h3>This week</h3>
                        <div class="chart-row">
                            <div style="flex:1; display:flex; flex-direction:column; align-items:center;"><div class="bar" style="height:50px;"></div><span class="bar-label">M</span></div>
                            <div style="flex:1; display:flex; flex-direction:column; align-items:center;"><div class="bar" style="height:70px;"></div><span class="bar-label">T</span></div>
                            <div style="flex:1; display:flex; flex-direction:column; align-items:center;"><div class="bar" style="height:40px;"></div><span class="bar-label">W</span></div>
                            <div style="flex:1; display:flex; flex-direction:column; align-items:center;"><div class="bar" style="height:90px;"></div><span class="bar-label">T</span></div>
                            <div style="flex:1; display:flex; flex-direction:column; align-items:center;"><div class="bar" style="height:60px;"></div><span class="bar-label">F</span></div>
                        </div>
                    </div>
                    <div class="card">
                        <span>🏆 Achievements</span>
                        <div style="display: flex; gap: 12px; margin-top: 12px;">
                            <span>🔥 7 days</span> <span>⚡ 50 puzzles</span> <span>🧠 master</span>
                        </div>
                    </div>
                    <div class="card">
                        <span>Total puzzles solved: 243</span>
                        <div class="progress-bar"><div class="progress-fill" style="width:72%"></div></div>
                    </div>
                `;
            }

            function settingsHTML() {
                return `
                    <div class="card">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span>Dark theme</span>
                            <span class="toggle-switch" id="themeToggle"></span>
                        </div>
                    </div>
                    <div class="card">
                        <p>Profile: Alex Chen</p>
                        <p>Member since 2025</p>
                    </div>
                    <div class="card">
                        <p>⚙️ sound effects · on</p>
                        <p>🔔 daily reminder · 8:00</p>
                    </div>
                `;
            }

            function highlightNav() {
                document.querySelectorAll('.nav-item').forEach(el => {
                    el.classList.remove('active');
                    const tab = el.dataset.tab;
                    if (tab === 'home' && currentScreen === 'home') el.classList.add('active');
                    if (tab === 'learn' && currentScreen === 'learn') el.classList.add('active');
                    if (tab === 'progress' && currentScreen === 'progress') el.classList.add('active');
                    if (tab === 'settings' && currentScreen === 'settings') el.classList.add('active');
                });
            }

            // bottom nav listeners
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const tab = e.currentTarget.dataset.tab;
                    if (tab === 'home') currentScreen = 'home';
                    else if (tab === 'learn') currentScreen = 'learn';
                    else if (tab === 'progress') currentScreen = 'progress';
                    else if (tab === 'settings') currentScreen = 'settings';
                    render();
                });
            });

            // profile button -> settings
            document.getElementById('profileBtn').addEventListener('click', ()=>{
                currentScreen = 'settings';
                render();
            });

            // modal system
            const overlay = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            const modalClose = document.getElementById('modalClose');
            modalClose.addEventListener('click', ()=> overlay.style.display = 'none');
            window.showModal = (title, text) => {
                modalTitle.innerText = title;
                modalBody.innerText = text;
                overlay.style.display = 'flex';
            };

            // screenshot SHIFT+W
            document.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    const phone = document.getElementById('phoneContainer');
                    if (!phone) return;

                    // html2canvas not included — but we simulate file naming. (since lib not allowed)
                    // actually we can't capture without external lib. we'll just alert for demo.
                    let filename = darkMode ? '6.png' : (screenshotCounter + '.png');
                    alert(`📸 Screenshot saved as ${filename} (simulated).`);
                    if (!darkMode) {
                        screenshotCounter = (screenshotCounter % 5) + 1;
                    }
                }
            });

            // init
            render();
        })();
    </script>

    <!-- final JSON block -->
    <script>
        // this will output the json after everything
        (function() {
            const titles = {
                "1.png": "Start Learning",
                "2.png": "Daily Lessons",
                "3.png": "Practice Skills",
                "4.png": "Track Progress",
                "5.png": "Smart Settings",
                "6.png": "Dark Theme"
            };
            console.log(JSON.stringify(titles, null, 2));
        })();
    </script>
All done!
</body>
</html>
