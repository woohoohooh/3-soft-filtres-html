```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashLearn · 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    :root {
      /* light mode (default) */
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #0F172A;
      --text-secondary: #334155;
      --border: #E2E8F0;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --inactive: #94A3B8;
      --shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.03);
      --header-bg: rgba(255,255,255,0.7);
    }

    body.dark {
      --bg: #0F172A;
      --card: #1E293B;
      --text: #E2E8F0;
      --text-secondary: #CBD5E1;
      --border: #334155;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --inactive: #64748B;
      --shadow: 0 8px 20px rgba(0,0,0,0.4);
      --header-bg: rgba(15,23,42,0.7);
    }

    body {
      background: #1a1e2b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 12px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background: var(--bg);
      border-radius: 48px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.3), 0 0 0 8px rgba(255,255,255,0.05);
      position: relative;
      backdrop-filter: blur(2px);
      transition: background 0.2s;
      display: flex;
      flex-direction: column;
    }

    /* main app screen (flex column) */
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      position: relative;
    }

    /* header */
    .header {
      padding: 18px 20px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--header-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }
    .header-left h1 {
      font-size: 22px;
      font-weight: 620;
      letter-spacing: -0.3px;
      color: var(--text);
    }
    .profile-icon {
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.1s;
    }
    .profile-icon svg {
      width: 26px;
      height: 26px;
      stroke: var(--text);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* main content */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 18px 10px;
      scrollbar-width: thin;
      scrollbar-color: var(--inactive) transparent;
    }
    .content::-webkit-scrollbar {
      width: 4px;
    }
    .content::-webkit-scrollbar-thumb {
      background: var(--inactive);
      border-radius: 20px;
    }

    /* bottom nav */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 6px 12px 8px;
      background: var(--card);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(4px);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      padding: 8px 0 4px;
      border-radius: 24px;
      transition: all 0.15s ease;
      flex: 1;
      background: transparent;
    }
    .nav-item svg {
      width: 26px;
      height: 26px;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: all 0.12s;
    }
    .nav-item span {
      font-size: 11px;
      font-weight: 500;
      margin-top: 4px;
      transition: color 0.12s;
    }
    /* active style */
    .nav-item.active svg {
      stroke: var(--primary);
      transform: scale(1.1);
      filter: drop-shadow(0 2px 4px rgba(37,99,235,0.2));
    }
    .nav-item.active span {
      color: var(--primary);
      font-weight: 600;
    }
    .nav-item.active {
      background: rgba(37,99,235,0.08);
    }
    /* inactive */
    .nav-item.inactive svg {
      stroke: var(--inactive);
    }
    .nav-item.inactive span {
      color: var(--inactive);
    }

    /* cards etc */
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 18px 16px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .flex-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      background: var(--accent);
      color: #0F172A;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 13px;
    }
    .progress-bar {
      height: 8px;
      background: var(--border);
      border-radius: 20px;
      margin: 10px 0 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      border-radius: 20px;
      transition: width 0.3s ease;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-item {
      background: var(--bg);
      border-radius: 18px;
      padding: 14px 8px;
      text-align: center;
    }
    .lesson-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .lesson-row:last-child { border: none; }
    .btn {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      padding: 14px 20px;
      border-radius: 60px;
      width: 100%;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 6px 14px rgba(37,99,235,0.25);
    }
    .btn:active { transform: scale(0.98); background: var(--primary-dark); }

    /* modal overlay (simple) */
    .modal {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: var(--card);
      padding: 24px;
      border-radius: 36px;
      width: 280px;
      border: 2px solid var(--border);
      box-shadow: 0 30px 50px rgba(0,0,0,0.5);
      z-index: 200;
      color: var(--text);
      text-align: center;
      display: none;
    }
    .modal-overlay {
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(3px);
      z-index: 199;
      display: none;
    }
    .modal-close {
      margin-top: 18px;
      background: var(--primary);
      border: none;
      color: white;
      padding: 8px 24px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
    }
    /* small links */
    .link-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 16px;
      font-size: 13px;
      color: var(--inactive);
      text-decoration: underline;
      cursor: pointer;
    }
    .icon-grid {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="phone" id="phoneContainer">
    <div class="app" id="app">
      <!-- header dynamically updated by js -->
      <div class="header" id="appHeader">
        <div class="header-left"><h1 id="headerTitle">Welcome</h1></div>
        <div class="profile-icon" id="profileBtn">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
      </div>

      <!-- main content views -->
      <div class="content" id="contentArea"></div>

      <!-- bottom navigation -->
      <div class="bottom-nav" id="bottomNav">
        <div class="nav-item" data-tab="home" id="navHome"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Home</span></div>
        <div class="nav-item" data-tab="learn" id="navLearn"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span>Learn</span></div>
        <div class="nav-item" data-tab="progress" id="navProgress"><svg viewBox="0 0 24 24"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/></svg><span>Progress</span></div>
        <div class="nav-item" data-tab="settings" id="navSettings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/><path d="M16.5 6.5 19 9"/><path d="M7.5 6.5 5 9"/></svg><span>Settings</span></div>
      </div>
    </div>
  </div>

  <!-- modal for privacy/terms -->
  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="modal" id="infoModal">
    <h3 id="modalTitle">Privacy Policy</h3>
    <p id="modalText" style="margin:16px 0;">We respect your data. This is a demo app.</p>
    <button class="modal-close" id="modalClose">Got it</button>
  </div>

  <script>
    (function() {
      // ----- icon system (inline svg strings) -----
      const ICONS = {
        home: `<svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
        learn: `<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
        progress: `<svg viewBox="0 0 24 24"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/></svg>`,
        settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/><path d="M16.5 6.5 19 9"/><path d="M7.5 6.5 5 9"/></svg>`,
        profile: `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
        lesson: `<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="16" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`,
        chart: `<svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`,
        flashcards: `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 8h6"/><path d="M9 12h6"/><path d="M9 16h4"/></svg>`,
        play: `<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="none" stroke="currentColor"/></svg>`,
        check: `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`
      };

      // ----- constants & state -----
      const SCREENS = ['onboarding', 'home', 'learn', 'progress', 'settings'];
      let currentScreen = 'onboarding';
      let darkMode = false;

      // theme toggle helper
      function toggleTheme() {
        darkMode = !darkMode;
        if (darkMode) document.body.classList.add('dark');
        else document.body.classList.remove('dark');
        renderScreen(currentScreen); // refresh icons/colors
      }

      // header titles
      const headerTitles = {
        onboarding: 'Welcome',
        home: 'FlashLearn',
        learn: 'Flashcards',
        progress: 'Your stats',
        settings: 'Settings'
      };

      // ----- RENDER functions per screen -----
      function renderOnboarding() {
        return `
          <div class="card" style="text-align:center; padding:32px 20px;">
            <div style="background:#2563EB10; width:80px; height:80px; border-radius:30px; margin:0 auto 20px; display:flex; align-items:center; justify-content:center;">
              ${ICONS.flashcards.replace('stroke="currentColor"', `stroke="#2563EB"`)}
            </div>
            <h2 style="font-size:32px; margin-bottom:8px;">FlashLearn</h2>
            <p style="font-size:18px; color:var(--primary); font-weight:500;">smart flashcards</p>
            <p style="margin:24px 0 20px; color:var(--text-secondary);">Master any topic with adaptive flashcards. Bite‑sized lessons, daily challenges.</p>
            <button class="btn" id="getStartedBtn">Get Started</button>
            <div class="link-row">
              <span id="privacyLink">Privacy</span>
              <span id="termsLink">Terms</span>
            </div>
          </div>
        `;
      }

      function renderHome() {
        return `
          <div class="card">
            <div class="flex-row"><span class="badge">daily streak 5 🔥</span><span>${ICONS.flashcards.replace('stroke="currentColor"', `stroke="var(--primary)"`)}</span></div>
            <h3 style="margin:12px 0 4px;">Continue learning</h3>
            <p style="color:var(--text-secondary);">Python basics • 78%</p>
            <div class="progress-bar"><div class="progress-fill" style="width:78%"></div></div>
            <div style="margin-top:16px;"><button class="btn" id="homeStartPractice" style="padding:10px;">Practice now</button></div>
          </div>
          <div class="card">
            <div class="flex-row"><h4>Recommended</h4>${ICONS.lesson.replace('stroke="currentColor"', `stroke="var(--primary)"`)}</div>
            <div class="lesson-row"><span>📘 Lists & loops</span><span>12 min</span></div>
            <div class="lesson-row"><span>🐍 Functions</span><span>8 min</span></div>
          </div>
          <div class="card">
            <h4>Achievements</h4>
            <div class="icon-grid">🏅 🔥 📚 ⚡</div>
          </div>
        `;
      }

      function renderLearn() {
        return `
          <div class="card">
            <div class="flex-row"><h3>Today's deck</h3> ${ICONS.flashcards.replace('stroke="currentColor"', `stroke="var(--primary)"`)}</div>
            <div class="lesson-row"><span>Python keywords</span><span>20 cards</span></div>
            <div class="lesson-row"><span>Data types</span><span>15 cards</span></div>
            <div style="margin-top:12px;"><button class="btn" id="startLessonBtn" style="padding:12px;">Start flashcards</button></div>
          </div>
          <div class="card">
            <h4>Categories</h4>
            <div style="display:flex; gap:8px; flex-wrap:wrap; margin:12px 0;">
              <span class="badge">Beginner</span><span class="badge">Functions</span><span class="badge">OOP</span>
            </div>
          </div>
        `;
      }

      function renderProgress() {
        return `
          <div class="card">
            <h3>Last 7 days</h3>
            <div style="height:80px; display:flex; align-items:flex-end; gap:6px; margin:20px 0;">
              <div style="background:var(--primary); width:22px; height:45px; border-radius:12px;"></div>
              <div style="background:var(--primary); width:22px; height:68px; border-radius:12px;"></div>
              <div style="background:var(--accent); width:22px; height:30px; border-radius:12px;"></div>
              <div style="background:var(--primary); width:22px; height:80px; border-radius:12px;"></div>
              <div style="background:var(--accent); width:22px; height:50px; border-radius:12px;"></div>
              <div style="background:var(--primary); width:22px; height:64px; border-radius:12px;"></div>
              <div style="background:var(--primary); width:22px; height:72px; border-radius:12px;"></div>
            </div>
            <div class="stat-grid">
              <div class="stat-item"><strong>124</strong> <span>cards</span></div>
              <div class="stat-item"><strong>78%</strong> <span>mastery</span></div>
            </div>
          </div>
          <div class="card">
            <h4>Badges</h4> <div style="font-size:30px;">🏆 ⚡ 🔰</div>
          </div>
        `;
      }

      function renderSettings() {
        return `
          <div class="card">
            <div class="flex-row"><span>Dark mode</span> <label><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''} style="transform:scale(1.2);"></label></div>
            <div style="margin:24px 0; border-top:1px solid var(--border);"></div>
            <div class="flex-row"><span>Sound</span><span>🔔</span></div>
            <div class="flex-row"><span>Language</span><span>English</span></div>
            <div style="margin-top:24px;"><button class="btn" id="resetBtn" style="background:var(--inactive);">Reset progress</button></div>
          </div>
        `;
      }

      function renderScreen(screen) {
        const content = document.getElementById('contentArea');
        const headerTitle = document.getElementById('headerTitle');
        headerTitle.innerText = headerTitles[screen] || 'FlashLearn';

        let html = '';
        if (screen === 'onboarding') html = renderOnboarding();
        else if (screen === 'home') html = renderHome();
        else if (screen === 'learn') html = renderLearn();
        else if (screen === 'progress') html = renderProgress();
        else if (screen === 'settings') html = renderSettings();

        content.innerHTML = html;

        // update active bottom nav
        document.querySelectorAll('.nav-item').forEach(el => {
          const tab = el.dataset.tab;
          if (screen === tab) {
            el.classList.remove('inactive'); el.classList.add('active');
          } else {
            el.classList.remove('active'); el.classList.add('inactive');
          }
        });

        // attach screen-specific listeners
        if (screen === 'onboarding') {
          document.getElementById('getStartedBtn')?.addEventListener('click', () => { currentScreen = 'home'; renderScreen('home'); });
          document.getElementById('privacyLink')?.addEventListener('click', () => showModal('Privacy Policy', 'We do not collect personal data. This is a prototype.'));
          document.getElementById('termsLink')?.addEventListener('click', () => showModal('Terms of Service', 'Educational use only. All rights reserved.'));
        }
        if (screen === 'settings') {
          const toggle = document.getElementById('darkToggle');
          if (toggle) toggle.addEventListener('change', toggleTheme);
        }
        // interactive buttons for demo
        document.getElementById('homeStartPractice')?.addEventListener('click', () => { alert('Practice started!'); });
        document.getElementById('startLessonBtn')?.addEventListener('click', () => { alert('Lesson loading ...'); });
      }

      // bottom nav switching
      function setupNav() {
        document.querySelectorAll('.nav-item').forEach(item => {
          item.addEventListener('click', (e) => {
            const tab = item.dataset.tab;
            if (!tab) return;
            if (tab === 'home' || tab === 'learn' || tab === 'progress' || tab === 'settings') {
              currentScreen = tab;
              renderScreen(currentScreen);
            }
          });
        });
      }

      // profile button opens settings
      document.getElementById('profileBtn').addEventListener('click', () => {
        currentScreen = 'settings';
        renderScreen('settings');
      });

      // modal logic
      const modalOverlay = document.getElementById('modalOverlay');
      const modal = document.getElementById('infoModal');
      const modalTitle = document.getElementById('modalTitle');
      const modalText = document.getElementById('modalText');
      window.showModal = (title, text) => {
        modalTitle.innerText = title;
        modalText.innerText = text;
        modal.style.display = 'block';
        modalOverlay.style.display = 'block';
      };
      document.getElementById('modalClose').addEventListener('click', () => {
        modal.style.display = 'none';
        modalOverlay.style.display = 'none';
      });
      modalOverlay.addEventListener('click', () => {
        modal.style.display = 'none';
        modalOverlay.style.display = 'none';
      });

      // screenshot feature shift+W
      window.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.key === 'W') {
          e.preventDefault();
          const container = document.getElementById('phoneContainer');
          import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
            html2canvas(container, { scale: 2, backgroundColor: null }).then(canvas => {
              const link = document.createElement('a');
              let num = 1;
              if (currentScreen === 'onboarding') num = 1;
              else if (currentScreen === 'home') num = 2;
              else if (currentScreen === 'learn') num = 3;
              else if (currentScreen === 'progress') num = 4;
              else if (currentScreen === 'settings') num = 5;
              if (darkMode) num = 6;
              link.download = num + '.png';
              link.href = canvas.toDataURL('image/png');
              link.click();
            });
          });
        }
      });

      // init
      renderScreen('onboarding');
      setupNav();
    })();
