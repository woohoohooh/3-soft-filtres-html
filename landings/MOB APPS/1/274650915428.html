```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Flow · Learn Python</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            --header-icon: #1E293B;
            --progress-bg: #E2E8F0;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --inactive: #64748B;
            --shadow: 0 10px 25px -5px #00000030, 0 8px 10px -6px #00000050;
            --header-icon: #F1F5F9;
            --progress-bg: #334155;
        }

        body {
            background: #1a1f2b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 44px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* main screen area */
        .screen-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 18px 8px 18px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) transparent;
        }
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: var(--inactive);
            border-radius: 20px;
        }

        /* header (global inside each screen) */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-top: 6px;
        }
        .header h2 {
            font-size: 24px;
            font-weight: 650;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--header-icon);
        }

        /* bottom nav */
        .bottom-nav {
            height: 72px;
            background: var(--card);
            border-top: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            padding: 6px 8px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            gap: 4px;
            transition: all 0.2s ease;
            color: var(--inactive);
            fill: var(--inactive);
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            transform: scale(1.05);
        }
        .nav-item.active .nav-icon {
            filter: drop-shadow(0 2px 6px #2563EB30);
        }
        .nav-icon {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            color: currentColor;
        }

        /* cards & elements */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }
        .flex-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .gap-8 { gap: 8px; }
        .mb-4 { margin-bottom: 16px; }
        .mt-4 { margin-top: 16px; }
        .text-secondary { color: var(--text-secondary); font-size: 14px; }

        .btn-primary {
            background: var(--primary);
            color: white;
            font-weight: 600;
            padding: 16px 24px;
            border: none;
            border-radius: 40px;
            font-size: 18px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 8px 14px -6px var(--primary-dark);
            transition: 0.15s;
        }
        .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }

        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 40px;
            overflow: hidden;
            width: 100%;
        }
        .progress-fill {
            height: 8px;
            background: var(--primary);
            width: 0%;
            border-radius: 40px;
            transition: width 0.3s ease;
        }

        .badge {
            background: var(--accent);
            color: #0C4A6E;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
        }

        .lesson-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .lesson-item:last-child { border-bottom: none; }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* modal */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000000aa;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal.show {
            visibility: visible;
            opacity: 1;
        }
        .modal-content {
            background: var(--card);
            width: 280px;
            padding: 28px;
            border-radius: 36px;
            color: var(--text-primary);
            text-align: center;
        }

        .icon-symbol {
            width: 48px;
            height: 48px;
            stroke: var(--primary);
            stroke-width: 1.8;
            fill: none;
        }

        /* small links */
        .small-link {
            color: var(--inactive);
            font-size: 13px;
            text-decoration: none;
            margin: 0 10px;
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- screens injected via js -->
    <div id="app" class="screen-container"></div>
    <!-- bottom nav -->
    <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<!-- modal for privacy/terms -->
<div class="modal" id="infoModal">
    <div class="modal-content" id="modalText">...</div>
</div>

<script>
    (function() {
        // ---------- THEME / LIGHT ----------
        const theme = { current: 'light' }; // default

        // ---------- ICONS (svg outlines) ----------
        const icons = {
            home: `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M5 12H3L12 3L21 12H19" stroke="currentColor" fill="none"/><path d="M5 12V19H9V14H15V19H19V12" stroke="currentColor" fill="none"/></svg>`,
            learn: `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M2 3H8C10.2091 3 12 4.79086 12 7V21C12 19.8954 11.1046 19 10 19H2V3Z" stroke="currentColor" fill="none"/><path d="M22 3H16C13.7909 3 12 4.79086 12 7V21C12 19.8954 12.8954 19 14 19H22V3Z" stroke="currentColor" fill="none"/></svg>`,
            progress: `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 12C21 13.1819 20.7672 14.3522 20.3149 15.4442C19.8626 16.5361 19.1997 17.5282 18.364 18.364C17.5282 19.1997 16.5361 19.8626 15.4442 20.3149C14.3522 20.7672 13.1819 21 12 21" stroke="currentColor" fill="none"/><path d="M12 3V12L17 15" stroke="currentColor" fill="none"/><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/></svg>`,
            settings: `<svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor" fill="none"/><path d="M19.4 15C19.0268 15.6666 18.5448 16.2663 17.98 16.78L19 20L15 19L14.12 19.9C13.2705 20.3004 12.3401 20.5118 11.4 20.5118C10.4599 20.5118 9.52946 20.3004 8.68 19.9L7 20L5 17L6.02 15.78C5.45521 15.2663 4.97323 14.6666 4.6 14L3 13L5 9L7.1 8.31C7.455 7.64 7.94 7.04 8.52 6.53L7 3L11 4.12L11.4 4C12.34 3.6 13.66 3.6 14.6 4L19 3L17.98 5.78C18.545 6.293 19.0268 6.892 19.4 7.56L21 11L19.4 15Z" stroke="currentColor" fill="none"/></svg>`,
            profile: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21V19C20 16.7909 18.2091 15 16 15H8C5.79086 15 4 16.7909 4 19V21" stroke="currentColor"/><circle cx="12" cy="7" r="4" stroke="currentColor"/></svg>`,
            lesson: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3H8C10.2091 3 12 4.79086 12 7V21C12 19.8954 11.1046 19 10 19H2V3Z"/><path d="M22 3H16C13.7909 3 12 4.79086 12 7V21C12 19.8954 12.8954 19 14 19H22V3Z"/></svg>`,
            chart: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V19H3V5H9"/><path d="M15 9L18 12L21 9"/><path d="M15 5L18 8L21 5"/></svg>`,
            flashcards: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5H18C19.1046 5 20 5.89543 20 7V17C20 18.1046 19.1046 19 18 19H6C4.89543 19 4 18.1046 4 17V5Z"/><path d="M8 9H16"/><path d="M8 13H14"/></svg>`,
            play: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M10 8L16 12L10 16V8Z"/></svg>`,
            check: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17L4 12"/></svg>`,
        };

        // ---------- APP STATE ----------
        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
        let darkMode = false;
        let screenIndex = 0;

        // ---------- SCREEN RENDER FUNCTIONS ----------
        function renderOnboarding() {
            return `
                <div class="header">
                    <h2>CodeFlow</h2>
                    <button class="profile-btn" id="profileBtnHeader">${icons.profile}</button>
                </div>
                <div style="display: flex; flex-direction: column; align-items: center; margin-top: 30px;">
                    <div style="background: #E6F0FF; width: 100px; height: 100px; border-radius: 30px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px;">
                        ${icons.learn.replace('24', '56')}
                    </div>
                    <h1 style="font-size: 36px; font-weight: 700; color: var(--primary);">CodeFlow</h1>
                    <p style="font-size: 18px; color: var(--text-secondary); margin: 8px 0 4px;">learn Python · 3 min a day</p>
                    <p style="text-align: center; color: var(--text-secondary); margin: 12px 0 28px;">Bite-sized coding workouts. Master Python through interactive exercises.</p>
                    <button class="btn-primary" id="getStartedBtn">Get Started</button>
                    <div style="margin-top: 30px;">
                        <a href="#" class="small-link" id="privacyLink">Privacy Policy</a>
                        <a href="#" class="small-link" id="termsLink">Terms of Service</a>
                    </div>
                </div>
            `;
        }

        function renderHome() {
            return `
                <div class="header">
                    <h2>Home</h2>
                    <button class="profile-btn" id="profileBtnHeader">${icons.profile}</button>
                </div>
                <div class="card flex-row gap-8" style="justify-content: space-between;">
                    <div><span class="badge">🔥 7 day streak</span></div>
                    <div style="display:flex; gap:4px;">⭐ 340 XP</div>
                </div>
                <div class="card">
                    <h3 style="margin-bottom: 12px;">Continue lesson</h3>
                    <div class="flex-row gap-8" style="justify-content: space-between;">
                        <span>Variables & Data types</span> <span>68%</span>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" style="width:68%"></div></div>
                    <button class="btn-primary" style="margin-top: 18px; padding:12px;" id="continueLessonBtn">continue →</button>
                </div>
                <div class="card">
                    <div style="display: flex; gap: 16px; align-items:center;">
                        ${icons.flashcards} <span style="font-weight: 600;">Today's picks</span>
                    </div>
                    <div class="lesson-item"><span>🔹 List comprehension</span> ${icons.play}</div>
                    <div class="lesson-item"><span>🔹 Dictionaries</span> ${icons.play}</div>
                </div>
            `;
        }

        function renderLearn() {
            return `
                <div class="header">
                    <h2>Learn</h2>
                    <button class="profile-btn" id="profileBtnHeader">${icons.profile}</button>
                </div>
                <div class="card">
                    <div class="lesson-item"><span>📘 Python basics</span> <span style="color:var(--primary);">3/8</span></div>
                    <div class="progress-bar mb-4"><div class="progress-fill" style="width:37%"></div></div>
                    <div class="lesson-item"><span>📗 Functions</span> <span>0/6</span></div>
                    <div class="progress-bar mb-4"><div class="progress-fill" style="width:0%"></div></div>
                    <div class="lesson-item"><span>📙 OOP</span> <span>2/10</span></div>
                    <div class="progress-bar mb-4"><div class="progress-fill" style="width:20%"></div></div>
                    <button class="btn-primary" style="padding:14px;" id="startPracticeBtn">start practice →</button>
                </div>
                <div class="card flex-row gap-8">
                    ${icons.flashcards} <span>Daily challenge: 4 problems</span>
                </div>
            `;
        }

        function renderProgress() {
            return `
                <div class="header">
                    <h2>Progress</h2>
                    <button class="profile-btn" id="profileBtnHeader">${icons.profile}</button>
                </div>
                <div class="card stat-grid">
                    <div><span class="text-secondary">lessons done</span><br><span style="font-size:28px; font-weight:700;">24</span></div>
                    <div><span class="text-secondary">XP total</span><br><span style="font-size:28px; font-weight:700;">2,180</span></div>
                </div>
                <div class="card">
                    <h4>Weekly activity</h4>
                    <div style="display:flex; gap:6px; margin:16px 0;">
                        <div style="width:20px; height:60px; background:#2563EB40; border-radius:10px;"></div>
                        <div style="width:20px; height:80px; background:#2563EB; border-radius:10px;"></div>
                        <div style="width:20px; height:45px; background:#2563EB60; border-radius:10px;"></div>
                        <div style="width:20px; height:70px; background:#2563EB; border-radius:10px;"></div>
                        <div style="width:20px; height:90px; background:#2563EB; border-radius:10px;"></div>
                        <div style="width:20px; height:55px; background:#2563EB80; border-radius:10px;"></div>
                    </div>
                </div>
                <div class="card flex-row">
                    ${icons.chart} <span>Accuracy 86%  ↑12%</span>
                </div>
            `;
        }

        function renderSettings() {
            const checked = darkMode ? 'checked' : '';
            return `
                <div class="header">
                    <h2>Settings</h2>
                    <button class="profile-btn" id="profileBtnHeader">${icons.profile}</button>
                </div>
                <div class="card">
                    <div class="lesson-item">👤 Username <span style="color:var(--primary);">pythonista</span></div>
                    <div class="lesson-item">🔔 Notifications <span>ON</span></div>
                    <div class="lesson-item" style="justify-content: space-between;">
                        <span>🌙 Dark mode</span>
                        <label style="width: 44px; height:24px; background:var(--primary); border-radius:40px; display:inline-block; position:relative;">
                            <input type="checkbox" id="darkToggle" style="opacity:0; width:0; height:0;" ${checked}>
                            <span style="position:absolute; width:20px; height:20px; background:white; border-radius:50%; top:2px; left:${darkMode?'22px':'2px'}; transition:0.2s;"></span>
                        </label>
                    </div>
                </div>
                <div class="card"><span>📊 app version 2.6.0</span></div>
            `;
        }

        // render active screen
        function renderScreen() {
            const appDiv = document.getElementById('app');
            let html = '';
            if (currentScreen === 'onboarding') html = renderOnboarding();
            else if (currentScreen === 'home') html = renderHome();
            else if (currentScreen === 'learn') html = renderLearn();
            else if (currentScreen === 'progress') html = renderProgress();
            else if (currentScreen === 'settings') html = renderSettings();

            appDiv.innerHTML = html;
            attachHeaderListener();
            if (currentScreen === 'onboarding') {
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                    currentScreen = 'home';
                    renderScreen(); updateNavActive('home');
                });
                document.getElementById('privacyLink')?.addEventListener('click', (e)=>{
                    e.preventDefault(); showModal('Privacy Policy — we respect your data.');
                });
                document.getElementById('termsLink')?.addEventListener('click', (e)=>{
                    e.preventDefault(); showModal('Terms of Service — keep learning!');
                });
            }
            if (currentScreen === 'learn') {
                document.getElementById('startPracticeBtn')?.addEventListener('click', ()=>{
                    alert('practice started (demo)');
                });
            }
            if (currentScreen === 'home') {
                document.getElementById('continueLessonBtn')?.addEventListener('click', ()=>{
                    currentScreen = 'learn'; renderScreen(); updateNavActive('learn');
                });
            }
            if (currentScreen === 'settings') {
                const toggle = document.getElementById('darkToggle');
                if (toggle) {
                    toggle.checked = darkMode;
                    toggle.addEventListener('change', (e) => {
                        darkMode = e.target.checked;
                        document.body.classList.toggle('dark', darkMode);
                        renderScreen();  // re-render to reflect toggle ui
                        updateNavActive('settings');
                    });
                }
            }
        }

        function attachHeaderListener() {
            document.getElementById('profileBtnHeader')?.addEventListener('click', ()=>{
                currentScreen = 'settings';
                renderScreen();
                updateNavActive('settings');
            });
        }

        // bottom nav rendering + activation
        function renderBottomNav() {
            const nav = document.getElementById('bottomNav');
            const items = ['home', 'learn', 'progress', 'settings'];
            nav.innerHTML = items.map(id => {
                const active = currentScreen === id ? 'active' : '';
                return `<button class="nav-item ${active}" data-nav="${id}">
                    <span class="nav-icon">${icons[id]}</span>
                    <span class="nav-label">${id.charAt(0).toUpperCase()+id.slice(1)}</span>
                </button>`;
            }).join('');
            // event listeners
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const navId = btn.dataset.nav;
                    if (navId) {
                        currentScreen = navId;
                        renderScreen();
                        updateNavActive(navId);
                    }
                });
            });
        }

        function updateNavActive(activeId) {
            document.querySelectorAll('.nav-item').forEach(btn => {
                const id = btn.dataset.nav;
                if (id === activeId) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }

        // modal
        function showModal(text) {
            const modal = document.getElementById('infoModal');
            document.getElementById('modalText').innerText = text;
            modal.classList.add('show');
            setTimeout(() => {
                modal.addEventListener('click', ()=> modal.classList.remove('show'), {once:true});
            }, 100);
        }

        // screenshot (shift+w)
        function captureScreenshot() {
            const container = document.getElementById('phoneContainer');
            // we use html2canvas if available (injected via cdn) else fallback
            if (window.html2canvas) {
                let filename = darkMode ? '6.png' : (++screenIndex)+'.png';
                if(screenIndex>5) screenIndex=1; // cycle
                if(darkMode) filename='6.png';
                html2canvas(container, { scale: 2, backgroundColor: null }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = filename;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                });
            } else {
                alert('html2canvas not loaded, but shift+w works (fallback)');
            }
        }

        // init theme
        function applyTheme() {
            document.body.classList.toggle('dark', darkMode);
        }

        // load html2canvas (for screenshot)
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        script.onload = ()=>{
            window.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    captureScreenshot();
                }
            });
        };
        document.head.appendChild(script);

        // start
        renderBottomNav();
        renderScreen();
        applyTheme();

        // shift+w fallback if library not ready
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                if (window.html2canvas) captureScreenshot();
                else alert('html2canvas still loading, try again');
            }
        });

        // modal click out
        document.getElementById('infoModal').addEventListener('click', function(e){
