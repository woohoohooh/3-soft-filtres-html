<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    :root {
      /* light mode (default) */
      --bg-primary: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --border-light: #E2E8F0;
      --primary-blue: #2563EB;
      --primary-dark: #1E40AF;
      --accent-blue: #38BDF8;
      --icon-inactive: #94A3B8;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
      --nav-bg: rgba(255,255,255,0.85);
      --backdrop: #FFFFFF;
    }

    body.dark {
      --bg-primary: #0F172A;
      --card-bg: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --border-light: #334155;
      --primary-blue: #3B82F6;
      --primary-dark: #2563EB;
      --accent-blue: #38BDF8;
      --icon-inactive: #64748B;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      --nav-bg: rgba(30,41,59,0.9);
      --backdrop: #0F172A;
    }

    body {
      background: var(--bg-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      transition: background 0.2s;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background: var(--card-bg);
      border-radius: 42px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      position: relative;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border-light);
    }

    /* status bar placeholder */
    .status-bar {
      height: 48px;
      padding: 12px 16px 4px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      display: flex;
      justify-content: space-between;
      background: var(--card-bg);
    }

    /* main content area (flex column, takes remaining space) */
    .app-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: thin;
      background: var(--bg-primary);
    }

    /* header */
    .header {
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-light);
    }
    .header h2 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }
    .profile-btn:active { transform: scale(0.95); }

    /* bottom navigation */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 12px;
      background: var(--nav-bg);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border-light);
      height: 70px;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
      color: var(--icon-inactive);
      fill: var(--icon-inactive);
      gap: 4px;
    }
    .nav-item.active {
      color: var(--primary-blue);
      fill: var(--primary-blue);
      transform: scale(1.05);
    }
    .nav-item.active .nav-label {
      color: var(--primary-blue);
      font-weight: 500;
    }
    .nav-icon {
      width: 24px;
      height: 24px;
      transition: transform 0.15s;
    }
    .nav-item.active .nav-icon { transform: scale(1.1); }
    .nav-label {
      font-size: 11px;
      font-weight: 500;
    }

    /* screen containers */
    .screen {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .hidden { display: none !important; }

    /* cards, buttons etc */
    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 18px 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-light);
    }
    .btn-primary {
      background: var(--primary-blue);
      border: none;
      border-radius: 40px;
      padding: 16px;
      font-weight: 600;
      font-size: 18px;
      color: white;
      width: 100%;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary:active { background: var(--primary-dark); }
    .link-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 16px;
      font-size: 14px;
    }
    .link-row button {
      background: none;
      border: none;
      color: var(--primary-blue);
      text-decoration: underline;
      cursor: pointer;
    }

    /* modal */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      z-index: 100;
    }
    .modal {
      background: var(--card-bg);
      width: 280px;
      border-radius: 32px;
      padding: 24px;
      color: var(--text-primary);
      box-shadow: var(--shadow);
    }
    .modal button {
      margin-top: 20px;
      width: 100%;
      background: var(--primary-blue);
      border: none;
      border-radius: 30px;
      padding: 12px;
      color: white;
      font-weight: 600;
    }

    /* progress bar */
    .progress-bar-bg {
      height: 8px;
      background: var(--border-light);
      border-radius: 20px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary-blue);
      width: 0%;
      transition: width 0.3s;
    }

    /* lesson items */
    .lesson-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .badge {
      background: var(--accent-blue);
      padding: 4px 10px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      color: #0F172A;
    }

    /* row */
    .row-space {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* toggle */
    .theme-toggle {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .theme-toggle button {
      flex: 1;
      background: var(--bg-primary);
      border: 1px solid var(--border-light);
      border-radius: 40px;
      padding: 10px;
      color: var(--text-primary);
      font-weight: 500;
      cursor: pointer;
    }
    .theme-toggle .active-theme {
      background: var(--primary-blue);
      color: white;
      border-color: var(--primary-blue);
    }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <!-- fixed status bar -->
  <div class="status-bar">

  <!-- main screen container (dynamic content) -->

      <span class="nav-label">Settings</span>

  <!-- hidden modal container -->
  <div id="modalContainer" class="modal-overlay hidden">

</div>

<script>
  (function() {
    // ---------- ICON SYSTEM (inline SVG) ----------
    function renderIcons() {
      // all icons: outline 2px stroke, rounded caps, same style
      const icons = {
        home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 L12 3 L21 10 L21 20 L15 20 L15 14 L9 14 L9 20 L3 20 L3 10Z"/></svg>`,
        learn: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19.5L12 14l8 5.5M12 4v16M8 8l4-2 4 2"/></svg>`,
        progress: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>`,
        settings: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82L12 22zM4 10V8c0-4 8-4 8 0v2"/></svg>`,
        profile: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
        lesson: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="9"/></svg>`,
        chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2M7 10l3-3 3 3 4-4"/><path d="M17 10V4h-6"/></svg>`,
        flashcards: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
        play: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>`,
        check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>`
      };
      for (let [id, svg] of Object.entries(icons)) {
        let container = document.getElementById(`icon-${id}`);
        if (container) container.innerHTML = svg;
        else {
          let els = document.querySelectorAll(`[data-icon="${id}"]`);
          els.forEach(el => el.innerHTML = svg);
        }
      }
      // also profile icon in header
    }

    // ---------- STATE ----------
    let currentScreen = 'onboarding'; // 'onboarding', 'home', 'learn', 'progress', 'settings', 'profile'
    let isDark = false;
    let screenIndex = 1; // for screenshot naming

    // DOM elements
    const appScreen = document.getElementById('appScreen');
    const bottomNav = document.getElementById('bottomNav');
    const modalOverlay = document.getElementById('modalContainer');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const modalClose = document.getElementById('modalClose');
    modalClose.addEventListener('click', ()=>modalOverlay.classList.add('hidden'));

    // helper to show modal
    window.showModal = (title, text) => {
      modalTitle.innerText = title;
      modalBody.innerText = text;
      modalOverlay.classList.remove('hidden');
    };

    // ---------- SCREEN RENDER ----------
    function render() {
      const html = [];
      // header
      html.push(`<div class="header">`);
      html.push(`<h2>${getHeaderTitle()}</h2>`);
      html.push(`<button class="profile-btn" id="profileHeaderBtn" data-icon="profile" style="color:var(--text-primary);"></button>`);
      html.push(`</div>`);

      // screen content
      html.push(`<div class="screen">`);
      switch(currentScreen) {
        case 'onboarding': html.push(onboardingScreen()); break;
        case 'home': html.push(homeScreen()); break;
        case 'learn': html.push(learnScreen()); break;
        case 'progress': html.push(progressScreen()); break;
        case 'settings': html.push(settingsScreen()); break;
        case 'profile': html.push(profileScreen()); break;
        default: html.push(onboardingScreen());
      }
      html.push(`</div>`);

      appScreen.innerHTML = html.join('');

      // fill dynamic icons
      document.querySelectorAll('[data-icon]').forEach(el => {
        const name = el.getAttribute('data-icon');
        if (window.icons && window.icons[name]) el.innerHTML = window.icons[name];
      });
      // attach profile click
      const profileBtn = document.getElementById('profileHeaderBtn');
      if(profileBtn) profileBtn.addEventListener('click', ()=>{
        currentScreen = 'profile';
        render();
        updateNavActive();
      });

      // re-attach listeners for the current screen (like get started)
      attachScreenListeners();
    }

    function getHeaderTitle() {
      const map = {
        onboarding: 'Welcome',
        home: 'Dashboard',
        learn: 'Logic Puzzles',
        progress: 'Your stats',
        settings: 'Settings',
        profile: 'Profile'
      };
      return map[currentScreen] || 'Logic Brain';
    }

    function onboardingScreen() {
      return `
        <div class="card" style="text-align:center; padding:32px 16px;">
          <div style="font-size:48px; margin-bottom:12px;" data-icon="flashcards"></div>
          <h1 style="font-size:32px; font-weight:700;">LogicTrain</h1>
          <p style="font-size:18px; color:var(--primary-blue);">think sharper</p>
          <p style="margin:20px 0; color:var(--text-secondary);">Daily logic puzzles & brain training. 5-min workouts for your mind.</p>
          <button class="btn-primary" id="getStartedBtn">Get Started</button>
          <div class="link-row">
            <button id="privacyLink">Privacy</button>
            <button id="termsLink">Terms</button>
          </div>
        </div>
      `;
    }

    function homeScreen() {
      return `
        <div class="card">
          <div class="row-space"><span>🔥 streak 12 days</span> <span class="badge">+45 pts</span></div>
          <div style="margin: 16px 0"><strong>today's puzzle:</strong> Tower of Hanoi</div>
          <div class="progress-bar-bg"><div class="progress-fill" style="width:60%"></div></div>
          <div style="margin-top:16px"><button class="btn-primary" id="quickPracticeBtn" style="padding:12px;">▶ quick practice</button></div>
        </div>
        <div class="card">
          <h3>Recommended</h3>
          <div class="lesson-item"><span data-icon="lesson" style="width:24px;"></span> <span>Knight move logic</span></div>
          <div class="lesson-item"><span data-icon="lesson" style="width:24px;"></span> <span>Truth tellers</span></div>
        </div>
        <div class="card">
          <div class="row-space"><span>🏆 achievements</span><span>3/8</span></div>
          <div>⚡ speed solver &nbsp; ✅</div>
        </div>
      `;
    }

    function learnScreen() {
      return `
        <div class="card">
          <h3>🧩 Logic puzzles</h3>
          <div class="lesson-item"><span data-icon="play" style="width:24px;"></span> <span>Einstein's riddle</span> <span class="badge">new</span></div>
          <div class="lesson-item"><span data-icon="play" style="width:24px;"></span> <span>River crossing</span></div>
          <div class="lesson-item"><span data-icon="play" style="width:24px;"></span> <span>Knights & knaves</span></div>
        </div>
        <div class="card">
          <div class="row-space"><span>⚡ quick 5 min</span><button class="btn-primary" style="padding:8px 20px; width:auto;" id="startLessonBtn">Start</button></div>
        </div>
      `;
    }

    function progressScreen() {
      return `
        <div class="card">
          <h3>📊 weekly activity</h3>
          <div style="height:100px; display:flex; align-items:end; gap:6px; margin: 20px 0;">
            <div style="background:var(--primary-blue); width:20px; height:40px;"></div>
            <div style="background:var(--primary-blue); width:20px; height:70px;"></div>
            <div style="background:var(--primary-blue); width:20px; height:55px;"></div>
            <div style="background:var(--primary-blue); width:20px; height:90px;"></div>
            <div style="background:var(--accent-blue); width:20px; height:30px;"></div>
          </div>
          <div class="row-space"><span>total puzzles</span><span>128</span></div>
          <div class="progress-bar-bg"><div class="progress-fill" style="width:74%"></div></div>
        </div>
      `;
    }

    function settingsScreen() {
      return `
        <div class="card">
          <h3>Appearance</h3>
          <div class="theme-toggle" id="themeToggle">
            <button class="${!isDark ? 'active-theme' : ''}" data-theme="light">☀️ Light</button>
            <button class="${isDark ? 'active-theme' : ''}" data-theme="dark">🌙 Dark</button>
          </div>
        </div>
        <div class="card">
          <div>🔔 Notifications</div>
          <div>🌍 Language</div>
        </div>
      `;
    }

    function profileScreen() {
      return `
        <div class="card" style="text-align:center;">
          <div style="font-size:60px;" data-icon="profile"></div>
          <h2>Alex Mercer</h2>
          <p>member since 2026</p>
        </div>
        <div class="card">
          <div>📬 email: alex@logic.train</div>
          <div>🏅 8 badges</div>
        </div>
      `;
    }

    // attach listeners
    function attachScreenListeners() {
      if (currentScreen === 'onboarding') {
        document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
          currentScreen = 'home';
          render();
          updateNavActive();
        });
        document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy policy', 'We keep your data safe, no sharing.'));
        document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms of service', 'Use it for good.'));
      }
      if (currentScreen === 'home') {
        document.getElementById('quickPracticeBtn')?.addEventListener('click', ()=>{
          currentScreen = 'learn';
          render();
          updateNavActive();
        });
      }
      if (currentScreen === 'learn') {
        document.getElementById('startLessonBtn')?.addEventListener('click', ()=> showModal('Lesson started', 'Solve 3 puzzles in a row.'));
      }
      if (currentScreen === 'settings') {
        const toggles = document.querySelectorAll('[data-theme]');
        toggles.forEach(btn => btn.addEventListener('click', (e)=>{
          const theme = e.target.getAttribute('data-theme');
          isDark = (theme === 'dark');
          document.body.classList.toggle('dark', isDark);
          render(); // re-render settings so active highlight shows
        }));
      }
    }

    function updateNavActive() {
      const tabs = ['home','learn','progress','settings'];
      document.querySelectorAll('.nav-item').forEach((btn,i)=>{
        const tab = tabs[i];
        if (currentScreen === tab) btn.classList.add('active');
        else btn.classList.remove('active');
      });
    }

    // navigation from bottom
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const tab = btn.getAttribute('data-tab');
        if (tab === 'home' || tab === 'learn' || tab === 'progress' || tab === 'settings') {
          currentScreen = tab;
          render();
          updateNavActive();
        }
      });
    });

    // initial render
    renderIcons();
    // store icons in window for later injection
    window.icons = {
      profile: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
      flashcards: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
      lesson: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="9"/></svg>`,
      play: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>`,
      check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>`,
      chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2M7 10l3-3 3 3 4-4"/><path d="M17 10V4h-6"/></svg>`,
    };
    render();
    updateNavActive();

    // ---------- SCREENSHOT FEATURE (SHIFT+W) ----------
    let screenshotCounter = 1;
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        // capture phone container as PNG (simulate via html2canvas? no external libs)
        alert('Demo: screenshot saved as ' + (isDark ? '6.png' : (screenshotCounter+'.png')));
        if (!isDark) {
          if (screenshotCounter < 6) screenshotCounter++;
        } else {
          // dark mode -> 6.png fixed
        }
      }
    });
  })();
</script>
