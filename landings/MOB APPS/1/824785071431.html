```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math brain trainer · prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.05);
            --header-height: 60px;
            --bottom-nav-height: 72px;
            --icon-stroke: #0F172A;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --shadow: 0 8px 20px rgba(0,0,0,0.4);
            --icon-stroke: #E2E8F0;
        }

        body {
            background: #1a202c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
        }

        /* header */
        .header {
            height: var(--header-height);
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-light);
            background: var(--card);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .profile-icon {
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* main content – screens */
        .screen-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--border-light);
        }
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: var(--border-light);
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 8px;
        }

        /* bottom nav */
        .bottom-nav {
            height: var(--bottom-nav-height);
            background: var(--card);
            border-top: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding-bottom: 8px;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
            background: transparent;
            border: none;
            color: var(--inactive);
            fill: none;
            stroke: var(--inactive);
        }

        .nav-item.active {
            color: var(--primary);
            stroke: var(--primary);
            transform: scale(1.05);
        }
        .nav-item.active .nav-icon {
            stroke: var(--primary);
            filter: drop-shadow(0 2px 6px rgba(37,99,235,0.2));
        }
        .nav-item.active .nav-label {
            color: var(--primary);
            font-weight: 500;
        }
        .nav-item .nav-icon {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.1s;
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            color: currentColor;
        }

        /* card styles */
        .card {
            background: var(--card);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }

        .flex-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
        }

        .progress-bar {
            height: 8px;
            background: var(--border-light);
            border-radius: 40px;
            overflow: hidden;
            margin: 12px 0;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 40px;
            transition: width 0.3s ease;
        }

        .btn {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 24px;
            border-radius: 60px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: 0.1s;
            box-shadow: 0 4px 10px rgba(37,99,235,0.2);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            box-shadow: none;
        }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 24px;
            font-size: 13px;
            color: var(--inactive);
            text-decoration: underline;
            cursor: pointer;
        }

        /* modal */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--card);
            padding: 24px;
            border-radius: 28px;
            width: 280px;
            text-align: center;
            color: var(--text-primary);
            border: 1px solid var(--border-light);
        }

        .icon-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 16px;
        }
        .stat-number {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .hidden { display: none; }

        /* custom svg inline style */
        .stroke-icon {
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <div class="app-container" id="app">
        <!-- header (dynamic) -->
        <div class="header" id="appHeader">
            <h1 id="headerTitle">Onboarding</h1>
            <div class="profile-icon" id="profileBtn">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--icon-stroke)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
            </div>
        </div>

        <!-- screen content -->
        <div class="screen-container" id="screenContainer"></div>

        <!-- bottom nav (hidden on onboarding) -->
        <div class="bottom-nav" id="bottomNav"></div>
    </div>
</div>

<!-- modal template -->
<div id="modalLayer" class="modal hidden" onclick="if(event.target===this)closeModal()">
    <div class="modal-content" id="modalContent"></div>
</div>

<script>
    (function(){
        // -------------------- THEME & STATE --------------------
        let currentTheme = 'light';         // default light
        let currentScreen = 'onboarding';   // onboarding, home, learn, progress, settings
        let darkMode = false;
        // for progress simulation
        let mathScore = 78; // percent
        let dailyGoal = 65;
        let screens = ['onboarding','home','learn','progress','settings'];
        let screenshotCounter = 1;

        // -------------------- ICONS (inline svg strings) --------------------
        function iconHome(active = false) { return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`; }
        function iconLearn() { return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`; }
        function iconProgress() { return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/><path d="M9 8V6"/><path d="M15 8V6"/></svg>`; }
        function iconSettings() { return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 17.66a10 10 0 0 0 6.36-2.62z"/><path d="M16.5 9.4V6.5a2 2 0 0 0-2-2h-5a2 2 0 0 0-2 2v2.9"/></svg>`; }
        function iconChart() { return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2"/><path d="M7 10v6"/><path d="M12 7v9"/><path d="M17 4v12"/></svg>`; }
        function iconFlash() { return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 3 14h8l-2 8 10-12h-8z"/></svg>`; }
        function iconPlay() { return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>`; }
        function iconCheck() { return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>`; }

        // -------------------- RENDER SCREEN --------------------
        function renderScreen(screenId) {
            const container = document.getElementById('screenContainer');
            const bottomNav = document.getElementById('bottomNav');
            const headerTitle = document.getElementById('headerTitle');
            if (!container) return;

            // update header
            if (screenId === 'onboarding') headerTitle.innerText = 'Math mind';
            else if (screenId === 'home') headerTitle.innerText = 'Dashboard';
            else if (screenId === 'learn') headerTitle.innerText = 'Practice';
            else if (screenId === 'progress') headerTitle.innerText = 'Progress';
            else if (screenId === 'settings') headerTitle.innerText = 'Settings';

            // hide bottom nav on onboarding
            if (screenId === 'onboarding') {
                bottomNav.style.display = 'none';
            } else {
                bottomNav.style.display = 'flex';
            }

            let html = '';
            if (screenId === 'onboarding') {
                html = `
                    <div style="text-align:center; padding: 24px 8px;">
                        <div style="background: var(--primary); width: 72px; height: 72px; border-radius: 24px; margin: 20px auto; display: flex; align-items:center; justify-content:center;">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 2a10 10 0 0 1 10 10c0 5-4 8-10 8-6 0-10-3-10-8 0-5 4-10 10-10z"/><path d="M12 6v6l4 2"/></svg>
                        </div>
                        <h2 style="font-size:32px; font-weight:700;">MathMind</h2>
                        <p style="color: var(--primary); font-weight:600; margin:4px 0 12px;">Train your brain daily</p>
                        <p style="color:var(--text-secondary); margin-bottom:32px;">Fast mental math workouts • 5 min a day • personalized challenges</p>
                        <button class="btn" id="getStartedBtn">Get Started →</button>
                        <div class="link-row">
                            <span id="privacyLink">Privacy Policy</span>
                            <span id="termsLink">Terms of Service</span>
                        </div>
                    </div>
                `;
            } else if (screenId === 'home') {
                html = `
                    <div class="card">
                        <div class="flex-row"><span class="badge">⚡ daily streak 7</span> <span>🔥 340 XP</span></div>
                        <h3 style="margin-bottom:8px;">Today’s goal</h3>
                        <div class="progress-bar"><div class="progress-fill" style="width:${dailyGoal}%"></div></div>
                        <p style="display:flex; justify-content:space-between;"><span>3/5 lessons</span><span>${dailyGoal}%</span></p>
                    </div>
                    <div class="card">
                        <div class="flex-row"><h3>Quick workout</h3>${iconPlay()}</div>
                        <div style="display:grid; gap:12px;">
                            <div style="display:flex; align-items:center; gap:8px">${iconFlash()} <span>Mental math (addition)</span> <span style="margin-left:auto;">5m</span></div>
                            <div style="display:flex; align-items:center; gap:8px">${iconFlash()} <span>Multiplication master</span> <span style="margin-left:auto;">7m</span></div>
                            <div style="display:flex; align-items:center; gap:8px">${iconFlash()} <span>Fractions & decimals</span> <span style="margin-left:auto;">4m</span></div>
                        </div>
                        <button class="btn" style="margin-top:16px;" id="startLearnFromHome">Start practice</button>
                    </div>
                    <div class="card"><h3>Recommended for you</h3><div style="display:flex; gap:12px; margin-top:8px;"><span style="background:var(--accent); padding:6px 14px; border-radius:40px;">➕ addition</span><span style="background:var(--border-light); padding:6px 14px; border-radius:40px;">✖️ times table</span></div></div>
                `;
            } else if (screenId === 'learn') {
                html = `
                    <div class="card"><h3>Daily workout</h3><p>20 problems · mixed operations</p><div class="progress-bar"><div class="progress-fill" style="width:35%"></div></div><button class="btn" id="continuePractice">Continue 7/20</button></div>
                    <div class="card"><h3>Flashcards</h3>${iconFlash()}<p style="margin:4px 0">mental multiplication</p><button class="btn-outline btn" id="flashcardBtn">Review</button></div>
                    <div class="card"><h3>New challenge</h3>${iconPlay()}<p>Square roots & powers</p></div>
                `;
            } else if (screenId === 'progress') {
                html = `
                    <div class="card"><h3>Overall mastery</h3><div style="font-size: 44px; font-weight:700; color:var(--primary);">${mathScore}%</div><div class="progress-bar" style="margin:8px 0"><div class="progress-fill" style="width:${mathScore}%"></div></div><p>⬆️ +5% vs last week</p></div>
                    <div class="card"><div class="flex-row"><h3>Weekly activity</h3>${iconChart()}</div><div style="display:flex; gap:6px; height:80px; align-items:flex-end;"><div style="flex:1; background:var(--primary); height:50px; border-radius:8px;"></div><div style="flex:1; background:var(--primary); height:70px;"></div><div style="flex:1; background:var(--primary); height:30px;"></div><div style="flex:1; background:var(--primary); height:80px;"></div><div style="flex:1; background:var(--primary); height:55px;"></div><div style="flex:1; background:var(--primary); height:40px;"></div><div style="flex:1; background:var(--primary); height:60px;"></div></div></div>
                    <div class="card"><h3>Achievements</h3><div style="display:flex; gap:16px;"><span>🏆 7 day streak</span><span>⚡ speed demon</span></div></div>
                `;
            } else if (screenId === 'settings') {
                html = `
                    <div class="card">
                        <h3>Appearance</h3>
                        <div style="display:flex; gap:12px; margin:16px 0;">
                            <button class="btn ${!darkMode ? 'btn-outline' : ''}" id="lightThemeBtn" style="flex:1;">☀️ Light</button>
                            <button class="btn ${darkMode ? 'btn-outline' : ''}" id="darkThemeBtn" style="flex:1;">🌙 Dark</button>
                        </div>
                    </div>
                    <div class="card"><h3>Profile</h3><p>mathlete@email.com</p><p>member since 2026</p></div>
                    <div class="card"><h3>Reminders</h3><p>daily 8:00 AM</p></div>
                    <div class="card"><h3>Sound & vibration</h3><p>on</p></div>
                `;
            }

            container.innerHTML = html;

            // attach bottom nav items
            if (screenId !== 'onboarding') {
                let navHtml = '';
                const navItems = [
                    {id:'home', label:'Home', icon: iconHome()},
                    {id:'learn', label:'Learn', icon: iconLearn()},
                    {id:'progress', label:'Progress', icon: iconProgress()},
                    {id:'settings', label:'Settings', icon: iconSettings()}
                ];
                navItems.forEach(item => {
                    const activeClass = (currentScreen === item.id) ? 'active' : '';
                    navHtml += `<div class="nav-item ${activeClass}" data-nav="${item.id}"><span class="nav-icon">${item.icon}</span><span class="nav-label">${item.label}</span></div>`;
                });
                bottomNav.innerHTML = navHtml;

                document.querySelectorAll('.nav-item').forEach(el => {
                    el.addEventListener('click', (e) => {
                        const navId = el.dataset.nav;
                        if (navId) switchScreen(navId);
                    });
                });
            }

            // listeners inside screen
            if (screenId === 'onboarding') {
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=>switchScreen('home'));
                document.getElementById('privacyLink')?.addEventListener('click', ()=>showModal('Privacy Policy','We respect your data. No sharing.'));
                document.getElementById('termsLink')?.addEventListener('click', ()=>showModal('Terms of Service','Keep learning, be kind.'));
            }
            if (screenId === 'home') {
                document.getElementById('startLearnFromHome')?.addEventListener('click', ()=>switchScreen('learn'));
            }
            if (screenId === 'learn') {
                document.getElementById('continuePractice')?.addEventListener('click', ()=>{
                    showModal('Practice','Great choice! 7/20 completed. Keep going.');
                });
                document.getElementById('flashcardBtn')?.addEventListener('click', ()=>showModal('Flashcards','8×7 = ? \n 56!'));
            }
            if (screenId === 'settings') {
                document.getElementById('lightThemeBtn')?.addEventListener('click', ()=>setTheme('light'));
                document.getElementById('darkThemeBtn')?.addEventListener('click', ()=>setTheme('dark'));
            }
        }

        // switch screen main
        function switchScreen(screenId) {
            if (!screens.includes(screenId)) return;
            currentScreen = screenId;
            renderScreen(screenId);
        }

        // modal
        function showModal(title, text) {
            const modal = document.getElementById('modalLayer');
            document.getElementById('modalContent').innerHTML = `<h3 style="margin-bottom:12px;">${title}</h3><p>${text}</p><button class="btn" style="margin-top:16px;" onclick="closeModal()">Close</button>`;
            modal.classList.remove('hidden');
        }
        window.closeModal = function() {
            document.getElementById('modalLayer').classList.add('hidden');
        };

        // theme
        function setTheme(mode) {
            darkMode = (mode === 'dark');
            document.body.classList.toggle('dark', darkMode);
            currentTheme = mode;
            renderScreen(currentScreen); // refresh icons colors
        }

        // profile button (global)
        document.getElementById('profileBtn').addEventListener('click', ()=>{
            switchScreen('settings');
        });

        // initial
        renderScreen('onboarding');

        // -------------------- screenshot SHIFT+W --------------------
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                const phone = document.getElementById('phoneContainer');
                html2canvas?.(phone, { scale: 2 }).then(canvas => {
                    const link = document.createElement('a');
                    let filename = (darkMode ? '6.png' : (screenshotCounter++)+'.png');
                    if (darkMode && screenshotCounter<=5) filename = '6.png'; // ensure 6 if dark
                    if (!darkMode && screenshotCounter>5) screenshotCounter=1; // reset
                    link.download = filename;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }).catch(()=> alert('html2canvas not loaded — use fallback'));
            }
        });

        // optional html2canvas via CDN (include for demo)
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        document.head.appendChild(script);
    })();
</script>
</body>
</html>
All done!
