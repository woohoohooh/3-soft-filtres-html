```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabVault · English builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* CSS variables – light mode default */
        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --text-muted: #64748B;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --border-light: #E2E8F0;
            --inactive-icon: #94A3B8;
            --active-bg: rgba(37, 99, 235, 0.08);
            --shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.05);
            --header-icon: #1E293B;
            --progress-bg: #E2E8F0;
            --badge-yellow: #FBBF24;
            --badge-green: #34D399;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --text-muted: #94A3B8;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --border-light: #334155;
            --inactive-icon: #64748B;
            --active-bg: rgba(59, 130, 246, 0.15);
            --shadow: 0 8px 20px rgba(0,0,0,0.4);
            --header-icon: #F1F5F9;
            --progress-bg: #334155;
            --badge-yellow: #F59E0B;
            --badge-green: #10B981;
        }

        body {
            background: #111827; /* outer background */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* phone mock */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 44px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2c3e50;
            overflow: hidden;
            position: relative;
            transition: background 0.2s;
            display: flex;
            flex-direction: column;
        }

        /* main app container */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            padding-bottom: 8px;
            background: var(--bg);
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px 8px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 650;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--header-icon);
        }

        /* content area */
        .content {
            flex: 1;
            padding: 8px 16px 8px;
        }

        /* bottom nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--card);
            padding: 8px 12px 10px;
            border-top: 1px solid var(--border-light);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            gap: 4px;
            transition: transform 0.15s ease;
            color: var(--inactive-icon);
            fill: var(--inactive-icon);
        }
        .nav-item.active {
            transform: scale(1.05);
            color: var(--primary);
            fill: var(--primary);
        }
        .nav-item.active .nav-icon {
            background: var(--active-bg);
            padding: 4px 10px;
            border-radius: 30px;
        }
        .nav-icon svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-item span {
            color: currentColor;
        }

        /* cards */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 20px 18px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 30px;
            width: fit-content;
        }

        .progress-bar {
            height: 10px;
            background: var(--progress-bg);
            border-radius: 20px;
            margin: 12px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            border-radius: 20px;
            transition: width 0.3s;
        }

        /* lesson row */
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .lesson-item:last-child { border: none; }

        .icon-svg {
            width: 40px;
            height: 40px;
            stroke: var(--primary);
            fill: none;
            stroke-width: 2;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0;
        }
        .stat-card {
            background: var(--bg);
            padding: 16px 8px;
            border-radius: 20px;
            text-align: center;
        }

        button {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 16px 24px;
            border-radius: 40px;
            font-size: 18px;
            width: 100%;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 6px 14px rgba(37,99,235,0.3);
        }
        button.secondary {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            box-shadow: none;
        }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin: 24px 0 12px;
            color: var(--text-muted);
            font-size: 14px;
        }
        .link-row span { cursor: pointer; text-decoration: underline; }

        /* modal */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card);
            width: 280px;
            padding: 28px;
            border-radius: 40px;
            color: var(--text-primary);
            text-align: center;
        }

        .hidden { display: none; }

        /* chart dummy */
        .chart-row {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            height: 100px;
            margin: 20px 0;
        }
        .bar {
            width: 40px;
            background: var(--primary);
            border-radius: 12px 12px 6px 6px;
            transition: height 0.4s;
        }

        /* theme toggle */
        .theme-switch {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .theme-option {
            flex: 1;
            background: var(--bg);
            border: 2px solid transparent;
            border-radius: 40px;
            padding: 10px;
            text-align: center;
            font-weight: 600;
            color: var(--text-primary);
        }
        .theme-option.active {
            border-color: var(--primary);
            background: var(--active-bg);
        }

        /* user icon (just icon, no circle) */
        .profile-icon svg {
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            width: 28px;
            height: 28px;
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <div class="app-screen" id="appScreen">
        <!-- dynamic header -->
        <div class="header" id="mainHeader">
            <h1 id="screenTitle">Welcome</h1>
            <button class="profile-btn" id="profileBtn" aria-label="Profile">
                <span class="profile-icon" id="profileIcon"></span>
            </button>
        </div>

        <!-- main content injected here -->
        <div class="content" id="contentArea"></div>

        <!-- bottom navigation -->
        <nav class="bottom-nav" id="bottomNav">
            <button class="nav-item" data-nav="home" id="navHome">
                <span class="nav-icon" id="iconHome"></span>
                <span>Home</span>
            </button>
            <button class="nav-item" data-nav="learn" id="navLearn">
                <span class="nav-icon" id="iconLearn"></span>
                <span>Learn</span>
            </button>
            <button class="nav-item" data-nav="progress" id="navProgress">
                <span class="nav-icon" id="iconProgress"></span>
                <span>Progress</span>
            </button>
            <button class="nav-item" data-nav="settings" id="navSettings">
                <span class="nav-icon" id="iconSettings"></span>
                <span>Settings</span>
            </button>
        </nav>
    </div>

    <!-- modal privacy/terms -->
    <div id="modalOverlay" class="modal hidden">
        <div class="modal-content" id="modalText">sample</div>
    </div>
</div>

<script>
    (function() {
        // ---------- icon system (inline svg, all outline 2px round) ----------
        const icons = {
            home: `<svg viewBox="0 0 24 24"><path d="M5 12H3L12 3L21 12H19" stroke="currentColor" fill="none"/><path d="M5 12V20H19V12" stroke="currentColor"/></svg>`,
            learn: `<svg viewBox="0 0 24 24"><path d="M2 3H8C10.2091 3 12 4.79086 12 7V21C12 19.8954 11.1046 19 10 19H2V3Z" stroke="currentColor"/><path d="M22 3H16C13.7909 3 12 4.79086 12 7V21C12 19.8954 12.8954 19 14 19H22V3Z" stroke="currentColor"/></svg>`,
            progress: `<svg viewBox="0 0 24 24"><path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3" stroke="currentColor"/><path d="M12 7V12L15 15" stroke="currentColor"/></svg>`,
            settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor"/><path d="M19.4 15C18.9 16 18 16.6 17 16.7L16.5 18.6C16.3 19.3 15.8 19.9 15.1 20.2C13.8 20.7 12.4 20.2 11.7 19L10 16.9C9.1 17 8.1 16.8 7.4 16.2L5.7 17.4C5 17.9 4.1 17.8 3.5 17.3C2.8 16.7 2.5 15.8 2.8 15L3.8 12.8C3.3 11.9 3.3 10.9 3.8 10L2.8 7.8C2.5 7 2.8 6.1 3.5 5.5C4.1 4.9 5 4.8 5.7 5.3L7.4 6.5C8.2 5.9 9.2 5.8 10.1 6.1L11 4.2C11.3 3.5 11.9 3 12.7 3C13.5 3 14.2 3.5 14.5 4.2L15.5 6.1C16.4 6.4 17.2 7 17.7 7.8L19.4 7.2C20.1 7 20.9 7.3 21.4 7.9C22 8.5 22.1 9.4 21.6 10.1L20.3 12C20.5 12.4 20.5 12.8 20.5 13.2C20.5 13.6 20.4 14 20.2 14.3L19.4 15Z" stroke="currentColor"/></svg>`,
            profile: `<svg viewBox="0 0 24 24"><path d="M20 21V19C20 16.7909 18.2091 15 16 15H8C5.79086 15 4 16.7909 4 19V21" stroke="currentColor"/><circle cx="12" cy="8" r="5" stroke="currentColor"/></svg>`,
            lesson: `<svg viewBox="0 0 24 24"><path d="M4 19.5L15 12L4 4.5V19.5Z" stroke="currentColor"/><path d="M20 5V19" stroke="currentColor"/></svg>`,
            chart: `<svg viewBox="0 0 24 24"><path d="M21 21H3V3" stroke="currentColor"/><path d="M7 15V17" stroke="currentColor"/><path d="M11 11V17" stroke="currentColor"/><path d="M15 8V17" stroke="currentColor"/><path d="M19 5V17" stroke="currentColor"/></svg>`,
            flashcards: `<svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2" stroke="currentColor"/><path d="M8 7H16" stroke="currentColor"/><path d="M8 11H14" stroke="currentColor"/><path d="M8 15H12" stroke="currentColor"/></svg>`,
            play: `<svg viewBox="0 0 24 24"><path d="M5 3L19 12L5 21V3Z" stroke="currentColor"/></svg>`,
            check: `<svg viewBox="0 0 24 24"><path d="M20 6L9 17L4 12" stroke="currentColor"/></svg>`,
        };

        // helper to inject icon into element
        function setIcon(el, name) {
            if (el) el.innerHTML = icons[name] || '';
        }

        // set static icons
        setIcon(document.getElementById('iconHome'), 'home');
        setIcon(document.getElementById('iconLearn'), 'learn');
        setIcon(document.getElementById('iconProgress'), 'progress');
        setIcon(document.getElementById('iconSettings'), 'settings');
        setIcon(document.getElementById('profileIcon'), 'profile');

        // app state
        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
        let darkMode = false;
        let screenshotCounter = 0;

        // ---------- render functions ----------
        function renderOnboarding() {
            document.getElementById('screenTitle').innerText = 'VocabVault';
            let html = `
                <div class="card" style="text-align: center; margin-top: 32px;">
                    <div style="margin-bottom: 16px;">${icons.flashcards.replace('currentColor', 'var(--primary)')}</div>
                    <h2 style="font-size: 40px; font-weight:700;">VocabVault</h2>
                    <p style="font-size: 18px; color: var(--accent); margin: 8px 0;">master English daily</p>
                    <p style="margin: 24px 0 32px; color: var(--text-secondary);">Bite-sized vocabulary workouts with smart recall. Learn 10 words a day.</p>
                    <button id="startBtn">Get Started</button>
                    <div class="link-row">
                        <span id="privacyLink">Privacy Policy</span>
                        <span id="termsLink">Terms of Service</span>
                    </div>
                </div>
            `;
            document.getElementById('contentArea').innerHTML = html;
            document.getElementById('startBtn').addEventListener('click', ()=>{
                navigateTo('home');
            });
            document.getElementById('privacyLink').addEventListener('click', ()=>showModal('Privacy: No data collected.'));
            document.getElementById('termsLink').addEventListener('click', ()=>showModal('Terms: Use wisely.'));
        }

        function renderHome() {
            document.getElementById('screenTitle').innerText = 'Home';
            let html = `
                <div class="card">
                    <div class="flex-row"><span class="badge">🔥 7 day streak</span><span>⭐ 340 XP</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div>
                    <p style="margin:8px 0">Daily goal: 30/50 words</p>
                </div>
                <div class="card">
                    <h3 style="margin-bottom:12px;">Recommended</h3>
                    <div class="lesson-item">${icons.flashcards.replace('currentColor', 'var(--primary)')}<div><strong>Phrasal verbs</strong><p>10 min</p></div></div>
                    <div class="lesson-item">${icons.play.replace('currentColor', 'var(--primary)')}<div><strong>Business English</strong><p>15 min</p></div></div>
                    <button class="secondary" style="margin-top:8px;" id="startPractice">Start practice</button>
                </div>
                <div class="card"><h3>Today’s challenge</h3><div class="flex-row"><span>Match synonyms</span>${icons.check.replace('currentColor', 'var(--primary)')}</div></div>
            `;
            document.getElementById('contentArea').innerHTML = html;
            document.getElementById('startPractice')?.addEventListener('click', ()=>navigateTo('learn'));
        }

        function renderLearn() {
            document.getElementById('screenTitle').innerText = 'Learn';
            let html = `
                <div class="card"><h3>Vocabulary</h3>
                <div class="lesson-item">${icons.lesson.replace('currentColor', 'var(--primary)')}<div><b>Essential 50</b><p>lesson 4/10</p></div><span>80%</span></div>
                <div class="lesson-item">${icons.flashcards.replace('currentColor', 'var(--primary)')}<div><b>Idioms</b><p>12 cards left</p></div></div>
                <div class="lesson-item">${icons.play.replace('currentColor', 'var(--primary)')}<div><b>Listening drill</b></div></div>
                </div>
            `;
            document.getElementById('contentArea').innerHTML = html;
        }

        function renderProgress() {
            document.getElementById('screenTitle').innerText = 'Progress';
            let html = `
                <div class="card"><h3>Weekly activity</h3><div class="chart-row"><div class="bar" style="height:30px"></div><div class="bar" style="height:50px"></div><div class="bar" style="height:70px"></div><div class="bar" style="height:40px"></div><div class="bar" style="height:90px"></div></div></div>
                <div class="stat-grid"><div class="stat-card"><b>1240</b><br>words</div><div class="stat-card"><b>18</b><br>days</div></div>
                <div class="card">${icons.chart.replace('currentColor', 'var(--primary)')}  fluency score: 74%</div>
            `;
            document.getElementById('contentArea').innerHTML = html;
        }

        function renderSettings() {
            document.getElementById('screenTitle').innerText = 'Settings';
            let html = `
                <div class="card"><h3>Profile</h3><div class="lesson-item">${icons.profile.replace('currentColor', 'var(--primary)')}<span>Alex Learner</span></div></div>
                <div class="card"><h3>Appearance</h3><div class="theme-switch"><div class="theme-option" id="lightTheme">Light</div><div class="theme-option" id="darkTheme">Dark</div></div></div>
                <div class="card"><h3>Reminders</h3><p>daily at 8:00</p></div>
            `;
            document.getElementById('contentArea').innerHTML = html;
            document.getElementById('lightTheme')?.classList.toggle('active', !darkMode);
            document.getElementById('darkTheme')?.classList.toggle('active', darkMode);
            document.getElementById('lightTheme')?.addEventListener('click', ()=>{setTheme(false);});
            document.getElementById('darkTheme')?.addEventListener('click', ()=>{setTheme(true);});
        }

        function setTheme(dark) {
            darkMode = dark;
            document.body.classList.toggle('dark', dark);
            if (currentScreen==='settings') renderSettings();
            else updateCurrentScreen();
        }

        function navigateTo(screen) {
            currentScreen = screen;
            updateCurrentScreen();
            // update active nav
            document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
            if (screen!=='onboarding') document.getElementById(`nav${screen.charAt(0).toUpperCase()+screen.slice(1)}`)?.classList.add('active');
        }

        function updateCurrentScreen() {
            if (currentScreen === 'onboarding') renderOnboarding();
            else if (currentScreen === 'home') renderHome();
            else if (currentScreen === 'learn') renderLearn();
            else if (currentScreen === 'progress') renderProgress();
            else if (currentScreen === 'settings') renderSettings();
        }

        // modal
        function showModal(text) {
            const modal = document.getElementById('modalOverlay');
            document.getElementById('modalText').innerText = text;
            modal.classList.remove('hidden');
            setTimeout(()=>{ modal.classList.add('hidden'); }, 1500);
        }

        // profile button opens settings
        document.getElementById('profileBtn').addEventListener('click', ()=>{
            navigateTo('settings');
        });

        // bottom nav
        document.getElementById('navHome').addEventListener('click', ()=>navigateTo('home'));
        document.getElementById('navLearn').addEventListener('click', ()=>navigateTo('learn'));
        document.getElementById('navProgress').addEventListener('click', ()=>navigateTo('progress'));
        document.getElementById('navSettings').addEventListener('click', ()=>navigateTo('settings'));

        // startup
        navigateTo('onboarding');

        // screenshot SHIFT+W
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const node = document.getElementById('phoneContainer');
                // very basic "screenshot" simulation – just log names + increment
                screenshotCounter++;
                let filename = screenshotCounter + '.png';
                if (darkMode && screenshotCounter <=5) filename = '6.png'; // dark first capture becomes 6.png
                else if (!darkMode && screenshotCounter <=5) filename = screenshotCounter + '.png';
                else filename = screenshotCounter + '.png';
                alert(`📸 Screenshot saved as ${filename} (simulated)`);
            }
        });

        // initial theme light
        setTheme(false);
    })();
</script>
<!-- bottom JSON output -->
</body>
</html>
All done!
