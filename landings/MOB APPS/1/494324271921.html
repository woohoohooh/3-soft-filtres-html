```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeSpark · Learn Python</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: #1a1e2b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background: var(--bg-primary);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 0 8px #2d3342;
      position: relative;
      transition: background 0.2s;
    }

    /* theme variables (light default) */
    :root {
      --bg-primary: #F8FAFC;
      --bg-card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --border-light: #E2E8F0;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --inactive: #94A3B8;
      --nav-bg: #FFFFFF;
      --shadow: 0 4px 12px rgba(0,0,0,0.05);
    }

    body.dark {
      --bg-primary: #0F172A;
      --bg-card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --border-light: #334155;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --inactive: #64748B;
      --nav-bg: #1E293B;
      --shadow: 0 4px 12px rgba(0,0,0,0.3);
    }

    /* main flex column */
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 8px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .profile-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .profile-btn svg {
      width: 28px;
      height: 28px;
      stroke: var(--text-primary);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* main content area */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 4px 16px 8px;
      scrollbar-width: thin;
      scrollbar-color: var(--inactive) transparent;
    }
    .content::-webkit-scrollbar {
      width: 4px;
    }
    .content::-webkit-scrollbar-thumb {
      background: var(--inactive);
      border-radius: 10px;
    }

    /* bottom navigation */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: var(--nav-bg);
      padding: 8px 8px 10px;
      border-top: 1px solid var(--border-light);
      box-shadow: var(--shadow);
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
      padding: 6px 0 4px;
      border-radius: 20px;
      color: var(--inactive);
      stroke: var(--inactive);
      fill: none;
    }
    .nav-item svg {
      width: 26px;
      height: 26px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.1s;
    }
    .nav-item span {
      font-size: 11px;
      font-weight: 500;
      margin-top: 2px;
      color: currentColor;
    }
    .nav-item.active {
      stroke: var(--primary);
      color: var(--primary);
      background: rgba(37, 99, 235, 0.08);
    }
    .nav-item.active svg {
      transform: scale(1.1);
      stroke-width: 2.4;
    }

    /* cards & UI */
    .card {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 18px 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-light);
    }
    .badge {
      background: var(--accent);
      color: #0F172A;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 30px;
      font-size: 13px;
    }
    .flex-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .progress-bar {
      height: 10px;
      background: var(--border-light);
      border-radius: 30px;
      margin: 12px 0;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      border-radius: 30px;
      transition: width 0.3s ease;
    }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 18px;
      width: 100%;
      cursor: pointer;
      transition: 0.1s;
      box-shadow: 0 6px 0 var(--primary-dark);
    }
    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--primary-dark);
    }
    .link-group {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin-top: 20px;
      font-size: 13px;
    }
    .link {
      color: var(--text-secondary);
      text-decoration: underline;
      cursor: pointer;
    }

    /* modal overlay */
    .modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal.hidden {
      display: none;
    }
    .modal-card {
      background: var(--bg-card);
      width: 280px;
      padding: 28px 20px;
      border-radius: 32px;
      text-align: center;
      color: var(--text-primary);
      border: 1px solid var(--border-light);
    }
    .modal-card button {
      margin-top: 24px;
      background: var(--primary);
      border: none;
      color: white;
      padding: 12px 30px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
    }

    /* charts / rings */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }
    .stat-item {
      background: var(--bg-primary);
      border-radius: 18px;
      padding: 16px 8px;
      text-align: center;
    }
    .ring {
      width: 60px;
      height: 60px;
      margin: 0 auto 8px;
    }

    /* icon set */
    .icon-defs { display: none; }

    /* onboarding screen */
    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 20px 0 24px;
    }
    .app-logo-svg {
      width: 70px;
      height: 70px;
      stroke: var(--primary);
      stroke-width: 2;
      margin-bottom: 12px;
    }

    /* profile icon is just a user icon – already in header */
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <!-- hidden SVG definitions (same style) -->
  <svg style="display:none;" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- home -->
      <g id="icon-home"><path d="M5 12 L12 5 L19 12 L19 20 L14 20 L14 14 L10 14 L10 20 L5 20 Z" /></g>
      <!-- learn -->
      <g id="icon-learn"><path d="M12 5 L12 19 M8 8 L16 8 M8 12 L16 12 M8 16 L14 16" /></g>
      <!-- progress -->
      <g id="icon-progress"><circle cx="12" cy="12" r="7"/><path d="M12 7 L12 12 L15 15"/></g>
      <!-- settings -->
      <g id="icon-settings"><circle cx="12" cy="12" r="2.5"/><path d="M19 12 L21 12 M3 12 L5 12 M12 3 L12 5 M12 19 L12 21 M5.5 5.5 L7 7 M17 17 L18.5 18.5 M5.5 18.5 L7 17 M17 7 L18.5 5.5"/></g>
      <!-- profile (user) -->
      <g id="icon-profile"><circle cx="12" cy="8" r="4"/><path d="M4 20 L20 20 C20 15 16 12 12 12 C8 12 4 15 4 20"/></g>
      <!-- lesson -->
      <g id="icon-lesson"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 8 L15 8 M9 12 L15 12 M9 16 L13 16"/></g>
      <!-- chart -->
      <g id="icon-chart"><path d="M3 17 L7 10 L11 14 L17 6 L21 12"/></g>
      <!-- flashcards -->
      <g id="icon-flashcards"><rect x="5" y="5" width="6" height="14" rx="1"/><rect x="13" y="5" width="6" height="14" rx="1"/></g>
      <!-- play -->
      <g id="icon-play"><circle cx="12" cy="12" r="9"/><polygon points="10,8 16,12 10,16" fill="none"/></g>
      <!-- check -->
      <g id="icon-check"><polyline points="5 13 10 18 19 7"/></g>
    </defs>
  </svg>

  <div class="app" id="app">
    <!-- DYNAMIC HEADER (set by js) -->
    <div class="header" id="appHeader">
      <h1 id="headerTitle">Onboarding</h1>
      <button class="profile-btn" id="profileBtn">
        <svg viewBox="0 0 24 24"><use href="#icon-profile"/></svg>
      </button>
    </div>

    <!-- MAIN CONTENT (screens injected) -->
    <div class="content" id="screenContent"></div>

    <!-- BOTTOM NAV (hidden on onboarding) -->
    <div class="bottom-nav" id="bottomNav">
      <button class="nav-item" data-nav="home"><svg viewBox="0 0 24 24"><use href="#icon-home"/></svg><span>Home</span></button>
      <button class="nav-item" data-nav="learn"><svg viewBox="0 0 24 24"><use href="#icon-learn"/></svg><span>Learn</span></button>
      <button class="nav-item" data-nav="progress"><svg viewBox="0 0 24 24"><use href="#icon-progress"/></svg><span>Progress</span></button>
      <button class="nav-item" data-nav="settings"><svg viewBox="0 0 24 24"><use href="#icon-settings"/></svg><span>Settings</span></button>
    </div>
  </div>

  <!-- MODALS (privacy & terms) -->
  <div id="modalOverlay" class="modal hidden">
    <div class="modal-card">
      <h3 id="modalTitle">Title</h3>
      <p id="modalText" style="margin:16px 0;">content</p>
      <button id="closeModal">OK</button>
    </div>
  </div>
</div>

<script>
  (function() {
    // ----- THEME & STATE -----
    let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
    let darkMode = false;
    const container = document.getElementById('phoneContainer');
    const headerTitle = document.getElementById('headerTitle');
    const contentDiv = document.getElementById('screenContent');
    const bottomNav = document.getElementById('bottomNav');
    const profileBtn = document.getElementById('profileBtn');
    const modal = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalText = document.getElementById('modalText');
    const closeModal = document.getElementById('closeModal');
    
    // screenshot counter
    let shotCounter = 1;
    
    // ---- helper: render icon from sprite ----
    function useIcon(id) {
      return `<svg viewBox="0 0 24 24"><use href="#${id}"/></svg>`;
    }

    // ---- show modal ----
    function showModal(title, text) {
      modalTitle.innerText = title;
      modalText.innerText = text;
      modal.classList.remove('hidden');
    }
    closeModal.onclick = () => modal.classList.add('hidden');

    // ---- bottom nav listeners ----
    document.querySelectorAll('[data-nav]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const nav = e.currentTarget.dataset.nav; // home, learn, progress, settings
        if (nav === 'home') showScreen('home');
        else if (nav === 'learn') showScreen('learn');
        else if (nav === 'progress') showScreen('progress');
        else if (nav === 'settings') showScreen('settings');
      });
    });

    // profile button -> settings
    profileBtn.addEventListener('click', () => showScreen('settings'));

    // ---- screen rendering functions ----
    function showScreen(screen) {
      currentScreen = screen;
      // update header
      if (screen === 'onboarding') headerTitle.innerText = 'Welcome';
      else if (screen === 'home') headerTitle.innerText = 'Dashboard';
      else if (screen === 'learn') headerTitle.innerText = 'Python Path';
      else if (screen === 'progress') headerTitle.innerText = 'Your stats';
      else if (screen === 'settings') headerTitle.innerText = 'Settings';

      // hide bottom nav on onboarding
      bottomNav.style.display = screen === 'onboarding' ? 'none' : 'flex';

      // active nav highlight
      document.querySelectorAll('.nav-item').forEach(item => {
        const nav = item.dataset.nav;
        if (screen === nav) item.classList.add('active');
        else item.classList.remove('active');
      });

      renderScreen(screen);
    }

    function renderScreen(screen) {
      let html = '';
      if (screen === 'onboarding') {
        html = `
          <div class="logo-area">
            <svg class="app-logo-svg" viewBox="0 0 32 32" stroke="currentColor" fill="none">
              <rect x="6" y="6" width="20" height="20" rx="5" stroke-width="2"/>
              <path d="M12 12 L20 12 M12 18 L20 18 M12 15 L16 15" stroke-width="2"/>
            </svg>
            <h2 style="font-size:34px; font-weight:800; color:var(--primary);">CodeSpark</h2>
            <p style="font-size:16px; color:var(--text-secondary); margin:6px 0 4px;">learn Python, daily</p>
          </div>
          <p style="color:var(--text-secondary); text-align:center; margin-bottom:28px;">Bite‑sized exercises, real coding. Master Python through challenges & quizzes.</p>
          <button class="btn" id="getStartedBtn">Get Started</button>
          <div class="link-group">
            <span class="link" id="privacyLink">Privacy Policy</span>
            <span class="link" id="termsLink">Terms of Service</span>
          </div>
        `;
      } else if (screen === 'home') {
        html = `
          <div class="card">
            <div class="flex-row"><span class="badge">🔥 7 day streak</span><span>🐍 342 XP</span></div>
            <h3 style="margin:8px 0 6px;">Hello, Alex 👋</h3>
            <p style="color:var(--text-secondary);">Continue where you left:</p>
            <div style="background:var(--bg-primary); border-radius:18px; padding:14px; margin:16px 0 8px;">
              <div class="flex-row"><span><strong>Variables & Data types</strong></span><span>75%</span></div>
              <div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div>
              <button class="nav-item" id="quickLesson" style="width:100%; background:var(--primary); color:white; stroke:white; padding:12px; border-radius:60px; flex-direction:row; gap:8px; justify-content:center;" data-nav="learn">${useIcon('icon-play')}<span>Continue lesson</span></button>
            </div>
          </div>
          <div class="card">
            <div class="flex-row"><span style="font-weight:600;">📚 Recommended</span><span>View all</span></div>
            <div style="display:flex; gap:12px; margin-top:12px;">
              <div style="flex:1; background:var(--bg-primary); border-radius:20px; padding:12px;">${useIcon('icon-flashcards')}<p style="font-weight:600; margin:8px 0 4px;">Loops</p><small>8 min</small></div>
              <div style="flex:1; background:var(--bg-primary); border-radius:20px; padding:12px;">${useIcon('icon-lesson')}<p style="font-weight:600; margin:8px 0 4px;">Functions</p><small>12 min</small></div>
            </div>
          </div>
        `;
      } else if (screen === 'learn') {
        html = `
          <div class="card">
            <h3>Python fundamentals</h3>
            <div style="margin:12px 0;">
              <div class="flex-row"><span>1. Basics</span>${useIcon('icon-check')}</div>
              <div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div>
              <div class="flex-row" style="margin-top:14px;"><span>2. Data types</span>${useIcon('icon-check')}</div>
              <div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div>
              <div class="flex-row" style="margin-top:14px;"><span>3. Conditionals</span><small>75%</small></div>
              <div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div>
              <div class="flex-row" style="margin-top:14px;"><span>4. Loops</span><small>30%</small></div>
              <div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div>
            </div>
            <button class="btn" style="padding:12px; font-size:16px;" id="startPractice">Practice active lesson</button>
          </div>
          <div class="card">${useIcon('icon-flashcards')} <strong>Daily flashcards</strong><p style="margin-top:8px;">Review 5 Python terms</p></div>
        `;
      } else if (screen === 'progress') {
        html = `
          <div class="card">
            <div class="flex-row"><span>🏆 Level 7</span><span>2450 / 3000 XP</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width:81%"></div></div>
            <div class="stat-grid">
              <div class="stat-item">${useIcon('icon-chart')}<p style="font-size:20px; font-weight:700;">23</p><small>lessons</small></div>
              <div class="stat-item">${useIcon('icon-flashcards')}<p style="font-size:20px; font-weight:700;">187</p><small>cards</small></div>
            </div>
          </div>
          <div class="card">
            <h4>Weekly activity</h4>
            <div style="display:flex; gap:4px; margin:16px 0; justify-content:center;">
              <span style="width:28px; height:28px; background:var(--primary); border-radius:8px;"></span>
              <span style="width:28px; height:28px; background:var(--primary); opacity:0.7; border-radius:8px;"></span>
              <span style="width:28px; height:28px; background:var(--primary); border-radius:8px;"></span>
              <span style="width:28px; height:28px; background:var(--inactive); border-radius:8px;"></span>
              <span style="width:28px; height:28px; background:var(--primary); opacity:0.5; border-radius:8px;"></span>
              <span style="width:28px; height:28px; background:var(--primary); border-radius:8px;"></span>
              <span style="width:28px; height:28px; background:var(--inactive); border-radius:8px;"></span>
            </div>
            <p>🔥 4 day streak</p>
          </div>
        `;
      } else if (screen === 'settings') {
        html = `
          <div class="card">
            <div style="display:flex; align-items:center; gap:12px;">${useIcon('icon-profile')}<span><strong>Alex Chen</strong><br>alex@learn.io</span></div>
          </div>
          <div class="card">
            <label style="display:flex; justify-content:space-between; align-items:center;">
              <span>Dark theme</span>
              <input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}>
            </label>
          </div>
          <div class="card">
            <p>Sound effects · Notifications · Language</p>
          </div>
        `;
      }
      contentDiv.innerHTML = html;

      // attach special events after render
      if (screen === 'onboarding') {
        document.getElementById('getStartedBtn')?.addEventListener('click', () => showScreen('home'));
        document.getElementById('privacyLink')?.addEventListener('click', () => showModal('Privacy', 'We respect your data. No selling.'));
        document.getElementById('termsLink')?.addEventListener('click', () => showModal('Terms', 'Use CodeSpark for good. Be nice.'));
      }
      if (screen === 'home') {
        document.getElementById('quickLesson')?.addEventListener('click', () => showScreen('learn'));
      }
      if (screen === 'learn') {
        document.getElementById('startPractice')?.addEventListener('click', () => { 
          alert('Starting practice session!'); 
          const fills = document.querySelectorAll('.progress-fill');
          if (fills.length>2) fills[2].style.width = '85%'; 
        });
      }
      if (screen === 'settings') {
        const toggle = document.getElementById('darkToggle');
        if (toggle) {
          toggle.checked = darkMode;
          toggle.addEventListener('change', (e) => {
            darkMode = e.target.checked;
            if (darkMode) document.body.classList.add('dark');
            else document.body.classList.remove('dark');
          });
        }
      }
    }

    // ---- screenshot (shift+W) ----
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.code === 'KeyW') {
        e.preventDefault();
        const phone = document.getElementById('phoneContainer');
        // simplistic capture simulation — logs naming, but real png not possible in html-only
        let filename = darkMode ? '6.png' : (shotCounter + '.png');
        if (!darkMode && shotCounter<6) { filename = shotCounter + '.png'; shotCounter = (shotCounter%5)+1; }
        else if (darkMode) filename = '6.png';
        alert(`📸 Screenshot saved as ${filename} (simulated)`);
      }
    });

    // ---- initial render ----
    showScreen('onboarding');

    // ---- bottom nav initial hidden ----
    bottomNav.style.display = 'none';

    // ---- json output at the end (console & also as comment) ----
    window.jsonResult = {
      "1.png": "Start Learning",
      "2.png": "Daily Lessons",
      "3.png": "Practice Skills",
      "4.png": "Track Progress",
      "5.png": "Smart Settings",
      "6.png": "Dark Theme"
    };
    console.log('titles =', window.jsonResult);
  })();
</script>
<!-- final JSON as requested -->
<script>
  // exact output
  const titles = {
    "1.png": "Start Learning",
    "2.png": "Daily Lessons",
    "3.png": "Practice Skills",
    "4.png": "Track Progress",
    "5.png": "Smart Settings",
    "6.png": "Dark Theme"
  };
  console.log(JSON.stringify(titles, null, 2));
</script>
All done!
</body>
</html>
```
