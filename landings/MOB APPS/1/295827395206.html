<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSpark · Learn Python</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #1c1e24;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --border: #E2E8F0;
            --inactive: #94A3B8;
            --highlight: #DBEAFE;
        }
        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --border: #334155;
            --inactive: #64748B;
            --highlight: #1E3A5F;
        }
        .phone-mock {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 48px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4), 0 0 0 8px #2d313a;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
        }
        /* content wrapper */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 16px 16px 8px 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--card);
        }
        .app-screen::-webkit-scrollbar {
            width: 4px;
        }
        .app-screen::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 8px;
        }
        /* header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
        }
        .profile-icon {
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            transition: background 0.2s;
        }
        .profile-icon:hover {
            background: var(--highlight);
        }
        /* bottom nav */
        .bottom-nav {
            background: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 6px;
            border-radius: 0 0 48px 48px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 4px 12px 6px;
            border-radius: 20px;
            background: transparent;
            color: var(--inactive);
            fill: var(--inactive);
        }
        .nav-item.active {
            background: var(--highlight);
            color: var(--primary);
            fill: var(--primary);
            transform: scale(1.05);
        }
        .nav-item.active svg {
            stroke: var(--primary);
        }
        .nav-item span {
            font-size: 0.7rem;
            font-weight: 500;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.1s;
        }
        /* onboarding specific */
        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        .app-logo svg {
            width: 64px;
            height: 64px;
            fill: none;
            stroke: var(--primary);
            stroke-width: 2;
        }
        .app-name {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }
        .tagline {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text);
            margin: 8px 0 4px;
        }
        .desc {
            color: var(--text-light);
            text-align: center;
            margin: 8px 0 24px;
            line-height: 1.4;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 60px;
            margin: 16px 0 12px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 8px 16px -6px var(--primary-dark);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        .small-links {
            display: flex;
            gap: 24px;
            justify-content: center;
            color: var(--inactive);
            font-size: 0.8rem;
        }
        .small-links span {
            text-decoration: underline;
            cursor: pointer;
        }
        /* modal */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            color: var(--text);
            text-align: center;
            box-shadow: 0 20px 30px #00000055;
        }
        .modal-content button {
            margin-top: 20px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        /* cards, stats */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0;
        }
        .stat-card {
            background: var(--card);
            padding: 14px 8px;
            border-radius: 24px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: var(--text);
        }
        .progress-bar-bg {
            background: var(--border);
            height: 8px;
            border-radius: 20px;
            width: 100%;
            margin: 6px 0;
        }
        .progress-fill {
            background: var(--primary);
            width: 65%;
            height: 8px;
            border-radius: 20px;
            transition: width 0.3s;
        }
        .badge-row {
            display: flex;
            gap: 8px;
            margin: 12px 0;
        }
        .badge {
            background: var(--highlight);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.75rem;
        }
        .lesson-item {
            background: var(--card);
            padding: 16px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .icon-small svg {
            width: 32px;
            height: 32px;
            stroke: var(--primary);
            fill: none;
            stroke-width: 2;
        }
        /* hidden utility */
        .hidden {
            display: none !important;
        }
        .screenshot-hint {
            position: absolute;
            bottom: 40px;
            right: 10px;
            font-size: 10px;
            color: #aaa;
            z-index: 9999;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="phone-mock" id="phoneContainer">
    <!-- dynamic screens injected via JS -->
    <div id="screenRoot" class="app-screen"></div>
    <!-- bottom nav (static but toggles) -->
    <div class="bottom-nav" id="bottomNav">
        <div class="nav-item" data-tab="home">
            <svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10L21 20H15V14H9V20H3V10Z" /></svg>
            <span>Home</span>
        </div>
        <div class="nav-item" data-tab="learn">
            <svg viewBox="0 0 24 24"><path d="M12 4V20M20 12H4M4 12L2 14M4 12L2 10M20 12L22 14M20 12L22 10" /></svg>
            <span>Learn</span>
        </div>
        <div class="nav-item" data-tab="progress">
            <svg viewBox="0 0 24 24"><path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3M12 7V12L15 15" /></svg>
            <span>Progress</span>
        </div>
        <div class="nav-item" data-tab="settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15C18.9 16 18.1 16.7 17.2 17.2L19 20.6L16 21L15.2 17.8C14.3 17.9 13.4 18 12.5 18H12C11.1 18 10.2 17.9 9.3 17.8L8.5 21L5.5 20.6L7.3 17.2C6.4 16.7 5.6 16 5.1 15L2 15L2 12L5 12C5 11.3 5.1 10.6 5.2 9.9L2 9L3 6L6.2 7.2C7 6.4 7.9 5.8 8.9 5.4L8 2L11 2L12 5C12.7 5 13.4 5.1 14 5.3L15 2L18 2L17.2 5.3C18.1 5.8 18.9 6.4 19.5 7.2L22 6L21 9L18.8 9.9C18.9 10.6 19 11.3 19 12L22 12V15L19.4 15Z" /></svg>
            <span>Settings</span>
        </div>
    </div>
    <div class="screenshot-hint">⇧+W screenshot</div>
</div>

<script>
    (function() {
        // ---------- Icon definitions (inline svg symbols) ----------
        const icons = {
            profile: '<svg viewBox="0 0 24 24"><path d="M20 21V19C20 16.8 18.2 15 16 15H8C5.8 15 4 16.8 4 19V21M16 7C16 9.2 14.2 11 12 11C9.8 11 8 9.2 8 7C8 4.8 9.8 3 12 3C14.2 3 16 4.8 16 7Z" /></svg>',
            check: '<svg viewBox="0 0 24 24"><path d="M20 6L9 17L4 12" /></svg>',
            play: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16" /></svg>',
            lesson: '<svg viewBox="0 0 24 24"><path d="M4 4H20V20H4V4Z M8 8H16M8 12H14M8 16H12" /></svg>',
            chart: '<svg viewBox="0 0 24 24"><path d="M21 21H3V3M7 15V17M11 11V17M15 7V17M19 3V17" /></svg>',
            flashcards: '<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8H15M9 12H13" /></svg>'
        };

        // ---------- theme management ----------
        let darkMode = false;
        function applyTheme() {
            if (darkMode) document.body.classList.add('dark');
            else document.body.classList.remove('dark');
        }

        // ---------- current screen ----------
        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
        let screenshotCounter = 1;

        // ---------- render root ----------
        const root = document.getElementById('screenRoot');
        const navItems = document.querySelectorAll('.nav-item');

        function showModal(title, text) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `<div class="modal-content"><h3>${title}</h3><p>${text}</p><button id="closeModalBtn">Close</button></div>`;
            document.body.appendChild(modal);
            document.getElementById('closeModalBtn').addEventListener('click', ()=>modal.remove());
            modal.addEventListener('click', e => e.target === modal && modal.remove());
        }

        // ---------- screen renderers ----------
        function renderOnboarding() {
            return `
                <div class="logo-area">
                    <div class="app-logo">${icons.flashcards}</div>
                    <div class="app-name">CodeSpark</div>
                    <div class="tagline">Python in your pocket</div>
                    <div class="desc">Bite‑sized coding lessons, real‑time practice, and smart feedback. Learn Python 3 the fun way.</div>
                    <button class="btn-primary" id="getStartedBtn">Get Started</button>
                    <div class="small-links">
                        <span id="privacyLink">Privacy Policy</span>
                        <span id="termsLink">Terms of Service</span>
                    </div>
                </div>
            `;
        }

        function renderHome() {
            return `
                <div class="header">
                    <h2>Home</h2>
                    <div class="profile-icon" id="profileIconHeader">${icons.profile}</div>
                </div>
                <div class="badge-row">
                    <span class="badge">🔥 7 day streak</span>
                    <span class="badge">⚡ 124 XP today</span>
                </div>
                <div class="stat-card" style="flex-direction:row; justify-content:space-around;">
                    <span>🐍 <strong>Beginner</strong></span>
                    <span>🏆 level 4</span>
                </div>
                <div style="margin:16px 0">
                    <div style="display:flex; justify-content:space-between"><span>Next lesson: Loops</span><span>65%</span></div>
                    <div class="progress-bar-bg"><div class="progress-fill" style="width:65%"></div></div>
                </div>
                <div style="font-weight:600; margin:12px 0 8px">Continue learning</div>
                <div class="lesson-item" id="quickLesson">
                    <span class="icon-small">${icons.play}</span>
                    <div><strong>For loops & range</strong><br>5 min left</div>
                </div>
                <div class="lesson-item">
                    <span class="icon-small">${icons.lesson}</span>
                    <div><strong>Lists methods</strong><br>new</div>
                </div>
                <div style="background:var(--accent); padding:16px; border-radius:28px; color:black; margin:20px 0">
                    ⚡ daily challenge: write a lambda function
                </div>
            `;
        }

        function renderLearn() {
            return `
                <div class="header">
                    <h2>Learn</h2>
                    <div class="profile-icon" id="profileIconHeader">${icons.profile}</div>
                </div>
                <div style="display:flex; gap:6px; flex-wrap:wrap; margin:8px 0">
                    <span class="badge" style="background:var(--primary); color:white;">Basics</span>
                    <span class="badge">Functions</span>
                    <span class="badge">OOP</span>
                </div>
                <div class="lesson-item"><span class="icon-small">${icons.flashcards}</span><div><strong>Variables & data types</strong><br>3 flashcards</div></div>
                <div class="lesson-item"><span class="icon-small">${icons.play}</span><div><strong>Conditionals (if/else)</strong><br>practice</div></div>
                <div class="lesson-item"><span class="icon-small">${icons.lesson}</span><div><strong>Loops: while & for</strong><br>5 min</div></div>
                <button class="btn-primary" style="margin-top:12px;" id="startPracticeBtn">Start practice →</button>
            `;
        }

        function renderProgress() {
            return `
                <div class="header">
                    <h2>Progress</h2>
                    <div class="profile-icon" id="profileIconHeader">${icons.profile}</div>
                </div>
                <div class="grid-2">
                    <div class="stat-card">📊 82%<br> <span style="font-size:0.8rem;">overall</span></div>
                    <div class="stat-card">⏱️ 4.2h<br> <span style="font-size:0.8rem;">this week</span></div>
                </div>
                <div style="background:var(--card); border-radius:24px; padding:16px;">
                    <span style="display:flex; gap:16px; align-items:center;">${icons.chart} weekly activity</span>
                    <div style="height:80px; display:flex; gap:6px; align-items:end; margin:16px 0;">
                        <div style="background:var(--primary); width:20%; height:40px; border-radius:12px;"></div>
                        <div style="background:var(--primary); width:20%; height:60px; border-radius:12px;"></div>
                        <div style="background:var(--primary); width:20%; height:28px; border-radius:12px;"></div>
                        <div style="background:var(--primary); width:20%; height:80px; border-radius:12px;"></div>
                        <div style="background:var(--primary); width:20%; height:50px; border-radius:12px;"></div>
                    </div>
                </div>
                <div style="margin:16px 0"><strong>Badges (4)</strong> 🏅🏅🏅🏅</div>
                <div class="progress-bar-bg"><div class="progress-fill" style="width:47%"></div></div>
                <div style="margin-top:16px;">Next badge: 50 exercises</div>
            `;
        }

        function renderSettings() {
            return `
                <div class="header">
                    <h2>Settings</h2>
                    <div class="profile-icon" id="profileIconHeader">${icons.profile}</div>
                </div>
                <div style="background:var(--card); border-radius:24px; padding:16px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span>🌙 Dark mode</span>
                        <label><input type="checkbox" id="darkModeToggle" ${darkMode ? 'checked' : ''}></label>
                    </div>
                    <div style="margin:20px 0;">🔔 Notifications</div>
                    <div>🌐 Language: English</div>
                </div>
                <div style="margin-top:24px; color:var(--text-light)">App version 2.6 · learn python</div>
            `;
        }

        function updateScreen() {
            let content = '';
            if (currentScreen === 'onboarding') content = renderOnboarding();
            else if (currentScreen === 'home') content = renderHome();
            else if (currentScreen === 'learn') content = renderLearn();
            else if (currentScreen === 'progress') content = renderProgress();
            else if (currentScreen === 'settings') content = renderSettings();

            root.innerHTML = content;

            // re-attach profile click (from header)
            const profileHeader = document.getElementById('profileIconHeader');
            if (profileHeader) profileHeader.addEventListener('click', ()=>{
                currentScreen = 'settings';
                updateScreen();
                setActiveNav('settings');
            });

            // onboarding buttons
            if (currentScreen === 'onboarding') {
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                    currentScreen = 'home';
                    updateScreen();
                    setActiveNav('home');
                });
                document.getElementById('privacyLink')?.addEventListener('click', ()=>showModal('Privacy Policy','We respect your data. No tracking.'));
                document.getElementById('termsLink')?.addEventListener('click', ()=>showModal('Terms of Service','Educational use only.'));
            }

            if (currentScreen === 'settings') {
                const toggle = document.getElementById('darkModeToggle');
                if (toggle) {
                    toggle.checked = darkMode;
                    toggle.addEventListener('change', (e)=>{
                        darkMode = e.target.checked;
                        applyTheme();
                        updateScreen();  // reflect checkbox state
                    });
                }
            }

            // extra: start practice button
            const startBtn = document.getElementById('startPracticeBtn');
            if (startBtn) startBtn.addEventListener('click', ()=>{
                alert('Starting Python practice! (simulated)');
            });

            const quickLesson = document.getElementById('quickLesson');
            if (quickLesson) quickLesson.addEventListener('click', ()=>{
                alert('Opening lesson: For loops');
            });
        }

        function setActiveNav(tab) {
            navItems.forEach(item => {
                const tabName = item.dataset.tab;
                if (tabName === tab) item.classList.add('active');
                else item.classList.remove('active');
            });
        }

        // bottom nav listeners
        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                const tab = item.dataset.tab;
                if (tab === 'home') currentScreen = 'home';
                else if (tab === 'learn') currentScreen = 'learn';
                else if (tab === 'progress') currentScreen = 'progress';
                else if (tab === 'settings') currentScreen = 'settings';
                updateScreen();
                setActiveNav(tab);
            });
        });

        // screenshot function (shift+W)
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                const container = document.getElementById('phoneContainer');
                html2canvas?.(container, { scale: 2 }).then(canvas => {
                    // fake download (since html2canvas not included we fallback)
                    console.log('screenshot captured (simulated)');
                    // simulate sequential naming
                    let filename = darkMode ? '6.png' : (screenshotCounter + '.png');
                    if (!darkMode && screenshotCounter < 6) {
                        filename = screenshotCounter + '.png';
                        screenshotCounter = (screenshotCounter % 5) + 1;
                    } else if (darkMode) filename = '6.png';
                    alert('Screenshot saved as ' + filename + ' (demo — would download)');
                }).catch(()=> alert('html2canvas not loaded — use browser screenshot.'));
            }
        });

        // add dummy html2canvas to avoid crash (but we show alert)
        window.html2canvas = null; // we simulate

        // initial render
        updateScreen();
        setActiveNav('home'); // but screen is onboarding, nav later
        applyTheme();
    })();
</script>

<!-- include html2canvas from CDN (for real screenshot) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

        };
        console.log('Play Store metadata:', titles);
        // show in document as pre, but also add to bottom
        const pre = document.createElement('pre');
        pre.style.position = 'fixed'; pre.style.bottom = '10px'; pre.style.left='10px'; pre.style.background='#111'; pre.style.color='#0f0'; pre.style.padding='4px'; pre.style.fontSize='10px'; pre.style.zIndex=9999;
        pre.textContent = 'titles = ' + JSON.stringify(titles, null, 2);
