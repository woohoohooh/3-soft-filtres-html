```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Playground • mobile prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #1e2b3c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg-primary);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2d3e4f;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s;
        }

        /* theme variables */
        :root {
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --nav-bg: #FFFFFF;
            --icon-stroke: currentColor;
            --shadow: 0 4px 12px rgba(0,0,0,0.03);
        }

        body.dark {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --nav-bg: #1E293B;
            --shadow: 0 4px 12px rgba(0,0,0,0.4);
        }

        /* main content */
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px 12px 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) transparent;
        }

        /* header (used inside each screen) */
        .screen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .screen-header h2 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }
        .profile-icon {
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
        }
        .profile-icon:hover {
            background: var(--border-light);
        }

        /* bottom nav */
        .bottom-nav {
            height: 70px;
            background: var(--nav-bg);
            border-top: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 8px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            cursor: pointer;
            flex: 1;
            border-radius: 20px;
            padding: 6px 0;
            transition: all 0.15s ease;
            color: var(--inactive);
            fill: none;
            stroke: var(--inactive);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-item.active {
            color: var(--primary);
            stroke: var(--primary);
            background: rgba(37, 99, 235, 0.08);
            transform: scale(1.02);
        }
        .nav-item.active svg {
            transform: scale(1.1);
            stroke: var(--primary);
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
        }
        .nav-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* cards & UI */
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            border: 1px solid var(--border-light);
        }
        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 12px;
        }
        .progress-bar {
            height: 8px;
            background: var(--border-light);
            border-radius: 40px;
            margin: 12px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 8px;
            background: var(--primary);
            width: 0%;
            border-radius: 40px;
            transition: width 0.3s ease;
        }
        .btn {
            background: var(--primary);
            color: white;
            font-weight: 600;
            padding: 14px;
            border-radius: 60px;
            text-align: center;
            cursor: pointer;
            border: none;
            width: 100%;
            font-size: 16px;
            transition: 0.15s;
        }
        .btn-small {
            background: var(--primary-dark);
            padding: 10px 16px;
            font-size: 14px;
            width: auto;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-item {
            background: var(--bg-primary);
            padding: 14px;
            border-radius: 20px;
        }
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: var(--bg-card);
            width: 280px;
            padding: 24px;
            border-radius: 36px;
            color: var(--text-primary);
            text-align: center;
        }

        /* screen visibility */
        .screen {
            display: none;
            height: 100%;
            flex-direction: column;
        }
        .screen.active {
            display: flex;
        }

        /* onboarding links */
        .legal-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 16px;
            font-size: 12px;
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
        }

        /* svg defaults */
        svg.icon {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .chart-svg {
            width: 100%;
            height: 80px;
            margin: 12px 0;
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- screens will be injected via js -->
</div>

<script>
    (function() {
        // ---------- THEME ----------
        let currentTheme = 'light';
        const themeToggle = () => {
            document.body.classList.toggle('dark');
            currentTheme = document.body.classList.contains('dark') ? 'dark' : 'light';
        };

        // ---------- ICONS (inline svg, 2px rounded) ----------
        const icons = {
            home: `<svg class="icon" viewBox="0 0 24 24"><path d="M3 10L12 3L21 10L21 21H15V15H9V21H3L3 10Z" /></svg>`,
            learn: `<svg class="icon" viewBox="0 0 24 24"><path d="M4 20L12 4L20 20L16 20L12 12L8 20L4 20Z"/><path d="M6 16H18"/></svg>`,
            progress: `<svg class="icon" viewBox="0 0 24 24"><path d="M21 12C21 13.2 20.5 15 19 16.5C17.5 18 15.2 19 12 19C8.8 19 6.5 18 5 16.5C3.5 15 3 13.2 3 12C3 10.8 3.5 9 5 7.5C6.5 6 8.8 5 12 5C15.2 5 17.5 6 19 7.5C20.5 9 21 10.8 21 12Z"/><circle cx="12" cy="12" r="3"/></svg>`,
            settings: `<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15L20.6 9L18 7.5L16.4 4.5L12 5L7.6 4.5L6 7.5L3.4 9L4.6 15L3.4 21L6 22.5L7.6 19.5L12 20L16.4 19.5L18 22.5L20.6 21L19.4 15Z"/></svg>`,
            profile: `<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/></svg>`,
            lesson: `<svg class="icon" viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M6 4v12"/><path d="M12 4v12"/><path d="M18 4v12"/></svg>`,
            chart: `<svg class="icon" viewBox="0 0 24 24"><path d="M21 21H3"/><path d="M7 15v4"/><path d="M12 11v8"/><path d="M17 7v12"/></svg>`,
            flashcards: `<svg class="icon" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6"/><path d="M9 12h6"/><path d="M9 16h4"/></svg>`,
            play: `<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M10 8v8l6-4-6-4z"/></svg>`,
            check: `<svg class="icon" viewBox="0 0 24 24"><path d="M20 6L9 17L4 12"/></svg>`,
        };

        // ---------- APP STATE ----------
        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
        let screenshotCounter = 1;

        // ---------- SCREENS DEFINITION (html strings) ----------
        function getOnboarding() {
            return `
                <div class="screen-header">
                    <h2>🐍 Python</h2>
                    <div class="profile-icon" data-nav="settings">${icons.profile}</div>
                </div>
                <div class="card" style="text-align: center;">
                    <div style="font-size: 60px; margin: 20px 0;">🐍</div>
                    <h1 style="font-size: 36px; font-weight: 700;">Pythonic</h1>
                    <p style="font-size: 18px; color: var(--primary);">learn by doing</p>
                    <p style="margin: 24px 0 16px; color: var(--text-secondary);">Bite‑sized Python challenges & real‑time feedback. Perfect for beginners.</p>
                    <div class="btn" id="getStartedBtn">Get Started</div>
                    <div class="legal-links">
                        <span id="privacyLink">Privacy Policy</span>
                        <span id="termsLink">Terms of Service</span>
                    </div>
                </div>
            `;
        }

        function getHome() {
            return `
                <div class="screen-header">
                    <h2>Home</h2>
                    <div class="profile-icon" data-nav="settings">${icons.profile}</div>
                </div>
                <div class="card" style="background: linear-gradient(145deg, var(--primary), var(--accent)); color: white;">
                    <div class="flex-row"><span class="badge">🔥 7 day streak</span><span>⭐ 340 XP</span></div>
                    <p style="font-size: 20px; font-weight: 600; margin-top: 16px;">Continue where you left:</p>
                    <div class="flex-row" style="margin:12px 0"><span>Variables & Data types</span><span>75%</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div>
                    <div class="btn btn-small" id="resumeLessonBtn" style="background:white; color:var(--primary);">resume →</div>
                </div>
                <div class="card">
                    <div class="flex-row"><span style="font-weight:600;">Today’s plan</span>${icons.play}</div>
                    <div style="display: flex; gap: 12px; margin-top: 16px;">
                        <div style="flex:1; background:var(--bg-primary); border-radius: 20px; padding: 12px;"><span>📘 Loops</span><span style="float:right;">3 ex</span></div>
                        <div style="flex:1; background:var(--bg-primary); border-radius: 20px; padding: 12px;"><span>🧩 Lists</span><span style="float:right;">2 ex</span></div>
                    </div>
                </div>
                <div class="card">
                    <span style="font-weight:600;">flashcards review</span>
                    <div class="flex-row" style="margin-top:8px;">${icons.flashcards} <span>8 due · </span><span class="badge">practice</span></div>
                </div>
            `;
        }

        function getLearn() {
            return `
                <div class="screen-header">
                    <h2>Learn</h2>
                    <div class="profile-icon" data-nav="settings">${icons.profile}</div>
                </div>
                <div class="card flex-row"><span>📘 Python basics</span>${icons.lesson}<span>12 lessons</span></div>
                <div class="card flex-row"><span>🐍 Functions</span>${icons.lesson}<span>8 lessons</span></div>
                <div class="card flex-row"><span>🧰 OOP</span>${icons.lesson}<span>6 lessons</span></div>
                <div class="card flex-row"><span>📂 File I/O</span>${icons.lesson}<span>4 lessons</span></div>
                <div class="btn" id="startPracticeBtn" style="margin-top:8px;">start practice →</div>
            `;
        }

        function getProgress() {
            return `
                <div class="screen-header">
                    <h2>Progress</h2>
                    <div class="profile-icon" data-nav="settings">${icons.profile}</div>
                </div>
                <div class="card">
                    <div class="stat-grid">
                        <div class="stat-item">🔥 7 days</div><div class="stat-item">⚡ 340 XP</div>
                        <div class="stat-item">📚 23 lessons</div><div class="stat-item">🏆 4 badges</div>
                    </div>
                </div>
                <div class="card">
                    <div>weekly activity</div>
                    <svg class="chart-svg" viewBox="0 0 200 60" stroke="var(--primary)" fill="none" stroke-width="2">
                        <polyline points="10,50 30,30 50,40 70,20 90,25 110,10 130,30 150,15 170,20 190,5" />
                    </svg>
                </div>
                <div class="card flex-row"><span>🏅 Python novice</span><span class="badge">75%</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div>
            `;
        }

        function getSettings() {
            const darkChecked = document.body.classList.contains('dark') ? 'checked' : '';
            return `
                <div class="screen-header">
                    <h2>Settings</h2>
                    <div class="profile-icon" data-nav="settings">${icons.profile}</div>
                </div>
                <div class="card flex-row"><span>👤 Username</span><span style="color:var(--primary)">pythonista</span></div>
                <div class="card flex-row" id="themeToggleCard">
                    <span>🌙 Dark mode</span>
                    <label style="width: 44px; height: 24px; background: var(--border-light); border-radius: 60px; display: inline-block; cursor: pointer; position:relative;">
                        <input type="checkbox" id="darkmodeCheck" style="opacity:0; width:0; height:0;" ${darkChecked}>
                        <span style="position: absolute; left: 2px; top:2px; width:20px; height:20px; border-radius:50%; background:var(--primary); transition:0.2s; ${darkChecked ? 'transform:translateX(20px);' : ''}"></span>
                    </label>
                </div>
                <div class="card flex-row"><span>🔔 Notifications</span><span>on</span></div>
                <div class="card flex-row"><span>🔒 Privacy</span><span> </span></div>
            `;
        }

        // ---------- RENDER ----------
        const appEl = document.querySelector('.phone');
        function renderScreen(screenId) {
            let html = '';
            if (screenId === 'onboarding') html = getOnboarding();
            else if (screenId === 'home') html = getHome();
            else if (screenId === 'learn') html = getLearn();
            else if (screenId === 'progress') html = getProgress();
            else if (screenId === 'settings') html = getSettings();

            // wrap screen
            const fullHtml = `<div class="screen active" id="screen-${screenId}">${html}</div>`;
            // remove previous screens
            const existing = appEl.querySelectorAll('.screen');
            existing.forEach(el => el.remove());
            appEl.insertAdjacentHTML('afterbegin', fullHtml);

            // bottom nav
            let bottomNav = appEl.querySelector('.bottom-nav');
            if (!bottomNav) {
                bottomNav = document.createElement('div');
                bottomNav.className = 'bottom-nav';
                appEl.appendChild(bottomNav);
            }
            // fill bottom nav
            const navItems = [
                { id: 'home', icon: icons.home, label: 'Home' },
                { id: 'learn', icon: icons.learn, label: 'Learn' },
                { id: 'progress', icon: icons.progress, label: 'Progress' },
                { id: 'settings', icon: icons.settings, label: 'Settings' }
            ];
            bottomNav.innerHTML = navItems.map(item => {
                const activeClass = (currentScreen === item.id && currentScreen !== 'onboarding') ? 'active' : '';
                return `<div class="nav-item ${activeClass}" data-nav="${item.id}"><div class="nav-icon">${item.icon}</div><span>${item.label}</span></div>`;
            }).join('');

            // attach listeners
            document.querySelectorAll('[data-nav]').forEach(el => {
                el.addEventListener('click', (e) => {
                    const target = e.currentTarget.getAttribute('data-nav');
                    if (target === 'settings') currentScreen = 'settings';
                    else if (target === 'home' || target === 'learn' || target === 'progress' || target === 'settings') currentScreen = target;
                    renderScreen(currentScreen);
                });
            });

            // extra listeners for buttons / modals
            if (screenId === 'onboarding') {
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                    currentScreen = 'home';
                    renderScreen('home');
                });
                document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy Policy', 'We respect your data. (demo)'));
                document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms of Service', 'Keep learning, be nice.'));
            }
            if (screenId === 'settings') {
                const chk = document.getElementById('darkmodeCheck');
                if (chk) {
                    chk.addEventListener('change', (e)=>{
                        themeToggle();
                        renderScreen('settings'); // refresh to update toggle appearance
                    });
                }
            }
            if (screenId === 'home') {
                document.getElementById('resumeLessonBtn')?.addEventListener('click', ()=> showModal('Continue', 'Opening variables lesson...'));
            }
            if (screenId === 'learn') {
                document.getElementById('startPracticeBtn')?.addEventListener('click', ()=> showModal('Practice', 'Random quiz started!'));
            }

            // update active class after potential nav change
            document.querySelectorAll('.nav-item').forEach(item => {
                const navTo = item.dataset.nav;
                if (navTo === currentScreen) item.classList.add('active');
                else item.classList.remove('active');
            });
        }

        // simple modal
        function showModal(title, msg) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `<div class="modal-card"><h3>${title}</h3><p style="margin:20px 0">${msg}</p><div class="btn" id="closeModal">OK</div></div>`;
            document.body.appendChild(modal);
            document.getElementById('closeModal')?.addEventListener('click', ()=> modal.remove());
            modal.addEventListener('click', (e) => { if(e.target === modal) modal.remove(); });
        }

        // screenshot functionality (shift+W)
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                // In a real prototype, we'd use html2canvas. Here we simulate by generating a text info.
                // but we respect sequential naming
                let filename = (currentTheme === 'dark' ? '6' : screenshotCounter) + '.png';
                if (currentTheme === 'dark') filename = '6.png';
                else {
                    filename = screenshotCounter + '.png';
                    screenshotCounter = screenshotCounter < 5 ? screenshotCounter+1 : 5;
                }
                alert(`📸 Screenshot saved as ${filename} (simulated)`);
            }
        });

        // start with onboarding
        currentScreen = 'onboarding';
        renderScreen('onboarding');
    })();
</script>
</body>
</html>
