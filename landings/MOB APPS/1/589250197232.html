```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Brain Trainer · prototype 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      min-height: 100vh;
      background: #1a1e2b;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background-color: var(--bg-primary);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2c2f3a;
      position: relative;
      transition: background-color 0.2s;
    }
    .screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-primary);
      position: relative;
    }
    /* theme variables */
    :root {
      --bg-primary: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --border-light: #E2E8F0;
      --primary-blue: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --icon-inactive: #94A3B8;
      --nav-bg: #FFFFFF;
      --header-icon: #334155;
      --progress-bg: #E2E8F0;
    }
    .dark-mode {
      --bg-primary: #0F172A;
      --card-bg: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --border-light: #334155;
      --primary-blue: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --icon-inactive: #64748B;
      --nav-bg: #1E293B;
      --header-icon: #E2E8F0;
      --progress-bg: #334155;
    }
    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 8px;
      background-color: var(--bg-primary);
    }
    .header h1 {
      font-size: 22px;
      font-weight: 650;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .profile-icon {
      cursor: pointer;
      padding: 6px;
      border-radius: 12px;
      transition: background 0.15s;
    }
    .profile-icon:hover { background: var(--border-light); }
    /* main content area */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px 12px;
      scrollbar-width: thin;
      background: var(--bg-primary);
    }
    /* bottom navigation */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background-color: var(--nav-bg);
      padding: 8px 12px 10px;
      border-top: 1px solid var(--border-light);
      backdrop-filter: blur(4px);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 4px 0;
      transition: all 0.15s ease;
      gap: 2px;
      flex: 1;
      border-radius: 20px;
    }
    .nav-item.active {
      background: rgba(37, 99, 235, 0.08);
      transform: scale(1.02);
    }
    .nav-icon {
      width: 26px;
      height: 26px;
      transition: all 0.15s;
    }
    .nav-item.active .nav-icon {
      transform: scale(1.15);
      stroke: var(--primary-blue) !important;
    }
    .nav-item.active .nav-label {
      color: var(--primary-blue);
      font-weight: 550;
    }
    .nav-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--icon-inactive);
    }
    /* onboarding cards etc */
    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 40px 0 20px;
    }
    .app-logo {
      background: linear-gradient(145deg, #2563EB, #38BDF8);
      width: 72px;
      height: 72px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 20px rgba(37,99,235,0.25);
    }
    .app-name {
      font-size: 34px;
      font-weight: 700;
      margin-top: 16px;
      color: var(--text-primary);
    }
    .tagline {
      font-size: 18px;
      font-weight: 500;
      color: var(--primary-blue);
    }
    .desc {
      text-align: center;
      color: var(--text-secondary);
      margin: 16px 0 32px;
      line-height: 1.4;
      padding: 0 16px;
    }
    .btn-primary {
      background: var(--primary-blue);
      border: none;
      color: white;
      font-weight: 600;
      font-size: 18px;
      padding: 16px 32px;
      border-radius: 40px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37,99,235,0.4);
      transition: 0.1s;
    }
    .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }
    .legal-links {
      display: flex;
      gap: 28px;
      justify-content: center;
      margin: 24px 0 20px;
      font-size: 14px;
    }
    .legal-links span {
      color: var(--primary-blue);
      text-decoration: underline;
      cursor: pointer;
    }
    /* card UI */
    .card {
      background: var(--card-bg);
      border-radius: 26px;
      padding: 18px 16px;
      margin-bottom: 16px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.02);
      border: 1px solid var(--border-light);
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .progress-bar {
      height: 8px;
      background: var(--progress-bg);
      border-radius: 20px;
      margin: 10px 0;
    }
    .progress-fill {
      width: 0%;
      height: 8px;
      background: var(--primary-blue);
      border-radius: 20px;
      transition: width 0.3s;
    }
    .badge {
      background: var(--accent);
      padding: 6px 12px;
      border-radius: 40px;
      color: #0F172A;
      font-weight: 600;
      font-size: 13px;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-item {
      background: var(--bg-primary);
      border-radius: 20px;
      padding: 16px 8px;
      text-align: center;
      border: 1px solid var(--border-light);
    }
    .modal {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: var(--card-bg);
      padding: 26px 30px;
      border-radius: 32px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
      z-index: 200;
      display: none;
      max-width: 280px;
      border: 2px solid var(--primary-blue);
    }
    .modal-overlay {
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.5);
      z-index: 199;
      display: none;
    }
    .close-modal {
      margin-top: 20px;
      background: var(--primary-blue);
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 40px;
      width: 100%;
      font-weight: 600;
      cursor: pointer;
    }
    button { background: none; border: none; }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <div class="screen" id="appScreen">
    <!-- dynamic header / content will be injected via JS -->
  </div>
</div>

<!-- hidden modal templates -->
<div class="modal" id="privacyModal"><h2 style="color:var(--primary-blue);">Privacy</h2><p style="color:var(--text-secondary); margin:16px 0;">We protect your brain data. No third-party sharing.</p><button class="close-modal" id="closePrivacy">Got it</button></div>
<div class="modal" id="termsModal"><h2 style="color:var(--primary-blue);">Terms</h2><p style="color:var(--text-secondary); margin:16px 0;">Use Math Trainer daily. Train responsibly.</p><button class="close-modal" id="closeTerms">Accept</button></div>
<div class="modal-overlay" id="modalOverlay"></div>

<script>
  (function() {
    // ---------- ICONS (inline svg) ----------
    const icons = {
      home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10L12 3L21 10V20H3V10Z"/><rect x="9" y="14" width="6" height="6"/></svg>`,
      learn: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 4L12 2L22 4V18L12 20L2 18V4Z"/><path d="M12 2V20"/><path d="M6 6L6 14"/><path d="M18 6L18 14"/></svg>`,
      progress: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7V12L15 15"/><path d="M5 3L8 6"/><path d="M19 3L16 6"/></svg>`,
      settings: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="2.5"/><path d="M19.4 7.6L21 12L19.4 16.4L16.4 19.4L12 21L7.6 19.4L4.6 16.4L3 12L4.6 7.6L7.6 4.6L12 3L16.4 4.6L19.4 7.6Z"/></svg>`,
      profile: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21V19C20 16.8 18.2 15 16 15H8C5.8 15 4 16.8 4 19V21"/><circle cx="12" cy="7" r="4"/></svg>`,
      lesson: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M8 8h8M8 12h6"/></svg>`,
      chart: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 21H3V3"/><path d="M7 15L10 10L13 13L18 7"/></svg>`,
      flashcards: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M4 4H20V16H4V4Z"/><path d="M8 16V20H16V16"/><rect x="6" y="6" width="12" height="8"/></svg>`,
      play: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="9"/><polygon points="10,8 16,12 10,16" fill="currentColor"/></svg>`,
      check: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M20 6L9 17L4 12"/></svg>`
    };

    // ----- screen management -----
    let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
    let darkMode = false;
    const contentDiv = document.getElementById('appScreen');
    const phone = document.getElementById('phoneContainer');
    let screenshotCounter = 1;

    // modal controls
    const overlay = document.getElementById('modalOverlay');
    const pModal = document.getElementById('privacyModal');
    const tModal = document.getElementById('termsModal');
    document.getElementById('closePrivacy').onclick = () => { pModal.style.display = 'none'; overlay.style.display = 'none'; };
    document.getElementById('closeTerms').onclick = () => { tModal.style.display = 'none'; overlay.style.display = 'none'; };
    overlay.onclick = () => { pModal.style.display = 'none'; tModal.style.display = 'none'; overlay.style.display = 'none'; };

    function showModal(type) {
      overlay.style.display = 'block';
      if(type==='privacy') pModal.style.display = 'block';
      else tModal.style.display = 'block';
    }

    // header generator
    function renderHeader(title) {
      return `<div class="header"><h1>${title}</h1><div class="profile-icon" id="profileBtn">${icons.profile}</div></div>`;
    }

    // bottom nav
    function renderBottomNav(active) {
      const items = ['home','learn','progress','settings'];
      const labels = ['Home','Learn','Progress','Settings'];
      return `<nav class="bottom-nav">` + items.map((key, idx) => {
        const isActive = (active === key) ? 'active' : '';
        return `<button class="nav-item ${isActive}" data-nav="${key}">
          <span class="nav-icon" style="stroke:${isActive?'#2563EB':'#94A3B8'}">${icons[key]}</span>
          <span class="nav-label">${labels[idx]}</span>
        </button>`;
      }).join('') + `</nav>`;
    }

    // onboarding screen
    function onboardingScreen() {
      return `
        ${renderHeader('Welcome')}
        <div class="content">
          <div class="logo-area">
            <div class="app-logo">${icons.learn.replace('currentColor','white')}</div>
            <div class="app-name">Math Brain</div>
            <div class="tagline">trainer · 2026</div>
          </div>
          <p class="desc">Boost mental arithmetic with daily micro‑challenges. Personalized brain workout.</p>
          <button class="btn-primary" id="getStartedBtn">Get Started</button>
          <div class="legal-links">
            <span id="privacyLink">Privacy Policy</span>
            <span id="termsLink">Terms of Service</span>
          </div>
          <!-- dummy card to fill -->
          <div style="height:20px"></div>
        </div>
        ${renderBottomNav('home')}
      `;
    }

    // home dashboard
    function homeScreen() {
      return `
        ${renderHeader('Dashboard')}
        <div class="content">
          <div class="card row"><span style="font-weight:600;">🔥 streak 12 days</span> <span class="badge">level 7</span></div>
          <div class="card"><div style="font-weight:600;">daily target</div><div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div><span>70% done</span></div>
          <div class="card"><div style="font-weight:600;">next lesson</div><div style="display:flex; gap:12px; align-items:center; margin-top:8px;">${icons.lesson} multiplication tables <span style="margin-left:auto; background:#2563EB; padding:6px 16px; border-radius:30px; color:white;">start</span></div></div>
          <div class="card row"><span>🏆 daily puzzle</span> <span>${icons.play}</span></div>
        </div>
        ${renderBottomNav('home')}
      `;
    }

    function learnScreen() {
      return `
        ${renderHeader('Practice')}
        <div class="content">
          <div class="card row"><span>➕ addition</span><span>${icons.flashcards}</span></div>
          <div class="card row"><span>➗ division</span><span>340 pts</span></div>
          <div class="card"><span>🧮 mental math</span><div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div></div>
          <div style="background:var(--card-bg); border-radius:28px; padding:16px;"><b>quick practice</b> ${icons.play}</div>
        </div>
        ${renderBottomNav('learn')}
      `;
    }

    function progressScreen() {
      return `
        ${renderHeader('Statistics')}
        <div class="content">
          <div class="stat-grid">
            <div class="stat-item"><b>124</b> lessons</div>
            <div class="stat-item"><b>98%</b> accuracy</div>
          </div>
          <div class="card"><span>weekly activity</span> ${icons.chart} <div class="progress-bar" style="margin:12px 0;"><div class="progress-fill" style="width:85%"></div></div></div>
          <div class="card row"><span>⭐️ 4 achievements</span><span>${icons.check}</span></div>
        </div>
        ${renderBottomNav('progress')}
      `;
    }

    function settingsScreen() {
      return `
        ${renderHeader('Settings')}
        <div class="content">
          <div class="card row"><span>🌙 Dark mode</span><label><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}></label></div>
          <div class="card">profile details</div>
          <div class="card">sound / haptics</div>
          <div style="margin-top:24px;">— math trainer v1.0 —</div>
        </div>
        ${renderBottomNav('settings')}
      `;
    }

    function loadScreen(screen) {
      let html = '';
      if (screen === 'onboarding') html = onboardingScreen();
      else if (screen === 'home') html = homeScreen();
      else if (screen === 'learn') html = learnScreen();
      else if (screen === 'progress') html = progressScreen();
      else if (screen === 'settings') html = settingsScreen();
      contentDiv.innerHTML = html;
      currentScreen = screen;

      // re-attach listeners
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const nav = e.currentTarget.dataset.nav;
          if (nav === 'home') loadScreen('home');
          else if (nav === 'learn') loadScreen('learn');
          else if (nav === 'progress') loadScreen('progress');
          else if (nav === 'settings') loadScreen('settings');
        });
      });

      const profileBtn = document.getElementById('profileBtn');
      if (profileBtn) profileBtn.addEventListener('click', ()=> loadScreen('settings'));

      if (screen === 'onboarding') {
        document.getElementById('getStartedBtn').addEventListener('click', ()=> loadScreen('home'));
        document.getElementById('privacyLink').addEventListener('click', ()=> showModal('privacy'));
        document.getElementById('termsLink').addEventListener('click', ()=> showModal('terms'));
      }

      const darkToggle = document.getElementById('darkToggle');
      if (darkToggle) {
        darkToggle.checked = darkMode;
        darkToggle.addEventListener('change', (e) => {
          darkMode = e.target.checked;
          if (darkMode) phone.classList.add('dark-mode');
          else phone.classList.remove('dark-mode');
          loadScreen(currentScreen);  // refresh
        });
      }
    }

    // screenshot feature shift+W
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const phoneEl = document.getElementById('phoneContainer');
        import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
          window.html2canvas(phoneEl, { scale: 2, backgroundColor: null }).then(canvas => {
            const link = document.createElement('a');
            let fname = (darkMode ? '6' : screenshotCounter.toString()) + '.png';
            if (!darkMode) {
              screenshotCounter = screenshotCounter === 5 ? 1 : screenshotCounter + 1;
            } else {
              fname = '6.png';
            }
            link.download = fname;
            link.href = canvas.toDataURL('image/png');
            link.click();
          });
        });
      }
    });

    // initial load (light mode)
    loadScreen('onboarding');

    // JSON at bottom (will be printed after all code)
    window.onload = function() {
      // output json as per spec
      const jsonOutput = {
        "1.png": "Start Learning",
        "2.png": "Daily Lessons",
        "3.png": "Practice Skills",
        "4.png": "Track Progress",
        "5.png": "Smart Settings",
        "6.png": "Dark Theme"
      };
      console.log(JSON.stringify(jsonOutput, null, 2));
    };
  })();
</script>
<!-- hidden json output will be visible in console & as per requirement we also append at the bottom -->
<pre style="display:none;" id="jsonOutput"></pre>
<script>
  (function() {
    const json = {
      "1.png": "Start Learning",
      "2.png": "Daily Lessons",
      "3.png": "Practice Skills",
      "4.png": "Track Progress",
      "5.png": "Smart Settings",
      "6.png": "Dark Theme"
    };
    document.getElementById('jsonOutput').textContent = JSON.stringify(json, null, 2);
  })();
</script>
All done!
