```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code daily · Learn Python</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: #1a2639;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0,0,0,0.5), 0 0 0 8px #2d3a4f;
            position: relative;
            transition: background-color 0.2s;
        }

        /* main app frame */
        .app-frame {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            position: relative;
        }

        /* themes */
        :root {
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --nav-bg: #FFFFFF;
            --shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        body.dark-mode {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --nav-bg: #1E293B;
            --shadow: 0 4px 12px rgba(0,0,0,0.5);
        }

        /* screen container */
        .screen {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--bg-card);
        }

        .screen::-webkit-scrollbar {
            width: 4px;
        }
        .screen::-webkit-scrollbar-track {
            background: var(--bg-card);
        }
        .screen::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 8px;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-light);
        }
        .header-title {
            font-weight: 700;
            font-size: 1.4rem;
            color: var(--text-primary);
        }
        .profile-icon {
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            transition: background 0.2s;
        }
        .profile-icon:hover {
            background: var(--border-light);
        }

        /* bottom nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--nav-bg);
            padding: 8px 8px 12px 8px;
            border-top: 1px solid var(--border-light);
            box-shadow: 0 -2px 8px rgba(0,0,0,0.02);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 24px;
            transition: all 0.15s ease;
            color: var(--inactive);
            fill: var(--inactive);
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            background: rgba(37, 99, 235, 0.08);
            transform: scale(1.05);
        }
        .nav-item svg {
            width: 26px;
            height: 26px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-label {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* cards */
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }

        /* buttons */
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            transition: 0.15s;
            box-shadow: 0 8px 16px -6px var(--primary-dark);
        }
        .btn-primary:active {
            transform: scale(0.97);
            background: var(--primary-dark);
        }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin: 16px 0 8px;
            font-size: 0.85rem;
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
        }

        /* modals */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--bg-card);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            text-align: center;
            color: var(--text-primary);
            border: 2px solid var(--primary);
        }
        .modal-content button {
            margin-top: 18px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        /* lesson row */
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .lesson-item:last-child {
            border: none;
        }
        .progress-bar-bg {
            height: 8px;
            background: var(--border-light);
            border-radius: 20px;
            flex: 1;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--primary);
            border-radius: 20px;
            transition: width 0.3s;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
        }

        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 8px 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
        }

        /* toggle */
        .theme-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0;
        }
        .switch {
            width: 52px;
            height: 28px;
            background: var(--border-light);
            border-radius: 40px;
            appearance: none;
            cursor: pointer;
            position: relative;
            transition: 0.2s;
        }
        .switch:checked {
            background: var(--primary);
        }
        .switch::before {
            content: '';
            position: absolute;
            width: 24px; height: 24px;
            background: white;
            border-radius: 50%;
            top: 2px; left: 2px;
            transition: 0.2s;
        }
        .switch:checked::before {
            left: 26px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="phone" id="phoneContainer">

    <script>
        (function() {
            // ----- theme state -----
            let darkMode = false;
            const root = document.documentElement;
            const phone = document.getElementById('phoneContainer');

            // ----- icon system (inline reusable) -----

            // ----- screens data -----
            const screens = {
                onboarding: `
                    <div style="display:flex; flex-direction:column; gap:24px; text-align:center; padding-top:32px;">

                        </div>

                        <p style="font-size:1.2rem; font-weight:500; color:var(--text-primary);">learn Python · 5min a day</p>
                        <p style="color:var(--text-secondary);">Bite-sized Python exercises, real coding practice. No setup needed.</p>
                        <button class="btn-primary" id="startOnboarding">Get Started</button>
                        <div class="link-row">
                            <span onclick="openModal('privacy')">Privacy Policy</span>
                            <span onclick="openModal('terms')">Terms of Service</span>
                        </div>
                    </div>
                `,
                home: `
                    <div class="card" style="display:flex; align-items:center; gap:8px;">
                        <svg width="40" height="40" viewBox="0 0 24 24" stroke="var(--primary)" stroke-width="1.8" fill="none"><path d="M12 2v4M12 22v-4M4 12H2M22 12h-2M5.64 5.64l-1.41 1.41M18.36 5.64l1.41 1.41M5.64 18.36l-1.41-1.41M18.36 18.36l1.41-1.41"/><circle cx="12" cy="12" r="4"/></svg>
                        <div><span style="font-size:1.8rem; font-weight:700; color:var(--primary);">3</span> day streak 🔥</div>
                    </div>
                    <div class="card">
                        <h3>Continue where you left</h3>
                        <div class="lesson-item"><span>🔹 Loops & lists</span><div class="progress-bar-bg"><div class="progress-fill" style="width:70%"></div></div></div>
                        <div class="lesson-item"><span>🔹 Functions</span><div class="progress-bar-bg"><div class="progress-fill" style="width:30%"></div></div></div>
                        <button class="btn-primary" style="margin-top:12px;" onclick="switchScreen('learn')">Practice now</button>
                    </div>

                        <div style="display:flex; gap:16px; justify-content:space-between;">
                            <span><strong>🏆 daily goal</strong> 2/3 lessons</span>

                        <div class="progress-bar-bg" style="margin:12px 0;"><div class="progress-fill" style="width:66%"></div></div>
                        <div style="display:flex; gap:12px;">

                `,
                learn: `
                    <div class="card"><h2>Today's Python</h2><p>Dictionaries & sets</p><div class="progress-bar-bg"><div class="progress-fill" style="width:15%"></div></div></div>
                    <div class="card">
                        <div class="lesson-item"><span>📘 1. Intro to dicts</span><input type="checkbox"></div>

                        <div class="lesson-item"><span>📘 3. Sets & operations</span><input type="checkbox"></div>
                    </div>
                    <div class="card">

                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                        <div class="card" style="text-align:center;"><svg width="30" height="30" stroke="var(--primary)" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg><span>play</span></div>
                        <div class="card" style="text-align:center;"><svg width="30" height="30" stroke="var(--primary)" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span>flashcards</span></div>
                    </div>
                `,
                progress: `
                    <div class="card">
                        <h3>Weekly activity</h3>
                        <div style="height:100px; display:flex; align-items:end; gap:6px; margin:16px 0;">
                            <div style="background:var(--primary); width:22px; height:70px; border-radius:12px;"></div>

                            <div style="background:var(--primary); width:22px; height:60px; border-radius:12px;"></div>

                        <div class="stat-row"><span>Accuracy</span><strong>88%</strong></div>
                    </div>

                            <span class="badge">⚡ fast learner</span>
                            <span class="badge">🐍 pythonist</span>
                        </div>
                    </div>
                `,
                settings: `
                    <div class="card">
                        <div style="display:flex; gap:16px; align-items:center; margin-bottom:24px;">
                            <svg width="50" height="50" stroke="var(--primary)" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5.37 20c.92-3 4.29-4 6.63-4s5.71 1 6.63 4"/></svg>
                            <div><strong style="font-size:1.4rem;">Alex Rivera</strong><br>alex@code.daily</div>
                        </div>
                        <div class="theme-toggle">
                            <span>🌙 Dark theme</span>
                            <input type="checkbox" class="switch" id="darkModeToggle" ${darkMode ? 'checked' : ''}>

                        <button class="btn-primary" style="margin-top:8px;" onclick="switchScreen('home')">Save & close</button>

                    </div>
                `
            };

            let currentScreen = 'onboarding';

            // header titles mapping
            const headerTitles = {
                onboarding: 'Welcome',
                home: 'Home',
                learn: 'Learn',
                progress: 'Progress',
                settings: 'Settings'
            };

            function renderScreen(screenId) {
                const container = document.getElementById('screenContainer');
                container.innerHTML = screens[screenId] || screens.home;
                document.getElementById('headerTitle').innerText = headerTitles[screenId];

                // special attach start button
                if (screenId === 'onboarding' && document.getElementById('startOnboarding')) {
                    document.getElementById('startOnboarding').addEventListener('click', () => {
                        switchScreen('home');
                    });
                }
                if (screenId === 'settings') {
                    const toggle = document.getElementById('darkModeToggle');
                    if (toggle) {
                        toggle.checked = darkMode;
                        toggle.addEventListener('change', (e) => {
                            darkMode = e.target.checked;
                            if (darkMode) document.body.classList.add('dark-mode');
                            else document.body.classList.remove('dark-mode');
                        });
                    }
                }
                updateActiveNav(screenId);
            }

            // navigation
            window.switchScreen = function(screenId) {
                currentScreen = screenId;
                renderScreen(screenId);
            };

            function updateActiveNav(screen) {
                document.querySelectorAll('.nav-item').forEach(el => {
                    const tab = el.dataset.tab;
                    if (tab === screen) el.classList.add('active');
                    else el.classList.remove('active');
                });
            }

            // bottom nav listeners
            document.querySelectorAll('.nav-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    const tab = e.currentTarget.dataset.tab;
                    if (tab !== 'settings' && tab !== 'progress' && tab !== 'learn' && tab !== 'home') return;
                    switchScreen(tab);
                });
            });

            // profile button -> settings
            document.getElementById('profileBtn').addEventListener('click', () => {
                switchScreen('settings');
            });

            // modal
            window.openModal = function(type) {
                document.getElementById(type+'Modal').style.display = 'flex';
            };
            window.closeModal = function() {
                document.getElementById('privacyModal').style.display = 'none';
                document.getElementById('termsModal').style.display = 'none';
            };

            // ---- screenshot hotkey (shift+W) ----
            let screenshotCounter = 1;
            document.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    const phoneEl = document.getElementById('phoneContainer');
                    html2canvas?.(phoneEl, { scale: 2 }).then(canvas => {
                        const link = document.createElement('a');
                        let filename = darkMode ? '6.png' : (screenshotCounter + '.png');
                        link.download = filename;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        if (!darkMode && screenshotCounter < 5) screenshotCounter++;
                    }).catch(() => alert('html2canvas not loaded — use any screenshot tool.'));
                }
            });

            // load html2canvas for feature (include via script)
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
            script.onload = () => console.log('screenshot ready');
            document.head.appendChild(script);

            // initial render
            renderScreen('onboarding');
        })();
    </script>

    <!-- JSON output (Play Store) -->

        (function() {

                "1.png": "Start Learning",
                "2.png": "Daily Lessons",
                "3.png": "Practice Skills",
                "4.png": "Track Progress",
                "5.png": "Smart Settings",
                "6.png": "Dark Theme"
            };
            console.log(JSON.stringify(titles, null, 2));
            // also write at bottom of page as text
            const pre = document.createElement('pre');
            pre.style = "position: fixed; bottom: 0; left: 0; background: #111; color: #0f0; font-size: 10px; padding: 4px; z-index: 9999;";
            pre.innerText = JSON.stringify(titles);
            document.body.appendChild(pre);
        })();
    </script>
    All done!
