```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashLearn · vocabulary builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* CSS variables – light mode default */
        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --icon-inactive: #94A3B8;
            --bottom-bg: #FFFFFF;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            --progress-bg: #E2E8F0;
            --badge-bg: #DBEAFE;
            --badge-text: #1E40AF;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --icon-inactive: #64748B;
            --bottom-bg: #1E293B;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
            --progress-bg: #334155;
            --badge-bg: #1E3A8A;
            --badge-text: #BFDBFE;
        }

        body {
            background: #1a202c; /* outer background */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3), 0 0 0 8px #2d3e50;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s;
        }

        /* main app content */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: none;
            background-color: var(--bg);
        }
        .app-screen::-webkit-scrollbar { display: none; }

        /* header */
        .header {
            padding: 16px 20px 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg);
        }
        .header h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-icon {
            cursor: pointer;
            padding: 6px;
            border-radius: 12px;
            transition: background 0.1s;
        }
        .profile-icon:hover { background: var(--border-light); }

        /* main variable content */
        .screen-content {
            flex: 1;
            padding: 12px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* bottom nav */
        .bottom-nav {
            background: var(--bottom-bg);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 10px;
            border-radius: 0 0 48px 48px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 6px 12px 4px;
            border-radius: 24px;
            min-width: 64px;
        }
        .nav-item.active {
            background: rgba(37, 99, 235, 0.1); /* subtle highlight */
        }
        .nav-icon {
            width: 28px;
            height: 28px;
            stroke: var(--icon-inactive);
            stroke-width: 2px;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.15s;
        }
        .nav-item.active .nav-icon {
            stroke: var(--primary);
            transform: scale(1.15);
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            margin-top: 2px;
            color: var(--icon-inactive);
        }
        .nav-item.active .nav-label {
            color: var(--primary);
        }

        /* cards / UI elements */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: var(--shadow);
        }

        .badge {
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .progress-bar {
            background: var(--progress-bg);
            height: 8px;
            border-radius: 20px;
            overflow: hidden;
            width: 100%;
        }
        .progress-fill {
            background: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.4s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            box-shadow: 0 8px 16px -4px rgba(37,99,235,0.3);
        }
        .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }

        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            font-size: 14px;
            color: var(--icon-inactive);
            text-decoration: underline;
            cursor: pointer;
        }

        /* modal overlay (simple) */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }
        .modal-content {
            background: var(--card);
            padding: 32px 24px;
            border-radius: 36px;
            width: 280px;
            text-align: center;
            color: var(--text-primary);
            box-shadow: var(--shadow);
        }

        /* icons inline */
        .icon-defs { display: none; }

        /* onboarding */
        .logo-big {
            width: 72px;
            height: 72px;
            background: linear-gradient(145deg, var(--primary), var(--accent));
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }

        /* statistics row */
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
        }

        /* chart simulation */
        .chart {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 80px;
            margin: 20px 0;
        }
        .bar {
            width: 22px;
            background: var(--primary);
            border-radius: 8px 8px 4px 4px;
            transition: height 0.3s;
        }
    </style>
</head>
<body>
    <div class="phone" id="phoneContainer">
        <!-- hidden inline SVG icon system -->
        <svg style="display:none;" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- home -->
                <symbol id="icon-home" viewBox="0 0 24 24"><path d="M5 12H3L12 3L21 12H19V20H13V14H11V20H5V12Z" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
                <!-- learn (book) -->
                <symbol id="icon-learn" viewBox="0 0 24 24"><path d="M4 19.5C4 18.837 4.26339 18.2011 4.73223 17.7322C5.20107 17.2634 5.83696 17 6.5 17H20" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 2H20V22H6.5C5.83696 22 5.20107 21.7366 4.73223 21.2678C4.26339 20.7989 4 20.163 4 19.5V4.5C4 3.83696 4.26339 3.20107 4.73223 2.73223C5.20107 2.26339 5.83696 2 6.5 2Z" stroke="currentColor" fill="none" stroke-width="2"/></symbol>
                <!-- progress (chart) -->
                <symbol id="icon-progress" viewBox="0 0 24 24"><path d="M21 21H3V3" stroke="currentColor" fill="none" stroke-width="2"/><path d="M7 15L10 10L13 13L19 6" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></symbol>
                <!-- settings (gear) -->
                <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor" fill="none" stroke-width="2"/><path d="M19.4 15C19.2 15.4 19 15.8 18.7 16.1L19.1 17.5C19.2 17.9 19 18.3 18.7 18.6L18.6 18.7C18.3 19 17.9 19.2 17.5 19.1L16.1 18.7C15.8 18.9 15.4 19.1 15 19.2L14.5 20.6C14.4 21 14 21.3 13.6 21.3H12.4C12 21.3 11.6 21 11.5 20.6L11 19.2C10.6 19.1 10.2 18.9 9.9 18.7L8.5 19.1C8.1 19.2 7.7 19 7.4 18.7L7.3 18.6C7 18.3 6.8 17.9 6.9 17.5L7.3 16.1C7.1 15.8 6.9 15.4 6.8 15L5.4 14.5C5 14.4 4.7 14 4.7 13.6V12.4C4.7 12 5 11.6 5.4 11.5L6.8 11C7 10.6 7.2 10.2 7.4 9.9L7 8.5C6.9 8.1 7.1 7.7 7.4 7.4L7.5 7.3C7.8 7 8.2 6.8 8.6 6.9L10 7.3C10.3 7.1 10.7 6.9 11.1 6.8L11.6 5.4C11.7 5 12.1 4.7 12.5 4.7H13.7C14.1 4.7 14.5 5 14.6 5.4L15.1 6.8C15.5 6.9 15.9 7.1 16.2 7.3L17.6 6.9C18 6.8 18.4 7 18.7 7.3L18.8 7.4C19.1 7.7 19.3 8.1 19.2 8.5L18.8 9.9C19 10.2 19.2 10.6 19.3 11L20.7 11.5C21.1 11.6 21.4 12 21.4 12.4V13.6C21.4 14 21.1 14.4 20.7 14.5L19.4 15Z" stroke="currentColor" fill="none" stroke-width="2"/></symbol>
                <!-- profile (simple user) -->
                <symbol id="icon-profile" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" stroke="currentColor" fill="none" stroke-width="2"/><path d="M5 20V18C5 14.686 8.134 12 12 12C15.866 12 19 14.686 19 18V20" stroke="currentColor" fill="none" stroke-width="2"/></symbol>
                <!-- lesson (play) -->
                <symbol id="icon-lesson" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" fill="none" stroke-width="2"/><polygon points="10,8 16,12 10,16" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
                <!-- flashcards -->
                <symbol id="icon-flashcards" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" fill="none" stroke-width="2"/><path d="M9 7H15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M9 11H13" stroke="currentColor" stroke-width="2"/><path d="M9 15H12" stroke="currentColor" stroke-width="2"/></symbol>
                <!-- check -->
                <symbol id="icon-check" viewBox="0 0 24 24"><path d="M20 6L9 17L4 12" stroke="currentColor" fill="none" stroke-width="3" stroke-linecap="round"/></symbol>
                <!-- chart simple -->
                <symbol id="icon-chart" viewBox="0 0 24 24"><path d="M21 21H3V3" stroke="currentColor" fill="none" stroke-width="2"/><path d="M7 15L9 11L12 14L17 7" stroke="currentColor" stroke-width="2"/></symbol>
                <!-- play small -->
                <symbol id="icon-play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" fill="none" stroke-width="2"/><polygon points="10,8 16,12 10,16" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
            </defs>
        </svg>

        <!-- App container (dynamic screens) -->
        <div class="app-screen" id="appScreen">
            <!-- header inserted by js per screen -->
            <div id="dynamicHeader"></div>
            <!-- main screen content -->
            <div id="screenContent" class="screen-content"></div>
        </div>

        <!-- bottom navigation fixed -->
        <div class="bottom-nav" id="bottomNav">
            <div class="nav-item" data-screen="home">
                <svg class="nav-icon"><use href="#icon-home" /></svg>
                <span class="nav-label">Home</span>
            </div>
            <div class="nav-item" data-screen="learn">
                <svg class="nav-icon"><use href="#icon-learn" /></svg>
                <span class="nav-label">Learn</span>
            </div>
            <div class="nav-item" data-screen="progress">
                <svg class="nav-icon"><use href="#icon-progress" /></svg>
                <span class="nav-label">Progress</span>
            </div>
            <div class="nav-item" data-screen="settings">
                <svg class="nav-icon"><use href="#icon-settings" /></svg>
                <span class="nav-label">Settings</span>
            </div>
        </div>
    </div>

    <!-- modal overlay (hidden by default) -->
    <div id="modalOverlay" class="modal" style="display:none;">
        <div class="modal-content" id="modalText"></div>
    </div>

    <script>
        (function() {
            // ----- app state -----
            let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
            let darkMode = false; // default light

            // screens data + render functions
            const app = document.getElementById('appScreen');
            const headerDiv = document.getElementById('dynamicHeader');
            const contentDiv = document.getElementById('screenContent');
            const navItems = document.querySelectorAll('.nav-item');
            const modal = document.getElementById('modalOverlay');
            const modalText = document.getElementById('modalText');

            // icons set (all defined via <use>)

            // ----- helper: header generator -----
            function renderHeader(title) {
                return `
                    <div class="header">
                        <h2>${title}</h2>
                        <div class="profile-icon" id="profileBtn">
                            <svg width="32" height="32" viewBox="0 0 24 24" style="stroke:var(--text-primary);">
                                <use href="#icon-profile" />
                            </svg>
                        </div>
                    </div>
                `;
            }

            // ---- onboarding screen (no bottom nav active) ----
            function renderOnboarding() {
                headerDiv.innerHTML = ''; // no header for onboarding
                contentDiv.innerHTML = `
                    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; gap:32px;">
                        <div style="display:flex; flex-direction:column; align-items:center;">
                            <div class="logo-big">
                                <svg width="48" height="48" viewBox="0 0 24 24" stroke="white" stroke-width="1.8">
                                    <use href="#icon-flashcards" />
                                </svg>
                            </div>
                            <h1 style="font-size:40px; font-weight:800; color:var(--primary);">FlashLearn</h1>
                            <p style="font-size:20px; color:var(--text-secondary);">master English words</p>
                        </div>
                        <div class="card" style="text-align:center;gap:16px;display:flex;flex-direction:column;">
                            <span style="font-weight:500;">Boost your vocabulary with smart flashcards. 5 min a day.</span>
                            <button class="btn-primary" id="getStartedBtn">Get Started</button>
                            <div class="link-row">
                                <span id="privacyLink">Privacy Policy</span>
                                <span id="termsLink">Terms of Service</span>
                            </div>
                        </div>
                    </div>
                `;

                document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                    navigateTo('home');
                });
                document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy Policy · we respect your data.'));
                document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms of Service · educational use only.'));
            }

            // ---- Home Dashboard ----
            function renderHome() {
                headerDiv.innerHTML = renderHeader('Home');
                contentDiv.innerHTML = `
                    <div class="card" style="display:flex; gap:12px; align-items:center;">
                        <span class="badge"><svg width="16" height="16" style="stroke:var(--badge-text);"><use href="#icon-flashcards"/></svg> daily goal</span>
                        <div style="flex:1; height:8px; background:var(--progress-bg); border-radius:20px;"><div class="progress-fill" style="width:70%"></div></div>
                        <span style="font-weight:600;">7/10</span>
                    </div>
                    <div class="card" style="display:flex; flex-direction:column; gap:14px;">
                        <h3 style="color:var(--text-primary);">Continue learning</h3>
                        <div style="display:flex; gap:16px; align-items:center;">
                            <svg width="48" height="48" style="stroke:var(--primary);"><use href="#icon-lesson"/></svg>
                            <div><div style="font-weight:600;">Phrasal verbs</div><span style="color:var(--text-secondary);">5 min left</span></div>
                            <div style="margin-left:auto;"><span class="badge">75%</span></div>
                        </div>
                        <div style="display:flex; gap:16px; align-items:center;">
                            <svg width="48" height="48" style="stroke:var(--primary);"><use href="#icon-flashcards"/></svg>
                            <div><div style="font-weight:600;">Academic words</div><span style="color:var(--text-secondary);">new</span></div>
                            <button class="badge" id="startPracticeBtn" style="background:var(--primary); color:white; border:none;">Start</button>
                        </div>
                    </div>
                    <div class="card">
                        <span style="font-weight:600;">today's streak 🔥 12 days</span>
                    </div>
                `;
                document.getElementById('startPracticeBtn')?.addEventListener('click', ()=> navigateTo('learn'));
            }

            // ---- Learn / Practice ----
            function renderLearn() {
                headerDiv.innerHTML = renderHeader('Practice');
                contentDiv.innerHTML = `
                    <div class="card" style="display:flex; flex-direction:column; gap:12px;">
                        <div style="display:flex; gap:12px;"><svg width="24" style="stroke:var(--primary);"><use href="#icon-lesson"/></svg><span>Lesson 3 · idioms</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div>
                        <button class="btn-primary" style="padding:12px;">continue</button>
                    </div>
                    <div class="card">
                        <div style="display:flex; gap:12px; align-items:center;"><svg width="32" style="stroke:var(--primary);"><use href="#icon-flashcards"/></svg><span style="font-weight:600;">Flashcard round</span></div>
                        <div style="display:flex; gap:8px; margin-top:12px;">
                            <span class="badge">20 cards</span>
                            <span class="badge">new</span>
                        </div>
                    </div>
                    <div class="card">
                        <span>Quick quiz · 5 questions</span>
                        <div style="display:flex; gap:8px; margin-top:12px;"><svg width="24" style="stroke:var(--accent);"><use href="#icon-play"/></svg> tap to start</div>
                    </div>
                `;
            }

            // ---- Progress / Statistics ----
            function renderProgress() {
                headerDiv.innerHTML = renderHeader('Progress');
                // chart animation (simple)
                setTimeout(()=>{
                    const bars = document.querySelectorAll('.bar');
                    bars.forEach((b,i)=> { b.style.height = (40 + i*12) + 'px'; });
                },50);
                contentDiv.innerHTML = `
                    <div class="card">
                        <span class="badge"><svg width="16" stroke="currentColor"><use href="#icon-chart"/></svg> words learned</span>
                        <div class="stat-row"><span>this week</span><span>+84</span></div>
                        <div class="chart" id="chartBars">
                            <div class="bar" style="height:20px;"></div><div class="bar" style="height:38px;"></div><div class="bar" style="height:52px;"></div><div class="bar" style="height:44px;"></div><div class="bar" style="height:68px;"></div><div class="bar" style="height:70px;"></div><div class="bar" style="height:62px;"></div>
                        </div>
                    </div>
                    <div class="card">
                        <span>accuracy 86%</span><div class="progress-bar" style="margin:8px 0;"><div class="progress-fill" style="width:86%"></div></div>
                        <span>streak 12 days</span>
                    </div>
                `;
            }

            // ---- Settings / Profile (with theme toggle) ----
            function renderSettings() {
                headerDiv.innerHTML = renderHeader('Settings');
                contentDiv.innerHTML = `
                    <div class="card" style="display:flex; flex-direction:column; gap:16px;">
                        <div style="display:flex; align-items:center; justify-content:space-between;">
                            <span>Dark mode</span>
                            <button class="badge" id="themeToggleBtn" style="background:var(--primary); color:white;">${darkMode ? 'Light' : 'Dark'}</button>
                        </div>
                        <div style="display:flex; gap:16px;"><svg width="24" style="stroke:var(--text-primary);"><use href="#icon-profile"/></svg> Profile: Alex</div>
                        <div>App version 2.6 · 2026</div>
                    </div>
                `;
                document.getElementById('themeToggleBtn')?.addEventListener('click', ()=>{
                    darkMode = !darkMode;
                    document.body.classList.toggle('dark', darkMode);
                    renderSettings(); // refresh toggle text
                });
            }

            // navigation
            function navigateTo(screen) {
                currentScreen = screen;
                // hide bottom nav on onboarding
                document.querySelector('.bottom-nav').style.display = screen === 'onboarding' ? 'none' : 'flex';

                if (screen === 'onboarding') renderOnboarding();
                else if (screen === 'home') renderHome();
                else if (screen === 'learn') renderLearn();
                else if (screen === 'progress') renderProgress();
                else if (screen === 'settings') renderSettings();

                // active bottom nav
                navItems.forEach(item => {
                    const data = item.dataset.screen;
                    if (data === screen) item.classList.add('active');
                    else item.classList.remove('active');
                });
            }

            // profile icon -> settings
            document.addEventListener('click', (e) => {
                if (e.target.closest('#profileBtn')) navigateTo('settings');
            });

            // bottom nav click
            navItems.forEach(item => {
                item.addEventListener('click', (e) => {
                    const screen = item.dataset.screen;
                    if (screen) navigateTo(screen);
                });
            });

            // modal
            window.showModal = (text) => {
                modalText.innerText = text;
                modal.style.display = 'flex';
                setTimeout(()=> { modal.onclick = ()=> modal.style.display='none'; }, 100);
            };

            // start
            navigateTo('onboarding');

            // screenshot capture (shift+W)
            document.addEventListener('keydown', (e) => {
