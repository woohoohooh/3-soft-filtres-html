```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math brain trainer · 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #1e1e2f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .phone-mock {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2d2d3a;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
        }
        /* dynamic theme vars */
        :root {
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary-blue: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive-icon: #94A3B8;
            --nav-bg: #FFFFFF;
            --shadow-sm: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            --progress-bg: #E2E8F0;
        }
        body.dark {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary-blue: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive-icon: #64748B;
            --nav-bg: #1E293B;
            --shadow-sm: 0 4px 8px rgba(0,0,0,0.4);
            --progress-bg: #334155;
        }
        /* main flex column */
        .app-container {
            display: flex;
;
            flex-direction: column;
            height: 100%;
        }
        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px 8px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 650;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-icon {
            cursor: pointer;
            padding: 6px;
        }
        /* main dynamic screen */
        .screen-area {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px 12px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-blue) var(--bg-card);
        }
        .screen-area::-webkit-scrollbar {
            width: 4px;
        }
        .screen-area::-webkit-scrollbar-thumb {
            background: var(--primary-blue);
            border-radius: 20px;
        }
        /* bottom nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--nav-bg);
            padding: 6px 8px 10px;
            border-top: 1px solid var(--border-light);
            box-shadow: 0 -2px 8px rgba(0,0,0,0.02);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 6px 12px 4px;
            border-radius: 24px;
            transition: all 0.15s ease;
            background: transparent;
            border: none;
        }
        .nav-item.active {
            background: rgba(37, 99, 235, 0.1);
            transform: scale(1.05);
        }
        .nav-item.active .nav-icon svg {
            stroke: var(--primary-blue);
            stroke-width: 2.4;
            width: 28px;
            height: 28px;
        }
        .nav-item .nav-icon svg {
            stroke: var(--inactive-icon);
            stroke-width: 2;
            width: 24px;
            height: 24px;
            transition: all 0.1s;
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .nav-item.active .nav-label {
            color: var(--primary-blue);
            font-weight: 600;
        }
        /* cards & widgets */
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 18px 16px;
            margin-bottom: 18px;
            box-shadow: var(--shadow-sm);
        }
        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
        }
        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 20px;
            margin: 12px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary-blue);
            border-radius: 20px;
            width: 0%;
            transition: width 0.4s ease;
        }
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .lesson-item:last-child {
            border-bottom: none;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .stat-box {
            background: var(--bg-primary);
            padding: 14px;
            border-radius: 20px;
            text-align: center;
        }
        .btn {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 18px;
            width: 100%;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 6px 14px rgba(37,99,235,0.3);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary-blue);
            color: var(--primary-blue);
            box-shadow: none;
        }
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--bg-card);
            width: 280px;
            padding: 28px 24px;
            border-radius: 36px;
            text-align: center;
            color: var(--text-primary);
        }
        .close-btn {
            margin-top: 18px;
            background: var(--primary-blue);
            border: none;
            color: white;
            padding: 10px 26px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
        }
        .icon-row {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        .theme-switch {
            display: flex;
            gap: 12px;
            background: var(--bg-primary);
            padding: 6px;
            border-radius: 40px;
            width: fit-content;
        }
        .theme-option {
            padding: 10px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
        }
        .theme-option.active {
            background: var(--primary-blue);
            color: white;
        }
        .hidden {
            display: none !important;
        }
        .link {
            color: var(--primary-blue);
            text-decoration: underline;
            cursor: pointer;
            font-size: 14px;
        }
        .small-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 22px;
        }
        .app-logo {
            background: var(--primary-blue);
            width: 70px;
            height: 70px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 12px auto 18px;
        }
        h2 { color: var(--text-primary); margin-bottom: 8px; }
        p { color: var(--text-secondary); line-height: 1.4; }
    </style>
</head>
<body>
<div class="phone-mock" id="phoneContainer">
    <div class="app-container" id="app">
        <!-- header dynamically rewritten -->
        <div class="header" id="appHeader">
            <h1 id="headerTitle">Onboarding</h1>
            <div class="profile-icon" id="profileBtn">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
        </div>

        <!-- main screen container -->
        <div class="screen-area" id="screenContainer"></div>

        <!-- bottom navigation (hidden on onboarding) -->
        <div class="bottom-nav" id="bottomNav">
            <div class="nav-item" data-nav="home">
                <span class="nav-icon home-icon"></span>
                <span class="nav-label">Home</span>
            </div>
            <div class="nav-item" data-nav="learn">
                <span class="nav-icon learn-icon"></span>
                <span class="nav-label">Learn</span>
            </div>
            <div class="nav-item" data-nav="progress">
                <span class="nav-icon progress-icon"></span>
                <span class="nav-label">Progress</span>
            </div>
            <div class="nav-item" data-nav="settings">
                <span class="nav-icon settings-icon"></span>
                <span class="nav-label">Settings</span>
            </div>
        </div>
    </div>
    <!-- modal placeholder -->
    <div id="modalContainer" class="hidden"></div>
</div>

<script>
    (function(){
        // ----- theme & icons (inline svg system) -----
        const theme = { current: 'light' }; // default light
        function setTheme(mode) {
            const body = document.body;
            if (mode === 'dark') {
                body.classList.add('dark');
                theme.current = 'dark';
            } else {
                body.classList.remove('dark');
                theme.current = 'light';
            }
            // re-render active screen to update icons (colors via css vars)
            renderScreen(currentScreen);
        }

        // ---------- icon definitions (all outline, 2px, rounded caps) ----------
        function renderIcon(name, active = false) {
            const strokeColor = active ? 'currentColor' : 'var(--inactive-icon)';
            const baseAttrs = `width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${strokeColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"`;
            const icons = {
                home: `<svg ${baseAttrs}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
                learn: `<svg ${baseAttrs}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
                progress: `<svg ${baseAttrs}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`,
                settings: `<svg ${baseAttrs}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.08.09A10 10 0 0 0 12 18a10 10 0 0 0 6.32-2.18z"/></svg>`,
                profile: `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary-blue)" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
                lesson: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--primary-blue)" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
                chart: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--primary-blue)" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`,
                flashcards: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--primary-blue)" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
                play: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--primary-blue)" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
                check: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--primary-blue)" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>`,
            };
            return icons[name] || icons.home;
        }

        // ----- screen data & current state -----
        let currentScreen = 'onboarding';
        const screens = ['onboarding','home','learn','progress','settings'];

        // ----- render function -----
        function renderScreen(screenId) {
            const container = document.getElementById('screenContainer');
            const headerTitle = document.getElementById('headerTitle');
            const bottomNav = document.getElementById('bottomNav');
            if (screenId === 'onboarding') {
                bottomNav.classList.add('hidden');
                headerTitle.innerText = 'Math Brain';
                container.innerHTML = onboardingHTML();
            } else {
                bottomNav.classList.remove('hidden');
                if (screenId === 'home') headerTitle.innerText = 'Dashboard';
                else if (screenId === 'learn') headerTitle.innerText = 'Daily Workout';
                else if (screenId === 'progress') headerTitle.innerText = 'Statistics';
                else if (screenId === 'settings') headerTitle.innerText = 'Settings';
                container.innerHTML = screenHTML(screenId);
                // update active nav
                document.querySelectorAll('.nav-item').forEach(el => {
                    const nav = el.dataset.nav;
                    if (nav === screenId) el.classList.add('active');
                    else el.classList.remove('active');
                });
                // attach lesson/start listeners
                if (screenId === 'learn') {
                    document.querySelectorAll('.start-lesson-btn').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            alert('✨ Lesson started! (simulated)');
                        });
                    });
                }
                if (screenId === 'progress') {
                    setTimeout(() => {
                        const fill = document.getElementById('strengthFill');
                        if (fill) fill.style.width = '68%';
                    }, 100);
                }
                if (screenId === 'home') {
                    document.getElementById('dailyPuzzleBtn')?.addEventListener('click', ()=>{
                        alert('🧠 Puzzle loading ...');
                    });
                }
            }
            // inject icons into nav
            document.querySelectorAll('.nav-item').forEach(el => {
                const nav = el.dataset.nav;
                const active = el.classList.contains('active');
                const iconSpan = el.querySelector('.nav-icon');
                if (iconSpan) {
                    if (nav === 'home') iconSpan.innerHTML = renderIcon('home', active);
                    else if (nav === 'learn') iconSpan.innerHTML = renderIcon('learn', active);
                    else if (nav === 'progress') iconSpan.innerHTML = renderIcon('progress', active);
                    else if (nav === 'settings') iconSpan.innerHTML = renderIcon('settings', active);
                }
            });
        }

        function onboardingHTML() {
            return `
                <div style="text-align: center; margin-top: 24px;">
                    <div class="app-logo">
                        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                    </div>
                    <h2 style="font-size: 32px;">math mind</h2>
                    <p style="font-size: 18px; font-weight: 300;">train your brain daily</p>
                    <p style="margin: 20px 0 10px;">Quick mental math & logic puzzles. 5-min workouts sharpen your mind.</p>
                    <button class="btn" id="startGetStarted">Get Started</button>
                    <div class="small-links">
                        <span class="link" id="privacyLink">Privacy</span>
                        <span class="link" id="termsLink">Terms</span>
                    </div>
                </div>
            `;
        }

        function screenHTML(screen) {
            if (screen === 'home') return homeScreen();
            if (screen === 'learn') return learnScreen();
            if (screen === 'progress') return progressScreen();
            if (screen === 'settings') return settingsScreen();
            return `<p>Error</p>`;
        }

        function homeScreen() {
            return `
                <div class="card">
                    <div class="flex-row"><span class="badge">⚡ streak 7 days</span> <span>🔥 120 xp</span></div>
                    <h3 style="margin-top: 12px;">Welcome back, Alex</h3>
                    <div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div>
                    <p>Today's goal: 3 lessons</p>
                </div>
                <div class="card">
                    <div class="flex-row"><span style="font-weight:600;">Daily brain teaser</span> ${renderIcon('play',false)}</div>
                    <p style="margin:8px 0">14 + 8 × 2 = ?</p>
                    <button class="btn-outline btn" id="dailyPuzzleBtn" style="padding:12px">solve</button>
                </div>
                <div class="card">
                    <div style="display:flex; gap:16px;">
                        <div>${renderIcon('flashcards',false)}<span> Logic</span></div>
                        <div>${renderIcon('chart',false)}<span> Memory</span></div>
                    </div>
                </div>
            `;
        }

        function learnScreen() {
            return `
                <div class="card">
                    <h3>Today's training</h3>
                    <div class="lesson-item"><span>${renderIcon('lesson',false)}</span><span style="flex:1;">Addition / subtraction</span><span>5 min</span><span class="start-lesson-btn" style="cursor:pointer;">${renderIcon('play',false)}</span></div>
                    <div class="lesson-item"><span>${renderIcon('flashcards',false)}</span><span style="flex:1;">Multiplication table</span><span>7 min</span><span class="start-lesson-btn" style="cursor:pointer;">${renderIcon('play',false)}</span></div>
                    <div class="lesson-item"><span>${renderIcon('lesson',false)}</span><span style="flex:1;">Logic patterns</span><span>6 min</span><span class="start-lesson-btn" style="cursor:pointer;">${renderIcon('play',false)}</span></div>
                </div>
                <div class="card"><span>${renderIcon('check',false)} mastered: 12 skills</span></div>
            `;
        }

        function progressScreen() {
            return `
                <div class="stats-grid">
                    <div class="stat-box"><span style="font-size:24px;">1,280</span><br>problems solved</div>
                    <div class="stat-box"><span style="font-size:24px;">86%</span><br>accuracy</div>
                </div>
                <div class="card">
                    <span>🏆 weekly strength</span>
                    <div class="progress-bar" style="margin:12px 0"><div class="progress-fill" id="strengthFill" style="width:20%"></div></div>
                    <div class="flex-row"><span>speed</span><span>68%</span></div>
                    <div style="display:flex; gap:8px;margin-top:12px;">${renderIcon('chart',false)} ${renderIcon('chart',false)}</div>
                </div>
            `;
        }

        function settingsScreen() {
            const lightActive = theme.current==='light' ? 'active' : '';
            const darkActive = theme.current==='dark' ? 'active' : '';
            return `
                <div class="card">
                    <h3 style="margin-bottom:16px;">Appearance</h3>
                    <div class="theme-switch">
                        <div class="theme-option ${lightActive}" id="lightTheme">Light</div>
                        <div class="theme-option ${darkActive}" id="darkTheme">Dark</div>
                    </div>
                </div>
                <div class="card">
                    <p>Profile: Alex M.</p>
                    <p>Member since 2026</p>
                </div>
                <div class="card" style="text-align:center;">
                    <span class="link" id="privacyLinkSettings">Privacy</span> | <span class="link" id="termsLinkSettings">Terms</span>
                </div>
            `;
        }

        // modal handler
        function showModal(text) {
            const modalDiv = document.getElementById('modalContainer');
            modalDiv.innerHTML = `
                <div class="modal">
                    <div class="modal-content">
                        <p>${text}</p>
                        <button class="close-btn" id="closeModalBtn">Close</button>
                    </div>
                </div>
            `;
            modalDiv.classList.remove('hidden');
            document.getElementById('closeModalBtn').addEventListener('click', ()=>{
                modalDiv.classList.add('hidden');
            });
        }

        // ----- navigation -----
        function navigateTo(screen) {
            if (screen === 'settings') screen = 'settings'; // profile opens settings
            if (screen === 'profile') screen = 'settings';
            currentScreen = screen;
            renderScreen(screen);
        }

        // ----- event listeners -----
        document.addEventListener('click', (e) => {
            const id = e.target.id;
            if (id === 'startGetStarted') navigateTo('home');
            else if (id === 'profileBtn') navigateTo('settings');
            else if (id === 'privacyLink' || id === 'privacyLinkSettings') showModal('Privacy policy: your data is safe.');
            else if (id === 'termsLink' || id === 'termsLinkSettings') showModal('Terms: fair use only.');
            else if (e.target.closest('[data-nav]')) {
                const nav = e.target.closest('[data-nav]').dataset.nav;
                navigateTo(nav);
            }
            // theme toggle
            if (e.target.id === 'lightTheme') setTheme('light');
            if (e.target.id === 'darkTheme') setTheme('dark');
        });

        // shift+W screenshot capture
        document.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const container = document.getElementById('phoneContainer');
                import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm').then((mod) => {
                    mod.default(container).then(canvas => {
                        const link = document.createElement('a');
                        let filename = theme.current === 'dark' ? '6.png' : (currentScreen==='onboarding'?'1.png':currentScreen==='home'?'2.png':currentScreen==='learn'?'3.png':currentScreen==='progress'?'4.png':'5.png');
                        // fallback if onboarding etc: but we define explicit: we use currentScreen
                        if (currentScreen === 'onboarding') filename = '1.png';
                        else if (currentScreen === 'home') filename = '2.png';
                        else if (currentScreen === 'learn') filename = '3.png';
                        else if (currentScreen === 'progress') filename = '4.png';
                        else if (currentScreen === 'settings') filename = '5.png';
                        if (theme.current === 'dark' && filename !== '6.png') {
                            if (filename === '5.png') filename = '6.png'; else filename = '6.png'; // any dark becomes 6
                        }
                        link.download = filename;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    });
                }).catch(()=> alert('html2canvas load failed, but screenshot simulated.'));
            }
        });

        // initial render
        renderScreen('onboarding');

        // after each render, we need to keep theme buttons active (but setTheme already re-renders)
        window.setTheme = setTheme;
    })();
</script>
</body>
</html>
All done!
