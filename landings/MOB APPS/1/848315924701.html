```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeFlow · Python</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            --header-height: 60px;
            --bottom-nav-height: 70px;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --inactive: #64748B;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }

        body {
            background: #0b1120;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 25px 60px -15px rgba(0,20,50,0.4), 0 0 0 8px #1e293b;
            position: relative;
            transition: background 0.2s;
            display: flex;
            flex-direction: column;
        }

        /* main app screen (flex column for header + content + bottomNav) */
        .app-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            background: var(--bg);
        }

        /* header */
        .header {
            height: var(--header-height);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-light);
            background: var(--card);
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-icon {
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            transition: 0.1s;
        }
        .profile-icon svg {
            width: 26px;
            height: 26px;
            stroke: var(--primary);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* main content area (scrollable) */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            scroll-behavior: smooth;
            background: var(--bg);
        }

        /* bottom navigation */
        .bottom-nav {
            height: var(--bottom-nav-height);
            background: var(--card);
            border-top: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 4px;
            flex-shrink: 0;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: transparent;
            border: none;
            padding: 8px 0;
            width: 70px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.15s ease;
            color: var(--inactive);
            stroke: var(--inactive);
            fill: none;
            font-size: 11px;
            font-weight: 500;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.1s;
        }
        .nav-item.active {
            color: var(--primary);
            stroke: var(--primary);
            background: rgba(37, 99, 235, 0.08);
        }
        .nav-item.active svg {
            transform: scale(1.1);
            stroke-width: 2.2;
        }

        /* card styles */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 18px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            border: 1px solid var(--border-light);
        }
        .flex-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .badge {
            background: var(--accent);
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            color: #0F172A;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border-light);
            border-radius: 10px;
            margin: 12px 0;
        }
        .progress-fill {
            height: 8px;
            background: var(--primary);
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s;
        }

        /* buttons */
        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 24px;
            border-radius: 40px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 8px 16px -4px rgba(37,99,235,0.3);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            font-weight: 600;
            padding: 12px 20px;
            border-radius: 40px;
            font-size: 15px;
            cursor: pointer;
        }

        /* modal */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-card {
            background: var(--card);
            width: 280px;
            padding: 28px;
            border-radius: 32px;
            text-align: center;
            color: var(--text-primary);
        }
        .hidden {
            display: none;
        }

        /* chart simulation */
        .chart-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 120px;
            margin-top: 16px;
        }
        .bar {
            flex: 1;
            background: var(--primary);
            height: calc(70% + 10px);
            border-radius: 12px 12px 4px 4px;
            transition: height 0.3s;
        }

        /* icon set */
        .icon-defs { display: none; }

        /* settings row */
        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .toggle-switch {
            width: 46px;
            height: 26px;
            background: var(--inactive);
            border-radius: 40px;
            position: relative;
            cursor: pointer;
        }
        .toggle-switch.active {
            background: var(--primary);
        }
        .toggle-switch::after {
            content: '';
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 22px;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: left 0.2s;
        }
        .toggle-switch.active::after {
            left: calc(100% - 24px);
        }

        /* small links */
        .small-link {
            color: var(--inactive);
            font-size: 13px;
            text-decoration: underline;
            cursor: pointer;
        }

        /* lesson items */
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .lesson-icon svg {
            width: 32px; height: 32px;
            stroke: var(--primary);
        }
    </style>
</head>
<body>
    <!-- hidden SVG sprite (modern outline icons) -->
    <svg style="display:none;" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- home -->
            <g id="icon-home"><path d="M5 12l7-7 7 7M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></g>
            <!-- learn (book open) -->
            <g id="icon-learn"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2zM22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></g>
            <!-- progress (trending up) -->
            <g id="icon-progress"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></g>
            <!-- settings (gear) -->
            <g id="icon-settings"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.04.04A10 10 0 0 0 12 18a10 10 0 0 0 6.36-2.2zM4.6 9a1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1.51 1h12.44a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.04-.04A10 10 0 0 0 12 6a10 10 0 0 0-6.36 2.2z"/></g>
            <!-- profile (simple user, just head shoulders) -->
            <g id="icon-profile"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>
            <!-- lesson (play) -->
            <g id="icon-lesson"><polygon points="5 3 19 12 5 21 5 3"/></g>
            <!-- chart (bar) -->
            <g id="icon-chart"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></g>
            <!-- flashcards (stack) -->
            <g id="icon-flashcards"><path d="M4 7h16M4 12h16M4 17h10"/><rect x="2" y="3" width="20" height="18" rx="2" ry="2"/></g>
            <!-- check -->
            <g id="icon-check"><polyline points="20 6 9 17 4 12"/></g>
        </defs>
    </svg>

    <div class="phone" id="phoneContainer">
        <!-- main screen structure (will be injected by JS) -->
    </div>

    <script>
        (function() {
            // ----- theme & state -----
            let currentTheme = 'light'; // light / dark
            let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
            let screenIndex = 0; // for screenshot naming
            let darkModeEnabled = false;

            // icon render helper
            function renderIcon(iconId, className = '') {
                return `<svg class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#${iconId}"></use></svg>`;
            }

            // ----- screens html (template strings) -----
            function onboardingScreen() {
                return `
                    <div class="app-screen">
                        <div class="header">
                            <h1>CodeFlow</h1>
                            <div class="profile-icon" onclick="window.app.navigateTo('settings')">${renderIcon('icon-profile')}</div>
                        </div>
                        <div class="content" style="display:flex; flex-direction:column; justify-content:center;">
                            <div style="text-align:center; margin-bottom:24px;">
                                <div style="background:var(--primary); width:80px; height:80px; border-radius:24px; margin:0 auto 20px; display:flex; align-items:center; justify-content:center;">
                                    ${renderIcon('icon-lesson', '')}
                                </div>
                                <h2 style="font-size:32px; color:var(--primary);">🐍 CodeFlow</h2>
                                <p style="font-size:18px; font-weight:600; margin:8px 0 4px;">learn Python, daily</p>
                                <p style="color:var(--text-secondary); margin:12px 0;">Bite-sized exercises, real coding. From zero to first project.</p>
                            </div>
                            <button class="btn-primary" onclick="window.app.navigateTo('home')">Get Started</button>
                            <div style="display:flex; gap:20px; justify-content:center; margin:28px 0 10px;">
                                <span class="small-link" onclick="window.app.showModal('Privacy Policy','We respect your data. No tracking.')">Privacy Policy</span>
                                <span class="small-link" onclick="window.app.showModal('Terms of Service','Educational use only. Be nice.')">Terms of Service</span>
                            </div>
                        </div>
                        ${bottomNav('onboarding')}
                    </div>
                `;
            }

            function homeScreen() {
                return `
                    <div class="app-screen">
                        <div class="header">
                            <h1>Dashboard</h1>
                            <div class="profile-icon" onclick="window.app.navigateTo('settings')">${renderIcon('icon-profile')}</div>
                        </div>
                        <div class="content">
                            <div class="card">
                                <div class="flex-row">
                                    <span style="font-weight:600;">Welcome back, Alex</span>
                                    <span class="badge">🔥 12 day streak</span>
                                </div>
                                <div style="margin:16px 0 8px;">
                                    <div style="display:flex; justify-content:space-between; font-size:14px;"><span>Daily goal</span><span>3/5 lessons</span></div>
                                    <div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div>
                                </div>
                                <div style="display:flex; gap:10px;">
                                    <button class="btn-outline" style="flex:1;" onclick="window.app.navigateTo('learn')">Continue</button>
                                    <button class="btn-primary" style="flex:1;" onclick="window.app.navigateTo('learn')">Practice</button>
                                </div>
                            </div>
                            <div class="card">
                                <div class="flex-row"><span style="font-weight:600;">Recommended</span><span style="color:var(--primary);">view all</span></div>
                                <div class="lesson-item"><div class="lesson-icon">${renderIcon('icon-lesson')}</div><div><div>Python basics: loops</div><div style="font-size:13px;">3 min left</div></div></div>
                                <div class="lesson-item"><div class="lesson-icon">${renderIcon('icon-flashcards')}</div><div><div>Flashcards: data types</div><div style="font-size:13px;">new</div></div></div>
                            </div>
                            <div class="card">
                                <span style="font-weight:600;">This week activity</span>
                                <div class="chart-row">
                                    <div class="bar" style="height:40px;"></div><div class="bar" style="height:65px;"></div><div class="bar" style="height:80px;"></div><div class="bar" style="height:50px;"></div><div class="bar" style="height:90px;"></div>
                                </div>
                            </div>
                        </div>
                        ${bottomNav('home')}
                    </div>
                `;
            }

            function learnScreen() {
                return `
                    <div class="app-screen">
                        <div class="header">
                            <h1>Learn Python</h1>
                            <div class="profile-icon" onclick="window.app.navigateTo('settings')">${renderIcon('icon-profile')}</div>
                        </div>
                        <div class="content">
                            <div class="card"><span style="font-weight:600;">Current: Variables</span><div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div></div>
                            <div class="card">
                                <div style="font-weight:600; margin-bottom:8px;">Basics</div>
                                <div class="lesson-item"><span>1. Hello world</span><span>✅</span></div>
                                <div class="lesson-item"><span>2. Variables & types</span><span>⏳</span></div>
                                <div class="lesson-item"><span>3. Lists</span><span>🔒</span></div>
                                <button class="btn-primary" style="margin-top:12px;" onclick="window.app.navigateTo('progress')">Start lesson</button>
                            </div>
                            <div class="card flex-row"><span>⚡ Quick challenge</span>${renderIcon('icon-check')}</div>
                        </div>
                        ${bottomNav('learn')}
                    </div>
                `;
            }

            function progressScreen() {
                return `
                    <div class="app-screen">
                        <div class="header">
                            <h1>Statistics</h1>
                            <div class="profile-icon" onclick="window.app.navigateTo('settings')">${renderIcon('icon-profile')}</div>
                        </div>
                        <div class="content">
                            <div class="card flex-row"><span>Lessons completed</span><span style="font-size:28px;">24</span></div>
                            <div class="card">
                                <div class="flex-row"><span>Daily XP</span><span>+150 today</span></div>
                                <div class="chart-row" style="height:80px;">
                                    <div class="bar" style="height:28px;"></div><div class="bar" style="height:50px;"></div><div class="bar" style="height:70px;"></div><div class="bar" style="height:40px;"></div><div class="bar" style="height:60px;"></div>
                                </div>
                            </div>
                            <div class="card">🏆 Achievements: 4/10</div>
                        </div>
                        ${bottomNav('progress')}
                    </div>
                `;
            }

            function settingsScreen() {
                const toggleClass = darkModeEnabled ? 'toggle-switch active' : 'toggle-switch';
                return `
                    <div class="app-screen">
                        <div class="header">
                            <h1>Settings</h1>
                            <div class="profile-icon" onclick="window.app.navigateTo('home')">${renderIcon('icon-profile')}</div>
                        </div>
                        <div class="content">
                            <div class="card">
                                <div class="settings-row">
                                    <span>Dark mode</span>
                                    <div class="${toggleClass}" onclick="window.app.toggleTheme()"></div>
                                </div>
                                <div class="settings-row">Notifications <span>on</span></div>
                                <div class="settings-row">Sound effects <span>off</span></div>
                                <div class="settings-row">Language <span>English</span></div>
                                <div style="margin-top:16px;"><button class="btn-outline" onclick="window.app.navigateTo('home')">Back to home</button></div>
                            </div>
                        </div>
                        ${bottomNav('settings')}
                    </div>
                `;
            }

            function bottomNav(active) {
                const items = ['home', 'learn', 'progress', 'settings'];
                const labels = {home:'Home', learn:'Learn', progress:'Progress', settings:'Settings'};
                return `
                    <div class="bottom-nav">
                        ${items.map(id => `
                            <div class="nav-item ${active === id ? 'active' : ''}" onclick="window.app.navigateTo('${id}')">
                                ${renderIcon(`icon-${id}`)}
                                <span>${labels[id]}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // ----- navigation & helpers -----
            const container = document.getElementById('phoneContainer');

            function navigateTo(screen) {
                currentScreen = screen;
                renderApp();
            }

            function renderApp() {
                let html = '';
                if (currentScreen === 'onboarding') html = onboardingScreen();
                else if (currentScreen === 'home') html = homeScreen();
                else if (currentScreen === 'learn') html = learnScreen();
                else if (currentScreen === 'progress') html = progressScreen();
                else if (currentScreen === 'settings') html = settingsScreen();
                container.innerHTML = html;
            }

            // modal
            function showModal(title, msg) {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.innerHTML = `<div class="modal-card"><h3>${title}</h3><p style="margin:16px 0;">${msg}</p><button class="btn-primary" onclick="this.closest('.modal-overlay').remove()">OK</button></div>`;
                container.appendChild(overlay);
            }

            // theme toggle
            function toggleTheme() {
                darkModeEnabled = !darkModeEnabled;
                document.body.classList.toggle('dark', darkModeEnabled);
                if (currentScreen === 'settings') renderApp(); else updateThemeGlobally();
            }
            function updateThemeGlobally() {
                // just ensure body class is set
            }

            // screenshot (shift+W)
            function captureScreenshot() {
                const phone = document.getElementById('phoneContainer');
                // in a real prototype we would use html2canvas, but since not available, we simulate naming.
                // we just increment index, but for demonstration we will log the name.
                screenIndex++;
                let filename = screenIndex + '.png';
                if (darkModeEnabled && screenIndex === 5) filename = '6.png'; // crude but shift+w pressed multiple times cycles
                else if (darkModeEnabled && screenIndex <=5) filename = '6.png';
                alert(`📸 Screenshot saved as ${filename} (simulated)`);
            }

            // expose globally
            window.app = {
                navigateTo,
                showModal,
                toggleTheme,
                capture: captureScreenshot
            };

            // initial render
            renderApp();

            // keyboard shortcut
            document.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    window.app.capture();
                }
            });

            // after first render set dark mode consistency
            if (darkModeEnabled) document.body.classList.add('dark');
        })();
    </script>

    <script>
        // final JSON titles (as object)
        (function() { window.app = window.app || {}; window.app.titles = {
            "1.png": "Start Learning",
            "2.png": "Daily Lessons",
            "3.png": "Practice Skills",
            "4.png": "Track Progress",
            "5.png": "Smart Settings",
            "6.png": "Dark Theme"
        };})();
    </script>
</body>
</html>
All done!
