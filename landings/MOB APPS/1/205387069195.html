```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSpark · Learn JavaScript</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --border: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --grey: #94A3B8;
            --grey-light: #CBD5E1;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            --bottom-bg: #FFFFFF;
            --icon-inactive: #94A3B8;
        }
        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --border: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --grey: #475569;
            --grey-light: #334155;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
            --bottom-bg: #1E293B;
            --icon-inactive: #64748B;
        }
        #phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 16px 16px 8px 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--grey-light) var(--bg);
        }
        .screen::-webkit-scrollbar {
            width: 4px;
        }
        .screen::-webkit-scrollbar-track {
            background: var(--bg);
        }
        .screen::-webkit-scrollbar-thumb {
            background: var(--grey-light);
            border-radius: 20px;
        }
        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px 0;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.5px;
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 8px 4px 8px;
            border-radius: 40px;
            transition: background 0.2s;
        }
        .profile-btn:hover {
            background: var(--grey-light);
        }
        /* bottom nav */
        .bottom-nav {
            background: var(--bottom-bg);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 12px 12px 12px;
            border-radius: 0 0 48px 48px;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            gap: 4px;
            transition: all 0.15s ease;
            padding: 8px 0 4px 0;
            border-radius: 20px;
        }
        .nav-item.active {
            background: rgba(37, 99, 235, 0.1);
        }
        .nav-item.active svg {
            transform: scale(1.15);
            stroke: #2563EB;
        }
        .nav-item.active span {
            color: #2563EB;
            font-weight: 500;
        }
        .nav-item svg {
            stroke: var(--icon-inactive);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: 0.15s;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            color: var(--icon-inactive);
        }
        /* cards */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }
        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
        }
        .progress-bar {
            height: 8px;
            background: var(--grey-light);
            border-radius: 40px;
            margin: 12px 0;
        }
        .progress-fill {
            height: 8px;
            background: var(--primary);
            width: 0%;
            border-radius: 40px;
            transition: width 0.4s;
        }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            font-weight: 600;
            padding: 14px 24px;
            border-radius: 60px;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--primary);
            color: var(--primary);
        }
        .link {
            color: var(--grey);
            text-decoration: underline;
            font-size: 13px;
            background: none;
            border: none;
            cursor: pointer;
        }
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card);
            padding: 28px;
            border-radius: 32px;
            width: 280px;
            text-align: center;
            color: var(--text);
        }
        .icon-grid {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 12px 0;
        }
        .stat {
            background: var(--bg);
            padding: 12px;
            border-radius: 20px;
            text-align: center;
        }
        .hidden { display: none; }
        .mt-4 { margin-top: 16px; }
        .mb-2 { margin-bottom: 8px; }
        .gap-2 { gap: 8px; }
        .achievement {
            background: var(--bg);
            border-radius: 30px;
            padding: 6px 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
<div id="phone"></div>

<script>
    (function() {
        // ---------- THEME TOGGLE ----------
        let darkMode = false;
        const themeToggle = () => {
            darkMode = !darkMode;
            document.body.classList.toggle('dark', darkMode);
        };

        // ---------- SCREEN MANAGEMENT ----------
        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings, profile
        const screens = {
            onboarding: null,
            home: null,
            learn: null,
            progress: null,
            settings: null,
            profile: null
        };

        // ---------- SVG ICONS (inline, outline 2px) ----------
        const icons = {
            home: (active) => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${active ? '#2563EB' : 'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`,
            learn: (active) => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${active ? '#2563EB' : 'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
            progress: (active) => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${active ? '#2563EB' : 'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/><path d="M9 8V6"/><path d="M15 8V6"/></svg>`,
            settings: (active) => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${active ? '#2563EB' : 'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.03.03A10 10 0 0 0 12 17.66a10 10 0 0 0 6.37-2.63z"/><path d="M18 5v.5"/><path d="M6 5v.5"/></svg>`,
            profile: () => `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
            lesson: () => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
            chart: () => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M12 22V12"/><path d="M9 10.5l2 1 3-3"/></svg>`,
            flashcards: () => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M8 8h8"/><path d="M8 12h6"/><path d="M8 16h4"/></svg>`,
            play: () => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
            check: () => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
        };

        // ---------- modal control ----------
        let modalDiv = null;
        function showModal(title, text) {
            if(modalDiv) document.body.removeChild(modalDiv);
            modalDiv = document.createElement('div');
            modalDiv.className = 'modal';
            modalDiv.innerHTML = `<div class="modal-content"><h3 style="margin-bottom:8px;">${title}</h3><p style="margin-bottom:20px;">${text}</p><button class="btn" id="closeModal">OK</button></div>`;
            document.body.appendChild(modalDiv);
            document.getElementById('closeModal').onclick = () => { modalDiv.remove(); modalDiv = null; };
        }

        // ---------- render screen ----------
        function render(screenId) {
            const container = document.getElementById('phone');
            if (!container) return;
            const headerTitle = {
                onboarding: 'Welcome',
                home: 'Home',
                learn: 'Learn JS',
                progress: 'Progress',
                settings: 'Settings',
                profile: 'Profile'
            }[screenId] || 'App';

            let content = '';

            // header (profile icon always)
            content += `
                <div class="header">
                    <h1>${headerTitle}</h1>
                    <button class="profile-btn" id="profileBtn">${icons.profile()}</button>
                </div>
            `;

            // screen specific content
            if (screenId === 'onboarding') {
                content += `
                    <div class="card" style="text-align:center;">
                        <div style="background:var(--primary); width:70px; height:70px; border-radius:30px; margin:20px auto; display:flex; align-items:center; justify-content:center;">
                            <span style="font-size:40px; color:white;">JS</span>
                        </div>
                        <h2 style="font-size:28px; margin:10px 0 4px;">CodeSpark</h2>
                        <p style="color:var(--primary); font-weight:600; margin-bottom:10px;">learn JavaScript · playfully</p>
                        <p style="color:var(--text-light); margin-bottom:30px;">Bite-sized coding challenges, flashcards, and real‑time feedback. Master JS one concept at a time.</p>
                        <button class="btn" id="getStartedBtn">Get Started →</button>
                        <div style="display:flex; gap:18px; justify-content:center; margin:25px 0 15px;">
                            <button class="link" id="privacyLink">Privacy</button>
                            <button class="link" id="termsLink">Terms</button>
                        </div>
                    </div>
                `;
            }
            else if (screenId === 'home') {
                content += `
                    <div class="card">
                        <div class="flex-row"><span class="badge">🔥 streak 7 days</span> <span>⚡ 340 XP</span></div>
                        <h3 style="margin:15px 0 5px;">Continue where you left</h3>
                        <div class="flex-row"><span>Arrays & loops</span><span>lesson 3/6</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:50%"></div></div>
                        <button class="btn" id="continueBtn" style="margin-top:12px;">${icons.play()}  Continue</button>
                    </div>
                    <div class="card">
                        <div class="flex-row"><h3>Today's pick</h3>${icons.flashcards()}</div>
                        <p style="margin:10px 0;">Closures · 5 min read</p>
                        <div class="flex-row"><span>⭐ 4.8</span><button class="btn-outline btn" style="width:auto; padding:8px 20px;" id="startFlashcard">Start</button></div>
                    </div>
                    <div class="card flex-row gap-2">
                        <div class="stat"><span style="font-size:22px;">8</span><br>lessons</div>
                        <div class="stat"><span style="font-size:22px;">12</span><br>puzzles</div>
                        <div class="stat"><span style="font-size:22px;">3</span><br>badges</div>
                    </div>
                `;
            }
            else if (screenId === 'learn') {
                content += `
                    <div class="card"><input type="text" placeholder="Search lessons..." style="width:100%; padding:12px; border-radius:40px; border:1px solid var(--border); background:var(--bg); color:var(--text);"></div>
                    <div class="card">
                        <div class="flex-row"><h3>Basics</h3>${icons.lesson()}</div>
                        <div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div>
                        <p>✔️ Variables, Data types</p>
                        <p style="opacity:0.5;">➡️ Functions (in progress)</p>
                    </div>
                    <div class="card">
                        <h3>Practice: scope</h3>
                        <p>5 quick questions</p>
                        <button class="btn" id="practiceNow">${icons.play()} Practice now</button>
                    </div>
                `;
            }
            else if (screenId === 'progress') {
                content += `
                    <div class="card">
                        <h3>Weekly activity</h3>
                        <div style="display:flex; gap:6px; margin:15px 0;">
                            <div style="width:20%; height:60px; background:var(--primary); border-radius:12px;"></div>
                            <div style="width:20%; height:40px; background:var(--accent); border-radius:12px;"></div>
                            <div style="width:20%; height:80px; background:var(--primary); border-radius:12px;"></div>
                            <div style="width:20%; height:30px; background:var(--grey-light); border-radius:12px;"></div>
                            <div style="width:20%; height:55px; background:var(--primary); border-radius:12px;"></div>
                        </div>
                        <p>+340 XP this week</p>
                    </div>
                    <div class="card">
                        <div class="flex-row"><span>🏅 achievements</span>${icons.chart()}</div>
                        <div class="achievement"><span>🔥 7 day streak</span></div>
                        <div class="achievement mt-4"><span>⚡ 1000 total XP</span></div>
                    </div>
                `;
            }
            else if (screenId === 'settings') {
                content += `
                    <div class="card">
                        <div class="flex-row"><span>Dark mode</span><button class="btn-outline" style="width:auto; padding:8px 20px;" id="themeToggleBtn">Toggle</button></div>
                        <div class="flex-row mt-4"><span>Sound</span><span>🔛</span></div>
                    </div>
                    <div class="card">
                        <h3>Account</h3>
                        <p>user@example.com</p>
                        <button class="btn-outline mt-4" style="width:auto;" id="resetProgress">Reset progress</button>
                    </div>
                `;
            }
            else if (screenId === 'profile') {
                content += `
                    <div class="card" style="text-align:center;">
                        ${icons.profile()}
                        <h2>Alex</h2>
                        <p>Member since 2026</p>
                        <button class="btn" id="backToSettings">Back to settings</button>
                    </div>
                `;
            }

            // bottom nav (only if not onboarding)
            if (screenId !== 'onboarding') {
                content += `
                    <div class="bottom-nav">
                        <button class="nav-item ${screenId==='home'?'active':''}" id="navHome">${icons.home(screenId==='home')}<span>Home</span></button>
                        <button class="nav-item ${screenId==='learn'?'active':''}" id="navLearn">${icons.learn(screenId==='learn')}<span>Learn</span></button>
                        <button class="nav-item ${screenId==='progress'?'active':''}" id="navProgress">${icons.progress(screenId==='progress')}<span>Progress</span></button>
                        <button class="nav-item ${screenId==='settings'?'active':''}" id="navSettings">${icons.settings(screenId==='settings')}<span>Settings</span></button>
                    </div>
                `;
            } else {
                content += `<div style="height:16px;"></div>`;
            }

            container.innerHTML = `<div class="screen" id="activeScreen">${content}</div>`;

            // attach listeners
            if (screenId === 'onboarding') {
                document.getElementById('getStartedBtn')?.addEventListener('click', () => render('home'));
                document.getElementById('privacyLink')?.addEventListener('click', () => showModal('Privacy Policy', 'We keep your data safe. No selling to third parties.'));
                document.getElementById('termsLink')?.addEventListener('click', () => showModal('Terms of Service', 'Use CodeSpark for learning. Be nice.'));
            }
            if (screenId !== 'onboarding') {
                document.getElementById('navHome')?.addEventListener('click', () => render('home'));
                document.getElementById('navLearn')?.addEventListener('click', () => render('learn'));
                document.getElementById('navProgress')?.addEventListener('click', () => render('progress'));
                document.getElementById('navSettings')?.addEventListener('click', () => render('settings'));
            }
            document.getElementById('profileBtn')?.addEventListener('click', () => render('profile'));
            if (screenId === 'profile') {
                document.getElementById('backToSettings')?.addEventListener('click', () => render('settings'));
            }
            if (screenId === 'settings') {
                document.getElementById('themeToggleBtn')?.addEventListener('click', themeToggle);
                document.getElementById('resetProgress')?.addEventListener('click', () => showModal('Reset', 'Progress deleted (demo).'));
            }
            // interactive demo
            document.getElementById('continueBtn')?.addEventListener('click', () => showModal('Continue', 'Resuming "Arrays & loops" ...'));
            document.getElementById('startFlashcard')?.addEventListener('click', () => showModal('Flashcard', 'What is a closure? A function with its lexical scope.'));
            document.getElementById('practiceNow')?.addEventListener('click', () => showModal('Practice', 'Question 1/5: let vs var'));
        }

        // screenshot hotkey SHIFT+W
        let screenshotCounter = 0;
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phone');
                if (!phone) return;
                
                import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm').then((mod) => {
                    const html2canvas = mod.default;
                    html2canvas(phone, { backgroundColor: null, scale: 1.5 }).then(canvas => {
                        screenshotCounter++;
                        const link = document.createElement('a');
                        let filename = screenshotCounter + '.png';
                        if (darkMode) filename = '6.png'; // dark mode forces 6.png
                        else if (screenshotCounter >5) screenshotCounter = 1; 
                        if (darkMode) link.download = '6.png';
                        else link.download = screenshotCounter + '.png';
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    });
                });
            }
        });

        // start with onboarding
        render('onboarding');
    })();
</script>
