```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python· — mobile prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1e1e2f;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --border: #E2E8F0;
            --highlight: #EFF6FF;
            --progress-bg: #E2E8F0;
            --shadow: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,0,0,0.05);
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --border: #334155;
            --highlight: #1E293B;
            --progress-bg: #334155;
            --shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .phone-mock {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 25px 60px -10px black;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background-color 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 16px 16px 8px 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) var(--card);
        }

        .app-screen::-webkit-scrollbar {
            width: 4px;
        }
        .app-screen::-webkit-scrollbar-thumb {
            background: var(--inactive);
            border-radius: 8px;
        }

        /* header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 0 4px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.5px;
        }
        .profile-icon {
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
            transition: background 0.1s;
        }
        .profile-icon:hover {
            background: var(--highlight);
        }

        /* bottom nav */
        .bottom-nav {
            background: var(--card);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px;
            border-top: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 20px;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            background: transparent;
            border: none;
            width: 64px;
        }
        .nav-item.active {
            background: var(--highlight);
            transform: scale(1.05);
        }
        .nav-item.active .nav-icon {
            stroke: var(--primary);
            stroke-width: 2.4;
            transform: scale(1.1);
        }
        .nav-item .nav-icon {
            stroke: var(--inactive);
            stroke-width: 2;
            transition: all 0.15s;
            width: 24px;
            height: 24px;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--inactive);
            transition: color 0.15s;
        }
        .nav-item.active .nav-label {
            color: var(--primary);
            font-weight: 600;
        }

        /* cards */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 12px;
        }

        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 16px;
            border-radius: 40px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 8px 16px -6px var(--primary-dark);
            transition: 0.1s;
        }
        .btn-primary:active {
            transform: scale(0.98);
            background: var(--primary-dark);
        }

        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 40px;
            margin: 8px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 8px;
            background: var(--primary);
            width: 0%;
            border-radius: 40px;
            transition: width 0.3s ease;
        }

        .row-space {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .link {
            color: var(--inactive);
            text-decoration: underline;
            font-size: 13px;
            cursor: pointer;
        }

        /* modal */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--card);
            width: 280px;
            padding: 24px;
            border-radius: 40px;
            color: var(--text);
            text-align: center;
        }

        /* chart mimic */
        .chart-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 100px;
            margin: 16px 0;
        }
        .bar {
            flex: 1;
            background: linear-gradient(to top, var(--primary), var(--accent));
            border-radius: 8px 8px 4px 4px;
            transition: height 0.3s;
        }

        /* hide/show screens */
        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }
        .screen.active {
            display: flex;
        }

        .lesson-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
    </style>
</head>
<body>
<div class="phone-mock" id="phoneContainer">
    <!-- dynamic viewport -->
    <div id="appContent" style="flex:1; display: flex; flex-direction: column; overflow: hidden;">
        <!-- screens injected via js -->
    </div>
</div>

<script>
    (function() {
        // ----- THEME & icons -----
        let currentTheme = 'light';
        const root = document.documentElement;
        function setTheme(theme) {
            currentTheme = theme;
            if (theme === 'dark') root.classList.add('dark');
            else root.classList.remove('dark');
        }

        // ---------- SVG icon set (inline, same style) ----------
        const icons = {
            home: '<svg class="nav-icon" viewBox="0 0 24 24"><path d="M5 12H3L12 3L21 12H19" stroke="currentColor" fill="none"/><path d="M5 12V20H9V16H15V20H19V12" stroke="currentColor" fill="none"/></svg>',
            learn: '<svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 5L4 9L12 13L20 9L12 5Z" stroke="currentColor" fill="none"/><path d="M4 13L12 17L20 13" stroke="currentColor" fill="none"/><path d="M4 17L12 21L20 17" stroke="currentColor" fill="none"/></svg>',
            progress: '<svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><path d="M12 7V12L15 15" stroke="currentColor" fill="none"/></svg>',
            settings: '<svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5" stroke="currentColor" fill="none"/><path d="M19.4 15L18.6 18.4L15 19.9L12 18L9 19.9L5.4 18.4L4.6 15L6.5 12L4.6 9L5.4 5.6L9 4.1L12 6L15 4.1L18.6 5.6L19.4 9L17.5 12L19.4 15Z" stroke="currentColor" fill="none"/></svg>',
            profile: '<svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" stroke="currentColor" fill="none"/><path d="M5 20V18C5 14.7 7.7 12 11 12H13C16.3 12 19 14.7 19 18V20" stroke="currentColor" fill="none"/></svg>',
            lesson: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 6V12L15 15" stroke="currentColor"/><circle cx="12" cy="12" r="9" stroke="currentColor"/></svg>',
            chart: '<svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor"><path d="M21 21H4V4" stroke="currentColor"/><path d="M7 15L10 10L13 13L18 7" stroke="currentColor"/></svg>',
            flashcards: '<svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor"/><path d="M9 8H15M9 12H15M9 16H12" stroke="currentColor"/></svg>',
            play: '<svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="9" stroke="currentColor"/><path d="M10 8L16 12L10 16V8Z" stroke="currentColor" fill="none"/></svg>',
            check: '<svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor"><path d="M5 12L10 17L19 8" stroke="currentColor"/></svg>'
        };

        // ----- screen definitions -----
        const screens = ['onboarding', 'home', 'learn', 'progress', 'settings'];
        let activeScreen = 'onboarding';
        let screenshotCounter = 0;

        function renderApp() {
            const container = document.getElementById('appContent');
            let html = '';
            // header (dynamic title per screen)
            html += `<div class="header"><h1 id="screenTitle">Python·</h1><div class="profile-icon" id="profileBtn">${icons.profile}</div></div>`;

            // screens
            html += `<div id="screenContainer" style="flex:1; display: flex; flex-direction: column;">`;
            screens.forEach(s => {
                html += `<div class="screen ${s === activeScreen ? 'active' : ''}" id="screen-${s}">${getScreenContent(s)}</div>`;
            });
            html += `</div>`;

            // bottom nav
            html += `<div class="bottom-nav" id="bottomNav">`;
            const navs = [
                { id: 'home', label: 'Home', icon: 'home' },
                { id: 'learn', label: 'Learn', icon: 'learn' },
                { id: 'progress', label: 'Progress', icon: 'progress' },
                { id: 'settings', label: 'Settings', icon: 'settings' }
            ];
            navs.forEach(n => {
                const activeClass = (activeScreen === n.id || (activeScreen === 'onboarding' && n.id==='home') ? 'active' : '');
                html += `<div class="nav-item ${activeClass}" data-screen="${n.id}">${icons[n.icon]}<span class="nav-label">${n.label}</span></div>`;
            });
            html += `</div>`;

            container.innerHTML = html;
            updateHeaderTitle();

            // attach listeners
            document.querySelectorAll('.nav-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    const targetScreen = el.dataset.screen;
                    if (targetScreen) {
                        activeScreen = targetScreen;
                        renderApp();
                    }
                });
            });

            document.getElementById('profileBtn')?.addEventListener('click', () => {
                activeScreen = 'settings';
                renderApp();
            });

            // modal links for onboarding
            if (activeScreen === 'onboarding') {
                document.getElementById('privacyLink')?.addEventListener('click', (e) => showModal('Privacy Policy', 'We respect your data. No unnecessary collection.'));
                document.getElementById('termsLink')?.addEventListener('click', (e) => showModal('Terms of Service', 'Use Python· responsibly. Be cool.'));
            }

            // theme toggle inside settings
            if (activeScreen === 'settings') {
                const toggle = document.getElementById('themeToggle');
                if (toggle) toggle.checked = currentTheme === 'dark';
                toggle?.addEventListener('change', (e) => {
                    setTheme(e.target.checked ? 'dark' : 'light');
                });
                // simulate save
                document.querySelector('.btn-primary')?.addEventListener('click', () => {
                    alert('Settings saved (demo)');
                });
            }

            // lesson / practice interactions
            if (activeScreen === 'learn') {
                document.querySelectorAll('.lesson-item').forEach((item, idx) => {
                    item.addEventListener('click', () => {
                        alert(`Lesson ${idx+1} preview (full version)`);
                    });
                });
                document.getElementById('startPractice')?.addEventListener('click', ()=>{
                    document.getElementById('progressFill').style.width = '68%';
                });
            }
            if (activeScreen === 'home') {
                document.getElementById('dailyBtn')?.addEventListener('click', ()=>{
                    activeScreen = 'learn';
                    renderApp();
                });
            }
        }

        function getScreenContent(screen) {
            switch(screen) {
                case 'onboarding':
                    return `<div style="display: flex; flex-direction: column; height:100%;">
                        <div style="flex:1; display: flex; flex-direction: column; justify-content: center;">
                            <div style="background: var(--primary); width: 60px; height:60px; border-radius: 20px; margin-bottom: 16px; display:flex; align-items:center; justify-content:center;">${icons.learn.replace('currentColor', 'white')}</div>
                            <h1 style="font-size:40px; font-weight:700; color: var(--primary);">Python·</h1>
                            <p style="font-size:18px; margin: 8px 0 4px;">code with confidence</p>
                            <p style="color: var(--text-light); margin: 16px 0 32px;">Master Python through bite-sized exercises and real‑world puzzles. Perfect for beginners.</p>
                            <button class="btn-primary" id="getStartedBtn">Get Started →</button>
                            <div style="display:flex; gap:24px; justify-content:center; margin: 24px 0 16px;">
                                <span class="link" id="privacyLink">Privacy</span>
                                <span class="link" id="termsLink">Terms</span>
                            </div>
                        </div>
                    </div>`;
                case 'home':
                    return `<div style="overflow-y: auto; padding-bottom: 8px;">
                        <div class="card">
                            <div class="row-space"><span class="badge">🔥 7 day streak</span> <span>${icons.flashcards}</span></div>
                            <h2 style="margin: 12px 0 6px;">Continue where you left</h2>
                            <p>Variables & types · 78%</p>
                            <div class="progress-bar"><div class="progress-fill" style="width:78%"></div></div>
                            <button class="btn-primary" id="dailyBtn" style="margin-top:16px;">Daily practice</button>
                        </div>
                        <div class="card">
                            <div class="row-space"><span>📘 Your next lessons</span> <span>${icons.play}</span></div>
                            <div class="lesson-item"><span>1. Lists & loops</span><span>68%</span></div>
                            <div class="lesson-item"><span>2. Functions</span><span>42%</span></div>
                            <div class="lesson-item"><span>3. Dictionaries</span><span>15%</span></div>
                        </div>
                        <div class="card" style="display:flex; gap:8px; align-items:center;">
                            ${icons.chart} <span>Weekly goal: 120 XP · 80/120</span>
                        </div>
                    </div>`;
                case 'learn':
                    return `<div style="overflow-y: auto;">
                        <div class="card"><span class="badge">🐍 Python basics</span>
                            <div class="lesson-item"><span>Strings & printing</span> ${icons.play}</div>
                            <div class="lesson-item"><span>Numbers & math</span> ${icons.play}</div>
                            <div class="lesson-item"><span>Conditionals</span> ${icons.play}</div>
                        </div>
                        <div class="card">
                            <span class="badge" style="background:var(--accent);">challenge</span>
                            <div style="display:flex; gap:16px; margin-top:12px;"><span>mini quiz: loops</span> <button id="startPractice" style="background:var(--primary); border:none; color:white; padding:8px 20px; border-radius:40px;">start</button></div>
                            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:44%"></div></div>
                        </div>
                    </div>`;
                case 'progress':
                    return `<div style="overflow-y: auto;">
                        <div class="card"><span>🔥 23 days active</span><div class="chart-row"><div class="bar" style="height:40px"></div><div class="bar" style="height:70px"></div><div class="bar" style="height:55px"></div><div class="bar" style="height:90px"></div></div></div>
                        <div class="card"><span>⭐ achievements</span><div style="display:flex; gap:16px; margin:16px 0;"><span>${icons.check} early bird</span><span>${icons.flashcards} 5 lessons</span></div></div>
                        <div class="card">Total XP: 3,420 <div class="progress-bar"><div class="progress-fill" style="width:68%"></div></div></div>
                    </div>`;
                case 'settings':
                    return `<div style="overflow-y: auto;">
                        <div class="card row-space"><span>🌙 Dark mode</span><label><input type="checkbox" id="themeToggle"></label></div>
                        <div class="card row-space"><span>🔔 Notifications</span><span>on</span></div>
                        <div class="card row-space"><span>👤 Profile</span> <span>${icons.profile}</span></div>
                        <div class="card"><button class="btn-primary" style="background:var(--accent);">Save preferences</button></div>
                    </div>`;
                default: return '';
            }
        }

        function updateHeaderTitle() {
            const titleMap = {
                onboarding: 'Python·',
                home: 'Home',
                learn: 'Learn',
                progress: 'Progress',
                settings: 'Settings'
            };
            const el = document.getElementById('screenTitle');
            if (el) el.innerText = titleMap[activeScreen] || 'Python·';
        }

        function showModal(title, msg) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `<div class="modal-content"><h3>${title}</h3><p style="margin:20px 0;">${msg}</p><button class="btn-primary" id="closeModal">Close</button></div>`;
            document.querySelector('.phone-mock').appendChild(modal);
            document.getElementById('closeModal').addEventListener('click', () => modal.remove());
        }

        // --- screenshot shift+w ---
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                const phone = document.getElementById('phoneContainer');
                // sequential naming
                screenshotCounter++;
                let filename = (screenshotCounter <= 5) ? screenshotCounter + '.png' : '6.png';
                if (currentTheme === 'dark') filename = '6.png';
                // dummy capture: just log (real screenshot requires html2canvas, but spec says simulate naming)
                console.log(`📸 screenshot captured: ${filename} (theme:${currentTheme})`);
                alert(`Screenshot ${filename} saved (simulated)`);
            }
        });

        // initial
        renderApp();
        document.getElementById('getStartedBtn')?.addEventListener('click', () => {
            activeScreen = 'home';
            renderApp();
        });

        // expose for shift+w counter
        window.screenshotCounter = screenshotCounter;
    })();
</script>
</body>
</html>
