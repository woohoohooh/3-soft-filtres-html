```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Brain Trainer · prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --progress-bg: #E2E8F0;
            --shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.03);
            --header-icon: #334155;
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --progress-bg: #334155;
            --shadow: 0 8px 20px rgba(0,0,0,0.5);
            --header-icon: #CBD5E1;
        }

        body {
            background: #1a1f2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg);
            border-radius: 44px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3), 0 0 0 8px #2d2f3a;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s;
        }

        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 16px 20px 8px 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--inactive) transparent;
        }
        .screen::-webkit-scrollbar { width: 4px; }
        .screen::-webkit-scrollbar-thumb { background: var(--inactive); border-radius: 8px; }

        /* header (common) */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .header h2 {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--header-icon);
            transition: opacity 0.1s;
        }
        .profile-icon svg {
            width: 28px;
            height: 28px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* bottom navigation */
        .bottom-nav {
            background-color: var(--card);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 6px;
            border-radius: 0 0 44px 44px;
            box-shadow: var(--shadow);
            transition: background-color 0.2s;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            gap: 4px;
            transition: transform 0.15s ease;
            color: var(--inactive);
            fill: none;
        }
        .nav-item.active {
            color: var(--primary);
            transform: scale(1.05);
        }
        .nav-item.active .nav-icon {
            stroke: var(--primary);
            stroke-width: 2.2;
        }
        .nav-item .nav-icon {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            color: currentColor;
        }
        .nav-item.active .nav-label {
            color: var(--primary);
            font-weight: 600;
        }

        /* cards, buttons etc */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            border: 1px solid var(--border-light);
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 60px;
            padding: 16px 24px;
            font-weight: 600;
            font-size: 18px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(37,99,235,0.25);
            transition: 0.1s;
        }
        .btn-primary:active { background: var(--primary-dark); transform: scale(0.98); }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 16px;
        }
        .link-row button {
            background: none;
            border: none;
            color: var(--inactive);
            text-decoration: underline;
            font-size: 14px;
            cursor: pointer;
        }

        /* progress */
        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 40px;
            overflow: hidden;
            width: 100%;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .badge-grid {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            border-radius: 30px;
            padding: 6px 14px;
            font-weight: 600;
            font-size: 14px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
            color: var(--text-secondary);
        }

        /* modal overlay */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--card);
            padding: 24px;
            border-radius: 32px;
            width: 280px;
            color: var(--text-primary);
        }
        .modal-close {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 40px;
            padding: 10px;
            width: 100%;
            margin-top: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .toggle-switch {
            width: 48px;
            height: 24px;
            background: var(--inactive);
            border-radius: 40px;
            position: relative;
            cursor: pointer;
            transition: 0.1s;
        }
        .toggle-switch.active { background: var(--primary); }
        .toggle-knob {
            width: 20px; height: 20px; background: white; border-radius: 50%;
            position: absolute; top: 2px; left: 2px; transition: 0.15s;
        }
        .active .toggle-knob { left: 26px; }

        .hidden { display: none !important; }
    </style>
</head>

<script>
    (function() {
        // ---------- SVG ICON SYSTEM (inline, outline, 2px stroke, rounded) ----------
        const icons = {
            home: `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M5 12H3L12 3L21 12H19" stroke="currentColor" fill="none"/><path d="M5 12V19H9V14H15V19H19V12" stroke="currentColor" fill="none"/></svg>`,
            learn: `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M2 3H8C9.10457 3 10 3.89543 10 5V19C10 20.1046 9.10457 21 8 21H2V3Z" stroke="currentColor" fill="none"/><path d="M22 3H16C14.8954 3 14 3.89543 14 5V19C14 20.1046 14.8954 21 16 21H22V3Z" stroke="currentColor" fill="none"/><path d="M10 7H14" stroke="currentColor"/><path d="M10 11H14" stroke="currentColor"/><path d="M10 15H14" stroke="currentColor"/></svg>`,
            progress: `<svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><path d="M12 7V12L15 15" stroke="currentColor"/></svg>`,
            settings: `<svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5" stroke="currentColor" fill="none"/><path d="M19.4 15C18.9 16 18 16.6 17 16.9L15.8 19.2C15.5 19.8 14.9 20.2 14.2 20.2H9.8C9.1 20.2 8.5 19.8 8.2 19.2L7 16.9C6 16.6 5.1 16 4.6 15L2.3 13.3C1.8 12.7 1.8 11.9 2.3 11.3L4.6 9.6C5.1 8.6 6 8 7 7.7L8.2 5.4C8.5 4.8 9.1 4.4 9.8 4.4H14.2C14.9 4.4 15.5 4.8 15.8 5.4L17 7.7C18 8 18.9 8.6 19.4 9.6L21.7 11.3C22.2 11.9 22.2 12.7 21.7 13.3L19.4 15Z" stroke="currentColor" fill="none"/></svg>`,
            profile: `<svg viewBox="0 0 24 24"><path d="M20 21V19C20 16.8 18.2 15 16 15H8C5.8 15 4 16.8 4 19V21" stroke="currentColor" fill="none"/><circle cx="12" cy="7" r="4" stroke="currentColor" fill="none"/></svg>`,
            lesson: `<svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" fill="none"/><path d="M8 10H16" stroke="currentColor"/><path d="M8 14H12" stroke="currentColor"/></svg>`,
            chart: `<svg viewBox="0 0 24 24"><path d="M21 20H3V4" stroke="currentColor" fill="none"/><path d="M7 16V12" stroke="currentColor"/><path d="M11 16V8" stroke="currentColor"/><path d="M15 16V10" stroke="currentColor"/><path d="M19 16V6" stroke="currentColor"/></svg>`,
            flashcards: `<svg viewBox="0 0 24 24"><path d="M4 5H16C17.1046 5 18 5.89543 18 7V17C18 18.1046 17.1046 19 16 19H4V5Z" stroke="currentColor" fill="none"/><path d="M8 5V3H20V17H18" stroke="currentColor" fill="none"/></svg>`,
            play: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><path d="M10 8L16 12L10 16V8Z" stroke="currentColor" fill="none"/></svg>`,
            check: `<svg viewBox="0 0 24 24"><path d="M20 6L9 17L4 12" stroke="currentColor" fill="none"/></svg>`
        };

        // ----- state -----
        let currentScreen = 'onboarding'; // home, learn, progress, settings, onboarding
        let darkMode = false;
        let screenshotCounter = 1; // for shift+w naming

        // ----- helper to render active screen -----
        const app = document.querySelector('.phone');

        function render() {
            const headerTitleMap = {
                onboarding: 'Welcome',
                home: 'Dashboard',
                learn: 'Practice',
                progress: 'Insights',
                settings: 'Settings'
            };
            const title = headerTitleMap[currentScreen] || 'Math Brain';

            let screenHtml = `
                <div class="screen" id="mainScreen">
                    <!-- header -->
                    <div class="header">
                        <h2>${title}</h2>
                        <div class="profile-icon" id="profileBtn">${icons.profile}</div>
                    </div>
                    <!-- dynamic content -->
                    <div id="screenContent">${getScreenContent()}</div>
                </div>
                <!-- bottom nav (hidden on onboarding) -->
                ${currentScreen !== 'onboarding' ? getBottomNav() : ''}
            `;

            app.innerHTML = screenHtml;
            attachEvents();
        }

        function getScreenContent() {
            switch(currentScreen) {
                case 'onboarding': return onboardingHTML();
                case 'home': return homeHTML();
                case 'learn': return learnHTML();
                case 'progress': return progressHTML();
                case 'settings': return settingsHTML();
                default: return onboardingHTML();
            }
        }

        // onboarding
        function onboardingHTML() {
            return `
                <div style="display: flex; flex-direction: column; align-items: center; margin-top: 40px;">
                    <div style="background: var(--primary); width: 72px; height: 72px; border-radius: 24px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
                        <svg width="44" height="44" viewBox="0 0 24 24" stroke="white" stroke-width="2" fill="none"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 3"/></svg>
                    </div>
                    <h1 style="font-size: 32px; font-weight: 700; color: var(--text-primary);">Math Brain</h1>
                    <p style="color: var(--text-secondary); font-size: 18px; margin: 8px 0;">trainer</p>
                    <p style="color: var(--text-secondary); text-align: center; margin: 20px 0;">Boost mental arithmetic with daily 5‑minute workouts. Personalized brain training.</p>
                    <button class="btn-primary" id="getStartedBtn">Get Started</button>
                    <div class="link-row">
                        <button id="privacyModalBtn">Privacy Policy</button>
                        <button id="termsModalBtn">Terms of Service</button>
                    </div>
                </div>
            `;
        }

        // Home dashboard
        function homeHTML() {
            return `
                <div class="card" style="display: flex; gap: 12px; align-items: center;">
                    <div style="background: var(--accent); padding: 12px; border-radius: 18px;">${icons.flashcards.replace('currentColor', 'var(--primary)')}</div>
                    <div><strong style="color:var(--text-primary);">Daily workout</strong><br><span style="color:var(--text-secondary);">3 lessons left</span></div>
                    <div style="margin-left: auto; width: 80px;"><div class="progress-bar"><div class="progress-fill" style="width:40%"></div></div></div>
                </div>
                <div class="card">
                    <h3 style="color:var(--text-primary); margin-bottom: 10px;">Today’s quest</h3>
                    <div style="display:flex; gap:12px; align-items:center; margin-bottom:12px;"><span>${icons.lesson.replace('currentColor', 'var(--primary)')}</span><span style="color:var(--text-primary);">Multiplication  ·  5 min</span></div>
                    <div style="display:flex; gap:12px; align-items:center;"><span>${icons.flashcards.replace('currentColor', 'var(--primary)')}</span><span style="color:var(--text-primary);">Addition pyramid</span></div>
                    <button class="btn-primary" style="margin-top:16px; padding:12px;" id="startPracticeBtn">Practice now</button>
                </div>
                <div class="card">
                    <div style="display: flex; justify-content: space-between;">
                        <span style="color:var(--text-primary); font-weight:600;">Streak: 12 days</span>
                        <span style="color:var(--text-secondary);">🏆 +3 today</span>
                    </div>
                </div>
                <div class="badge-grid">
                    <span class="badge">fast solver</span>
                    <span class="badge">streak 7</span>
                    <span class="badge">precision</span>
                </div>
            `;
        }

        // learn / practice
        function learnHTML() {
            return `
                <div class="card" style="display:flex; gap:12px; align-items:center;">
                    <div style="background:var(--accent); padding:10px; border-radius:20px;">${icons.play.replace('currentColor', 'var(--primary)')}</div>
                    <div><span style="color:var(--text-primary);font-weight:600;">Quick match</span><br><span style="color:var(--text-secondary);">mental math</span></div>
                    <div style="margin-left: auto;">▶</div>
                </div>
                <div class="card" style="display:flex; gap:12px; align-items:center;">
                    <div style="background:var(--accent); padding:10px; border-radius:20px;">${icons.lesson.replace('currentColor', 'var(--primary)')}</div>
                    <div><span style="color:var(--text-primary);font-weight:600;">Number bonds</span><br><span style="color:var(--text-secondary);">addition</span></div>
                    <div style="margin-left: auto;">▶</div>
                </div>
                <div class="card">
                    <span style="color:var(--text-primary);font-weight:600;">Today’s progress</span>
                    <div class="stat-row"><span>Easy</span><span>80%</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:80%"></div></div>
                    <div class="stat-row" style="margin-top:10px;"><span>Medium</span><span>50%</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:50%"></div></div>
                </div>
            `;
        }

        // progress
        function progressHTML() {
            return `
                <div class="card">
                    <div style="display:flex; gap:8px;">${icons.chart.replace('currentColor', 'var(--primary)')}<span style="color:var(--text-primary);font-weight:600;">Last 7 days</span></div>
                    <div style="height:80px; display:flex; align-items:flex-end; gap:6px; margin:10px 0;">
                        <div style="flex:1; height:40px; background:var(--primary); border-radius:8px;"></div>
                        <div style="flex:1; height:60px; background:var(--primary); border-radius:8px;"></div>
                        <div style="flex:1; height:20px; background:var(--primary); border-radius:8px;"></div>
                        <div style="flex:1; height:70px; background:var(--primary); border-radius:8px;"></div>
                        <div style="flex:1; height:55px; background:var(--primary); border-radius:8px;"></div>
                        <div style="flex:1; height:30px; background:var(--primary); border-radius:8px;"></div>
                        <div style="flex:1; height:45px; background:var(--primary); border-radius:8px;"></div>
                    </div>
                </div>
                <div class="card">
                    <span style="color:var(--text-primary);font-weight:600;">Statistics</span>
                    <div class="stat-row"><span>Problems solved</span><span>1,240</span></div>
                    <div class="stat-row"><span>Accuracy</span><span>92%</span></div>
                    <div class="stat-row"><span>Longest streak</span><span>21 days</span></div>
                </div>
                <div class="card">
                    <span style="color:var(--text-primary);font-weight:600;">Achievements</span>
                    <div style="display:flex; gap:20px; margin-top:10px;">
                        <div style="background: gold; width:40px; height:40px; border-radius:40px;"></div>
                        <div style="background: silver; width:40px; height:40px; border-radius:40px;"></div>
                        <div style="background: #cd7f32; width:40px; height:40px; border-radius:40px;"></div>
                    </div>
                </div>
            `;
        }

        // settings/profile (profile icon opens it)
        function settingsHTML() {
            return `
                <div class="card">
                    <div style="display:flex; gap:12px; align-items:center; margin-bottom:20px;">
                        <div style="background: var(--accent); border-radius: 40px; width:48px; height:48px; display: flex; align-items: center; justify-content: center;">${icons.profile}</div>
                        <div><span style="color:var(--text-primary);font-weight:600;">Alex Rivera</span><br><span style="color:var(--text-secondary);">alex@example.com</span></div>
                    </div>
                </div>
                <div class="card" style="display:flex; justify-content: space-between;">
                    <span style="color:var(--text-primary);">Dark mode</span>
                    <div class="toggle-switch ${darkMode ? 'active' : ''}" id="themeToggle"><div class="toggle-knob"></div></div>
                </div>
                <div class="card" style="display:flex; gap:12px;">${icons.settings} <span style="color:var(--text-primary);">App version 2.1.0</span></div>
                <div class="card"><button class="btn-primary" style="background:transparent; border:2px solid var(--primary); color:var(--primary);">Sign out</button></div>
            `;
        }

        function getBottomNav() {
            const items = ['home', 'learn', 'progress', 'settings'];
            return `
                <div class="bottom-nav">
                    ${items.map(id => `
                        <button class="nav-item ${currentScreen === id ? 'active' : ''}" data-nav="${id}">
                            ${icons[id]}
                            <span class="nav-label">${id.charAt(0).toUpperCase() + id.slice(1)}</span>
                        </button>
                    `).join('')}
                </div>
            `;
        }

        // navigation & modals
        function attachEvents() {
            // bottom nav
            document.querySelectorAll('[data-nav]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const target = btn.dataset.nav;
                    if (target) { currentScreen = target; render(); }
                });
            });

            // profile -> settings
            const profileBtn = document.getElementById('profileBtn');
            if(profileBtn) profileBtn.addEventListener('click', ()=>{
                currentScreen = 'settings'; render();
            });

            // get started
            const getStarted = document.getElementById('getStartedBtn');
            if(getStarted) getStarted.addEventListener('click', ()=>{
                currentScreen = 'home'; render();
            });

            // start practice (from home)
            const startPractice = document.getElementById('startPracticeBtn');
            if(startPractice) startPractice.addEventListener('click', ()=>{
                currentScreen = 'learn'; render();
                // tiny progress animation after render
                setTimeout(()=>{
                    document.querySelectorAll('.progress-fill').forEach(el => el.style.width = '75%');
                },50);
            });

            // theme toggle inside settings
            const toggle = document.getElementById('themeToggle');
            if(toggle) {
                toggle.addEventListener('click', ()=>{
                    darkMode = !darkMode;
                    document.body.classList.toggle('dark', darkMode);
                    render(); // re-render to show active state
                });
            }

            // modal links (onboarding)
            const privacyBtn = document.getElementById('privacyModalBtn');
            const termsBtn = document.getElementById('termsModalBtn');
            if(privacyBtn) privacyBtn.addEventListener('click', ()=> showModal('Privacy Policy', 'We value your privacy. No data is sold to third parties.'));
            if(termsBtn) termsBtn.addEventListener('click', ()=> showModal('Terms of Service', 'Use Math Brain for personal training only. Be respectful.'));
        }

        function showModal(title, text) {
            const overlay = document.createElement('div');
            overlay.className = 'modal';
            overlay.innerHTML = `
                <div class="modal-content">
                    <h3 style="margin-bottom:8px;">${title}</h3>
                    <p>${text}</p>
                    <button class="modal-close" id="closeModalBtn">Close</button>
                </div>
            `;
            app.appendChild(overlay);
            document.getElementById('closeModalBtn').addEventListener('click', ()=> overlay.remove());
            overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.remove(); });
        }

        // screenshot feature shift+W
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const container = document.getElementById('phoneContainer');
                if (!container) return;
                import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
                    html2canvas(container, { scale: 2 }).then(canvas => {
                        const link = document.createElement('a');
                        const isDark = document.body.classList.contains('dark');
                        const num = isDark ? 6 : (screenshotCounter % 5) + 1;
                        link.download = `${num}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        screenshotCounter = (screenshotCounter % 5) + 1;
                    });
                }).catch(() => alert('html2canvas failed'));
            }
        });

        // initial render
        render();
    })();
</script>
</body>
</html>
```
