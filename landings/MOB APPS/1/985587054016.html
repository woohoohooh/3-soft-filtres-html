```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeSprout · Learn Python</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1a1e2c;
    }

    /* phone container */
    #phone {
      width: 360px;
      height: 780px;
      background: var(--bg-primary);
      border-radius: 42px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 0 8px #2d3349;
      position: relative;
      transition: background 0.2s;
    }

    /* main app screen */
    #app-screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
      color: var(--text-primary);
    }

    /* theme variables (light default) */
    :root {
      --bg-primary: #F8FAFC;
      --bg-card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --border-light: #E2E8F0;
      --inactive: #94A3B8;
      --nav-bg: #FFFFFF;
      --shadow: 0 4px 12px rgba(0,0,0,0.05);
      --progress-bg: #E2E8F0;
    }

    body.dark {
      --bg-primary: #0F172A;
      --bg-card: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --border-light: #334155;
      --inactive: #64748B;
      --nav-bg: #1E293B;
      --shadow: 0 4px 12px rgba(0,0,0,0.3);
      --progress-bg: #334155;
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 8px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }
    .profile-icon {
      cursor: pointer;
      padding: 6px;
      transition: transform 0.1s;
    }
    .profile-icon svg {
      width: 28px;
      height: 28px;
      stroke: var(--text-primary);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* main content area (dynamic) */
    #content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 8px;
      scrollbar-width: thin;
      scrollbar-color: var(--inactive) transparent;
    }
    #content::-webkit-scrollbar {
      width: 4px;
    }
    #content::-webkit-scrollbar-thumb {
      background: var(--inactive);
      border-radius: 10px;
    }

    /* bottom navigation */
    .bottom-nav {
      height: 68px;
      background: var(--nav-bg);
      border-top: 1px solid var(--border-light);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 8px;
      box-shadow: var(--shadow);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      flex: 1;
      padding: 8px 0;
      border-radius: 16px;
      transition: all 0.15s ease;
      background: transparent;
    }
    .nav-item.active {
      background: rgba(37, 99, 235, 0.1);
    }
    .nav-item svg {
      width: 26px;
      height: 26px;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: all 0.15s;
    }
    .nav-item.active svg {
      stroke: var(--primary);
      transform: scale(1.15);
    }
    .nav-item:not(.active) svg {
      stroke: var(--inactive);
    }
    .nav-label {
      font-size: 11px;
      font-weight: 500;
      transition: color 0.15s;
    }
    .nav-item.active .nav-label {
      color: var(--primary);
    }
    .nav-item:not(.active) .nav-label {
      color: var(--inactive);
    }

    /* cards, progress, stats */
    .card {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .progress-bar {
      height: 10px;
      background: var(--progress-bg);
      border-radius: 20px;
      margin: 10px 0;
      overflow: hidden;
    }
    .progress-fill {
      height: 10px;
      background: var(--primary);
      width: 0%;
      border-radius: 20px;
      transition: width 0.3s ease;
    }
    .badge {
      background: var(--accent);
      color: #0F172A;
      padding: 4px 10px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 600;
    }
    .icon-svg {
      width: 44px;
      height: 44px;
      stroke: var(--primary);
      stroke-width: 2;
      fill: none;
    }
    button {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      padding: 14px 20px;
      border-radius: 40px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      transition: 0.1s;
    }
    button:active { transform: scale(0.98); }
    .link-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 16px;
      font-size: 14px;
    }
    .link-row span {
      color: var(--inactive);
      text-decoration: underline;
      cursor: pointer;
    }
    .modal {
      position: fixed;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: var(--bg-card);
      padding: 24px;
      border-radius: 36px;
      box-shadow: 0 30px 60px black;
      z-index: 100;
      width: 280px;
      text-align: center;
      border: 1px solid var(--border-light);
    }
    .modal-overlay {
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.4);
      z-index: 99;
    }
    .hidden { display: none; }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-item {
      background: var(--bg-primary);
      padding: 12px;
      border-radius: 18px;
      text-align: center;
    }
  </style>
</head>
<body>
<div id="phone">
  <div id="app-screen">
    <!-- header -->
    <div class="header">
      <h1 id="screen-title">Welcome</h1>
      <div class="profile-icon" id="profileBtn">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></svg>
      </div>
    </div>

    <!-- main content (screens injected) -->
    <div id="content"></div>

    <!-- bottom navigation (4 icons) -->
    <div class="bottom-nav">
      <div class="nav-item" data-screen="home">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span class="nav-label">Home</span>
      </div>
      <div class="nav-item" data-screen="learn">
        <svg viewBox="0 0 24 24"><path d="M12 6v7m0 0v5m0-5h5m-5 0H7"/><circle cx="12" cy="12" r="10"/></svg>
        <span class="nav-label">Learn</span>
      </div>
      <div class="nav-item" data-screen="progress">
        <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span class="nav-label">Progress</span>
      </div>
      <div class="nav-item" data-screen="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.03.03A10 10 0 0 0 12 17.66a10 10 0 0 0 6.37-2.63z"/><path d="M12 2v2"/></svg>
        <span class="nav-label">Settings</span>
      </div>
    </div>
  </div>
</div>

<!-- modal templates (hidden) -->
<div id="modalOverlay" class="modal-overlay hidden"></div>
<div id="privacyModal" class="modal hidden">
  <h3 style="margin-bottom:12px;">Privacy Policy</h3>
  <p style="font-size:14px;">We don't collect any data. Your progress stays on this device.</p>
  <button style="margin-top:16px;" id="closePrivacy">Close</button>
</div>
<div id="termsModal" class="modal hidden">
  <h3 style="margin-bottom:12px;">Terms of Service</h3>
  <p style="font-size:14px;">Learning is free for everyone. Use responsibly.</p>
  <button style="margin-top:16px;" id="closeTerms">Close</button>
</div>

<script>
  (function() {
    // ---------- theme toggle ----------
    const themeState = { dark: false };

    // ---------- icon system ----------
    const icons = {
      home: '<svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
      learn: '<svg viewBox="0 0 24 24"><path d="M12 6v7m0 0v5m0-5h5m-5 0H7"/><circle cx="12" cy="12" r="10"/></svg>',
      progress: '<svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
      settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.03.03A10 10 0 0 0 12 17.66a10 10 0 0 0 6.37-2.63z"/><path d="M12 2v2"/></svg>',
      profile: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></svg>',
      lesson: '<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
      chart: '<svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
      flashcards: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 8h6"/><path d="M9 12h6"/><path d="M9 16h4"/></svg>',
      play: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>',
      check: '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
    };

    // ---------- DOM elements ----------
    const contentDiv = document.getElementById('content');
    const screenTitle = document.getElementById('screen-title');
    const navItems = document.querySelectorAll('.nav-item');
    const profileBtn = document.getElementById('profileBtn');

    // modals
    const modalOverlay = document.getElementById('modalOverlay');
    const privacyModal = document.getElementById('privacyModal');
    const termsModal = document.getElementById('termsModal');
    document.getElementById('closePrivacy').onclick = () => { modalOverlay.classList.add('hidden'); privacyModal.classList.add('hidden'); };
    document.getElementById('closeTerms').onclick = () => { modalOverlay.classList.add('hidden'); termsModal.classList.add('hidden'); };
    function showModal(type) {
      modalOverlay.classList.remove('hidden');
      if (type === 'privacy') privacyModal.classList.remove('hidden');
      if (type === 'terms') termsModal.classList.remove('hidden');
    }

    // ---------- screens ----------
    function renderOnboarding() {
      screenTitle.innerText = 'Welcome';
      let html = `
        <div style="text-align:center; padding:20px 0;">
          <div style="background:var(--primary); width:80px; height:80px; border-radius:28px; margin:20px auto; display:flex; align-items:center; justify-content:center;">
            <svg width="48" height="48" viewBox="0 0 24 24" stroke="white" stroke-width="2" fill="none"><path d="M12 2v4M12 22v-4M4 12H2M8 12H6M18 12h-2M22 12h-2M19.07 4.93l-2.83 2.83M7.76 16.24l-2.83 2.83M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83"/><circle cx="12" cy="12" r="4"/></svg>
          </div>
          <h1 style="font-size:32px; font-weight:700; letter-spacing:-1px;">CodeSprout</h1>
          <p style="font-size:18px; color:var(--primary); font-weight:600; margin:4px 0;">Learn Python · one bite a day</p>
          <p style="color:var(--text-secondary); margin:20px 16px;">Bite‑sized Python lessons, interactive quizzes, and real code practice. From zero to builder.</p>
          <button id="getStartedBtn">Get Started</button>
          <div class="link-row">
            <span id="privacyLink">Privacy Policy</span>
            <span id="termsLink">Terms of Service</span>
          </div>
        </div>
      `;
      contentDiv.innerHTML = html;
      document.getElementById('privacyLink')?.addEventListener('click', () => showModal('privacy'));
      document.getElementById('termsLink')?.addEventListener('click', () => showModal('terms'));
      document.getElementById('getStartedBtn')?.addEventListener('click', () => setActiveScreen('home'));
    }

    // home dashboard
    function renderHome() {
      screenTitle.innerText = 'Home';
      let html = `
        <div class="card">
          <div class="row"><span style="font-weight:600;">Daily Streak</span><span class="badge">7 days 🔥</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
          <div class="row"><span>Next lesson:</span><span>Variables & Data types</span></div>
          <button style="margin-top:12px;" id="resumeBtn">Resume</button>
        </div>
        <div class="card">
          <div style="display:flex; gap:16px;">
            <span class="icon-svg">${icons.lesson}</span>
            <div><h3>Python basics</h3><p>3/7 completed</p><div class="progress-bar" style="width:120px;"><div class="progress-fill" style="width:42%"></div></div></div>
          </div>
          <div style="display:flex; gap:16px; margin-top:12px;">
            <span class="icon-svg">${icons.flashcards}</span>
            <div><h3>Flashcards: keywords</h3><p>24 due</p></div>
          </div>
        </div>
        <div class="card">
          <div class="row"><h3>Recommended</h3><span>view all</span></div>
          <div style="background:var(--bg-primary); border-radius:18px; padding:12px; margin-top:10px;">
            <span>🐍 Functions deep dive</span>
          </div>
        </div>
      `;
      contentDiv.innerHTML = html;
      document.getElementById('resumeBtn')?.addEventListener('click', () => setActiveScreen('learn'));
    }

    // learn / practice
    function renderLearn() {
      screenTitle.innerText = 'Learn';
      let html = `
        <div class="card"><span style="font-weight:600;">Today’s plan</span>
          <div style="margin-top:12px;"><span>1. Variables (easy)</span><span style="float:right;">${icons.check.replace('24','18')}</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div>
          <div style="margin-top:12px;"><span>2. Lists & loops</span><span style="float:right;">in progress</span></div><div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div>
          <div style="margin-top:12px;"><span>3. Functions</span><span style="float:right;">locked</span></div><div class="progress-bar"><div class="progress-fill" style="width:0"></div></div>
          <button style="margin-top:16px;" id="startPractice">Start practice →</button>
        </div>
        <div class="card">
          <div class="row"><h3>Flashcards</h3><span>24 cards</span></div>
          <div style="display:flex; gap:6px;">${icons.flashcards}  <span>Python keywords · 5 min</span></div>
        </div>
      `;
      contentDiv.innerHTML = html;
      document.getElementById('startPractice')?.addEventListener('click', ()=>{
        alert('Practice session started! (simulated)');
      });
    }

    // progress / statistics
    function renderProgress() {
      screenTitle.innerText = 'Progress';
      let html = `
        <div class="card stat-grid">
          <div class="stat-item"><span style="font-size:24px; font-weight:700;">12</span><br>lessons done</div>
          <div class="stat-item"><span style="font-size:24px; font-weight:700;">158</span><br>XP today</div>
          <div class="stat-item"><span style="font-size:24px; font-weight:700;">4</span><br>streak</div>
          <div class="stat-item"><span style="font-size:24px; font-weight:700;">78%</span><br>mastery</div>
        </div>
        <div class="card">
          <h3>Weekly activity</h3>
          <div style="display:flex; gap:6px; justify-content:space-around; margin:10px 0;">
            <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>Su</span>
          </div>
          <div style="display:flex; gap:6px; justify-content:space-around;">
            <div style="height:20px; width:22px; background:var(--primary); border-radius:8px;"></div>
            <div style="height:40px; width:22px; background:var(--primary); border-radius:8px;"></div>
            <div style="height:60px; width:22px; background:var(--primary); border-radius:8px;"></div>
            <div style="height:30px; width:22px; background:var(--primary); border-radius:8px;"></div>
            <div style="height:55px; width:22px; background:var(--primary); border-radius:8px;"></div>
            <div style="height:25px; width:22px; background:var(--inactive); border-radius:8px;"></div>
            <div style="height:10px; width:22px; background:var(--inactive); border-radius:8px;"></div>
          </div>
        </div>
        <div class="card"><span>🏆 Achievements: 4/12</span><div class="progress-bar"><div class="progress-fill" style="width:33%"></div></div></div>
      `;
      contentDiv.innerHTML = html;
    }

    // settings / profile (theme toggle inside)
    function renderSettings() {
      screenTitle.innerText = 'Settings';
      let html = `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span>Dark theme</span>
            <label style="width:52px; height:28px; background:var(--inactive); border-radius:40px; display:inline-block; position:relative; cursor:pointer;">
              <input type="checkbox" id="darkToggle" style="opacity:0; width:0; height:0;"> 
              <span style="width:24px; height:24px; background:white; border-radius:50%; position:absolute; top:2px; left:2px; transition:0.2s;" id="toggleThumb"></span>
            </label>
          </div>
          <div style="margin-top:20px;"><span>Profile</span><p>alex@example.org</p></div>
          <hr style="border-color:var(--border-light); margin:16px 0;">
          <div>Sound · Notifications · Language</div>
        </div>
        <div class="card">App version 2.6.1 · built for 2026</div>
      `;
      contentDiv.innerHTML = html;
      const toggle = document.getElementById('darkToggle');
      const thumb = document.getElementById('toggleThumb');
      if (toggle) {
        toggle.checked = themeState.dark;
        thumb.style.left = themeState.dark ? '26px' : '2px';
        toggle.addEventListener('change', (e) => {
          themeState.dark = e.target.checked;
          thumb.style.left = e.target.checked ? '26px' : '2px';
          if (e.target.checked) document.body.classList.add('dark');
          else document.body.classList.remove('dark');
        });
      }
    }

    // navigation
    function setActiveScreen(screenId) {
      // update bottom nav active class
      navItems.forEach(item => {
        const scr = item.getAttribute('data-screen');
        if (scr === screenId) item.classList.add('active');
        else item.classList.remove('active');
      });
      if (screenId === 'home') renderHome();
      else if (screenId === 'learn') renderLearn();
      else if (screenId === 'progress') renderProgress();
      else if (screenId === 'settings') renderSettings();
      else if (screenId === 'onboarding') renderOnboarding();
    }

    // profile button => settings
    profileBtn.addEventListener('click', () => setActiveScreen('settings'));

    // bottom nav listeners
    navItems.forEach(item => {
      item.addEventListener('click', (e) => {
        e.preventDefault();
        const screen = item.getAttribute('data-screen');
        setActiveScreen(screen);
      });
    });

    // ---------- screenshot (SHIFT+W) ----------
    let screenshotCounter = 0;
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const phone = document.getElementById('phone');
        html2canvas(phone, { scale: 2 }).then(canvas => {
          const link = document.createElement('a');
          const isDark = document.body.classList.contains('dark');
          let filename = isDark ? '6.png' : (screenshotCounter < 5 ? `${screenshotCounter+1}.png` : `${screenshotCounter+1}.png`);
          if (!isDark) {
            screenshotCounter = (screenshotCounter % 5) + 1;
            filename = screenshotCounter + '.png';
          } else {
            filename = '6.png';
          }
          link.download = filename;
          link.href = canvas.toDataURL('image/png');
          link.click();
        });
      }
    });
