    /* main content area (scrollable) */
    .content {

      stroke-linejoin: round;

    }

      color: white;
      font-weight: 600;
      padding: 16px 24px;
      border-radius: 60px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.1s;
      box-shadow: 0 6px 0 var(--primary-dark);
    }
    button:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--primary-dark); }

    .link-row {

    }
    .modal-overlay {

      top:0; left:0; width:100%; height:100%;
      background: #00000080;
      z-index: 100;
    }
    .hidden { display: none; }
    .modal-close {
      margin-top: 16px;
      background: var(--primary);
      padding: 10px;
      border-radius: 40px;
      width: 100%;
    }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <div class="app-screen" id="appScreen">
    <!-- header (dynamic via js) -->
    <div class="header" id="appHeader">
      <h1 id="headerTitle">Welcome</h1>
      <button class="profile-btn" id="profileBtn">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--header-icon)" stroke-width="2" stroke-linecap="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" />
        </svg>
      </button>
    </div>

    <!-- dynamic content -->
    <div class="content" id="contentArea"></div>

    <!-- bottom nav (4 items) -->
    <div class="bottom-nav" id="bottomNav">
      <button class="nav-item" data-screen="home" id="navHome">
        <span class="nav-icon" id="iconHome"></span>
        <span class="nav-label">Home</span>

</div>

<!-- modals overlay + hidden containers -->
<div id="modalOverlay" class="modal-overlay hidden"></div>
<div id="privacyModal" class="modal hidden">
  <h3 style="margin-bottom:12px;">Privacy Policy</h3>
  <p style="font-size:14px;">Your data stays on device. We don't collect anything. Learn happily.</p>
  <button class="modal-close" id="closePrivacy">OK</button>
</div>
<div id="termsModal" class="modal hidden">
  <h3 style="margin-bottom:12px;">Terms of Service</h3>
  <p style="font-size:14px;">Free for everyone. Use responsibly. Have fun building skills.</p>
  <button class="modal-close" id="closeTerms">OK</button>
</div>

<script>
  (function() {
    // ----- THEME & CONSTANTS -----
    const STORAGE_KEY = 'codelingua_theme';
    let darkMode = localStorage.getItem(STORAGE_KEY) === 'dark';
    const body = document.body;
    if (darkMode) body.classList.add('dark');
    else body.classList.remove('dark');

    // screens: onboarding, home, learn, progress, settings (profile)
    let currentScreen = 'onboarding';

    // icons pool (inline SVG)
    function renderIcon(name, active = false) {
      const color = active ? '#2563EB' : 'currentColor';
      const strokeW = 2;
      // all icons outline, 2px stroke, rounded caps
      if (name === 'home') return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"><path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>`;
      if (name === 'learn') return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`;
      if (name === 'progress') return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><circle cx="12" cy="16" r="5"/><path d="M12 11v5"/></svg>`;
      if (name === 'settings') return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.03.03A10 10 0 0 0 12 17.66a10 10 0 0 0 6.37-2.63z"/></svg>`;
      if (name === 'profile') return `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
      if (name === 'lesson') return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`;
      if (name === 'chart') return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2"><path d="M21 16v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2"/><path d="M7 10l3-3 3 3 4-4"/><path d="M17 10V4h-6"/></svg>`;
      if (name === 'flashcards') return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 7h8"/><path d="M8 11h6"/><path d="M8 15h4"/></svg>`;
      if (name === 'play') return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4V8z"/></svg>`;
      if (name === 'check') return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>`;
      return '';
    }

    // inject bottom nav icons
    function updateNavIcons(activeId) {
      document.getElementById('iconHome').innerHTML = renderIcon('home', activeId === 'home');
      document.getElementById('iconLearn').innerHTML = renderIcon('learn', activeId === 'learn');
      document.getElementById('iconProgress').innerHTML = renderIcon('progress', activeId === 'progress');
      document.getElementById('iconSettings').innerHTML = renderIcon('settings', activeId === 'settings');
    }

    // header title update
    const headerMap = {
      onboarding: 'Welcome',
      home: 'Home',
      learn: 'Lessons',
      progress: 'Insights',
      settings: 'Settings',
      profile: 'Profile'
    };

    // ----- RENDER SCREEN -----
    function renderScreen(screen) {
      const content = document.getElementById('contentArea');
      const headerTitle = document.getElementById('headerTitle');
      headerTitle.innerText = headerMap[screen] || 'App';

      let html = '';
      if (screen === 'onboarding') {
        html = `
          <div style="text-align: center; padding: 20px 0 10px;">
            <div style="background: var(--primary); width: 80px; height: 80px; border-radius: 30px; margin: 10px auto 16px; display: flex; align-items: center; justify-content: center;">
              <span style="font-size: 48px; filter: brightness(0) invert(1);">📘</span>
            </div>
            <h2 style="font-size: 36px; font-weight: 800; letter-spacing: -0.02em;">CodeLingua</h2>
            <p style="font-size: 18px; color: var(--primary); font-weight: 600; margin: 4px 0 12px;">English vocabulary builder</p>
            <p style="color: var(--text-secondary); max-width: 260px; margin: 0 auto 28px;">Master 5,000 words with smart flashcards. Bite‑size daily practice.</p>
            <button id="getStartedBtn" style="width: 100%;">Get Started</button>
            <div class="link-row">
              <span id="showPrivacy" style="cursor: pointer;">Privacy</span>
              <span id="showTerms" style="cursor: pointer;">Terms</span>
            </div>
          </div>
        `;
      } else if (screen === 'home') {
        html = `
          <div class="card">
            <div class="flex-row"><span style="font-weight:600;">👋 Welcome back, Alex</span><span class="badge">🔥 7 day streak</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width:64%"></div></div>
            <div class="flex-row"><span>Daily goal: 64%</span><span>32/50 XP</span></div>
          </div>
          <div class="card">
            <div style="display: flex; gap: 16px; align-items: center;">${renderIcon('flashcards', false)} <span style="font-weight:600;">Continue lesson</span></div>
            <p style="margin:12px 0 6px;">Business English · 5 min</p>
            <div class="progress-bar"><div class="progress-fill" style="width:24%"></div></div>
            <div class="flex-row" style="margin-top:12px;"><span>🕒 3 new words</span><button style="padding:10px 18px;">${renderIcon('play', false)} Practice</button></div>
          </div>
          <div class="card"><span style="font-weight:600;">Recommended</span><div style="display:flex; gap:16px; margin-top:14px;"><span>📘 Idioms</span><span>✍️ Writing</span><span>🎧 Listening</span></div></div>
        `;
      } else if (screen === 'learn') {
        html = `
          <div class="card flex-row"><span>📚 Phrasal verbs</span> ${renderIcon('play', false)}</div>
          <div class="card flex-row"><span>✏️ 1000 most common</span> ${renderIcon('lesson', false)}</div>
          <div class="card flex-row"><span>🎯 TOEFL academic</span> <span class="badge">new</span></div>
          <div class="card"><span style="font-weight:600;">Today's flashcards</span><div style="display:flex; gap:20px; margin:12px 0;">${renderIcon('flashcards', false)} 12 cards left</div><div class="progress-bar"><div class="progress-fill" style="width:40%"></div></div></div>
        `;
      } else if (screen === 'progress') {
        html = `
          <div class="card"><span style="font-weight:600;">Overall fluency</span><div style="font-size:42px; font-weight:800;">34%</div>${renderIcon('chart', false)}</div>
          <div class="card"><div class="flex-row"><span>Words learned</span><span>1,240 / 5k</span></div><div class="progress-bar"><div class="progress-fill" style="width:24.8%"></div></div></div>
          <div class="card"><span>🔥 7 day streak</span><div style="display:flex; gap:6px; margin:12px 0;">⬜⬜⬜🟦🟦🟦🟦</div></div>
          <div class="card"><span>🏅 Achievements</span> <span>4 badges</span></div>
        `;
      } else if (screen === 'settings') {
        html = `
          <div class="card">
            <div class="flex-row"><span>Dark theme</span><label><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}></label></div>
          </div>
          <div class="card">Notifications</div>
          <div class="card">Sound</div>
          <div class="card">Profile: Alex</div>
        `;
      } else if (screen === 'profile') {
        html = `<div class="card"><h3>Profile</h3>${renderIcon('profile', false)} <p>Alex Johnson · alex@example.com</p></div>
                <div class="card">Account settings</div><div class="card">Subscription</div>`;
      }
      content.innerHTML = html;

      // re-attach listeners for onboarding modals / get started
      if (screen === 'onboarding') {
        document.getElementById('showPrivacy')?.addEventListener('click', ()=> openModal('privacy'));
        document.getElementById('showTerms')?.addEventListener('click', ()=> openModal('terms'));
        document.getElementById('getStartedBtn')?.addEventListener('click', ()=> navigateTo('home'));
      }
      if (screen === 'settings') {
        const toggle = document.getElementById('darkToggle');
        if (toggle) {
          toggle.addEventListener('change', (e) => {
            darkMode = e.target.checked;
            if (darkMode) body.classList.add('dark'); else body.classList.remove('dark');
            localStorage.setItem(STORAGE_KEY, darkMode ? 'dark' : 'light');
          });
        }
      }

      // mark active nav & icons
      const navs = ['home','learn','progress','settings'];
      navs.forEach(id => {
        const el = document.getElementById(`nav${id.charAt(0).toUpperCase()+id.slice(1)}`);
        if (el) {
          if (screen === id) el.classList.add('active'); else el.classList.remove('active');
        }
      });
      if (!navs.includes(screen)) { // onboarding or profile
        document.querySelectorAll('.nav-item').forEach(i=> i.classList.remove('active'));
      }
      updateNavIcons(screen);
    }

    // navigation
    function navigateTo(screen) {
      if (screen === 'profile') screen = 'settings'; // profile icon opens settings screen
      currentScreen = screen;
      renderScreen(screen);
    }

    // modal
    function openModal(type) {
      document.getElementById('modalOverlay').classList.remove('hidden');
      document.getElementById(type+'Modal').classList.remove('hidden');
    }
    function closeAllModals() {
      document.getElementById('modalOverlay').classList.add('hidden');
      document.getElementById('privacyModal').classList.add('hidden');
      document.getElementById('termsModal').classList.add('hidden');
    }

    // bottom nav listeners
    document.getElementById('navHome').addEventListener('click', ()=> navigateTo('home'));
    document.getElementById('navLearn').addEventListener('click', ()=> navigateTo('learn'));
    document.getElementById('navProgress').addEventListener('click', ()=> navigateTo('progress'));
    document.getElementById('navSettings').addEventListener('click', ()=> navigateTo('settings'));
    document.getElementById('profileBtn').addEventListener('click', ()=> navigateTo('settings'));

    // modals close
    document.getElementById('closePrivacy').addEventListener('click', closeAllModals);
    document.getElementById('closeTerms').addEventListener('click', closeAllModals);
    document.getElementById('modalOverlay').addEventListener('click', closeAllModals);

    // initial render
    renderScreen('onboarding');

    // screenshot feature (shift+W)
    let screenshotCounter = 1;
    document.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key === 'W') {
        e.preventDefault();
        const phone = document.getElementById('phoneContainer');
        html2canvas?.(phone, { scale: 2 }).then(canvas => {
          const link = document.createElement('a');
          const isDark = body.classList.contains('dark');
          const filename = isDark ? '6.png' : (screenshotCounter++ + '.png');
          if (screenshotCounter > 5) screenshotCounter = 1;
          link.download = filename;
          link.href = canvas.toDataURL('image/png');
          link.click();
        }).catch(() => alert('html2canvas not loaded — use CDN?'));
      }
    });

    // dummy html2canvas fallback (we include from CDN)
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    document.head.appendChild(script);
  })();
</script>
