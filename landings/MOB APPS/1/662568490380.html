```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Brain Trainer · 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1e2b;
        }
        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --border: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --grey-light: #94A3B8;
            --grey-icon: #94A3B8;
            --nav-inactive: #94A3B8;
            --nav-bg: #FFFFFF;
            --header-icon: #334155;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            --progress-bg: #E2E8F0;
            --badge-bg: #DBEAFE;
            --badge-text: #1E40AF;
        }
        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --border: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --grey-light: #64748B;
            --grey-icon: #94A3B8;
            --nav-inactive: #64748B;
            --nav-bg: #1E293B;
            --header-icon: #CBD5E1;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.7);
            --progress-bg: #334155;
            --badge-bg: #1E3A8A;
            --badge-text: #BFDBFE;
        }
        .phone-mock {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            position: relative;
            display: flex;
            flex-direction: column;
            border: 2px solid #2d3a4b;
        }
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            transition: background 0.2s;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--grey-light) transparent;
        }
        .app-screen::-webkit-scrollbar {
            width: 4px;
        }
        .app-screen::-webkit-scrollbar-thumb {
            background: var(--grey-light);
            border-radius: 20px;
        }
        /* header */
        .header {
            padding: 12px 16px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }
        .header h1 {
            font-size: 22px;
            font-weight: 620;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--header-icon);
        }
        .profile-btn svg {
            width: 26px;
            height: 26px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        /* main content */
        .content {
            flex: 1;
            padding: 16px 16px 12px;
        }
        /* bottom nav */
        .bottom-nav {
            background: var(--nav-bg);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 6px 8px 8px;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.02);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 0 2px;
            border-radius: 18px;
            transition: transform 0.12s ease, background 0.15s;
            color: var(--nav-inactive);
            fill: none;
            stroke: currentColor;
        }
        .nav-item.active {
            color: var(--primary);
            transform: scale(1.05);
            background: rgba(37, 99, 235, 0.08);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            margin-bottom: 2px;
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            color: currentColor;
        }
        /* cards & elements */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .flex-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .badge {
            background: var(--badge-bg);
            color: var(--badge-text);
            font-weight: 600;
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 40px;
        }
        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 20px;
            margin: 10px 0 6px;
        }
        .progress-fill {
            width: 0%;
            height: 8px;
            background: var(--primary);
            border-radius: 20px;
            transition: width 0.4s ease;
        }
        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 20px;
            border-radius: 60px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(37,99,235,0.2);
            transition: background 0.15s;
        }
        .btn-primary:active { background: var(--primary-dark); }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 16px 0 6px;
        }
        .link-btn {
            background: none;
            border: none;
            color: var(--grey-light);
            font-size: 12px;
            text-decoration: underline;
            cursor: pointer;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: var(--card);
            padding: 24px;
            border-radius: 32px;
            width: 280px;
            color: var(--text);
            border: 1px solid var(--border);
            text-align: center;
        }
        .close-modal {
            margin-top: 18px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        .icon-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 12px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
        }
        .grey-icon { color: var(--grey-icon); }
        .hidden { display: none; }
        .welcome-logo svg { width: 48px; height: 48px; stroke: var(--primary); stroke-width: 2; fill: none; margin-bottom: 8px; }
        .app-name { font-size: 28px; font-weight: 700; color: var(--text); }
        .tagline { font-size: 16px; color: var(--primary); font-weight: 500; margin: 4px 0 8px; }
    </style>
</head>
<body>
<div class="phone-mock" id="phoneContainer">
    <!-- dynamic screen -->
    <div id="appScreen" class="app-screen"></div>
    <!-- bottom nav -->
    <nav class="bottom-nav" id="bottomNav">
        <button class="nav-item" data-screen="home"><svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" /></svg><span class="nav-label">Home</span></button>
        <button class="nav-item" data-screen="learn"><svg viewBox="0 0 24 24"><path d="M12 4L20 9V18H4V9L12 4Z M8 12L16 12 M8 16L14 16"/><circle cx="12" cy="12" r="2"/></svg><span class="nav-label">Learn</span></button>
        <button class="nav-item" data-screen="progress"><svg viewBox="0 0 24 24"><path d="M21 12V20H3V12 M7 16V20 M12 16V20 M17 16V20 M6 10L12 5L18 10V12H6V10Z"/><circle cx="12" cy="12" r="1.5"/></svg><span class="nav-label">Progress</span></button>
        <button class="nav-item" data-screen="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 7.34C19.8 8.1 20 8.98 20 10H22C22 8.48 21.6 7.04 20.9 5.78L19.4 7.34ZM4.6 7.34L3.1 5.78C2.4 7.04 2 8.48 2 10H4C4 8.98 4.2 8.1 4.6 7.34ZM12 22C14.1 22 15.9 20.9 16.9 19.2L15.2 18.2C14.5 19.3 13.3 20 12 20S9.5 19.3 8.8 18.2L7.1 19.2C8.1 20.9 9.9 22 12 22ZM12 2C9.9 2 8.1 3.1 7.1 4.8L8.8 5.8C9.5 4.7 10.7 4 12 4S14.5 4.7 15.2 5.8L16.9 4.8C15.9 3.1 14.1 2 12 2Z"/></svg><span class="nav-label">Settings</span></button>
    </nav>
</div>
<script>
(function() {
    const container = document.getElementById('appScreen');
    const navItems = document.querySelectorAll('.nav-item');
    let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
    let darkMode = false;

    // ---------- SVG ICONS (reusable) ----------
    const icons = {
        logo: '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14L12 10L16 14"/><path d="M8 8L8 14 M16 8L16 14"/></svg>',
        profile: '<svg viewBox="0 0 24 24"><path d="M20 21V19C20 16.8 18.2 15 16 15H8C5.8 15 4 16.8 4 19V21"/><circle cx="12" cy="8" r="4"/></svg>',
        home: '<svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z" /></svg>',
        learn: '<svg viewBox="0 0 24 24"><path d="M12 4L20 9V18H4V9L12 4Z M8 12L16 12 M8 16L14 16"/><circle cx="12" cy="12" r="2"/></svg>',
        progress: '<svg viewBox="0 0 24 24"><path d="M21 12V20H3V12 M7 16V20 M12 16V20 M17 16V20 M6 10L12 5L18 10V12H6V10Z"/><circle cx="12" cy="12" r="1.5"/></svg>',
        settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 7.34C19.8 8.1 20 8.98 20 10H22C22 8.48 21.6 7.04 20.9 5.78L19.4 7.34ZM4.6 7.34L3.1 5.78C2.4 7.04 2 8.48 2 10H4C4 8.98 4.2 8.1 4.6 7.34ZM12 22C14.1 22 15.9 20.9 16.9 19.2L15.2 18.2C14.5 19.3 13.3 20 12 20S9.5 19.3 8.8 18.2L7.1 19.2C8.1 20.9 9.9 22 12 22ZM12 2C9.9 2 8.1 3.1 7.1 4.8L8.8 5.8C9.5 4.7 10.7 4 12 4S14.5 4.7 15.2 5.8L16.9 4.8C15.9 3.1 14.1 2 12 2Z"/></svg>',
        lesson: '<svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="14" rx="2"/><path d="M8 10H16 M8 14H14"/></svg>',
        chart: '<svg viewBox="0 0 24 24"><path d="M21 20H3V4M7 16V12 M12 16V8 M17 16V14"/></svg>',
        flashcards: '<svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9 8H15 M9 12H13"/></svg>',
        play: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16" fill="currentColor"/></svg>',
        check: '<svg viewBox="0 0 24 24"><path d="M20 6L9 17L4 12"/></svg>',
    };

    // modal state
    let modalContent = { show: false, title: '', body: '' };

    // ----- helper to render active screen with header -----
    function renderScreen() {
        let headerTitle = '';
        if (currentScreen === 'onboarding') headerTitle = 'Welcome';
        else if (currentScreen === 'home') headerTitle = 'Home';
        else if (currentScreen === 'learn') headerTitle = 'Daily workout';
        else if (currentScreen === 'progress') headerTitle = 'Stats';
        else if (currentScreen === 'settings') headerTitle = 'Settings';

        const headerHtml = `
            <div class="header">
                <h1>${headerTitle}</h1>
                <button class="profile-btn" id="profileHeaderBtn">${icons.profile}</button>
            </div>
        `;

        let contentHtml = '';
        if (currentScreen === 'onboarding') contentHtml = renderOnboarding();
        else if (currentScreen === 'home') contentHtml = renderHome();
        else if (currentScreen === 'learn') contentHtml = renderLearn();
        else if (currentScreen === 'progress') contentHtml = renderProgress();
        else if (currentScreen === 'settings') contentHtml = renderSettings();

        container.innerHTML = headerHtml + `<div class="content">${contentHtml}</div>` + (modalContent.show ? modalHtml() : '');

        // Attach profile listener
        document.getElementById('profileHeaderBtn')?.addEventListener('click', () => {
            currentScreen = 'settings';
            updateActiveNav('settings');
            renderScreen();
        });

        // attach modal close
        if (modalContent.show) {
            document.getElementById('closeModalBtn')?.addEventListener('click', () => {
                modalContent.show = false;
                renderScreen();
            });
        }

        // onboarding links
        if (currentScreen === 'onboarding') {
            document.getElementById('privacyLink')?.addEventListener('click', (e) => {
                e.preventDefault();
                modalContent = { show: true, title: 'Privacy Policy', body: 'Your data stays on device. We do not collect personal info.' };
                renderScreen();
            });
            document.getElementById('termsLink')?.addEventListener('click', (e) => {
                e.preventDefault();
                modalContent = { show: true, title: 'Terms of Service', body: 'Free to use for math practice. No warranties.' };
                renderScreen();
            });
            document.getElementById('getStartedBtn')?.addEventListener('click', () => {
                currentScreen = 'home';
                updateActiveNav('home');
                renderScreen();
            });
        }

        // theme toggle
        if (currentScreen === 'settings') {
            document.getElementById('themeToggle')?.addEventListener('click', () => {
                darkMode = !darkMode;
                document.body.classList.toggle('dark', darkMode);
                renderScreen();
            });
        }

        // nav highlight update
        if (currentScreen !== 'onboarding') {
            navItems.forEach(btn => {
                const screen = btn.dataset.screen;
                btn.classList.toggle('active', screen === currentScreen);
            });
        } else {
            navItems.forEach(btn => btn.classList.remove('active'));
        }

        // progress bar fill demo
        if (currentScreen === 'progress') {
            document.querySelectorAll('.progress-fill').forEach(el => { el.style.width = '65%'; });
        }
        if (currentScreen === 'learn') {
            document.querySelector('#startPracticeBtn')?.addEventListener('click', ()=>{
                alert('🚀 Starting a brain warmup!');
            });
        }
    }

    function renderOnboarding() {
        return `
            <div class="card" style="text-align: center; padding: 32px 20px;">
                <div class="welcome-logo" style="color:var(--primary);">${icons.logo}</div>
                <div class="app-name">Math Brain</div>
                <div class="tagline">trainer · 2026</div>
                <p style="margin: 16px 0; color:var(--text-light);">Quick mental arithmetic & logic games. Daily 5‑min workouts sharpen your mind.</p>
                <button class="btn-primary" id="getStartedBtn" style="width:100%;">Get Started</button>
                <div class="link-row">
                    <button class="link-btn" id="privacyLink">Privacy Policy</button>
                    <button class="link-btn" id="termsLink">Terms of Service</button>
                </div>
            </div>
        `;
    }

    function renderHome() {
        return `
            <div class="card">
                <div class="flex-row"><span class="badge">⚡ today's streak 7</span>${icons.flashcards}</div>
                <h3 style="margin:10px 0 4px;">Daily practice</h3>
                <div class="progress-bar"><div class="progress-fill" style="width:40%"></div></div>
                <div class="stat-row"><span>2/5 lessons</span><span>+40 pts</span></div>
            </div>
            <div class="card flex-row" style="justify-content:space-between;">
                <div><strong>🔥 1420</strong> <span style="color:var(--grey-light);">total XP</span></div>
                <div><strong>🏅 4</strong> badges</div>
                <div>${icons.chart}</div>
            </div>
            <div class="card">
                <h4>Recommended for you</h4>
                <div class="flex-row" style="margin-top:12px;"><span>${icons.lesson} Mental math · 5 min</span> <span class="badge">new</span></div>
                <div class="flex-row" style="margin-top:12px;"><span>${icons.flashcards} Multiplication</span> <span class="badge">80%</span></div>
                <div class="flex-row"><span>${icons.play} Quick logic</span></div>
            </div>
        `;
    }

    function renderLearn() {
        return `
            <div class="card" style="background: linear-gradient(145deg, var(--primary), var(--accent)); color:white;">
                <h3>Brain warmup</h3>
                <p>5 quick puzzles · 2 min</p>
                <button class="btn-primary" id="startPracticeBtn" style="background:white; color:var(--primary); margin-top:8px;">start</button>
            </div>
            <div class="card">
                <h4>Lessons</h4>
                <div class="flex-row"><span>${icons.lesson} Addition (intermediate)</span> <span class="badge">75%</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div>
                <div class="flex-row"><span>${icons.lesson} Multiplication tables</span> <span class="badge">40%</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width:40%"></div></div>
                <div class="flex-row"><span>${icons.flashcards} Mental math</span> <span class="badge">new</span></div>
            </div>
        `;
    }

    function renderProgress() {
        return `
            <div class="card">
                <div class="flex-row" style="justify-content:space-between;"><span>📊 Weekly activity</span> <span>+230 XP</span></div>
                <div style="height:60px; display:flex; gap:6px; align-items:flex-end; margin:16px 0;">
                    <div style="width:20%; background:var(--primary); height:28px; border-radius:8px;"></div>
                    <div style="width:20%; background:var(--primary); height:44px; border-radius:8px;"></div>
                    <div style="width:20%; background:var(--primary); height:56px; border-radius:8px;"></div>
                    <div style="width:20%; background:var(--accent); height:38px; border-radius:8px;"></div>
                    <div style="width:20%; background:var(--primary); height:20px; border-radius:8px;"></div>
                </div>
                <div class="stat-row"><span>Best streak: 12 days</span><span>🏆</span></div>
            </div>
            <div class="card">
                <h4>Achievements</h4>
                <div class="icon-grid">
                    <span>⚡ speed demon</span> <span>🧠 50 puzzles</span> <span>🔥 7 day streak</span>
                </div>
                <div style="margin-top:16px;"><strong>Accuracy</strong> <span style="float:right;">87%</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width:87%"></div></div>
            </div>
        `;
    }

    function renderSettings() {
        return `
            <div class="card">
                <div class="flex-row"><span>${icons.profile} Profile</span> <span>Alex M.</span></div>
                <div style="margin:18px 0;"><strong>Theme</strong> <button class="btn-primary" id="themeToggle" style="padding:8px 18px; margin-left:16px;">${darkMode?'Light':'Dark'} mode</button></div>
                <div><strong>Daily reminder</strong> <span>on</span></div>
                <div style="margin-top:16px;"><span>${icons.check} sound effects</span></div>
            </div>
            <div class="card">
                <p style="color:var(--grey-light);">App version 2026.1 · Math Brain Trainer</p>
            </div>
        `;
    }

    function modalHtml() {
        return `
            <div class="modal-overlay">
                <div class="modal-card">
                    <h3>${modalContent.title}</h3>
                    <p style="margin:16px 0;">${modalContent.body}</p>
                    <button class="close-modal" id="closeModalBtn">Close</button>
                </div>
            </div>
        `;
    }

    function updateActiveNav(screen) {
        navItems.forEach(btn => {
            btn.classList.toggle('active', btn.dataset.screen === screen);
        });
    }

    // navigation clicks
    navItems.forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.preventDefault();
            const screen = btn.dataset.screen;
            currentScreen = screen;
            if (modalContent.show) modalContent.show = false;
            renderScreen();
        });
    });

    // ----- screenshot feature (shift+W) -----
    let screenshotCounter = 1;
    window.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.key === 'W') {
            e.preventDefault();
            const phone = document.getElementById('phoneContainer');
            if (!phone) return;
            import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(() => {
                html2canvas(phone, { scale: 2, backgroundColor: null }).then(canvas => {
                    const link = document.createElement('a');
                    const isDark = document.body.classList.contains('dark');
                    let fname = isDark ? '6.png' : (screenshotCounter + '.png');
                    if (!isDark && screenshotCounter <=5) fname = screenshotCounter + '.png';
                    else if (!isDark && screenshotCounter>5) fname = '1.png';
                    link.download = fname;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    if (!isDark) { screenshotCounter = (screenshotCounter % 5) + 1; }
                });
            }).catch(() => alert('html2canvas not loaded, but shift+W works.'));
        }
    });

    // initial render
    renderScreen();
