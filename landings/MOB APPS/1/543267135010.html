```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeMentor · Python</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive-icon: #94A3B8;
            --nav-bg: #FFFFFF;
            --progress-bg: #E2E8F0;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive-icon: #64748B;
            --nav-bg: #1E293B;
            --progress-bg: #334155;
            --shadow: 0 10px 25px -5px #00000030;
        }

        body {
            background: #1a1f2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 0 6px #2d3748;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
        }

        /* screen wrapper */
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--border-light);
            padding: 16px 16px 8px 16px;
        }
        .screen::-webkit-scrollbar { width: 4px; }
        .screen::-webkit-scrollbar-track { background: var(--border-light); border-radius: 8px; }
        .screen::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 8px; }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        .header h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-icon {
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
            transition: background 0.2s;
        }
        .profile-icon:hover { background: var(--border-light); }

        /* bottom nav */
        .bottom-nav {
            background: var(--nav-bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px;
            border-top: 1px solid var(--border-light);
            flex-shrink: 0;
            backdrop-filter: blur(4px);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 20px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: transparent;
            border: none;
        }
        .nav-item.active {
            background: rgba(37, 99, 235, 0.12);
            transform: scale(1.02);
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            color: var(--inactive-icon);
        }
        .nav-item.active span { color: var(--primary); font-weight: 600; }
        .nav-icon { width: 24px; height: 24px; transition: all 0.2s; }
        .nav-item.active .nav-icon { transform: scale(1.1); }
        .nav-icon svg { width: 24px; height: 24px; display: block; }

        /* cards, buttons etc */
        .btn-primary {
            background: var(--primary);
            color: white;
            font-weight: 600;
            padding: 14px 24px;
            border-radius: 60px;
            border: none;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 0 var(--primary-dark);
        }
        .btn-primary:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--primary-dark); }

        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 16px;
            font-size: 13px;
            color: var(--primary);
        }
        .link-row span { cursor: pointer; text-decoration: underline; }

        .modal-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.6);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; backdrop-filter: blur(3px);
        }
        .modal-card {
            background: var(--card); width: 280px; padding: 24px;
            border-radius: 32px; box-shadow: var(--shadow); color: var(--text-primary);
        }
        .modal-card h3 { margin-bottom: 12px; }
        .modal-close {
            margin-top: 20px; background: var(--primary); color: white;
            border: none; padding: 8px 16px; border-radius: 40px; float: right;
        }

        /* cards */
        .stat-grid, .lesson-list { display: flex; flex-direction: column; gap: 12px; margin: 16px 0; }
        .stat-card {
            background: var(--card); border-radius: 24px; padding: 16px;
            box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px;
        }
        .badge {
            background: var(--accent); color: #0F172A; border-radius: 40px; padding: 4px 12px;
            font-size: 13px; font-weight: 600; width: fit-content;
        }
        .progress-bar {
            height: 8px; background: var(--progress-bg); border-radius: 20px; overflow: hidden;
        }
        .progress-fill {
            height: 8px; background: var(--primary); width: 0%; border-radius: 20px;
            transition: width 0.4s ease;
        }
        .chart-simple {
            display: flex; align-items: flex-end; gap: 8px; height: 60px; margin: 16px 0;
        }
        .chart-bar {
            width: 24px; background: var(--primary); border-radius: 12px 12px 4px 4px;
            height: calc(70% * var(--h)); animation: barUp 0.6s ease;
        }
        @keyframes barUp { from { height: 4px; } to { height: calc(70% * var(--h)); } }

        .lesson-item {
            background: var(--card); border-radius: 20px; padding: 16px;
            display: flex; align-items: center; gap: 16px; box-shadow: var(--shadow);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic screens will be injected by js -->
    <div id="appView"></div>
    <!-- bottom navigation (fixed) -->
    <nav class="bottom-nav" id="bottomNav">
        <div class="nav-item" data-screen="home"><span class="nav-icon" id="icon-home"></span><span>Home</span></div>
        <div class="nav-item" data-screen="learn"><span class="nav-icon" id="icon-learn"></span><span>Learn</span></div>
        <div class="nav-item" data-screen="progress"><span class="nav-icon" id="icon-progress"></span><span>Progress</span></div>
        <div class="nav-item" data-screen="settings"><span class="nav-icon" id="icon-settings"></span><span>Settings</span></div>
    </nav>
</div>

<script>
    (function() {
        // ---------- THEME & UTILS ----------
        let currentScreen = 'onboarding'; // default start
        let darkMode = false;
        let screenshotCounter = 1;
        const container = document.getElementById('phoneContainer');
        const appView = document.getElementById('appView');
        const navItems = document.querySelectorAll('.nav-item');

        // ---------- SVG ICON SYSTEM (inline) ----------
        const icons = {
            home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 L12 3 L21 10 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 Z"/></svg>`,
            learn: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 7 L12 2 L22 7 L12 12 L2 7 Z M2 17 L12 22 L22 17 M2 12 L12 17 L22 12"/></svg>`,
            progress: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7 L12 12 L15 15"/></svg>`,
            settings: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.03.03A10 10 0 0 0 12 17.66a10 10 0 0 0 6.37-2.63z"/></svg>`,
            profile: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
            lesson: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M8 10 L16 10 M8 14 L12 14"/></svg>`,
            chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16 L21 20 M12 12 L12 20 M3 8 L3 20 M3 20 L21 20"/></svg>`,
            flashcards: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9 8 L15 8 M9 12 L15 12 M9 16 L13 16"/></svg>`,
            play: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>`,
            check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>`
        };

        function renderIcon(name, color = 'currentColor') {
            return icons[name] ? icons[name].replace(/currentColor/g, color) : '';
        }

        function setNavIcons() {
            const activeColor = '#2563EB'; const inactive = '#94A3B8';
            if (darkMode) { /* keep same, dark mode uses var but icons inherit */ }
            document.getElementById('icon-home').innerHTML = renderIcon('home', currentScreen==='home'? activeColor : inactive);
            document.getElementById('icon-learn').innerHTML = renderIcon('learn', currentScreen==='learn'? activeColor : inactive);
            document.getElementById('icon-progress').innerHTML = renderIcon('progress', currentScreen==='progress'? activeColor : inactive);
            document.getElementById('icon-settings').innerHTML = renderIcon('settings', currentScreen==='settings'? activeColor : inactive);
        }

        // ----- Modal helper -----
        function showModal(title, text) {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `<div class="modal-card"><h3>${title}</h3><p style="margin:12px 0;">${text}</p><button class="modal-close" id="modalCloseBtn">Got it</button></div>`;
            container.appendChild(overlay);
            document.getElementById('modalCloseBtn').onclick = () => overlay.remove();
        }

        // ----- RENDER SCREEN -----
        function renderScreen(screen) {
            currentScreen = screen;
            let html = '';
            const headerTitle = screen === 'onboarding' ? '✨ Onboarding' : 
                                screen === 'home' ? 'Dashboard' : 
                                screen === 'learn' ? 'Python practice' : 
                                screen === 'progress' ? 'Your stats' : 'Settings';
            const profileIconHtml = `<div class="profile-icon" id="profileBtn">${icons.profile}</div>`;

            if (screen === 'onboarding') {
                html = `
                    <div class="screen">
                        <div class="header"><h2>CodeMentor</h2>${profileIconHtml}</div>
                        <div style="display:flex; flex-direction:column; gap:20px; align-items:center; text-align:center;">
                            <div style="background:var(--primary); width:80px; height:80px; border-radius:30px; display:flex; align-items:center; justify-content:center; margin-top:30px;">
                                <span style="color:white; font-size:44px;">🐍</span>
                            </div>
                            <h1 style="font-size:32px; color:var(--text-primary);">Python Playground</h1>
                            <p style="color:var(--text-secondary); font-size:16px;">learn by doing • bite-sized</p>
                            <p style="color:var(--text-secondary);">Write real Python snippets, get instant feedback, and unlock achievements.</p>
                            <button class="btn-primary" id="getStartedBtn">Get Started</button>
                            <div class="link-row"><span id="privacyLink">Privacy Policy</span><span id="termsLink">Terms of Service</span></div>
                        </div>
                    </div>
                `;
            } else if (screen === 'home') {
                html = `
                    <div class="screen">
                        <div class="header"><h2>🏠 Home</h2>${profileIconHtml}</div>
                        <div class="badge">🔥 7 day streak</div>
                        <div class="stat-grid">
                            <div class="stat-card"><span>${icons.flashcards}</span><div><strong>3 lessons left</strong><p>today's goal</p></div></div>
                            <div class="stat-card"><span>${icons.chart}</span><div><strong>84%</strong><p>weekly avg</p></div></div>
                        </div>
                        <h3 style="color:var(--text-primary);">continue</h3>
                        <div class="lesson-item" id="openLearnLesson"><span>${icons.play}</span><div><strong>Variables 101</strong><p>5 min</p></div></div>
                        <div class="lesson-item" id="openLearnLesson2"><span>${icons.lesson}</span><div><strong>Lists & loops</strong><p>12 min</p></div></div>
                    </div>
                `;
            } else if (screen === 'learn') {
                html = `
                    <div class="screen">
                        <div class="header"><h2>📘 Learn</h2>${profileIconHtml}</div>
                        <div style="background:var(--card); border-radius:24px; padding:16px; margin-bottom:12px;">
                            <h4>Python basics</h4><div class="progress-bar"><div class="progress-fill" style="width:48%"></div></div>
                        </div>
                        <div class="lesson-list">
                            <div class="lesson-item"><span>${icons.flashcards}</span><div><strong>#1 Hello world</strong><span>  started</span></div></div>
                            <div class="lesson-item"><span>${icons.flashcards}</span><div><strong>#2 Data types</strong></div></div>
                            <div class="lesson-item"><span>${icons.play}</span><div><strong>#3 Conditionals</strong></div></div>
                        </div>
                    </div>
                `;
            } else if (screen === 'progress') {
                html = `
                    <div class="screen">
                        <div class="header"><h2>📊 Progress</h2>${profileIconHtml}</div>
                        <div class="stat-card"><span>${icons.chart}</span> <div><strong>48 lessons completed</strong></div></div>
                        <div class="chart-simple"><div class="chart-bar" style="--h:0.6"></div><div class="chart-bar" style="--h:0.9"></div><div class="chart-bar" style="--h:0.4"></div><div class="chart-bar" style="--h:0.7"></div></div>
                        <div class="badge">🏅 python新手</div>
                    </div>
                `;
            } else if (screen === 'settings') {
                html = `
                    <div class="screen">
                        <div class="header"><h2>⚙️ Settings</h2>${profileIconHtml}</div>
                        <div class="stat-card" style="justify-content: space-between;" id="themeToggleCard">
                            <span>Dark mode</span>
                            <div style="width:44px; height:24px; background:var(--primary); border-radius:40px; position:relative; transition:0.2s;" id="themeSlider">
                                <div style="width:18px; height:18px; background:white; border-radius:50%; position:absolute; top:3px; left:${darkMode?'22':'3'}px;"></div>
                            </div>
                        </div>
                        <p style="margin-top:24px; color:var(--text-secondary);">Profile info · notifications</p>
                    </div>
                `;
            }

            appView.innerHTML = html;
            setNavIcons();
            document.querySelectorAll('.nav-item').forEach(el => {
                if (el.dataset.screen === screen) el.classList.add('active');
                else el.classList.remove('active');
            });

            // attach listeners
            if (screen === 'onboarding') {
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{ renderScreen('home'); });
                document.getElementById('privacyLink')?.addEventListener('click', ()=>showModal('Privacy Policy','We respect your data. No sharing.'));
                document.getElementById('termsLink')?.addEventListener('click', ()=>showModal('Terms of Service','Educational use only.'));
            }
            if (screen === 'home') {
                document.getElementById('openLearnLesson')?.addEventListener('click', ()=>renderScreen('learn'));
                document.getElementById('openLearnLesson2')?.addEventListener('click', ()=>renderScreen('learn'));
            }
            if (screen === 'settings') {
                const slider = document.getElementById('themeToggleCard');
                if (slider) slider.addEventListener('click', (e) => {
                    darkMode = !darkMode;
                    document.body.classList.toggle('dark', darkMode);
                    renderScreen('settings');
                });
            }
            // profile btn leads to settings
            document.getElementById('profileBtn')?.addEventListener('click', ()=>{ renderScreen('settings'); });
        }

        // ----- bottom navigation -----
        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                const targetScreen = item.dataset.screen;
                if (targetScreen) renderScreen(targetScreen);
            });
        });

        // ----- screenshot (SHIFT + W) -----
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm').then((mod) => {
                    mod.default(phone).then(canvas => {
                        const link = document.createElement('a');
                        const modeSuffix = darkMode ? '6' : screenshotCounter.toString();
                        link.download = `${modeSuffix}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        if (!darkMode && screenshotCounter < 5) screenshotCounter++;
                    });
                }).catch(() => alert('html2canvas failed, but shift+W works'));
            }
        });

        // initial render
        renderScreen('onboarding');
        setNavIcons();
    })();
</script>
<!-- hidden html2canvas cdn fallback, but we use dynamic import -->
<!-- All done! -->
</body>
</html>
All done!
