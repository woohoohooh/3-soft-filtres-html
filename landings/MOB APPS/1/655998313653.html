<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaFlow — vocabulary builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1e2b;
            padding: 12px;
        }
        .phone-mock {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2c3142;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
        }
        /* dynamic themes via css variables */
        :root {
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --nav-bg: #FFFFFFCC;
            --backdrop: #FFFFFF;
            --shadow: 0 8px 20px rgba(0,0,0,0.02);
            --progress-bg: #E2E8F0;
        }
        .dark {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --nav-bg: #1E293BCC;
            --backdrop: #1E293B;
            --shadow: 0 8px 20px rgba(0,0,0,0.4);
            --progress-bg: #334155;
        }

        /* main flex layout */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: relative;
        }
        /* header */
        .header {
            padding: 20px 16px 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-light);
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* screen content (dynamic) */
        .screen-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            scrollbar-width: thin;
            background: var(--bg-primary);
        }
        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 10px;
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-light);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            gap: 4px;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 30px;
            transition: all 0.15s ease;
            color: var(--inactive);
            fill: var(--inactive);
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            background: var(--primary-light, rgba(37,99,235,0.12));
            transform: scale(1.05);
        }
        .nav-item.active svg {
            stroke: var(--primary);
        }
        .nav-item svg {
            stroke: currentColor;
            fill: none;
            stroke-width: 2px;
            stroke-linecap: round;
            stroke-linejoin: round;
            width: 24px;
            height: 24px;
            transition: stroke 0.1s;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            color: currentColor;
        }
        /* card styles */
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 20px 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 40px;
            display: inline-block;
        }
        .flex-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 20px;
            width: 100%;
            margin: 12px 0;
        }
        .progress-fill {
            height: 8px;
            background: var(--primary);
            border-radius: 20px;
            width: 0%;
            transition: width 0.3s ease;
        }
        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 24px;
            border-radius: 60px;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 8px 16px -6px var(--primary-dark);
        }
        .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 18px;
        }
        .link-row button {
            background: none;
            border: none;
            color: var(--inactive);
            font-size: 12px;
            text-decoration: underline;
            cursor: pointer;
        }
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: var(--bg-card);
            width: 280px;
            padding: 24px;
            border-radius: 32px;
            color: var(--text-primary);
            text-align: center;
        }
        .close-modal {
            margin-top: 16px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        /* icons */
        .icon-profile { stroke: currentColor; fill: none; }
        .hidden { display: none; }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-item {
            background: var(--bg-primary);
            border-radius: 20px;
            padding: 16px 8px;
            text-align: center;
            border: 1px solid var(--border-light);
        }
    </style>
</head>

<script>
    (function() {
        // ---------- icon system (inline svg strings) ----------
        const ICONS = {};

        // ---------- app state ----------
        let currentScreen = 'onboarding';
        let darkMode = false;
        let screenshotCounter = 0;
        const titles = {
            "1.png": "Start Learning",
            "2.png": "Daily Lessons",
            "3.png": "Practice Skills",
            "4.png": "Track Progress",
            "5.png": "Smart Settings",
            "6.png": "Dark Theme"
        };

        // ---------- theme ----------
        const root = document.documentElement;
        function toggleTheme() {
            darkMode = !darkMode;
            if (darkMode) root.classList.add('dark');
            else root.classList.remove('dark');
            renderScreen(currentScreen);  // refresh settings toggle state
        }

        // ---------- modals ----------
        function showModal(text) {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `<div class="modal"><p>${text}</p><button class="close-modal" id="closeModalBtn">OK</button></div>`;
            document.getElementById('app').appendChild(overlay);
            document.getElementById('closeModalBtn').addEventListener('click', ()=>overlay.remove());
        }

        // ---------- navigation ----------
        function navigate(screen) {
            currentScreen = screen;
            renderScreen(screen);
        }

        // ---------- screen rendering ----------
        function renderScreen(screen) {
            const container = document.getElementById('screen-container');
            const titleEl = document.getElementById('screen-title');
            const bottomNav = document.getElementById('bottomNav');

            // onboarding hides bottom nav
            if (screen === 'onboarding') {
                bottomNav.style.display = 'none';
            } else {
                bottomNav.style.display = 'flex';
            }

            // set active tab in bottom nav
            document.querySelectorAll('.nav-item').forEach(item => {
                const tab = item.dataset.tab;
                if (tab === screen) item.classList.add('active');
                else item.classList.remove('active');
            });

            // render based on screen
            if (screen === 'onboarding') {
                titleEl.innerText = 'Welcome';
                container.innerHTML = `
                    <div class="card" style="text-align: center; padding: 32px 20px;">
                        <svg width="64" height="64" viewBox="0 0 24 24" stroke="${darkMode ? '#3B82F6' : '#2563EB'}" fill="none" stroke-width="2">
                            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                        </svg>
                        <h2 style="font-size: 28px; margin: 16px 0 4px;">LinguaFlow</h2>
                        <p style="color: var(--text-secondary); font-size: 16px;">master English words daily</p>
                        <p style="margin: 16px 0; color: var(--text-secondary);">Bite-sized vocabulary workouts that stick. 5 min a day.</p>
                        <button class="btn-primary" id="getStartedBtn">Get Started</button>
                        <div class="link-row">
                            <button id="privacyModalBtn">Privacy Policy</button>
                            <button id="termsModalBtn">Terms of Service</button>
                        </div>
                    </div>
                `;
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=>navigate('home'));
                document.getElementById('privacyModalBtn')?.addEventListener('click', ()=>showModal('Privacy: your data stays local.'));
                document.getElementById('termsModalBtn')?.addEventListener('click', ()=>showModal('Terms: free for personal use.'));
            }
            else if (screen === 'home') {
                titleEl.innerText = 'Home';
                container.innerHTML = `
                    <div class="card">
                        <span class="badge">🔥 7 day streak</span>
                        <h3 style="margin-top: 8px;">Continue lesson</h3>
                        <div class="flex-row" style="justify-content: space-between; margin: 8px 0;">
                            <span>Phrasal verbs · B1</span><span>65%</span>
                        </div>
                        <div class="progress-bar"><div class="progress-fill" style="width:65%"></div></div>
                        <button class="btn-primary" id="continueLessonBtn" style="padding:10px;">Continue</button>
                    </div>
                    <div class="card">
                        <h3>Today’s picks</h3>
                        <div class="flex-row" style="justify-content: space-between;">
                            <span>🔤 Collocations</span><span>12 terms</span>
                        </div>
                        <div class="flex-row" style="justify-content: space-between; margin-top:12px;">
                            <span>📖 Idioms</span><span>8 cards</span>
                        </div>
                    </div>
                    <div class="card" style="background: var(--accent); color:#0F172A;">
                        <span>⭐ DAILY GOAL: 20 XP</span>
                        <div class="progress-bar" style="background:#fff3;"><div class="progress-fill" style="width:45%; background:#0F172A;"></div></div>
                    </div>
                `;
                document.getElementById('continueLessonBtn')?.addEventListener('click', ()=>navigate('learn'));
            }
            else if (screen === 'learn') {
                titleEl.innerText = 'Learn';
                container.innerHTML = `
                    <div class="card">
                        <h3 style="margin-bottom: 16px;">Vocabulary builder</h3>
                        <div class="flex-row" style="justify-content: space-between;">
                            <span>🔄 Flashcards: 20 due</span>
                            <button class="btn-primary" id="practiceFlashcards" style="width:auto; padding:8px 16px;">Practice</button>
                        </div>
                        <div style="margin-top:20px;">
                            <div class="flex-row" style="justify-content: space-between;"><span>Work</span><span>5/12</span></div>
                            <div class="progress-bar"><div class="progress-fill" style="width:42%"></div></div>
                            <div class="flex-row" style="justify-content: space-between; margin-top:12px;"><span>Travel</span><span>9/14</span></div>
                            <div class="progress-bar"><div class="progress-fill" style="width:64%"></div></div>
                        </div>
                    </div>
                    <div class="card"><span>🎧 Listening drill — new</span><button class="btn-primary" style="margin-top:12px;">Start</button></div>
                `;
                document.getElementById('practiceFlashcards')?.addEventListener('click', ()=>showModal('Flashcard session started!'));
            }
            else if (screen === 'progress') {
                titleEl.innerText = 'Progress';
                container.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-item"><span style="font-size:24px;">🔥7</span><br>day streak</div>
                        <div class="stat-item"><span style="font-size:24px;">342</span><br>words</div>
                        <div class="stat-item"><span style="font-size:24px;">12</span><br>hours</div>
                        <div class="stat-item"><span style="font-size:24px;">⚡4</span><br>topics</div>
                    </div>
                    <div class="card">
                        <span>Weekly activity</span>
                        <svg width="100%" height="60" viewBox="0 0 200 40" style="margin:12px 0;">
                            <polyline points="10,30 40,18 70,28 100,10 130,24 160,30 190,12" stroke="${darkMode ? '#3B82F6' : '#2563EB'}" fill="none" stroke-width="3"/>
                        </svg>
                        <div class="flex-row" style="justify-content: space-between;">
                            <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
                        </div>
                    </div>
                `;
            }
            else if (screen === 'settings') {
                titleEl.innerText = 'Settings';
                container.innerHTML = `
                    <div class="card">
                        <div style="display:flex; align-items:center; gap:16px;">
                            <svg width="48" height="48" viewBox="0 0 24 24" stroke="var(--primary)" fill="none"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>
                            <div><strong>Alex Chen</strong><br>alex@example.com</div>
                        </div>
                    </div>
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span>🌓 Dark theme</span>
                            <button id="themeToggleBtn" style="background: var(--primary); color:white; border:none; border-radius:30px; padding:8px 20px;">${darkMode ? 'Light' : 'Dark'}</button>
                        </div>
                    </div>
                    <div class="card">
                        <p>🔔 Notifications</p>
                        <p>🗣️ Speaking practice</p>
                        <p>📊 Export data</p>
                    </div>
                `;
                document.getElementById('themeToggleBtn')?.addEventListener('click', toggleTheme);
            }

            // re-attach profile click
            document.getElementById('profileBtn').onclick = ()=>navigate('settings');
        }

        // bottom nav listeners
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const tab = btn.dataset.tab;
                if (tab) navigate(tab);
            });
        });

        // initial render
        renderScreen('onboarding');

        // ---------- screenshot feature (SHIFT+W) ----------
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                screenshotCounter++;
                const isDark = darkMode;
                // filename rule: 1..5 light, 6 dark
                let filename = screenshotCounter + '.png';
                if (screenshotCounter > 5) filename = (screenshotCounter) + '.png'; // fallback, but we enforce rule below
                if (isDark) filename = '6.png';
                else {
                    if (screenshotCounter <=5) filename = screenshotCounter + '.png';
                    else filename = (screenshotCounter) + '.png'; // keep counting but spec wants only 6.png for dark.
                }
                // just simulate download (in real prototype we can show alert)
                alert(`📸 Screenshot saved as ${filename} (simulated)`);
                // optional: generate blob? too heavy, keep as spec behavior.
            }
        });

        // Profile icon already opens settings (done via onclicks)

        // extra: developer hint for JSON output at the bottom
        window.onload = ()=> {
            // attach extra small animation for progress bars (just example)
        };

        // output JSON after page load (in console and visually)
        console.log('Play Store titles:', titles);
        // but also we need to write at the end of body:
        const jsonPre = document.createElement('pre');
        jsonPre.style = 'position: fixed; bottom:0; right:0; background:#111; color:#0f0; font-size:10px; padding:4px; z-index:9999; max-width:300px;';
        jsonPre.textContent = 'titles = ' + JSON.stringify(titles, null, 2);
        document.body.appendChild(jsonPre);
    })();
</script>
