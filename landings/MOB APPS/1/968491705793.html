            --text-light: #334155;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --border: #E2E8F0;
            --header-icon: #1E293B;

        }
        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --border: #334155;
            --header-icon: #F1F5F9;
            --shadow: 0 20px 30px -10px #020617;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 48px;
            box-shadow: var(--shadow), 0 0 0 10px #2d3a4b;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background 0.2s;
        }

        /* main screen area */
        .screen-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 18px 8px 18px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--card);
        }
        .screen-container::-webkit-scrollbar {
            width: 4px;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 8px;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px 0;

        .header h2 {
            font-size: 24px;

            letter-spacing: -0.5px;

        .profile-icon {

            margin-right: -8px;

            transition: background 0.2s;
        }
        .profile-icon:hover { background: rgba(37,99,235,0.1); }
        .profile-icon svg {
            width: 28px;
            height: 28px;
            stroke: var(--header-icon);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;

        /* bottom navigation */
        .bottom-nav {
            background: var(--card);

            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 10px 10px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);

            fill: none;
            stroke: var(--inactive);

            stroke: var(--primary);

            transform: scale(1.02);
        }
        .nav-item svg {

            height: 26px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;

            transform: scale(1.1);

        }
        .nav-label {
            font-size: 12px;

</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- header (dynamic but we rebuild on screen change) -->
    <div style="padding: 0 18px;" id="dynamicHeader"></div>

    <!-- main screen content -->
    <div class="screen-container" id="screenContainer"></div>

    <!-- bottom nav fixed -->
    <div class="bottom-nav" id="bottomNav"></div>
</div>

<!-- hidden sprite container for icons (will be filled by js) -->
<div style="display:none;" id="iconDefinitions"></div>

<script>
    (function() {
        // ---------- THEME & STATE ----------
        let currentTheme = 'light';         // light / dark
        let currentScreen = 'onboarding';   // onboarding, home, learn, progress, settings
        let modalOpen = false;

        // ---------- HELPER: apply theme ----------
        function applyTheme(theme) {
            const body = document.body;
            if (theme === 'dark') body.classList.add('dark');
            else body.classList.remove('dark');
            currentTheme = theme;
        }
        applyTheme('light');

        // ---------- CUSTOM SVG ICONS (outline, 2px, round caps) ----------
        const icons = {
            home: `<svg viewBox="0 0 24 24"><path d="M5 12H3L12 3L21 12H19" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/><path d="M5 12V19H9V14H15V19H19V12" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            learn: `<svg viewBox="0 0 24 24"><path d="M2 3H8C10.2091 3 12 4.79086 12 7V21C12 19.8954 11.1046 19 10 19H2V3Z" stroke="currentColor" fill="none" stroke-width="2"/><path d="M22 3H16C13.7909 3 12 4.79086 12 7V21C12 19.8954 12.8954 19 14 19H22V3Z" stroke="currentColor" fill="none" stroke-width="2"/></svg>`,
            progress: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none" stroke-width="2"/><path d="M12 7V12L15 15" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>`,
            settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5" stroke="currentColor" fill="none" stroke-width="2"/><path d="M19.4 15C18.9 16 18 16.7 16.9 17.1L15.5 15.5M4.6 9C5.1 8 6 7.3 7.1 6.9L8.5 8.5M8.5 15.5L7.1 17.1C6 16.7 5.1 15.9 4.6 15M15.5 8.5L16.9 6.9C18 7.3 18.9 8.1 19.4 9" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>`,
            profile: `<svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.5" stroke="currentColor" fill="none" stroke-width="2"/><path d="M5 20V19C5 15.1 8.1 12 12 12C15.9 12 19 15.1 19 19V20" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>`,
            lesson: `<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" fill="none" stroke-width="2"/><path d="M8 8H16M8 12H14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
            chart: `<svg viewBox="0 0 24 24"><path d="M21 21H3V3M7 15V17M12 11V17M17 7V17" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>`,
            flashcards: `<svg viewBox="0 0 24 24"><path d="M4 5H18C19.1 5 20 5.9 20 7V17C20 18.1 19.1 19 18 19H6C4.9 19 4 18.1 4 17V5Z" stroke="currentColor" fill="none" stroke-width="2"/><path d="M8 3V7M14 3V7" stroke="currentColor" stroke-width="2"/></svg>`,
            play: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke="currentColor" fill="none" stroke-width="2"/><path d="M10 9L16 12L10 15V9Z" stroke="currentColor" fill="currentColor" stroke-width="0"/></svg>`,
            check: `<svg viewBox="0 0 24 24"><path d="M5 12L10 17L19 8" stroke="currentColor" fill="none" stroke-width="3" stroke-linecap="round"/></svg>`
        };

        // ---------- BUILD HEADER ----------
        function renderHeader(screenTitle) {
            const headerDiv = document.getElementById('dynamicHeader');
            headerDiv.innerHTML = `
                <div class="header">
                    <h2>${screenTitle}</h2>
                    <div class="profile-icon" id="profileBtn"><div class="profile-icon-inner">${icons.profile.replace('currentColor', 'var(--header-icon)')}</div></div>
                </div>
            `;
            document.getElementById('profileBtn')?.addEventListener('click', (e) => {
                e.stopPropagation();
                navigateTo('settings');
            });
        }

        // ---------- BOTTOM NAV ----------
        const navItems = [
            { id: 'home', label: 'Home', icon: icons.home },
            { id: 'learn', label: 'Learn', icon: icons.learn },
            { id: 'progress', label: 'Progress', icon: icons.progress },
            { id: 'settings', label: 'Settings', icon: icons.settings }
        ];
        function renderBottomNav(active) {
            const nav = document.getElementById('bottomNav');
            nav.innerHTML = '';
            navItems.forEach(item => {
                const btn = document.createElement('button');
                btn.className = `nav-item ${active === item.id ? 'active' : ''}`;
                btn.innerHTML = `${item.icon}<span class="nav-label">${item.label}</span>`;
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (item.id === 'settings') navigateTo('settings');
                    else if (item.id === 'home') navigateTo('home');
                    else if (item.id === 'learn') navigateTo('learn');
                    else if (item.id === 'progress') navigateTo('progress');
                });
                nav.appendChild(btn);
            });
        }

        // ---------- MODAL (policy/terms) ----------
        function showModal(text) {
            if (modalOpen) return;
            modalOpen = true;
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.id = 'genericModal';
            modal.innerHTML = `
                <div class="modal-content">
                    <p style="margin-bottom:16px;">${text}</p>
                    <button id="closeModalBtn">Close</button>
                </div>
            `;
            document.body.appendChild(modal);
            document.getElementById('closeModalBtn').addEventListener('click', () => {
                modal.remove();
                modalOpen = false;
            });
            modal.addEventListener('click', (e) => { if (e.target === modal) { modal.remove(); modalOpen = false; } });
        }

        // ---------- SCREEN RENDERING ----------
        function navigateTo(screen) {
            currentScreen = screen;
            renderScreen(screen);
        }

        function renderScreen(screen) {
            const container = document.getElementById('screenContainer');
            let title = 'Brain logics';
            let content = '';

            if (screen === 'onboarding') {
                title = 'Welcome';
                content = `
                    <div class="card" style="text-align:center; padding:32px 20px;">
                        <div style="background:#EFF6FF; width:80px; height:80px; border-radius:30px; margin:0 auto 20px; display:flex; align-items:center; justify-content:center;">
                            ${icons.flashcards.replace('currentColor', 'var(--primary)')}
                        </div>
                        <h1 style="font-size:36px; font-weight:800; color:var(--primary);">🧠 PUZZLE</h1>
                        <p style="font-size:20px; font-weight:500; margin:8px 0 4px;">think sharp</p>
                        <p style="color:var(--text-light); margin:16px 0 24px;">Train your logic with daily brain games & mind puzzles. Become a puzzle master.</p>
                        <button class="btn" id="getStartedBtn">Get Started</button>
                        <div class="link-row">
                            <button id="privacyBtn">Privacy Policy</button>
                            <button id="termsBtn">Terms of Service</button>
                        </div>
                    </div>
                `;
            }
            else if (screen === 'home') {
                title = 'Home';
                content = `
                    <div class="card">
                        <div class="row">
                            <span class="badge">🔥 streak 7 days</span>
                            <span class="flex-1"></span>
                            <span>${icons.flashcards.replace('currentColor', 'var(--primary)')}</span>
                        </div>
                        <h3 style="margin-top:12px;">Today's puzzle</h3>
                        <div style="background:var(--bg); padding:16px; border-radius:24px; margin:12px 0;">
                            <div class="row gap-8">
                                ${icons.lesson.replace('currentColor', 'var(--primary)')}
                                <span><strong>Logic grid</strong> · hard</span>
                            </div>
                            <div class="progress-bar-bg mt-4"><div class="progress-fill" style="width:45%"></div></div>
                            <button class="btn" style="margin-top:16px;" id="resumeLearnBtn">continue</button>
                        </div>
                    </div>
                    <div class="card">
                        <div class="row"><span>${icons.chart.replace('currentColor', 'var(--primary)')}</span><span style="font-weight:600;">Daily puzzles</span></div>
                        <div class="row" style="justify-content:space-between; margin:16px 0;">
                            <span>🧩 mon</span><span>🧩 tue</span><span>🧩 wed</span><span>🧩 thu</span><span>🧩 fri</span>
                        </div>
                        <div class="progress-bar-bg"><div class="progress-fill" style="width:70%"></div></div>
                    </div>
                `;
            }
            else if (screen === 'learn') {
                title = 'Learn';
                content = `
                    <div class="card">
                        <div class="row">${icons.lesson.replace('currentColor', 'var(--primary)')}<span style="font-weight:600;">Lessons</span></div>
                        <div class="row" style="justify-content:space-between; margin:16px 0;"><span>🔹 Deduction 101</span><span>${icons.play.replace('currentColor', 'var(--primary)')}</span></div>
                        <div class="row" style="justify-content:space-between;"><span>🔹 Syllogisms</span><span>${icons.play.replace('currentColor', 'var(--primary)')}</span></div>
                        <div class="row" style="justify-content:space-between; margin-top:8px;"><span>🔹 Patterns</span><span>70%</span></div>
                        <div class="progress-bar-bg mt-4"><div class="progress-fill" style="width:70%"></div></div>
                    </div>
                    <div class="card">
                        <span style="font-weight:600;">Practice: logic grids</span>
                        <div style="margin-top:12px;" id="startPractice"><button class="btn">start practice</button></div>
                    </div>
                `;
            }
            else if (screen === 'progress') {
                title = 'Progress';
                content = `
                    <div class="card">
                        <div class="row"><span>${icons.chart.replace('currentColor', 'var(--primary)')}</span><span style="font-weight:600;">Last 7 days</span></div>
                        <div class="chart-placeholder">
                            <div class="bar" style="height:30px"></div><div class="bar" style="height:55px"></div><div class="bar" style="height:40px"></div>
                            <div class="bar" style="height:70px"></div><div class="bar" style="height:60px"></div><div class="bar" style="height:80px"></div><div class="bar" style="height:45px"></div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="row"><span>🏆 logic badges</span></div>
                        <div class="row gap-8" style="margin-top:16px;"><span>⭐ rookie</span><span>🔥 7 streak</span><span>🧠 50 puzzles</span></div>
                    </div>
                `;
            }
            else if (screen === 'settings') {
                title = 'Settings';
                content = `
                    <div class="card">
                        <div class="row" style="justify-content:space-between;">
                            <span>Dark mode</span>
                            <label><input type="checkbox" id="darkToggle" ${currentTheme==='dark'?'checked':''}></label>
                        </div>
                        <div class="row" style="margin-top:24px;"><span>🔔 notifications on</span></div>
                        <div class="row" style="margin-top:12px;"><span>🌐 language: EN</span></div>
                        <hr style="border-color:var(--border);margin:20px 0;">
                        <div class="row"><button class="btn" id="profileSettingsBtn">Profile details</button></div>
                        <p style="text-align:center; margin-top:24px;">version 2.6.0 · logic puzzles</p>
                    </div>
                `;
            }

            renderHeader(title);
            container.innerHTML = content;
            renderBottomNav(screen === 'onboarding' ? 'home' : screen); // onboarding shows home as inactive

            // ----- attach events ----
            if (screen === 'onboarding') {
                document.getElementById('getStartedBtn')?.addEventListener('click', ()=> navigateTo('home'));
                document.getElementById('privacyBtn')?.addEventListener('click', ()=> showModal('Privacy policy · We respect your data.'));
                document.getElementById('termsBtn')?.addEventListener('click', ()=> showModal('Terms of service · play fair.'));
            }
            if (screen === 'home') {
                document.getElementById('resumeLearnBtn')?.addEventListener('click', ()=> navigateTo('learn'));
            }
            if (screen === 'learn') {
                document.getElementById('startPractice')?.addEventListener('click', ()=> {
                    alert('practice started! (demo)');
                });
            }
            if (screen === 'settings') {
                const toggle = document.getElementById('darkToggle');
                if (toggle) {
                    toggle.addEventListener('change', (e) => {
                        applyTheme(e.target.checked ? 'dark' : 'light');
                    });
                }
                document.getElementById('profileSettingsBtn')?.addEventListener('click', ()=> alert('Profile screen (demo)'));
            }
            // profile icon in header (already listener attached after renderHeader, but we re-attach)
            document.getElementById('profileBtn')?.addEventListener('click', (e) => {
                e.stopPropagation();
                navigateTo('settings');
            });
        }

        // initial render
        renderScreen('onboarding');

        // ---------- SCREENSHOT FEATURE (Shift+W) ----------
        let screenshotCounter = 1;
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneContainer');
                if (!phone) return;
                
                // we need to capture png name based on theme and order
                const isDark = document.body.classList.contains('dark');
                let filename = (screenshotCounter++) + '.png';
                if (isDark && screenshotCounter <= 6) filename = '6.png';  // force dark screenshot naming rule
                else if (!isDark && screenshotCounter-1 >5) screenshotCounter=1; // just safety

                // dummy capture: in real prototype we would use html2canvas, but here we simulate by logging and show alert
                alert(`[DEV] Screenshot saved as ${filename} (simulated).\nJSON TITLES:\n` + JSON.stringify({
                    "1.png": "Start Learning",
                    "2.png": "Daily Lessons",
                    "3.png": "Practice Skills",
                    "4.png": "Track Progress",
                    "5.png": "Smart Settings",
                    "6.png": "Dark Theme"
                }, null, 2));
            }
        });

        // ensure modal close on outside
    })();
</script>
