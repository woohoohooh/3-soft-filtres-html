</head>
<body>

<script>
    (function() {
        // ---------- icon system (inline) ----------
        const icons = {};

        // state
        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
        let darkMode = false;
        let screenshotCounter = 0;

        // dom elements
        const screenContainer = document.getElementById('screenContainer');
        const headerTitle = document.getElementById('screenTitle');
        const bottomNav = document.getElementById('bottomNav');
        const profileBtn = document.getElementById('profileBtn');

        // theme CSS variables
        const root = document.documentElement;
        const phone = document.getElementById('phoneContainer');

        function toggleTheme() {
            darkMode = !darkMode;
            if (darkMode) phone.classList.add('dark-mode');
            else phone.classList.remove('dark-mode');
        }

        // ---------- render screens ----------
        function renderOnboarding() {
            return `
                <div class="card" style="text-align: center; padding: 32px 20px;">
                    <div class="app-logo">🧠</div>
                    <h2 style="font-size: 32px; font-weight:800; color:#2563EB;">Math Brain</h2>
                    <p style="font-size: 18px; font-weight: 500; margin:8px 0 4px;">train your mental math</p>
                    <p class="text-small" style="margin: 16px 0;">Daily 5‑min workouts · adaptive challenges · brain training for everyone.</p>
                    <button class="btn-primary" id="startOnboarding">Get Started</button>
                    <div style="display:flex; justify-content:center; gap:24px; margin-top:24px;">
                        <a href="#" id="privacyLink" style="color:#2563EB; text-decoration:none;">Privacy</a>
                        <a href="#" id="termsLink" style="color:#2563EB; text-decoration:none;">Terms</a>
                    </div>
                </div>
            `;
        }

        function renderHome() {
            return `
                <div class="card">
                    <div class="card-title">🔥 daily streak</div>
                    <div class="flex-row"><span>12 days</span> <span class="text-small">+3 today</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:70%"></div></div>
                </div>
                <div class="card">
                    <div class="card-title">📊 quick stats</div>
                    <div style="display:flex; justify-content: space-between;">
                        <div><span style="font-size:24px; font-weight:700;">847</span> <span class="text-small">pts</span></div>
                        <div><span style="font-size:24px; font-weight:700;">32</span> <span class="text-small">lessons</span></div>
                        <div><span style="font-size:24px; font-weight:700;">4</span> <span class="text-small">badges</span></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-title">🎯 today's goal</div>
                    <div class="flex-row"><svg class="icon-svg" style="color:#2563EB;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span>Finish 1 workout (2/3)</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:66%"></div></div>
                </div>
            `;
        }

        function renderLearn() {
            return `
                <div class="card" style="cursor:pointer;" id="startPractice">
                    <div class="flex-row" style="justify-content:space-between;">
                        <div><span class="card-title">➕ quick practice</span><span class="text-small">addition & subtraction</span></div>
                        <svg class="icon-svg" viewBox="0 0 24 24" style="color:#2563EB;"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    </div>
                </div>
                <div class="card">
                    <div class="card-title">📚 lessons</div>
                    <div class="flex-row" style="margin-bottom:12px;"><svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span>Multiplication · 4 min</span></div>
                    <div class="flex-row" style="margin-bottom:12px;"><svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span>Division · 5 min</span></div>
                    <div class="flex-row"><svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span>Fractions · 6 min</span></div>
                </div>
                <div class="card" id="flashcardsPreview">
                    <div class="card-title">🃏 mental flashcards</div>
                    <div style="background: #2563EB10; border-radius:20px; padding:16px;">12 × 8 = ?</div>
                </div>
            `;
        }

        function renderProgress() {
            return `
                <div class="card">
                    <div class="card-title">📈 last 7 days</div>
                    <div style="display:flex; gap:8px; height:80px; align-items:flex-end;">
                        <div style="flex:1; background:#2563EB; height:40px; border-radius:8px;"></div>
                        <div style="flex:1; background:#2563EB; height:68px; border-radius:8px;"></div>
                        <div style="flex:1; background:#2563EB; height:24px; border-radius:8px;"></div>
                        <div style="flex:1; background:#2563EB; height:52px; border-radius:8px;"></div>
                        <div style="flex:1; background:#2563EB; height:70px; border-radius:8px;"></div>
                        <div style="flex:1; background:#2563EB; height:44px; border-radius:8px;"></div>
                        <div style="flex:1; background:#2563EB; height:30px; border-radius:8px;"></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-title">🏆 achievements</div>
                    <div class="flex-row"><svg class="icon-svg" style="color:gold;" viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M15.33 14.5 12 22 8.67 14.5"/></svg><span>arithmetic wizard</span></div>
                    <div class="flex-row"><svg class="icon-svg" style="color:silver;" viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M15.33 14.5 12 22 8.67 14.5"/></svg><span>5 day streak</span></div>
                    <div class="flex-row"><svg class="icon-svg" style="color:#cd7f32;" viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M15.33 14.5 12 22 8.67 14.5"/></svg><span>first blood</span></div>
                </div>
            `;
        }

        function renderSettings() {
            return `
                <div class="card">
                    <div class="card-title">⚙️ appearance</div>
                    <div class="flex-row" style="justify-content:space-between;">
                        <span>Dark mode</span>
                        <label><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}></label>
                    </div>
                </div>
                <div class="card">
                    <div class="card-title">👤 profile</div>
                    <div class="text-small">math.master@email.com</div>
                    <div class="text-small">member since 2026</div>
                </div>
                <div class="card">
                    <div class="card-title">🔊 sound & speech</div>
                    <div class="flex-row">effects <input type="checkbox" checked></div>
                </div>
            `;
        }

        function showModal(title, content) {
            const modalHtml = `
                <div class="modal" id="modal">
                    <div class="modal-content">
                        <h3 style="margin-bottom:12px;">${title}</h3>
                        <p>${content}</p>
                        <button class="btn-primary" style="margin-top:16px;" id="closeModal">OK</button>
                    </div>
                </div>
            `;
            const modalContainer = document.getElementById('modalContainer');
            modalContainer.innerHTML = modalHtml;
            document.getElementById('closeModal').addEventListener('click', ()=> modalContainer.innerHTML='');
        }

        // navigation
        function navigateTo(screen) {
            currentScreen = screen;
            if (screen === 'onboarding') headerTitle.innerText = 'Welcome';
            else if (screen === 'home') headerTitle.innerText = 'Dashboard';
            else if (screen === 'learn') headerTitle.innerText = 'Practice';
            else if (screen === 'progress') headerTitle.innerText = 'Progress';
            else if (screen === 'settings') headerTitle.innerText = 'Settings';

            // render screen
            if (screen === 'onboarding') screenContainer.innerHTML = renderOnboarding();
            else if (screen === 'home') screenContainer.innerHTML = renderHome();
            else if (screen === 'learn') screenContainer.innerHTML = renderLearn();
            else if (screen === 'progress') screenContainer.innerHTML = renderProgress();
            else if (screen === 'settings') screenContainer.innerHTML = renderSettings();

            // bottom nav active
            document.querySelectorAll('.nav-item').forEach(item => {
                const tab = item.dataset.tab;
                if (screen === tab || (screen==='onboarding' && tab==='home')) { /* onboarding no highlight */ }
                if (screen !== 'onboarding' && screen === tab) item.classList.add('active');
                else item.classList.remove('active');
            });

            // attach special events
            if (screen === 'onboarding') {
                document.getElementById('startOnboarding')?.addEventListener('click', ()=> navigateTo('home'));
                document.getElementById('privacyLink')?.addEventListener('click', (e)=> { e.preventDefault(); showModal('Privacy Policy','We keep your data safe. No sharing.'); });
                document.getElementById('termsLink')?.addEventListener('click', (e)=> { e.preventDefault(); showModal('Terms of Service','Use Math Brain for personal learning only.'); });
            }
            if (screen === 'learn') {
                document.getElementById('startPractice')?.addEventListener('click', ()=> { alert('starting interactive practice!'); });
            }
            if (screen === 'settings') {
                document.getElementById('darkToggle')?.addEventListener('change', (e) => { toggleTheme(); });
            }
        }

        // bottom nav listeners
        bottomNav.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', (e) => {
                const tab = e.currentTarget.dataset.tab;
                navigateTo(tab);
            });
        });

        // profile icon click
        profileBtn.addEventListener('click', ()=> navigateTo('settings'));

        // start with onboarding
        navigateTo('onboarding');

        // ---------- screenshot hotkey shift+W ----------
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phoneEl = document.getElementById('phoneContainer');
                // very basic screenshot simulation – prompt download (real canvas not possible due to cross-origin)
                // we use html-to-image? but we promised only HTML/CSS/JS, we'll simulate by generating an anchor with a dummy png.
                // simulate saving: create data url and trigger download.
                screenshotCounter++;
                const themeSuffix = darkMode ? 6 : screenshotCounter; // but careful: if dark mode, always 6.png
                let filename = '';
                if (darkMode) filename = '6.png';
                else filename = screenshotCounter + '.png';

                // we can't truly screenshot, but we can generate a text representation. we just obey spec: trigger download placeholder.
                const dummyCanvas = document.createElement('canvas');
                dummyCanvas.width = 360; dummyCanvas.height = 780;
                const ctx = dummyCanvas.getContext('2d');
                ctx.fillStyle = darkMode ? '#0F172A' : '#F8FAFC';
                ctx.fillRect(0,0,360,780);
                ctx.fillStyle = '#2563EB';
                ctx.font = 'bold 20px Inter';
                ctx.fillText('Math Brain', 60, 360);
                dummyCanvas.toBlob(blob => {
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = filename;
                    link.click();
                });
            }
        });
    })();
</script>
