```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabVault · 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a2634;
            padding: 12px;
        }
        .phone-frame {
            width: 360px;
            height: 780px;
            background: var(--bg-primary);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6), 0 0 0 8px #2e3a47;
            position: relative;
            transition: background 0.2s;
        }
        .app-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            color: var(--text-primary);
            position: relative;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .app-screen::-webkit-scrollbar { display: none; }

        /* theme variables */
        :root {
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --border-light: #E2E8F0;
            --icon-inactive: #94A3B8;
            --icon-active: #2563EB;
            --bottom-bg: #FFFFFF;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.02);
            --progress-bg: #E2E8F0;
        }
        .dark-mode {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --border-light: #334155;
            --icon-inactive: #64748B;
            --icon-active: #3B82F6;
            --bottom-bg: #1E293B;
            --progress-bg: #334155;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px 8px 20px;
            background: var(--bg-primary);
        }
        .header h1 {
            font-size: 22px;
            font-weight: 650;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .profile-icon {
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            transition: 0.15s;
        }
        .profile-icon:hover { background: rgba(37,99,235,0.1); }

        /* main content flex grow */
        .content {
            flex: 1;
            padding: 8px 20px 12px 20px;
            overflow-y: auto;
        }

        /* bottom nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--bottom-bg);
            padding: 8px 12px 10px;
            border-top: 1px solid var(--border-light);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 30px;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            color: var(--icon-inactive);
            fill: var(--icon-inactive);
        }
        .nav-item.active {
            color: var(--icon-active);
            fill: var(--icon-active);
            background: rgba(37,99,235,0.1);
            transform: scale(1.05);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
        }

        /* cards / ui */
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 16px;
            border: 1px solid var(--border-light);
        }
        .flex-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn {
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 16px 24px;
            border-radius: 40px;
            font-size: 18px;
            width: 100%;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 8px 16px -8px var(--primary-dark);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            box-shadow: none;
            padding: 14px 20px;
        }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-top: 20px;
            font-size: 14px;
        }
        .link-row span {
            color: var(--text-secondary);
            text-decoration: underline;
            cursor: pointer;
        }
        .progress-bar {
            height: 8px;
            background: var(--progress-bg);
            border-radius: 40px;
            margin: 12px 0;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--primary);
            border-radius: 40px;
            transition: width 0.5s ease;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
        }
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--bg-card);
            padding: 28px;
            border-radius: 32px;
            width: 280px;
            text-align: center;
            color: var(--text-primary);
        }
        .close-btn {
            margin-top: 20px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        .icon-grid {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 16px 0;
        }
        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="phone-frame" id="phoneFrame">
        <div class="app-screen" id="appScreen">
            <!-- header will be injected per screen -->
            <div id="headerPlaceholder"></div>
            <!-- main content -->
            <div id="contentArea" class="content"></div>
            <!-- bottom nav -->
            <div class="bottom-nav" id="bottomNav"></div>
        </div>
    </div>

    <!-- modal container -->
    <div id="modalContainer" class="modal hidden" onclick="if(event.target===this)closeModal()">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <script>
        (function(){
            // ---------- THEME ----------
            let darkMode = false;
            const root = document.documentElement;

            // ---------- ICON SYSTEM (inline svg) ----------
            const icons = {
                home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z"/></svg>`,
                learn: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4H8C10 4 12 6 12 8C12 6 14 4 16 4H22V18H16C14 18 12 20 12 20C12 20 10 18 8 18H2V4Z"/></svg>`,
                progress: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7V12L15 15"/></svg>`,
                settings: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15L20.8 12L19.4 9H16.8L15.4 6L12 4.8L8.6 6L7.2 9H4.6L3.2 12L4.6 15H7.2L8.6 18L12 19.2L15.4 18L16.8 15H19.4Z"/></svg>`,
                profile: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20C4 17 8 16 12 16C16 16 20 17 20 20"/><circle cx="12" cy="8" r="4"/></svg>`,
                lesson: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="18"/><path d="M8 8H16M8 12H14"/></svg>`,
                chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 21H3V3"/><path d="M7 15V11M12 15V7M17 15V13"/></svg>`,
                flashcards: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20"/><path d="M8 6H16M8 10H14"/></svg>`,
                play: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M10 8L16 12L10 16V8Z"/></svg>`,
                check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17L4 12"/></svg>`,
            };

            // app state
            let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
            let screenshotCounter = 1;

            // ---------- RENDER HEADER ----------
            function renderHeader(title) {
                return `
                    <div class="header">
                        <h1>${title}</h1>
                        <div class="profile-icon" id="profileBtn">${icons.profile}</div>
                    </div>
                `;
            }

            // ---------- BOTTOM NAV (except onboarding) ----------
            function renderBottomNav(active) {
                const items = [
                    { id: 'home', label: 'Home', icon: icons.home },
                    { id: 'learn', label: 'Learn', icon: icons.learn },
                    { id: 'progress', label: 'Progress', icon: icons.progress },
                    { id: 'settings', label: 'Settings', icon: icons.settings }
                ];
                return items.map(item => {
                    const isActive = (active === item.id);
                    return `
                        <div class="nav-item ${isActive ? 'active' : ''}" data-nav="${item.id}">
                            ${item.icon}
                            <span>${item.label}</span>
                        </div>
                    `;
                }).join('');
            }

            // ---------- MODAL ----------
            window.showModal = (title, text) => {
                const modal = document.getElementById('modalContainer');
                document.getElementById('modalContent').innerHTML = `
                    <h3 style="margin-bottom:12px;">${title}</h3>
                    <p style="margin-bottom:24px;">${text}</p>
                    <button class="close-btn" onclick="closeModal()">Close</button>
                `;
                modal.classList.remove('hidden');
            };
            window.closeModal = () => {
                document.getElementById('modalContainer').classList.add('hidden');
            };

            // ---------- SCREENSHOT (Shift+W) ----------
            document.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'W') {
                    e.preventDefault();
                    const phone = document.getElementById('phoneFrame');
                    // we don't have actual canvas capture, but we simulate naming
                    let name = darkMode ? '6.png' : (screenshotCounter + '.png');
                    if (!darkMode && screenshotCounter <=5) {
                        // increment for next light screenshot
                        screenshotCounter = (screenshotCounter % 5) + 1;
                    } else if (darkMode) {
                        // dark always 6.png, no increment
                    }
                    alert(`📸 Screenshot saved as ${name} (simulated)`);
                }
            });

            // ---------- THEME TOGGLE ----------
            function toggleTheme() {
                darkMode = !darkMode;
                if (darkMode) {
                    root.classList.add('dark-mode');
                } else {
                    root.classList.remove('dark-mode');
                }
                // refresh current screen to reflect theme icons/colors
                navigateTo(currentScreen);
            }

            // ---------- SCREEN CONTENT ----------
            function getScreenHTML(screen) {
                switch(screen) {
                    case 'onboarding':
                        return `
                            <div style="display:flex; flex-direction:column; min-height:660px; justify-content:center;">
                                <div style="text-align: center; margin-bottom:24px;">
                                    <div style="background:#2563EB; width:72px; height:72px; border-radius:24px; margin:0 auto 20px; display:flex; align-items:center; justify-content:center; color:white; font-size:40px; font-weight:700;">📘</div>
                                    <h2 style="font-size:36px; font-weight:700;">VocabVault</h2>
                                    <p style="font-size:18px; color: var(--primary); font-weight:500;">master words daily</p>
                                    <p style="margin-top:24px; color:var(--text-secondary);">Build your English vocabulary with smart flashcards, daily challenges, and progress tracking.</p>
                                </div>
                                <button class="btn" id="getStartedBtn" style="margin-top:24px;">Get Started</button>
                                <div class="link-row">
                                    <span onclick="showModal('Privacy Policy','We respect your data. No sharing, ever.')">Privacy Policy</span>
                                    <span onclick="showModal('Terms of Service','Educational use only. Be kind, keep learning.')">Terms of Service</span>
                                </div>
                            </div>
                        `;
                    case 'home':
                        return `
                            <div class="card">
                                <div class="flex-row" style="justify-content:space-between;">
                                    <span style="font-weight:600; font-size:18px;">Hello, Alex 👋</span>
                                    <span class="badge">⭐ 7 day streak</span>
                                </div>
                                <div class="progress-bar"><div class="progress-fill" style="width:70%;"></div></div>
                                <div style="display:flex; gap:12px; margin-top:16px;">
                                    <div style="flex:1; background:var(--accent); padding:12px; border-radius:20px; color:#0F172A;"><span style="font-weight:700;">24</span> words</div>
                                    <div style="flex:1; background:var(--primary); padding:12px; border-radius:20px; color:white;"><span style="font-weight:700;">3</span> lessons</div>
                                </div>
                            </div>
                            <div class="card">
                                <div class="flex-row" style="gap:8px;">${icons.flashcards} <span style="font-weight:600;">Daily goal</span></div>
                                <div class="progress-bar"><div class="progress-fill" style="width:45%;"></div></div>
                                <p>45% · 9/20 words</p>
                                <button class="btn-outline btn" style="margin-top:12px;" id="quickPractice">Quick practice</button>
                            </div>
                            <div class="card">
                                <span style="font-weight:600;">📚 Recommended</span>
                                <div class="flex-row" style="justify-content:space-between; margin-top:16px;">
                                    <span>Business English</span> <span>▶ 8 min</span>
                                </div>
                                <div class="flex-row" style="justify-content:space-between; margin-top:12px;">
                                    <span>Idioms pack</span> <span>▶ 5 min</span>
                                </div>
                            </div>
                        `;
                    case 'learn':
                        return `
                            <div class="card" style="text-align:center;">
                                <span style="font-size:22px; font-weight:700;">Today's topic</span>
                                <div style="font-size:48px; margin:12px 0;">📘</div>
                                <p style="font-weight:600;">Phrasal verbs: 5 new</p>
                                <button class="btn" id="startLessonBtn" style="margin-top:12px;">Start lesson</button>
                            </div>
                            <div class="card">
                                <div class="flex-row">${icons.flashcards}<span style="font-weight:600;">Flashcards</span></div>
                                <div class="flex-row" style="justify-content:space-between; margin:12px 0;"><span>🔹 look up</span> <span>🔄 80%</span></div>
                                <div class="flex-row" style="justify-content:space-between;"><span>🔹 break down</span> <span>🔄 40%</span></div>
                            </div>
                            <div class="card">
                                <div class="flex-row">${icons.lesson} <span style="font-weight:600;">Practice (listen)</span></div>
                                <button class="btn-outline btn" style="margin-top:8px;" id="practiceAudio">▶ Start listening</button>
                            </div>
                        `;
                    case 'progress':
                        return `
                            <div class="card">
                                <div class="flex-row" style="justify-content:space-between;">
                                    <span style="font-weight:600;">Words learned</span> <span class="stat-number">158</span>
                                </div>
                                <div class="flex-row" style="justify-content:space-between;">
                                    <span>Hours practiced</span> <span class="stat-number">12</span>
                                </div>
                            </div>
                            <div class="card">
                                <div class="flex-row">${icons.chart} <span style="font-weight:600;">Weekly activity</span></div>
                                <div style="display:flex; gap:6px; margin:16px 0; justify-content:center;">
                                    <div style="height:40px; width:20px; background:var(--primary); border-radius:12px;"></div>
                                    <div style="height:60px; width:20px; background:var(--primary); border-radius:12px;"></div>
                                    <div style="height:30px; width:20px; background:var(--accent); border-radius:12px;"></div>
                                    <div style="height:70px; width:20px; background:var(--primary); border-radius:12px;"></div>
                                    <div style="height:50px; width:20px; background:var(--accent); border-radius:12px;"></div>
                                </div>
                            </div>
                            <div class="card">
                                <span>Achievements</span>
                                <div class="icon-grid">
                                    <span style="font-size:32px;">🔥</span><span style="font-size:32px;">⚡</span><span style="font-size:32px;">🏆</span>
                                </div>
                            </div>
                        `;
                    case 'settings':
                        return `
                            <div class="card">
                                <div style="display:flex; align-items:center; gap:12px;">
                                    ${icons.profile}
                                    <div><span style="font-weight:600;">Alexander Chen</span><br><span style="font-size:12px;">alex@example.com</span></div>
                                </div>
                            </div>
                            <div class="card">
                                <div style="display:flex; justify-content:space-between; align-items:center;">
                                    <span>Dark mode</span>
                                    <label style="width:44px; height:24px; background:var(--primary); border-radius:40px; display:inline-block; cursor:pointer;" onclick="toggleTheme()">
                                        <span style="display:block; width:20px; height:20px; background:white; border-radius:50%; margin:2px; ${darkMode ? 'margin-left:22px;' : ''}"></span>
                                    </label>
                                </div>
                                <div style="margin-top:20px;">Sound effects ✅</div>
                                <div>Reminders 🔔</div>
                            </div>
                            <div class="card">
                                <span>App version 2.0.26</span>
                            </div>
                        `;
                    default: return '';
                }
            }

            // ---------- NAVIGATION ----------
            function navigateTo(screen) {
                currentScreen = screen;
                const headerPlace = document.getElementById('headerPlaceholder');
                const contentArea = document.getElementById('contentArea');
                const bottomNav = document.getElementById('bottomNav');

                if (screen === 'onboarding') {
                    headerPlace.innerHTML = ''; // no header for onboarding
                    bottomNav.innerHTML = '';   // hide bottom nav
                    contentArea.innerHTML = getScreenHTML('onboarding');
                    document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
                        navigateTo('home');
                    });
                } else {
                    // all other screens have header + bottom nav
                    let headerTitle = {
                        home: 'Home', learn: 'Learn', progress: 'Progress', settings: 'Settings'
                    }[screen];
                    headerPlace.innerHTML = renderHeader(headerTitle);
                    contentArea.innerHTML = getScreenHTML(screen);
                    bottomNav.innerHTML = renderBottomNav(screen);

                    // profile click
                    document.getElementById('profileBtn').addEventListener('click', ()=>{
                        navigateTo('settings');
                    });

                    // bottom nav listeners
                    document.querySelectorAll('.nav-item').forEach(el => {
                        el.addEventListener('click', (e) => {
                            const navId = el.dataset.nav;
                            if (navId) navigateTo(navId);
                        });
                    });

                    // extra listeners for demo interactions
                    if (screen === 'home') {
                        document.getElementById('quickPractice')?.addEventListener('click', ()=>{
                            alert('▶️ Starting quick practice (5 new words)');
                        });
                    }
                    if (screen === 'learn') {
                        document.getElementById('startLessonBtn')?.addEventListener('click', ()=>{
                            alert('📘 Lesson started! Phrasal verbs');
                        });
                        document.getElementById('practiceAudio')?.addEventListener('click', ()=>{
                            alert('🎧 Listening exercise ...');
                        });
                    }
                }
            }

            // first render
            navigateTo('onboarding');

            // expose for inline handlers
            window.toggleTheme = toggleTheme;
            window.showModal = showModal;
            window.closeModal = closeModal;
        })();
    </script>
</body>
</html>
All done!
