<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeFlow · Python</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a2639;
            padding: 12px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background-color: var(--bg-primary);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2d3b4f;
            position: relative;
            transition: background-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        /* theme variables */
        :root {
            --bg-primary: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --border-light: #E2E8F0;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --progress-bg: #E2E8F0;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.02);
        }

        .dark {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #CBD5E1;
            --border-light: #334155;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --progress-bg: #334155;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.4);
        }

        /* main flex layout */
        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            padding: 16px 16px 8px 16px;
            gap: 16px;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-light);
        }
        .header h1 {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .profile-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            transition: background 0.1s;
        }
        .profile-btn:hover { background: rgba(37,99,235,0.1); }
        .profile-icon svg { stroke: var(--primary); width: 28px; height: 28px; }

        /* bottom navigation */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 14px;
            background-color: var(--bg-card);
            border-top: 1px solid var(--border-light);
            border-radius: 30px 30px 0 0;
            box-shadow: var(--shadow-sm);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            gap: 4px;
            transition: all 0.15s ease;
            padding: 6px 10px 4px;
            border-radius: 24px;
            min-width: 60px;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.15s;
        }
        .nav-label {
            font-size: 11px;
            font-weight: 500;
            transition: all 0.1s;
        }
        /* active style */
        .nav-item.active {
            background: rgba(37,99,235,0.12);
        }
        .nav-item.active svg {
            stroke: var(--primary);
            transform: scale(1.12);
        }
        .nav-item.active .nav-label {
            color: var(--primary);
            font-weight: 600;
        }
        /* inactive */
        .nav-item:not(.active) svg {
            stroke: var(--inactive);
        }
        .nav-item:not(.active) .nav-label {
            color: var(--inactive);
        }

        /* cards, etc */
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }

        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-bar {
            height: 10px;
            background: var(--progress-bg);
            border-radius: 30px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            border-radius: 30px;
            transition: width 0.3s ease;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            font-weight: 600;
            padding: 14px 20px;
            border-radius: 40px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.1s;
        }
        button.secondary {
            background: transparent;
            border: 1.5px solid var(--primary);
            color: var(--primary);
        }

        .badge {
            background: var(--accent);
            color: #0F172A;
            font-weight: 600;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 30px;
            display: inline-block;
        }

        /* modal overlay */
        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(3px);
            z-index: 1000;
        }
        .modal-content {
            background: var(--bg-card);
            width: 280px;
            padding: 28px 20px;
            border-radius: 32px;
            color: var(--text-primary);
            text-align: center;
            box-shadow: 0 30px 50px #00000055;
        }
        .modal-content h3 { margin-bottom: 12px; }
        .modal-close {
            margin-top: 20px;
            background: var(--primary);
            padding: 10px 0;
            border-radius: 30px;
        }

        /* hidden screens */
        .screen {
            display: none;
            flex-direction: column;
            gap: 16px;
        }
        .screen.active-screen {
            display: flex;
        }

        /* onboarding specific */
        .logo-big {
            background: linear-gradient(145deg, #2563EB, #38BDF8);
            width: 72px;
            height: 72px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto 16px;
        }
        .small-link {
            color: var(--inactive);
            text-decoration: underline;
            font-size: 13px;
            margin: 0 8px;
            cursor: pointer;
        }

        /* icons inline via js, but we also have some ui */
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- header will be injected per screen via js, but static header per screen? simpler: have same header placeholder -->
    <div class="header" id="appHeader">
        <h1 id="headerTitle">Onboarding</h1>
        <button class="profile-btn" id="profileHeaderBtn"><span class="profile-icon" id="profileIcon"></span></button>
    </div>

    <!-- screens container -->
    <div class="app-screen" id="screenContainer">
        <!-- onboarding screen (always visible if no other?) but we manage via classes -->
        <div id="onboardingScreen" class="screen active-screen"></div>
        <div id="homeScreen" class="screen"></div>
        <div id="learnScreen" class="screen"></div>
        <div id="progressScreen" class="screen"></div>
        <div id="settingsScreen" class="screen"></div>
    </div>

    <!-- bottom nav -->
    <div class="bottom-nav" id="bottomNav">
        <button class="nav-item active" data-tab="home" id="navHome"><span id="iconHome"></span><span class="nav-label">Home</span></button>
        <button class="nav-item" data-tab="learn" id="navLearn"><span id="iconLearn"></span><span class="nav-label">Learn</span></button>
        <button class="nav-item" data-tab="progress" id="navProgress"><span id="iconProgress"></span><span class="nav-label">Progress</span></button>
        <button class="nav-item" data-tab="settings" id="navSettings"><span id="iconSettings"></span><span class="nav-label">Settings</span></button>
    </div>
</div>

<!-- modal template hidden -->
<div id="modalTemplate" style="display: none;">modal</div>

<script>
(function() {
    // ------ SVG ICON FACTORY (inline, 2px stroke, rounded, outline) ------
    function createIcon(type, active = false) {
        const svgNS = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(svgNS, "svg");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("fill", "none");
        svg.setAttribute("stroke", "currentColor");
        svg.setAttribute("stroke-width", "2");
        svg.setAttribute("stroke-linecap", "round");
        svg.setAttribute("stroke-linejoin", "round");

        let path;
        if (type === 'home') {
            path = '<path d="M3 10 L12 3 L21 10 L21 20 L15 20 L15 14 L9 14 L9 20 L3 20 L3 10Z" />';
        } else if (type === 'learn') {
            path = '<path d="M4 19.5 L12 15 L20 19.5 M12 4 L12 15 M4 8 L12 4 L20 8 L20 16 L12 20 L4 16 L4 8Z" />';
        } else if (type === 'progress') {
            path = '<path d="M21 12 L18 12 L15 20 L9 4 L6 12 L3 12" />';
        } else if (type === 'settings') {
            path = '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.05.05A10 10 0 0 0 12 18a10 10 0 0 0 6.26-2.22zM5 6h14"/>';
        } else if (type === 'profile') {
            path = '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>';
        } else if (type === 'lesson') {
            path = '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>';
        } else if (type === 'chart') {
            path = '<path d="M21 16v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2"/><path d="M7 10l3-3 3 3 4-4"/>';
        } else if (type === 'flashcards') {
            path = '<path d="M4 7h16M4 12h10M4 17h6"/><rect x="6" y="4" width="12" height="16" rx="2" ry="2"/>';
        } else if (type === 'play') {
            path = '<polygon points="5 3 19 12 5 21 5 3"/>';
        } else if (type === 'check') {
            path = '<polyline points="20 6 9 17 4 12"/>';
        } else {
            path = '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
        }
        svg.innerHTML = path;
        return svg;
    }

    // mount icons
    function mountIcons() {
        const homeSpan = document.getElementById('iconHome'); homeSpan.innerHTML = ''; homeSpan.appendChild(createIcon('home'));
        const learnSpan = document.getElementById('iconLearn'); learnSpan.innerHTML = ''; learnSpan.appendChild(createIcon('learn'));
        const progressSpan = document.getElementById('iconProgress'); progressSpan.innerHTML = ''; progressSpan.appendChild(createIcon('progress'));
        const settingsSpan = document.getElementById('iconSettings'); settingsSpan.innerHTML = ''; settingsSpan.appendChild(createIcon('settings'));
        const profileSpan = document.getElementById('profileIcon'); profileSpan.innerHTML = ''; profileSpan.appendChild(createIcon('profile'));
    }

    // ----- state -----
    let activeScreen = 'onboarding'; // onboarding, home, learn, progress, settings
    let darkMode = false;
    let screenshotCounter = 1; // will reset logic, but shift+w logic

    // ----- render functions -----
    function renderScreen() {
        // update header title
        const headerTitle = document.getElementById('headerTitle');
        const screens = ['onboarding','home','learn','progress','settings'];
        screens.forEach(s => document.getElementById(s+'Screen').classList.remove('active-screen'));

        if (activeScreen === 'onboarding') {
            headerTitle.innerText = 'Welcome';
            document.getElementById('onboardingScreen').classList.add('active-screen');
            renderOnboarding();
        } else if (activeScreen === 'home') {
            headerTitle.innerText = 'Dashboard';
            document.getElementById('homeScreen').classList.add('active-screen');
            renderHome();
        } else if (activeScreen === 'learn') {
            headerTitle.innerText = 'Python Practice';
            document.getElementById('learnScreen').classList.add('active-screen');
            renderLearn();
        } else if (activeScreen === 'progress') {
            headerTitle.innerText = 'Statistics';
            document.getElementById('progressScreen').classList.add('active-screen');
            renderProgress();
        } else if (activeScreen === 'settings') {
            headerTitle.innerText = 'Settings';
            document.getElementById('settingsScreen').classList.add('active-screen');
            renderSettings();
        }

        // bottom nav active
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        if (activeScreen !== 'onboarding') {
            document.getElementById('nav'+activeScreen.charAt(0).toUpperCase()+activeScreen.slice(1)).classList.add('active');
        } else {
            // onboarding: no bottom active
        }
    }

    function renderOnboarding() {
        const el = document.getElementById('onboardingScreen');
        el.innerHTML = `
            <div class="card" style="text-align: center;">
                <div class="logo-big">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2"><path d="M12 2 L2 7 L12 12 L22 7 L12 2Z M2 17 L12 22 L22 17 M2 12 L12 17 L22 12"/></svg>
                </div>
                <h2 style="font-size:28px; margin:8px 0 4px; color:var(--text-primary);">CodeFlow</h2>
                <p style="color:var(--accent); font-weight:600; margin-bottom:12px;">learn Python · one flow</p>
                <p style="color:var(--text-secondary); margin-bottom:24px;">Bite-sized coding lessons, real exercises, and smart progress tracking. Start your Python journey today.</p>
                <button id="getStartedBtn" style="width:100%;">Get Started</button>
                <div style="margin: 20px 0 12px;">
                    <span class="small-link" id="privacyLink">Privacy Policy</span> · 
                    <span class="small-link" id="termsLink">Terms of Service</span>
                </div>
            </div>
        `;
        document.getElementById('getStartedBtn').addEventListener('click', ()=>{
            activeScreen = 'home';
            renderScreen();
        });
        document.getElementById('privacyLink').addEventListener('click', ()=>showModal('Privacy notice','We respect your data. No creepy tracking.'));
        document.getElementById('termsLink').addEventListener('click', ()=>showModal('Terms of Service','Learning is free. Be nice.'));
    }

    function renderHome() {
        const el = document.getElementById('homeScreen');
        el.innerHTML = `
            <div class="card flex-row"><span style="font-weight:600;">🔥 7 day streak</span><span class="badge">+120 XP</span></div>
            <div class="card">
                <div class="flex-row"><span style="font-weight:600;">Current lesson</span><span>Python basics</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div>
                <button class="secondary" style="width:100%;" id="continueLessonBtn">continue 45%</button>
            </div>
            <div class="card">
                <div style="display:flex; gap:12px; align-items:center;">${createIcon('flashcards').outerHTML}<span style="font-weight:600;">Flashcards: 8 due</span></div>
                <div style="display:flex; gap:12px; margin-top:14px;">${createIcon('play').outerHTML}<span>Quick practice →</span></div>
            </div>
            <div class="card">
                <span style="font-weight:600;">Daily pick</span>
                <p>f-strings & loops</p>
                <button id="startPracticeHome">Start practice</button>
            </div>
        `;
        document.getElementById('continueLessonBtn')?.addEventListener('click', ()=>{ activeScreen='learn'; renderScreen(); });
        document.getElementById('startPracticeHome')?.addEventListener('click', ()=>{ activeScreen='learn'; renderScreen(); });
    }

    function renderLearn() {
        const el = document.getElementById('learnScreen');
        el.innerHTML = `
            <div class="card flex-row"><span>📘 Python fundamentals</span><span>3/8</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width:37%"></div></div>
            <div class="card">${createIcon('lesson').outerHTML} Lesson: variables & types <span style="float:right;">→</span></div>
            <div class="card">${createIcon('lesson').outerHTML} Lesson: lists & dicts <span style="float:right;">→</span></div>
            <div class="card" style="background:var(--accent); color:black;"> Practice quiz: 5 questions <button style="background:#1E293B; color:white;" id="quizBtn">Start</button></div>
        `;
        document.getElementById('quizBtn')?.addEventListener('click', ()=> alert('quiz started!'));
    }

    function renderProgress() {
        const el = document.getElementById('progressScreen');
        el.innerHTML = `
            <div class="card flex-row"><span>⭐ 340 XP</span><span>level 4</span></div>
            <div class="card"><span style="font-weight:600;">Lessons completed</span><div class="progress-bar"><div class="progress-fill" style="width:28%"></div></div> 14/50</div>
            <div class="card">${createIcon('chart').outerHTML} weekly activity: 5 days</div>
            <div class="card">Badges: ${createIcon('check').outerHTML} quick starter, ${createIcon('check').outerHTML} loop master</div>
        `;
    }

    function renderSettings() {
        const el = document.getElementById('settingsScreen');
        el.innerHTML = `
            <div class="card flex-row"><span>Dark theme</span><input type="checkbox" id="darkToggle" ${darkMode ? 'checked' : ''}></div>
            <div class="card">Notifications</div>
            <div class="card">Sound effects</div>
            <div class="card">Profile: Alex C.</div>
        `;
        document.getElementById('darkToggle')?.addEventListener('change', (e)=>{
            darkMode = e.target.checked;
            if (darkMode) document.getElementById('phoneContainer').classList.add('dark');
            else document.getElementById('phoneContainer').classList.remove('dark');
        });
    }

    function showModal(title, text) {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `<div class="modal-content"><h3>${title}</h3><p>${text}</p><button class="modal-close" id="closeModalBtn">OK</button></div>`;
        document.querySelector('.phone').appendChild(modalDiv);
        document.getElementById('closeModalBtn').addEventListener('click', ()=>modalDiv.remove());
    }

    // ---- navigation ----
    document.getElementById('navHome').addEventListener('click', ()=>{ if(activeScreen!='onboarding') activeScreen='home'; renderScreen(); });
    document.getElementById('navLearn').addEventListener('click', ()=>{ if(activeScreen!='onboarding') activeScreen='learn'; renderScreen(); });
    document.getElementById('navProgress').addEventListener('click', ()=>{ if(activeScreen!='onboarding') activeScreen='progress'; renderScreen(); });
    document.getElementById('navSettings').addEventListener('click', ()=>{ if(activeScreen!='onboarding') activeScreen='settings'; renderScreen(); });
    document.getElementById('profileHeaderBtn').addEventListener('click', ()=>{ if(activeScreen!='onboarding') activeScreen='settings'; renderScreen(); });

    // ---- shift+w screenshot ----
    window.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.key === 'W') {
            const phone = document.getElementById('phoneContainer');
            html2canvas?.(phone, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                const isDark = phone.classList.contains('dark');
                const num = isDark ? 6 : (screenshotCounter++);
                if (!isDark && screenshotCounter > 5) screenshotCounter = 1;
                link.download = (isDark ? '6' : num) + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(() => alert('html2canvas not loaded, but pretend screenshot'));
        }
    });

    // load html2canvas from CDN (quiet)
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    script.onload = ()=> console.log('screenshot ready');
    document.head.appendChild(script);

    // initial icons & render
    mountIcons();
    renderScreen();

    // also make sure if we click away from onboarding, bottom works
})();
</script>
<pre style="display:none;" id="jsonOutput"></pre>
<script>

    window.addEventListener('load', ()=>{
        const titles = {
            "1.png": "Start Learning",
            "2.png": "Daily Lessons",
            "3.png": "Practice Skills",
            "4.png": "Track Progress",
            "5.png": "Smart Settings",

        };
        const jsonOut = document.getElementById('jsonOutput');
        jsonOut.style.display = 'block';
        jsonOut.style.whiteSpace = 'pre-wrap';
        jsonOut.style.background = '#eee';
        jsonOut.style.padding = '10px';
        jsonOut.innerText = 'titles = ' + JSON.stringify(titles, null, 2);
    });
</script>
