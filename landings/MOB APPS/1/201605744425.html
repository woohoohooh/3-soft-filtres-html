<script>
    (function() {
        // ----- THEME & STATE -----
        const themeState = { dark: false };
        const container = document.getElementById('appScreen');
        const headerTitle = document.getElementById('headerTitle');
        const screenContent = document.getElementById('screenContent');
        const bottomNav = document.getElementById('bottomNav');
        const profileBtn = document.getElementById('profileBtn');
        const modalDiv = document.getElementById('modalContainer');

        // screens: onboarding, home, learn, progress, settings
        let currentScreen = 'onboarding';

        // icons (reusable)
        function iconTemplate(name) { /* not needed directly, we use inline in nav and later */ }

        // ----- helper: apply theme class -----
        function applyTheme() {
            if (themeState.dark) {
                document.documentElement.classList.add('dark-mode');
            } else {
                document.documentElement.classList.remove('dark-mode');
            }
            renderCurrentScreen(); // refresh UI with correct colors
        }

        function showModal(title, text) {
            modalDiv.classList.remove('hidden');

                <div class="modal">

                        <p style="margin-bottom:24px; font-size:14px;">${text}</p>
                        <button class="close-btn" id="closeModalBtn">Close</button>

                modalDiv.classList.add('hidden');
            });
        }

        // ----- RENDER SCREEN -----
        function renderOnboarding() {
            headerTitle.innerText = 'Welcome';
            bottomNav.classList.add('hidden');

                <div style="display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:36px;">

                    <p style="margin:20px 0; max-width:260px; color:var(--text-secondary);">Master Python through short exercises, real‑world projects and daily challenges.</p>
                    <button class="btn" id="getStartedBtn" style="width:100%;">Get Started</button>
                    <div style="margin-top:32px; display:flex; gap:24px;">
                        <span class="link" id="privacyLink">Privacy Policy</span>
                        <span class="link" id="termsLink">Terms of Service</span>
                    </div>
                </div>
            `;
            document.getElementById('getStartedBtn').addEventListener('click', ()=>{
                currentScreen = 'home';
                renderCurrentScreen();
            });
            document.getElementById('privacyLink').addEventListener('click', ()=> showModal('Privacy Policy', 'We respect your data. This is a demo.'));
            document.getElementById('termsLink').addEventListener('click', ()=> showModal('Terms of Service', 'Educational use only. No real data collected.'));
        }

        function renderHome() {
            headerTitle.innerText = 'Home';

            screenContent.innerHTML = `

                    <div class="flex-row"><span class="badge">STREAK 7 🔥</span><span>⭐ 340 XP</span></div>
                    <h2 style="margin:16px 0 4px;">Continue where you left</h2>
                    <p>Functions & Loops · 78%</p>
                    <div class="progress-bar" style="background:rgba(255,255,255,0.3);"><div class="progress-fill" style="width:78%; background:white;"></div></div>
                    <button class="btn" style="background:white; color:var(--primary); margin-top:16px;" id="resumeLessonBtn">Resume lesson</button>
                </div>

                        <div><strong>Error handling</strong><br>new</div>
                    </div>
                </div>
                <div class="card">
                    <span style="font-weight:600;">Suggested for you</span>
                    <div class="stat-grid">
                        <div class="stat-item"><svg width="28" height="28" stroke="var(--primary)" stroke-width="2"><polygon points="12 2 15 9 22 9 16 14 19 22 12 17 5 22 8 14 2 9 9 9 12 2"/></svg><span style="display:block;">Algorithms</span></div>
                        <div class="stat-item"><svg width="28" height="28" stroke="var(--primary)" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg><span>Projects</span></div>
                    </div>

            document.getElementById('resumeLessonBtn')?.addEventListener('click', ()=>{
                currentScreen = 'learn';
                renderCurrentScreen();
            });

        function renderLearn() {
            headerTitle.innerText = 'Practice';
            bottomNav.classList.remove('hidden');

            screenContent.innerHTML = `

            screenContent.innerHTML = `

                        <div style="height:45px; width:16px; background:var(--primary); border-radius:20px;"></div>
                        <div style="height:70px; width:16px; background:var(--primary); border-radius:20px;"></div>
                        <div style="height:30px; width:16px; background:var(--accent); border-radius:20px;"></div>
                        <div style="height:20px; width:16px; background:var(--accent); border-radius:20px;"></div>
                    </div>
                </div>
                <div class="stat-grid">
                    <div class="stat-item"><span style="font-size:28px;">34</span><span>lessons</span></div>

                </div>
                <div class="card">
                    <span style="font-weight:600;">Achievements</span>
                    <div style="display:flex; gap:24px; margin-top:16px;">

                        <svg width="42" stroke="silver"><circle cx="12" cy="8" r="4"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/></svg>
                        <svg width="42" stroke="#CD7F32"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                    </div>
                </div>
            `;
        }

        function renderSettings() {
            headerTitle.innerText = 'Settings';
            bottomNav.classList.remove('hidden');
            setActiveNav('settings');
            screenContent.innerHTML = `
                <div class="card">
                    <div class="flex-row" style="margin-bottom:20px;">
                        <span>Dark mode</span>
                        <label style="width:52px; height:28px; background:var(--icon-inactive); border-radius:40px; position:relative;">
                            <input type="checkbox" id="darkToggle" ${themeState.dark ? 'checked' : ''} style="opacity:0; width:0; height:0;">
                            <span style="display:block; width:24px; height:24px; background:white; border-radius:50%; position:absolute; top:2px; left:${themeState.dark ? '26px' : '2px'}; transition:0.1s; pointer-events:none;"></span>
                        </label>
                    </div>
                    <div class="flex-row"><span>Profile</span><span class="link">edit</span></div>
                    <div class="flex-row" style="margin-top:16px;"><span>Notifications</span><span class="link">on</span></div>
                </div>
                <div class="card">
                    <span style="font-weight:600;">Account</span>
                    <div style="margin-top:12px;"><span class="link">Email · demo@learnpy.io</span></div>
                    <div style="margin-top:8px;"><span class="link">Reset progress</span></div>
                </div>
            `;
            const toggle = document.getElementById('darkToggle');
            if (toggle) {
                toggle.addEventListener('change', (e) => {
                    themeState.dark = e.target.checked;
                    applyTheme();
                });
            }
        }

        function setActiveNav(tab) {
            document.querySelectorAll('.nav-item').forEach(el => {
                const data = el.getAttribute('data-tab');
                if (data === tab) el.classList.add('active');
                else el.classList.remove('active');
            });
        }

        function renderCurrentScreen() {
            if (currentScreen === 'onboarding') renderOnboarding();
            else if (currentScreen === 'home') renderHome();
            else if (currentScreen === 'learn') renderLearn();
            else if (currentScreen === 'progress') renderProgress();
            else if (currentScreen === 'settings') renderSettings();
        }

        // navigation
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const tab = e.currentTarget.getAttribute('data-tab');
                currentScreen = tab;
                renderCurrentScreen();
            });
        });

        // profile button -> open settings
        profileBtn.addEventListener('click', ()=>{
            currentScreen = 'settings';
            renderCurrentScreen();
        });

        // initial render
        applyTheme();
        renderCurrentScreen();

        // ---- screenshot feature (SHIFT+W) ----
        let screenshotCounter = 1;
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                const phone = document.getElementById('phoneContainer');
                const isDark = themeState.dark;
                const filename = isDark ? '6.png' : (screenshotCounter + '.png');
                if (!isDark) {
                    if (screenshotCounter < 6) screenshotCounter++;
                    else screenshotCounter = 1;
                }
                // actual screenshot capture is not possible via pure html, but we simulate:
                alert(`📸 Screenshot saved as ${filename} (simulated)`);
            }
        });
    })();
