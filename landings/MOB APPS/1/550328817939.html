```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VocabVault · English builder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1e1e2f; /* outer bezel */
      padding: 12px;
    }

    /* phone container */
    .phone {
      width: 360px;
      height: 780px;
      background-color: var(--bg-primary);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2c2c3a;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s;
    }

    /* themes */
    :root {
      --bg-primary: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --border-light: #E2E8F0;
      --primary: #2563EB;
      --primary-dark: #1E40AF;
      --accent: #38BDF8;
      --inactive-icon: #94A3B8;
      --nav-bg: #FFFFFF;
      --header-icon: #334155;
      --progress-bg: #E2E8F0;
    }

    .dark-mode {
      --bg-primary: #0F172A;
      --card-bg: #1E293B;
      --text-primary: #E2E8F0;
      --text-secondary: #CBD5E1;
      --border-light: #334155;
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --accent: #38BDF8;
      --inactive-icon: #64748B;
      --nav-bg: #1E293B;
      --header-icon: #E2E8F0;
      --progress-bg: #334155;
    }

    /* main flex column */
    .app-screen {
      flex: 1;
      display: flex;
;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px 16px 8px 16px;
      scrollbar-width: thin;
      background: var(--bg-primary);
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-shrink: 0;
    }
    .header h2 {
      font-size: 1.6rem;
      font-weight: 650;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }
    .profile-icon {
      cursor: pointer;
      padding: 8px;
      border-radius: 12px;
      transition: background 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .profile-icon:hover { background: var(--border-light); }
    .profile-icon svg { width: 28px; height: 28px; stroke: var(--header-icon); stroke-width: 2; fill: none; }

    /* bottom navigation */
    .bottom-nav {
      height: 70px;
      background: var(--nav-bg);
      border-top: 1px solid var(--border-light);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 4px 8px;
      flex-shrink: 0;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: transform 0.15s ease;
      color: var(--inactive-icon);
      fill: none;
      stroke: var(--inactive-icon);
      font-size: 0.7rem;
      font-weight: 500;
    }
    .nav-item.active {
      transform: scale(1.05);
      color: var(--primary);
      stroke: var(--primary);
    }
    .nav-item.active .nav-icon {
      stroke: var(--primary);
      filter: drop-shadow(0 0 4px rgba(37,99,235,0.3));
    }
    .nav-icon {
      width: 24px;
      height: 24px;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.1s;
    }
    .nav-label {
      font-size: 11px;
      font-weight: 600;
    }

    /* common components */
    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 18px 16px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.02);
      margin-bottom: 16px;
      border: 1px solid var(--border-light);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1.2rem;
      width: 100%;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 8px 18px rgba(37,99,235,0.25);
    }
    .btn-primary:hover { background: var(--primary-dark); transform: scale(0.98); }

    .row-space { display: flex; justify-content: space-between; align-items: center; margin: 12px 0; }
    .progress-bar {
      height: 8px;
      background: var(--progress-bg);
      border-radius: 40px;
      overflow: hidden;
      width: 100%;
    }
    .progress-fill {
      height: 100%;
      width: 60%;
      background: var(--primary);
      border-radius: 40px;
    }

    .badge {
      background: var(--accent);
      color: #0F172A;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 40px;
      font-size: 0.75rem;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 32px;
      width: 280px;
      text-align: center;
      color: var(--text-primary);
      border: 1px solid var(--border-light);
    }

    .icon-micro { width: 20px; height: 20px; stroke-width: 2; fill: none; stroke: currentColor; }
    .link { color: var(--primary); text-decoration: underline; cursor: pointer; margin: 0 8px; font-size: 0.85rem;}

    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="phone" id="phoneContainer">
  <!-- dynamic screen content -->
  <div id="screenRoot" class="app-screen"></div>
  <!-- bottom nav -->
  <div class="bottom-nav" id="bottomNav">
    <div class="nav-item" data-tab="home"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 10L12 3L21 10L21 20H3V10Z" stroke="currentColor" /><path d="M9 20V14H15V20" stroke="currentColor"/></svg><span class="nav-label">Home</span></div>
    <div class="nav-item" data-tab="learn"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M2 3H8C9.1 3 10 3.9 10 5V20L6 17L2 20V5C2 3.9 2.9 3 4 3Z" stroke="currentColor"/><path d="M22 3H16C14.9 3 14 3.9 14 5V20L18 17L22 20V5C22 3.9 21.1 3 20 3Z" stroke="currentColor"/></svg><span class="nav-label">Learn</span></div>
    <div class="nav-item" data-tab="progress"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 12V19C21 20.1 20.1 21 19 21H5C3.9 21 3 20.1 3 19V5C3 3.9 3.9 3 5 3H12" stroke="currentColor"/><path d="M15 9L21 3" stroke="currentColor"/><circle cx="12" cy="12" r="2" stroke="currentColor"/><path d="M18 7L21 4" stroke="currentColor"/></svg><span class="nav-label">Progress</span></div>
    <div class="nav-item" data-tab="settings"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor"/><path d="M19.4 15L20.6 17.2L17.2 20.6L15 19.4C13.8 20.2 12.4 20.2 11.2 19.4L9 20.6L5.6 17.2L6.8 15C6 13.8 6 12.4 6.8 11.2L5.6 9L9 5.6L11.2 6.8C12.4 6 13.8 6 15 6.8L17.2 5.6L20.6 9L19.4 11.2C20.2 12.4 20.2 13.8 19.4 15Z" stroke="currentColor"/></svg><span class="nav-label">Settings</span></div>
  </div>
</div>

<script>
(function(){
  // ---------- THEME / ICONS / STATE ----------
  let currentTheme = 'light';
  let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
  let screenshotCounter = 1; // for shift+w

  const root = document.getElementById('screenRoot');
  const phone = document.getElementById('phoneContainer');
  const navItems = document.querySelectorAll('.nav-item');

  // ---- inline svg icons (reusable) ----
  const icons = {
    profile: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20C4 17 8 16 12 16C16 16 20 17 20 20" stroke-linecap="round"/><circle cx="12" cy="8" r="4"/></svg>',
    chart: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 21H4V4"/><path d="M7 15L10 10L13 13L18 7"/></svg>',
    flashcards: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 7H16"/><path d="M8 12H14"/><path d="M8 17H12"/></svg>',
    play: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M10 8L16 12L10 16V8Z"/></svg>',
    check: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17L4 12"/></svg>',
    lesson: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3H8C9.1 3 10 3.9 10 5V20L6 17L2 20V5C2 3.9 2.9 3 4 3Z"/><path d="M22 3H16C14.9 3 14 3.9 14 5V20L18 17L22 20V5C22 3.9 21.1 3 20 3Z"/></svg>',
  };

  // ---- helpers ----
  function setTheme(mode) {
    if (mode === 'dark') phone.classList.add('dark-mode');
    else phone.classList.remove('dark-mode');
    currentTheme = mode;
  }

  // modals
  function showModal(text) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `<div class="modal-content"><p>${text}</p><br><button class="btn-primary" style="padding:10px;" id="closeModal">OK</button></div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#closeModal').addEventListener('click', ()=> overlay.remove());
  }

  // ---- screen rendering ----
  function renderScreen(name) {
    let html = '';
    // common header
    const headerTitle = {
      onboarding: 'VocabVault', home: 'Home', learn: 'Learn', progress: 'Progress', settings: 'Settings'
    }[name] || 'VocabVault';

    html += `<div class="header"><h2>${headerTitle}</h2><div class="profile-icon" id="profileBtn">${icons.profile}</div></div>`;

    if (name === 'onboarding') {
      html += `
        <div class="card" style="text-align:center; padding:32px 20px;">
          <div style="background:#2563EB20; width:80px; height:80px; border-radius:30px; margin:0 auto 16px; display:flex; align-items:center; justify-content:center;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2"><path d="M4 4H20V20H4V4Z"/><path d="M8 8H16V16H8V8Z"/></svg>
          </div>
          <h1 style="font-size:2.1rem; color:var(--primary);">VocabVault</h1>
          <p style="font-size:1.2rem; margin:8px 0; font-weight:500;">build English, one word a day</p>
          <p style="color:var(--text-secondary); margin:16px 0 24px;">Master 5000+ words with smart flashcards & daily challenges.</p>
          <button class="btn-primary" id="getStartedBtn">Get Started →</button>
          <div style="margin-top:24px;">
            <span class="link" id="privacyLink">Privacy Policy</span> · <span class="link" id="termsLink">Terms of Service</span>
          </div>
        </div>
      `;
    }
    else if (name === 'home') {
      html += `
        <div class="card">
          <div style="display:flex; justify-content:space-between;"><span><strong>👋 Welcome back, Alex</strong></span><span class="badge">streak 12d</span></div>
          <div style="margin: 16px 0 8px;"><span>Daily goal: 20 words</span><span style="float:right;">15/20</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:75%;"></div></div>
        </div>
        <div class="card">
          <div style="display:flex; gap:16px; align-items:center;">${icons.flashcards}<span style="font-weight:700;">Flashcards</span></div>
          <div class="row-space"><span>Academic words</span><span>82% mastered</span></div><div class="progress-bar"><div class="progress-fill" style="width:82%"></div></div>
          <div class="row-space"><span>Idioms</span><span>34%</span></div><div class="progress-bar"><div class="progress-fill" style="width:34%"></div></div>
          <button class="btn-primary" style="margin-top:16px; padding:12px;" id="quickPractice">${icons.play}  quick practice</button>
        </div>
        <div class="card" style="display:flex; gap:12px; align-items:center;">
          ${icons.chart} <span><strong>Weekly progress</strong> +23%</span>
        </div>
      `;
    }
    else if (name === 'learn') {
      html += `
        <div class="card">
          <h3 style="margin-bottom:12px;">Today’s lessons</h3>
          <div style="display:flex; gap:16px; align-items:center; margin-bottom:16px;">${icons.lesson} <span><strong>Business English</strong> 8 min</span></div>
          <div style="display:flex; gap:16px; align-items:center; margin-bottom:16px;">${icons.flashcards} <span><strong>Irregular verbs</strong> 12 cards</span></div>
          <div style="display:flex; gap:16px; align-items:center;">${icons.play} <span><strong>Listening quiz</strong> 5 questions</span></div>
          <button class="btn-primary" style="margin-top:16px; padding:12px;" id="startLessonBtn">Start lesson</button>
        </div>
      `;
    }
    else if (name === 'progress') {
      html += `
        <div class="card">
          <div class="stat-grid">
            <div style="background:var(--primary); padding:16px; border-radius:20px; color:white;"><strong>430</strong><br>words</div>
            <div style="background:var(--accent); padding:16px; border-radius:20px;"><strong>12</strong><br>streak</div>
            <div style="background:var(--card-bg); border:1px solid var(--border-light); padding:16px; border-radius:20px;"><strong>3</strong><br>badges</div>
            <div style="background:var(--card-bg); border:1px solid var(--border-light); padding:16px; border-radius:20px;"><strong>58%</strong><br>fluency</div>
          </div>
          <div style="margin:8px 0;">${icons.chart} master chart</div>
          <div style="height:70px; display:flex; align-items:baseline; gap:6px; margin:10px 0;">
            <div style="width:20px; height:30px; background:var(--primary); border-radius:8px;"></div><div style="width:20px; height:55px; background:var(--primary); border-radius:8px;"></div><div style="width:20px; height:40px; background:var(--primary); border-radius:8px;"></div><div style="width:20px; height:70px; background:var(--primary-dark); border-radius:8px;"></div><div style="width:20px; height:45px; background:var(--primary); border-radius:8px;"></div>
          </div>
          <p>Last month +210 words</p>
        </div>
      `;
    }
    else if (name === 'settings') {
      html += `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
            <span>🌓 Dark mode</span>
            <label><input type="checkbox" id="darkModeToggle" ${currentTheme==='dark'? 'checked':''}></label>
          </div>
          <div style="display:flex; gap:20px; margin-top:16px;"><span>🔔 Notifications</span> <span>on</span></div>
          <div style="display:flex; gap:20px; margin:16px 0;"><span>🔤 Language</span> <span>English</span></div>
          <div class="link" id="privacySetting">Privacy Policy</div><div class="link" id="termsSetting">Terms</div>
          <hr style="margin:16px 0; border-color:var(--border-light);">
          <div class="profile-icon" style="justify-content:left;">${icons.profile} Profile details</div>
        </div>
      `;
    }

    root.innerHTML = html;

    // attach events after render
    if (name === 'onboarding') {
      document.getElementById('getStartedBtn')?.addEventListener('click', ()=>{
        currentScreen = 'home'; renderScreen('home'); setActiveTab('home');
      });
      document.getElementById('privacyLink')?.addEventListener('click', ()=> showModal('Privacy: we protect your data.'));
      document.getElementById('termsLink')?.addEventListener('click', ()=> showModal('Terms: use respectfully.'));
    }
    if (name === 'settings') {
      const toggle = document.getElementById('darkModeToggle');
      if (toggle) toggle.addEventListener('change', (e) => setTheme(e.target.checked ? 'dark' : 'light'));
      document.getElementById('privacySetting')?.addEventListener('click', ()=> showModal('Privacy policy · last updated 2026'));
      document.getElementById('termsSetting')?.addEventListener('click', ()=> showModal('Terms of Service · fair use'));
    }
    document.getElementById('profileBtn')?.addEventListener('click', ()=>{
      currentScreen = 'settings'; renderScreen('settings'); setActiveTab('settings');
    });
    document.getElementById('quickPractice')?.addEventListener('click', ()=> showModal('Starting vocabulary drill!'));
    document.getElementById('startLessonBtn')?.addEventListener('click', ()=> showModal('Lesson: business idioms.'));
  }

  function setActiveTab(tabId) {
    navItems.forEach(item => {
      const tab = item.dataset.tab;
      if (tab === tabId) item.classList.add('active');
      else item.classList.remove('active');
    });
  }

  // bottom nav listeners
  navItems.forEach(item => {
    item.addEventListener('click', (e) => {
      const tab = item.dataset.tab;
      currentScreen = tab;
      renderScreen(tab);
      setActiveTab(tab);
    });
  });

  // initial render onboarding
  renderScreen('onboarding');
  setActiveTab('none'); // no active

  // ---------- SHIFT + W screenshot feature ----------
  window.addEventListener('keydown', (e) => {
    if (e.shiftKey && e.key === 'W') {
      e.preventDefault();
      import('https://html2canvas.hertzen.com/dist/html2canvas.min.js').then(() => {
        html2canvas(phone, { scale: 2, backgroundColor: null }).then(canvas => {
          const link = document.createElement('a');
          let filename = currentTheme === 'dark' ? '6.png' : (screenshotCounter + '.png');
          if (currentTheme === 'dark') filename = '6.png';
          else if (screenshotCounter <=5) filename = screenshotCounter + '.png';
          else filename = '1.png'; // fallback
          link.download = filename;
          link.href = canvas.toDataURL('image/png');
          link.click();
          if (currentTheme !== 'dark' && screenshotCounter <5) screenshotCounter++;
        });
      }).catch(()=> alert('html2canvas load failed, but screenshot simulation.'));
    }
  });

  // final JSON (will be printed after)
  window.__jsonOutput = {
    "1.png": "Start Learning",
    "2.png": "Daily Lessons",
    "3.png": "Practice Skills",
    "4.png": "Track Progress",
    "5.png": "Smart Settings",
    "6.png": "Dark Theme"
  };

})();
</script>
<!-- plain JSON output -->
<pre style="display:none;">{
  "1.png": "Start Learning",
  "2.png": "Daily Lessons",
  "3.png": "Practice Skills",
  "4.png": "Track Progress",
  "5.png": "Smart Settings",
  "6.png": "Dark Theme"
}</pre>
</body>
</html>
All done!
