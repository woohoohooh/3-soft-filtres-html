        .light {

            --accent: #38BDF8;
            --inactive: #94A3B8;
            --header-shadow: 0 2px 8px rgba(0,0,0,0.02);

        .dark {

<body>
<div class="phone-frame light" id="phoneFrame">
    <div class="app-screen" id="appScreen">
        <!-- header will be injected per screen -->
        <div id="headerPlaceholder"></div>
        <!-- main content -->
        <div id="contentArea" class="content"></div>
        <!-- bottom nav -->
        <div class="bottom-nav" id="bottomNav"></div>

</div>

<!-- hidden modal container -->
<div id="modalContainer" class="modal hidden"></div>

<script>
    (function() {
        // ---------- THEME ----------
        const frame = document.getElementById('phoneFrame');
        let currentTheme = 'light';

        // ---------- ICON SET (inline SVG, same style) ----------
        function iconHome(active = false) { return `<svg class="icon" viewBox="0 0 24 24"><path d="M5 12H3L12 3L21 12H19" stroke="currentColor" fill="none"/><path d="M5 12V19H9V14H15V19H19V12" stroke="currentColor" fill="none"/></svg>`; }
        function iconLearn(active = false) { return `<svg class="icon" viewBox="0 0 24 24"><path d="M2 3H8C9.1 3 10 3.9 10 5V19C10 20.1 9.1 21 8 21H2V3Z" stroke="currentColor" fill="none"/><path d="M22 3H16C14.9 3 14 3.9 14 5V19C14 20.1 14.9 21 16 21H22V3Z" stroke="currentColor" fill="none"/><line x1="10" y1="7" x2="14" y2="7" stroke="currentColor"/><line x1="10" y1="12" x2="14" y2="12" stroke="currentColor"/><line x1="10" y1="17" x2="14" y2="17" stroke="currentColor"/></svg>`; }
        function iconProgress(active = false) { return `<svg class="icon" viewBox="0 0 24 24"><path d="M21 12C21 13.2 20.5 14.2 19.7 15.1C18.9 15.9 17.8 16.5 16.5 16.8C15.2 17.1 13.8 17.1 12.1 16.9" stroke="currentColor" fill="none"/><path d="M3 12C3 14.4 4 16.5 5.7 18.2C7.4 19.9 9.6 21 12 21C14.4 21 16.5 20 18.2 18.3" stroke="currentColor" fill="none"/><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><path d="M12 7V12L15 15" stroke="currentColor" fill="none"/></svg>`; }
        function iconSettings(active = false) { return `<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor" fill="none"/><path d="M19.4 15C19 15.6 18.7 16.2 18.2 16.7L19 18.5L17.5 20L15.7 19.2C15.1 19.6 14.5 19.9 13.8 20.1L13 22H11L10.2 20.1C9.5 19.9 8.9 19.6 8.3 19.2L6.5 20L5 18.5L5.8 16.7C5.4 16.1 5.1 15.5 4.9 14.8L3 14V12L4.9 11.2C5.1 10.5 5.4 9.9 5.8 9.3L5 7.5L6.5 6L8.3 6.8C8.9 6.4 9.5 6.1 10.2 5.9L11 4H13L13.8 5.9C14.5 6.1 15.1 6.4 15.7 6.8L17.5 6L19 7.5L18.2 9.3C18.6 9.9 19 10.5 19.2 11.2L21 12V14L19.4 15Z" stroke="currentColor" fill="none"/></svg>`; }
        function iconProfile() { return `<svg class="icon" viewBox="0 0 24 24"><path d="M20 21V19C20 17.9 19.1 17 18 17H6C4.9 17 4 17.9 4 19V21" stroke="currentColor" fill="none"/><circle cx="12" cy="7" r="4" stroke="currentColor" fill="none"/></svg>`; }
        function iconLesson() { return `<svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5C4 18.8 4.5 18 5.5 18H19" stroke="currentColor" fill="none"/><path d="M8 4H18C19.1 4 20 4.9 20 6V18H6C4.9 18 4 17.1 4 16V6C4 4.9 4.9 4 6 4H7" stroke="currentColor" fill="none"/><line x1="8" y1="10" x2="16" y2="10" stroke="currentColor"/><line x1="8" y1="14" x2="12" y2="14" stroke="currentColor"/></svg>`; }
        function iconChart() { return `<svg class="icon" viewBox="0 0 24 24"><path d="M21 21H3V3" stroke="currentColor" fill="none"/><path d="M7 15V17" stroke="currentColor"/><path d="M11 11V17" stroke="currentColor"/><path d="M15 8V17" stroke="currentColor"/><path d="M19 5V17" stroke="currentColor"/></svg>`; }
        function iconFlashcard() { return `<svg class="icon" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" fill="none"/><line x1="9" y1="7" x2="15" y2="7" stroke="currentColor"/><line x1="9" y1="11" x2="15" y2="11" stroke="currentColor"/><line x1="9" y1="15" x2="13" y2="15" stroke="currentColor"/></svg>`; }
        function iconPlay() { return `<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><polygon points="10,8 16,12 10,16" stroke="currentColor" fill="none"/></svg>`; }
        function iconCheck() { return `<svg class="icon" viewBox="0 0 24 24"><path d="M20 6L9 17L4 12" stroke="currentColor" fill="none"/></svg>`; }

        // ---------- SCREENS DATA ----------
        let currentScreen = 'onboarding';

        // ---------- RENDER HEADER ----------
        function renderHeader(title) {
            return `
                <div class="header">
                    <h1>${title}</h1>
                    <button class="profile-btn" id="profileIconBtn">${iconProfile()}</button>
                </div>
            `;
        }

        // ---------- BOTTOM NAV (except onboarding) ----------
        function renderBottomNav(activeId) {
            const items = [
                { id: 'home', label: 'Home', icon: iconHome },
                { id: 'learn', label: 'Learn', icon: iconLearn },
                { id: 'progress', label: 'Progress', icon: iconProgress },
                { id: 'settings', label: 'Settings', icon: iconSettings }
            ];
            let html = '';
            items.forEach(item => {
                const activeClass = (item.id === activeId) ? 'active' : '';
                html += `<button class="nav-item ${activeClass}" data-nav="${item.id}">${item.icon()} <span class="nav-label">${item.label}</span></button>`;
            });
            return html;
        }

        // ---------- MODAL ----------
        function showModal(title, content) {
            const modal = document.getElementById('modalContainer');
            modal.innerHTML = `
                <div class="modal-card">
                    <h3 style="margin-bottom: 16px;">${title}</h3>
                    <p style="margin-bottom: 24px;">${content}</p>
                    <button class="btn" id="closeModalBtn">Close</button>
                </div>
            `;
            modal.classList.remove('hidden');
            document.getElementById('closeModalBtn').addEventListener('click', () => {
                modal.classList.add('hidden');
            });
        }

        // ---------- SCREEN BUILDERS ----------
        function getOnboardingScreen() {
            return {
                header: 'Welcome',
                content: `
                    <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; margin-top: 30px;">
                        <div style="background: var(--primary); width: 70px; height: 70px; border-radius: 20px; display: flex; align-items: center; justify-content: center; color: white;">${iconFlashcard()}</div>
                        <h2 style="font-size: 36px; font-weight: 700; color: var(--text-primary);">Python Pal</h2>
                        <p style="font-size: 18px; color: var(--primary);">learn to code in 2026</p>
                        <p style="color: var(--text-secondary); max-width: 260px;">Bite-sized Python exercises, real-time feedback, and mastery badges.</p>
                        <button class="btn" id="getStartedBtn" style="margin-top: 20px;">Get Started</button>
                        <div style="margin-top: 24px;">
                            <a href="#" class="small-link" id="privacyLink">Privacy Policy</a> · 
                            <a href="#" class="small-link" id="termsLink">Terms of Service</a>
                        </div>
                    </div>
                `,
                bottomNav: false
            };
        }

        function getHomeScreen() {
            return {
                header: 'Home',
                content: `
                    <div class="card">
                        <div class="row"><span style="font-weight:600;">🔥 12 day streak</span> <span>🏆 340 XP</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:68%"></div></div>
                        <p>Next badge: ⚡ Quick learner</p>
                    </div>
                    <div class="card">
                        <h3 style="margin-bottom: 12px;">Today’s pick</h3>
                        <div style="display:flex; gap:16px; align-items:center;">
                            ${iconLesson()} <span><strong>Lists & loops</strong> — 8 min left</span>
                        </div>
                        <button class="btn btn-outline" style="margin-top:16px;" id="continueLessonBtn">continue</button>
                    </div>
                    <div class="badge-grid">
                        <div class="badge">${iconCheck()} Hello World</div>
                        <div class="badge">${iconFlashcard()} 5 days</div>
                        <div class="badge">${iconPlay()} 3 exercises</div>
                    </div>
                `,
                bottomNav: 'home'
            };
        }

        function getLearnScreen() {
            return {
                header: 'Learn',
                content: `
                    <div class="card" style="cursor:pointer;" id="openPractice">
                        <div style="display:flex; gap:16px;">
                            ${iconPlay()} <div><strong>Python Basics I</strong><br><span style="font-size:14px;">5 lessons · 40 XP</span></div>
                        </div>
                        <div class="progress-bar"><div class="progress-fill" style="width:40%"></div></div>
                    </div>
                    <div class="card">
                        <div style="display:flex; gap:16px;">
                            ${iconLesson()} <div><strong>Functions & scope</strong><br><span style="font-size:14px;">3 lessons · 60 XP</span></div>
                        </div>
                    </div>
                    <div class="card">
                        <div style="display:flex; gap:16px;">
                            ${iconFlashcard()} <div><strong>OOP sneak peek</strong><br><span style="font-size:14px;">4 flashcards</span></div>
                        </div>
                    </div>
                `,
                bottomNav: 'learn'
            };
        }

        function getProgressScreen() {
            return {
                header: 'Progress',
                content: `
                    <div class="card">
                        <h3>Weekly activity</h3>
                        ${iconChart()}
                        <div style="display:flex; gap:4px; margin: 12px 0;">
                            <span style="background:var(--primary); width:18px; height:40px; border-radius:8px;"></span>
                            <span style="background:var(--primary); width:18px; height:70px; border-radius:8px;"></span>
                            <span style="background:var(--primary); width:18px; height:50px; border-radius:8px;"></span>
                            <span style="background:var(--primary); width:18px; height:90px; border-radius:8px;"></span>
                            <span style="background:var(--primary); width:18px; height:60px; border-radius:8px;"></span>
                        </div>
                        <p>Completed: 43 exercises</p>
                    </div>
                    <div class="card">
                        <span>⭐ Mastery: Variables · 80%</span><div class="progress-bar"><div class="progress-fill" style="width:80%"></div></div>
                        <span>⭐ Lists · 45%</span><div class="progress-bar"><div class="progress-fill" style="width:45%"></div></div>
                    </div>
                `,
                bottomNav: 'progress'
            };
        }

        function getSettingsScreen() {
            return {
                header: 'Settings',
                content: `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span>🌙 Dark mode</span>
                            <button class="btn-outline" style="padding:8px 16px;" id="themeToggleBtn">toggle</button>
                        </div>
                        <hr style="margin:16px 0; border-color:var(--border-light);">
                        <div>Notifications</div>
                        <div style="margin-top:20px;">👤 Profile: Alex C.</div>
                        <div style="margin-top:20px;">${iconProfile()} Account details</div>
                    </div>
                `,
                bottomNav: 'settings'
            };
        }

        // ---------- RENDER APP ----------
        function navigateTo(screenId) {
            currentScreen = screenId;
            let screenData;
            if (screenId === 'onboarding') screenData = getOnboardingScreen();
            else if (screenId === 'home') screenData = getHomeScreen();
            else if (screenId === 'learn') screenData = getLearnScreen();
            else if (screenId === 'progress') screenData = getProgressScreen();
            else if (screenId === 'settings') screenData = getSettingsScreen();

            document.getElementById('headerPlaceholder').innerHTML = renderHeader(screenData.header);
            document.getElementById('contentArea').innerHTML = screenData.content;
            const navContainer = document.getElementById('bottomNav');
            if (screenData.bottomNav === false) {
                navContainer.innerHTML = ''; // onboarding has no bottom nav
            } else {
                navContainer.innerHTML = renderBottomNav(screenData.bottomNav);
                // attach nav listeners
                document.querySelectorAll('.nav-item').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const navId = btn.dataset.nav;
                        if (navId) navigateTo(navId);
                    });
                });
            }

            // extra interactions
            if (screenId === 'onboarding') {
                document.getElementById('getStartedBtn').addEventListener('click', () => navigateTo('home'));
                document.getElementById('privacyLink').addEventListener('click', (e) => { e.preventDefault(); showModal('Privacy Policy', 'We protect your data like a python.')});
                document.getElementById('termsLink').addEventListener('click', (e) => { e.preventDefault(); showModal('Terms of Service', 'Keep learning, be kind.')});
            }
            if (screenId === 'home' && document.getElementById('continueLessonBtn')) {
                document.getElementById('continueLessonBtn').addEventListener('click', () => navigateTo('learn'));
            }
            if (screenId === 'learn' && document.getElementById('openPractice')) {
                document.getElementById('openPractice').addEventListener('click', () => showModal('Practice', 'Start “Python Basics I”?'));
            }
            if (screenId === 'settings' && document.getElementById('themeToggleBtn')) {
                document.getElementById('themeToggleBtn').addEventListener('click', () => {
                    if (currentTheme === 'light') {
                        frame.classList.remove('light'); frame.classList.add('dark'); currentTheme = 'dark';
                    } else { frame.classList.remove('dark'); frame.classList.add('light'); currentTheme = 'light'; }
                });
            }

            // profile click listener
            document.getElementById('profileIconBtn')?.addEventListener('click', () => navigateTo('settings'));
        }

        // initial render
        navigateTo('onboarding');

        // ---------- SCREENSHOT FEATURE (shift+W) ----------
        let screenshotCounter = 1;
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') {
                e.preventDefault();
                const phone = document.getElementById('phoneFrame');
                html2canvas?.(phone, { scale: 2 }).then(canvas => {
                    const link = document.createElement('a');
                    let filename = currentTheme === 'dark' ? '6.png' : (screenshotCounter + '.png');
                    if (currentTheme === 'dark') filename = '6.png';
                    else if (screenshotCounter <=5) filename = screenshotCounter + '.png';
                    else filename = '1.png';
                    link.download = filename;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    if (currentTheme !== 'dark' && screenshotCounter < 5) screenshotCounter++;
                }).catch(() => alert('html2canvas not loaded — but shift+W works!'));
            }
        });

        // simulate html2canvas (minimal polyfill for demo — just download placeholder)
        window.html2canvas = function(el) { 
            return new Promise(res => {
                const canvas = document.createElement('canvas');
                canvas.width = 360; canvas.height = 780;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = currentTheme==='dark'?'#0F172A':'#F8FAFC'; ctx.fillRect(0,0,360,780);
                ctx.fillStyle = '#2563EB'; ctx.font = 'bold 20px sans'; ctx.fillText('Python Pal', 40,360);
                res(canvas);
            });
        };
    })();
</script>
<!-- html2canvas placeholder will use built-in mock -->
</body>
</html>
