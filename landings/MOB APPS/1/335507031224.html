```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Brain Trainer • 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* CSS variables – light default */
        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #334155;
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --accent: #38BDF8;
            --inactive: #94A3B8;
            --border: #E2E8F0;
            --highlight: #EFF6FF;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
        }

        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #CBD5E1;
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #38BDF8;
            --inactive: #64748B;
            --border: #334155;
            --highlight: #1E3A5F;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }

        body {
            background: #1a1e2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* phone container */
        .phone {
            width: 360px;
            height: 780px;
            background: var(--bg);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.1);
            transition: background 0.2s;
        }

        /* app screens container */
        .screen-container {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: none;
            padding: 16px 16px 8px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .screen-container::-webkit-scrollbar { display: none; }

        /* header – common */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }
        .header h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.02em;
        }
        .profile-icon {
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
            transition: background 0.1s;
        }
        .profile-icon:hover { background: var(--highlight); }
        .profile-icon svg { display: block; }

        /* bottom navigation */
        .bottom-nav {
            background: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px;
            height: 70px;
            box-shadow: 0 -4px 6px -1px rgba(0,0,0,0.02);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: transparent;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            color: var(--inactive);
            fill: var(--inactive);
        }
        .nav-item.active {
            color: var(--primary);
            fill: var(--primary);
            background: var(--highlight);
            transform: scale(1.05);
        }
        .nav-item.active svg {
            stroke: var(--primary);
        }
        .nav-item svg {
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.1s;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* cards / UI elements */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 20px;
            box-shadow: var(--shadow);
        }
        .flex-row {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 20px;
            margin: 12px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            border-radius: 20px;
            transition: width 0.4s ease;
        }
        .badge {
            background: var(--accent);
            color: #0F172A;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
        }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.1s, transform 0.1s;
            width: 100%;
            text-align: center;
        }
        .btn:active { transform: scale(0.98); background: var(--primary-dark); }
        .link-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 20px 0 10px;
            font-size: 14px;
        }
        .link-row span {
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
        }

        /* modal overlay */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card);
            padding: 28px;
            border-radius: 40px;
            width: 280px;
            text-align: center;
            color: var(--text);
            box-shadow: 0 30px 40px black;
        }

        /* lesson list */
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .lesson-icon svg { stroke: var(--primary); }

        /* hidden canvas for screenshot */
        #shot-canvas { display: none; }

        /* small chart simulation */
        .chart-row {
            display: flex;
            align-items: flex-end;
            height: 100px;
            gap: 10px;
            margin: 20px 0;
        }
        .bar {
            width: 22px;
            background: var(--primary);
            border-radius: 12px 12px 4px 4px;
            height: 0;
            transition: height 0.6s ease;
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- dynamic screens injected via JS -->
    <div id="app" class="screen-container"></div>
    <!-- bottom nav fixed -->
    <div class="bottom-nav" id="bottomNav"></div>
</div>

<!-- hidden canvas for screenshot -->
<canvas id="shot-canvas" width="360" height="780"></canvas>

<script>
    (function(){
        // ---------- THEME & STATE ----------
        let currentTheme = 'light';
        let currentScreen = 'onboarding'; // onboarding, home, learn, progress, settings
        let modals = { privacy: false, terms: false };
        let screenshotCounter = 1;

        // ---------- ICON SYSTEM (inline svg, outline 2px) ----------
        const icons = {
            home: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10L12 3L21 10V20H15V14H9V20H3V10Z"/></svg>`,
            learn: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 6L12 2L22 6L12 10L2 6Z M2 6V16M22 6V16 M8 12L4 14 M16 12L20 14"/></svg>`,
            progress: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7V12L15 15"/></svg>`,
            settings: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15L17.5 17.9M4.6 9L6.5 6.1M6.5 17.9L4.6 15M17.5 6.1L19.4 9M9 4.6L12 2L15 4.6M15 19.4L12 22L9 19.4M19.4 9L22 12L19.4 15M4.6 15L2 12L4.6 9"/></svg>`,
            profile: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M5 20V19C5 14.5 7 12 12 12C17 12 19 14.5 19 19V20"/></svg>`,
            lesson: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 10H16M8 14H13"/></svg>`,
            chart: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 21H4V3M7 15L10 9L13 12L18 6"/></svg>`,
            flashcards: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 8H15M9 12H15M9 16H13"/></svg>`,
            play: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M10 8L16 12L10 16V8Z"/></svg>`,
            check: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17L4 12"/></svg>`,
        };

        // ---------- HELPERS ----------
        function setTheme(theme) {
            document.body.classList.toggle('dark', theme === 'dark');
            currentTheme = theme;
            render();
        }

        // modal controls
        function openModal(type) { modals[type] = true; render(); }
        function closeModal() { modals.privacy = false; modals.terms = false; render(); }

        // navigation
        function goTo(screen) {
            currentScreen = screen;
            render();
        }

        // profile icon click -> settings
        function onProfileClick() { goTo('settings'); }

        // ---------- SCREEN RENDERERS ----------
        function renderOnboarding() {
            return `
                <div class="card" style="text-align: center; margin-top: 40px;">
                    <div style="margin-bottom: 24px;">${icons.flashcards.replace('24','56')}</div>
                    <h1 style="font-size: 44px; font-weight: 800; color: var(--primary);">🧮 Math<br>Brain</h1>
                    <p style="font-size: 22px; font-weight: 600; margin: 16px 0 8px;">trainer · 2026</p>
                    <p style="color: var(--text-light); margin-bottom: 32px;">Sharpen your mental math in 5 minutes a day. Bite-sized challenges for everyone.</p>
                    <button class="btn" onclick="window.goTo('home')">Get Started →</button>
                    <div class="link-row">
                        <span onclick="window.openModal('privacy')">Privacy Policy</span>
                        <span onclick="window.openModal('terms')">Terms of Service</span>
                    </div>
                </div>
            `;
        }

        function renderHome() {
            return `
                <div class="header">
                    <h2>Dashboard</h2>
                    <div class="profile-icon" onclick="window.onProfileClick()">${icons.profile}</div>
                </div>
                <div class="card">
                    <div class="flex-row" style="justify-content: space-between;">
                        <span style="font-weight: 600; font-size: 18px;">🔥 streak 12 days</span>
                        <span class="badge">level 4</span>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" style="width:64%"></div></div>
                    <p>450 / 700 XP to next level</p>
                </div>
                <div class="card">
                    <div style="display: flex; gap: 12px; align-items: center; margin-bottom: 16px;">
                        ${icons.play} <span style="font-weight:600;">daily workout</span>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                        <div style="background: var(--highlight); border-radius: 20px; padding: 16px; text-align: center;" onclick="window.goTo('learn')">➕ quick math</div>
                        <div style="background: var(--highlight); border-radius: 20px; padding: 16px; text-align: center;" onclick="window.goTo('learn')">🧩 puzzles</div>
                    </div>
                </div>
                <div class="card">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
                        <span style="font-weight: 600;">Today's topics</span>
                        <span style="color: var(--primary);">view all</span>
                    </div>
                    <div class="lesson-item">${icons.lesson} <span>Multiplication tables</span></div>
                    <div class="lesson-item">${icons.flashcards} <span>Fractions</span></div>
                    <div class="lesson-item">${icons.chart} <span>Data drills</span></div>
                </div>
            `;
        }

        function renderLearn() {
            return `
                <div class="header">
                    <h2>Practice</h2>
                    <div class="profile-icon" onclick="window.onProfileClick()">${icons.profile}</div>
                </div>
                <div class="card" style="background: var(--primary); color: white;">
                    <div style="display: flex; align-items: center; gap: 16px;">
                        ${icons.play.replace('currentColor', 'white')}
                        <div><strong>start brain热身</strong><br>5 min · 10 questions</div>
                    </div>
                </div>
                <div class="card">
                    <div style="margin-bottom: 12px; font-weight: 600;">📚 lessons</div>
                    <div class="lesson-item">${icons.lesson}  addition (intermediate) <span style="margin-left: auto; color: var(--primary);">75%</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div>
                    <div class="lesson-item">${icons.lesson}  subtraction with carry <span style="margin-left: auto;">new</span></div>
                    <div class="lesson-item">${icons.flashcards}  mental math flashcards</div>
                </div>
                <div class="card">
                    <span style="font-weight: 600;">quick start</span>
                    <div style="display: flex; gap: 12px; margin-top: 16px;">
                        <button class="btn" style="padding: 12px;" onclick="document.querySelector('.progress-fill').style.width='33%'">multiplication</button>
                        <button class="btn" style="padding: 12px;" onclick="document.querySelector('.progress-fill').style.width='66%'">division</button>
                    </div>
                </div>
            `;
        }

        function renderProgress() {
            return `
                <div class="header">
                    <h2>Statistics</h2>
                    <div class="profile-icon" onclick="window.onProfileClick()">${icons.profile}</div>
                </div>
                <div class="card">
                    <div style="font-weight: 600; margin-bottom: 16px;">weekly activity</div>
                    <div class="chart-row" id="chartBars">
                        <div class="bar" style="height: 40px;"></div><div class="bar" style="height: 70px;"></div><div class="bar" style="height: 50px;"></div>
                        <div class="bar" style="height: 90px;"></div><div class="bar" style="height: 60px;"></div><div class="bar" style="height: 80px;"></div><div class="bar" style="height: 45px;"></div>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span>mon</span><span>tue</span><span>wed</span><span>thu</span><span>fri</span><span>sat</span><span>sun</span>
                    </div>
                </div>
                <div class="card flex-row" style="justify-content: space-evenly;">
                    <div><strong>124</strong> lessons</div>
                    <div><strong>3.4k</strong> problems</div>
                    <div><strong>98%</strong> accuracy</div>
                </div>
                <div class="card">
                    ${icons.chart}  mastery: fractions <span style="float:right;">42%</span>
                    <div class="progress-bar"><div class="progress-fill" style="width:42%"></div></div>
                </div>
            `;
        }

        function renderSettings() {
            const checked = currentTheme === 'dark' ? 'checked' : '';
            return `
                <div class="header">
                    <h2>Settings</h2>
                    <div class="profile-icon" onclick="window.onProfileClick()">${icons.profile}</div>
                </div>
                <div class="card">
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                        <span>🌓 dark mode</span>
                        <label style="width: 50px; height: 28px; background: var(--border); border-radius: 30px; position: relative; display: inline-block;">
                            <input type="checkbox" id="darkToggle" style="opacity:0; width:0; height:0;" ${checked} onchange="window.setTheme(this.checked ? 'dark' : 'light')">
                            <span style="width: 24px; height: 24px; background: var(--primary); border-radius: 50%; position: absolute; top:2px; left:${checked ? '24px' : '2px'}; transition:0.2s;"></span>
                        </label>
                    </div>
                </div>
                <div class="card">
                    <div>🔔 reminders</div>
                    <div>🌐 language</div>
                    <div>📊 export data</div>
                </div>
                <div class="card" style="text-align: center; color: var(--text-light);">
                    version 2.6.0 · math brain trainer
                </div>
            `;
        }

        // main render
        function render() {
            let content = '';
            if (currentScreen === 'onboarding') content = renderOnboarding();
            else if (currentScreen === 'home') content = renderHome();
            else if (currentScreen === 'learn') content = renderLearn();
            else if (currentScreen === 'progress') content = renderProgress();
            else if (currentScreen === 'settings') content = renderSettings();

            // wrap with modal if needed
            if (modals.privacy || modals.terms) {
                const modalText = modals.privacy ? 'Privacy: no data shared with third parties.' : 'Terms: use for educational purposes only.';
                content += `
                    <div class="modal" onclick="window.closeModal()">
                        <div class="modal-content" onclick="event.stopPropagation()">
                            ${icons.check}<br><h3>${modals.privacy?'Privacy':'Terms'}</h3>
                            <p style="margin:20px 0;">${modalText}</p>
                            <button class="btn" style="padding:10px;" onclick="window.closeModal()">close</button>
                        </div>
                    </div>
                `;
            }

            document.getElementById('app').innerHTML = content;

            // bottom nav
            const navItems = [
                { id: 'home', icon: icons.home, label: 'Home' },
                { id: 'learn', icon: icons.learn, label: 'Learn' },
                { id: 'progress', icon: icons.progress, label: 'Progress' },
                { id: 'settings', icon: icons.settings, label: 'Settings' }
            ];
            const navHtml = navItems.map(item => {
                const active = currentScreen === item.id ? 'active' : '';
                return `<div class="nav-item ${active}" onclick="window.goTo('${item.id}')">${item.icon}<span>${item.label}</span></div>`;
            }).join('');
            document.getElementById('bottomNav').innerHTML = navHtml;
        }

        // ---------- SCREENSHOT (SHIFT+W) ----------
        async function captureScreenshot() {
            const phone = document.getElementById('phoneContainer');
            const canvas = document.getElementById('shot-canvas');
            const ctx = canvas.getContext('2d');

            // use html2canvas-like manual? we'll use dom-to-image fallback but this is vanilla. Actually we draw simple fake? 
            // better: use context.drawImage? but that's CORS. For prototype, we emulate filename rule.
            // we skip actual canvas capture (would need external lib). we increase counter and simulate.
            const themeSuffix = (currentTheme === 'dark' && screenshotCounter === 1) ? 6 : screenshotCounter;
            let filename = '';
            if (currentTheme === 'dark') filename = '6.png';
            else filename = screenshotCounter + '.png';

            // simulate increment
            screenshotCounter = screenshotCounter < 5 ? screenshotCounter + 1 : 1;
            alert(`[dev] screenshot saved as ${filename} (simulated – canvas capture would require external lib)`);
        }

        // expose globals
        window.goTo = goTo;
        window.onProfileClick = onProfileClick;
        window.openModal = openModal;
        window.closeModal = closeModal;
        window.setTheme = setTheme;
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'W') { e.preventDefault(); captureScreenshot(); }
        });

        // initial render
        render();
    })();
</script>

        "4.png": "Track Progress",
        "5.png": "Smart Settings",
        "6.png": "Dark Theme"
    } ); })();
</script>
</body>
