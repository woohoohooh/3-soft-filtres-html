```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEBULA SENTINEL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:'Cinzel',serif;background:#000;color:#fff;overflow:hidden;height:100vh;cursor:none}
#gameCanvas{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 30% 40%,#111 0%,#000 30%),repeating-linear-gradient(45deg,#0a0a0a 0px,#0a0a0a 1px,#000 1px,#000 3px);z-index:1;outline:none}
.depth-lines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background-image:repeating-linear-gradient(90deg,transparent 0px,transparent 1px,rgba(200,220,255,.03) 1px,rgba(200,220,255,.03) 2px)}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="gameCanvas" tabindex="0"></canvas>
<div class="depth-lines"></div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
canvas.focus();
let combo=0,streak=0,health=100;
let particles=[],enemies=[],stellarForms=[],playerBolts=[];
let autoFireCooldown=0;
const keys={w:false,a:false,s:false,d:false};
const player={x:canvas.width/2,y:canvas.height-100,size:45,rotation:0,velocity:{x:0,y:0},speed:5,coreGlow:0,ringPhase:0};
class Particle{
constructor(x,y,color){this.x=x;this.y=y;this.color=color;this.size=Math.random()*5+2;this.speedX=Math.random()*4-2;this.speedY=Math.random()*4-2;this.life=0.7+Math.random()*0.3;this.decay=0.02+Math.random()*0.02}
update(){this.x+=this.speedX;this.y+=this.speedY;this.life-=this.decay;this.size*=0.97}
draw(){ctx.save();ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore()}
}
class PlayerBolt{
constructor(x,y,targetX,targetY){this.x=x;this.y=y;this.targetX=targetX;this.targetY=targetY;this.age=0;this.life=1;this.trail=[];for(let i=0;i<8;i++)this.trail.push({x:this.x,y:this.y})}
update(){this.age++;if(this.age>28)this.life-=0.06;let closest=null,closestDist=Infinity;for(let e of enemies){if(e.isDead)continue;let dx=e.x-this.x,dy=e.y-this.y;let d=Math.sqrt(dx*dx+dy*dy);if(d<closestDist){closestDist=d;closest=e;}}if(closest){this.targetX=closest.x;this.targetY=closest.y;}let dx=this.targetX-this.x;let dy=this.targetY-this.y;let d=Math.sqrt(dx*dx+dy*dy);if(d>1){this.x+=dx*0.32;this.y+=dy*0.32;}this.trail.shift();this.trail.push({x:this.x,y:this.y});}
draw(){ctx.save();ctx.globalAlpha=this.life*0.8;ctx.shadowBlur=35;ctx.shadowColor='#aac0ff';ctx.strokeStyle='#ffffff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(this.trail[0].x,this.trail[0].y);for(let i=1;i<this.trail.length;i++){ctx.lineTo(this.trail[i].x,this.trail[i].y);}ctx.stroke();ctx.shadowBlur=50;ctx.lineWidth=2;ctx.strokeStyle='#e0f0ff';ctx.beginPath();ctx.moveTo(this.trail[0].x,this.trail[0].y);for(let i=1;i<this.trail.length;i++){ctx.lineTo(this.trail[i].x,this.trail[i].y);}ctx.stroke();ctx.restore();}
}
let bossSpawned=false;
class Enemy{
constructor(type){this.type=type??Math.floor(Math.random()*4);this.size=40;this.speed=0.7;this.health=50;this.maxHealth=50;this.rotation=Math.random()*Math.PI*2;this.hitCooldown=0;this.isDead=false;this.pulsePhase=Math.random()*10;this.armCount=(type===3?5:(type===2?4:(type===1?3:2)));this.coreSize=this.size*0.5;if(this.type===0){this.size=38;this.speed=0.6;this.health=45;this.maxHealth=45;this.armCount=2;}else if(this.type===1){this.size=32;this.speed=0.85;this.health=38;this.maxHealth=38;this.armCount=3;}else if(this.type===2){this.size=48;this.speed=0.5;this.health=75;this.maxHealth=75;this.armCount=4;}else if(this.type===3){this.size=65;this.speed=1.6;this.health=190;this.maxHealth=190;this.armCount=6;bossSpawned=true;}const side=Math.floor(Math.random()*3);if(side===0){this.x=Math.random()*canvas.width;this.y=-90}if(side===1){this.x=-90;this.y=Math.random()*canvas.height*0.6}if(side===2){this.x=canvas.width+90;this.y=Math.random()*canvas.height*0.6}}
update(){if(this.isDead)return;const dx=player.x-this.x,dy=player.y-this.y;const d=Math.sqrt(dx*dx+dy*dy);if(d>0){this.x+=(dx/d)*this.speed;this.y+=(dy/d)*this.speed;}this.rotation+=0.005;this.pulsePhase+=0.03;if(this.hitCooldown>0)this.hitCooldown--;if(d<player.size+this.size+15&&this.hitCooldown<=0){health=Math.max(0,health-8);streak=0;this.hitCooldown=25;}}
draw(){if(this.isDead)return;ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rotation);ctx.shadowBlur=30;ctx.shadowColor='rgba(150,190,255,0.6)';ctx.strokeStyle='rgba(210,230,255,0.7)';ctx.lineWidth=2;ctx.fillStyle='rgba(5,8,15,0.9)';ctx.beginPath();ctx.arc(0,0,this.size*0.6,0,Math.PI*2);ctx.fill();ctx.stroke();for(let i=0;i<this.armCount;i++){let angle=(i/this.armCount)*Math.PI*2+Math.sin(this.pulsePhase)*0.1;ctx.save();ctx.rotate(angle);ctx.shadowBlur=30;ctx.shadowColor='rgba(180,210,255,0.7)';ctx.strokeStyle='rgba(190,215,255,0.8)';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(this.size*0.6,0);ctx.lineTo(this.size*1.5,-this.size*0.5);ctx.lineTo(this.size*1.8,0);ctx.lineTo(this.size*1.5,this.size*0.5);ctx.closePath();ctx.stroke();ctx.fillStyle='rgba(15,20,30,0.8)';ctx.fill();ctx.restore();}ctx.restore();if(this.health<this.maxHealth){ctx.save();ctx.translate(this.x,this.y-this.size-12);ctx.fillStyle='#1a1a2e';ctx.fillRect(-this.size*0.8,0,this.size*1.6,4);ctx.fillStyle='#b0c4ff';ctx.fillRect(-this.size*0.8,0,(this.health/this.maxHealth)*this.size*1.6,4);ctx.restore();}}
hit(dmg){if(this.isDead)return false;this.health-=dmg;for(let i=0;i<8;i++)particles.push(new Particle(this.x+Math.random()*20-10,this.y+Math.random()*20-10,'#cce0ff'));if(this.health<=0){this.isDead=true;streak++;for(let i=0;i<22;i++)particles.push(new Particle(this.x,this.y,i%2===0?'#ffffff':'#aac0ff'));const idx=enemies.indexOf(this);if(idx>-1){enemies.splice(idx,1);if(this.type===3){bossSpawned=false;}else{let newEnemy=null;if(this.type===0)newEnemy=new Enemy(0);else if(this.type===1)newEnemy=new Enemy(1);else if(this.type===2)newEnemy=new Enemy(2);if(newEnemy)enemies.push(newEnemy);}}return true;}return false;}
}
function drawPlayer(){player.coreGlow+=0.12;player.ringPhase+=0.08;ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.rotation);let glowIntensity=0.6+Math.sin(player.coreGlow)*0.2;ctx.shadowBlur=45;ctx.shadowColor='rgba(130,180,255,1)';ctx.strokeStyle='rgba(235,245,255,1)';ctx.lineWidth=3.5;ctx.fillStyle='rgba(5,10,18,0.9)';ctx.beginPath();ctx.moveTo(0,-player.size*1.3);ctx.lineTo(player.size*1.0,0);ctx.lineTo(player.size*0.7,player.size*0.5);ctx.lineTo(0,player.size*0.2);ctx.lineTo(-player.size*0.7,player.size*0.5);ctx.lineTo(-player.size*1.0,0);ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=60;ctx.fillStyle='rgba(170,210,255,0.7)';ctx.beginPath();ctx.arc(0,-player.size*0.3,player.size*0.3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffffff';ctx.shadowBlur=70;ctx.beginPath();ctx.arc(0,-player.size*0.4,player.size*0.15,0,Math.PI*2);ctx.fill();ctx.restore();}
function createStellarForm(){if(Math.random()>0.25)return;stellarForms.push({x:Math.random()*canvas.width,y:-20,speedX:Math.random()*0.8-0.4,speedY:0.4+Math.random()*0.9,rotation:Math.random()*Math.PI*2,rotSpeed:Math.random()*0.02-0.01,size:8+Math.random()*12,life:1,type:Math.floor(Math.random()*3)});}
function autoAttack(){let nearest=null,nd=Infinity;for(const e of enemies){if(e.isDead)continue;const dx=e.x-player.x,dy=e.y-player.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<nd){nd=d;nearest=e;}}if(nearest){player.rotation=Math.atan2(nearest.y-player.y,nearest.x-player.x)*0.2;if(nd<600){for(let i=0;i<2;i++){let offsetX=(Math.random()-0.5)*20;let offsetY=(Math.random()-0.5)*20;let bolt=new PlayerBolt(player.x+offsetX,player.y+offsetY,nearest.x,nearest.y);playerBolts.push(bolt);}nearest.hit(16);combo++;health=Math.min(100,health+2);}}}
function spawnInitialEnemies(){enemies.push(new Enemy(0));enemies.push(new Enemy(1));enemies.push(new Enemy(2));if(!bossSpawned){enemies.push(new Enemy(3));bossSpawned=true;}}
function update(){player.velocity.x=0;player.velocity.y=0;if(keys.w)player.velocity.y=-player.speed;if(keys.s)player.velocity.y=player.speed;if(keys.a)player.velocity.x=-player.speed;if(keys.d)player.velocity.x=player.speed;player.x=Math.min(canvas.width-player.size*0.8,Math.max(player.size*0.8,player.x+player.velocity.x));player.y=Math.min(canvas.height-player.size*0.8,Math.max(player.size*0.8,player.y+player.velocity.y));autoFireCooldown--;if(autoFireCooldown<=0){autoAttack();autoFireCooldown=15;}for(const e of enemies)e.update();for(let i=playerBolts.length-1;i>=0;i--){playerBolts[i].update();if(playerBolts[i].life<=0.1||playerBolts[i].age>42)playerBolts.splice(i,1);}for(let i=particles.length-1;i>=0;i--){particles[i].update();if(particles[i].life<=0.01)particles.splice(i,1);}for(let i=stellarForms.length-1;i>=0;i--){const s=stellarForms[i];s.x+=s.speedX;s.y+=s.speedY;s.rotation+=s.rotSpeed;s.life-=0.002;if(s.y>canvas.height+30||s.life<=0)stellarForms.splice(i,1);}createStellarForm();}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);for(const s of stellarForms){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rotation);ctx.globalAlpha=s.life*0.5;ctx.shadowBlur=20;ctx.shadowColor='#a0b5ff';ctx.fillStyle='rgba(140,180,255,0.3)';ctx.strokeStyle='rgba(180,210,255,0.6)';ctx.lineWidth=1.5;ctx.beginPath();if(s.type===0){ctx.arc(0,0,s.size*0.5,0,Math.PI*2);ctx.fill();ctx.stroke();}else if(s.type===1){ctx.moveTo(0,-s.size);ctx.lineTo(s.size*0.7,s.size*0.6);ctx.lineTo(-s.size*0.7,s.size*0.6);ctx.closePath();ctx.fill();ctx.stroke();}else{ctx.moveTo(-s.size*0.6,-s.size*0.4);ctx.lineTo(s.size*0.6,-s.size*0.4);ctx.lineTo(0,s.size*0.7);ctx.closePath();ctx.fill();ctx.stroke();}ctx.restore();}particles.forEach(p=>p.draw());playerBolts.forEach(b=>b.draw());enemies.forEach(e=>e.draw());drawPlayer();}
function animate(){update();draw();requestAnimationFrame(animate);}
function handleResize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;player.x=Math.min(canvas.width-player.size*0.8,Math.max(player.size*0.8,player.x));player.y=Math.min(canvas.height-player.size*0.8,Math.max(player.size*0.8,player.y));}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=true;e.preventDefault();}});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=false;e.preventDefault();}});
window.addEventListener('resize',handleResize);
spawnInitialEnemies();
for(let i=0;i<25;i++)createStellarForm();
animate();
</script>
</body>
</html>
