```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AETHERA SENTINEL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:'Cinzel',serif;background:#000;color:#fff;overflow:hidden;height:100vh;cursor:none}
#gameCanvas{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 20% 30%,#111 0%,#000 30%),repeating-linear-gradient(45deg,#0a0a0a 0px,#0a0a0a 1px,#000 1px,#000 3px);z-index:1;outline:none}
.depth-lines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background-image:repeating-linear-gradient(90deg,transparent 0px,transparent 1px,rgba(255,255,255,.02) 1px,rgba(255,255,255,.02) 2px)}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="gameCanvas" tabindex="0"></canvas>
<div class="depth-lines"></div>

<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
canvas.focus();

let combo=0,streak=0,health=100;
let particles=[],enemies=[],stellarDrift=[],playerBolts=[];
let autoFireCooldown=0;
const keys={w:false,a:false,s:false,d:false};

const player={x:canvas.width/2,y:canvas.height-100,size:42,rotation:0,velocity:{x:0,y:0},speed:5,corePhase:0,ringPulse:0};

class Particle{
constructor(x,y,color){this.x=x;this.y=y;this.color=color;this.size=Math.random()*6+2;this.speedX=Math.random()*5-2.5;this.speedY=Math.random()*5-2.5;this.life=.7+Math.random()*.3;this.decay=.02+Math.random()*.03}
update(){this.x+=this.speedX;this.y+=this.speedY;this.life-=this.decay;this.size*=.98}
draw(){ctx.save();ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore()}
}

class PlayerBolt{
constructor(x,y,targetX,targetY){
this.x=x;this.y=y;
this.targetX=targetX;this.targetY=targetY;
this.age=0;this.life=1;
this.trail=[];
for(let i=0;i<10;i++)this.trail.push({x:this.x,y:this.y});
}
update(){
this.age++;
if(this.age>28)this.life-=.06;
if(!enemies.length)return;
let closest=null,closestDist=Infinity;
for(let e of enemies){
if(e.isDead)continue;
let dx=e.x-this.x,dy=e.y-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d<closestDist){closestDist=d;closest=e;}
}
if(closest){
this.targetX=closest.x;
this.targetY=closest.y;
}
let dx=this.targetX-this.x;
let dy=this.targetY-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d>1){
this.x+=dx*0.32;
this.y+=dy*0.32;
}
this.trail.shift();
this.trail.push({x:this.x,y:this.y});
}
draw(){
ctx.save();
ctx.globalAlpha=this.life*0.8;
ctx.shadowBlur=45;
ctx.shadowColor='#e0f0ff';
ctx.strokeStyle='#e0f0ff';
ctx.lineWidth=4;
ctx.beginPath();
ctx.moveTo(this.trail[0].x,this.trail[0].y);
for(let i=1;i<this.trail.length;i++)ctx.lineTo(this.trail[i].x,this.trail[i].y);
ctx.stroke();
ctx.shadowBlur=60;
ctx.lineWidth=2;
ctx.strokeStyle='#fff';
ctx.beginPath();
ctx.moveTo(this.trail[2].x,this.trail[2].y);
for(let i=3;i<this.trail.length;i++)ctx.lineTo(this.trail[i].x,this.trail[i].y);
ctx.stroke();
ctx.restore();
}
}

let nexusSpawned=false;

class Enemy{
constructor(type){
this.type=type || Math.floor(Math.random()*4);
this.size=36;
this.speed=0.7;
this.health=50;
this.maxHealth=50;
this.rotation=0;
this.wave=Math.random()*Math.PI*2;
this.hitCooldown=0;
this.isDead=false;
this.satellites=[];

if(this.type===0){ // comet-like
this.size=32; this.speed=0.8; this.health=45; this.maxHealth=45;
this.satellites=[{angle:0,dist:1.2},{angle:2,dist:1.2}];
}
else if(this.type===1){ // crystalline
this.size=28; this.speed=0.95; this.health=38; this.maxHealth=38;
this.satellites=[{angle:1,dist:1.4},{angle:3,dist:1.4},{angle:5,dist:1.4}];
}
else if(this.type===2){ // nebuloid
this.size=44; this.speed=0.55; this.health=80; this.maxHealth=80;
this.satellites=[{angle:0.5,dist:1.8},{angle:2.5,dist:1.8},{angle:4.2,dist:1.8}];
}
else if(this.type===3){ // nexus core
this.size=65; this.speed=1.3; this.health=220; this.maxHealth=220;
for(let i=0;i<5;i++)this.satellites.push({angle:i*1.26,dist:2.2});
nexusSpawned=true;
}

const side=Math.floor(Math.random()*3);
if(side===0){this.x=Math.random()*canvas.width;this.y=-90}
if(side===1){this.x=-90;this.y=Math.random()*canvas.height*0.6}
if(side===2){this.x=canvas.width+90;this.y=Math.random()*canvas.height*0.6}
}
update(){
if(this.isDead)return;
const dx=player.x-this.x,dy=player.y-this.y;
const d=Math.sqrt(dx*dx+dy*dy);
if(d>0){this.x+=(dx/d)*this.speed;this.y+=(dy/d)*this.speed}
this.rotation+=0.012;
this.wave+=0.04;
for(let s of this.satellites)s.angle+=0.03;
if(this.hitCooldown>0)this.hitCooldown--;
if(d<player.size+this.size+18 && this.hitCooldown<=0){
health=Math.max(0,health-8);
streak=0;
this.hitCooldown=30;
}
}
draw(){
if(this.isDead)return;
ctx.save();
ctx.translate(this.x,this.y);
ctx.rotate(this.rotation);
ctx.shadowBlur=20;
ctx.shadowColor='rgba(140,200,255,0.5)';
ctx.strokeStyle='rgba(210,230,255,0.5)';
ctx.lineWidth=1.2;
ctx.fillStyle='rgba(5,10,18,0.9)';

ctx.beginPath();
ctx.arc(0,0,this.size,0,Math.PI*2);
ctx.fill();
ctx.stroke();

for(let s of this.satellites){
let sx=Math.cos(s.angle+this.wave)*this.size*s.dist;
let sy=Math.sin(s.angle+this.wave)*this.size*s.dist;
ctx.save();
ctx.translate(sx,sy);
ctx.rotate(this.wave);
ctx.shadowBlur=25;
ctx.shadowColor='rgba(100,160,230,0.6)';
ctx.fillStyle='rgba(30,40,55,0.7)';
ctx.strokeStyle='rgba(180,210,250,0.6)';
ctx.beginPath();
ctx.arc(0,0,this.size*0.35,0,Math.PI*2);
ctx.fill();
ctx.stroke();
ctx.restore();
}

ctx.shadowBlur=35;
ctx.shadowColor='rgba(160,210,255,0.7)';
ctx.fillStyle='rgba(70,130,200,0.2)';
ctx.beginPath();
ctx.arc(0,0,this.size*1.3,0,Math.PI*2);
ctx.fill();

if(this.health<this.maxHealth){
ctx.save();
ctx.rotate(-this.rotation);
ctx.translate(0,-this.size-18);
ctx.fillStyle='rgba(10,20,35,.8)';
ctx.fillRect(-this.size*0.9,0,this.size*1.8,4);
ctx.fillStyle='rgba(160,210,255,.95)';
ctx.fillRect(-this.size*0.9,0,(this.health/this.maxHealth)*this.size*1.8,4);
ctx.restore();
}
ctx.restore();
}
hit(dmg){
if(this.isDead)return false;
this.health-=dmg;
for(let i=0;i<6;i++)particles.push(new Particle(this.x+Math.random()*20-10,this.y+Math.random()*20-10,'#b0d0ff'));
if(this.health<=0){
this.isDead=true;
streak++;
for(let i=0;i<25;i++)particles.push(new Particle(this.x+Math.random()*30-15,this.y+Math.random()*30-15,i<12?'#d0e8ff':'#a0b0d0'));
const idx=enemies.indexOf(this);
if(idx>-1){
enemies.splice(idx,1);
if(this.type===3){
nexusSpawned=false;
}
else{
let newEnemy=null;
if(this.type===0)newEnemy=new Enemy(0);
else if(this.type===1)newEnemy=new Enemy(1);
else if(this.type===2)newEnemy=new Enemy(2);
if(newEnemy)enemies.push(newEnemy);
}
}
return true;
}
return false;
}
}

function drawPlayer(){
player.corePhase+=0.12;
player.ringPulse+=0.07;
ctx.save();
ctx.translate(player.x,player.y);
ctx.rotate(player.rotation);
let glowRing=0.6+Math.sin(player.ringPulse)*0.2;
ctx.shadowBlur=60;
ctx.shadowColor='rgba(140,200,255,1)';
ctx.strokeStyle='rgba(230,245,255,1)';
ctx.lineWidth=3.5;
ctx.fillStyle='rgba(8,12,22,0.9)';

ctx.beginPath();
ctx.moveTo(0,-player.size*1.3);
ctx.lineTo(player.size*0.7,-player.size*0.3);
ctx.lineTo(player.size*1.1,player.size*0.2);
ctx.lineTo(player.size*0.5,player.size*0.7);
ctx.lineTo(0,player.size*0.5);
ctx.lineTo(-player.size*0.5,player.size*0.7);
ctx.lineTo(-player.size*1.1,player.size*0.2);
ctx.lineTo(-player.size*0.7,-player.size*0.3);
ctx.closePath();
ctx.fill();
ctx.stroke();

ctx.shadowBlur=50;
ctx.strokeStyle='rgba(200,230,255,0.9)';
ctx.lineWidth=2;
ctx.beginPath();
ctx.arc(0,-player.size*0.2,player.size*0.35,0,Math.PI*2);
ctx.stroke();

ctx.shadowBlur=70;
ctx.fillStyle='rgba(140,210,255,0.8)';
ctx.beginPath();
ctx.arc(0,-player.size*0.2,player.size*0.15,0,Math.PI*2);
ctx.fill();

ctx.shadowBlur=80;
ctx.fillStyle='#fff';
ctx.beginPath();
ctx.arc(0,-player.size*0.2,player.size*0.07,0,Math.PI*2);
ctx.fill();

ctx.restore();
}

function createStellarDrift(){
if(Math.random()>.25)return;
stellarDrift.push({x:Math.random()*canvas.width,y:-15,speedX:Math.random()*0.8-0.4,speedY:0.4+Math.random()*1,rot:Math.random()*6.28,rotSpeed:Math.random()*0.02-0.01,size:4+Math.random()*12,life:0.8+Math.random()*0.4});
}

function autoAttack(){
let nearest=null,nd=Infinity;
for(const e of enemies){if(e.isDead)continue;const dx=e.x-player.x,dy=e.y-player.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<nd){nd=d;nearest=e}}
if(nearest){
player.rotation=Math.atan2(nearest.y-player.y,nearest.x-player.x)*0.35;
if(nd<620){
for(let i=0;i<2;i++){
let offsetX=(Math.random()-0.5)*18;
let offsetY=(Math.random()-0.5)*18;
let bolt=new PlayerBolt(player.x+offsetX,player.y+offsetY,nearest.x+Math.random()*22-11,nearest.y+Math.random()*22-11);
playerBolts.push(bolt);
}
nearest.hit(19);
combo++;
health=Math.min(100,health+2.5);
}
}
}

function spawnInitialEnemies(){
enemies.push(new Enemy(0));
enemies.push(new Enemy(1));
enemies.push(new Enemy(2));
if(!nexusSpawned){
enemies.push(new Enemy(3));
nexusSpawned=true;
}
}

function update(){
player.velocity.x=0;player.velocity.y=0;
if(keys.w)player.velocity.y=-player.speed;
if(keys.s)player.velocity.y=player.speed;
if(keys.a)player.velocity.x=-player.speed;
if(keys.d)player.velocity.x=player.speed;
player.x=Math.min(canvas.width-player.size*.8,Math.max(player.size*.8,player.x+player.velocity.x));
player.y=Math.min(canvas.height-player.size*.8,Math.max(player.size*.8,player.y+player.velocity.y));
autoFireCooldown--;
if(autoFireCooldown<=0){autoAttack();autoFireCooldown=17}
for(const e of enemies)e.update();
for(let i=playerBolts.length-1;i>=0;i--){
playerBolts[i].update();
if(playerBolts[i].life<=0.1||playerBolts[i].age>42)playerBolts.splice(i,1);
}
for(let i=particles.length-1;i>=0;i--){particles[i].update();if(particles[i].life<=.01)particles.splice(i,1)}
for(let i=stellarDrift.length-1;i>=0;i--){
const d=stellarDrift[i];
d.x+=d.speedX;d.y+=d.speedY;d.rot+=d.rotSpeed;d.life-=.0035;
if(d.y>canvas.height||d.life<=0)stellarDrift.splice(i,1);
}
createStellarDrift();
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
for(const d of stellarDrift){
ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.rot);ctx.globalAlpha=d.life*0.2;
ctx.fillStyle='rgba(160,200,255,.2)';
ctx.beginPath();ctx.moveTo(0,-d.size);ctx.lineTo(d.size*.7,d.size*.5);ctx.lineTo(-d.size*.7,d.size*.5);ctx.closePath();ctx.fill();ctx.restore();
}
particles.forEach(p=>p.draw());
playerBolts.forEach(b=>b.draw());
enemies.forEach(e=>e.draw());
drawPlayer();
}

function animate(){update();draw();requestAnimationFrame(animate)}

function handleResize(){
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
player.x=Math.min(canvas.width-player.size*.8,Math.max(player.size*.8,player.x));
player.y=Math.min(canvas.height-player.size*.8,Math.max(player.size*.8,player.y));
}

window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=true;e.preventDefault()}});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=false;e.preventDefault()}});
window.addEventListener('resize',handleResize);

spawnInitialEnemies();
for(let i=0;i<24;i++)createStellarDrift();

animate();
</script>
</body>
</html>
All done!
