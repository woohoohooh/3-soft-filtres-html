```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEBULA SENTINEL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:'Cinzel',serif;background:#000;color:#fff;overflow:hidden;height:100vh;cursor:none}
#gameCanvas{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 30% 40%,#102030 0%,#000 40%),repeating-linear-gradient(45deg,#0a0a0a 0px,#0a0a0a 2px,#000 2px,#000 5px);z-index:1;outline:none}
.depth-lines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background-image:repeating-linear-gradient(90deg,transparent 0px,transparent 2px,rgba(100,150,200,.03) 2px,rgba(100,150,200,.03) 4px)}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="gameCanvas" tabindex="0"></canvas>
<div class="depth-lines"></div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
canvas.focus();

let health=100,streak=0;
let particles=[],enemies=[],spaceDebris=[],playerBolts=[];
let autoFireCooldown=0;
const keys={w:false,a:false,s:false,d:false};

const player={x:canvas.width/2,y:canvas.height-120,size:44,rotation:0,velocity:{x:0,y:0},speed:5,coreGlow:0,wingSway:0};

class Particle{
constructor(x,y,color,size=1){this.x=x;this.y=y;this.color=color;this.size=Math.random()*5+2;this.speedX=Math.random()*4-2;this.speedY=Math.random()*4-2;this.life=.8+Math.random()*.2;this.decay=.015+Math.random()*.02;}
update(){this.x+=this.speedX;this.y+=this.speedY;this.life-=this.decay;this.size*=.97;}
draw(){ctx.save();ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore();}
}

class PlayerBolt{
constructor(x,y,targetX,targetY){
this.x=x;this.y=y;this.targetX=targetX;this.targetY=targetY;
this.age=0;this.life=1;
this.trail=[];
for(let i=0;i<8;i++)this.trail.push({x:this.x,y:this.y});
}
update(){
this.age++;
if(this.age>28)this.life-=.1;
if(!enemies.length)return;
let closest=null,cd=Infinity;
for(let e of enemies){if(e.isDead)continue;let d=Math.hypot(e.x-this.x,e.y-this.y);if(d<cd){cd=d;closest=e;}}
if(closest){this.targetX=closest.x;this.targetY=closest.y;}
let dx=this.targetX-this.x,dy=this.targetY-this.y,len=Math.hypot(dx,dy);
if(len>1){this.x+=dx*0.4;this.y+=dy*0.4;}
this.trail.shift();this.trail.push({x:this.x,y:this.y});
}
draw(){
ctx.save();ctx.globalAlpha=this.life;ctx.shadowBlur=30;ctx.shadowColor='#aaf';ctx.strokeStyle='#fff';ctx.lineWidth=3.5;
ctx.beginPath();ctx.moveTo(this.trail[0].x,this.trail[0].y);for(let i=1;i<this.trail.length;i++)ctx.lineTo(this.trail[i].x,this.trail[i].y);ctx.stroke();
ctx.shadowBlur=45;ctx.lineWidth=2;ctx.strokeStyle='rgba(200,230,255,1)';ctx.beginPath();ctx.moveTo(this.trail[2].x,this.trail[2].y);for(let i=3;i<this.trail.length;i++)ctx.lineTo(this.trail[i].x,this.trail[i].y);ctx.stroke();ctx.restore();
}
}

class Enemy{
constructor(rank){
this.rank=rank??Math.floor(Math.random()*3);
this.size=28+this.rank*8;
this.speed=0.7+this.rank*0.2;
this.health=40+this.rank*30;
this.maxHealth=this.health;
this.rotation=0;this.pulse=0;this.hitCooldown=0;this.isDead=false;
let side=Math.floor(Math.random()*4);
if(side==0){this.x=Math.random()*canvas.width;this.y=-50;}
else if(side==1){this.x=-50;this.y=Math.random()*canvas.height*0.7;}
else if(side==2){this.x=canvas.width+50;this.y=Math.random()*canvas.height*0.7;}
else{this.x=Math.random()*canvas.width;this.y=canvas.height+50;}
}
update(){
if(this.isDead)return;
let dx=player.x-this.x,dy=player.y-this.y,dist=Math.hypot(dx,dy);
if(dist>0){this.x+=(dx/dist)*this.speed;this.y+=(dy/dist)*this.speed;}
this.rotation+=0.02;this.pulse+=0.1;
if(this.hitCooldown>0)this.hitCooldown--;
if(dist<player.size+this.size+18&&this.hitCooldown<=0){health=Math.max(0,health-12);streak=0;this.hitCooldown=25;}
}
draw(){
if(this.isDead)return;
ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rotation);
ctx.shadowBlur=20;ctx.shadowColor='rgba(150,200,250,0.5)';ctx.strokeStyle='rgba(190,220,255,0.9)';ctx.lineWidth=2;ctx.fillStyle='rgba(5,10,20,0.95)';
ctx.beginPath();ctx.ellipse(0,0,this.size*0.8,this.size*0.5,0,0,Math.PI*2);ctx.fill();ctx.stroke();
for(let i=0;i<4;i++){
let a=i*1.57+this.pulse*0.2;ctx.beginPath();ctx.moveTo(Math.cos(a)*this.size*0.7,Math.sin(a)*this.size*0.5);ctx.lineTo(Math.cos(a)*this.size*1.2,Math.sin(a)*this.size*0.9);ctx.strokeStyle='rgba(220,240,255,0.7)';ctx.stroke();
}
ctx.restore();
if(this.health<this.maxHealth){ctx.save();ctx.translate(this.x,this.y-this.size-10);ctx.fillStyle='#333';ctx.fillRect(-this.size,0,this.size*2,4);ctx.fillStyle='#aaf';ctx.fillRect(-this.size,0,(this.health/this.maxHealth)*this.size*2,4);ctx.restore();}
}
hit(dmg){
if(this.isDead)return false;
this.health-=dmg;
for(let i=0;i<5;i++)particles.push(new Particle(this.x+(Math.random()-0.5)*30,this.y+(Math.random()-0.5)*30,'#fff'));
if(this.health<=0){
this.isDead=true;streak++;
for(let i=0;i<20;i++)particles.push(new Particle(this.x,this.y,i%3?'#bdf':'#fff',2));
return true;
}
return false;
}
}

function drawPlayer(){
player.coreGlow+=0.2;player.wingSway+=0.15;
ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.rotation);
let glow=0.6+Math.sin(player.coreGlow)*0.3;let sway=Math.sin(player.wingSway)*0.1;
ctx.shadowBlur=40;ctx.shadowColor='rgba(130,200,250,0.9)';ctx.strokeStyle='#fff';ctx.lineWidth=3.2;ctx.fillStyle='rgba(5,15,28,0.9)';
ctx.beginPath();ctx.moveTo(0,-player.size*1.2);ctx.lineTo(player.size*1.3,player.size*0.2);ctx.lineTo(player.size*0.8,player.size*0.6);ctx.lineTo(player.size*0.3,player.size*0.8);ctx.lineTo(0,player.size*0.4);ctx.lineTo(-player.size*0.3,player.size*0.8);ctx.lineTo(-player.size*0.8,player.size*0.6);ctx.lineTo(-player.size*1.3,player.size*0.2);ctx.closePath();ctx.fill();ctx.stroke();
ctx.shadowBlur=55;ctx.fillStyle='rgba(170,220,255,0.8)';ctx.beginPath();ctx.arc(0,-player.size*0.2,player.size*0.25,0,Math.PI*2);ctx.fill();
ctx.shadowBlur=70;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-player.size*0.3,player.size*0.13,0,Math.PI*2);ctx.fill();
ctx.restore();
}

function createDebris(){if(Math.random()<0.3){spaceDebris.push({x:Math.random()*canvas.width,y:-30,size:4+Math.random()*12,speedY:0.8+Math.random()*1.5,spin:Math.random()*0.1,angle:Math.random()*6.28});}}
function updateDebris(){for(let i=spaceDebris.length-1;i>=0;i--){let d=spaceDebris[i];d.y+=d.speedY;d.angle+=d.spin;if(d.y>canvas.height+50)spaceDebris.splice(i,1);}}
function drawDebris(){ctx.save();ctx.shadowBlur=0;ctx.fillStyle='rgba(120,140,180,0.3)';for(let d of spaceDebris){ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.angle);ctx.fillRect(-d.size/2,-d.size/4,d.size,d.size/2);ctx.restore();}ctx.restore();}

function autoAttack(){
let nearest=null,nd=Infinity;
for(let e of enemies){if(e.isDead)continue;let d=Math.hypot(e.x-player.x,e.y-player.y);if(d<nd){nd=d;nearest=e;}}
if(nearest&&nd<700){
player.rotation+=(Math.atan2(nearest.y-player.y,nearest.x-player.x)-player.rotation)*0.1;
for(let i=0;i<2;i++){let bolt=new PlayerBolt(player.x+(Math.random()-0.5)*20,player.y+(Math.random()-0.5)*20,nearest.x,nearest.y);playerBolts.push(bolt);}
nearest.hit(24);health=Math.min(100,health+2);
}
}

function spawnEnemyWave(){if(enemies.length<5){enemies.push(new Enemy(0));if(Math.random()<0.4)enemies.push(new Enemy(1));}}

function update(){
player.velocity.x=0;player.velocity.y=0;
if(keys.w)player.velocity.y=-player.speed;
if(keys.s)player.velocity.y=player.speed;
if(keys.a)player.velocity.x=-player.speed;
if(keys.d)player.velocity.x=player.speed;
player.x=Math.min(canvas.width-player.size*0.9,Math.max(player.size*0.9,player.x+player.velocity.x));
player.y=Math.min(canvas.height-player.size*0.9,Math.max(player.size*0.9,player.y+player.velocity.y));
autoFireCooldown--;if(autoFireCooldown<=0){autoAttack();autoFireCooldown=14;}
for(let e of enemies)e.update();
for(let i=playerBolts.length-1;i>=0;i--){playerBolts[i].update();if(playerBolts[i].life<=0.1||playerBolts[i].age>35)playerBolts.splice(i,1);}
for(let i=particles.length-1;i>=0;i--){particles[i].update();if(particles[i].life<=0.01)particles.splice(i,1);}
updateDebris();createDebris();if(Math.random()<0.02)spawnEnemyWave();
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
drawDebris();
particles.forEach(p=>p.draw());
playerBolts.forEach(b=>b.draw());
enemies.forEach(e=>e.draw());
drawPlayer();
ctx.fillStyle='#fff';ctx.font='18px "Cinzel"';ctx.fillText('HEALTH: '+health,20,40);
if(health<=0){ctx.fillStyle='rgba(200,0,0,0.8)';ctx.font='50px "Cinzel"';ctx.fillText('DESTROYED',canvas.width/2-200,canvas.height/2);}
}

function animate(){update();draw();requestAnimationFrame(animate);}

function handleResize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;player.x=Math.min(canvas.width-player.size*0.9,Math.max(player.size*0.9,player.x));player.y=Math.min(canvas.height-player.size*0.9,Math.max(player.size*0.9,player.y));}

window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=true;e.preventDefault();}});
window.addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=false;e.preventDefault();}});
window.addEventListener('resize',handleResize);

for(let i=0;i<3;i++)enemies.push(new Enemy(i%3));
for(let i=0;i<10;i++)createDebris();
animate();
</script>
</body>
</html>
All done!
