<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEBULA SENTINEL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:'Cinzel',serif;background:#000;color:#fff;overflow:hidden;height:100vh;cursor:none}
#gameCanvas{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 30% 40%,#0a0a1a 0%,#000 40%),repeating-linear-gradient(0deg,transparent 0px,transparent 2px,rgba(0,20,40,0.2) 2px,rgba(0,20,40,0.2) 4px);z-index:1;outline:none}
.depth-lines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background-image:repeating-linear-gradient(90deg,transparent 0px,transparent 3px,rgba(0,30,60,0.15) 3px,rgba(0,30,60,0.15) 6px)}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="gameCanvas" tabindex="0"></canvas>
<div class="depth-lines"></div>

<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
canvas.focus();

let combo=0,streak=0,health=100;
let particles=[],enemies=[],nebulaDrift=[],playerBolts=[];
let autoFireCooldown=0;
const keys={w:false,a:false,s:false,d:false};

const player={x:canvas.width/2,y:canvas.height-100,size:40,rotation:0,velocity:{x:0,y:0},speed:5,ringPhase:0,coreEnergy:0};

class Particle{
constructor(x,y,color){this.x=x;this.y=y;this.color=color;this.size=Math.random()*6+2;this.speedX=Math.random()*5-2.5;this.speedY=Math.random()*5-2.5;this.life=.7+Math.random()*.3;this.decay=.02+Math.random()*.03}
update(){this.x+=this.speedX;this.y+=this.speedY;this.life-=this.decay;this.size*=.98}
draw(){ctx.save();ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore()}
}

class PlayerBolt{
constructor(x,y,targetX,targetY){
this.x=x;this.y=y;
this.targetX=targetX;this.targetY=targetY;
this.age=0;this.life=1;
this.trail=[];
for(let i=0;i<10;i++)this.trail.push({x:this.x,y:this.y});
}
update(){
this.age++;
if(this.age>20)this.life-=.1;
if(!enemies.length)return;
let closest=null,closestDist=Infinity;
for(let e of enemies){
if(e.isDead)continue;
let dx=e.x-this.x,dy=e.y-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d<closestDist){closestDist=d;closest=e;}
}
if(closest){
this.targetX=closest.x;
this.targetY=closest.y;
}
let dx=this.targetX-this.x;
let dy=this.targetY-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d>1){
this.x+=dx*0.4;
this.y+=dy*0.4;
}
this.trail.shift();
this.trail.push({x:this.x,y:this.y});
}
draw(){
ctx.save();
ctx.globalAlpha=this.life;
ctx.shadowBlur=40;
ctx.shadowColor='#7df9ff';
ctx.strokeStyle='#a0f0ff';
ctx.lineWidth=4;
ctx.beginPath();
ctx.moveTo(this.trail[0].x,this.trail[0].y);
for(let i=1;i<this.trail.length;i++)ctx.lineTo(this.trail[i].x,this.trail[i].y);
ctx.stroke();
ctx.shadowBlur=50;
ctx.lineWidth=2;
ctx.strokeStyle='#fff';
ctx.beginPath();
ctx.moveTo(this.trail[2].x,this.trail[2].y);
for(let i=3;i<this.trail.length;i++)ctx.lineTo(this.trail[i].x,this.trail[i].y);
ctx.stroke();
ctx.restore();
}
}

let bossSpawned=false;

class Enemy{
constructor(type){
this.type=type || Math.floor(Math.random()*4);
this.size=35;
this.speed=0.9;
this.health=45;
this.maxHealth=45;
this.rotation=Math.random()*Math.PI*2;
this.pulsePhase=Math.random()*Math.PI*2;
this.hitCooldown=0;
this.isDead=false;
this.orbCount=4+Math.floor(Math.random()*3);
this.ringAngle=0;

if(this.type===0){
this.size=38;
this.speed=0.7;
this.health=50;
this.maxHealth=50;
this.orbCount=3;
}
else if(this.type===1){
this.size=30;
this.speed=1.0;
this.health=40;
this.maxHealth=40;
this.orbCount=5;
}
else if(this.type===2){
this.size=45;
this.speed=0.6;
this.health=70;
this.maxHealth=70;
this.orbCount=4;
}
else if(this.type===3){
this.size=60;
this.speed=1.8;
this.health=180;
this.maxHealth=180;
this.orbCount=8;
bossSpawned=true;
}

const side=Math.floor(Math.random()*3);
if(side===0){this.x=Math.random()*canvas.width;this.y=-80}
if(side===1){this.x=-80;this.y=Math.random()*canvas.height*0.6}
if(side===2){this.x=canvas.width+80;this.y=Math.random()*canvas.height*0.6}
}
update(){
if(this.isDead)return;
const dx=player.x-this.x,dy=player.y-this.y;
const d=Math.sqrt(dx*dx+dy*dy);
if(d>0){this.x+=(dx/d)*this.speed;this.y+=(dy/d)*this.speed}
this.rotation+=0.005;
this.pulsePhase+=0.04;
this.ringAngle+=0.02;
if(this.hitCooldown>0)this.hitCooldown--;
if(d<player.size+this.size+25 && this.hitCooldown<=0){
health=Math.max(0,health-8);
streak=0;
this.hitCooldown=30;
}
}
draw(){
if(this.isDead)return;
ctx.save();
ctx.translate(this.x,this.y);
ctx.rotate(this.rotation);
let pulse=0.7+Math.sin(this.pulsePhase)*0.3;
ctx.shadowBlur=20;
ctx.shadowColor='rgba(100,150,200,0.6)';
ctx.strokeStyle='rgba(150,200,250,0.7)';
ctx.lineWidth=1.5;
ctx.fillStyle='rgba(10,15,25,0.9)';
ctx.beginPath();
ctx.arc(0,0,this.size*0.6*pulse,0,Math.PI*2);
ctx.fill();
ctx.stroke();
for(let i=0;i<this.orbCount;i++){
let a=i*(Math.PI*2/this.orbCount)+this.ringAngle;
let r=this.size*0.9;
let x=Math.cos(a)*r;
let y=Math.sin(a)*r;
ctx.save();
ctx.translate(x,y);
ctx.rotate(a);
ctx.shadowBlur=25;
ctx.shadowColor='rgba(180,220,255,0.8)';
ctx.fillStyle='rgba(30,40,60,0.8)';
ctx.strokeStyle='rgba(200,230,255,0.6)';
ctx.lineWidth=1.2;
ctx.beginPath();
ctx.ellipse(0,0,this.size*0.2,this.size*0.1,0,0,Math.PI*2);
ctx.fill();
ctx.stroke();
ctx.restore();
}
if(this.health<this.maxHealth){
ctx.save();
ctx.rotate(-this.rotation);
ctx.translate(0,-this.size-15);
ctx.fillStyle='rgba(30,30,50,0.8)';
ctx.fillRect(-this.size*0.8,0,this.size*1.6,3);
ctx.fillStyle='rgba(150,200,250,0.9)';
ctx.fillRect(-this.size*0.8,0,(this.health/this.maxHealth)*this.size*1.6,3);
ctx.restore();
}
ctx.restore();
}
hit(dmg){
if(this.isDead)return false;
this.health-=dmg;
for(let i=0;i<6;i++)particles.push(new Particle(this.x+Math.random()*20-10,this.y+Math.random()*20-10,'#aac'));
if(this.health<=0){
this.isDead=true;
streak++;
for(let i=0;i<20;i++)particles.push(new Particle(this.x+Math.random()*30-15,this.y+Math.random()*30-15,i<8?'#7df9ff':'#aac'));
const idx=enemies.indexOf(this);
if(idx>-1){
enemies.splice(idx,1);
if(this.type===3){
bossSpawned=false;
}
else{
let newEnemy=null;
if(this.type===0)newEnemy=new Enemy(0);
else if(this.type===1)newEnemy=new Enemy(1);
else if(this.type===2)newEnemy=new Enemy(2);
if(newEnemy)enemies.push(newEnemy);
}
}
return true;
}
return false;
}
}

function drawPlayer(){
player.ringPhase+=0.2;
player.coreEnergy+=0.15;
ctx.save();
ctx.translate(player.x,player.y);
ctx.rotate(player.rotation);
let glow=0.5+Math.sin(player.coreEnergy)*0.2;
ctx.shadowBlur=40;
ctx.shadowColor='rgba(100,200,255,0.8)';
ctx.strokeStyle='rgba(200,240,255,0.9)';
ctx.lineWidth=2.5;
ctx.fillStyle='rgba(10,15,30,0.7)';
ctx.beginPath();
ctx.moveTo(0,-player.size*1.3);
ctx.lineTo(player.size*0.6,-player.size*0.4);
ctx.lineTo(player.size*1.1,player.size*0.3);
ctx.lineTo(player.size*0.5,player.size*0.7);
ctx.lineTo(0,player.size*0.5);
ctx.lineTo(-player.size*0.5,player.size*0.7);
ctx.lineTo(-player.size*1.1,player.size*0.3);
ctx.lineTo(-player.size*0.6,-player.size*0.4);
ctx.closePath();
ctx.fill();
ctx.stroke();
ctx.shadowBlur=50;
ctx.shadowColor='#7df9ff';
ctx.strokeStyle='#c0f0ff';
ctx.lineWidth=2;
ctx.beginPath();
ctx.arc(0,0,player.size*0.5+Math.sin(player.ringPhase)*3,0,Math.PI*2);
ctx.stroke();
ctx.shadowBlur=60;
ctx.fillStyle='#ffffff';
ctx.beginPath();
ctx.arc(0,-player.size*0.2,player.size*0.15,0,Math.PI*2);
ctx.fill();
ctx.restore();
}

function createNebulaDrift(){
if(Math.random()>0.3)return;
nebulaDrift.push({x:Math.random()*canvas.width,y:-30,speedX:Math.random()*0.8-0.4,speedY:0.3+Math.random()*1,size:10+Math.random()*20,life:0.3+Math.random()*0.4});
}

function autoAttack(){
let nearest=null,nd=Infinity;
for(const e of enemies){if(e.isDead)continue;const dx=e.x-player.x,dy=e.y-player.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<nd){nd=d;nearest=e}}
if(nearest){
player.rotation=Math.atan2(nearest.y-player.y,nearest.x-player.x)*0.4;
if(nd<650){
for(let i=0;i<3;i++){
let offsetX=(Math.random()-0.5)*18;
let offsetY=(Math.random()-0.5)*18;
let bolt=new PlayerBolt(player.x+offsetX,player.y+offsetY,nearest.x+Math.random()*20-10,nearest.y+Math.random()*20-10);
playerBolts.push(bolt);
}
nearest.hit(15);
combo++;
health=Math.min(100,health+2);
}
}
}

function spawnInitialEnemies(){
enemies.push(new Enemy(0));
enemies.push(new Enemy(1));
enemies.push(new Enemy(2));
if(!bossSpawned){
enemies.push(new Enemy(3));
bossSpawned=true;
}
}

function update(){
player.velocity.x=0;player.velocity.y=0;
if(keys.w)player.velocity.y=-player.speed;
if(keys.s)player.velocity.y=player.speed;
if(keys.a)player.velocity.x=-player.speed;
if(keys.d)player.velocity.x=player.speed;
player.x=Math.min(canvas.width-player.size*.8,Math.max(player.size*.8,player.x+player.velocity.x));
player.y=Math.min(canvas.height-player.size*.8,Math.max(player.size*.8,player.y+player.velocity.y));
autoFireCooldown--;
if(autoFireCooldown<=0){autoAttack();autoFireCooldown=16}
for(const e of enemies)e.update();
for(let i=playerBolts.length-1;i>=0;i--){
playerBolts[i].update();
if(playerBolts[i].life<=0.1||playerBolts[i].age>35)playerBolts.splice(i,1);
}
for(let i=particles.length-1;i>=0;i--){particles[i].update();if(particles[i].life<=.01)particles.splice(i,1)}
for(let i=nebulaDrift.length-1;i>=0;i--){
const d=nebulaDrift[i];
d.x+=d.speedX;d.y+=d.speedY;d.life-=0.003;
if(d.y>canvas.height||d.life<=0)nebulaDrift.splice(i,1);
}
createNebulaDrift();
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
for(const d of nebulaDrift){
ctx.save();
ctx.globalAlpha=d.life*0.4;
ctx.fillStyle='rgba(80,140,200,0.15)';
ctx.shadowBlur=30;
ctx.shadowColor='#3a6ea5';
ctx.beginPath();
ctx.arc(d.x,d.y,d.size*0.8,0,Math.PI*2);
ctx.fill();
ctx.fillStyle='rgba(120,180,240,0.1)';
ctx.beginPath();
ctx.arc(d.x-5,d.y-3,d.size*0.5,0,Math.PI*2);
ctx.fill();
ctx.restore();
}
particles.forEach(p=>p.draw());
playerBolts.forEach(b=>b.draw());
enemies.forEach(e=>e.draw());
drawPlayer();
}

function animate(){update();draw();requestAnimationFrame(animate)}

function handleResize(){
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
player.x=Math.min(canvas.width-player.size*.8,Math.max(player.size*.8,player.x));
player.y=Math.min(canvas.height-player.size*.8,Math.max(player.size*.8,player.y));
}

window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=true;e.preventDefault()}});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=false;e.preventDefault()}});
window.addEventListener('resize',handleResize);

spawnInitialEnemies();
for(let i=0;i<20;i++)createNebulaDrift();

animate();
</script>
</body>
</html>
All done!
