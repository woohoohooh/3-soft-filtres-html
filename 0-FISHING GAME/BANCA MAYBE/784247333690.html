```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEBULA SENTINEL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:'Cinzel',serif;background:#000;color:#fff;overflow:hidden;height:100vh;cursor:none}
#gameCanvas{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 60% 40%,#0a0f1a 0%,#030408 60%),repeating-linear-gradient(45deg,#11161f 0px,#11161f 1px,#030408 1px,#030408 4px);z-index:1;outline:none}
.depth-lines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background-image:repeating-linear-gradient(0deg,transparent 0px,transparent 2px,rgba(70,130,200,0.03) 2px,rgba(70,130,200,0.03) 3px)}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="gameCanvas" tabindex="0"></canvas>
<div class="depth-lines"></div>

<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
canvas.focus();

let combo=0,streak=0,health=100;
let particles=[],enemies=[],stellarSpecks=[],playerBolts=[];
let autoFireCooldown=0;
const keys={w:false,a:false,s:false,d:false};

const player={x:canvas.width/2,y:canvas.height-100,size:42,rotation:0,velocity:{x:0,y:0},speed:5,coreBreath:0,ringPhase:0};

class Particle{
constructor(x,y,color){this.x=x;this.y=y;this.color=color;this.size=Math.random()*7+2;this.speedX=Math.random()*6-3;this.speedY=Math.random()*6-3;this.life=.8+Math.random()*.2;this.decay=.015+Math.random()*.025}
update(){this.x+=this.speedX;this.y+=this.speedY;this.life-=this.decay;this.size*=.97}
draw(){ctx.save();ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore()}
}

class PlayerBolt{
constructor(x,y,targetX,targetY){
this.x=x;this.y=y;this.targetX=targetX;this.targetY=targetY;
this.age=0;this.life=1;
this.strand=[];
let steps=9;
for(let i=0;i<steps;i++)this.strand.push({x:this.x,y:this.y,wiggle:0});
}
update(){
this.age++;
if(this.age>28)this.life-=.06;
if(!enemies.length)return;
let closest=null,closestDist=Infinity;
for(let e of enemies){
if(e.isDead)continue;
let dx=e.x-this.x,dy=e.y-this.y;let d=Math.sqrt(dx*dx+dy*dy);
if(d<closestDist){closestDist=d;closest=e;}
}
if(closest){this.targetX=closest.x;this.targetY=closest.y;}
let dx=this.targetX-this.x;let dy=this.targetY-this.y;let d=Math.sqrt(dx*dx+dy*dy);
if(d>1){this.x+=dx*0.38;this.y+=dy*0.38;}
for(let i=0;i<this.strand.length;i++){
let seg=this.strand[i];
let targetX=this.x+(this.targetX-this.x)*(i/(this.strand.length-1));
let targetY=this.y+(this.targetY-this.y)*(i/(this.strand.length-1));
seg.x+=(targetX-seg.x)*0.5;seg.y+=(targetY-seg.y)*0.5;
seg.wiggle=Math.sin(this.age*0.7+i*0.9)*this.life*4;
}
}
draw(){
ctx.save();
ctx.globalAlpha=this.life;
ctx.shadowBlur=45;ctx.shadowColor='#bbffff';
ctx.strokeStyle='#ccffff';ctx.lineWidth=3.5;
ctx.beginPath();
for(let i=0;i<this.strand.length-1;i++){
let p1=this.strand[i];let p2=this.strand[i+1];
ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);
}
ctx.stroke();
ctx.shadowBlur=70;ctx.lineWidth=1.8;ctx.strokeStyle='#ffffff';
ctx.beginPath();
for(let i=0;i<this.strand.length-1;i++){
let p1=this.strand[i];let p2=this.strand[i+1];
ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);
}
ctx.stroke();
ctx.restore();
}
}

let bossSpawned=false;

class Enemy{
constructor(type){
this.type=type ?? Math.floor(Math.random()*4);
this.size=28;this.speed=0.9;this.health=45;this.maxHealth=45;
this.rotation=0;this.pulsePhase=Math.random()*Math.PI*2;this.hitCooldown=0;this.isDead=false;
this.wings=[];this.coreGlow=0;this.patternSeed=Math.random()*100;
let wingCount=(this.type===0?4:this.type===1?6:this.type===2?3:8);
for(let i=0;i<wingCount;i++)this.wings.push({baseAngle:(i/wingCount)*Math.PI*2,length:this.size*(1+Math.random()*0.4)});

if(this.type===0){this.size=34;this.speed=0.7;this.health=55;this.maxHealth=55;}
else if(this.type===1){this.size=26;this.speed=1.1;this.health=40;this.maxHealth=40;}
else if(this.type===2){this.size=44;this.speed=0.55;this.health=80;this.maxHealth=80;}
else if(this.type===3){this.size=58;this.speed=2.0;this.health=210;this.maxHealth=210;bossSpawned=true;}

const side=Math.floor(Math.random()*3);
if(side===0){this.x=Math.random()*canvas.width;this.y=-90;}
if(side===1){this.x=-90;this.y=Math.random()*canvas.height*0.6;}
if(side===2){this.x=canvas.width+90;this.y=Math.random()*canvas.height*0.6;}
}
update(){
if(this.isDead)return;
const dx=player.x-this.x,dy=player.y-this.y,d=Math.sqrt(dx*dx+dy*dy);
if(d>0){this.x+=(dx/d)*this.speed;this.y+=(dy/d)*this.speed;}
this.rotation+=0.008;this.pulsePhase+=0.04;this.coreGlow=0.5+Math.sin(this.pulsePhase)*0.2;
if(this.hitCooldown>0)this.hitCooldown--;
if(d<player.size+this.size+20&&this.hitCooldown<=0){health=Math.max(0,health-8);streak=0;this.hitCooldown=30;}
}
draw(){
if(this.isDead)return;
ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rotation);
ctx.shadowBlur=20;ctx.shadowColor='rgba(80,140,200,0.8)';
ctx.fillStyle='rgba(5,8,15,0.95)';ctx.strokeStyle='rgba(150,200,240,0.7)';ctx.lineWidth=1.5;
ctx.beginPath();ctx.arc(0,0,this.size*0.8,0,Math.PI*2);ctx.fill();ctx.stroke();
for(let w of this.wings){
ctx.save();ctx.rotate(w.baseAngle+Math.sin(this.pulsePhase)*0.1);
ctx.shadowBlur=30;ctx.shadowColor='rgba(130,180,230,0.9)';
ctx.strokeStyle='rgba(180,220,250,0.8)';ctx.lineWidth=1.8;
ctx.fillStyle='rgba(8,12,22,0.8)';
ctx.beginPath();ctx.moveTo(this.size*0.7,0);ctx.lineTo(w.length*1.3,-this.size*0.5);ctx.lineTo(w.length*1.7,0);ctx.lineTo(w.length*1.3,this.size*0.5);ctx.closePath();
ctx.fill();ctx.stroke();
ctx.restore();
}
ctx.shadowBlur=35;ctx.shadowColor='rgba(180,210,250,0.9)';
ctx.fillStyle='rgba(130,180,240,0.3)';
ctx.beginPath();ctx.arc(0,0,this.size*0.6,0,Math.PI*2);ctx.fill();
ctx.fillStyle='rgba(210,230,255,0.8)';
ctx.beginPath();ctx.arc(0,0,this.size*0.25,0,Math.PI*2);ctx.fill();

if(this.health<this.maxHealth){
ctx.save();ctx.rotate(-this.rotation);ctx.translate(0,-this.size-18);
ctx.fillStyle='rgba(20,20,40,.7)';ctx.fillRect(-this.size,0,this.size*2,4);
ctx.fillStyle='rgba(190,220,255,.95)';ctx.fillRect(-this.size,0,(this.health/this.maxHealth)*this.size*2,4);
ctx.restore();
}
ctx.restore();
}
hit(dmg){
if(this.isDead)return false;
this.health-=dmg;
for(let i=0;i<8;i++)particles.push(new Particle(this.x+Math.random()*24-12,this.y+Math.random()*24-12,'rgba(180,220,255,0.9)'));
if(this.health<=0){
this.isDead=true;streak++;
for(let i=0;i<28;i++)particles.push(new Particle(this.x+Math.random()*30-15,this.y+Math.random()*30-15,i%3===0?'#bbffff':'#aaccff'));
const idx=enemies.indexOf(this);
if(idx>-1){
enemies.splice(idx,1);
if(this.type===3){bossSpawned=false;}
else{let newEnemy=null;
if(this.type===0)newEnemy=new Enemy(0);
else if(this.type===1)newEnemy=new Enemy(1);
else if(this.type===2)newEnemy=new Enemy(2);
if(newEnemy)enemies.push(newEnemy);}
}
return true;
}
return false;
}
}

function drawPlayer(){
player.coreBreath+=0.15;player.ringPhase+=0.07;
ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.rotation);
let glowCore=0.6+Math.sin(player.coreBreath)*0.2;
ctx.shadowBlur=55;ctx.shadowColor='rgba(120,200,255,0.9)';
ctx.fillStyle='rgba(6,10,22,0.8)';ctx.strokeStyle='rgba(180,230,255,1)';ctx.lineWidth=2.8;
ctx.beginPath();
ctx.moveTo(0,-player.size*1.3);
ctx.lineTo(player.size*1.0,0);
ctx.lineTo(player.size*0.7,player.size*0.7);
ctx.lineTo(player.size*0.2,player.size*0.4);
ctx.lineTo(-player.size*0.2,player.size*0.4);
ctx.lineTo(-player.size*0.7,player.size*0.7);
ctx.lineTo(-player.size*1.0,0);
ctx.closePath();
ctx.fill();ctx.stroke();
ctx.shadowBlur=70;ctx.shadowColor='#ffffff';
ctx.fillStyle='rgba(200,230,255,0.95)';
ctx.beginPath();ctx.arc(0,-player.size*0.2,player.size*0.15,0,Math.PI*2);ctx.fill();
ctx.fillStyle='rgba(100,200,255,0.35)';
ctx.beginPath();ctx.arc(0,player.size*0.2,player.size*0.3,0,Math.PI*2);ctx.fill();
ctx.restore();
}

function createStellarSpeck(){
if(Math.random()>0.25)return;
stellarSpecks.push({x:Math.random()*canvas.width,y:-15,speedX:Math.random()*0.8-0.4,speedY:0.4+Math.random()*1.2,rotation:Math.random()*Math.PI*2,rotSpeed:Math.random()*0.02-0.01,size:4+Math.random()*12,life:0.7+Math.random()*0.4});
}

function autoAttack(){
let nearest=null,nd=Infinity;
for(const e of enemies){if(e.isDead)continue;const dx=e.x-player.x,dy=e.y-player.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<nd){nd=d;nearest=e;}}
if(nearest){
player.rotation=Math.atan2(nearest.y-player.y,nearest.x-player.x)*0.5;
if(nd<620){
for(let i=0;i<2;i++){
let offsetX=(Math.random()-0.5)*22;let offsetY=(Math.random()-0.5)*22;
let bolt=new PlayerBolt(player.x+offsetX,player.y+offsetY,nearest.x+Math.random()*40-20,nearest.y+Math.random()*40-20);
playerBolts.push(bolt);
}
nearest.hit(19);combo++;health=Math.min(100,health+3);
}
}
}

function spawnInitialEnemies(){
enemies.push(new Enemy(0));enemies.push(new Enemy(1));enemies.push(new Enemy(2));
if(!bossSpawned){enemies.push(new Enemy(3));bossSpawned=true;}
}

function update(){
player.velocity.x=0;player.velocity.y=0;
if(keys.w)player.velocity.y=-player.speed;
if(keys.s)player.velocity.y=player.speed;
if(keys.a)player.velocity.x=-player.speed;
if(keys.d)player.velocity.x=player.speed;
player.x=Math.min(canvas.width-player.size*.8,Math.max(player.size*.8,player.x+player.velocity.x));
player.y=Math.min(canvas.height-player.size*.8,Math.max(player.size*.8,player.y+player.velocity.y));
autoFireCooldown--;
if(autoFireCooldown<=0){autoAttack();autoFireCooldown=14;}
for(const e of enemies)e.update();
for(let i=playerBolts.length-1;i>=0;i--){playerBolts[i].update();if(playerBolts[i].life<=0.1||playerBolts[i].age>38)playerBolts.splice(i,1);}
for(let i=particles.length-1;i>=0;i--){particles[i].update();if(particles[i].life<=.01)particles.splice(i,1);}
for(let i=stellarSpecks.length-1;i>=0;i--){
const p=stellarSpecks[i];p.x+=p.speedX;p.y+=p.speedY;p.rotation+=p.rotSpeed;p.life-=.0035;
if(p.y>canvas.height||p.life<=0)stellarSpecks.splice(i,1);
}
createStellarSpeck();
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
for(const p of stellarSpecks){
ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rotation);ctx.globalAlpha=p.life*0.25;
ctx.fillStyle='rgba(170,210,255,0.3)';
ctx.beginPath();ctx.moveTo(0,-p.size);ctx.lineTo(p.size*0.9,p.size*0.7);ctx.lineTo(-p.size*0.9,p.size*0.7);ctx.closePath();ctx.fill();ctx.restore();
}
particles.forEach(p=>p.draw());
playerBolts.forEach(b=>b.draw());
enemies.forEach(e=>e.draw());
drawPlayer();
ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='bold 14px monospace';ctx.shadowBlur=12;ctx.shadowColor='#88ccff';
ctx.fillText('⚡'+streak,30,50);ctx.fillText('🛡️'+health,30,85);
}

function animate(){update();draw();requestAnimationFrame(animate)}

function handleResize(){
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
player.x=Math.min(canvas.width-player.size*.8,Math.max(player.size*.8,player.x));
player.y=Math.min(canvas.height-player.size*.8,Math.max(player.size*.8,player.y));
}

window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=true;e.preventDefault();}});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=false;e.preventDefault();}});
window.addEventListener('resize',handleResize);

spawnInitialEnemies();
for(let i=0;i<24;i++)createStellarSpeck();

animate();
</script>
</body>
</html>
All done!
