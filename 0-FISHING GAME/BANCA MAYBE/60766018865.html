```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UMBRA VENATOR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:'Cinzel',serif;background:#000;color:#fff;overflow:hidden;height:100vh;cursor:none}
#gameCanvas{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 20% 30%,#111 0%,#000 30%),repeating-linear-gradient(45deg,#0a0a0a 0px,#0a0a0a 1px,#000 1px,#000 3px);z-index:1;outline:none}
.depth-lines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background-image:repeating-linear-gradient(90deg,transparent 0px,transparent 1px,rgba(255,255,255,.02) 1px,rgba(255,255,255,.02) 2px)}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="gameCanvas" tabindex="0"></canvas>
<div class="depth-lines"></div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
canvas.focus();
let combo=0,streak=0,health=100;
let particles=[],enemies=[],sakuraPetals=[],playerBolts=[];
let autoFireCooldown=0;
const keys={w:false,a:false,s:false,d:false};
const player={x:canvas.width/2,y:canvas.height-100,size:40,rotation:0,velocity:{x:0,y:0},speed:5,coreGlow:0};

class Particle{
constructor(x,y,color){this.x=x;this.y=y;this.color=color;this.size=Math.random()*6+2;this.speedX=Math.random()*5-2.5;this.speedY=Math.random()*5-2.5;this.life=.7+Math.random()*.3;this.decay=.02+Math.random()*.03}
update(){this.x+=this.speedX;this.y+=this.speedY;this.life-=this.decay;this.size*=.98}
draw(){ctx.save();ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore()}
}

class PlayerBolt{
constructor(x,y,targetX,targetY){
this.x=x;this.y=y;this.targetX=targetX;this.targetY=targetY;this.age=0;this.life=1;
this.points=[];for(let i=0;i<10;i++)this.points.push({x:this.x,y:this.y});
}
update(){
this.age++;if(this.age>28)this.life-=.08;
if(!enemies.length)return;
let closest=null,closestDist=Infinity;
for(let e of enemies){if(e.isDead)continue;let dx=e.x-this.x,dy=e.y-this.y;let d=Math.sqrt(dx*dx+dy*dy);if(d<closestDist){closestDist=d;closest=e;}}
if(closest){this.targetX=closest.x;this.targetY=closest.y;}
let dx=this.targetX-this.x,dy=this.targetY-this.y,d=Math.sqrt(dx*dx+dy*dy);
if(d>1){this.x+=dx*0.35;this.y+=dy*0.35;}
this.points.shift();this.points.push({x:this.x,y:this.y});
}
draw(){
ctx.save();ctx.globalAlpha=this.life;ctx.shadowBlur=35;ctx.shadowColor='#9cf';ctx.strokeStyle='#adf';ctx.lineWidth=3.5;
ctx.beginPath();ctx.moveTo(this.points[0].x,this.points[0].y);
for(let i=1;i<this.points.length;i++)ctx.lineTo(this.points[i].x,this.points[i].y);ctx.stroke();
ctx.shadowBlur=50;ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(this.points[2].x,this.points[2].y);
for(let i=3;i<this.points.length;i++)ctx.lineTo(this.points[i].x,this.points[i].y);ctx.stroke();ctx.restore();
}
}

let bossSpawned=false;

class Enemy{
constructor(type){
this.type=type||Math.floor(Math.random()*4);this.size=28;this.speed=0.9;this.health=35;this.maxHealth=35;
this.rotation=0;this.pulsePhase=Math.random()*Math.PI*2;this.hitCooldown=0;this.isDead=false;
this.spikeAngle=0;this.orbiters=[];
let count=this.type===3?4:2+Math.floor(Math.random()*2);
for(let i=0;i<count;i++)this.orbiters.push({angle:(i/count)*Math.PI*2,dist:this.size*1.4,phase:Math.random()*10});
if(this.type===0){this.size=32;this.speed=0.7;this.health=50;this.maxHealth=50;}
else if(this.type===1){this.size=24;this.speed=1.1;this.health=30;this.maxHealth=30;}
else if(this.type===2){this.size=38;this.speed=0.6;this.health=70;this.maxHealth=70;}
else if(this.type===3){this.size=48;this.speed=1.8;this.health=150;this.maxHealth=150;bossSpawned=true;}
const side=Math.floor(Math.random()*3);
if(side===0){this.x=Math.random()*canvas.width;this.y=-70;}
if(side===1){this.x=-70;this.y=Math.random()*canvas.height*0.6;}
if(side===2){this.x=canvas.width+70;this.y=Math.random()*canvas.height*0.6;}
}
update(){
if(this.isDead)return;
const dx=player.x-this.x,dy=player.y-this.y,d=Math.sqrt(dx*dx+dy*dy);
if(d>0){this.x+=(dx/d)*this.speed;this.y+=(dy/d)*this.speed;}
this.rotation+=0.012;this.pulsePhase+=0.05;this.spikeAngle+=0.03;
for(let o of this.orbiters){o.angle+=0.02+Math.sin(o.phase+this.pulsePhase)*0.01;}
if(this.hitCooldown>0)this.hitCooldown--;
if(d<player.size+this.size+25&&this.hitCooldown<=0){health=Math.max(0,health-8);streak=0;this.hitCooldown=30;}
}
draw(){
if(this.isDead)return;ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rotation);
ctx.shadowBlur=35;ctx.shadowColor='rgba(100,200,255,0.6)';ctx.strokeStyle='rgba(150,220,255,0.7)';ctx.lineWidth=2;ctx.fillStyle='rgba(5,15,25,0.95)';
ctx.beginPath();ctx.arc(0,0,this.size*0.7,0,Math.PI*2);ctx.fill();ctx.stroke();
for(let o of this.orbiters){let x=Math.cos(o.angle)*o.dist,y=Math.sin(o.angle)*o.dist;
ctx.save();ctx.translate(x,y);ctx.rotate(o.angle);ctx.shadowBlur=45;ctx.fillStyle='rgba(30,50,80,0.9)';ctx.strokeStyle='rgba(130,200,250,0.8)';
ctx.beginPath();ctx.ellipse(0,0,this.size*0.25,this.size*0.15,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();}
for(let i=0;i<4;i++){let a=i*1.57+this.spikeAngle;let x=Math.cos(a)*this.size*0.9,y=Math.sin(a)*this.size*0.9;
ctx.beginPath();ctx.moveTo(x*0.8,y*0.8);ctx.lineTo(x*1.4,y*1.4);ctx.strokeStyle='rgba(200,230,255,0.8)';ctx.lineWidth=1.8;ctx.stroke();}
if(this.health<this.maxHealth){ctx.save();ctx.rotate(-this.rotation);ctx.translate(0,-this.size-18);
ctx.fillStyle='rgba(30,30,40,.8)';ctx.fillRect(-this.size*1.2,0,this.size*2.4,4);
ctx.fillStyle='rgba(160,220,255,.95)';ctx.fillRect(-this.size*1.2,0,(this.health/this.maxHealth)*this.size*2.4,4);ctx.restore();}
ctx.restore();
}
hit(dmg){
if(this.isDead)return false;this.health-=dmg;
for(let i=0;i<6;i++)particles.push(new Particle(this.x+Math.random()*20-10,this.y+Math.random()*20-10,'#adf'));
if(this.health<=0){this.isDead=true;streak++;
for(let i=0;i<20;i++)particles.push(new Particle(this.x,this.y,i<8?'#fff':'#acf'));
const idx=enemies.indexOf(this);if(idx>-1){enemies.splice(idx,1);
if(this.type===3)bossSpawned=false;
else{let newEnemy=null;if(this.type===0)newEnemy=new Enemy(0);else if(this.type===1)newEnemy=new Enemy(1);else if(this.type===2)newEnemy=new Enemy(2);if(newEnemy)enemies.push(newEnemy);}}
return true;}return false;}
}

function drawPlayer(){
player.coreGlow+=0.12;ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.rotation);
ctx.shadowBlur=45;ctx.shadowColor='rgba(120,200,255,0.9)';ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.fillStyle='rgba(5,15,30,0.9)';
ctx.beginPath();ctx.moveTo(0,-player.size*1.2);ctx.lineTo(player.size*0.9,0);ctx.lineTo(player.size*0.5,player.size*0.8);
ctx.lineTo(0,player.size*0.4);ctx.lineTo(-player.size*0.5,player.size*0.8);ctx.lineTo(-player.size*0.9,0);ctx.closePath();ctx.fill();ctx.stroke();
ctx.shadowBlur=60;ctx.fillStyle='rgba(180,230,255,0.7)';ctx.beginPath();ctx.arc(0,-player.size*0.3,player.size*0.2,0,Math.PI*2);ctx.fill();
ctx.shadowBlur=75;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-player.size*0.5,player.size*0.1,0,Math.PI*2);ctx.fill();
ctx.restore();
}

function createSakuraPetal(){if(Math.random()>.2)return;sakuraPetals.push({x:Math.random()*canvas.width,y:-20,speedX:Math.random()*1-.5,speedY:.5+Math.random()*1,rotation:Math.random()*Math.PI*2,rotationSpeed:Math.random()*.02-.01,size:5+Math.random()*8,life:1});}

function autoAttack(){
let nearest=null,nd=Infinity;
for(const e of enemies){if(e.isDead)continue;const dx=e.x-player.x,dy=e.y-player.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<nd){nd=d;nearest=e;}}
if(nearest){player.rotation=Math.atan2(nearest.y-player.y,nearest.x-player.x)*0.3;
if(nd<620){for(let i=0;i<2;i++){let offsetX=(Math.random()-0.5)*18,offsetY=(Math.random()-0.5)*18;let bolt=new PlayerBolt(player.x+offsetX,player.y+offsetY,nearest.x+Math.random()*20-10,nearest.y+Math.random()*20-10);playerBolts.push(bolt);}
nearest.hit(16);combo++;health=Math.min(100,health+2);}}
}

function spawnInitialEnemies(){enemies.push(new Enemy(0));enemies.push(new Enemy(1));enemies.push(new Enemy(2));if(!bossSpawned){enemies.push(new Enemy(3));bossSpawned=true;}}

function update(){
player.velocity.x=0;player.velocity.y=0;
if(keys.w)player.velocity.y=-player.speed;
if(keys.s)player.velocity.y=player.speed;
if(keys.a)player.velocity.x=-player.speed;
if(keys.d)player.velocity.x=player.speed;
player.x=Math.min(canvas.width-player.size*.8,Math.max(player.size*.8,player.x+player.velocity.x));
player.y=Math.min(canvas.height-player.size*.8,Math.max(player.size*.8,player.y+player.velocity.y));
autoFireCooldown--;if(autoFireCooldown<=0){autoAttack();autoFireCooldown=16;}
for(const e of enemies)e.update();
for(let i=playerBolts.length-1;i>=0;i--){playerBolts[i].update();if(playerBolts[i].life<=0.1||playerBolts[i].age>35)playerBolts.splice(i,1);}
for(let i=particles.length-1;i>=0;i--){particles[i].update();if(particles[i].life<=.01)particles.splice(i,1);}
for(let i=sakuraPetals.length-1;i>=0;i--){const p=sakuraPetals[i];p.x+=p.speedX;p.y+=p.speedY;p.rotation+=p.rotationSpeed;p.life-=.002;if(p.y>canvas.height||p.life<=0)sakuraPetals.splice(i,1);}
createSakuraPetal();
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
for(const p of sakuraPetals){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rotation);ctx.globalAlpha=p.life*.2;ctx.fillStyle='rgba(255,255,255,.15)';ctx.beginPath();ctx.moveTo(0,-p.size);ctx.lineTo(p.size*.8,p.size*.6);ctx.lineTo(-p.size*.8,p.size*.6);ctx.closePath();ctx.fill();ctx.restore();}
particles.forEach(p=>p.draw());playerBolts.forEach(b=>b.draw());enemies.forEach(e=>e.draw());drawPlayer();
}

function animate(){update();draw();requestAnimationFrame(animate);}

function handleResize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;player.x=Math.min(canvas.width-player.size*.8,Math.max(player.size*.8,player.x));player.y=Math.min(canvas.height-player.size*.8,Math.max(player.size*.8,player.y));}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=true;e.preventDefault();}});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=false;e.preventDefault();}});
window.addEventListener('resize',handleResize);
spawnInitialEnemies();for(let i=0;i<30;i++)createSakuraPetal();
animate();
</script>
</body>
</html>
