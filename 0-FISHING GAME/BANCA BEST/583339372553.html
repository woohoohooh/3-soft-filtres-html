```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UMBRA VENATOR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:'Cinzel',serif;background:#000;color:#fff;overflow:hidden;height:100vh;cursor:none}
#gameCanvas{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 20% 30%,#111 0%,#000 30%),repeating-linear-gradient(45deg,#0a0a0a 0px,#0a0a0a 1px,#000 1px,#000 3px);z-index:1;outline:none}
.depth-lines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background-image:repeating-linear-gradient(90deg,transparent 0px,transparent 1px,rgba(255,255,255,.02) 1px,rgba(255,255,255,.02) 2px)}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="gameCanvas" tabindex="0"></canvas>
<div class="depth-lines"></div>

<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
canvas.focus();

let combo=0,streak=0,health=100;
let particles=[],enemies=[],sakuraPetals=[],playerBolts=[];
let autoFireCooldown=0;
const keys={w:false,a:false,s:false,d:false};

const player={x:canvas.width/2,y:canvas.height-100,size:30,rotation:0,velocity:{x:0,y:0},speed:5,coreGlow:0};

class Particle{
constructor(x,y,color){this.x=x;this.y=y;this.color=color;this.size=Math.random()*6+2;this.speedX=Math.random()*5-2.5;this.speedY=Math.random()*5-2.5;this.life=.7+Math.random()*.3;this.decay=.02+Math.random()*.03}
update(){this.x+=this.speedX;this.y+=this.speedY;this.life-=this.decay;this.size*=.98}
draw(){ctx.save();ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore()}
}

class PlayerBolt{
constructor(x,y,targetX,targetY){
this.x=x;this.y=y;
this.targetX=targetX;this.targetY=targetY;
this.age=0;this.life=1;
this.length=20;
this.history=[{x:this.x,y:this.y}];
}
update(){
this.age++;
if(this.age>30)this.life-=0.03;
if(!enemies.length)return;
let closest=null,closestDist=Infinity;
for(let e of enemies){
if(e.isDead)continue;
let dx=e.x-this.x,dy=e.y-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d<closestDist){closestDist=d;closest=e;}
}
if(closest){
this.targetX=closest.x;
this.targetY=closest.y;
}
let dx=this.targetX-this.x;
let dy=this.targetY-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d>1){
this.x+=dx*0.28;
this.y+=dy*0.28;
}
this.history.push({x:this.x,y:this.y});
if(this.history.length>8)this.history.shift();
}
draw(){
if(this.history.length<2)return;
ctx.save();
ctx.globalAlpha=this.life;
ctx.shadowBlur=30;
ctx.shadowColor='#fff';
ctx.strokeStyle='#ffffff';
ctx.lineWidth=2.5+this.life*3;
ctx.beginPath();
ctx.moveTo(this.history[0].x,this.history[0].y);
for(let i=1;i<this.history.length;i++){
ctx.lineTo(this.history[i].x,this.history[i].y);
}
ctx.stroke();
ctx.restore();
}
}

let bossSpawned=false;

class Enemy{
constructor(type){
this.type=type || Math.floor(Math.random()*4);
this.size=30;
this.speed=0.9;
this.health=40;
this.maxHealth=40;
this.rotation=0;
this.pulsePhase=Math.random()*Math.PI*2;
this.hitCooldown=0;
this.isDead=false;

if(this.type===0){
this.size=32;
this.speed=0.8;
this.health=45;
this.maxHealth=45;
}
else if(this.type===1){
this.size=28;
this.speed=1.0;
this.health=35;
this.maxHealth=35;
}
else if(this.type===2){
this.size=38;
this.speed=0.7;
this.health=60;
this.maxHealth=60;
}
else if(this.type===3){
this.size=48;
this.speed=1.9;
this.health=150;
this.maxHealth=150;
bossSpawned=true;
}

const side=Math.floor(Math.random()*3);
if(side===0){this.x=Math.random()*canvas.width;this.y=-80}
if(side===1){this.x=-80;this.y=Math.random()*canvas.height*0.6}
if(side===2){this.x=canvas.width+80;this.y=Math.random()*canvas.height*0.6}
}
update(){
if(this.isDead)return;
const dx=player.x-this.x,dy=player.y-this.y;
const d=Math.sqrt(dx*dx+dy*dy);
if(d>0){this.x+=(dx/d)*this.speed;this.y+=(dy/d)*this.speed}
this.rotation+=0.015;
this.pulsePhase+=0.07;
if(this.hitCooldown>0)this.hitCooldown--;
if(d<player.size+this.size+15 && this.hitCooldown<=0){
health=Math.max(0,health-10);
streak=0;
this.hitCooldown=30;
}
}
draw(){
if(this.isDead)return;
ctx.save();
ctx.translate(this.x,this.y);
ctx.rotate(this.rotation);
ctx.scale(1,0.7);
const pulse=Math.sin(this.pulsePhase)*0.15+0.85;

ctx.shadowBlur=40;
ctx.shadowColor='rgba(180,200,255,0.9)';
ctx.strokeStyle='rgba(220,240,255,0.8)';
ctx.lineWidth=1.8;
ctx.fillStyle='rgba(10,15,25,0.85)';

ctx.beginPath();
ctx.moveTo(0,-this.size*1.1);
ctx.lineTo(this.size*0.7,this.size*0.5);
ctx.lineTo(this.size*0.3,this.size*0.9);
ctx.lineTo(-this.size*0.3,this.size*0.9);
ctx.lineTo(-this.size*0.7,this.size*0.5);
ctx.closePath();
ctx.fill();
ctx.stroke();

ctx.shadowBlur=35;
ctx.strokeStyle='rgba(255,255,255,0.6)';
ctx.lineWidth=1.2;
ctx.beginPath();
ctx.moveTo(0,-this.size*0.8);
ctx.lineTo(0,this.size*0.7);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(-this.size*0.4,this.size*0.2);
ctx.lineTo(this.size*0.4,this.size*0.2);
ctx.stroke();

for(let i=0;i<3;i++){
let angleOffset=(i-1)*0.5;
ctx.save();
ctx.rotate(angleOffset);
ctx.shadowBlur=25;
ctx.strokeStyle='rgba(200,220,255,0.5)';
ctx.lineWidth=1;
ctx.beginPath();
ctx.moveTo(0,-this.size*0.7);
ctx.lineTo(-this.size*0.5,this.size*0.1);
ctx.stroke();
ctx.restore();
}

ctx.restore();

if(this.health<this.maxHealth){
ctx.save();
ctx.translate(this.x,this.y-this.size-15);
ctx.fillStyle='rgba(30,30,30,0.8)';
ctx.fillRect(-this.size,0,this.size*2,4);
ctx.fillStyle='rgba(200,220,255,0.9)';
ctx.fillRect(-this.size,0,(this.health/this.maxHealth)*this.size*2,4);
ctx.restore();
}
}
hit(dmg){
if(this.isDead)return false;
this.health-=dmg;
for(let i=0;i<5;i++)particles.push(new Particle(this.x,this.y,'#aaa'));
if(this.health<=0){
this.isDead=true;
streak++;
for(let i=0;i<<25;i++)particles.push(new Particle(this.x,this.y,i%3===0?'#fff':'#88aaff'));
const idx=enemies.indexOf(this);
if(idx>-1){
enemies.splice(idx,1);
if(this.type===3){
bossSpawned=false;
}
else{
let newEnemy=null;
if(this.type===0)newEnemy=new Enemy(0);
else if(this.type===1)newEnemy=new Enemy(1);
else if(this.type===2)newEnemy=new Enemy(2);
if(newEnemy)enemies.push(newEnemy);
}
}
return true;
}
return false;
}
}

function drawPlayer(){
player.coreGlow+=0.1;
ctx.save();
ctx.translate(player.x,player.y);
ctx.rotate(player.rotation);
ctx.shadowBlur=40;
ctx.shadowColor='rgba(100,150,255,0.7)';

ctx.strokeStyle='rgba(230,240,255,0.9)';
ctx.lineWidth=2.2;
ctx.fillStyle='rgba(15,25,40,0.8)';

ctx.beginPath();
ctx.moveTo(0,-player.size*1.2);
ctx.lineTo(player.size*0.9,player.size*0.6);
ctx.lineTo(player.size*0.4,player.size*0.9);
ctx.lineTo(0,player.size*0.7);
ctx.lineTo(-player.size*0.4,player.size*0.9);
ctx.lineTo(-player.size*0.9,player.size*0.6);
ctx.closePath();
ctx.fill();
ctx.stroke();

ctx.shadowBlur=45;
ctx.strokeStyle='rgba(255,255,255,0.7)';
ctx.lineWidth=1.5;
ctx.beginPath();
ctx.moveTo(0,-player.size*0.8);
ctx.lineTo(0,player.size*0.5);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(-player.size*0.3,player.size*0.2);
ctx.lineTo(player.size*0.3,player.size*0.2);
ctx.stroke();

for(let i=0;i<2;i++){
ctx.save();
ctx.rotate(i===0?0.3:-0.3);
ctx.shadowBlur=30;
ctx.strokeStyle='rgba(200,220,255,0.5)';
ctx.lineWidth=1.2;
ctx.beginPath();
ctx.moveTo(0,-player.size*0.6);
ctx.lineTo(-player.size*0.4,player.size*0.1);
ctx.stroke();
ctx.restore();
}

ctx.shadowBlur=50;
ctx.fillStyle='rgba(255,255,255,0.9)';
ctx.beginPath();
ctx.arc(0,-player.size*0.2,player.size*0.15,0,Math.PI*2);
ctx.fill();
ctx.restore();
}

function createSakuraPetal(){
if(Math.random()>.2)return;
sakuraPetals.push({x:Math.random()*canvas.width,y:-20,speedX:Math.random()*1-.5,speedY:.5+Math.random()*1,rotation:Math.random()*Math.PI*2,rotationSpeed:Math.random()*.02-.01,size:5+Math.random()*8,life:1});
}

function autoAttack(){
let nearest=null,nd=Infinity;
for(const e of enemies){if(e.isDead)continue;const dx=e.x-player.x,dy=e.y-player.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<nd){nd=d;nearest=e}}
if(nearest){
player.rotation=Math.atan2(nearest.y-player.y,nearest.x-player.x)*0.2;
if(nd<550){
for(let i=0;i<2;i++){
let offsetX=(Math.random()-0.5)*18;
let offsetY=(Math.random()-0.5)*18;
let bolt=new PlayerBolt(player.x+offsetX,player.y+offsetY,nearest.x,nearest.y);
playerBolts.push(bolt);
}
nearest.hit(22);
combo++;
health=Math.min(100,health+2);
}
}
}

function spawnInitialEnemies(){
enemies.push(new Enemy(0));
enemies.push(new Enemy(1));
enemies.push(new Enemy(2));
if(!bossSpawned){
enemies.push(new Enemy(3));
bossSpawned=true;
}
}

function update(){
player.velocity.x=0;player.velocity.y=0;
if(keys.w)player.velocity.y=-player.speed;
if(keys.s)player.velocity.y=player.speed;
if(keys.a)player.velocity.x=-player.speed;
if(keys.d)player.velocity.x=player.speed;
player.x=Math.min(canvas.width-player.size*.9,Math.max(player.size*.9,player.x+player.velocity.x));
player.y=Math.min(canvas.height-player.size*.9,Math.max(player.size*.9,player.y+player.velocity.y));
autoFireCooldown--;
if(autoFireCooldown<=0){autoAttack();autoFireCooldown=15}
for(const e of enemies)e.update();
for(let i=playerBolts.length-1;i>=0;i--){
playerBolts[i].update();
if(playerBolts[i].life<=0.05||playerBolts[i].age>45)playerBolts.splice(i,1);
}
for(let i=particles.length-1;i>=0;i--){particles[i].update();if(particles[i].life<=.01)particles.splice(i,1)}
for(let i=sakuraPetals.length-1;i>=0;i--){
const p=sakuraPetals[i];
p.x+=p.speedX;p.y+=p.speedY;p.rotation+=p.rotationSpeed;p.life-=.002;
if(p.y>canvas.height||p.life<=0)sakuraPetals.splice(i,1);
}
createSakuraPetal();
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
for(const p of sakuraPetals){
ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rotation);ctx.globalAlpha=p.life*.2;
ctx.fillStyle='rgba(255,255,255,.15)';
ctx.beginPath();ctx.moveTo(0,-p.size);ctx.lineTo(p.size*.8,p.size*.6);ctx.lineTo(-p.size*.8,p.size*.6);ctx.closePath();ctx.fill();ctx.restore();
}
particles.forEach(p=>p.draw());
playerBolts.forEach(b=>b.draw());
enemies.forEach(e=>e.draw());
drawPlayer();
}

function animate(){update();draw();requestAnimationFrame(animate)}

function handleResize(){
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
player.x=Math.min(canvas.width-player.size*.9,Math.max(player.size*.9,player.x));
player.y=Math.min(canvas.height-player.size*.9,Math.max(player.size*.9,player.y));
}

window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=true;e.preventDefault()}});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=false;e.preventDefault()}});
window.addEventListener('resize',handleResize);

spawnInitialEnemies();
for(let i=0;i<30;i++)createSakuraPetal();

animate();
</script>
</body>
</html>
All done!
