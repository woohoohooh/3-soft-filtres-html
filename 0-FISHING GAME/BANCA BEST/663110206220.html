```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID SOVEREIGN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:'Cinzel',serif;background:#000;color:#fff;overflow:hidden;height:100vh;cursor:none}
#gameCanvas{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 20% 30%,#111 0%,#000 30%),repeating-linear-gradient(45deg,#0a0a0a 0px,#0a0a0a 1px,#000 1px,#000 3px);z-index:1;outline:none}
.depth-lines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background-image:repeating-linear-gradient(90deg,transparent 0px,transparent 1px,rgba(255,255,255,.02) 1px,rgba(255,255,255,.02) 2px)}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="gameCanvas" tabindex="0"></canvas>
<div class="depth-lines"></div>

<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
canvas.focus();

let combo=0,streak=0,health=100;
let particles=[],enemies=[],stellarObjects=[],playerBolts=[];
let autoFireCooldown=0;
const keys={w:false,a:false,s:false,d:false};

const player={x:canvas.width/2,y:canvas.height-100,size:45,rotation:0,velocity:{x:0,y:0},speed:5,ringPhase:0,coreGlow:0};

class Particle{
constructor(x,y,color){this.x=x;this.y=y;this.color=color;this.size=Math.random()*6+2;this.speedX=Math.random()*5-2.5;this.speedY=Math.random()*5-2.5;this.life=.7+Math.random()*.3;this.decay=.02+Math.random()*.03}
update(){this.x+=this.speedX;this.y+=this.speedY;this.life-=this.decay;this.size*=.98}
draw(){ctx.save();ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore()}
}

class PlayerBolt{
constructor(x,y,targetX,targetY){
this.x=x;this.y=y;
this.targetX=targetX;this.targetY=targetY;
this.age=0;this.life=1;
this.points=[];
for(let i=0;i<10;i++)this.points.push({x:this.x,y:this.y});
}
update(){
this.age++;
if(this.age>30)this.life-=.05;
if(!stellarObjects.length)return;
let closest=null,closestDist=Infinity;
for(let e of stellarObjects){
if(e.isDead)continue;
let dx=e.x-this.x,dy=e.y-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d<closestDist){closestDist=d;closest=e;}
}
if(closest){
this.targetX=closest.x;
this.targetY=closest.y;
}
let dx=this.targetX-this.x;
let dy=this.targetY-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d>1){
this.x+=dx*0.28;
this.y+=dy*0.28;
}
this.points.shift();
this.points.push({x:this.x,y:this.y});
}
draw(){
ctx.save();
ctx.globalAlpha=this.life;
ctx.shadowBlur=35;
ctx.shadowColor='#fff';
ctx.strokeStyle='#fff';
ctx.lineWidth=3;
ctx.beginPath();
ctx.moveTo(this.points[0].x,this.points[0].y);
for(let i=1;i<this.points.length;i++)ctx.lineTo(this.points[i].x,this.points[i].y);
ctx.stroke();
ctx.shadowBlur=50;
ctx.lineWidth=2;
ctx.strokeStyle='rgba(200,230,255,0.8)';
ctx.beginPath();
ctx.moveTo(this.points[2].x,this.points[2].y);
for(let i=3;i<this.points.length;i++)ctx.lineTo(this.points[i].x,this.points[i].y);
ctx.stroke();
ctx.restore();
}
}

let bossSpawned=false;

class StellarObject{
constructor(type){
this.type=type || Math.floor(Math.random()*4);
this.size=35;
this.speed=0.7;
this.health=50;
this.maxHealth=50;
this.rotation=Math.random()*Math.PI*2;
this.rotSpeed=0.002+Math.random()*0.01;
this.hitCooldown=0;
this.isDead=false;
this.pulse=Math.random()*Math.PI*2;

if(this.type===0){ // asteroid shard
this.size=32; this.speed=0.6; this.health=45; this.maxHealth=45;
this.rotSpeed=0.005;
} else if(this.type===1){ // crystalline
this.size=28; this.speed=0.85; this.health=35; this.maxHealth=35;
this.rotSpeed=0.01;
} else if(this.type===2){ // comet core
this.size=40; this.speed=0.5; this.health=70; this.maxHealth=70;
this.rotSpeed=0.002;
} else if(this.type===3){ // void nexus (boss)
this.size=60; this.speed=1.6; this.health=220; this.maxHealth=220;
this.rotSpeed=0.0015;
bossSpawned=true;
}

const side=Math.floor(Math.random()*3);
if(side===0){this.x=Math.random()*canvas.width;this.y=-80}
else if(side===1){this.x=-80;this.y=Math.random()*canvas.height*0.6}
else{this.x=canvas.width+80;this.y=Math.random()*canvas.height*0.6}
}
update(){
if(this.isDead)return;
const dx=player.x-this.x,dy=player.y-this.y;
const d=Math.sqrt(dx*dx+dy*dy);
if(d>0){this.x+=(dx/d)*this.speed;this.y+=(dy/d)*this.speed}
this.rotation+=this.rotSpeed;
this.pulse+=0.02;
if(this.hitCooldown>0)this.hitCooldown--;
if(d<player.size+this.size+20 && this.hitCooldown<=0){
health=Math.max(0,health-8);
streak=0;
this.hitCooldown=30;
}
}
draw(){
if(this.isDead)return;
ctx.save();
ctx.translate(this.x,this.y);
ctx.rotate(this.rotation);
const glowScale=0.9+Math.sin(this.pulse)*0.1;
ctx.shadowBlur=30;
ctx.shadowColor='rgba(180,200,240,0.6)';
ctx.strokeStyle='rgba(210,230,250,0.7)';
ctx.lineWidth=2;
ctx.fillStyle='rgba(10,15,25,0.9)';

if(this.type===0){
ctx.beginPath();
for(let i=0;i<5;i++){
let angle=i*1.26+Math.sin(this.pulse)*0.2;
let rad=this.size*(0.8+Math.sin(angle*2)*0.2);
let x=Math.cos(angle)*rad;
let y=Math.sin(angle)*rad;
if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
}
ctx.closePath();
ctx.fill();
ctx.stroke();
ctx.beginPath();
ctx.arc(0,0,this.size*0.4,0,Math.PI*2);
ctx.fillStyle='rgba(40,45,60,0.7)';
ctx.fill();
ctx.stroke();
} else if(this.type===1){
ctx.beginPath();
ctx.arc(0,0,this.size*0.8,0,Math.PI*2);
ctx.fill();
ctx.stroke();
ctx.beginPath();
ctx.rotate(0.5);
for(let i=0;i<4;i++){
ctx.rotate(Math.PI/2);
ctx.moveTo(this.size*0.5,0);
ctx.lineTo(this.size*1.2,this.size*0.3);
ctx.lineTo(this.size*1.2,-this.size*0.3);
ctx.closePath();
ctx.fillStyle='rgba(30,40,60,0.7)';
ctx.fill();
ctx.strokeStyle='rgba(170,210,250,0.8)';
ctx.stroke();
}
} else if(this.type===2){
ctx.beginPath();
ctx.ellipse(0,0,this.size*1.1,this.size*0.6,0,0,Math.PI*2);
ctx.fill();
ctx.stroke();
ctx.beginPath();
ctx.arc(this.size*0.4,0,this.size*0.25,0,Math.PI*2);
ctx.fillStyle='rgba(30,35,55,0.9)';
ctx.fill();
ctx.stroke();
} else {
ctx.shadowBlur=50;
ctx.shadowColor='rgba(130,160,230,0.8)';
ctx.beginPath();
ctx.arc(0,0,this.size,0,Math.PI*2);
ctx.fillStyle='rgba(10,10,25,0.8)';
ctx.fill();
ctx.strokeStyle='rgba(200,220,255,0.9)';
ctx.lineWidth=3;
ctx.stroke();
for(let i=0;i<3;i++){
let a=i*2.09+this.pulse;
ctx.beginPath();
ctx.ellipse(Math.cos(a)*this.size*0.5,Math.sin(a)*this.size*0.5,this.size*0.25,this.size*0.15,a+0.3,0,Math.PI*2);
ctx.fillStyle='rgba(90,120,200,0.3)';
ctx.fill();
ctx.stroke();
}
}
if(this.health<this.maxHealth){
ctx.save();
ctx.rotate(-this.rotation);
ctx.translate(0,-this.size-18);
ctx.fillStyle='rgba(20,20,30,.8)';
ctx.fillRect(-this.size*1.2,0,this.size*2.4,5);
ctx.fillStyle='rgba(210,230,255,.9)';
ctx.fillRect(-this.size*1.2,0,(this.health/this.maxHealth)*this.size*2.4,5);
ctx.restore();
}
ctx.restore();
}
hit(dmg){
if(this.isDead)return false;
this.health-=dmg;
for(let i=0;i<8;i++)particles.push(new Particle(this.x+Math.random()*20-10,this.y+Math.random()*20-10,'#bcd'));
if(this.health<=0){
this.isDead=true;
streak++;
for(let i=0;i<20;i++)particles.push(new Particle(this.x+Math.random()*30-15,this.y+Math.random()*30-15,i%2?'#fff':'#aac'));
const idx=stellarObjects.indexOf(this);
if(idx>-1){
stellarObjects.splice(idx,1);
if(this.type===3) bossSpawned=false;
else{
let newObj=null;
if(this.type===0)newObj=new StellarObject(0);
else if(this.type===1)newObj=new StellarObject(1);
else if(this.type===2)newObj=new StellarObject(2);
if(newObj)stellarObjects.push(newObj);
}}
return true;
}
return false;
}
}

function drawPlayer(){
player.ringPhase+=0.15;
player.coreGlow+=0.08;
ctx.save();
ctx.translate(player.x,player.y);
ctx.rotate(player.rotation);
let ringPulse=0.7+Math.sin(player.ringPhase)*0.15;
ctx.shadowBlur=50;
ctx.shadowColor='rgba(170,210,255,0.9)';
ctx.strokeStyle='rgba(240,250,255,1)';
ctx.lineWidth=3.5;
ctx.fillStyle='rgba(5,15,25,0.85)';
ctx.beginPath();
ctx.moveTo(0,-player.size*1.3);
ctx.lineTo(player.size*0.9,player.size*0.2);
ctx.lineTo(player.size*0.8,player.size*0.5);
ctx.lineTo(player.size*0.3,player.size*0.3);
ctx.lineTo(0,player.size*0.6);
ctx.lineTo(-player.size*0.3,player.size*0.3);
ctx.lineTo(-player.size*0.8,player.size*0.5);
ctx.lineTo(-player.size*0.9,player.size*0.2);
ctx.closePath();
ctx.fill();
ctx.stroke();

ctx.shadowBlur=60;
ctx.fillStyle='rgba(120,180,255,0.5)';
ctx.beginPath();
ctx.arc(0,-player.size*0.2,player.size*0.3,0,Math.PI*2);
ctx.fill();

ctx.shadowBlur=70;
ctx.fillStyle='rgba(255,255,255,0.9)';
ctx.beginPath();
ctx.arc(0,-player.size*0.3,player.size*0.15,0,Math.PI*2);
ctx.fill();

ctx.shadowBlur=55;
ctx.fillStyle='rgba(180,210,255,0.5)';
ctx.beginPath();
ctx.ellipse(player.size*0.4,player.size*0.2,player.size*0.12,player.size*0.08,0,0,Math.PI*2);
ctx.fill();
ctx.beginPath();
ctx.ellipse(-player.size*0.4,player.size*0.2,player.size*0.12,player.size*0.08,0,0,Math.PI*2);
ctx.fill();

ctx.shadowBlur=40;
ctx.strokeStyle='rgba(250,250,255,0.7)';
ctx.lineWidth=1.5;
ctx.beginPath();
ctx.arc(0,-player.size*0.2,player.size*0.45,0,Math.PI*2);
ctx.stroke();
ctx.restore();
}

function autoAttack(){
let nearest=null,nd=Infinity;
for(const e of stellarObjects){if(e.isDead)continue;const dx=e.x-player.x,dy=e.y-player.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<nd){nd=d;nearest=e}}
if(nearest){
player.rotation=Math.atan2(nearest.y-player.y,nearest.x-player.x)*0.3;
if(nd<650){
for(let i=0;i<2;i++){
let offsetX=(Math.random()-0.5)*16;
let offsetY=(Math.random()-0.5)*16;
let bolt=new PlayerBolt(player.x+offsetX,player.y+offsetY,nearest.x+Math.random()*20-10,nearest.y+Math.random()*20-10);
playerBolts.push(bolt);
}
nearest.hit(20);
combo++;
health=Math.min(100,health+2.5);
}
}
}

function spawnInitialObjects(){
stellarObjects.push(new StellarObject(0));
stellarObjects.push(new StellarObject(1));
stellarObjects.push(new StellarObject(2));
if(!bossSpawned){stellarObjects.push(new StellarObject(3));bossSpawned=true;}
}

function update(){
player.velocity.x=0;player.velocity.y=0;
if(keys.w)player.velocity.y=-player.speed;
if(keys.s)player.velocity.y=player.speed;
if(keys.a)player.velocity.x=-player.speed;
if(keys.d)player.velocity.x=player.speed;
player.x=Math.min(canvas.width-player.size*.8,Math.max(player.size*.8,player.x+player.velocity.x));
player.y=Math.min(canvas.height-player.size*.8,Math.max(player.size*.8,player.y+player.velocity.y));
autoFireCooldown--;
if(autoFireCooldown<=0){autoAttack();autoFireCooldown=16}
for(const e of stellarObjects)e.update();
for(let i=playerBolts.length-1;i>=0;i--){
playerBolts[i].update();
if(playerBolts[i].life<=0.1||playerBolts[i].age>45)playerBolts.splice(i,1);
}
for(let i=particles.length-1;i>=0;i--){particles[i].update();if(particles[i].life<=.01)particles.splice(i,1)}
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
particles.forEach(p=>p.draw());
playerBolts.forEach(b=>b.draw());
stellarObjects.forEach(e=>e.draw());
drawPlayer();
}

function animate(){update();draw();requestAnimationFrame(animate)}

function handleResize(){
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
player.x=Math.min(canvas.width-player.size*.8,Math.max(player.size*.8,player.x));
player.y=Math.min(canvas.height-player.size*.8,Math.max(player.size*.8,player.y));
}

window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=true;e.preventDefault()}});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=false;e.preventDefault()}});
window.addEventListener('resize',handleResize);

spawnInitialObjects();
animate();
</script>
</body>
</html>
All done!
