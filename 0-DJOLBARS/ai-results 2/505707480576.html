<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEBULA SHARD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:'Cinzel',serif;background:#000;color:#fff;overflow:hidden;height:100vh;cursor:none}
#gameCanvas{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 80% 20%,#1a0933 0%,#000 40%),repeating-linear-gradient(135deg,#0d0b1a 0px,#0d0b1a 2px,#03010a 2px,#03010a 6px);z-index:1;outline:none}
.depth-lines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background-image:repeating-linear-gradient(180deg,transparent 0px,transparent 3px,rgba(100,60,200,.03) 3px,rgba(100,60,200,.03) 6px)}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="gameCanvas" tabindex="0"></canvas>
<div class="depth-lines"></div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
canvas.focus();

let combo=0,streak=0,health=100;
let particles=[],enemies=[],nebulaMotes=[],playerShards=[];
let autoFireCooldown=0;
const keys={w:false,a:false,s:false,d:false};

const player={x:canvas.width/2,y:canvas.height-150,size:38,rotation:0,velocity:{x:0,y:0},speed:5.5,glowPhase:0,wingBeat:0,coreAngle:0};

class Particle{
constructor(x,y,color){this.x=x;this.y=y;this.color=color;this.size=Math.random()*5+1.5;this.speedX=Math.random()*4-2;this.speedY=Math.random()*4-2;this.life=.8+Math.random()*.2;this.decay=.015+Math.random()*.025}
update(){this.x+=this.speedX;this.y+=this.speedY;this.life-=this.decay;this.size*=.97}
draw(){ctx.save();ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore()}
}

class PlayerShard{
constructor(x,y,targetX,targetY){
this.x=x;this.y=y;
this.targetX=targetX;this.targetY=targetY;
this.age=0;this.life=1;
this.segments=[];
for(let i=0;i<8;i++)this.segments.push({x:this.x,y:this.y});
}
update(){
this.age++;
if(this.age>22)this.life-=.07;
if(!enemies.length)return;
let closest=null,closestDist=Infinity;
for(let e of enemies){
if(e.isDead)continue;
let dx=e.x-this.x,dy=e.y-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d<closestDist){closestDist=d;closest=e;}
}
if(closest){
this.targetX=closest.x;
this.targetY=closest.y;
}
let dx=this.targetX-this.x;
let dy=this.targetY-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d>1){
this.x+=dx*0.28;
this.y+=dy*0.28;
}
this.segments.shift();
this.segments.push({x:this.x,y:this.y});
}
draw(){
ctx.save();
ctx.globalAlpha=this.life*0.9;
ctx.shadowBlur=30;
ctx.shadowColor='#c37df2';
ctx.strokeStyle='#dab0ff';
ctx.lineWidth=2.2;
ctx.beginPath();
ctx.moveTo(this.segments[0].x,this.segments[0].y);
for(let i=1;i<this.segments.length;i++)ctx.lineTo(this.segments[i].x,this.segments[i].y);
ctx.stroke();
ctx.shadowBlur=45;
ctx.shadowColor='#9f7aff';
ctx.lineWidth=1.2;
ctx.beginPath();
ctx.moveTo(this.segments[0].x,this.segments[0].y);
for(let i=1;i<this.segments.length;i++)ctx.lineTo(this.segments[i].x,this.segments[i].y);
ctx.stroke();
ctx.restore();
}
}

let bossSpawned=false;

class Enemy{
constructor(type){
this.type=type || Math.floor(Math.random()*4);
this.size=34;
this.speed=0.9;
this.health=45;
this.maxHealth=45;
this.rotation=Math.random()*Math.PI*2;
this.pulsePhase=Math.random()*Math.PI*2;
this.hitCooldown=0;
this.isDead=false;
this.orbitAngle=Math.random()*Math.PI*2;
this.arms=Math.floor(Math.random()*3)+3;

if(this.type===0){
this.size=30;
this.speed=0.75;
this.health=48;
this.maxHealth=48;
}
else if(this.type===1){
this.size=24;
this.speed=1.1;
this.health=35;
this.maxHealth=35;
}
else if(this.type===2){
this.size=42;
this.speed=0.65;
this.health=80;
this.maxHealth=80;
}
else if(this.type===3){
this.size=62;
this.speed=1.8;
this.health=200;
this.maxHealth=200;
this.arms=7;
bossSpawned=true;
}

const side=Math.floor(Math.random()*3);
if(side===0){this.x=Math.random()*canvas.width;this.y=-80}
if(side===1){this.x=-80;this.y=Math.random()*canvas.height*0.6}
if(side===2){this.x=canvas.width+80;this.y=Math.random()*canvas.height*0.6}
}
update(){
if(this.isDead)return;
const dx=player.x-this.x,dy=player.y-this.y;
const d=Math.sqrt(dx*dx+dy*dy);
if(d>0){this.x+=(dx/d)*this.speed;this.y+=(dy/d)*this.speed}
this.rotation+=0.02;
this.pulsePhase+=0.06;
this.orbitAngle+=0.025;
if(this.hitCooldown>0)this.hitCooldown--;
if(d<player.size+this.size+15 && this.hitCooldown<=0){
health=Math.max(0,health-9);
streak=0;
this.hitCooldown=25;
}
}
draw(){
if(this.isDead)return;
ctx.save();
ctx.translate(this.x,this.y);
ctx.rotate(this.rotation);
ctx.shadowBlur=25;
ctx.shadowColor='rgba(170,120,220,0.6)';
ctx.strokeStyle='rgba(200,160,240,0.8)';
ctx.lineWidth=2;
ctx.fillStyle='rgba(20,10,35,0.9)';

ctx.beginPath();
ctx.ellipse(0,0,this.size*0.7,this.size*0.5,0,0,Math.PI*2);
ctx.fill();
ctx.stroke();

for(let i=0;i<this.arms;i++){
let angle=this.orbitAngle + i*(Math.PI*2/this.arms);
let dist=this.size*0.9;
let x=Math.cos(angle)*dist;
let y=Math.sin(angle)*dist;
ctx.save();
ctx.translate(x,y);
ctx.rotate(angle);
ctx.shadowBlur=18;
ctx.fillStyle='rgba(35,15,50,0.8)';
ctx.strokeStyle='rgba(190,140,230,0.7)';
ctx.beginPath();
ctx.ellipse(0,0,this.size*0.15,this.size*0.25,0,0,Math.PI*2);
ctx.fill();
ctx.stroke();
ctx.restore();
}

ctx.shadowBlur=30;
ctx.strokeStyle='rgba(220,180,255,0.6)';
ctx.lineWidth=2;
ctx.beginPath();
ctx.moveTo(this.size*0.5,-this.size*0.3);
ctx.lineTo(this.size*1.0,0);
ctx.lineTo(this.size*0.5,this.size*0.3);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(-this.size*0.5,-this.size*0.3);
ctx.lineTo(-this.size*1.0,0);
ctx.lineTo(-this.size*0.5,this.size*0.3);
ctx.stroke();

if(this.health<this.maxHealth){
ctx.save();
ctx.rotate(-this.rotation);
ctx.translate(0,-this.size-18);
ctx.fillStyle='rgba(40,20,50,.8)';
ctx.fillRect(-this.size,0,this.size*2,5);
ctx.fillStyle='rgba(210,160,250,.9)';
ctx.fillRect(-this.size,0,(this.health/this.maxHealth)*this.size*2,5);
ctx.restore();
}
ctx.restore();
}
hit(dmg){
if(this.isDead)return false;
this.health-=dmg;
for(let i=0;i<6;i++)particles.push(new Particle(this.x,this.y,'#d9b0ff'));
if(this.health<=0){
this.isDead=true;
streak++;
for(let i=0;i<22;i++)particles.push(new Particle(this.x,this.y,i<8?'#f0d0ff':'#b284e6'));
const idx=enemies.indexOf(this);
if(idx>-1){
enemies.splice(idx,1);
if(this.type===3){
bossSpawned=false;
}
else{
let newEnemy=null;
if(this.type===0)newEnemy=new Enemy(0);
else if(this.type===1)newEnemy=new Enemy(1);
else if(this.type===2)newEnemy=new Enemy(2);
if(newEnemy)enemies.push(newEnemy);
}
}
return true;
}
return false;
}
}

function drawPlayer(){
player.glowPhase+=0.12;
player.wingBeat+=0.18;
player.coreAngle+=0.08;
ctx.save();
ctx.translate(player.x,player.y);
ctx.rotate(player.rotation);

let pulseGlow=0.6+Math.sin(player.glowPhase)*0.3;
let wingSway=Math.sin(player.wingBeat)*0.15;

ctx.shadowBlur=50;
ctx.shadowColor='rgba(200,130,255,0.9)';
ctx.strokeStyle='rgba(230,200,255,1)';
ctx.lineWidth=2.5;
ctx.fillStyle='rgba(18,8,30,0.85)';

ctx.beginPath();
ctx.moveTo(0,-player.size*1.2);
ctx.lineTo(player.size*0.7,-player.size*0.4);
ctx.lineTo(player.size*1.1,player.size*0.3);
ctx.lineTo(player.size*0.6,player.size*0.5);
ctx.lineTo(player.size*0.3,player.size*0.8);
ctx.lineTo(0,player.size*0.6);
ctx.lineTo(-player.size*0.3,player.size*0.8);
ctx.lineTo(-player.size*0.6,player.size*0.5);
ctx.lineTo(-player.size*1.1,player.size*0.3);
ctx.lineTo(-player.size*0.7,-player.size*0.4);
ctx.closePath();
ctx.fill();
ctx.stroke();

ctx.shadowBlur=40;
ctx.strokeStyle='rgba(255,230,255,0.7)';
ctx.lineWidth=1.8;
ctx.beginPath();
ctx.moveTo(player.size*0.3,player.size*0.8);
ctx.lineTo(player.size*0.5,player.size*1.1);
ctx.lineTo(0,player.size*0.9);
ctx.lineTo(-player.size*0.5,player.size*1.1);
ctx.lineTo(-player.size*0.3,player.size*0.8);
ctx.stroke();

ctx.shadowBlur=70;
ctx.fillStyle='rgba(230,190,255,0.8)';
ctx.beginPath();
ctx.ellipse(0,-player.size*0.3,player.size*0.2,player.size*0.15,0,0,Math.PI*2);
ctx.fill();
ctx.fillStyle='rgba(255,255,255,1)';
ctx.beginPath();
ctx.ellipse(0,-player.size*0.3,player.size*0.1,player.size*0.07,0,0,Math.PI*2);
ctx.fill();

ctx.fillStyle='rgba(255,200,240,0.6)';
ctx.beginPath();
ctx.arc(player.size*0.4,-player.size*0.1,player.size*0.1,0,Math.PI*2);
ctx.fill();
ctx.beginPath();
ctx.arc(-player.size*0.4,-player.size*0.1,player.size*0.1,0,Math.PI*2);
ctx.fill();

ctx.restore();
}

function createNebulaMote(){
if(Math.random()>.25)return;
nebulaMotes.push({x:Math.random()*canvas.width,y:canvas.height+20,speedX:Math.random()*0.6-0.3,speedY:-0.7-Math.random()*1.2,rotation:Math.random()*Math.PI*2,rotationSpeed:Math.random()*.01-.005,size:4+Math.random()*12,life:0.8+Math.random()*0.4});
}

function autoAttack(){
let nearest=null,nd=Infinity;
for(const e of enemies){if(e.isDead)continue;const dx=e.x-player.x,dy=e.y-player.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<nd){nd=d;nearest=e}}
if(nearest){
player.rotation=Math.atan2(nearest.y-player.y,nearest.x-player.x)*0.4;
if(nd<650){
for(let i=0;i<2;i++){
let offsetX=(Math.random()-0.5)*20;
let offsetY=(Math.random()-0.5)*20;
let shard=new PlayerShard(player.x+offsetX,player.y+offsetY,nearest.x,nearest.y);
playerShards.push(shard);
}
nearest.hit(18);
combo++;
health=Math.min(100,health+2);
}
}
}

function spawnInitialEnemies(){
enemies.push(new Enemy(0));
enemies.push(new Enemy(1));
enemies.push(new Enemy(2));
if(!bossSpawned){
enemies.push(new Enemy(3));
bossSpawned=true;
}
}

function update(){
player.velocity.x=0;player.velocity.y=0;
if(keys.w)player.velocity.y=-player.speed;
if(keys.s)player.velocity.y=player.speed;
if(keys.a)player.velocity.x=-player.speed;
if(keys.d)player.velocity.x=player.speed;
player.x=Math.min(canvas.width-player.size*.8,Math.max(player.size*.8,player.x+player.velocity.x));
player.y=Math.min(canvas.height-player.size*.8,Math.max(player.size*.8,player.y+player.velocity.y));
autoFireCooldown--;
if(autoFireCooldown<=0){autoAttack();autoFireCooldown=18}
for(const e of enemies)e.update();
for(let i=playerShards.length-1;i>=0;i--){
playerShards[i].update();
if(playerShards[i].life<=0.1||playerShards[i].age>40)playerShards.splice(i,1);
}
for(let i=particles.length-1;i>=0;i--){particles[i].update();if(particles[i].life<=.01)particles.splice(i,1)}
for(let i=nebulaMotes.length-1;i>=0;i--){
const m=nebulaMotes[i];
m.x+=m.speedX;m.y+=m.speedY;m.rotation+=m.rotationSpeed;m.life-=.003;
if(m.y<-50||m.life<=0)nebulaMotes.splice(i,1);
}
createNebulaMote();
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
for(const m of nebulaMotes){
ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.rotation);ctx.globalAlpha=m.life*0.2;
ctx.fillStyle='rgba(170,120,240,.2)';
ctx.beginPath();ctx.arc(0,0,m.size*0.7,0,Math.PI*2);ctx.fill();
ctx.fillStyle='rgba(220,160,255,.15)';
ctx.beginPath();ctx.arc(0,0,m.size,0,Math.PI*2);ctx.fill();
ctx.restore();
}
particles.forEach(p=>p.draw());
playerShards.forEach(s=>s.draw());
enemies.forEach(e=>e.draw());
drawPlayer();
}

function animate(){update();draw();requestAnimationFrame(animate)}

function handleResize(){
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
player.x=Math.min(canvas.width-player.size*.8,Math.max(player.size*.8,player.x));
player.y=Math.min(canvas.height-player.size*.8,Math.max(player.size*.8,player.y));
}

window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=true;e.preventDefault()}});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=false;e.preventDefault()}});
window.addEventListener('resize',handleResize);

spawnInitialEnemies();
for(let i=0;i<30;i++)createNebulaMote();

animate();
</script>
</body>
</html>
All done!
