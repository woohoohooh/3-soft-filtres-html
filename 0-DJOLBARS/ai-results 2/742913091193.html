<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEBULA SENTINEL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:'Cinzel',serif;background:#000;color:#fff;overflow:hidden;height:100vh;cursor:none}
#gameCanvas{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 70% 20%,#1a0f1a 0%,#050205 30%),repeating-linear-gradient(45deg,#1a0a1a 0px,#1a0a1a 1px,#000 1px,#000 3px);z-index:1;outline:none}
.depth-lines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background-image:repeating-linear-gradient(90deg,transparent 0px,transparent 1px,rgba(180,130,255,.03) 1px,rgba(180,130,255,.03) 2px)}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="gameCanvas" tabindex="0"></canvas>
<div class="depth-lines"></div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
canvas.focus();

let combo=0,streak=0,health=100;
let particles=[],enemies=[],spiritOrbs=[],playerBeams=[];
let autoFireCooldown=0;
const keys={w:false,a:false,s:false,d:false};

const player={x:canvas.width/2,y:canvas.height-100,size:48,rotation:0,velocity:{x:0,y:0},speed:5,coreGlow:0,wingPhase:0};

class Particle{
constructor(x,y,color){this.x=x;this.y=y;this.color=color;this.size=Math.random()*5+2;this.speedX=Math.random()*4-2;this.speedY=Math.random()*4-2;this.life=.6+Math.random()*.4;this.decay=.015+Math.random()*.025}
update(){this.x+=this.speedX;this.y+=this.speedY;this.life-=this.decay;this.size*=.97}
draw(){ctx.save();ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore()}
}

class PlayerBeam{
constructor(x,y,targetX,targetY){
this.x=x;this.y=y;
this.targetX=targetX;this.targetY=targetY;
this.age=0;this.life=1;
this.trail=[];
for(let i=0;i<8;i++)this.trail.push({x:this.x,y:this.y});
}
update(){
this.age++;
if(this.age>20)this.life-=.05;
if(!enemies.length)return;
let closest=null,closestDist=Infinity;
for(let e of enemies){
if(e.isDead)continue;
let dx=e.x-this.x,dy=e.y-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d<closestDist){closestDist=d;closest=e;}
}
if(closest){
this.targetX=closest.x;
this.targetY=closest.y;
}
let dx=this.targetX-this.x;
let dy=this.targetY-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d>1){
this.x+=dx*0.4;
this.y+=dy*0.4;
}
this.trail.shift();
this.trail.push({x:this.x,y:this.y});
}
draw(){
ctx.save();
ctx.globalAlpha=this.life*0.9;
ctx.shadowBlur=40;
ctx.shadowColor='#b380ff';
ctx.strokeStyle='#d9b3ff';
ctx.lineWidth=3.5;
ctx.beginPath();
ctx.moveTo(this.trail[0].x,this.trail[0].y);
for(let i=1;i<this.trail.length;i++)ctx.lineTo(this.trail[i].x,this.trail[i].y);
ctx.stroke();
ctx.shadowBlur=60;
ctx.lineWidth=2;
ctx.strokeStyle='#f0e6ff';
ctx.beginPath();
ctx.moveTo(this.trail[0].x,this.trail[0].y);
for(let i=1;i<this.trail.length;i++)ctx.lineTo(this.trail[i].x,this.trail[i].y);
ctx.stroke();
ctx.restore();
}
}

let bossSpawned=false;

class Enemy{
constructor(type){
this.type=type || Math.floor(Math.random()*4);
this.size=34;
this.speed=0.85;
this.health=45;
this.maxHealth=45;
this.rotation=Math.random()*Math.PI*2;
this.pulsePhase=Math.random()*Math.PI*2;
this.hitCooldown=0;
this.isDead=false;
this.orbitAngle=Math.random()*Math.PI*2;
this.subObjects=Math.floor(Math.random()*3)+2;

if(this.type===0){
this.size=30;
this.speed=0.7;
this.health=50;
this.maxHealth=50;
}
else if(this.type===1){
this.size=26;
this.speed=1.0;
this.health=38;
this.maxHealth=38;
}
else if(this.type===2){
this.size=40;
this.speed=0.6;
this.health=75;
this.maxHealth=75;
}
else if(this.type===3){
this.size=58;
this.speed=1.9;
this.health=190;
this.maxHealth=190;
this.subObjects=5;
bossSpawned=true;
}

const side=Math.floor(Math.random()*3);
if(side===0){this.x=Math.random()*canvas.width;this.y=-80}
if(side===1){this.x=-80;this.y=Math.random()*canvas.height*0.6}
if(side===2){this.x=canvas.width+80;this.y=Math.random()*canvas.height*0.6}
}
update(){
if(this.isDead)return;
const dx=player.x-this.x,dy=player.y-this.y;
const d=Math.sqrt(dx*dx+dy*dy);
if(d>0){this.x+=(dx/d)*this.speed;this.y+=(dy/d)*this.speed}
this.rotation+=0.015;
this.pulsePhase+=0.05;
this.orbitAngle+=0.02;
if(this.hitCooldown>0)this.hitCooldown--;
if(d<player.size+this.size+20 && this.hitCooldown<=0){
health=Math.max(0,health-8);
streak=0;
this.hitCooldown=30;
}
}
draw(){
if(this.isDead)return;
ctx.save();
ctx.translate(this.x,this.y);
ctx.rotate(this.rotation);
ctx.shadowBlur=20;
ctx.shadowColor='rgba(200,150,255,0.5)';
ctx.strokeStyle='rgba(210,180,255,0.7)';
ctx.lineWidth=2;
ctx.fillStyle='rgba(25,15,35,0.9)';

ctx.beginPath();
ctx.arc(0,0,this.size*0.6,0,Math.PI*2);
ctx.fill();
ctx.stroke();

for(let i=0;i<this.subObjects;i++){
let angle=this.orbitAngle + i*(Math.PI*2/this.subObjects);
let dist=this.size*0.8;
let x=Math.cos(angle)*dist;
let y=Math.sin(angle)*dist;
ctx.save();
ctx.translate(x,y);
ctx.rotate(angle);
ctx.shadowBlur=15;
ctx.fillStyle='rgba(40,25,55,0.8)';
ctx.strokeStyle='rgba(200,170,255,0.6)';
ctx.beginPath();
ctx.ellipse(0,0,this.size*0.2,this.size*0.1,0,0,Math.PI*2);
ctx.fill();
ctx.stroke();
ctx.restore();
}

ctx.shadowBlur=25;
ctx.strokeStyle='rgba(230,210,255,0.5)';
ctx.lineWidth=1.5;
ctx.beginPath();
ctx.moveTo(this.size*0.4,-this.size*0.2);
ctx.lineTo(this.size*0.9,0);
ctx.lineTo(this.size*0.4,this.size*0.2);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(-this.size*0.4,-this.size*0.2);
ctx.lineTo(-this.size*0.9,0);
ctx.lineTo(-this.size*0.4,this.size*0.2);
ctx.stroke();

if(this.health<this.maxHealth){
ctx.save();
ctx.rotate(-this.rotation);
ctx.translate(0,-this.size-15);
ctx.fillStyle='rgba(40,30,50,.7)';
ctx.fillRect(-this.size,0,this.size*2,4);
ctx.fillStyle='rgba(220,200,255,.9)';
ctx.fillRect(-this.size,0,(this.health/this.maxHealth)*this.size*2,4);
ctx.restore();
}
ctx.restore();
}
hit(dmg){
if(this.isDead)return false;
this.health-=dmg;
for(let i=0;i<6;i++)particles.push(new Particle(this.x,this.y,'#d9b3ff'));
if(this.health<=0){
this.isDead=true;
streak++;
for(let i=0;i<22;i++)particles.push(new Particle(this.x,this.y,i<8?'#f0e6ff':'#b380ff'));
const idx=enemies.indexOf(this);
if(idx>-1){
enemies.splice(idx,1);
if(this.type===3){
bossSpawned=false;
}
else{
let newEnemy=null;
if(this.type===0)newEnemy=new Enemy(0);
else if(this.type===1)newEnemy=new Enemy(1);
else if(this.type===2)newEnemy=new Enemy(2);
if(newEnemy)enemies.push(newEnemy);
}
}
return true;
}
return false;
}
}

function drawPlayer(){
player.coreGlow+=0.12;
player.wingPhase+=0.18;
ctx.save();
ctx.translate(player.x,player.y);
ctx.rotate(player.rotation);

let pulseIntensity=0.4+Math.sin(player.coreGlow)*0.2;
ctx.shadowBlur=50;
ctx.shadowColor='rgba(200,130,255,0.9)';
ctx.strokeStyle='#c28aff';
ctx.lineWidth=3.2;
ctx.fillStyle='#1a0f26';

ctx.beginPath();
ctx.moveTo(0,-player.size*1.2);
ctx.lineTo(player.size*0.6,-player.size*0.4);
ctx.lineTo(player.size*0.9,player.size*0.1);
ctx.lineTo(player.size*0.5,player.size*0.6);
ctx.lineTo(0,player.size*0.9);
ctx.lineTo(-player.size*0.5,player.size*0.6);
ctx.lineTo(-player.size*0.9,player.size*0.1);
ctx.lineTo(-player.size*0.6,-player.size*0.4);
ctx.closePath();
ctx.fill();
ctx.stroke();

ctx.shadowBlur=40;
ctx.strokeStyle='#e6ccff';
ctx.lineWidth=2.2;
ctx.beginPath();
ctx.moveTo(player.size*0.5,player.size*0.6);
ctx.lineTo(player.size*0.8,player.size*1.0);
ctx.lineTo(player.size*0.2,player.size*0.8);
ctx.lineTo(-player.size*0.2,player.size*0.8);
ctx.lineTo(-player.size*0.8,player.size*1.0);
ctx.lineTo(-player.size*0.5,player.size*0.6);
ctx.stroke();

ctx.shadowBlur=70;
ctx.fillStyle='#c28aff';
ctx.globalAlpha=0.6;
ctx.beginPath();
ctx.arc(0,-player.size*0.3,player.size*0.25,0,Math.PI*2);
ctx.fill();
ctx.fillStyle='#ffffff';
ctx.globalAlpha=1;
ctx.beginPath();
ctx.arc(0,-player.size*0.3,player.size*0.12,0,Math.PI*2);
ctx.fill();
ctx.restore();
}

function createSpiritOrb(){
if(Math.random()>.3)return;
spiritOrbs.push({x:Math.random()*canvas.width,y:-20,speedX:Math.random()*1.2-0.6,speedY:0.4+Math.random()*1.2,rotation:Math.random()*Math.PI*2,rotationSpeed:Math.random()*.03-0.015,size:4+Math.random()*10,life:1});
}

function autoAttack(){
let nearest=null,nd=Infinity;
for(const e of enemies){if(e.isDead)continue;const dx=e.x-player.x,dy=e.y-player.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<nd){nd=d;nearest=e}}
if(nearest){
player.rotation=Math.atan2(nearest.y-player.y,nearest.x-player.x)*0.5;
if(nd<650){
for(let i=0;i<2;i++){
let offsetX=(Math.random()-0.5)*20;
let offsetY=(Math.random()-0.5)*20;
let beam=new PlayerBeam(player.x+offsetX,player.y+offsetY,nearest.x,nearest.y);
playerBeams.push(beam);
}
nearest.hit(20);
combo++;
health=Math.min(100,health+2);
}
}
}

function spawnInitialEnemies(){
enemies.push(new Enemy(0));
enemies.push(new Enemy(1));
enemies.push(new Enemy(2));
if(!bossSpawned){
enemies.push(new Enemy(3));
bossSpawned=true;
}
}

function update(){
player.velocity.x=0;player.velocity.y=0;
if(keys.w)player.velocity.y=-player.speed;
if(keys.s)player.velocity.y=player.speed;
if(keys.a)player.velocity.x=-player.speed;
if(keys.d)player.velocity.x=player.speed;
player.x=Math.min(canvas.width-player.size*.8,Math.max(player.size*.8,player.x+player.velocity.x));
player.y=Math.min(canvas.height-player.size*.8,Math.max(player.size*.8,player.y+player.velocity.y));
autoFireCooldown--;
if(autoFireCooldown<=0){autoAttack();autoFireCooldown=16}
for(const e of enemies)e.update();
for(let i=playerBeams.length-1;i>=0;i--){
playerBeams[i].update();
if(playerBeams[i].life<=0.1||playerBeams[i].age>40)playerBeams.splice(i,1);
}
for(let i=particles.length-1;i>=0;i--){particles[i].update();if(particles[i].life<=.01)particles.splice(i,1)}
for(let i=spiritOrbs.length-1;i>=0;i--){
const p=spiritOrbs[i];
p.x+=p.speedX;p.y+=p.speedY;p.rotation+=p.rotationSpeed;p.life-=.0025;
if(p.y>canvas.height||p.life<=0)spiritOrbs.splice(i,1);
}
createSpiritOrb();
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
for(const p of spiritOrbs){
ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rotation);ctx.globalAlpha=p.life*0.25;
ctx.fillStyle='#c28aff';
ctx.beginPath();ctx.arc(0,0,p.size,0,Math.PI*2);ctx.fill();ctx.restore();
}
particles.forEach(p=>p.draw());
playerBeams.forEach(b=>b.draw());
enemies.forEach(e=>e.draw());
drawPlayer();
}

function animate(){update();draw();requestAnimationFrame(animate)}

function handleResize(){
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
player.x=Math.min(canvas.width-player.size*.8,Math.max(player.size*.8,player.x));
player.y=Math.min(canvas.height-player.size*.8,Math.max(player.size*.8,player.y));
}

window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=true;e.preventDefault()}});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=false;e.preventDefault()}});
window.addEventListener('resize',handleResize);

spawnInitialEnemies();
for(let i=0;i<30;i++)createSpiritOrb();

animate();
</script>
</body>
</html>
All done!
