```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEBULA NOMAD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:'Cinzel',serif;background:#000;color:#fff;overflow:hidden;height:100vh;cursor:none}
#gameCanvas{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 80% 20%,#1a0f1f 0%,#030004 40%,#000 80%),repeating-linear-gradient(135deg,#150b1a 0px,#150b1a 2px,#1a0c1a 2px,#1a0c1a 4px);z-index:1;outline:none}
.depth-lines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background-image:repeating-linear-gradient(45deg,transparent 0px,transparent 8px,rgba(80,20,120,0.08) 8px,rgba(40,10,70,0.08) 12px)}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="gameCanvas" tabindex="0"></canvas>
<div class="depth-lines"></div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
canvas.focus();

let combo=0,streak=0,health=100;
let particles=[],enemies=[],sakuraPetals=[],playerBolts=[];
let autoFireCooldown=0;
const keys={w:false,a:false,s:false,d:false};

const player={x:canvas.width/2,y:canvas.height-100,size:38,rotation:0,velocity:{x:0,y:0},speed:5,glowPhase:0,droneWobble:0};

class Particle{
constructor(x,y,color){this.x=x;this.y=y;this.color=color;this.size=Math.random()*7+3;this.speedX=Math.random()*6-3;this.speedY=Math.random()*6-3;this.life=.8+Math.random()*.2;this.decay=.015+Math.random()*.025}
update(){this.x+=this.speedX;this.y+=this.speedY;this.life-=this.decay;this.size*=.97}
draw(){ctx.save();ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore()}
}

class PlayerBolt{
constructor(x,y,targetX,targetY){
this.x=x;this.y=y;
this.targetX=targetX;this.targetY=targetY;
this.age=0;this.life=1;
this.points=[];
for(let i=0;i<10;i++)this.points.push({x:this.x,y:this.y});
}
update(){
this.age++;
if(this.age>22)this.life-=.07;
if(!enemies.length)return;
let closest=null,closestDist=Infinity;
for(let e of enemies){
if(e.isDead)continue;
let dx=e.x-this.x,dy=e.y-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d<closestDist){closestDist=d;closest=e;}
}
if(closest){
this.targetX=closest.x;
this.targetY=closest.y;
}
let dx=this.targetX-this.x;
let dy=this.targetY-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d>1){
this.x+=dx*0.4;
this.y+=dy*0.4;
}
this.points.shift();
this.points.push({x:this.x,y:this.y});
}
draw(){
ctx.save();
ctx.globalAlpha=this.life*0.9;
ctx.shadowBlur=40;
ctx.shadowColor='#b380ff';
ctx.strokeStyle='#d9b3ff';
ctx.lineWidth=2.5;
ctx.beginPath();
ctx.moveTo(this.points[0].x,this.points[0].y);
for(let i=1;i<this.points.length;i++)ctx.lineTo(this.points[i].x,this.points[i].y);
ctx.stroke();
ctx.shadowBlur=60;
ctx.lineWidth=1.8;
ctx.strokeStyle='#f2e6ff';
ctx.beginPath();
ctx.moveTo(this.points[0].x,this.points[0].y);
for(let i=1;i<this.points.length;i++)ctx.lineTo(this.points[i].x,this.points[i].y);
ctx.stroke();
ctx.restore();
}
}

let bossSpawned=false;

class Enemy{
constructor(type){
this.type=type || Math.floor(Math.random()*4);
this.size=36;
this.speed=0.9;
this.health=50;
this.maxHealth=50;
this.rotation=Math.random()*Math.PI*2;
this.pulsePhase=Math.random()*Math.PI*2;
this.hitCooldown=0;
this.isDead=false;
this.orbitAngle=Math.random()*Math.PI*2;
this.subObjects=Math.floor(Math.random()*3)+2;

if(this.type===0){
this.size=32;
this.speed=0.75;
this.health=55;
this.maxHealth=55;
}
else if(this.type===1){
this.size=28;
this.speed=1.1;
this.health=42;
this.maxHealth=42;
}
else if(this.type===2){
this.size=44;
this.speed=0.65;
this.health=85;
this.maxHealth=85;
}
else if(this.type===3){
this.size=62;
this.speed=2.0;
this.health=210;
this.maxHealth=210;
this.subObjects=6;
bossSpawned=true;
}

const side=Math.floor(Math.random()*3);
if(side===0){this.x=Math.random()*canvas.width;this.y=-90}
if(side===1){this.x=-90;this.y=Math.random()*canvas.height*0.6}
if(side===2){this.x=canvas.width+90;this.y=Math.random()*canvas.height*0.6}
}
update(){
if(this.isDead)return;
const dx=player.x-this.x,dy=player.y-this.y;
const d=Math.sqrt(dx*dx+dy*dy);
if(d>0){this.x+=(dx/d)*this.speed;this.y+=(dy/d)*this.speed}
this.rotation+=0.02;
this.pulsePhase+=0.06;
this.orbitAngle+=0.025;
if(this.hitCooldown>0)this.hitCooldown--;
if(d<player.size+this.size+18 && this.hitCooldown<=0){
health=Math.max(0,health-9);
streak=0;
this.hitCooldown=28;
}
}
draw(){
if(this.isDead)return;
ctx.save();
ctx.translate(this.x,this.y);
ctx.rotate(this.rotation);
ctx.shadowBlur=25;
ctx.shadowColor='rgba(150,80,220,0.7)';
ctx.strokeStyle='rgba(200,150,250,0.8)';
ctx.lineWidth=2.2;
ctx.fillStyle='rgba(20,10,35,0.95)';

ctx.beginPath();
ctx.arc(0,0,this.size*0.65,0,Math.PI*2);
ctx.fill();
ctx.stroke();

for(let i=0;i<this.subObjects;i++){
let angle=this.orbitAngle + i*(Math.PI*2/this.subObjects);
let dist=this.size*0.85;
let x=Math.cos(angle)*dist;
let y=Math.sin(angle)*dist;
ctx.save();
ctx.translate(x,y);
ctx.rotate(angle+0.3);
ctx.shadowBlur=18;
ctx.fillStyle='rgba(40,20,60,0.9)';
ctx.strokeStyle='rgba(180,130,240,0.7)';
ctx.beginPath();
ctx.ellipse(0,0,this.size*0.22,this.size*0.12,0,0,Math.PI*2);
ctx.fill();
ctx.stroke();
ctx.restore();
}

ctx.shadowBlur=30;
ctx.strokeStyle='rgba(220,180,255,0.6)';
ctx.lineWidth=2;
ctx.beginPath();
ctx.moveTo(this.size*0.5,-this.size*0.3);
ctx.lineTo(this.size*1.0,-0);
ctx.lineTo(this.size*0.5,this.size*0.3);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(-this.size*0.5,-this.size*0.3);
ctx.lineTo(-this.size*1.0,0);
ctx.lineTo(-this.size*0.5,this.size*0.3);
ctx.stroke();

if(this.health<this.maxHealth){
ctx.save();
ctx.rotate(-this.rotation);
ctx.translate(0,-this.size-18);
ctx.fillStyle='rgba(30,10,40,.8)';
ctx.fillRect(-this.size,0,this.size*2,5);
ctx.fillStyle='rgba(200,130,250,.9)';
ctx.fillRect(-this.size,0,(this.health/this.maxHealth)*this.size*2,5);
ctx.restore();
}
ctx.restore();
}
hit(dmg){
if(this.isDead)return false;
this.health-=dmg;
for(let i=0;i<7;i++)particles.push(new Particle(this.x,this.y,'#c08aff'));
if(this.health<=0){
this.isDead=true;
streak++;
for(let i=0;i<25;i++)particles.push(new Particle(this.x,this.y,i<10?'#e6ccff':'#aa80ff'));
const idx=enemies.indexOf(this);
if(idx>-1){
enemies.splice(idx,1);
if(this.type===3){
bossSpawned=false;
}
else{
let newEnemy=null;
if(this.type===0)newEnemy=new Enemy(0);
else if(this.type===1)newEnemy=new Enemy(1);
else if(this.type===2)newEnemy=new Enemy(2);
if(newEnemy)enemies.push(newEnemy);
}
}
return true;
}
return false;
}
}

function drawPlayer(){
player.glowPhase+=0.15;
player.droneWobble+=0.2;
ctx.save();
ctx.translate(player.x,player.y);
ctx.rotate(player.rotation);

let pulseIntensity=0.6+Math.sin(player.glowPhase)*0.25;
ctx.shadowBlur=55;
ctx.shadowColor='rgba(170,100,255,0.9)';
ctx.strokeStyle='rgba(220,180,255,1)';
ctx.lineWidth=3;
ctx.fillStyle='rgba(20,5,30,0.9)';

ctx.beginPath();
ctx.ellipse(0,-player.size*0.6,player.size*0.4,player.size*0.25,0,0,Math.PI*2);
ctx.fill();
ctx.stroke();

ctx.beginPath();
ctx.ellipse(0,player.size*0.2,player.size*0.55,player.size*0.3,0,0,Math.PI*2);
ctx.fill();
ctx.stroke();

ctx.beginPath();
ctx.moveTo(-player.size*0.3,-player.size*0.4);
ctx.lineTo(-player.size*0.8,-player.size*0.8);
ctx.lineTo(-player.size*0.6,player.size*0.1);
ctx.closePath();
ctx.fillStyle='rgba(60,20,80,0.8)';
ctx.fill();
ctx.strokeStyle='rgba(210,150,255,0.7)';
ctx.stroke();

ctx.beginPath();
ctx.moveTo(player.size*0.3,-player.size*0.4);
ctx.lineTo(player.size*0.8,-player.size*0.8);
ctx.lineTo(player.size*0.6,player.size*0.1);
ctx.closePath();
ctx.fill();
ctx.stroke();

ctx.shadowBlur=40;
ctx.fillStyle='rgba(150,80,220,0.7)';
ctx.beginPath();
ctx.arc(-player.size*0.25,player.size*0.3,player.size*0.13,0,Math.PI*2);
ctx.fill();
ctx.beginPath();
ctx.arc(player.size*0.25,player.size*0.3,player.size*0.13,0,Math.PI*2);
ctx.fill();

ctx.shadowBlur=70;
ctx.fillStyle='#ffffff';
ctx.beginPath();
ctx.arc(-player.size*0.25,player.size*0.3,player.size*0.05,0,Math.PI*2);
ctx.fill();
ctx.beginPath();
ctx.arc(player.size*0.25,player.size*0.3,player.size*0.05,0,Math.PI*2);
ctx.fill();

ctx.restore();
}

function createSakuraPetal(){
if(Math.random()>.3)return;
sakuraPetals.push({x:Math.random()*canvas.width,y:-15,speedX:Math.random()*0.8-0.4,speedY:0.7+Math.random()*1.2,rotation:Math.random()*Math.PI*2,rotationSpeed:Math.random()*.03-.015,size:4+Math.random()*10,life:1});
}

function autoAttack(){
let nearest=null,nd=Infinity;
for(const e of enemies){if(e.isDead)continue;const dx=e.x-player.x,dy=e.y-player.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<nd){nd=d;nearest=e}}
if(nearest){
player.rotation=Math.atan2(nearest.y-player.y,nearest.x-player.x)*0.4;
if(nd<650){
for(let i=0;i<2;i++){
let offsetX=(Math.random()-0.5)*12;
let offsetY=(Math.random()-0.5)*12;
let bolt=new PlayerBolt(player.x+offsetX,player.y+offsetY,nearest.x,nearest.y);
playerBolts.push(bolt);
}
nearest.hit(18);
combo++;
health=Math.min(100,health+2);
}
}
}

function spawnInitialEnemies(){
enemies.push(new Enemy(0));
enemies.push(new Enemy(1));
enemies.push(new Enemy(2));
if(!bossSpawned){
enemies.push(new Enemy(3));
bossSpawned=true;
}
}

function update(){
player.velocity.x=0;player.velocity.y=0;
if(keys.w)player.velocity.y=-player.speed;
if(keys.s)player.velocity.y=player.speed;
if(keys.a)player.velocity.x=-player.speed;
if(keys.d)player.velocity.x=player.speed;
player.x=Math.min(canvas.width-player.size*.7,Math.max(player.size*.7,player.x+player.velocity.x));
player.y=Math.min(canvas.height-player.size*.7,Math.max(player.size*.7,player.y+player.velocity.y));
autoFireCooldown--;
if(autoFireCooldown<=0){autoAttack();autoFireCooldown=15}
for(const e of enemies)e.update();
for(let i=playerBolts.length-1;i>=0;i--){
playerBolts[i].update();
if(playerBolts[i].life<=0.1||playerBolts[i].age>40)playerBolts.splice(i,1);
}
for(let i=particles.length-1;i>=0;i--){particles[i].update();if(particles[i].life<=.01)particles.splice(i,1)}
for(let i=sakuraPetals.length-1;i>=0;i--){
const p=sakuraPetals[i];
p.x+=p.speedX;p.y+=p.speedY;p.rotation+=p.rotationSpeed;p.life-=.003;
if(p.y>canvas.height||p.life<=0)sakuraPetals.splice(i,1);
}
createSakuraPetal();
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
for(const p of sakuraPetals){
ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rotation);ctx.globalAlpha=p.life*0.3;
ctx.fillStyle='rgba(210,180,255,.2)';
ctx.beginPath();ctx.moveTo(0,-p.size);ctx.lineTo(p.size*.7,p.size*.5);ctx.lineTo(-p.size*.7,p.size*.5);ctx.closePath();ctx.fill();ctx.restore();
}
particles.forEach(p=>p.draw());
playerBolts.forEach(b=>b.draw());
enemies.forEach(e=>e.draw());
drawPlayer();
}

function animate(){update();draw();requestAnimationFrame(animate)}

function handleResize(){
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
player.x=Math.min(canvas.width-player.size*.7,Math.max(player.size*.7,player.x));
player.y=Math.min(canvas.height-player.size*.7,Math.max(player.size*.7,player.y));
}

window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=true;e.preventDefault()}});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=false;e.preventDefault()}});
window.addEventListener('resize',handleResize);

spawnInitialEnemies();
for(let i=0;i<30;i++)createSakuraPetal();

animate();
</script>
</body>
</html>
All done!
