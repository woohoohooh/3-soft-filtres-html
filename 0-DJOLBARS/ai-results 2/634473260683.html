```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARWEB WEAVER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:'Cinzel',serif;background:#000;color:#fff;overflow:hidden;height:100vh;cursor:none}
#gameCanvas{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 80% 20%,#0a0f1a 0%,#030405 40%),repeating-linear-gradient(45deg,#101215 0px,#101215 2px,#0a0c0f 2px,#0a0c0f 6px);z-index:1;outline:none}
.depth-lines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background-image:repeating-linear-gradient(0deg,transparent 0px,transparent 2px,rgba(80,140,255,.03) 2px,rgba(80,140,255,.03) 5px)}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="gameCanvas" tabindex="0"></canvas>
<div class="depth-lines"></div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
canvas.focus();

let combo=0,streak=0,health=100;
let particles=[],enemies=[],sakuraPetals=[],playerBolts=[];
let autoFireCooldown=0;
const keys={w:false,a:false,s:false,d:false};

const player={x:canvas.width/2,y:canvas.height-120,size:48,rotation:0,velocity:{x:0,y:0},speed:5.5,coreGlow:0,wingOsc:0,tentacleAngle:0};

class Particle{
constructor(x,y,color){this.x=x;this.y=y;this.color=color;this.size=Math.random()*5+2;this.speedX=Math.random()*6-3;this.speedY=Math.random()*6-3;this.life=.8+Math.random()*.2;this.decay=.015+Math.random()*.03}
update(){this.x+=this.speedX;this.y+=this.speedY;this.life-=this.decay;this.size*=.97}
draw(){ctx.save();ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore()}
}

class PlayerBolt{
constructor(x,y,targetX,targetY){
this.x=x;this.y=y;
this.targetX=targetX;this.targetY=targetY;
this.age=0;this.life=1;
this.trail=[];
for(let i=0;i<10;i++)this.trail.push({x:this.x,y:this.y});
}
update(){
this.age++;
if(this.age>24)this.life-=.05;
if(!enemies.length)return;
let closest=null,closestDist=Infinity;
for(let e of enemies){
if(e.isDead)continue;
let dx=e.x-this.x,dy=e.y-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d<closestDist){closestDist=d;closest=e;}
}
if(closest){
this.targetX=closest.x;
this.targetY=closest.y;
}
let dx=this.targetX-this.x;
let dy=this.targetY-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d>2){
this.x+=dx*0.3;
this.y+=dy*0.3;
}
this.trail.shift();
this.trail.push({x:this.x,y:this.y});
}
draw(){
ctx.save();
ctx.globalAlpha=this.life*0.9;
ctx.shadowBlur=30;
ctx.shadowColor='#7ec8ff';
ctx.strokeStyle='#c2e2ff';
ctx.lineWidth=2.5;
ctx.beginPath();
ctx.moveTo(this.trail[0].x,this.trail[0].y);
for(let i=1;i<this.trail.length;i++)ctx.lineTo(this.trail[i].x,this.trail[i].y);
ctx.stroke();
ctx.shadowBlur=45;
ctx.lineWidth=1.5;
ctx.strokeStyle='#fff';
ctx.beginPath();
ctx.moveTo(this.trail[0].x,this.trail[0].y);
for(let i=1;i<this.trail.length;i++)ctx.lineTo(this.trail[i].x,this.trail[i].y);
ctx.stroke();
ctx.restore();
}
}

let bossSpawned=false;

class Enemy{
constructor(type){
this.type=type || Math.floor(Math.random()*4);
this.size=38;
this.speed=0.9;
this.health=55;
this.maxHealth=55;
this.rotation=Math.random()*Math.PI*2;
this.twitch=Math.random()*Math.PI*2;
this.hitCooldown=0;
this.isDead=false;
this.armPhase=Math.random()*Math.PI*2;
this.armCount=Math.floor(Math.random()*4)+4;

if(this.type===0){
this.size=32;
this.speed=0.8;
this.health=60;
this.maxHealth=60;
}
else if(this.type===1){
this.size=28;
this.speed=1.2;
this.health=42;
this.maxHealth=42;
}
else if(this.type===2){
this.size=44;
this.speed=0.7;
this.health=88;
this.maxHealth=88;
}
else if(this.type===3){
this.size=64;
this.speed=2.1;
this.health=220;
this.maxHealth=220;
this.armCount=8;
bossSpawned=true;
}

const side=Math.floor(Math.random()*3);
if(side===0){this.x=Math.random()*canvas.width;this.y=-90}
if(side===1){this.x=-90;this.y=Math.random()*canvas.height*0.6}
if(side===2){this.x=canvas.width+90;this.y=Math.random()*canvas.height*0.6}
}
update(){
if(this.isDead)return;
const dx=player.x-this.x,dy=player.y-this.y;
const d=Math.sqrt(dx*dx+dy*dy);
if(d>0){this.x+=(dx/d)*this.speed;this.y+=(dy/d)*this.speed}
this.rotation+=0.02;
this.twitch+=0.1;
this.armPhase+=0.03;
if(this.hitCooldown>0)this.hitCooldown--;
if(d<player.size+this.size+15 && this.hitCooldown<=0){
health=Math.max(0,health-10);
streak=0;
this.hitCooldown=25;
}
}
draw(){
if(this.isDead)return;
ctx.save();
ctx.translate(this.x,this.y);
ctx.rotate(this.rotation);
ctx.shadowBlur=25;
ctx.shadowColor='rgba(70,180,240,0.6)';
ctx.strokeStyle='rgba(150,200,255,0.8)';
ctx.lineWidth=2.2;
ctx.fillStyle='rgba(8,20,30,0.9)';

ctx.beginPath();
ctx.ellipse(0,0,this.size*0.7,this.size*0.5,0,0,Math.PI*2);
ctx.fill();
ctx.stroke();

for(let i=0;i<this.armCount;i++){
let angle=this.armPhase + i*(Math.PI*2/this.armCount);
let len=this.size*0.9;
let x=Math.cos(angle)*len;
let y=Math.sin(angle)*len;
ctx.save();
ctx.translate(x*0.7,y*0.7);
ctx.rotate(angle);
ctx.shadowBlur=20;
ctx.fillStyle='rgba(20,40,55,0.8)';
ctx.strokeStyle='rgba(100,180,240,0.5)';
ctx.beginPath();
ctx.ellipse(0,0,this.size*0.25,this.size*0.1,0,0,Math.PI*2);
ctx.fill();
ctx.stroke();
ctx.restore();
}

ctx.shadowBlur=30;
ctx.strokeStyle='rgba(220,250,255,0.6)';
ctx.lineWidth=1.8;
ctx.beginPath();
ctx.moveTo(this.size*0.5,-this.size*0.3);
ctx.lineTo(this.size*1.0,-this.size*0.1);
ctx.lineTo(this.size*0.5,this.size*0.3);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(-this.size*0.5,-this.size*0.3);
ctx.lineTo(-this.size*1.0,-this.size*0.1);
ctx.lineTo(-this.size*0.5,this.size*0.3);
ctx.stroke();

if(this.health<this.maxHealth){
ctx.save();
ctx.rotate(-this.rotation);
ctx.translate(0,-this.size-20);
ctx.fillStyle='#1c2630';
ctx.fillRect(-this.size,0,this.size*2,6);
ctx.fillStyle='#9fd9ff';
ctx.fillRect(-this.size,0,(this.health/this.maxHealth)*this.size*2,6);
ctx.restore();
}
ctx.restore();
}
hit(dmg){
if(this.isDead)return false;
this.health-=dmg;
for(let i=0;i<5;i++)particles.push(new Particle(this.x,this.y,'#b2e0ff'));
if(this.health<=0){
this.isDead=true;
streak++;
for(let i=0;i<20;i++)particles.push(new Particle(this.x,this.y,i%2?'#c0e2ff':'#567d9a'));
const idx=enemies.indexOf(this);
if(idx>-1){
enemies.splice(idx,1);
if(this.type===3){
bossSpawned=false;
}
else{
let newEnemy=null;
if(this.type===0)newEnemy=new Enemy(0);
else if(this.type===1)newEnemy=new Enemy(1);
else if(this.type===2)newEnemy=new Enemy(2);
if(newEnemy)enemies.push(newEnemy);
}
}
return true;
}
return false;
}
}

function drawPlayer(){
player.coreGlow+=0.12;
player.wingOsc+=0.18;
player.tentacleAngle+=0.07;
ctx.save();
ctx.translate(player.x,player.y);
ctx.rotate(player.rotation);

let glow=0.6+Math.sin(player.coreGlow)*0.3;
ctx.shadowBlur=60;
ctx.shadowColor='rgba(0,210,255,0.8)';
ctx.strokeStyle='#b0ffff';
ctx.lineWidth=3;
ctx.fillStyle='#08141c';

ctx.beginPath();
ctx.moveTo(0,-player.size*0.9);
ctx.lineTo(player.size*0.8,-player.size*0.1);
ctx.lineTo(player.size*0.3,player.size*0.4);
ctx.lineTo(0,player.size*0.2);
ctx.lineTo(-player.size*0.3,player.size*0.4);
ctx.lineTo(-player.size*0.8,-player.size*0.1);
ctx.closePath();
ctx.fill();
ctx.stroke();

ctx.shadowBlur=45;
ctx.strokeStyle='#a0ecff';
ctx.lineWidth=2.2;
ctx.beginPath();
ctx.moveTo(player.size*0.2,player.size*0.3);
ctx.lineTo(player.size*0.6,player.size*0.7);
ctx.lineTo(player.size*0.2,player.size*0.6);
ctx.lineTo(0,player.size*0.5);
ctx.lineTo(-player.size*0.2,player.size*0.6);
ctx.lineTo(-player.size*0.6,player.size*0.7);
ctx.lineTo(-player.size*0.2,player.size*0.3);
ctx.stroke();

for(let i=0;i<3;i++){
let angle=player.tentacleAngle+i*2.0;
let len=player.size*0.5;
let tx=Math.cos(angle)*len;
let ty=Math.sin(angle)*len+player.size*0.2;
ctx.save();
ctx.translate(tx,ty);
ctx.rotate(angle);
ctx.shadowBlur=40;
ctx.fillStyle='#aae0ff';
ctx.beginPath();
ctx.ellipse(0,0,player.size*0.1,player.size*0.2,0,0,Math.PI*2);
ctx.fill();
ctx.restore();
}

ctx.shadowBlur=70;
ctx.fillStyle='#c2f0ff';
ctx.beginPath();
ctx.arc(0,-player.size*0.2,player.size*0.18,0,Math.PI*2);
ctx.fill();
ctx.fillStyle='#ffffff';
ctx.beginPath();
ctx.arc(0,-player.size*0.2,player.size*0.08,0,Math.PI*2);
ctx.fill();

ctx.restore();
}

function createSakuraPetal(){
if(Math.random()>.25)return;
sakuraPetals.push({x:Math.random()*canvas.width,y:-30,speedX:Math.random()*0.8-0.4,speedY:0.4+Math.random()*1.2,rotation:Math.random()*Math.PI*2,rotationSpeed:Math.random()*.03-.015,size:4+Math.random()*9,life:1});
}

function autoAttack(){
let nearest=null,nd=Infinity;
for(const e of enemies){if(e.isDead)continue;const dx=e.x-player.x,dy=e.y-player.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<nd){nd=d;nearest=e}}
if(nearest){
player.rotation=Math.atan2(nearest.y-player.y,nearest.x-player.x)*0.4;
if(nd<700){
for(let i=0;i<2;i++){
let offsetX=(Math.random()-0.5)*18;
let offsetY=(Math.random()-0.5)*18;
let bolt=new PlayerBolt(player.x+offsetX,player.y+offsetY,nearest.x,nearest.y);
playerBolts.push(bolt);
}
nearest.hit(18);
combo++;
health=Math.min(100,health+2);
}
}
}

function spawnInitialEnemies(){
enemies.push(new Enemy(0));
enemies.push(new Enemy(1));
enemies.push(new Enemy(2));
if(!bossSpawned){
enemies.push(new Enemy(3));
bossSpawned=true;
}
}

function update(){
player.velocity.x=0;player.velocity.y=0;
if(keys.w)player.velocity.y=-player.speed;
if(keys.s)player.velocity.y=player.speed;
if(keys.a)player.velocity.x=-player.speed;
if(keys.d)player.velocity.x=player.speed;
player.x=Math.min(canvas.width-player.size*0.7,Math.max(player.size*0.7,player.x+player.velocity.x));
player.y=Math.min(canvas.height-player.size*0.7,Math.max(player.size*0.7,player.y+player.velocity.y));
autoFireCooldown--;
if(autoFireCooldown<=0){autoAttack();autoFireCooldown=14}
for(const e of enemies)e.update();
for(let i=playerBolts.length-1;i>=0;i--){
playerBolts[i].update();
if(playerBolts[i].life<=0.1||playerBolts[i].age>40)playerBolts.splice(i,1);
}
for(let i=particles.length-1;i>=0;i--){particles[i].update();if(particles[i].life<=.01)particles.splice(i,1)}
for(let i=sakuraPetals.length-1;i>=0;i--){
const p=sakuraPetals[i];
p.x+=p.speedX;p.y+=p.speedY;p.rotation+=p.rotationSpeed;p.life-=.003;
if(p.y>canvas.height||p.life<=0)sakuraPetals.splice(i,1);
}
createSakuraPetal();
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
for(const p of sakuraPetals){
ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rotation);ctx.globalAlpha=p.life*0.25;
ctx.fillStyle='rgba(210,250,255,.2)';
ctx.beginPath();ctx.moveTo(0,-p.size);ctx.lineTo(p.size*0.7,p.size*0.7);ctx.lineTo(-p.size*0.7,p.size*0.7);ctx.closePath();ctx.fill();ctx.restore();
}
particles.forEach(p=>p.draw());
playerBolts.forEach(b=>b.draw());
enemies.forEach(e=>e.draw());
drawPlayer();
}

function animate(){update();draw();requestAnimationFrame(animate)}

function handleResize(){
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
player.x=Math.min(canvas.width-player.size*0.7,Math.max(player.size*0.7,player.x));
player.y=Math.min(canvas.height-player.size*0.7,Math.max(player.size*0.7,player.y));
}

window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=true;e.preventDefault()}});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=false;e.preventDefault()}});
window.addEventListener('resize',handleResize);

spawnInitialEnemies();
for(let i=0;i=0;i<30;i++)createSakuraPetal();

animate();
</script>
</body>
</html>
All done!
