<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEBULA STRIKER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:'Cinzel',serif;background:#000;color:#fff;overflow:hidden;height:100vh;cursor:none}
#gameCanvas{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 70% 30%,#1a0f2a 0%,#03010a 60%),repeating-linear-gradient(135deg,#140b1c 0px,#140b1c 1px,#000 1px,#000 3px);z-index:1;outline:none}
.depth-lines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background-image:repeating-linear-gradient(45deg,transparent 0px,transparent 2px,rgba(180,130,255,.03) 2px,rgba(180,130,255,.03) 4px)}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="gameCanvas" tabindex="0"></canvas>
<div class="depth-lines"></div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
canvas.focus();
let combo=0,streak=0,health=100;
let particles=[],enemies=[],nebulaTrails=[],plasmaShots=[];
let autoFireCooldown=0;
const keys={w:false,a:false,s:false,d:false};
const player={x:canvas.width/2,y:canvas.height-150,size:48,rotation:0,velocity:{x:0,y:0},speed:5,engineGlow:0,wingBeat:0,coreSpin:0};
class Particle{
constructor(x,y,color){this.x=x;this.y=y;this.color=color;this.size=Math.random()*8+2;this.speedX=Math.random()*6-3;this.speedY=Math.random()*6-3;this.life=.8+Math.random()*.3;this.decay=.015+Math.random()*.02}
update(){this.x+=this.speedX;this.y+=this.speedY;this.life-=this.decay;this.size*=.97}
draw(){ctx.save();ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore()}
}
class PlasmaShot{
constructor(x,y,targetX,targetY){
this.x=x;this.y=y;
this.targetX=targetX;this.targetY=targetY;
this.age=0;this.life=1;
this.history=[];
for(let i=0;i<8;i++)this.history.push({x:this.x,y:this.y});
}
update(){
this.age++;
if(this.age>25)this.life-=.05;
let closest=null,closestDist=Infinity;
for(let e of enemies){
if(e.isDead)continue;
let dx=e.x-this.x,dy=e.y-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d<closestDist){closestDist=d;closest=e;}
}
if(closest){
this.targetX=closest.x;
this.targetY=closest.y;
}
let dx=this.targetX-this.x;
let dy=this.targetY-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d>1){
this.x+=dx*0.28;
this.y+=dy*0.28;
}
this.history.shift();
this.history.push({x:this.x,y:this.y});
}
draw(){
ctx.save();
ctx.globalAlpha=this.life;
ctx.shadowBlur=45;
ctx.shadowColor='#b07eff';
ctx.strokeStyle='#dabfff';
ctx.lineWidth=4;
ctx.beginPath();
ctx.moveTo(this.history[0].x,this.history[0].y);
for(let i=1;i<this.history.length;i++)ctx.lineTo(this.history[i].x,this.history[i].y);
ctx.stroke();
ctx.shadowBlur=60;
ctx.lineWidth=2;
ctx.strokeStyle='#fff0ff';
ctx.beginPath();
ctx.moveTo(this.history[0].x,this.history[0].y);
for(let i=1;i<this.history.length;i++)ctx.lineTo(this.history[i].x,this.history[i].y);
ctx.stroke();
ctx.restore();
}
}
let bossActive=false;
class Enemy{
constructor(type){
this.type=type||Math.floor(Math.random()*4);
this.size=32;
this.speed=0.9;
this.health=48;
this.maxHealth=48;
this.rotation=Math.random()*Math.PI*2;
this.glintPhase=Math.random()*Math.PI*2;
this.hitCooldown=0;
this.isDead=false;
this.wobble=Math.random()*Math.PI*2;
this.minionCount=Math.floor(Math.random()*4)+2;
if(this.type===0){
this.size=32;
this.speed=0.75;
this.health=55;
this.maxHealth=55;
}
else if(this.type===1){
this.size=28;
this.speed=1.2;
this.health=42;
this.maxHealth=42;
}
else if(this.type===2){
this.size=44;
this.speed=0.5;
this.health=90;
this.maxHealth=90;
}
else if(this.type===3){
this.size=70;
this.speed=1.7;
this.health=250;
this.maxHealth=250;
this.minionCount=7;
bossActive=true;
}
const edge=Math.floor(Math.random()*4);
if(edge===0){this.x=Math.random()*canvas.width;this.y=-100}
if(edge===1){this.x=-100;this.y=Math.random()*canvas.height*0.7}
if(edge===2){this.x=canvas.width+100;this.y=Math.random()*canvas.height*0.7}
if(edge===3){this.x=Math.random()*canvas.width;this.y=canvas.height+100}
}
update(){
if(this.isDead)return;
const dx=player.x-this.x,dy=player.y-this.y;
const d=Math.sqrt(dx*dx+dy*dy);
if(d>0){this.x+=(dx/d)*this.speed;this.y+=(dy/d)*this.speed}
this.rotation+=0.02;
this.glintPhase+=0.07;
this.wobble+=0.03;
if(this.hitCooldown>0)this.hitCooldown--;
if(d<player.size+this.size+15 && this.hitCooldown<=0){
health=Math.max(0,health-10);
streak=0;
this.hitCooldown=25;
for(let i=0;i<5;i++)particles.push(new Particle(this.x,this.y,'#ff8a9f'));
}
}
draw(){
if(this.isDead)return;
ctx.save();
ctx.translate(this.x,this.y);
ctx.rotate(this.rotation);
ctx.shadowBlur=25;
ctx.shadowColor='rgba(210,150,255,0.7)';
ctx.strokeStyle='#c9b6ff';
ctx.lineWidth=2.5;
ctx.fillStyle='#1f1730';
ctx.beginPath();
ctx.ellipse(0,0,this.size*0.7,this.size*0.5,0,0,Math.PI*2);
ctx.fill();
ctx.stroke();
for(let i=0;i<this.minionCount;i++){
let angle=this.wobble+i*(Math.PI*2/this.minionCount);
let dist=this.size*0.9;
let x=Math.cos(angle)*dist;
let y=Math.sin(angle)*dist*0.6;
ctx.save();
ctx.translate(x,y);
ctx.rotate(angle);
ctx.shadowBlur=20;
ctx.fillStyle='#2a1e3f';
ctx.strokeStyle='#ad92e8';
ctx.beginPath();
ctx.arc(0,0,this.size*0.2,0,Math.PI*2);
ctx.fill();
ctx.stroke();
ctx.restore();
}
ctx.shadowBlur=30;
ctx.strokeStyle='#ddc8ff';
ctx.lineWidth=2;
ctx.beginPath();
ctx.moveTo(-this.size*0.5,-this.size*0.3);
ctx.lineTo(-this.size*1.1,0);
ctx.lineTo(-this.size*0.5,this.size*0.3);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(this.size*0.5,-this.size*0.3);
ctx.lineTo(this.size*1.1,0);
ctx.lineTo(this.size*0.5,this.size*0.3);
ctx.stroke();
if(this.health<this.maxHealth){
ctx.save();
ctx.rotate(-this.rotation);
ctx.translate(0,-this.size-20);
ctx.fillStyle='#2f2640';
ctx.fillRect(-this.size-5,-2,this.size*2+10,5);
ctx.fillStyle='#b69dff';
ctx.fillRect(-this.size-5,-2,(this.health/this.maxHealth)*(this.size*2+10),5);
ctx.restore();
}
ctx.restore();
}
hit(dmg){
if(this.isDead)return false;
this.health-=dmg;
for(let i=0;i<8;i++)particles.push(new Particle(this.x,this.y,i%2?'#cbb2ff':'#8f7ab5'));
if(this.health<=0){
this.isDead=true;
streak++;
for(let i=0;i<20;i++)particles.push(new Particle(this.x,this.y,i<10?'#ead3ff':'#b292d9'));
const idx=enemies.indexOf(this);
if(idx>-1){
enemies.splice(idx,1);
if(this.type===3){
bossActive=false;
}
else{
let newEnemy=null;
if(this.type===0)newEnemy=new Enemy(0);
else if(this.type===1)newEnemy=new Enemy(1);
else if(this.type===2)newEnemy=new Enemy(2);
if(newEnemy)enemies.push(newEnemy);
}
}
return true;
}
return false;
}
}
function drawPlayer(){
player.engineGlow+=0.12;
player.wingBeat+=0.2;
player.coreSpin+=0.08;
ctx.save();
ctx.translate(player.x,player.y);
ctx.rotate(player.rotation);
let pulseIntensity=0.6+Math.sin(player.engineGlow)*0.3;
ctx.shadowBlur=60;
ctx.shadowColor='#a982ff';
ctx.strokeStyle='#eddbff';
ctx.lineWidth=3.2;
ctx.fillStyle='#0d0821';
ctx.beginPath();
ctx.moveTo(0,-player.size*1.4);
ctx.lineTo(player.size*0.8,-player.size*0.5);
ctx.lineTo(player.size*0.6,player.size*0.2);
ctx.lineTo(player.size*0.9,player.size*0.8);
ctx.lineTo(0,player.size*0.4);
ctx.lineTo(-player.size*0.9,player.size*0.8);
ctx.lineTo(-player.size*0.6,player.size*0.2);
ctx.lineTo(-player.size*0.8,-player.size*0.5);
ctx.closePath();
ctx.fill();
ctx.stroke();
ctx.shadowBlur=50;
ctx.strokeStyle='#f0e2ff';
ctx.lineWidth=2.2;
ctx.beginPath();
ctx.moveTo(player.size*0.4,player.size*0.25);
ctx.lineTo(player.size*1.0,player.size*0.3);
ctx.moveTo(-player.size*0.4,player.size*0.25);
ctx.lineTo(-player.size*1.0,player.size*0.3);
ctx.stroke();
ctx.shadowBlur=80;
ctx.fillStyle='#c7aaff';
ctx.globalAlpha=0.5+Math.sin(player.coreSpin)*0.2;
ctx.beginPath();
ctx.arc(0,-player.size*0.3,player.size*0.25,0,Math.PI*2);
ctx.fill();
ctx.globalAlpha=1;
ctx.fillStyle='#fcf2ff';
ctx.beginPath();
ctx.arc(0,-player.size*0.3,player.size*0.12,0,Math.PI*2);
ctx.fill();
ctx.restore();
}
function createNebulaTrail(){
if(Math.random()>0.3)return;
nebulaTrails.push({x:Math.random()*canvas.width,y:-15,speedX:Math.random()*1.2-0.6,speedY:0.7+Math.random()*1.3,rot:Math.random()*Math.PI*2,rotSpeed:Math.random()*0.03-0.015,size:7+Math.random()*12,life:1});
}
function autoAttack(){
let nearest=null,nd=Infinity;
for(const e of enemies){if(e.isDead)continue;const dx=e.x-player.x,dy=e.y-player.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<nd){nd=d;nearest=e}}
if(nearest){
player.rotation=Math.atan2(nearest.y-player.y,nearest.x-player.x)*0.4;
if(nd<650){
for(let i=0;i<2;i++){
let offX=(Math.random()-0.5)*20;
let offY=(Math.random()-0.5)*20;
let shot=new PlasmaShot(player.x+offX,player.y+offY,nearest.x,nearest.y);
plasmaShots.push(shot);
}
nearest.hit(18);
combo++;
health=Math.min(100,health+2);
}
}
}
function spawnEnemyWave(){
enemies.push(new Enemy(0));
enemies.push(new Enemy(1));
enemies.push(new Enemy(2));
if(!bossActive){
enemies.push(new Enemy(3));
bossActive=true;
}
}
function update(){
player.velocity.x=0;player.velocity.y=0;
if(keys.w)player.velocity.y=-player.speed;
if(keys.s)player.velocity.y=player.speed;
if(keys.a)player.velocity.x=-player.speed;
if(keys.d)player.velocity.x=player.speed;
player.x=Math.min(canvas.width-player.size,Math.max(player.size,player.x+player.velocity.x));
player.y=Math.min(canvas.height-player.size,Math.max(player.size,player.y+player.velocity.y));
autoFireCooldown--;
if(autoFireCooldown<=0){autoAttack();autoFireCooldown=14}
for(const e of enemies)e.update();
for(let i=plasmaShots.length-1;i>=0;i--){
plasmaShots[i].update();
if(plasmaShots[i].life<=0.1||plasmaShots[i].age>40)plasmaShots.splice(i,1);
}
for(let i=particles.length-1;i>=0;i--){particles[i].update();if(particles[i].life<=.01)particles.splice(i,1)}
for(let i=nebulaTrails.length-1;i>=0;i--){
const t=nebulaTrails[i];
t.x+=t.speedX;t.y+=t.speedY;t.rot+=t.rotSpeed;t.life-=0.003;
if(t.y>canvas.height||t.life<=0)nebulaTrails.splice(i,1);
}
createNebulaTrail();
}
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
for(const t of nebulaTrails){
ctx.save();ctx.translate(t.x,t.y);ctx.rotate(t.rot);ctx.globalAlpha=t.life*0.3;
ctx.fillStyle='#b69de0';
ctx.beginPath();ctx.moveTo(0,-t.size);ctx.lineTo(t.size*0.7,t.size*0.5);ctx.lineTo(-t.size*0.7,t.size*0.5);ctx.closePath();ctx.fill();ctx.restore();
}
particles.forEach(p=>p.draw());
plasmaShots.forEach(s=>s.draw());
enemies.forEach(e=>e.draw());
drawPlayer();
}
function animate(){update();draw();requestAnimationFrame(animate)}
function handleResize(){
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
player.x=Math.min(canvas.width-player.size,Math.max(player.size,player.x));
player.y=Math.min(canvas.height-player.size,Math.max(player.size,player.y));
}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=true;e.preventDefault()}});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=false;e.preventDefault()}});
window.addEventListener('resize',handleResize);
spawnEnemyWave();
for(let i=0;i<30;i++)createNebulaTrail();
animate();
</script>
</body>
</html>
All done!
