<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEBULA STRIKER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:'Cinzel',serif;background:#000;color:#fff;overflow:hidden;height:100vh;cursor:none}
#gameCanvas{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 70% 30%,#0a0a1a 0%,#000 50%),repeating-linear-gradient(0deg,#0f0f1a 0px,#0f0f1a 2px,#000 2px,#000 6px);z-index:1;outline:none}
.depth-lines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background-image:repeating-linear-gradient(180deg,transparent 0px,transparent 4px,rgba(80,180,255,.03) 4px,rgba(80,180,255,.03) 8px)}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="gameCanvas" tabindex="0"></canvas>
<div class="depth-lines"></div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
canvas.focus();
let combo=0,streak=0,health=100;
let particles=[],enemies=[],nebulaDrift=[],playerShots=[];
let autoFireCooldown=0;
const keys={w:false,a:false,s:false,d:false};
const player={x:canvas.width/2,y:canvas.height-120,size:38,rotation:0,velocity:{x:0,y:0},speed:5.5,coreGlow:0,wingBeat:0};
class Particle{
constructor(x,y,color){this.x=x;this.y=y;this.color=color;this.size=Math.random()*8+3;this.speedX=Math.random()*6-3;this.speedY=Math.random()*6-3;this.life=.8+Math.random()*.4;this.decay=.01+Math.random()*.02}
update(){this.x+=this.speedX;this.y+=this.speedY;this.life-=this.decay;this.size*=.97}
draw(){ctx.save();ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore()}
}
class PlayerShot{
constructor(x,y,targetX,targetY){
this.x=x;this.y=y;
this.targetX=targetX;this.targetY=targetY;
this.age=0;this.life=1;
this.trail=[];
for(let i=0;i<8;i++)this.trail.push({x:this.x,y:this.y});
}
update(){
this.age++;
if(this.age>20)this.life-=.05;
if(!enemies.length)return;
let closest=null,closestDist=Infinity;
for(let e of enemies){
if(e.isDead)continue;
let dx=e.x-this.x,dy=e.y-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d<closestDist){closestDist=d;closest=e;}
}
if(closest){
this.targetX=closest.x;
this.targetY=closest.y;
}
let dx=this.targetX-this.x;
let dy=this.targetY-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d>1){
this.x+=dx*0.4;
this.y+=dy*0.4;
}
this.trail.shift();
this.trail.push({x:this.x,y:this.y});
}
draw(){
ctx.save();
ctx.globalAlpha=this.life;
ctx.shadowBlur=30;
ctx.shadowColor='#7ec8ff';
ctx.strokeStyle='#b0e0ff';
ctx.lineWidth=2.5;
ctx.beginPath();
ctx.moveTo(this.trail[0].x,this.trail[0].y);
for(let i=1;i<this.trail.length;i++)ctx.lineTo(this.trail[i].x,this.trail[i].y);
ctx.stroke();
ctx.shadowBlur=45;
ctx.lineWidth=1.5;
ctx.strokeStyle='#ffffff';
ctx.beginPath();
ctx.moveTo(this.trail[0].x,this.trail[0].y);
for(let i=1;i<this.trail.length;i++)ctx.lineTo(this.trail[i].x,this.trail[i].y);
ctx.stroke();
ctx.restore();
}
}
let bossActive=false;
class Enemy{
constructor(type){
this.type=type || Math.floor(Math.random()*4);
this.size=36;
this.speed=0.9;
this.health=50;
this.maxHealth=50;
this.rotation=Math.random()*Math.PI*2;
this.pulse=Math.random()*Math.PI*2;
this.hitTimer=0;
this.isDead=false;
this.orbitPos=Math.random()*Math.PI*2;
this.segments=Math.floor(Math.random()*4)+3;
if(this.type===0){
this.size=32;
this.speed=0.8;
this.health=55;
this.maxHealth=55;
}
else if(this.type===1){
this.size=28;
this.speed=1.2;
this.health=42;
this.maxHealth=42;
}
else if(this.type===2){
this.size=44;
this.speed=0.7;
this.health=85;
this.maxHealth=85;
}
else if(this.type===3){
this.size=64;
this.speed=2.2;
this.health=220;
this.maxHealth=220;
this.segments=7;
bossActive=true;
}
const edge=Math.floor(Math.random()*4);
if(edge===0){this.x=-60;this.y=Math.random()*canvas.height*0.7}
else if(edge===1){this.x=canvas.width+60;this.y=Math.random()*canvas.height*0.7}
else if(edge===2){this.x=Math.random()*canvas.width;this.y=-60}
else{this.x=Math.random()*canvas.width;this.y=canvas.height*1.2}
}
update(){
if(this.isDead)return;
const dx=player.x-this.x,dy=player.y-this.y;
const d=Math.sqrt(dx*dx+dy*dy);
if(d>0){this.x+=(dx/d)*this.speed;this.y+=(dy/d)*this.speed}
this.rotation-=0.02;
this.pulse+=0.07;
this.orbitPos+=0.03;
if(this.hitTimer>0)this.hitTimer--;
if(d<player.size+this.size+25 && this.hitTimer<=0){
health=Math.max(0,health-10);
streak=0;
this.hitTimer=25;
}
}
draw(){
if(this.isDead)return;
ctx.save();
ctx.translate(this.x,this.y);
ctx.rotate(this.rotation);
ctx.shadowBlur=25;
ctx.shadowColor='rgba(200,100,200,0.4)';
ctx.strokeStyle='rgba(220,160,240,0.8)';
ctx.lineWidth=2.2;
ctx.fillStyle='rgba(20,10,25,0.9)';
ctx.beginPath();
ctx.ellipse(0,0,this.size*0.7,this.size*0.5,0,0,Math.PI*2);
ctx.fill();
ctx.stroke();
for(let i=0;i<this.segments;i++){
let angle=this.orbitPos + i*(Math.PI*2/this.segments);
let dist=this.size*0.9;
let x=Math.cos(angle)*dist;
let y=Math.sin(angle)*dist*0.6;
ctx.save();
ctx.translate(x,y);
ctx.rotate(angle);
ctx.shadowBlur=20;
ctx.fillStyle='rgba(40,20,50,0.8)';
ctx.strokeStyle='rgba(200,150,230,0.7)';
ctx.beginPath();
ctx.ellipse(0,0,this.size*0.2,this.size*0.15,0,0,Math.PI*2);
ctx.fill();
ctx.stroke();
ctx.restore();
}
ctx.shadowBlur=30;
ctx.strokeStyle='rgba(230,180,255,0.6)';
ctx.lineWidth=1.8;
ctx.beginPath();
ctx.moveTo(this.size*0.5,-this.size*0.3);
ctx.lineTo(this.size*1.0,-this.size*0.1);
ctx.lineTo(this.size*0.5,this.size*0.2);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(-this.size*0.5,-this.size*0.3);
ctx.lineTo(-this.size*1.0,-this.size*0.1);
ctx.lineTo(-this.size*0.5,this.size*0.2);
ctx.stroke();
if(this.health<this.maxHealth){
ctx.save();
ctx.rotate(-this.rotation);
ctx.translate(0,-this.size-20);
ctx.fillStyle='rgba(40,20,40,.8)';
ctx.fillRect(-this.size,0,this.size*2,5);
ctx.fillStyle='rgba(240,160,255,.9)';
ctx.fillRect(-this.size,0,(this.health/this.maxHealth)*this.size*2,5);
ctx.restore();
}
ctx.restore();
}
hit(dmg){
if(this.isDead)return false;
this.health-=dmg;
for(let i=0;i<5;i++)particles.push(new Particle(this.x,this.y,'#e9c2ff'));
if(this.health<=0){
this.isDead=true;
streak++;
for(let i=0;i<20;i++)particles.push(new Particle(this.x,this.y,i<10?'#f0d0ff':'#c090e0'));
const idx=enemies.indexOf(this);
if(idx>-1){
enemies.splice(idx,1);
if(this.type===3){
bossActive=false;
}
else{
let newUnit=null;
if(this.type===0)newUnit=new Enemy(0);
else if(this.type===1)newUnit=new Enemy(1);
else if(this.type===2)newUnit=new Enemy(2);
if(newUnit)enemies.push(newUnit);
}
}
return true;
}
return false;
}
}
function drawPlayer(){
player.coreGlow+=0.15;
player.wingBeat+=0.2;
ctx.save();
ctx.translate(player.x,player.y);
ctx.rotate(player.rotation);
let pulseIntensity=0.4+Math.sin(player.coreGlow)*0.2;
ctx.shadowBlur=50;
ctx.shadowColor='rgba(200,130,255,0.8)';
ctx.strokeStyle='rgba(230,190,255,1)';
ctx.lineWidth=2.5;
ctx.fillStyle='rgba(20,8,30,0.9)';
ctx.beginPath();
ctx.moveTo(0,-player.size*1.2);
ctx.lineTo(player.size*0.6,-player.size*0.4);
ctx.lineTo(player.size*0.9,player.size*0.2);
ctx.lineTo(player.size*0.3,player.size*0.6);
ctx.lineTo(0,player.size*0.4);
ctx.lineTo(-player.size*0.3,player.size*0.6);
ctx.lineTo(-player.size*0.9,player.size*0.2);
ctx.lineTo(-player.size*0.6,-player.size*0.4);
ctx.closePath();
ctx.fill();
ctx.stroke();
ctx.shadowBlur=40;
ctx.strokeStyle='rgba(255,210,255,0.9)';
ctx.lineWidth=2;
ctx.beginPath();
ctx.moveTo(player.size*0.3,player.size*0.6);
ctx.lineTo(player.size*0.5,player.size*0.9);
ctx.lineTo(0,player.size*0.7);
ctx.lineTo(-player.size*0.5,player.size*0.9);
ctx.lineTo(-player.size*0.3,player.size*0.6);
ctx.stroke();
ctx.shadowBlur=70;
ctx.fillStyle='rgba(240,180,255,0.8)';
ctx.beginPath();
ctx.arc(0,-player.size*0.4,player.size*0.18,0,Math.PI*2);
ctx.fill();
ctx.fillStyle='rgba(255,240,255,1)';
ctx.beginPath();
ctx.arc(0,-player.size*0.4,player.size*0.09,0,Math.PI*2);
ctx.fill();
ctx.restore();
}
function createNebulaDrift(){
if(Math.random()>.3)return;
nebulaDrift.push({x:Math.random()*canvas.width,y:canvas.height+20,speedX:Math.random()*1.2-0.6,speedY:-0.8-Math.random()*1.2,rotation:Math.random()*Math.PI*2,rotSpeed:Math.random()*0.03-0.015,size:8+Math.random()*12,life:0.7+Math.random()*0.5});
}
function autoStrike(){
let closest=null,distMin=Infinity;
for(const e of enemies){if(e.isDead)continue;const dx=e.x-player.x,dy=e.y-player.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<distMin){distMin=d;closest=e}}
if(closest){
player.rotation=Math.atan2(closest.y-player.y,closest.x-player.x)*0.5;
if(distMin<700){
for(let i=0;i<2;i++){
let offX=(Math.random()-0.5)*20;
let offY=(Math.random()-0.5)*20;
let shot=new PlayerShot(player.x+offX,player.y+offY,closest.x,closest.y);
playerShots.push(shot);
}
closest.hit(22);
combo++;
health=Math.min(100,health+3);
}
}
}
function spawnStartEnemies(){
enemies.push(new Enemy(0));
enemies.push(new Enemy(1));
enemies.push(new Enemy(2));
if(!bossActive){
enemies.push(new Enemy(3));
bossActive=true;
}
}
function update(){
player.velocity.x=0;player.velocity.y=0;
if(keys.w)player.velocity.y=-player.speed;
if(keys.s)player.velocity.y=player.speed;
if(keys.a)player.velocity.x=-player.speed;
if(keys.d)player.velocity.x=player.speed;
player.x=Math.min(canvas.width-player.size,Math.max(player.size,player.x+player.velocity.x));
player.y=Math.min(canvas.height-player.size,Math.max(player.size,player.y+player.velocity.y));
autoFireCooldown--;
if(autoFireCooldown<=0){autoStrike();autoFireCooldown=14}
for(const e of enemies)e.update();
for(let i=playerShots.length-1;i>=0;i--){
playerShots[i].update();
if(playerShots[i].life<=0.05||playerShots[i].age>40)playerShots.splice(i,1);
}
for(let i=particles.length-1;i>=0;i--){particles[i].update();if(particles[i].life<=.01)particles.splice(i,1)}
for(let i=nebulaDrift.length-1;i>=0;i--){
const d=nebulaDrift[i];
d.x+=d.speedX;d.y+=d.speedY;d.rotation+=d.rotSpeed;d.life-=.003;
if(d.y<-50||d.life<=0)nebulaDrift.splice(i,1);
}
createNebulaDrift();
}
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
for(const d of nebulaDrift){
ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.rotation);ctx.globalAlpha=d.life*0.25;
ctx.fillStyle='rgba(180,140,255,.1)';
ctx.beginPath();ctx.arc(0,0,d.size,0,Math.PI*2);ctx.fill();
ctx.restore();
}
particles.forEach(p=>p.draw());
playerShots.forEach(s=>s.draw());
enemies.forEach(e=>e.draw());
drawPlayer();
}
function animate(){update();draw();requestAnimationFrame(animate)}
function handleResize(){
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
player.x=Math.min(canvas.width-player.size,Math.max(player.size,player.x));
player.y=Math.min(canvas.height-player.size,Math.max(player.size,player.y));
}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=true;e.preventDefault()}});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=false;e.preventDefault()}});
window.addEventListener('resize',handleResize);
spawnStartEnemies();
for(let i=0;i<25;i++)createNebulaDrift();
animate();
</script>
</body>
</html>
All done!
