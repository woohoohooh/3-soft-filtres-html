```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEBULA ECLIPSE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:'Cinzel',serif;background:#000;color:#fff;overflow:hidden;height:100vh;cursor:none}
#gameCanvas{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 80% 70%,#1a0f1f 0%,#030005 40%),repeating-linear-gradient(135deg,#150b1a 0px,#150b1a 1px,#000 1px,#000 3px);z-index:1;outline:none}
.depth-lines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background-image:repeating-linear-gradient(180deg,transparent 0px,transparent 2px,rgba(180,130,255,.02) 2px,rgba(180,130,255,.02) 4px)}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="gameCanvas" tabindex="0"></canvas>
<div class="depth-lines"></div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
canvas.focus();

let combo=0,streak=0,health=100;
let particles=[],enemies=[],sakuraPetals=[],playerBolts=[];
let autoFireCooldown=0;
const keys={w:false,a:false,s:false,d:false};

const player={x:canvas.width/2,y:canvas.height-100,size:46,rotation:0,velocity:{x:0,y:0},speed:5.2,coreGlow:0,wingOsc:0};

class Particle{
constructor(x,y,color){this.x=x;this.y=y;this.color=color;this.size=Math.random()*7+2;this.speedX=Math.random()*5-2.5;this.speedY=Math.random()*5-2.5;this.life=.8+Math.random()*.3;this.decay=.018+Math.random()*.025}
update(){this.x+=this.speedX;this.y+=this.speedY;this.life-=this.decay;this.size*=.97}
draw(){ctx.save();ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore()}
}

class PlayerBolt{
constructor(x,y,targetX,targetY){
this.x=x;this.y=y;
this.targetX=targetX;this.targetY=targetY;
this.age=0;this.life=1;
this.trail=[];
for(let i=0;i<10;i++)this.trail.push({x:this.x,y:this.y});
}
update(){
this.age++;
if(this.age>25)this.life-=.05;
if(!enemies.length)return;
let closest=null,closestDist=Infinity;
for(let e of enemies){
if(e.isDead)continue;
let dx=e.x-this.x,dy=e.y-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d<closestDist){closestDist=d;closest=e;}
}
if(closest){
this.targetX=closest.x;
this.targetY=closest.y;
}
let dx=this.targetX-this.x;
let dy=this.targetY-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d>1){
this.x+=dx*0.28;
this.y+=dy*0.28;
}
this.trail.shift();
this.trail.push({x:this.x,y:this.y});
}
draw(){
ctx.save();
ctx.globalAlpha=this.life;
ctx.shadowBlur=40;
ctx.shadowColor='#ca9eff';
ctx.strokeStyle='#e2ccff';
ctx.lineWidth=2.5;
ctx.beginPath();
ctx.moveTo(this.trail[0].x,this.trail[0].y);
for(let i=1;i<this.trail.length;i++)ctx.lineTo(this.trail[i].x,this.trail[i].y);
ctx.stroke();
ctx.shadowBlur=60;
ctx.lineWidth=1.5;
ctx.strokeStyle='#fff';
ctx.beginPath();
ctx.moveTo(this.trail[0].x,this.trail[0].y);
for(let i=1;i<this.trail.length;i++)ctx.lineTo(this.trail[i].x,this.trail[i].y);
ctx.stroke();
ctx.restore();
}
}

let bossSpawned=false;

class Enemy{
constructor(type){
this.type=type||Math.floor(Math.random()*4);
this.size=36;
this.speed=0.9;
this.health=48;
this.maxHealth=48;
this.rotation=Math.random()*Math.PI*2;
this.pulse=Math.random()*Math.PI*2;
this.hitCooldown=0;
this.isDead=false;
this.orbitAngle=Math.random()*Math.PI*2;
this.segments=Math.floor(Math.random()*3)+3;

if(this.type===0){
this.size=32;this.speed=0.75;this.health=52;this.maxHealth=52;
}else if(this.type===1){
this.size=28;this.speed=1.1;this.health=40;this.maxHealth=40;
}else if(this.type===2){
this.size=42;this.speed=0.65;this.health=80;this.maxHealth=80;
}else if(this.type===3){
this.size=62;this.speed=1.8;this.health=200;this.maxHealth=200;this.segments=7;bossSpawned=true;
}

const side=Math.floor(Math.random()*3);
if(side===0){this.x=Math.random()*canvas.width;this.y=-90}
if(side===1){this.x=-90;this.y=Math.random()*canvas.height*0.6}
if(side===2){this.x=canvas.width+90;this.y=Math.random()*canvas.height*0.6}
}
update(){
if(this.isDead)return;
const dx=player.x-this.x,dy=player.y-this.y;
const d=Math.sqrt(dx*dx+dy*dy);
if(d>0){this.x+=(dx/d)*this.speed;this.y+=(dy/d)*this.speed}
this.rotation+=0.02;
this.pulse+=0.07;
this.orbitAngle+=0.025;
if(this.hitCooldown>0)this.hitCooldown--;
if(d<player.size+this.size+20&&this.hitCooldown<=0){
health=Math.max(0,health-9);
streak=0;
this.hitCooldown=30;
}
}
draw(){
if(this.isDead)return;
ctx.save();
ctx.translate(this.x,this.y);
ctx.rotate(this.rotation);
ctx.shadowBlur=25;
ctx.shadowColor='rgba(200,100,255,0.4)';
ctx.strokeStyle='rgba(210,160,250,0.8)';
ctx.lineWidth=2;
ctx.fillStyle='rgba(28,18,35,0.95)';

ctx.beginPath();
ctx.arc(0,0,this.size*0.7,0,Math.PI*2);
ctx.fill();
ctx.stroke();

for(let i=0;i<this.segments;i++){
let angle=this.orbitAngle+i*(Math.PI*2/this.segments);
let dist=this.size*0.85;
let x=Math.cos(angle)*dist;
let y=Math.sin(angle)*dist;
ctx.save();
ctx.translate(x,y);
ctx.rotate(angle+0.3);
ctx.shadowBlur=20;
ctx.fillStyle='rgba(50,30,65,0.9)';
ctx.strokeStyle='rgba(190,140,240,0.7)';
ctx.beginPath();
ctx.ellipse(0,0,this.size*0.25,this.size*0.1,0,0,Math.PI*2);
ctx.fill();
ctx.stroke();
ctx.restore();
}

ctx.shadowBlur=30;
ctx.strokeStyle='rgba(230,200,255,0.6)';
ctx.lineWidth=1.8;
ctx.beginPath();
ctx.moveTo(this.size*0.5,-this.size*0.25);
ctx.lineTo(this.size*1.0,0);
ctx.lineTo(this.size*0.5,this.size*0.25);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(-this.size*0.5,-this.size*0.25);
ctx.lineTo(-this.size*1.0,0);
ctx.lineTo(-this.size*0.5,this.size*0.25);
ctx.stroke();

if(this.health<this.maxHealth){
ctx.save();
ctx.rotate(-this.rotation);
ctx.translate(0,-this.size-18);
ctx.fillStyle='rgba(40,30,50,.8)';
ctx.fillRect(-this.size,0,this.size*2,5);
ctx.fillStyle='rgba(220,180,255,.95)';
ctx.fillRect(-this.size,0,(this.health/this.maxHealth)*this.size*2,5);
ctx.restore();
}
ctx.restore();
}
hit(dmg){
if(this.isDead)return false;
this.health-=dmg;
for(let i=0;i<7;i++)particles.push(new Particle(this.x,this.y,'#d9c0ff'));
if(this.health<=0){
this.isDead=true;
streak++;
for(let i=0;i<24;i++)particles.push(new Particle(this.x,this.y,i<10?'#f0e0ff':'#c090ff'));
const idx=enemies.indexOf(this);
if(idx>-1){
enemies.splice(idx,1);
if(this.type===3){bossSpawned=false;}
else{let newEnemy=null;if(this.type===0)newEnemy=new Enemy(0);else if(this.type===1)newEnemy=new Enemy(1);else if(this.type===2)newEnemy=new Enemy(2);if(newEnemy)enemies.push(newEnemy);}
}
return true;
}
return false;
}
}

function drawPlayer(){
player.coreGlow+=0.12;
player.wingOsc+=0.18;
ctx.save();
ctx.translate(player.x,player.y);
ctx.rotate(player.rotation);

let pulseIntensity=0.6+Math.sin(player.coreGlow)*0.25;
ctx.shadowBlur=60;
ctx.shadowColor='rgba(200,130,255,0.9)';
ctx.strokeStyle='rgba(250,210,255,1)';
ctx.lineWidth=3.2;
ctx.fillStyle='rgba(22,12,30,0.9)';

ctx.beginPath();
ctx.moveTo(0,-player.size*1.2);
ctx.lineTo(player.size*0.7,-player.size*0.5);
ctx.lineTo(player.size*1.0,player.size*0.1);
ctx.lineTo(player.size*0.6,player.size*0.5);
ctx.lineTo(player.size*0.2,player.size*0.9);
ctx.lineTo(0,player.size*0.6);
ctx.lineTo(-player.size*0.2,player.size*0.9);
ctx.lineTo(-player.size*0.6,player.size*0.5);
ctx.lineTo(-player.size*1.0,player.size*0.1);
ctx.lineTo(-player.size*0.7,-player.size*0.5);
ctx.closePath();
ctx.fill();
ctx.stroke();

ctx.shadowBlur=45;
ctx.strokeStyle='rgba(255,240,255,0.9)';
ctx.lineWidth=2.2;
ctx.beginPath();
ctx.moveTo(player.size*0.2,player.size*0.9);
ctx.lineTo(player.size*0.45,player.size*1.2);
ctx.lineTo(0,player.size*1.0);
ctx.lineTo(-player.size*0.45,player.size*1.2);
ctx.lineTo(-player.size*0.2,player.size*0.9);
ctx.stroke();

ctx.shadowBlur=70;
ctx.fillStyle='rgba(240,200,255,0.8)';
ctx.beginPath();
ctx.arc(0,-player.size*0.4,player.size*0.22,0,Math.PI*2);
ctx.fill();
ctx.fillStyle='rgba(255,255,255,1)';
ctx.beginPath();
ctx.arc(0,-player.size*0.4,player.size*0.1,0,Math.PI*2);
ctx.fill();

ctx.restore();
}

function createSakuraPetal(){
if(Math.random()>0.25)return;
sakuraPetals.push({x:Math.random()*canvas.width,y:-20,speedX:Math.random()*0.8-0.4,speedY:0.4+Math.random()*1.2,rotation:Math.random()*Math.PI*2,rotationSpeed:Math.random()*0.03-0.015,size:4+Math.random()*10,life:1});
}

function autoAttack(){
let nearest=null,nd=Infinity;
for(const e of enemies){if(e.isDead)continue;const dx=e.x-player.x,dy=e.y-player.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<nd){nd=d;nearest=e}}
if(nearest){
player.rotation=Math.atan2(nearest.y-player.y,nearest.x-player.x)*0.6;
if(nd<650){
for(let i=0;i<2;i++){
let offsetX=(Math.random()-0.5)*20;
let offsetY=(Math.random()-0.5)*20;
let bolt=new PlayerBolt(player.x+offsetX,player.y+offsetY,nearest.x,nearest.y);
playerBolts.push(bolt);
}
nearest.hit(22);
combo++;
health=Math.min(100,health+2.5);
}
}
}

function spawnInitialEnemies(){
enemies.push(new Enemy(0));
enemies.push(new Enemy(1));
enemies.push(new Enemy(2));
if(!bossSpawned){enemies.push(new Enemy(3));bossSpawned=true;}
}

function update(){
player.velocity.x=0;player.velocity.y=0;
if(keys.w)player.velocity.y=-player.speed;
if(keys.s)player.velocity.y=player.speed;
if(keys.a)player.velocity.x=-player.speed;
if(keys.d)player.velocity.x=player.speed;
player.x=Math.min(canvas.width-player.size*0.9,Math.max(player.size*0.9,player.x+player.velocity.x));
player.y=Math.min(canvas.height-player.size*0.9,Math.max(player.size*0.9,player.y+player.velocity.y));
autoFireCooldown--;
if(autoFireCooldown<=0){autoAttack();autoFireCooldown=15}
for(const e of enemies)e.update();
for(let i=playerBolts.length-1;i>=0;i--){playerBolts[i].update();if(playerBolts[i].life<=0.1||playerBolts[i].age>42)playerBolts.splice(i,1);}
for(let i=particles.length-1;i>=0;i--){particles[i].update();if(particles[i].life<=.01)particles.splice(i,1);}
for(let i=sakuraPetals.length-1;i>=0;i--){const p=sakuraPetals[i];p.x+=p.speedX;p.y+=p.speedY;p.rotation+=p.rotationSpeed;p.life-=.002;if(p.y>canvas.height||p.life<=0)sakuraPetals.splice(i,1);}
createSakuraPetal();
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
for(const p of sakuraPetals){
ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rotation);ctx.globalAlpha=p.life*0.25;
ctx.fillStyle='rgba(200,180,255,.2)';
ctx.beginPath();ctx.moveTo(0,-p.size);ctx.lineTo(p.size*0.8,p.size*0.6);ctx.lineTo(-p.size*0.8,p.size*0.6);ctx.closePath();ctx.fill();ctx.restore();
}
particles.forEach(p=>p.draw());
playerBolts.forEach(b=>b.draw());
enemies.forEach(e=>e.draw());
drawPlayer();
}

function animate(){update();draw();requestAnimationFrame(animate);}

function handleResize(){
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
player.x=Math.min(canvas.width-player.size*0.9,Math.max(player.size*0.9,player.x));
player.y=Math.min(canvas.height-player.size*0.9,Math.max(player.size*0.9,player.y));
}

window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=true;e.preventDefault()}});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=false;e.preventDefault()}});
window.addEventListener('resize',handleResize);

spawnInitialEnemies();
for(let i=0;i<30;i++)createSakuraPetal();

animate();
</script>
</body>
</html>
All done!
