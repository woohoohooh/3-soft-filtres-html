<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEBULA SHARD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:'Cinzel',serif;background:#000;color:#fff;overflow:hidden;height:100vh;cursor:none}
#gameCanvas{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 80% 20%,#0a1420 0%,#03060a 60%),radial-gradient(circle at 20% 80%,#1a0f1a 0%,#030001 70%);z-index:1;outline:none}
.star-field{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background-image:radial-gradient(2px 2px at 15px 60px,#fff,transparent),radial-gradient(2px 2px at 72px 430px,#aaf,transparent),radial-gradient(3px 3px at 850px 220px,#ddf,transparent),radial-gradient(1px 1px at 1200px 540px,#fff,transparent),radial-gradient(4px 4px at 300px 800px,#ccf,transparent),radial-gradient(2px 2px at 1400px 200px,#aef,transparent);background-size:200px 200px;background-repeat:repeat;opacity:0.4}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="gameCanvas" tabindex="0"></canvas>
<div class="star-field"></div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
canvas.focus();
let combo=0,streak=0,health=100;
let particles=[],enemies=[],voidMotes=[],crystalShards=[];
let autoFireCooldown=0;
const keys={w:false,a:false,s:false,d:false};
const player={x:canvas.width/2,y:canvas.height-120,size:36,rotation:0,velocity:{x:0,y:0},speed:5.5,glowPhase:0,warpRipple:0};
class Particle{
constructor(x,y,color){this.x=x;this.y=y;this.color=color;this.size=Math.random()*5+1;this.speedX=Math.random()*4-2;this.speedY=Math.random()*4-2;this.life=.8+Math.random()*.2;this.decay=.015+Math.random()*.02}
update(){this.x+=this.speedX;this.y+=this.speedY;this.life-=this.decay;this.size*=.97}
draw(){ctx.save();ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore()}
}
class CrystalShard{
constructor(x,y,targetX,targetY){
this.x=x;this.y=y;
this.targetX=targetX;this.targetY=targetY;
this.age=0;this.life=1;
this.trail=[];
for(let i=0;i<6;i++)this.trail.push({x:this.x,y:this.y});
}
update(){
this.age++;
if(this.age>20)this.life-=.05;
if(!enemies.length)return;
let closest=null,closestDist=Infinity;
for(let e of enemies){
if(e.isDead)continue;
let dx=e.x-this.x,dy=e.y-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d<closestDist){closestDist=d;closest=e;}
}
if(closest){
this.targetX=closest.x;
this.targetY=closest.y;
}
let dx=this.targetX-this.x;
let dy=this.targetY-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d>1){
this.x+=dx*0.28;
this.y+=dy*0.28;
}
this.trail.shift();
this.trail.push({x:this.x,y:this.y});
}
draw(){
ctx.save();
ctx.globalAlpha=this.life*0.8;
ctx.shadowBlur=40;
ctx.shadowColor='#9f9fff';
ctx.strokeStyle='#b8c4ff';
ctx.lineWidth=2.5;
ctx.beginPath();
ctx.moveTo(this.trail[0].x,this.trail[0].y);
for(let i=1;i<this.trail.length;i++)ctx.lineTo(this.trail[i].x,this.trail[i].y);
ctx.stroke();
ctx.shadowBlur=30;
ctx.fillStyle='#f0f2ff';
ctx.beginPath();
ctx.arc(this.x,this.y,5,0,Math.PI*2);
ctx.fill();
ctx.restore();
}
}
let bossSpawned=false;
class Enemy{
constructor(type){
this.type=type || Math.floor(Math.random()*4);
this.size=34;
this.speed=0.85;
this.health=45;
this.maxHealth=45;
this.rotation=Math.random()*Math.PI*2;
this.pulsePhase=Math.random()*Math.PI*2;
this.hitCooldown=0;
this.isDead=false;
this.orbitAngle=Math.random()*Math.PI*2;
this.subObjects=Math.floor(Math.random()*3)+2;
if(this.type===0){
this.size=30;
this.speed=0.7;
this.health=50;
this.maxHealth=50;
}
else if(this.type===1){
this.size=26;
this.speed=1.0;
this.health=38;
this.maxHealth=38;
}
else if(this.type===2){
this.size=40;
this.speed=0.6;
this.health=75;
this.maxHealth=75;
}
else if(this.type===3){
this.size=58;
this.speed=1.9;
this.health=190;
this.maxHealth=190;
this.subObjects=5;
bossSpawned=true;
}
const side=Math.floor(Math.random()*3);
if(side===0){this.x=Math.random()*canvas.width;this.y=-80}
if(side===1){this.x=-80;this.y=Math.random()*canvas.height*0.6}
if(side===2){this.x=canvas.width+80;this.y=Math.random()*canvas.height*0.6}
}
update(){
if(this.isDead)return;
const dx=player.x-this.x,dy=player.y-this.y;
const d=Math.sqrt(dx*dx+dy*dy);
if(d>0){this.x+=(dx/d)*this.speed;this.y+=(dy/d)*this.speed}
this.rotation+=0.015;
this.pulsePhase+=0.05;
this.orbitAngle+=0.02;
if(this.hitCooldown>0)this.hitCooldown--;
if(d<player.size+this.size+20 && this.hitCooldown<=0){
health=Math.max(0,health-8);
streak=0;
this.hitCooldown=30;
}
}
draw(){
if(this.isDead)return;
ctx.save();
ctx.translate(this.x,this.y);
ctx.rotate(this.rotation);
ctx.shadowBlur=20;
ctx.shadowColor='#5a3d5a';
ctx.strokeStyle='#ab8bab';
ctx.lineWidth=2;
ctx.fillStyle='#1d1321';
ctx.beginPath();
ctx.ellipse(0,0,this.size*0.7,this.size*0.5,0,0,Math.PI*2);
ctx.fill();
ctx.stroke();
for(let i=0;i<this.subObjects;i++){
let angle=this.orbitAngle + i*(Math.PI*2/this.subObjects);
let dist=this.size*0.8;
let x=Math.cos(angle)*dist;
let y=Math.sin(angle)*dist;
ctx.save();
ctx.translate(x,y);
ctx.rotate(angle);
ctx.shadowBlur=15;
ctx.fillStyle='#2a1a2a';
ctx.strokeStyle='#b597b5';
ctx.beginPath();
ctx.ellipse(0,0,this.size*0.2,this.size*0.1,0,0,Math.PI*2);
ctx.fill();
ctx.stroke();
ctx.restore();
}
ctx.shadowBlur=25;
ctx.strokeStyle='#bda8bd';
ctx.lineWidth=1.5;
ctx.beginPath();
ctx.moveTo(this.size*0.5,-this.size*0.1);
ctx.lineTo(this.size*0.9,0);
ctx.lineTo(this.size*0.5,this.size*0.1);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(-this.size*0.5,-this.size*0.1);
ctx.lineTo(-this.size*0.9,0);
ctx.lineTo(-this.size*0.5,this.size*0.1);
ctx.stroke();
if(this.health<this.maxHealth){
ctx.save();
ctx.rotate(-this.rotation);
ctx.translate(0,-this.size-15);
ctx.fillStyle='#2a1f2a';
ctx.fillRect(-this.size,0,this.size*2,4);
ctx.fillStyle='#cbb2cb';
ctx.fillRect(-this.size,0,(this.health/this.maxHealth)*this.size*2,4);
ctx.restore();
}
ctx.restore();
}
hit(dmg){
if(this.isDead)return false;
this.health-=dmg;
for(let i=0;i<6;i++)particles.push(new Particle(this.x,this.y,'#c9a6dc'));
if(this.health<=0){
this.isDead=true;
streak++;
for(let i=0;i<22;i++)particles.push(new Particle(this.x,this.y,i<8?'#e2c4f0':'#a577b5'));
const idx=enemies.indexOf(this);
if(idx>-1){
enemies.splice(idx,1);
if(this.type===3){
bossSpawned=false;
}
else{
let newEnemy=null;
if(this.type===0)newEnemy=new Enemy(0);
else if(this.type===1)newEnemy=new Enemy(1);
else if(this.type===2)newEnemy=new Enemy(2);
if(newEnemy)enemies.push(newEnemy);
}
}
return true;
}
return false;
}
}
function drawPlayer(){
player.glowPhase+=0.12;
player.warpRipple+=0.2;
ctx.save();
ctx.translate(player.x,player.y);
ctx.rotate(player.rotation);
let pulse=0.5+Math.sin(player.glowPhase)*0.2;
ctx.shadowBlur=55;
ctx.shadowColor='#a064c0';
ctx.strokeStyle='#e2b0ff';
ctx.lineWidth=2.5;
ctx.fillStyle='#1c1023';
ctx.beginPath();
ctx.moveTo(0,-player.size*1.3);
ctx.lineTo(player.size*0.8,-player.size*0.4);
ctx.lineTo(player.size*0.7,player.size*0.2);
ctx.lineTo(player.size*0.3,player.size*0.6);
ctx.lineTo(0,player.size*0.4);
ctx.lineTo(-player.size*0.3,player.size*0.6);
ctx.lineTo(-player.size*0.7,player.size*0.2);
ctx.lineTo(-player.size*0.8,-player.size*0.4);
ctx.closePath();
ctx.fill();
ctx.stroke();
ctx.shadowBlur=45;
ctx.strokeStyle='#f2d7ff';
ctx.lineWidth=2;
ctx.beginPath();
ctx.moveTo(player.size*0.3,player.size*0.6);
ctx.lineTo(player.size*0.6,player.size*0.9);
ctx.lineTo(0,player.size*0.7);
ctx.lineTo(-player.size*0.6,player.size*0.9);
ctx.lineTo(-player.size*0.3,player.size*0.6);
ctx.stroke();
ctx.shadowBlur=70;
ctx.fillStyle='#c59ce0';
ctx.beginPath();
ctx.arc(0,-player.size*0.4,player.size*0.25,0,Math.PI*2);
ctx.fill();
ctx.fillStyle='#f5ecff';
ctx.beginPath();
ctx.arc(0,-player.size*0.4,player.size*0.12,0,Math.PI*2);
ctx.fill();
for(let i=0;i<3;i++){
let angle=player.warpRipple+i*2.0;
ctx.shadowBlur=30;
ctx.fillStyle='#a070b0';
ctx.beginPath();
ctx.arc(Math.cos(angle)*player.size*0.5,Math.sin(angle)*player.size*0.2,3,0,Math.PI*2);
ctx.fill();
}
ctx.restore();
}
function createVoidMote(){
if(Math.random()>.3)return;
voidMotes.push({x:Math.random()*canvas.width,y:-20,speedX:Math.random()*0.8-0.4,speedY:0.4+Math.random()*0.8,rotation:Math.random()*Math.PI*2,rotationSpeed:Math.random()*.01-.005,size:3+Math.random()*6,life:1});
}
function autoAttack(){
let nearest=null,nd=Infinity;
for(const e of enemies){if(e.isDead)continue;const dx=e.x-player.x,dy=e.y-player.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<nd){nd=d;nearest=e}}
if(nearest){
player.rotation=Math.atan2(nearest.y-player.y,nearest.x-player.x)*0.4;
if(nd<650){
for(let i=0;i<2;i++){
let offsetX=(Math.random()-0.5)*12;
let offsetY=(Math.random()-0.5)*12;
let shard=new CrystalShard(player.x+offsetX,player.y+offsetY,nearest.x,nearest.y);
crystalShards.push(shard);
}
nearest.hit(20);
combo++;
health=Math.min(100,health+2);
}
}
}
function spawnInitialEnemies(){
enemies.push(new Enemy(0));
enemies.push(new Enemy(1));
enemies.push(new Enemy(2));
if(!bossSpawned){
enemies.push(new Enemy(3));
bossSpawned=true;
}
}
function update(){
player.velocity.x=0;player.velocity.y=0;
if(keys.w)player.velocity.y=-player.speed;
if(keys.s)player.velocity.y=player.speed;
if(keys.a)player.velocity.x=-player.speed;
if(keys.d)player.velocity.x=player.speed;
player.x=Math.min(canvas.width-player.size*.8,Math.max(player.size*.8,player.x+player.velocity.x));
player.y=Math.min(canvas.height-player.size*.8,Math.max(player.size*.8,player.y+player.velocity.y));
autoFireCooldown--;
if(autoFireCooldown<=0){autoAttack();autoFireCooldown=16}
for(const e of enemies)e.update();
for(let i=crystalShards.length-1;i>=0;i--){
crystalShards[i].update();
if(crystalShards[i].life<=0.1||crystalShards[i].age>40)crystalShards.splice(i,1);
}
for(let i=particles.length-1;i>=0;i--){particles[i].update();if(particles[i].life<=.01)particles.splice(i,1)}
for(let i=voidMotes.length-1;i>=0;i--){
const p=voidMotes[i];
p.x+=p.speedX;p.y+=p.speedY;p.rotation+=p.rotationSpeed;p.life-=.002;
if(p.y>canvas.height||p.life<=0)voidMotes.splice(i,1);
}
createVoidMote();
}
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
for(const p of voidMotes){
ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rotation);ctx.globalAlpha=p.life*0.4;
ctx.fillStyle='#6a4d7a';
ctx.beginPath();ctx.arc(0,0,p.size,0,Math.PI*2);ctx.fill();ctx.restore();
}
particles.forEach(p=>p.draw());
crystalShards.forEach(s=>s.draw());
enemies.forEach(e=>e.draw());
drawPlayer();
ctx.save();
ctx.font='bold 18px Cinzel';
ctx.fillStyle='#dcc2f0';
ctx.shadowBlur=20;
ctx.shadowColor='#7a4d9a';
ctx.fillText('⚡'+combo,30,50);
ctx.fillText('❤️'+health,30,90);
ctx.restore();
}
function animate(){update();draw();requestAnimationFrame(animate)}
function handleResize(){
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
player.x=Math.min(canvas.width-player.size*.8,Math.max(player.size*.8,player.x));
player.y=Math.min(canvas.height-player.size*.8,Math.max(player.size*.8,player.y));
}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=true;e.preventDefault()}});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=false;e.preventDefault()}});
window.addEventListener('resize',handleResize);
spawnInitialEnemies();
for(let i=0;i<25;i++)createVoidMote();
animate();
</script>
</body>
</html>
All done!
