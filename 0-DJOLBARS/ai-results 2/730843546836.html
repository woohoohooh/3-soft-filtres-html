<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEBULA SENTINEL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:'Cinzel',serif;background:#000;color:#fff;overflow:hidden;height:100vh;cursor:none}
#gameCanvas{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 80% 70%,#1a0933 0%,#03010a 40%,#000 80%);z-index:1;outline:none}
.nebula-lines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background-image:radial-gradient(circle at 30% 40%, rgba(100,50,200,0.1) 0px, transparent 20%), radial-gradient(circle at 70% 80%, rgba(50,150,200,0.1) 0px, transparent 30%)}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="gameCanvas" tabindex="0"></canvas>
<div class="nebula-lines"></div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
canvas.focus();
let combo=0,streak=0,health=100;
let particles=[],enemies=[],nebulaEnergy=[],crystalShards=[];
let autoFireCooldown=0;
const keys={w:false,a:false,s:false,d:false};
const player={x:canvas.width/2,y:canvas.height-100,size:38,rotation:0,velocity:{x:0,y:0},speed:5,coreGlow:0,wingBeat:0};
class Particle{
constructor(x,y,color){this.x=x;this.y=y;this.color=color;this.size=Math.random()*5+1;this.speedX=Math.random()*4-2;this.speedY=Math.random()*4-2;this.life=.8+Math.random()*.2;this.decay=.01+Math.random()*.02}
update(){this.x+=this.speedX;this.y+=this.speedY;this.life-=this.decay;this.size*=.97}
draw(){ctx.save();ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore()}
}
class CrystalShard{
constructor(x,y,targetX,targetY){
this.x=x;this.y=y;
this.targetX=targetX;this.targetY=targetY;
this.age=0;this.life=1;
this.trail=[];
for(let i=0;i<8;i++)this.trail.push({x:this.x,y:this.y});
}
update(){
this.age++;
if(this.age>24)this.life-=.05;
if(!enemies.length)return;
let closest=null,closestDist=Infinity;
for(let e of enemies){
if(e.isDead)continue;
let dx=e.x-this.x,dy=e.y-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d<closestDist){closestDist=d;closest=e;}
}
if(closest){
this.targetX=closest.x;
this.targetY=closest.y;
}
let dx=this.targetX-this.x;
let dy=this.targetY-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d>1){
this.x+=dx*0.28;
this.y+=dy*0.28;
}
this.trail.shift();
this.trail.push({x:this.x,y:this.y});
}
draw(){
ctx.save();
ctx.globalAlpha=this.life;
ctx.shadowBlur=40;
ctx.shadowColor='#b08eff';
ctx.strokeStyle='#dab0ff';
ctx.lineWidth=2.5;
ctx.beginPath();
ctx.moveTo(this.trail[0].x,this.trail[0].y);
for(let i=1;i<this.trail.length;i++)ctx.lineTo(this.trail[i].x,this.trail[i].y);
ctx.stroke();
ctx.shadowBlur=60;
ctx.lineWidth=1.5;
ctx.strokeStyle='#ffffff';
ctx.beginPath();
ctx.moveTo(this.trail[0].x,this.trail[0].y);
for(let i=1;i<this.trail.length;i++)ctx.lineTo(this.trail[i].x,this.trail[i].y);
ctx.stroke();
ctx.restore();
}
}
let bossSpawned=false;
class Enemy{
constructor(type){
this.type=type || Math.floor(Math.random()*4);
this.size=32;
this.speed=0.8;
this.health=48;
this.maxHealth=48;
this.rotation=Math.random()*Math.PI*2;
this.pulse=Math.random()*Math.PI*2;
this.hitCooldown=0;
this.isDead=false;
this.orbit=Math.random()*Math.PI*2;
this.segments=Math.floor(Math.random()*3)+3;
if(this.type===0){
this.size=28;
this.speed=0.75;
this.health=52;
this.maxHealth=52;
}
else if(this.type===1){
this.size=24;
this.speed=1.1;
this.health=40;
this.maxHealth=40;
}
else if(this.type===2){
this.size=38;
this.speed=0.65;
this.health=80;
this.maxHealth=80;
}
else if(this.type===3){
this.size=54;
this.speed=1.7;
this.health=200;
this.maxHealth=200;
this.segments=6;
bossSpawned=true;
}
const edge=Math.floor(Math.random()*4);
if(edge===0){this.x=-60;this.y=Math.random()*canvas.height}
else if(edge===1){this.x=canvas.width+60;this.y=Math.random()*canvas.height}
else if(edge===2){this.x=Math.random()*canvas.width;this.y=-60}
else{this.x=Math.random()*canvas.width;this.y=canvas.height+60}
}
update(){
if(this.isDead)return;
const dx=player.x-this.x,dy=player.y-this.y;
const d=Math.sqrt(dx*dx+dy*dy);
if(d>0){this.x+=(dx/d)*this.speed;this.y+=(dy/d)*this.speed}
this.rotation+=0.02;
this.pulse+=0.06;
this.orbit+=0.03;
if(this.hitCooldown>0)this.hitCooldown--;
if(d<player.size+this.size+15 && this.hitCooldown<=0){
health=Math.max(0,health-10);
streak=0;
this.hitCooldown=25;
}
}
draw(){
if(this.isDead)return;
ctx.save();
ctx.translate(this.x,this.y);
ctx.rotate(this.rotation);
ctx.shadowBlur=25;
ctx.shadowColor='#7040aa';
ctx.strokeStyle='#b89ee0';
ctx.lineWidth=2.2;
ctx.fillStyle='#1a1030';
ctx.beginPath();
ctx.ellipse(0,0,this.size*0.7,this.size*0.5,0,0,Math.PI*2);
ctx.fill();
ctx.stroke();
for(let i=0;i<this.segments;i++){
let angle=this.orbit + i*(Math.PI*2/this.segments);
let dist=this.size*0.9;
let x=Math.cos(angle)*dist;
let y=Math.sin(angle)*dist;
ctx.save();
ctx.translate(x,y);
ctx.rotate(angle);
ctx.shadowBlur=20;
ctx.fillStyle='#2a1b40';
ctx.strokeStyle='#b286d6';
ctx.beginPath();
ctx.ellipse(0,0,this.size*0.2,this.size*0.1,0,0,Math.PI*2);
ctx.fill();
ctx.stroke();
ctx.restore();
}
ctx.shadowBlur=30;
ctx.strokeStyle='#d6b0ff';
ctx.lineWidth=2;
ctx.beginPath();
ctx.moveTo(this.size*0.3,-this.size*0.4);
ctx.lineTo(this.size*0.8,-0);
ctx.lineTo(this.size*0.3,this.size*0.4);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(-this.size*0.3,-this.size*0.4);
ctx.lineTo(-this.size*0.8,-0);
ctx.lineTo(-this.size*0.3,this.size*0.4);
ctx.stroke();
if(this.health<this.maxHealth){
ctx.save();
ctx.rotate(-this.rotation);
ctx.translate(0,-this.size-10);
ctx.fillStyle='#221c30';
ctx.fillRect(-this.size,0,this.size*2,3);
ctx.fillStyle='#b28aff';
ctx.fillRect(-this.size,0,(this.health/this.maxHealth)*this.size*2,3);
ctx.restore();
}
ctx.restore();
}
hit(dmg){
if(this.isDead)return false;
this.health-=dmg;
for(let i=0;i<5;i++)particles.push(new Particle(this.x,this.y,'#c09aff'));
if(this.health<=0){
this.isDead=true;
streak++;
for(let i=0;i<18;i++)particles.push(new Particle(this.x,this.y,i<6?'#e6d0ff':'#b072ff'));
const idx=enemies.indexOf(this);
if(idx>-1){
enemies.splice(idx,1);
if(this.type===3){
bossSpawned=false;
}
else{
let newEnemy=null;
if(this.type===0)newEnemy=new Enemy(0);
else if(this.type===1)newEnemy=new Enemy(1);
else if(this.type===2)newEnemy=new Enemy(2);
if(newEnemy)enemies.push(newEnemy);
}
}
return true;
}
return false;
}
}
function drawPlayer(){
player.coreGlow+=0.12;
player.wingBeat+=0.2;
ctx.save();
ctx.translate(player.x,player.y);
ctx.rotate(player.rotation);
let pulseIntensity=0.6+Math.sin(player.coreGlow)*0.2;
ctx.shadowBlur=55;
ctx.shadowColor='#b266ff';
ctx.strokeStyle='#e6ccff';
ctx.lineWidth=3;
ctx.fillStyle='#0d0620';
ctx.beginPath();
ctx.moveTo(0,-player.size*1.2);
ctx.lineTo(player.size*0.8,-player.size*0.3);
ctx.lineTo(player.size*0.6,player.size*0.4);
ctx.lineTo(player.size*0.2,player.size*0.8);
ctx.lineTo(0,player.size*0.5);
ctx.lineTo(-player.size*0.2,player.size*0.8);
ctx.lineTo(-player.size*0.6,player.size*0.4);
ctx.lineTo(-player.size*0.8,-player.size*0.3);
ctx.closePath();
ctx.fill();
ctx.stroke();
ctx.shadowBlur=45;
ctx.strokeStyle='#ffffff';
ctx.lineWidth=2;
ctx.beginPath();
ctx.moveTo(player.size*0.2,player.size*0.8);
ctx.lineTo(player.size*0.5,player.size*1.2);
ctx.lineTo(0,player.size*0.9);
ctx.lineTo(-player.size*0.5,player.size*1.2);
ctx.lineTo(-player.size*0.2,player.size*0.8);
ctx.stroke();
ctx.shadowBlur=70;
ctx.fillStyle='#d9b0ff';
ctx.beginPath();
ctx.arc(0,-player.size*0.3,player.size*0.18,0,Math.PI*2);
ctx.fill();
ctx.fillStyle='#ffffff';
ctx.beginPath();
ctx.arc(0,-player.size*0.3,player.size*0.08,0,Math.PI*2);
ctx.fill();
ctx.restore();
}
function createNebulaEnergy(){
if(Math.random()>.3)return;
nebulaEnergy.push({x:Math.random()*canvas.width,y:canvas.height+20,speedX:Math.random()*0.8-0.4,speedY:-0.3-Math.random()*0.6,rotation:Math.random()*Math.PI*2,rotSpeed:Math.random()*0.01-0.005,size:8+Math.random()*12,life:0.7+Math.random()*0.3});
}
function autoAttack(){
let nearest=null,nd=Infinity;
for(const e of enemies){if(e.isDead)continue;const dx=e.x-player.x,dy=e.y-player.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<nd){nd=d;nearest=e}}
if(nearest){
player.rotation=Math.atan2(nearest.y-player.y,nearest.x-player.x)*0.4;
if(nd<650){
for(let i=0;i<2;i++){
let offX=(Math.random()-0.5)*12;
let offY=(Math.random()-0.5)*12;
let shard=new CrystalShard(player.x+offX,player.y+offY,nearest.x,nearest.y);
crystalShards.push(shard);
}
nearest.hit(19);
combo++;
health=Math.min(100,health+3);
}
}
}
function spawnInitialEnemies(){
enemies.push(new Enemy(0));
enemies.push(new Enemy(1));
enemies.push(new Enemy(2));
if(!bossSpawned){
enemies.push(new Enemy(3));
bossSpawned=true;
}
}
function update(){
player.velocity.x=0;player.velocity.y=0;
if(keys.w)player.velocity.y=-player.speed;
if(keys.s)player.velocity.y=player.speed;
if(keys.a)player.velocity.x=-player.speed;
if(keys.d)player.velocity.x=player.speed;
player.x=Math.min(canvas.width-player.size*.8,Math.max(player.size*.8,player.x+player.velocity.x));
player.y=Math.min(canvas.height-player.size*.8,Math.max(player.size*.8,player.y+player.velocity.y));
autoFireCooldown--;
if(autoFireCooldown<=0){autoAttack();autoFireCooldown=15}
for(const e of enemies)e.update();
for(let i=crystalShards.length-1;i>=0;i--){
crystalShards[i].update();
if(crystalShards[i].life<=0.1||crystalShards[i].age>40)crystalShards.splice(i,1);
}
for(let i=particles.length-1;i>=0;i--){particles[i].update();if(particles[i].life<=.01)particles.splice(i,1)}
for(let i=nebulaEnergy.length-1;i>=0;i--){
const n=nebulaEnergy[i];
n.x+=n.speedX;n.y+=n.speedY;n.rotation+=n.rotSpeed;n.life-=.003;
if(n.y<-50||n.life<=0)nebulaEnergy.splice(i,1);
}
createNebulaEnergy();
}
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
for(const n of nebulaEnergy){
ctx.save();ctx.translate(n.x,n.y);ctx.rotate(n.rotation);ctx.globalAlpha=n.life*0.25;
ctx.fillStyle='#a070e0';
ctx.beginPath();ctx.moveTo(0,-n.size);ctx.lineTo(n.size*0.7,n.size*0.5);ctx.lineTo(-n.size*0.7,n.size*0.5);ctx.closePath();ctx.fill();ctx.restore();
}
particles.forEach(p=>p.draw());
crystalShards.forEach(s=>s.draw());
enemies.forEach(e=>e.draw());
drawPlayer();
}
function animate(){update();draw();requestAnimationFrame(animate)}
function handleResize(){
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
player.x=Math.min(canvas.width-player.size*.8,Math.max(player.size*.8,player.x));
player.y=Math.min(canvas.height-player.size*.8,Math.max(player.size*.8,player.y));
}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=true;e.preventDefault()}});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=false;e.preventDefault()}});
window.addEventListener('resize',handleResize);
spawnInitialEnemies();
for(let i=0;i<25;i++)createNebulaEnergy();
animate();
</script>
</body>
</html>
All done!
