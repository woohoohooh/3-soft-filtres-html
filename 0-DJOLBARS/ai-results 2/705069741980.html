<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEBULA STALKER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:'Cinzel',serif;background:#000;color:#fff;overflow:hidden;height:100vh;cursor:none}
#gameCanvas{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 80% 20%,#1a0f1a 0%,#000 40%),repeating-linear-gradient(135deg,#0f0a0f 0px,#0f0a0f 1px,#000 1px,#000 4px);z-index:1;outline:none}
.depth-lines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background-image:repeating-linear-gradient(180deg,transparent 0px,transparent 3px,rgba(180,120,255,.03) 3px,rgba(180,120,255,.03) 5px)}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="gameCanvas" tabindex="0"></canvas>
<div class="depth-lines"></div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
canvas.focus();

let combo=0,streak=0,health=100;
let particles=[],enemies=[],nebulaDrift=[],playerBolts=[];
let autoFireCooldown=0;
const keys={w:false,a:false,s:false,d:false};

const player={x:canvas.width/2,y:canvas.height-150,size:38,rotation:0,velocity:{x:0,y:0},speed:5.5,glidePhase:0,wingOscillate:0};

class Particle{
constructor(x,y,color){this.x=x;this.y=y;this.color=color;this.size=Math.random()*5+3;this.speedX=Math.random()*4-2;this.speedY=Math.random()*4-2;this.life=.8+Math.random()*.2;this.decay=.015+Math.random()*.025}
update(){this.x+=this.speedX;this.y+=this.speedY;this.life-=this.decay;this.size*=.97}
draw(){ctx.save();ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore()}
}

class PlayerBolt{
constructor(x,y,targetX,targetY){
this.x=x;this.y=y;
this.targetX=targetX;this.targetY=targetY;
this.age=0;this.life=1;
this.trail=[];
for(let i=0;i<10;i++)this.trail.push({x:this.x,y:this.y});
}
update(){
this.age++;
if(this.age>30)this.life-=.05;
if(!enemies.length)return;
let closest=null,closestDist=Infinity;
for(let e of enemies){
if(e.isDead)continue;
let dx=e.x-this.x,dy=e.y-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d<closestDist){closestDist=d;closest=e;}
}
if(closest){
this.targetX=closest.x;
this.targetY=closest.y;
}
let dx=this.targetX-this.x;
let dy=this.targetY-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d>1){
this.x+=dx*0.4;
this.y+=dy*0.4;
}
this.trail.shift();
this.trail.push({x:this.x,y:this.y});
}
draw(){
ctx.save();
ctx.globalAlpha=this.life;
ctx.shadowBlur=30;
ctx.shadowColor='#c9f';
ctx.strokeStyle='#e2b0ff';
ctx.lineWidth=2.5;
ctx.beginPath();
ctx.moveTo(this.trail[0].x,this.trail[0].y);
for(let i=1;i<this.trail.length;i++)ctx.lineTo(this.trail[i].x,this.trail[i].y);
ctx.stroke();
ctx.shadowBlur=45;
ctx.lineWidth=1.5;
ctx.beginPath();
ctx.moveTo(this.trail[0].x,this.trail[0].y);
for(let i=1;i<this.trail.length;i++)ctx.lineTo(this.trail[i].x,this.trail[i].y);
ctx.strokeStyle='#ffe6ff';
ctx.stroke();
ctx.restore();
}
}

let bossSpawned=false;

class Enemy{
constructor(type){
this.type=type || Math.floor(Math.random()*4);
this.size=34;
this.speed=0.9;
this.health=45;
this.maxHealth=45;
this.rotation=Math.random()*Math.PI*2;
this.warpPhase=Math.random()*Math.PI*2;
this.hitCooldown=0;
this.isDead=false;
this.arcOffset=Math.random()*Math.PI*2;
this.shardCount=Math.floor(Math.random()*3)+3;

if(this.type===0){
this.size=28;
this.speed=0.75;
this.health=48;
this.maxHealth=48;
}
else if(this.type===1){
this.size=24;
this.speed=1.1;
this.health=35;
this.maxHealth=35;
}
else if(this.type===2){
this.size=42;
this.speed=0.65;
this.health=80;
this.maxHealth=80;
}
else if(this.type===3){
this.size=62;
this.speed=2.1;
this.health=210;
this.maxHealth=210;
this.shardCount=6;
bossSpawned=true;
}

const side=Math.floor(Math.random()*4);
if(side===0){this.x=Math.random()*canvas.width;this.y=-90}
if(side===1){this.x=-90;this.y=Math.random()*canvas.height*0.6}
if(side===2){this.x=canvas.width+90;this.y=Math.random()*canvas.height*0.6}
if(side===3){this.x=Math.random()*canvas.width;this.y=canvas.height+90}
}
update(){
if(this.isDead)return;
const dx=player.x-this.x,dy=player.y-this.y;
const d=Math.sqrt(dx*dx+dy*dy);
if(d>0){this.x+=(dx/d)*this.speed;this.y+=(dy/d)*this.speed}
this.rotation+=0.02;
this.warpPhase+=0.07;
this.arcOffset+=0.03;
if(this.hitCooldown>0)this.hitCooldown--;
if(d<player.size+this.size+15 && this.hitCooldown<=0){
health=Math.max(0,health-10);
streak=0;
this.hitCooldown=25;
}
}
draw(){
if(this.isDead)return;
ctx.save();
ctx.translate(this.x,this.y);
ctx.rotate(this.rotation);
ctx.shadowBlur=25;
ctx.shadowColor='rgba(200,100,255,0.4)';
ctx.strokeStyle='rgba(210,150,255,0.8)';
ctx.lineWidth=2.2;
ctx.fillStyle='rgba(20,8,30,0.9)';

ctx.beginPath();
ctx.ellipse(0,0,this.size*0.7,this.size*0.4,0,0,Math.PI*2);
ctx.fill();
ctx.stroke();

for(let i=0;i<this.shardCount;i++){
let angle=this.arcOffset + i*(Math.PI*2/this.shardCount);
let dist=this.size*0.85;
let x=Math.cos(angle)*dist;
let y=Math.sin(angle)*dist*0.5;
ctx.save();
ctx.translate(x,y);
ctx.rotate(angle);
ctx.shadowBlur=18;
ctx.fillStyle='rgba(40,12,55,0.8)';
ctx.strokeStyle='rgba(190,130,255,0.6)';
ctx.beginPath();
ctx.ellipse(0,0,this.size*0.18,this.size*0.12,0,0,Math.PI*2);
ctx.fill();
ctx.stroke();
ctx.restore();
}

ctx.shadowBlur=30;
ctx.strokeStyle='rgba(230,180,255,0.6)';
ctx.lineWidth=1.8;
ctx.beginPath();
ctx.moveTo(-this.size*0.3,-this.size*0.5);
ctx.lineTo(-this.size*0.7,-this.size*0.8);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(this.size*0.3,-this.size*0.5);
ctx.lineTo(this.size*0.7,-this.size*0.8);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(-this.size*0.2,this.size*0.3);
ctx.lineTo(-this.size*0.6,this.size*0.7);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(this.size*0.2,this.size*0.3);
ctx.lineTo(this.size*0.6,this.size*0.7);
ctx.stroke();

if(this.health<this.maxHealth){
ctx.save();
ctx.rotate(-this.rotation);
ctx.translate(0,-this.size-20);
ctx.fillStyle='rgba(25,10,35,.8)';
ctx.fillRect(-this.size,0,this.size*2,5);
ctx.fillStyle='rgba(220,150,255,.95)';
ctx.fillRect(-this.size,0,(this.health/this.maxHealth)*this.size*2,5);
ctx.restore();
}
ctx.restore();
}
hit(dmg){
if(this.isDead)return false;
this.health-=dmg;
for(let i=0;i<5;i++)particles.push(new Particle(this.x,this.y,'#d9b0ff'));
if(this.health<=0){
this.isDead=true;
streak++;
for(let i=0;i<18;i++)particles.push(new Particle(this.x,this.y,i<6?'#f0d0ff':'#b380ff'));
const idx=enemies.indexOf(this);
if(idx>-1){
enemies.splice(idx,1);
if(this.type===3){
bossSpawned=false;
}
else{
let newEnemy=null;
if(this.type===0)newEnemy=new Enemy(0);
else if(this.type===1)newEnemy=new Enemy(1);
else if(this.type===2)newEnemy=new Enemy(2);
if(newEnemy)enemies.push(newEnemy);
}
}
return true;
}
return false;
}
}

function drawPlayer(){
player.glidePhase+=0.08;
player.wingOscillate+=0.12;
ctx.save();
ctx.translate(player.x,player.y);
ctx.rotate(player.rotation);

let pulseWing=0.7+Math.sin(player.wingOscillate)*0.15;
ctx.shadowBlur=50;
ctx.shadowColor='rgba(200,130,255,0.8)';
ctx.strokeStyle='rgba(250,200,255,1)';
ctx.lineWidth=2.5;
ctx.fillStyle='rgba(15,5,25,0.9)';

ctx.beginPath();
ctx.moveTo(0,-player.size*1.2);
ctx.lineTo(player.size*0.8,-player.size*0.4);
ctx.lineTo(player.size*1.0,player.size*0.3);
ctx.lineTo(player.size*0.4,player.size*0.5);
ctx.lineTo(0,player.size*0.2);
ctx.lineTo(-player.size*0.4,player.size*0.5);
ctx.lineTo(-player.size*1.0,player.size*0.3);
ctx.lineTo(-player.size*0.8,-player.size*0.4);
ctx.closePath();
ctx.fill();
ctx.stroke();

ctx.shadowBlur=40;
ctx.strokeStyle='rgba(255,220,255,0.7)';
ctx.lineWidth=2;
ctx.beginPath();
ctx.moveTo(player.size*0.3,-player.size*0.1);
ctx.lineTo(player.size*0.9,player.size*0.1);
ctx.lineTo(player.size*0.5,player.size*0.4);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(-player.size*0.3,-player.size*0.1);
ctx.lineTo(-player.size*0.9,player.size*0.1);
ctx.lineTo(-player.size*0.5,player.size*0.4);
ctx.stroke();

ctx.shadowBlur=70;
ctx.fillStyle='rgba(240,180,255,0.8)';
ctx.beginPath();
ctx.arc(0,-player.size*0.5,player.size*0.25,0,Math.PI*2);
ctx.fill();
ctx.fillStyle='rgba(255,240,255,1)';
ctx.beginPath();
ctx.arc(0,-player.size*0.5,player.size*0.12,0,Math.PI*2);
ctx.fill();

ctx.restore();
}

function createNebulaDrift(){
if(Math.random()>0.15)return;
nebulaDrift.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,speedX:(Math.random()-0.5)*0.4,speedY:(Math.random()-0.5)*0.4,size:10+Math.random()*20,life:0.3+Math.random()*0.4});
}

function autoAttack(){
let nearest=null,nd=Infinity;
for(const e of enemies){if(e.isDead)continue;const dx=e.x-player.x,dy=e.y-player.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<nd){nd=d;nearest=e}}
if(nearest){
player.rotation=Math.atan2(nearest.y-player.y,nearest.x-player.x)*0.6;
if(nd<650){
for(let i=0;i<3;i++){
let offsetX=(Math.random()-0.5)*20;
let offsetY=(Math.random()-0.5)*20;
let bolt=new PlayerBolt(player.x+offsetX,player.y+offsetY,nearest.x,nearest.y);
playerBolts.push(bolt);
}
nearest.hit(18);
combo++;
health=Math.min(100,health+1.5);
}
}
}

function spawnInitialEnemies(){
enemies.push(new Enemy(0));
enemies.push(new Enemy(1));
enemies.push(new Enemy(2));
if(!bossSpawned){
enemies.push(new Enemy(3));
bossSpawned=true;
}
}

function update(){
player.velocity.x=0;player.velocity.y=0;
if(keys.w)player.velocity.y=-player.speed;
if(keys.s)player.velocity.y=player.speed;
if(keys.a)player.velocity.x=-player.speed;
if(keys.d)player.velocity.x=player.speed;
player.x=Math.min(canvas.width-player.size*1.2,Math.max(player.size*1.2,player.x+player.velocity.x));
player.y=Math.min(canvas.height-player.size*1.2,Math.max(player.size*1.2,player.y+player.velocity.y));
autoFireCooldown--;
if(autoFireCooldown<=0){autoAttack();autoFireCooldown=14}
for(const e of enemies)e.update();
for(let i=playerBolts.length-1;i>=0;i--){
playerBolts[i].update();
if(playerBolts[i].life<=0.1||playerBolts[i].age>48)playerBolts.splice(i,1);
}
for(let i=particles.length-1;i>=0;i--){particles[i].update();if(particles[i].life<=.01)particles.splice(i,1)}
for(let i=nebulaDrift.length-1;i>=0;i--){
const p=nebulaDrift[i];
p.x+=p.speedX;p.y+=p.speedY;p.life-=.002;
if(p.x<0||p.x>canvas.width||p.y<0||p.y>canvas.height||p.life<=0)nebulaDrift.splice(i,1);
}
createNebulaDrift();
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
for(const p of nebulaDrift){
ctx.save();
ctx.globalAlpha=p.life*0.3;
ctx.fillStyle='#9370db';
ctx.shadowBlur=40;
ctx.shadowColor='#b87aff';
ctx.beginPath();
ctx.arc(p.x,p.y,p.size*0.5,0,Math.PI*2);
ctx.fill();
ctx.restore();
}
particles.forEach(p=>p.draw());
playerBolts.forEach(b=>b.draw());
enemies.forEach(e=>e.draw());
drawPlayer();
}

function animate(){update();draw();requestAnimationFrame(animate)}

function handleResize(){
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
player.x=Math.min(canvas.width-player.size*1.2,Math.max(player.size*1.2,player.x));
player.y=Math.min(canvas.height-player.size*1.2,Math.max(player.size*1.2,player.y));
}

window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=true;e.preventDefault()}});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=false;e.preventDefault()}});
window.addEventListener('resize',handleResize);

spawnInitialEnemies();
for(let i=0;i<20;i++)createNebulaDrift();

animate();
</script>
</body>
</html>
All done!
