<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLARIS ECLIPSE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:'Cinzel',serif;background:#000;color:#fff;overflow:hidden;height:100vh;cursor:none}
#gameCanvas{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 80% 20%,#1a0f0f 0%,#000 40%),repeating-linear-gradient(135deg,#0f0a0a 0px,#0f0a0a 1px,#000 1px,#000 4px);z-index:1;outline:none}
.depth-lines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background-image:repeating-linear-gradient(45deg,transparent 0px,transparent 2px,rgba(180,100,100,.02) 2px,rgba(180,100,100,.02) 4px)}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="gameCanvas" tabindex="0"></canvas>
<div class="depth-lines"></div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
canvas.focus();

let combo=0,streak=0,health=100;
let particles=[],enemies=[],energyRunes=[],playerShards=[];
let autoFireCooldown=0;
const keys={w:false,a:false,s:false,d:false};

const player={x:canvas.width/2,y:canvas.height-100,size:38,rotation:0,velocity:{x:0,y:0},speed:5,coreGlow:0,wingBeat:0};

class Particle{
constructor(x,y,color){this.x=x;this.y=y;this.color=color;this.size=Math.random()*5+2;this.speedX=Math.random()*4-2;this.speedY=Math.random()*4-2;this.life=.8+Math.random()*.2;this.decay=.015+Math.random()*.025}
update(){this.x+=this.speedX;this.y+=this.speedY;this.life-=this.decay;this.size*=.97}
draw(){ctx.save();ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore()}
}

class PlayerShard{
constructor(x,y,targetX,targetY){
this.x=x;this.y=y;
this.targetX=targetX;this.targetY=targetY;
this.age=0;this.life=1;
this.trail=[];
for(let i=0;i<8;i++)this.trail.push({x:this.x,y:this.y});
}
update(){
this.age++;
if(this.age>22)this.life-=.07;
if(!enemies.length)return;
let closest=null,closestDist=Infinity;
for(let e of enemies){
if(e.isDead)continue;
let dx=e.x-this.x,dy=e.y-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d<closestDist){closestDist=d;closest=e;}
}
if(closest){
this.targetX=closest.x;
this.targetY=closest.y;
}
let dx=this.targetX-this.x;
let dy=this.targetY-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d>1){
this.x+=dx*0.28;
this.y+=dy*0.28;
}
this.trail.shift();
this.trail.push({x:this.x,y:this.y});
}
draw(){
ctx.save();
ctx.globalAlpha=this.life*0.9;
ctx.shadowBlur=40;
ctx.shadowColor='#ffaa66';
ctx.strokeStyle='#ffcc99';
ctx.lineWidth=2.5;
ctx.beginPath();
ctx.moveTo(this.trail[0].x,this.trail[0].y);
for(let i=1;i<this.trail.length;i++)ctx.lineTo(this.trail[i].x,this.trail[i].y);
ctx.stroke();
ctx.shadowBlur=60;
ctx.lineWidth=1.5;
ctx.beginPath();
ctx.moveTo(this.trail[0].x,this.trail[0].y);
for(let i=1;i<this.trail.length;i++)ctx.lineTo(this.trail[i].x,this.trail[i].y);
ctx.stroke();
ctx.restore();
}
}

let bossSpawned=false;

class Enemy{
constructor(type){
this.type=type || Math.floor(Math.random()*4);
this.size=32;
this.speed=0.9;
this.health=42;
this.maxHealth=42;
this.rotation=Math.random()*Math.PI*2;
this.pulse=Math.random()*Math.PI*2;
this.hitTimer=0;
this.isDead=false;
this.spinAngle=Math.random()*Math.PI*2;
this.segments=Math.floor(Math.random()*3)+3;

if(this.type===0){
this.size=28;
this.speed=0.75;
this.health=48;
this.maxHealth=48;
}
else if(this.type===1){
this.size=24;
this.speed=1.1;
this.health=35;
this.maxHealth=35;
}
else if(this.type===2){
this.size=38;
this.speed=0.65;
this.health=70;
this.maxHealth=70;
}
else if(this.type===3){
this.size=54;
this.speed=1.8;
this.health=180;
this.maxHealth=180;
this.segments=7;
bossSpawned=true;
}

const edge=Math.floor(Math.random()*4);
if(edge===0){this.x=Math.random()*canvas.width;this.y=-70}
if(edge===1){this.x=-70;this.y=Math.random()*canvas.height*0.6}
if(edge===2){this.x=canvas.width+70;this.y=Math.random()*canvas.height*0.6}
if(edge===3){this.x=Math.random()*canvas.width;this.y=canvas.height+70}
}
update(){
if(this.isDead)return;
const dx=player.x-this.x,dy=player.y-this.y;
const dist=Math.sqrt(dx*dx+dy*dy);
if(dist>0){this.x+=(dx/dist)*this.speed;this.y+=(dy/dist)*this.speed}
this.rotation+=0.02;
this.pulse+=0.07;
this.spinAngle+=0.03;
if(this.hitTimer>0)this.hitTimer--;
if(dist<player.size+this.size+18 && this.hitTimer<=0){
health=Math.max(0,health-7);
streak=0;
this.hitTimer=25;
}
}
draw(){
if(this.isDead)return;
ctx.save();
ctx.translate(this.x,this.y);
ctx.rotate(this.rotation);
ctx.shadowBlur=18;
ctx.shadowColor='rgba(200,120,80,0.5)';
ctx.strokeStyle='rgba(240,160,120,0.7)';
ctx.lineWidth=2.2;
ctx.fillStyle='rgba(25,15,10,0.9)';

ctx.beginPath();
ctx.arc(0,0,this.size*0.55,0,Math.PI*2);
ctx.fill();
ctx.stroke();

for(let i=0;i<this.segments;i++){
let angle=this.spinAngle + i*(Math.PI*2/this.segments);
let dist=this.size*0.75;
let x=Math.cos(angle)*dist;
let y=Math.sin(angle)*dist;
ctx.save();
ctx.translate(x,y);
ctx.rotate(angle);
ctx.shadowBlur=12;
ctx.fillStyle='rgba(40,20,10,0.8)';
ctx.strokeStyle='rgba(220,140,100,0.6)';
ctx.beginPath();
ctx.ellipse(0,0,this.size*0.18,this.size*0.09,0,0,Math.PI*2);
ctx.fill();
ctx.stroke();
ctx.restore();
}

ctx.shadowBlur=20;
ctx.strokeStyle='rgba(255,180,120,0.5)';
ctx.lineWidth=1.8;
ctx.beginPath();
ctx.moveTo(this.size*0.5,-this.size*0.15);
ctx.lineTo(this.size*1.0,0);
ctx.lineTo(this.size*0.5,this.size*0.15);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(-this.size*0.5,-this.size*0.15);
ctx.lineTo(-this.size*1.0,0);
ctx.lineTo(-this.size*0.5,this.size*0.15);
ctx.stroke();

if(this.health<this.maxHealth){
ctx.save();
ctx.rotate(-this.rotation);
ctx.translate(0,-this.size-12);
ctx.fillStyle='rgba(30,20,10,.7)';
ctx.fillRect(-this.size,0,this.size*2,4);
ctx.fillStyle='rgba(255,180,100,.9)';
ctx.fillRect(-this.size,0,(this.health/this.maxHealth)*this.size*2,4);
ctx.restore();
}
ctx.restore();
}
hit(dmg){
if(this.isDead)return false;
this.health-=dmg;
for(let i=0;i<5;i++)particles.push(new Particle(this.x,this.y,'#fcb'));
if(this.health<=0){
this.isDead=true;
streak++;
for(let i=0;i<18;i++)particles.push(new Particle(this.x,this.y,i<6?'#fda':'#ca8'));
const idx=enemies.indexOf(this);
if(idx>-1){
enemies.splice(idx,1);
if(this.type===3){
bossSpawned=false;
}
else{
let newEnemy=null;
if(this.type===0)newEnemy=new Enemy(0);
else if(this.type===1)newEnemy=new Enemy(1);
else if(this.type===2)newEnemy=new Enemy(2);
if(newEnemy)enemies.push(newEnemy);
}
}
return true;
}
return false;
}
}

function drawPlayer(){
player.coreGlow+=0.12;
player.wingBeat+=0.2;
ctx.save();
ctx.translate(player.x,player.y);
ctx.rotate(player.rotation);

let pulseWing=0.4+Math.sin(player.wingBeat)*0.15;
ctx.shadowBlur=55;
ctx.shadowColor='rgba(255,160,80,0.9)';
ctx.strokeStyle='rgba(255,200,150,1)';
ctx.lineWidth=3;
ctx.fillStyle='rgba(20,12,8,0.9)';

ctx.beginPath();
ctx.moveTo(0,-player.size*1.2);
ctx.lineTo(player.size*0.8,-player.size*0.3);
ctx.lineTo(player.size*1.2,player.size*0.2);
ctx.lineTo(player.size*0.6,player.size*0.5);
ctx.lineTo(player.size*0.3,player.size*0.8);
ctx.lineTo(0,player.size*0.6);
ctx.lineTo(-player.size*0.3,player.size*0.8);
ctx.lineTo(-player.size*0.6,player.size*0.5);
ctx.lineTo(-player.size*1.2,player.size*0.2);
ctx.lineTo(-player.size*0.8,-player.size*0.3);
ctx.closePath();
ctx.fill();
ctx.stroke();

ctx.shadowBlur=40;
ctx.strokeStyle='rgba(255,140,100,0.8)';
ctx.lineWidth=2;
ctx.beginPath();
ctx.moveTo(player.size*0.3,player.size*0.8);
ctx.lineTo(player.size*0.7,player.size*1.1);
ctx.lineTo(0,player.size*0.9);
ctx.lineTo(-player.size*0.7,player.size*1.1);
ctx.lineTo(-player.size*0.3,player.size*0.8);
ctx.stroke();

ctx.shadowBlur=70;
ctx.fillStyle='rgba(255,200,120,0.8)';
ctx.beginPath();
ctx.arc(0,-player.size*0.25,player.size*0.25,0,Math.PI*2);
ctx.fill();
ctx.fillStyle='rgba(255,240,200,1)';
ctx.beginPath();
ctx.arc(0,-player.size*0.25,player.size*0.12,0,Math.PI*2);
ctx.fill();
ctx.restore();
}

function createEnergyRune(){
if(Math.random()>.3)return;
energyRunes.push({x:Math.random()*canvas.width,y:-15,speedX:Math.random()*0.8-0.4,speedY:0.4+Math.random()*1.2,rot:Math.random()*Math.PI*2,rotSpeed:Math.random()*0.03-0.015,size:4+Math.random()*10,life:1});
}

function autoAttack(){
let closest=null,minDist=Infinity;
for(const e of enemies){if(e.isDead)continue;const dx=e.x-player.x,dy=e.y-player.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<minDist){minDist=d;closest=e}}
if(closest){
player.rotation=Math.atan2(closest.y-player.y,closest.x-player.x)*0.5;
if(minDist<650){
for(let i=0;i<2;i++){
let offX=(Math.random()-0.5)*12;
let offY=(Math.random()-0.5)*12;
let shard=new PlayerShard(player.x+offX,player.y+offY,closest.x,closest.y);
playerShards.push(shard);
}
closest.hit(18);
combo++;
health=Math.min(100,health+2);
}
}
}

function spawnInitialEnemies(){
enemies.push(new Enemy(0));
enemies.push(new Enemy(1));
enemies.push(new Enemy(2));
if(!bossSpawned){
enemies.push(new Enemy(3));
bossSpawned=true;
}
}

function update(){
player.velocity.x=0;player.velocity.y=0;
if(keys.w)player.velocity.y=-player.speed;
if(keys.s)player.velocity.y=player.speed;
if(keys.a)player.velocity.x=-player.speed;
if(keys.d)player.velocity.x=player.speed;
player.x=Math.min(canvas.width-player.size*.9,Math.max(player.size*.9,player.x+player.velocity.x));
player.y=Math.min(canvas.height-player.size*.9,Math.max(player.size*.9,player.y+player.velocity.y));
autoFireCooldown--;
if(autoFireCooldown<=0){autoAttack();autoFireCooldown=14}
for(const e of enemies)e.update();
for(let i=playerShards.length-1;i>=0;i--){
playerShards[i].update();
if(playerShards[i].life<=0.1||playerShards[i].age>38)playerShards.splice(i,1);
}
for(let i=particles.length-1;i>=0;i--){particles[i].update();if(particles[i].life<=.01)particles.splice(i,1)}
for(let i=energyRunes.length-1;i>=0;i--){
const r=energyRunes[i];
r.x+=r.speedX;r.y+=r.speedY;r.rot+=r.rotSpeed;r.life-=.003;
if(r.y>canvas.height||r.life<=0)energyRunes.splice(i,1);
}
createEnergyRune();
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
for(const r of energyRunes){
ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.rot);ctx.globalAlpha=r.life*0.3;
ctx.fillStyle='rgba(255,180,100,.2)';
ctx.beginPath();ctx.moveTo(0,-r.size);ctx.lineTo(r.size*0.9,r.size*0.5);ctx.lineTo(-r.size*0.9,r.size*0.5);ctx.closePath();ctx.fill();ctx.restore();
}
particles.forEach(p=>p.draw());
playerShards.forEach(s=>s.draw());
enemies.forEach(e=>e.draw());
drawPlayer();
}

function animate(){update();draw();requestAnimationFrame(animate)}

function handleResize(){
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
player.x=Math.min(canvas.width-player.size*.9,Math.max(player.size*.9,player.x));
player.y=Math.min(canvas.height-player.size*.9,Math.max(player.size*.9,player.y));
}

window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=true;e.preventDefault()}});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=false;e.preventDefault()}});
window.addEventListener('resize',handleResize);

spawnInitialEnemies();
for(let i=0;i<25;i++)createEnergyRune();

animate();
</script>
</body>
</html>
All done!
