<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEBULA REAPER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:'Cinzel',serif;background:#000;color:#fff;overflow:hidden;height:100vh;cursor:none}
#gameCanvas{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 80% 70%,#1a0f1a 0%,#000 40%),repeating-linear-gradient(135deg,#0f0a0f 0px,#0f0a0f 1px,#000 1px,#000 3px);z-index:1;outline:none}
.depth-lines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background-image:repeating-linear-gradient(45deg,transparent 0px,transparent 2px,rgba(180,100,200,.03) 2px,rgba(180,100,200,.03) 4px)}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="gameCanvas" tabindex="0"></canvas>
<div class="depth-lines"></div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
canvas.focus();

let combo=0,streak=0,health=100;
let particles=[],enemies=[],nebulaMotes=[],soulBolts=[];
let autoFireCooldown=0;
const keys={w:false,a:false,s:false,d:false};

const player={x:canvas.width/2,y:canvas.height-100,size:38,rotation:0,velocity:{x:0,y:0},speed:5,coreGlow:0,tendrilWave:0};

class Particle{
constructor(x,y,color){this.x=x;this.y=y;this.color=color;this.size=Math.random()*8+3;this.speedX=Math.random()*6-3;this.speedY=Math.random()*6-3;this.life=.8+Math.random()*.2;this.decay=.01+Math.random()*.02}
update(){this.x+=this.speedX;this.y+=this.speedY;this.life-=this.decay;this.size*=.97}
draw(){ctx.save();ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore()}
}

class SoulBolt{
constructor(x,y,targetX,targetY){
this.x=x;this.y=y;
this.targetX=targetX;this.targetY=targetY;
this.age=0;this.life=1;
this.chain=[];
for(let i=0;i<10;i++)this.chain.push({x:this.x,y:this.y});
}
update(){
this.age++;
if(this.age>24)this.life-=.05;
if(!enemies.length)return;
let closest=null,closestDist=Infinity;
for(let e of enemies){
if(e.isDead)continue;
let dx=e.x-this.x,dy=e.y-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d<closestDist){closestDist=d;closest=e;}
}
if(closest){
this.targetX=closest.x;
this.targetY=closest.y;
}
let dx=this.targetX-this.x;
let dy=this.targetY-this.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d>1){
this.x+=dx*0.28;
this.y+=dy*0.28;
}
this.chain.shift();
this.chain.push({x:this.x,y:this.y});
}
draw(){
ctx.save();
ctx.globalAlpha=this.life;
ctx.shadowBlur=40;
ctx.shadowColor='#c9f';
ctx.strokeStyle='#e9b';
ctx.lineWidth=3.5;
ctx.beginPath();
ctx.moveTo(this.chain[0].x,this.chain[0].y);
for(let i=1;i<this.chain.length;i++)ctx.lineTo(this.chain[i].x,this.chain[i].y);
ctx.stroke();
ctx.shadowBlur=60;
ctx.lineWidth=2;
ctx.strokeStyle='#ffd';
ctx.beginPath();
ctx.moveTo(this.chain[0].x,this.chain[0].y);
for(let i=1;i<this.chain.length;i++)ctx.lineTo(this.chain[i].x,this.chain[i].y);
ctx.stroke();
ctx.restore();
}
}

let bossSpawned=false;

class Enemy{
constructor(type){
this.type=type || Math.floor(Math.random()*4);
this.size=36;
this.speed=0.9;
this.health=50;
this.maxHealth=50;
this.rotation=Math.random()*Math.PI*2;
this.pulse=Math.random()*Math.PI*2;
this.hitTimer=0;
this.isDead=false;
this.spin=Math.random()*Math.PI*2;
this.orbCount=Math.floor(Math.random()*4)+2;

if(this.type===0){
this.size=32;
this.speed=0.8;
this.health=55;
this.maxHealth=55;
}
else if(this.type===1){
this.size=28;
this.speed=1.1;
this.health=40;
this.maxHealth=40;
}
else if(this.type===2){
this.size=44;
this.speed=0.7;
this.health=80;
this.maxHealth=80;
}
else if(this.type===3){
this.size=62;
this.speed=2.0;
this.health=200;
this.maxHealth=200;
this.orbCount=7;
bossSpawned=true;
}

const edge=Math.floor(Math.random()*3);
if(edge===0){this.x=Math.random()*canvas.width;this.y=-70}
if(edge===1){this.x=-70;this.y=Math.random()*canvas.height*0.7}
if(edge===2){this.x=canvas.width+70;this.y=Math.random()*canvas.height*0.7}
}
update(){
if(this.isDead)return;
const dx=player.x-this.x,dy=player.y-this.y;
const d=Math.sqrt(dx*dx+dy*dy);
if(d>0){this.x+=(dx/d)*this.speed;this.y+=(dy/d)*this.speed}
this.rotation+=0.02;
this.pulse+=0.07;
this.spin+=0.025;
if(this.hitTimer>0)this.hitTimer--;
if(d<player.size+this.size+15 && this.hitTimer<=0){
health=Math.max(0,health-10);
streak=0;
this.hitTimer=25;
}
}
draw(){
if(this.isDead)return;
ctx.save();
ctx.translate(this.x,this.y);
ctx.rotate(this.rotation);
ctx.shadowBlur=25;
ctx.shadowColor='rgba(160,80,180,0.6)';
ctx.strokeStyle='rgba(200,130,230,0.7)';
ctx.lineWidth=2.2;
ctx.fillStyle='rgba(25,10,30,0.9)';

ctx.beginPath();
ctx.ellipse(0,0,this.size*0.7,this.size*0.5,0,0,Math.PI*2);
ctx.fill();
ctx.stroke();

for(let i=0;i<this.orbCount;i++){
let angle=this.spin + i*(Math.PI*2/this.orbCount);
let dist=this.size*0.9;
let x=Math.cos(angle)*dist;
let y=Math.sin(angle)*dist*0.7;
ctx.save();
ctx.translate(x,y);
ctx.rotate(angle);
ctx.shadowBlur=20;
ctx.fillStyle='rgba(45,15,55,0.8)';
ctx.strokeStyle='rgba(210,150,240,0.6)';
ctx.beginPath();
ctx.arc(0,0,this.size*0.18,0,Math.PI*2);
ctx.fill();
ctx.stroke();
ctx.restore();
}

ctx.shadowBlur=30;
ctx.strokeStyle='rgba(230,170,255,0.5)';
ctx.lineWidth=1.8;
ctx.beginPath();
ctx.moveTo(this.size*0.5,-this.size*0.3);
ctx.lineTo(this.size*0.8,0);
ctx.lineTo(this.size*0.5,this.size*0.3);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(-this.size*0.5,-this.size*0.3);
ctx.lineTo(-this.size*0.8,0);
ctx.lineTo(-this.size*0.5,this.size*0.3);
ctx.stroke();

if(this.health<this.maxHealth){
ctx.save();
ctx.rotate(-this.rotation);
ctx.translate(0,-this.size-18);
ctx.fillStyle='rgba(35,10,40,.7)';
ctx.fillRect(-this.size,0,this.size*2,5);
ctx.fillStyle='rgba(210,120,240,.9)';
ctx.fillRect(-this.size,0,(this.health/this.maxHealth)*this.size*2,5);
ctx.restore();
}
ctx.restore();
}
hit(dmg){
if(this.isDead)return false;
this.health-=dmg;
for(let i=0;i<5;i++)particles.push(new Particle(this.x,this.y,'#dbf'));
if(this.health<=0){
this.isDead=true;
streak++;
for(let i=0;i<20;i++)particles.push(new Particle(this.x,this.y,i<10?'#eaf':'#b7e'));
const idx=enemies.indexOf(this);
if(idx>-1){
enemies.splice(idx,1);
if(this.type===3){
bossSpawned=false;
}
else{
let newEnemy=null;
if(this.type===0)newEnemy=new Enemy(0);
else if(this.type===1)newEnemy=new Enemy(1);
else if(this.type===2)newEnemy=new Enemy(2);
if(newEnemy)enemies.push(newEnemy);
}
}
return true;
}
return false;
}
}

function drawPlayer(){
player.coreGlow+=0.15;
player.tendrilWave+=0.2;
ctx.save();
ctx.translate(player.x,player.y);
ctx.rotate(player.rotation);

let pulseIntensity=0.5+Math.sin(player.coreGlow)*0.3;
ctx.shadowBlur=55;
ctx.shadowColor='rgba(200,100,255,0.8)';
ctx.strokeStyle='rgba(250,180,255,1)';
ctx.lineWidth=3.2;
ctx.fillStyle='rgba(20,5,30,0.8)';

ctx.beginPath();
ctx.moveTo(0,-player.size*1.2);
ctx.lineTo(player.size*0.7,-player.size*0.3);
ctx.lineTo(player.size*0.9,player.size*0.4);
ctx.lineTo(player.size*0.3,player.size*0.8);
ctx.lineTo(0,player.size*0.6);
ctx.lineTo(-player.size*0.3,player.size*0.8);
ctx.lineTo(-player.size*0.9,player.size*0.4);
ctx.lineTo(-player.size*0.7,-player.size*0.3);
ctx.closePath();
ctx.fill();
ctx.stroke();

ctx.shadowBlur=45;
ctx.strokeStyle='rgba(255,200,255,0.8)';
ctx.lineWidth=2.2;
ctx.beginPath();
ctx.moveTo(player.size*0.4,player.size*0.6);
ctx.lineTo(player.size*0.7,player.size*1.0);
ctx.lineTo(0,player.size*0.8);
ctx.lineTo(-player.size*0.7,player.size*1.0);
ctx.lineTo(-player.size*0.4,player.size*0.6);
ctx.stroke();

ctx.shadowBlur=70;
ctx.fillStyle='rgba(240,150,255,0.7)';
ctx.beginPath();
ctx.ellipse(0,-player.size*0.35,player.size*0.2,player.size*0.1,0,0,Math.PI*2);
ctx.fill();
ctx.fillStyle='rgba(255,220,255,1)';
ctx.beginPath();
ctx.ellipse(0,-player.size*0.35,player.size*0.1,player.size*0.05,0,0,Math.PI*2);
ctx.fill();
ctx.restore();
}

function createNebulaMote(){
if(Math.random()>.25)return;
nebulaMotes.push({x:Math.random()*canvas.width,y:-15,speedX:Math.random()*1.2-0.6,speedY:0.4+Math.random()*1.2,spin:Math.random()*Math.PI*2,spinSpeed:Math.random()*.03-.015,size:7+Math.random()*12,life:1});
}

function autoAttack(){
let nearest=null,nd=Infinity;
for(const e of enemies){if(e.isDead)continue;const dx=e.x-player.x,dy=e.y-player.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<nd){nd=d;nearest=e}}
if(nearest){
player.rotation=Math.atan2(nearest.y-player.y,nearest.x-player.x)*0.5;
if(nd<650){
for(let i=0;i<2;i++){
let offsetX=(Math.random()-0.5)*18;
let offsetY=(Math.random()-0.5)*18;
let bolt=new SoulBolt(player.x+offsetX,player.y+offsetY,nearest.x,nearest.y);
soulBolts.push(bolt);
}
nearest.hit(18);
combo++;
health=Math.min(100,health+3);
}
}
}

function spawnInitialEnemies(){
enemies.push(new Enemy(0));
enemies.push(new Enemy(1));
enemies.push(new Enemy(2));
if(!bossSpawned){
enemies.push(new Enemy(3));
bossSpawned=true;
}
}

function update(){
player.velocity.x=0;player.velocity.y=0;
if(keys.w)player.velocity.y=-player.speed;
if(keys.s)player.velocity.y=player.speed;
if(keys.a)player.velocity.x=-player.speed;
if(keys.d)player.velocity.x=player.speed;
player.x=Math.min(canvas.width-player.size*.8,Math.max(player.size*.8,player.x+player.velocity.x));
player.y=Math.min(canvas.height-player.size*.8,Math.max(player.size*.8,player.y+player.velocity.y));
autoFireCooldown--;
if(autoFireCooldown<=0){autoAttack();autoFireCooldown=15}
for(const e of enemies)e.update();
for(let i=soulBolts.length-1;i>=0;i--){
soulBolts[i].update();
if(soulBolts[i].life<=0.1||soulBolts[i].age>40)soulBolts.splice(i,1);
}
for(let i=particles.length-1;i>=0;i--){particles[i].update();if(particles[i].life<=.01)particles.splice(i,1)}
for(let i=nebulaMotes.length-1;i>=0;i--){
const m=nebulaMotes[i];
m.x+=m.speedX;m.y+=m.speedY;m.spin+=m.spinSpeed;m.life-=.003;
if(m.y>canvas.height||m.life<=0)nebulaMotes.splice(i,1);
}
createNebulaMote();
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
for(const m of nebulaMotes){
ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.spin);ctx.globalAlpha=m.life*.3;
ctx.fillStyle='rgba(180,100,200,.1)';
ctx.beginPath();ctx.arc(0,0,m.size,0,Math.PI*2);ctx.fill();
ctx.restore();
}
particles.forEach(p=>p.draw());
soulBolts.forEach(b=>b.draw());
enemies.forEach(e=>e.draw());
drawPlayer();
}

function animate(){update();draw();requestAnimationFrame(animate)}

function handleResize(){
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
player.x=Math.min(canvas.width-player.size*.8,Math.max(player.size*.8,player.x));
player.y=Math.min(canvas.height-player.size*.8,Math.max(player.size*.8,player.y));
}

window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=true;e.preventDefault()}});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(keys[k]!==undefined){keys[k]=false;e.preventDefault()}});
window.addEventListener('resize',handleResize);

spawnInitialEnemies();
for(let i=0;i<30;i++)createNebulaMote();

animate();
</script>
</body>
</html>
All done!
